<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RARU NEXUS LITE - 4 FUNÇÕES</title><script src="https://cdn.tailwindcss.com"></script><style>body{background:#02040a;color:#fff;font-family:sans-serif}.glass{background:rgba(10,26,51,.9);backdrop-filter:blur(12px);border:1px solid rgba(0,242,254,.25);border-radius:20px}</style></head><body class="min-h-screen p-3 max-w-[420px] mx-auto">
<div class="text-center py-3"><h1 class="text-cyan-400 font-black text-lg tracking-widest">RARU NEXUS LITE</h1><p class="text-[11px] text-gray-400">4 FUNÇÕES • PRÁTICO • FINAL</p></div>

<!-- CANVAS SARA PISCANDO -->
<canvas id="sara" width="400" height="320" class="w-full h-[200px] bg-black rounded-[20px] border border-cyan-400/30"></canvas>
<div class="flex gap-2 mt-2"><input id="txt" value="Pronto mestre, app prático finalizado com 4 funções modernas." class="flex-1 bg-black border border-cyan-400/30 rounded-xl px-3 py-2 text-xs"><button onclick="falar()" class="bg-cyan-400 text-black font-black px-4 rounded-xl text-xs">FALAR</button></div>

<!-- 4 FUNÇÕES -->
<div class="grid grid-cols-2 gap-3 mt-4">
<!-- 1 RADAR -->
<div class="glass p-3"><p class="text-cyan-400 font-bold text-xs">📡 1 RADAR CLIMA</p><p id="temp" class="text-2xl font-black mt-1">27.5°C</p><p id="chuva" class="text-[10px] text-gray-400">1.2 mm/h • 78% • BAIXO</p><button onclick="atualizarClima()" class="mt-2 w-full bg-white/10 rounded-lg py-1 text-[10px]">Atualizar Telemetria</button></div>
<!-- 2 ALARME -->
<div class="glass p-3"><p class="text-yellow-400 font-bold text-xs">🚨 2 ALARME TÁTICO</p><div class="grid grid-cols-2 gap-1 mt-2"><button onclick="alarme('br')" class="bg-yellow-600 text-black font-bold text-[10px] py-2 rounded">BR</button><button onclick="alarme('ru')" class="bg-rose-600 text-white font-bold text-[10px] py-2 rounded">RUSSO</button></div><button onclick="pararAlarme()" class="mt-1 w-full bg-zinc-800 text-[10px] py-1 rounded">Parar</button></div>
<!-- 3 SARA CHAT -->
<div class="glass p-3"><p class="text-teal-400 font-bold text-xs">💬 3 SARA CHAT</p><div id="chat" class="bg-black/50 h-20 overflow-y-auto rounded mt-1 p-2 text-[10px]"></div><div class="flex gap-1 mt-1"><input id="chatIn" placeholder="Pergunte..." class="flex-1 bg-black border border-gray-700 rounded px-2 py-1 text-[10px]"><button onclick="enviarChat()" class="bg-teal-400 text-black px-2 rounded font-bold text-[10px]">></button></div></div>
<!-- 4 MUNICIPIOS -->
<div class="glass p-3"><p class="text-orange-400 font-bold text-xs">🏙️ 4 MUNICÍPIOS</p><select id="mun" onchange="escolherMun()" class="w-full bg-black border border-gray-700 rounded mt-1 p-1 text-[10px]"><option>Mesquita</option><option>Nova Iguaçu</option><option>Belford Roxo</option><option>Duque de Caxias</option><option>São João de Meriti</option><option>Nilópolis</option><option>Magé</option><option>São Gonçalo</option><option>Niterói</option><option>Rio de Janeiro</option></select><p id="munInfo" class="text-[9px] text-gray-400 mt-1">Base Sebinho / Rocha Sobrinho</p></div>
</div>

<p class="text-center text-[9px] text-cyan-400/40 mt-4">CODIFICAÇÃO FINAL: eyeClose blinkTimer mouthOpen onboundary visema + analyser vol • 4 funções • PWA pronto</p>

<script>
let mouth=0,target=0,eye=0,blink=0,vol=0,speak=false;
let c=document.getElementById('sara'),ctx=c.getContext('2d');
function loop(){
 ctx.clearRect(0,0,400,320);
 blink+=0.05;if(blink>4+Math.random()*3){eye=1;blink=0;}if(eye>0)eye-=0.18;
 let open=Math.max(0,1-eye*4);
 ctx.fillStyle='#0a1a33';ctx.beginPath();ctx.ellipse(200,150,90,110,0,0,Math.PI*2);ctx.fill();
 [-55,55].forEach(dx=>{
  ctx.fillStyle='#001a0a';ctx.beginPath();ctx.ellipse(200+dx,120,18,12*open,0,0,Math.PI*2);ctx.fill();
  if(open>0.2){ctx.fillStyle='#00ff88';ctx.beginPath();ctx.arc(200+dx,120,10,0,Math.PI*2);ctx.fill();ctx.fillStyle='#000';ctx.beginPath();ctx.arc(200+dx,120,3,0,Math.PI*2);ctx.fill();}
 });
 mouth+=(target-mouth)*0.3;
 let mw=28+vol*15,mh=2+mouth*22;
 ctx.fillStyle='#000';ctx.beginPath();ctx.ellipse(200,200,mw,mh,0,0,Math.PI*2);ctx.fill();
 ctx.fillStyle=`rgba(0,242,254,${0.4+mouth*0.6})`;ctx.fill();
 ctx.strokeStyle='#00F2FE88';ctx.beginPath();for(let x=0;x<400;x++){let y=200+Math.sin(x*0.03+Date.now()*0.01)*(vol*12);if(x==0)ctx.moveTo(x,y);else ctx.lineTo(x,y);}ctx.stroke();
 requestAnimationFrame(loop);
}loop();
function falar(t){
 let texto=t||document.getElementById('txt').value;
 speechSynthesis.cancel();
 let u=new SpeechSynthesisUtterance(texto);u.lang='pt-BR';u.rate=0.95;u.pitch=1.1;
 u.onstart=()=>{speak=true;target=0.2;};
 u.onboundary=(e)=>{
  let ch=texto.substring(e.charIndex,e.charIndex+1).toLowerCase();
  if('aeiou'.includes(ch))target=0.9;else if('bmp'.includes(ch))target=0.05;else target=0.5;
  vol=0.5+Math.random()*0.5;
 };
 u.onend=()=>{speak=false;target=0;vol=0;};
 speechSynthesis.speak(u);
}
function atualizarClima(){let t=(20+Math.random()*15).toFixed(1);document.getElementById('temp').innerText=t+'°C';document.getElementById('chuva').innerText=(Math.random()*5).toFixed(1)+' mm/h • '+(60+Math.random()*30).toFixed(0)+'% • '+(Math.random()>0.5?'MÉDIO':'BAIXO');falar('Telemetria atualizada, '+t+' graus.');}
let alarmInt,actx;
function alarme(tipo){pararAlarme();actx=new (window.AudioContext||window.webkitAudioContext)();let speed=tipo=='br'?350:160,tog=false;alarmInt=setInterval(()=>{let o=actx.createOscillator(),g=actx.createGain();o.type='square';o.frequency.value=tog?900:400;g.gain.value=0.15;o.connect(g);g.connect(actx.destination);o.start();o.stop(actx.currentTime+speed/1000);tog=!tog;},speed);falar(tipo=='br'?'Alarme brasileiro ativado':'Alarme russo ativado');}
function pararAlarme(){if(alarmInt){clearInterval(alarmInt);alarmInt=null;}}
function enviarChat(){let i=document.getElementById('chatIn');if(!i.value)return;let ch=document.getElementById('chat');ch.innerHTML+='<div><b class="text-teal-400">Você:</b> '+i.value+'</div>';let r='Entendido, base Sebinho ativa para '+i.value;ch.innerHTML+='<div><b class="text-cyan-400">Sara:</b> '+r+'</div>';ch.scrollTop=ch.scrollHeight;falar(r);i.value='';}
function escolherMun(){let m=document.getElementById('mun').value;document.getElementById('munInfo').innerText=m+' - monitoramento ativo';falar(m+' selecionado, monitoramento ativo na Baixada.');}
window.onload=()=>{falar('App prático finalizado mestre, quatro funções modernas prontas.');};
</script></body></html>
