<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#06121a">
<title>Radar Tático - Alerta Sonoro</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<style>
  *{box-sizing:border-box}
  body{margin:0;background:#06121a;color:#8cf;font-family:Consolas,monospace}
  .top{padding:14px 12px;background:#0a1f2a;border-bottom:1px solid #0ff3;display:flex;justify-content:space-between;align-items:center}
  .top b{color:#0ff}
  .card{margin:12px;background:#0c2330;border:1px solid #0ff5;border-radius:16px;padding:14px}
  .barra{height:10px;background:linear-gradient(90deg,#5efc82,#ffeb3b,#ff9800,#ff004c,#ff00ff);border-radius:10px;margin-top:8px}
  .btn{width:100%;padding:12px;margin-top:10px;background:transparent;border:1px solid #0ff;color:#0ff;border-radius:10px;font-weight:bold}
  .btn.on{background:#ff004c;border-color:#ff004c;color:#fff;animation:pisca 1s infinite}
  @keyframes pisca{0%,100%{opacity:1}50%{opacity:0.5}}
  #map{height:50vh;margin:12px;border-radius:14px;border:1px solid #0ff4}
  .status{margin:0 12px;padding:10px;border-left:3px solid #0ff;background:#0ff1;font-size:12px;border-radius:0 8px 8px 0}
  .status.alerta{border-left-color:#ff004c;background:#ff004c22;color:#ff8a9d}
</style>
</head>
<body>
<div class="top">
  <b>🛰️ VETOR SERRA • SEBINHO</b>
  <a href="index.html" style="color:#0ff;text-decoration:none;border:1px solid #0ff;padding:6px 12px;border-radius:20px;font-size:12px">Voltar</a>
</div>

<div class="card">
  <div style="color:#0ff;font-weight:bold;font-size:12px">SERRA DO MENDANHA → MESQUITA (MONITORAMENTO ATIVO)</div>
  <div class="barra"></div>
  <div id="status" class="status" style="margin-top:10px">SCANNER: <span id="hora"></span> - Aguardando checagem...</div>
  <button id="btnAlerta" class="btn" onclick="ativarMonitoramento()">🔔 ATIVAR ALERTA SONORO</button>
  <div style="font-size:10px;color:#5a7a8a;margin-top:8px">Toque 1x para ativar som + vibração. O PWA precisa de interação pra tocar.</div>
</div>

<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
document.getElementById('hora').innerText = new Date().toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});
const map = L.map('map',{minZoom:10,maxZoom:16}).setView([-22.78,-43.42],13);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:16}).addTo(map);
L.polyline([[-22.83,-43.52],[-22.79,-43.44],[-22.77,-43.41]],{color:'#00ffff',weight:3,dashArray:'8,8'}).addTo(map);
L.marker([-22.79,-43.44]).addTo(map).bindPopup("Vila Sebinho");
L.marker([-22.77,-43.41]).addTo(map).bindPopup("Rocha Sobrinho");

let audioCtx;
function tocarAlerta(){
  try{
    if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const o = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    o.type='sine'; o.frequency.value=880;
    o.connect(g); g.connect(audioCtx.destination);
    g.gain.setValueAtTime(1, audioCtx.currentTime);
    o.start(); o.stop(audioCtx.currentTime+0.8);
    setTimeout(()=>{
      const o2 = audioCtx.createOscillator();
      o2.frequency.value=1200; o2.connect(g); g.connect(audioCtx.destination);
      o2.start(); o2.stop(audioCtx.currentTime+0.8);
    },400);
    if(navigator.vibrate) navigator.vibrate([500,200,500,200,800]);
  }catch(e){}
}

async function checarChuva(){
  // Usa Open-Meteo 100% grátis, sem API KEY
  const url = "https://api.open-meteo.com/v1/forecast?latitude=-22.79&longitude=-43.44&current=precipitation,cloud_cover&timezone=America/Sao_Paulo";
  try{
    const r = await fetch(url);
    const d = await r.json();
    const prec = d.current.precipitation;
    const cloud = d.current.cloud_cover;
    const statusEl = document.getElementById('status');
    if(prec > 0.2 || cloud > 85){
      statusEl.className="status alerta";
      statusEl.innerHTML = `🚨 ALERTA: Chuva descendo da Serra! Prec: ${prec}mm | Nuvem: ${cloud}% - SEBINHO/ROCHA EM ATENÇÃO`;
      tocarAlerta();
      if(Notification && Notification.permission==="granted"){
        new Notification("🚨 Radar Tático Sebinho",{body:`Chuva ${prec}mm vindo da Serra do Mendanha para Sebinho!`,icon:"https://cdn-icons-png.flaticon.com/512/1146/1146869.png"});
      }
    } else {
      statusEl.className="status";
      statusEl.innerHTML = `✅ Sem chuva forte agora - Prec: ${prec}mm | Nuvem: ${cloud}% | ${new Date().toLocaleTimeString('pt-BR')}`;
    }
  }catch(e){}
}

function ativarMonitoramento(){
  if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  tocarAlerta();
  if("Notification" in window && Notification.permission!=="granted") Notification.requestPermission();
  document.getElementById('btnAlerta').innerText="🔊 MONITORAMENTO ATIVO (a cada 3 min)";
  document.getElementById('btnAlerta').classList.add('on');
  checarChuva();
  setInterval(checarChuva, 180000); // checa a cada 3 minutos - leve e econômico
}
</script>
</body>
</html>
