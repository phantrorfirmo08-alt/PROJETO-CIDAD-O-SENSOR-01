async function chamarSarah(tipo, mensagensHistorico, municipioAtual, bairroAtual, abaAtual, dadosClimaContexto, userName = "Alexander") {
  const horaBrasilia = Number(new Intl.DateTimeFormat('pt-BR', {
    timeZone: 'America/Sao_Paulo',
    hour: 'numeric',
    hour12: false
  }).format(new Date()));

  const saudacaoCerta = horaBrasilia < 12 ? "Bom dia" : horaBrasilia < 18 ? "Boa tarde" : "Boa noite";
  const horaFormatada = new Intl.DateTimeFormat('pt-BR', {
    timeZone: 'America/Sao_Paulo',
    hour: '2-digit',
    minute: '2-digit'
  }).format(new Date());

  const modo = (tipo || 'conversa').toLowerCase();
  const nomeOperador = userName && userName.trim() ? userName.trim() : "Alexander";

  const instrucaoSaudacaoUnica = globalSaudacaoEmitida 
    ? "ATENÇÃO ABSOLUTA: A saudação temporal já foi feita no início. NUNCA inicie frases com 'Bom dia', 'Boa tarde' ou 'Boa noite'. Responda direto ao assunto de forma fluida."
    : `ATENÇÃO ABSOLUTA: Utilize a saudação '${saudacaoCerta}' apenas UMA vez no início desta conversa. Nos diálogos seguintes, nunca repita saudações.`;

  const baseSarah = montarPersonalidadeSarah() + `
[CONTEXTO TÁTICO ATUAL]
Operador: ${nomeOperador}
Município: ${municipioAtual || 'Mesquita'}
Bairro/Setor: ${bairroAtual || 'Rocha Sobrinho'}
Aba Ativa: ${abaAtual || 'Dashboard Principal'}
Hora Oficial: ${horaFormatada}
${instrucaoSaudacaoUnica}`;

  let promptFinal = baseSarah;
  let temp = 0.5; 
  let maxTokens = 400;

  try {
    const response = await fetch(SARAH_PROXY_URL, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        model: "openai/gpt-oss-120b",
        messages: [{ role: "system", content: promptFinal }, ...mensagensHistorico],
        temperature: temp,
        max_tokens: maxTokens
      })
    });
    const data = await response.json();
    if (!data.error) {
      const msg = data?.choices?.[0]?.message;
      let texto = msg?.content || msg?.reasoning_content;
      if (texto && texto.trim().length > 0) {
        globalSaudacaoEmitida = true;
        texto = texto.replace(/[*#]/g, '').replace(/cerquilha/gi, '').replace(/asterisco/gi, '');
        return texto.trim();
      }
    }
  } catch (e) {}

  try {
    const ultimaMensagem = mensagensHistorico[mensagensHistorico.length - 1]?.content || "Olá";
    const promptCompleto = promptFinal + "\n\nUsuário " + nomeOperador + " em " + (municipioAtual || 'Mesquita') + " disse: " + ultimaMensagem;
    const aiRes = await fetch("https://text.pollinations.ai/" + encodeURIComponent(promptCompleto));
    if (aiRes.ok) {
      let t = await aiRes.text();
      if (t && t.trim().length > 0) {
        globalSaudacaoEmitida = true;
        t = t.replace(/[*#]/g, '').replace(/cerquilha/gi, '').replace(/asterisco/gi, '');
        return t.trim();
      }
    }
  } catch (e) {}

  globalSaudacaoEmitida = true;
  return `Calma, ${nomeOperador}, tô contigo aqui na escuta. Vamo resolver isso junto agora.`;
}

function falarSarah(texto, vozIndex = 0) {
  try {
    const mudoGlobal = localStorage.getItem("raru_sound_enabled");
    if (mudoGlobal === "false") return;
  } catch(e) {}

  if (!("speechSynthesis" in window)) return;
  try {
    window.speechSynthesis.cancel();
    const cleanText = String(texto)
      .replace(/[*#]/g, '')
      .replace(/cerquilha/gi, '')
      .replace(/asterisco/gi, '')
      .replace(/([\u2700-\u27BF]|[\uE000-\uF8FF]|\uD83C[\uDC00-\uDFFF]|\uD83D[\uDC00-\uDFFF]|[\u2011-\u26FF]|\uD83E[\uDD00-\uDDFF])/g, '')
      .replace(/https?:\/\/\S+/g, "")
      .trim();
    if (!cleanText) return;
    const utterance = new SpeechSynthesisUtterance(cleanText);
    utterance.lang = "pt-BR";
    const voices = window.speechSynthesis.getVoices();
    const ptVoices = voices.filter(v => v.lang.toLowerCase().includes('pt'));
    const targetVoice = ptVoices[vozIndex] || ptVoices[0] || voices[0];
    if (targetVoice) utterance.voice = targetVoice;
    utterance.pitch = 1.05;
    utterance.rate = 1.15;
    window.speechSynthesis.speak(utterance);
  } catch(e) {}
}

async function gerarArquivoIconeEscudo() {
  return new Promise((resolve) => {
    const canvas = document.createElement('canvas');
    canvas.width = 512;
    canvas.height = 512;
    const ctx = canvas.getContext('2d');

    const bgGrad = ctx.createRadialGradient(256, 256, 30, 256, 256, 320);
    bgGrad.addColorStop(0, '#0A2547');
    bgGrad.addColorStop(0.6, '#041125');
    bgGrad.addColorStop(1, '#02040A');
    ctx.fillStyle = bgGrad;
    ctx.fillRect(0, 0, 512, 512);

    ctx.strokeStyle = 'rgba(0, 242, 254, 0.07)';
    ctx.lineWidth = 1;
    for (let i = 0; i < 512; i += 32) {
      ctx.beginPath(); ctx.moveTo(i, 0); ctx.lineTo(i, 512); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(0, i); ctx.lineTo(512, i); ctx.stroke();
    }

    ctx.save();
    ctx.beginPath();
    ctx.arc(256, 245, 200, 0, Math.PI * 2);
    ctx.strokeStyle = 'rgba(56, 189, 248, 0.35)';
    ctx.lineWidth = 3;
    ctx.setLineDash([12, 10]);
    ctx.stroke();
    ctx.restore();

    ctx.save();
    ctx.shadowColor = '#00F2FE';
    ctx.shadowBlur = 25;
    ctx.beginPath();
    ctx.moveTo(256, 65);
    ctx.lineTo(410, 130);
    ctx.lineTo(410, 265);
    ctx.quadraticCurveTo(410, 385, 256, 435);
    ctx.quadraticCurveTo(102, 385, 102, 265);
    ctx.lineTo(102, 130);
    ctx.closePath();

    const shieldFill = ctx.createLinearGradient(102, 65, 410, 435);
    shieldFill.addColorStop(0, 'rgba(0, 242, 254, 0.18)');
    shieldFill.addColorStop(1, 'rgba(4, 17, 37, 0.92)');
    ctx.fillStyle = shieldFill;
    ctx.fill();

    ctx.lineWidth = 6;
    ctx.strokeStyle = '#00F2FE';
    ctx.stroke();
    ctx.restore();

    ctx.beginPath();
    ctx.arc(256, 245, 92, 0, Math.PI * 2);
    ctx.strokeStyle = '#00FF9D';
    ctx.lineWidth = 3;
    ctx.stroke();

    const coreGrad = ctx.createRadialGradient(256, 245, 5, 256, 245, 65);
    coreGrad.addColorStop(0, '#00F2FE');
    coreGrad.addColorStop(1, '#041125');
    ctx.beginPath();
    ctx.arc(256, 245, 65, 0, Math.PI * 2);
    ctx.fillStyle = coreGrad;
    ctx.fill();

    ctx.fillStyle = '#FFFFFF';
    ctx.font = '900 34px Orbitron, sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('CLIMA', 256, 242);

    ctx.fillStyle = '#00FF9D';
    ctx.font = '800 20px JetBrains Mono, monospace';
    ctx.fillText('& DADOS PÚBLICOS', 256, 272);

    ctx.fillStyle = '#38BDF8';
    ctx.font = '700 15px JetBrains Mono, monospace';
    ctx.fillText('CIDADÃO SENSOR • MESQUITA RJ', 256, 480);

    canvas.toBlob((blob) => {
      if (blob) {
        resolve(new File([blob], 'BASE_CLIMATICA_TATICA.png', { type: 'image/png' }));
      } else {
        resolve(null);
      }
    }, 'image/png');
  });
}

      volHigh: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/></svg>',
      volMute: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#ef4444" stroke-width="2"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><line x1="23" y1="9" x2="17" y2="15"/><line x1="17" y1="9" x2="23" y2="15"/></svg>',
      check: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#22c55e" stroke-width="2.5"><polyline points="20 6 9 17 4 12"/></svg>'
    };

    const FALLBACK = {
      gospel: [
        { titulo: 'Radio Amazonia Gospel - Boa Vista RR', autor: 'Gospel • stream.zeno.fm • Reserva', url: 'https://stream.zeno.fm/wv1a2qswveruv' },
        { titulo: 'Radio Piaui Gospel - Teresina PI', autor: 'Gospel • stream.zeno.fm • Reserva', url: 'https://stream.zeno.fm/k4pw9r36mhruv' },
        { titulo: 'Radio Plenitude FM 105.7 - Sao Paulo', autor: 'Gospel • brasilstream • Reserva', url: 'https://9176.brasilstream.com.br/stream' }
      ],
      samba: [ { titulo: 'FM O Dia 99.7 - Pagode / Samba RJ', autor: 'Pagode • Reserva - Radio Browser', url: 'https://stream.zeno.fm/8x7q8y3k8mzuv' } ],
      sertanejo: [ { titulo: 'Radio Sertaneja - Reserva', autor: 'Sertanejo • Reserva - Radio Browser', url: 'https://stream.zeno.fm/8x7q8y3k8mzuv' } ]
    };

    const ACERVO_CYBER = [
      { titulo: 'Laser Groove (Synthwave)', autor: 'Kevin MacLeod (CC-BY 4.0) - incompetech.com', url: 'https://incompetech.com/music/royalty-free/mp3-royaltyfree/Laser%20Groove.mp3' },
      { titulo: 'Acoustic Breeze', autor: 'Kevin MacLeod (CC-BY 4.0)', url: 'https://incompetech.com/music/royalty-free/mp3-royaltyfree/Acoustic%20Breeze.mp3' },
      { titulo: 'Meditation Impromptu 01', autor: 'Kevin MacLeod (CC-BY 4.0)', url: 'https://incompetech.com/music/royalty-free/mp3-royaltyfree/Meditation%20Impromptu%2001.mp3' }
    ];

    let lista = []; let indice = 0; let tocando = false; let volumeAnterior = 0.85; let modo = 'radio'; let tentativas = 0; let timeoutTrava = null;
    const audio = container.querySelector('#re-audio-core'); if(audio) audio.volume = 0.85;
    const hudChan = container.querySelector('#re-hud-chan'); const hudCount = container.querySelector('#re-hud-count'); const hudTitle = container.querySelector('#re-hud-title'); const hudAuthor = container.querySelector('#re-hud-author'); const hudStatus = container.querySelector('#re-hud-status'); const progress = container.querySelector('#re-progress'); const eq = container.querySelector('#re-eq'); const btnPlay = container.querySelector('#re-btn-play'); const btnNext = container.querySelector('#re-btn-next'); const btnShare = container.querySelector('#re-btn-share'); const btnMute = container.querySelector('#re-btn-mute'); const volSlider = container.querySelector('#re-vol-slider'); const volPct = container.querySelector('#re-vol-pct'); const listaEl = container.querySelector('#re-lista');
    function esc(s){ return String(s||'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

    const modal = container.querySelector('#re-modal-termos');
    const abrirTermos = () => modal.classList.add('open'); const fecharTermos = () => modal.classList.remove('open');
    container.querySelector('#re-btn-termos').addEventListener('click', abrirTermos);
    container.querySelector('#re-top-termos').addEventListener('click', abrirTermos);
    container.querySelector('#re-modal-fechar').addEventListener('click', fecharTermos);
    modal.addEventListener('click', (e) => { if (e.target === modal) fecharTermos(); });

    async function carregarRadio(tag, btn) {
      modo = 'radio'; tentativas = 0;
      container.querySelectorAll('.re-chan-btn').forEach(b => b.classList.remove('active')); if (btn) btn.classList.add('active');
      hudChan.textContent = 'CANAL: ' + tag.toUpperCase() + ' LIVE';
      hudTitle.textContent = 'Buscando radios de ' + tag + '...'; hudAuthor.textContent = 'Radio Browser + Reserva...'; hudStatus.textContent = 'CARREGANDO...';
      let dados = null;
      const servidores = ['https://de1.api.radio-browser.info','https://de2.api.radio-browser.info','https://nl1.api.radio-browser.info'];
      for (const srv of servidores) {
        try { const res = await fetch(srv + '/json/stations/search?country=Brazil&tag=' + encodeURIComponent(tag) + '&limit=20&hidebroken=true&order=votes&reverse=true'); if (!res.ok) continue; dados = await res.json(); if (dados && dados.length) break; } catch(e){ continue; }
      }
      if (dados && dados.length) {
        const filtrados = dados.filter(r => r.url_resolved && r.url_resolved.startsWith('https://'));
        lista = (filtrados.length ? filtrados : dados).map(r => ({ titulo: r.name, autor: (r.tags || 'Radio oficial') + ' • ' + (r.homepage || 'radio-browser.info'), url: r.url_resolved, uuid: r.stationuuid }));
      } else {
        lista = FALLBACK[tag] || FALLBACK.gospel;
        hudTitle.textContent = 'Radio Browser fora, usando reserva fixa';
      }
      indice = 0; renderLista(); tocarAtual();
    }

    function carregarCyber(btn) {
      modo = 'mp3'; tentativas = 0;
      container.querySelectorAll('.re-chan-btn').forEach(b => b.classList.remove('active')); if (btn) btn.classList.add('active');
      hudChan.textContent = 'CANAL: CYBER MIX'; lista = ACERVO_CYBER; indice = 0; renderLista(); tocarAtual();
    }

    function renderLista() {
      listaEl.innerHTML = lista.map((f,i) => `<div class="re-list-item ${i===indice?'active':''}" data-i="${i}"><div style="min-width:0"><b>${esc(f.titulo)}</b><span>${esc(f.autor)}</span></div><span style="color:#00f3ff;font-size:11px;font-weight:700">${i===indice && tocando ? 'TOCANDO' : 'OUVIR'}</span></div>`).join('');
      listaEl.querySelectorAll('.re-list-item').forEach(el => el.addEventListener('click', () => { indice = Number(el.getAttribute('data-i')); tentativas = 0; tocarAtual(); }));
    }

    function tocarAtual() {
      if (!lista.length) return;
      if (timeoutTrava) clearTimeout(timeoutTrava);
      const f = lista[indice];
      hudCount.textContent = String(indice+1).padStart(2,'0') + '/' + String(lista.length).padStart(2,'0');
      hudTitle.textContent = f.titulo; hudAuthor.textContent = 'Credito: ' + f.autor; hudStatus.textContent = 'CONECTANDO... TESTE ' + (tentativas+1);
      progress.style.width = '0%';
      audio.src = f.url;
      timeoutTrava = setTimeout(() => { if (!tocando || audio.paused) { hudStatus.textContent = 'FALHA NESSA RADIO, PULANDO...'; proxima(true); } }, 8000);
      audio.play().then(() => {
        if (timeoutTrava) clearTimeout(timeoutTrava);
        tocando = true; tentativas = 0;
        btnPlay.innerHTML = ICONS.pause + '<span>PAUSAR</span>';
        hudStatus.textContent = modo === 'radio' ? 'AO VIVO • RADIO OFICIAL' : 'TOCANDO • CC-BY 4.0';
        eq.classList.add('active');
      }).catch(() => { hudStatus.textContent = 'FALHA NO LINK, AVANCANDO...'; setTimeout(() => proxima(true), 800); });
      if (f.uuid) fetch('https://de1.api.radio-browser.info/json/url/' + f.uuid).catch(()=>{});
      renderLista();
    }

    function proxima(auto) {
      if (!lista.length) return;
      if (auto) tentativas++;
      if (tentativas > 5) { hudTitle.textContent = 'Todas as radios dessa lista falharam. Tenta Cyber Mix ou outro canal.'; hudStatus.textContent = 'SEM SINAL - TESTE CYBER MIX'; return; }
      indice = (indice + 1) % lista.length; tocarAtual();
    }

    audio.addEventListener('ended', () => { if (modo === 'mp3') proxima(); });
    audio.addEventListener('timeupdate', () => { if (audio.duration) progress.style.width = ((audio.currentTime / audio.duration) * 100) + '%'; });
    audio.addEventListener('error', () => { hudStatus.textContent = 'ERRO NO STREAM, PULANDO...'; setTimeout(() => proxima(true), 800); });
    container.querySelectorAll('.re-chan-btn').forEach(btn => { btn.addEventListener('click', () => { if (btn.getAttribute('data-tipo') === 'mp3') carregarCyber(btn); else carregarRadio(btn.getAttribute('data-tag'), btn); }); });
    btnPlay.addEventListener('click', () => {
      if (!lista.length) { carregarCyber(null); return; }
      if (tocando) { audio.pause(); tocando = false; btnPlay.innerHTML = ICONS.play + '<span>RETOMAR</span>'; hudStatus.textContent = 'PAUSADO'; eq.classList.remove('active'); if (timeoutTrava) clearTimeout(timeoutTrava); }
      else { audio.play().then(() => { tocando = true; btnPlay.innerHTML = ICONS.pause + '<span>PAUSAR</span>'; hudStatus.textContent = 'TOCANDO'; eq.classList.add('active'); }); }
    });
    btnNext.addEventListener('click', () => proxima(false));
    volSlider.addEventListener('input', (e) => { const v = e.target.value / 100; audio.volume = v; audio.muted = v === 0; volPct.textContent = e.target.value + '%'; btnMute.innerHTML = v === 0 ? ICONS.volMute : ICONS.volHigh; if (v > 0) volumeAnterior = v; });
    btnMute.addEventListener('click', () => { if (audio.muted || audio.volume === 0) { audio.muted = false; audio.volume = volumeAnterior || 0.85; volSlider.value = Math.round(audio.volume * 100); volPct.textContent = volSlider.value + '%'; btnMute.innerHTML = ICONS.volHigh; } else { volumeAnterior = audio.volume; audio.muted = true; volSlider.value = 0; volPct.textContent = '0%'; btnMute.innerHTML = ICONS.volMute; } });
    btnShare.addEventListener('click', async () => {
      const f = lista[indice]; const texto = f ? `Ouvindo "${f.titulo}" na Radio Esperanca Mix Live!` : 'Ouça a Radio Esperanca Mix Live!';
      if (navigator.share) { try { await navigator.share({ title: 'Radio Esperanca Mix Live', text: texto, url: window.location.href }); } catch(err) {} }
      else { try { await navigator.clipboard.writeText(texto + ' ' + window.location.href); btnShare.innerHTML = ICONS.check; setTimeout(() => btnShare.innerHTML = ICONS.share, 2500); } catch(e) {} }
    });
  }, []);

  return (
    <div className="space-y-4 w-full font-mono">
      <div className="cyber-card p-4 rounded-2xl border border-cyberCyan/40 shadow-2xl">
        <div id="radio-esperanca-container"></div>
      </div>
    </div>
  );
}

function AdminVaultModule({ showToast, onClose, localVideos, setLocalVideos, youtubeVideos, setYoutubeVideos, publicVideos, setPublicVideos, vozSelecionada, setVozSelecionada, customTickerText, setCustomTickerText }) {
  const [pinInput, setPinInput] = React.useState("");
  const [isUnlocked, setIsUnlocked] = React.useState(false);
  const [adminSubTab, setAdminSubTab] = React.useState('cade');
  const [novaUrlYoutube, setNovaUrlYoutube] = React.useState('');
  const [tickerInput, setTickerInput] = React.useState(customTickerText);

  const handleUnlock = (e) => {
    e.preventDefault();
    if (pinInput === "303500") { setIsUnlocked(true); showToast("Acesso Restrito Autorizado."); } else { showToast("PIN Incorreto."); }
  };

  const salvarTicker = (e) => {
    e.preventDefault();
    setCustomTickerText(tickerInput);
    try { localStorage.setItem('raru_custom_ticker', tickerInput); } catch(e){}
    showToast("Faixa marquee atualizada com sucesso.");
  };

  const testarVoz = (index) => {
    setVozSelecionada(index);
    try { localStorage.setItem('raru_voz_index', String(index)); } catch(e){}
    falarSarah("Testando perfil de voz número " + (index + 1) + " na central.", index);
    showToast(`Voz ${index + 1} ativada.`);
  };

  const handleUploadGaleriaDireto = (e) => {
    const file = e.target.files[0];
    if (!file || !file.type.startsWith('video/')) { showToast("Selecione um vídeo válido."); return; }
    const reader = new FileReader();
    reader.onload = (uploadEvent) => {
      const base64Video = uploadEvent.target.result;
      const novoItem = { id: Date.now(), title: file.name, url: base64Video, type: 'local' };
      const atualizados = [novoItem, ...localVideos];
      setLocalVideos(atualizados);
      try { localStorage.setItem('raru_local_videos', JSON.stringify(atualizados)); } catch(e){}
      showToast("Vídeo salvo no LocalStorage.");
    };
    reader.readAsDataURL(file);
  };

  const converterLinkYoutube = (url) => {
    if (!url) return '';
    let videoId = '';
    if (url.includes('youtu.be/')) videoId = url.split('youtu.be/')[1]?.split('?')[0];
    else if (url.includes('watch?v=')) videoId = url.split('watch?v=')[1]?.split('&')[0];
    return videoId ? `https://www.youtube.com/embed/${videoId}` : '';
  };

  const handleAdicionarYoutubeDireto = (e) => {
    e.preventDefault();
    const embedUrl = converterLinkYoutube(novaUrlYoutube);
    if (!embedUrl) { showToast("Link do YouTube inválido."); return; }
    const novoItem = { id: Date.now(), title: "Vídeo do YouTube", url: embedUrl, type: 'youtube' };
    const atualizados = [novoItem, ...youtubeVideos];
    setYoutubeVideos(atualizados);
    try { localStorage.setItem('raru_youtube_videos', JSON.stringify(atualizados)); } catch(e){}
    setNovaUrlYoutube('');
    showToast("Vídeo do YouTube salvo.");
  };

  return (
    <div className="space-y-4 w-full font-mono max-w-4xl mx-auto">
      <div className="cyber-card p-4 shadow-xl space-y-4 border border-cyberCyan/40">

          <button onClick={onClose} className="cyber-button-danger text-xs py-1 px-3 !min-h-[32px]">FECHAR</button>
        </div>

        {!isUnlocked ? (
          <form onSubmit={handleUnlock} className="flex gap-2">
            <input type="password" maxLength="6" value={pinInput} onChange={(e) => setPinInput(e.target.value)} placeholder="PIN (303500)" className="flex-1 bg-void border border-cyberCyan/40 rounded-xl px-3 py-2.5 text-center text-slate-100 font-mono tracking-widest text-xs shadow-inner" />

          </form>
        ) : (
          <div className="space-y-4">
            <div className="flex gap-2 overflow-x-auto pb-2 border-b border-cyberCyan/30">
              <button onClick={() => setAdminSubTab('cade')} className={`cyber-button text-xs py-2 px-3 ${adminSubTab === 'cade' ? '!bg-cyan-400 !text-void' : ''}`}>PAINEL GADE / CADE</button>
              <button onClick={() => setAdminSubTab('sistema')} className={`cyber-button text-xs py-2 px-3 ${adminSubTab === 'sistema' ? '!bg-cyberCyan !text-void' : ''}`}>CONFIGURAÇÕES</button>
            </div>

                  <span className="text-white font-black text-xs font-display block">CONFIGURAÇÃO DAS 5 VOZES OFICIAIS (SARAH AI)</span>
                  <div className="grid grid-cols-5 gap-1.5">

function App() {
  const [theme, setTheme] = React.useState(() => { 
    try { 
      const t = localStorage.getItem("raru-cyber-theme") || "dark";
      if (t === 'warm') document.body.classList.add('theme-warm');
      return t;
    } catch(e) { return "dark"; } 
  });

  const [soundEnabled, setSoundEnabled] = React.useState(() => {
    try {
      const s = localStorage.getItem("raru_sound_enabled");
      return s !== "false";
    } catch(e) { return true; }
  });

  const [isSpeaking, setIsSpeaking] = React.useState(false);
  const [isListening, setIsListening] = React.useState(false);
  const [activeTab, setActiveTab] = React.useState("dashboard");
  const [quemSomosOpen, setQuemSomosOpen] = React.useState(false);
  const [isCommandHUDActive, setIsCommandHUDActive] = React.useState(false);
  const [shareModalOpen, setShareModalOpen] = React.useState(false);
  const [toastMsgRef, setToastMsgRef] = React.useState(null);

  const [termsAccepted, setTermsAccepted] = React.useState(() => { try { return localStorage.getItem("raru_cyber_terms") === "1"; } catch(e) { return false; } });
  const [check1, setCheck1] = React.useState(false);
  const [check2, setCheck2] = React.useState(false);

  const [userName, setUserName] = React.useState(() => { try { return localStorage.getItem("raru_user_name") || "Alexander"; } catch(e) { return "Alexander"; } });
  const [nameModalOpen, setNameModalOpen] = React.useState(false);
  const [tempNameInput, setTempNameInput] = React.useState("");

  const [isChatOpen, setIsChatOpen] = React.useState(false);
  const [input, setInput] = React.useState("");
  const [isProcessing, setIsProcessing] = React.useState(false);

  const [vozSelecionada, setVozSelecionada] = React.useState(() => { try { return Number(localStorage.getItem("raru_voz_index")) || 0; } catch(e) { return 0; } });
  const [customTickerText, setCustomTickerText] = React.useState(() => { try { return localStorage.getItem('raru_custom_ticker') || ""; } catch(e) { return ""; } });

  const [localVideos, setLocalVideos] = React.useState(() => { try { const s = localStorage.getItem('raru_local_videos'); return s ? JSON.parse(s) : []; } catch(e) { return []; } });
  const [youtubeVideos, setYoutubeVideos] = React.useState(() => { try { const s = localStorage.getItem('raru_youtube_videos'); return s ? JSON.parse(s) : []; } catch(e) { return []; } });
  const [publicVideos, setPublicVideos] = React.useState(() => { try { const s = localStorage.getItem('raru_public_videos'); return s ? JSON.parse(s) : []; } catch(e) { return []; } });

  const showToast = (msg) => { setToastMsgRef(msg); setTimeout(() => setToastMsgRef(null), 3500); };

  const handleSaveName = (e) => {
    e.preventDefault();
    if (!tempNameInput.trim()) return;
    const nomeLimpo = tempNameInput.trim();
    setUserName(nomeLimpo);
    try { localStorage.setItem("raru_user_name", nomeLimpo); } catch(e) {}
    setNameModalOpen(false);
    setTempNameInput("");
    showToast(`Operador ${nomeLimpo} registrado!`);
  };

  const toggleCommandHUD = () => {
    const elem = document.documentElement;
    if (!isCommandHUDActive) {
      try {
        if (elem.requestFullscreen) elem.requestFullscreen();
      } catch (err) {}
      setIsCommandHUDActive(true);
      showToast("TELA CHEIA ATIVO.");
    } else {
      try {
        if (document.exitFullscreen) document.exitFullscreen();
      } catch (err) {}
      setIsCommandHUDActive(false);
      showToast("Modo Padrão Restabelecido.");
    }
  };

  const openShareFromApp = async () => {
    showToast("Gerando arquivo compacto...");
    const iconeArquivo = await gerarArquivoIconeEscudo();
    if (navigator.share) {
      try {
        const sharePayload = { title: "Base Climática", text: shareMessageText, url: APP_SHARE_URL };
        if (iconeArquivo && navigator.canShare && navigator.canShare({ files: [iconeArquivo] })) sharePayload.files = [iconeArquivo];
        await navigator.share(sharePayload);
        return;
      } catch (err) {}
    }
    setShareModalOpen(true);
  };

  const toggleListening = () => {
    const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SpeechRec) { showToast("Microfone indisponível."); return; }
    if (isListening) { setIsListening(false); return; }
    try {
      const rec = new SpeechRec();
      rec.lang = "pt-BR";
      rec.onstart = () => setIsListening(true);
      rec.onresult = (event) => { let final = event.results[0][0].transcript; if (final) { setInput(final); setIsListening(false); handleSendDirectCommand(final); } };
      rec.onerror = () => setIsListening(false);
      rec.onend = () => setIsListening(false);
      rec.start();
    } catch (e) { setIsListening(false); }
  };

  const [messages, setMessages] = React.useState([
    { sender: 'assistant', text: 'Calma, estou na escuta. Vamo resolver junto.', time: '07:22' }
  ]);

  const handleSendDirectCommand = async (textCustom) => {
    const textToSend = textCustom !== undefined ? textCustom : input;
    if (!textToSend.trim() || isProcessing) return;
    const timeStr = new Date().toLocaleTimeString('pt-BR', {hour: '2-digit', minute:'2-digit'});

    const novoHistorico = [...messages, { sender: 'user', text: textToSend, time: timeStr }];
    setMessages(novoHistorico);
    setInput("");
    setIsProcessing(true);
    setIsSpeaking(true);

    try {
      const formattedHistory = novoHistorico.map(m => ({
        role: m.sender === 'user' ? 'user' : 'assistant',
        content: m.text
      }));

      const respostaSarah = await chamarSarahGroq(formattedHistory, "Mesquita", "Rocha Sobrinho", activeTab, { status: "Online" }, userName);
      const replyTime = new Date().toLocaleTimeString('pt-BR', {hour: '2-digit', minute:'2-digit'});
      
      setMessages(prev => [...prev, { sender: 'assistant', text: respostaSarah, time: replyTime }]);
      if (soundEnabled) falarSarah(respostaSarah, vozSelecionada);
    } catch (error) {
      setMessages(prev => [...prev, { sender: 'assistant', text: 'Instabilidade detectada.', time: new Date().toLocaleTimeString('pt-BR', {hour: '2-digit', minute:'2-digit'}) }]);
    } finally {
      setIsProcessing(false);
      setIsSpeaking(false);
    }
  };

  const openSarahChat = () => setIsChatOpen(true);

  const NAV_TABS = [

    { id: 'radar', iconComponent: <IconRadar className="w-4 h-4"/>, label: 'Radar' },
    { id: 'relatorio', iconComponent: <IconVistoria className="w-4 h-4"/>, label: 'Vistoria' },
    { id: 'estacao', iconComponent: <IconEstacao className="w-4 h-4"/>, label: 'Estação' },
    { id: 'balanca', iconComponent: <IconBalanca className="w-4 h-4"/>, label: 'Balança' },
    { id: 'alquino', iconComponent: <IconAlquino className="w-4 h-4"/>, label: 'Alquino' },
    { id: 'compartilhar', iconComponent: <IconInstalar className="w-4 h-4"/>, label: 'Instalar' },
    { id: 'quem-somos', iconComponent: <IconQuemSomos className="w-4 h-4"/>, label: 'Sobre' },
    { id: 'galeria', iconComponent: <IconVideos className="w-4 h-4"/>, label: 'Vídeos' },
    { id: 'admin', iconComponent: <IconAdmin className="w-4 h-4"/>, label: 'Admin' }
  ];

  const handleNavClick = (tabId) => {
    if (tabId === 'compartilhar') openShareFromApp();
    else if (tabId === 'quem-somos') setQuemSomosOpen(true);
    else {
      setActiveTab(tabId);
    }
  };

  return (
    <div className="seu-container-raru">
      {toastMsgRef && <div className="fixed top-12 left-1/2 -translate-x-1/2 z-50 cyber-card px-4 py-2 rounded-2xl font-display text-[10px] font-black text-cyberCyan tracking-wider shadow-2xl border border-cyberCyan/60 animate-bounce">{toastMsgRef}</div>}

      {shareModalOpen && (

            <h3 className="font-display text-xs font-black tracking-widest uppercase text-cyberCyan">INSTALAÇÃO</h3>

            <button onClick={() => setShareModalOpen(false)} className="cyber-button-danger w-full text-xs py-2.5">FECHAR</button>
          </div>
        </div>

      {termsAccepted && nameModalOpen && (

        {activeTab === 'galeria' && <div className="cyber-card p-4">Galeria Pública Ativa</div>}
        {activeTab === 'admin' && <AdminVaultModule onClose={() => setActiveTab('dashboard')} showToast={showToast} localVideos={localVideos} setLocalVideos={setLocalVideos} youtubeVideos={youtubeVideos} setYoutubeVideos={setYoutubeVideos} publicVideos={publicVideos} setPublicVideos={setPublicVideos} vozSelecionada={vozSelecionada} setVozSelecionada={setVozSelecionada} customTickerText={customTickerText} setCustomTickerText={setCustomTickerText} />}

        <AutomatedObservatoryWidget customTickerText={customTickerText}/>
      </main>

      {termsAccepted && <SarahFabButton isSpeaking={isSpeaking} openSarahChat={openSarahChat}/>}
      <SarahChatOverlay
        isOpen={isChatOpen}
        onClose={() => setIsChatOpen(false)}
        isSpeaking={isSpeaking}
        isProcessing={isProcessing}
        messages={messages}
        input={input}
        setInput={setInput}
        handleSendDirectCommand={handleSendDirectCommand}
        toggleListening={toggleListening}
        isListening={isListening}
        userName={userName}
        onOpenNameModal={() => { setTempNameInput(userName); setNameModalOpen(true); }}
      />

      <footer className="cyber-card fixed bottom-0 left-0 right-0 z-40 border-t border-cyberCyan/40 px-2.5 py-3 flex items-center justify-between gap-1 shadow-2xl backdrop-blur-xl max-w-[1400px] mx-auto rounded-t-2xl pb-[env(safe-area-inset-bottom)]">
        {NAV_TABS.map(tab => (
          <button key={tab.id} onClick={() => handleNavClick(tab.id)} className={`flex flex-col items-center justify-center gap-0.5 cursor-pointer flex-1 py-1.5 transition touch-manipulation rounded-xl ${activeTab === tab.id ? 'text-cyberCyan bg-cyberCyan/15 border border-cyberCyan/40 shadow-[0_0_8px_rgba(0,242,254,0.3)]' : 'text-slate-400 hover:text-white border border-transparent'}`}>
            {tab.iconComponent}
            <span className="text-[7px] sm:text-[9px] font-black truncate w-full text-center tracking-tighter px-0.5">{tab.label}</span>
          </button>
        ))}
      </footer>
    </div>
  );
}

try {
  const rootElement = document.getElementById('root');
  ReactDOM.createRoot(rootElement).render(<App/>);
} catch (err) {
  document.getElementById('root').innerHTML = `<div style="padding:20px;color:#FF0055;font-family:monospace;">Erro ao iniciar interface: ${err.message}</div>`;
}
</script>
</body>
</html>
