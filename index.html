<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Monitor - GOES-19 + RainViewer + Open-Meteo</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    body { margin: 0; font-family: sans-serif; background: #000; }
    #map { height: 100vh; width: 100%; }

    .painel {
      position: absolute;
      top: 12px;
      left: 12px;
      z-index: 1000;
      background: rgba(0,0,0,.85);
      color: #fff;
      padding: 14px;
      border-radius: 16px;
      width: 250px;
    }
    .painel h3 { margin: 0 0 8px 0; font-size: 15px; }
    .painel p { margin: 4px 0; font-size: 12px; color: #aaa; }

    .camada {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #1a1a1a;
      padding: 10px 12px;
      border-radius: 12px;
      margin-top: 8px;
    }
    .camada b { font-size: 13px; }
    .camada span { font-size: 11px; color: #aaa; display: block; }

    .btn {
      border: 0;
      border-radius: 999px;
      padding: 8px 14px;
      font-weight: 900;
      font-size: 12px;
      cursor: pointer;
      min-width: 70px;
    }
    .btn.on { background: #22c55e; color: #fff; }
    .btn.off { background: #333; color: #888; }

    .botoes-controle {
      display: flex;
      gap: 6px;
      margin-top: 12px;
    }
    .botoes-controle button {
      flex: 1;
      background: #fff;
      border: 0;
      border-radius: 999px;
      padding: 9px;
      font-weight: 900;
      font-size: 12px;
      cursor: pointer;
    }

    .info {
      position: absolute;
      bottom: 16px;
      left: 16px;
      z-index: 1000;
      background: rgba(0,0,0,.85);
      color: #fff;
      padding: 10px 14px;
      border-radius: 12px;
      font-size: 12px;
      font-weight: 700;
      max-width: 90%;
    }
    .sara {
      position: absolute;
      bottom: 16px;
      right: 16px;
      z-index: 1000;
      background: #7c3aed;
      color: #fff;
      padding: 10px 14px;
      border-radius: 12px;
      font-size: 12px;
      font-weight: 800;
      max-width: 280px;
    }
  </style>
</head>
<body>
  <div id="map"></div>

  <div class="painel">
    <h3>🛰️ MONITOR RIO - GOES-19</h3>
    <p>Centro: Rio de Janeiro -22.9068, -43.1729</p>

    <div class="camada">
      <div><b>🛰️ GOES-19</b><span>Nuvem - Satélite</span></div>
      <button class="btn on" id="btnGoes" onclick="alternarCamada('goes')">ON</button>
    </div>

    <div class="camada">
      <div><b>🌧️ RAINVIEWER</b><span>Chuva - Radar</span></div>
      <button class="btn on" id="btnRain" onclick="alternarCamada('rain')">ON</button>
    </div>

    <div class="camada">
      <div><b>🌡️ OPEN-METEO</b><span>Temp / Vento / Chance</span></div>
      <button class="btn on" id="btnMeteo" onclick="alternarCamada('meteo')">ON</button>
    </div>

    <div class="botoes-controle">
      <button id="btnPlay" onclick="alternarPlay()">⏸ PAUSAR</button>
      <button onclick="mudarModo('past')">PASSADO</button>
      <button onclick="mudarModo('nowcast')">PREVISÃO</button>
    </div>

    <p style="margin-top:10px; font-size:11px;">● Atualiza a cada 5 min • Grátis • Sem chave</p>
  </div>

  <div class="info" id="info">● CARREGANDO RADAR...</div>
  <div class="sara" id="sara">🤖 SARA: Vigiando no oculto...</div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    const map = L.map('map').setView([-22.9068, -43.1729], 8);

    L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
      attribution: '&copy; OpenStreetMap & CARTO'
    }).addTo(map);

    L.marker([-22.9068, -43.1729]).addTo(map).bindPopup('Rio de Janeiro').openPopup();

    // ===== 1. CAMADA GOES-19 - NUVEM =====
    // Fonte: 【entity-NASA¦canonical_name=NASA】 GIBS - GOES-East Banda 13 Infravermelho
    // Atualiza a cada 10 minutos no satélite
    const camadaGoes = L.tileLayer('https://gibs.earthdata.nasa.gov/wmts/epsg3857/best/GOES-East_ABI_Band13_Clean_Infrared/default/2026-11-20/4km/{z}/{y}/{x}.png', {
      opacity: 0.55,
      zIndex: 5
    }).addTo(map);

    // ===== 2. CAMADA RAINVIEWER - CHUVA =====
    let camadasChuva = [];
    let quadros = [];
    let quadroAtual = 0;
    let intervalo = null;
    let tocando = true;
    let modo = 'past';
    let camadaRainAtiva = true;
    let camadaGoesAtiva = true;
    let camadaMeteoAtiva = true;

    function mostrarQuadro(indice) {
      if (!camadaRainAtiva) return;
      camadasChuva.forEach(function(cam, i) {
        cam.setOpacity(i === indice ? 0.65 : 0);
      });
      const q = quadros[indice];
      if (q) {
        const hora = new Date(q.time * 1000);
        document.getElementById('info').innerHTML = '● ' + (modo === 'past' ? 'PASSADO' : 'PREVISÃO') + ' - ' + hora.toLocaleTimeString('pt-BR') + ' - Quadro ' + (indice + 1) + '/' + quadros.length;
      }
    }

    function construirRadar(data) {
      camadasChuva.forEach(function(l) { map.removeLayer(l); });
      camadasChuva = [];
      quadros = modo === 'past' ? data.radar.past : data.radar.nowcast;
      const host = data.host;
      quadros.forEach(function(q) {
        const url = host + q.path + '/512/{z}/{x}/{y}/2/1_1.png';
        const camada = L.tileLayer(url, { opacity: 0, zIndex: 10 });
        if (camadaRainAtiva) camada.addTo(map);
        camadasChuva.push(camada);
      });
      quadroAtual = quadros.length - 1;
      mostrarQuadro(quadroAtual);
      iniciarPlay();
      verificarMeteo();
    }

    function iniciarPlay() {
      pararPlay();
      if (!tocando) return;
      intervalo = setInterval(function() {
        quadroAtual = (quadroAtual + 1) % quadros.length;
        mostrarQuadro(quadroAtual);
      }, 800);
    }
    function pararPlay() { if (intervalo) clearInterval(intervalo); intervalo = null; }
    function alternarPlay() {
      tocando = !tocando;
      document.getElementById('btnPlay').textContent = tocando ? '⏸ PAUSAR' : '▶ TOCAR';
      if (tocando) iniciarPlay(); else pararPlay();
    }
    function mudarModo(novoModo) { modo = novoModo; carregarRadar(); }

    function carregarRadar() {
      document.getElementById('info').innerHTML = '● CARREGANDO RADAR...';
      fetch('https://api.rainviewer.com/public/weather-maps.json')
        .then(function(res) { return res.json(); })
        .then(construirRadar)
        .catch(function() {
          document.getElementById('info').innerHTML = '● RADAR OFFLINE - VERIFICA A INTERNET';
        });
    }

    // ===== 3. OPEN-METEO - NÚMEROS + SARA =====
    async function verificarMeteo() {
      if (!camadaMeteoAtiva) return;
      try {
        const url = 'https://api.open-meteo.com/v1/forecast?latitude=-22.9068&longitude=-43.1729&current=temperature_2m,precipitation,wind_speed_10m&hourly=precipitation_probability&forecast_days=1';
        const res = await fetch(url);
        const data = await res.json();
        const temp = data.current.temperature_2m;
        const vento = data.current.wind_speed_10m;
        const chance = data.hourly.precipitation_probability[0] || 0;
        const chovendo = quadros.length > 0;

        let msgSara = '🤖 SARA: Tudo tranquilo';
        if (chovendo && chance > 70) msgSara = '🤖 SARA: ⚠️ TEMPESTADE - Radar + GOES confirmam - ' + chance + '%';
        else if (chovendo) msgSara = '🤖 SARA: 🌧 CHOVENDO AGORA - Radar confirmou';
        else if (chance > 80) msgSara = '🤖 SARA: ☁️ NUVEM PESADA NO GOES-19 - Pode chover - ' + chance + '%';

        document.getElementById('sara').innerHTML = msgSara + '<br><span style="font-weight:400; font-size:11px;">Temp ' + temp + '°C • Vento ' + vento + ' km/h • Chance ' + chance + '%</span>';
      } catch (e) {
        document.getElementById('sara').innerHTML = '🤖 SARA: Open-Meteo offline';
      }
    }

    // ===== BOTÕES LIGA / DESLIGA =====
    function alternarCamada(tipo) {
      if (tipo === 'goes') {
        camadaGoesAtiva = !camadaGoesAtiva;
        if (camadaGoesAtiva) map.addLayer(camadaGoes); else map.removeLayer(camadaGoes);
        const btn = document.getElementById('btnGoes');
        btn.textContent = camadaGoesAtiva ? 'ON' : 'OFF';
        btn.className = 'btn ' + (camadaGoesAtiva ? 'on' : 'off');
      }
      if (tipo === 'rain') {
        camadaRainAtiva = !camadaRainAtiva;
        camadasChuva.forEach(function(c) {
          if (camadaRainAtiva) map.addLayer(c); else map.removeLayer(c);
        });
        const btn = document.getElementById('btnRain');
        btn.textContent = camadaRainAtiva ? 'ON' : 'OFF';
        btn.className = 'btn ' + (camadaRainAtiva ? 'on' : 'off');
      }
      if (tipo === 'meteo') {
        camadaMeteoAtiva = !camadaMeteoAtiva;
        const btn = document.getElementById('btnMeteo');
        btn.textContent = camadaMeteoAtiva ? 'ON' : 'OFF';
        btn.className = 'btn ' + (camadaMeteoAtiva ? 'on' : 'off');
        if (camadaMeteoAtiva) verificarMeteo();
        else document.getElementById('sara').innerHTML = '🤖 SARA: Open-Meteo desligado';
      }
    }

    carregarRadar();
    setInterval(carregarRadar, 5 * 60 * 1000);
  </script>
</body>
</html>
