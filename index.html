        // Componente do Mapa Leaflet Tático Integrado com RainViewer e Serra do Mendonça / Sebinho
        function LeafletTacticalRadarMap() {
            const [isPlaying, setIsPlaying] = React.useState(false);
            const [timeLabel, setTimeLabel] = React.useState("Varrendo...");
            const [timeColor, setTimeColor] = React.useState("#38bdf8");

            React.useEffect(() => {
                let mapInstance = null;
                let radarLayers = [];
                let currentFrameIndex = 0;
                let animationInterval = null;

                try {
                    const centerLat = -22.8250;
                    const centerLng = -43.4350;

                    mapInstance = L.map('leaflet-map', {
                        zoomControl: true,
                        attributionControl: false
                    }).setView([centerLat, centerLng], 11.5);

                    L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_nolabels/{z}/{x}/{y}{r}.png', {
                        maxZoom: 19
                    }).addTo(mapInstance);

                    L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_only_labels/{z}/{x}/{y}{r}.png', {
                        maxZoom: 19,
                        opacity: 0.5
                    }).addTo(mapInstance);

                    // 1. Origem: Serra do Mendanha
                    const mendanhaLat = -22.8350;
                    const mendanhaLng = -43.4750;
                    const mendanhaMarker = L.circleMarker([mendanhaLat, mendanhaLng], {
                        radius: 7,
                        color: '#38bdf8',
                        fillColor: '#38bdf8',
                        fillOpacity: 0.9,
                        weight: 2
                    }).addTo(mapInstance);
                    mendanhaMarker.bindPopup("<b style='color:#38bdf8;'>ORIGEM DA FORMAÇÃO:</b><br>Serra do Mendanha / Eixo de Montanha<br>Monitoramento de Borda de Nuvem.");

                    // 2. Destino: Sebinho / Rocha Sobrinho (Mesquita)
                    const sebinhoLat = -22.7915;
                    const sebinhoLng = -43.4182;

                    L.circle([sebinhoLat, sebinhoLng], {
                        color: '#ef4444',
                        fillColor: '#ef4444',
                        fillOpacity: 0.12,
                        radius: 1000
                    }).addTo(mapInstance);

                    const sebinhoMarker = L.circleMarker([sebinhoLat, sebinhoLng], {
                        radius: 6,
                        color: '#ffffff',
                        fillColor: '#ef4444',
                        fillOpacity: 1,
                        weight: 2
                    }).addTo(mapInstance);
                    sebinhoMarker.bindPopup("<b style='color:red;'>ÁREA DE ALVO/RISCO:</b><br>Sebinho / Rocha Sobrinho<br>Bacia do Rio Sarapuí.");

                    L.polyline([
                        [mendanhaLat, mendanhaLng],
                        [sebinhoLat, sebinhoLng]
                    ], {
                        color: '#fbbf24',
                        weight: 2,
                        dashArray: '5, 10',
                        opacity: 0.7
                    }).addTo(mapInstance).bindPopup("Vetor Direcional Predominante de Escoamento da Precipitação.");

                    // Varredura RainViewer
                    fetch('https://api.rainviewer.com/public/weather-maps.json')
                        .then(response => response.json())
                        .then(data => {
                            if (!data || !data.radar || !data.radar.past) return;
                            const radarFrames = data.radar.past;

                            radarFrames.forEach((frame) => {
                                const url = `https://tile.rainviewer.com${frame.path}/256/{z}/{x}/{y}/1/1_1.png`;
                                const layer = L.tileLayer(url, { opacity: 0.0 }).addTo(mapInstance);
                                radarLayers.push({ layer: layer, time: frame.time });
                            });

                            if (radarLayers.length > 0) {
                                currentFrameIndex = radarLayers.length - 1;
                                showFrame(currentFrameIndex);
                            }
                        })
                        .catch(err => {
                            console.warn("Erro no radar RainViewer:", err);
                            setTimeLabel("ERRO DE CONEXÃO");
                            setTimeColor("#ef4444");
                        });

                    const showFrame = (index) => {
                        radarLayers.forEach((obj, idx) => {
                            if (idx === index) {
                                obj.layer.setOpacity(0.8);
                                const date = new Date(obj.time * 1000);
                                const timeString = date.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
                                
                                if (index === radarLayers.length - 1) {
                                    setTimeLabel(timeString + " [AGORA]");
                                    setTimeColor("#38bdf8");
                                } else {
                                    setTimeLabel(timeString + " [HISTÓRICO]");
                                    setTimeColor("#fbbf24");
                                }
                            } else {
                                obj.layer.setOpacity(0.0);
                            }
                        });
                    };

                    window.toggleLeafletAnimation = () => {
                        if (animationInterval) {
                            clearInterval(animationInterval);
                            animationInterval = null;
                            setIsPlaying(false);
                            if (radarLayers.length > 0) {
                                currentFrameIndex = radarLayers.length - 1;
                                showFrame(currentFrameIndex);
                            }
                        } else {
                            if (radarLayers.length === 0) return;
                            setIsPlaying(true);
                            animationInterval = setInterval(() => {
                                currentFrameIndex++;
                                if (currentFrameIndex >= radarLayers.length) {
                                    currentFrameIndex = 0;
                                }
                                showFrame(currentFrameIndex);
                            }, 700);
                        }
                    };

                } catch (e) {
                    console.error("Erro ao iniciar Leaflet:", e);
                }

                return () => {
                    if (animationInterval) clearInterval(animationInterval);
                    if (mapInstance) mapInstance.remove();
                };
            }, []);

            return (
                <div className="relative w-full rounded-2xl overflow-hidden border-2 border-cyberCyan/50 shadow-2xl bg-[#040811] flex flex-col">
                    <div className="absolute top-4 left-16 z-[1000] bg-[rgba(4,8,17,0.95)] text-[#e2e8f0] p-3 rounded-md font-mono shadow-[0_0_15px_rgba(0,242,254,0.2)] border border-[#1e293b] w-[270px]">
                        <h3 className="m-0 mb-1 text-[13px] text-[#00f2fe] uppercase tracking-wider font-bold">VETOR SERRA &bull; SEBINHO</h3>
                        <p className="m-0 mb-2 text-[11px] text-[#64748b]">Origem: Serra do Mendanha &rarr; Alvo: Mesquita</p>
                        
                        <div className="bg-gradient-to-r from-[#76ff7b] via-[#fffb00] via-[#ff0000] to-[#ff00ff] h-2 rounded mb-1"></div>
                        <div className="flex justify-between text-[9px] text-[#94a3b8] mb-3">
                            <span>Fraca</span>
                            <span>Mod</span>
                            <span>Forte</span>
                            <span>Extrema</span>
                        </div>

                        <div className="text-[11px] bg-[#0f172a] p-1.5 border-l-3 border-[#ef4444] mb-3">
                            SCANNER: <span style={{ color: timeColor }} className="font-bold">{timeLabel}</span>
                        </div>

                        <button 
                            onClick={() => window.toggleLeafletAnimation && window.toggleLeafletAnimation()}
                            className="bg-[#0f172a] text-[#00f2fe] border border-[#00f2fe] py-2 px-3 rounded cursor-pointer font-mono font-bold text-[11px] w-full uppercase transition hover:bg-[#00f2fe] hover:text-[#040811]"
                        >
                            {isPlaying ? "Congelar Imagem" : "Iniciar Linha do Tempo"}
                        </button>
                    </div>

                    <div id="leaflet-map" style={{ width: '100%', height: '460px' }}></div>
                </div>
            );
        }

        function App() {
            const [activeTab, setActiveTab] = React.useState("dashboard");
            const [actionPlanOpen, setActionPlanOpen] = React.useState(false);
            const [pinInput, setPinInput] = React.useState("");
            const [isPlanUnlocked, setIsPlanUnlocked] = React.useState(false);
            const [selectedCategory, setSelectedCategory] = React.useState("Vídeos / Eventos e Registros");
            
            const [mediaList, setMediaList] = React.useState(() => {
                try {
                    const saved = localStorage.getItem("sarah_media_list_v52_final");
                    return saved ? JSON.parse(saved) : [];
                } catch {
                    return [];
                }
            });

            React.useEffect(() => {
                try {
                    localStorage.setItem("sarah_media_list_v52_final", JSON.stringify(mediaList));
                } catch (e) {
                    console.warn("Storage cheio", e);
                }
            }, [mediaList]);

            const [messages, setMessages] = React.useState([]);
            const [input, setInput] = React.useState("");
            const [isLoadingChat, setIsLoadingChat] = React.useState(false);
            const [toastMessage, setToastMessage] = React.useState(null);

            const showToast = (msg) => {
                setToastMessage(msg);
                setTimeout(() => setToastMessage(null), 3500);
            };

            const handleFileUpload = (e) => {
                const files = Array.from(e.target.files);
                files.forEach(file => {
                    const reader = new FileReader();
                    reader.onload = (uploadEvent) => {
                        const newRecord = {
                            id: Date.now() + Math.random(),
                            name: file.name,
                            size: (file.size / (1024 * 1024)).toFixed(2) + " MB",
                            type: file.type.startsWith('video') ? 'video' : 'document',
                            category: selectedCategory,
                            date: new Date().toLocaleDateString("pt-BR"),
                            url: uploadEvent.target.result
                        };
                        setMediaList(prev => [...prev, newRecord]);
                        showToast(`📁 Arquivo "${file.name}" salvo com sucesso!`);
                    };
                    reader.readAsDataURL(file);
                });
            };

            const removeMediaItem = (id) => {
                setMediaList(prev => prev.filter(item => item.id !== id));
                showToast("🗑️ Registro removido.");
            };

            const handleSendMessage = async () => {
                if (!input.trim() || isLoadingChat) return;

                const userMsg = {
                    id: `${Date.now()}-user`,
                    sender: "user",
                    text: input.trim(),
                    timestamp: new Date().toLocaleTimeString("pt-BR", { hour: "2-digit", minute: "2-digit" })
                };

                setMessages(prev => [...prev, userMsg]);
                setInput("");
                setIsLoadingChat(true);

                try {
                    const response = await fetch(CLOUDFLARE_WORKER_URL, {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({
                            model: "openai/gpt-oss-120b",
                            messages: [
                                { role: "system", content: "Você é a SARAH IA Core v5.2 PRO, Defesa Civil Comunitária (Grupo Comunitário A Chave da Esperança, Mesquita/RJ)." },
                                { role: "user", content: userMsg.text }
                            ],
                            temperature: 0.4,
                            max_tokens: 800
                        })
                    });

                    const data = await response.json();
                    const reply = data?.choices?.[0]?.message?.content || data?.message || "Sem resposta do servidor.";
                    
                    setMessages(prev => [...prev, {
                        id: `${Date.now()}-sarah`,
                        sender: "sarah",
                        text: reply,
                        timestamp: new Date().toLocaleTimeString("pt-BR", { hour: "2-digit", minute: "2-digit" })
                    }]);
                } catch (e) {
                    setMessages(prev => [...prev, {
                        id: `${Date.now()}-err`,
                        sender: "sarah",
                        text: "Erro de conexão com o cofre neural.",
                        timestamp: new Date().toLocaleTimeString("pt-BR", { hour: "2-digit", minute: "2-digit" })
                    }]);
                } finally {
                    setIsLoadingChat(false);
                }
            };

            return (

                            {toastMessage}
                        </div>
                    )}

                    <header className="glass-dark border-b border-cyberCyan/30 px-4 py-3 sticky top-0 z-40 shadow-xl">

                                        <span className="px-2 py-0.5 bg-cyberCyan/20 border border-cyberCyan/40 text-cyberCyan rounded-md font-mono text-[9px]">v5.2 PRO</span>
                                    </h1>
                                    <span className="text-[11px] text-cyberCyan font-mono">SARAH IA • Grupo Comunitário A Chave da Esperança (Mesquita/RJ)</span>

                            <button
                                onClick={() => setActiveTab("dashboard")}
                                className={`px-4 py-2 rounded-xl font-mono text-xs font-bold transition flex items-center gap-2 cursor-pointer ${
                                    activeTab === "dashboard"
                                        ? "bg-cyberCyan text-slate-950 shadow-[0_0_15px_rgba(0,243,255,0.5)] border border-cyan-200"
                                        : "bg-[#030712] text-cyberCyan border border-cyberCyan/30 hover:bg-cyberCyan/10"
                                }`}
                            >
                                <span>🛰️</span> Radar Tático Leaflet (Mendanhas & Sebinho)
                            </button>
                            <button
                                onClick={() => setActiveTab("chat")}
                                className={`px-4 py-2 rounded-xl font-mono text-xs font-bold transition flex items-center gap-2 cursor-pointer ${
                                    activeTab === "chat"
                                        ? "bg-cyberCyan text-slate-950 shadow-[0_0_15px_rgba(0,243,255,0.5)] border border-cyan-200"
                                        : "bg-[#030712] text-cyberCyan border border-cyberCyan/30 hover:bg-cyberCyan/10"
                                }`}
                            >
                                <span>💬</span> Central Neural (Chat)
                            </button>
                        </div>
                    </div>

                    <main className="max-w-5xl mx-auto p-3 sm:p-4 w-full flex-1 flex flex-col">
                        {activeTab === "dashboard" && (
                            <div className="space-y-4 flex-1 flex flex-col">
                                <div className="glass-dark rounded-3xl p-4 border border-cyberCyan/40 shadow-2xl flex flex-col justify-between">
                                    <div className="flex items-center justify-between mb-3 pb-2 border-b border-cyberCyan/30">
                                        <h3 className="font-mono text-cyberCyan text-xs font-bold flex items-center gap-2">
                                            <span>📡</span> Painel Radar Tático • Serra do Mendanha / Sebinho
                                        </h3>
                                        <span className="w-2.5 h-2.5 rounded-full bg-emeraldGlow animate-pulse"></span>
                                    </div>
                                    <LeafletTacticalRadarMap />
                                </div>
                            </div>
                        )}

                        {activeTab === "chat" && (
                            <div className="glass-dark rounded-3xl shadow-2xl flex flex-col overflow-hidden flex-1 border border-cyberCyan/40" style={{ minHeight: "520px" }}>
                                <div className="bg-[#030712]/90 px-4 py-2 border-b border-cyberCyan/30 flex items-center justify-between text-xs font-mono">
                                    <span className="text-cyberCyan font-bold">Chat Ativo • Grupo Comunitário A Chave da Esperança</span>
                                    <button onClick={() => setMessages([])} className="px-3 py-1 bg-slate-900 text-cyan-300 rounded-xl border border-cyberCyan/30 cursor-pointer">🧹 Limpar</button>
                                </div>

                                <div className="flex-1 overflow-y-auto p-4 space-y-4">
                                    {messages.length === 0 && (
                                        <div className="h-full flex flex-col items-center justify-center p-4">
                                            <div className="max-w-md bg-[#060f1e] border border-cyberCyan/40 rounded-3xl p-6 text-center shadow-xl">
                                                <SarahAvatar showStatus={true} isLarge={true} />
                                                <h2 className="font-mono text-base font-bold text-slate-100 mt-4 mb-2">SARAH IA • Nexus Core v5.2</h2>
                                                <p className="text-xs font-mono text-cyberCyan">"Prevenção não é mídia: é gente atenta."</p>
                                            </div>
                                        </div>
                                    )}

                                    {messages.map((m) => (
                                        <div key={m.id} className={`flex items-start gap-3 ${m.sender === "user" ? "flex-row-reverse" : "flex-row"}`}>
                                            {m.sender === "user" ? <div className="w-10 h-10 rounded-2xl bg-slate-800 border border-slate-700 flex items-center justify-center text-cyberCyan">👤</div> : <SarahAvatar size="w-10 h-10" showStatus={false} />}
                                            <div className={`p-4 rounded-3xl max-w-[85%] text-sm ${m.sender === "user" ? "bg-gradient-to-r from-cyan-600 to-emerald-600 text-white" : "bg-[#060f1e] text-slate-100 border border-cyberCyan/35"}`}>
                                                <div className="text-[10px] opacity-75 font-mono mb-1">{m.sender === "user" ? "Você" : "SARAH IA"} • {m.timestamp}</div>
                                                <div className="whitespace-pre-wrap">{m.text}</div>
                                            </div>
                                        </div>
                                    ))}

                                    {isLoadingChat && (
                                        <div className="flex items-center gap-3">
                                            <SarahAvatar size="w-10 h-10" showStatus={false} />
                                            <div className="bg-[#060f1e] p-3 rounded-2xl text-xs font-mono text-cyberCyan border border-cyberCyan/40 animate-pulse">SARAH IA a processar telemetria...</div>
                                        </div>
                                    )}
                                </div>

                                <div className="p-3 bg-[#030712] border-t border-cyberCyan/30 flex items-center gap-3">
                                    <input
                                        type="text"
                                        value={input}
                                        onChange={(e) => setInput(e.target.value)}
                                        onKeyDown={(e) => { if (e.key === "Enter") handleSendMessage(); }}
                                        placeholder="Digite seu comando para a SARAH IA..."
                                        className="flex-1 bg-[#060f1e] border border-cyberCyan/40 rounded-2xl px-4 py-3 text-sm text-slate-100 font-sans focus:outline-none"
                                    />
                                    <button onClick={handleSendMessage} disabled={isLoadingChat || !input.trim()} className="w-12 h-12 rounded-xl bg-gradient-to-r from-cyberCyan to-emeraldGlow text-slate-950 flex items-center justify-center font-bold cursor-pointer disabled:opacity-30">➤</button>
                                </div>
                            </div>
                        )}
                    </main>

                    {actionPlanOpen && (
                        <div className="fixed inset-0 bg-[#030712]/90 backdrop-blur-md z-50 flex items-center justify-center p-4">
                            <div className="glass-dark border border-cyberCyan/40 w-full max-w-3xl rounded-3xl shadow-2xl overflow-hidden flex flex-col max-h-[92vh]">
                                <div className="bg-[#030712] px-6 py-4 border-b border-cyberCyan/30 flex justify-between items-center">
                                    <h3 className="font-mono text-cyberCyan text-sm font-bold flex items-center gap-2">
                                        <span>🎬</span> Apresentações e Registros de Campo
                                    </h3>
                                    <button onClick={() => setActionPlanOpen(false)} className="text-slate-400 hover:text-white font-mono text-xs px-3 py-1 rounded-lg bg-[#030712] border border-slate-700 cursor-pointer">✕ Fechar</button>
                                </div>

                                <div className="p-6 space-y-5 overflow-y-auto">
                                    {!isPlanUnlocked ? (
                                        <div className="flex flex-col items-center text-center space-y-4 py-10">
                                            <div className="w-20 h-20 rounded-3xl bg-cyan-500/15 border-2 border-cyberCyan/60 flex items-center justify-center text-cyberCyan text-2xl">🔒</div>
                                            <div>
                                                <h4 className="font-bold text-slate-100 font-mono text-base">Painel de Registros Comunitários</h4>
                                                <p className="text-xs text-cyberCyan font-mono mt-1">Insira o PIN de segurança autorizado (24,25,30)</p>
                                            </div>
                                            <div className="w-full max-w-sm flex gap-2 pt-2">
                                                <input
                                                    type="password"
                                                    value={pinInput}
                                                    onChange={(e) => setPinInput(e.target.value)}
                                                    onKeyDown={(e) => {
                                                        if (e.key === "Enter" && (pinInput.trim() === "24,25,30" || pinInput.trim() === "24 25 30" || pinInput.trim() === "242530")) {
                                                            setIsPlanUnlocked(true);
                                                            showToast("🔓 Acesso liberado!");
                                                        }
                                                    }}
                                                    placeholder="Digite o PIN"
                                                    className="w-full bg-[#030712] border border-cyberCyan/40 rounded-2xl px-4 py-3 text-xs text-slate-100 font-mono focus:outline-none"
                                                />
                                                <button
                                                    onClick={() => {
                                                        if (pinInput.trim() === "24,25,30" || pinInput.trim() === "24 25 30" || pinInput.trim() === "242530") {
                                                            setIsPlanUnlocked(true);
                                                            showToast("🔓 Acesso liberado!");
                                                        } else {
                                                            showToast("❌ PIN incorreto.");
                                                        }
                                                    }}
                                                    className="px-6 py-3 bg-cyberCyan hover:bg-cyan-400 text-slate-950 font-mono text-xs font-bold rounded-2xl cursor-pointer"
                                                >
                                                    Liberar
                                                </button>
                                            </div>
                                        </div>
                                    ) : (
                                        <div className="space-y-5 font-sans text-xs">
                                            <div className="flex items-center justify-between bg-[#060f1e] p-3.5 rounded-2xl border border-cyberCyan/40 font-mono text-cyan-300">
                                                <span>✅ Apresentações e Registros Desbloqueados para Campo</span>
                                                <button onClick={() => setIsPlanUnlocked(false)} className="underline cursor-pointer">Bloquear Novamente</button>
                                            </div>

                                            <div className="grid grid-cols-1 sm:grid-cols-2 gap-4 bg-[#060f1e]/80 p-4 rounded-2xl border border-cyberCyan/30">
                                                <div className="space-y-2">
                                                    <label className="block font-mono text-slate-300 text-[11px]">🏷️ Categoria do Relatório / Evento:</label>
                                                    <select
                                                        value={selectedCategory}
                                                        onChange={(e) => setSelectedCategory(e.target.value)}
                                                        className="w-full bg-[#030712] border border-cyberCyan/40 rounded-xl p-2.5 text-xs text-cyan-300 font-mono focus:outline-none"
                                                    >
                                                        <option value="Vídeos / Eventos e Registros">🎬 Vídeos e Registros de Campo</option>
                                                        <option value="Ação Comunitária GACE">🤝 Ação Comunitária (GACE)</option>
                                                        <option value="Nota Técnica Universitária">🎓 Nota Técnica Universitária</option>
                                                    </select>
                                                </div>

                                                <div className="space-y-2">
                                                    <label className="block font-mono text-slate-300 text-[11px]">📥 Enviar Arquivo / Vídeo:</label>
                                                    <input
                                                        type="file"
                                                        multiple
                                                        accept="video/*,image/*,.pdf"
                                                        onChange={handleFileUpload}
                                                        className="w-full text-xs text-slate-400 file:mr-3 file:py-2 file:px-3 file:rounded-xl file:border-0 file:text-xs file:font-mono file:font-bold file:bg-cyberCyan file:text-slate-950 hover:file:bg-cyan-400 file:cursor-pointer bg-[#030712] p-2 rounded-xl border border-cyberCyan/30"
                                                    />
                                                </div>
                                            </div>

                                            <div className="space-y-3">
                                                <h4 className="font-mono text-xs font-bold text-slate-200">🎬 Registros Salvos em Campo ({mediaList.length}):</h4>
                                                {mediaList.length === 0 ? (
                                                    <div className="p-8 text-center text-slate-500 font-mono text-xs bg-[#060f1e]/50 rounded-2xl border border-slate-800">
                                                        Nenhum registro de campo adicionado ainda.
                                                    </div>
                                                ) : (
                                                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-4 max-h-[50vh] overflow-y-auto p-1">
                                                        {mediaList.map(item => (
                                                            <div key={item.id} className="bg-[#060f1e] border-2 border-cyberCyan/50 rounded-2xl p-3 flex flex-col justify-between shadow-lg">
                                                                <div className="flex items-center justify-between mb-2">
                                                                    <span className="px-2 py-0.5 rounded-md bg-[#030712] border border-cyberCyan/40 font-mono text-[10px] text-cyan-300 truncate max-w-[180px]">{item.category}</span>
                                                                    <button onClick={() => removeMediaItem(item.id)} className="text-slate-400 hover:text-red-400 font-mono text-xs cursor-pointer">🗑️ Excluir</button>
                                                                </div>
                                                                <div className="w-full bg-black rounded-xl overflow-hidden border border-cyberCyan/30 aspect-video mb-2 flex items-center justify-center">
                                                                    {item.type === 'video' ? <video src={item.url} className="w-full h-full object-contain" controls playsInline /> : <div className="text-cyan-300 font-mono text-xs">📄 Documento Salvo</div>}
                                                                </div>
                                                                <div className="font-mono text-[10px] text-slate-300 truncate font-bold text-cyan-200">{item.name}</div>
                                                            </div>
                                                        ))}
                                                    </div>
                                                )}
                                            </div>
                                        </div>
                                    )}
                                </div>
                            </div>
                        )}
                    )}

                    <div className="bg-vibrantLilac border-t-2 border-purple-500 py-2.5 overflow-hidden whitespace-nowrap">
                        <marquee behavior="scroll" direction="left" scrollamount="5" className="font-mono text-xs text-purple-200 font-bold">
                            🛡️ Grupo Comunitário A Chave da Esperança • Plano de Ação: Todos Unidos, Todos Protegidos • EMERGÊNCIAS: Defesa Civil (199 / 21 4040-1772) • Alertas ZAP 📲 (21) 97299-3223 • Seja voluntário servir é prevenir sempre
                        </marquee>
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById("root"));
        root.render(<App />);
    </script>
</body>
</html>
