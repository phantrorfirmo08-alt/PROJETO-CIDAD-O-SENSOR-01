    .trim();

  const frases = cleanText.split(/(?<=[.!?])\s+/).filter(Boolean);
  let delay = 0;

    const variacao = (Math.random() - 0.5) * perfil.variacao;

    u.rate = perfil.rate + variacao;
    u.volume = perfil.volume;

    setTimeout(() => window.speechSynthesis.speak(u), delay);
    delay += (frase.length * 45) + perfil.pausaFrase;

    const promptCompleto = promptFinal + "\n\nUsuário " + nomeOperador + " em " + (municipioAtual || 'Mesquita') + " disse: " + ultimaMensagem;
    const aiRes = await fetch("https://text.pollinations.ai/" + encodeURIComponent(promptCompleto));
    if (aiRes.ok) {
      let t = await aiRes.text();
      if (t && t.trim().length > 0) {
        globalSaudacaoEmitida = true;
        t = t.replace(/[*#]/g, '').replace(/cerquilha/gi, '').replace(/asterisco/gi, '');
        return t.trim();
      }
    }
  } catch (e) {}

  globalSaudacaoEmitida = true;
  return `Calma, ${nomeOperador}, tô contigo aqui na escuta. Vamo resolver isso junto agora.`;
}

export function ChatTaticoFuturista({ perfilVozId, userName }) {
  const [textoChat, setTextoChat] = React.useState('');
  const [gravandoMic, setGravandoMic] = React.useState(false);
  const [mensagensChat, setMensagensChat] = React.useState([
    { remetente: 'sarah', texto: 'Central de Alerta pronta. Sistema de voz e telemetria sincronizados.' }
  ]);
  const [isProcessing, setIsProcessing] = React.useState(false);
  const chatScrollRef = React.useRef(null);

  React.useEffect(() => {
    if(chatScrollRef.current) {
      chatScrollRef.current.scrollTop = chatScrollRef.current.scrollHeight;
    }
  }, [mensagensChat, isProcessing]);

  const handleEnviar = async (e) => {
    e.preventDefault();
    if (!textoChat.trim() || isProcessing) return;
    const termo = textoChat.trim();
    setTextoChat('');
    setMensagensChat(prev => [...prev, { remetente: 'operador', texto: termo }]);
    setIsProcessing(true);

    try {
      const historico = mensagensChat.map(m => ({
        role: m.remetente === 'operador' ? 'user' : 'assistant',
        content: m.texto
      }));
      historico.push({ role: 'user', content: termo });

      const respostaSarah = await chamarSarahGroq(historico, "Mesquita", "Rocha Sobrinho", "Chat", {}, userName || "Alexander");
      setMensagensChat(prev => [...prev, { remetente: 'sarah', texto: respostaSarah }]);
      falarSarah(respostaSarah, perfilVozId);
    } catch (err) {
      const respErro = `Calma, ${userName || 'Alexander'}, deu uma instabilidade aqui, mas tô na escuta. Vamo tentar de novo.`;
      setMensagensChat(prev => [...prev, { remetente: 'sarah', texto: respErro }]);
      falarSarah(respErro, perfilVozId);
    } finally {
      setIsProcessing(false);
    }
  };

  const handleMicSimulado = () => {
    const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SpeechRec) {
      setGravandoMic(true);
      setTimeout(() => {
        setGravandoMic(false);
        const txtSimulado = "Qual o status das chuvas e bacias em Mesquita?";
        setTextoChat(txtSimulado);
      }, 1500);
      return;
    }
    try {
      const rec = new SpeechRec();
      rec.lang = "pt-BR";
      rec.onstart = () => setGravandoMic(true);
      rec.onresult = (event) => {
        let final = event.results[0][0].transcript;
        if (final) {
          setTextoChat(final);
          setGravandoMic(false);
        }
      };
      rec.onerror = () => setGravandoMic(false);
      rec.onend = () => setGravandoMic(false);
      rec.start();
    } catch (e) {
      setGravandoMic(false);
    }
  };

  const perfilObj = PERFIS_VOZ_OFICIAIS.find(p => p.id === perfilVozId) || PERFIS_VOZ_OFICIAIS[0];

  return (
    <div style={{ background: '#020617', border: '1px solid #00F2FE44', borderRadius: 12, padding: 10, marginTop: 10, fontFamily: 'monospace', color: '#fff' }}>
      <div style={{ display: 'flex', justifyContent: 'space-between', fontSize: 9, color: '#00F2FE', fontWeight: 'bold', marginBottom: 6 }}>
        <span>CHAT SARAH AI // VOZ: {perfilObj.nome} ({perfilObj.cargo})</span>
        <span style={{ color: '#00FF88' }}>ONLINE</span>
      </div>

      <div ref={chatScrollRef} style={{ height: '140px', overflowY: 'auto', background: '#0A1B38', borderRadius: 8, padding: 8, marginBottom: 8, display: 'flex', flexDirection: 'column', gap: 6, fontSize: 9 }}>
        {mensagensChat.map((m, i) => (
          <div key={i} style={{ alignSelf: m.remetente === 'operador' ? 'flex-end' : 'flex-start', background: m.remetente === 'operador' ? '#0072FF33' : '#1f2937', border: '1px solid #374151', padding: '6px 8px', borderRadius: 8, maxWidth: '85%' }}>
            {m.texto}
          </div>
        ))}
        {isProcessing && (
          <div style={{ alignSelf: 'flex-start', background: '#1f2937', border: '1px solid #374151', padding: '6px 8px', borderRadius: 8, color: '#00F2FE' }}>
            Sarah processando...
          </div>
        )}
      </div>

      <form onSubmit={handleEnviar} style={{ display: 'flex', gap: 6, alignItems: 'center' }}>
        <button
          type="button"
          onMouseDown={handleMicSimulado}
          style={{ 
            background: gravandoMic ? '#FF2D55' : '#111827', 
            color: gravandoMic ? '#fff' : '#00F2FE', 
            border: '1px solid #00F2FE', 
            borderRadius: 10, 
            width: '36px', 
            height: '36px', 
            display: 'flex', 
            alignItems: 'center', 
            justifyContent: 'center', 
            cursor: 'pointer',
            boxShadow: gravandoMic ? '0 0 10px #FF2D55' : 'none'
          }}
          title="Segure para falar (Gemini Audio Input)"
        >
          <IconeMicrofone />
        </button>
        <input 
          type="text" 
          placeholder="Comande a Sarah (GPT Pro Engine)..." 
          value={textoChat} 
          onChange={e => setTextoChat(e.target.value)} 
          style={{ flex: 1, background: '#0A1B38', border: '1px solid #374151', color: '#fff', padding: '8px', borderRadius: 8, fontSize: 9, fontFamily: 'monospace' }} 
        />
        <button type="submit" style={{ background: 'linear-gradient(135deg,#00F2FE,#0072FF)', color: '#030712', border: 0, borderRadius: 10, width: '36px', height: '36px', display: 'flex', alignItems: 'center', justify-content: 'center', cursor: 'pointer' }}>
          <IconeEnviar />
        </button>
      </form>
    </div>
  );
}

// ===== ROBÔ AUTÔNOMO 24/7 DE MONITORAMENTO CLIMÁTICO =====
function useRoboClimatico24h(municipioAtual) {
  const [ultimoAlertaRobo, setUltimoAlertaRobo] = useState('Robo Climatico 24/7: Sincronizado e monitorando.');

  useEffect(() => {
    const rodarVerificacao = async () => {
      try {
        const m = MUNICIPIOS_92.find(item => item.n === municipioAtual) || MUNICIPIOS_92[0];
        const res = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${m.lat}&longitude=${m.lon}&current=temperature_2m,relative_humidity_2m,precipitation,wind_speed_10m&timezone=America%2FSao_Paulo`);
        const data = await res.json();
        if (data && data.current) {
          const ch = data.current.precipitation;
          const vt = data.current.wind_speed_10m;
          if (ch > 2.0 || vt > 40) {
            const alertaStr = `Robo 24/7 [Alerta Meteorologico]: Chuva de ${ch}mm e ventos de ${vt}km/h detectados em ${m.n}.`;
            setUltimoAlertaRobo(alertaStr);
          } else {
            setUltimoAlertaRobo(`Robo 24/7 [Normalidade]: ${m.n} com chuva ${ch}mm e vento ${vt}km/h.`);
          }
        }
      } catch (e) {
        setUltimoAlertaRobo('Robo 24/7: Telemetria operando em modo resiliente local.');
      }
    };

    rodarVerificacao();
    const intervalId = setInterval(rodarVerificacao, 60000); // Executa verificação a cada 1 minuto contínuo
    return () => clearInterval(intervalId);
  }, [municipioAtual]);

  return ultimoAlertaRobo;
}

                setRotas(r);

        carregarRotas();

  const [monitores, setMonitores] = React.useState(() => JSON.parse(localStorage.getItem('monitoresCADE') || '[]'));
  const [bloqueados, setBloqueados] = React.useState(() => JSON.parse(localStorage.getItem('monitoresBloqueadosCADE') || '[]'));
  const [mNome, setMNome] = React.useState('');
  const [mZap, setMZap] = React.useState('');
  const [mSenha, setMSenha] = React.useState('');
  const [mMun, setMMun] = React.useState('');
  const [mBairro, setMBairro] = React.useState('');
  const [mFuncao, setMFuncao] = React.useState('Monitor do Tempo');
  const [mObs, setMObs] = React.useState('');
  const [filtroMon, setFiltroMon] = React.useState('');

  const salvarRota = () => {
    if(!rNome.trim() || !rEnd.trim()) { showToast('Escreve o nome e o endereço.'); return; }
    const nova = { nome: rNome.trim(), endereco: rEnd.trim(), info: rInfo.trim(), tipo: rTipo };
    const atualizadas = [...rotas, nova];
    setRotas(atualizadas);
    localStorage.setItem('rotasFugaReais', JSON.stringify(atualizadas));
    setRNome(''); setREnd(''); setRInfo('');
    showToast('Rota salva! Já vai aparecer na Estação.');
  };

  const excluirRota = (i) => {
    if(!confirm('Excluir essa rota?')) return;
    const atualizadas = [...rotas];
    atualizadas.splice(i, 1);
    setRotas(atualizadas);
    localStorage.setItem('rotasFugaReais', JSON.stringify(atualizadas));
  };

  const cadastrarMonitor = () => {
    if(!mNome.trim() || !mMun || !mBairro.trim() || !mSenha.trim()) { showToast('Preencha nome, município, bairro e crie a senha.'); return; }
    let c = parseInt(localStorage.getItem('contadorMonitorCADE') || '0') + 1;
    localStorage.setItem('contadorMonitorCADE', c);
    const idGerado = 'GADE-M-' + String(c).padStart(3, '0');
    const novoM = { id: idGerado, nome: mNome.trim(), zap: mZap.trim(), senha: mSenha.trim(), municipio: mMun, bairro: mBairro.trim(), funcao: mFuncao, obs: mObs.trim(), data: new Date().toLocaleString('pt-BR') };
    const atualizados = [...monitores, novoM];
    setMonitores(atualizados);
    localStorage.setItem('monitoresCADE', JSON.stringify(atualizados));
    setMNome(''); setMZap(''); setMSenha(''); setMBairro(''); setMObs('');
    showToast(`Monitor cadastrado: ${idGerado}`);
  };

  const bloquearMonitor = (idx) => {
    const x = monitores[idx];
    const motivo = prompt(`Excluindo ${x.nome} - ${x.id}\nMotivo? Ex: mau uso`);
    if(motivo === null) return;
    if(!confirm(`CONFIRMAR BLOQUEIO?\n\n${x.id} - ${x.nome}`)) return;
    const l = [...monitores]; l.splice(idx, 1);
    setMonitores(l); localStorage.setItem('monitoresCADE', JSON.stringify(l));
    const bb = [...bloqueados, { ...x, motivo: motivo || 'Sem motivo', dataBloqueio: new Date().toLocaleString('pt-BR') }];
    setBloqueados(bb); localStorage.setItem('monitoresBloqueadosCADE', JSON.stringify(bb));
    showToast(`Monitor ${x.id} bloqueado.`);
  };

  const desbloquearMonitor = (idx) => {
    const x = bloqueados[idx];
    if(!confirm(`Desbloquear ${x.id} - ${x.nome}?`)) return;
    const bb = [...bloqueados]; bb.splice(idx, 1);
    setBloqueados(bb); localStorage.setItem('monitoresBloqueadosCADE', JSON.stringify(bb));
    const l = [...monitores, { id: x.id, nome: x.nome, zap: x.zap, senha: x.senha, municipio: x.municipio, bairro: x.bairro, funcao: x.funcao, obs: x.obs, data: x.data }];
    setMonitores(l); localStorage.setItem('monitoresCADE', JSON.stringify(l));

    if(navigator.clipboard) navigator.clipboard.writeText(msg).catch(()=>{});
    showToast('Lista copiada sem senha! Abrindo WhatsApp.');
    window.open('https://chat.whatsapp.com/D1wrk9nTBH57Wya2Uv44ZW', '_blank');
  };

  const monitoresFiltrados = monitores.filter(x => (x.id + ' ' + x.nome + ' ' + x.municipio + ' ' + x.bairro).toLowerCase().includes(filtroMon.toLowerCase()));

  return (
    <div id="cadeAdmin" style={{background:'#021a2a', border:'1px solid #00e5ff', borderRadius:'16px', padding:'14px', fontFamily:'sans-serif'}}>

        ÁREA RESTRITA - GADE
      </b>
      <div style={{color:'#fff', fontSize:'12px', opacity:.8}}>GADE - Grupo a Chave da Esperança / Projeto Cidadão Sensor</div>
      <div style={{color:'#ffcc00', fontSize:'12px', marginTop:'4px'}}>Nenhuma rota oficial. Aguardando órgãos oficiais ou cadastramento do GADE.</div>
      
      <div style={{marginTop: '12px', marginBottom: '12px'}}>
        <SeletorVozGlobal perfilVozId={perfilVozId} setPerfilVozId={setPerfilVozId} />
      </div>

      <div style={{display:'flex', gap:'8px', marginTop:'12px'}}>

        <button onClick={() => setAbaAtiva('monitor')} style={{flex:1, background: abaAtiva==='monitor'?'#00ff88':'#041e2e', color: abaAtiva==='monitor'?'#000':'#fff', fontWeight:'bold', border:'1px solid #00e5ff', padding:'12px', borderRadius:'10px', cursor:'pointer'}}>MONITORES</button>

        localStorage.setItem('cadeNomeSOS', sosNome);

    const sosCADE = (tipo) => {
        salvarNomeSOS();
        setStatusSOS('Pegando seu GPS... copiando mensagem...');
        const nomeFinal = sosNome.trim() || userName || 'Morador(a)';
        const base = `SOS ${tipo} - GADE / CIDADÃO SENSOR\nNome: ${nomeFinal}\nBairro: Rocha Sobrinho / BNH / Banco de Areia - Mesquita RJ\n${sosObs ? 'Obs: '+sosObs+'\n' : ''}Projeto: GADE - Grupo a Chave da Esperança / Projeto Cidadão Sensor`;
        
        const finalizar = (gpsTxt) => {
            const ultimaMsg = base + gpsTxt;
            if(navigator.clipboard) navigator.clipboard.writeText(ultimaMsg).catch(()=>{});
            const agoraStr = tipo + ' - ' + new Date().toLocaleString('pt-BR');
            localStorage.setItem('cadeUltimoSOS', agoraStr);
            setHistoricoSOS('Último SOS: ' + agoraStr);

        if(navigator.geolocation){
            navigator.geolocation.getCurrentPosition(
                p => finalizar(`\nGPS: https://maps.google.com/?q=${p.coords.latitude},${p.coords.longitude}`),
                () => finalizar('\nGPS: não disponível'),

    });

    const [kitExtras, setKitExtras] = React.useState(() => {
        try { return JSON.parse(localStorage.getItem('kitCADEextras') || '[]'); } catch(e){ return []; }

    const [novoItem, setNovoItem] = React.useState('');

function BalancaESGModule({ showToast }) {
  const MATERIAIS = [
    { id: 'pet', nome: 'Plástico PET / Embalagens', aguaPorKg: 18, co2PorKg: 1.5, pontosKg: 15 },
    { id: 'aluminio', nome: 'Alumínio / Latinhas', aguaPorKg: 40, co2PorKg: 9.0, pontosKg: 35 },
    { id: 'papelao', nome: 'Papelão / Papel', aguaPorKg: 26, co2PorKg: 1.1, pontosKg: 10 },
    { id: 'ferro', nome: 'Sucata Ferrosa / Metal', aguaPorKg: 15, co2PorKg: 1.8, pontosKg: 12 },
    { id: 'vidro', nome: 'Vidro Retornável / Caco', aguaPorKg: 8, co2PorKg: 0.4, pontosKg: 8 },
    { id: 'oleo', nome: 'Óleo de Cozinha Usado (Litros)', aguaPorKg: 25000, co2PorKg: 2.5, pontosKg: 50 }
  ];

  const [pesagens, setPesagens] = useState(() => {
    try { return JSON.parse(localStorage.getItem('raru_balanca_esg') || '[]'); } catch(e) { return []; }
  });
  const [matId, setMatId] = useState('pet');
  const [pesoKg, setPesoKg] = useState('');
  const [coletor, setColetor] = useState('');

  const registrarPesagem = (e) => {
    e.preventDefault();
    const val = parseFloat(String(pesoKg).replace(',', '.'));
    if (!val || val <= 0) {
      showToast('Informe um peso válido em kg ou litros.');
      return;
    }
    const mat = MATERIAIS.find(m => m.id === matId) || MATERIAIS[0];
    const registro = {
      id: Date.now(),
      material: mat.nome,
      peso: val,
      aguaSalva: Math.round(val * mat.aguaPorKg),
      co2Evitado: +(val * mat.co2PorKg).toFixed(2),
      pontos: Math.round(val * mat.pontosKg),
      coletor: coletor.trim() || 'Ponto Comunitário GADE',
      data: new Date().toLocaleDateString('pt-BR')
    };
    const atual = [registro, ...pesagens];
    setPesagens(atual);
    localStorage.setItem('raru_balanca_esg', JSON.stringify(atual));
    setPesoKg('');
    showToast(`Pesagem registrada: +${registro.pontos} pts ESG!`);
  };

  const totalPeso = pesagens.reduce((acc, p) => acc + p.peso, 0);
  const totalAgua = pesagens.reduce((acc, p) => acc + p.aguaSalva, 0);
  const totalCo2 = pesagens.reduce((acc, p) => acc + p.co2Evitado, 0);
  const bueirosProtegidos = Math.max(1, Math.floor(totalPeso / 12));

  return (
    <div className="cyber-card">
      <h2 className="font-display text-sm md:text-base font-extrabold text-cyberGreen uppercase flex items-center gap-2 mb-3">
        <IconBalanca className="w-5 h-5" /> BALANÇA COMUNITÁRIA & IMPACTO ESG
      </h2>

      <div className="grid grid-cols-2 md:grid-cols-4 gap-2 mb-4 font-mono text-center">
        <div className="bg-deepSpace border border-cyberGreen/40 rounded-xl p-2.5">
          <div className="text-[10px] text-slate-400">RESÍDUO DESVIADO</div>
          <div className="text-base font-extrabold text-cyberGreen">{totalPeso.toFixed(1)} kg</div>
        </div>
        <div className="bg-deepSpace border border-cyberCyan/40 rounded-xl p-2.5">
          <div className="text-[10px] text-slate-400">ÁGUA PRESERVADA</div>
          <div className="text-base font-extrabold text-cyberCyan">{totalAgua.toLocaleString('pt-BR')} L</div>
        </div>
        <div className="bg-deepSpace border border-cyberBlue/40 rounded-xl p-2.5">
          <div className="text-[10px] text-slate-400">CO2 EVITADO</div>
          <div className="text-base font-extrabold text-cyberBlue">{totalCo2.toFixed(1)} kg</div>
        </div>
        <div className="bg-deepSpace border border-cyberAmber/40 rounded-xl p-2.5">
          <div className="text-[10px] text-slate-400">BUEIROS PROTEGIDOS</div>
          <div className="text-base font-extrabold text-cyberAmber">{bueirosProtegidos} un.</div>
        </div>
      </div>

      <form onSubmit={registrarPesagem} className="grid grid-cols-1 md:grid-cols-4 gap-2 mb-3">
        <select
          value={matId}
          onChange={e => setMatId(e.target.value)}
          className="bg-deepSpace border border-cyberGreen/40 rounded-xl px-3 py-2.5 text-xs text-white"
        >
          {MATERIAIS.map(m => <option key={m.id} value={m.id}>{m.nome}</option>)}
        </select>
        <input
          type="number"
          step="0.1"
          value={pesoKg}
          onChange={e => setPesoKg(e.target.value)}
          placeholder="Peso (kg) ou Litros"
          className="bg-deepSpace border border-cyberGreen/40 rounded-xl px-3 py-2.5 text-xs text-white"
        />
        <input
          type="text"
          value={coletor}
          onChange={e => setColetor(e.target.value)}
          placeholder="Nome do Morador / Coletor"
          className="bg-deepSpace border border-cyberGreen/40 rounded-xl px-3 py-2.5 text-xs text-white"
        />
        <button type="submit" className="cyber-button-solid text-xs">
          PESAR E REGISTRAR
        </button>
      </form>

      <div className="space-y-1.5 max-h-[200px] overflow-y-auto">
        {pesagens.map(p => (
          <div key={p.id} className="flex justify-between items-center bg-deepSpace/80 border border-slate-800 rounded-lg px-3 py-2 text-xs font-mono">
            <div>
              <span className="text-white font-bold">{p.material}</span> ({p.peso} kg)
              <div className="text-[10px] text-slate-400">{p.coletor} • {p.data}</div>
            </div>
            <span className="text-cyberGreen font-bold">+{p.pontos} PTS</span>
          </div>
        ))}
      </div>
    </div>
  );
}

                <div className="cyber-card !mb-0">
                  <div className="font-mono text-[10px] text-cyberAmber font-bold uppercase mb-2">
                    IDENTIFICAÇÃO DO OPERADOR DE CAMPO
                  </div>
                  <div className="grid grid-cols-2 gap-2">
                    <input
                      type="text"
                      value={userName}
                      onChange={e => { setUserName(e.target.value); localStorage.setItem('raru_operador_nome', e.target.value); }}
                      placeholder="Seu Nome"
                      className="bg-deepSpace border border-cyberCyan/40 rounded-xl px-3 py-2 text-xs text-white"
                    />
                    <input
                      type="text"
                      value={bairroAtual}
                      onChange={e => setBairroAtual(e.target.value)}
                      placeholder="Bairro / Comunidade"
                      className="bg-deepSpace border border-cyberCyan/40 rounded-xl px-3 py-2 text-xs text-white"
                    />
                  </div>
                </div>
              </div>
            </div>
            <RadarMeteorologicoModule showToast={showToast} />
          </>
        )}

        {aba === 'radar' && <RadarMeteorologicoModule showToast={showToast} />}

        {aba === 'estacao' && (
          <>
            <EstacaoGADEModule
              showToast={showToast}
              userName={userName}
              soundEnabled={soundEnabled}
              perfilVozId={perfilVozId}
            />
            <PainelRotasEstacaoPublica />
          </>
        )}

        {aba === 'vistoria' && (
          <VistoriaComunitariaModule
            showToast={showToast}
            municipioAtual={municipioAtual}
            userName={userName}
          />
        )}

        {aba === 'balanca' && <BalancaESGModule showToast={showToast} />}

        {aba === 'sobre' && <InstitucionalModule showToast={showToast} />}

        {aba === 'admin' && (
          adminLiberado ? (
            <CadeAdminModule
              showToast={showToast}
              perfilVozId={perfilVozId}
              setPerfilVozId={setPerfilVozId}
            />
          ) : (
            <div className="cyber-card max-w-md mx-auto text-center">
              <h2 className="font-display text-sm font-bold text-cyberCyan mb-2">
                ACESSO RESTRITO • COORDENAÇÃO GADE
              </h2>
              <p className="text-xs text-slate-300 mb-3">
                Insira a chave operacional para gerenciar rotas de fuga e cadastro de monitores.
              </p>
              <form onSubmit={verificarLoginAdmin} className="space-y-2.5">
                <input
                  type="password"
                  value={senhaAdminInput}
                  onChange={e => setSenhaAdminInput(e.target.value)}
                  placeholder="Chave de Acesso"
                  className="w-full bg-deepSpace border border-cyberCyan/50 rounded-xl px-3 py-2.5 text-xs text-white text-center"
                />
                <button type="submit" className="cyber-button-solid w-full text-xs">
                  DESBLOQUEAR SALA RESTRITA
                </button>
              </form>
            </div>
          )
        )}
      </main>

      {chatAberto && (
        <div className="fixed bottom-40 right-4 z-50 w-[330px] max-w-[92vw] shadow-2xl">
          <ChatTaticoFuturista perfilVozId={perfilVozId} userName={userName} />
        </div>
      )}
      <SarahFabButton openSarahChat={() => setChatAberto(c => !c)} isSpeaking={isSpeaking} />

      <nav className="fixed bottom-0 left-0 right-0 z-40 bg-void/95 backdrop-blur-md border-t border-cyberCyan/40 px-2 py-2">
        <div className="max-w-4xl mx-auto flex justify-around items-center gap-1 overflow-x-auto">
          {navItems.map(({ id, label, Icon }) => {
            const ativo = aba === id;
            return (
              <button
                key={id}
                onClick={() => setAba(id)}
                className={`flex flex-col items-center justify-center px-2.5 py-1.5 rounded-xl min-w-[64px] transition ${ativo ? 'bg-cyberCyan/20 text-cyberCyan border border-cyberCyan/60' : 'text-slate-400 hover:text-white'}`}
              >
                <Icon className="w-4 h-4 mb-0.5" />
                <span className="font-mono text-[9px] font-bold uppercase whitespace-nowrap">{label}</span>
              </button>
            );
          })}
        </div>
      </nav>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
</script>
</body>
</html>
