<!DOCTYPE html>
<html lang="pt-BR" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SARAH AI Core v4.0 - Defesa Civil Mesquita</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            dark: '#020617',
                            light: '#f8fafc'
                        }
                    }
                }
            }
        }
    </script>
    
    <!-- React & Babel -->
    <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- Leaflet CSS & JS for Map -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin=""/>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>

    <!-- Chart.js for River Metrics -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <!-- PWA Manifest & Meta -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#020617">
</head>
<body class="min-h-screen bg-slate-950 text-slate-100 transition-colors duration-300 flex flex-col justify-between">
    <div id="root"></div>

    <script type="text/babel">
        function App() {
            const [userName, setUserName] = React.useState('Alexander');
            const [hfApiKey, setHfApiKey] = React.useState(() => localStorage.getItem('hf_api_key') || '');
            const [keySavedStatus, setKeySavedStatus] = React.useState(() => !!localStorage.getItem('hf_api_key'));
            
            const [darkMode, setDarkMode] = React.useState(true);
            const [fontSizeLevel, setFontSizeLevel] = React.useState(1); // 0: Pequena, 1: Normal, 2: Grande, 3: Extragrande
            const [soundEnabled, setSoundEnabled] = React.useState(true);
            const [isSpeaking, setIsSpeaking] = React.useState(false);
            const [isListening, setIsListening] = React.useState(false);

            const [liveWeather, setLiveWeather] = React.useState(null);
            const [deferredPrompt, setDeferredPrompt] = React.useState(null);

            const [mapOpen, setMapOpen] = React.useState(false);
            const [chartOpen, setChartOpen] = React.useState(false);
            const [termsOpen, setTermsOpen] = React.useState(false);

            const [messages, setMessages] = React.useState([
                {
                    id: '1',
                    sender: 'sarah',
                    text: `Olá, Alexander. SARAH AI Core v4.0 ativa com raciocínio amplo, jurídico e comunitário. Conectada à Bacia do Sarapuí (Rocha Sobrinho / Sebinho), dados meteorológicos em tempo real, além de diretrizes de programas sociais e habitacionais. Insira sua HF API Key acima para iniciar.`,
                    timestamp: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
                }
            ]);
            const [input, setInput] = React.useState('');
            const [isLoadingChat, setIsLoadingChat] = React.useState(false);

            const mapRef = React.useRef(null);
            const mapInstanceRef = React.useRef(null);
            const chartRef = React.useRef(null);
            const chartInstanceRef = React.useRef(null);

            // Capturar evento de instalação PWA
            React.useEffect(() => {
                const handleBeforeInstall = (e) => {
                    e.preventDefault();
                    setDeferredPrompt(e);
                };
                window.addEventListener('beforeinstallprompt', handleBeforeInstall);
                return () => window.removeEventListener('beforeinstallprompt', handleBeforeInstall);
            }, []);

            const handleInstallApp = async () => {
                if (deferredPrompt) {
                    deferredPrompt.prompt();
                    const choiceResult = await deferredPrompt.userChoice;
                    if (choiceResult.outcome === 'accepted') {
                        console.log('Usuário aceitou instalar o aplicativo');
                    }
                    setDeferredPrompt(null);
                } else {
                    alert("Para instalar o aplicativo no seu dispositivo, acesse o menu do seu navegador (três pontos) e selecione 'Adicionar à tela inicial' ou 'Instalar aplicativo'.");
                }
            };

            const handleShareLink = async () => {
                const shareData = {
                    title: 'SARAH AI Core v4.0 - Defesa Civil Mesquita',
                    text: 'Acesse a SARAH AI Core v4.0 - Monitoramento Preventivo da Bacia do Rio Sarapuí e Programas Sociais/Habitacionais.',
                    url: window.location.href,
                };
                if (navigator.share) {
                    try {
                        await navigator.share(shareData);
                    } catch (err) {
                        console.log('Compartilhamento cancelado ou não suportado', err);
                    }
                } else {
                    navigator.clipboard.writeText(window.location.href);
                    alert("📋 Link da aplicação copiado para a área de transferência com sucesso!");
                }
            };

            React.useEffect(() => {
                fetch('https://api.open-meteo.com/v1/forecast?latitude=-22.7845&longitude=-43.4140&current=temperature_2m,relative_humidity_2m,precipitation,weather_code')
                    .then(res => res.json())
                    .then(data => {
                        if (data && data.current) {
                            setLiveWeather(data.current);
                        }
                    })
                    .catch(err => console.log('Aviso: Não foi possível carregar o clima em tempo real.', err));
            }, []);

            const handleSaveApiKey = () => {
                if (!hfApiKey.trim()) {
                    alert("Por favor, insira uma chave válida da Hugging Face.");
                    return;
                }
                localStorage.setItem('hf_api_key', hfApiKey.trim());
                setKeySavedStatus(true);
                alert("🔒 Chave da API salva permanentemente no navegador com sucesso!");
            };

            React.useEffect(() => {
                const rootHtml = document.documentElement;
                if (darkMode) {
                    rootHtml.classList.add('dark');
                    rootHtml.classList.remove('light');
                } else {
                    rootHtml.classList.remove('dark');
                    rootHtml.classList.add('light');
                }
            }, [darkMode]);

            React.useEffect(() => {
                if (mapOpen && mapRef.current && !mapInstanceRef.current) {
                    const lat = -22.7845;
                    const lng = -43.4140;
                    const map = L.map(mapRef.current).setView([lat, lng], 16);
                    
                    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                        maxZoom: 19,
                        attribution: '© OpenStreetMap contributors | SARAH AI Core v4.0'
                    }).addTo(map);

                    L.marker([lat, lng]).addTo(map)
                        .bindPopup('<b>Setor Crítico:</b> Rua Amazonas / Comunidade do Sebinho - Rocha Sobrinho, Mesquita')
                        .openPopup();

                    mapInstanceRef.current = map;
                } else if (mapOpen && mapInstanceRef.current) {
                    mapInstanceRef.current.invalidateSize();
                }
            }, [mapOpen]);

            React.useEffect(() => {
                if (chartOpen && chartRef.current && !chartInstanceRef.current) {
                    const ctx = chartRef.current.getContext('2d');
                    chartInstanceRef.current = new Chart(ctx, {
                        type: 'line',
                        data: {
                            labels: ['00:00', '03:00', '06:00', '09:00', '12:00', '15:00', '18:00', 'Atual'],
                            datasets: [{
                                label: 'Cota do Rio Sarapuí (m) - [Telemetria e Simulação]',
                                data: [0.8, 0.9, 0.85, 0.92, 1.1, 1.0, 0.95, liveWeather ? (0.9 + (liveWeather.precipitation * 0.2)) : 0.9],
                                borderColor: '#06b6d4',
                                backgroundColor: 'rgba(6, 182, 212, 0.1)',
                                borderWidth: 2,
                                fill: true,
                                tension: 0.3
                            }]
                        },
                        options: {
                            responsive: true,
                            maintainAspectRatio: false,
                            scales: {
                                y: {
                                    beginAtZero: true,
                                    max: 4.0,
                                    grid: { color: 'rgba(148, 163, 184, 0.1)' },
                                    ticks: { color: '#94a3b8', font: { family: 'monospace', size: 10 } }
                                },
                                x: {
                                    grid: { color: 'rgba(148, 163, 184, 0.1)' },
                                    ticks: { color: '#94a3b8', font: { family: 'monospace', size: 10 } }
                                }
                            },
                            plugins: {
                                legend: { labels: { color: '#e2e8f0', font: { family: 'monospace', size: 11 } } }
                            }
                        }
                    });
                }
            }, [chartOpen, liveWeather]);

            const speakText = (text) => {
                if (!soundEnabled || !('speechSynthesis' in window)) return;
                window.speechSynthesis.cancel();
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'pt-BR';
                utterance.pitch = 1.0;
                utterance.rate = 1.0;
                utterance.onstart = () => setIsSpeaking(true);
                utterance.onend = () => setIsSpeaking(false);
                utterance.onerror = () => setIsSpeaking(false);
                window.speechSynthesis.speak(utterance);
            };

            const toggleListening = () => {
                const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
                if (!SpeechRec) {
                    alert("Seu navegador não suporta reconhecimento de voz.");
                    return;
                }
                if (isListening) {
                    setIsListening(false);
                    return;
                }
                const rec = new SpeechRec();
                rec.lang = 'pt-BR';
                rec.onstart = () => setIsListening(true);
                rec.onresult = (e) => {
                    const txt = e.results[0][0].transcript;
                    setInput(txt);
                    setIsListening(false);
                    handleSendMessage(txt);
                };
                rec.onerror = () => setIsListening(false);
                rec.onend = () => setIsListening(false);
                rec.start();
            };

            const handleSendMessage = async (textCustom) => {
                const textToSend = textCustom !== undefined ? textCustom : input;
                if (!textToSend.trim() || isLoadingChat) return;

                const userMsg = {
                    id: Date.now().toString(),
                    sender: 'user',
                    text: textToSend,
                    timestamp: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
                };

                setMessages(prev => [...prev, userMsg]);
                if (!textCustom) setInput('');
                setIsLoadingChat(true);

                const currentKey = hfApiKey.trim() || localStorage.getItem('hf_api_key');

                if (!currentKey) {
                    setIsLoadingChat(false);
                    const alertMsg = "Por favor, insira e salve sua HF API Key na barra superior para habilitar a inteligência artificial real.";
                    setMessages(prev => [...prev, {
                        id: (Date.now() + 1).toString(),
                        sender: 'sarah',
                        text: alertMsg,
                        timestamp: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
                    }]);
                    return;
                }

                // Obter horário exato de Brasília para a IA conduzir a saudação baseada no horário
                const brasiliaHour = new Intl.DateTimeFormat('pt-BR', {
                    timeZone: 'America/Sao_Paulo',
                    hour: 'numeric',
                    hour12: false
                }).format(new Date());

                const weatherContext = liveWeather 
                    ? `DADOS METEOROLÓGICOS REAIS OBTIDOS DA INTERNET AGORA PARA MESQUITA/RJ: Temperatura: ${liveWeather.temperature_2m}°C, Umidade: ${liveWeather.relative_humidity_2m}%, Precipitação (Chuva): ${liveWeather.precipitation} mm.`
                    : `Dados meteorológicos temporariamente indisponíveis online.`;

                try {
                    const response = await fetch("https://router.huggingface.co/v1/chat/completions", {
                        method: "POST",
                        headers: {
                            "Authorization": `Bearer ${currentKey}`,
                            "Content-Type": "application/json"
                        },
                        body: JSON.stringify({
                            model: "meta-llama/Llama-3.3-70B-Instruct",
                            messages: [
                                {
                                    role: "system",
                                    content: `Você é a SARAH AI Core v4.0, inteligência artificial oficial de monitoramento preventivo, telemetria, Defesa Civil Comunitária, programas sociais e programas habitacionais da Bacia do Rio Sarapuí, em Mesquita / RJ (com foco na comunidade do Sebinho e Rocha Sobrinho). O usuário principal é ${userName}. ${weatherContext} 

DIRETRIZ DE APRESENTAÇÃO E SAUDAÇÃO (HORÁRIO DE BRASÍLIA - HORA ATUAL: ${brasiliaHour}h):
- A apresentação técnica profunda (citando Core v4.0, G.C.E. e Bacia do Sarapuí) ocorreu apenas na primeira mensagem de boas-vindas do sistema.
- A partir de agora, nas interações e novas conversas, você deve iniciar cumprimentando de acordo com o horário exato de Brasília (${brasiliaHour}h): diga "Bom dia", "Boa tarde" ou "Boa noite". Em seguida, apresente-se dizendo exatamente: "Meu nome é Sara", explique brevemente sua função de apoio à Defesa Civil e programas sociais/habitacionais, e pergunte: "Qual é o seu nome? Em que posso te ajudar?"
- Assim que a pessoa disser o nome dela, memorize-o, passe a chamá-la pelo nome e converse fluentemente.
- Mantenha raciocínio amplo, aberto, técnico, jurídico e moderado dentro da lei e das normas do Grupo a Chave da Esperança (G.C.E.).`
                                },
                                {
                                    role: "user",
                                    content: textToSend
                                }
                            ],
                            max_tokens: 900,
                            temperature: 0.6
                        })
                    });

                    if (!response.ok) {
                        throw new Error(`Erro na API (${response.status}): Verifique sua chave.`);
                    }

                    const data = await response.json();
                    const reply = data.choices && data.choices[0] && data.choices[0].message 
                        ? data.choices[0].message.content 
                        : "Não foi possível extrair a resposta do modelo.";

                    setMessages(prev => [...prev, {
                        id: (Date.now() + 1).toString(),
                        sender: 'sarah',
                        text: reply,
                        timestamp: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
                    }]);
                    setIsLoadingChat(false);
                    speakText(reply);

                } catch (error) {
                    console.error("Erro Hugging Face:", error);
                    const fallbackReply = `[Erro de Conexão com a IA]: ${error.message}`;
                    setMessages(prev => [...prev, {
                        id: (Date.now() + 1).toString(),
                        sender: 'sarah',
                        text: fallbackReply,
                        timestamp: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
                    }]);
                    setIsLoadingChat(false);
                }
            };

            const getFontSizeClass = () => {
                switch(fontSizeLevel) {
                    case 0: return 'text-xs';
                    case 1: return 'text-sm';
                    case 2: return 'text-base';
                    case 3: return 'text-lg';
                    default: return 'text-sm';
                }
            };

            return (
                <div className={`min-h-screen ${darkMode ? 'bg-slate-950 text-slate-100' : 'bg-slate-100 text-slate-900'} ${getFontSizeClass()} transition-colors duration-300 flex flex-col justify-between`}>
                    
                    <div>
                        {/* CABEÇALHO MODERNIZADO */}
                        <header className="bg-slate-900/95 dark:bg-slate-900/95 bg-white/95 border-b border-cyan-500/30 px-3 py-3 backdrop-blur-md sticky top-0 z-50 shadow-lg">
                            <div className="max-w-4xl mx-auto flex flex-col md:flex-row items-center justify-between gap-3">
                                
                                {/* Bloco da Chave API */}
                                <div className="flex items-center gap-1.5 w-full md:w-auto">
                                    <span className="font-mono text-[11px] text-cyan-400 font-bold shrink-0">HF Key:</span>
                                    <input
                                        type="password"
                                        value={hfApiKey}
                                        onChange={(e) => setHfApiKey(e.target.value)}
                                        placeholder="Cole sua HF API Key..."
                                        className="bg-slate-950 border border-cyan-500/40 rounded px-2.5 py-1.5 text-xs font-mono text-slate-200 w-full md:w-44 focus:outline-none focus:border-cyan-400 shadow-inner"
                                    />
                                    <button
                                        onClick={handleSaveApiKey}
                                        className="px-2.5 py-1.5 bg-cyan-500 hover:bg-cyan-400 text-slate-950 font-bold rounded text-xs font-mono transition-colors shrink-0 shadow"
                                    >
                                        {keySavedStatus ? '🔒 Salva' : 'Salvar'}
                                    </button>
                                </div>

                                {/* Controles Modernos (Tema, Fontes A-/A+, Instalar, Compartilhar) */}
                                <div className="flex items-center flex-wrap gap-1.5 justify-end w-full md:w-auto">
                                    
                                    {/* Botão Tema */}
                                    <button
                                        onClick={() => setDarkMode(!darkMode)}
                                        className="px-2.5 py-1.5 bg-slate-800 hover:bg-slate-700 text-amber-300 border border-slate-700 rounded text-xs font-mono flex items-center gap-1 transition-colors shadow"
                                        title="Alternar Modo Dia / Noite"
                                    >
                                        {darkMode ? '☀️ Dia' : '🌙 Noite'}
                                    </button>

                                    {/* Controles de Fonte A- / A+ */}
                                    <div className="flex items-center bg-slate-800 border border-slate-700 rounded overflow-hidden shadow">
                                        <button
                                            onClick={() => setFontSizeLevel(prev => Math.max(0, prev - 1))}
                                            className="px-2 py-1.5 text-xs font-mono text-cyan-300 hover:bg-slate-700 transition-colors font-bold"
                                            title="Diminuir Letra (A-)"
                                        >
                                            A-
                                        </button>
                                        <span className="text-[10px] px-1 text-slate-400 font-mono border-x border-slate-700">Letra</span>
                                        <button
                                            onClick={() => setFontSizeLevel(prev => Math.min(3, prev + 1))}
                                            className="px-2 py-1.5 text-xs font-mono text-cyan-300 hover:bg-slate-700 transition-colors font-bold"
                                            title="Aumentar Letra (A+)"
                                        >
                                            A+
                                        </button>
                                    </div>

                                    {/* Botão Instalar Aplicativo */}
                                    <button
                                        onClick={handleInstallApp}
                                        className="px-2.5 py-1.5 bg-emerald-600 hover:bg-emerald-500 text-white rounded text-xs font-mono font-bold flex items-center gap-1 transition-colors shadow"
                                        title="Instalar Aplicativo PWA"
                                    >
                                        📥 Instalar App
                                    </button>

                                    {/* Botão Compartilhar Link / Cartão */}
                                    <button
                                        onClick={handleShareLink}
                                        className="px-2.5 py-1.5 bg-cyan-600 hover:bg-cyan-500 text-white rounded text-xs font-mono font-bold flex items-center gap-1 transition-colors shadow"
                                        title="Compartilhar Link da SARAH AI"
                                    >
                                        🔗 Compartilhar
                                    </button>
                                </div>
                            </div>
                        </header>

                        <main className="max-w-2xl mx-auto pt-6 px-4">
                            
                            <div className="text-center mb-6 relative">
                                <div className="inline-flex flex-col items-center gap-1 mb-3 px-4 py-2 bg-cyan-500/10 border border-cyan-500/30 rounded-2xl shadow-inner">
                                    <span className="font-mono text-xs text-cyan-400 font-bold tracking-widest uppercase">
                                        Defesa Civil Comunitária & Programas Sociais
                                    </span>
                                    <span className="font-mono text-sm text-slate-100 font-semibold tracking-wide">
                                        Cidadão Sensor _ Sebinho / Mesquita RJ
                                    </span>
                                </div>
                                <h1 className="text-2xl md:text-3xl font-black tracking-tight text-white drop-shadow">
                                    SARAH AI <span className="text-cyan-400 font-mono text-lg">Core v4.0</span>
                                </h1>
                                <p className="text-xs text-slate-400 mt-1 font-mono">
                                    Raciocínio Amplo • Defesa Civil • Habitacional • Dados Meteorológicos Reais
                                </p>
                            </div>

                            {liveWeather && (
                                <div className="mb-4 bg-cyan-950/40 border border-cyan-500/30 rounded-2xl p-3 flex items-center justify-between font-mono text-xs text-cyan-300 shadow-md">
                                    <span>🌡️ Mesquita: <b>{liveWeather.temperature_2m}°C</b></span>
                                    <span>💧 Umidade: <b>{liveWeather.relative_humidity_2m}%</b></span>
                                    <span>🌧️ Chuva: <b>{liveWeather.precipitation} mm</b></span>
                                </div>
                            )}

                            <div className="grid grid-cols-3 gap-2 mb-4">
                                <button
                                    onClick={() => setMapOpen(!mapOpen)}
                                    className={`py-2 px-3 rounded-xl border text-xs font-mono font-bold flex items-center justify-center gap-1.5 transition-all shadow-md ${mapOpen ? 'bg-cyan-500 text-slate-950 border-cyan-400 shadow-cyan-500/30' : 'bg-slate-900/90 text-cyan-300 border-cyan-500/30 hover:bg-slate-800'}`}
                                >
                                    🗺️ {mapOpen ? 'Ocultar Mapa' : 'Mapa Setorial'}
                                </button>
                                
                                <button
                                    onClick={() => setChartOpen(!chartOpen)}
                                    className={`py-2 px-3 rounded-xl border text-xs font-mono font-bold flex items-center justify-center gap-1.5 transition-all shadow-md ${chartOpen ? 'bg-cyan-500 text-slate-950 border-cyan-400 shadow-cyan-500/30' : 'bg-slate-900/90 text-cyan-300 border-cyan-500/30 hover:bg-slate-800'}`}
                                >
                                    📊 {chartOpen ? 'Ocultar Gráfico' : 'Gráfico Telemetria'}
                                </button>

                                <button
                                    onClick={() => setTermsOpen(!termsOpen)}
                                    className={`py-2 px-3 rounded-xl border text-xs font-mono font-bold flex items-center justify-center gap-1.5 transition-all shadow-md ${termsOpen ? 'bg-cyan-500 text-slate-950 border-cyan-400 shadow-cyan-500/30' : 'bg-slate-900/90 text-cyan-300 border-cyan-500/30 hover:bg-slate-800'}`}
                                >
                                    ⚖️ {termsOpen ? 'Ocultar LGPD' : 'Termos & LGPD'}
                                </button>
                            </div>

                            {mapOpen && (
                                <div className="mb-4 bg-slate-900/95 border-2 border-cyan-500/40 rounded-2xl p-3 shadow-xl transition-all">
                                    <div className="flex items-center justify-between mb-2">
                                        <span className="font-mono text-xs text-cyan-300 font-bold uppercase">
                                            📍 Foco: Rocha Sobrinho, Mesquita (Rua Amazonas / Sebinho)
                                        </span>
                                        <button onClick={() => setMapOpen(false)} className="text-slate-400 hover:text-white text-xs font-mono">✕ Fechar</button>
                                    </div>
                                    <div ref={mapRef} className="w-full h-64 rounded-xl border border-cyan-500/30 z-10"></div>
                                </div>
                            )}

                            {chartOpen && (
                                <div className="mb-4 bg-slate-900/95 border-2 border-cyan-500/40 rounded-2xl p-3 shadow-xl transition-all">
                                    <div className="flex items-center justify-between mb-2">
                                        <span className="font-mono text-xs text-cyan-300 font-bold uppercase">
                                            📈 Métricas do Rio Sarapuí [Simulação + Chuva Real]
                                        </span>
                                        <button onClick={() => setChartOpen(false)} className="text-slate-400 hover:text-white text-xs font-mono">✕ Fechar</button>
                                    </div>
                                    <div className="w-full h-56 relative">
                                        <canvas ref={chartRef}></canvas>
                                    </div>
                                </div>
                            )}

                            {termsOpen && (
                                <div className="mb-4 bg-slate-900/95 border-2 border-cyan-500/40 rounded-2xl p-4 shadow-xl transition-all font-sans">
                                    <div className="flex items-center justify-between mb-3 border-b border-cyan-500/20 pb-2">
                                        <span className="font-mono text-xs text-cyan-300 font-bold uppercase">
                                            ⚖️ LGPD & Termos (Lei nº 13.709/2018)
                                        </span>
                                        <button onClick={() => setTermsOpen(false)} className="text-slate-400 hover:text-white text-xs font-mono">✕ Fechar</button>
                                    </div>
                                    <div className="space-y-3 text-xs text-slate-300 leading-relaxed">
                                        <div className="bg-slate-950 p-3 rounded-xl border border-cyan-500/20">
                                            <strong className="text-cyan-400 block mb-1">Pilar I: Finalidade Estrita</strong>
                                            Dados e requisições focados no apoio comunitário, Defesa Civil, programas sociais e habitação.
                                        </div>
                                    </div>
                                </div>
                            )}

                            <div className="bg-slate-900/90 backdrop-blur-2xl border-2 border-cyan-500/40 rounded-3xl p-4 shadow-2xl shadow-cyan-950/60 relative z-20">
                                
                                <div className="flex items-center justify-between mb-3 border-b border-cyan-500/20 pb-2.5">
                                    <div className="flex items-center gap-2">
                                        <span className="w-2.5 h-2.5 rounded-full bg-cyan-400 animate-pulse" />
                                        <span className="font-mono text-xs text-cyan-300 font-bold uppercase tracking-wider">
                                            SARAH AI Core v4.0 • {userName} {keySavedStatus ? '🔒 (Conectada)' : '⚠️ (Insira Chave)'}
                                        </span>
                                    </div>
                                    <button
                                        onClick={() => setSoundEnabled(!soundEnabled)}
                                        className={`px-2 py-1 rounded-lg border text-xs font-mono transition-all ${soundEnabled ? 'bg-cyan-500/20 border-cyan-400/50 text-cyan-300' : 'bg-slate-800 border-slate-700 text-slate-400'}`}
                                    >
                                        {soundEnabled ? '🔊 Voz Ativa' : '🔇 Mudo'}
                                    </button>
                                </div>

                                <div className="h-72 overflow-y-auto space-y-3 pr-2 mb-4">
                                    {messages.map(m => (
                                        <div key={m.id} className={`flex flex-col ${m.sender === 'user' ? 'items-end' : 'items-start'}`}>
                                            <div className={`max-w-[85%] rounded-2xl px-4 py-2.5 shadow-md ${m.sender === 'user' ? 'bg-cyan-600 text-white rounded-br-none' : 'bg-slate-800/90 border border-cyan-500/30 text-slate-200 rounded-bl-none'}`}>
                                                <p className="leading-relaxed whitespace-pre-wrap">{m.text}</p>
                                            </div>
                                            <span className="text-[10px] text-slate-500 font-mono mt-1 px-1">{m.timestamp}</span>
                                        </div>
                                    ))}
                                    {isLoadingChat && (
                                        <div className="flex items-center gap-2 text-cyan-400 text-xs font-mono bg-slate-800/50 p-2 rounded-xl w-fit animate-pulse">
                                            ⏳ Processando raciocínio amplo com dados da internet...
                                        </div>
                                    )}
                                </div>

                                <div className="flex items-center gap-2">
                                    <input
                                        type="text"
                                        value={input}
                                        onChange={e => setInput(e.target.value)}
                                        onKeyDown={e => e.key === 'Enter' && handleSendMessage()}
                                        placeholder="Digite sua mensagem para a SARAH Core..."
                                        className="flex-1 bg-slate-950 border border-cyan-500/30 rounded-xl px-4 py-2.5 text-slate-100 placeholder-slate-500 focus:outline-none focus:border-cyan-400 shadow-inner"
                                    />
                                    
                                    <button
                                        onClick={toggleListening}
                                        className={`p-2.5 rounded-xl border transition-all shrink-0 ${isListening ? 'bg-rose-500 border-rose-400 text-white animate-pulse shadow-lg shadow-rose-500/30' : 'bg-slate-800 border-cyan-500/30 text-cyan-400 hover:bg-slate-700'}`}
                                        title="Comando por Voz"
                                    >
                                        🎤
                                    </button>

                                    <button
                                        onClick={() => handleSendMessage()}
                                        className="px-4 py-2.5 bg-cyan-500 hover:bg-cyan-400 text-slate-950 font-bold rounded-xl shadow-lg shadow-cyan-500/20 transition-all shrink-0 flex items-center justify-center"
                                    >
                                        Enviar 🚀
                                    </button>
                                </div>
                            </div>

                        </main>
                    </div>

                    <footer className="max-w-2xl mx-auto w-full mt-12 pt-6 pb-6 px-4 border-t border-cyan-500/20 text-center font-mono text-xs text-slate-400 space-y-1.5">
                        <p className="text-slate-300">Todos os direitos reservados 2024-2028</p>
                        <p className="text-cyan-400 font-bold">© Grupo a Chave da Esperança / G.C.E.</p>
                        <p className="text-slate-500 uppercase tracking-widest text-[10px] pt-1">SARAH AI Core v4.0 • Defesa Civil Comunitária</p>
                    </footer>

                </div>
            );
        }

        const container = document.getElementById('root');
        const root = ReactDOM.createRoot(container);
        root.render(<App />);
    </script>
</body>
</html>
