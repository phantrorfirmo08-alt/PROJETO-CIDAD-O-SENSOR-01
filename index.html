<style>
 body { background: #07090E; color: #F1F5F9; font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; }
 .mono { font-family: 'JetBrains Mono', monospace; }
 .glass { background: rgba(13, 19, 33, 0.9); backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.08); }
 .glass-card { background: rgba(18, 26, 43, 0.75); border: 1px solid rgba(255, 255, 255, 0.06); }

 .input-pro:focus { border-color: #3B82F6; box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.2); outline: none; }
 .badge-pulse { animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite; }
 @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .4; } }
 @keyframes radarPulse { 0% { r: 6px; opacity: 0.9; } 70% { r: 30px; opacity: 0; } 100% { r: 6px; opacity: 0; } }
 .radar-ring { animation: radarPulse 2.2s cubic-bezier(0.215, 0.61, 0.355, 1) infinite; transform-origin: center; }
::-webkit-scrollbar { width: 6px; height: 6px; }
::-webkit-scrollbar-track { background: #07090E; }
::-webkit-scrollbar-thumb { background: #1E293B; border-radius: 3px; }
</style>

<script type="text/babel">
const { useState, useRef, useEffect } = React;

const MUNICIPIOS_RJ_92 = [
 "Mesquita (Base Oficial - Rocha Sobrinho)",
 "Nova Iguaçu",
 "Duque de Caxias",

 "Rio Claro",
 "Rio das Flores",
 "Rio das Ostras",
 "Rio de Janeiro (Capital)",
 "Santa Maria Madalena",
 "Santo Antônio de Pádua",
 "São Fidélis",
 "São Francisco de Itabapoana",
 "São João da Barra",
 "São José de Ubá",
 "São José do Vale do Rio Preto",
 "São Pedro da Aldeia",
 "São Sebastião do Alto",
 "Sapucaia",
 "Saquarema",
 "Seropédica",
 "Silva Jardim",
 "Sumidouro",
 "Tanguá",
 "Teresópolis",
 "Trajano de Moraes",
 "Três Rios",
 "Valença",
 "Varre-Sai",
 "Vassouras",
 "Volta Redonda"
].map(m => ({ n: m, lat: -22.7858, lon: -43.4294 }));

const RISCOS = [
  { id: "R1", label: "R1 - BAIXO / PREVENTIVO" },
  { id: "R2", label: "R2 - MODERADO / ATENÇÃO" },
  { id: "R3", label: "R3 - ALTO / ALERTA" },
  { id: "R4", label: "R4 - IMINENTE / EVACUAÇÃO" },
  { id: "RH", label: "RH - HIDROLÓGICO / ENCHENTE" },
  { id: "RE", label: "RE - ESTRUTURAL / TALUDE" }
];

const ORGAOS = [
  "COMPDEC / SEDEC-RJ",
  "GADE - GRUPO A CHAVE DA ESPERANÇA",
  "BOM DIA COMUNIDADE",
  "CIDADÃO SENSOR (RCS)",
  "INEA / SERLA",
  "CEMADEN / INPE",
  "CRAS / CREAS",
  "DEFESA CIVIL MUNICIPAL",
  "NUPDECs - 92 MUNICÍPIOS RJ"
];

function App() {
  const [municipios] = useState(MUNICIPIOS_RJ_92);
  const [mun, setMun] = useState(MUNICIPIOS_RJ_92[0]);
  const [fotos, setFotos] = useState([]);
  const [camOn, setCamOn] = useState(false);
  const [facingMode, setFacingMode] = useState("environment");
  const [nome, setNome] = useState("Alexander da Silva Firmo");
  const [docId, setDocId] = useState("AG-COMUNITARIO-01");
  const [bairro, setBairro] = useState("Comunidade do Sebinho (Maria Cristina)");
  const [risco, setRisco] = useState(RISCOS[1].label);
  const [org, setOrg] = useState(ORGAOS[3]);
  const [rel, setRel] = useState("");
  const [iaDiag, setIaDiag] = useState("SARAH-AI: TELEMETRIA 92 MUNICÍPIOS EM PRONTIDÃO.");
  const [deviceInfo, setDeviceInfo] = useState("SISTEMA OPERACIONAL VERIFICADO");
  const [tvMode, setTvMode] = useState(false);
  const [loadingPdf, setLoadingPdf] = useState(false);

  const videoRef = useRef(null);
  const streamRef = useRef(null);

  useEffect(() => {
    const ua = navigator.userAgent;
    if (/android/i.test(ua)) setDeviceInfo("ANDROID OS // HOST ATIVO");
    else if (/iPad|iPhone|iPod/.test(ua)) setDeviceInfo("iOS / SAFARI // HOST ATIVO");
    else if (/SmartTV|GoogleTV|NetTV|Tizen|WebOS/i.test(ua)) {
      setDeviceInfo("SMART TV // MODO EXIBIÇÃO");
      setTvMode(true);
    } else setDeviceInfo("DESKTOP / WEB BROWSER");
  }, []);

  useEffect(() => {
    if (risco.includes("R1")) setIaDiag("SARAH-AI: ESTABILIDADE GEOTÉCNICA ESTÁVEL. MONITORAMENTO PREVENTIVO ATIVO.");
    else if (risco.includes("R2")) setIaDiag("SARAH-AI: SATURAÇÃO PARCIAL DE TALUDE / MICRODRENAGEM SOB CARGA.");
    else if (risco.includes("R3")) setIaDiag("SARAH-AI: ALERTA DE MOVIMENTAÇÃO DE MASSA / RISCO ESTRUTURAL.");
    else if (risco.includes("R4")) setIaDiag("SARAH-AI: RISCO CRÍTICO IMINENTE. EVACUAÇÃO RECOMENDADA.");
    else if (risco.includes("RH")) setIaDiag("SARAH-AI: ELEVAÇÃO RÁPIDA DE COTA HÍDRICA / BACIA EM ALERTA.");
    else setIaDiag("SARAH-AI: ANOMALIA ESTRUTURAL DETECTADA EM ELEMENTOS DE CONTENÇÃO.");
  }, [risco]);

  const startCamera = async (mode = facingMode) => {
    try {
      if (streamRef.current) streamRef.current.getTracks().forEach(t => t.stop());
      const s = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: { exact: mode }, width: { ideal: 1280 }, height: { ideal: 720 } }
      }).catch(() => navigator.mediaDevices.getUserMedia({ video: true }));

      streamRef.current = s;
      setCamOn(true);
      setTimeout(() => {
        if (videoRef.current) {
          videoRef.current.srcObject = s;
          videoRef.current.onloadedmetadata = () => videoRef.current.play().catch(() => {});
        }
      }, 200);
    } catch (e) {
      alert('ERRO DE CÂMERA: VERIFIQUE PERMISSÕES HTTPS (ANDROID / iOS / PC).');
    }
  };

  const stopCamera = () => {
    if (streamRef.current) streamRef.current.getTracks().forEach(t => t.stop());
    if (videoRef.current) videoRef.current.srcObject = null;
    setCamOn(false);
  };

  const capturarFoto = () => {
    const v = videoRef.current;
    if (!v || v.videoWidth === 0) { alert('AGUARDE O FOCO DA CÂMERA'); return; }
    
    const c = document.createElement('canvas');
    c.width = 600;
    c.height = Math.round(600 * (v.videoHeight / v.videoWidth));
    const ctx = c.getContext('2d');
    ctx.drawImage(v, 0, 0, c.width, c.height);

    ctx.fillStyle = 'rgba(7, 9, 14, 0.9)';
    ctx.fillRect(0, 0, c.width, 30);
    ctx.fillRect(0, c.height - 44, c.width, 44);

    ctx.fillStyle = '#3B82F6';
    ctx.font = '700 10px "JetBrains Mono", monospace';
    ctx.fillText(`SARAH AI NEXUS // VISTORIA DE CAMPO`, 10, 19);

    ctx.fillStyle = '#FFFFFF';
    ctx.font = '700 9px "JetBrains Mono", monospace';
    const agoraStr = new Date().toLocaleString('pt-BR');
    ctx.fillText(`${agoraStr} | ${mun.n}`, 10, c.height - 27);
    ctx.fillText(`GEO: ${mun.lat.toFixed(4)}, ${mun.lon.toFixed(4)} | RESP: ${nome.split(' ')[0]}`, 10, c.height - 13);

    const url = c.toDataURL('image/jpeg', 0.65);
    setFotos(p => [...p, url]);
  };

  const gerarHashUnico = async (prot) => {
    const raw = `${prot}-${nome}-${Date.now()}`;
    const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(raw));
    return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, '0')).join('');
  };

  const gerarPDFBlob = async (prot, hash) => {
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF('p', 'mm', 'a4');

    doc.setFillColor(7, 9, 14);
    doc.rect(0, 0, 210, 297, 'F');

    doc.setFillColor(13, 19, 33);
    doc.rect(10, 10, 190, 24, 'F');
    doc.setDrawColor(59, 130, 246);
    doc.rect(10, 10, 190, 24);

    doc.setTextColor(59, 130, 246);
    doc.setFont('helvetica', 'bold');
    doc.setFontSize(10);
    doc.text('SARAH AI NEXUS // LAUDO TÉCNICO DOS 92 MUNICÍPIOS DO RJ', 15, 18);

    doc.setTextColor(255, 255, 255);
    doc.setFontSize(8);
    doc.text(`PROTOCOLO: ${prot}`, 15, 26);
    doc.text(`DATA: ${new Date().toLocaleString('pt-BR')}`, 135, 26);

    doc.setFillColor(13, 19, 33);
    doc.rect(10, 38, 190, 34, 'F');
    doc.rect(10, 38, 190, 34);

    doc.setTextColor(148, 163, 184);
    doc.setFontSize(7);
    doc.text('RESPONSÁVEL TÉCNICO:', 14, 45);
    doc.text('MUNICÍPIO / BAIRRO / GPS:', 14, 55);
    doc.text('RISCO / ÓRGÃO DESTINO:', 14, 65);

    doc.setTextColor(255, 255, 255);
    doc.setFont('helvetica', 'bold');
    doc.setFontSize(8);
    doc.text(`${nome} (${docId})`, 75, 45);
    doc.text(`${mun.n} | ${bairro} (${mun.lat.toFixed(4)}, ${mun.lon.toFixed(4)})`, 75, 55);
    doc.text(`${risco} | ${org}`, 75, 65);

    doc.setFillColor(13, 19, 33);
    doc.rect(10, 76, 190, 48, 'F');
    doc.rect(10, 76, 190, 48);

    doc.setTextColor(59, 130, 246);
    doc.setFont('helvetica', 'bold');
    doc.text('DIAGNÓSTICO PREDITIVO DE IA & RELATO:', 14, 83);

    doc.setTextColor(200, 200, 200);
    doc.setFont('helvetica', 'normal');
    doc.setFontSize(7.5);
    doc.text(`[IA] ${iaDiag}`, 14, 90);

    const linhasRelato = doc.splitTextToSize(rel || 'Sem observações textuais adicionais.', 182);
    doc.text(linhasRelato, 14, 98);

    let y = 130;
    doc.setTextColor(59, 130, 246);
    doc.setFont('helvetica', 'bold');
    doc.setFontSize(9);
    doc.text(`REGISTRO FOTOGRÁFICO DE CAMPO (${fotos.length} IMAGENS):`, 10, y);
    y += 6;

    for (let i = 0; i < fotos.length; i++) {
      if (y > 220) {
        doc.addPage();
        doc.setFillColor(7, 9, 14);
        doc.rect(0, 0, 210, 297, 'F');
        y = 15;
      }
      try {
        const xPos = 10 + (i % 2) * 96;
        doc.addImage(fotos[i], 'JPEG', xPos, y, 88, 52);
        doc.setDrawColor(255, 255, 255, 0.2);
        doc.rect(xPos, y, 88, 52);
      } catch (e) {}

      if (i % 2 === 1) y += 58;
      else if (i === fotos.length - 1) y += 58;
    }

    doc.setFillColor(10, 15, 29);
    doc.rect(10, 278, 190, 14, 'F');
    doc.setTextColor(148, 163, 184);
    doc.setFont('helvetica', 'normal');
    doc.setFontSize(6.5);
    doc.text(`HASH SHA-256: ${hash}`, 14, 284);
    doc.text(`SISTEMA SARAH AI NEXUS // COBERTURA ESTADUAL 92 MUNICÍPIOS`, 14, 289);

    return doc.output('blob');
  };

  const enviarWhatsapp = async () => {
    if (!nome || !bairro) { alert('PREENCHA RESPONSÁVEL E BAIRRO'); return; }
    if (fotos.length === 0) { alert('CAPTURE AO MENOS 1 FOTO'); return; }

    const prot = `PROT-VIST-${mun.n.slice(0, 3).toUpperCase()}-2026-${Math.floor(Math.random() * 8999 + 1000)}`;
    const hash = await gerarHashUnico(prot);

    const texto = `*SARAH AI NEXUS // VISTORIA TÉCNICA*
──────────────────
*PROTOCOLO:* ${prot}
*RESPONSÁVEL:* ${nome}
*MUNICÍPIO:* ${mun.n}
*BAIRRO:* ${bairro}
*RISCO:* ${risco}
*DESTINO:* ${org}
*IA:* ${iaDiag}
*RELATO:* ${rel || 'N/A'}
*FOTOS:* ${fotos.length}
*HASH:* ${hash.slice(0, 20)}...`;

    const fotoFiles = await Promise.all(fotos.map(async (d, i) => {
      const r = await fetch(d);
      const b = await r.blob();
      return new File([b], `FOTO_${i + 1}_${prot}.jpg`, { type: 'image/jpeg' });
    }));

    if (navigator.canShare && navigator.canShare({ files: fotoFiles })) {
      try {
        await navigator.share({ title: prot, text: texto, files: fotoFiles });
        return;
      } catch (e) {}
    }
    window.open(`https://wa.me/?text=${encodeURIComponent(texto)}`, '_blank');
  };

  const exportarPDF = async () => {
    if (!nome || !bairro) { alert('PREENCHA RESPONSÁVEL E BAIRRO'); return; }
    if (fotos.length === 0) { alert('CAPTURE AO MENOS 1 FOTO'); return; }

    setLoadingPdf(true);
    try {
      const prot = `PROT-VIST-${mun.n.slice(0, 3).toUpperCase()}-2026-${Math.floor(Math.random() * 8999 + 1000)}`;
      const hash = await gerarHashUnico(prot);
      const blob = await gerarPDFBlob(prot, hash);
      const pdfFile = new File([blob], `${prot}_LAUDO.pdf`, { type: 'application/pdf' });

      if (navigator.canShare && navigator.canShare({ files: [pdfFile] })) {
        await navigator.share({ title: prot, text: `Laudo - ${prot}`, files: [pdfFile] });
      } else {
        const url = URL.createObjectURL(blob);
        window.open(url, '_blank');
      }
    } catch (e) {
      alert('ERRO AO GERAR O PDF.');
    } finally {
      setLoadingPdf(false);
    }
  };

  return (
    <div className={`glass rounded-3xl p-4 sm:p-8 space-y-6 shadow-2xl border border-white/10 ${tvMode ? 'max-w-[1400px] border-blue-500/40' : 'max-w-[1200px]'}`}>
      
      {/* Placa de Monitoramento Externo / TV & PC Mode */}
      <div className="glass-card rounded-2xl p-4 border border-blue-500/40 space-y-3 shadow-lg">
        <div className="flex justify-between items-center">
          <div className="flex items-center space-x-2.5">
            <div className="w-3 h-3 rounded-full bg-emerald-400 badge-pulse"></div>
            <span className="text-xs font-black uppercase tracking-widest text-blue-400 mono">SARAH AI NEXUS // PAINEL OPERACIONAL TÁTICO &amp; 92 MUNICÍPIOS</span>
          </div>
          <div className="flex items-center space-x-2">
            <button onClick={() => setTvMode(!tvMode)} className="text-[10px] font-bold px-3 py-1.5 rounded-lg bg-blue-600/30 text-blue-200 border border-blue-400/40 hover:bg-blue-600/50 transition">
              {tvMode ? 'MODO PADRÃO' : '🖥️ MODO TELA CHEIA / TV'}
            </button>
            <span className="text-[10px] mono px-2.5 py-1 rounded-md bg-blue-500/20 text-blue-200 border border-blue-400/30">{deviceInfo}</span>
          </div>
        </div>

        {/* MAPA TÁTICO SVG INTEGRADO DIRETAMENTE NO APP */}
        <div className="w-full rounded-2xl overflow-hidden border border-blue-500/30 bg-[#04070D] shadow-inner">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 320" width="100%" height="100%" style={{background:'#04070D', display:'block'}}>
            <defs>
              <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#0B1321"/>
                <stop offset="100%" stop-color="#020408"/>
              </linearGradient>
              <linearGradient id="baixaGrad" x1="0%" y1="0%" x2="100%" y2="0%">
                <stop offset="0%" stop-color="#1E3A8A" stop-opacity="0.4"/>
                <stop offset="100%" stop-color="#3B82F6" stop-opacity="0.1"/>
              </linearGradient>
              <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
                <feGaussianBlur stdDeviation="3" result="blur"/>
                <feComposite in="SourceGraphic" in2="blur" operator="over"/>
              </filter>
            </defs>

            <rect width="800" height="320" fill="url(#bgGrad)"/>
            {/* Grid Técnico */}
            <g stroke="#ffffff" stroke-opacity="0.04" stroke-width="1">
              <path d="M 0,80 H 800 M 0,160 H 800 M 0,240 H 800" />
              <path d="M 160,0 V 320 M 320,0 V 320 M 480,0 V 320 M 640,0 V 320" />
            </g>

            <g transform="translate(40, 20)">
              <path d="M 240,120 Q 300,100 360,130 T 460,150 Q 440,220 380,245 T 260,230 Z" fill="url(#baixaGrad)" stroke="#3B82F6" stroke-width="1.5" stroke-opacity="0.3" stroke-dasharray="4,4"/>
              
              <g stroke="#3B82F6" stroke-opacity="0.3" stroke-width="1">
                <line x1="270" y1="140" x2="320" y2="160" />
                <line x1="270" y1="140" x2="240" y2="190" />
                <line x1="270" y1="140" x2="370" y2="120" />
                <line x1="320" y1="160" x2="410" y2="190" />
              </g>

              {/* Rótulos de Municípios */}
              <circle cx="370" cy="220" r="3.5" fill="#3B82F6" opacity="0.6"/><text x="380" y="224" fill="#94A3B8" font-size="8.5" font-family="monospace">Rio de Janeiro</text>
              <circle cx="460" cy="225" r="3.5" fill="#3B82F6" opacity="0.6"/><text x="470" y="229" fill="#94A3B8" font-size="8.5" font-family="monospace">Niterói</text>
              <circle cx="320" cy="160" r="4.5" fill="#3B82F6" opacity="0.8"/><text x="332" y="164" fill="#CBD5E1" font-size="8.5" font-weight="bold" font-family="monospace">Duque de Caxias</text>
              <circle cx="240" cy="120" r="4.5" fill="#3B82F6" opacity="0.8"/><text x="170" y="115" fill="#CBD5E1" font-size="8.5" font-weight="bold" font-family="monospace">Nova Iguaçu</text>
              <circle cx="295" cy="180" r="4.5" fill="#3B82F6" opacity="0.8"/><text x="307" y="184" fill="#CBD5E1" font-size="8.5" font-weight="bold" font-family="monospace">São João de Meriti</text>
              <circle cx="270" cy="140" r="4.5" fill="#3B82F6" opacity="0.8"/><text x="180" y="145" fill="#CBD5E1" font-size="8.5" font-weight="bold" font-family="monospace">Belford Roxo</text>

              {/* MARCADOR ATIVO / MESQUITA SEBINHO */}
              <g transform="translate(270, 140)">
                <circle cx="0" cy="0" r="22" fill="none" stroke="#25D366" stroke-width="1.5" class="radar-ring"/>
                <circle cx="0" cy="0" r="6" fill="#25D366" filter="url(#neonGlow)"/>
                <circle cx="0" cy="0" r="2.5" fill="#FFFFFF"/>
                <rect x="-65" y="-30" width="130" height="20" rx="4" fill="#0A0F1D" stroke="#25D366" stroke-width="1" filter="url(#neonGlow)"/>
                <text x="0" y="-17" fill="#25D366" font-size="8.5" font-weight="bold" text-anchor="middle" font-family="monospace">MESQUITA // SEBINHO</text>
              </g>
            </g>

            {/* Header Flutuante do Mapa */}
            <g transform="translate(16, 16)">
              <rect x="0" y="0" width="280" height="26" rx="4" fill="#0A0F1D" stroke="#3B82F6" stroke-opacity="0.4"/>
              <text x="10" y="17" fill="#3B82F6" font-size="8.5" font-weight="bold" font-family="monospace">📡 RADAR TÁTICO: 92 MUNICÍPIOS RJ</text>
            </g>
          </svg>
        </div>

        <div className="grid grid-cols-1 sm:grid-cols-4 gap-3 text-center">
          <div className="bg-black/50 p-2.5 rounded-xl border border-white/5">
            <p className="text-[9px] text-slate-400 uppercase font-bold">Município Alvo (92 RJ)</p>
            <p className="text-xs font-black text-white truncate mt-1">{mun.n}</p>
          </div>
          <div className="bg-black/50 p-2.5 rounded-xl border border-white/5">
            <p className="text-[9px] text-slate-400 uppercase font-bold">Coordenadas Base</p>
            <p className="text-xs font-black text-emerald-400 mono mt-1">{mun.lat.toFixed(2)}, {mun.lon.toFixed(2)}</p>
          </div>
          <div className="bg-black/50 p-2.5 rounded-xl border border-white/5">
            <p className="text-[9px] text-slate-400 uppercase font-bold">Status Câmera / Telemetria</p>
            <p className="text-xs font-black text-blue-400 mt-1">{camOn ? 'ONLINE (CAPTURA ATIVA)' : 'STANDBY'}</p>
          </div>
          <div className="bg-black/50 p-2.5 rounded-xl border border-white/5">
            <p className="text-[9px] text-slate-400 uppercase font-bold">Evidências Capturadas</p>
            <p className="text-xs font-black text-purple-400 mt-1">{fotos.length} FOTO(S)</p>
          </div>
        </div>
      </div>

      {/* Grid Principal: Câmera e Formulário */}
      <div className={`grid grid-cols-1 ${tvMode ? 'lg:grid-cols-2 gap-6' : 'lg:grid-cols-2 gap-6'}`}>
        
        {/* Coluna Esquerda: Câmera e Evidências */}
        <div className="space-y-4">
          <div className="glass-card rounded-2xl p-4 space-y-3">
            <div className="flex justify-between items-center">
              <span className="text-xs font-bold text-slate-200 uppercase">Câmera Forense & Telemetria AI</span>
              <div className="flex space-x-2">
                {camOn && (
                  <button onClick={() => setFacingMode(facingMode === "environment" ? "user" : "environment")} className="text-[10px] font-bold px-3 py-1.5 rounded-xl bg-slate-800 text-slate-200 border border-white/10">
                    INVERTER
                  </button>
                )}
                {!camOn ? (
                  <button onClick={() => startCamera(facingMode)} className="text-[10px] font-black px-4 py-1.5 rounded-xl bg-blue-600 text-white hover:bg-blue-500 shadow-lg shadow-blue-600/30 transition">
                    LIGAR CÂMERA
                  </button>
                ) : (
                  <button onClick={stopCamera} className="text-[10px] font-bold px-3 py-1.5 rounded-xl bg-rose-500/20 text-rose-300 border border-rose-500/30">
                    DESLIGAR
                  </button>
                )}
              </div>
            </div>

            <div className="relative rounded-2xl overflow-hidden bg-black border border-white/10 shadow-inner" style={{ minHeight: '260px' }}>
              <video ref={videoRef} autoPlay playsInline muted className="w-full h-[260px] object-cover" style={{ display: camOn ? 'block' : 'none' }}></video>
              {!camOn && (
                <div className="absolute inset-0 flex flex-col items-center justify-center text-slate-500 space-y-2">
                  <svg className="w-10 h-10 opacity-30 animate-pulse" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="1.5" d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z"></path><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="1.5" d="M15 13a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
                  <span className="text-[11px] font-medium">CÂMERA EM ESPERA // CLIQUE EM LIGAR</span>
                </div>
              )}
              {camOn && (
                <div className="absolute top-3 left-3 bg-black/75 px-3 py-1 rounded-lg text-[10px] mono text-blue-400 border border-white/10">
                  REC ● {mun.lat.toFixed(3)}, {mun.lon.toFixed(3)}
                </div>
              )}
            </div>

            {camOn && (
              <button onClick={capturarFoto} className="w-full py-4 bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-500 hover:to-indigo-500 text-white font-black rounded-xl text-xs tracking-wider shadow-lg shadow-blue-600/30 transition">
                CAPTURAR FOTO COM CARIMBO DE TELEMETRIA
              </button>
            )}

            {fotos.length > 0 && (
              <div className="flex gap-2.5 overflow-x-auto pt-1">
                {fotos.map((f, i) => (
                  <div key={i} className="relative shrink-0 group">
                    <img src={f} className="w-20 h-20 object-cover rounded-xl border border-white/20 shadow-md" alt={`Evidência ${i+1}`} />
                    <button onClick={() => setFotos(fotos.filter((_, idx) => idx !== i))} className="absolute -top-1.5 -right-1.5 w-5 h-5 bg-rose-600 text-white rounded-full font-bold text-xs flex items-center justify-center shadow">×</button>
                    <span className="absolute bottom-1 left-1 bg-black/80 px-1.5 rounded text-[8px] mono text-white">#{i+1}</span>
                  </div>
                ))}
              </div>
            )}

            <div className="p-3 rounded-xl bg-blue-950/20 border border-blue-500/20 flex items-start space-x-2">
              <div className="w-2.5 h-2.5 rounded-full bg-blue-400 mt-1 shrink-0 badge-pulse"></div>
              <p className="text-[10px] mono text-blue-200 leading-relaxed">
                <strong className="text-blue-400">DIAGNÓSTICO IA:</strong> {iaDiag}
              </p>
            </div>
          </div>
        </div>

        {/* Coluna Direita: Seletores dos 92 Municípios e Formulário */}
        <div className="space-y-4">
          <div className="glass-card rounded-2xl p-4 space-y-3">
            <span className="text-xs font-bold text-slate-200 uppercase">Parâmetros Oficiais &amp; 92 Municípios RJ</span>
            
            <div className="grid grid-cols-1 gap-3">
              <div>
                <label className="text-[10px] uppercase font-bold text-slate-400 tracking-wider mb-1 block">Município Alvo (Lista Oficial 92 RJ)</label>
                <select value={mun.n} onChange={e => setMun(municipios.find(m => m.n === e.target.value))} className="w-full input-pro rounded-xl p-3 text-xs font-medium">
                  {municipios.map((m, i) => <option key={i} value={m.n}>{m.n}</option>)}
                </select>
              </div>

              <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                <div>
                  <label className="text-[10px] uppercase font-bold text-slate-400 tracking-wider mb-1 block">Órgão Destinatário</label>
                  <select value={org} onChange={e => setOrg(e.target.value)} className="w-full input-pro rounded-xl p-3 text-xs font-medium">
                    {ORGAOS.map((o, i) => <option key={i} value={o}>{o}</option>)}
                  </select>
                </div>
                <div>
                  <label className="text-[10px] uppercase font-bold text-slate-400 tracking-wider mb-1 block">Classificação de Risco</label>
                  <select value={risco} onChange={e => setRisco(e.target.value)} className="w-full input-pro rounded-xl p-3 text-xs font-bold text-amber-300">
                    {RISCOS.map((r, i) => <option key={i} value={r.label}>{r.label}</option>)}
                  </select>
                </div>
              </div>

              <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                <div>
                  <label className="text-[10px] uppercase font-bold text-slate-400 tracking-wider mb-1 block">Responsável Técnico</label>
                  <input value={nome} onChange={e => setNome(e.target.value)} className="w-full input-pro rounded-xl p-3 text-xs font-medium" />
                </div>
                <div>
                  <label className="text-[10px] uppercase font-bold text-slate-400 tracking-wider mb-1 block">Credencial / ID</label>
                  <input value={docId} onChange={e => setDocId(e.target.value)} className="w-full input-pro rounded-xl p-3 text-xs font-medium" />
                </div>
              </div>

              <div>
                <label className="text-[10px] uppercase font-bold text-slate-400 tracking-wider mb-1 block">Bairro / Comunidade / Localidade</label>
                <input value={bairro} onChange={e => setBairro(e.target.value)} placeholder="Ex: Comunidade do Sebinho, Chatuba..." className="w-full input-pro rounded-xl p-3 text-xs font-medium" />
              </div>

              <div>
                <label className="text-[10px] uppercase font-bold text-slate-400 tracking-wider mb-1 block">Relato Técnico &amp; Ações de Campo</label>
                <textarea value={rel} onChange={e => setRel(e.target.value)} rows="3" placeholder="Descreva as condições estruturais, trincas, vazamentos ou medidas mitigadoras..." className="w-full input-pro rounded-xl p-3 text-xs font-medium resize-none"></textarea>
              </div>
            </div>
          </div>
        </div>
      </div>

      {/* Botões de Ação Final */}
      <div className="grid grid-cols-1 sm:grid-cols-2 gap-3 pt-2">
        <button onClick={enviarWhatsapp} className="w-full py-4 bg-[#25D366] hover:bg-[#20ba5a] text-black font-black rounded-xl text-xs tracking-wider shadow-lg transition flex items-center justify-center space-x-2">
          <span>ENVIAR RELATÓRIO + FOTOS (WHATSAPP)</span>
        </button>

        <button onClick={exportarPDF} disabled={loadingPdf} className="w-full py-4 bg-white hover:bg-slate-100 text-black font-black rounded-xl text-xs tracking-wider shadow-lg transition flex items-center justify-center space-x-2">
          {loadingPdf ? <span className="animate-pulse">PROCESSANDO LAUDO PDF...</span> : <span>EXPORTAR LAUDO PDF OFICIAL (HASH SHA-256)</span>}
        </button>
      </div>

      <p className="text-[9px] text-slate-500 text-center tracking-widest uppercase mono">
        SARAH AI NEXUS // COBERTURA INTEGRAL DOS 92 MUNICÍPIOS DO RIO DE JANEIRO (COM MAPA TÁTICO INTEGRADO)
      </p>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
