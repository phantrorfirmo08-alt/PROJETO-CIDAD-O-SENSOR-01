                                </div>

                                <div className="space-y-3">
                                    <label className="flex items-start gap-3 cursor-pointer text-xs text-slate-300 bg-commandPanel/80 p-3.5 rounded-xl border border-cyberCyan/20">
                                        <input type="checkbox" checked={check1} onChange={(e) => setCheck1(e.target.checked)} className="mt-0.5 rounded border-cyberCyan/50 text-cyberCyan w-4 h-4 bg-void shrink-0 cursor-pointer" />
                                        <span>Li e aceito os Termos e a LGPD.</span>
                                    </label>
                                    <label className="flex items-start gap-3 cursor-pointer text-xs text-slate-300 bg-commandPanel/80 p-3.5 rounded-xl border border-cyberCyan/20">
                                        <input type="checkbox" checked={check2} onChange={(e) => setCheck2(e.target.checked)} className="mt-0.5 rounded border-cyberCyan/50 text-cyberCyan w-4 h-4 bg-void shrink-0 cursor-pointer" />
                                        <span>Autorizo o uso obrigatório do GPS para vistorias.</span>
                                    </label>
                                </div>

                                <button disabled={!check1 || !check2} onClick={() => { setTermsAccepted(true); try { localStorage.setItem("sarah_terms_accepted_v52_lgpd", "1"); } catch(e) {} showToast("🚀 Núcleo OMEGA ativado!"); }} className={`w-full py-4 rounded-2xl font-display font-black text-xs uppercase tracking-[0.2em] transition shadow-2xl ${check1 && check2 ? 'cyber-button text-void cursor-pointer' : 'bg-commandPanel text-slate-500 cursor-not-allowed'}`}>
                                    Concordar e Iniciar Operação
                                </button>
                            </div>
                        </div>
                    )}

                    <header className="cyber-card sticky top-0 z-30 px-4 sm:px-6 py-3.5 border-b border-cyberCyan/30 flex items-center justify-between shadow-2xl">
                        <div className="flex items-center gap-3">
                            <div className="w-11 h-11 rounded-2xl cyber-border-glow flex items-center justify-center bg-void shadow-[0_0_25px_rgba(0,242,254,0.35)]">
                                <svg width="22" height="22" viewBox="0 0 24 24" fill="url(#headerGrad)"><path d="M13 2L3 14h7l-1 8 10-12h-7l1-8z"/><defs><linearGradient id="headerGrad" x1="3" y1="2" x2="21" y2="22"><stop stopColor="#00F2FE" /><stop offset="0.6" stopColor="#4FACFE" /><stop offset="1" stopColor="#10B981" /></linearGradient></defs></svg>
                            </div>
                            <div>
                                <h1 className="font-display text-xs sm:text-sm font-black text-white tracking-[0.15em]">SARAH IA NEXUS <span className="bg-gradient-to-r from-cyberCyan to-cyberGreen bg-clip-text text-transparent text-[10px]">v7.0 OMEGA</span></h1>
                                <p className="text-[9px] text-cyberGreen font-mono font-bold tracking-wider">COMMAND CENTER • MESQUITA/RJ</p>
                            </div>
                        </div>
                        <div className="flex items-center gap-2">
                            <button onClick={() => setSoundEnabled(!soundEnabled)} className={`p-2.5 rounded-xl border text-xs cursor-pointer transition ${soundEnabled ? 'bg-cyberPurple/20 border-cyberPurple text-cyberPurple shadow' : 'bg-commandPanel border-cyberPurple/20 text-slate-500'}`} title={soundEnabled ? "Som Ativado" : "Mudo"}>{soundEnabled ? '🔊' : '🔇'}</button>
                            <button onClick={toggleTheme} className="p-2.5 rounded-xl border border-cyberCyan/30 bg-commandPanel text-cyberCyan text-xs cursor-pointer shadow" title="Alternar Tema">🎨</button>
                            <button onClick={openShareFromApp} className="p-2.5 rounded-xl border border-cyberCyan/30 bg-commandPanel text-cyberCyan text-xs cursor-pointer shadow" title="Compartilhar App">📲</button>
                            <button onClick={handleInstallApp}
                                className={`p-2.5 rounded-xl border text-xs cursor-pointer shadow transition ${isInstallable ? 'bg-cyberGreen/20 border-cyberGreen text-cyberGreen animate-pulse' : 'border-cyberCyan/30 bg-commandPanel text-cyberCyan'}`}
                                title={isInstallable ? "Instalar App" : "Instalar"}>
                                📥
                            </button>
                        </div>
                    </header>

                    <nav className="cyber-card border-b border-cyberCyan/30 px-4 py-2.5 flex items-center justify-center gap-2 overflow-x-auto z-20">
                        {NAV_TABS.map(tab => (
                            <button key={tab.id} onClick={() => tab.id === 'radar' ? setRadarOpen(true) : setActiveTab(tab.id)}
                                className={`px-4 py-2 rounded-2xl text-[11px] font-black transition cursor-pointer flex items-center gap-2 shrink-0 tracking-wider ${
                                    activeTab === tab.id
                                        ? 'cyber-button text-void shadow-[0_0_25px_rgba(0,242,254,0.5)]'
                                        : 'bg-commandPanel text-slate-300 border border-cyberCyan/20'
                                }`}>
                                {renderTabIcon(tab)} {tab.label}
                            </button>
                        ))}
                    </nav>

                    <main className="flex-1 max-w-3xl w-full mx-auto p-4 sm:p-6 space-y-5 pb-32 relative z-10">
                        {activeTab === 'dashboard' && (
                            <div className="space-y-5">
                                <div className="cyber-card p-6 sm:p-8 rounded-[36px] shadow-2xl space-y-6 text-center border border-cyberCyan/40">
                                    <SarahHologramAvatar isLarge={true} isSpeaking={isSpeaking} />

                                    <div className="space-y-2">
                                        <div className="inline-flex items-center px-4 py-1.5 rounded-full bg-cyberPurple/15 border border-cyberPurple/35 font-mono text-[10px] text-cyberPurple tracking-widest shadow-inner">
                                            CENTRAL DE INTELIGÊNCIA COMUNITÁRIA & METEOROLOGIA
                                        </div>
                                        <h2 className="font-display text-base font-black text-white tracking-wide">CENTRAL OMEGA & CLIMA</h2>
                                        <p className="text-xs text-slate-300 font-medium italic">
                                            "Prevenção não é mídia: é gente atenta." A Sarah conversa sobre clima, bacias, fé, cultura, lazer, culinária e cidadania.
                                        </p>
                                    </div>

                                    <button onClick={openSarahChat} className="relative w-full max-w-sm mx-auto flex items-center justify-center gap-3 py-4 px-6 rounded-[26px] cyber-button text-void font-display font-black text-sm uppercase tracking-[0.2em] shadow-[0_0_50px_rgba(0,242,254,0.6)] cursor-pointer">
                                        💬 Falar com a Sarah IA
                                    </button>

                                    {saraTip && (
                                        <div className="bg-void/90 border border-cyberRose/30 rounded-2xl p-4 text-left space-y-1.5 shadow-inner">
                                            <div className="flex items-center gap-2 text-[10px] font-display font-black text-cyberRose tracking-widest">
                                                <span className="w-1.5 h-1.5 rounded-full bg-cyberRose animate-ping"></span>
                                                SARAH FALANDO AGORA • {saraTip.tag}
                                            </div>
                                            <p className="text-xs text-slate-200 leading-relaxed">{saraTip.text}</p>
                                        </div>
                                    )}

                                    <div className="flex flex-wrap justify-center gap-2">
                                        <button onClick={openSarahChat} className="px-4 py-2 bg-void border border-cyberCyan/30 hover:border-cyberCyan text-cyberCyan rounded-2xl text-[11px] font-bold transition cursor-pointer">🌊 Bacias</button>
                                        <button onClick={openSarahChat} className="px-4 py-2 bg-void border border-cyberCyan/30 hover:border-cyberCyan text-cyberCyan rounded-2xl text-[11px] font-bold transition cursor-pointer">🌦️ Clima</button>
                                        <button onClick={openSarahChat} className="px-4 py-2 bg-void border border-cyberCyan/30 hover:border-cyberCyan text-cyberCyan rounded-2xl text-[11px] font-bold transition cursor-pointer">🛡️ Defesa Civil</button>
                                        <button onClick={openSarahChat} className="px-4 py-2 bg-void border border-cyberRose/30 hover:border-cyberRose text-cyberRose rounded-2xl text-[11px] font-bold transition cursor-pointer">🙏 Fé & Cultura</button>
                                    </div>
                                </div>
                            </div>
                        )}

                        {activeTab === 'relatorio' && <FieldReportModule onBackToDashboard={() => setActiveTab('dashboard')} showToast={showToast} />}
                        {activeTab === 'galeria' && <PublicVideoGallery localVideos={localVideos} onGoToDashboard={() => setActiveTab('dashboard')} />}
                        {activeTab === 'admin' && (
                            <AdminVaultModule
                                localVideos={localVideos}
                                setLocalVideos={setLocalVideos}
                                marketingText={marketingText}
                                setMarketingText={setMarketingText}
                                showToast={showToast}
                                onClose={() => setActiveTab('dashboard')}
                            />
                        )}

                        <AutomatedObservatoryWidget marketingText={marketingText} />
                    </main>

                    {termsAccepted && <SarahFabButton onOpen={openSarahChat} />}

                    <NativeHydroWindRadar isOpen={radarOpen} onToggle={() => setRadarOpen(o => !o)} />

                    <SarahChatOverlay
                        isOpen={isChatOpen}
                        onClose={() => { setIsChatOpen(false); stopSpeaking(); }}
                        isSpeaking={isSpeaking}
                        isProcessing={isProcessing}
                        currentResponse={currentResponse}
                        input={input}
                        setInput={setInput}
                        handleSendDirectCommand={handleSendDirectCommand}
                        toggleListening={toggleListening}
                        isListening={isListening}
                    />

                    <footer className="cyber-card fixed bottom-0 left-0 right-0 z-40 border-t border-cyberCyan/30 px-4 py-3 flex items-center justify-around shadow-2xl backdrop-blur-2xl">
                        {NAV_TABS.map(tab => (
                            <button key={tab.id} onClick={() => tab.id === 'radar' ? setRadarOpen(true) : setActiveTab(tab.id)}
                                className={`flex flex-col items-center gap-1 cursor-pointer transition ${activeTab === tab.id ? 'text-cyberCyan scale-105' : 'text-slate-400 hover:text-white'}`}>
                                {renderTabIcon(tab)}
                                <span className="text-[9px] font-black tracking-wider">{tab.label}</span>
                            </button>
                        ))}
                    </footer>
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
    <script>
        if ("serviceWorker" in navigator) {
            window.addEventListener("load", () => {
                navigator.serviceWorker.register("./service-worker.js")
                    .then((reg) => console.log("🛡 SARAH OMEGA: Service Worker ativo."))
                    .catch((err) => console.warn("SW não registrado:", err));
            });
        }
    </script>
</body>
</html>
