function falarSarah(texto, vozIndex = 0) {
  if (!("speechSynthesis" in window)) return;
  try {
    window.speechSynthesis.cancel();
    const cleanText = String(texto).replace(/([\u2700-\u27BF]|[\uE000-\uF8FF]|\uD83C[\uDC00-\uDFFF]|\uD83D[\uDC00-\uDFFF]|[\u2011-\u26FF]|\uD83E[\uDD00-\uDDFF])/g, '').replace(/https?:\/\/\S+/g, "").trim();
    if (!cleanText) return;
    const utterance = new SpeechSynthesisUtterance(cleanText);
    utterance.lang = "pt-BR";
    const voices = window.speechSynthesis.getVoices();
    const ptVoices = voices.filter(v => v.lang.toLowerCase().includes('pt'));
    const targetVoice = ptVoices[vozIndex] || ptVoices[0] || voices[0];
    if (targetVoice) utterance.voice = targetVoice;
    window.speechSynthesis.speak(utterance);
  } catch(e) {}
}

            <div className="bg-commandPanel/90 border border-cyberCyan/40 rounded-xl p-3.5 text-[11px] text-slate-200 leading-relaxed space-y-2.5 shadow-inner">
              <p>Em conformidade com a <strong>Lei Federal nº 13.709/2018 (LGPD)</strong> e as normativas de proteção de dados e resiliência urbana:</p>
              <ul className="list-disc pl-4 space-y-1 text-[10px] text-slate-300">
                <li>Os dados de geolocalização (GPS) e relatórios de vistoria são armazenados exclusivamente no dispositivo local (LocalStorage) do operador.</li>
                <li>O sistema opera em malha comunitária independente, garantindo soberania popular, privacidade e integridade nas comunicações da Defesa Civil Comunitária.</li>
                <li>O uso de acionamentos e relatórios pressupõe responsabilidade cívica e alinhamento com as diretrizes do Grupo A Chave da Esperança (GADE).</li>
              </ul>
            </div>

            <div className="space-y-2.5 pt-1">
              <label className="flex items-start gap-2.5 cursor-pointer text-[11px] text-slate-200 bg-commandPanel/80 p-3 rounded-xl border border-cyberCyan/30">
                <input type="checkbox" checked={check1} onChange={(e) => setCheck1(e.target.checked)} className="mt-0.5 rounded text-cyberCyan w-4 h-4 bg-void cursor-pointer shrink-0" />
                <span>Declaro estar ciente e de acordo com os termos de governança, responsabilidade técnica e LGPD.</span>
              </label>
              <label className="flex items-start gap-2.5 cursor-pointer text-[11px] text-slate-200 bg-commandPanel/80 p-3 rounded-xl border border-cyberCyan/30">
                <input type="checkbox" checked={check2} onChange={(e) => setCheck2(e.target.checked)} className="mt-0.5 rounded text-cyberCyan w-4 h-4 bg-void cursor-pointer shrink-0" />
                <span>Autorizo o uso temporário do GPS exclusivamente para os protocolos de vistoria de risco e emergência.</span>
              </label>
            </div>

            <button disabled={!check1 || !check2} onClick={() => { setTermsAccepted(true); try { localStorage.setItem("raru_cyber_terms", "1"); } catch(e) {} }} className={`cyber-button-solid w-full text-xs py-3.5 ${check1 && check2 ? '' : 'opacity-50 cursor-not-allowed'}`}>
              CONCORDAR E INICIAR SALA DE COMANDO TÁTICA
            </button>
          </div>
        </div>
      )}

      {/* CABEÇALHO COM O BOTÃO DE CLARO/ESCURO FUNCIONAL */}
      <header className="cyber-card sticky top-0 z-30 w-full px-4 py-3 border-b border-cyberCyan/40 flex items-center justify-between shadow-lg rounded-2xl mb-2">
        <div className="flex items-center gap-2.5 cursor-pointer" onClick={() => setIsChatOpen(true)}>
          <div className="w-8 h-8 overflow-hidden rounded-full border border-cyberCyan shrink-0">
            <SarahVectorAvatar/>
          </div>
          <div>
            <h1 className="font-display text-xs sm:text-sm font-black text-white leading-none">Sarah AI Nexus V11.2 • Comando</h1>
            <p className="text-[8px] text-cyberCyan font-mono mt-0.5">Operador: {userName || 'Alexander'} • Mesquita - RJ</p>
          </div>
        </div>
        <div className="flex items-center gap-2">
          <button onClick={toggleCommandHUD} className="cyber-button text-[9px] py-2 px-3">HUD TELA CHEIA</button>
          <button onClick={() => { setSoundEnabled(!soundEnabled); showToast(!soundEnabled ? "Áudio ativado" : "Áudio silenciado"); }} className="cyber-button text-[9px] py-2 px-3">
            {soundEnabled ? 'ÁUDIO ON' : 'MUDO'}
          </button>
          {/* BOTÃO DE TEMA CLARO/ESCURO 100% OPERACIONAL */}
          <button onClick={toggleTheme} className="cyber-button text-[9px] py-2 px-3 !border-cyberAmber !text-cyberAmber">
            {theme === 'dark' ? '☀️ DIURNO' : '🌙 NOTURNO'}
          </button>
        </div>
      </header>

      <main className="flex-1 w-full mx-auto py-2 space-y-4 pb-28 relative z-10">
        {activeTab === 'dashboard' && (
          <CardIdentidadeVisualRARU 
            openSarahChat={() => setIsChatOpen(true)}
            handleWhoAmIClick={() => showToast("Projeto Cidadão Sensor & GADE - Mesquita RJ")}
            setActiveTab={setActiveTab}
            toggleCommandHUD={toggleCommandHUD}
            userName={userName}
            onOpenNameModal={() => { setTempNameInput(userName); setNameModalOpen(true); }}
          />
        )}
        {activeTab === 'estacao' && (
          <EstacaoGADEModule showToast={showToast} userName={userName} />
        )}
        {activeTab === 'balanca' && (
          <div className="cyber-card p-6 text-center space-y-4">
            <h2 className="font-display text-sm font-black text-cyberCyan">MÓDULO BALANÇA DIGITAL & ESG</h2>
            <p className="text-xs text-slate-300">Controle de triagem de recicláveis, impacto ecológico e economia circular da Baixada Fluminense.</p>
            <button onClick={() => setActiveTab('dashboard')} className="cyber-button text-xs py-2 px-4">VOLTAR AO PAINEL</button>
          </div>
        )}

        <AutomatedObservatoryWidget customTickerText={customTickerText}/>
      </main>

      <footer className="cyber-card fixed bottom-0 left-0 right-0 z-40 border-t border-cyberCyan/40 px-2 py-3 flex items-center justify-around gap-1 shadow-2xl backdrop-blur-xl max-w-[1400px] mx-auto rounded-t-2xl">
        <button onClick={() => setActiveTab('dashboard')} className="cyber-button text-[9px] py-2 px-4">PAINEL</button>
        <button onClick={() => setActiveTab('estacao')} className="cyber-button text-[9px] py-2 px-4">ESTAÇÃO GADE</button>
        <button onClick={() => setActiveTab('balanca')} className="cyber-button text-[9px] py-2 px-4">BALANÇA & ESG</button>
      </footer>
    </div>
  );
}

try {
  const rootElement = document.getElementById('root');
  ReactDOM.createRoot(rootElement).render(<App/>);
} catch (err) {
  document.getElementById('root').innerHTML = `<div style="padding:20px;color:#FF0055;font-family:monospace;">Erro ao iniciar interface: ${err.message}</div>`;
}
</script>
</body>
</html>
