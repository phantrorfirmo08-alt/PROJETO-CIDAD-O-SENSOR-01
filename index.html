        function falarSarah(texto, customProfile = null) {
            if (!("speechSynthesis" in window)) return;
            try {
                window.speechSynthesis.cancel();
                const cleanText = String(texto).replace(/([\u2700-\u27BF]|[\uE000-\uF8FF]|\uD83C[\uDC00-\uDFFF]|\uD83D[\uDC00-\uDFFF]|[\u2011-\u26FF]|\uD83E[\uDD00-\uDDFF])/g, '').replace(/https?:\/\/\S+/g, "").trim();
                if (!cleanText) return;
                
                const utterance = new SpeechSynthesisUtterance(cleanText);
                utterance.lang = "pt-BR";
                
                const prof = customProfile || globalVoiceProfile;
                if (prof === 'humana') {
                    utterance.rate = 1.0;
                    utterance.pitch = 1.25;
                } else if (prof === 'militar') {
                    utterance.rate = 1.1;
                    utterance.pitch = 0.9;
                } else {
                    utterance.rate = 1.02;
                    utterance.pitch = 1.05;
                }

                const voices = window.speechSynthesis.getVoices();
                const selectedVoice = voices.find(v => v.lang.toLowerCase().includes('pt-br') && v.name.toLowerCase().includes('female')) || voices.find(v => v.lang.toLowerCase().includes('pt')) || voices[0];
                if (selectedVoice) utterance.voice = selectedVoice;
                window.speechSynthesis.speak(utterance);
            } catch(e) {}
        }

        function playChameleonSound() {
            try {
                const AudioCtx = window.AudioContext || window.webkitAudioContext;
                if (!AudioCtx) return;
                const ctx = new AudioCtx();
                if (ctx.state === 'suspended') ctx.resume();
                const bufferSize = ctx.sampleRate * 1.2;
                const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
                const data = buffer.getChannelData(0);
                for (let i = 0; i < bufferSize; i++) { data[i] = (Math.random() * 2 - 1) * Math.sin(i / 800); }
                const noiseSource = ctx.createBufferSource();
                noiseSource.buffer = buffer;
                const filter = ctx.createBiquadFilter();
                filter.type = 'lowpass';
                filter.frequency.setValueAtTime(350, ctx.currentTime);
                filter.frequency.exponentialRampToValueAtTime(120, ctx.currentTime + 1.2);
                const gainNode = ctx.createGain();
                gainNode.gain.setValueAtTime(0.8, ctx.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 1.2);
                noiseSource.connect(filter); filter.connect(gainNode); gainNode.connect(ctx.destination);
                noiseSource.start();
            } catch (e) {}
        }

        function AdminVaultModule({ showToast, onClose }) {
            const [pin, setPin] = useState("");
            const [unlocked, setUnlocked] = useState(false);
            const [tipoAlarme, setTipoAlarme] = useState('CEMADEN');
            const [statusDual, setStatusDual] = useState('SISTEMA EM ESPERA');
            const [timerText, setTimerText] = useState('00:00');
            const audioRef = useRef({ ctx: null, osc: null, gain: null, int: null, timer: null, seg: 0 });

            const pararAlarme = () => {
                const a = audioRef.current;
                if(a.int) clearInterval(a.int);
                if(a.timer) clearInterval(a.timer);
                if(a.osc) try{ a.osc.stop(); }catch(e){}
                a.osc = null;
                setStatusDual('ALARME DESATIVADO');
                setTimerText('00:00');
            };

            const ativarAlarme = () => {
                const a = audioRef.current;
                if(!a.ctx) a.ctx = new (window.AudioContext || window.webkitAudioContext)();
                if(a.ctx.state === 'suspended') a.ctx.resume();
                pararAlarme();
                a.seg = 180;
                setStatusDual(tipoAlarme === 'RUSSO' ? 'SIRENE MILITAR RUSSA EM EXECUÇÃO' : 'SIRENE PADRÃO CEMADEN EM EXECUÇÃO');

                a.osc = a.ctx.createOscillator();
                a.gain = a.ctx.createGain();
                a.osc.type = tipoAlarme === 'RUSSO' ? 'sawtooth' : 'sine';
                a.osc.frequency.value = 440;
                a.gain.gain.value = 0.4;
                a.osc.connect(a.gain);
                a.gain.connect(a.ctx.destination);
                a.osc.start();

                a.int = setInterval(() => {
                    if(a.osc) {
                        a.osc.frequency.setValueAtTime(tipoAlarme === 'RUSSO' ? 800 : 600, a.ctx.currentTime);
                        a.osc.frequency.exponentialRampToValueAtTime(tipoAlarme === 'RUSSO' ? 300 : 400, a.ctx.currentTime + 0.8);
                    }
                }, 1000);

                a.timer = setInterval(() => {
                    a.seg--;
                    const m = String(Math.floor(a.seg / 60)).padStart(2, '0');
                    const s = String(a.seg % 60).padStart(2, '0');
                    setTimerText(`${m}:${s}`);
                    if(a.seg <= 0) { pararAlarme(); setStatusDual('CICLO CONCLUÍDO'); }
                }, 1000);
            };

            return (
                <div className="cyber-card p-5 font-mono space-y-4 shadow-2xl">
                    <div className="flex justify-between items-center border-b border-cyberCyan/30 pb-3">
                        <h2 className="font-display text-xs font-black text-cyberCyan uppercase">ÁREA RESTRITA (ADMIN VAULT V11)</h2>
                        <button onClick={onClose} className="px-3 py-1.5 bg-cyberRose/20 text-cyberRose rounded-xl text-xs font-bold">✕ Fechar</button>
                    </div>

                    {!unlocked ? (
                        <form onSubmit={e => {e.preventDefault(); if(pin==="303500") { setUnlocked(true); showToast("Acesso Liberado!"); } else showToast("PIN Incorreto");}} className="flex flex-col gap-3">
                            <p className="text-xs text-slate-300">Insira a chave PIN de autorização técnica:</p>
                            <div className="flex gap-2">
                                <input type="password" maxLength="6" value={pin} onChange={e => setPin(e.target.value)} placeholder="PIN..." className="flex-1 bg-void border border-cyberCyan/40 rounded-xl px-4 py-3 text-center text-xs text-white font-mono tracking-widest" />
                                <button type="submit" className="px-5 py-3 cyber-button text-xs font-black">Entrar</button>
                            </div>
                        </form>
                    ) : (
                        <div className="space-y-4">
                            <div className="bg-void/90 p-4 rounded-xl border border-red-500/40 space-y-3">
                                <h3 className="text-xs font-bold text-white text-center uppercase tracking-wider">SISTEMA DUAL DE SIRENE DE EVACUAÇÃO</h3>
                                <div className="grid grid-cols-2 gap-2">
                                    <button onClick={() => setTipoAlarme('RUSSO')} className={`py-2.5 rounded-xl border text-xs font-bold transition ${tipoAlarme==='RUSSO'?'bg-red-600 border-white text-white shadow-lg':'bg-deepSpace border-cyberCyan/30 text-slate-300'}`}>Sirene Militar Russa</button>
                                    <button onClick={() => setTipoAlarme('CEMADEN')} className={`py-2.5 rounded-xl border text-xs font-bold transition ${tipoAlarme==='CEMADEN'?'bg-red-600 border-white text-white shadow-lg':'bg-deepSpace border-cyberCyan/30 text-slate-300'}`}>Sirene Cemaden BR</button>
                                </div>
                                <div className="flex gap-2">
                                    <button onClick={ativarAlarme} className="flex-1 py-3 cyber-button text-xs uppercase font-black bg-gradient-to-r from-red-500 to-rose-700 text-white">Disparar Alarme Alerta</button>
                                    <button onClick={pararAlarme} className="px-4 py-3 bg-deepSpace border border-cyberCyan/40 text-white rounded-xl text-xs font-bold">Cessar</button>
                                </div>
                                <div className="text-center text-xs text-cyberCyan font-bold">{statusDual} • {timerText}</div>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

                            <form onSubmit={e => {e.preventDefault(); handleSendDirectCommand();}} className="flex gap-2.5">
                                <input type="text" value={input} onChange={e => setInput(e.target.value)} placeholder="Digite seu comando ou dúvida..." className="flex-1 bg-void border border-cyberCyan/40 rounded-xl px-3.5 py-2.5 text-xs text-white" />
                                <button type="submit" className="px-5 py-2.5 cyber-button text-xs font-black">Enviar</button>
                            </form>
                        </div>
                    </div>
                </div>
            );
        }

        function App() {
            const [theme, setTheme] = useState('dark');
            const [soundEnabled, setSoundEnabled] = useState(true);
            const [isSpeaking, setIsSpeaking] = useState(false);
            const [activeTab, setActiveTab] = useState("dashboard");
            const [chameleonActive, setChameleonActive] = useState(false);
            const [quemSomosOpen, setQuemSomosOpen] = useState(false);
            const [isCommandHUDActive, setIsCommandHUDActive] = useState(false);
            const [toastMsgRef, setToastMsgRef] = useState(null);
            const [isChatOpen, setIsChatOpen] = useState(false);
            const [input, setInput] = useState("");
            const [messages, setMessages] = useState([{ sender: 'assistant', text: 'Olá Alexander! Sou a Analista Sênior da CIDADÃO SENSOR V11 Plus. Como posso ajudar com a telemetria e resiliência hoje?', time: '00:00' }]);

            const showToast = (msg) => { setToastMsgRef(msg); setTimeout(() => setToastMsgRef(null), 3500); };

            const toggleCommandHUD = () => {
                if (!isCommandHUDActive) {
                    if (document.documentElement.requestFullscreen) document.documentElement.requestFullscreen().catch(()=>{});
                    setIsCommandHUDActive(true);
                    showToast("MODO SUTÍL / HUD ATIVADO!");
                } else {
                    if (document.exitFullscreen && document.fullscreenElement) document.exitFullscreen().catch(()=>{});
                    setIsCommandHUDActive(false);
                    showToast("Modo Padrão");
                }
            };

            const toggleTheme = () => {
                setTheme(prev => {
                    const next = prev === 'dark' ? 'warm' : 'dark';
                    if (next === 'warm') {
                        document.documentElement.classList.remove('dark');
                        document.documentElement.classList.add('warm');
                    } else {
                        document.documentElement.classList.add('dark');
                        document.documentElement.classList.remove('warm');
                    }
                    return next;
                });
            };

            const handleSendDirectCommand = async () => {
                if(!input.trim()) return;
                const txt = input; setInput("");
                setMessages(prev => [...prev, { sender: 'user', text: txt, time: 'Agora' }]);
                setIsSpeaking(true);
                setTimeout(() => {
                    const resp = "Análise de telemetria processada. As subestações virtuais dos 92 municípios estão operando dentro do padrão esperado.";
                    setMessages(prev => [...prev, { sender: 'assistant', text: resp, time: 'Agora' }]);
                    if(soundEnabled) falarSarah(resp);
                    setTimeout(() => setIsSpeaking(false), 4000);
                }, 600);
            };

            const NAV_TABS = [
                { id: 'dashboard', iconComponent: <IconDashboard className="w-4 h-4" />, label: 'Painel' },
                { id: 'radar', iconComponent: <IconRadar className="w-4 h-4" />, label: 'Radar' },
                { id: 'relatorio', iconComponent: <IconVistoria className="w-4 h-4" />, label: 'Vistoria' },
                { id: 'estacao', iconComponent: <IconEstacao className="w-4 h-4" />, label: 'Estação' },
                { id: 'alquino', iconComponent: <IconAlquino className="w-4 h-4" />, label: 'Alquino' },
                { id: 'compartilhar', iconComponent: <IconInstalar className="w-4 h-4" />, label: 'Instalar' },
                { id: 'quem-somos', iconComponent: <IconQuemSomos className="w-4 h-4" />, label: 'Sobre' },
                { id: 'galeria', iconComponent: <IconVideos className="w-4 h-4" />, label: 'Vídeos' },
                { id: 'admin', iconComponent: <IconAdmin className="w-4 h-4" />, label: 'Admin' }
            ];

            const handleNavClick = (tabId) => {
                if (tabId === 'compartilhar') {
                    if (navigator.share) {
                        navigator.share({ title: 'CIDADÃO SENSOR V11', text: shareMessageText, url: APP_SHARE_URL }).catch(()=>{});
                    } else {
                        navigator.clipboard.writeText(APP_SHARE_URL);
                        showToast("Link oficial copiado para a área de transferência!");
                    }
                }
                else if (tabId === 'quem-somos') setQuemSomosOpen(true);
                else setActiveTab(tabId);
            };

            return (
                <div className="seu-container-raru">
                    {toastMsgRef && <div className="fixed top-14 left-1/2 -translate-x-1/2 z-50 cyber-card px-5 py-3 rounded-2xl font-display text-xs font-black text-cyberCyan shadow-2xl border border-cyberCyan/60 animate-bounce">{toastMsgRef}</div>}

                    <header className="cyber-card sticky top-0 z-30 w-full px-3.5 py-2.5 border-b border-cyberCyan/40 flex items-center justify-between shadow-lg rounded-2xl my-2">
                        <div className="flex items-center gap-2.5 cursor-pointer" onClick={() => setIsChatOpen(true)}>
                            <div className="w-8 h-8 overflow-hidden rounded-full border border-cyberCyan flex items-center justify-center bg-deepSpace p-0.5">
                                <ShieldV11Icon className="w-full h-full" />
                            </div>
                            <div>
                                <h1 className="font-display text-[10px] font-black text-white">CIDADÃO SENSOR</h1>
                                <p className="text-[7px] text-cyberCyan font-mono">Mesquita - RJ</p>
                            </div>
                        </div>
                        <div className="flex items-center gap-1.5">
                            <button onClick={toggleCommandHUD} className={`px-2.5 py-1.5 rounded-lg border text-[8px] font-black ${isCommandHUDActive ? 'bg-cyberRose text-void animate-pulse' : 'bg-cyberCyan text-void'}`}>HUD</button>
                            <button onClick={() => { setChameleonActive(!chameleonActive); if(!chameleonActive) playChameleonSound(); }} className="px-2 py-1.5 rounded-lg border border-cyberCyan text-cyberCyan text-[7px] font-bold">Camaleão</button>
                            <button onClick={() => setSoundEnabled(!soundEnabled)} className="w-8 h-8 rounded-lg border border-cyberCyan/50 flex items-center justify-center text-cyberCyan">
                                {soundEnabled ? '🔊' : '🔇'}
                            </button>
                            <button onClick={toggleTheme} className="w-8 h-8 rounded-lg border border-cyberCyan text-cyberCyan flex items-center justify-center">
                                <span className="text-xs">{theme === 'dark' ? '🌙' : '☀️'}</span>
                            </button>
                        </div>
                    </header>

                    <nav className="cyber-card w-full border-b border-cyberCyan/35 px-2 py-2 flex items-center justify-between gap-1 overflow-x-auto z-20">
                        {NAV_TABS.map(tab => (
                            <button key={tab.id} onClick={() => handleNavClick(tab.id)} className={`flex-1 min-w-[62px] py-1.5 px-1 rounded-xl text-[9px] font-black transition cursor-pointer flex flex-col items-center justify-center gap-0.5 tracking-wider touch-manipulation ${activeTab === tab.id ? 'cyber-button shadow-[0_0_12px_rgba(0,242,254,0.5)] scale-[1.02]' : 'bg-commandPanel text-slate-300 border border-cyberCyan/20 hover:border-cyberCyan/50'}`}>
                                {tab.iconComponent} <span className="truncate w-full text-center">{tab.label}</span>
                            </button>
                        ))}
                    </nav>

                    <main className="flex-1 w-full mx-auto py-4 space-y-5 pb-28 relative z-10">
                        {activeTab === 'dashboard' && <CardIdentidadeVisualRARU openShareFromApp={()=>{}} openSarahChat={() => setIsChatOpen(true)} handleWhoAmIClick={() => setQuemSomosOpen(true)} setActiveTab={setActiveTab} toggleCommandHUD={toggleCommandHUD} />}
                        {activeTab === 'radar' && <NovoMapaRadarLeaflet showToast={showToast} />}
                        {activeTab === 'estacao' && <EstacaoSobrevivenciaModuleV11 showToast={showToast} />}
                        {activeTab === 'alquino' && <RedeAlquinoHardwareModule onGoToDashboard={() => setActiveTab('dashboard')} showToast={showToast} />}
                        {activeTab === 'relatorio' && <VistoriaRARU_NEXUS onBackToDashboard={() => setActiveTab('dashboard')} showToast={showToast} />}
                        {activeTab === 'galeria' && <PublicVideoGallery onGoToDashboard={() => setActiveTab('dashboard')} />}
                        {activeTab === 'admin' && <AdminVaultModule showToast={showToast} onClose={() => setActiveTab('dashboard')} />}

                        <AutomatedObservatoryWidget />
                    </main>

                    <SarahFabButton onOpen={() => setIsChatOpen(true)} isSpeaking={isSpeaking} />
                    <SarahChatOverlay isOpen={isChatOpen} onClose={() => setIsChatOpen(false)} isSpeaking={isSpeaking} messages={messages} input={input} setInput={setInput} handleSendDirectCommand={handleSendDirectCommand} />
                    <QuemSomosModal isOpen={quemSomosOpen} onClose={() => setQuemSomosOpen(false)} />

                    <footer className="cyber-card fixed bottom-0 left-0 right-0 z-40 border-t border-cyberCyan/40 px-2 py-2 flex items-center justify-around shadow-xl backdrop-blur-2xl max-w-[520px] mx-auto rounded-t-2xl">
                        {NAV_TABS.map(tab => (
                            <button key={tab.id} onClick={() => handleNavClick(tab.id)} className={`flex flex-col items-center gap-0.5 cursor-pointer flex-1 py-1 transition touch-manipulation ${activeTab === tab.id ? 'text-cyberCyan scale-105 bg-cyberCyan/15 rounded-xl border border-cyberCyan/30' : 'text-slate-400 hover:text-white'}`}>
                                {tab.iconComponent}
                                <span className="text-[7px] font-black truncate w-full text-center px-0.5">{tab.label}</span>
                            </button>
                        ))}
                    </footer>
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
