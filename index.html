                new Intl.DateTimeFormat("pt-BR", {
                    timeZone: "America/Sao_Paulo",
                    hour: "numeric",
                    hour12: false
                }).format(new Date()),
                10
            );
            if (hour >= 0 && hour < 5) return "Boa madrugada";
            if (hour >= 5 && hour < 12) return "Bom dia";
            if (hour >= 12 && hour < 18) return "Boa tarde";
            return "Boa noite";

        function NativeHydroWindRadar({ liveWeather }) {

            React.useEffect(() => {

            }, []);

            const handleReloadRadar = () => {

            return (

        // Módulo Webhook Vistoria com GPS integrado
        function WebhookSurveyModule({ showToast, onBackToChat }) {
            const [webhookApi, setWebhookApi] = React.useState(() => localStorage.getItem("sarah_webhook") || "");
            const [nome, setNome] = React.useState("");
            const [localizacao, setLocalizacao] = React.useState("");
            const [descricao, setDescricao] = React.useState("");
            const [whatsappDestino, setWhatsappDestino] = React.useState("");
            const [gpsStatus, setGpsStatus] = React.useState("📍 GPS desligado");
            const [lat, setLat] = React.useState("");
            const [lon, setLon] = React.useState("");
            const [mapsLink, setMapsLink] = React.useState("");
            const [isSending, setIsSending] = React.useState(false);

            const [foto1, setFoto1] = React.useState(null);
            const [foto2, setFoto2] = React.useState(null);
            const [foto3, setFoto3] = React.useState(null);
            const [foto4, setFoto4] = React.useState(null);

            const [status1, setStatus1] = React.useState("vazia");
            const [status2, setStatus2] = React.useState("vazia");
            const [status3, setStatus3] = React.useState("vazia");
            const [status4, setStatus4] = React.useState("vazia");

            const handleGetGps = () => {
                if (!navigator.geolocation) {
                    showToast("❌ Geolocalização não suportada.");
                    return;
                }
                navigator.geolocation.getCurrentPosition(
                    (p) => {
                        const lt = p.coords.latitude.toFixed(6);
                        const ln = p.coords.longitude.toFixed(6);
                        const lk = `https://maps.google.com/?q=${lt},${ln}`;
                        setLat(lt);
                        setLon(ln);
                        setMapsLink(lk);
                        setLocalizacao(`${lt},${ln}`);
                        setGpsStatus("✅ GPS Ativo");
                        showToast("📍 GPS Ativo e capturado com sucesso!");
                    },
                    () => showToast("❌ Erro ao obter sinal de GPS")
                );
            };

            const handleFileChange = (e, setFoto, setStatus) => {
                const file = e.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = (ev) => {
                    setFoto({ name: file.name, data: ev.target.result });
                    setStatus("OK");
                    showToast(`📷 Foto "${file.name}" anexada!`);
                };
                reader.readAsDataURL(file);
            };

            const enviarDados = async () => {
                let u = webhookApi.trim();
                let num = whatsappDestino.replace(/\D/g, '');
                if (!u || !num) {
                    showToast("⚠ Preencha Webhook e Número do WhatsApp!");
                    return;
                }
                localStorage.setItem("sarah_webhook", u);
                setIsSending(true);

                let payload = {
                    telefone: num,
                    nome: nome,
                    localizacao: localizacao,
                    descricao: descricao,
                    lat: lat || '',
                    lon: lon || '',
                    maps: mapsLink || '',
                    fotos: [foto1, foto2, foto3, foto4].filter(Boolean)
                };

                try {
                    let r = await fetch(u, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    });
                    if (r.ok) {
                        showToast("🚀 Enviado com sucesso via Webhook API!");
                    } else {
                        showToast("❌ Erro na resposta da API.");
                    }
                } catch {
                    showToast("❌ Erro de conexão com o Webhook.");
                } finally {
                    setIsSending(false);
                }
            };

            return (
                <div className="space-y-4">
                    <div className="flex items-center justify-between glass-dark px-4 py-3 rounded-2xl border border-cyberNeon/40">
                        <span className="text-xs font-bold text-cyberNeon flex items-center gap-2">
                            <span>📡</span> Módulo de Vistoria com GPS & Webhook API
                        </span>
                        <button 
                            onClick={onBackToChat} 
                            className="px-3.5 py-1.5 bg-coralAlert/25 hover:bg-coralAlert/40 text-coralAlert border border-coralAlert/50 rounded-xl text-xs font-bold transition cursor-pointer flex items-center gap-1.5"
                        >
                            <span>✕</span> Fechar
                        </button>
                    </div>

                    <div className="max-w-md w-full mx-auto" style={{background:'#0f172a', borderRadius:'20px', padding:'16px', border:'1px solid #1e293b', boxSizing:'border-box', fontFamily:'system-ui'}}>
                        <h2 style={{color:'#fff', margin:0, fontSize:'22px', fontWeight:900, lineHeight:1.1}}>Registro de Vistoria com GPS</h2>
                        <div style={{color:'#22d3ee', fontSize:'10px', fontWeight:700, margin:'6px 0 14px'}}>SARAH IA NEXUS v5.2 PRO</div>
                        
                        <label style={{color:'#94a3b8', fontSize:'10px', fontWeight:800, marginTop:'10px', display:'block'}}>Webhook API</label>
                        <input 
                            type="text" 
                            value={webhookApi} 
                            onChange={(e) => setWebhookApi(e.target.value)} 
                            placeholder="https://seu-webhook.com" 
                            style={{width:'100%', boxSizing:'border-box', background:'#1e293b', border:'1px solid #334155', color:'#fff', padding:'11px', borderRadius:'10px', marginTop:'5px', fontSize:'12px'}} 
                        />

                        <label style={{color:'#94a3b8', fontSize:'10px', fontWeight:800, marginTop:'10px', display:'block'}}>Nome</label>
                        <input 
                            type="text" 
                            value={nome} 
                            onChange={(e) => setNome(e.target.value)} 
                            placeholder="João Silva" 
                            style={{width:'100%', boxSizing:'border-box', background:'#1e293b', border:'1px solid #334155', color:'#fff', padding:'11px', borderRadius:'10px', marginTop:'5px', fontSize:'12px'}} 
                        />

                        <label style={{color:'#94a3b8', fontSize:'10px', fontWeight:800, marginTop:'10px', display:'block'}}>Localização</label>
                        <input 
                            type="text" 
                            value={localizacao} 
                            onChange={(e) => setLocalizacao(e.target.value)} 
                            placeholder="Rocha Sobrinho" 
                            style={{width:'100%', boxSizing:'border-box', background:'#1e293b', border:'1px solid #334155', color:'#fff', padding:'11px', borderRadius:'10px', marginTop:'5px', fontSize:'12px'}} 
                        />

                        <div style={{border:'1px dashed #22d3ee', background:'#162032', borderRadius:'12px', padding:'10px', display:'flex', justifyContent:'space-between', alignItems:'center', marginTop:'10px', fontSize:'11px', color:'#94a3b8'}}>
                            <span>{gpsStatus}</span>
                            <button 
                                type="button" 
                                onClick={handleGetGps} 
                                style={{background:'#22d3ee', border:'none', color:'#020617', fontWeight:'bold', padding:'6px 10px', borderRadius:'8px', cursor:'pointer'}}
                            >
                                Capturar
                            </button>
                        </div>

                        <label style={{color:'#94a3b8', fontSize:'10px', fontWeight:800, marginTop:'10px', display:'block'}}>Descrição - 1000 caracteres</label>
                        <textarea 
                            rows="3" 
                            maxLength="1000" 
                            value={descricao}
                            onChange={(e) => setDescricao(e.target.value)}
                            placeholder="Descreva..." 
                            style={{width:'100%', boxSizing:'border-box', background:'#1e293b', border:'1px solid #334155', color:'#fff', padding:'11px', borderRadius:'10px', marginTop:'5px', fontSize:'12px', resize:'none'}}
                        ></textarea>
                        <div style={{fontSize:'9px', color:'#64748b', textAlign:'right'}}>{descricao.length}/1000</div>

                        <label style={{color:'#22d3ee', fontSize:'10px', fontWeight:800, marginTop:'10px', display:'block'}}>WHATSAPP DESTINO</label>
                        <input 
                            type="text" 
                            value={whatsappDestino} 
                            onChange={(e) => setWhatsappDestino(e.target.value)} 
                            placeholder="5521999999999" 
                            style={{width:'100%', boxSizing:'border-box', background:'#1e293b', border:'1px solid #334155', color:'#fff', padding:'11px', borderRadius:'10px', marginTop:'5px', fontSize:'12px'}}

        function CustomVideoPlayer({ vid }) {
            const [isFullscreen, setIsFullscreen] = React.useState(false);
            const [isPlaying, setIsPlaying] = React.useState(false);
            const [isMuted, setIsMuted] = React.useState(false);
            const containerRef = React.useRef(null);
            const videoRef = React.useRef(null);

            const toggleFullscreenCustom = () => {
                setIsFullscreen(!isFullscreen);
            };

            const togglePlay = () => {
                if (videoRef.current) {
                    if (videoRef.current.paused) {
                        videoRef.current.play().then(() => {
                            setIsPlaying(true);
                        }).catch(() => {
                            videoRef.current.muted = true;
                            setIsMuted(true);
                            videoRef.current.play().then(() => setIsPlaying(true)).catch(() => {});
                        });
                    } else {
                        videoRef.current.pause();
                        setIsPlaying(false);
                    }
                }
            };

            const toggleMute = () => {
                if (videoRef.current) {
                    videoRef.current.muted = !videoRef.current.muted;
                    setIsMuted(videoRef.current.muted);
                }
            };

            return (
                <div 
                    ref={containerRef}
                    style={
                        isFullscreen 
                            ? { position: 'fixed', top: 0, left: 0, width: '100vw', height: '100vh', zIndex: 9999, background: 'black', display: 'flex', flexDirection: 'column', justifyContent: 'center', alignItems: 'center', padding: '10px' }
                            : { position: 'relative', width: '100%', height: '400px' }
                    }
                    className="rounded-xl overflow-hidden border border-cyberNeon/20 bg-black flex flex-col justify-between shadow-lg"
                >
                    <video 
                        ref={videoRef}
                        src={vid.url} 
                        playsInline 
                        preload="auto"
                        onPlay={() => setIsPlaying(true)}
                        onPause={() => setIsPlaying(false)}
                        className="w-full h-full object-contain bg-black flex-1"
                    />
                    
                    <div className="absolute bottom-0 left-0 right-0 bg-black/85 backdrop-blur-md p-2.5 flex items-center justify-between gap-2 z-20">
                        <div className="flex items-center gap-2">
                            <button onClick={togglePlay} className="px-4 py-1.5 bg-mintEmerald text-nightBlue rounded-lg text-xs font-black cursor-pointer shadow">
                                {isPlaying ? '❚❚ Pausar' : '▶ Play'}
                            </button>
                            <button onClick={toggleMute} className="px-3 py-1.5 bg-petroleumPanel text-cyberNeon border border-cyberNeon/40 rounded-lg text-xs font-bold cursor-pointer shadow">
                                {isMuted ? '🔇 Mudo' : '🔊 Som Ativado'}
                            </button>
                        </div>
                        <button 
                            onClick={toggleFullscreenCustom} 
                            className="px-4 py-1.5 bg-cyberNeon text-nightBlue rounded-lg text-xs font-bold transition cursor-pointer shadow"
                        >
                            {isFullscreen ? '🗗 Sair' : '🗖 Tela Cheia'}
                        </button>
                    </div>
                </div>
            );
        }

        function AdminVaultModule({ localVideos, setLocalVideos, showToast, onClose }) {
            const [pinInput, setPinInput] = React.useState("");
            const [isUnlocked, setIsUnlocked] = React.useState(false);

            const handleUnlock = (e) => {
                e.preventDefault();
                if (pinInput === "303500") {
                    setIsUnlocked(true);
                    showToast("🔓 Acesso Administrativo Autorizado!");
                } else {
                    showToast("❌ PIN incorreto.");
                }
            };

            const handleUploadVideo = (e) => {
                const files = Array.from(e.target.files);
                if (files.length === 0) return;

                files.forEach(file => {
                    const reader = new FileReader();
                    reader.onload = (uploadEvt) => {
                        const base64Url = uploadEvt.target.result;
                        const newVid = {
                            id: Date.now() + Math.random(),
                            title: file.name,
                            url: base64Url
                        };
                        setLocalVideos(prev => [newVid, ...prev]);
                        showToast(`📹 Vídeo "${file.name}" salvo permanentemente na galeria!`);
                    };
                    reader.readAsDataURL(file);
                });
            };

            const handleDeleteVideo = (id, title) => {
                if (confirm(`Deseja excluir permanentemente o vídeo "${title}" do aplicativo?`)) {
                    setLocalVideos(prev => prev.filter(v => v.id !== id));
                    showToast(`🗑 Vídeo "${title}" removido permanentemente.`);

            };

            return (
                <div className="space-y-4">
                    <div className="glass-dark p-6 rounded-3xl border border-cyberNeon/40 shadow-xl space-y-4">

                        <button 
                            onClick={toggleTheme}
                            title="Alternar paleta de cores"
                            className="px-3.5 py-1.5 bg-petroleumPanel border border-cyberNeon/40 text-cyberNeon hover:bg-cyberNeon/20 rounded-xl text-xs font-bold transition cursor-pointer flex items-center gap-1.5 shadow"
                        >
                            <span>🎨</span>
                            <span>{theme === 'warm' ? 'Tema Comunitário' : 'Modo Escuro'}</span>
                        </button>
                    </div>

                    <main className="flex-1 max-w-5xl w-full mx-auto p-4 space-y-4 pb-20">
                        
                        <div style={{ display: activeTab === "radar" ? "block" : "none" }} className="space-y-4">
                            <div className="glass-dark p-4 rounded-3xl border border-cyberNeon/40 shadow-xl flex items-center justify-between">
                                <span className="text-xs font-bold text-cyberNeon">🛰️ Monitoramento Meteorológico Global, Nuvens, Chuvas & Ventos</span>
                                <button onClick={() => setActiveTab("chat")} className="px-3 py-1 bg-cyberNeon text-nightBlue font-bold rounded-lg text-xs">Voltar ao Chat</button>
                            </div>
                            <NativeHydroWindRadar liveWeather={liveWeather} />
                        </div>

                        <div style={{ display: activeTab === "videos" ? "block" : "none" }}>
                            <PublicVideoGallery localVideos={localVideos} />
                        </div>

                        <div style={{ display: activeTab === "admin" ? "block" : "none" }}>
                            <AdminVaultModule 
                                localVideos={localVideos} 
                                setLocalVideos={setLocalVideos} 
                                showToast={showToast} 
                                onClose={() => setActiveTab("chat")} 
                            />
                        </div>

                        <div style={{ display: activeTab === "relatorio" ? "block" : "none" }}>
                            <FieldReportModule onBackToChat={() => setActiveTab("chat")} showToast={showToast} />
                        </div>

                        <div style={{ display: activeTab === "webhook" ? "block" : "none" }}>
                            <WebhookSurveyModule showToast={showToast} onBackToChat={() => setActiveTab("chat")} />
                        </div>

                        <div style={{ display: activeTab === "chat" ? "block" : "none" }} className="space-y-4">
                            <div className="glass-dark p-6 rounded-3xl border border-cyberNeon/40 shadow-xl space-y-4 flex flex-col items-center">
                                <SarahHologramAvatar isLarge={false} isSpeaking={isSpeaking} />
                                <div className="text-center space-y-1">
                                    <h2 className="text-sm font-bold text-cyberNeon">SARAH IA NEXUS v5.2 PRO • Central Ativa</h2>
                                    <p className="text-xs text-lightSilver/80 font-medium">Faça sua pergunta ou relate ocorrências em Mesquita/RJ.</p>
                                </div>
                            </div>

                            <div className="glass-dark rounded-3xl p-4 sm:p-6 border border-cyberNeon/40 shadow-xl space-y-4 min-h-[320px] max-h-[500px] overflow-y-auto flex flex-col">
                                {messages.length === 0 ? (
                                    <div className="m-auto text-center py-12 space-y-3">
                                        <div className="text-3xl">🛡️</div>
                                        <p className="text-xs text-lightSilver/70">Nenhuma mensagem trocada ainda. Inicie o diálogo com a SARAH.</p>
                                    </div>
                                ) : (
                                    messages.map((m) => (
                                        <div key={m.id} className={`flex flex-col ${m.sender === 'user' ? 'items-end' : 'items-start'} space-y-1`}>
                                            <div className="flex items-center gap-1.5 text-[10px] text-lightSilver/60">
                                                <span>{m.sender === 'user' ? 'Você' : 'SARAH IA NEXUS'}</span>
                                                <span>•</span>
                                                <span>{m.timestamp}</span>
                                            </div>
                                            <div className={`p-3.5 rounded-2xl text-xs sm:text-sm max-w-[85%] leading-relaxed ${
                                                m.sender === 'user' 
                                                    ? 'bg-cyberNeon text-nightBlue font-medium rounded-tr-none' 
                                                    : 'bg-petroleumPanel border border-cyberNeon/30 text-lightSilver rounded-tl-none shadow'
                                            }`}>
                                                {m.text}
                                            </div>
                                        </div>
                                    ))
                                )}
                                {isLoadingChat && (
                                    <div className="flex items-center gap-2 text-xs text-cyberNeon animate-pulse p-2">
                                        <span>●</span> Processando análise inteligente...
                                    </div>
                                )}
                                <div ref={messagesEndRef} />
                            </div>

                            <div className="glass-dark p-3 rounded-2xl border border-cyberNeon/40 shadow-xl flex items-center gap-2">
                                <button 
                                    onClick={toggleListening} 
                                    className={`p-3 rounded-xl border text-xs font-bold transition cursor-pointer shrink-0 ${
                                        isListening ? 'bg-hotMagenta border-hotMagenta text-white animate-mic-pulse' : 'bg-petroleumPanel border-cyberNeon/40 text-cyberNeon'
                                    }`}
                                    title="Falar por voz"
                                >
                                    🎙
                                </button>
                                <input 
                                    type="text" 
                                    value={input} 
                                    onChange={(e) => setInput(e.target.value)} 
                                    onKeyDown={(e) => { if (e.key === 'Enter') handleSendMessage(); }}
                                    placeholder="Digite sua dúvida ou ocorrência..." 
                                    className="flex-1 bg-nightBlue border border-cyberNeon/30 rounded-xl px-4 py-3 text-xs text-lightSilver focus:outline-none focus:ring-2 focus:ring-cyberNeon"
                                />
                                <button 
                                    onClick={() => handleSendMessage()} 
                                    disabled={isLoadingChat}
                                    className="px-5 py-3 bg-gradient-to-r from-cyberNeon to-white hover:opacity-90 text-nightBlue font-black rounded-xl text-xs transition cursor-pointer btn-animated shrink-0"
                                >
                                    Enviar
                                </button>
                                <button 
                                    onClick={handleClearChat}
                                    className="p-3 bg-petroleumPanel border border-coralAlert/40 text-coralAlert rounded-xl text-xs hover:bg-coralAlert/20 transition cursor-pointer"
                                    title="Limpar Chat"
                                >
                                    🗑
                                </button>
                            </div>
                        </div>

                    </main>
                </div>
            );
        }

        ReactDOM.render(<App />, document.getElementById("root"));
    </script>
</body>
</html>
