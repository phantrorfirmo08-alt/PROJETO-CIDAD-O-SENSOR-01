            constructor(props) {

            componentDidCatch(error, errorInfo) {

                if (this.state.hasError) {

                        <div style={{ padding: '30px', background: '#1a0505', color: '#ff7185', fontFamily: 'monospace', borderRadius: '16px', border: '1px solid #ff7185', margin: '20px' }}>

                            <p>{this.state.error ? this.state.error.toString() : "Erro desconhecido"}</p>

        function FieldReportModule({ onBackToDashboard, showToast }) {
            const [setor, setSetor] = React.useState("🛡️ Defesa Civil (Vistoria de Risco / Ocorrência)");
            const [agente, setAgente] = React.useState("");
            const [localizacao, setLocalizacao] = React.useState("");
            const [descricao, setDescricao] = React.useState("");
            const [gpsCoords, setGpsCoords] = React.useState({ lt: '', ln: '', lk: '' });
            const [gpsStatus, setGpsStatus] = React.useState("📍 GPS em espera");
            const [fotos, setFotos] = React.useState([
                { id: 1, status: "vazia", file: null, preview: null },
                { id: 2, status: "vazia", file: null, preview: null },
                { id: 3, status: "vazia", file: null, preview: null },
                { id: 4, status: "vazia", file: null, preview: null }
            ]);

            React.useEffect(() => {
                return () => { fotos.forEach(f => { if (f.preview) URL.revokeObjectURL(f.preview); }); };
            }, []);

            const capturarGps = () => {
                if (!navigator.geolocation) { showToast("⚠️ Geolocalização não suportada."); return; }
                showToast("🛰 Acionando GPS de alta precisão...");
                navigator.geolocation.getCurrentPosition(
                    (p) => {
                        const lt = p.coords.latitude.toFixed(6);
                        const ln = p.coords.longitude.toFixed(6);
                        const lk = `https://www.google.com/maps?q=${lt},${ln}`;
                        setGpsCoords({ lt, ln, lk });
                        setLocalizacao(`${lt},${ln}`);
                        setGpsStatus("✅ GPS Fixado com Sucesso");
                        showToast(`📍 ${lt},${ln}`);
                    },
                    () => { showToast("⚠ Falha GPS."); setGpsStatus("⚠ Erro GPS"); },
                    { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
                );
            };

            const processarFotoVistoria = (file) => {
                return new Promise((resolve, reject) => {
                    if (!file.type.startsWith('image/')) { reject(new Error("Não é imagem")); return; }
                    const MAX_DIMENSION = 800;
                    const JPEG_QUALITY = 0.65;
                    const reader = new FileReader();
                    reader.readAsDataURL(file);
                    reader.onload = (event) => {
                        const img = new Image();
                        img.src = event.target.result;
                        img.onload = () => {
                            const canvas = document.createElement('canvas');
                            let width = img.width;
                            let height = img.height;
                            if (width > height) {
                                if (width > MAX_DIMENSION) { height = Math.round((height * MAX_DIMENSION) / width); width = MAX_DIMENSION; }
                            } else {
                                if (height > MAX_DIMENSION) { width = Math.round((width * MAX_DIMENSION) / height); height = MAX_DIMENSION; }
                            }
                            canvas.width = width;
                            canvas.height = height;
                            const ctx = canvas.getContext('2d');
                            ctx.imageSmoothingEnabled = true;
                            ctx.imageSmoothingQuality = 'medium';
                            ctx.drawImage(img, 0, 0, width, height);
                            canvas.toBlob((blob) => {
                                if (!blob) { reject(new Error("Falha blob")); return; }
                                const compressedFile = new File([blob], `vistoria_${Date.now()}.jpg`, { type: 'image/jpeg', lastModified: Date.now() });
                                const previewUrl = URL.createObjectURL(compressedFile);
                                resolve({ compressedFile, previewUrl });
                            }, 'image/jpeg', JPEG_QUALITY);
                        };
                        img.onerror = reject;
                    };
                    reader.onerror = reject;
                });
            };

            const handleFotoChange = async (i, e) => {
                const file = e.target.files[0];
                e.target.value = "";
                if (!file) return;
                showToast(`🔄 Otimizando evidência ${i + 1}...`);
                try {
                    if (fotos[i].preview) URL.revokeObjectURL(fotos[i].preview);
                    const { compressedFile, previewUrl } = await processarFotoVistoria(file);
                    const u = [...fotos];
                    u[i] = { id: u[i].id, status: "✅ OK", file: compressedFile, preview: previewUrl };
                    setFotos(u);
                    showToast(`📸 Bloco ${i + 1} OK!`);
                } catch (err) {
                    showToast(`❌ Erro na foto ${i + 1}`);
                }
            };

            const montarTexto = () => {
                const fCount = fotos.filter(f => f.status === "✅ OK").length;
                return `📊 *RELATÓRIO TÉCNICO DE VISTORIA - SARAH IA*\n` +
                       `🏛 *Setor:* ${setor}\n` +
                       `👤 *Agente:* ${agente || 'Não informado'}\n` +
                       `📍 *Local:* ${localizacao || 'Não informado'}\n` +
                       (gpsCoords.lk? `🔗 *Geolocalização:* ${gpsCoords.lk}\n` : ``) +
                       `📸 *Evidências:* ${fCount}/4\n` +
                       `📝 *Relato:*\n${descricao || 'Sem descrição'}`;
            };

            const copiarLaudo = () => {
                navigator.clipboard.writeText(montarTexto()).then(() => { showToast("📋 Relatório copiado!"); });

                return [
                    { id: 1, title: "Monitoramento Meteorológico & Hidrometeorológico - Mesquita", url: "https://www.w3schools.com/html/mov_bbb.mp4", isPinned: true }

            const speechIdRef = React.useRef(0);

            const carregarVozes = () => { if ("speechSynthesis" in window) { voicesRef.current = window.speechSynthesis.getVoices(); } };
            React.useEffect(() => {
                if (!("speechSynthesis" in window)) return;
                carregarVozes();
                window.speechSynthesis.onvoiceschanged = carregarVozes;
                return () => { window.speechSynthesis.cancel(); window.speechSynthesis.onvoiceschanged = null; };
            }, []);

            const limparTextoParaFala = (text) => {
                return String(text).replace(/([\u2700-\u27BF]|[\uE000-\uF8FF]|\uD83C[\uDC00-\uDFFF]|\uD83D[\uDC00-\uDFFF]|[\u2011-\u26FF]|\uD83E[\uDD00[\uDDFF])/g, '').replace(/\[(.*?)\]\(.*?\)/g, "$1").replace(/https?:\/\/\S+/g, "").replace(/\s+/g, " ").trim();
            };

            const escolherMelhorVoz = () => {
                const voices = voicesRef.current.length ? voicesRef.current : window.speechSynthesis.getVoices();
                return voices.find((voice) => voice.lang.toLowerCase().includes("pt")) || voices[0];
            };

            const stopSpeaking = () => {
                speechIdRef.current += 1;
                if (voiceTimerRef.current) { clearTimeout(voiceTimerRef.current); voiceTimerRef.current = null; }
                if ("speechSynthesis" in window) window.speechSynthesis.cancel();
                setIsSpeaking(false);
            };

            const speakText = (text) => {
                if (!soundEnabled || !("speechSynthesis" in window)) return;
                const cleanText = limparTextoParaFala(text);
                if (!cleanText) return;
                stopSpeaking();
                const currentId = speechIdRef.current;
                voiceTimerRef.current = setTimeout(() => {
                    if (currentId !== speechIdRef.current) return;
                    const utterance = new SpeechSynthesisUtterance(cleanText);
                    utterance.lang = "pt-BR";
                    utterance.voice = escolherMelhorVoz();
                    utterance.rate = 1.0;
                    utterance.onstart = () => { if (currentId === speechIdRef.current) setIsSpeaking(true); };
                    utterance.onend = () => { if (currentId === speechIdRef.current) setIsSpeaking(false); };
                    utterance.onerror = () => setIsSpeaking(false);
                    window.speechSynthesis.speak(utterance);

            const shareMessageText = "APP//MONITORAMENTO METEOROLÓGICO 🛰\nSARAH IA NEXUS V7.0 OMEGA\nCéu, Clima, Chuva, Vento & Bacias Hidrográficas\nhttps://phantrorfirmo08-alt.github.io/PROJETO-CIDAD-O-SENSOR-01/";

                }
                setShareModalOpen(true);
            };

            React.useEffect(() => {
                fetch('https://api.open-meteo.com/v1/forecast?latitude=-22.7831&longitude=-43.4294&current=temperature_2m,relative_humidity_2m,precipitation,weather_code,wind_speed_10m')
                    .then((res) => res.json())
                    .then((data) => { if (data && data.current) setLiveWeather(data.current); })
                    .catch((err) => console.warn("Clima indisponível:", err));
            }, []);

            React.useEffect(() => {
                try { localStorage.setItem("sarah-theme", theme); } catch(e) {}
                const metaTheme = document.querySelector('meta[name="theme-color"]');
                if (theme === 'warm') {
                    document.documentElement.classList.remove('dark');
                    document.documentElement.classList.add('warm');
                    if (metaTheme) metaTheme.setAttribute('content', '#F8F6F0');
                } else {
                    document.documentElement.classList.add('dark');
                    document.documentElement.classList.remove('warm');
                    if (metaTheme) metaTheme.setAttribute('content', '#05070F');
                }
            }, [theme]);

            const toggleListening = () => {
                const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
                if (!SpeechRec) { showToast("⚠️ Reconhecimento de voz indisponível."); return; }
                if (isListening) { setIsListening(false); return; }
                try {
                    const rec = new SpeechRec();
                    rec.lang = "pt-BR";
                    rec.continuous = false;
                    rec.interimResults = true;
                    rec.onstart = () => { setIsListening(true); showToast("🎙 Ouvindo voz direta para a SARAH..."); };

                        let final = '';
                        for (let i = event.resultIndex; i < event.results.length; ++i) {
                            if (event.results[i].isFinal) final += event.results[i][0].transcript;
                        }
                        if (final) { setInput(final); setIsListening(false); handleSendDirectCommand(final); }
                    };
                    rec.onerror = () => { setIsListening(false); showToast("⚠ Erro no microfone."); };
                    rec.onend = () => { setIsListening(false); };
                    rec.start();
                } catch (e) { setIsListening(false); showToast("⚠️ Erro ao iniciar microfone."); }
            };

            const handleSendDirectCommand = async (textCustom) => {

                            <div className="cyber-card max-w-md w-full p-6 sm:p-8 rounded-[32px] border border-auroraCyan/40 space-y-4 text-center shadow-2xl">
                                <h3 className="text-base font-extrabold text-auroraCyan">📲 Partilhar Aplicativo</h3>
                                <textarea readOnly value={shareMessageText} className="w-full h-28 bg-void border border-auroraCyan/30 rounded-2xl p-3 text-xs text-slate-200 resize-none font-mono" />
                                <div className="flex gap-3">
                                    <button onClick={() => { navigator.clipboard.writeText(shareMessageText); showToast("📋 Copiado!"); setShareModalOpen(false); }} className="flex-1 py-3.5 bg-auroraCyan text-void font-extrabold rounded-2xl text-xs cursor-pointer btn-neo">Copiar</button>
                                    <button onClick={() => setShareModalOpen(false)} className="px-5 py-3.5 bg-alertRed/25 text-alertRed rounded-2xl text-xs font-bold btn-neo">Fechar</button>
                                </div>
                            </div>
                        </div>
                    )}

                    {installModalOpen && (
                        <div className="fixed inset-0 bg-void/85 backdrop-blur-xl z-50 flex items-center justify-center p-4">
                            <div className="cyber-card max-w-md w-full p-6 sm:p-8 rounded-[32px] border border-auroraCyan/40 space-y-4 text-center shadow-2xl">
                                <h3 className="text-base font-extrabold text-auroraCyan">📥 Instalar App</h3>
                                <p className="text-xs text-slate-300 leading-relaxed text-left">Abra o menu do seu navegador e selecione <em>"Adicionar à Tela Inicial"</em> ou <em>"Instalar Aplicativo"</em>.</p>
                                <button onClick={() => setInstallModalOpen(false)} className="w-full py-3.5 bg-auroraCyan text-void font-extrabold rounded-2xl text-xs cursor-pointer btn-neo">Entendido</button>
                            </div>
                        </div>
                    )}

                    {!termsAccepted && (
                        <div className="fixed inset-0 bg-void/95 z-[200] flex items-center justify-center p-4 overflow-y-auto">
                            <div className="cyber-card max-w-lg w-full p-6 sm:p-8 rounded-[36px] border-2 border-auroraCyan/65 shadow-2xl space-y-5 my-auto">
                                <div className="text-center space-y-2">
                                    <div className="inline-flex p-3.5 rounded-3xl bg-auroraCyan/10 border border-auroraCyan/30 text-auroraCyan mb-1"><CyberShieldIcon className="w-9 h-9" /></div>
                                    <h2 className="text-lg font-black text-white">SARAH IA NEXUS v7.0 OMEGA</h2>
                                    <p className="text-xs text-auroraCyan font-extrabold uppercase">Termo LGPD & Permissão de GPS</p>
                                </div>
                                <div className="bg-void/90 p-4 rounded-2xl border border-auroraCyan/30 text-xs text-slate-300 space-y-2 max-h-52 overflow-y-auto font-sans">
                                    <p>Em conformidade com a <strong>Lei Federal nº 13.709/2018 (LGPD)</strong>, o sistema utiliza o GPS obrigatoriamente para fixar coordenadas precisas em vistorias de Defesa Civil.</p>
                                </div>
                                <div className="space-y-3 font-sans">
                                    <label className="flex items-start gap-3 cursor-pointer text-xs text-slate-300 bg-panel/50 p-3 rounded-xl border border-auroraCyan/20">
                                        <input type="checkbox" checked={check1} onChange={(e) => setCheck1(e.target.checked)} className="mt-0.5 rounded border-auroraCyan/50 text-auroraCyan w-4 h-4 bg-void shrink-0 cursor-pointer" />
                                        <span>Li e aceito os termos da Lei Geral de Proteção de Dados (LGPD).</span>
                                    </label>
                                    <label className="flex items-start gap-3 cursor-pointer text-xs text-slate-300 bg-panel/50 p-3 rounded-xl border border-auroraCyan/20">
                                        <input type="checkbox" checked={check2} onChange={(e) => setCheck2(e.target.checked)} className="mt-0.5 rounded border-auroraCyan/50 text-auroraCyan w-4 h-4 bg-void shrink-0 cursor-pointer" />
                                        <span>Compreendo e autorizo o uso obrigatório do GPS para telemetria de campo.</span>
                                    </label>
                                </div>
                                <button disabled={!check1 || !check2} onClick={() => { setTermsAccepted(true); try { localStorage.setItem("sarah_terms_accepted_v7_lgpd", "1"); } catch(e) {} showToast("🚀 Sistema ativado!"); }} className={`w-full py-4 rounded-2xl font-black text-xs uppercase tracking-widest transition shadow-2xl btn-neo ${check1 && check2 ? 'bg-gradient-to-r from-auroraMint via-auroraCyan to-auroraBlue text-black cursor-pointer' : 'bg-panel text-slate-500 cursor-not-allowed'}`}>
                                    Concordar e Iniciar Operação
                                </button>
                            </div>
                        </div>
                    )}

                    <header className="cyber-card sticky top-0 z-30 px-4 py-3.5 border-b border-auroraCyan/30 flex items-center justify-between shadow-xl">
                        <div className="flex items-center gap-3">
                            <div className="w-11 h-11 rounded-2xl border-2 border-auroraCyan/60 flex items-center justify-center bg-void shadow-[0_0_20px_rgba(34,211,238,0.3)]">
                                <svg width="22" height="22" viewBox="0 0 24 24" fill="url(#headerGrad)"><path d="M13 2L3 14h7l-1 8 10-12h-7l1-8z"/><defs><linearGradient id="headerGrad" x1="3" y1="2" x2="21" y2="22"><stop stopColor="#22D3EE" /><stop offset="1" stopColor="#34D399" /></linearGradient></defs></svg>
                            </div>
                            <div>
                                <h1 className="text-xs sm:text-sm font-black text-white tracking-wide">SARAH IA NEXUS <span className="text-auroraCyan text-[10px] font-mono">v7.0 OMEGA</span></h1>
                                <p className="text-[10px] text-auroraMint font-mono font-bold">VOZ DIRETA • MESQUITA/RJ</p>
                            </div>
                        </div>
                        <div className="flex items-center gap-2">
                            <button onClick={() => setSoundEnabled(!soundEnabled)} className={`p-2.5 rounded-xl border text-xs cursor-pointer transition btn-neo ${soundEnabled ? 'bg-auroraCyan/20 border-auroraCyan text-auroraCyan shadow' : 'bg-panel border-auroraCyan/20 text-slate-500'}`} title={soundEnabled ? "Som Ativado" : "Mudo"}>{soundEnabled ? '🔊' : '🔇'}</button>
                            <button onClick={toggleTheme} className="p-2.5 rounded-xl border border-auroraCyan/30 bg-panel text-auroraCyan text-xs cursor-pointer btn-neo shadow" title="Tema">☀️</button>
                            <button onClick={handleShareLink} className="p-2.5 rounded-xl border border-auroraCyan/30 bg-panel text-auroraCyan text-xs cursor-pointer btn-neo shadow" title="Partilhar">🔗</button>
                            <button onClick={handleInstallApp} className="p-2.5 rounded-xl border border-auroraCyan/30 bg-panel text-auroraCyan text-xs cursor-pointer btn-neo shadow" title="Instalar">📥</button>
                        </div>
                    </header>

                    <nav className="cyber-card border-b border-auroraCyan/30 px-4 py-2.5 flex items-center justify-center gap-2 overflow-x-auto z-20 scrollbar-hide">
                        <button onClick={() => setActiveTab("dashboard")} className={`px-4 py-2 rounded-xl text-xs font-extrabold transition cursor-pointer flex items-center gap-2 shrink-0 btn-neo ${activeTab === 'dashboard' ? 'bg-auroraCyan text-void shadow-[0_0_20px_rgba(34,211,238,0.4)]' : 'bg-panel text-slate-300 border border-auroraCyan/20'}`}><span>💬</span> Comando</button>
                        <button onClick={() => setActiveTab("radar")} className={`px-4 py-2 rounded-xl text-xs font-extrabold transition cursor-pointer flex items-center gap-2 shrink-0 btn-neo ${activeTab === 'radar' ? 'bg-auroraCyan text-void shadow-[0_0_20px_rgba(34,211,238,0.4)]' : 'bg-panel text-slate-300 border border-auroraCyan/20'}`}><span>🛰</span> Radar 24h</button>
                        <button onClick={() => setActiveTab("relatorio")} className={`px-4 py-2 rounded-xl text-xs font-extrabold transition cursor-pointer flex items-center gap-2 shrink-0 btn-neo ${activeTab === 'relatorio' ? 'bg-auroraCyan text-void shadow-[0_0_20px_rgba(34,211,238,0.4)]' : 'bg-panel text-slate-300 border border-auroraCyan/20'}`}><span>📋</span> Vistoria</button>
                        <button onClick={() => setActiveTab("galeria")} className={`px-4 py-2 rounded-xl text-xs font-extrabold transition cursor-pointer flex items-center gap-2 shrink-0 btn-neo ${activeTab === 'galeria' ? 'bg-auroraCyan text-void shadow-[0_0_20px_rgba(34,211,238,0.4)]' : 'bg-panel text-slate-300 border border-auroraCyan/20'}`}><span>🎥</span> Vídeos</button>
                        <button onClick={() => setActiveTab("admin")} className={`px-4 py-2 rounded-xl text-xs font-extrabold transition cursor-pointer flex items-center gap-2 shrink-0 btn-neo ${activeTab === 'admin' ? 'bg-auroraMint text-void shadow-[0_0_20px_rgba(52,211,153,0.4)]' : 'bg-panel text-auroraMint border border-auroraMint/30'}`}><span>🔒</span> Admin</button>
                    </nav>

                    <main className="flex-1 w-full mx-auto p-4 space-y-5">
                        {activeTab === 'dashboard' && (
                            <div className="space-y-5">
                                <div className="cyber-card p-6 sm:p-8 rounded-[36px] border border-auroraCyan/35 shadow-2xl space-y-6 text-center">
                                    <SarahHologramAvatar isLarge={true} isSpeaking={isSpeaking} />

                                    <div className="space-y-2">
                                        <h2 className="text-base font-black text-white">Comando Direto & Voz da SARAH</h2>
                                        <p className="text-xs text-slate-300 font-medium">
                                            Interface direta por microfone e comando de voz.
                                        </p>
                                    </div>

                                    <div className="bg-void border border-auroraCyan/40 p-5 rounded-3xl text-left space-y-2 shadow-xl">
                                        <div className="flex items-center justify-between text-[10px] font-mono text-auroraCyan font-bold uppercase border-b border-auroraCyan/20 pb-2">
                                            <span className="flex items-center gap-2"><span className="w-2 h-2 rounded-full bg-auroraMint animate-pulse"></span> Resposta Falada Direta da SARAH</span>
                                            <span>Modo Voz Ativa</span>
                                        </div>
                                        <div className="text-xs sm:text-sm font-sans text-slate-100 whitespace-pre-line leading-relaxed py-3">
                                            {currentResponse}
                                        </div>
                                    </div>

                                    <div className="pt-2">
                                        <form onSubmit={(e) => { e.preventDefault(); handleSendDirectCommand(); }} className="flex items-center gap-2 bg-void border-2 border-auroraCyan/40 rounded-2xl p-2">
                                            <button 
                                                type="button" 
                                                onClick={toggleListening}
                                                className={`p-3.5 rounded-xl transition cursor-pointer flex items-center justify-center shrink-0 btn-neo ${isListening ? 'bg-auroraPink text-white animate-pulse' : 'bg-panel text-auroraCyan border border-auroraCyan/30'}`}
                                                title="Falar com a SARAH"
                                            >
                                                🎙️
                                            </button>
                                            <input 
                                                type="text" 
                                                value={input} 
                                                onChange={(e) => setInput(e.target.value)}
                                                placeholder="Digite ou fale diretamente..." 
                                                className="flex-1 bg-transparent border-none px-3 py-2 text-xs text-slate-100 focus:outline-none font-sans"
                                            />
                                            <button 
                                                type="submit" 
                                                disabled={isProcessing || !input.trim()}
                                                className={`px-6 py-3 rounded-xl font-extrabold text-xs transition cursor-pointer btn-neo shadow-lg ${input.trim() && !isProcessing ? 'bg-gradient-to-r from-auroraCyan to-auroraMint text-black' : 'bg-panel text-slate-500 cursor-not-allowed'}`}
                                            >
                                                {isProcessing ? 'Ouvindo...' : 'Falar 🚀'}
                                            </button>
                                        </form>
                                    </div>

                                    <div className="flex flex-wrap justify-center gap-2 pt-2">
                                        <button onClick={() => handleSendDirectCommand("Status atual das bacias Sarapuí, Dona Eugênia e Prata")} className="px-3 py-1.5 bg-void border border-auroraCyan/30 text-auroraCyan rounded-xl text-[11px] font-bold btn-neo">🌊 Bacias</button>
                                        <button onClick={() => handleSendDirectCommand("Condições meteorológicas atuais em Mesquita")} className="px-3 py-1.5 bg-void border border-auroraCyan/30 text-auroraCyan rounded-xl text-[11px] font-bold btn-neo">🌦️ Clima</button>
                                        <button onClick={() => handleSendDirectCommand("Diretrizes de prevenção da Defesa Civil")} className="px-3 py-1.5 bg-void border border-auroraCyan/30 text-auroraCyan rounded-xl text-[11px] font-bold btn-neo">🛡️ Defesa Civil</button>
                                    </div>
                                </div>
                                <AutomatedObservatoryWidget />
                            </div>
                        )}

                        {activeTab === 'radar' && (
                            <div className="space-y-5">
                                <NativeHydroWindRadar />
                                <AutomatedObservatoryWidget />
                            </div>
                        )}

                        {activeTab === 'relatorio' && (
                            <div className="space-y-5">
                                <FieldReportModule showToast={showToast} onBackToDashboard={() => setActiveTab('dashboard')} />
                                <AutomatedObservatoryWidget />
                            </div>
                        )}

                        {activeTab === 'galeria' && (
                            <div className="space-y-5">
                                <PublicVideoGallery localVideos={localVideos} onGoToDashboard={() => setActiveTab('dashboard')} />
                                <AutomatedObservatoryWidget />
                            </div>
                        )}

                        {activeTab === 'admin' && (
                            <div className="space-y-5">
                                <AdminVaultModule 
                                    localVideos={localVideos} 
                                    setLocalVideos={setLocalVideos} 
                                    marketingText={marketingText}
                                    setMarketingText={setMarketingText}
                                    showToast={showToast} 
                                    onClose={() => setActiveTab('dashboard')} 
                                />
                                <AutomatedObservatoryWidget />
                            </div>
                        )}
                    </main>

                    <footer className="cyber-card fixed bottom-0 left-0 right-0 z-40 max-w-[480px] mx-auto border-t border-auroraCyan/30 px-4 py-3 flex items-center justify-around shadow-2xl backdrop-blur-2xl">
                        <button onClick={() => setActiveTab('dashboard')} className={`flex flex-col items-center gap-1 cursor-pointer transition btn-neo ${activeTab === 'dashboard' ? 'text-auroraCyan scale-105' : 'text-slate-400 hover:text-white'}`}>
                            <span className="text-lg">💬</span>
                            <span className="text-[10px] font-extrabold">Comando</span>
                        </button>
                        <button onClick={() => setActiveTab('radar')} className={`flex flex-col items-center gap-1 cursor-pointer transition btn-neo ${activeTab === 'radar' ? 'text-auroraCyan scale-105' : 'text-slate-400 hover:text-white'}`}>
                            <span className="text-lg">🛰</span>
                            <span className="text-[10px] font-extrabold">Radar 24h</span>
                        </button>
                        <button onClick={() => setActiveTab('relatorio')} className={`flex flex-col items-center gap-1 cursor-pointer transition btn-neo ${activeTab === 'relatorio' ? 'text-auroraCyan scale-105' : 'text-slate-400 hover:text-white'}`}>
                            <span className="text-lg">📋</span>
                            <span className="text-[10px] font-extrabold">Vistoria</span>
                        </button>
                        <button onClick={() => setActiveTab('galeria')} className={`flex flex-col items-center gap-1 cursor-pointer transition btn-neo ${activeTab === 'galeria' ? 'text-auroraCyan scale-105' : 'text-slate-400 hover:text-white'}`}>
                            <span className="text-lg">🎥</span>
                            <span className="text-[10px] font-extrabold">Vídeos</span>
                        </button>
                        <button onClick={() => setActiveTab('admin')} className={`flex flex-col items-center gap-1 cursor-pointer transition btn-neo ${activeTab === 'admin' ? 'text-auroraMint scale-105' : 'text-auroraMint/70 hover:text-auroraMint'}`}>
                            <span className="text-lg">🔒</span>
                            <span className="text-[10px] font-extrabold">Admin</span>
                        </button>
                    </footer>

                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(
            <ErrorBoundary>
                <App />
            </ErrorBoundary>
        );
    </script>
</body>
</html>
