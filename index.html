function escolherVozPtBr(perfilId) {
  const voices = carregarVozesDisponiveis();
  if (!voices || voices.length === 0) return null;

  if (ptVoices.length === 0) return voices[0];
  const idx = PERFIS_VOZ_OFICIAIS.findIndex(p => p.id === perfilId);
  if (idx >= 0) return ptVoices[idx % ptVoices.length];
  return ptVoices.find(v => (v.name || "").toLowerCase().includes("google")) || ptVoices[0];
}

function escolherVozMasculinaPtBr() {
  const voices = carregarVozesDisponiveis();
  if (!voices || voices.length === 0) return null;
  const ptVoices = voices.filter(v => (v.lang || "").toLowerCase().includes("pt"));
  const pool = ptVoices.length > 0 ? ptVoices : voices;
  const termosMasc = ["male", "masculino", "daniel", "felipe", "ricardo", "antonio", "antônio", "rafael", "lucas", "bruno", "jorge", "paulo", "carlos", "pt-pt"];
  const achada = pool.find(v => {
    const n = `${v.name || ""} ${v.voiceURI || ""}`.toLowerCase();
    return termosMasc.some(t => n.includes(t));
  });
  return achada || pool[0];
}

function falarRoboMasculino(texto, onStart = null, onEnd = null) {
  try {
    if (localStorage.getItem("raru_sound_enabled") === "false") {
      if (onEnd) onEnd();
      return;
    }
  } catch (e) {}
  if (!("speechSynthesis" in window)) {
    if (onEnd) onEnd();
    return;
  }
  const textoLimpo = limparTextoParaFala(texto);
  if (!textoLimpo) {
    if (onEnd) onEnd();
    return;
  }

  try {
    window.speechSynthesis.cancel();
    const frases = textoLimpo.split(/(?<=[.!?])\s+/).filter(Boolean);
    const fila = frases.length > 0 ? frases : [textoLimpo];
    const vozMasc = escolherVozMasculinaPtBr();

    if (onStart) onStart();

    const falarSequencia = (index) => {
      if (index >= fila.length) {
        if (onEnd) onEnd();
        return;
      }
      try {
        if (localStorage.getItem("raru_sound_enabled") === "false") {
          if (onEnd) onEnd();
          return;
        }
      } catch (e) {}

      const u = new SpeechSynthesisUtterance(fila[index]);
      u.lang = "pt-BR";
      u.pitch = 0.68;
      u.rate = 0.96;
      u.volume = 1.0;
      if (vozMasc) u.voice = vozMasc;

      u.onend = () => {
        if (index + 1 < fila.length) setTimeout(() => falarSequencia(index + 1), 260);
        else if (onEnd) onEnd();
      };
      u.onerror = () => {
        if (index + 1 < fila.length) setTimeout(() => falarSequencia(index + 1), 260);
        else if (onEnd) onEnd();
      };
      window.speechSynthesis.speak(u);
    };

    falarSequencia(0);
  } catch (e) {
    if (onEnd) onEnd();
  }
}

function falarImitada(texto, perfilId = 'sarah') {
  try {
    if (localStorage.getItem("raru_sound_enabled") === "false") return;
  } catch (e) {}
  if (!("speechSynthesis" in window)) return;
  const textoLimpo = limparTextoParaFala(texto);
  if (!textoLimpo) return;

  const perfilSalvo = (() => {
    try { return localStorage.getItem("raru_perfil_voz") || perfilId || 'sarah'; }
    catch (e) { return perfilId || 'sarah'; }
  })();
  const perfil = PERFIS_VOZ_OFICIAIS.find(p => p.id === perfilSalvo) || PERFIS_VOZ_OFICIAIS[0];

  try {
    window.speechSynthesis.cancel();
    const textoImitado = limparTextoParaFala(perfil.transform(textoLimpo));
    const frases = textoImitado.split(/(?<=[.!?])\s+/).filter(Boolean);
    const fila = frases.length > 0 ? frases : [textoImitado];
    const vozEscolhida = escolherVozPtBr(perfil.id);

    const falarSequencia = (index) => {
      if (index >= fila.length) return;
      try {
        if (localStorage.getItem("raru_sound_enabled") === "false") return;
      } catch (e) {}

      const u = new SpeechSynthesisUtterance(fila[index]);
      u.lang = "pt-BR";
      const osc = (Math.random() - 0.5) * perfil.variacao;
      u.pitch = Math.max(0.5, Math.min(2.0, perfil.pitch + osc));
      u.rate = Math.max(0.5, Math.min(2.0, perfil.rate));
      u.volume = Math.max(0, Math.min(1, perfil.volume));
      if (vozEscolhida) u.voice = vozEscolhida;

      u.onend = () => {
        if (index + 1 < fila.length) setTimeout(() => falarSequencia(index + 1), perfil.pausaFrase);
      };
      u.onerror = () => {
        if (index + 1 < fila.length) setTimeout(() => falarSequencia(index + 1), perfil.pausaFrase);
      };
      window.speechSynthesis.speak(u);
    };

    falarSequencia(0);
  } catch (e) {}
}

async function calcularSHA256(texto) {
  const str = String(texto || "");
  try {
    if (window.crypto && window.crypto.subtle && window.TextEncoder) {
      const encoder = new TextEncoder();
      const data = encoder.encode(str);
      const hashBuffer = await window.crypto.subtle.digest('SHA-256', data);
      const hashArray = Array.from(new Uint8Array(hashBuffer));
      return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
    }
  } catch (e) {}
  let h1 = 0xdeadbeef, h2 = 0x41c6ce57;
  for (let i = 0; i < str.length; i++) {
    const ch = str.charCodeAt(i);
    h1 = Math.imul(h1 ^ ch, 2654435761);
    h2 = Math.imul(h2 ^ ch, 1597334677);
  }
  h1 = Math.imul(h1 ^ (h1 >>> 16), 2246822507) ^ Math.imul(h2 ^ (h2 >>> 13), 3266489909);
  h2 = Math.imul(h2 ^ (h2 >>> 16), 2246822507) ^ Math.imul(h1 ^ (h1 >>> 13), 3266489909);
  const combinado = (4294967296 * (2097151 & h2) + (h1 >>> 0)).toString(16).padStart(16, '0');
  return combinado.repeat(4).slice(0, 64);
}

async function gerarArquivoIconeEscudo() {
  return new Promise((resolve) => {
    const canvas = document.createElement('canvas');
    canvas.width = 512;
    canvas.height = 512;
    const ctx = canvas.getContext('2d');

    const bgGrad = ctx.createRadialGradient(256, 256, 30, 256, 256, 320);
    bgGrad.addColorStop(0, '#0A2547');
    bgGrad.addColorStop(0.6, '#041125');
    bgGrad.addColorStop(1, '#02040A');
    ctx.fillStyle = bgGrad;
    ctx.fillRect(0, 0, 512, 512);

    ctx.save();
    ctx.shadowColor = '#00F2FE';
    ctx.shadowBlur = 25;
    ctx.beginPath();
    ctx.moveTo(256, 65);
    ctx.lineTo(410, 130);
    ctx.lineTo(410, 265);
    ctx.quadraticCurveTo(410, 385, 256, 435);
    ctx.quadraticCurveTo(102, 385, 102, 265);
    ctx.lineTo(102, 130);
    ctx.closePath();

    const shieldFill = ctx.createLinearGradient(102, 65, 410, 435);
    shieldFill.addColorStop(0, 'rgba(0, 242, 254, 0.22)');
    shieldFill.addColorStop(1, 'rgba(4, 17, 37, 0.94)');
    ctx.fillStyle = shieldFill;
    ctx.fill();
    ctx.lineWidth = 7;
    ctx.strokeStyle = '#00F2FE';
    ctx.stroke();
    ctx.restore();

    ctx.fillStyle = '#00FF9D';
    ctx.font = '900 22px Orbitron, sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('ESCUDO RARU', 256, 195);

    ctx.fillStyle = '#FFFFFF';
    ctx.font = '900 30px Orbitron, sans-serif';
    ctx.fillText('RARU NEXUS', 256, 242);

    ctx.fillStyle = '#00F2FE';
    ctx.font = '800 18px JetBrains Mono, monospace';
    ctx.fillText('V11.2 PLUS • RJ', 256, 276);

    ctx.fillStyle = '#38BDF8';
    ctx.font = '700 15px JetBrains Mono, monospace';
    ctx.fillText('CIDADÃO SENSOR • MESQUITA RJ', 256, 478);

    canvas.toBlob((blob) => {
      if (blob) resolve(new File([blob], 'ESCUDO_RARU_NEXUS_V11_2_PLUS.png', { type: 'image/png' }));
      else resolve(null);
    }, 'image/png');
  });
}

function RaruRoboTelemetriaNoLugarDoMapa({ municipioSelecionado, onSelecionarMunicipio, onNavegarModulo, abaAtual, showToast, openSarahChat, userName, onAtualizarNome }) {
  const [camada, setCamada] = useState('vento');
  const [alertaAtivo, setAlertaAtivo] = useState(false);
  const [roboFalando, setRoboFalando] = useState(false);
  const [roboPensando, setRoboPensando] = useState(false);
  const [roboInput, setRoboInput] = useState('');
  const [roboChatMsgs, setRoboChatMsgs] = useState(() => [{
    remetente: 'robo',
    texto: userName
      ? `ROBOT SARAH SYSTEM RARU online e integrado em todos os módulos. Como posso apoiar agora, ${userName}?`
      : "ROBOT SARAH SYSTEM RARU online e integrado em todos os módulos. Qual é o seu nome e o que você quer consultar?"
  }]);
  const [telemetria, setTelemetria] = useState({
    temp: '--',
    vento: '--',
    chuva: '--',
    condicao: 'Sincronizando...'
  });
  const [roboStatus, setRoboStatus] = useState(`ROBOT SARAH SYSTEM RARU • ${municipioSelecionado.n.toUpperCase()}`);
  const [roboMsg, setRoboMsg] = useState(`Robô de telemetria acoplado ao nó ${municipioSelecionado.n} (IP ${municipioSelecionado.ip}) e integrado a todas as sessões e módulos do app.`);

  useEffect(() => {
    if (!municipioSelecionado?.lat) return;
    fetch(`https://api.open-meteo.com/v1/forecast?latitude=${municipioSelecionado.lat}&longitude=${municipioSelecionado.lon}&current=temperature_2m,precipitation,wind_speed_10m&timezone=America%2FSao_Paulo`)
      .then(r => r.json())
      .then(d => {
        if (d?.current) {
          const tp = d.current.temperature_2m;
          const vn = d.current.wind_speed_10m;
          const ch = d.current.precipitation ?? 0;
          const emAlerta = ch >= 5 || vn >= 40;
          setAlertaAtivo(emAlerta);
          setTelemetria({
            temp: `${tp}°C`,
            vento: `${vn} km/h`,
            chuva: `${ch} mm`,
            condicao: emAlerta ? 'ALERTA ATIVO' : 'ESTÁVEL'
          });
        }
      })
      .catch(() => {});
  }, [municipioSelecionado]);

  const falarTelemetriaMasculina = (falaTexto) => {
    falarRoboMasculino(
      falaTexto,
      () => setRoboFalando(true),
      () => setRoboFalando(false)
    );
  };

  const acionarLevantamento = () => {
    const condTxt = alertaAtivo ? "alerta ativo" : "condição estável";
    const resumo = `Relatório do ROBOT SARAH SYSTEM RARU: em ${municipioSelecionado.n}, estação IP ${municipioSelecionado.ip}, módulo ${abaAtual || 'painel'}, temperatura ${telemetria.temp}, vento ${telemetria.vento}, chuva ${telemetria.chuva}, ${condTxt}.`;
    setRoboStatus(`ROBOT SARAH SYSTEM RARU • ${municipioSelecionado.n.toUpperCase()}`);
    setRoboMsg(resumo);
    falarTelemetriaMasculina(resumo);
    if (showToast) showToast(`ROBOT SARAH SYSTEM RARU falando telemetria de ${municipioSelecionado.n}.`);
  };

  const responderComandoLocalModulos = (textoLimpo, nomeAtivo) => {
    const t = textoLimpo.toLowerCase();
    const estado = coletarEstadoGlobalModulos(abaAtual, municipioSelecionado.n, 'Rocha Sobrinho', nomeAtivo);
    if (t.includes('radar') || t.includes('goes')) {
      if (onNavegarModulo) onNavegarModulo('radar');
      return `Abri o módulo Radar Meteorológico e Satélite GOES-19 para você${nomeAtivo ? ', ' + nomeAtivo : ''}. Em ${municipioSelecionado.n}, a temperatura está em ${telemetria.temp}, vento ${telemetria.vento} e chuva ${telemetria.chuva}.`;
    }
    if (t.includes('vistoria') || t.includes('sirene') || t.includes('foto')) {
      if (onNavegarModulo) onNavegarModulo('vistoria');
      return `Abri o módulo de Vistoria Comunitária e Sirenes. Você pode registrar ocorrências com GPS e hash SHA-256 ou acionar os alertas sonoros.`;
    }
    if (t.includes('balan') || t.includes('recicl') || t.includes('esg')) {
      if (onNavegarModulo) onNavegarModulo('balanca');
      return `Abri o módulo Balança e ESG do Cidadão Sensor para pesagem de recicláveis, cálculo de impacto ecológico e emissão de recibo.`;
    }
    if (t.includes('alquino') || t.includes('hardware') || t.includes('sensor')) {
      if (onNavegarModulo) onNavegarModulo('alquino');
      return `Abri o módulo Rede Alquino de Hardware Físico para conexão IP de sensores de gases, nível hídrico e temperatura.`;

    if (t.includes('rota') || t.includes('abrigo') || t.includes('sos') || t.includes('kit')) {

    }
    return null;
  };

  const enviarMensagemRobo = async (e) => {
    if (e) e.preventDefault();
    const texto = roboInput.trim();

function CadeAdminModule({ showToast }) {
  const MUNICIPIOS = MUNICIPIOS_92.map(m => m.n);
  const [abaAtiva, setAbaAtiva] = useState('rota');
  const [rotas, setRotas] = useState(() => JSON.parse(localStorage.getItem('rotasFugaReais') || '[]'));
  const [rNome, setRNome] = useState('');
  const [rEnd, setREnd] = useState('');
  const [rInfo, setRInfo] = useState('');
  const [rTipo, setRTipo] = useState('Ponto de Encontro');

  const [monitores, setMonitores] = useState(() => JSON.parse(localStorage.getItem('monitoresCADE') || '[]'));
  const [bloqueados, setBloqueados] = useState(() => JSON.parse(localStorage.getItem('monitoresBloqueadosCADE') || '[]'));
  const [mNome, setMNome] = useState('');
  const [mZap, setMZap] = useState('');
  const [mSenha, setMSenha] = useState('');
  const [mMun, setMMun] = useState('');
  const [mBairro, setMBairro] = useState('');
  const [mFuncao, setMFuncao] = useState('Monitor do Tempo');
  const [mObs, setMObs] = useState('');
  const [filtroMon, setFiltroMon] = useState('');

  const salvarRota = () => {
    if (!rNome.trim() || !rEnd.trim()) { showToast('Escreva o nome e o endereço.'); return; }
    const atualizadas = [...rotas, { nome: rNome.trim(), endereco: rEnd.trim(), info: rInfo.trim(), tipo: rTipo }];
    setRotas(atualizadas);
    try { localStorage.setItem('rotasFugaReais', JSON.stringify(atualizadas)); } catch (e) {}
    setRNome(''); setREnd(''); setRInfo('');
    showToast('Rota salva e publicada na Estação.');
  };

  const excluirRota = (i) => {
    if (!confirm('Excluir essa rota?')) return;
    const atualizadas = [...rotas];
    atualizadas.splice(i, 1);
    setRotas(atualizadas);
    try { localStorage.setItem('rotasFugaReais', JSON.stringify(atualizadas)); } catch (e) {}
  };

  const cadastrarMonitor = () => {
    if (!mNome.trim() || !mMun || !mBairro.trim() || !mSenha.trim()) { showToast('Preencha nome, município, bairro e crie a senha.'); return; }
    let c = parseInt(localStorage.getItem('contadorMonitorCADE') || '0', 10) + 1;
    try { localStorage.setItem('contadorMonitorCADE', String(c)); } catch (e) {}
    const idGerado = 'GADE-M-' + String(c).padStart(3, '0');
    const novoM = { id: idGerado, nome: mNome.trim(), zap: mZap.trim(), senha: mSenha.trim(), municipio: mMun, bairro: mBairro.trim(), funcao: mFuncao, obs: mObs.trim(), data: new Date().toLocaleString('pt-BR') };
    const atualizados = [...monitores, novoM];
    setMonitores(atualizados);
    try { localStorage.setItem('monitoresCADE', JSON.stringify(atualizados)); } catch (e) {}
    setMNome(''); setMZap(''); setMSenha(''); setMBairro(''); setMObs('');
    showToast(`Monitor cadastrado: ${idGerado}`);
  };

  const bloquearMonitor = (idx) => {
    const x = monitores[idx];
    const motivo = prompt(`Excluindo ${x.nome} - ${x.id}\nMotivo? Ex: mau uso`);
    if (motivo === null) return;
    if (!confirm(`CONFIRMAR BLOQUEIO?\n\n${x.id} - ${x.nome}`)) return;
    const l = [...monitores]; l.splice(idx, 1);
    setMonitores(l); try { localStorage.setItem('monitoresCADE', JSON.stringify(l)); } catch (e) {}
    const bb = [...bloqueados, { ...x, motivo: motivo || 'Sem motivo', dataBloqueio: new Date().toLocaleString('pt-BR') }];
    setBloqueados(bb); try { localStorage.setItem('monitoresBloqueadosCADE', JSON.stringify(bb)); } catch (e) {}
    showToast(`Monitor ${x.id} bloqueado.`);
  };

  const desbloquearMonitor = (idx) => {
    const x = bloqueados[idx];
    if (!confirm(`Desbloquear ${x.id} - ${x.nome}?`)) return;
    const bb = [...bloqueados]; bb.splice(idx, 1);
    setBloqueados(bb); try { localStorage.setItem('monitoresBloqueadosCADE', JSON.stringify(bb)); } catch (e) {}
    const l = [...monitores, { id: x.id, nome: x.nome, zap: x.zap, senha: x.senha, municipio: x.municipio, bairro: x.bairro, funcao: x.funcao, obs: x.obs, data: x.data }];
    setMonitores(l); try { localStorage.setItem('monitoresCADE', JSON.stringify(l)); } catch (e) {}
    showToast(`Monitor ${x.id} desbloqueado.`);
  };

  const exportarMonitoresGrupo = () => {
    if (!monitores.length) { showToast('Nenhum monitor ativo.'); return; }
    const msg = `MONITORES GADE - ${monitores.length} ativos\n\n` + monitores.map(x => `${x.id} - ${x.nome} - ${x.funcao}\nLocal: ${x.municipio} - ${x.bairro}\nZap: ${x.zap || ''}`).join('\n\n') + `\n\nProjeto: GADE - Grupo A Chave da Esperança`;
    if (navigator.clipboard) navigator.clipboard.writeText(msg).catch(() => {});
    showToast('Lista copiada sem senha. Abrindo WhatsApp.');
    window.open('https://chat.whatsapp.com/D1wrk9nTBH57Wya2Uv44ZW', '_blank');
  };

  const monitoresFiltrados = monitores.filter(x => (x.id + ' ' + x.nome + ' ' + x.municipio + ' ' + x.bairro).toLowerCase().includes(filtroMon.toLowerCase()));

  return (
    <div id="cadeAdmin" className="cyber-card font-mono">
      <div className="text-cyberCyan font-display font-black text-sm uppercase tracking-wider">ÁREA RESTRITA - GADE</div>
      <div className="text-slate-300 text-xs mt-0.5">GADE - Grupo A Chave da Esperança / Projeto Cidadão Sensor</div>
      <div className="flex gap-2 mt-3">
        <button type="button" onClick={() => setAbaAtiva('rota')} className={`flex-1 py-3 px-3 rounded-xl font-black text-xs uppercase cursor-pointer border ${abaAtiva === 'rota' ? 'bg-cyberCyan text-void border-white' : 'bg-void text-slate-200 border-cyberCyan/40'}`}>ROTAS DE FUGA</button>
        <button type="button" onClick={() => setAbaAtiva('monitor')} className={`flex-1 py-3 px-3 rounded-xl font-black text-xs uppercase cursor-pointer border ${abaAtiva === 'monitor' ? 'bg-cyberGreen text-void border-white' : 'bg-void text-slate-200 border-cyberCyan/40'}`}>MONITORES</button>
      </div>
      {abaAtiva === 'rota' ? (
        <div id="painelRota" className="space-y-2 mt-3">
          <input value={rNome} onChange={e => setRNome(e.target.value)} placeholder="Nome do local" className="w-full p-3 rounded-xl bg-void border border-cyberCyan/40 text-white text-xs permitir-selecao" />
          <input value={rEnd} onChange={e => setREnd(e.target.value)} placeholder="Endereço completo" className="w-full p-3 rounded-xl bg-void border border-cyberCyan/40 text-white text-xs permitir-selecao" />
          <input value={rInfo} onChange={e => setRInfo(e.target.value)} placeholder="Informações" className="w-full p-3 rounded-xl bg-void border border-cyberCyan/40 text-white text-xs permitir-selecao" />
          <select value={rTipo} onChange={e => setRTipo(e.target.value)} className="w-full p-3 rounded-xl bg-void border border-cyberCyan/40 text-white text-xs">
            <option>Ponto de Encontro</option>
            <option>Casa de Morador</option>
            <option>Igreja</option>
            <option>Escola / CRAS / Clínica</option>
            <option>Ponto Alto Seguro</option>
          </select>
          <button type="button" onClick={salvarRota} className="cyber-button-solid w-full text-xs">SALVAR E PUBLICAR NA ESTAÇÃO</button>
          <div id="listaRotasAdmin" className="space-y-2 pt-2">
            {rotas.length === 0 ? (
              <div className="text-slate-400 text-xs">Nenhuma rota cadastrada ainda.</div>
            ) : (
              rotas.map((x, i) => (
                <div key={i} className="bg-void/90 border border-cyberCyan/30 p-3 rounded-xl text-white text-xs space-y-1">
                  <div className="font-black text-cyberCyan">{x.tipo} - {x.nome}</div>
                  <div>{x.endereco}</div>
                  {x.info && <div className="text-slate-300">{x.info}</div>}
                  <button type="button" onClick={() => excluirRota(i)} className="cyber-button-danger text-[10px] py-1.5 px-3 !min-h-[34px] mt-1">Excluir Rota</button>
                </div>
              ))
            )}
          </div>
        </div>
      ) : (
        <div id="painelMonitor" className="space-y-2 mt-3">
          <div className="bg-void/90 border border-cyberCyan/30 rounded-xl p-3 text-white text-xs">
            Ativos: <b className="text-cyberCyan">{monitores.length}</b> | Municípios: <b className="text-cyberGreen">{new Set(monitores.map(x => x.municipio)).size}</b> / 92 | Bloqueados: <b className="text-cyberRose">{bloqueados.length}</b>
          </div>
          <input value={mNome} onChange={e => setMNome(e.target.value)} placeholder="Nome completo do monitor" className="w-full p-3 rounded-xl bg-void border border-cyberCyan/40 text-white text-xs permitir-selecao" />
          <input value={mZap} onChange={e => setMZap(e.target.value)} placeholder="WhatsApp" className="w-full p-3 rounded-xl bg-void border border-cyberCyan/40 text-white text-xs permitir-selecao" />
          <input value={mSenha} onChange={e => setMSenha(e.target.value)} placeholder="Crie a senha dele - ex: rocha123" className="w-full p-3 rounded-xl bg-void border border-cyberCyan/40 text-white text-xs permitir-selecao" />
          <select value={mMun} onChange={e => setMMun(e.target.value)} className="w-full p-3 rounded-xl bg-void border border-cyberCyan/40 text-white text-xs">
            <option value="">Selecione o município - 92 municípios do RJ</option>
            {MUNICIPIOS.map((m, i) => <option key={i} value={m}>{m}</option>)}
          </select>
          <input value={mBairro} onChange={e => setMBairro(e.target.value)} placeholder="Bairro / Comunidade que vai monitorar" className="w-full p-3 rounded-xl bg-void border border-cyberCyan/40 text-white text-xs permitir-selecao" />
          <select value={mFuncao} onChange={e => setMFuncao(e.target.value)} className="w-full p-3 rounded-xl bg-void border border-cyberCyan/40 text-white text-xs">
            <option>Monitor do Tempo</option>
            <option>Monitor da Comunidade</option>

          <input value={mObs} onChange={e => setMObs(e.target.value)} placeholder="Observações" className="w-full p-3 rounded-xl bg-void border border-cyberCyan/40 text-white text-xs permitir-selecao" />
          <button type="button" onClick={cadastrarMonitor} className="cyber-button-solid w-full text-xs">CADASTRAR MONITOR - GERAR NÚMERO + SENHA</button>
          <div className="flex gap-2 pt-1">

            <button type="button" onClick={exportarMonitoresGrupo} className="raru-store-btn ativo px-4">GRUPO</button>

          <div id="listaMonitores" className="space-y-2 pt-1">
            {monitoresFiltrados.length === 0 ? (
              <div className="text-slate-400 text-xs">Nenhum monitor ativo.</div>
            ) : (
              monitoresFiltrados.map((x) => {
                const idx = monitores.indexOf(x);

            <div className="text-cyberRose font-black text-xs uppercase">MONITORES BLOQUEADOS / EXCLUÍDOS</div>
            <div id="listaBloqueados" className="space-y-2">
              {bloqueados.length === 0 ? (
                <div className="text-slate-300 text-xs">Nenhum monitor bloqueado.</div>
              ) : (

                  <div key={i} className="bg-void/90 border border-cyberRose/50 p-2.5 rounded-xl text-white text-xs space-y-1">
                    <div><span className="bg-cyberRose text-white px-2 py-0.5 rounded-full font-black text-[10px]">{x.id}</span> <b className="ml-1">{x.nome}</b> - {x.municipio} - {x.bairro}</div>

  );
}

function EstacaoGADEModule({ showToast, userName }) {
  const [sosNome, setSosNome] = useState(() => localStorage.getItem('cadeNomeSOS') || userName || '');
  const [sosObs, setSosObs] = useState(() => localStorage.getItem('cadeObsSOS') || '');
  const [statusSOS, setStatusSOS] = useState('');
  const [ultimaMsgPronta, setUltimaMsgPronta] = useState('');
  const [historicoSOS, setHistoricoSOS] = useState(() => localStorage.getItem('cadeUltimoSOS') ? 'Último SOS: ' + localStorage.getItem('cadeUltimoSOS') : '');

  const GRUPO_GADE = 'https://chat.whatsapp.com/D1wrk9nTBH57Wya2Uv44ZW';

  useEffect(() => {
    if (userName && !sosNome) setSosNome(userName);
  }, [userName]);

  const sosCADE = (tipo) => {
    try {
      localStorage.setItem('cadeNomeSOS', sosNome);
      localStorage.setItem('cadeObsSOS', sosObs);
    } catch (e) {}
    const nomeFinal = sosNome.trim() || userName || 'Morador(a)';
    const base = `[SOS - ${tipo}] RARU NEXUS V11.2 PLUS • GADE / CIDADÃO SENSOR\nNome: ${nomeFinal}\nBairro: Rocha Sobrinho / BNH / Banco de Areia - Mesquita RJ\n${sosObs ? 'Obs: ' + sosObs + '\n' : ''}Projeto: GADE - Grupo A Chave da Esperança / Projeto Cidadão Sensor`;
    setUltimaMsgPronta(base);
    if (navigator.clipboard) navigator.clipboard.writeText(base).catch(() => {});
    const agoraStr = tipo + ' - ' + new Date().toLocaleString('pt-BR');
    try { localStorage.setItem('cadeUltimoSOS', agoraStr); } catch (e) {}
    setHistoricoSOS('Último SOS: ' + agoraStr);
    setStatusSOS('Mensagem copiada e grupo aberto. Buscando GPS...');

    const abrirGrupo = window.open(GRUPO_GADE, '_blank');
    if (!abrirGrupo) window.location.href = GRUPO_GADE;

    if (navigator.geolocation) {
      navigator.geolocation.getCurrentPosition(
        p => {
          const comGps = base + `\nGPS: https://maps.google.com/?q=${p.coords.latitude},${p.coords.longitude}`;
          setUltimaMsgPronta(comGps);
          if (navigator.clipboard) navigator.clipboard.writeText(comGps).catch(() => {});
          setStatusSOS('GPS anexado e copiado.');
        },
        () => setStatusSOS('Mensagem pronta sem GPS.'),
        { timeout: 8000 }
      );
    }
  };

  const KIT_BASE = [
    { c: 'ÁGUA / COMIDA', itens: ['Água 2L por pessoa', 'Comida pronta / biscoito', 'Leite / mamadeira se tiver bebê'] },
    { c: 'LUZ / ENERGIA', itens: ['Lanterna + pilha', 'Carregador / power bank', 'Vela / fósforo'] },
    { c: 'DOCUMENTO / SAÚDE', itens: ['Documento com foto', 'Remédio de uso diário', 'Curativo / álcool / máscara'] },
    { c: 'SOBREVIVÊNCIA', itens: ['Muda de roupa seca', 'Cobertor / saco plástico', 'Dinheiro trocado / chave extra'] }
  ];

  const [kitCheck, setKitCheck] = useState(() => {
    try {
      const salvo = JSON.parse(localStorage.getItem('kitCADEv2') || 'null');
      if (salvo) return salvo;
    } catch (e) {}
    const def = {};
    KIT_BASE.forEach((g, gi) => g.itens.forEach((_, ii) => def[gi + '-' + ii] = false));
    return def;
  });

  const [kitExtras, setKitExtras] = useState(() => {
    try { return JSON.parse(localStorage.getItem('kitCADEextras') || '[]'); } catch (e) { return []; }
  });
  const [novoItem, setNovoItem] = useState('');

  const atualizarCheck = (k, val) => {
    const atualizado = { ...kitCheck, [k]: val };
    setKitCheck(atualizado);
    try { localStorage.setItem('kitCADEv2', JSON.stringify(atualizado)); } catch (e) {}
  };

  const addExtra = () => {
    if (!novoItem.trim()) return;
    const atualizados = [...kitExtras, novoItem.trim()];
    setKitExtras(atualizados);
    try { localStorage.setItem('kitCADEextras', JSON.stringify(atualizados)); } catch (e) {}
    setNovoItem('');
  };

  const removerExtra = (i) => {
    const atualizados = [...kitExtras];
    atualizados.splice(i, 1);
    setKitExtras(atualizados);
    try { localStorage.setItem('kitCADEextras', JSON.stringify(atualizados)); } catch (e) {}
  };

  const totalItens = Object.keys(kitCheck).length + kitExtras.length;
  const marcados = Object.values(kitCheck).filter(Boolean).length + kitExtras.filter((_, i) => kitCheck['extra-' + i]).length;
  const pct = totalItens ? Math.round((marcados / totalItens) * 100) : 0;

  const compartilharKit = () => {
    const nomeFinal = sosNome.trim() || userName || 'Morador(a)';
    const msg = `MEU KIT - RARU NEXUS V11.2 PLUS • GADE / CIDADÃO SENSOR\nNome: ${nomeFinal}\nKit: ${pct}% pronto\nProjeto: GADE - Grupo A Chave da Esperança`;
    if (navigator.clipboard) navigator.clipboard.writeText(msg).catch(() => {});
    showToast('Kit copiado. Abrindo grupo GADE.');
    window.open(GRUPO_GADE, '_blank');
  };

  return (
    <div id="estacaoGADE" className="cyber-card font-mono space-y-3">
      <div className="flex justify-between items-center gap-2 flex-wrap">
        <div className="text-cyberCyan font-display font-black text-sm uppercase">ESTAÇÃO GADE - COMUNIDADE</div>
        <a href={GRUPO_GADE} target="_blank" rel="noopener noreferrer" className="raru-store-btn ativo">
          GRUPO GADE
        </a>
      </div>
      <div className="text-slate-300 text-xs">Rocha Sobrinho / BNH / Banco de Areia • GADE - Grupo A Chave da Esperança</div>

      <PainelRotasEstacaoPublica />

      <div className="bg-void/90 border border-cyberRose/60 rounded-2xl p-3.5 space-y-2">
        <div className="text-cyberRose font-black text-xs uppercase">SOS VIZINHANÇA - AJUDA RÁPIDA</div>
        <div className="text-slate-300 text-xs">Copia mensagem com GPS e abre o grupo GADE para avisar vizinhos e rede local.</div>
        <input value={sosNome} onChange={e => setSosNome(e.target.value)} placeholder="Seu nome" className="w-full p-2.5 rounded-xl bg-deepSpace border border-cyberCyan/30 text-white text-xs permitir-selecao" />
        <input value={sosObs} onChange={e => setSosObs(e.target.value)} placeholder="Ex: rua alagando, idoso sozinho, falta luz..." className="w-full p-2.5 rounded-xl bg-deepSpace border border-cyberCyan/30 text-white text-xs permitir-selecao" />
        <div className="grid grid-cols-2 gap-2 pt-1">
          <button type="button" onClick={() => sosCADE('ENCHENTE')} className="cyber-button-danger text-[10px] py-2.5">SOS ENCHENTE</button>
          <button type="button" onClick={() => sosCADE('SAÚDE')} className="cyber-button text-[10px] py-2.5">SOS SAÚDE</button>
          <button type="button" onClick={() => sosCADE('ABRIGAR')} className="cyber-button text-[10px] py-2.5">PRECISO DE ABRIGO</button>
          <button type="button" onClick={() => sosCADE('AJUDA')} className="cyber-button-solid text-[10px] py-2.5">PEDIR AJUDA</button>
        </div>
        {statusSOS && <div className="text-cyberGreen text-xs font-bold pt-1">{statusSOS}</div>}
        {ultimaMsgPronta && (
          <div className="bg-deepSpace border border-cyberCyan/40 rounded-xl p-2.5 text-[11px] text-slate-200 whitespace-pre-wrap permitir-selecao">
            {ultimaMsgPronta}
          </div>
        )}
        {historicoSOS && <div className="text-[10px] text-slate-400">{historicoSOS}</div>}
      </div>

      <div className="bg-void/90 border border-cyberCyan/40 rounded-2xl p-3.5 space-y-2.5">
        <div className="flex justify-between items-center">
          <span className="text-cyberCyan font-black text-xs uppercase">KIT DE SOBREVIVÊNCIA</span>
          <span className="text-cyberGreen font-black text-xs">{pct}% PRONTO</span>
        </div>
        <div className="w-full h-2.5 bg-deepSpace rounded-full overflow-hidden border border-cyberCyan/20">
          <div className="h-full bg-gradient-to-r from-cyberCyan to-cyberGreen transition-all duration-300" style={{ width: `${pct}%` }}></div>
        </div>

        <div className="space-y-3 pt-1">
          {KIT_BASE.map((grp, gi) => (
            <div key={gi} className="bg-deepSpace/70 border border-cyberCyan/20 rounded-xl p-2.5 space-y-1.5">
              <div className="text-[10px] font-black text-cyberBlue uppercase">{grp.c}</div>
              {grp.itens.map((item, ii) => {
                const key = gi + '-' + ii;
                const checked = !!kitCheck[key];
                return (
                  <label key={key} className="flex items-center gap-2 text-xs text-slate-200 cursor-pointer py-0.5">
                    <input type="checkbox" checked={checked} onChange={e => atualizarCheck(key, e.target.checked)} className="accent-cyberCyan w-4 h-4" />
                    <span className={checked ? 'line-through text-slate-400' : ''}>{item}</span>
                  </label>
                );
              })}
            </div>
          ))}

          {kitExtras.length > 0 && (
            <div className="bg-deepSpace/70 border border-cyberGreen/30 rounded-xl p-2.5 space-y-1.5">
              <div className="text-[10px] font-black text-cyberGreen uppercase">ITENS EXTRAS</div>
              {kitExtras.map((item, i) => {
                const key = 'extra-' + i;
                const checked = !!kitCheck[key];
                return (
                  <div key={key} className="flex items-center justify-between gap-2 text-xs text-slate-200">
                    <label className="flex items-center gap-2 cursor-pointer flex-1">
                      <input type="checkbox" checked={checked} onChange={e => atualizarCheck(key, e.target.checked)} className="accent-cyberGreen w-4 h-4" />
                      <span className={checked ? 'line-through text-slate-400' : ''}>{item}</span>
                    </label>
                    <button type="button" onClick={() => removerExtra(i)} className="text-cyberRose text-[10px] font-bold px-2 py-0.5 rounded bg-void border border-cyberRose/40 cursor-pointer">X</button>
                  </div>
                );
              })}
            </div>
          )}
        </div>

        <div className="flex gap-2 pt-1">
          <input value={novoItem} onChange={e => setNovoItem(e.target.value)} placeholder="Adicionar item ao kit..." className="flex-1 p-2.5 rounded-xl bg-deepSpace border border-cyberCyan/30 text-white text-xs permitir-selecao" />
          <button type="button" onClick={addExtra} className="cyber-button text-xs px-4">+ ADD</button>
        </div>
        <button type="button" onClick={compartilharKit} className="cyber-button-solid w-full text-xs">COMPARTILHAR STATUS DO KIT</button>
      </div>
    </div>
  );
}

function ModuloRadarMeteorologico({ municipioSelecionado, showToast }) {
  const [dadosHorarios, setDadosHorarios] = useState([]);
  const [carregando, setCarregando] = useState(true);
  const [frenteSel, setFrenteSel] = useState(FRENTES_EQUIPES_TABELA[0]);
  const [obsCampo, setObsCampo] = useState('');
  const [registros, setRegistros] = useState(() => {
    try { return JSON.parse(localStorage.getItem('raru_zeladoria_logs') || '[]'); } catch (e) { return []; }
  });

  useEffect(() => {
    setCarregando(true);
    fetch(`https://api.open-meteo.com/v1/forecast?latitude=${municipioSelecionado.lat}&longitude=${municipioSelecionado.lon}&hourly=temperature_2m,precipitation,wind_speed_10m&forecast_days=1&timezone=America%2FSao_Paulo`)
      .then(r => r.json())
      .then(d => {
        if (d?.hourly?.time) {
          const items = d.hourly.time.slice(0, 8).map((t, idx) => ({
            hora: t.slice(11, 16),
            temp: `${d.hourly.temperature_2m[idx]}°C`,
            chuva: `${d.hourly.precipitation[idx]} mm`,
            vento: `${d.hourly.wind_speed_10m[idx]} km/h`
          }));
          setDadosHorarios(items);
        }
        setCarregando(false);
      })
      .catch(() => setCarregando(false));
  }, [municipioSelecionado]);

  const salvarLogCampo = async (e) => {
    e.preventDefault();
    if (!obsCampo.trim()) { showToast('Descreva a observação de campo.'); return; }

    setVistorias(lista);
    try { localStorage.setItem('raru_vistorias_log', JSON.stringify(lista)); } catch (e) {}

function ModuloBalancaESG({ showToast }) {
  const MATERIAIS = {
    PET: { label: 'Garrafa PET', aguaPorKg: 18, co2PorKg: 1.5, bueiroImpacto: 'Alto' },
    ALUMINIO: { label: 'Alumínio / Latinhas', aguaPorKg: 45, co2PorKg: 9.1, bueiroImpacto: 'Médio' },
    PAPELAO: { label: 'Papelão / Papel', aguaPorKg: 25, co2PorKg: 1.2, bueiroImpacto: 'Alto' },
    VIDRO: { label: 'Vidro', aguaPorKg: 12, co2PorKg: 0.6, bueiroImpacto: 'Médio' }
  };
  const [mat, setMat] = useState('PET');
  const [pesoKg, setPesoKg] = useState('4.5');
  const [historico, setHistorico] = useState(() => {
    try { return JSON.parse(localStorage.getItem('raru_esg_pesagens') || '[]'); } catch (e) { return []; }
  });

  const kgNum = Math.max(0, parseFloat(pesoKg) || 0);
  const infoMat = MATERIAIS[mat] || MATERIAIS.PET;
  const aguaSalva = (kgNum * infoMat.aguaPorKg).toFixed(1);
  const co2Evitado = (kgNum * infoMat.co2PorKg).toFixed(2);

  const registrarPesagem = (e) => {
    e.preventDefault();
    if (kgNum <= 0) { showToast('Informe um peso maior que zero.'); return; }
    const item = {
      id: Date.now(),
      material: infoMat.label,
      kg: kgNum.toFixed(2),
      aguaSalva,
      co2Evitado,
      data: new Date().toLocaleString('pt-BR')
    };
    const lista = [item, ...historico];
    setHistorico(lista);
    try { localStorage.setItem('raru_esg_pesagens', JSON.stringify(lista)); } catch (e) {}
    showToast(`Pesagem ESG registrada: ${item.kg} kg de ${item.material}.`);
  };

  return (
    <div className="cyber-card font-mono space-y-3">
      <div className="text-cyberGreen font-display font-black text-sm uppercase">BALANÇA COMUNITÁRIA & IMPACTO ESG</div>
      <form onSubmit={registrarPesagem} className="grid grid-cols-1 sm:grid-cols-3 gap-2">

          {Object.entries(MATERIAIS).map(([k, v]) => <option key={k} value={k}>{v.label}</option>)}
        </select>
        <input type="number" step="0.1" min="0" value={pesoKg} onChange={e => setPesoKg(e.target.value)} placeholder="Peso (kg)" className="p-2.5 rounded-xl bg-void border border-cyberCyan/40 text-white text-xs permitir-selecao" />
        <button type="submit" className="cyber-button-solid text-xs">REGISTRAR PESO</button>
      </form>

      <div className="grid grid-cols-3 gap-2">
        <div className="bg-void/90 border border-cyberCyan/30 rounded-xl p-2.5">
          <div className="text-[9px] text-slate-400">PESO ATUAL</div>
          <div className="text-sm font-black text-cyberCyan">{kgNum.toFixed(2)} kg</div>
        </div>
        <div className="bg-void/90 border border-cyberGreen/30 rounded-xl p-2.5">
          <div className="text-[9px] text-slate-400">ÁGUA POUPADA</div>
          <div className="text-sm font-black text-cyberGreen">{aguaSalva} L</div>
        </div>
        <div className="bg-void/90 border border-cyberBlue/30 rounded-xl p-2.5">
          <div className="text-[9px] text-slate-400">CO2 EVITADO</div>
          <div className="text-sm font-black text-cyberBlue">{co2Evitado} kg</div>
        </div>
      </div>

      <div className="space-y-1.5 pt-1">
        {historico.slice(0, 5).map(h => (
          <div key={h.id} className="bg-void/90 border border-cyberCyan/20 rounded-xl p-2.5 text-xs flex justify-between items-center gap-2">
            <div>
              <b className="text-white">{h.material}</b> — <span className="text-cyberCyan font-bold">{h.kg} kg</span>
              <div className="text-[10px] text-slate-400">{h.data}</div>
            </div>
            <div className="text-[10px] text-cyberGreen font-bold text-right">
              {h.aguaSalva}L água • {h.co2Evitado}kg CO2

        ))}
      </div>
    </div>
  );

function App() {
  const [aba, setAba] = useState('painel');

  const [buscaMun, setBuscaMun] = useState('');

  });
  const [perfilVozId, setPerfilVozId] = useState(() => {
    try { return localStorage.getItem('raru_perfil_voz') || 'sarah'; } catch (e) { return 'sarah'; }
  });
  const [toastMsg, setToastMsg] = useState('');
  const [chatOpen, setChatOpen] = useState(false);
  const [chatInput, setChatInput] = useState('');
  const [chatFalando, setChatFalando] = useState(false);
  const [chatMsgs, setChatMsgs] = useState(() => [{
    role: 'assistant',
    text: 'Canal tático ROBOT SARAH SYSTEM RARU pronto. Como posso te ajudar hoje?'
  }]);
  const [diaMode, setDiaMode] = useState(false);
  const [paredeMode, setParedeMode] = useState(false);
  const [lgpdAceito, setLgpdAceito] = useState(() => {
    try { return localStorage.getItem('raru_lgpd_v11_2') === 'true'; } catch (e) { return false; }
  });
  const [check1, setCheck1] = useState(false);
  const [check2, setCheck2] = useState(false);

  const showToast = (msg) => {
    setToastMsg(msg);
  };

  useEffect(() => {
    if (!toastMsg) return;
    const t = setTimeout(() => setToastMsg(''), 3200);
    return () => clearTimeout(t);
  }, [toastMsg]);

  useEffect(() => {
    if (diaMode) {
      document.documentElement.classList.add('raru-day-mode');
      document.body.classList.add('raru-day-mode');
    } else {
      document.documentElement.classList.remove('raru-day-mode');
      document.body.classList.remove('raru-day-mode');
    }
  }, [diaMode]);

  useEffect(() => {
    if (paredeMode) {
      document.body.classList.add('hud-wall-mode');
      document.body.classList.add('hud-expanded-mode');
    } else {
      document.body.classList.remove('hud-wall-mode');
      document.body.classList.remove('hud-expanded-mode');
    }
  }, [paredeMode]);

  useEffect(() => {
    const bloquearEvento = (e) => {
      const tag = (e.target && e.target.tagName) ? e.target.tagName.toLowerCase() : '';
      const editavel = e.target && (e.target.isContentEditable || tag === 'input' || tag === 'textarea' || tag === 'select');
      if (!editavel) e.preventDefault();
    };
    document.addEventListener('contextmenu', bloquearEvento);
    document.addEventListener('copy', bloquearEvento);
    document.addEventListener('cut', bloquearEvento);
    document.addEventListener('dragstart', bloquearEvento);
    return () => {
      document.removeEventListener('contextmenu', bloquearEvento);
      document.removeEventListener('copy', bloquearEvento);
      document.removeEventListener('cut', bloquearEvento);
      document.removeEventListener('dragstart', bloquearEvento);
    };
  }, []);

  const atualizarNomeUsuario = (novoNome) => {
    const limpo = String(novoNome || '').trim();
    setUserName(limpo);
    try { localStorage.setItem('raru_user_name', limpo); } catch (e) {}
  };

  const confirmarLGPD = () => {
    if (!check1 || !check2) {
      showToast('Marque as duas confirmações LGPD para prosseguir.');
      return;
    }
    setLgpdAceito(true);
    try { localStorage.setItem('raru_lgpd_v11_2', 'true'); } catch (e) {}
    showToast('Termo LGPD confirmado. Sistema liberado.');
  };

  const enviarChatModal = async (e) => {
    e.preventDefault();
    const txt = chatInput.trim();
    if (!txt) return;
    setChatInput('');

    let nomeAtual = userName;
    const mNome = txt.match(/(?:meu nome [ée]|me chamo|pode me chamar de|sou o|sou a)\s+([a-zà-ú]+)/i);
    if (mNome && mNome[1]) {
      nomeAtual = mNome[1].charAt(0).toUpperCase() + mNome[1].slice(1).toLowerCase();
      atualizarNomeUsuario(nomeAtual);
    }

    const prox = [...chatMsgs, { role: 'user', text: txt }];
    setChatMsgs(prox);
    const resp = await chamarSarah('conversa', prox.map(m => ({ role: m.role, content: m.text })), municipioSel.n, 'Rocha Sobrinho', aba, null, nomeAtual);
    const limpa = bloquearCalmaPessoa(resp);
    setChatMsgs(prev => [...prev, { role: 'assistant', text: limpa }]);
    setChatFalando(true);
    falarSarah(limpa, perfilVozId);
    setTimeout(() => setChatFalando(false), 3200);
  };

  const municipiosFiltrados = MUNICIPIOS_92.filter(m =>
    (m.n + ' ' + m.ip).toLowerCase().includes(buscaMun.toLowerCase())
  );

  const NAV_ITENS = [
    { id: 'painel', label: 'Painel', Icon: IconDashboard },
    { id: 'radar', label: 'Radar', Icon: IconRadar },
    { id: 'vistoria', label: 'Vistoria', Icon: IconVistoria },
    { id: 'estacao', label: 'Estação', Icon: IconEstacao },
    { id: 'alquino', label: 'Alquino', Icon: IconAlquino },
    { id: 'balanca', label: 'Balança', Icon: IconBalanca },
    { id: 'videos', label: 'Vídeos', Icon: IconVideos },
    { id: 'admin', label: 'Admin', Icon: IconAdmin }
  ];

  return (
    <div id="hudWrap" className={`seu-container-raru ${paredeMode ? 'modo-parede' : ''}`}>
      {!lgpdAceito && (
        <div className="fixed inset-0 z-50 bg-void/95 backdrop-blur-md flex items-center justify-center p-4">
          <div className="cyber-card max-w-lg w-full space-y-3 font-mono">
            <div className="flex items-center gap-2 text-cyberCyan font-display font-black text-sm uppercase">
              <EscudoRaruSVG size={20} color="#00F2FE" />
              <span>TERMO DE RESPONSABILIDADE • LGPD (LEI 13.709/2018)</span>
            </div>
            <p className="text-xs text-slate-300 leading-relaxed permitir-selecao">
              O <strong>RARU NEXUS V11.2 PLUS</strong> opera como ferramenta comunitária de ciência cidadã, monitoramento climático e apoio territorial em Mesquita e nos 92 municípios do Rio de Janeiro. Não exponha dados pessoais sensíveis de terceiros sem consentimento legal.
            </p>
            <label className="flex items-start gap-2.5 text-xs text-slate-200 cursor-pointer bg-void/80 p-2.5 rounded-xl border border-cyberCyan/25">
              <input type="checkbox" checked={check1} onChange={e => setCheck1(e.target.checked)} className="accent-cyberCyan mt-0.5 w-4 h-4" />
              <span>Assumo responsabilidade pelo uso ético e comunitário dos dados registrados.</span>
            </label>
            <label className="flex items-start gap-2.5 text-xs text-slate-200 cursor-pointer bg-void/80 p-2.5 rounded-xl border border-cyberCyan/25">
              <input type="checkbox" checked={check2} onChange={e => setCheck2(e.target.checked)} className="accent-cyberGreen mt-0.5 w-4 h-4" />
              <span>Compreendo que as alertas comunitários complementam — e não substituem — canais oficiais de emergência.</span>
            </label>
            <button type="button" onClick={confirmarLGPD} className="cyber-button-solid w-full text-xs">
              CONFIRMAR E ACESSAR SISTEMA
            </button>
          </div>
        </div>
      )}

      {toastMsg && (
        <div className="fixed top-4 left-1/2 -translate-x-1/2 z-50 bg-deepSpace border border-cyberCyan text-cyberCyan px-4 py-2.5 rounded-full text-xs font-mono font-bold shadow-[0_0_20px_rgba(0,242,254,0.45)]">
          {toastMsg}
        </div>
      )}

      <header className="cyber-card !p-3.5 flex flex-wrap items-center justify-between gap-3">
        <div className="flex items-center gap-3 min-w-0">
          <div className="w-11 h-11 rounded-2xl bg-void border border-cyberCyan/60 flex items-center justify-center shrink-0">
            <EscudoRaruSVG size={24} color="#00F2FE" />
          </div>
          <div className="min-w-0">
            <h1 className="font-display font-black text-sm sm:text-base text-white tracking-wider truncate">
              RARU NEXUS <span className="text-cyberCyan">V11.2 PLUS</span>
            </h1>
            <p className="text-[10px] font-mono text-cyberGreen truncate">
              CIDADÃO SENSOR • GADE • {municipioSel.n.toUpperCase()} ({municipioSel.ip})
            </p>
          </div>
        </div>

        <div className="flex items-center gap-1.5 flex-wrap">
          <button type="button" onClick={() => setParedeMode(p => !p)} className={`raru-store-btn ${paredeMode ? 'ativo' : ''}`} title="Modo Tela Ampla / Parede">
            <IconExpand size={12} color={paredeMode ? '#030712' : '#00F2FE'} />
            <span>{paredeMode ? 'HUD Normal' : 'HUD Tela'}</span>
          </button>
          <button type="button" onClick={() => setDiaMode(d => !d)} className={`raru-store-btn ${diaMode ? 'ativo' : ''}`} title="Alternar Tema Dia/Noite">
            <IconSunMoon size={12} color={diaMode ? '#030712' : '#00F2FE'} />
            <span>{diaMode ? 'Noturno' : 'Diurno'}</span>
          </button>
          <button type="button" onClick={() => compartilharEscudoComTextoUnico(showToast)} className="raru-store-btn">
            <EscudoRaruSVG size={12} color="#00F2FE" />
            <span>Compartilhar</span>
          </button>
        </div>
      </header>

      <div className="cyber-card !p-3 flex flex-col sm:flex-row items-stretch sm:items-center gap-2.5 font-mono">
        <div className="flex-1">
          <label className="text-[9px] text-cyberCyan font-black uppercase block mb-1">MUNICÍPIO MONITORADO (RJ)</label>
          <select
            value={municipioSel.n}
            onChange={e => {
              const found = MUNICIPIOS_92.find(m => m.n === e.target.value);
              if (found) setMunicipioSel(found);
            }}
            className="w-full bg-void border border-cyberCyan/40 rounded-xl px-3 py-2 text-xs text-white"
          >
            {MUNICIPIOS_92.map((m, i) => (
              <option key={i} value={m.n}>{m.n} • IP {m.ip}</option>
            ))}
          </select>
        </div>
        <div className="sm:w-56">
          <label className="text-[9px] text-slate-400 font-black uppercase block mb-1">FILTRO RÁPIDO</label>
          <input
            value={buscaMun}
            onChange={e => {
              setBuscaMun(e.target.value);
              const hit = MUNICIPIOS_92.find(m => m.n.toLowerCase().includes(e.target.value.toLowerCase()));
              if (hit && e.target.value.trim().length >= 3) setMunicipioSel(hit);
            }}
            placeholder="Buscar cidade..."
            className="w-full bg-void border border-cyberCyan/30 rounded-xl px-3 py-2 text-xs text-white permitir-selecao"
          />
        </div>
        <div className="sm:w-52">
          <label className="text-[9px] text-cyberGreen font-black uppercase block mb-1">COMO CHAMAR VOCÊ</label>
          <input
            value={userName}
            onChange={e => atualizarNomeUsuario(e.target.value)}
            placeholder="Seu nome no chat..."
            className="w-full bg-void border border-cyberGreen/35 rounded-xl px-3 py-2 text-xs text-white permitir-selecao"
          />
        </div>
      </div>

      <main className="flex-1 w-full">
        {aba === 'painel' && (
          <RaruRoboTelemetriaNoLugarDoMapa
            municipioSelecionado={municipioSel}
            onSelecionarMunicipio={setMunicipioSel}
            onNavegarModulo={setAba}
            abaAtual={aba}
            showToast={showToast}
            openSarahChat={() => setChatOpen(true)}
            userName={userName}
            onAtualizarNome={atualizarNomeUsuario}
          />
        )}
        {aba === 'radar' && <ModuloRadarMeteorologico municipioSelecionado={municipioSel} showToast={showToast} />}
        {aba === 'vistoria' && <ModuloVistoriaSirenes municipioSelecionado={municipioSel} showToast={showToast} />}
        {aba === 'estacao' && <EstacaoGADEModule showToast={showToast} userName={userName} />}
        {aba === 'alquino' && <ModuloAlquinoHardware municipioSelecionado={municipioSel} showToast={showToast} />}
        {aba === 'balanca' && <ModuloBalancaESG showToast={showToast} />}
        {aba === 'videos' && <ModuloMidiaTransmissoes showToast={showToast} />}
        {aba === 'admin' && (
          <div className="space-y-3">
            <CadeAdminModule showToast={showToast} />
            <div className="cyber-card">
              <SeletorVozGlobal perfilVozId={perfilVozId} setPerfilVozId={setPerfilVozId} />
            </div>
          </div>
        )}
      </main>

      <nav className="fixed bottom-0 left-0 right-0 z-40 bg-void/95 backdrop-blur-xl border-t border-cyberCyan/40 px-2 py-1.5">
        <div className="max-w-4xl mx-auto grid grid-cols-4 sm:grid-cols-8 gap-1">
          {NAV_ITENS.map(({ id, label, Icon }) => {
            const ativo = aba === id;
            return (
              <button
                key={id}
                type="button"
                onClick={() => setAba(id)}
                className={`flex flex-col items-center justify-center py-1.5 px-1 rounded-xl font-mono text-[9px] font-bold uppercase cursor-pointer transition-all ${
                  ativo
                    ? 'bg-cyberCyan/20 border border-cyberCyan text-cyberCyan shadow-[0_0_12px_rgba(0,242,254,0.3)]'
                    : 'text-slate-400 border border-transparent hover:text-white'
                }`}
              >
                <Icon size={15} color={ativo ? '#00F2FE' : '#94A3B8'} />
                <span className="mt-0.5 truncate w-full text-center">{label}</span>
              </button>
            );
          })}
        </div>
      </nav>

      <SarahFabButton openSarahChat={() => setChatOpen(true)} isSpeaking={chatFalando} />

      {chatOpen && (
        <div className="fixed inset-0 z-50 bg-black/75 backdrop-blur-sm flex items-end sm:items-center justify-center p-3">
          <div className="cyber-card max-w-md w-full !mb-0 space-y-3 font-mono">
            <div className="flex items-center justify-between border-b border-cyberCyan/30 pb-2">
              <div className="flex items-center gap-2.5">
                <div className="w-11 h-11">
                  <SarahAnimatedAvatar isSpeaking={chatFalando} />
                </div>
                <div>
                  <div className="text-xs font-black text-cyberCyan uppercase">ROBOT SARAH SYSTEM RARU</div>
                  <div className="text-[10px] text-cyberGreen">{municipioSel.n} • Voz: {perfilVozId.toUpperCase()}</div>
                </div>
              </div>
              <button type="button" onClick={() => setChatOpen(false)} className="cyber-button-danger text-xs px-3 py-1.5 !min-h-[36px]">
                FECHAR
              </button>
            </div>

            <div className="max-h-60 overflow-y-auto space-y-2 pr-1">
              {chatMsgs.map((m, idx) => (
                <div
                  key={idx}
                  className={`p-2.5 rounded-xl text-xs leading-relaxed permitir-selecao ${
                    m.role === 'user'
                      ? 'bg-cyberCyan/15 border border-cyberCyan/40 text-white ml-6'
                      : 'bg-void border border-slate-700 text-slate-200 mr-6'
                  }`}
                >
                  <div className="text-[9px] font-black text-cyberCyan uppercase mb-0.5">
                    {m.role === 'user' ? (userName || 'VOCÊ') : 'ROBOT SARAH SYSTEM RARU'}
                  </div>
                  <div>{m.text}</div>
                </div>
              ))}
            </div>

            <form onSubmit={enviarChatModal} className="flex gap-2">
              <input
                value={chatInput}
                onChange={e => setChatInput(e.target.value)}
                placeholder="Digite ou pergunte algo..."
                className="flex-1 bg-void border border-cyberCyan/40 rounded-xl px-3 py-2 text-xs text-white permitir-selecao"
              />
              <button type="submit" className="cyber-button-solid text-xs px-4 !min-h-[40px]">ENVIAR</button>
            </form>
          </div>
        </div>
      )}
    </div>
  );
}

const rootEl = document.getElementById('root');
ReactDOM.createRoot(rootEl).render(<App />);
</script>
</body>
</html>
