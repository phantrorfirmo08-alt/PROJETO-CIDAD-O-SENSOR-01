function App() {
  const [activeTab, setActiveTab] = useState('dashboard');
  const [showWhoAmI, setShowWhoAmI] = useState(false);
  const [showSarahChat, setShowSarahChat] = useState(false);
  const [showNameModal, setShowNameModal] = useState(false);
  const [showAvisoVoz, setShowAvisoVoz] = useState(false);

  const [userName, setUserName] = useState(() => {
    try { return localStorage.getItem("raru_nome_pessoa") || localStorage.getItem("raru_user_name") || ""; } catch (e) { return ""; }
  });

  const atualizarNomeUsuario = (novoNome) => {
    const limpo = (novoNome || "").trim();
    setUserName(limpo);
    try {
      if (limpo) {
        localStorage.setItem("raru_nome_pessoa", limpo);
        localStorage.setItem("raru_user_name", limpo);
      } else {
        localStorage.removeItem("raru_nome_pessoa");
        localStorage.removeItem("raru_user_name");
      }
    } catch (e) {}
  };

  const [fontScale, setFontScale] = useState(() => {
    try { const s = parseFloat(localStorage.getItem('raru_font_scale')); if (!isNaN(s) && s >= 0.85 && s <= 1.35) return s; } catch (e) {}
    return 1.0;
  });

  useEffect(() => {
    const aplicarEscala = () => {
      try {
        document.documentElement.style.fontSize = (16 * fontScale) + 'px';
        localStorage.setItem('raru_font_scale', String(fontScale));
      } catch (e) {}
    };
    aplicarEscala();
    window.addEventListener('resize', aplicarEscala);
    return () => window.removeEventListener('resize', aplicarEscala);
  }, [fontScale]);

  const alterarFonte = (delta) => {
    setFontScale(prev => {
      const next = Math.max(0.85, Math.min(1.35, Number((prev + delta).toFixed(2))));
      showToast(next === 1 ? "Tamanho da fonte padrão (100%)" : `Fonte: ${Math.round(next * 100)}%`);
      return next;
    });
  };

  const [soundEnabled, setSoundEnabled] = useState(() => {
    try { return localStorage.getItem("raru_sound_enabled") !== "false"; } catch (e) { return true; }
  });

  const [perfilVozId, setPerfilVozId] = useState(() => {
    try { return localStorage.getItem("raru_perfil_voz") || 'sarah'; } catch (e) { return 'sarah'; }
  });

  const [customTickerText, setCustomTickerText] = useState(() => {
    try { return localStorage.getItem('raru_custom_ticker') || `${TITULO_OFICIAL_RARU} — ${SUBTITULO_OFICIAL_RARU} • 92 MUNICÍPIOS RJ • GOES-19 & RAINVIEWER • MESQUITA - RJ • GADE • PROJETO CIDADÃO SENSOR`; }
    catch (e) { return `${TITULO_OFICIAL_RARU} — ${SUBTITULO_OFICIAL_RARU}`; }
  });

  const [toastMsg, setToastMsg] = useState(null);
  const [localVideos, setLocalVideos] = useState(() => {
    try { const saved = localStorage.getItem('raru_local_videos'); return saved ? JSON.parse(saved) : []; } catch (e) { return []; }
  });

  const [isWallMode, setIsWallMode] = useState(() => {
    try { return localStorage.getItem('raru_wall_mode') === 'true'; } catch (e) { return false; }
  });

  const [screenInfo, setScreenInfo] = useState({ type: 'Smartphone', width: window.innerWidth, height: window.innerHeight, isLargeScreen: false });

  const [radioEstacaoAtiva, setRadioEstacaoAtiva] = useState(0);
  const [radioFallbackIdx, setRadioFallbackIdx] = useState(-1);
  const [radioTocando, setRadioTocando] = useState(false);
  const [radioVolume, setRadioVolume] = useState(75);
  const [radioStatusStream, setRadioStatusStream] = useState("Pronto para sintonizar");
  const radioAudioRef = useRef(null);

  const [deferredInstallPrompt, setDeferredInstallPrompt] = useState(null);
  const [isStandalone, setIsStandalone] = useState(false);

  const showToast = (msg) => {
    setToastMsg(msg);
    setTimeout(() => setToastMsg(null), 2800);
  };

  useEffect(() => {
    sincronizarTelemetria92RJ();
    const timer = setInterval(() => sincronizarTelemetria92RJ(), 300000);
    return () => clearInterval(timer);
  }, []);

  useEffect(() => {
    const checkStandalone = () => {
      const isStand = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
      setIsStandalone(isStand);
    };
    checkStandalone();
    const handler = (e) => { e.preventDefault(); setDeferredInstallPrompt(e); };
    window.addEventListener('beforeinstallprompt', handler);
    window.addEventListener('appinstalled', () => { setDeferredInstallPrompt(null); setIsStandalone(true); showToast("App instalado na tela inicial."); });
    return () => window.removeEventListener('beforeinstallprompt', handler);
  }, []);

  const triggerInstallPWA = () => {
    if (deferredInstallPrompt) {
      deferredInstallPrompt.prompt();
      deferredInstallPrompt.userChoice.then(r => { if (r.outcome === 'accepted') setDeferredInstallPrompt(null); });
      return;
    }
    const isIos = /iphone|ipad|ipod/i.test(navigator.userAgent);
    if (isIos) alert(`Para instalar o ${TITULO_OFICIAL_RARU} no iPhone ou iPad:\n\n1. Toque no botão Compartilhar na barra do Safari.\n2. Role para baixo e toque em Adicionar à Tela de Início.`);
    else alert(`Para instalar o ${TITULO_OFICIAL_RARU} no Android:\n\n1. Toque nos três pontinhos do navegador (Chrome ou Brave).\n2. Selecione Instalar aplicativo ou Adicionar à tela inicial.`);
  };

  useEffect(() => {
    const handleResize = () => {
      const w = window.innerWidth, h = window.innerHeight;
      let t = "Smartphone", large = false;
      if (w >= 1200) { t = h >= 800 ? "Smart TV 60/65\"" : "Projetor / Desktop"; large = true; }
      else if (w >= 768) { t = "Tablet"; large = true; }
      setScreenInfo({ type: t, width: w, height: h, isLargeScreen: large });
    };
    handleResize();
    window.addEventListener("resize", handleResize);
    return () => window.removeEventListener("resize", handleResize);
  }, []);

  useEffect(() => {
    const hudWrap = document.getElementById('hudWrap');
    if (isWallMode) {
      document.body.classList.add('hud-wall-mode', 'hud-expanded-mode');
      if (hudWrap) hudWrap.classList.add('modo-parede', 'ativo');
    } else {
      document.body.classList.remove('hud-wall-mode', 'hud-expanded-mode');
      if (hudWrap) hudWrap.classList.remove('modo-parede', 'ativo');
    }
    try { localStorage.setItem('raru_wall_mode', String(isWallMode)); } catch (e) {}
  }, [isWallMode]);

  const toggleWallMode = (forceValue = null) => {
    const next = typeof forceValue === 'boolean' ? forceValue : !isWallMode;
    setIsWallMode(next);
    showToast(next ? "Wall Mode ativado (tela expandida)." : "Wall Mode desativado.");
  };

  const toggleSound = () => {
    const next = !soundEnabled;
    setSoundEnabled(next);
    try { localStorage.setItem("raru_sound_enabled", String(next)); } catch (e) {}
    if (!next && "speechSynthesis" in window) {
      try { window.speechSynthesis.cancel(); } catch (e) {}
    }
    showToast(next ? "Áudio da Sarah ativado." : "Áudio silenciado.");
  };

  const handleOpenSarahChat = () => {
    setShowSarahChat(true);
    if (soundEnabled) {
      setTimeout(() => {
        const msg = userName
          ? `Tô aqui no ${TITULO_OFICIAL_RARU}, ${userName}. Manda o que você precisa.`
          : `Tô aqui no ${TITULO_OFICIAL_RARU} — ${SUBTITULO_OFICIAL_RARU}. Qual é o seu nome e o que você manda?`;
        falarImitada(msg, perfilVozId);
      }, 200);
    }
  };

  useEffect(() => {
    const bloquearContextMenu = (e) => {
      if (e.target && e.target.closest && e.target.closest('input, textarea, select, .permitir-selecao')) return;
      e.preventDefault();
    };
    const bloquearAtalhosTeclado = (e) => {
      if (e.key === 'F12' || (e.ctrlKey && e.shiftKey && ['I', 'J', 'C'].includes(e.key.toUpperCase())) || (e.ctrlKey && ['u', 'U', 's', 'S', 'c', 'C', 'a', 'A', 'p', 'P'].includes(e.key))) {
        const ativo = document.activeElement;
        const emCampo = ativo && (ativo.tagName === 'INPUT' || ativo.tagName === 'TEXTAREA' || ativo.isContentEditable);
        if (!emCampo) e.preventDefault();
      }
    };
    document.addEventListener('contextmenu', bloquearContextMenu);
    document.addEventListener('keydown', bloquearAtalhosTeclado);
    return () => {
      document.removeEventListener('contextmenu', bloquearContextMenu);
      document.removeEventListener('keydown', bloquearAtalhosTeclado);
    };
  }, []);

  const navItems = [
    { id: 'dashboard', label: 'Painel', Icon: IconDashboard },
    { id: 'radar', label: 'Radar', Icon: IconRadar },
    { id: 'vistoria', label: 'Vistoria', Icon: IconVistoria },
    { id: 'estacao', label: 'Estação', Icon: IconEstacao },
    { id: 'alquino', label: 'Alquino', Icon: IconAlquino },
    { id: 'balanca', label: 'Balança', Icon: IconBalanca },
    { id: 'radio', label: 'Rádio', Icon: IconRadio },
    { id: 'videos', label: 'Vídeos', Icon: IconVideos },
    { id: 'admin', label: 'Admin', Icon: IconAdmin },
  ];

  return (
    <div className="seu-container-raru">
      {toastMsg && (
        <div className="fixed top-4 left-1/2 -translate-x-1/2 z-[150] px-4 py-2 rounded-full bg-void/95 border border-cyberCyan text-cyberCyan text-xs font-mono font-bold shadow-2xl">
          {toastMsg}
        </div>
      )}

      <div className="w-full overflow-hidden bg-gradient-to-r from-cyberCyan/10 via-commandPanel/60 to-cyberCyan/10 border border-cyberCyan/30 rounded-xl py-1.5 mb-2.5 shadow-inner">
        <div className="flex whitespace-nowrap gap-10 font-mono text-[10px] font-bold text-cyberCyan uppercase tracking-wider" style={{ animation: 'tickerScroll 28s linear infinite', width: 'max-content' }}>
          <span>{customTickerText}</span>
          <span>•</span>
          <span>{customTickerText}</span>
          <span>•</span>
          <span>{customTickerText}</span>
        </div>
      </div>

      <header className="flex items-center justify-between gap-2 pb-3 mb-3 border-b border-cyberCyan/25 flex-wrap">
        <div className="flex items-center gap-2.5 min-w-0">
          <div className="w-9 h-9 rounded-full bg-deepSpace border border-cyberCyan/60 flex items-center justify-center shrink-0">
            <EscudoRaruSVG size={18} color="#00F2FE" />
          </div>
          <div className="min-w-0">
            <h1 className="font-display text-xs sm:text-sm font-black text-white tracking-wider truncate">
              {TITULO_OFICIAL_RARU}
            </h1>
            <p className="text-[9px] font-mono text-cyberCyan font-bold truncate">
              {SUBTITULO_OFICIAL_RARU}

          </div>
        </div>

        <div className="flex items-center gap-1.5 flex-wrap">
          <button type="button" onClick={() => alterarFonte(-0.05)} className="raru-store-btn" title="Diminuir fonte">A-</button>
          <button type="button" onClick={() => alterarFonte(0.05)} className="raru-store-btn" title="Aumentar fonte">A+</button>
          <button type="button" onClick={toggleSound} className={`raru-store-btn ${soundEnabled ? 'ativo' : ''}`}>

          </button>
          {!isStandalone && (
            <button type="button" onClick={triggerInstallPWA} className="raru-store-btn">

              <span>Instalar</span>
            </button>

        </div>
      </header>

      <div className="flex-1 w-full">
        {activeTab === 'dashboard' && (
          <CardIdentidadeVisualRARU
            openSarahChat={handleOpenSarahChat}
            handleWhoAmIClick={() => setShowWhoAmI(true)}
            setActiveTab={setActiveTab}
            toggleWallMode={toggleWallMode}
            isWallMode={isWallMode}

            onOpenNameModal={() => setShowNameModal(true)}

            setEstacaoAtiva={setRadioEstacaoAtiva}
            fallbackIdx={radioFallbackIdx}

          />
        )}
      </div>

      <audio ref={radioAudioRef} preload="none" />

      <SarahFabButton openSarahChat={handleOpenSarahChat} isSpeaking={false} />

      <SarahChatModal
        isOpen={showSarahChat}
        onClose={() => setShowSarahChat(false)}

      />

      <ModalAvisoVoz
        isOpen={showAvisoVoz}
        onClose={() => setShowAvisoVoz(false)}
        onConfirmar={() => {
          setShowAvisoVoz(false);
          setSoundEnabled(true);
          try { localStorage.setItem("raru_sound_enabled", "true"); } catch (e) {}
          falarImitada(`${TITULO_OFICIAL_RARU}, ${SUBTITULO_OFICIAL_RARU}, voz ativada.`, perfilVozId);
        }}
      />

      <nav className="fixed bottom-0 left-0 right-0 z-40 bg-void/95 backdrop-blur-xl border-t border-cyberCyan/35 px-1.5 py-1.5">
        <div className="max-w-5xl mx-auto grid grid-cols-9 gap-1">
          {navItems.map(item => {
            const IconComp = item.Icon;
            const ativa = activeTab === item.id;
            return (
              <button
                key={item.id}
                type="button"
                onClick={() => setActiveTab(item.id)}
                className={`flex flex-col items-center justify-center py-1.5 px-0.5 rounded-xl font-mono text-[8px] font-bold transition cursor-pointer ${ativa ? 'bg-cyberCyan text-void shadow-[0_0_12px_rgba(0,242,254,0.6)]' : 'text-slate-400 hover:text-cyberCyan'}`}
              >
                <IconComp size={14} color={ativa ? '#030712' : '#00F2FE'} />
                <span className="mt-0.5 truncate w-full text-center">{item.label}</span>
              </button>
            );
          })}
        </div>
      </nav>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js" defer></script>
</body>
