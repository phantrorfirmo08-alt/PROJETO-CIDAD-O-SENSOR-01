<!DOCTYPE html>
<html lang="pt-PT" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Sarah AI Nexus v8.4.2 PRO - Cyber Command Center & Telemetric Grid</title>

    <link rel="manifest" href="./manifest.json?v=8.4.2">
    <meta name="theme-color" content="#02040A">
    <link rel="apple-touch-icon" href="https://cdn.imagetourls.com/uploads/tyImg/BPatwSxX.png">
    <meta property="og:title" content="Sarah AI Nexus v8.4.2 PRO - Defesa Civil Comunitária">
    <meta property="og:description" content="App de Prevenção e apoio meteorológico comunitário automatizado. Projeto Cidadão Sensor. Abrangência Estadual (RJ) e Municipal (Mesquita).">
    <meta property="og:image" content="https://cdn.imagetourls.com/uploads/tyImg/BPatwSxX.png">
    <meta property="og:type" content="website">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Orbitron:wght@600;800;900&family=JetBrains+Mono:wght@400;600;800&display=swap" rel="stylesheet">

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

    <script>
      (function() {
        try {
            const savedTheme = localStorage.getItem('sarah-theme') || 'dark';
            if (savedTheme === 'warm') {
                document.documentElement.classList.remove('dark');
                document.documentElement.classList.add('warm');
            } else {
                document.documentElement.classList.add('dark');
                document.documentElement.classList.remove('warm');
            }
        } catch(e) {}
      })();
    </script>

    <script>
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Plus Jakarta Sans', 'system-ui', 'sans-serif'],
                        display: ['Orbitron', 'sans-serif'],
                        mono: ['JetBrains Mono', 'monospace'],
                    },
                    colors: {
                        void: "#02040A",
                        deepSpace: "#060B18",
                        commandPanel: "#0D152D",
                        cyberCyan: "#00F2FE",
                        cyberBlue: "#4FACFE",
                        cyberGreen: "#10B981",
                        cyberAmber: "#FF9900",
                        cyberRose: "#F43F5E",
                        cyberPurple: "#8B5CF6",
                        warmBg: "#F4F3EF",
                        warmText: "#111827",
                        warmCard: "#FFFFFF",
                        warmBorder: "#D1D5DB"
                    },
                    animation: {
                        'radar-sweep': 'radarSweep 4s linear infinite',
                        'hud-pulse': 'hudPulse 2.5s cubic-bezier(0.4, 0, 0.6, 1) infinite',
                        'glow-shift': 'glowShift 6s ease-in-out infinite alternate',
                        'cyber-scan': 'cyberScan 3s linear infinite',
                        'float-slow': 'floatSlow 6s ease-in-out infinite'
                    },
                    keyframes: {
                        radarSweep: {
                            '0%': { transform: 'rotate(0deg)' },
                            '100%': { transform: 'rotate(360deg)' }
                        },
                        hudPulse: {
                            '0%, 100%': { opacity: '1', transform: 'scale(1)' },
                            '50%': { opacity: '0.4', transform: 'scale(1.03)' }
                        },
                        glowShift: {
                            '0%': { backgroundPosition: '0% 50%' },
                            '100%': { backgroundPosition: '100% 50%' }
                        },
                        cyberScan: {
                            '0%': { transform: 'translateY(-100%)' },
                            '100%': { transform: 'translateY(500%)' }
                        },
                        floatSlow: {
                            '0%, 100%': { transform: 'translateY(0px)' },
                            '50%': { transform: 'translateY(-8px)' }
                        }
                    }
                }
            }
        };
    </script>
    <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        @keyframes tickerScroll {
          0% { transform: translateX(0); }
          100% { transform: translateX(-50%); }
        }
        html, body, #root {
            min-height: 100%;
            margin: 0;
            font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
            touch-action: pan-x pan-y;
            -webkit-text-size-adjust: 100%;
            overscroll-behavior-y: none;
            background-color: #02040A;
            color: #FFFFFF;
        }
        body {
            overflow-x: hidden;
            background-image: 
                radial-gradient(circle at 50% 0%, rgba(0, 242, 254, 0.08) 0%, transparent 60%),
                radial-gradient(circle at 10% 90%, rgba(16, 185, 129, 0.05) 0%, transparent 50%);
            transition: background-color 0.4s ease, color 0.4s ease;
        }
        .cyber-card {
            background: linear-gradient(135deg, rgba(13, 21, 45, 0.95) 0%, rgba(6, 11, 24, 0.98) 100%);
            backdrop-filter: blur(25px);
            border: 1px solid rgba(0, 242, 254, 0.4);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.7), inset 0 1px 0 rgba(0, 242, 254, 0.2);
        }
        .cyber-border-glow {
            position: relative;
            border: 1px solid transparent;
            background: 
                linear-gradient(135deg, rgba(6,11,24,0.95), rgba(13,21,45,0.95)) padding-box,
                linear-gradient(135deg, #00F2FE, #4FACFE, #10B981) border-box;
        }
        .cyber-button {
            background: linear-gradient(135deg, #FF9900 0%, #F59E0B 100%);
            background-size: 200% auto;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            color: #02040A !important;
        }
        .cyber-button:hover {
            background-position: right center;
            box-shadow: 0 0 25px rgba(255, 153, 0, 0.6);
            transform: translateY(-2px);
        }
        .cyborg-btn-futuristic {
            background: linear-gradient(135deg, rgba(0, 242, 254, 0.15) 0%, rgba(79, 172, 254, 0.1) 100%);
            border: 1px solid rgba(0, 242, 254, 0.5);
            transition: all 0.25s ease;
        }
        .cyborg-btn-futuristic:hover {
            background: rgba(0, 242, 254, 0.3);
            border-color: #00F2FE;
            box-shadow: 0 0 20px rgba(0, 242, 254, 0.6);
        }
        html.warm body {
            background-color: #F4F3EF !important;
            color: #111827 !important;
            background-image: none !important;
        }
        html.warm .cyber-card {
            background: rgba(255, 255, 255, 0.95) !important;
            color: #111827 !important;
            border: 1px solid #D1D5DB !important;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05) !important;
        }
        .hud-grid {
            background-image: linear-gradient(rgba(0, 242, 254, 0.03) 1px, transparent 1px),
                              linear-gradient(90deg, rgba(0, 242, 254, 0.03) 1px, transparent 1px);
            background-size: 20px 20px;
        }
        .radar-handle {
            position: fixed;
            right: 0;
            top: 44%;
            z-index: 55;
            writing-mode: vertical-rl;
            padding: 18px 8px;
            border-radius: 14px 0 0 14px;
            background: linear-gradient(180deg, #00F2FE, #10B981);
            color: #02040A;
            font-family: 'Orbitron', sans-serif;
            font-size: 10px;
            font-weight: 900;
            letter-spacing: 2.5px;
            cursor: pointer;
            border: none;
            box-shadow: -5px 0 25px rgba(0, 242, 254, 0.5);
            transition: transform 0.25s ease;
        }
        .radar-handle:hover { transform: translateX(-6px); }
        ::-webkit-scrollbar { width: 5px; height: 5px; }
        ::-webkit-scrollbar-thumb { background: rgba(0,242,254,0.4); border-radius: 9999px; }
    </style>
</head>
<body class="selection:bg-cyan-500 selection:text-void hud-grid pb-6">
    <div id="root"></div>
    <script type="text/babel">
        const R = React;
        document.addEventListener('gesturestart', function(e) { e.preventDefault(); });

        const APP_SHARE_URL = "https://phantrorfirmo08-alt.github.io/PROJETO-CIDAD-O-SENSOR-01/";
        const SPLASH_IMAGE_URL = "https://cdn.imagetourls.com/uploads/tyImg/fIhV6NLh.png";
        const SARAH_CUSTOM_AVATAR_URL = "https://cdn.imagetourls.com/uploads/tyImg/195w5uur9.png";

        const shareMessageText = `Sarah AI Nexus v8.4.2 PRO\nDefesa Civil Comunitária • Grupo a Chave da Esperança/GADE - 🛡️\nAbrangência Estadual (RJ) & Municipal (Mesquita)\n\nInstale o app oficial:\n${APP_SHARE_URL}`;

        const getBrasiliaGreeting = () => {
            const hour = parseInt(
                new Intl.DateTimeFormat("pt-BR", { timeZone: "America/Sao_Paulo", hour: "numeric", hour12: false }).format(new Date()),
                10
            );
            if (hour >= 0 && hour < 5) return "Boa madrugada";
            if (hour >= 5 && hour < 12) return "Bom dia";
            if (hour >= 12 && hour < 18) return "Boa tarde";
            return "Boa noite";
        };

        const SARAH_TALK_TOPICS = [
            { icon: "🙏", tag: "FÉ & RELIGIÃO", lines: [
                "Sabem, a fé move montanhas. Como diz Salmos 127: se o Senhor não guardar a cidade, em vão vigia o sentinela. Que a nossa vigilância seja sempre guiada pela oração.",
                "A gratidão transforma o dia. Agradeça pelo novo amanhecer, pela família, pela comunidade unida. A esperança é o primeiro degrau da resiliência."
            ]},
            { icon: "🌦️", tag: "PREVENÇÃO", lines: [
                "Lembrete estadual e municipal: em dias de chuva intensa, evite áreas de risco, encostas e margens dos rios Sarapuí, Dona Eugênia e Iguaçu. Emergências: ligue 199 ou 193.",
                "Cadastre-se nos alertas da Defesa Civil. Um minuto de preparação pode salvar vidas em todo o Estado do Rio de Janeiro."
            ]}
        ];

        const SETORES_OFICIAIS = [
            "🛡️ Defesa Civil Municipal (COMPDEC-AVD) & Estadual",
            "🏛️ SEMIMSP / SEMMURB (Obras e Urbanismo)",
            "🎓 Universidades, Institutos (Núcleos de Pesquisa)",
            "🏠 CRAS (Assistência Social)",
            "SUS (Vigilância em Saúde)",
            "🤝 NUPDECs (Núcleos Comunitários de Proteção)",
            "🔔 Projeto Cidadão Sensor (RCS / Monitoramento Participativo)",
            "📢 Projeto Social Bom Dia Comunidade (Apoio Comunitário)"
        ];

        function RadarScanIcon({ className = "w-5 h-5" }) {
            return (
                <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                    <circle cx="12" cy="12" r="10"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/><path d="M2 12h20"/>
                </svg>
            );
        }

        function FieldReportIcon({ className = "w-5 h-5" }) {
            return (
                <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                    <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/>
                </svg>
            );
        }

        function CyberShieldIcon({ className = "w-6 h-6" }) {
            return (
                <svg className={className} viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M12 2L3 6V11C3 16.55 6.84 21.74 12 23C17.16 21.74 21 16.55 21 11V6L12 2Z" fill="url(#omegaGrad)" stroke="#00F2FE" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round"/>
                    <path d="M12 7C9.79 7 8 8.79 8 11C8 12.1 8.44 13.09 9.14 13.8L9 18H11V20H13V18H15V14.8C15.56 14.09 16 13.1 16 11C16 8.79 14.21 7 12 7Z" fill="#02040A"/>
                    <defs>
                        <linearGradient id="omegaGrad" x1="3" y1="2" x2="21" y2="23" gradientUnits="userSpaceOnUse">
                            <stop stopColor="#00F2FE"/><stop offset="1" stopColor="#10B981"/>
                        </linearGradient>
                    </defs>
                </svg>
            );
        }

        function SarahHologramAvatar({ isLarge = false, isSpeaking = false }) {
            return (
                <div className={isLarge ? "w-full max-w-[280px] aspect-square mx-auto p-4 rounded-[36px] cyber-border-glow shadow-[0_0_100px_rgba(0,242,254,0.7)] flex flex-col items-center justify-center relative bg-deepSpace/90" : "w-12 h-12 rounded-2xl p-1.5 cyber-border-glow shrink-0 flex items-center justify-center relative bg-deepSpace/90"}>
                    <div className={`relative rounded-full flex items-center justify-center bg-void border-2 border-cyberCyan shadow-[0_0_50px_rgba(0,242,254,0.9)] overflow-hidden ${isLarge ? 'w-28 h-28' : 'w-9 h-9'}`}>
                        <img src={SARAH_CUSTOM_AVATAR_URL} alt="Sarah Avatar" className="w-full h-full object-cover relative z-10 rounded-full" />
                    </div>
                    {isLarge && (
                        <div className="mt-4 text-center space-y-1">
                            <div className="inline-flex items-center gap-1.5 px-3 py-1 rounded-full bg-cyberCyan/20 border border-cyberCyan/60 font-mono text-[9px] text-cyberCyan tracking-widest">
                                <span className="w-2 h-2 rounded-full bg-cyberCyan animate-ping"></span>
                                NÚCLEO OMEGA v8.4.2 PRO ATIVO
                            </div>
                            <div className="font-display font-black text-base text-white tracking-[0.25em]">SARAH AI NEXUS</div>
                        </div>
                    )}
                </div>
            );
        }

        function AppSplashScreen({ onFinish }) {
            return (
                <div className="fixed inset-0 z-[300] bg-[#02040A] flex flex-col items-center justify-center p-3 text-center">
                    <div className="w-[90vw] max-w-[340px] rounded-[28px] border-2 border-cyberCyan/90 flex flex-col items-center justify-center bg-deepSpace/95 p-4 space-y-3 shadow-[0_0_80px_rgba(0,242,254,0.6)]">
                        <div className="font-display font-black text-xs text-cyberCyan tracking-widest uppercase">SARAH AI NEXUS v8.4.2 PRO</div>
                        <div className="font-sans font-bold text-[10px] text-slate-200">Defesa Civil Comunitária • Estado do RJ & Mesquita - 🛡️</div>
                        <img src={SPLASH_IMAGE_URL} alt="Splash Logo" className="w-full h-auto max-h-[220px] object-contain rounded-xl border border-cyberCyan/30 p-1" />
                        <button type="button" onClick={onFinish} className="w-full py-3 cyber-button font-extrabold rounded-xl text-xs uppercase tracking-widest cursor-pointer shadow-[0_0_25px_rgba(255,153,0,0.6)]">Entrar no Sistema</button>
                    </div>
                </div>
            );
        }

        function NativeHydroWindRadar({ isOpen, onToggle }) {
            return (
                <R.Fragment>
                    <button className="radar-handle" onClick={onToggle}>{isOpen ? "✕ FECHAR" : "🛰 RADAR 24H ◀"}</button>
                    {isOpen && (
                        <div className="fixed inset-0 z-[80] bg-void/90 backdrop-blur-2xl flex justify-end" onClick={onToggle}>
                            <div className="w-full max-w-[700px] cyber-card h-full flex flex-col" onClick={e => e.stopPropagation()}>
                                <div className="flex justify-between p-4 border-b border-cyberCyan/30">
                                    <span className="font-display font-bold text-xs text-cyberCyan">RADAR METEOROLÓGICO • RIO DE JANEIRO</span>
                                    <button onClick={onToggle} className="text-cyberRose font-bold text-xs">✕ FECHAR</button>
                                </div>
                                <iframe src="https://embed.windy.com/embed2.html?lat=-22.7845&lon=-43.4190&zoom=10&overlay=wind" className="w-full flex-1 border-none bg-void" allowFullScreen></iframe>
                            </div>
                        </div>
                    )}
                </R.Fragment>
            );
        }

        function FieldReportModule({ onBackToDashboard, showToast }) {
            const [setor, setSetor] = React.useState(SETORES_OFICIAIS[0]);
            const [nivelRisco, setNivelRisco] = React.useState("🟢 Risco Baixo / Monitoramento");
            const [agente, setAgente] = React.useState("");
            const [local, setLocal] = React.useState("");
            const [desc, setDesc] = React.useState("");

            return (
                <div className="space-y-4 pb-12">
                    <div className="flex items-center justify-between cyber-card p-4 rounded-2xl">
                        <button onClick={onBackToDashboard} className="px-3 py-1.5 cyborg-btn-futuristic text-cyberCyan rounded-xl font-bold text-xs">◀ Voltar</button>
                        <h2 className="font-display font-black text-sm text-cyberCyan">MÓDULO DE VISTORIA TÉCNICA</h2>
                    </div>
                    <div className="cyber-card p-5 rounded-3xl space-y-4">
                        <div>
                            <label className="block text-xs font-bold text-slate-300 mb-1">Setor / Órgão:</label>
                            <select value={setor} onChange={e => setSetor(e.target.value)} className="w-full bg-void/80 border border-cyberCyan/40 rounded-xl p-3 text-sm text-white">
                                {SETORES_OFICIAIS.map((s, i) => <option key={i} value={s}>{s}</option>)}
                            </select>
                        </div>
                        <div>
                            <label className="block text-xs font-bold text-slate-300 mb-1">Nível de Risco:</label>
                            <select value={nivelRisco} onChange={e => setNivelRisco(e.target.value)} className="w-full bg-void/80 border border-cyberCyan/40 rounded-xl p-3 text-sm text-white">
                                <option>🟢 Risco Baixo / Monitoramento</option>
                                <option>🟡 Risco Moderado / Atenção</option>
                                <option>🟠 Risco Alto / Alerta Vermelho</option>
                                <option>🔴 Risco Iminente / Evacuação Necessária</option>
                            </select>
                        </div>
                        <button onClick={() => showToast("✅ Vistoria registrada!")} className="w-full py-3 cyber-button font-extrabold rounded-xl text-xs uppercase">Salvar Vistoria</button>
                    </div>
                </div>
            );
        }

        function SarahNexusApp() {
            const [currentTab, setCurrentTab] = React.useState('home');
            const [showSplash, setShowSplash] = React.useState(true);
            const [isRadarOpen, setIsRadarOpen] = React.useState(false);
            const [toastMessage, setToastMessage] = React.useState(null);

            const showToast = (msg) => {
                setToastMessage(msg);
                setTimeout(() => setToastMessage(null), 3500);
            };

            return (
                <div className="min-h-screen flex flex-col relative">
                    {showSplash && <AppSplashScreen onFinish={() => setShowSplash(false)} />}
                    <NativeHydroWindRadar isOpen={isRadarOpen} onToggle={() => setIsRadarOpen(!isRadarOpen)} />

                    {toastMessage && (
                        <div className="fixed top-5 left-1/2 -translate-x-1/2 z-[250] bg-cyberCyan text-void px-5 py-3 rounded-2xl font-black text-xs shadow-xl">
                            {toastMessage}
                        </div>
                    )}

                    <header className="sticky top-0 z-40 w-full bg-deepSpace/90 backdrop-blur-xl border-b border-cyberCyan/30 px-4 py-3">
                        <div className="max-w-4xl mx-auto flex items-center justify-between">
                            <div className="flex items-center gap-3">
                                <CyberShieldIcon />
                                <span className="font-display font-black text-xs text-cyberCyan">SARAH AI NEXUS v8.4.2 PRO</span>
                            </div>
                        </div>
                    </header>

                    <main className="flex-1 max-w-4xl w-full mx-auto p-4 space-y-4 pb-24">
                        {currentTab === 'home' && (
                            <div className="space-y-4">
                                <div className="cyber-card p-6 rounded-3xl flex flex-col md:flex-row items-center gap-6 shadow-2xl">
                                    <SarahHologramAvatar isLarge={true} />
                                    <div className="flex-1 space-y-3 w-full text-center md:text-left">
                                        <div className="inline-block px-3 py-1 rounded-full bg-cyberGreen/10 border border-cyberGreen/30 text-cyberGreen font-mono text-[10px]">
                                            {getBrasiliaGreeting()}, Alexander! Operacional (RJ & Mesquita)
                                        </div>
                                        <h1 className="font-display font-black text-xl text-white">CENTRAL DE INTELIGÊNCIA COMUNITÁRIA</h1>
                                        
                                        {/* MANIFESTO OFICIAL EM DESTAQUE NA TELA INICIAL */}
                                        <div className="p-4 rounded-2xl bg-deepSpace/90 border-2 border-cyberCyan/60 space-y-2 text-left">
                                            <div className="font-display font-black text-xs text-cyberCyan uppercase">🛡️ MANIFESTO OFICIAL: ABRANGÊNCIA ESTADUAL (RJ) & MUNICIPAL (MESQUITA)</div>
                                            <p className="text-xs text-slate-300">
                                                Plataforma avançada de Defesa Civil Comunitária desenvolvida sob a liderança do <strong>Grupo A Chave da Esperança (GADE)</strong> e do <strong>Projeto Cidadão Sensor</strong>. Atuação integrada em todo o Estado do Rio de Janeiro e suporte direto em Mesquita.
                                            </p>
                                        </div>

                                        <div className="flex gap-3 pt-2 justify-center md:justify-start">
                                            <button onClick={() => setCurrentTab('vistoria')} className="px-5 py-2.5 cyber-button font-extrabold rounded-xl text-xs uppercase">📋 Nova Vistoria Técnica</button>
                                            <button onClick={() => setIsRadarOpen(true)} className="px-5 py-2.5 cyborg-btn-futuristic text-cyberCyan font-extrabold rounded-xl text-xs uppercase">🛰️ Abrir Radar</button>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        )}

                        {currentTab === 'vistoria' && (
                            <FieldReportModule onBackToDashboard={() => setCurrentTab('home')} showToast={showToast} />
                        )}
                    </main>

                    <footer className="w-full bg-deepSpace/95 border-t border-cyberCyan/30 overflow-hidden py-2.5 z-40 mt-auto">
                        <div className="flex whitespace-nowrap overflow-hidden">
                            <div className="flex animate-[tickerScroll_45s_linear_infinite] items-center gap-6 font-mono text-xs text-cyberCyan font-bold px-4">
                                <span>🛡️ Grupo A Chave da Esperança/GADE • Projeto Cidadão Sensor • Estado do Rio de Janeiro & Mesquita • Defesa Civil 199 • 🛡️</span>
                            </div>
                        </div>
                    </footer>
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<SarahNexusApp />);
    </script>
</body>
</html>
