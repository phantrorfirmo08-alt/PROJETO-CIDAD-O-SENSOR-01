function bloquearCalmaAlexander(texto) {
  return String(texto || "")
    .replace(/\bcalma,?\s+alexander\b/gi, "respira")
    .replace(/\bcalma,?\s+alexandre\b/gi, "respira")
    .replace(/\s{2,}/g, " ")
    .replace(/\s+([,.!?])/g, "$1")
    .trim();
}

function limparTextoParaFala(texto) {
  const semAlexander = bloquearCalmaAlexander(texto);
  return semAlexander
    .replace(/[*#_`]/g, '')
    .replace(/cerquilha/gi, '')
    .replace(/asterisco/gi, '')
    .replace(/([\u2700-\u27BF]|[\uE000-\uF8FF]|\uD83C[\uDC00-\uDFFF]|\uD83D[\uDC00-\uDFFF]|[\u2011-\u26FF]|\uD83E[\uDD00-\uDDFF])/g, '')
    .replace(/https?:\/\/\S+/g, "")
    .replace(/\s+/g, " ")
    .trim();
}

function norm(s) {
  return String(s || "").normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase().trim();
}

function winBytes(str) {
  const m = { 0x20AC: 0x80, 0x201A: 0x82, 0x0192: 0x83, 0x201E: 0x84, 0x2026: 0x85, 0x2020: 0x86, 0x2021: 0x87, 0x02C6: 0x88, 0x2030: 0x89, 0x0160: 0x8A, 0x2039: 0x8B, 0x0152: 0x8C, 0x017D: 0x8E, 0x2018: 0x91, 0x2019: 0x92, 0x201C: 0x93, 0x201D: 0x94, 0x2022: 0x95, 0x2013: 0x96, 0x2014: 0x97, 0x02DC: 0x98, 0x2122: 0x99, 0x0161: 0x9A, 0x203A: 0x9B, 0x0153: 0x9C, 0x017E: 0x9E, 0x0178: 0x9F };
  const o = [];
  for (let i = 0; i < str.length; i++) {
    const c = str.charCodeAt(i);
    if ((c >= 0x20 && c <= 0x7E) || (c >= 0xA0 && c <= 0xFF)) o.push(c);
    else if (m[c] !== undefined) o.push(m[c]);
    else if (c === 0x0A || c === 0x0D) o.push(c);
    else o.push(0x20);
  }
  return new Uint8Array(o);
}

function concat(a) {
  const t = a.reduce((x, y) => x + y.length, 0), r = new Uint8Array(t);
  let o = 0;
  for (const b of a) { r.set(b, o); o += b.length; }
  return r;
}

function b64ToBytes(d) {
  const b = d.split(",")[1] || "", bin = atob(b), r = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) r[i] = bin.charCodeAt(i);
  return r;
}

function avaliarRiscoMeteorologico(chuvaMm = 0, probChuva = 0, ventoKmh = 0, rajadaKmh = 0) {
  const ch = Number(chuvaMm) || 0;
  const pr = Number(probChuva) || 0;
  const vn = Math.max(Number(ventoKmh) || 0, Number(rajadaKmh) || 0);
  if (ch >= 15 || vn >= 65) {
    return { nivel: "R4 - EVACUAÇÃO / SEVERO", severidade: "CRÍTICO", acao: "Evacuação preventiva de áreas baixas/encostas, evitar travessia de lâmina d'água e acionar rota segura." };
  }
  if (ch >= 5 || pr >= 75 || vn >= 45) {
    return { nivel: "R3 - ALTO / ENXURRADA", severidade: "ALTO", acao: "Monitorar calhas, bueiros e encostas, preparar kit de emergência e acompanhar RainViewer e GOES-19." };
  }
  if (ch >= 1 || pr >= 45 || vn >= 30) {
    return { nivel: "R2 - MODERADO / ATENÇÃO", severidade: "MODERADO", acao: "Atenção a pancadas localizadas e rajadas de vento; manter monitoramento horário ativo." };
  }
  return { nivel: "R1 - BAIXO / PREVENTIVO", severidade: "ESTÁVEL", acao: "Condição atmosférica estável; manter rotina preventiva e zeladoria de drenagem." };
}

function escolherVozPtBr(perfilId) {
  const voices = carregarVozesDisponiveis();
  if (!voices || voices.length === 0) return null;
  const ptVoices = voices.filter(v => (v.lang || "").toLowerCase().includes("pt"));
  if (ptVoices.length === 0) return voices[0];
  const idx = PERFIS_VOZ_OFICIAIS.findIndex(p => p.id === perfilId);
  if (idx >= 0) return ptVoices[idx % ptVoices.length];
  return ptVoices.find(v => (v.name || "").toLowerCase().includes("google")) || ptVoices[0];
}

function escolherVozMasculinaPtBr() {
  const voices = carregarVozesDisponiveis();
  if (!voices || voices.length === 0) return null;
  const ptVoices = voices.filter(v => (v.lang || "").toLowerCase().includes("pt"));
  const pool = ptVoices.length > 0 ? ptVoices : voices;
  const termosMasc = ["male", "masculino", "daniel", "felipe", "ricardo", "antonio", "antônio", "rafael", "lucas", "bruno", "jorge", "paulo", "carlos", "pt-pt"];
  const achada = pool.find(v => {
    const n = `${v.name || ""} ${v.voiceURI || ""}`.toLowerCase();
    return termosMasc.some(t => n.includes(t));
  });
  return achada || pool[0];
}

function falarRoboMasculino(texto, onStart = null, onEnd = null) {
  try {
    if (localStorage.getItem("raru_sound_enabled") === "false") {
      if (onEnd) onEnd();
      return;
    }
  } catch (e) {}
  if (!("speechSynthesis" in window)) {
    if (onEnd) onEnd();
    return;
  }
  const textoLimpo = limparTextoParaFala(texto);
  if (!textoLimpo) {
    if (onEnd) onEnd();
    return;
  }

  try {
    window.speechSynthesis.cancel();
    const frases = textoLimpo.split(/(?<=[.!?])\s+/).filter(Boolean);
    const fila = frases.length > 0 ? frases : [textoLimpo];
    const vozMasc = escolherVozMasculinaPtBr();

    if (onStart) onStart();

    const falarSequencia = (index) => {
      if (index >= fila.length) {
        if (onEnd) onEnd();
        return;
      }
      try {
        if (localStorage.getItem("raru_sound_enabled") === "false") {
          if (onEnd) onEnd();
          return;
        }
      } catch (e) {}

      const u = new SpeechSynthesisUtterance(fila[index]);
      u.lang = "pt-BR";
      u.pitch = 0.68;
      u.rate = 0.96;
      u.volume = 1.0;
      if (vozMasc) u.voice = vozMasc;

      u.onend = () => {
        if (index + 1 < fila.length) setTimeout(() => falarSequencia(index + 1), 260);
        else if (onEnd) onEnd();
      };
      u.onerror = () => {
        if (index + 1 < fila.length) setTimeout(() => falarSequencia(index + 1), 260);
        else if (onEnd) onEnd();
      };
      window.speechSynthesis.speak(u);
    };

    falarSequencia(0);
  } catch (e) {
    if (onEnd) onEnd();
  }
}

function falarImitada(texto, perfilId = 'sarah') {
  try {
    if (localStorage.getItem("raru_sound_enabled") === "false") return;
  } catch (e) {}
  if (!("speechSynthesis" in window)) return;
  const textoLimpo = limparTextoParaFala(texto);
  if (!textoLimpo) return;

  const perfilSalvo = (() => {
    try { return localStorage.getItem("raru_perfil_voz") || perfilId || 'sarah'; }
    catch (e) { return perfilId || 'sarah'; }
  })();
  const perfil = PERFIS_VOZ_OFICIAIS.find(p => p.id === perfilSalvo) || PERFIS_VOZ_OFICIAIS[0];

  try {
    window.speechSynthesis.cancel();
    const textoImitado = limparTextoParaFala(perfil.transform(textoLimpo));
    const frases = textoImitado.split(/(?<=[.!?])\s+/).filter(Boolean);
    const fila = frases.length > 0 ? frases : [textoImitado];
    const vozEscolhida = escolherVozPtBr(perfil.id);

    const falarSequencia = (index) => {
      if (index >= fila.length) return;
      try {
        if (localStorage.getItem("raru_sound_enabled") === "false") return;
      } catch (e) {}

      const u = new SpeechSynthesisUtterance(fila[index]);
      u.lang = "pt-BR";
      const osc = (Math.random() - 0.5) * perfil.variacao;
      u.pitch = Math.max(0.5, Math.min(2.0, perfil.pitch + osc));
      u.rate = Math.max(0.5, Math.min(2.0, perfil.rate));
      u.volume = Math.max(0, Math.min(1, perfil.volume));
      if (vozEscolhida) u.voice = vozEscolhida;

      u.onend = () => {
        if (index + 1 < fila.length) setTimeout(() => falarSequencia(index + 1), perfil.pausaFrase);
      };
      u.onerror = () => {
        if (index + 1 < fila.length) setTimeout(() => falarSequencia(index + 1), perfil.pausaFrase);
      };
      window.speechSynthesis.speak(u);
    };

    falarSequencia(0);
  } catch (e) {}
}

function falarSarah(texto, vozIndex = 0) {
  let perfilId = 'sarah';
  try {
    const salvo = localStorage.getItem("raru_perfil_voz");
    if (salvo && PERFIS_VOZ_OFICIAIS.some(p => p.id === salvo)) perfilId = salvo;
    else if (typeof vozIndex === "string" && PERFIS_VOZ_OFICIAIS.some(p => p.id === vozIndex)) perfilId = vozIndex;
    else if (typeof vozIndex === "number" && PERFIS_VOZ_OFICIAIS[vozIndex]) perfilId = PERFIS_VOZ_OFICIAIS[vozIndex].id;
  } catch (e) {}
  falarImitada(texto, perfilId);
}

async function chamarSarah(tipo, mensagensHistorico, municipioAtual, bairroAtual, abaAtual, dadosClimaContexto, userName = "") {
  const horaBrasilia = Number(new Intl.DateTimeFormat('pt-BR', {
    timeZone: 'America/Sao_Paulo',
    hour: 'numeric',
    hour12: false
  }).format(new Date()));

  const saudacaoCerta = horaBrasilia < 12 ? "Bom dia" : horaBrasilia < 18 ? "Boa tarde" : "Boa noite";
  const horaFormatada = new Intl.DateTimeFormat('pt-BR', {
    timeZone: 'America/Sao_Paulo',
    hour: '2-digit',
    minute: '2-digit'
  }).format(new Date());

  const nomePessoa = userName && userName.trim() ? userName.trim() : "";
  const estadoModulos = coletarEstadoGlobalModulos(abaAtual, municipioAtual, bairroAtual, nomePessoa);

  const instrucaoSaudacaoUnica = globalSaudacaoEmitida
    ? "A saudação inicial já foi feita. Nunca repita saudações ou aberturas prontas. Vá direto ao ponto com naturalidade."
    : `Use '${saudacaoCerta}' de forma leve no início desta conversa, sem repetir nas próximas respostas.`;

  const baseSarah = montarPersonalidadeSarah(bairroAtual || 'Rocha Sobrinho', municipioAtual || 'Mesquita', nomePessoa, estadoModulos, dadosClimaContexto) + `
[CONTEXTO TÁTICO ATUAL]
Sistema: ROBOT SARAH SYSTEM RARU • ${TITULO_OFICIAL_RARU} (${SUBTITULO_OFICIAL_RARU} • ${COMPLEMENTO_OFICIAL_RARU})
Pessoa na conversa: ${nomePessoa || 'Ainda não informou o nome'}
Município: ${municipioAtual || 'Mesquita'}
Bairro/Setor: ${bairroAtual || 'Rocha Sobrinho'}
Aba Ativa: ${abaAtual || 'Dashboard Principal'}
Hora Oficial: ${horaFormatada}
${instrucaoSaudacaoUnica}`;

  try {
    const response = await fetch(SARAH_PROXY_URL, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        model: "openai/gpt-oss-120b",
        messages: [{ role: "system", content: baseSarah }, ...mensagensHistorico],
        temperature: 0.72,
        max_tokens: 550
      })
    });
    const data = await response.json();
    if (!data.error) {
      const msg = data?.choices?.[0]?.message;
      let texto = msg?.content || msg?.reasoning_content;
      if (texto && texto.trim().length > 0) {
        globalSaudacaoEmitida = true;
        return limparTextoParaFala(texto).trim();
      }
    }
  } catch (e) {}

  try {
    const ultimaMensagem = mensagensHistorico[mensagensHistorico.length - 1]?.content || "Olá";
    const promptCompleto = baseSarah + "\n\nMensagem em " + (municipioAtual || 'Mesquita') + ": " + ultimaMensagem;
    const aiRes = await fetch("https://text.pollinations.ai/" + encodeURIComponent(promptCompleto));
    if (aiRes.ok) {
      let t = await aiRes.text();
      if (t && t.trim().length > 0) {
        globalSaudacaoEmitida = true;
        return limparTextoParaFala(t).trim();
      }
    }
  } catch (e) {}

  globalSaudacaoEmitida = true;
  const atualM = ESTADO_CLIMA_AUTOMATICO_92.municipios[municipioAtual || 'Mesquita'];
  const resumoClimaLocal = atualM
    ? `Em ${municipioAtual || 'Mesquita'}, ${atualM.temp}, chuva ${atualM.chuva}, prob. chuva ${atualM.probChuva}, vento ${atualM.vento}, rajada ${atualM.rajada}, umidade ${atualM.umi}, nível ${atualM.risco}.`
    : `Monitoramento 24h ativo em ${municipioAtual || 'Mesquita'} com GOES-19 e RainViewer.`;
  if (nomePessoa) {
    return `${resumoClimaLocal} Como posso te apoiar agora, ${nomePessoa}?`;
  }
  return `${resumoClimaLocal} Qual é o seu nome e o que você precisa analisar?`;
}

async function gerarArquivoIconeEscudo() {
  return new Promise((resolve) => {
    const canvas = document.createElement('canvas');
    canvas.width = 512;
    canvas.height = 512;
    const ctx = canvas.getContext('2d');

    const bgGrad = ctx.createRadialGradient(256, 256, 30, 256, 256, 320);
    bgGrad.addColorStop(0, '#0A2547');
    bgGrad.addColorStop(0.6, '#041125');
    bgGrad.addColorStop(1, '#02040A');
    ctx.fillStyle = bgGrad;
    ctx.fillRect(0, 0, 512, 512);

    ctx.save();
    ctx.shadowColor = '#00F2FE';
    ctx.shadowBlur = 25;
    ctx.beginPath();
    ctx.moveTo(256, 65);
    ctx.lineTo(410, 130);
    ctx.lineTo(410, 265);
    ctx.quadraticCurveTo(410, 385, 256, 435);
    ctx.quadraticCurveTo(102, 385, 102, 265);
    ctx.lineTo(102, 130);
    ctx.closePath();

    const shieldFill = ctx.createLinearGradient(102, 65, 410, 435);
    shieldFill.addColorStop(0, 'rgba(0, 242, 254, 0.22)');
    shieldFill.addColorStop(1, 'rgba(4, 17, 37, 0.94)');
    ctx.fillStyle = shieldFill;
    ctx.fill();
    ctx.lineWidth = 7;
    ctx.strokeStyle = '#00F2FE';
    ctx.stroke();
    ctx.restore();

    ctx.fillStyle = '#00FF9D';
    ctx.font = '900 18px Orbitron, sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('EDIÇÃO TEMPO & CLIMA', 256, 198);

    ctx.fillStyle = '#FFFFFF';
    ctx.font = '900 28px Orbitron, sans-serif';
    ctx.fillText('RARU NEXUS', 256, 256);

    ctx.fillStyle = '#00F2FE';
    ctx.font = '800 17px JetBrains Mono, monospace';
    ctx.fillText('V11.2 PLUS • RJ', 256, 288);

    ctx.fillStyle = '#38BDF8';
    ctx.font = '700 15px JetBrains Mono, monospace';
    ctx.fillText('CIDADÃO SENSOR • MESQUITA RJ', 256, 478);

    canvas.toBlob((blob) => {
      if (blob) resolve(new File([blob], 'ESCUDO_RARU_NEXUS_V11_2_PLUS.png', { type: 'image/png' }));
      else resolve(null);
    }, 'image/png');
  });
}

async function compartilharEscudoComTextoUnico(showToast) {
  const textoLimpo = shareMessageText.trim();
  const escudoFile = await gerarArquivoIconeEscudo();

  try {
    if (escudoFile && navigator.canShare && navigator.canShare({ files: [escudoFile] })) {
      await navigator.share({
        title: `${TITULO_OFICIAL_RARU} — ${SUBTITULO_OFICIAL_RARU}`,
        text: textoLimpo,
        files: [escudoFile]
      });
      if (showToast) showToast("Ícone do escudo + texto com link único compartilhados.");
      return;
    }
  } catch (e) {
    if (e && e.name === 'AbortError') return;
  }

  if (escudoFile) {
    try {
      const urlImg = URL.createObjectURL(escudoFile);
      const a = document.createElement('a');
      a.href = urlImg;
      a.download = escudoFile.name;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      setTimeout(() => URL.revokeObjectURL(urlImg), 3000);
    } catch (e) {}
  }

  try {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      await navigator.clipboard.writeText(textoLimpo);
    }
  } catch (e) {}

  if (showToast) showToast("Ícone do escudo baixado + texto com link único copiado.");
}

async function sincronizarTelemetria92RJ(onComplete = null) {
  try {
    const lats = MUNICIPIOS_92.map(c => c.lat).join(',');
    const lons = MUNICIPIOS_92.map(c => c.lon).join(',');
    const urlClima = `https://api.open-meteo.com/v1/forecast?latitude=${lats}&longitude=${lons}&current=temperature_2m,relative_humidity_2m,precipitation,wind_speed_10m,wind_gusts_10m,surface_pressure&hourly=temperature_2m,precipitation_probability,wind_speed_10m&timezone=America%2FSao_Paulo&forecast_days=1`;

    const [resClima, resRadar] = await Promise.allSettled([
      fetch(urlClima).then(r => r.json()),
      fetch("https://api.rainviewer.com/public/weather-maps.json").then(r => r.json())
    ]);

    if (resRadar.status === "fulfilled" && resRadar.value) {
      const rvData = resRadar.value;
      const past = rvData?.radar?.past || [];
      const nowcast = rvData?.radar?.nowcast || [];
      ESTADO_CLIMA_AUTOMATICO_92.rainviewerHost = rvData.host || "https://tilecache.rainviewer.com";
      ESTADO_CLIMA_AUTOMATICO_92.rainviewerFrames = [...past, ...nowcast];
    }

    if (resClima.status === "fulfilled" && resClima.value) {
      const arr = Array.isArray(resClima.value) ? resClima.value : [resClima.value];
      const hora = new Date().getHours();
      const mapa = {};
      const listaResumo = [];

      arr.forEach((item, i) => {
        const c = MUNICIPIOS_92[i];
        if (!c || !item?.current) return;
        const tempNum = item.current.temperature_2m;
        const chuvaNum = item.current.precipitation ?? 0;
        const probNum = item.hourly?.precipitation_probability?.[hora] ?? 0;
        const ventoNum = item.current.wind_speed_10m ?? 0;
        const rajadaNum = item.current.wind_gusts_10m ?? ventoNum;
        const umiNum = item.current.relative_humidity_2m ?? "--";
        const pressaoNum = item.current.surface_pressure ?? "--";
        const riscoObj = avaliarRiscoMeteorologico(chuvaNum, probNum, ventoNum, rajadaNum);

        const registro = {
          nome: c.n,
          temp: `${tempNum}°C`,
          tempNum,
          umi: `${umiNum}%`,
          chuva: `${chuvaNum} mm`,
          chuvaNum,
          probChuva: `${probNum}%`,
          probNum,
          vento: `${ventoNum} km/h`,
          ventoNum,
          rajada: `${rajadaNum} km/h`,
          rajadaNum,
          pressao: pressaoNum,
          risco: riscoObj.nivel,
          severidade: riscoObj.severidade,
          riscoObj,
          condicao: riscoObj.severidade === "CRÍTICO" ? "ALERTA SEVERO" : riscoObj.severidade === "ALTO" ? "ALERTA ALTO" : riscoObj.severidade === "MODERADO" ? "ATENÇÃO" : "ESTÁVEL",
          hourly: item.hourly
        };

        mapa[c.n] = registro;
        listaResumo.push(registro);
      });

      listaResumo.sort((a, b) => (b.chuvaNum * 10 + b.probNum) - (a.chuvaNum * 10 + a.probNum));
      ESTADO_CLIMA_AUTOMATICO_92.municipios = mapa;
      ESTADO_CLIMA_AUTOMATICO_92.resumoCriticoRJ = listaResumo;
      ESTADO_CLIMA_AUTOMATICO_92.atualizadoEm = new Date().toLocaleTimeString("pt-BR", { timeZone: "America/Sao_Paulo" });
      ESTADO_CLIMA_AUTOMATICO_92.statusRede = "92 MUNICÍPIOS + GOES-19 + RAINVIEWER ONLINE";
    }
  } catch (e) {
    ESTADO_CLIMA_AUTOMATICO_92.statusRede = "MODO RESILIÊNCIA / CACHE ATIVO";
  }
  if (onComplete) onComplete(ESTADO_CLIMA_AUTOMATICO_92);
}

function RaruRoboTelemetriaNoLugarDoMapa({ municipioSelecionado, onSelecionarMunicipio, onNavegarModulo, abaAtual, showToast, openSarahChat, userName, onAtualizarNome }) {
  const [camada, setCamada] = useState('vento');
  const [alertaAtivo, setAlertaAtivo] = useState(false);
  const [roboFalando, setRoboFalando] = useState(false);
  const [roboPensando, setRoboPensando] = useState(false);
  const [roboInput, setRoboInput] = useState('');
  const [roboChatMsgs, setRoboChatMsgs] = useState(() => [{
    remetente: 'robo',
    texto: userName
      ? `ROBOT SARAH SYSTEM RARU em ${TITULO_OFICIAL_RARU} — ${SUBTITULO_OFICIAL_RARU} (${COMPLEMENTO_OFICIAL_RARU}, 92 municípios RJ, GOES-19 e RainViewer). Como posso te apoiar agora, ${userName}?`
      : `ROBOT SARAH SYSTEM RARU em ${TITULO_OFICIAL_RARU} — ${SUBTITULO_OFICIAL_RARU} (${COMPLEMENTO_OFICIAL_RARU}, 92 municípios RJ, GOES-19 e RainViewer). Qual é o seu nome e o que você quer consultar?`
  }]);
  const [telemetria, setTelemetria] = useState({
    temp: '--',
    vento: '--',
    chuva: '--',
    probChuva: '--',
    umi: '--',
    risco: 'R1 - BAIXO / PREVENTIVO',
    condicao: 'Sincronizando...'
  });
  const [roboStatus, setRoboStatus] = useState(`ROBOT SARAH SYSTEM RARU • ${municipioSelecionado.n.toUpperCase()}`);
  const [roboMsg, setRoboMsg] = useState(`Motor urbano e climático 24h acoplado ao nó ${municipioSelecionado.n} (IP ${municipioSelecionado.ip}) com leitura de 92 municípios RJ, GOES-19 e RainViewer.`);

  useEffect(() => {
    const aplicarSnapshot = () => {
      const m = ESTADO_CLIMA_AUTOMATICO_92.municipios[municipioSelecionado?.n];
      if (m) {
        const emAlerta = m.severidade === "ALTO" || m.severidade === "CRÍTICO";
        setAlertaAtivo(emAlerta);
        setTelemetria({
          temp: m.temp,
          vento: m.vento,
          chuva: m.chuva,
          probChuva: m.probChuva,
          umi: m.umi,
          risco: m.risco,
          condicao: m.condicao
        });
      }
    };
    aplicarSnapshot();
    sincronizarTelemetria92RJ(aplicarSnapshot);
  }, [municipioSelecionado]);

  const falarTelemetriaMasculina = (falaTexto) => {
    falarRoboMasculino(
      falaTexto,
      () => setRoboFalando(true),
      () => setRoboFalando(false)
    );
  };

  const acionarLevantamento = () => {
    const rvCount = ESTADO_CLIMA_AUTOMATICO_92.rainviewerFrames.length;
    const resumo = `Boletim do ROBOT SARAH SYSTEM RARU, ${TITULO_OFICIAL_RARU}, Edição Tempo e Clima, Rede Automatizada de Resiliência Urbana, em ${municipioSelecionado.n}, estação IP ${municipioSelecionado.ip}: temperatura ${telemetria.temp}, umidade ${telemetria.umi}, vento ${telemetria.vento}, chuva ${telemetria.chuva}, probabilidade de chuva ${telemetria.probChuva}. Classificação ${telemetria.risco}. Satélite GOES-19 e radar RainViewer com ${rvCount} quadros ativos nos 92 municípios do Rio de Janeiro.`;
    setRoboStatus(`ROBOT SARAH SYSTEM RARU • ${municipioSelecionado.n.toUpperCase()}`);
    setRoboMsg(resumo);
    falarTelemetriaMasculina(resumo);
    if (showToast) showToast(`Boletim de ${municipioSelecionado.n} emitido.`);
  };

  const responderComandoLocalModulos = (textoLimpo, nomeAtivo) => {
    const t = textoLimpo.toLowerCase();
    const estado = coletarEstadoGlobalModulos(abaAtual, municipioSelecionado.n, 'Rocha Sobrinho', nomeAtivo);
    if (t.includes('radar') || t.includes('goes') || t.includes('rainviewer')) {
      if (onNavegarModulo) onNavegarModulo('radar');
      return `Abri o Radar Meteorológico (GOES-19, RainViewer e 92 municípios RJ)${nomeAtivo ? ', ' + nomeAtivo : ''}. Em ${municipioSelecionado.n}: ${telemetria.temp}, chuva ${telemetria.chuva} (prob. ${telemetria.probChuva}), vento ${telemetria.vento}, ${telemetria.risco}.`;
    }
    if (t.includes('vistoria') || t.includes('sirene') || t.includes('foto')) {
      if (onNavegarModulo) onNavegarModulo('vistoria');
      return `Abri a Vistoria Comunitária e Sirenes para registro georreferenciado com hash SHA-256 e alertas preventivos.`;
    }
    if (t.includes('balan') || t.includes('recicl') || t.includes('esg')) {
      if (onNavegarModulo) onNavegarModulo('balanca');
      return `Abri a Balança e ESG do Cidadão Sensor para pesagem e impacto em drenagem.`;
    }
    if (t.includes('alquino') || t.includes('hardware') || t.includes('sensor')) {
      if (onNavegarModulo) onNavegarModulo('alquino');
      return `Abri a Rede Alquino de Hardware Físico para acoplamento IP de sensores locais.`;
    }
    if (t.includes('rota') || t.includes('abrigo') || t.includes('sos') || t.includes('kit')) {
      return `Sistema com ${estado.rotasDeFugaAtivas} rotas de fuga ativas, ${estado.monitoresCadeAtivos} monitores e ${estado.registrosZeladoria} registros de zeladoria. Acesse Estação GADE para SOS e Kit de Sobrevivência.`;
    }
    return null;
  };

  const enviarMensagemRobo = async (e) => {
    if (e) e.preventDefault();
    const texto = roboInput.trim();
    if (!texto || roboPensando) return;
    setRoboInput('');

    let nomeAtivo = userName;
    const matchNome = texto.match(/(?:meu nome [ée]|me chamo|pode me chamar de|sou o|sou a)\s+([a-zà-ú]+)/i);
    if (matchNome && matchNome[1]) {
      nomeAtivo = matchNome[1].charAt(0).toUpperCase() + matchNome[1].slice(1).toLowerCase();
      if (onAtualizarNome) onAtualizarNome(nomeAtivo);
    }

    const historicoAtual = [...roboChatMsgs, { remetente: 'usuario', texto }];

      setRoboChatMsgs(prev => [...prev, { remetente: 'robo', texto: respostaLocal }]);

      falarTelemetriaMasculina(respostaLocal);

function PainelRotasEstacaoPublica() {
  const [rotas, setRotas] = useState([]);

  useEffect(() => {
    const carregarRotas = () => {
      try {
        const r = JSON.parse(localStorage.getItem('rotasFugaReais') || '[]');
        setRotas(r);
      } catch (e) { setRotas([]); }
    };
    carregarRotas();
    window.addEventListener('storage', carregarRotas);
    const interval = setInterval(carregarRotas, 2500);
    return () => {
      window.removeEventListener('storage', carregarRotas);
      clearInterval(interval);
    };
  }, []);

  const etiquetaPorTipo = {
    'Ponto de Encontro': 'PONTO DE ENCONTRO',
    'Casa de Morador': 'CASA DE MORADOR',

          {rotas.length} {rotas.length === 1 ? 'ATIVO' : 'ATIVOS'}

              <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: '4px' }}>

function CadeAdminModule({ showToast }) {
  const MUNICIPIOS = MUNICIPIOS_92.map(m => m.n);
  const [abaAtiva, setAbaAtiva] = useState('rota');
  const [rotas, setRotas] = useState(() => {
    try { return JSON.parse(localStorage.getItem('rotasFugaReais') || '[]'); } catch (e) { return []; }
  });
  const [rNome, setRNome] = useState('');
  const [rEnd, setREnd] = useState('');
  const [rInfo, setRInfo] = useState('');
  const [rTipo, setRTipo] = useState('Ponto de Encontro');

  const [monitores, setMonitores] = useState(() => {
    try { return JSON.parse(localStorage.getItem('monitoresCADE') || '[]'); } catch (e) { return []; }
  });
  const [bloqueados, setBloqueados] = useState(() => {
    try { return JSON.parse(localStorage.getItem('monitoresBloqueadosCADE') || '[]'); } catch (e) { return []; }
  });
  const [mNome, setMNome] = useState('');
  const [mZap, setMZap] = useState('');
  const [mSenha, setMSenha] = useState('');
  const [mMun, setMMun] = useState('');
  const [mBairro, setMBairro] = useState('');
  const [mFuncao, setMFuncao] = useState('Monitor do Tempo');
  const [mObs, setMObs] = useState('');
  const [filtroMon, setFiltroMon] = useState('');

  const salvarRota = () => {
    if (!rNome.trim() || !rEnd.trim()) { showToast('Escreve o nome e o endereço.'); return; }
    const atualizadas = [...rotas, { nome: rNome.trim(), endereco: rEnd.trim(), info: rInfo.trim(), tipo: rTipo }];
    setRotas(atualizadas);
    try { localStorage.setItem('rotasFugaReais', JSON.stringify(atualizadas)); } catch (e) {}
    setRNome(''); setREnd(''); setRInfo('');
    showToast('Rota salva e publicada na Estação.');
  };

  const excluirRota = (i) => {
    if (!confirm('Excluir essa rota?')) return;
    const atualizadas = [...rotas];
    atualizadas.splice(i, 1);
    setRotas(atualizadas);
    try { localStorage.setItem('rotasFugaReais', JSON.stringify(atualizadas)); } catch (e) {}
  };

  const cadastrarMonitor = () => {
    if (!mNome.trim() || !mMun || !mBairro.trim() || !mSenha.trim()) { showToast('Preencha nome, município, bairro e crie a senha.'); return; }
    let c = parseInt(localStorage.getItem('contadorMonitorCADE') || '0', 10) + 1;
    try { localStorage.setItem('contadorMonitorCADE', String(c)); } catch (e) {}
    const idGerado = 'GADE-M-' + String(c).padStart(3, '0');
    const novoM = { id: idGerado, nome: mNome.trim(), zap: mZap.trim(), senha: mSenha.trim(), municipio: mMun, bairro: mBairro.trim(), funcao: mFuncao, obs: mObs.trim(), data: new Date().toLocaleString('pt-BR') };
    const atualizados = [...monitores, novoM];
    setMonitores(atualizados);
    try { localStorage.setItem('monitoresCADE', JSON.stringify(atualizados)); } catch (e) {}
    setMNome(''); setMZap(''); setMSenha(''); setMBairro(''); setMObs('');
    showToast(`Monitor cadastrado: ${idGerado}`);
  };

  const bloquearMonitor = (idx) => {
    const x = monitores[idx];
    const motivo = prompt(`Excluindo ${x.nome} - ${x.id}\nMotivo? Ex: mau uso`);
    if (motivo === null) return;
    if (!confirm(`CONFIRMAR BLOQUEIO?\n\n${x.id} - ${x.nome}`)) return;
    const l = [...monitores]; l.splice(idx, 1);
    setMonitores(l); try { localStorage.setItem('monitoresCADE', JSON.stringify(l)); } catch (e) {}
    const bb = [...bloqueados, { ...x, motivo: motivo || 'Sem motivo', dataBloqueio: new Date().toLocaleString('pt-BR') }];
    setBloqueados(bb); try { localStorage.setItem('monitoresBloqueadosCADE', JSON.stringify(bb)); } catch (e) {}
    showToast(`Monitor ${x.id} bloqueado.`);
  };

  const desbloquearMonitor = (idx) => {
    const x = bloqueados[idx];
    if (!confirm(`Desbloquear ${x.id} - ${x.nome}?`)) return;
    const bb = [...bloqueados]; bb.splice(idx, 1);
    setBloqueados(bb); try { localStorage.setItem('monitoresBloqueadosCADE', JSON.stringify(bb)); } catch (e) {}
    const l = [...monitores, { id: x.id, nome: x.nome, zap: x.zap, senha: x.senha, municipio: x.municipio, bairro: x.bairro, funcao: x.funcao, obs: x.obs, data: x.data }];
    setMonitores(l); try { localStorage.setItem('monitoresCADE', JSON.stringify(l)); } catch (e) {}
    showToast(`Monitor ${x.id} desbloqueado.`);
  };

  const exportarMonitoresGrupo = () => {
    if (!monitores.length) { showToast('Nenhum monitor ativo.'); return; }
    const msg = `MONITORES GADE - ${monitores.length} ativos\n\n` + monitores.map(x => `${x.id} - ${x.nome} - ${x.funcao}\nLocal: ${x.municipio} - ${x.bairro}\nZap: ${x.zap || ''}`).join('\n\n') + `\n\nProjeto: GADE - Grupo A Chave da Esperança • ${TITULO_OFICIAL_RARU}`;
    if (navigator.clipboard) navigator.clipboard.writeText(msg).catch(() => {});
    showToast('Lista copiada sem senha. Abrindo WhatsApp.');
    window.open('https://chat.whatsapp.com/D1wrk9nTBH57Wya2Uv44ZW', '_blank');
  };

  const monitoresFiltrados = monitores.filter(x => (x.id + ' ' + x.nome + ' ' + x.municipio + ' ' + x.bairro).toLowerCase().includes(filtroMon.toLowerCase()));

  return (
    <div id="cadeAdmin" style={{ background: '#021a2a', border: '1px solid #00e5ff', borderRadius: '16px', padding: '14px', fontFamily: 'sans-serif' }}>
      <b style={{ color: '#00e5ff', fontSize: '16px' }}>ÁREA RESTRITA - GADE</b>
      <div style={{ color: '#fff', fontSize: '12px', opacity: .8 }}>GADE - Grupo A Chave da Esperança / {TITULO_OFICIAL_RARU}</div>
      <div style={{ display: 'flex', gap: '8px', marginTop: '12px' }}>
        <button type="button" onClick={() => setAbaAtiva('rota')} style={{ flex: 1, background: abaAtiva === 'rota' ? '#00e5ff' : '#041e2e', color: abaAtiva === 'rota' ? '#000' : '#fff', fontWeight: 'bold', border: 'none', padding: '12px', borderRadius: '10px', cursor: 'pointer' }}>ROTAS DE FUGA</button>
        <button type="button" onClick={() => setAbaAtiva('monitor')} style={{ flex: 1, background: abaAtiva === 'monitor' ? '#00ff88' : '#041e2e', color: abaAtiva === 'monitor' ? '#000' : '#fff', fontWeight: 'bold', border: '1px solid #00e5ff', padding: '12px', borderRadius: '10px', cursor: 'pointer' }}>MONITORES</button>
      </div>
      {abaAtiva === 'rota' ? (
        <div id="painelRota">
          <input value={rNome} onChange={e => setRNome(e.target.value)} placeholder="Nome do local" style={{ width: '100%', padding: '12px', marginTop: '12px', borderRadius: '10px', border: 'none', boxSizing: 'border-box', color: '#000' }} />
          <input value={rEnd} onChange={e => setREnd(e.target.value)} placeholder="Endereço completo" style={{ width: '100%', padding: '12px', marginTop: '8px', borderRadius: '10px', border: 'none', boxSizing: 'border-box', color: '#000' }} />
          <input value={rInfo} onChange={e => setRInfo(e.target.value)} placeholder="Informações" style={{ width: '100%', padding: '12px', marginTop: '8px', borderRadius: '10px', border: 'none', boxSizing: 'border-box', color: '#000' }} />
          <select value={rTipo} onChange={e => setRTipo(e.target.value)} style={{ width: '100%', padding: '12px', marginTop: '8px', borderRadius: '10px', color: '#000' }}>
            <option>Ponto de Encontro</option>
            <option>Casa de Morador</option>
            <option>Igreja</option>
            <option>Escola / CRAS / Clínica</option>
            <option>Ponto Alto Seguro</option>
          </select>
          <button type="button" onClick={salvarRota} style={{ width: '100%', background: '#00e5ff', color: '#000', fontWeight: 'bold', border: 'none', padding: '14px', borderRadius: '10px', marginTop: '12px', cursor: 'pointer' }}>SALVAR E PUBLICAR NA ESTAÇÃO</button>
          <div id="listaRotasAdmin" style={{ marginTop: '12px' }}>
            {rotas.length === 0 ? (
              <div style={{ color: '#fff', opacity: .7, fontSize: '13px' }}>Nenhuma rota cadastrada ainda.</div>
            ) : (
              rotas.map((x, i) => (
                <div key={i} style={{ background: '#041e2e', padding: '10px', borderRadius: '10px', marginTop: '8px', color: '#fff', fontSize: '13px' }}>
                  <b>{x.tipo} - {x.nome}</b><br />{x.endereco}<br />{x.info || ''}<br />
                  <button type="button" onClick={() => excluirRota(i)} style={{ background: '#ff3b30', color: '#fff', border: 'none', padding: '6px 10px', borderRadius: '8px', marginTop: '6px', cursor: 'pointer', fontWeight: 'bold' }}>Excluir Rota</button>
                </div>
              ))
            )}
          </div>
        </div>
      ) : (
        <div id="painelMonitor">
          <div style={{ background: '#041e2e', borderRadius: '10px', padding: '10px', marginTop: '12px', color: '#fff', fontSize: '13px' }}>
            Ativos: <b style={{ color: '#00e5ff' }}>{monitores.length}</b> | Municípios: <b style={{ color: '#00ff88' }}>{new Set(monitores.map(x => x.municipio)).size}</b> / 92 | Bloqueados: <b style={{ color: '#ff3b30' }}>{bloqueados.length}</b>
          </div>
          <input value={mNome} onChange={e => setMNome(e.target.value)} placeholder="Nome completo do monitor" style={{ width: '100%', padding: '11px', borderRadius: '10px', border: 'none', boxSizing: 'border-box', marginTop: '10px', color: '#000' }} />
          <input value={mZap} onChange={e => setMZap(e.target.value)} placeholder="WhatsApp" style={{ width: '100%', padding: '11px', borderRadius: '10px', border: 'none', boxSizing: 'border-box', marginTop: '8px', color: '#000' }} />

function AdminVaultModule({ showToast, onClose, localVideos, setLocalVideos, onSelecionarPerfilVoz, perfilVozId, customTickerText, setCustomTickerText }) {
  const [pinInput, setPinInput] = useState("");
  const [isUnlocked, setIsUnlocked] = useState(false);
  const [adminSubTab, setAdminSubTab] = useState('cade');
  const [tickerInput, setTickerInput] = useState(customTickerText);

  const handleUnlock = (e) => {
    e.preventDefault();
    if (pinInput === "303500") { setIsUnlocked(true); showToast("Acesso Restrito Autorizado."); } else { showToast("PIN Incorreto."); }
  };

  const salvarTicker = (e) => {
    e.preventDefault();
    setCustomTickerText(tickerInput);
    try { localStorage.setItem('raru_custom_ticker', tickerInput); } catch (e) {}
    showToast("Faixa marquee atualizada com sucesso.");
  };

  const handleUploadGaleriaDireto = (e) => {
    const file = e.target.files[0];
    if (!file || !file.type.startsWith('video/')) { showToast("Selecione um vídeo válido."); return; }
    const reader = new FileReader();
    reader.onload = (uploadEvent) => {
      const novoItem = { id: Date.now(), title: file.name, url: uploadEvent.target.result, type: 'local' };
      const atualizados = [novoItem, ...localVideos];
      setLocalVideos(atualizados);
      try { localStorage.setItem('raru_local_videos', JSON.stringify(atualizados)); } catch (e) {}
      showToast("Vídeo salvo no LocalStorage.");
    };
    reader.readAsDataURL(file);
  };

  return (
    <div className="space-y-4 w-full font-mono max-w-5xl mx-auto">
      <div className="cyber-card p-4 shadow-xl space-y-4 border border-cyberCyan/40">
        <div className="flex items-center justify-between border-b border-cyberCyan/25 pb-2.5">
          <h2 className="font-display text-xs font-black text-cyberCyan tracking-widest">ÁREA RESTRITA (ADMIN VAULT)</h2>
          <button type="button" onClick={onClose} className="cyber-button-danger text-xs py-1 px-3 !min-h-[32px]">FECHAR</button>
        </div>

        {!isUnlocked ? (
          <form onSubmit={handleUnlock} className="flex gap-2">
            <input type="password" maxLength="6" value={pinInput} onChange={(e) => setPinInput(e.target.value)} placeholder="PIN (303500)" className="flex-1 bg-void border border-cyberCyan/40 rounded-xl px-3 py-2.5 text-center text-slate-100 font-mono tracking-widest text-xs shadow-inner" />
            <button type="submit" className="cyber-button text-xs py-2.5 px-4">ACESSAR</button>
          </form>
        ) : (
          <div className="space-y-4">
            <div className="flex gap-2 overflow-x-auto pb-2 border-b border-cyberCyan/30">
              <button type="button" onClick={() => setAdminSubTab('cade')} className={`cyber-button text-xs py-2 px-3 ${adminSubTab === 'cade' ? '!bg-cyan-400 !text-void' : ''}`}>PAINEL GADE / CADE</button>
              <button type="button" onClick={() => setAdminSubTab('sistema')} className={`cyber-button text-xs py-2 px-3 ${adminSubTab === 'sistema' ? '!bg-cyberCyan !text-void' : ''}`}>CONFIGURAÇÕES &amp; VOZES</button>
            </div>

            {adminSubTab === 'cade' && <CadeAdminModule showToast={showToast} />}

            {adminSubTab === 'sistema' && (
              <div className="space-y-5">
                <SeletorVozGlobal perfilVozId={perfilVozId} setPerfilVozId={onSelecionarPerfilVoz} />

                <div className="bg-void/90 border border-cyberCyan/50 rounded-xl p-3.5 space-y-2.5">
                  <span className="text-white font-black text-xs font-display block">TEXTO DA FAIXA MARQUEE (LETREIRO)</span>
                  <form onSubmit={salvarTicker} className="space-y-2">
                    <input type="text" value={tickerInput} onChange={(e) => setTickerInput(e.target.value)} placeholder="Digite o texto..." className="w-full bg-deepSpace border border-cyberCyan/40 rounded-xl p-2.5 text-xs text-white" />
                    <button type="submit" className="cyber-button w-full text-xs py-2.5">ATUALIZAR FAIXA MARQUEE</button>
                  </form>
                </div>

                <div className="bg-void/90 border border-cyberCyan/50 rounded-xl p-3.5 space-y-2">
                  <span className="text-white font-black text-xs font-display block">ADICIONAR VÍDEO DO APARELHO</span>
                  <label className="cyber-button w-full text-xs py-3 justify-center cursor-pointer">
                    SELECIONAR ARQUIVO DE VÍDEO
                    <input type="file" accept="video/*" onChange={handleUploadGaleriaDireto} className="hidden" />
                  </label>
                </div>
              </div>
            )}
          </div>
        )}
      </div>
    </div>
  );
}

    setHistoricoSOS('Último SOS: ' + agoraStr);

function RadarMeteorologicoModule({ perfilVozId }) {
  const [dados, setDados] = useState(() => ({ ...ESTADO_CLIMA_AUTOMATICO_92.municipios }));
  const [status, setStatus] = useState('Sincronizando 92 municípios + RainViewer + GOES-19...');
  const [cidadeSel1, setCidadeSel1] = useState('Mesquita');
  const [cidadeSel2, setCidadeSel2] = useState('Duque de Caxias');
  const [modoVisualizacao, setModoVisualizacao] = useState('radar');
  const [iframeKey, setIframeKey] = useState(0);
  const [rvFrames, setRvFrames] = useState(() => ESTADO_CLIMA_AUTOMATICO_92.rainviewerFrames);

  const chartTempRef = useRef(null);
  const chartRainRef = useRef(null);

  function corPorChuva(p) {
    if (p >= 70) return '#7C4DFF';
    if (p >= 40) return '#FF0055';
    if (p >= 20) return '#FFB703';
    return '#00FF9D';
  }
  function textoPorChuva(p) {
    if (p >= 70) return 'Muito forte';
    if (p >= 40) return 'Forte';
    if (p >= 20) return 'Moderada';
    return 'Fraca / Estável';
  }

  const desenharGraficoCanvas = (canvasRef, valores, cores, sufixo) => {
    const cv = canvasRef.current;
    if (!cv) return;
    const ctx = cv.getContext('2d');
    const W = cv.width = 340, H = cv.height = 140;
    ctx.clearRect(0, 0, W, H);
    const max = Math.max(...valores, 1);
    const step = W / valores.length;
    const horaAtual = new Date().getHours();

    valores.forEach((v, i) => {
      const h = (v / max) * (H - 35);
      const x = i * step + 4;
      const grad = ctx.createLinearGradient(0, H - h, 0, H);
      grad.addColorStop(0, cores[0]);
      grad.addColorStop(1, cores[1]);
      ctx.fillStyle = grad;
      ctx.fillRect(x, H - h - 20, step - 6, h);
      ctx.fillStyle = '#FFFFFF';
      ctx.font = 'bold 9px monospace';
      ctx.textAlign = 'center';
      ctx.fillText(v + sufixo, x + (step / 2), H - h - 23);

      const horaLabel = `${String((horaAtual + i) % 24).padStart(2, '0')}h`;
      ctx.fillStyle = '#00F2FE';
      ctx.font = '600 8px monospace';
      ctx.fillText(horaLabel, x + (step / 2), H - 6);
    });
  };

  const desenharGraficosHorarios = (hourly) => {
    if (!hourly) return;
    const h = new Date().getHours();
    const temps = [], chuvas = [];
    for (let i = 0; i < 12; i++) {
      const idx = (h + i) % 24;
      temps.push(Math.round(hourly.temperature_2m[idx] || 25));
      chuvas.push(hourly.precipitation_probability[idx] || 0);
    }
    setTimeout(() => {
      desenharGraficoCanvas(chartTempRef, temps, ['#ff5252', '#ffca28'], '°C');
      desenharGraficoCanvas(chartRainRef, chuvas, ['#7c4dff', '#29b6f6'], '%');
    }, 80);
  };

  useEffect(() => {
    const atualizarEstado = (snap) => {
      setDados({ ...snap.municipios });
      setRvFrames([...snap.rainviewerFrames]);
      setStatus(`${snap.statusRede} · Atualizado ${snap.atualizadoEm || ''}`);
    };
    sincronizarTelemetria92RJ(atualizarEstado);
    const t = setInterval(() => sincronizarTelemetria92RJ(atualizarEstado), 300000);
    return () => clearInterval(t);
  }, []);

  useEffect(() => {
    if (dados[cidadeSel1]?.hourly) {
      desenharGraficosHorarios(dados[cidadeSel1].hourly);
    }
  }, [cidadeSel1, dados, modoVisualizacao]);

function RedeAlquinoHardwareModule({ onGoToDashboard, showToast }) {
  const sensorId = "ALQ-92-MESQUITA";
  const [hardwareIpUrl, setHardwareIpUrl] = useState(() => {
    try { return localStorage.getItem("raru_alquino_ip") || "http://192.168.4.1/data"; } catch (e) { return "http://192.168.4.1/data"; }
  });
  const [statusHardware, setStatusHardware] = useState("AGUARDANDO CONEXÃO IP");
  const [gasLevel, setGasLevel] = useState("-- PPM");
  const [hidroLevel, setHidroLevel] = useState("-- m");
  const [tempHardware, setTempHardware] = useState("-- C");
  const [isConnecting, setIsConnecting] = useState(false);

  const salvarEConectarIP = async () => {
    try {
      localStorage.setItem("raru_alquino_ip", hardwareIpUrl);
      setIsConnecting(true);
      setStatusHardware("CONECTANDO AO IP...");
      showToast(`Conectando ao IP: ${hardwareIpUrl}`);
      const res = await fetch(hardwareIpUrl, { method: 'GET', mode: 'cors' });
      const data = await res.json();
      if (data) {
        setGasLevel(data.gas ? `${data.gas} PPM` : "14 PPM (Normal)");
        setHidroLevel(data.nivelAgua ? `${data.nivelAgua} m` : "0.35 m (Estável)");
        setTempHardware(data.temperatura ? `${data.temperatura} C` : "27.1 C");
        setStatusHardware("CONECTADO (ONLINE VIA IP)");
        showToast("Hardware Alquino Sincronizado.");
      }
    } catch (err) {
      setTimeout(() => {
        const gasRand = Math.floor(Math.random() * 25 + 8);
        const hidroRand = (Math.random() * 0.4 + 0.1).toFixed(2);
        setGasLevel(`${gasRand} PPM (Normal)`);
        setHidroLevel(`${hidroRand} m (Estável)`);
        setTempHardware("26.8 C");
        setStatusHardware("SIMULAÇÃO ATIVA (IP LOCAL)");
        showToast("Modo simulação IP ativado.");
      }, 800);
    } finally {
      setIsConnecting(false);
    }
  };

  return (
    <div className="space-y-3.5 w-full font-mono max-w-5xl mx-auto">
      <div className="cyber-card space-y-3.5 border border-cyberCyan/40 shadow-2xl p-4">
        <div className="flex items-center justify-between border-b border-cyberCyan/25 pb-2.5">
          <div className="space-y-0.5">
            <h2 className="font-display text-[11px] font-black text-white tracking-widest flex items-center gap-1.5">
              REDE ALQUINO - HARDWARE FÍSICO
            </h2>
            <p className="text-[8px] font-mono text-cyberCyan font-bold">ACOPLAMENTO DE APARELHAGEM TECNOLÓGICA • {TITULO_OFICIAL_RARU}</p>
          </div>
          <button type="button" onClick={onGoToDashboard} className="cyber-button text-[10px] py-2 px-3">PAINEL</button>
        </div>

        <div className="bg-void/90 border border-cyberCyan/40 p-3 rounded-xl space-y-2 shadow-inner">
          <label className="text-[9px] text-cyberCyan font-bold uppercase block">Endereço IP / URL do Microcontrolador</label>
          <div className="flex flex-col sm:flex-row gap-2">
            <input type="text" value={hardwareIpUrl} onChange={(e) => setHardwareIpUrl(e.target.value)} placeholder="Ex: http://192.168.4.1/data" className="flex-1 bg-deepSpace border border-cyberCyan/40 rounded-xl p-2.5 text-xs text-white font-mono touch-manipulation" />
            <button type="button" onClick={salvarEConectarIP} disabled={isConnecting} className="cyber-button-solid text-xs py-2.5 px-4">
              {isConnecting ? "CONECTANDO..." : "CONECTAR IP"}
            </button>
          </div>
        </div>

        <div className="grid grid-cols-2 sm:grid-cols-4 gap-2.5">
          <div className="bg-void/90 border border-cyberCyan/30 rounded-xl p-3 space-y-0.5">
            <span className="text-[7px] text-slate-400 uppercase tracking-widest block">ID SENSOR</span>
            <span className="text-[10px] font-bold text-cyberCyan truncate block">{sensorId}</span>
          </div>
          <div className="bg-void/90 border border-cyberCyan/30 rounded-xl p-3 space-y-0.5">
            <span className="text-[7px] text-slate-400 uppercase tracking-widest block">STATUS</span>
            <span className="text-[10px] font-bold text-cyberGreen truncate block">{statusHardware}</span>
          </div>
          <div className="bg-void/90 border border-cyberCyan/30 rounded-xl p-3 space-y-0.5">
            <span className="text-[7px] text-slate-400 uppercase tracking-widest block">GASES</span>
            <span className="text-[10px] font-bold text-white truncate block">{gasLevel}</span>
          </div>
          <div className="bg-void/90 border border-cyberCyan/30 rounded-xl p-3 space-y-0.5">
            <span className="text-[7px] text-slate-400 uppercase tracking-widest block">HÍDRICO</span>
            <span className="text-[10px] font-bold text-white truncate block">{hidroLevel}</span>
          </div>
        </div>

        <div className="bg-void/80 border border-cyberCyan/20 rounded-xl p-2.5 flex items-center justify-between text-[10px]">
          <span className="text-slate-400">TEMPERATURA DO MÓDULO</span>
          <span className="font-bold text-cyberCyan">{tempHardware}</span>
        </div>
      </div>
    </div>
  );
}

    const mSnap = ESTADO_CLIMA_AUTOMATICO_92.municipios[municipioSelecionado.n];

      ? `Tô contigo aqui na subestação de ${municipioSelecionado.n}, ${userName}. ${baseClima}`
      : `Tô contigo aqui na subestação de ${municipioSelecionado.n}. ${baseClima}`);

    if (soundEnabled) falarImitada(textoFala, perfilVozId || vozSelecionada);
    setTimeout(() => setSarahState(prev => ({ ...prev, isSpeaking: false })), 4000);
  };

  const desenharGraficoCanvas = (canvasRef, valores, cores, label) => {
    const cv = canvasRef.current;
    if (!cv) return;
    const ctx = cv.getContext('2d');
    const W = cv.width = 320, H = cv.height = 140;
    ctx.clearRect(0, 0, W, H);
    const max = Math.max(...valores, 1);
    const step = W / valores.length;
    valores.forEach((v, i) => {
      const h = (v / max) * (H - 30);
      const x = i * step + 4;
      const grad = ctx.createLinearGradient(0, H - h, 0, H);
      grad.addColorStop(0, cores[0]); grad.addColorStop(1, cores[1]);
      ctx.fillStyle = grad;
      ctx.fillRect(x, H - h - 15, step - 6, h);
      ctx.fillStyle = '#00F2FE'; ctx.font = 'bold 9px monospace';
      ctx.fillText(v + label, x, H - h - 18);
    });

      const boxH = linhas.length * lh + padBox * 2, boxY = h - boxH - padBox;
      ctx.fillStyle = "rgba(3,7,18,0.88)"; ctx.fillRect(padBox, boxY, w - padBox * 2, boxH);
      ctx.strokeStyle = st.cor; ctx.lineWidth = 2; ctx.strokeRect(padBox, boxY, w - padBox * 2, boxH);
      ctx.fillStyle = "#fff"; ctx.font = `bold ${fs}px sans-serif`;
      linhas.forEach((l, i) => ctx.fillText(l, padBox * 2, boxY + padBox + fs + i * lh));

      const dataUrl = cv.toDataURL("image/jpeg", 0.85);
      const bytes = b64ToBytes(dataUrl);
      const hash = await sha256(bytes);
      const id = "RARU-" + Date.now().toString(36).toUpperCase();
      foto = { id, dataUrl, hash, dataHora, mun: m.n, ip: m.ip, bairro: st.bairro, end, ref: st.ref, frente: st.frente, resp: st.resp, tipo: st.tipo, nivel: st.nivel, obs: st.obs, lat: gps.ok ? gps.lat : m.lat, lon: gps.ok ? gps.lon : m.lon, acc: gps.acc, gpsOk: gps.ok };

      if ($("fotoImg")) $("fotoImg").src = dataUrl;
      if ($("fotoArea")) $("fotoArea").style.display = "block";
      if ($("hashTxt")) $("hashTxt").textContent = "SHA-256: " + hash + " • ID: " + id;
      pHud();

      const list = getLogs();
      list.unshift({ ...foto, thumb: dataUrl });
      setLogs(list.slice(0, 30));
      renderHist();
      msg("Foto batida e salva no histórico: " + id);
      falar("Foto batida e salva.");
    };

    const textoRelatorio = (item = foto) => {
      if (!item) return "";
      const gUrl = gMap(item.lat, item.lon), oUrl = oMap(item.lat, item.lon);
      return [
        `${TITULO} — ${SUB} (${COMP})`,
        `ID: ${item.id} | Data/Hora: ${item.dataHora}`,
        `Município: ${item.mun} (IP: ${item.ip})`,
        `Bairro: ${item.bairro || "não informado"}`,
        `Endereço: ${item.end || "não informado"}`,
        `Referência: ${item.ref || "não informada"}`,
        `Frente / Equipe: ${item.frente || "não informada"}`,
        `Responsável: ${item.resp || "não informado"}`,
        `Ocorrência: ${item.tipo || "não informada"}`,
        `Nível de Risco: ${item.nivel}`,
        `Observações: ${item.obs || "sem observações"}`,
        `Coordenadas GPS: ${Number(item.lat).toFixed(6)}, ${Number(item.lon).toFixed(6)} (${item.gpsOk && item.acc != null ? "±" + Math.round(item.acc) + "m" : "padrão"})`,
        `Google Maps: ${gUrl}`,
        `OpenStreetMap: ${oUrl}`,
        `SHA-256: ${item.hash}`
      ].join("\n");
    };

    const montarPdf = (item) => {
      const gUrl = gMap(item.lat, item.lon), oUrl = oMap(item.lat, item.lon);
      const linhas = [
        `${TITULO} — ${SUB} (${COMP})`,
        `ID: ${item.id} | Data/Hora: ${item.dataHora}`,
        `Município: ${item.mun} (IP: ${item.ip})`,
        `Bairro: ${item.bairro || "não informado"} | Endereço: ${item.end || "não informado"}`,
        `Referência: ${item.ref || "não informada"}`,
        `Frente / Equipe: ${item.frente || "não informada"} | Resp: ${item.resp || "não informado"}`,
        `Ocorrência: ${item.tipo || "não informada"} | Nível: ${item.nivel}`,
        `Observações: ${item.obs || "sem observações"}`,
        `GPS: ${Number(item.lat).toFixed(6)}, ${Number(item.lon).toFixed(6)} (${item.gpsOk && item.acc != null ? "±" + Math.round(item.acc) + "m" : "padrão"})`,
        `Google Maps: ${gUrl}`,
        `OpenStreetMap: ${oUrl}`,
        `SHA-256: ${item.hash}`
      ];

      const img = b64ToBytes(item.dataUrl);
      let wImg = 1280, hImg = 720;
      for (let i = 2; i < img.length - 9; i++) {
        if (img[i] === 0xFF && (img[i + 1] === 0xC0 || img[i + 1] === 0xC2)) { hImg = (img[i + 5] << 8) + img[i + 6]; wImg = (img[i + 7] << 8) + img[i + 8]; break; }
      }
      const maxW = 515, maxH = 340, sc = Math.min(maxW / wImg, maxH / hImg, 1), dw = (wImg * sc).toFixed(1), dh = (hImg * sc).toFixed(1);

      let ops = "BT /F1 11 Tf 40 760 Td 15 TL\n";
      linhas.forEach((l, i) => { ops += (i === 0 ? "" : "T* ") + `(${String(l).replace(/[\\()]/g, "\\$&")}) Tj\n`; });
      ops += `ET\nq ${dw} 0 0 ${dh} 40 ${(760 - linhas.length * 15 - 12 - Number(dh)).toFixed(1)} cm /Im1 Do Q\n`;

      const streamB = winBytes(ops), objs = [];
      const add = (s) => { objs.push(s); return objs.length; };
      const oCat = add(""), oPages = add(""), oPage = add(""), oCont = add(""), oFont = add("<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica /Encoding /WinAnsiEncoding >>");
      const oImg = add(`<< /Type /XObject /Subtype /Image /Width ${wImg} /Height ${hImg} /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${img.length} >>\nstream\n`);

      objs[oCat - 1] = `<< /Type /Catalog /Pages ${oPages} 0 R >>`;
      objs[oPages - 1] = `<< /Type /Pages /Kids [${oPage} 0 R] /Count 1 >>`;
      objs[oPage - 1] = `<< /Type /Page /Parent ${oPages} 0 R /MediaBox [0 0 595 842] /Resources << /Font << /F1 ${oFont} 0 R >> /XObject << /Im1 ${oImg} 0 R >> >> /Contents ${oCont} 0 R >>`;
      objs[oCont - 1] = `<< /Length ${streamB.length} >>\nstream\n`;

      const parts = [winBytes("%PDF-1.4\n")], offs = [0];
      let pos = parts[0].length;
      objs.forEach((o, idx) => {
        offs.push(pos);
        const h1 = winBytes(`${idx + 1} 0 obj\n`), t1 = winBytes("\nendobj\n");
        parts.push(h1); pos += h1.length;
        if (idx + 1 === oCont) { parts.push(winBytes(o), streamB, winBytes("\nendstream")); pos += o.length + streamB.length + 10; }
        else if (idx + 1 === oImg) { parts.push(winBytes(o), img, winBytes("\nendstream")); pos += o.length + img.length + 10; }
        else { const b = winBytes(o); parts.push(b); pos += b.length; }
        parts.push(t1); pos += t1.length;
      });
      const xref = pos;
      let x = `xref\n0 ${objs.length + 1}\n0000000000 65535 f \n`;
      for (let i = 1; i <= objs.length; i++) x += String(offs[i]).padStart(10, "0") + " 00000 n \n";
      x += `trailer\n<< /Size ${objs.length + 1} /Root ${oCat} 0 R >>\nstartxref\n${xref}\n%%EOF`;
      parts.push(winBytes(x));
      return new Blob([concat(parts)], { type: "application/pdf" });
    };

    const abrirPdf = (item = foto) => {
      if (!item) return;
      const url = URL.createObjectURL(montarPdf(item)), prev = $("prevPdf");
      if (prev) { prev.style.display = "block"; prev.src = url; }

    };

    const baixarPdf = (item = foto) => {
      if (!item) return;
      const url = URL.createObjectURL(montarPdf(item)), a = document.createElement("a");
      a.href = url; a.download = item.id + ".pdf"; a.click();

      msg("PDF baixado: " + item.id + ".pdf");
    };

    const zap = (item = foto) => {
      if (!item) return;

    const renderHist = () => {

      box.querySelectorAll("[data-pdf]").forEach(b => b.onclick = () => baixarPdf(getLogs()[+b.dataset.pdf]));
      box.querySelectorAll("[data-zap]").forEach(b => b.onclick = () => zap(getLogs()[+b.dataset.zap]));
      box.querySelectorAll("[data-del]").forEach(b => b.onclick = () => { const l = getLogs(); l.splice(+b.dataset.del, 1); setLogs(l); renderHist(); });
    };

    const sirene = (tipo) => {
      pararSom();
      try {
        const AC = window.AudioContext || window.webkitAudioContext;
        audioCtx = new AC();
        let on = true, f = tipo === "alerta" ? 880 : 520;
        const tick = () => {
          if (!audioCtx) return;
          const o = audioCtx.createOscillator(), g = audioCtx.createGain();
          o.type = tipo === "alerta" ? "sawtooth" : "sine";
          o.frequency.value = on ? f : f * 0.72;
          g.gain.value = 0.08; o.connect(g); g.connect(audioCtx.destination);
          o.start(); o.stop(audioCtx.currentTime + 0.35); on = !on;
        };
        tick(); sireneTimer = setInterval(tick, 420);
        msg(tipo === "alerta" ? "Sirene de ALERTA ligada." : "Aviso preventivo ligado.");
      } catch (e) { msg("Som bloqueado pelo navegador."); }
    };

    const pararSom = () => {
      if (sireneTimer) { clearInterval(sireneTimer); sireneTimer = null; }
      if (audioCtx) { try { audioCtx.close(); } catch (e) {} audioCtx = null; }
      try { if ("speechSynthesis" in window) speechSynthesis.cancel(); } catch (e) {}
      msg("Som parado.");
    };

    const acaoDrive = () => {
      if (DRIVE_EQUIPE_URL) { window.open(DRIVE_EQUIPE_URL, "_blank"); return; }
      msg("Pasta da equipe ainda não configurada.");
    };

    if ($("btnCam")) $("btnCam").onclick = abrirCam;
    if ($("btnStop")) $("btnStop").onclick = pararCam;
    if ($("btnGps")) $("btnGps").onclick = pegarGps;
    if ($("btnFoto")) $("btnFoto").onclick = baterFoto;
    if ($("btnPdfVer")) $("btnPdfVer").onclick = () => abrirPdf();
    if ($("btnPdf")) $("btnPdf").onclick = () => baixarPdf();
    if ($("btnZap")) $("btnZap").onclick = () => zap();
    if ($("btnCopiar")) $("btnCopiar").onclick = () => { if (!foto) return; navigator.clipboard?.writeText(textoRelatorio()); msg("Relatório copiado."); };
    if ($("btnSom1")) $("btnSom1").onclick = () => sirene("aviso");
    if ($("btnSom2")) $("btnSom2").onclick = () => sirene("alerta");
    if ($("btnSomOff")) $("btnSomOff").onclick = pararSom;
    if ($("btnDrive")) $("btnDrive").onclick = acaoDrive;

    if ($("btnTrocarCam")) $("btnTrocarCam").onclick = () => { st.cam = st.cam === "environment" ? "user" : "environment"; save(); paint(); abrirCam(); };
    if ($("btnHud")) $("btnHud").onclick = () => { st.hud = !st.hud; save(); paint(); };
    if ($("btnScan")) $("btnScan").onclick = () => { st.scan = !st.scan; save(); paint(); };
    if ($("btnLimpar")) $("btnLimpar").onclick = () => { ["bairro", "rua", "num", "ref", "obs"].forEach(k => { st[k] = ""; const el = $(k); if (el) el.value = ""; }); save(); paint(); };
    if ($("rngBrilho")) $("rngBrilho").oninput = () => { st.brilho = +$("rngBrilho").value; save(); paint(); };
    if ($("rngZoom")) $("rngZoom").oninput = () => { st.zoom = +$("rngZoom").value; save(); paint(); };

    root.querySelectorAll("[data-cor]").forEach(b => b.onclick = () => { st.cor = b.dataset.cor; save(); paint(); });
    root.querySelectorAll("[data-lv]").forEach(b => b.onclick = () => setLevel(b.dataset.lv));

    const btnAcord = $("btnAcord");
    if (btnAcord) {
      btnAcord.onclick = () => {
        const c = $("contAcord"), open = c.classList.toggle("aberto");
        btnAcord.textContent = (open ? "▲" : "▼") + " HISTÓRICO DE VISTORIAS SALVAS";
        if (open) renderHist();
      };
    }

    ["bairro", "rua", "num", "ref", "resp", "obs"].forEach(k => bind(k, k));
    pTipos(); pFrentes(); setLevel(st.nivel); paint(); pegarGps(); abrirCam();

    return () => {
      if (stream) stream.getTracks().forEach(t => t.stop());
      if (sireneTimer) clearInterval(sireneTimer);
      if (audioCtx) { try { audioCtx.close(); } catch (e) {} }
    };
  }, [perfilVozId, userName]);

  return (
    <div className="vist-modulo-root w-full" ref={containerRef}>
      <div className="wrap">

            </div>

            <div id="chipsRisco" style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 8 }}></div>
          </div>

          <div style={{ marginTop: 10 }}>
            <label>NÍVEL DE RISCO</label>
            <div style={{ display: 'grid', gridTemplateColumns: 'repeat(4, 1fr)', gap: 6 }}>
              <button type="button" className="chip" data-lv="BAIXO">BAIXO</button>

            <button type="button" className="btn btn-ghost btn-small" id="btnCopiar">Copiar Relatório</button>
          </div>
          <iframe id="prevPdf" className="preview-pdf" title="Pré-visualização do PDF" style={{ marginTop: 10 }}></iframe>

        <div className="card">
          <div className="topbar">

          <div id="msg" style={{ fontSize: 12, color: '#a5f3fc', marginTop: 6 }}>Pronto.</div>

        <div className="card">

  );
