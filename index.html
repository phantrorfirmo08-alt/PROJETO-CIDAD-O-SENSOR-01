<!DOCTYPE html>
<html lang="pt-BR" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sarah • Defesa Civil Mesquita</title>

  <meta name="theme-color" content="#0891b2">
  <meta name="description" content="Sarah — assistente comunitária do Cidadão Sensor.">

  <link rel="manifest" href="./manifest.webmanifest">

  <script src="https://cdn.tailwindcss.com"></script>

  <script>
    tailwind.config = {
      darkMode: "class"
    };
  </script>

  <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <link rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

  <style>
    :root {
      --app-font-size: 14px;
    }

    body {
      font-size: var(--app-font-size);
    }

    #map {
      height: 260px;
      width: 100%;
    }

   .mic-active {
      background-color: #0891b2!important;
      color: white!important;
      animation: pulsar 1s infinite;
    }

    @keyframes pulsar {
      50% {
        transform: scale(1.06);
        box-shadow: 0 0 0 8px rgba(8, 145, 178,.2);
      }
    }
  </style>

  <script>
    (() => {
      const tema = localStorage.getItem("temaSarah");

      if (
        tema === "dark" ||
        (!tema && window.matchMedia("(prefers-color-scheme: dark)").matches)
      ) {
        document.documentElement.classList.add("dark");
      }

      const fonte = Number(localStorage.getItem("tamanhoFonteSarah"));

      if (fonte >= 11 && fonte <= 18) {
        document.documentElement.style.setProperty(
          "--app-font-size",
          `${fonte}px`
        );
      }
    })();
  </script>
</head>

<body class="h-full flex flex-col overflow-hidden bg-slate-50 text-slate-900 dark:bg-slate-950 dark:text-slate-100">

  <header class="h-14 shrink-0 flex items-center justify-between px-4 bg-white dark:bg-slate-900 border-b border-slate-200 dark:border-slate-800">
    <div class="flex items-center gap-3">
      <div class="w-9 h-9 rounded-xl bg-cyan-600 text-white flex items-center justify-center">
        <i class="fas fa-shield-halved"></i>
      </div>

      <div>
        <h1 class="text-xs font-bold uppercase tracking-wider">
          Sarah
          <span class="text-[9px] text-cyan-600 dark:text-cyan-400">
            Defesa Civil
          </span>
        </h1>

        <p class="text-[10px] text-slate-500">
          Sebinho • Mesquita/RJ
        </p>
      </div>
    </div>

    <div class="flex items-center gap-1.5">
      <button id="btnTogglePainel"
              class="h-8 px-2.5 rounded-lg bg-slate-100 dark:bg-slate-800 border border-slate-200 dark:border-slate-700"
              title="Abrir painel">
        <i class="fas fa-sliders-h text-cyan-500"></i>
        <span class="hidden sm:inline">Painel</span>
      </button>

      <button id="btnTema"
              class="w-8 h-8 rounded-lg bg-slate-100 dark:bg-slate-800 border border-slate-200 dark:border-slate-700"
              title="Alternar tema">
        <i id="iconeTema" class="fas fa-moon"></i>
      </button>

      <button id="btnCompartilhar"
              class="w-8 h-8 rounded-lg bg-slate-100 dark:bg-slate-800 border border-slate-200 dark:border-slate-700"
              title="Compartilhar">
        <i class="fas fa-share-alt text-cyan-500"></i>
      </button>

      <button id="btnInstalarPWA"
              class="hidden h-8 px-2.5 rounded-lg bg-emerald-600 text-white text-xs"
              title="Instalar aplicativo">
        <i class="fas fa-download"></i>
        <span class="hidden sm:inline">Instalar</span>
      </button>

      <div class="hidden sm:flex bg-slate-100 dark:bg-slate-800 rounded-lg">
        <button id="btnDiminuir" class="w-8 h-8 text-xs font-bold">
          A-
        </button>

        <button id="btnAumentar" class="w-8 h-8 text-xs font-bold">
          A+
        </button>
      </div>
    </div>
  </header>

  <div id="painelOculto"
       class="fixed inset-0 z-50 hidden justify-end bg-black/60">

    <div class="w-full max-w-sm h-full overflow-y-auto p-4 bg-white dark:bg-slate-900">
      <div class="flex items-center justify-between pb-3 border-b border-slate-200 dark:border-slate-800">
        <h2 class="font-bold text-sm">
          <i class="fas fa-chart-pie text-cyan-500"></i>
          Painel operacional
        </h2>

        <button id="btnFecharPainel"
                class="w-8 h-8 text-slate-500"
                title="Fechar painel">
          <i class="fas fa-times"></i>
        </button>
      </div>

      <section class="mt-4 p-3 rounded-xl bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700">
        <h3 class="font-semibold text-sm mb-2">
          <i class="fas fa-cloud-sun text-amber-500"></i>
          Condições atmosféricas
        </h3>

        <p id="statusClima" class="text-xs text-slate-500 dark:text-slate-400">
          Carregando dados...
        </p>

        <button id="btnAtualizarClima"
                class="w-full mt-3 p-2 rounded-lg border border-cyan-500 text-cyan-600 dark:text-cyan-400 text-xs">
          Atualizar clima
        </button>
      </section>

      <section class="mt-4 p-3 rounded-xl bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700">
        <h3 class="font-semibold text-sm mb-2">
          Monitoramento do local
        </h3>

        <div id="map" class="rounded-lg overflow-hidden"></div>
      </section>

      <section class="mt-4 p-3 rounded-xl bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700">
        <h3 class="font-semibold text-sm mb-3">
          Registrar ocorrência local
        </h3>

        <button id="btnInundacao"
                class="w-full mb-2 p-2.5 rounded-lg text-left text-xs bg-red-500/15 text-red-600 dark:text-red-400">
          <i class="fas fa-water mr-1"></i>
          Registrar possível inundação
        </button>

        <button id="btnEncosta"
                class="w-full p-2.5 rounded-lg text-left text-xs bg-amber-500/15 text-amber-600 dark:text-amber-400">
          <i class="fas fa-mountain mr-1"></i>
          Registrar risco de encosta
        </button>

        <p id="statusRegistro"
           class="mt-3 text-xs text-slate-500 dark:text-slate-400"></p>
      </section>
    </div>
  </div>
  <main class="flex-1 w-full max-w-3xl mx-auto p-2 sm:p-4 overflow-hidden">
    <div class="h-full flex flex-col overflow-hidden rounded-2xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800">

      <div id="chatContainer"
           class="flex-1 overflow-y-auto p-4 space-y-4 text-sm">

        <div class="flex items-start gap-3">
          <div class="w-8 h-8 shrink-0 rounded-xl bg-cyan-600 text-white flex items-center justify-center">
            <i class="fas fa-robot"></i>
          </div>

          <div class="max-w-[85%] p-3.5 rounded-2xl bg-slate-100 dark:bg-slate-800 border border-slate-200 dark:border-slate-700">
            Olá! Sou a Sarah, assistente do Cidadão Sensor. Posso ajudar com relatos, clima e orientações de segurança.
          </div>
        </div>
      </div>

      <div class="flex items-center gap-2 p-3 border-t border-slate-200 dark:border-slate-800">
        <button id="btnMic"
                class="w-10 h-10 shrink-0 rounded-xl bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300"
                title="Usar microfone">
          <i class="fas fa-microphone"></i>
        </button>

        <input id="chatInput"
               type="text"
               autocomplete="off"
               placeholder="Digite sua mensagem para a Sarah..."
               class="flex-1 min-w-0 px-4 py-2.5 rounded-xl bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 focus:outline-none focus:ring-2 focus:ring-cyan-500">

        <button id="btnEnviar"
                class="h-10 px-4 rounded-xl bg-cyan-600 hover:bg-cyan-500 text-white font-semibold"
                title="Enviar mensagem">
          <i class="fas fa-paper-plane"></i>
          <span class="hidden sm:inline ml-1">Enviar</span>
        </button>
      </div>
    </div>
  </main>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <script>
    (() => {
      "use strict";

      const $ = id => document.getElementById(id);

      const chatContainer = $("chatContainer");
      const chatInput = $("chatInput");
      const btnEnviar = $("btnEnviar");
      const btnMic = $("btnMic");
      const btnTema = $("btnTema");
      const iconeTema = $("iconeTema");
      const btnAumentar = $("btnAumentar");
      const btnDiminuir = $("btnDiminuir");
      const btnCompartilhar = $("btnCompartilhar");
      const btnInstalarPWA = $("btnInstalarPWA");
      const btnTogglePainel = $("btnTogglePainel");
      const btnFecharPainel = $("btnFecharPainel");
      const painelOculto = $("painelOculto");
      const statusClima = $("statusClima");
      const btnAtualizarClima = $("btnAtualizarClima");
      const btnInundacao = $("btnInundacao");
      const btnEncosta = $("btnEncosta");
      const statusRegistro = $("statusRegistro");

      const LATITUDE = -22.7844;
      const LONGITUDE = -43.4241;
      const LOCAL = "Sebinho, Mesquita/RJ";

      let eventoInstalacao = null;
      let mapa = null;
      let reconhecimento = null;

      function escaparHTML(texto) {
        return String(texto)
         .replaceAll("&", "&amp;")
         .replaceAll("<", "&lt;")
         .replaceAll(">", "&gt;")
         .replaceAll('"', "&quot;")
         .replaceAll("'", "&#039;");
      }

      function rolarChat() {
        chatContainer.scrollTop = chatContainer.scrollHeight;
      }

      function adicionarMensagem(texto, remetente = "bot") {
        const linha = document.createElement("div");

        linha.className = remetente === "user"
         ? "flex items-start justify-end gap-3"
          : "flex items-start gap-3";

        const textoSeguro = escaparHTML(texto).replaceAll("\n", "<br>");

        if (remetente === "user") {
          linha.innerHTML = `
            <div class="bg-cyan-600 text-white p-3.5 rounded-2xl max-w-[85%] leading-relaxed">
              ${textoSeguro}
            </div>

            <div class="w-8 h-8 rounded-xl bg-slate-700 text-white flex items-center justify-center shrink-0">
              <i class="fas fa-user text-xs"></i>
            </div>
          `;
        } else {
          linha.innerHTML = `
            <div class="w-8 h-8 rounded-xl bg-cyan-600 text-white flex items-center justify-center shrink-0">
              <i class="fas fa-robot text-xs"></i>
            </div>

            <div class="bg-slate-100 dark:bg-slate-800 p-3.5 rounded-2xl border border-slate-200 dark:border-slate-700 max-w-[85%] leading-relaxed">
              ${textoSeguro}
            </div>
          `;
        }

        chatContainer.appendChild(linha);
        rolarChat();
      }

      function gerarResposta(mensagem) {
        const texto = mensagem.toLowerCase();

        if (
          texto.includes("emergência") ||
          texto.includes("perigo") ||
          texto.includes("socorro")
        ) {
          return "Se houver risco imediato, afaste-se do perigo. Bombeiros: 193. SAMU: 192. Defesa Civil: 199, quando disponível.";
        }

        if (
          texto.includes("alagamento") ||
          texto.includes("inundação") ||
          texto.includes("enchente")
        ) {
          return "Informe o local aproximado, o horário e se há pessoas em risco. Este registro não é um chamado oficial.";
        }

        if (
          texto.includes("encosta") ||
          texto.includes("deslizamento") ||
          texto.includes("rachadura")
        ) {
          return "Afaste-se de encostas, muros ou imóveis com rachaduras. Não atravesse áreas com movimentação de terra.";
        }

        if (
          texto.includes("clima") ||
          texto.includes("chuva") ||
          texto.includes("tempo")
        ) {
          return "Estou consultando as condições meteorológicas disponíveis para o Sebinho.";
        }

        if (
          texto.includes("quem é você") ||
          texto.includes("seu nome") ||
          texto.includes("sarah")
        ) {
          return "Sou a Sarah, assistente do Cidadão Sensor. Posso ajudar com relatos, clima e orientações de segurança.";
        }

        return `Recebi seu relato: "${mensagem}". Informe o local, o horário e se existe risco imediato.`;
      }

      function falar(texto) {
        if (!("speechSynthesis" in window)) return;

        speechSynthesis.cancel();

        const fala = new SpeechSynthesisUtterance(texto);
        fala.lang = "pt-BR";
        fala.rate = 1;
        fala.pitch = 1;

        speechSynthesis.speak(fala);
      }

      function processarMensagem(valor) {
        const mensagem = String(valor || "").trim();

        if (!mensagem) return;

        adicionarMensagem(mensagem, "user");
        chatInput.value = "";

        setTimeout(() => {
          const resposta = gerarResposta(mensagem);
          adicionarMensagem(resposta, "bot");
          falar(resposta);
        }, 400);
      }

      btnEnviar.addEventListener("click", () => {
        processarMensagem(chatInput.value);
      });

      chatInput.addEventListener("keydown", evento => {
        if (evento.key === "Enter") {
          evento.preventDefault();
          processarMensagem(chatInput.value);
        }
      });
      function atualizarIconeTema() {
        const escuro =
          document.documentElement.classList.contains("dark");

        iconeTema.className = escuro
         ? "fas fa-sun"
          : "fas fa-moon";
      }

      btnTema.addEventListener("click", () => {
        const escuro =
          document.documentElement.classList.toggle("dark");

        localStorage.setItem(
          "temaSarah",
          escuro? "dark" : "light"
        );

        atualizarIconeTema();
      });

      atualizarIconeTema();

      let tamanhoFonte =
        Number(localStorage.getItem("tamanhoFonteSarah")) || 14;

      function aplicarFonte() {
        tamanhoFonte = Math.max(
          11,
          Math.min(18, tamanhoFonte)
        );

        document.documentElement.style.setProperty(
          "--app-font-size",
          `${tamanhoFonte}px`
        );

        localStorage.setItem(
          "tamanhoFonteSarah",
          String(tamanhoFonte)
        );
      }

      btnAumentar.addEventListener("click", () => {
        tamanhoFonte++;
        aplicarFonte();
      });

      btnDiminuir.addEventListener("click", () => {
        tamanhoFonte--;
        aplicarFonte();
      });

      aplicarFonte();

      btnTogglePainel.addEventListener("click", () => {
        painelOculto.classList.remove("hidden");
        painelOculto.classList.add("flex");

        setTimeout(() => {
          if (!mapa && window.L) {
            mapa = L.map("map").setView(
              [LATITUDE, LONGITUDE],
              15
            );

            L.tileLayer(
              "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
              {
                attribution: "&copy; OpenStreetMap contributors"
              }
            ).addTo(mapa);

            L.marker([LATITUDE, LONGITUDE])
             .addTo(mapa)
             .bindPopup("Sebinho — Mesquita/RJ")
             .openPopup();
          }

          if (mapa) {
            mapa.invalidateSize();
          }
        }, 200);
      });

      btnFecharPainel.addEventListener("click", () => {
        painelOculto.classList.add("hidden");
        painelOculto.classList.remove("flex");
      });

      async function consultarClima() {
        statusClima.textContent =
          "Consultando dados meteorológicos...";

        const url =
          "https://api.open-meteo.com/v1/forecast" +
          `?latitude=${LATITUDE}` +
          `&longitude=${LONGITUDE}` +
          "&current=temperature_2m,relative_humidity_2m,precipitation,rain,weather_code" +
          "&timezone=America%2FSao_Paulo";

        try {
          const resposta = await fetch(url);

          if (!resposta.ok) {
            throw new Error("Falha na API meteorológica.");
          }

          const dados = await resposta.json();
          const atual = dados.current;

          statusClima.textContent =
            `${LOCAL} — ${atual.temperature_2m}°C, ` +
            `umidade ${atual.relative_humidity_2m}%, ` +
            `chuva ${atual.rain} mm.`;
        } catch (erro) {
          console.error(erro);

          statusClima.textContent =
            "Não foi possível atualizar os dados agora.";
        }
      }

      btnAtualizarClima.addEventListener(
        "click",
        consultarClima
      );

      consultarClima();

      function salvarOcorrencia(tipo) {
        const ocorrencias = JSON.parse(
          localStorage.getItem("ocorrenciasSarah") || "[]"
        );

        ocorrencias.push({
          tipo: tipo,
          local: LOCAL,
          data: new Date().toISOString(),
          status: "registrada localmente"
        });

        localStorage.setItem(
          "ocorrenciasSarah",
          JSON.stringify(ocorrencias)
        );

        statusRegistro.textContent =
          "Ocorrência registrada somente neste dispositivo. " +
          "Nenhum órgão foi notificado.";

        adicionarMensagem(
          `Registro local criado: ${tipo}. ` +
          "Em caso de risco, procure as autoridades competentes.",
          "bot"
        );
      }

      btnInundacao.addEventListener("click", () => {
        salvarOcorrencia("Possível inundação");
      });

      btnEncosta.addEventListener("click", () => {
        salvarOcorrencia("Possível risco de encosta");
      });

      btnCompartilhar.addEventListener(
        "click",
        async () => {
          const dados = {
            title: "Sarah — Defesa Civil Mesquita",
            text: "Acesse a Sarah, assistente do Cidadão Sensor.",
            url: window.location.href
          };

          try {
            if (navigator.share) {
              await navigator.share(dados);
            } else if (navigator.clipboard) {
              await navigator.clipboard.writeText(
                window.location.href
              );

              alert("Link copiado.");
            } else {
              alert("O compartilhamento não está disponível.");
            }
          } catch (erro) {
            console.log(
              "Compartilhamento cancelado.",
              erro
            );
          }
        }
      );

      const Reconhecimento =
        window.SpeechRecognition ||
        window.webkitSpeechRecognition;

      if (Reconhecimento) {
        reconhecimento = new Reconhecimento();

        reconhecimento.lang = "pt-BR";
        reconhecimento.continuous = false;
        reconhecimento.interimResults = false;

        reconhecimento.onstart = () => {
          btnMic.classList.add("mic-active");
          btnMic.setAttribute(
            "aria-label",
            "Parar gravação"
          );
        };

        reconhecimento.onend = () => {
          btnMic.classList.remove("mic-active");
          btnMic.setAttribute(
            "aria-label",
            "Usar microfone"
          );
        };

        reconhecimento.onerror = erro => {
          console.error(
            "Erro no reconhecimento de voz:",
            erro
          );

          btnMic.classList.remove("mic-active");
        };

        reconhecimento.onresult = evento => {
          const resultado =
            evento.results[0][0].transcript;

          chatInput.value = resultado;
          processarMensagem(resultado);
        };

        btnMic.addEventListener("click", () => {
          try {
            reconhecimento.start();
          } catch (erro) {
            console.log(
              "O reconhecimento já está ativo.",
