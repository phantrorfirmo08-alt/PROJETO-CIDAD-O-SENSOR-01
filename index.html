<!DOCTYPE html>
<html lang="pt-BR" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SARAH IA Core v4.0 - Defesa Civil Comunitária, Mesquita RJ</title>
    
    <!-- Open Graph / Redes Sociais (WhatsApp, Telegram, etc.) -->
    <meta property="og:title" content="App / Cidadão Sensor - Defesa Civil Comunitária Digital & Sarah IA System">
    <meta property="og:description" content="Monitoramento Preventivo de Defesa Civil - Mesquita / RJ">
    <meta property="og:image" content="https://phantrorfirmo08-alt.github.io/PROJETO-CIDAD-O-SENSOR-01/icon.svg">
    <meta property="og:url" content="https://phantrorfirmo08-alt.github.io/PROJETO-CIDAD-O-SENSOR-01/">
    <meta property="og:type" content="website">

    <!-- Twitter Cards -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="App / Cidadão Sensor - Defesa Civil Comunitária Digital & Sarah IA System">
    <meta name="twitter:description" content="Monitoramento Preventivo de Defesa Civil - Mesquita / RJ">
    <meta name="twitter:image" content="https://phantrorfirmo08-alt.github.io/PROJETO-CIDAD-O-SENSOR-01/icon.svg">

    <!-- Configurações PWA e Manifesto -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#020617">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        brand: {
                            dark: "#020617",
                            light: "#f8fafc"
                        }
                    }
                }
            }
        };
    </script>
    <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="">
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        html, body, #root {
            min-height: 100%;
            margin: 0;
        }
        body {
            overflow-x: hidden;
        }
        .leaflet-container {
            z-index: 1;
        }
        @keyframes marquee {
            0% { transform: translateX(0%); }
            100% { transform: translateX(-50%); }
        }
        .animate-marquee {
            display: flex;
            width: max-content;
            animation: marquee 25s linear infinite;
        }
        .animate-marquee:hover {
            animation-play-state: paused;
        }
    </style>
</head>
<body class="min-h-screen bg-slate-950 text-slate-100">
    <div id="root"></div>
    <script type="text/babel">
        const CLOUDFLARE_WORKER_URL = "https://sarah-envelope.phantrorfirmo08.workers.dev/";

        function SarahAvatar({ size = "w-9 h-9", showStatus = true, isLarge = false, riskLevel = "green" }) {
            const [isBlinking, setIsBlinking] = React.useState(false);

            React.useEffect(() => {
                let timeoutId;
                const triggerBlink = () => {
                    setIsBlinking(true);
                    setTimeout(() => setIsBlinking(false), 140);
                    const randomTime = Math.floor(Math.random() * (5000 - 2500 + 1)) + 2500;
                    timeoutId = setTimeout(triggerBlink, randomTime);
                };
                const initialTime = Math.floor(Math.random() * (5000 - 2500 + 1)) + 2500;
                timeoutId = setTimeout(triggerBlink, initialTime);
                return () => clearTimeout(timeoutId);
            }, []);

            const dimensionClass = isLarge ? "w-28 h-28" : size;

            const statusColorClass = 
                riskLevel === "red" ? "bg-rose-500 shadow-[0_0_12px_rgba(244,63,94,0.9)] border-rose-950" :
                riskLevel === "yellow" ? "bg-amber-400 shadow-[0_0_12px_rgba(251,191,36,0.9)] border-amber-950" :
                "bg-emerald-400 shadow-[0_0_12px_rgba(16,185,129,0.9)] border-emerald-950";

            return (
                <div className="relative inline-flex items-center justify-center shrink-0">
                    <style>{`
                        .sarah-hud-container {
                            position: relative;
                            background: radial-gradient(circle at 50% 50%, #031324 0%, #01060c 70%, #000205 100%);
                            border-radius: 50%;
                            overflow: hidden;
                            display: flex;
                            align-items: center;
                            justify-content: center;
                            box-shadow: 0 0 25px rgba(0, 242, 255, 0.2), inset 0 0 15px rgba(0, 242, 255, 0.15);
                            border: 2px solid rgba(0, 242, 255, 0.5);
                        }
                        .hud-ring-outer {
                            position: absolute;
                            inset: 3px;
                            border-radius: 50%;
                            border: 1px dashed rgba(0, 242, 255, 0.35);
                            animation: spinSlow 20s linear infinite;
                        }
                        .hud-ring-inner {
                            position: absolute;
                            inset: 8px;
                            border-radius: 50%;
                            border: 1.2px solid rgba(0, 242, 255, 0.7);
                            box-shadow: 0 0 8px rgba(0, 242, 255, 0.4);
                        }
                        .hud-ring-pulse {
                            position: absolute;
                            inset: 0;
                            border-radius: 50%;
                            background: radial-gradient(circle, rgba(0,242,255,0.12) 0%, transparent 70%);
                            animation: pulseHud 3s ease-in-out infinite;
                        }
                        .neural-dots {
                            position: absolute;
                            inset: 0;
                            background-image: radial-gradient(rgba(0, 242, 255, 0.35) 1px, transparent 1px);
                            background-size: 8px 8px;
                            opacity: 0.3;
                        }
                        @keyframes spinSlow {
                            0% { transform: rotate(0deg); }
                            100% { transform: rotate(360deg); }
                        }
                        @keyframes pulseHud {
                            0%, 100% { transform: scale(1); opacity: 0.4; }
                            50% { transform: scale(1.04); opacity: 0.8; }
                        }
                    `}</style>

                    <div className={`${dimensionClass} sarah-hud-container select-none shadow-xl`}>
                        <div className="neural-dots"></div>
                        <div className="hud-ring-pulse"></div>
                        <div className="hud-ring-outer"></div>
                        <div className="hud-ring-inner"></div>

                        <div className="relative z-10 flex flex-col items-center justify-center w-full h-full">
                            <div className={`transition-transform duration-75 ${isBlinking ? 'scale-y-[0.08]' : 'scale-y-100'}`}>
                                <svg className={isLarge ? "w-14 h-10 text-cyan-400" : "w-5 h-3.5 text-cyan-400"} viewBox="0 0 100 60" fill="none" xmlns="http://www.w3.org/2000/svg">
                                    <path d="M 12 30 Q 50 10 88 30 Q 50 50 12 30 Z" stroke="currentColor" strokeWidth="2.5" fill="rgba(3, 19, 36, 0.85)" className="filter drop-shadow-[0_0_5px_rgba(0,242,255,0.7)]"/>
                                    <circle cx="50" cy="30" r="10" stroke="currentColor" strokeWidth="2" fill="rgba(0, 242, 255, 0.15)"/>
                                    <polygon points="50,22 56,26 56,34 50,38 44,34 44,26" fill="#00f2ff" className="animate-pulse shadow-[0_0_6px_#00f2ff]"/>
                                    <circle cx="50" cy="30" r="2.5" fill="#ffffff" />
                                </svg>
                            </div>
                        </div>
                    </div>

                    {showStatus && (
                        <div className={`absolute ${isLarge ? 'bottom-1.5 right-1.5 w-3.5 h-3.5 border-2' : '-bottom-0.5 right-0.5 w-2 h-2 border'} ${statusColorClass} rounded-full animate-ping`} title={`Estado Crítico: ${riskLevel.toUpperCase()}`}></div>
                    )}
                    {showStatus && (
                        <div className={`absolute ${isLarge ? 'bottom-1.5 right-1.5 w-3.5 h-3.5 border-2' : '-bottom-0.5 right-0.5 w-2 h-2 border'} ${statusColorClass} rounded-full`} title={`Estado Crítico: ${riskLevel.toUpperCase()}`}></div>
                    )}
                </div>
            );
        }

        function App() {
            const [darkMode, setDarkMode] = React.useState(true);
            const [fontScale, setFontScale] = React.useState(1.0);
            const [soundEnabled, setSoundEnabled] = React.useState(true);
            const [isSpeaking, setIsSpeaking] = React.useState(false);
            const [isListening, setIsListening] = React.useState(false);
            const [liveWeather, setLiveWeather] = React.useState(null);
            const [hourlyForecast, setHourlyForecast] = React.useState(null);
            
            const [activeTab, setActiveTab] = React.useState("dashboard");

            const [termsOpen, setTermsOpen] = React.useState(false);
            const [termsAccepted, setTermsAccepted] = React.useState(
                () => localStorage.getItem("sarah_terms_accepted") === "1"
            );
            const [checkAccepted1, setCheckAccepted1] = React.useState(false);
            const [checkAccepted2, setCheckAccepted2] = React.useState(false);

            const [deferredPrompt, setDeferredPrompt] = React.useState(null);
            const [showInstallBtn, setShowInstallBtn] = React.useState(false);

            const [messages, setMessages] = React.useState([]);
            const [input, setInput] = React.useState("");
            const [isLoadingChat, setIsLoadingChat] = React.useState(false);
            const [hasIntroduced, setHasIntroduced] = React.useState(
                () => localStorage.getItem("sarah_introduced") === "1"
            );

            const speechIdRef = React.useRef(0);
            const voiceTimerRef = React.useRef(null);
            const voicesRef = React.useRef([]);
            const mapRef = React.useRef(null);
            const mapInstanceRef = React.useRef(null);
            const chartRef = React.useRef(null);
            const chartInstanceRef = React.useRef(null);

            const getRiskLevel = () => {
                if (!liveWeather) return "green";
                const precip = liveWeather.precipitation || 0;
                const wind = liveWeather.wind_speed_10m || 0;
                const code = liveWeather.weather_code || 0;
                if (code >= 95 || precip > 10 || wind > 40) return "red";
                if (code >= 51 || precip > 2 || wind > 25) return "yellow";
                return "green";
            };

            const currentRisk = getRiskLevel();

            React.useEffect(() => {
                const handleBeforeInstall = (e) => {
                    e.preventDefault();
                    setDeferredPrompt(e);
                    setShowInstallBtn(true);
                };
                window.addEventListener("beforeinstallprompt", handleBeforeInstall);
                return () => window.removeEventListener("beforeinstallprompt", handleBeforeInstall);
            }, []);

            const handleInstallApp = async () => {
                if (!deferredPrompt) return;
                deferredPrompt.prompt();
                const { outcome } = await deferredPrompt.userChoice;
                if (outcome === "accepted") {
                    setShowInstallBtn(false);
                }
                setDeferredPrompt(null);
            };

            const carregarVozes = () => {
                if ("speechSynthesis" in window) {
                    voicesRef.current = window.speechSynthesis.getVoices();
                }
            };

            React.useEffect(() => {
                if (!("speechSynthesis" in window)) return;
                carregarVozes();
                window.speechSynthesis.onvoiceschanged = carregarVozes;
                return () => {
                    window.speechSynthesis.cancel();
                    window.speechSynthesis.onvoiceschanged = null;
                };
            }, []);

            const limparTextoParaFala = (text) => {
                return String(text)
                    .replace(/[#*_`~]/g, "")
                    .replace(/\[(.*?)\]\(.*?\)/g, "$1")
                    .replace(/https?:\/\/\S+/g, "")
                    .replace(/\s+/g, " ")
                    .trim();
            };

            const escolherMelhorVoz = () => {
                const voices = voicesRef.current.length
                    ? voicesRef.current
                    : window.speechSynthesis.getVoices();
                const preferidas = [
                    "Google português do Brasil",
                    "Google Português do Brasil",
                    "Microsoft Francisca",
                    "Microsoft Maria"
                ];
                return (
                    voices.find((voice) =>
                        preferidas.some((name) =>
                            voice.name.toLowerCase().includes(name.toLowerCase())
                        )
                    ) ||
                    voices.find((voice) => voice.lang.toLowerCase() === "pt-br") ||
                    voices.find((voice) => voice.lang.toLowerCase().startsWith("pt")) ||
                    voices[0]
                );
            };

            const stopSpeaking = () => {
                speechIdRef.current += 1;
                if (voiceTimerRef.current) {
                    clearTimeout(voiceTimerRef.current);
                    voiceTimerRef.current = null;
                }
                if ("speechSynthesis" in window) {
                    window.speechSynthesis.cancel();
                }
                setIsSpeaking(false);
            };

            const speakText = (text) => {
                if (!soundEnabled || !("speechSynthesis" in window)) return;
                const cleanText = limparTextoParaFala(text);
                if (!cleanText) return;
                stopSpeaking();
                const currentId = speechIdRef.current;
                voiceTimerRef.current = setTimeout(() => {
                    if (currentId !== speechIdRef.current) return;
                    const utterance = new SpeechSynthesisUtterance(cleanText);
                    const voice = escolherMelhorVoz();
                    utterance.lang = "pt-BR";
                    utterance.voice = voice || null;
                    utterance.rate = 0.92;
                    utterance.pitch = 1.02;
                    utterance.volume = 1;
                    utterance.onstart = () => {
                        if (currentId === speechIdRef.current) setIsSpeaking(true);
                    };
                    utterance.onend = () => {
                        if (currentId === speechIdRef.current) setIsSpeaking(false);
                    };
                    utterance.onerror = () => setIsSpeaking(false);
                    window.speechSynthesis.speak(utterance);
                }, 250);
            };

            React.useEffect(() => {
                if (!termsAccepted || hasIntroduced) return;
                const presentation = "Olá! Meu nome é Sarah, assistente meteorológica do Projeto Cidadão Sensor. Em que posso ajudar?";
                const timer = setTimeout(() => {
                    if (!soundEnabled) return;
                    setHasIntroduced(true);
                    localStorage.setItem("sarah_introduced", "1");
                    speakText(presentation);
                }, 700);
                return () => clearTimeout(timer);
            }, [termsAccepted, hasIntroduced, soundEnabled]);

            const handleShareLink = async () => {
                const shareData = {
                    title: "App / Cidadão Sensor - Defesa Civil Comunitária Digital & Sarah IA System",
                    text: "Monitoramento Preventivo de Defesa Civil - Mesquita / RJ",
                    url: "https://phantrorfirmo08-alt.github.io/PROJETO-CIDAD-O-SENSOR-01/"
                };
                if (navigator.share) {
                    try {
                        await navigator.share(shareData);
                    } catch (error) {
                        console.log("Compartilhamento cancelado.");
                    }
                } else if (navigator.clipboard) {
                    await navigator.clipboard.writeText(shareData.url);
                    alert("Link copiado para a área de transferência.");
                }
            };

            React.useEffect(() => {
                fetch(
                    "https://api.open-meteo.com/v1/forecast" +
                    "?latitude=-22.7845&longitude=-43.4140" +
                    "&current=temperature_2m,relative_humidity_2m,precipitation,weather_code,wind_speed_10m" +
                    "&hourly=temperature_2m,precipitation_probability,precipitation"
                )
                    .then((response) => response.json())
                    .then((data) => {
                        if (data && data.current) {
                            setLiveWeather(data.current);
                        }
                        if (data && data.hourly) {
                            setHourlyForecast(data.hourly);
                        }
                    })
                    .catch((error) => {
                        console.warn("Clima indisponível:", error);
                    });
            }, []);

            React.useEffect(() => {
                document.documentElement.classList.toggle("dark", darkMode);
                document.documentElement.classList.toggle("light", !darkMode);
            }, [darkMode]);

            React.useEffect(() => {
                if (activeTab === "radar" && mapRef.current && !mapInstanceRef.current) {
                    const lat = -22.7845;
                    const lng = -43.4140;
                    const map = L.map(mapRef.current).setView([lat, lng], 13);
                    
                    L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
                        maxZoom: 19,
                        attribution: "© OpenStreetMap contributors | SARAH IA Core v4.0"
                    }).addTo(map);

                    fetch('https://api.rainviewer.com/public/weather-maps.json')
                        .then(res => res.json())
                        .then(apiData => {
                            if (apiData && apiData.radar && apiData.radar.past && apiData.radar.past.length > 0) {
                                const latestFrame = apiData.radar.past[apiData.radar.past.length - 1];
                                L.tileLayer(`https://tile.rainviewer.com${latestFrame.path}/256/{z}/{x}/{y}/2/1_1.png`, {
                                    opacity: 0.65,
                                    attribution: 'Radar © RainViewer'
                                }).addTo(map);
                            }
                        })
                        .catch(err => console.warn("Camada de radar indisponível:", err));

                    L.marker([lat, lng])
                        .addTo(map)
                        .bindPopup("<b>Setor de referência:</b> Sebinho / Rocha Sobrinho, Mesquita - RJ<br><i>Camada de nuvens e radar ativada.</i>")
                        .openPopup();

                    mapInstanceRef.current = map;
                }
                if (activeTab === "radar" && mapInstanceRef.current) {
                    setTimeout(() => {
                        mapInstanceRef.current?.invalidateSize();
                    }, 100);
                }
                if (activeTab !== "radar" && mapInstanceRef.current) {
                    mapInstanceRef.current.remove();
                    mapInstanceRef.current = null;
                }
            }, [activeTab]);

            React.useEffect(() => {
                if (activeTab !== "charts" || !chartRef.current) return;

                if (chartInstanceRef.current) {
                    chartInstanceRef.current.destroy();
                    chartInstanceRef.current = null;
                }

                const ctx = chartRef.current.getContext("2d");
                const nowIndex = new Date().getHours();
                const labels = hourlyForecast && hourlyForecast.time 
                    ? hourlyForecast.time.slice(nowIndex, nowIndex + 8).map(t => t.split("T")[1]) 
                    : ["00:00", "03:00", "06:00", "09:00", "12:00", "15:00", "18:00", "21:00"];
                
                const tempData = hourlyForecast && hourlyForecast.temperature_2m 
                    ? hourlyForecast.temperature_2m.slice(nowIndex, nowIndex + 8) 
                    : [24, 23, 22, 25, 28, 29, 27, 25];

                chartInstanceRef.current = new Chart(ctx, {
                    type: "line",
                    data: {
                        labels: labels,
                        datasets: [
                            {
                                label: "Temperatura (°C)",
                                data: tempData,
                                borderColor: "#06b6d4",
                                backgroundColor: "rgba(6, 182, 212, 0.1)",
                                borderWidth: 2,
                                fill: true,
                                tension: 0.3
                            }
                        ]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        scales: {
                            y: {
                                beginAtZero: false,
                                grid: { color: "rgba(148, 163, 184, 0.1)" },
                                ticks: { color: "#94a3b8", font: { family: "monospace", size: 10 } }
                            },
                            x: {
                                grid: { color: "rgba(148, 163, 184, 0.1)" },
                                ticks: { color: "#94a3b8", font: { family: "monospace", size: 10 } }
                            }
                        },
                        plugins: {
                            legend: {
                                labels: { color: "#e2e8f0", font: { family: "monospace", size: 11 } }
                            }
                        }
                    }
                });

                return () => {
                    if (chartInstanceRef.current) {
                        chartInstanceRef.current.destroy();
                        chartInstanceRef.current = null;
                    }
                };
            }, [activeTab, hourlyForecast]);

            React.useEffect(() => {
                return () => {
                    if (mapInstanceRef.current) {
                        mapInstanceRef.current.remove();
                        mapInstanceRef.current = null;
                    }
                    if (chartInstanceRef.current) {
                        chartInstanceRef.current.destroy();
                        chartInstanceRef.current = null;
                    }
                };
            }, []);

            const toggleListening = () => {
                const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
                if (!SpeechRec) {
                    alert("Seu navegador não suporta reconhecimento de voz.");
                    return;
                }
                if (isListening) {
                    setIsListening(false);
                    return;
                }
                const rec = new SpeechRec();
                rec.lang = "pt-BR";
                rec.interimResults = false;
                rec.continuous = false;
                rec.onstart = () => setIsListening(true);
                rec.onresult = (event) => {
                    const text = event.results[0][0].transcript;
                    setInput(text);
                    setIsListening(false);
                    handleSendMessage(text);
                };
                rec.onerror = () => setIsListening(false);
                rec.onend = () => setIsListening(false);
                rec.start();
            };

            const handleSendMessage = async (textCustom) => {
                stopSpeaking();
                const textToSend = textCustom !== undefined ? textCustom : input;
                if (!textToSend.trim() || isLoadingChat) return;

                const userMsg = {
                    id: `${Date.now()}-user`,
                    sender: "user",
                    text: textToSend.trim(),
                    timestamp: new Date().toLocaleTimeString("pt-BR", { hour: "2-digit", minute: "2-digit" })
                };

                const historico = [...messages, userMsg].slice(-8).map((message) => ({
                    role: message.sender === "user" ? "user" : "assistant",
                    content: message.text
                }));

                setMessages((previous) => [...previous, userMsg]);
                setInput("");
                setIsLoadingChat(true);

                const weatherContext = liveWeather
                    ? `Condições meteorológicas atuais em Mesquita/RJ (Open-Meteo): Temperatura ${liveWeather.temperature_2m}°C, Umidade ${liveWeather.relative_humidity_2m}%, Precipitação ${liveWeather.precipitation} mm, Vento ${liveWeather.wind_speed_10m} km/h.`
                    : "Dados meteorológicos temporariamente indisponíveis.";

                try {
                    const response = await fetch(CLOUDFLARE_WORKER_URL, {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({
                            model: "openai/gpt-oss-120b",
                            messages: [
                                {
                                    role: "system",
                                    content: `Você é a SARAH IA Core v4.0, assistente de monitoramento meteorológico preventivo e Defesa Civil Comunitária em Mesquita/RJ. ${weatherContext}

Responda em português do Brasil, de forma clara, objetiva e responsável.
Baseie-se estritamente em dados meteorológicos reais (temperatura, umidade, chuva, vento). Não invente medições hidrológicas ou cotas de rios.
Não solicite nem revele chaves, senhas ou dados pessoais.
Em situações de risco meteorológico severo, oriente o usuário a procurar um local seguro e acionar a Defesa Civil Comunitária pelo número 199.`
                                },
                                ...historico
                            ],
                            temperature: 0.6,
                            max_tokens: 900
                        })
                    });

                    const responseText = await response.text();
                    let data;
                    try {
                        data = JSON.parse(responseText);
                    } catch {
                        throw new Error("O Worker retornou uma resposta inválida.");
                    }

                    if (!response.ok) {
                        throw new Error(data?.error || `Erro do servidor (${response.status}).`);
                    }

                    const reply = data?.choices?.[0]?.message?.content || data?.message || data?.reply;
                    if (!reply) {
                        throw new Error("A IA não retornou uma mensagem.");
                    }

                    const assistantMsg = {
                        id: `${Date.now()}-assistant`,
                        sender: "sarah",
                        text: reply,
                        timestamp: new Date().toLocaleTimeString("pt-BR", { hour: "2-digit", minute: "2-digit" })
                    };

                    setMessages((previous) => [...previous, assistantMsg]);
                    speakText(reply);
                } catch (error) {
                    console.error("Erro na comunicação com Cloudflare/Groq:", error);
                    const fallbackReply = "Não foi possível conectar ao agente de inteligência artificial através do cofre seguro. Verifique a conexão.";
                    const errorMsg = {
                        id: `${Date.now()}-error`,
                        sender: "sarah",
                        text: fallbackReply,
                        timestamp: new Date().toLocaleTimeString("pt-BR", { hour: "2-digit", minute: "2-digit" })
                    };
                    setMessages((previous) => [...previous, errorMsg]);
                    speakText(fallbackReply);
                } finally {
                    setIsLoadingChat(false);
                }
            };

            return (
                <div 
                    className={`min-h-screen ${darkMode ? "bg-slate-950 text-slate-100" : "bg-slate-100 text-slate-900"} transition-colors duration-300 flex flex-col`}
                    style={{ fontSize: `${fontScale}rem` }}
                >
                    
                    {!termsAccepted && (
