<!DOCTYPE html>
<html lang="pt-BR" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SARAH AI - Sistema de Monitoramento e Defesa Civil (Sarapuí - Mesquita/RJ)</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            dark: '#020617',
                            light: '#f8fafc'
                        }
                    }
                }
            }
        }
    </script>
    
    <!-- React & Babel -->
    <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- Leaflet CSS & JS for Map -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin=""/>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>

    <!-- Chart.js for River Metrics -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <!-- PWA Manifest & Meta -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#020617">
</head>
<body class="min-h-screen bg-slate-950 text-slate-100 transition-colors duration-300 flex flex-col justify-between">
    <div id="root"></div>

    <script type="text/babel">
        function App() {
            // Estados Globais e de Configuração
            const [userName, setUserName] = React.useState('Alexander');
            const [awaitingGuestName, setAwaitingGuestName] = React.useState(false);
            const [guestNames, setGuestNames] = React.useState([]);
            const [hfApiKey, setHfApiKey] = React.useState(() => localStorage.getItem('hf_api_key') || '');
            const [darkMode, setDarkMode] = React.useState(true);
            const [fontSizeScale, setFontSizeScale] = React.useState('normal'); 
            const [soundEnabled, setSoundEnabled] = React.useState(true);
            const [isSpeaking, setIsSpeaking] = React.useState(false);
            const [isListening, setIsListening] = React.useState(false);

            // Módulos Recolhíveis (Escondidos por trás do chat, acionados via botão)
            const [mapOpen, setMapOpen] = React.useState(false);
            const [chartOpen, setChartOpen] = React.useState(false);
            const [termsOpen, setTermsOpen] = React.useState(false);

            // Chat State
            const [messages, setMessages] = React.useState([
                {
                    id: '1',
                    sender: 'sarah',
                    text: `Olá, Alexander. SARAH AI ativa e monitorando o setor Sarapuí-Mesquita dentro dos parâmetros legais e de moderação. Como posso auxiliar em nossa operação hoje?`,
                    timestamp: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
                }
            ]);
            const [input, setInput] = React.useState('');
            const [isLoadingChat, setIsLoadingChat] = React.useState(false);

            // Referências para Mapas e Gráficos
            const mapRef = React.useRef(null);
            const mapInstanceRef = React.useRef(null);
            const chartRef = React.useRef(null);
            const chartInstanceRef = React.useRef(null);

            // Sincronizar Chave Hugging Face
            React.useEffect(() => {
                localStorage.setItem('hf_api_key', hfApiKey);
            }, [hfApiKey]);

            // Sincronizar Modo Dark/Light na tag html
            React.useEffect(() => {
                const rootHtml = document.documentElement;
                if (darkMode) {
                    rootHtml.classList.add('dark');
                    rootHtml.classList.remove('light');
                } else {
                    rootHtml.classList.remove('dark');
                    rootHtml.classList.add('light');
                }
            }, [darkMode]);

            // Inicializar Mapa Leaflet quando aberto
            React.useEffect(() => {
                if (mapOpen && mapRef.current && !mapInstanceRef.current) {
                    const lat = -22.7845;
                    const lng = -43.4140;
                    const map = L.map(mapRef.current).setView([lat, lng], 16);
                    
                    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                        maxZoom: 19,
                        attribution: '© OpenStreetMap contributors | SARAH AI Defesa Civil'
                    }).addTo(map);

                    L.marker([lat, lng]).addTo(map)
                        .bindPopup('<b>Setor Crítico:</b> Rua Amazonas / Comunidade do Sebinho - Rocha Sobrinho, Mesquita')
                        .openPopup();

                    mapInstanceRef.current = map;
                } else if (mapOpen && mapInstanceRef.current) {
                    mapInstanceRef.current.invalidateSize();
                }
            }, [mapOpen]);

            // Inicializar Gráfico de Métricas do Rio Sarapuí (Zerado aguardando dados reais)
            React.useEffect(() => {
                if (chartOpen && chartRef.current && !chartInstanceRef.current) {
                    const ctx = chartRef.current.getContext('2d');
                    chartInstanceRef.current = new Chart(ctx, {
                        type: 'line',
                        data: {
                            labels: ['00:00', '03:00', '06:00', '09:00', '12:00', '15:00', '18:00', 'Atual'],
                            datasets: [{
                                label: 'Cota do Rio Sarapuí (m) - [Aguardando Telemetria]',
                                data: [0, 0, 0, 0, 0, 0, 0, 0],
                                borderColor: '#06b6d4',
                                backgroundColor: 'rgba(6, 182, 212, 0.1)',
                                borderWidth: 2,
                                fill: true,
                                tension: 0.3
                            }]
                        },
                        options: {
                            responsive: true,
                            maintainAspectRatio: false,
                            scales: {
                                y: {
                                    beginAtZero: true,
                                    max: 4.0,
                                    grid: { color: 'rgba(148, 163, 184, 0.1)' },
                                    ticks: { color: '#94a3b8', font: { family: 'monospace', size: 10 } }
                                },
                                x: {
                                    grid: { color: 'rgba(148, 163, 184, 0.1)' },
                                    ticks: { color: '#94a3b8', font: { family: 'monospace', size: 10 } }
                                }
                            },
                            plugins: {
                                legend: { labels: { color: '#e2e8f0', font: { family: 'monospace', size: 11 } } }
                            }
                        }
                    });
                }
            }, [chartOpen]);

            // Sistema de Síntese de Voz (TTS)
            const speakText = (text) => {
                if (!soundEnabled || !('speechSynthesis' in window)) return;
                window.speechSynthesis.cancel();
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'pt-BR';
                utterance.pitch = 1.0;
                utterance.rate = 1.0;
                utterance.onstart = () => setIsSpeaking(true);
                utterance.onend = () => setIsSpeaking(false);
                utterance.onerror = () => setIsSpeaking(false);
                window.speechSynthesis.speak(utterance);
            };

            // Reconhecimento de Voz Avançado (STT)
            const toggleListening = () => {
                const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
                if (!SpeechRec) {
                    alert("Seu navegador não suporta reconhecimento de voz avançado.");
                    return;
                }
                if (isListening) {
                    setIsListening(false);
                    return;
                }
                const rec = new SpeechRec();
                rec.lang = 'pt-BR';
                rec.onstart = () => setIsListening(true);
                rec.onresult = (e) => {
                    const txt = e.results[0][0].transcript;
                    setInput(txt);
                    setIsListening(false);
                    handleSendMessage(txt);
                };
                rec.onerror = () => setIsListening(false);
                rec.onend = () => setIsListening(false);
                rec.start();
            };

            // Lógica de Moderação, Nomes e Conversação da SARAH
            const handleSendMessage = async (textCustom) => {
                const textToSend = textCustom !== undefined ? textCustom : input;
                if (!textToSend.trim() || isLoadingChat) return;

                const userMsg = {
                    id: Date.now().toString(),
                    sender: 'user',
                    text: textToSend,
                    timestamp: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
                };

                setMessages(prev => [...prev, userMsg]);
                if (!textCustom) setInput('');
                setIsLoadingChat(true);

                setTimeout(() => {
                    let reply = "";
                    const lowerText = textToSend.toLowerCase();

                    if (awaitingGuestName) {
                        const guestName = textToSend.trim();
                        setGuestNames(prev => [...prev, guestName]);
                        setAwaitingGuestName(false);
                        reply = `Perfeito! Registrei o nome ${guestName} no sistema. A partir de agora, tratarei ${guestName} com toda atenção e respeito no setor. Como mais posso ajudar vocês, ${userName}?`;
                    } 
                    else if (lowerText.includes('outro nome') || lowerText.includes('tem outra pessoa') || lowerText.includes('falar com') || lowerText.includes('meu amigo') || lowerText.includes('colega') || lowerText.includes('aqui tem')) {
                        setAwaitingGuestName(true);
                        reply = `Entendido, ${userName}. Qual é o nome da pessoa que está acompanhando você agora? Por favor, informe para que eu possa chamá-la pelo nome.`;
                    } 
                    else {
                        reply = `Compreendido, ${userName}. Operando com rigor nos padrões de moderação e proteção de dados da Bacia do Sarapuí. Nossos sensores e protocolos estão ativos. Tem mais alguém presente com você cujo nome eu deva registrar?`;
                    }

                    setMessages(prev => [...prev, {
                        id: (Date.now() + 1).toString(),
                        sender: 'sarah',
                        text: reply,
                        timestamp: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
                    }]);
                    setIsLoadingChat(false);
                    speakText(reply);
                }, 700);
            };

            // Controles de Tamanho de Fonte
            const getFontSizeClass = () => {
                switch(fontSizeScale) {
                    case 'small': return 'text-xs';
                    case 'large': return 'text-base';
                    case 'xl': return 'text-lg';
                    default: return 'text-sm';
                }
            };

            const cycleFontSize = () => {
                if (fontSizeScale === 'normal') setFontSizeScale('large');
                else if (fontSizeScale === 'large') setFontSizeScale('xl');
                else if (fontSizeScale === 'xl') setFontSizeScale('small');
                else setFontSizeScale('normal');
            };

            return (
                <div className={`min-h-screen ${darkMode ? 'bg-slate-950 text-slate-100' : 'bg-slate-100 text-slate-900'} ${getFontSizeClass()} transition-colors duration-300 flex flex-col justify-between`}>
                    
                    <div>
                        {/* BARRA DE FERRAMENTAS SUPERIOR COM BOTÕES FUNCIONAIS */}
                        <header className="bg-slate-900/95 dark:bg-slate-900/95 bg-white/95 border-b border-cyan-500/30 px-3 py-2.5 backdrop-blur-md sticky top-0 z-50 shadow-md">
                            <div className="max-w-4xl mx-auto flex flex-wrap items-center justify-between gap-2">
                                
                                <div className="flex items-center gap-1.5 w-full sm:w-auto">
                                    <span className="font-mono text-[11px] text-cyan-400 font-bold shrink-0">HF Key:</span>
                                    <input
                                        type="password"
                                        value={hfApiKey}
                                        onChange={(e) => setHfApiKey(e.target.value)}
                                        placeholder="Insira sua HF API Key..."
                                        className="bg-slate-950 border border-cyan-500/40 rounded px-2 py-1 text-xs font-mono text-slate-200 w-full sm:w-48 focus:outline-none focus:border-cyan-400 shadow-inner"
                                    />
                                    <button
                                        onClick={() => alert(hfApiKey ? "Chave HF anexada e salva no navegador com sucesso!" : "Insira uma chave válida.")}
                                        className="px-2 py-1 bg-cyan-500/20 hover:bg-cyan-500/30 text-cyan-300 border border-cyan-500/40 rounded text-xs font-mono transition-colors shrink-0"
                                    >
                                        Anexar
                                    </button>
                                </div>

                                <div className="flex items-center flex-wrap gap-1.5 ml-auto">
                                    <button
                                        onClick={() => {
                                            if ('deferredPrompt' in window && window.deferredPrompt) {
                                                window.deferredPrompt.prompt();
                                            } else {
                                                alert('PWA pronto para instalação ou verifique o menu do seu navegador (Adicionar à Tela Inicial).');
                                            }
                                        }}
                                        className="px-2.5 py-1 bg-cyan-500/20 hover:bg-cyan-500/30 text-cyan-300 border border-cyan-500/40 rounded text-xs font-mono flex items-center gap-1 transition-colors"
                                    >
                                        📥 Instalar
                                    </button>

                                    <button
                                        onClick={() => setDarkMode(!darkMode)}
                                        className="px-2.5 py-1 bg-slate-800 hover:bg-slate-700 text-amber-300 border border-slate-700 rounded text-xs font-mono flex items-center gap-1 transition-colors"
                                    >
                                        {darkMode ? '☀️ Dia' : '🌙 Noite'}
                                    </button>

                                    <button
                                        onClick={cycleFontSize}
                                        className="px-2.5 py-1 bg-slate-800 hover:bg-slate-700 text-slate-300 border border-slate-700 rounded text-xs font-mono transition-colors"
                                    >
                                        🔠 Fonte ({fontSizeScale})
                                    </button>

                                    <button
                                        onClick={() => {
                                            if (navigator.share) {
                                                navigator.share({
                                                    title: 'SARAH AI - Defesa Civil Mesquita',
                                                    text: 'Sistema inteligente de monitoramento do Rio Sarapuí em Mesquita, RJ.',
                                                    url: window.location.href
                                                }).catch(() => {});
                                            } else {
                                                navigator.clipboard.writeText(window.location.href);
                                                alert('Link do aplicativo copiado para a área de transferência!');
                                            }
                                        }}
                                        className="px-2.5 py-1 bg-emerald-500/20 hover:bg-emerald-500/30 text-emerald-300 border border-emerald-500/40 rounded text-xs font-mono flex items-center gap-1 transition-colors"
                                    >
                                        🔗 Compartilhar
                                    </button>
                                </div>
                            </div>
                        </header>

                        {/* CONTEÚDO PRINCIPAL */}
                        <main className="max-w-2xl mx-auto pt-6 px-4">
                            
                            {/* CABEÇALHO DO SISTEMA */}
                            <div className="text-center mb-6 relative">
                                <div className="inline-flex flex-col items-center gap-1 mb-3 px-4 py-2 bg-cyan-500/10 border border-cyan-500/30 rounded-2xl shadow-inner">
                                    <span className="font-mono text-xs text-cyan-400 font-bold tracking-widest uppercase">
                                        Sistema Automatizado
                                    </span>
                                    <span className="font-mono text-sm text-slate-100 font-semibold tracking-wide">
                                        Cidadão Sensor_ Sebinho /Mesquita RJ
                                    </span>
                                    <span className="font-mono text-[11px] text-cyan-300 tracking-wider">
                                        Defesa civil Digital Comunitária
                                    </span>
                                </div>
                                <h1 className="text-2xl md:text-3xl font-black tracking-tight text-white drop-shadow">
                                    SARAH AI <span className="text-cyan-400 font-mono text-lg">v3.8</span>
                                </h1>
                                <p className="text-xs text-slate-400 mt-1 font-mono">
                                    Monitoramento Geodésico, Alerta Preventivo e LGPD Compliance
                                </p>
                            </div>

                            {/* BOTÕES DE ACIONAMENTO DOS MÓDULOS RECOLHIDOS */}
                            <div className="grid grid-cols-3 gap-2 mb-4">
                                <button
                                    onClick={() => setMapOpen(!mapOpen)}
                                    className={`py-2 px-3 rounded-xl border text-xs font-mono font-bold flex items-center justify-center gap-1.5 transition-all shadow-md ${mapOpen ? 'bg-cyan-500 text-slate-950 border-cyan-400 shadow-cyan-500/30' : 'bg-slate-900/90 text-cyan-300 border-cyan-500/30 hover:bg-slate-800'}`}
                                >
                                    🗺️ {mapOpen ? 'Ocultar Mapa' : 'Mapa Setorial'}
                                </button>
                                
                                <button
                                    onClick={() => setChartOpen(!chartOpen)}
                                    className={`py-2 px-3 rounded-xl border text-xs font-mono font-bold flex items-center justify-center gap-1.5 transition-all shadow-md ${chartOpen ? 'bg-cyan-500 text-slate-950 border-cyan-400 shadow-cyan-500/30' : 'bg-slate-900/90 text-cyan-300 border-cyan-500/30 hover:bg-slate-800'}`}
                                >
                                    📊 {chartOpen ? 'Ocultar Gráfico' : 'Gráfico Telemetria'}
                                </button>

                                <button
                                    onClick={() => setTermsOpen(!termsOpen)}
                                    className={`py-2 px-3 rounded-xl border text-xs font-mono font-bold flex items-center justify-center gap-1.5 transition-all shadow-md ${termsOpen ? 'bg-cyan-500 text-slate-950 border-cyan-400 shadow-cyan-500/30' : 'bg-slate-900/90 text-cyan-300 border-cyan-500/30 hover:bg-slate-800'}`}
                                >
                                    ⚖️ {termsOpen ? 'Ocultar LGPD' : 'Termos & LGPD'}
                                </button>
                            </div>

                            {/* MÓDULO RECOLHIDO: MAPA */}
                            {mapOpen && (
                                <div className="mb-4 bg-slate-900/95 border-2 border-cyan-500/40 rounded-2xl p-3 shadow-xl transition-all">
                                    <div className="flex items-center justify-between mb-2">
                                        <span className="font-mono text-xs text-cyan-300 font-bold uppercase">
                                            📍 Foco: Rocha Sobrinho, Mesquita (Rua Amazonas / Sebinho)
                                        </span>
                                        <button onClick={() => setMapOpen(false)} className="text-slate-400 hover:text-white text-xs font-mono">✕ Fechar</button>
                                    </div>
                                    <div ref={mapRef} className="w-full h-64 rounded-xl border border-cyan-500/30 z-10"></div>
                                </div>
                            )}

                            {/* MÓDULO RECOLHIDO: GRÁFICO */}
                            {chartOpen && (
                                <div className="mb-4 bg-slate-900/95 border-2 border-cyan-500/40 rounded-2xl p-3 shadow-xl transition-all">
                                    <div className="flex items-center justify-between mb-2">
                                        <span className="font-mono text-xs text-cyan-300 font-bold uppercase">
                                            📈 Métricas do Rio Sarapuí [Zerado • Aguardando Telemetria Real]
                                        </span>
                                        <button onClick={() => setChartOpen(false)} className="text-slate-400 hover:text-white text-xs font-mono">✕ Fechar</button>
                                    </div>
                                    <div className="w-full h-56 relative">
                                        <canvas ref={chartRef}></canvas>
                                    </div>
                                </div>
                            )}

                            {/* MÓDULO RECOLHIDO: LGPD */}
                            {termsOpen && (
                                <div className="mb-4 bg-slate-900/95 border-2 border-cyan-500/40 rounded-2xl p-4 shadow-xl transition-all font-sans">
                                    <div className="flex items-center justify-between mb-3 border-b border-cyan-500/20 pb-2">
                                        <span className="font-mono text-xs text-cyan-300 font-bold uppercase">
                                            ⚖️ LGPD & Termos de Responsabilidade (Lei nº 13.709/2018)
                                        </span>
                                        <button onClick={() => setTermsOpen(false)} className="text-slate-400 hover:text-white text-xs font-mono">✕ Fechar</button>
                                    </div>
                                    <div className="space-y-3 text-xs text-slate-300 leading-relaxed">
                                        <div className="bg-slate-950 p-3 rounded-xl border border-cyan-500/20">
                                            <strong className="text-cyan-400 block mb-1">Pilar I: Minimização e Finalidade Estrita</strong>
                                            Os dados cadastrados são utilizados exclusivamente para suporte técnico operacional, comunicação de emergência e segurança pública na Bacia do Sarapuí.
                                        </div>
                                        <div className="bg-slate-950 p-3 rounded-xl border border-cyan-500/20">
                                            <strong className="text-cyan-400 block mb-1">Pilar II: Transparência e Consentimento Ativo</strong>
                                            O armazenamento de credenciais ocorre estritamente no armazenamento local do navegador (<code className="text-cyan-300 font-mono">localStorage</code>) sob total controle do usuário.
                                        </div>
                                        <div className="bg-slate-950 p-3 rounded-xl border border-cyan-500/20">
                                            <strong className="text-cyan-400 block mb-1">Pilar III: Segurança e Privacidade Comunitária</strong>
                                            A plataforma adota padrões estritos de moderação e conformidade legal, preservando a integridade civil de todos os envolvidos.
                                        </div>
                                    </div>
                                </div>
                            )}

                            {/* INTERFACE DE CHAT PRINCIPAL */}
                            <div className="bg-slate-900/90 backdrop-blur-2xl border-2 border-cyan-500/40 rounded-3xl p-4 shadow-2xl shadow-cyan-950/60 relative z-20">
                                
                                <div className="flex items-center justify-between mb-3 border-b border-cyan-500/20 pb-2.5">
                                    <div className="flex items-center gap-2">
                                        <span className="w-2.5 h-2.5 rounded-full bg-cyan-400 animate-pulse" />
                                        <span className="font-mono text-xs text-cyan-300 font-bold uppercase tracking-wider">
                                            Interface Neural • Focado em {userName} {guestNames.length > 0 ? `e convidados (${guestNames.join(', ')})` : ''}
                                        </span>
                                    </div>
                                    <button
                                        onClick={() => setSoundEnabled(!soundEnabled)}
                                        className={`px-2 py-1 rounded-lg border text-xs font-mono transition-all ${soundEnabled ? 'bg-cyan-500/20 border-cyan-400/50 text-cyan-300' : 'bg-slate-800 border-slate-700 text-slate-400'}`}
                                    >
                                        {soundEnabled ? '🔊 Voz Ativa' : '🔇 Mudo'}
                                    </button>
                                </div>

                                {/* Histórico de Mensagens */}
                                <div className="h-72 overflow-y-auto space-y-3 pr-2 mb-4">
                                    {messages.map(m => (
                                        <div key={m.id} className={`flex flex-col ${m.sender === 'user' ? 'items-end' : 'items-start'}`}>
                                            <div className={`max-w-[85%] rounded-2xl px-4 py-2.5 shadow-md ${m.sender === 'user' ? 'bg-cyan-600 text-white rounded-br-none' : 'bg-slate-800/90 border border-cyan-500/30 text-slate-200 rounded-bl-none'}`}>
                                                <p className="leading-relaxed">{m.text}</p>
                                            </div>
                                            <span className="text-[10px] text-slate-500 font-mono mt-1 px-1">{m.timestamp}</span>
                                        </div>
                                    ))}
                                    {isLoadingChat && (
                                        <div className="flex items-center gap-2 text-cyan-400 text-xs font-mono bg-slate-800/50 p-2 rounded-xl w-fit animate-pulse">
                                            ⏳ SARAH processando com moderação e rigor legal...
                                        </div>
                                    )}
                                </div>

                                {/* Entrada e Botões */}
                                <div className="flex items-center gap-2">
                                    <input
                                        type="text"
                                        value={input}
                                        onChange={e => setInput(e.target.value)}
                                        onKeyDown={e => e.key === 'Enter' && handleSendMessage()}
                                        placeholder={awaitingGuestName ? "Digite o nome da pessoa presente..." : `Digite sua mensagem, Alexander...`}
                                        className="flex-1 bg-slate-950 border border-cyan-500/30 rounded-xl px-4 py-2.5 text-slate-100 placeholder-slate-500 focus:outline-none focus:border-cyan-400 shadow-inner"
                                    />
                                    
                                    <button
                                        onClick={toggleListening}
                                        className={`p-2.5 rounded-xl border transition-all shrink-0 ${isListening ? 'bg-rose-500 border-rose-400 text-white animate-pulse shadow-lg shadow-rose-500/30' : 'bg-slate-800 border-cyan-500/30 text-cyan-400 hover:bg-slate-700'}`}
                                        title="Comando por Voz Avançado (STT)"
                                    >
                                        🎤
                                    </button>

                                    <button
                                        onClick={() => handleSendMessage()}
                                        className="px-4 py-2.5 bg-cyan-500 hover:bg-cyan-400 text-slate-950 font-bold rounded-xl shadow-lg shadow-cyan-500/20 transition-all shrink-0 flex items-center justify-center"
                                    >
                                        Enviar 🚀
                                    </button>
                                </div>
                            </div>

                        </main>
                    </div>

                    {/* RODAPÉ DO SISTEMA */}
                    <footer className="max-w-2xl mx-auto w-full mt-12 pt-6 pb-6 px-4 border-t border-cyan-500/20 text-center font-mono text-xs text-slate-400 space-y-1.5">
