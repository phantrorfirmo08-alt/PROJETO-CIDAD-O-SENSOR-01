function montarPersonalidadeSarah(){

// ===== RELÓGIO OFICIAL DE BRASÍLIA + CALENDÁRIO ANUAL (SEMPRE ATUAL) =====
function contextoTempoBrasilia(){
  const agora = new Date();
  const fmt = (opts) => new Intl.DateTimeFormat('pt-BR', { timeZone: 'America/Sao_Paulo', ...opts }).format(agora);
  const hora = fmt({ hour: '2-digit', minute: '2-digit', hour12: false });
  const dataCompleta = fmt({ weekday: 'long', day: '2-digit', month: 'long', year: 'numeric' });
  const diaAno = Math.floor((agora - new Date(agora.getFullYear(), 0, 0)) / 86400000);
  const diasNoAno = ((agora.getFullYear() % 4 === 0 && agora.getFullYear() % 100 !== 0) || agora.getFullYear() % 400 === 0) ? 366 : 365;
  const meses = ["Janeiro","Fevereiro","Março","Abril","Maio","Junho","Julho","Agosto","Setembro","Outubro","Novembro","Dezembro"];
  const mesAtual = meses[agora.getMonth()];
  const diasNoMes = new Date(agora.getFullYear(), agora.getMonth() + 1, 0).getDate();
  const estacao = (() => {
    const m = agora.getMonth() + 1, d = agora.getDate();
    if ((m === 12 && d >= 21) || m <= 3 || (m === 3 && d < 20)) return "Verão";
    if ((m === 3 && d >= 20) || m <= 6 || (m === 6 && d < 21)) return "Outono";
    if ((m === 6 && d >= 21) || m <= 9 || (m === 9 && d < 23)) return "Inverno";
    return "Primavera";
  })();
  return { hora, dataCompleta, mesAtual, diasNoMes, diaAno, diasNoAno, estacao };
}

async function chamarSarah(tipo, mensagensHistorico, municipioAtual, bairroAtual, abaAtual, dadosClimaContexto, userName = "Alexander") {

  const instrucaoSaudacaoUnica = globalSaudacaoEmitida
    ? "ATENÇÃO ABSOLUTA: A saudação temporal já foi feita no início. NUNCA inicie frases com 'Bom dia', 'Boa tarde' ou 'Boa noite'. Responda direto ao assunto de forma fluida."
    : `ATENÇÃO ABSOLUTA: Utilize a saudação '${saudacaoCerta}' apenas UMA vez no início desta conversa. Nos diálogos seguintes, nunca repita saudações.`;

  const baseSarah = montarPersonalidadeSarah() + `

Operador: ${nomeOperador}
Município: ${municipioAtual || 'Mesquita'}
Bairro/Setor: ${bairroAtual || 'Rocha Sobrinho'}
Aba Ativa: ${abaAtual || 'Dashboard Principal'}
Hora Oficial de Brasília: ${horaFormatada} (horário real, use-o naturalmente)
Data Completa: ${t.dataCompleta}
Calendário: ${t.mesAtual}, dia ${new Intl.DateTimeFormat('pt-BR',{timeZone:'America/Sao_Paulo',day:'2-digit'}).format(new Date())} de ${new Date().getFullYear()}, dia ${t.diaAno} de ${t.diasNoAno} do ano, mês com ${t.diasNoMes} dias, estação: ${t.estacao}
${instrucaoSaudacaoUnica}
[VOCÊ ESTÁ SEMPRE ATUALIZADA] Use a hora e a data acima como verdade absoluta do momento presente em todas as interações, em todos os módulos do app.`;

  let promptFinal = baseSarah;
  let temp = 0.5;
  let maxTokens = 400;

  try {
    const response = await fetch(SARAH_PROXY_URL, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        model: "openai/gpt-oss-120b",
        messages: [{ role: "system", content: promptFinal }, ...mensagensHistorico],
        temperature: temp,
        max_tokens: maxTokens
      })
    });
    const data = await response.json();
    if (!data.error) {
      const msg = data?.choices?.[0]?.message;
      let texto = msg?.content || msg?.reasoning_content;
      if (texto && texto.trim().length > 0) {
        globalSaudacaoEmitida = true;
        texto = texto.replace(/[*#]/g, '').replace(/cerquilha/gi, '').replace(/asterisco/gi, '');

      }
    }
  } catch (e) {}

  try {
    const ultimaMensagem = mensagensHistorico[mensagensHistorico.length - 1]?.content || "Olá";

  globalSaudacaoEmitida = true;
  return `Calma, ${nomeOperador}, tô contigo aqui na escuta. Vamo resolver isso junto agora.`;
}

// ===== 6 PERFIS OFICIAIS DE VOZ (INTEGRAÇÃO GLOBAL) =====
const PERFIS_VOZ_OFICIAIS = [

function falarSarah(texto, vozIndex = 0) {
  try {
    const mudoGlobal = localStorage.getItem("raru_sound_enabled");
    if (mudoGlobal === "false") return;
  } catch(e) {}

  if (!("speechSynthesis" in window)) return;
  try {
    window.speechSynthesis.cancel();
    const cleanText = String(texto)
      .replace(/[*#]/g, '')
      .replace(/cerquilha/gi, '')
      .replace(/asterisco/gi, '')
      .replace(/([\u2700-\u27BF]|[\uE000-\uF8FF]|\uD83C[\uDC00-\uDFFF]|\uD83D[\uDC00-\uDFFF]|[\u2011-\u26FF]|\uD83E[\uDD00-\uDDFF])/g, '')
      .replace(/https?:\/\/\S+/g, "")
      .trim();
    if (!cleanText) return;
    const utterance = new SpeechSynthesisUtterance(cleanText);
    utterance.lang = "pt-BR";
    const voices = window.speechSynthesis.getVoices();
    const ptVoices = voices.filter(v => v.lang.toLowerCase().includes('pt'));
    const targetVoice = ptVoices[vozIndex] || ptVoices[0] || voices[0];
    if (targetVoice) utterance.voice = targetVoice;
    let perfil = null;
    try { perfil = PERFIS_VOZ_OFICIAIS.find(p => p.id === localStorage.getItem("raru_perfil_voz")); } catch(e) {}
    if (perfil) {
      utterance.pitch = perfil.pitch;
      utterance.rate = perfil.rate;
    } else {
      utterance.pitch = 1.05;
      utterance.rate = 1.15;
    }
    window.speechSynthesis.speak(utterance);

async function gerarArquivoIconeEscudo() {
  return new Promise((resolve) => {
    const canvas = document.createElement('canvas');
    canvas.width = 512;
    canvas.height = 512;
    const ctx = canvas.getContext('2d');

    const bgGrad = ctx.createRadialGradient(256, 256, 30, 256, 256, 320);
    bgGrad.addColorStop(0, '#0A2547');
    bgGrad.addColorStop(0.6, '#041125');
    bgGrad.addColorStop(1, '#02040A');
    ctx.fillStyle = bgGrad;
    ctx.fillRect(0, 0, 512, 512);

    ctx.strokeStyle = 'rgba(0, 242, 254, 0.07)';
    ctx.lineWidth = 1;
    for (let i = 0; i < 512; i += 32) {
      ctx.beginPath(); ctx.moveTo(i, 0); ctx.lineTo(i, 512); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(0, i); ctx.lineTo(512, i); ctx.stroke();
    }

    ctx.save();
    ctx.beginPath();
    ctx.arc(256, 245, 200, 0, Math.PI * 2);
    ctx.strokeStyle = 'rgba(56, 189, 248, 0.35)';
    ctx.lineWidth = 3;
    ctx.setLineDash([12, 10]);
    ctx.stroke();
    ctx.restore();

    ctx.save();
    ctx.shadowColor = '#00F2FE';
    ctx.shadowBlur = 25;
    ctx.beginPath();
    ctx.moveTo(256, 65);
    ctx.lineTo(410, 130);
    ctx.lineTo(410, 265);
    ctx.quadraticCurveTo(410, 385, 256, 435);
    ctx.quadraticCurveTo(102, 385, 102, 265);
    ctx.lineTo(102, 130);
    ctx.closePath();

    const shieldFill = ctx.createLinearGradient(102, 65, 410, 435);
    shieldFill.addColorStop(0, 'rgba(0, 242, 254, 0.18)');
    shieldFill.addColorStop(1, 'rgba(4, 17, 37, 0.92)');
    ctx.fillStyle = shieldFill;
    ctx.fill();

    ctx.lineWidth = 6;
    ctx.strokeStyle = '#00F2FE';
    ctx.stroke();
    ctx.restore();

    ctx.beginPath();
    ctx.arc(256, 245, 92, 0, Math.PI * 2);
    ctx.strokeStyle = '#00FF9D';
    ctx.lineWidth = 3;
    ctx.stroke();

    const coreGrad = ctx.createRadialGradient(256, 245, 5, 256, 245, 65);
    coreGrad.addColorStop(0, '#00F2FE');
    coreGrad.addColorStop(1, '#041125');
    ctx.beginPath();
    ctx.arc(256, 245, 65, 0, Math.PI * 2);
    ctx.fillStyle = coreGrad;
    ctx.fill();

    ctx.fillStyle = '#FFFFFF';
    ctx.font = '900 34px Orbitron, sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('CLIMA', 256, 242);

    ctx.fillStyle = '#00FF9D';
    ctx.font = '800 20px JetBrains Mono, monospace';
    ctx.fillText('& DADOS PÚBLICOS', 256, 272);

    ctx.fillStyle = '#38BDF8';
    ctx.font = '700 15px JetBrains Mono, monospace';
    ctx.fillText('CIDADÃO SENSOR • MESQUITA RJ', 256, 480);

    canvas.toBlob((blob) => {
      if (blob) {
        resolve(new File([blob], 'BASE_CLIMATICA_TATICA.png', { type: 'image/png' }));
      } else {
        resolve(null);
      }
    }, 'image/png');
  });
}

function PainelRotasEstacaoPublica() {
    const [rotas, setRotas] = React.useState([]);

    React.useEffect(() => {
        const carregarRotas = () => {
            try {
                const r = JSON.parse(localStorage.getItem('rotasFugaReais') || '[]');
                setRotas(r);
            } catch(e) { setRotas([]); }
        };
        carregarRotas();
        window.addEventListener('storage', carregarRotas);
        const interval = setInterval(carregarRotas, 2500);
        return () => {
            window.removeEventListener('storage', carregarRotas);
            clearInterval(interval);
        };
    }, []);

    return (
        <div id="painelRotasEstacao" style={{background: 'rgba(2, 4, 10, 0.88)', border: '1px solid #00F2FE', borderRadius: '16px', padding: '16px', color: '#fff', boxShadow: '0 0 22px rgba(0, 242, 254, 0.22)', backdropFilter: 'blur(8px)', marginTop: '14px', marginBottom: '16px', fontFamily: 'Segoe UI, sans-serif'}}>
            <div style={{display: 'flex', justifyContent: 'space-between', alignItems: 'center', borderBottom: '1px solid rgba(0, 242, 254, 0.25)', paddingBottom: '10px', marginBottom: '12px'}}>
                <div style={{display: 'flex', alignItems: 'center', gap: '8px'}}>
                    <span style={{display: 'inline-block', width: '10px', height: '10px', borderRadius: '50%', background: '#00F2FE', boxShadow: '0 0 10px #00F2FE'}}></span>
                    <h3 style={{margin: 0, fontSize: '0.98rem', color: '#00F2FE', letterSpacing: '1px', textTransform: 'uppercase', display:'flex', alignItems:'center', gap:'6px'}}>
                        <IconeBoia size={16} color="#00F2FE"/> ROTAS DE FUGA E ABRIGOS ATIVOS
                    </h3>
                </div>
                <span id="contadorRotasEstacao" style={{background: 'rgba(0, 242, 254, 0.12)', color: '#00F2FE', border: '1px solid #00F2FE', padding: '2px 10px', borderRadius: '20px', fontSize: '0.72rem', fontFamily: 'monospace', fontWeight: 700}}>
                    {rotas.length} {rotas.length === 1 ? 'ATIVO' : 'ATIVOS'}
                </span>
            </div>

            <div style={{fontSize: '0.75rem', color: '#7fc9d8', marginBottom: '12px', fontFamily: 'monospace'}}>
                REDE COMUNITÁRIA GADE · PROJETO CIDADÃO SENSOR · MESQUITA - RJ
            </div>

            <div id="listaRotasPublica" style={{display: 'flex', flexDirection: 'column', gap: '10px'}}>
                {rotas.length === 0 ? (
                    <div style={{background: 'rgba(11, 15, 25, 0.8)', border: '1px dashed rgba(0, 242, 254, 0.35)', borderRadius: '12px', padding: '14px', textAlign: 'center', color: '#7fc9d8', fontSize: '0.82rem'}}>
                        Nenhum ponto de apoio ou rota de fuga ativado pela central no momento.
                    </div>
                ) : (
                    rotas.map((r, i) => {
                        const IcTipo = iconeSvgPorTipo[r.tipo] || IconeBoia;
                        return (
                            <div key={i} style={{background: 'linear-gradient(135deg, rgba(4, 30, 46, 0.85), rgba(2, 4, 10, 0.95))', border: '1px solid rgba(0, 242, 254, 0.45)', borderLeft: '4px solid #00F2FE', borderRadius: '12px', padding: '12px', boxShadow: '0 4px 12px rgba(0, 0, 0, 0.4)'}}>
                                <div style={{display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: '4px'}}>
                                    <span style={{background: 'rgba(212, 175, 55, 0.15)', color: '#D4AF37', border: '1px solid rgba(212, 175, 55, 0.5)', padding: '2px 8px', borderRadius: '6px', fontSize: '0.68rem', fontWeight: 700, letterSpacing: '0.5px', textTransform: 'uppercase', display:'inline-flex', alignItems:'center', gap:'5px'}}>
                                        <IcTipo size={11} color="#D4AF37"/> {r.tipo || 'PONTO SEGURO'}

                                    </span>
                                </div>
                                <div style={{color: '#ffffff', fontSize: '0.95rem', fontWeight: 700, marginTop: '4px'}}>
                                    {r.nome}
                                </div>
                                <div style={{color: '#00F2FE', fontSize: '0.82rem', marginTop: '3px', display:'flex', alignItems:'center', gap:'4px'}}>
                                    <strong>Endereço:</strong> {r.endereco}

                                {r.info && <div style={{color: '#cfeef5', fontSize: '0.78rem', marginTop: '5px', background: 'rgba(0, 242, 254, 0.06)', padding: '6px 8px', borderRadius: '6px'}}>INFO: {r.info}</div>}

  const [abaAtiva, setAbaAtiva] = React.useState('rota');
  const [rotas, setRotas] = React.useState(() => JSON.parse(localStorage.getItem('rotasFugaReais') || '[]'));
  const [rNome, setRNome] = React.useState('');
  const [rEnd, setREnd] = React.useState('');
  const [rInfo, setRInfo] = React.useState('');
  const [rTipo, setRTipo] = React.useState('Ponto de Encontro');

  const [monitores, setMonitores] = React.useState(() => JSON.parse(localStorage.getItem('monitoresCADE') || '[]'));
  const [bloqueados, setBloqueados] = React.useState(() => JSON.parse(localStorage.getItem('monitoresBloqueadosCADE') || '[]'));
  const [mNome, setMNome] = React.useState('');
  const [mZap, setMZap] = React.useState('');
  const [mSenha, setMSenha] = React.useState('');
  const [mMun, setMMun] = React.useState('');
  const [mBairro, setMBairro] = React.useState('');
  const [mFuncao, setMFuncao] = React.useState('Monitor do Tempo');
  const [mObs, setMObs] = React.useState('');
  const [filtroMon, setFiltroMon] = React.useState('');

  const salvarRota = () => {
    if(!rNome.trim() || !rEnd.trim()) { showToast('Escreve o nome e o endereço.'); return; }
    const nova = { nome: rNome.trim(), endereco: rEnd.trim(), info: rInfo.trim(), tipo: rTipo };
    const atualizadas = [...rotas, nova];
    setRotas(atualizadas);
    localStorage.setItem('rotasFugaReais', JSON.stringify(atualizadas));
    setRNome(''); setREnd(''); setRInfo('');
    showToast('Rota salva! Já vai aparecer na Estação.');
  };

  const excluirRota = (i) => {
    if(!confirm('Excluir essa rota?')) return;
    const atualizadas = [...rotas];
    atualizadas.splice(i, 1);
    setRotas(atualizadas);
    localStorage.setItem('rotasFugaReais', JSON.stringify(atualizadas));
  };

  const cadastrarMonitor = () => {
    if(!mNome.trim() || !mMun || !mBairro.trim() || !mSenha.trim()) { showToast('Preencha nome, município, bairro e crie a senha.'); return; }
    let c = parseInt(localStorage.getItem('contadorMonitorCADE') || '0') + 1;
    localStorage.setItem('contadorMonitorCADE', c);
    const idGerado = 'GADE-M-' + String(c).padStart(3, '0');
    const novoM = { id: idGerado, nome: mNome.trim(), zap: mZap.trim(), senha: mSenha.trim(), municipio: mMun, bairro: mBairro.trim(), funcao: mFuncao, obs: mObs.trim(), data: new Date().toLocaleString('pt-BR') };
    const atualizados = [...monitores, novoM];
    setMonitores(atualizados);
    localStorage.setItem('monitoresCADE', JSON.stringify(atualizados));
    setMNome(''); setMZap(''); setMSenha(''); setMBairro(''); setMObs('');
    showToast(`Monitor cadastrado: ${idGerado}`);
  };

  const bloquearMonitor = (idx) => {
    const x = monitores[idx];
    const motivo = prompt(`Excluindo ${x.nome} - ${x.id}\nMotivo? Ex: mau uso`);
    if(motivo === null) return;
    if(!confirm(`CONFIRMAR BLOQUEIO?\n\n${x.id} - ${x.nome}`)) return;
    const l = [...monitores]; l.splice(idx, 1);
    setMonitores(l); localStorage.setItem('monitoresCADE', JSON.stringify(l));
    const bb = [...bloqueados, { ...x, motivo: motivo || 'Sem motivo', dataBloqueio: new Date().toLocaleString('pt-BR') }];
    setBloqueados(bb); localStorage.setItem('monitoresBloqueadosCADE', JSON.stringify(bb));
    showToast(`Monitor ${x.id} bloqueado.`);
  };

  const desbloquearMonitor = (idx) => {
    const x = bloqueados[idx];
    if(!confirm(`Desbloquear ${x.id} - ${x.nome}?`)) return;
    const bb = [...bloqueados]; bb.splice(idx, 1);
    setBloqueados(bb); localStorage.setItem('monitoresBloqueadosCADE', JSON.stringify(bb));
    const l = [...monitores, { id: x.id, nome: x.nome, zap: x.zap, senha: x.senha, municipio: x.municipio, bairro: x.bairro, funcao: x.funcao, obs: x.obs, data: x.data }];
    setMonitores(l); localStorage.setItem('monitoresCADE', JSON.stringify(l));
    showToast(`Monitor ${x.id} desbloqueado.`);
  };

  const exportarMonitoresGrupo = () => {
    if(!monitores.length) { showToast('Nenhum monitor ativo.'); return; }
    const msg = `MONITORES GADE - ${monitores.length} ativos\n\n` + monitores.map(x => `${x.id} - ${x.nome} - ${x.funcao}\nLocal: ${x.municipio} - ${x.bairro}\nContato: ${x.zap||''}`).join('\n\n') + `\n\nProjeto: GADE - Grupo a Chave da Esperança`;
    if(navigator.clipboard) navigator.clipboard.writeText(msg).catch(()=>{});
    showToast('Lista copiada sem senha! Abrindo WhatsApp.');
    window.open('https://chat.whatsapp.com/D1wrk9nTBH57Wya2Uv44ZW', '_blank');
  };

  const monitoresFiltrados = monitores.filter(x => (x.id + ' ' + x.nome + ' ' + x.municipio + ' ' + x.bairro).toLowerCase().includes(filtroMon.toLowerCase()));

  return (
    <div id="cadeAdmin" style={{background:'#021a2a', border:'1px solid #00e5ff', borderRadius:'16px', padding:'14px', fontFamily:'sans-serif'}}>
      <b style={{color:'#00e5ff', fontSize:'16px', display:'flex', alignItems:'center', gap:'6px'}}><IconeBloqueio size={15} color="#00e5ff"/> ÁREA RESTRITA - GADE</b>
      <div style={{color:'#fff', fontSize:'12px', opacity:.8}}>GADE - Grupo a Chave da Esperança / Projeto Cidadão Sensor</div>
      <div style={{color:'#ffcc00', fontSize:'12px', marginTop:'4px'}}>Nenhuma rota oficial. Aguardando órgãos oficiais ou cadastramento do GADE.</div>
      <div style={{display:'flex', gap:'8px', marginTop:'12px'}}>
        <button onClick={() => setAbaAtiva('rota')} style={{flex:1, display:'flex', alignItems:'center', justifyContent:'center', gap:'6px', background: abaAtiva==='rota'?'#00e5ff':'#041e2e', color: abaAtiva==='rota'?'#000':'#fff', fontWeight:'bold', border:'none', padding:'12px', borderRadius:'10px', cursor:'pointer'}}><IconeBoia size={14} color={abaAtiva==='rota'?'#000':'#00e5ff'}/> ROTAS DE FUGA</button>
        <button onClick={() => setAbaAtiva('monitor')} style={{flex:1, display:'flex', alignItems:'center', justifyContent:'center', gap:'6px', background: abaAtiva==='monitor'?'#00ff88':'#041e2e', color: abaAtiva==='monitor'?'#000':'#fff', fontWeight:'bold', border:'1px solid #00e5ff', padding:'12px', borderRadius:'10px', cursor:'pointer'}}><IconeOlho size={14} color={abaAtiva==='monitor'?'#000':'#00ff88'}/> MONITORES</button>
      </div>
      {abaAtiva === 'rota' ? (
        <div id="painelRota">

  const desenharGraficoCanvas = (canvasRef, valores, cores, sufixo) => {
    const cv = canvasRef.current;
    if(!cv) return;
    const ctx = cv.getContext('2d');
    const W = cv.width = 340, H = cv.height = 140;
    ctx.clearRect(0,0,W,H);
    const max = Math.max(...valores, 1);
    const step = W / valores.length;
    const horaAtual = new Date().getHours();

    valores.forEach((v,i)=>{
      const h = (v/max)*(H-35);
      const x = i*step+4;
      const grad = ctx.createLinearGradient(0,H-h,0,H);
      grad.addColorStop(0,cores[0]);
      grad.addColorStop(1,cores[1]);
      ctx.fillStyle = grad;
      ctx.fillRect(x, H-h-20, step-6, h);
      ctx.fillStyle = '#FFFFFF';
      ctx.font = 'bold 9px monospace';
      ctx.textAlign = 'center';
      ctx.fillText(v+sufixo, x+(step/2), H-h-23);

      const horaLabel = `${String((horaAtual + i) % 24).padStart(2, '0')}h`;
      ctx.fillStyle = '#00F2FE';
      ctx.font = '600 8px monospace';
      ctx.fillText(horaLabel, x+(step/2), H-6);
    });
