​function falarSarah(texto, customProfile = null) {
if (!("speechSynthesis" in window)) return;
try {
window.speechSynthesis.cancel();
const cleanText = String(texto).replace(/([\u2700-\u27BF]|[\uE000-\uF8FF]|\uD83C[\uDC00-\uDFFF]|\uD83D[\uDC00-\uDFFF]|[\u2011-\u26FF]|\uD83E[\uDD00-\uDDFF])/g, '').replace(/https?://\S+/g, "").trim();
if (!cleanText) return;
​const utterance = new SpeechSynthesisUtterance(cleanText);
utterance.lang = "pt-BR";
​const prof = customProfile || globalVoiceProfile;
if (prof === 'humana') {
utterance.rate = 1.0;
utterance.pitch = 1.25;
} else {
utterance.rate = 1.02;
utterance.pitch = 1.05;
}
​const voices = window.speechSynthesis.getVoices();
const selectedVoice = voices.find(v => v.lang.toLowerCase().includes('pt-br') && v.name.toLowerCase().includes('female')) || voices.find(v => v.lang.toLowerCase().includes('pt')) || voices[0];
if (selectedVoice) utterance.voice = selectedVoice;
window.speechSynthesis.speak(utterance);
} catch(e) {}
}

​const sha256 = async (str) => {

return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, '0')).join('');
};

setProtAtual(prot);
return { protocolo: prot, hash };
};

​const initDualAudio = () => {

if(!d.ctx) d.ctx = new (window.AudioContext || window.webkitAudioContext)();
if(d.ctx.state === 'suspended') d.ctx.resume();
};
​const pararDualAudio = () => {
const d = dualAudioRef.current;
if(d.sireneInt) clearInterval(d.sireneInt);
if(d.timerInt) clearInterval(d.timerInt);
if(d.osc) try { d.osc.stop(); } catch(e) {}
d.osc = null;
setStatusDual('SISTEMA PARADO');
setTimerDualText('00:00');
};
​const ativarAlarmeDual = () => {
initDualAudio();
pararDualAudio();
const d = dualAudioRef.current;
d.etapa = 0;
d.seg = 180;
​if (tipoAlarme === 'RUSSO') {
setStatusDual('RUSSO TOCANDO - 3 MIN - SIRENE MILITAR');
let freq = 400, subindo = true;
d.osc = d.ctx.createOscillator();
d.gain = d.ctx.createGain();
d.osc.type = 'sawtooth';
d.osc.frequency.setValueAtTime(freq, d.ctx.currentTime);
d.osc.connect(d.gain); d.gain.connect(d.ctx.destination);
d.osc.start();
d.sireneInt = setInterval(() => {
if (subindo) { freq += 40; if (freq >= 1200) subindo = false; }
else { freq -= 40; if (freq <= 400) subindo = true; }
if(d.osc) d.osc.frequency.setValueAtTime(freq, d.ctx.currentTime);
}, 100);
} else if (tipoAlarme === 'AMERICANO') {
setStatusDual('AMERICANO TOCANDO - 3 MIN - HI-LO');
let high = true;
d.osc = d.ctx.createOscillator();
d.gain = d.ctx.createGain();
d.osc.type = 'square';
d.osc.frequency.setValueAtTime(600, d.ctx.currentTime);
d.osc.connect(d.gain); d.gain.connect(d.ctx.destination);
d.osc.start();
d.sireneInt = setInterval(() => {
high = !high;
if(d.osc) d.osc.frequency.setValueAtTime(high ? 900 : 500, d.ctx.currentTime);
}, 400);
} else {
setStatusDual('CEMADEN TOCANDO - 3 MIN - PULSO RÁPIDO');
let beep = true;
d.osc = d.ctx.createOscillator();
d.gain = d.ctx.createGain();
d.osc.type = 'sine';
d.osc.frequency.setValueAtTime(880, d.ctx.currentTime);
d.osc.connect(d.gain); d.gain.connect(d.ctx.destination);
d.osc.start();
d.sireneInt = setInterval(() => {
beep = !beep;
if(d.gain) d.gain.gain.setValueAtTime(beep ? 0.3 : 0, d.ctx.currentTime);
}, 250);
}
​d.timerInt = setInterval(() => {
d.seg--;
let m = Math.floor(d.seg / 60), s = d.seg % 60;
setTimerDualText(${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')});
if(d.seg <= 0) pararDualAudio();
}, 1000);
};
