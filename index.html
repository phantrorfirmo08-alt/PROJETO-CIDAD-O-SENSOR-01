body{margin:0;font-family:system-ui;background:#0f0f1a;color:#fff;display:flex;flex-direction:column;height:100vh}
header{background:#6c4cff;padding:14px;display:flex;align-items:center;gap:12px}
header img{width:56px;height:56px;border-radius:50%;border:2px solid #fff;object-fit:cover}
#chat{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:12px}
.msg{max-width:85%;padding:12px 16px;border-radius:18px}
.user{align-self:flex-end;background:#6c4cff}
.bot{align-self:flex-start;background:#1e1e3a;display:flex;gap:8px;align-items:center}
.bot img{width:32px;height:32px;border-radius:50%}
footer{display:flex;padding:12px;gap:8px;background:#1a1a2e}
input{flex:1;padding:12px;border-radius:24px;border:none;background:#2a2a45;color:#fff}
button{background:#6c4cff;border:none;color:#fff;padding:0 20px;border-radius:24px}
