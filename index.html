<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>SARAH AI - ESTADUAL 92 MUNICÍPIOS V13 PRO</title>
<script src="https://cdn.tailwindcss.com"></script>
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script crossorigin src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
 body{background:#02040A;color:#E5E7EB;font-family:'JetBrains Mono',monospace}
 .panel{background:#0B1120;border:1px solid rgba(255,255,255,.1);border-radius:18px}
 .label{font-size:10px;letter-spacing:.08em;font-weight:700;color:#64748B;text-transform:uppercase}
 .x{position:absolute;top:4px;right:4px;width:20px;height:20px;background:#111;color:#fff;border-radius:50%;display:grid;place-items:center;font-weight:900;border:1px solid #fff;cursor:pointer;font-size:11px}
</style>
</head>
<body class="p-3 flex justify-center"><div id="root" class="w-full max-w-[560px]"></div>
<script type="text/babel">
const {useState,useRef,useEffect}=React;

// Lista completa dos 92 Municípios do Estado do Rio de Janeiro
const MUNICIPIOS_RJ = [
  "Angra dos Reis", "Aperibé", "Araruama", "Areal", "Armação dos Búzios", "Arraial do Cabo", "Barra do Piraí", "Barra Mansa", "Belford Roxo", "Bom Jardim", "Bom Jesus do Itabapoana", "Cabo Frio", "Cachoeiras de Macacu", "Cambuci", "Campos dos Goytacazes", "Cantagalo", "Carapebus", "Comendador Levy Gasparian", "Campos dos Goytacazes", "Cardoso Moreira", "Carmo", "Casimiro de Abreu", "Duas Barras", "Duque de Caxias", "Engenheiro Paulo de Frontin", "Guapimirim", "Iguaba Grande", "Itaboraí", "Itaguaí", "Italva", "Itaocara", "Itaperuna", "Itatiaia", "Japeri", "Laje do Muriaé", "Macaé", "Macuco", "Magé", "Mangaratiba", "Maricá", "Mendes", "Mesquita", "Miguel Pereira", "Miracema", "Natividade", "Nilópolis", "Niterói", "Nova Friburgo", "Nova Iguaçu", "Paracambi", "Paraíba do Sul", "Paraty", "Paty do Alferes", "Petrópolis", "Pinheiral", "Piraí", "Porciúncula", "Porto Real", "Quatis", "Queimados", "Quissamã", "Resende", "Rio Bonito", "Rio Claro", "Rio das Ostras", "Rio de Janeiro", "Santa Maria Madalena", "Santo Antônio de Pádua", "São Francisco de Itabapoana", "São Fidélis", "São Gonçalo", "São João da Barra", "São João de Meriti", "São José de Ubá", "São José do Vale do Rio Preto", "São Pedro da Aldeia", "São Sebastião do Alto", "Sapucaia", "Saquarema", "Seropédica", "Silva Jardim", "Sumidouro", "Tanguá", "Teresópolis", "Trajano de Moraes", "Três Rios", "Valença", "Varre-Sai", "Vassouras", "Volta Redonda"
].sort();

const RISCOS=["R1 - BAIXO / PREVENTIVO","R2 - MODERADO / ATENCAO","R3 - ALTO / ALERTA","R4 - IMINENTE / EVACUACAO","RH - HIDROLOGICO","RE - ESTRUTURAL"];
const ORGAOS=["COMPDEC / SEDEC-RJ (ESTADUAL)","DEFESA CIVIL MUNICIPAL","GADE - CHAVE DA ESPERANCA","BOM DIA COMUNIDADE","CIDADAO SENSOR (RCS)","INEA / SERLA","CEMADEN / INPE","NUPDECs ESTADUAIS","CIDADAO - PARTICIPACAO DIRETA"];

function App(){
 const [aba,setAba]=useState('vistoria'); // 'vistoria' | 'ia_estadual' | 'historico' | 'cloudflare_sync'
 const [mun,setMun]=useState("Mesquita"); 
 const [fotos,setFotos]=useState([]); 
 const [camOn,setCamOn]=useState(false); 
 const [nome,setNome]=useState('Alexander da Silva Firmo'); 
 const [docId,setDocId]=useState('Voluntário Defesa Civil RJ'); 
 const [bairro,setBairro]=useState('Rocha Sobrinho'); 
 const [risco,setRisco]=useState(RISCOS[0]); 
 const [org,setOrg]=useState(ORGAOS[0]); 
 const [rel,setRel]=useState(''); 
 const [ia,setIa]=useState('');
 const [perguntaIA,setPerguntaIA]=useState('');
 const [respostaIA,setRespostaIA]=useState('');
 const [historicoVistorias,setHistoricoVistorias]=useState([]);
 const [cfUrl,setCfUrl]=useState('https://seu-worker.seu-subdominio.workers.dev/api/vistorias');
 const [cfToken,setCfToken]=useState('');
 const [statusSync,setStatusSync]=useState('');
 const videoRef=useRef(null); const streamRef=useRef(null);

 useEffect(()=>{
   const salvo=localStorage.getItem('sarah_vistorias_estadual');
   if(salvo) setHistoricoVistorias(JSON.parse(salvo));
 },[]);

 const startCam=async()=>{
   try{
     const s=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:"environment"}, width:{ideal:1280}, height:{ideal:720}}});
     streamRef.current=s; setCamOn(true);
     setTimeout(()=>{ if(videoRef.current){ videoRef.current.srcObject=s; videoRef.current.onloadedmetadata=()=>videoRef.current.play().catch(()=>{}); } },150);
   }catch(e){ alert('PERMITA CAMERA - HTTPS OBRIGATORIO'); }
 };
 const stopCam=()=>{ if(streamRef.current) streamRef.current.getTracks().forEach(t=>t.stop()); if(videoRef.current) videoRef.current.srcObject=null; setCamOn(false); };

 const capturar=()=>{
   const v=videoRef.current; if(!v || v.videoWidth===0){ alert('AGUARDE FOCAR'); return; }
   const c=document.createElement('canvas'); c.width=400; c.height=Math.round(400*(v.videoHeight/v.videoWidth));
   const ctx=c.getContext('2d'); ctx.drawImage(v,0,0,c.width,c.height);
   ctx.fillStyle='rgba(0,0,0,0.9)'; ctx.fillRect(0,c.height-36,c.width,36);
   ctx.fillStyle='#FFFFFF'; ctx.font='700 9px monospace';
   ctx.fillText(`${new Date().toLocaleString('pt-BR')} | ${mun} - RJ | ${bairro}`,6,c.height-12);
   const url=c.toDataURL('image/jpeg',0.35);
   setFotos(p=>[...p,url]);
   setIa(`SARAH-AI ESTADUAL: MONITORAMENTO ATIVO EM ${mun.toUpperCase()}`);
 };

 const gerarPDFBlob=async(prot,hash)=>{
   const {jsPDF}=window.jspdf; const doc=new jsPDF('p','mm','a4');
   doc.setFillColor(8,12,20); doc.rect(0,0,210,297,'F');
   doc.setTextColor(255,255,255); doc.setFont('helvetica','bold'); doc.setFontSize(11);
   doc.text(`SARAH AI - LAUDO ESTADUAL RJ - ${prot}`,10,14);
   doc.setFont('helvetica','normal'); doc.setFontSize(9);
   doc.text(`RESPONSAVEL: ${nome} | CRED: ${docId}`,10,20);
   doc.text(`MUNICIPIO: ${mun} - RJ | BAIRRO: ${bairro}`,10,25);
   doc.text(`RISCO: ${risco} | ORGAO DESTINO: ${org}`,10,30);
   doc.setFont('helvetica','bold'); doc.text('RELATO TÉCNICO:',10,38);
   doc.setFont('helvetica','normal'); const linhas=doc.splitTextToSize(rel||'Sem observações.',190); doc.text(linhas,10,43);
   let y=58; doc.setFont('helvetica','bold'); doc.text('EVIDENCIA FOTOGRAFICA:',10,y); y+=4;
   for(let i=0;i<fotos.length;i++){
     if(y>210){ doc.addPage(); doc.setFillColor(8,12,20); doc.rect(0,0,210,297,'F'); y=10; }
     try{ doc.addImage(fotos[i],'JPEG',10+(i%2)*95,y,88,50); }catch{}
     if(i%2==1) y+=55; else if(i==fotos.length-1) y+=55;
   }
   doc.setFontSize(6); doc.setTextColor(130,130,130); doc.text(`HASH SHA-256: ${hash}`,10,288); doc.text(`REDE ESTADUAL DE DEFESA CIVIL - 92 MUNICIPIOS RJ`,10,292);
   return doc.output('blob');
 };

 const salvarRegistroLocal=(prot,hash)=>{
   const novaVistoria={ prot, data:new Date().toLocaleString('pt-BR'), municipio:mun, bairro, risco, hash:hash.slice(0,16), fotos:fotos.length, sincronizado:false };
   const atualizado=[novaVistoria,...historicoVistorias];
   setHistoricoVistorias(atualizado);
   localStorage.setItem('sarah_vistorias_estadual',JSON.stringify(atualizado));
 };

 const enviarRelatorioFotos=async()=>{
   if(!bairro){ alert('PREENCHA O BAIRRO'); return; }
   if(fotos.length===0){ alert('CAPTURE UMA FOTO'); return; }
   const prot=`PROT-RJ-${mun.slice(0,3).toUpperCase()}-2026-${Math.floor(Math.random()*8999+1000)}`;
   const raw=`${prot}-${nome}-${Date.now()}`; const buf=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(raw)); const hash=Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
   
   salvarRegistroLocal(prot,hash);
   const texto=`SARAH AI - RELATÓRIO ESTADUAL RJ\nPROTOCOLO: ${prot}\nMUNICÍPIO: ${mun} - RJ\nBAIRRO: ${bairro}\nRISCO: ${risco}\nÓRGÃO: ${org}\nRELATO: ${rel}\nHASH: ${hash.slice(0,20)}`;
   
   const fotoFiles=await Promise.all(fotos.map(async (d,i)=>{ const r=await fetch(d); const b=await r.blob(); return new File([b], `FOTO_${i+1}_${prot}.jpg`, {type:'image/jpeg'}); }));
   if(navigator.canShare && navigator.canShare({files: fotoFiles})){
     await navigator.share({title: prot, text: texto, files: fotoFiles});
   } else {
     window.open(`https://wa.me/?text=${encodeURIComponent(texto)}`,'_blank');
   }
 };

 // ENVIO REAL PARA A CLOUDFLARE WORKER / API
 const sincronizarCloudflareEdge=async()=>{
   if(historicoVistorias.length===0){ alert('NENHUM REGISTRO PARA SINCRONIZAR'); return; }
   setStatusSync('Transmitindo para Cloudflare Edge...');
   try {
     const payload={
       projeto: "SARAH AI - ESTADUAL 92 MUNICIPIOS",
       totalRegistros: historicoVistorias.length,
       registros: historicoVistorias,
       timestamp: new Date().toISOString()
     };

     const resposta = await fetch(cfUrl, {
       method: 'POST',
       headers: {
         'Content-Type': 'application/json',
         'Authorization': `Bearer ${cfToken}`
       },
       body: JSON.stringify(payload)
     });

     if(resposta.ok){
       setStatusSync('Sincronizado com sucesso na Cloudflare!');
       const atualizado = historicoVistorias.map(v=>({...v, sincronizado:true}));
       setHistoricoVistorias(atualizado);
       localStorage.setItem('sarah_vistorias_estadual',JSON.stringify(atualizado));
     } else {
       setStatusSync('Erro na resposta da API Cloudflare.');
     }
   } catch(err){
     setStatusSync('Falha de rede ao conectar na Cloudflare Worker.');
   }
 };

 const consultarIAEstadual=()=>{
   if(!perguntaIA){ alert('DIGITE SUA DUVIDA'); return; }
   setRespostaIA('Consultando base de dados estadual e diretrizes de defesa civil...');
   setTimeout(()=>{
     setRespostaIA(`SARAH AI (Especialista RJ): Para o município de ${mun}, analise os índices pluviométricos do CEMADEN, verifique o plano de contingência municipal e acione os canais oficiais da SEDEC-RJ em caso de alerta R3 ou R4.`);
   }, 1000);
 };

 return (
 <div className="panel p-3 space-y-3">
   <div className="flex justify-between items-center border-b border-white/10 pb-2">
     <div>
       <h1 className="text-xs font-black tracking-wider text-cyan-400">SARAH AI - 92 MUNICÍPIOS DO RJ</h1>
       <p className="text-[9px] text-slate-500">Rede Estadual de Inteligência Cívica & Defesa Civil</p>
     </div>
     <button onClick={stopCam} className="text-[10px] border border-white/10 px-2 py-1 rounded">RESET</button>
   </div>

   {/* ABAS */}
   <div className="grid grid-cols-4 gap-1 bg-black p-1 rounded-xl border border-white/10 text-center">
     <button onClick={()=>setAba('vistoria')} className={`py-2 text-[9px] font-bold rounded-lg transition ${aba==='vistoria'?'bg-cyan-600 text-slate-950':'text-slate-400'}`}>VISTORIA</button>
     <button onClick={()=>setAba('ia_estadual')} className={`py-2 text-[9px] font-bold rounded-lg transition ${aba==='ia_estadual'?'bg-cyan-600 text-slate-950':'text-slate-400'}`}>CONSULTOR</button>
     <button onClick={()=>setAba('historico')} className={`py-2 text-[9px] font-bold rounded-lg transition ${aba==='historico'?'bg-cyan-600 text-slate-950':'text-slate-400'}`}>DADOS ({historicoVistorias.length})</button>
     <button onClick={()=>setAba('cloudflare_sync')} className={`py-2 text-[9px] font-bold rounded-lg transition ${aba==='cloudflare_sync'?'bg-cyan-600 text-slate-950':'text-slate-400'}`}>CLOUDFLARE</button>
   </div>

   {/* ABA 1: VISTORIA */}
   {aba==='vistoria' && (
     <div className="space-y-3">
       <div>
         <label className="label mb-1 block">Selecione o Município (Estado do RJ - 92 Cidades):</label>
         <select value={mun} onChange={e=>setMun(e.target.value)} className="w-full bg-black border border-white/10 rounded-xl p-3 text-xs text-white">
           {MUNICIPIOS_RJ.map((m,i)=><option key={i} value={m}>{m} - RJ</option>)}
         </select>
       </div>

       <div className="bg-black border border-white/10 rounded-xl p-2 space-y-2">
         <div className="flex justify-between items-center">
           <p className="label">Câmera Georreferenciada</p>
           {!camOn ? 
             <button onClick={startCam} className="text-[10px] border border-white/20 px-3 py-1 rounded-lg bg-white text-black font-bold">LIGAR CÂMERA</button> : 
             <button onClick={stopCam} className="text-[10px] border border-red-500/30 text-red-300 px-3 py-1 rounded-lg">DESLIGAR</button>
           }
         </div>
         <div className="bg-[#080A12] rounded-lg overflow-hidden" style={{minHeight:'200px'}}>
           <video ref={videoRef} autoPlay playsInline muted style={{width:'100%',height:'200px',objectFit:'cover',background:'#000',display:camOn?'block':'none'}}></video>
           {!camOn && <div className="h-[200px] grid place-items-center text-[11px] text-slate-600">CÂMERA DESLIGADA</div>}
         </div>
         {camOn && <button onClick={capturar} className="w-full py-3 bg-cyan-500 text-slate-950 font-black rounded-xl text-xs tracking-wide">CAPTURAR EVIDÊNCIA</button>}
         {fotos.length>0 && <div className="flex gap-2 overflow-x-auto">{fotos.map((f,i)=><div key={i} className="relative shrink-0"><img src={f} className="w-20 h-20 object-cover rounded-lg border border-white/20"/><div className="x" onClick={()=>setFotos(fotos.filter((_,idx)=>idx!==i))}>X</div></div>)}</div>}
         <p className="label" style={{fontSize:'9px'}}>{ia||'AGUARDANDO CAPTURA'}</p>
       </div>

       <input value={nome} onChange={e=>setNome(e.target.value)} placeholder="RESPONSÁVEL TÉCNICO / VOLUNTÁRIO *" className="w-full bg-black border border-white/10 rounded-xl p-3 text-xs"/>
       <div className="grid grid-cols-2 gap-2">
         <input value={docId} onChange={e=>setDocId(e.target.value)} placeholder="CREDENCIA / ID" className="bg-black border border-white/10 rounded-xl p-3 text-xs"/>
         <input value={bairro} onChange={e=>setBairro(e.target.value)} placeholder="BAIRRO / LOCALIDADE *" className="bg-black border border-white/10 rounded-xl p-3 text-xs"/>
       </div>
       <div className="grid grid-cols-2 gap-2">
         <select value={risco} onChange={e=>setRisco(e.target.value)} className="bg-black border border-white/10 rounded-xl p-3 text-[11px]">{RISCOS.map((r,i)=><option key={i}>{r}</option>)}</select>
         <select value={org} onChange={e=>setOrg(e.target.value)} className="w-full bg-black border border-white/10 rounded-xl p-3 text-[11px]">{ORGAOS.map((o,i)=><option key={i}>{o}</option>)}</select>
       </div>
       <textarea value={rel} onChange={e=>setRel(e.target.value)} rows="3" placeholder="RELATO TÉCNICO (Erosão, bueiro, árvore, alagamento...)" className="w-full bg-black border border-white/10 rounded-xl p-3 text-xs"></textarea>
       
       <div className="grid grid-cols-1 gap-2 pt-2">
         <button onClick={enviarRelatorioFotos} className="w-full py-3.5 bg-[#25D366] text-black font-black rounded-xl text-[12px] tracking-wide">ENVIAR RELATÓRIO ESTADUAL (WHATSAPP)</button>
         <button onClick={async()=>{
           if(!bairro){alert('Preencha o bairro');return;}
           if(fotos.length===0){alert('Capture uma foto');return;}
           const prot=`PROT-RJ-${mun.slice(0,3).toUpperCase()}-2026-${Math.floor(Math.random()*8999+1000)}`;
           const raw=`${prot}-${nome}-${Date.now()}`; const buf=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(raw)); const hash=Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
           salvarRegistroLocal(prot,hash);
           const blob=await gerarPDFBlob(prot,hash);
           const url=URL.createObjectURL(blob); window.open(url,'_blank');
         }} className="w-full py-3.5 bg-white text-black font-black rounded-xl text-[12px] tracking-wide">GERAR LAUDO PDF OFICIAL</button>
       </div>
     </div>
   )}

   {/* ABA 2: CONSULTOR IA ESTADUAL */}
   {aba==='ia_estadual' && (
     <div className="space-y-3">
       <p className="label">ASSISTENTE DE INTELIGÊNCIA ARTIFICIAL - RJ</p>
       <div className="bg-black border border-white/10 p-3 rounded-xl space-y-3 text-xs">
         <p className="text-slate-300">Tire dúvidas sobre protocolos de mitigação, gestão de riscos e resposta rápida para qualquer um dos 92 municípios do estado.</p>
         <input value={perguntaIA} onChange={e=>setPerguntaIA(e.target.value)} placeholder="Ex: Como proceder em risco de erosão fluvial na Baixada ou Região Serrana?" className="w-full bg-slate-950 border border-white/10 rounded-xl p-3 text-xs text-white"/>
         <button onClick={consultarIAEstadual} className="w-full py-3 bg-cyan-600 hover:bg-cyan-500 text-slate-950 font-black rounded-xl tracking-wide">CONSULTAR IA</button>
       </div>
       {respostaIA && (
         <div className="bg-slate-900 border border-cyan-800 p-3 rounded-xl text-xs space-y-1">
           <p className="font-bold text-cyan-400">RESPOSTA DO ESPECIALISTA IA:</p>
           <p className="text-slate-300 leading-relaxed">{respostaIA}</p>
         </div>
       )}
     </div>
   )}

   {/* ABA 3: HISTÓRICO LOCAL */}
   {aba==='historico' && (
     <div className="space-y-3">
       <p className="label">REGISTROS SALVOS NO DISPOSITIVO</p>
       {historicoVistorias.length===0 ? (
         <div className="p-6 text-center text-xs text-slate-500 border border-white/10 rounded-xl">Nenhum registro armazenado.</div>
       ) : (
         <div className="space-y-2 max-h-[380px] overflow-y-auto">
           {historicoVistorias.map((item,idx)=>(
             <div key={idx} className="bg-black border border-white/10 p-3 rounded-xl space-y-1 text-xs">
               <div className="flex justify-between text-cyan-400 font-bold">
                 <span>{item.prot}</span>
                 <span className={`text-[9px] px-1.5 py-0.5 rounded ${item.sincronizado?'bg-emerald-950 text-emerald-300':'bg-amber-950 text-amber-300'}`}>
                   {item.sincronizado ? 'SYNC NUVEM' : 'PENDENTE'}
                 </span>
               </div>
               <div className="text-slate-300">Município: {item.municipio}-RJ | Bairro: {item.bairro}</div>
               <div className="text-amber-400 text-[11px]">Risco: {item.risco}</div>
               <div className="text-[10px] text-slate-500">Hash: {item.hash}... | Fotos: {item.fotos}</div>
             </div>
           ))}
         </div>
       )}
       <button onClick={()=>{localStorage.removeItem('sarah_vistorias_estadual'); setHistoricoVistorias([]);}} className="w-full py-2 bg-red-950/40 border border-red-800/50 text-red-300 rounded-xl text-[10px]">LIMPAR HISTÓRICO</button>
     </div>
   )}

   {/* ABA 4: CLOUDFLARE API SYNC */}
   {aba==='cloudflare_sync' && (
     <div className="space-y-3">
       <p className="label">CONFIGURAÇÃO DE API CLOUDFLARE EDGE</p>
       <div className="bg-black border border-white/10 p-3 rounded-xl space-y-3 text-xs">
         <div>
           <label className="text-[10px] text-slate-400 block mb-1">URL do Cloudflare Worker:</label>
           <input value={cfUrl} onChange={e=>setCfUrl(e.target.value)} className="w-full bg-slate-950 border border-white/10 rounded-lg p-2.5 text-xs text-white" placeholder="https://..." />
         </div>
         <div>
           <label className="text-[10px] text-slate-400 block mb-1">Chave de Acesso (Bearer Token):</label>
           <input type="password" value={cfToken} onChange={e=>setCfToken(e.target.value)} className="w-full bg-slate-950 border border-white/10 rounded-lg p-2.5 text-xs text-white" placeholder="Sua chave secreta" />
         </div>
         <button onClick={sincronizarCloudflareEdge} className="w-full py-3 bg-cyan-600 hover:bg-cyan-500 text-slate-950 font-black rounded-xl tracking-wide">
           SINCRONIZAR COM A CLOUDFLARE AGORA
         </button>
         {statusSync && <p className="text-center text-[11px] text-cyan-300">{statusSync}</p>}
       </div>
       <p className="text-[8px] text-slate-500 text-center">Os relatórios de campo de qualquer cidade do RJ são enviados de forma segura para a sua infraestrutura na borda.</p>
     </div>
   )}

   <p className="text-[8px] text-slate-600 text-center tracking-widest pt-2">SARAH AI - ESTADUAL 92 MUNICÍPIOS DO RIO DE JANEIRO</p>
 </div>
 );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
