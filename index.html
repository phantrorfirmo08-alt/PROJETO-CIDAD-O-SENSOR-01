<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>RARU NEXUS AI V11 Plus - Central Oficial</title>
<script src="https://cdn.tailwindcss.com"></script>
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script crossorigin src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
  .panel-dia { background: #0B1120; border: 1px solid rgba(255,255,255,.15); border-radius: 18px; color: #E5E7EB; }
  .panel-noite { background: #030712; border: 1px solid rgba(59,130,246,.3); border-radius: 18px; color: #93C5FD; box-shadow: 0 0 25px rgba(29,78,216,0.2); }
  .label { font-size: 11px; letter-spacing: .08em; font-weight: 800; color: #94A3B8; text-transform: uppercase; }
  .btn { width: 100%; padding: 14px; border-radius: 14px; font-weight: 900; font-size: 12px; letter-spacing: .04em; }
  .x { position: absolute; top: 4px; right: 4px; width: 20px; height: 20px; background: #111; color: #fff; border-radius: 50%; display: grid; place-items: center; font-weight: 900; border: 1px solid #fff; cursor: pointer; font-size: 11px; }
  @keyframes pisca { 0%,100% { opacity: 1; transform: scale(1); } 50% { opacity: .7; transform: scale(1.02); } }
  .pisca { animation: pisca 1.5s infinite; }
  @keyframes hudPulse { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.6; transform: scale(1.05); } }
  .animate-hud-pulse { animation: hudPulse 2s infinite; }
  ::-webkit-scrollbar { width: 6px; height: 6px; }
  ::-webkit-scrollbar-track { background: #02040A; border-radius: 8px; }
  ::-webkit-scrollbar-thumb { background: #1E293B; border-radius: 8px; }
</style>
</head>
<body id="corpo-pagina" class="p-2 flex justify-center transition-colors duration-700">
<div id="root" class="w-full max-w-[720px]"></div>

<script type="text/babel">
const {useState, useRef, useEffect} = React;
const SARAH_AVATAR = "https://cdn.imagetourls.com/uploads/tyImg/195w5uur9.png";

const MUNICIPIOS_RJ_92 = [
  "Angra dos Reis", "Aperibé", "Araruama", "Areal", "Armação dos Búzios", "Arraial do Cabo", "Barra do Piraí", "Barra Mansa", "Belford Roxo", "Bom Jardim", "Bom Jesus do Itabapoana", "Cabo Frio", "Cachoeiras de Macacu", "Cambuci", "Campos dos Goytacazes", "Cantagalo", "Carapebus", "Comendador Levy Gasparian", "Cardoso Moreira", "Carmo", "Casimiro de Abreu", "Duas Barras", "Duque de Caxias", "Engenheiro Paulo de Frontin", "Guapimirim", "Iguaba Grande", "Itaboraí", "Itaguaí", "Italva", "Itaocara", "Itaperuna", "Itatiaia", "Japeri", "Laje do Muriaé", "Macaé", "Macuco", "Magé", "Mangaratiba", "Maricá", "Mendes", "Mesquita", "Miguel Pereira", "Miracema", "Natividade", "Nilópolis", "Niterói", "Nova Friburgo", "Nova Iguaçu", "Paracambi", "Paraíba do Sul", "Paraty", "Paty do Alferes", "Petrópolis", "Pinheiral", "Piraí", "Porciúncula", "Porto Real", "Quatis", "Queimados", "Quissamã", "Resende", "Rio Bonito", "Rio Claro", "Rio das Ostras", "Rio de Janeiro", "Santa Maria Madalena", "Santo Antônio de Pádua", "São Francisco de Itabapoana", "São Fidélis", "São Gonçalo", "São João da Barra", "São João de Meriti", "São José de Ubá", "São José do Vale do Rio Preto", "São Pedro da Aldeia", "São Sebastião do Alto", "Sapucaia", "Saquarema", "Seropédica", "Silva Jardim", "Sumidouro", "Tanguá", "Teresópolis", "Trajano de Moraes", "Três Rios", "Valença", "Varre-Sai", "Vassouras", "Volta Redonda"
].sort();

const ORGAOS_OFICIAIS = [
  "COMPDEC / Defesa Civil Municipal",
  "SEDEC-RJ / Defesa Civil Estadual",
  "GADE - Grupo Comunitário A Chave da Esperança",
  "CEMADEN (Centro Nacional de Monitoramento e Alertas)",
  "INEA (Instituto Estadual do Ambiente)",
  "CRAS / Assistência Social Municipal",
  "NUPDEC (Núcleo Comunitário de Defesa Civil)"
];

const RISCOS_VISTORIA = [
  "R1 - BAIXO / PREVENTIVO (Normal)",
  "R2 - MODERADO / ATENCAO (Observacao)",
  "R3 - ALTO / ALERTA (Risco Elevado)",
  "R4 - IMINENTE / EVACUACAO (Critico)",
  "RH - HIDROLOGICO (Alagamento de Bacia)",
  "RE - ESTRUTURAL (Geotecnia e Encosta)"
];

function App() {
  const [autenticado, setAutenticado] = useState(false);
  const [senha, setSenha] = useState('');
  const [erroSenha, setErroSenha] = useState(false);
  
  const [modoNoite, setModoNoite] = useState(false);
  const [horaAtualStr, setHoraAtualStr] = useState('');
  const [abaAtiva, setAbaAtiva] = useState('central'); 
  const [statusConexao, setStatusConexao] = useState(navigator.onLine ? 'ONLINE' : 'OFFLINE (CONTINGÊNCIA)');

  const [mun, setMun] = useState("Mesquita");
  const [urlCloudflare, setUrlCloudflare] = useState('https://solitary-snow-2459.phantrorfirmo08.workers.dev/');

  const [orgaoSelecionado, setOrgaoSelecionado] = useState(ORGAOS_OFICIAIS[0]);

  const [meteo, setMeteo] = useState({
    temperatura: "27°C", umidade: "78%", chuvaMm: "14.2 mm/h", pressao: "1012 hPa", ventoVel: "22 km/h",
    condicao: "Instável / Pancadas Isoladas"
  });

  const [iaLaudo, setIaLaudo] = useState("Cérebro neural ativado. Selecione qualquer município para iniciar a análise da telemetria...");
  const [nivelAlertaCor, setNivelAlertaCor] = useState("bg-emerald-500");
  const [nivelAlertaTexto, setNivelAlertaTexto] = useState("R1 - NORMAL / PREVENTIVO");
  const [falarVoz, setFalarVoz] = useState(true);
  const [processandoWorker, setProcessandoWorker] = useState(false);

  // Chat Sarah
  const [chatAberto, setChatAberto] = useState(false);
  const [mensagensChat, setMensagensChat] = useState([
    { sender: 'sarah', text: 'Olá, Alexander! Sou a Sarah, sua IA de Defesa Civil pronta para operar na rede dos 92 municípios do RJ.' }
  ]);
  const [inputChat, setInputChat] = useState('');

  // Vistoria & Câmera Offline & Histórico
  const [fotosVistoria, setFotosVistoria] = useState([]);
  const [camOn, setCamOn] = useState(false);
  const [nomeAgente, setNomeAgente] = useState('Alexander da Silva Firmo');
  const [bairroVistoria, setBairroVistoria] = useState('Sebinho / Rocha Sobrinho');
  const [riscoVistoria, setRiscoVistoria] = useState(RISCOS_VISTORIA[0]);
  const [relatoVistoria, setRelatoVistoria] = useState('');
  const [coordsGPS, setCoordsGPS] = useState({lat: -22.7858, lon: -43.4294});
  const [analisandoIA, setAnalisandoIA] = useState(false);
  
  const [historicoVistorias, setHistoricoVistorias] = useState(() => {
    try { return JSON.parse(localStorage.getItem('raru_vistorias_v11plus') || '[]'); } catch { return []; }
  });

  const videoRef = useRef(null);
  const streamRef = useRef(null);

  // Cadastros GADE
  const [cadastros, setCadastros] = useState(() => {
    try { return JSON.parse(localStorage.getItem('raru_cadastros_offline') || '[{"id":1,"nome":"Alexander da Silva Firmo","municipio":"Mesquita","bairro":"Sebinho / Rocha Sobrinho","papel":"Agente / Coordenador GADE","data":"2026-07-15"}]'); } catch { return []; }
  });
  const [novoNomeCad, setNovoNomeCad] = useState('');
  const [novoBairroCad, setNovoBairroCad] = useState('');
  const [novoPapelCad, setNovoPapelCad] = useState('Morador / Voluntário');

  // Sirenes
  const [statusBR, setStatusBR] = useState('AGUARDANDO');
  const [timerBR, setTimerBR] = useState('00:00 / 05:00');
  const [statusRU, setStatusRU] = useState('AGUARDANDO');
  const [timerRU, setTimerRU] = useState('00:00 / 05:00');

  const audioCtxRef = useRef(null);
  const oscRef = useRef(null);
  const intervalRef = useRef(null);

  useEffect(() => {
    const checarConexao = () => setStatusConexao(navigator.onLine ? 'ONLINE (NUVEM)' : 'OFFLINE (CONTINGÊNCIA)');
    window.addEventListener('online', checarConexao);
    window.addEventListener('offline', checarConexao);

    const checarHorario = () => {
      const now = new Date();
      const hora = now.getHours();
      const min = now.getMinutes();
      const segundos = now.getSeconds();
      setHoraAtualStr(`${hora.toString().padStart(2,'0')}:${min.toString().padStart(2,'0')}:${segundos.toString().padStart(2,'0')}`);
      
      if (hora >= 19 || hora < 6) {
        setModoNoite(true);
        document.body.style.backgroundColor = '#010308';
      } else {
        setModoNoite(false);
        document.body.style.backgroundColor = '#02040A';
      }
    };
    checarHorario();
    const timer = setInterval(checarHorario, 1000);

    if (navigator.geolocation) {
      navigator.geolocation.getCurrentPosition(
        (pos) => setCoordsGPS({lat: pos.coords.latitude, lon: pos.coords.longitude}),
        () => {}
      );
    }
    return () => {
      clearInterval(timer);
      window.removeEventListener('online', checarConexao);
      window.removeEventListener('offline', checarConexao);
    };
  }, []);

  useEffect(() => {
    try { localStorage.setItem('raru_vistorias_v11plus', JSON.stringify(historicoVistorias)); } catch {}
  }, [historicoVistorias]);

  useEffect(() => {
    try { localStorage.setItem('raru_cadastros_offline', JSON.stringify(cadastros)); } catch {}
  }, [cadastros]);

  const falarTextoIA = (texto) => {
    if (!falarVoz || !('speechSynthesis' in window)) return;
    window.speechSynthesis.cancel();
    const utterance = new SpeechSynthesisUtterance(texto);
    utterance.lang = 'pt-BR';
    utterance.rate = 1.0;
    utterance.pitch = 1.0;
    window.speechSynthesis.speak(utterance);
  };

  const enviarMensagemChat = (e) => {
    e.preventDefault();
    if (!inputChat.trim()) return;
    const txt = inputChat;
    setMensagensChat(p => [...p, { sender: 'user', text: txt }]);
    setInputChat('');
    setTimeout(() => {
      let resp = `Compreendido, Alexander. Monitoramento ativo em ${mun}.`;
      const lc = txt.toLowerCase();
      if (lc.includes('fé') || lc.includes('deus')) resp = "A fé sustenta o nosso caminhar e a nossa vigilância comunitária no GADE.";
      setMensagensChat(p => [...p, { sender: 'sarah', text: resp }]);
      falarTextoIA(resp);
    }, 700);
  };

  const startCam = async () => {
    try {
      const s = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: { ideal: "environment" }, width: { ideal: 1280 } }
      });
      streamRef.current = s;
      setCamOn(true);
      setTimeout(() => {
        if(videoRef.current) {
          videoRef.current.srcObject = s;
          videoRef.current.play().catch(() => {});
        }
      }, 150);
    } catch(e) {
      alert('Permissão de câmera negada.');
    }
  };

  const stopCam = () => {
    if(streamRef.current) streamRef.current.getTracks().forEach(t => t.stop());
    setCamOn(false);
  };

  const capturarFotoCampoOffline = () => {
    const v = videoRef.current;
    if(!v || v.videoWidth === 0) return;
    
    setAnalisandoIA(true);
    const c = document.createElement('canvas');
    c.width = 600;
    c.height = Math.round(600 * v.videoHeight / v.videoWidth);
    const ctx = c.getContext('2d');
    
    ctx.drawImage(v, 0, 0, c.width, c.height);
    
    ctx.fillStyle = 'rgba(0,0,0,0.92)';
    ctx.fillRect(0, c.height - 48, c.width, 48);
    
    ctx.fillStyle = '#60A5FA';
    ctx.font = '700 10px monospace';
    const dataHora = new Date().toLocaleString('pt-BR');
    ctx.fillText(`RARU NEXUS | GPS: ${coordsGPS.lat.toFixed(4)}, ${coordsGPS.lon.toFixed(4)} | ${riscoVistoria}`, 10, c.height - 28);
    
    ctx.fillStyle = '#FFFFFF';
    ctx.font = '700 9px monospace';
    ctx.fillText(`${dataHora} | LOCAL: ${bairroVistoria} | AGENTE: ${nomeAgente}`, 10, c.height - 12);
    
    const dataUrl = c.toDataURL('image/jpeg', 0.65);
    setFotosVistoria(p => [...p, dataUrl]);

    setTimeout(() => {
      setAnalisandoIA(false);
      falarTextoIA("Foto capturada e salva com carimbo.");
    }, 600);
  };

  const enviarParaWorkerEGerarLaudo = async () => {
    if (!relatoVistoria) { alert('Digite um relato de campo.'); return; }
    setProcessandoWorker(true);
    setIaLaudo("Enviando dados para o Cloudflare Worker e processando com Groq AI...");

    try {
      const payload = {
        municipio: mun,
        bairro: bairroVistoria,
        relato: relatoVistoria,
        responsavel: nomeAgente,
        risco: riscoVistoria,
        orgaoDestino: orgaoSelecionado,
        modo: "LAUDO_TECNICO"
      };

      const res = await fetch(urlCloudflare, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });

      const data = await res.json();
      if(data && (data.engenheiraChefeParecer || data.parecerEngenhariaECerebro || data.orientacaoAssistente)) {
        const textoParecer = data.engenheiraChefeParecer || data.parecerEngenhariaECerebro || data.orientacaoAssistente;
        setIaLaudo(`[IA WORKER • ${orgaoSelecionado}]: ${textoParecer}`);
        falarTextoIA("Laudo técnico processado pela inteligência artificial.");
        
        const prot = data.protocoloGerado || data.protocolo || `PROT-RJ-${mun.slice(0,3).toUpperCase()}-2026-${Math.floor(Math.random()*8999+1000)}`;
        const raw = `${prot}-${Date.now()}-${mun}`;
        const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(raw));
        const hash = Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2,'0')).join('');

        setHistoricoVistorias(prev => [{
          prot, data: new Date().toLocaleString('pt-BR'), municipio: mun, bairro: bairroVistoria, risco: riscoVistoria, hash: hash.slice(0,16), fotos: fotosVistoria.length, sincronizado: true
        }, ...prev]);

        gerarLaudoPDFComWorker(prot, textoParecer, hash);
      } else {
        throw new Error("Worker response invalid");
      }
    } catch(e) {
      setIaLaudo("[MODO CONTINGÊNCIA]: Worker offline. Gerando laudo executivo local.");
      gerarLaudoOfflinePDF();
    } finally {
      setProcessandoWorker(false);
    }
  };

  const gerarLaudoPDFComWorker = async (protocolo, parecerTexto, hash) => {
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF('p', 'mm', 'a4');
    
    doc.setFillColor(3, 7, 18);
    doc.rect(0, 0, 210, 297, 'F');
    
    doc.setTextColor(59, 130, 246);
    doc.setFont('helvetica', 'bold');
    doc.setFontSize(13);
    doc.text(`RARU NEXUS AI - LAUDO TÉCNICO OFICIAL (${protocolo})`, 10, 15);
    
    doc.setTextColor(148, 163, 184);
    doc.setFontSize(8);
    doc.text(`MUNICÍPIO: ${mun} - RJ`, 10, 21);
    doc.text(`AGENTE: ${nomeAgente} | BAIRRO: ${bairroVistoria} | ÓRGÃO: ${orgaoSelecionado}`, 10, 26);
    doc.text(`GPS: LAT ${coordsGPS.lat.toFixed(4)}, LON ${coordsGPS.lon.toFixed(4)} | DATA: ${new Date().toLocaleString('pt-BR')}`, 10, 31);
    
    doc.setTextColor(255, 255, 255);
    doc.setFont('helvetica', 'bold');
    doc.text(`PARECER TÉCNICO DA IA / WORKER:`, 10, 40);
    
    doc.setFont('helvetica', 'normal');
    doc.setFontSize(8.5);
    const linhasParecer = doc.splitTextToSize(parecerTexto, 190);
    doc.text(linhasParecer, 10, 47);

    let y = 120;
    for(let i = 0; i < fotosVistoria.length; i++) {
      if(y > 210) {
        doc.addPage();
        doc.setFillColor(3, 7, 18);
        doc.rect(0, 0, 210, 297, 'F');
        y = 15;
      }
      try { doc.addImage(fotosVistoria[i], 'JPEG', 10 + (i % 2) * 95, y, 88, 50); } catch {}
      if(i % 2 === 1) y += 58;
      else if(i === fotosVistoria.length - 1) y += 58;
    }

    doc.setFontSize(6);
    doc.setTextColor(100, 116, 139);
    doc.text(`HASH SHA-256: ${hash}`, 10, 290);

    const blob = doc.output('blob');
    const pdfFile = new File([blob], `${protocolo}.pdf`, {type:'application/pdf'});
    
    if(navigator.canShare && navigator.canShare({files:[pdfFile]})) {
      await navigator.share({title: protocolo, text: `Laudo Técnico ${protocolo}`, files:[pdfFile]});
    } else {
      window.open(URL.createObjectURL(blob), '_blank');
    }
  };

  const gerarLaudoOfflinePDF = async () => {
    const prot = `CONTINGENCIA-${Math.floor(Math.random()*899999+100000)}`;
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF('p', 'mm', 'a4');
    
    doc.setFillColor(3, 7, 18);
    doc.rect(0, 0, 210, 297, 'F');
    doc.setTextColor(239, 68, 68);
    doc.setFontSize(13);
    doc.text(`RARU NEXUS AI - RELATÓRIO LOCAL (${prot})`, 10, 15);
    
    doc.setTextColor(255, 255, 255);
    doc.setFontSize(9);
    doc.text(`Relato: ${relatoVistoria}`, 10, 30);

    const blob = doc.output('blob');
    window.open(URL.createObjectURL(blob), '_blank');
  };

  const enviarWhatsAppOffline = () => {
    const texto = `🚨 *RELATÓRIO DE VISTORIA - RARU NEXUS* 🚨\n📍 ${mun} - RJ\n📌 Bairro: ${bairroVistoria}\n👤 Agente: ${nomeAgente}\n⚠️ Risco: ${riscoVistoria}\n📋 Relato: ${relatoVistoria}`;
    window.open(`https://wa.me/?text=${encodeURIComponent(texto)}`, '_blank');
  };

  const fazerLogin = () => {
    if(senha === 'sarah2026') { setAutenticado(true); setErroSenha(false); }
    else { setErroSenha(true); }
  };

  const cadastrarPessoa = () => {
    if(!novoNomeCad || !novoBairroCad) { alert('Preencha Nome e Bairro.'); return; }
    setCadastros(prev => [{
      id: Date.now(), nome: novoNomeCad, municipio: mun, bairro: novoBairroCad, papel: novoPapelCad, data: new Date().toLocaleDateString('pt-BR')
    }, ...prev]);
    setNovoNomeCad(''); setNovoBairroCad('');
  };

  const pararSirenes = () => {
    if(intervalRef.current) clearInterval(intervalRef.current);
    if(oscRef.current) { try{ oscRef.current.stop(); }catch{} oscRef.current = null; }
    setStatusBR('AGUARDANDO'); setStatusRU('AGUARDANDO');
    setTimerBR('00:00 / 05:00'); setTimerRU('00:00 / 05:00');
  };

  const tocarSomBR = () => {
    if(!audioCtxRef.current) audioCtxRef.current = new (window.AudioContext || window.webkitAudioContext)();
    const ctx = audioCtxRef.current;
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = 'sine'; osc.frequency.setValueAtTime(440, ctx.currentTime);
    gain.gain.setValueAtTime(0.3, ctx.currentTime);
    osc.connect(gain); gain.connect(ctx.destination); osc.start();
    oscRef.current = osc;
  };

  const iniciarBR = () => {
    pararSirenes();
    tocarSomBR();
    setStatusBR('TOCANDO - ALERTA MÁXIMO');
  };

  const iniciarRU = () => {
    pararSirenes();
    tocarSomBR();
    setStatusRU('TOCANDO - ALERTA TÁTICO');
  };

  const estiloPainel = modoNoite ? "panel-noite p-3" : "panel-dia p-3";

  if (!autenticado) {
    return (
      <div className={`w-full max-w-[420px] ${estiloPainel} p-6 space-y-4 shadow-2xl mt-10`}>
        <div className="text-center space-y-1">
          <p className={`text-[10px] font-bold tracking-widest ${modoNoite ? 'text-blue-400':'text-blue-500'}`}>ACESSO RESTRITO • {modoNoite ? 'MODO NOTURNO 🌙' : 'MODO DIURNO ☀️'}</p>
          <h1 className="text-base font-black text-white">RARU NEXUS AI V11 Plus</h1>
          <p className="text-[10px] text-slate-400">Rede Automatizada de Resiliência Urbana, Mesquita - RJ</p>
          <p className="text-[9px] text-slate-500 italic">"Prevenção inteligente para todos."</p>
        </div>
        <div className="space-y-3 pt-2">
          <div>
            <label className="label">Senha do Operador</label>
            <input type="password" value={senha} onChange={e=>setSenha(e.target.value)} placeholder="Digite (sarah2026)..." className="w-full mt-1 bg-black border border-white/20 rounded-xl p-3 text-sm text-white"/>
          </div>
          <button onClick={fazerLogin} className="btn bg-blue-600 hover:bg-blue-500 text-white">ACESSAR CENTRAL</button>
          {erroSenha && <p className="text-[10px] text-red-400 text-center">Senha incorreta.</p>}
        </div>
      </div>
    );
  }

  return (
    <div className="space-y-3 w-full font-mono relative pb-20">

      {/* BOTÃO FLUTUANTE DA SARAH */}
      <button onClick={() => setChatAberto(!chatAberto)} className="fixed right-4 bottom-4 z-50 w-14 h-14 rounded-full bg-black border-2 border-cyan-400 shadow-[0_0_25px_rgba(0,242,254,0.7)] flex items-center justify-center animate-hud-pulse cursor-pointer">
        <img src={SARAH_AVATAR} className="w-10 h-10 rounded-full object-cover" />
      </button>

      {/* CHAT MODAL SARAH */}
      {chatAberto && (
        <div className="fixed right-4 bottom-20 z-50 w-[90vw] max-w-[340px] h-[400px] panel-noite rounded-2xl flex flex-col overflow-hidden border-2 border-cyan-400 shadow-2xl">
          <div className="bg-black/90 p-3 border-b border-cyan-400/30 flex justify-between items-center">
            <span className="font-bold text-xs text-cyan-300">Sarah AI • Cérebro Comunitário</span>
            <button onClick={() => setChatAberto(false)} className="text-rose-400 font-bold text-xs">✕</button>
          </div>
          <div className="flex-1 p-3 overflow-y-auto space-y-2 text-[10px]">
            {mensagensChat.map((m, i) => (
              <div key={i} className={`p-2 rounded-xl ${m.sender === 'sarah' ? 'bg-cyan-950/40 border border-cyan-400/30 text-white' : 'bg-white/5 text-cyan-300 text-right'}`}>
                {m.text}
              </div>
            ))}
          </div>
          <form onSubmit={enviarMensagemChat} className="p-2 bg-black/90 border-t border-cyan-400/30 flex gap-2">
            <input type="text" value={inputChat} onChange={e => setInputChat(e.target.value)} placeholder="Fale com a Sarah..." className="flex-1 bg-black border border-cyan-400/40 rounded-xl px-3 py-2 text-xs text-white" />
            <button type="submit" className="px-3 bg-cyan-500 text-black font-black rounded-xl text-xs">➤</button>
          </form>
        </div>
      )}

      {/* CABEÇALHO OFICIAL */}
      <div className={`${estiloPainel} flex justify-between items-center`}>
        <div>
          <div className="flex items-center gap-2">
            <span className="text-[10px] bg-blue-900/40 text-blue-400 border border-blue-500/30 px-2 py-0.5 rounded font-bold">V11 Plus</span>
            <h2 className="text-xs font-black text-white">RARU NEXUS AI V11 Plus</h2>
          </div>
          <p className="text-[10px] text-slate-300 font-bold mt-1">Rede Automatizada de Resiliência Urbana, Mesquita - RJ</p>
          <p className="text-[9px] text-slate-400">"Prevenção inteligente para todos." • {modoNoite ? '🌙 NOITE' : '☀️ DIA'} • <span className="text-emerald-400">{statusConexao}</span></p>
        </div>
        <button onClick={()=>setAutenticado(false)} className="bg-red-900/30 border border-red-500/40 text-red-400 px-3 py-1.5 rounded-xl text-[9px] font-bold">BLOQUEAR</button>
      </div>

      {/* ABAS DE NAVEGAÇÃO */}
      <div className="grid grid-cols-4 gap-1">
        <button onClick={()=>setAbaAtiva('central')} className={`py-2 rounded-xl text-[10px] font-black border ${abaAtiva==='central'?'bg-blue-600 border-blue-400 text-white':'bg-black border-white/10 text-slate-400'}`}>📊 Central</button>
        <button onClick={()=>setAbaAtiva('vistoria')} className={`py-2 rounded-xl text-[10px] font-black border ${abaAtiva==='vistoria'?'bg-emerald-600 border-emerald-400 text-white':'bg-black border-white/10 text-slate-400'}`}>📋 Vistoria</button>
        <button onClick={()=>setAbaAtiva('historico')} className={`py-2 rounded-xl text-[10px] font-black border ${abaAtiva==='historico'?'bg-purple-600 border-purple-400 text-white':'bg-black border-white/10 text-slate-400'}`}>📁 Dados ({historicoVistorias.length})</button>
        <button onClick={()=>setAbaAtiva('cadastros')} className={`py-2 rounded-xl text-[10px] font-black border ${abaAtiva==='cadastros'?'bg-amber-600 border-amber-400 text-black':'bg-black border-white/10 text-slate-400'}`}>👥 GADE</button>
      </div>

      {abaAtiva === 'central' && (
        <div className="space-y-3">
          <div className={`${estiloPainel} space-y-3 border-2 border-blue-500/40`}>
            <div className="flex justify-between items-center flex-wrap gap-2">
              <p className="label text-blue-300">🤖 SARAH IA AUTÔNOMA • TELEMETRIA & DIRETRIZES</p>
              <div className="flex gap-1.5 items-center">
                <button onClick={()=>setFalarVoz(!falarVoz)} className={`text-[9px] px-2 py-1 rounded font-bold border ${falarVoz ? 'bg-blue-600 border-blue-400 text-white':'bg-black border-white/20 text-slate-400'}`}>
                  {falarVoz ? '🔊 VOZ ATIVA' : '🔇 MUDO'}
                </button>
                <span className={`text-[10px] px-2.5 py-1 rounded-full text-white font-bold ${nivelAlertaCor}`}>{nivelAlertaTexto}</span>
              </div>
            </div>

            <div>
              <label className="label mb-1 block">ÓRGÃO OFICIAL DE DESTINO / AUDITORIA:</label>
              <select value={orgaoSelecionado} onChange={e=>setOrgaoSelecionado(e.target.value)} className="w-full bg-black border border-white/20 rounded-xl p-2.5 text-[11px] font-bold text-white">
                {ORGAOS_OFICIAIS.map((org,i)=><option key={i} value={org}>{org}</option>)}
              </select>
            </div>
            
            <div className="bg-black border border-white/10 rounded-xl p-3">
              <p className="text-[11px] text-slate-200 leading-relaxed font-sans">{iaLaudo}</p>
            </div>
          </div>

          <div className={`${estiloPainel} space-y-3`}>
            <p className="label">MAPA TÁTICO & REDE DOS 92 MUNICÍPIOS DO RJ</p>
            <select value={mun} onChange={e=>setMun(e.target.value)} className="w-full bg-black border border-white/20 rounded-xl p-3 text-[12px] font-bold text-white">
              {MUNICIPIOS_RJ_92.map((m,i)=><option key={i} value={m}>{m} - RJ</option>)}
            </select>

            <div className="bg-black border border-white/10 rounded-xl p-3 space-y-2">
              <div className="flex justify-between items-center border-b border-white/10 pb-2">
                <div>
                  <p className="text-[13px] font-black text-white">{mun} - RJ</p>
                  <p className="text-[9px] text-blue-400">Rede Estadual de Resiliência</p>
                </div>
                <span className="text-[10px] text-emerald-300 font-bold">{meteo.condicao}</span>
              </div>
              <div className="grid grid-cols-3 gap-2 text-center text-xs">
                <div className="bg-[#0B1120] p-2 rounded-lg"><p className="text-[9px] text-slate-400">TEMP</p><p className="font-bold">{meteo.temperatura}</p></div>
                <div className="bg-[#0B1120] p-2 rounded-lg"><p className="text-[9px] text-slate-400">UMIDADE</p><p className="font-bold">{meteo.umidade}</p></div>
                <div className="bg-[#0B1120] p-2 rounded-lg"><p className="text-[9px] text-slate-400">CHUVA</p><p className="font-bold text-amber-300">{meteo.chuvaMm}</p></div>
              </div>
            </div>
          </div>
        </div>
      )}

      {abaAtiva === 'vistoria' && (
        <div className={`${estiloPainel} space-y-4 border-2 border-emerald-500/40`}>
          <div>
            <h3 className="text-xs font-black text-emerald-400 uppercase">📋 VISTORIA DE CAMPO & CLOUDFLARE WORKER</h3>
            <p className="text-[9px] text-slate-400">Câmera com carimbo GPS, Laudo em PDF com SHA-256 e Envio WhatsApp</p>
          </div>

          <div className="bg-black border border-white/10 rounded-xl p-3 space-y-2">
            <div className="flex justify-between items-center">
              <p className="label">Câmera Tática com Carimbo Automático</p>
              {!camOn ? (
                <button onClick={startCam} className="text-[10px] bg-white text-black font-bold px-3 py-1.5 rounded-lg">LIGAR CÂMERA</button>
              ) : (
                <button onClick={stopCam} className="text-[10px] border border-red-500/30 text-red-300 px-3 py-1.5 rounded-lg">DESLIGAR</button>
              )}
            </div>

            <div className="bg-[#080A12] rounded-lg overflow-hidden relative">
              <video ref={videoRef} autoPlay playsInline muted style={{width:'100%', height:'200px', objectFit:'cover', display: camOn ? 'block' : 'none'}}></video>
              {!camOn && <div className="h-[200px] grid place-items-center text-[11px] text-slate-600 font-bold">CÂMERA DESLIGADA</div>}
              {analisandoIA && <div className="absolute inset-0 bg-black/80 grid place-items-center text-xs text-emerald-400 font-bold animate-pulse">📷 SALVANDO FOTO...</div>}
            </div>

            {camOn && (
              <button onClick={capturarFotoCampoOffline} className="w-full py-3 bg-white text-black font-black rounded-xl text-xs shadow">
                CAPTURAR E SALVAR FOTO COM CARIMBO
              </button>
            )}

            {fotosVistoria.length > 0 && (
              <div className="flex gap-2 overflow-x-auto pt-1 pb-1">
                {fotosVistoria.map((f, i) => (
                  <div key={i} className="relative shrink-0">
                    <img src={f} className="w-20 h-20 object-cover rounded-lg border border-white/20 shadow" />
                    <div className="x" onClick={() => setFotosVistoria(fotosVistoria.filter((_, idx) => idx !== i))}>X</div>
                  </div>
                ))}
              </div>
            )}
          </div>

          <div className="space-y-2">
            <input value={nomeAgente} onChange={e=>setNomeAgente(e.target.value)} placeholder="Agente Responsável *" className="w-full bg-black border border-white/15 rounded-xl p-2.5 text-xs text-white"/>
            <div className="grid grid-cols-2 gap-2">
              <input value={bairroVistoria} onChange={e=>setBairroVistoria(e.target.value)} placeholder="Bairro / Comunidade *" className="bg-black border border-white/15 rounded-xl p-2.5 text-xs text-white"/>
              <select value={riscoVistoria} onChange={e=>setRiscoVistoria(e.target.value)} className="bg-black border border-white/15 rounded-xl p-2.5 text-[11px] text-white">
                {RISCOS_VISTORIA.map((r, i) => <option key={i} value={r}>{r}</option>)}
              </select>
            </div>
            <textarea value={relatoVistoria} onChange={e=>setRelatoVistoria(e.target.value)} rows="2" placeholder="Relato técnico de campo..." className="w-full bg-black border border-white/15 rounded-xl p-2.5 text-xs text-white"></textarea>
          </div>

          <div className="grid grid-cols-2 gap-2 pt-1">
            <button onClick={enviarWhatsAppOffline} className="py-3 bg-[#25D366] text-black font-black rounded-xl text-[11px] shadow">ENVIAR WHATSAPP</button>
            <button onClick={enviarParaWorkerEGerarLaudo} disabled={processandoWorker} className="py-3 bg-blue-600 hover:bg-blue-500 text-white font-black rounded-xl text-[11px] shadow disabled:opacity-50">
              {processandoWorker ? "PROCESSANDO WORKER..." : "GERAR LAUDO IA (WORKER)"}
            </button>
          </div>
        </div>
      )}

      {abaAtiva === 'historico' && (
        <div className={`${estiloPainel} space-y-3`}>
          <div className="flex justify-between items-center"><p className="label">HISTÓRICO DE VISTORIAS SALVAS (OFFLINE)</p><span className="text-[10px] px-2 py-0.5 rounded-full bg-purple-900/40 text-purple-300 font-bold">{historicoVistorias.length} SALVOS</span></div>
          {historicoVistorias.length === 0 ? (
            <div className="p-6 text-center text-xs text-slate-500 border border-white/10 rounded-xl">Nenhuma vistoria registrada ainda.</div>
          ) : (
            <div className="space-y-2 max-h-[380px] overflow-y-auto">
              {historicoVistorias.map((item, idx) => (
                <div key={idx} className="bg-black border border-white/10 p-3 rounded-xl space-y-1 text-xs">
                  <div className="flex justify-between text-cyan-400 font-bold">
                    <span>{item.prot}</span>
                    <span className="text-[10px] text-slate-400">{item.data}</span>
                  </div>
                  <div className="text-slate-300">Município: {item.municipio} - RJ | Bairro: {item.bairro}</div>
                  <div className="text-amber-400 text-[11px]">Risco: {item.risco}</div>
                  <div className="text-[10px] text-slate-500">Hash: {item.hash}... | Fotos: {item.fotos}</div>
                </div>
              ))}
            </div>
          )}
          <button onClick={()=>{localStorage.removeItem('raru_vistorias_v11plus'); setHistoricoVistorias([]);}} className="w-full py-2 bg-red-950/40 border border-red-800/50 text-red-300 rounded-xl text-[10px]">LIMPAR HISTÓRICO LOCAL</button>
        </div>
      )}

      {abaAtiva === 'cadastros' && (
        <div className={`${estiloPainel} space-y-3`}>
          <div className="flex justify-between items-center"><p className="label">CADASTRO DE AGENTES & LIDERANÇAS (GADE)</p><span className="text-[10px] px-2 py-0.5 rounded-full bg-blue-900/40 text-blue-300 font-bold">{cadastros.length} CADASTRADOS</span></div>
          <div className="bg-black border border-white/10 rounded-xl p-3 space-y-2">
            <input value={novoNomeCad} onChange={e=>setNovoNomeCad(e.target.value)} placeholder="Nome Completo *" className="w-full bg-[#080A12] border border-white/15 rounded-xl p-2.5 text-xs text-white"/>
            <div className="grid grid-cols-2 gap-2">
              <input value={novoBairroCad} onChange={e=>setNovoBairroCad(e.target.value)} placeholder="Bairro / Comunidade *" className="bg-[#080A12] border border-white/15 rounded-xl p-2.5 text-xs text-white"/>
              <select value={novoPapelCad} onChange={e=>setNovoPapelCad(e.target.value)} className="bg-[#080A12] border border-white/15 rounded-xl p-2.5 text-[11px] text-white">
                <option>Morador / Voluntário</option>
                <option>Agente de Articulação (GADE)</option>
                <option>Defesa Civil / NUPDEC</option>
              </select>
            </div>
            <button onClick={cadastrarPessoa} className="w-full py-2.5 bg-blue-600 hover:bg-blue-500 text-white font-black rounded-xl text-xs">CADASTRAR NA MALHA</button>
          </div>
          <div className="space-y-2 max-h-[180px] overflow-y-auto">
            {cadastros.map((item)=>(
              <div key={item.id} className="bg-black border border-white/10 rounded-xl p-2.5 flex justify-between items-center text-[11px]">
                <div>
                  <p className="font-bold text-white">{item.nome}</p>
                  <p className="text-[9px] text-slate-400">{item.bairro} • <span className="text-blue-300">{item.papel}</span></p>
                </div>
                <span className="text-[9px] px-2 py-1 rounded bg-emerald-900/30 text-emerald-300 font-bold">{item.data}</span>
              </div>
            ))}
          </div>
        </div>
      )}

      {/* SIRENES */}
      <div className={`${estiloPainel} space-y-3`}>
        <p className="label">SISTEMA ALERTA CRÍTICO - BR + RU (5 MINUTOS)</p>
        <div className="grid grid-cols-1 md:grid-cols-2 gap-3">
          <div className="bg-black border border-white/10 rounded-xl p-3 space-y-2">
            <p className="text-[10px] font-bold text-white">ALERTA BRASILEIRO (CEMADEN)</p>
            <div className="flex gap-2">
              <button onClick={iniciarBR} className="btn bg-white text-black py-2">DISPARAR BR</button>
              <button onClick={pararSirenes} className="btn bg-black border border-white/20 text-white py-2">PARAR</button>
            </div>
            <p className="text-[10px] text-yellow-400 font-bold">STATUS: {statusBR} ({timerBR})</p>
          </div>
          <div className="bg-black border border-white/10 rounded-xl p-3 space-y-2">
            <p className="text-[10px] font-bold text-white">ALERTA TÁTICO (PADRÃO RUSSO)</p>
            <div className="flex gap-2">
              <button onClick={iniciarRU} className="btn bg-[#E5E7EB] text-black py-2">DISPARAR RU</button>
              <button onClick={pararSirenes} className="btn bg-black border border-white/20 text-white py-2">PARAR</button>
            </div>
            <p className="text-[10px] text-yellow-400 font-bold">STATUS: {statusRU} ({timerRU})</p>
          </div>
        </div>
      </div>

      {/* RODAPÉ */}
      <div className={`${estiloPainel} text-center space-y-1`}>
        <p className="text-[10px] font-bold text-blue-300">Grupo a Chave da Esperança © GADE • Rocha Sobrinho Mesquita RJ</p>
        <p className="text-[9px] text-slate-400">RARU NEXUS AI V11 Plus • Prevenção inteligente para todos.</p>
      </div>

    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
