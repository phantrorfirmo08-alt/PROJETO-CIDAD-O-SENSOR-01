function bloquearCalmaAlexander(texto) {
  return String(texto || "")
    .replace(/\bcalma,?\s+alexander\b/gi, "respira")
    .replace(/\bcalma,?\s+alexandre\b/gi, "respira")
    .replace(/\s{2,}/g, " ")
    .replace(/\s+([,.!?])/g, "$1")
    .trim();
}

function limparTextoParaFala(texto) {
  const semAlexander = bloquearCalmaAlexander(texto);
  return semAlexander
    .replace(/[*#_`]/g, '')
    .replace(/cerquilha/gi, '')
    .replace(/asterisco/gi, '')
    .replace(/([\u2700-\u27BF]|[\uE000-\uF8FF]|\uD83C[\uDC00-\uDFFF]|\uD83D[\uDC00-\uDFFF]|[\u2011-\u26FF]|\uD83E[\uDD00-\uDDFF])/g, '')
    .replace(/https?:\/\/\S+/g, "")
    .replace(/\s+/g, " ")
    .trim();
}

function avaliarRiscoMeteorologico(chuvaMm = 0, probChuva = 0, ventoKmh = 0, rajadaKmh = 0) {
  const ch = Number(chuvaMm) || 0;
  const pr = Number(probChuva) || 0;
  const vn = Math.max(Number(ventoKmh) || 0, Number(rajadaKmh) || 0);
  if (ch >= 15 || vn >= 65) {
    return { nivel: "R4 - EVACUAÇÃO / SEVERO", severidade: "CRÍTICO", acao: "Evacuação preventiva de áreas baixas/encostas, evitar travessia de lâmina d'água e acionar rota segura." };
  }
  if (ch >= 5 || pr >= 75 || vn >= 45) {
    return { nivel: "R3 - ALTO / ENXURRADA", severidade: "ALTO", acao: "Monitorar calhas, bueiros e encostas, preparar kit de emergência e acompanhar RainViewer e GOES-19." };
  }
  if (ch >= 1 || pr >= 45 || vn >= 30) {
    return { nivel: "R2 - MODERADO / ATENÇÃO", severidade: "MODERADO", acao: "Atenção a pancadas localizadas e rajadas de vento; manter monitoramento horário ativo." };
  }
  return { nivel: "R1 - BAIXO / PREVENTIVO", severidade: "ESTÁVEL", acao: "Condição atmosférica estável; manter rotina preventiva e zeladoria de drenagem." };
}

function escolherVozPtBr(perfilId) {
  const voices = carregarVozesDisponiveis();
  if (!voices || voices.length === 0) return null;
  const ptVoices = voices.filter(v => (v.lang || "").toLowerCase().includes("pt"));
  if (ptVoices.length === 0) return voices[0];
  const idx = PERFIS_VOZ_OFICIAIS.findIndex(p => p.id === perfilId);
  if (idx >= 0) return ptVoices[idx % ptVoices.length];
  return ptVoices.find(v => (v.name || "").toLowerCase().includes("google")) || ptVoices[0];
}

function escolherVozMasculinaPtBr() {
  const voices = carregarVozesDisponiveis();
  if (!voices || voices.length === 0) return null;
  const ptVoices = voices.filter(v => (v.lang || "").toLowerCase().includes("pt"));
  const pool = ptVoices.length > 0 ? ptVoices : voices;
  const termosMasc = ["male", "masculino", "daniel", "felipe", "ricardo", "antonio", "antônio", "rafael", "lucas", "bruno", "jorge", "paulo", "carlos", "pt-pt"];
  const achada = pool.find(v => {
    const n = `${v.name || ""} ${v.voiceURI || ""}`.toLowerCase();
    return termosMasc.some(t => n.includes(t));
  });
  return achada || pool[0];
}

function falarRoboMasculino(texto, onStart = null, onEnd = null) {
  try {
    if (localStorage.getItem("raru_sound_enabled") === "false") {
      if (onEnd) onEnd();
      return;
    }
  } catch (e) {}
  if (!("speechSynthesis" in window)) {
    if (onEnd) onEnd();
    return;
  }
  const textoLimpo = limparTextoParaFala(texto);
  if (!textoLimpo) {
    if (onEnd) onEnd();
    return;
  }

  try {
    window.speechSynthesis.cancel();
    const frases = textoLimpo.split(/(?<=[.!?])\s+/).filter(Boolean);
    const fila = frases.length > 0 ? frases : [textoLimpo];
    const vozMasc = escolherVozMasculinaPtBr();

    if (onStart) onStart();

    const falarSequencia = (index) => {
      if (index >= fila.length) {
        if (onEnd) onEnd();
        return;
      }
      try {
        if (localStorage.getItem("raru_sound_enabled") === "false") {
          if (onEnd) onEnd();
          return;
        }
      } catch (e) {}

      const u = new SpeechSynthesisUtterance(fila[index]);
      u.lang = "pt-BR";
      u.pitch = 0.68;
      u.rate = 0.96;
      u.volume = 1.0;
      if (vozMasc) u.voice = vozMasc;

      u.onend = () => {
        if (index + 1 < fila.length) setTimeout(() => falarSequencia(index + 1), 260);
        else if (onEnd) onEnd();
      };
      u.onerror = () => {
        if (index + 1 < fila.length) setTimeout(() => falarSequencia(index + 1), 260);
        else if (onEnd) onEnd();
      };
      window.speechSynthesis.speak(u);
    };

    falarSequencia(0);
  } catch (e) {
    if (onEnd) onEnd();
  }
}

function falarImitada(texto, perfilId = 'sarah') {
  try {
    if (localStorage.getItem("raru_sound_enabled") === "false") return;
  } catch (e) {}
  if (!("speechSynthesis" in window)) return;
  const textoLimpo = limparTextoParaFala(texto);
  if (!textoLimpo) return;

  const perfilSalvo = (() => {
    try { return localStorage.getItem("raru_perfil_voz") || perfilId || 'sarah'; }
    catch (e) { return perfilId || 'sarah'; }
  })();
  const perfil = PERFIS_VOZ_OFICIAIS.find(p => p.id === perfilSalvo) || PERFIS_VOZ_OFICIAIS[0];

  try {
    window.speechSynthesis.cancel();
    const textoImitado = limparTextoParaFala(perfil.transform(textoLimpo));
    const frases = textoImitado.split(/(?<=[.!?])\s+/).filter(Boolean);
    const fila = frases.length > 0 ? frases : [textoImitado];
    const vozEscolhida = escolherVozPtBr(perfil.id);

    const falarSequencia = (index) => {
      if (index >= fila.length) return;
      try {
        if (localStorage.getItem("raru_sound_enabled") === "false") return;
      } catch (e) {}

      const u = new SpeechSynthesisUtterance(fila[index]);
      u.lang = "pt-BR";
      const osc = (Math.random() - 0.5) * perfil.variacao;
      u.pitch = Math.max(0.5, Math.min(2.0, perfil.pitch + osc));
      u.rate = Math.max(0.5, Math.min(2.0, perfil.rate));
      u.volume = Math.max(0, Math.min(1, perfil.volume));
      if (vozEscolhida) u.voice = vozEscolhida;

      u.onend = () => {
        if (index + 1 < fila.length) setTimeout(() => falarSequencia(index + 1), perfil.pausaFrase);
      };
      u.onerror = () => {
        if (index + 1 < fila.length) setTimeout(() => falarSequencia(index + 1), perfil.pausaFrase);
      };
      window.speechSynthesis.speak(u);
    };

    falarSequencia(0);
  } catch (e) {}
}

function falarSarah(texto, vozIndex = 0) {

      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        model: "openai/gpt-oss-120b",
        messages: [{ role: "system", content: baseSarah }, ...mensagensHistorico],
        temperature: 0.72,
        max_tokens: 550
      })
    });
    const data = await response.json();
    if (!data.error) {
      const msg = data?.choices?.[0]?.message;
      let texto = msg?.content || msg?.reasoning_content;
      if (texto && texto.trim().length > 0) {
        globalSaudacaoEmitida = true;
        return limparTextoParaFala(texto).trim();
      }
    }
  } catch (e) {}

  try {
    const ultimaMensagem = mensagensHistorico[mensagensHistorico.length - 1]?.content || "Olá";
    const promptCompleto = baseSarah + "\n\nMensagem em " + (municipioAtual || 'Mesquita') + ": " + ultimaMensagem;
    const aiRes = await fetch("https://text.pollinations.ai/" + encodeURIComponent(promptCompleto));
    if (aiRes.ok) {
      let t = await aiRes.text();
      if (t && t.trim().length > 0) {
        globalSaudacaoEmitida = true;
        return limparTextoParaFala(t).trim();
      }
    }
  } catch (e) {}

  globalSaudacaoEmitida = true;
  const atualM = ESTADO_CLIMA_AUTOMATICO_92.municipios[municipioAtual || 'Mesquita'];
  const resumoClimaLocal = atualM
    ? `Em ${municipioAtual || 'Mesquita'}, ${atualM.temp}, chuva ${atualM.chuva}, prob. chuva ${atualM.probChuva}, vento ${atualM.vento}, rajada ${atualM.rajada}, umidade ${atualM.umi}, nível ${atualM.risco}.`
    : `Monitoramento 24h ativo em ${municipioAtual || 'Mesquita'} com GOES-19 e RainViewer.`;
  if (nomePessoa) {
    return `${resumoClimaLocal} Como posso te apoiar agora, ${nomePessoa}?`;
  }
  return `${resumoClimaLocal} Qual é o seu nome e o que você precisa analisar?`;
}

async function gerarArquivoIconeEscudo() {
  return new Promise((resolve) => {
    const canvas = document.createElement('canvas');
    canvas.width = 512;
    canvas.height = 512;
    const ctx = canvas.getContext('2d');

    const bgGrad = ctx.createRadialGradient(256, 256, 30, 256, 256, 320);
    bgGrad.addColorStop(0, '#0A2547');
    bgGrad.addColorStop(0.6, '#041125');
    bgGrad.addColorStop(1, '#02040A');
    ctx.fillStyle = bgGrad;
    ctx.fillRect(0, 0, 512, 512);

    ctx.save();
    ctx.shadowColor = '#00F2FE';
    ctx.shadowBlur = 25;
    ctx.beginPath();
    ctx.moveTo(256, 65);
    ctx.lineTo(410, 130);
    ctx.lineTo(410, 265);
    ctx.quadraticCurveTo(410, 385, 256, 435);
    ctx.quadraticCurveTo(102, 385, 102, 265);
    ctx.lineTo(102, 130);
    ctx.closePath();

    const shieldFill = ctx.createLinearGradient(102, 65, 410, 435);
    shieldFill.addColorStop(0, 'rgba(0, 242, 254, 0.22)');
    shieldFill.addColorStop(1, 'rgba(4, 17, 37, 0.94)');
    ctx.fillStyle = shieldFill;
    ctx.fill();
    ctx.lineWidth = 7;
    ctx.strokeStyle = '#00F2FE';
    ctx.stroke();
    ctx.restore();

    ctx.fillStyle = '#00FF9D';
    ctx.font = '900 18px Orbitron, sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('EDIÇÃO TEMPO & CLIMA', 256, 198);

    ctx.fillStyle = '#FFFFFF';
    ctx.font = '900 28px Orbitron, sans-serif';
    ctx.fillText('RARU NEXUS', 256, 256);

    ctx.fillStyle = '#00F2FE';
    ctx.font = '800 17px JetBrains Mono, monospace';
    ctx.fillText('V11.2 PLUS • RJ', 256, 288);

    ctx.fillStyle = '#38BDF8';
    ctx.font = '700 15px JetBrains Mono, monospace';
    ctx.fillText('CIDADÃO SENSOR • MESQUITA RJ', 256, 478);

    canvas.toBlob((blob) => {
      if (blob) resolve(new File([blob], 'ESCUDO_RARU_NEXUS_V11_2_PLUS.png', { type: 'image/png' }));
      else resolve(null);
    }, 'image/png');
  });
}

async function compartilharEscudoComTextoUnico(showToast) {
  const textoLimpo = shareMessageText.trim();
  const escudoFile = await gerarArquivoIconeEscudo();

  try {
    if (escudoFile && navigator.canShare && navigator.canShare({ files: [escudoFile] })) {
      await navigator.share({
        title: `${TITULO_OFICIAL_RARU} — ${SUBTITULO_OFICIAL_RARU}`,
        text: textoLimpo,
        files: [escudoFile]
      });
      if (showToast) showToast("Ícone do escudo + texto com link compartilhados.");
      return;
    }
  } catch (e) {
    if (e && e.name === 'AbortError') return;
  }

  if (escudoFile) {
    try {
      const urlImg = URL.createObjectURL(escudoFile);
      const a = document.createElement('a');
      a.href = urlImg;
      a.download = escudoFile.name;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      setTimeout(() => URL.revokeObjectURL(urlImg), 3000);
    } catch (e) {}
  }

  try {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      await navigator.clipboard.writeText(textoLimpo);
    }
  } catch (e) {}

  if (showToast) showToast("Ícone do escudo baixado + texto com link copiado.");
}

async function sincronizarTelemetria92RJ(onComplete = null) {
  try {
    const lats = MUNICIPIOS_92.map(c => c.lat).join(',');
    const lons = MUNICIPIOS_92.map(c => c.lon).join(',');
    const urlClima = `https://api.open-meteo.com/v1/forecast?latitude=${lats}&longitude=${lons}&current=temperature_2m,relative_humidity_2m,precipitation,wind_speed_10m,wind_gusts_10m,surface_pressure&hourly=temperature_2m,precipitation_probability,wind_speed_10m&timezone=America%2FSao_Paulo&forecast_days=1`;

    const [resClima, resRadar] = await Promise.allSettled([
      fetch(urlClima).then(r => r.json()),
      fetch("https://api.rainviewer.com/public/weather-maps.json").then(r => r.json())
    ]);

    if (resRadar.status === "fulfilled" && resRadar.value) {
      const rvData = resRadar.value;
      const past = rvData?.radar?.past || [];
      const nowcast = rvData?.radar?.nowcast || [];
      ESTADO_CLIMA_AUTOMATICO_92.rainviewerHost = rvData.host || "https://tilecache.rainviewer.com";
      ESTADO_CLIMA_AUTOMATICO_92.rainviewerFrames = [...past, ...nowcast];
    }

    if (resClima.status === "fulfilled" && resClima.value) {
      const arr = Array.isArray(resClima.value) ? resClima.value : [resClima.value];
      const hora = new Date().getHours();
      const mapa = {};
      const listaResumo = [];

      arr.forEach((item, i) => {
        const c = MUNICIPIOS_92[i];
        if (!c || !item?.current) return;
        const tempNum = item.current.temperature_2m;
        const chuvaNum = item.current.precipitation ?? 0;
        const probNum = item.hourly?.precipitation_probability?.[hora] ?? 0;
        const ventoNum = item.current.wind_speed_10m ?? 0;
        const rajadaNum = item.current.wind_gusts_10m ?? ventoNum;
        const umiNum = item.current.relative_humidity_2m ?? "--";
        const pressaoNum = item.current.surface_pressure ?? "--";
        const riscoObj = avaliarRiscoMeteorologico(chuvaNum, probNum, ventoNum, rajadaNum);

        const registro = {
          nome: c.n,
          temp: `${tempNum}°C`,
          tempNum,
          umi: `${umiNum}%`,
          chuva: `${chuvaNum} mm`,
          chuvaNum,
          probChuva: `${probNum}%`,
          probNum,
          vento: `${ventoNum} km/h`,
          ventoNum,
          rajada: `${rajadaNum} km/h`,
          rajadaNum,
          pressao: pressaoNum,
          risco: riscoObj.nivel,
          severidade: riscoObj.severidade,
          riscoObj,
          condicao: riscoObj.severidade === "CRÍTICO" ? "ALERTA SEVERO" : riscoObj.severidade === "ALTO" ? "ALERTA ALTO" : riscoObj.severidade === "MODERADO" ? "ATENÇÃO" : "ESTÁVEL",
          hourly: item.hourly
        };

        mapa[c.n] = registro;
        listaResumo.push(registro);
      });

      listaResumo.sort((a, b) => (b.chuvaNum * 10 + b.probNum) - (a.chuvaNum * 10 + a.probNum));
      ESTADO_CLIMA_AUTOMATICO_92.municipios = mapa;
      ESTADO_CLIMA_AUTOMATICO_92.resumoCriticoRJ = listaResumo;
      ESTADO_CLIMA_AUTOMATICO_92.atualizadoEm = new Date().toLocaleTimeString("pt-BR", { timeZone: "America/Sao_Paulo" });
      ESTADO_CLIMA_AUTOMATICO_92.statusRede = "92 MUNICÍPIOS + GOES-19 + RAINVIEWER ONLINE";
    }
  } catch (e) {
    ESTADO_CLIMA_AUTOMATICO_92.statusRede = "MODO RESILIÊNCIA / CACHE ATIVO";
  }
  if (onComplete) onComplete(ESTADO_CLIMA_AUTOMATICO_92);
}

function PainelRotasEstacaoPublica() {
  const [rotas, setRotas] = useState([]);

  useEffect(() => {
    const carregarRotas = () => {
      try {
        const r = JSON.parse(localStorage.getItem('rotasFugaReais') || '[]');
        setRotas(r);
      } catch (e) { setRotas([]); }
    };
    carregarRotas();
    window.addEventListener('storage', carregarRotas);
    const interval = setInterval(carregarRotas, 2500);
    return () => {
      window.removeEventListener('storage', carregarRotas);
      clearInterval(interval);
    };

  const etiquetaPorTipo = {

function CadeAdminModule({ showToast }) {
  const MUNICIPIOS = MUNICIPIOS_92.map(m => m.n);
  const [abaAtiva, setAbaAtiva] = useState('rota');
  const [rotas, setRotas] = useState(() => {
    try { return JSON.parse(localStorage.getItem('rotasFugaReais') || '[]'); } catch (e) { return []; }
  });
  const [rNome, setRNome] = useState('');
  const [rEnd, setREnd] = useState('');
  const [rInfo, setRInfo] = useState('');
  const [rTipo, setRTipo] = useState('Ponto de Encontro');

  const [monitores, setMonitores] = useState(() => {
    try { return JSON.parse(localStorage.getItem('monitoresCADE') || '[]'); } catch (e) { return []; }
  });
  const [bloqueados, setBloqueados] = useState(() => {
    try { return JSON.parse(localStorage.getItem('monitoresBloqueadosCADE') || '[]'); } catch (e) { return []; }
  });
  const [mNome, setMNome] = useState('');
  const [mZap, setMZap] = useState('');
  const [mSenha, setMSenha] = useState('');
  const [mMun, setMMun] = useState('');
  const [mBairro, setMBairro] = useState('');
  const [mFuncao, setMFuncao] = useState('Monitor do Tempo');
  const [mObs, setMObs] = useState('');
  const [filtroMon, setFiltroMon] = useState('');

  const salvarRota = () => {
    if (!rNome.trim() || !rEnd.trim()) { showToast('Escreve o nome e o endereço.'); return; }
    const atualizadas = [...rotas, { nome: rNome.trim(), endereco: rEnd.trim(), info: rInfo.trim(), tipo: rTipo }];
    setRotas(atualizadas);
    try { localStorage.setItem('rotasFugaReais', JSON.stringify(atualizadas)); } catch (e) {}
    setRNome(''); setREnd(''); setRInfo('');
    showToast('Rota salva e publicada na Estação.');
  };

  const excluirRota = (i) => {
    if (!confirm('Excluir essa rota?')) return;
    const atualizadas = [...rotas];
    atualizadas.splice(i, 1);
    setRotas(atualizadas);
    try { localStorage.setItem('rotasFugaReais', JSON.stringify(atualizadas)); } catch (e) {}
  };

  const cadastrarMonitor = () => {
    if (!mNome.trim() || !mMun || !mBairro.trim() || !mSenha.trim()) { showToast('Preencha nome, município, bairro e crie a senha.'); return; }
    let c = parseInt(localStorage.getItem('contadorMonitorCADE') || '0', 10) + 1;
    try { localStorage.setItem('contadorMonitorCADE', String(c)); } catch (e) {}
    const idGerado = 'GADE-M-' + String(c).padStart(3, '0');
    const novoM = { id: idGerado, nome: mNome.trim(), zap: mZap.trim(), senha: mSenha.trim(), municipio: mMun, bairro: mBairro.trim(), funcao: mFuncao, obs: mObs.trim(), data: new Date().toLocaleString('pt-BR') };
    const atualizados = [...monitores, novoM];
    setMonitores(atualizados);
    try { localStorage.setItem('monitoresCADE', JSON.stringify(atualizados)); } catch (e) {}
    setMNome(''); setMZap(''); setMSenha(''); setMBairro(''); setMObs('');
    showToast(`Monitor cadastrado: ${idGerado}`);
  };

  const bloquearMonitor = (idx) => {
    const x = monitores[idx];
    const motivo = prompt(`Excluindo ${x.nome} - ${x.id}\nMotivo? Ex: mau uso`);
    if (motivo === null) return;
    if (!confirm(`CONFIRMAR BLOQUEIO?\n\n${x.id} - ${x.nome}`)) return;
    const l = [...monitores]; l.splice(idx, 1);
    setMonitores(l); try { localStorage.setItem('monitoresCADE', JSON.stringify(l)); } catch (e) {}
    const bb = [...bloqueados, { ...x, motivo: motivo || 'Sem motivo', dataBloqueio: new Date().toLocaleString('pt-BR') }];
    setBloqueados(bb); try { localStorage.setItem('monitoresBloqueadosCADE', JSON.stringify(bb)); } catch (e) {}
    showToast(`Monitor ${x.id} bloqueado.`);
  };

  const desbloquearMonitor = (idx) => {
    const x = bloqueados[idx];
    if (!confirm(`Desbloquear ${x.id} - ${x.nome}?`)) return;
    const bb = [...bloqueados]; bb.splice(idx, 1);
    setBloqueados(bb); try { localStorage.setItem('monitoresBloqueadosCADE', JSON.stringify(bb)); } catch (e) {}
    const l = [...monitores, { id: x.id, nome: x.nome, zap: x.zap, senha: x.senha, municipio: x.municipio, bairro: x.bairro, funcao: x.funcao, obs: x.obs, data: x.data }];
    setMonitores(l); try { localStorage.setItem('monitoresCADE', JSON.stringify(l)); } catch (e) {}
    showToast(`Monitor ${x.id} desbloqueado.`);
  };

  const exportarMonitoresGrupo = () => {
    if (!monitores.length) { showToast('Nenhum monitor ativo.'); return; }
    const msg = `MONITORES GADE - ${monitores.length} ativos\n\n` + monitores.map(x => `${x.id} - ${x.nome} - ${x.funcao}\nLocal: ${x.municipio} - ${x.bairro}\nZap: ${x.zap || ''}`).join('\n\n') + `\n\nProjeto: GADE - Grupo A Chave da Esperança • ${TITULO_OFICIAL_RARU}`;
    if (navigator.clipboard) navigator.clipboard.writeText(msg).catch(() => {});
    showToast('Lista copiada sem senha. Abrindo WhatsApp.');
    window.open('https://chat.whatsapp.com/D1wrk9nTBH57Wya2Uv44ZW', '_blank');
  };

  const monitoresFiltrados = monitores.filter(x => (x.id + ' ' + x.nome + ' ' + x.municipio + ' ' + x.bairro).toLowerCase().includes(filtroMon.toLowerCase()));

  return (
    <div id="cadeAdmin" style={{ background: '#021a2a', border: '1px solid #00e5ff', borderRadius: '16px', padding: '14px', fontFamily: 'sans-serif' }}>
      <b style={{ color: '#00e5ff', fontSize: '16px' }}>ÁREA RESTRITA - GADE</b>
      <div style={{ color: '#fff', fontSize: '12px', opacity: .8 }}>GADE - Grupo A Chave da Esperança / {TITULO_OFICIAL_RARU}</div>
      <div style={{ display: 'flex', gap: '8px', marginTop: '12px' }}>
        <button type="button" onClick={() => setAbaAtiva('rota')} style={{ flex: 1, background: abaAtiva === 'rota' ? '#00e5ff' : '#041e2e', color: abaAtiva === 'rota' ? '#000' : '#fff', fontWeight: 'bold', border: 'none', padding: '12px', borderRadius: '10px', cursor: 'pointer' }}>ROTAS DE FUGA</button>
        <button type="button" onClick={() => setAbaAtiva('monitor')} style={{ flex: 1, background: abaAtiva === 'monitor' ? '#00ff88' : '#041e2e', color: abaAtiva === 'monitor' ? '#000' : '#fff', fontWeight: 'bold', border: '1px solid #00e5ff', padding: '12px', borderRadius: '10px', cursor: 'pointer' }}>MONITORES</button>
      </div>
      {abaAtiva === 'rota' ? (
        <div id="painelRota">
          <input value={rNome} onChange={e => setRNome(e.target.value)} placeholder="Nome do local" style={{ width: '100%', padding: '12px', marginTop: '12px', borderRadius: '10px', border: 'none', boxSizing: 'border-box', color: '#000' }} />
          <input value={rEnd} onChange={e => setREnd(e.target.value)} placeholder="Endereço completo" style={{ width: '100%', padding: '12px', marginTop: '8px', borderRadius: '10px', border: 'none', boxSizing: 'border-box', color: '#000' }} />
          <input value={rInfo} onChange={e => setRInfo(e.target.value)} placeholder="Informações" style={{ width: '100%', padding: '12px', marginTop: '8px', borderRadius: '10px', border: 'none', boxSizing: 'border-box', color: '#000' }} />
          <select value={rTipo} onChange={e => setRTipo(e.target.value)} style={{ width: '100%', padding: '12px', marginTop: '8px', borderRadius: '10px', color: '#000' }}>
            <option>Ponto de Encontro</option>
            <option>Casa de Morador</option>
            <option>Igreja</option>
            <option>Escola / CRAS / Clínica</option>
            <option>Ponto Alto Seguro</option>
          </select>
          <button type="button" onClick={salvarRota} style={{ width: '100%', background: '#00e5ff', color: '#000', fontWeight: 'bold', border: 'none', padding: '14px', borderRadius: '10px', marginTop: '12px', cursor: 'pointer' }}>SALVAR E PUBLICAR NA ESTAÇÃO</button>
          <div id="listaRotasAdmin" style={{ marginTop: '12px' }}>
            {rotas.length === 0 ? (

                  <b>{x.tipo} - {x.nome}</b><br />{x.endereco}<br />{x.info || ''}<br />

        </div>
      ) : (
        <div id="painelMonitor">

function AdminVaultModule({ showToast, onClose, localVideos, setLocalVideos, onSelecionarPerfilVoz, perfilVozId, customTickerText, setCustomTickerText }) {

  const [isUnlocked, setIsUnlocked] = useState(false);
  const [adminSubTab, setAdminSubTab] = useState('cade');
  const [tickerInput, setTickerInput] = useState(customTickerText);

  const handleUnlock = (e) => {
    e.preventDefault();
    if (pinInput === "303500") { setIsUnlocked(true); showToast("Acesso Restrito Autorizado."); } else { showToast("PIN Incorreto."); }
  };

  const salvarTicker = (e) => {
    e.preventDefault();

    try { localStorage.setItem('raru_custom_ticker', tickerInput); } catch (e) {}
    showToast("Faixa marquee atualizada com sucesso.");

      try { localStorage.setItem('raru_local_videos', JSON.stringify(atualizados)); } catch (e) {}

function RadarMeteorologicoModule({ perfilVozId }) {
  const [dados, setDados] = useState(() => ({ ...ESTADO_CLIMA_AUTOMATICO_92.municipios }));
  const [status, setStatus] = useState('Sincronizando 92 municípios + RainViewer + GOES-19...');
  const [cidadeSel1, setCidadeSel1] = useState('Mesquita');
  const [cidadeSel2, setCidadeSel2] = useState('Duque de Caxias');
  const [modoVisualizacao, setModoVisualizacao] = useState('radar');
  const [iframeKey, setIframeKey] = useState(0);
  const [rvFrames, setRvFrames] = useState(() => ESTADO_CLIMA_AUTOMATICO_92.rainviewerFrames);

  const chartTempRef = useRef(null);
  const chartRainRef = useRef(null);

  function corPorChuva(p) {
    if (p >= 70) return '#7C4DFF';
    if (p >= 40) return '#FF0055';
    if (p >= 20) return '#FFB703';
    return '#00FF9D';
  }
  function textoPorChuva(p) {
    if (p >= 70) return 'Muito forte';
    if (p >= 40) return 'Forte';
    if (p >= 20) return 'Moderada';
    return 'Fraca / Estável';
  }

  const desenharGraficoCanvas = (canvasRef, valores, cores, sufixo) => {
    const cv = canvasRef.current;
    if (!cv) return;
    const ctx = cv.getContext('2d');
    const W = cv.width = 340, H = cv.height = 140;
    ctx.clearRect(0, 0, W, H);
    const max = Math.max(...valores, 1);
    const step = W / valores.length;
    const horaAtual = new Date().getHours();

    valores.forEach((v, i) => {
      const h = (v / max) * (H - 35);
      const x = i * step + 4;
      const grad = ctx.createLinearGradient(0, H - h, 0, H);
      grad.addColorStop(0, cores[0]);
      grad.addColorStop(1, cores[1]);
      ctx.fillStyle = grad;
      ctx.fillRect(x, H - h - 20, step - 6, h);
      ctx.fillStyle = '#FFFFFF';
      ctx.font = 'bold 9px monospace';
      ctx.textAlign = 'center';
      ctx.fillText(v + sufixo, x + (step / 2), H - h - 23);

      const horaLabel = `${String((horaAtual + i) % 24).padStart(2, '0')}h`;
      ctx.fillStyle = '#00F2FE';
      ctx.font = '600 8px monospace';
      ctx.fillText(horaLabel, x + (step / 2), H - 6);
    });
  };

  const desenharGraficosHorarios = (hourly) => {
    if (!hourly) return;
    const h = new Date().getHours();
    const temps = [], chuvas = [];
    for (let i = 0; i < 12; i++) {
      const idx = (h + i) % 24;
      temps.push(Math.round(hourly.temperature_2m[idx] || 25));
      chuvas.push(hourly.precipitation_probability[idx] || 0);
    }
    setTimeout(() => {
      desenharGraficoCanvas(chartTempRef, temps, ['#ff5252', '#ffca28'], '°C');
      desenharGraficoCanvas(chartRainRef, chuvas, ['#7c4dff', '#29b6f6'], '%');
    }, 80);
  };

  useEffect(() => {

function ModuloCidadaoSensorModule({ onGoToDashboard, showToast }) {
  const [petKg, setPetKg] = useState(10);
  const [aluminioKg, setAluminioKg] = useState(3);
  const [ferroKg, setFerroKg] = useState(15);
  const [papelaoKg, setPapelaoKg] = useState(20);
  const [vidroKg, setVidroKg] = useState(5);
  const [oleoL, setOleoL] = useState(4);

  const precoPet = 2.50, precoAluminio = 8.00, precoFerro = 1.20, precoPapelao = 0.70, precoVidro = 0.35, precoOleo = 3.00;
  const [btConectado, setBtConectado] = useState(false);
  const [btStatus, setBtStatus] = useState("Desconectado");

  const totalPet = petKg * precoPet;
  const totalAluminio = aluminioKg * precoAluminio;
  const totalFerro = ferroKg * precoFerro;
  const totalPapelao = papelaoKg * precoPapelao;
  const totalVidro = vidroKg * precoVidro;
  const totalOleo = oleoL * precoOleo;

  const valorTotalReciclagem = totalPet + totalAluminio + totalFerro + totalPapelao + totalVidro + totalOleo;
  const pesoTotalKg = Number(petKg) + Number(aluminioKg) + Number(ferroKg) + Number(papelaoKg) + Number(vidroKg) + Number(oleoL);

  const aguaEconomizadaL = (petKg * 24) + (aluminioKg * 40) + (papelaoKg * 15);
  const co2EvitadoKg = (petKg * 1.5) + (aluminioKg * 9.0) + (ferroKg * 1.8) + (papelaoKg * 0.9);
  const volumeDesobstruidoM3 = (pesoTotalKg * 0.0035).toFixed(2);

  const conectarBalancaBT = async () => {
    if (!navigator.bluetooth) { showToast("Web Bluetooth não suportado."); return; }
    try {
      setBtStatus("Buscando balança...");
      const device = await navigator.bluetooth.requestDevice({
        acceptAllDevices: true,
        optionalServices: ['battery_service', '0000181d-0000-1000-8000-00805f9b34fb']
      });
      setBtConectado(true);
      setBtStatus(`Conectado: ${device.name || 'Balança BT'}`);
      showToast(`Balança pareada: ${device.name || 'OK'}`);
    } catch (e) {
      setBtConectado(false);
      setBtStatus("Desconectado");
      showToast("Conexão Bluetooth cancelada.");
    }
  };

  const gerarReciboColeta = () => {
    const prot = `REC-SOL-${Math.floor(Math.random() * 89999 + 10000)}`;
    const textoRecibo = `[${TITULO_OFICIAL_RARU} • ${SUBTITULO_OFICIAL_RARU}]\nProtocolo: ${prot}\nLocal: Mesquita / Baixada Fluminense (GADE)\nPeso Total Acumulado: ${pesoTotalKg.toFixed(1)} KG / Litros\n\nDETALHAMENTO DO LOTE:\n- PET: ${petKg} kg (R$ ${totalPet.toFixed(2)})\n- Alumínio: ${aluminioKg} kg (R$ ${totalAluminio.toFixed(2)})\n- Ferro: ${ferroKg} kg (R$ ${totalFerro.toFixed(2)})\n- Papelão: ${papelaoKg} kg (R$ ${totalPapelao.toFixed(2)})\n- Vidro: ${vidroKg} kg (R$ ${totalVidro.toFixed(2)})\n- Óleo Usado: ${oleoL} L (R$ ${totalOleo.toFixed(2)})\n\nVALOR ESTIMADO: R$ ${valorTotalReciclagem.toFixed(2)}\n\nIMPACTO ECOLÓGICO:\n- Água poupada: ${aguaEconomizadaL.toFixed(0)} Litros\n- CO2 evitado: ${co2EvitadoKg.toFixed(1)} Kg\n- Prevenção de Alagamento: ~${volumeDesobstruidoM3} m3\n\nGADE - Grupo A Chave da Esperança - ${TITULO_OFICIAL_RARU}`;
    if (navigator.clipboard) {
      navigator.clipboard.writeText(textoRecibo).catch(() => {});
      showToast(`Recibo ${prot} copiado.`);
    }
    window.open(`https://api.whatsapp.com/send?text=${encodeURIComponent(textoRecibo)}`, '_blank');
  };

  return (
    <div className="space-y-4 max-w-6xl mx-auto font-mono">
      <div className="cyber-card p-5 sm:p-6 rounded-[28px] shadow-xl space-y-5 border border-cyberCyan/40">
        <div className="flex items-center justify-between border-b border-cyberCyan/25 pb-3">
          <div className="space-y-0.5">
            <h2 className="font-display text-xs font-black text-white tracking-widest flex items-center gap-2">
              <span className="text-cyberCyan">[BALANÇA]</span> CIDADÃO SENSOR - BALANÇA DIGITAL &amp; ESG
            </h2>
            <p className="text-[9px] font-mono text-cyberCyan font-bold">TECNOLOGIA SOCIAL - ECONOMIA CIRCULAR &amp; DRENAGEM</p>
          </div>
          <button type="button" onClick={onGoToDashboard} className="cyber-button text-[10px] py-2 px-4">PAINEL DE CONTROLE</button>
        </div>

        <div className="bg-void/90 border border-cyberCyan/30 rounded-2xl p-3.5 flex flex-col sm:flex-row items-center justify-between gap-3 shadow-inner">
          <div className="flex items-center gap-2.5">
            <span className={`w-3 h-3 rounded-full ${btConectado ? 'bg-cyberGreen animate-ping' : 'bg-cyberRose'}`}></span>
            <div>
              <span className="text-[10px] font-black text-white block">HARDWARE DE PESAGEM BLUETOOTH</span>
              <span className="text-[8px] text-slate-400 font-bold">{btStatus}</span>
            </div>
          </div>
          <button type="button" onClick={conectarBalancaBT} className={`cyber-button text-[9px] py-2 px-4 ${btConectado ? '!border-cyberGreen !text-cyberGreen' : ''}`}>
            {btConectado ? 'SISTEMA PAREADO' : 'CONECTAR HARDWARE BT'}
          </button>
        </div>

        <div className="bg-void/90 border border-cyberCyan/40 rounded-2xl p-4 space-y-4 shadow-inner">
          <div className="flex items-center justify-between border-b border-cyberCyan/30 pb-2">
            <span className="text-xs font-black text-cyberCyan uppercase tracking-wider">CONTROLE DE TRIAGEM DE RESÍDUOS</span>
            <span className="text-[9px] px-2.5 py-0.5 rounded-full bg-cyberCyan/20 text-cyberCyan border border-cyberCyan/40 font-bold">TOTAL: {pesoTotalKg.toFixed(1)} KG/L</span>
          </div>

          <div className="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-3">
            {[
              { label: `PET (${petKg} kg)`, val: petKg, set: setPetKg, max: 150, step: 1, total: totalPet, accent: 'accent-cyan-400', text: 'text-cyan-300' },
              { label: `ALUMÍNIO (${aluminioKg} kg)`, val: aluminioKg, set: setAluminioKg, max: 80, step: 0.5, total: totalAluminio, accent: 'accent-blue-400', text: 'text-blue-300' },
              { label: `FERRO (${ferroKg} kg)`, val: ferroKg, set: setFerroKg, max: 300, step: 1, total: totalFerro, accent: 'accent-amber-400', text: 'text-amber-300' },
              { label: `PAPELÃO (${papelaoKg} kg)`, val: papelaoKg, set: setPapelaoKg, max: 250, step: 1, total: totalPapelao, accent: 'accent-yellow-500', text: 'text-yellow-500' },
              { label: `VIDRO (${vidroKg} kg)`, val: vidroKg, set: setVidroKg, max: 100, step: 1, total: totalVidro, accent: 'accent-emerald-400', text: 'text-emerald-300' },
              { label: `ÓLEO USADO (${oleoL} L)`, val: oleoL, set: setOleoL, max: 50, step: 0.5, total: totalOleo, accent: 'accent-orange-400', text: 'text-orange-300' }
            ].map((item, idx) => (
              <div key={idx} className="bg-deepSpace/90 border border-cyan-400/30 rounded-xl p-3 space-y-2">
                <div className={`flex justify-between items-center text-[10px] font-bold ${item.text}`}>
                  <span>{item.label}</span>
                  <span className="text-white">R$ {item.total.toFixed(2)}</span>
                </div>
                <input type="range" min="0" max={item.max} step={item.step} value={item.val} onChange={e => item.set(Number(e.target.value))} className={`w-full ${item.accent} cursor-pointer touch-manipulation`} />
              </div>
            ))}
          </div>

          <div className="bg-commandPanel/90 border border-cyberGreen/40 rounded-xl p-3.5 space-y-2">
            <span className="text-[9px] font-black text-cyberGreen uppercase tracking-widest block">PAINEL DE IMPACTO ECOLÓGICO</span>
            <div className="grid grid-cols-3 gap-2 text-center font-mono">
              <div className="bg-void/80 border border-cyberGreen/20 p-2 rounded-lg">
                <div className="text-[7px] text-slate-400">ÁGUA POUPADA</div>
                <div className="text-xs font-bold text-cyberGreen">{aguaEconomizadaL.toFixed(0)} L</div>
              </div>
              <div className="bg-void/80 border border-cyberGreen/20 p-2 rounded-lg">
                <div className="text-[7px] text-slate-400">CO2 EVITADO</div>
                <div className="text-xs font-bold text-cyberCyan">{co2EvitadoKg.toFixed(1)} Kg</div>
              </div>
              <div className="bg-void/80 border border-cyberGreen/20 p-2 rounded-lg">
                <div className="text-[7px] text-slate-400">RALOS PRESERVADOS</div>
                <div className="text-xs font-bold text-cyberAmber">~{volumeDesobstruidoM3} m3</div>
              </div>
            </div>
          </div>

          <div className="bg-gradient-to-r from-deepSpace via-commandPanel to-deepSpace border border-cyberCyan/50 rounded-xl p-4 flex flex-col sm:flex-row items-center justify-between gap-3">
            <div className="space-y-0.5 text-center sm:text-left">

function RedeAlquinoHardwareModule({ onGoToDashboard, showToast }) {
  const sensorId = "ALQ-92-MESQUITA";
  const [hardwareIpUrl, setHardwareIpUrl] = useState(() => {
    try { return localStorage.getItem("raru_alquino_ip") || "http://192.168.4.1/data"; } catch (e) { return "http://192.168.4.1/data"; }
  });
  const [statusHardware, setStatusHardware] = useState("AGUARDANDO CONEXÃO IP");
  const [gasLevel, setGasLevel] = useState("-- PPM");
  const [hidroLevel, setHidroLevel] = useState("-- m");
  const [tempHardware, setTempHardware] = useState("-- C");
  const [isConnecting, setIsConnecting] = useState(false);

  const salvarEConectarIP = async () => {
    try {
      localStorage.setItem("raru_alquino_ip", hardwareIpUrl);
      setIsConnecting(true);
      setStatusHardware("CONECTANDO AO IP...");
      showToast(`Conectando ao IP: ${hardwareIpUrl}`);
      const res = await fetch(hardwareIpUrl, { method: 'GET', mode: 'cors' });
      const data = await res.json();
      if (data) {
        setGasLevel(data.gas ? `${data.gas} PPM` : "14 PPM (Normal)");
        setHidroLevel(data.nivelAgua ? `${data.nivelAgua} m` : "0.35 m (Estável)");
        setTempHardware(data.temperatura ? `${data.temperatura} C` : "27.1 C");
        setStatusHardware("CONECTADO (ONLINE VIA IP)");
        showToast("Hardware Alquino Sincronizado.");
      }
    } catch (err) {
      setTimeout(() => {
        const gasRand = Math.floor(Math.random() * 25 + 8);
        const hidroRand = (Math.random() * 0.4 + 0.1).toFixed(2);
        setGasLevel(`${gasRand} PPM (Normal)`);
        setHidroLevel(`${hidroRand} m (Estável)`);
        setTempHardware("26.8 C");
        setStatusHardware("SIMULAÇÃO ATIVA (IP LOCAL)");
        showToast("Modo simulação IP ativado.");
      }, 800);
    } finally {
      setIsConnecting(false);
    }
  };

  return (
    <div className="space-y-3.5 w-full font-mono max-w-5xl mx-auto">
      <div className="cyber-card space-y-3.5 border border-cyberCyan/40 shadow-2xl p-4">
        <div className="flex items-center justify-between border-b border-cyberCyan/25 pb-2.5">
          <div className="space-y-0.5">
            <h2 className="font-display text-[11px] font-black text-white tracking-widest flex items-center gap-1.5">
              REDE ALQUINO - HARDWARE FÍSICO
            </h2>
            <p className="text-[8px] font-mono text-cyberCyan font-bold">ACOPLAMENTO DE APARELHAGEM TECNOLÓGICA • {TITULO_OFICIAL_RARU}</p>
          </div>
          <button type="button" onClick={onGoToDashboard} className="cyber-button text-[10px] py-2 px-3">PAINEL</button>
        </div>

        <div className="bg-void/90 border border-cyberCyan/40 p-3 rounded-xl space-y-2 shadow-inner">
          <label className="text-[9px] text-cyberCyan font-bold uppercase block">Endereço IP / URL do Microcontrolador</label>
          <div className="flex flex-col sm:flex-row gap-2">
            <input type="text" value={hardwareIpUrl} onChange={(e) => setHardwareIpUrl(e.target.value)} placeholder="Ex: http://192.168.4.1/data" className="flex-1 bg-deepSpace border border-cyberCyan/40 rounded-xl p-2.5 text-xs text-white font-mono touch-manipulation" />
            <button type="button" onClick={salvarEConectarIP} disabled={isConnecting} className="cyber-button-solid text-xs py-2.5 px-4">
              {isConnecting ? "CONECTANDO..." : "CONECTAR IP"}
            </button>
          </div>
        </div>

        <div className="grid grid-cols-2 sm:grid-cols-4 gap-2.5">
          <div className="bg-void/90 border border-cyberCyan/30 rounded-xl p-3 space-y-0.5">
            <span className="text-[7px] text-slate-400 uppercase tracking-widest block">ID SENSOR</span>
            <span className="text-[10px] font-bold text-cyberCyan truncate block">{sensorId}</span>
          </div>
          <div className="bg-void/90 border border-cyberCyan/30 rounded-xl p-3 space-y-0.5">
            <span className="text-[7px] text-slate-400 uppercase tracking-widest block">STATUS</span>
            <span className="text-[10px] font-bold text-cyberGreen truncate block">{statusHardware}</span>
          </div>
          <div className="bg-void/90 border border-cyberCyan/30 rounded-xl p-3 space-y-0.5">
            <span className="text-[7px] text-slate-400 uppercase tracking-widest block">GASES</span>
            <span className="text-[10px] font-bold text-white truncate block">{gasLevel}</span>
          </div>
          <div className="bg-void/90 border border-cyberCyan/30 rounded-xl p-3 space-y-0.5">
            <span className="text-[7px] text-slate-400 uppercase tracking-widest block">HÍDRICO</span>
            <span className="text-[10px] font-bold text-white truncate block">{hidroLevel}</span>
          </div>
        </div>

        <div className="bg-void/80 border border-cyberCyan/20 rounded-xl p-2.5 flex items-center justify-between text-[10px]">
          <span className="text-slate-400">TEMPERATURA DO MÓDULO</span>
          <span className="font-bold text-cyberCyan">{tempHardware}</span>
        </div>
      </div>
    </div>
  );
}

  });

  const falarESarahInteragir = (textoCustom = null) => {
    const mSnap = ESTADO_CLIMA_AUTOMATICO_92.municipios[municipioSelecionado.n];
    const baseClima = mSnap ? `${mSnap.temp}, chuva ${mSnap.chuva}, ${mSnap.risco}.` : "";

      ? `Tô contigo aqui na subestação de ${municipioSelecionado.n}, ${userName}. ${baseClima}`
      : `Tô contigo aqui na subestação de ${municipioSelecionado.n}. ${baseClima}`);
    setSarahState({ isSpeaking: true, speechText: textoFala });
    if (soundEnabled) falarImitada(textoFala, perfilVozId || vozSelecionada);
    setTimeout(() => setSarahState(prev => ({ ...prev, isSpeaking: false })), 4000);
  };

  const desenharGraficoCanvas = (canvasRef, valores, cores, label) => {
    const cv = canvasRef.current;
    if (!cv) return;
    const ctx = cv.getContext('2d');
    const W = cv.width = 320, H = cv.height = 140;
    ctx.clearRect(0, 0, W, H);
    const max = Math.max(...valores, 1);
    const step = W / valores.length;
    valores.forEach((v, i) => {
      const h = (v / max) * (H - 30);
      const x = i * step + 4;
      const grad = ctx.createLinearGradient(0, H - h, 0, H);
      grad.addColorStop(0, cores[0]); grad.addColorStop(1, cores[1]);
      ctx.fillStyle = grad;
      ctx.fillRect(x, H - h - 15, step - 6, h);
      ctx.fillStyle = '#00F2FE'; ctx.font = 'bold 9px monospace';
      ctx.fillText(v + label, x, H - h - 18);
    });
  };

  const desenharGraficosEstacao = (hourly) => {
    const h = new Date().getHours();
    const temps = [], probs = [];
    for (let i = 0; i < 8; i++) {
      const idx = (h + i) % 24;
      temps.push(Math.round(hourly.temperature_2m[idx] || 25));
      probs.push(hourly.precipitation_probability[idx] || 0);

  const adicionarZeladoria = (e) => {
    e.preventDefault();
    if (!acaoZel || !localZel) { showToast("Preencha a ação e o local."); return; }
    const novo = { id: Date.now(), acao: acaoZel, local: localZel, resp: userName || "Operador GADE", data: new Date().toLocaleDateString('pt-BR'), status: "Registrado" };
    const atualizados = [novo, ...zeladoriaLogs];

    try { localStorage.setItem("raru_zeladoria_logs", JSON.stringify(atualizados)); } catch (e) {}
    setAcaoZel(''); setLocalZel('');
    showToast("Atividade salva no Diário de Zeladoria.");

  return (

            &quot;{sarahState.speechText}&quot;

          if (cap.zoom) { hasZoom = true; maxZoom = Math.min(cap.zoom.max || 5, 8); zoom = Math.max(1, cap.zoom.min || 1); }
        }
        if (btnZ) btnZ.textContent = "Zoom: " + zoom.toFixed(1) + "x" + (hasZoom ? "" : " (dig)");
        $("camStatus").textContent = "Câmera ligada (" + (facing === "user" ? "frontal" : "traseira") + ") • HUD ativo";
        falar("Câmera ligada.");
      } catch (e) {
        $("camStatus").textContent = "Sem acesso à câmera — use 'Escolher foto' ou 'Usar padrão Mesquita'.";
        falar("Sem acesso à câmera. Você pode escolher uma foto da galeria.");

    async function sha256(buf) {
      const d = await crypto.subtle.digest("SHA-256", buf);
      return Array.from(new Uint8Array(d)).map(b => b.toString(16).padStart(2, "0")).join("");
    }

      navigator.geolocation.getCurrentPosition(
        p => {
          gps = { lat: p.coords.latitude, lon: p.coords.longitude, acc: "±" + Math.round(p.coords.accuracy) + "m" };
          $("gpsTxt").textContent = `GPS: ${gps.lat.toFixed(6)}, ${gps.lon.toFixed(6)} (${gps.acc})`;

    async function baterFoto() {
      const v = $("video");
      if (!stream || !v || v.readyState < 2) {
        if (showToast) showToast("Ligue a câmera primeiro.");
        falar("Ligue a câmera primeiro.");
        return;
      }
      const cv = document.createElement("canvas");
      cv.width = v.videoWidth || 1280;
      cv.height = v.videoHeight || 720;
      const ctx = cv.getContext("2d");
      if (!hasZoom && zoom > 1) {
        const sw = cv.width / zoom, sh = cv.height / zoom, sx = (cv.width - sw) / 2, sy = (cv.height - sh) / 2;
        ctx.drawImage(v, sx, sy, sw, sh, 0, 0, cv.width, cv.height);
      } else {
        ctx.drawImage(v, 0, 0, cv.width, cv.height);
      }
      const linhas = montarCarimboTexto().split("\n");
      const pad = Math.round(cv.height * 0.02);
      const fs = Math.max(15, Math.round(cv.height * 0.024));
      const bh = linhas.length * (fs + 6) + pad * 2;
      ctx.fillStyle = "rgba(3,7,18,0.88)";
      ctx.fillRect(pad, cv.height - bh - pad, cv.width - pad * 2, bh);
      ctx.strokeStyle = "#00F2FE";
      ctx.lineWidth = 2;
      ctx.strokeRect(pad, cv.height - bh - pad, cv.width - pad * 2, bh);
      ctx.fillStyle = "#fff";
      ctx.font = `bold ${fs}px monospace`;
      linhas.forEach((l, i) => ctx.fillText(l, pad + 12, cv.height - bh - pad + pad + fs + i * (fs + 6)));

      const blob = await new Promise(r => cv.toBlob(r, "image/jpeg", 0.92));
      fotoBlob = blob;
      foto = cv.toDataURL("image/jpeg", 0.92);
      hash = await sha256(await blob.arrayBuffer());
      $("imgPreview").src = foto;
      $("imgPreview").style.display = "block";
      v.style.display = "none";
      if ($("hud")) $("hud").classList.remove("on");
      if ($("scanLine")) $("scanLine").style.display = "none";
      atualizarCarimboUI();
      tocarAlertaSonoro("captura");
      $("camStatus").textContent = "Foto capturada e carimbada com SHA-256.";
      falar("Foto capturada e carimbada.");
      salvarRascunho();
    }

    function escapePdf(s) {
      return String(s || "").replace(/[^\x20-\x7E]/g, c => {
        const map = { "á": "a", "à": "a", "â": "a", "ã": "a", "é": "e", "ê": "e", "í": "i", "ó": "o", "ô": "o", "õ": "o", "ú": "u", "ç": "c", "Á": "A", "À": "A", "Â": "A", "Ã": "A", "É": "E", "Ê": "E", "Í": "I", "Ó": "O", "Ô": "O", "Õ": "O", "Ú": "U", "Ç": "C", "°": "o", "•": "-" };
        return map[c] || " ";
      }).replace(/\\/g, "\\\\").replace(/\(/g, "\\(").replace(/\)/g, "\\)");
    }

    function construirPdfBytes(linhas) {
      const pageLinhas = linhas.slice(0, 46);
      let streamCmd = "BT\n/F1 10 Tf\n42 750 Td\n14 TL\n";
      pageLinhas.forEach((l, idx) => {
        if (idx === 0) streamCmd += `(${escapePdf(l)}) Tj\n`;
        else streamCmd += `T* (${escapePdf(l)}) Tj\n`;
      });
      streamCmd += "ET\n";

      const objs = [
        "1 0 obj\n<< /Type /Catalog /Pages 2 0 R >>\nendobj\n",
        "2 0 obj\n<< /Type /Pages /Kids [3 0 R] /Count 1 >>\nendobj\n",
        "3 0 obj\n<< /Type /Page /Parent 2 0 R /MediaBox [0 0 612 792] /Contents 4 0 R /Resources << /Font << /F1 5 0 R >> >> >>\nendobj\n",
        `4 0 obj\n<< /Length ${streamCmd.length} >>\nstream\n${streamCmd}endstream\nendobj\n`,
        "5 0 obj\n<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica >>\nendobj\n"
      ];

      let pdf = "%PDF-1.4\n";
      const offsets = [0];
      objs.forEach(o => { offsets.push(pdf.length); pdf += o; });
      const xrefStart = pdf.length;
      pdf += `xref\n0 ${objs.length + 1}\n0000000000 65535 f \n`;
      for (let i = 1; i <= objs.length; i++) {
        pdf += String(offsets[i]).padStart(10, "0") + " 00000 n \n";
      }
      pdf += `trailer\n<< /Size ${objs.length + 1} /Root 1 0 R >>\nstartxref\n${xrefStart}\n%%EOF`;
      return new Blob([pdf], { type: "application/pdf" });
    }

          for (let i = 0; i < l.length; i += 88) chunks.push(l.slice(i, i + 88));

        $$("#riscosBox .chip").forEach(b => b.classList.toggle("ativo", riscos.includes(b.dataset.r)));
        if (hash) atualizarCarimboUI();
        if (hashAss) $("statusAss").textContent = `Assinado por ${nomeAss} em ${dataHoraAss} • SHA-256: ${hashAss.slice(0, 16)}...`;
      } catch (e) {}
    }

    function limparTudo() {
      if (!confirm("Limpar todos os campos da vistoria atual?")) return;
      desligarCamera(true);
      pararSirene(true);
      foto = ""; fotoBlob = null; hash = ""; tiposSel = []; riscos = []; relGerado = "";

      if ($("obs")) $("obs").value = "";
      if ($("relatorio")) $("relatorio").value = "";

      limparAssinatura();
      atualizarChipsTipos();
      $$("#riscosBox .chip").forEach(b => b.classList.remove("ativo"));
      try { localStorage.removeItem(KEY); } catch (e) {}
      if (showToast) showToast("Campos da vistoria limpos.");
      falar("Campos limpos.");
    }

    popularMunicipios();
    popularFrentes();
    popularTipos();
    renderizarLista();
    carregarRascunho();
    if (!gps.lat && !gps.lon) {

    $$("#riscosBox .chip").forEach(b => {

function VideosModule({ onBackToDashboard, showToast, localVideos }) {
  const [selectedVideo, setSelectedVideo] = useState(null);
  const [customUrl, setCustomUrl] = useState("");
  const [customTitle, setCustomTitle] = useState("");
  const [urlVideos, setUrlVideos] = useState(() => {
    try {
      const saved = localStorage.getItem("raru_url_videos");
      if (saved) return JSON.parse(saved);
    } catch (e) {}
    return [];
  });

  const allVideos = [...localVideos, ...urlVideos];

  const handleAddUrlVideo = (e) => {
    e.preventDefault();
    if (!customUrl.trim()) { showToast("Insira uma URL de vídeo válida."); return; }
    const novo = { id: Date.now(), title: customTitle.trim() || "Vídeo Externo", url: customUrl.trim(), type: "external" };
    const atualizados = [novo, ...urlVideos];
    setUrlVideos(atualizados);
    try { localStorage.setItem("raru_url_videos", JSON.stringify(atualizados)); } catch (e) {}
    setCustomUrl(""); setCustomTitle("");
    showToast("Vídeo salvo na galeria.");
  };

  return (
    <div className="space-y-4 w-full font-mono max-w-5xl mx-auto">
      <div className="cyber-card p-4 shadow-xl space-y-4 border border-cyberCyan/40">
        <div className="flex items-center justify-between border-b border-cyberCyan/25 pb-2.5">
          <h2 className="font-display text-xs font-black text-cyberCyan tracking-widest">GALERIA DE VÍDEOS &amp; TRANSMISSÕES</h2>
          {onBackToDashboard && <button type="button" onClick={onBackToDashboard} className="cyber-button text-[10px] py-1.5 px-3">PAINEL</button>}
        </div>

        <form onSubmit={handleAddUrlVideo} className="bg-void/90 border border-cyberCyan/30 rounded-xl p-3 space-y-2">
          <span className="text-[10px] font-black text-cyberCyan block">ADICIONAR VÍDEO POR URL</span>
          <input type="text" value={customTitle} onChange={e => setCustomTitle(e.target.value)} placeholder="Título do vídeo..." className="w-full bg-deepSpace border border-cyberCyan/30 rounded-xl p-2 text-xs text-white" />
          <div className="flex gap-2">
            <input type="text" value={customUrl} onChange={e => setCustomUrl(e.target.value)} placeholder="https://..." className="flex-1 bg-deepSpace border border-cyberCyan/30 rounded-xl p-2 text-xs text-white" />
            <button type="submit" className="cyber-button-solid text-[10px] px-4">SALVAR</button>
          </div>
        </form>

        {selectedVideo && (
          <div className="bg-void border border-cyberCyan/50 rounded-2xl p-3 space-y-2">
            <div className="flex justify-between items-center">
              <span className="text-xs font-bold text-white">{selectedVideo.title}</span>
              <button type="button" onClick={() => setSelectedVideo(null)} className="cyber-button-danger text-[10px] py-1 px-2.5 !min-h-[28px]">FECHAR PLAYER</button>
            </div>
            <video src={selectedVideo.url} controls autoPlay className="w-full max-h-[360px] rounded-xl bg-black"></video>
          </div>
        )}

        <div className="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-3">
          {allVideos.length === 0 ? (
            <div className="col-span-full text-center text-xs text-slate-400 py-8 bg-void/60 rounded-xl border border-dashed border-cyberCyan/25">
              Nenhum vídeo cadastrado no momento.
            </div>
          ) : (
            allVideos.map(v => (
              <div key={v.id} onClick={() => setSelectedVideo(v)} className="bg-void/90 border border-cyberCyan/30 rounded-xl p-3 cursor-pointer hover:border-cyberCyan transition">
                <span className="text-xs font-bold text-white block truncate">{v.title}</span>
                <span className="text-[9px] text-cyberCyan font-mono uppercase">{v.type === 'local' ? 'Arquivo Local' : 'Link Externo'}</span>
              </div>
            ))
          )}
        </div>
      </div>
    </div>
  );
}

function SarahChatModal({ isOpen, onClose, municipioAtual, bairroAtual, abaAtual, userName, onAtualizarNome, perfilVozId }) {
  const [messages, setMessages] = useState([]);
  const [inputText, setInputText] = useState("");
  const [isLoading, setIsLoading] = useState(false);
  const [isListening, setIsListening] = useState(false);
  const chatEndRef = useRef(null);

  useEffect(() => {
    if (isOpen && messages.length === 0) {
      const mSnap = ESTADO_CLIMA_AUTOMATICO_92.municipios[municipioAtual || "Mesquita"];
      const resumo = mSnap ? ` Em ${municipioAtual || "Mesquita"}: ${mSnap.temp}, chuva ${mSnap.chuva} (prob. ${mSnap.probChuva}), vento ${mSnap.vento}, ${mSnap.risco}.` : "";
      const abertura = userName
        ? `Olá, ${userName}. Sou o ROBOT SARAH SYSTEM RARU do ${TITULO_OFICIAL_RARU} (${SUBTITULO_OFICIAL_RARU} — ${COMPLEMENTO_OFICIAL_RARU}).${resumo} Como posso ajudar agora?`
        : `Olá. Sou o ROBOT SARAH SYSTEM RARU do ${TITULO_OFICIAL_RARU} (${SUBTITULO_OFICIAL_RARU} — ${COMPLEMENTO_OFICIAL_RARU}).${resumo} Qual é o seu nome e o que você gostaria de consultar?`;
      setMessages([{ sender: 'ai', text: abertura }]);
      falarImitada(abertura, perfilVozId);
    }
  }, [isOpen, municipioAtual, userName]);

  useEffect(() => {
    if (chatEndRef.current) chatEndRef.current.scrollIntoView({ behavior: "smooth" });
  }, [messages]);

  const handleSend = async (textOverride = null) => {
    const raw = typeof textOverride === "string" ? textOverride : inputText;
    const text = raw.trim();
    if (!text || isLoading) return;
    if (!textOverride) setInputText("");

    let nomeAtivo = userName;
    const matchNome = text.match(/(?:meu nome [ée]|me chamo|pode me chamar de|sou o|sou a)\s+([a-zà-ú]+)/i);
    if (matchNome && matchNome[1]) {
      nomeAtivo = matchNome[1].charAt(0).toUpperCase() + matchNome[1].slice(1).toLowerCase();
      if (onAtualizarNome) onAtualizarNome(nomeAtivo);
    }

    const novaLista = [...messages, { sender: 'user', text }];
    setMessages(novaLista);
    setIsLoading(true);

    try {
      const histApi = novaLista.map(m => ({
        role: m.sender === 'user' ? 'user' : 'assistant',
        content: m.text
      }));
      const respostaIa = await chamarSarah('conversa', histApi, municipioAtual, bairroAtual, abaAtual, ESTADO_CLIMA_AUTOMATICO_92.municipios[municipioAtual], nomeAtivo);
      const limpo = bloquearCalmaAlexander(respostaIa);
      setMessages(prev => [...prev, { sender: 'ai', text: limpo }]);
      falarImitada(limpo, perfilVozId);
    } catch (e) {
      const fallback = nomeAtivo
        ? `Recebi sua mensagem, ${nomeAtivo}. O monitoramento dos 92 municípios do RJ está ativo com GOES-19 e RainViewer.`
        : "Recebi sua mensagem. Qual é o seu nome para eu te chamar certinho durante nossa conversa?";
      setMessages(prev => [...prev, { sender: 'ai', text: fallback }]);
      falarImitada(fallback, perfilVozId);
    } finally {
      setIsLoading(false);
    }
  };

  const iniciarVozMicrofone = () => {
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SR) {
      setMessages(prev => [...prev, { sender: 'ai', text: "Reconhecimento de voz não disponível neste navegador. Digite sua mensagem por aqui." }]);
      return;
    }
    try {
      const rec = new SR();
      rec.lang = "pt-BR";
      rec.interimResults = false;
      setIsListening(true);
      rec.onresult = (ev) => {
        const falaCapturada = ev.results?.[0]?.[0]?.transcript || "";
        setIsListening(false);
        if (falaCapturada) handleSend(falaCapturada);
      };
      rec.onerror = () => setIsListening(false);
      rec.onend = () => setIsListening(false);
      rec.start();
    } catch (e) {
      setIsListening(false);
    }
  };

  if (!isOpen) return null;

  return (
    <div className="fixed inset-0 z-[130] flex items-center justify-center bg-void/90 backdrop-blur-xl p-3 sm:p-4" onClick={onClose}>
      <div className="cyber-card w-full max-w-lg rounded-2xl border border-cyberCyan/60 flex flex-col max-h-[85vh] overflow-hidden font-mono" onClick={e => e.stopPropagation()}>
        <div className="flex items-center justify-between px-4 py-3 border-b border-cyberCyan/30 bg-deepSpace/95">
          <div>
            <span className="font-display text-xs font-black text-cyberCyan block">ROBOT SARAH SYSTEM RARU</span>
            <span className="text-[9px] text-slate-400">{TITULO_OFICIAL_RARU} • {COMPLEMENTO_OFICIAL_RARU} • {municipioAtual || "Mesquita"}</span>
          </div>
          <button type="button" onClick={onClose} className="cyber-button-danger text-xs py-1 px-3 !min-h-[32px]">FECHAR</button>
        </div>

        <div className="flex-1 overflow-y-auto p-3.5 space-y-2.5 bg-void/70">
          {messages.map((m, idx) => (
            <div key={idx} className={`rounded-xl p-3 text-xs leading-relaxed permitir-selecao ${m.sender === 'user' ? 'bg-cyberCyan/20 border border-cyberCyan/40 text-white ml-8' : 'bg-deepSpace/90 border border-cyberCyan/20 text-slate-200 mr-8'}`}>
              <span className="block text-[9px] font-black uppercase text-cyberCyan mb-1">{m.sender === 'user' ? (userName || 'VOCÊ') : 'SARAH AI'}</span>
              <span>{m.text}</span>
            </div>
          ))}
          {isLoading && <div className="text-[11px] text-cyberCyan animate-pulse">Processando telemetria e contexto...</div>}
          <div ref={chatEndRef}></div>
        </div>

        <form onSubmit={(e) => { e.preventDefault(); handleSend(); }} className="p-3 border-t border-cyberCyan/30 bg-deepSpace flex items-center gap-2">
          <button type="button" onClick={iniciarVozMicrofone} className={`cyber-button text-[10px] px-3 !min-h-[40px] ${isListening ? '!bg-cyberRose !text-white !border-cyberRose' : ''}`}>
            {isListening ? "OUVINDO..." : "VOZ"}
          </button>
          <input type="text" value={inputText} onChange={e => setInputText(e.target.value)} placeholder="Fale ou digite sua pergunta..." className="flex-1 bg-void border border-cyberCyan/40 rounded-xl px-3 py-2 text-xs text-white permitir-selecao" />
          <button type="submit" disabled={isLoading} className="cyber-button-solid text-[10px] px-4 !min-h-[40px]">ENVIAR</button>
        </form>
      </div>
    </div>
  );
}

function ModalNomeOperador({ isOpen, onClose, userName, onSalvarNome }) {
  const [nomeInput, setNomeInput] = useState(userName || "");

  useEffect(() => {
    setNomeInput(userName || "");
  }, [userName, isOpen]);

  if (!isOpen) return null;

  const salvar = (e) => {
    e.preventDefault();
    onSalvarNome(nomeInput.trim());
    onClose();
  };

  return (
    <div className="fixed inset-0 z-[140] flex items-center justify-center bg-void/90 backdrop-blur-xl p-4" onClick={onClose}>
      <div className="cyber-card w-full max-w-sm rounded-2xl border border-cyberCyan/60 p-4 space-y-3 font-mono" onClick={e => e.stopPropagation()}>
        <div className="flex justify-between items-center border-b border-cyberCyan/30 pb-2">
          <span className="font-display text-xs font-black text-cyberCyan">IDENTIFICAÇÃO NA SESSÃO</span>
          <button type="button" onClick={onClose} className="cyber-button-danger text-[10px] py-1 px-2.5 !min-h-[28px]">FECHAR</button>
        </div>
        <p className="text-[11px] text-slate-300 leading-relaxed">
          Qual nome você quer usar nesta conversa com a Sarah e com o robô?
        </p>
        <form onSubmit={salvar} className="space-y-2.5">
          <input type="text" value={nomeInput} onChange={e => setNomeInput(e.target.value)} placeholder="Digite seu nome..." className="w-full bg-void border border-cyberCyan/40 rounded-xl p-2.5 text-xs text-white permitir-selecao" />
          <div className="flex gap-2">
            <button type="button" onClick={() => { onSalvarNome(""); onClose(); }} className="cyber-button text-[10px] flex-1 !min-h-[38px]">LIMPAR</button>
            <button type="submit" className="cyber-button-solid text-[10px] flex-1 !min-h-[38px]">SALVAR</button>
          </div>
        </form>
      </div>
    </div>
  );
}

const APP_FOOTER_TEXT = "RARU NEXUS V11.2 PLUS — Rede Automatizada de Resiliência Urbana • Projeto Cidadão Sensor • Mesquita - RJ";

function AppFooter() {
  return (
    <footer className="w-full text-center py-3 text-[11px] font-mono text-slate-400">
      {APP_FOOTER_TEXT}
    </footer>
  );
}

function App() {
  const [activeTab, setActiveTab] = useState('dashboard');
  const [toast, setToast] = useState(null);
  const [isSarahChatOpen, setIsSarahChatOpen] = useState(false);
  const [isQuemSomosOpen, setIsQuemSomosOpen] = useState(false);
  const [isNameModalOpen, setIsNameModalOpen] = useState(false);

  const [userName, setUserName] = useState(() => {
    try { return localStorage.getItem("raru_user_name") || ""; } catch (e) { return ""; }
  });

  const [soundEnabled, setSoundEnabled] = useState(() => {
    try { return localStorage.getItem("raru_sound_enabled") !== "false"; } catch (e) { return true; }
  });
  const [vozSelecionada] = useState(0);
  const [perfilVozId, setPerfilVozId] = useState(() => {
    try { return localStorage.getItem("raru_perfil_voz") || "sarah"; } catch (e) { return "sarah"; }
  });

  const [customTickerText, setCustomTickerText] = useState(() => {
    try { return localStorage.getItem('raru_custom_ticker') || `${TITULO_OFICIAL_RARU} • ${SUBTITULO_OFICIAL_RARU} • ${COMPLEMENTO_OFICIAL_RARU} • 92 MUNICÍPIOS RJ + GOES-19 + RAINVIEWER ATIVO 24H • GADE • PROJETO CIDADÃO SENSOR • MESQUITA - RJ`; }
    catch (e) { return `${TITULO_OFICIAL_RARU} • ${SUBTITULO_OFICIAL_RARU} • ${COMPLEMENTO_OFICIAL_RARU} • 92 MUNICÍPIOS RJ • MESQUITA - RJ`; }
  });

  const [isWallMode, setIsWallMode] = useState(() => {
    try { return localStorage.getItem("raru_wall_mode") === "true"; } catch (e) { return false; }
  });

  const [localVideos, setLocalVideos] = useState(() => {
    try {
      const saved = localStorage.getItem("raru_local_videos");
      if (saved) return JSON.parse(saved);
    } catch (e) {}
    return [];
  });

  const [screenInfo, setScreenInfo] = useState({ width: typeof window !== 'undefined' ? window.innerWidth : 390, height: typeof window !== 'undefined' ? window.innerHeight : 844, type: "SMARTPHONE" });

  const salvarNomeOperador = (novoNome) => {
    const limpo = (novoNome || "").trim();
    setUserName(limpo);
    try {
      if (limpo) localStorage.setItem("raru_user_name", limpo);
      else localStorage.removeItem("raru_user_name");
    } catch (e) {}
    if (toast) showToast(limpo ? `Nome definido: ${limpo}` : "Nome removido da sessão.");
  };

  useEffect(() => {
    sincronizarTelemetria92RJ();
    const timer92 = setInterval(() => sincronizarTelemetria92RJ(), 300000);
    return () => clearInterval(timer92);
  }, []);

  useEffect(() => {
    const updateScreen = () => {
      const w = window.innerWidth, h = window.innerHeight;
      let t = "SMARTPHONE";
      if (w >= 1500) t = "SMART TV 4K / MURAL GIGANTE";
      else if (w >= 1100) t = "SMART TV / PROJETOR / DESKTOP";
      else if (w >= 768) t = "TABLET / MONITOR";
      setScreenInfo({ width: w, height: h, type: t });
    };
    updateScreen();
    window.addEventListener("resize", updateScreen);
    return () => window.removeEventListener("resize", updateScreen);
  }, []);

  const toggleWallMode = (forceState = null) => {
    const next = typeof forceState === "boolean" ? forceState : !isWallMode;
    setIsWallMode(next);
    try { localStorage.setItem("raru_wall_mode", String(next)); } catch (e) {}
    if (typeof document !== "undefined" && document.body) {
      document.body.classList.toggle("hud-wall-mode", next);
      document.body.classList.toggle("hud-expanded-mode", next);
      const vw = typeof window !== "undefined" ? window.innerWidth : 1024;
      const baseScale = vw >= 1500 ? 1.35 : vw >= 1100 ? 1.22 : vw >= 768 ? 1.12 : 1.03;
      const wallScale = next ? Math.min(1.5, Number((baseScale * 1.12).toFixed(2))) : baseScale;
      document.body.style.setProperty("--raru-ui-scale", String(wallScale));
    }
    showToast(next ? "WALL MODE ATIVADO • Tela expandida" : "WALL MODE DESATIVADO");
  };

  useEffect(() => {
    if (typeof document !== "undefined" && document.body) {
      document.body.classList.toggle("hud-wall-mode", isWallMode);
      document.body.classList.toggle("hud-expanded-mode", isWallMode);
      const vw = typeof window !== "undefined" ? window.innerWidth : 1024;
      const baseScale = vw >= 1500 ? 1.35 : vw >= 1100 ? 1.22 : vw >= 768 ? 1.12 : 1.03;
      const wallScale = isWallMode ? Math.min(1.5, Number((baseScale * 1.12).toFixed(2))) : baseScale;
      document.body.style.setProperty("--raru-ui-scale", String(wallScale));
    }
  }, [isWallMode]);

  const showToast = (msg) => {
    setToast(msg);
    setTimeout(() => setToast(null), 3500);
  };

  const navItems = [
    { id: 'dashboard', label: 'Painel', icon: IconDashboard },
    { id: 'radar', label: 'Radar', icon: IconRadar },
    { id: 'vistoria', label: 'Vistoria', icon: IconVistoria },
    { id: 'estacao', label: 'Estação', icon: IconEstacao },
    { id: 'alquino', label: 'Alquino', icon: IconAlquino },
    { id: 'balanca', label: 'Balança', icon: IconBalanca },
    { id: 'videos', label: 'Vídeos', icon: IconVideos },
    { id: 'admin', label: 'Admin', icon: IconAdmin },
  ];

  return (
    <div id="raruAppRoot" className={`seu-container-raru min-h-screen w-full text-slate-200 flex flex-col justify-between font-sans ${isWallMode ? 'modo-parede' : ''}`}>
      <div className="w-full bg-deepSpace/95 border-b border-cyberCyan/30 px-3 py-1.5 flex items-center justify-between gap-2 overflow-x-auto whitespace-nowrap text-[10px] font-mono rounded-xl mb-3">
        <div className="flex items-center gap-2 shrink-0">
          <span className="font-display font-black text-cyberCyan tracking-wider">{TITULO_OFICIAL_RARU}</span>
          <span className="px-2 py-0.5 rounded-full bg-cyberGreen/15 border border-cyberGreen/40 text-cyberGreen font-bold text-[9px]">{COMPLEMENTO_OFICIAL_RARU}</span>
        </div>
        <div className="overflow-hidden flex-1 mx-2 bg-void/80 border border-cyberCyan/20 rounded-full py-0.5 px-2">
          <div style={{ display: 'inline-block', whiteSpace: 'nowrap', animation: 'tickerScroll 28s linear infinite', color: '#E0F2FE', fontSize: '9px' }}>
            {customTickerText} &nbsp;&nbsp;&nbsp; • &nbsp;&nbsp;&nbsp; {customTickerText}
          </div>
        </div>
        <div className="flex items-center gap-1.5 shrink-0">
          <button type="button" onClick={() => {
            const next = !soundEnabled;
            setSoundEnabled(next);
            try { localStorage.setItem("raru_sound_enabled", String(next)); } catch (e) {}
            showToast(next ? "Voz ativada." : "Voz silenciada.");
          }} className="raru-store-btn !py-1 !px-2 !text-[9px]">
            {soundEnabled ? "SOM: ON" : "SOM: OFF"}
          </button>
          <button type="button" onClick={() => setIsNameModalOpen(true)} className="raru-store-btn !py-1 !px-2 !text-[9px]">
            {userName ? `NOME: ${userName}` : "SEU NOME"}
          </button>
          <button type="button" onClick={() => toggleWallMode()} className={`raru-store-btn !py-1 !px-2 !text-[9px] ${isWallMode ? 'ativo' : ''}`}>
            WALL
          </button>
        </div>
      </div>

      {toast && (
        <div className="fixed top-14 left-1/2 -translate-x-1/2 z-[150] bg-void/95 border border-cyberCyan text-cyberCyan px-4 py-2 rounded-full text-xs font-mono font-bold shadow-[0_0_25px_rgba(0,242,254,0.45)]">
          {toast}
        </div>
      )}

      <main className="flex-1 w-full">
        {activeTab === 'dashboard' && (
          <CardIdentidadeVisualRARU
            openSarahChat={() => setIsSarahChatOpen(true)}
            handleWhoAmIClick={() => setIsQuemSomosOpen(true)}
            setActiveTab={setActiveTab}
            toggleWallMode={toggleWallMode}
            isWallMode={isWallMode}
            screenInfo={screenInfo}
            userName={userName}
            onOpenNameModal={() => setIsNameModalOpen(true)}
          />
        )}

        {activeTab === 'radar' && (
          <RadarMeteorologicoModule perfilVozId={perfilVozId} />
        )}

        {activeTab === 'vistoria' && (
          <VistoriaRARU_NEXUS
            onBackToDashboard={() => setActiveTab('dashboard')}
            showToast={showToast}
            perfilVozId={perfilVozId}
            userName={userName}
          />
        )}

        {activeTab === 'estacao' && (
          <EstacaoSobrevivenciaModuleV12
            showToast={showToast}
            userName={userName}
            onAtualizarNome={salvarNomeOperador}
            onNavegarModulo={setActiveTab}
            soundEnabled={soundEnabled}
            vozSelecionada={vozSelecionada}
            perfilVozId={perfilVozId}
            openSarahChat={() => setIsSarahChatOpen(true)}
          />
        )}

        {activeTab === 'alquino' && (
          <RedeAlquinoHardwareModule
            onGoToDashboard={() => setActiveTab('dashboard')}
            showToast={showToast}
          />
        )}

        {activeTab === 'balanca' && (
          <ModuloCidadaoSensorModule
            onGoToDashboard={() => setActiveTab('dashboard')}
            showToast={showToast}
          />
        )}

        {activeTab === 'videos' && (
          <VideosModule
            onBackToDashboard={() => setActiveTab('dashboard')}
            showToast={showToast}
            localVideos={localVideos}
          />
        )}

        {activeTab === 'admin' && (
          <AdminVaultModule
            showToast={showToast}
            onClose={() => setActiveTab('dashboard')}
            localVideos={localVideos}
            setLocalVideos={setLocalVideos}
            onSelecionarPerfilVoz={setPerfilVozId}
            perfilVozId={perfilVozId}
            customTickerText={customTickerText}
            setCustomTickerText={setCustomTickerText}
          />
        )}
      </main>

      <SarahFabButton openSarahChat={() => setIsSarahChatOpen(true)} isSpeaking={false} />

      <SarahChatModal
        isOpen={isSarahChatOpen}
        onClose={() => setIsSarahChatOpen(false)}
        municipioAtual="Mesquita"
        bairroAtual="Rocha Sobrinho"
        abaAtual={activeTab}
        userName={userName}
        onAtualizarNome={salvarNomeOperador}
        perfilVozId={perfilVozId}
      />

      <QuemSomosModal
        isOpen={isQuemSomosOpen}
        onClose={() => setIsQuemSomosOpen(false)}
        userName={userName}
      />

      <ModalNomeOperador
        isOpen={isNameModalOpen}
        onClose={() => setIsNameModalOpen(false)}
        userName={userName}
        onSalvarNome={salvarNomeOperador}
      />

      <AppFooter />

      <nav className="fixed bottom-0 left-0 right-0 z-40 bg-deepSpace/95 backdrop-blur-xl border-t border-cyberCyan/35 px-1 py-1.5 flex items-center justify-around gap-0.5">
        {navItems.map(item => {
          const IconComp = item.icon;
          const ativo = activeTab === item.id;
          return (
            <button
              key={item.id}
              type="button"
              onClick={() => setActiveTab(item.id)}
              className={`flex flex-col items-center justify-center py-1.5 px-1.5 rounded-xl min-w-[44px] transition ${ativo ? 'bg-cyberCyan/20 text-cyberCyan border border-cyberCyan/50 font-black' : 'text-slate-400 hover:text-white'}`}
            >
              <IconComp size={15} color={ativo ? '#00F2FE' : '#94A3B8'} />
              <span className="text-[8px] font-mono mt-0.5 truncate max-w-[54px]">{item.label}</span>
            </button>
          );
        })}
      </nav>
    </div>
  );
}

const rootElement = document.getElementById("root");
ReactDOM.createRoot(rootElement).render(<App />);
</script>
</body>
</html>
