  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'Plus Jakarta Sans', 'system-ui', 'sans-serif'],
            display: ['Orbitron', 'sans-serif'],
            mono: ['JetBrains Mono', 'monospace'],
          },
          colors: {
            void: "#030712",
            deepSpace: "#041125",
            commandPanel: "#0A1B38",
            cyberCyan: "#00F2FE",
            cyberBlue: "#38BDF8",
            cyberGreen: "#00FF9D",
            cyberAmber: "#FFB703",
            cyberRose: "#FF0055",
          }
        }
      }
    };
  </script>

  <!-- React 18, Babel Standalone & Leaflet CDN -->
  <script crossorigin src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18.3.1/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/@babel/standalone@7.26.4/babel.min.js"></script>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <style>
    :root {
      --primary: #00F2FE;
      --secondary: #38BDF8;
      --glow: rgba(0, 242, 254, 0.4);
      --glow-cyan: rgba(0, 242, 254, 0.35);
      --wave-speed: 2.2s;
      --hud-bg: #02040A;
      --hud-panel: #050B18;
      --hud-surface: #02050D;
      --hud-cyan: #00F2FE;
      --hud-green: #00FF9D;
      --hud-rose: #FF2E54;
      --hud-text: #E2F1FF;
      --hud-base-px: 14px;
      --hud-auto-scale: 1;
      --hud-user-zoom: 1;
      --hud-max-w: 46rem;
      --hud-safe-pad: 0px;
      --hud-border-alpha: 0.36;
    }

    html.hud-profile-tv {
      --hud-safe-pad: clamp(12px, 2.2vw, 36px);
      --hud-border-alpha: 0.68;
    }

    html.hud-profile-projector {
      --hud-bg: #000205;
      --hud-text: #FFFFFF;
      --hud-safe-pad: clamp(18px, 3.5vw, 56px);
      --hud-border-alpha: 0.88;
    }

    html.hud-profile-projector .box {
      background: #020712;
      border-width: 2px;
      border-color: rgba(0, 242, 254, var(--hud-border-alpha));
      box-shadow: 0 0 32px rgba(0, 242, 254, 0.24), inset 0 0 22px rgba(0, 242, 254, 0.08);
    }

    html.hud-profile-projector .btn {
      border-width: 2px;
      font-weight: 800;
      letter-spacing: 0.04em;
    }

    /* Protecao anti-copia preservando inputs, textareas e selects */
    body, html, *:not(input):not(textarea):not(select) {
      -webkit-user-select: none;
      -moz-user-select: none;
      -ms-user-select: none;
      user-select: none;
      -webkit-touch-callout: none;
    }

    input, textarea, select {
      -webkit-user-select: text !important;
      -moz-user-select: text !important;
      -ms-user-select: text !important;
      user-select: text !important;
    }

    @keyframes avatarSpeaking {
      0%, 100% { transform: scale(1) rotate(0deg); filter: drop-shadow(0 0 30px rgba(0,242,254,0.75)); }
      50% { transform: scale(1.06) rotate(2deg); filter: drop-shadow(0 0 45px rgba(0,255,157,0.85)); }
    }

    @keyframes moleculeRotate {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    @keyframes moleculePulse {
      0%, 100% { transform: scale(1); opacity: 0.9; }
      50% { transform: scale(1.15); opacity: 1; filter: drop-shadow(0 0 12px #00F2FE); }
    }

    @keyframes cyberGridMove {
      0% { background-position: 0 0; }
      100% { background-position: 40px 40px; }
    }

    @keyframes radarSpin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    .animate-radar-sweep {
      animation: radarSpin 4s linear infinite;
    }

    @keyframes cloudDrift {
      0% { transform: translateX(-50px) scale(1); opacity: 0.4; }
      50% { opacity: 0.7; }
      100% { transform: translateX(350px) scale(1.1); opacity: 0.4; }
    }

    .cloud-layer-anim {
      background: radial-gradient(circle, rgba(255,255,255,0.18) 0%, rgba(56,189,248,0.08) 50%, transparent 80%);
      filter: blur(12px);
      animation: cloudDrift 14s ease-in-out infinite alternate;
      pointer-events: none;
    }

    @keyframes holographicPulse {
      0% { box-shadow: 0 0 12px rgba(0,242,254,0.18), inset 0 0 10px rgba(0,242,254,0.05); border-color: rgba(0,242,254,0.35); }
      50% { box-shadow: 0 0 24px rgba(0,242,254,0.35), inset 0 0 18px rgba(0,242,254,0.15); border-color: rgba(0,242,254,0.7); }
      100% { box-shadow: 0 0 12px rgba(0,242,254,0.18), inset 0 0 10px rgba(0,242,254,0.05); border-color: rgba(0,242,254,0.35); }
    }

    @keyframes pulseWave {
      0% { width: 60%; height: 60%; opacity: 0.95; transform: scale(0.85); box-shadow: 0 0 8px var(--glow); }
      50% { opacity: 0.6; }
      100% { width: 130%; height: 130%; opacity: 0; transform: scale(1.15); box-shadow: 0 0 20px transparent; }
    }

    @keyframes auraPulse {
      0%, 100% { transform: scale(0.96); opacity: 0.7; }
      50% { transform: scale(1.12); opacity: 0.95; }
    }

    @keyframes spinSlow {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100%;
      min-height: 100vh;
      min-height: 100dvh;
      margin: 0;
      padding: 0;
      overflow-x: hidden;
      touch-action: manipulation;
      -webkit-text-size-adjust: 100%;
      overscroll-behavior-y: contain;
      background-color: #030712;
      color: #E2E8F0;
    }

    #root {
      width: 100%;
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .seu-container-raru {
      width: 100%;
      max-width: 1400px;
      margin: 0 auto;
      min-height: 100vh;
      min-height: 100dvh;
      padding: 12px 16px 130px 16px;
      display: flex;
      flex-direction: column;
    }

    body {
      background-image:
        radial-gradient(circle at 50% 0%, rgba(0, 242, 254, 0.08) 0%, transparent 60%),
        radial-gradient(circle at 10% 90%, rgba(56, 189, 248, 0.05) 0%, transparent 50%);
      transition: background-color 0.4s ease, color 0.4s ease;
    }

    body.hud-grid {
      background-image:
        linear-gradient(rgba(0, 242, 254, 0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0, 242, 254, 0.03) 1px, transparent 1px);
      background-size: 28px 28px;
      animation: cyberGridMove 30s linear infinite;
    }

    .cyber-card {
      background: linear-gradient(135deg, rgba(10, 27, 56, 0.94) 0%, rgba(4, 17, 37, 0.97) 100%);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(0, 242, 254, 0.35);
      border-radius: 20px;
      padding: 18px;
      margin-bottom: 14px;
      animation: holographicPulse 5s ease-in-out infinite;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .cyber-button {
      background: linear-gradient(135deg, rgba(0, 242, 254, 0.15) 0%, rgba(56, 189, 248, 0.25) 100%);
      border: 1px solid #00F2FE;
      color: #00F2FE !important;
      font-family: 'Orbitron', sans-serif;
      font-weight: 800;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      border-radius: 12px;
      padding: 12px 18px;
      min-height: 48px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      cursor: pointer;
      transition: all 0.25s ease;
      box-shadow: 0 0 15px rgba(0, 242, 254, 0.25), inset 0 0 10px rgba(0, 242, 254, 0.1);
      touch-action: manipulation;
    }

    .cyber-button:hover {
      background: linear-gradient(135deg, #00F2FE 0%, #38BDF8 100%);
      color: #030712 !important;
      box-shadow: 0 0 25px rgba(0, 242, 254, 0.7);
    }

    .cyber-button:active {
      transform: scale(0.97);
    }

    .cyber-button-solid {
      background: linear-gradient(135deg, #00F2FE 0%, #38BDF8 100%);
      border: 1px solid #FFFFFF;
      color: #030712 !important;
      font-family: 'Orbitron', sans-serif;
      font-weight: 900;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      border-radius: 12px;
      padding: 12px 18px;
      min-height: 48px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      cursor: pointer;
      transition: all 0.25s ease;
      box-shadow: 0 0 20px rgba(0, 242, 254, 0.4);
    }

    .cyber-button-solid:active {
      transform: scale(0.97);
    }

    .cyber-button-danger {
      background: linear-gradient(135deg, rgba(255, 0, 85, 0.2) 0%, rgba(255, 0, 85, 0.4) 100%);
      border: 1px solid #FF0055;
      color: #FF0055 !important;
      font-family: 'Orbitron', sans-serif;
      font-weight: 800;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      border-radius: 12px;
      padding: 12px 18px;
      min-height: 48px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      cursor: pointer;
      transition: all 0.25s ease;
      box-shadow: 0 0 15px rgba(255, 0, 85, 0.3);
    }

    .cyber-button-danger:hover {
      background: #FF0055;
      color: #ffffff !important;
      box-shadow: 0 0 25px rgba(255, 0, 85, 0.8);
    }

    .sarah-avatar-stage {
      position: relative;
      width: 100%;
      max-width: 90px;
      aspect-ratio: 1/1;
      margin: 0 auto;
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
    }

    .sarah-avatar-stage.speaking {
      animation: avatarSpeaking 1.5s ease-in-out infinite alternate;
    }

    .wave-ring {
      position: absolute;
      border-radius: 50%;
      border: 1.5px solid var(--primary);
      box-shadow: 0 0 10px var(--glow), inset 0 0 6px var(--glow);
      animation: pulseWave var(--wave-speed) infinite cubic-bezier(0.215, 0.61, 0.355, 1);
      pointer-events: none;
    }

    .wave-ring:nth-child(1) { animation-delay: 0s; }
    .wave-ring:nth-child(2) { animation-delay: calc(var(--wave-speed) * 0.33); }
    .wave-ring:nth-child(3) { animation-delay: calc(var(--wave-speed) * 0.66); }

    .cyan-outer-boundary {
      position: absolute;
      inset: -5px;
      border-radius: 50%;
      border: 1px dashed var(--secondary);
      opacity: 0.7;
      animation: spinSlow 30s linear infinite;
      box-shadow: 0 0 14px var(--glow-cyan);
    }

    .avatar-aura {
      position: absolute;
      inset: -8%;
      border-radius: 50%;
      background: radial-gradient(circle, var(--glow) 0%, var(--glow-cyan) 45%, transparent 70%);
      background-size: 200% 200%;
      filter: blur(10px);
      animation: auraPulse 3.5s infinite ease-in-out;
      opacity: 0.85;
    }

    .avatar-core-wrapper {
      position: relative;
      width: 85%;
      height: 85%;
      border-radius: 50%;
      z-index: 10;
      box-shadow: 0 0 16px var(--glow), 0 0 25px rgba(0,0,0,0.8);
      background: radial-gradient(circle, #091328 0%, #040914 60%, #02040a 100%);
      border: 2px solid #00F2FE;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .molecule-rotate-slow {
      animation: moleculeRotate 20s linear infinite;
      transform-origin: center;
    }

    .molecule-rotate-reverse {
      animation: moleculeRotate 14s linear infinite reverse;
      transform-origin: center;
    }

    .molecule-node-pulse {
      animation: moleculePulse 3s ease-in-out infinite alternate;
    }

    .glass-overlay {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 25%, rgba(255, 255, 255, 0.25) 0%, rgba(255, 255, 255, 0.05) 40%, transparent 70%);
      pointer-events: none;
      z-index: 15;
    }

    .hud-shell {
      width: 100%;
      max-width: var(--hud-max-w);
      margin: 0 auto;
      padding: calc(clamp(0.75rem, 1.8vw, 2rem) + var(--hud-safe-pad));
      transition: max-width 0.2s ease, padding 0.2s ease;
    }

    .hud-shell.hud-360-expanded {
      max-width: 100%;
      min-height: 100dvh;
      padding: calc(clamp(1rem, 2.2vw, 3rem) + var(--hud-safe-pad));
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .hud-shell.hud-360-fallback-fullscreen {
      position: fixed;
      inset: 0;
      z-index: 9999;
      max-width: 100vw;
      width: 100vw;
      height: 100dvh;
      overflow-y: auto;
      background:
        radial-gradient(circle at 50% 0%, rgba(0, 242, 254, 0.14), transparent 60%),
        var(--hud-bg);
    }

    .box {
      background: linear-gradient(180deg, rgba(8, 20, 42, 0.97) 0%, rgba(4, 10, 22, 0.99) 100%);
      border: 1px solid rgba(0, 242, 254, var(--hud-border-alpha));
      box-shadow: 0 0 24px rgba(0, 242, 254, 0.08), inset 0 0 18px rgba(0, 242, 254, 0.03);
      max-width: 100%;
      overflow: hidden;
    }

    .hud-360-active .box {
      border-color: rgba(0, 242, 254, 0.7);
      box-shadow: 0 0 38px rgba(0, 242, 254, 0.18), inset 0 0 24px rgba(0, 255, 157, 0.05);
    }

    .btn {
      background: rgba(0, 242, 254, 0.11);
      border: 1px solid rgba(0, 242, 254, 0.38);
      color: var(--hud-text);
      cursor: pointer;
      min-height: 2.35rem;
      max-width: 100%;
      white-space: nowrap;
      transition: background 0.15s ease, border-color 0.15s ease, transform 0.12s ease, box-shadow 0.15s ease;
    }

    #grid5 .btn {
      white-space: normal;
    }

    .btn:hover, .btn:focus-visible {
      border-color: #00F2FE;
      background: rgba(0, 242, 254, 0.22);
      box-shadow: 0 0 0 2px rgba(0, 242, 254, 0.45);
      outline: none;
    }

    .btn:active {
      transform: scale(0.98);
    }

    .on {
      border-color: var(--hud-green);
      background: rgba(0, 255, 157, 0.2);
      color: #FFFFFF;
    }

    .warn {
      border-color: var(--hud-rose);
      background: rgba(255, 46, 84, 0.28);
      color: #FFD6DE;
    }

    ::-webkit-scrollbar { width: 4px; height: 4px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(0,242,254,0.3); border-radius: 9999px; }
  </style>
</head>

          const resposta = await fetch(this.config.workerUrl, {

              "Content-Type": "application/json"

            signal: controller ? controller.signal : undefined,
            body: JSON.stringify({

              acao,
              eixos: this.config.eixos,
              territorioReferencia: {

                abrangencia: "Baixada Fluminense e 92 municípios do Rio de Janeiro"
              },
              ...dados
            })
          });

          if (!resposta.ok) {
            throw new Error(`HTTP ${resposta.status} em ${this.config.workerUrl}`);
          }

          return await resposta.json();
        } catch (erro) {
          throw new Error(`Falha na consulta ao envelope (${acao}): ${erro && erro.message ? erro.message : "erro de rede"}`);

          const temConteudo = pacote && (

            pacote.fontesClimaticas ||
            pacote.programasEEditais ||
            pacote.defesaCivilEElNino ||
            pacote.politicaEReligiao
          );

          if (!temConteudo) {
            const fallback = await this.sintetizarTelemetriaRealFallback("envelope sem carga util");

            this.estado.modoFonte = "TELEMETRIA_REAL_CONSOLIDADA";

          const msgErro = erro && erro.message ? erro.message : "Erro inesperado no ciclo de inteligencia";
          const fallback = await this.sintetizarTelemetriaRealFallback(msgErro);
          this.estado.ultimaAtualizacao = new Date().toISOString();
          this.estado.modoFonte = "TELEMETRIA_REAL_CONSOLIDADA";
          this.estado.ultimoErro = msgErro;
          this.estado.ultimaColeta = fallback;

            detail: {

              ultimoErro: this.estado.ultimoErro,
              coleta: this.estado.ultimaColeta
            }

          return this.estado.ultimaColeta;

    async function calcularSHA256(texto) {
      const str = String(texto || "");
      try {
        if (window.crypto && window.crypto.subtle && window.TextEncoder) {
          const encoder = new TextEncoder();
          const data = encoder.encode(str);
          const hashBuffer = await window.crypto.subtle.digest("SHA-256", data);
          const hashArray = Array.from(new Uint8Array(hashBuffer));
          return hashArray.map(b => b.toString(16).padStart(2, "0")).join("");
        }
      } catch (e) {}

      let h1 = 0xdeadbeef, h2 = 0x41c6ce57;
      for (let i = 0; i < str.length; i++) {
        const ch = str.charCodeAt(i);
        h1 = Math.imul(h1 ^ ch, 2654435761);
        h2 = Math.imul(h2 ^ ch, 1597334677);
      }
      h1 = Math.imul(h1 ^ (h1 >>> 16), 2246822507) ^ Math.imul(h2 ^ (h2 >>> 13), 3266489909);
      h2 = Math.imul(h2 ^ (h2 >>> 16), 2246822507) ^ Math.imul(h1 ^ (h1 >>> 13), 3266489909);
      const combinado = (4294967296 * (2097151 & h2) + (h1 >>> 0)).toString(16).padStart(16, "0");
      return combinado.repeat(4).slice(0, 64);
    }

        diretrizSequencia = `ABERTURA INICIAL: Apresente-se como ${SARAH_DNA.apresentacaoInicial}, com cargo registrado de ${SARAH_DNA.cargo}, cumprimente com '${saudacaoCerta}' conforme o horário de Brasília (${horaFormatada} em ${tempoBR.dataCompleta}) e pergunte em que posso ser útil apenas uma vez. Não cite o nome do coordenador na abertura.`;
      } else if (globalInteracoesContagem === 2) {
        const rotuloNome = nomeOperador || "operador";
        diretrizSequencia = `SEGUNDA INTERAÇÃO: Responda na abertura com 'Olá, ${rotuloNome}, estou à escuta, pode falar' e dê sequência objetiva com base na data/hora atual (${tempoBR.descricaoCompleta}). Não repita bom dia, boa tarde, boa noite nem em que posso ser útil.`;
      } else {
        diretrizSequencia = `INTERAÇÃO SUBSEQUENTE: Mantenha conversa séria, objetiva e direta${nomeOperador ? ` chamando por ${nomeOperador}` : ""} com referência atual em ${tempoBR.descricaoCompleta}. Não repita bom dia, boa tarde, boa noite nem em que posso ser útil.`;
      }

      const systemPrompt = `${montarPromptCompletoSarah(ultimaMensagem, telemetriaLocal)}\n\n${diretrizSequencia}`;

      try {
        const response = await fetch(SARAH_PROXY_URL, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            model: "openai/gpt-oss-120b",
            messages: [
              { role: "system", content: systemPrompt },
              ...mensagensHistorico
            ],
            temperature: tipo === "laudo" ? 0.35 : 0.5,
            max_tokens: tipo === "laudo" ? 700 : 450
          })
        });

        const data = await response.json();
        if (!data.error) {
          const msg = data?.choices?.[0]?.message;
          const bruto = msg?.content || msg?.reasoning_content;
          if (bruto && bruto.trim().length > 0) {
            globalSaudacaoEmitida = true;
            return sanitizarRespostaSarah(bruto);
          }
        }
      } catch (e) {}

      try {
        const promptAlternativo = `${systemPrompt}\n\nMensagem do interlocutor: ${ultimaMensagem}`;
        const aiRes = await fetch("https://text.pollinations.ai/" + encodeURIComponent(promptAlternativo));
        if (aiRes.ok) {
          const t = await aiRes.text();
          if (t && t.trim().length > 0) {
            globalSaudacaoEmitida = true;
            return sanitizarRespostaSarah(t);
          }
        }
      } catch (e) {}

      globalSaudacaoEmitida = true;
      if (!nomeOperador) {
        return "Registro de telemetria e enlace externo temporariamente indisponíveis. Informe seu nome para que eu prossiga com o acompanhamento técnico.";
      }
      return `Enlace externo temporariamente indisponível, ${nomeOperador}. Leituras locais e monitoramento em ${municipioAtual || "Mesquita"} permanecem ativos.`;
    }

    async function chamarSarahGroq(tipo, mensagensHistorico, municipioAtual, bairroAtual, abaAtual, dadosClimaContexto, userName = "") {
      const ultimaMsgObj = (mensagensHistorico && mensagensHistorico[mensagensHistorico.length - 1]) || {};
      const ultimaPergunta = ultimaMsgObj.content || "Analise tatica";
      const telemetriaAtiva = [
        `Modo: ${tipo || "conversa"}`,
        `Municipio: ${municipioAtual || "Mesquita"}`,
        `Bairro: ${bairroAtual || "Serra do Mendanha / Vila Sebinho / Maria Cristina / Rocha Sobrinho"}`,
        `Aba: ${abaAtual || "dashboard"}`,

        `Dados: ${typeof dadosClimaContexto === "object" ? JSON.stringify(dadosClimaContexto) : String(dadosClimaContexto || "")}`
      ].join(" | ");

      const promptEnriquecido = montarPromptCompletoSarah(ultimaPergunta, telemetriaAtiva);
      const historicoComContexto = [
        ...(mensagensHistorico || []).slice(0, -1),
        { role: "user", content: promptEnriquecido }
      ];

      return chamarSarah(tipo, historicoComContexto, municipioAtual, bairroAtual, abaAtual, dadosClimaContexto, userName);

    async function gerarArquivoIconeEscudo() {
      return new Promise((resolve) => {
        try {
          const canvas = document.createElement("canvas");
          canvas.width = 512;
          canvas.height = 512;
          const ctx = canvas.getContext("2d");

          const bgGrad = ctx.createRadialGradient(256, 256, 30, 256, 256, 320);
          bgGrad.addColorStop(0, "#0A2547");
          bgGrad.addColorStop(0.6, "#041125");
          bgGrad.addColorStop(1, "#02040A");
          ctx.fillStyle = bgGrad;
          ctx.fillRect(0, 0, 512, 512);

          ctx.strokeStyle = "rgba(0, 242, 254, 0.07)";
          ctx.lineWidth = 1;
          for (let i = 0; i < 512; i += 32) {
            ctx.beginPath(); ctx.moveTo(i, 0); ctx.lineTo(i, 512); ctx.stroke();
            ctx.beginPath(); ctx.moveTo(0, i); ctx.lineTo(512, i); ctx.stroke();
          }

          ctx.save();
          ctx.beginPath();
          ctx.arc(256, 245, 200, 0, Math.PI * 2);
          ctx.strokeStyle = "rgba(56, 189, 248, 0.35)";
          ctx.lineWidth = 3;
          ctx.setLineDash([12, 10]);
          ctx.stroke();
          ctx.restore();

          ctx.save();
          ctx.shadowColor = "#00F2FE";
          ctx.shadowBlur = 25;
          ctx.beginPath();
          ctx.moveTo(256, 65);
          ctx.lineTo(410, 130);
          ctx.lineTo(410, 265);
          ctx.quadraticCurveTo(410, 385, 256, 435);
          ctx.quadraticCurveTo(102, 385, 102, 265);
          ctx.lineTo(102, 130);
          ctx.closePath();

          const shieldFill = ctx.createLinearGradient(102, 65, 410, 435);
          shieldFill.addColorStop(0, "rgba(0, 242, 254, 0.18)");
          shieldFill.addColorStop(1, "rgba(4, 17, 37, 0.92)");
          ctx.fillStyle = shieldFill;
          ctx.fill();

          ctx.lineWidth = 6;
          ctx.strokeStyle = "#00F2FE";
          ctx.stroke();
          ctx.restore();

          ctx.beginPath();
          ctx.arc(256, 245, 92, 0, Math.PI * 2);
          ctx.strokeStyle = "#00FF9D";
          ctx.lineWidth = 3;
          ctx.stroke();

          const coreGrad = ctx.createRadialGradient(256, 245, 5, 256, 245, 65);
          coreGrad.addColorStop(0, "#00F2FE");
          coreGrad.addColorStop(1, "#041125");
          ctx.beginPath();
          ctx.arc(256, 245, 65, 0, Math.PI * 2);
          ctx.fillStyle = coreGrad;
          ctx.fill();

          ctx.fillStyle = "#FFFFFF";
          ctx.font = "900 34px Orbitron, sans-serif";
          ctx.textAlign = "center";
          ctx.fillText("CLIMA", 256, 242);

          ctx.fillStyle = "#00FF9D";
          ctx.font = "800 20px JetBrains Mono, monospace";
          ctx.fillText("& DADOS PUBLICOS", 256, 272);

          ctx.fillStyle = "#38BDF8";
          ctx.font = "700 15px JetBrains Mono, monospace";
          ctx.fillText("CIDADA0 SENSOR - MESQUITA RJ", 256, 480);

          canvas.toBlob((blob) => {
            if (blob) {
              resolve(new File([blob], "BASE_CLIMATICA_TATICA.png", { type: "image/png" }));
            } else {
              resolve(null);
            }
          }, "image/png");
        } catch (e) {
          resolve(null);
        }
      });
    }

      const limparWatchdog = () => {
        if (playWatchdogRef.current) {

      const isStreamValido = (u) => {
        if (typeof u !== "string") return false;
        const limpa = u.trim();
        if (!/^https?:\/\//i.test(limpa)) return false;
        if (window.location.protocol === "https:" && /^http:\/\//i.test(limpa)) return false;
        return true;
      };

      const salvarCacheLocal = () => {
        try {
          const payload = filaRef.current.map((c) => ({
            freq: c.freq,
            estacao: c.estacao || "",
            url: c.url || "",
            candidatos: Array.isArray(c.candidatos) ? c.candidatos.slice(0, 8) : []
          }));
          localStorage.setItem(RADIO_STORAGE_KEY, JSON.stringify(payload));
        } catch (_) {}
      };

      const carregarCacheLocal = () => {
        try {
          const raw = localStorage.getItem(RADIO_STORAGE_KEY);
          if (!raw) return;
          const parsed = JSON.parse(raw);
          if (!Array.isArray(parsed)) return;
          parsed.forEach((salvo) => {
            const alvo = filaRef.current.find((c) => c.freq === salvo.freq);
            if (!alvo) return;
            if (Array.isArray(salvo.candidatos) && salvo.candidatos.length) {
              alvo.candidatos = salvo.candidatos.filter(isStreamValido);
              alvo.url = alvo.candidatos[0] || "";
            }
            if (salvo.estacao) alvo.estacao = String(salvo.estacao).slice(0, 50);
          });
        } catch (_) {}
      };

      const detectarHardwareTela = () => {
        const vw = window.innerWidth || document.documentElement.clientWidth || 360;
        const vh = window.innerHeight || document.documentElement.clientHeight || 640;
        const sw = screen.width || vw;
        const sh = screen.height || vh;
        const maxDim = Math.max(vw, vh, sw, sh);
        const minDim = Math.min(vw, vh);
        const dpr = window.devicePixelRatio || 1;
        const ua = (navigator.userAgent || "").toLowerCase();
        const isTvOrProjectorUA = /(tizen|webos|smart-tv|smarttv|bravia|netcast|googletv|android tv|appletv|aft|projector|nebula|xgimi|epson|benq|samsung)/i.test(ua);

        if (maxDim >= 2560) {
          return { tipo: "PROJETOR / TELÃO 4K+", classe: "projector", vw, vh, maxDim, minDim, dpr };
        }
        if (maxDim >= 1920 || isTvOrProjectorUA) {
          return { tipo: "SMART TV 65+ / PROJETOR", classe: isTvOrProjectorUA && maxDim < 1600 ? "projector" : "tv", vw, vh, maxDim, minDim, dpr };
        }
        if (maxDim >= 1024) {
          return { tipo: "NOTEBOOK / TABLET / DESKTOP", classe: "auto", vw, vh, maxDim, minDim, dpr };
        }
        return { tipo: "MOBILE / COMPACTO", classe: "auto", vw, vh, maxDim, minDim, dpr };
      };

      const recalcularEscalaGeometrica = (efetivo, deteccao) => {
        const vw = deteccao.vw;
        const vh = deteccao.vh;
        const shortSide = Math.min(vw, vh);
        const longSide = Math.max(vw, vh);

        let scale = 1;
        if (shortSide <= 480 && longSide <= 960) {
          scale = Math.max(0.92, Math.min(1.05, vw / 390));
        } else if (longSide < 1280) {
          scale = Math.max(1.0, Math.min(1.18, Math.sqrt((vw * vh) / (800 * 600))));
        } else if (longSide < 1920) {
          scale = Math.max(1.08, Math.min(1.32, vw / 1280));
        } else if (longSide < 2560) {
          scale = Math.max(1.28, Math.min(1.55, vw / 1550));
        } else {
          scale = Math.max(1.55, Math.min(2.15, vw / 1700));
        }

        if (efetivo === "tv") {
          scale = Math.max(scale, 1.32);
        } else if (efetivo === "projector") {
          scale = Math.max(scale * 1.06, shortSide < 720 ? 1.05 : 1.38);
        }

        let maxW = "46rem";
        if (vw >= 2560) maxW = "154rem";
        else if (vw >= 1920) maxW = "116rem";
        else if (vw >= 1280) maxW = "82rem";
        else if (vw >= 768) maxW = "60rem";

        document.documentElement.style.setProperty("--hud-auto-scale", scale.toFixed(3));
        document.documentElement.style.setProperty("--hud-max-w", maxW);
      };

      const aplicarPerfilExibicao = (novoPerfil = perfilTela, zoomVal = userZoom) => {
        const PERFIS = ["auto", "tv", "projector"];
        const valido = PERFIS.includes(novoPerfil) ? novoPerfil : "auto";
        setPerfilTela(valido);

        const deteccao = detectarHardwareTela();
        const efetivo = valido === "auto" ? deteccao.classe : valido;

        document.documentElement.classList.remove("hud-profile-tv", "hud-profile-projector");
        if (efetivo === "tv") document.documentElement.classList.add("hud-profile-tv");
        if (efetivo === "projector") document.documentElement.classList.add("hud-profile-projector");

        recalcularEscalaGeometrica(efetivo, deteccao);
        document.documentElement.style.setProperty("--hud-user-zoom", Number(zoomVal || 1).toFixed(2));

        try {
          localStorage.setItem(HUD_PREF_KEY, JSON.stringify({
            ativo: hud360Ativo,
            perfil: valido,
            userZoom: zoomVal
          }));
        } catch (_) {}

        return { perfil: valido, efetivo, deteccao };
      };

      const isFullscreenElement = () => Boolean(
        document.fullscreenElement ||
        document.webkitFullscreenElement ||
        document.mozFullScreenElement ||
        document.msFullscreenElement
      );

      const entrarFullscreenReal = async (el) => {
        const target = el || containerRef.current || document.documentElement;
        const req =
          target.requestFullscreen ||
          target.webkitRequestFullscreen ||
          target.mozRequestFullScreen ||
          target.msRequestFullscreen;
        if (typeof req === "function") {
          try {
            await req.call(target);
            return true;
          } catch (_) {
            return false;
          }
        }
        return false;
      };

      const sairFullscreenReal = async () => {
        const exit =
          document.exitFullscreen ||
          document.webkitExitFullscreen ||
          document.mozCancelFullScreen ||
          document.msExitFullscreen;
        if (typeof exit === "function" && isFullscreenElement()) {
          try {
            await exit.call(document);
          } catch (_) {}
        }
      };

      const setHud360 = async (estado, tentarTelaCheia = true) => {
        const ligado = Boolean(estado);
        if (ligado) {
          setHud360Ativo(true);
          setHud360Fallback(false);
          document.documentElement.classList.add("hud-360-active");
          if (tentarTelaCheia && !isFullscreenElement()) {
            const entrou = await entrarFullscreenReal(containerRef.current || document.documentElement);
            if (!entrou) {
              setHud360Fallback(true);
            }
          }
        } else {
          await sairFullscreenReal();
          setHud360Ativo(false);
          setHud360Fallback(false);
          document.documentElement.classList.remove("hud-360-active");
        }
        aplicarPerfilExibicao(perfilTela, userZoom);
        return ligado;

      const fetchComTimeout = async (url, ms = 4500) => {
        const ctrl = typeof AbortController !== "undefined" ? new AbortController() : null;
        const timer = ctrl ? setTimeout(() => ctrl.abort(), ms) : null;
        try {
          const r = await fetch(url, {
            signal: ctrl ? ctrl.signal : undefined,
            headers: { "User-Agent": "MiniRadioNexus/3.0" }
          });
          if (!r.ok) return null;
          return await r.json();
        } catch (_) {
          return null;
        } finally {
          if (timer) clearTimeout(timer);
        }
      };

      const consultarRadioBrowser = async ({ tag, countrycode = "", language = "" }) => {
        const params = new URLSearchParams({
          tag,
          limit: "14",
          hidebroken: "true",
          order: "clickcount",
          reverse: "true"
        });
        if (countrycode) params.set("countrycode", countrycode);
        if (language) params.set("language", language);

        for (const base of RADIO_BROWSER_MIRRORS) {
          const data = await fetchComTimeout(`${base}/json/stations/search?${params.toString()}`, 4200);
          if (Array.isArray(data) && data.length) return data;
        }
        return null;
      };

      const estacaoCompativelComCanal = (canal, st) => {
        const cc = String(st.countrycode || "").toUpperCase();
        const lang = String(st.language || "").toLowerCase();
        const nome = String(st.name || "").toLowerCase();

        if (canal.freq === "93.1") {
          const ehBrasil = cc === "BR";
          const ehPortugues = lang.includes("portuguese") || lang.includes("pt") || /\b(louvor|gospel|deus|jesus|esperanca|esperança|adoracao|adoração|fe|fé|graca|graça|brasil)\b/i.test(nome);
          const ehEstrangeiraFora = (cc && cc !== "BR") && !ehPortugues;
          return (ehBrasil || ehPortugues) && !ehEstrangeiraFora;
        }

        return true;

      const buscarEstacoesCanal = async (canal) => {
        const encontrados = [];
        const consultas = Array.isArray(canal.consultas) ? canal.consultas : [];

        for (const q of consultas) {
          const lista = await consultarRadioBrowser(q);
          if (!Array.isArray(lista)) continue;

          for (const st of lista) {
            if (!estacaoCompativelComCanal(canal, st)) continue;
            const u = (st.url_resolved || st.url || "").trim();
            const codec = String(st.codec || "").toUpperCase();

              encontrados.push({
                url: u,
                nome: String(st.name || canal.estilo).trim().slice(0, 50)

            if (encontrados.length >= 8) break;

          if (encontrados.length >= 5) break;

        if (encontrados.length) {

          canal.url = encontrados[0].url;

        setSincronizando(false);

          return;
        }

        candIdxRef.current = pos;
        const urlAtual = lista[pos];
        const nomeEstacao = canal.estacao || canal.titulo;

        setDisplayEstacao(`${nomeEstacao} (${pos + 1}/${lista.length})`);
        setStTxt(`CONECTANDO ${canal.freq} MHZ...`);

        limparWatchdog();
        playWatchdogRef.current = setTimeout(() => {
          if (sessionId === playSessionIdRef.current && !tocandoRef.current) {
            tentarCandidato(canal, pos + 1, sessionId);
          }
        }, 7000);

        const el = elAudioRef.current;
        if (!el) return;
        el.volume = Number(volume);
        el.src = urlAtual;
        el.load();

        const promessa = el.play();
        if (promessa && typeof promessa.then === "function") {
          promessa.then(() => {
            if (sessionId !== playSessionIdRef.current) return;
            limparWatchdog();
            canal.url = urlAtual;
            salvarCacheLocal();
            syncCanaisState();
            setTocando(true);
            setStTxt(`NO AR: ${nomeEstacao} // ${canal.freq} MHZ`);
          }).catch(() => {
            if (sessionId !== playSessionIdRef.current) return;
            limparWatchdog();
            tentarCandidato(canal, pos + 1, sessionId);
          });
        }
      };

      const tocarCanal = async (i) => {
        if (alarmeAtivo) {
          setStTxt("ALARME ATIVO // CLIQUE LIBERAR PARA TOCAR");
          return;
        }

        const list = filaRef.current;
        const nextIdx = (i + list.length) % list.length;
        setIdxCanal(nextIdx);
        idxRef.current = nextIdx;

        const item = list[nextIdx];
        const sessionId = ++playSessionIdRef.current;

        limparWatchdog();
        const el = elAudioRef.current;
        if (el) {
          el.pause();
          el.removeAttribute("src");
          el.load();
        }
        setTocando(false);
        setDisplayEstacao(item.estacao || "Buscando estação...");
        syncCanaisState();

        const temLista = Array.isArray(item.candidatos) && item.candidatos.some(isStreamValido);
        if ((!temLista && !isStreamValido(item.url)) && roboAtivo) {
          setStTxt(`BUSCANDO ESTAÇÃO PARA ${item.freq} MHZ...`);
          await buscarEstacoesCanal(item);
          if (sessionId !== playSessionIdRef.current) return;
          setDisplayEstacao(item.estacao || item.titulo);
          syncCanaisState();
        }

        tentarCandidato(item, 0, sessionId);
      };

      const sinalizarPrototipoRadio = (h = true) => {
        const ativoFlag = Boolean(h);
        setRoboAtivo(ativoFlag);
        window.__SARAH_RADIO_SINALIZADOR__ = {
          sinalizador: "RADIO_PROTOTIPO_ALVO_ROBO_V1",
          prontoParaReceberProgramacao: ativoFlag,
          atualizadoEm: new Date().toISOString()
        };
        setStTxt(ativoFlag ? "SINALIZADOR ATIVO // ROBÔ PRONTO" : "SINALIZADOR DESLIGADO");
      };

      const receberGradeDoRobo = (itens = []) => {
        if (!roboAtivo || !Array.isArray(itens)) return { aceito: false };
        itens.slice(0, 5).forEach((it, i) => {
          const c = filaRef.current[i];
          if (!c || !it) return;
          const urlsBrutas = Array.isArray(it.candidatos) ? it.candidatos : (it.url ? [it.url] : []);
          const urls = urlsBrutas.map((x) => (typeof x === "string" ? x : x && x.url)).filter(isStreamValido);
          if (urls.length) {
            c.candidatos = urls;
            c.url = urls[0];
          }
          if (it.estacao || it.titulo) c.estacao = String(it.estacao || it.titulo).slice(0, 50);
        });
        salvarCacheLocal();
        syncCanaisState();
        setStTxt("SINTONIAS ATUALIZADAS PELO ROBÔ");
        return { aceito: true };
      };

      const acionarPrioridadeAlarme = (ativo = true) => {

        setAlarmeAtivo(estadoAlm);

    function CadeAdminModule({ showToast, perfilVozId, setPerfilVozId }) {
      const MUNICIPIOS = MUNICIPIOS_92.map(m => m.n);
      const [abaAtiva, setAbaAtiva] = useState("rota");
      const [rotas, setRotas] = useState(() => {
        try { return JSON.parse(localStorage.getItem("rotasFugaReais") || "[]"); } catch (e) { return []; }
      });
      const [rNome, setRNome] = useState("");
      const [rEnd, setREnd] = useState("");
      const [rInfo, setRInfo] = useState("");
      const [rTipo, setRTipo] = useState("Ponto de Encontro");

      const [monitores, setMonitores] = useState(() => {
        try { return JSON.parse(localStorage.getItem("monitoresCADE") || "[]"); } catch (e) { return []; }
      });
      const [bloqueados, setBloqueados] = useState(() => {
        try { return JSON.parse(localStorage.getItem("monitoresBloqueadosCADE") || "[]"); } catch (e) { return []; }
      });
      const [mNome, setMNome] = useState("");
      const [mZap, setMZap] = useState("");
      const [mSenha, setMSenha] = useState("");
      const [mMun, setMMun] = useState("");
      const [mBairro, setMBairro] = useState("");
      const [mFuncao, setMFuncao] = useState("Monitor do Tempo");
      const [mObs, setMObs] = useState("");
      const [filtroMon, setFiltroMon] = useState("");
      const [motivoBloqueioInput, setMotivoBloqueioInput] = useState("");
      const [alvoBloqueioIdx, setAlvoBloqueioIdx] = useState(null);

      const salvarRota = () => {
        if (!rNome.trim() || !rEnd.trim()) {
          showToast("Preencha o nome e o endereço do ponto.");
          return;
        }
        const nova = { nome: rNome.trim(), endereco: rEnd.trim(), info: rInfo.trim(), tipo: rTipo };
        const atualizadas = [...rotas, nova];
        setRotas(atualizadas);
        try { localStorage.setItem("rotasFugaReais", JSON.stringify(atualizadas)); } catch (e) {}
        setRNome("");
        setREnd("");
        setRInfo("");
        showToast("Rota salva e publicada na Estação.");
      };

      const excluirRota = (i) => {
        const atualizadas = [...rotas];
        atualizadas.splice(i, 1);
        setRotas(atualizadas);
        try { localStorage.setItem("rotasFugaReais", JSON.stringify(atualizadas)); } catch (e) {}
        showToast("Rota removida.");
      };

      const cadastrarMonitor = () => {
        if (!mNome.trim() || !mMun || !mBairro.trim() || !mSenha.trim()) {
          showToast("Preencha nome, município, bairro e senha.");
          return;
        }
        let c = 1;
        try {
          c = parseInt(localStorage.getItem("contadorMonitorCADE") || "0", 10) + 1;
          localStorage.setItem("contadorMonitorCADE", String(c));
        } catch (e) {}
        const idGerado = "GADE-M-" + String(c).padStart(3, "0");
        const novoM = {
          id: idGerado,
          nome: mNome.trim(),
          zap: mZap.trim(),
          senha: mSenha.trim(),
          municipio: mMun,
          bairro: mBairro.trim(),
          funcao: mFuncao,
          obs: mObs.trim(),
          data: new Date().toLocaleString("pt-BR")
        };
        const atualizados = [...monitores, novoM];
        setMonitores(atualizados);

    function RadarMeteorologicoModule({ showToast, perfilVozId }) {
      const [dados, setDados] = useState({});

      const chartTempRef = useRef(null);
      const chartRainRef = useRef(null);

      function corPorChuva(p) {
        if (p >= 70) return "#7C4DFF";
        if (p >= 40) return "#FF0055";
        if (p >= 20) return "#FFB703";
        return "#00FF9D";
      }

      function textoPorChuva(p) {
        if (p >= 70) return "Muito forte";
        if (p >= 40) return "Forte";
        if (p >= 20) return "Moderada";
        return "Fraca / Estável";
      }

      const desenharGraficoCanvas = (canvasRef, valores, cores, sufixo) => {
        const cv = canvasRef.current;
        if (!cv) return;
        const ctx = cv.getContext("2d");
        const W = cv.width = 340, H = cv.height = 140;
        ctx.clearRect(0, 0, W, H);
        const max = Math.max(...valores, 1);
        const step = W / valores.length;
        const horaAtual = new Date().getHours();

        valores.forEach((v, i) => {
          const h = (v / max) * (H - 35);
          const x = i * step + 4;
          const grad = ctx.createLinearGradient(0, H - h, 0, H);
          grad.addColorStop(0, cores[0]);
          grad.addColorStop(1, cores[1]);
          ctx.fillStyle = grad;
          ctx.fillRect(x, H - h - 20, step - 6, h);
          ctx.fillStyle = "#FFFFFF";
          ctx.font = "bold 9px monospace";
          ctx.textAlign = "center";
          ctx.fillText(v + sufixo, x + (step / 2), H - h - 23);

          const horaLabel = `${String((horaAtual + i) % 24).padStart(2, "0")}h`;
          ctx.fillStyle = "#00F2FE";
          ctx.font = "600 8px monospace";
          ctx.fillText(horaLabel, x + (step / 2), H - 6);
        });
      };

      const desenharGraficosHorarios = (hourly) => {
        if (!hourly) return;
        const h = new Date().getHours();
        const temps = [], chuvas = [];
        for (let i = 0; i < 12; i++) {
          const idx = (h + i) % 24;
          temps.push(Math.round(hourly.temperature_2m[idx] || 25));
          chuvas.push(hourly.precipitation_probability[idx] || 0);
        }
        setTimeout(() => {
          desenharGraficoCanvas(chartTempRef, temps, ["#ff5252", "#ffca28"], "°C");
          desenharGraficoCanvas(chartRainRef, chuvas, ["#7c4dff", "#29b6f6"], "%");

      useEffect(() => {

            const r = await fetch(url);

                vento: item.current.wind_speed_10m,
                chuva: item.hourly.precipitation_probability[hora] || 0,
                hourly: item.hourly
              };
            });
            setDados(mapa);
            if (mapa[cidadeSel1] && mapa[cidadeSel1].hourly) {
              desenharGraficosHorarios(mapa[cidadeSel1].hourly);
            }
            setStatus("Open-Meteo conectado • 92 municípios • Dados reais");
          } catch (e) {
            setStatus("Sem conexão • Tentando novamente");
          }
        }
        carregar();
        const t = setInterval(carregar, 600000);
        return () => clearInterval(t);
      }, [cidadeSel1]);

      const PONTOS_BACIAS = [

      function posRadar(c) {
        const minLon = -44.75, maxLon = -41.0, minLat = -23.25, maxLat = -20.9;

            <div className="grid grid-cols-1 sm:grid-cols-2 gap-2 bg-black/40 p-3 rounded-xl border border-cyan-400/30">

      const precoPet = 2.50;
      const precoAluminio = 8.00;
      const precoFerro = 1.20;
      const precoPapelao = 0.70;
      const precoVidro = 0.35;
      const precoOleo = 3.00;

      const [btConectado, setBtConectado] = useState(false);
      const [btStatus, setBtStatus] = useState("Desconectado");

      const totalPet = petKg * precoPet;
      const totalAluminio = aluminioKg * precoAluminio;
      const totalFerro = ferroKg * precoFerro;
      const totalPapelao = papelaoKg * precoPapelao;
      const totalVidro = vidroKg * precoVidro;
      const totalOleo = oleoL * precoOleo;

      const valorTotalReciclagem = totalPet + totalAluminio + totalFerro + totalPapelao + totalVidro + totalOleo;
      const pesoTotalKg = Number(petKg) + Number(aluminioKg) + Number(ferroKg) + Number(papelaoKg) + Number(vidroKg) + Number(oleoL);

      const aguaEconomizadaL = (petKg * 24) + (aluminioKg * 40) + (papelaoKg * 15);
      const co2EvitadoKg = (petKg * 1.5) + (aluminioKg * 9.0) + (ferroKg * 1.8) + (papelaoKg * 0.9);
      const volumeDesobstruidoM3 = (pesoTotalKg * 0.0035).toFixed(2);

      const conectarBalancaBT = async () => {
        if (!navigator.bluetooth) {
          showToast("Web Bluetooth não suportado neste navegador.");
          return;
        }
        try {
          setBtStatus("Buscando balança...");
          const device = await navigator.bluetooth.requestDevice({
            acceptAllDevices: true,
            optionalServices: ["battery_service", "0000181d-0000-1000-8000-00805f9b34fb"]
          });
          setBtConectado(true);
          setBtStatus(`Conectado: ${device.name || "Balança BT"}`);
          showToast(`Balança pareada: ${device.name || "OK"}`);

          setBtConectado(false);
          setBtStatus("Desconectado");
          showToast("Conexão Bluetooth cancelada.");

        const textoRecibo = `[COMPROVANTE DE PESAGEM E ECONOMIA CIRCULAR]\nProtocolo: ${prot}\nLocal: Mesquita / Baixada Fluminense (GADE)\nPeso Total Acumulado: ${pesoTotalKg.toFixed(1)} KG / Litros\n\nDETALHAMENTO DO LOTE:\n- PET: ${petKg} kg (R$ ${totalPet.toFixed(2)})\n- Alumínio: ${aluminioKg} kg (R$ ${totalAluminio.toFixed(2)})\n- Ferro: ${ferroKg} kg (R$ ${totalFerro.toFixed(2)})\n- Papelão: ${papelaoKg} kg (R$ ${totalPapelao.toFixed(2)})\n- Vidro: ${vidroKg} kg (R$ ${totalVidro.toFixed(2)})\n- Óleo Usado: ${oleoL} L (R$ ${totalOleo.toFixed(2)})\n\nVALOR ESTIMADO: R$ ${valorTotalReciclagem.toFixed(2)}\n\nIMPACTO ECOLOGICO:\n- Água poupada: ${aguaEconomizadaL.toFixed(0)} Litros\n- CO2 evitado: ${co2EvitadoKg.toFixed(1)} Kg\n- Prevenção de Alagamento: ~${volumeDesobstruidoM3} m3\n\nGADE - Grupo A Chave da Esperança - Base Climática Tática`;

        if (navigator.clipboard) {
          navigator.clipboard.writeText(textoRecibo).catch(() => {});
          showToast(`Recibo ${prot} copiado.`);
        }
        window.open(`https://api.whatsapp.com/send?text=${encodeURIComponent(textoRecibo)}`, "_blank");
      };

      return (
        <div className="space-y-4 max-w-5xl mx-auto font-mono">

              </div>

            </div>

            <div className="bg-void/90 border border-cyberCyan/30 rounded-2xl p-3.5 flex flex-col sm:flex-row items-center justify-between gap-3 shadow-inner">
              <div className="flex items-center gap-2.5">
                <span className={`w-3 h-3 rounded-full ${btConectado ? "bg-cyberGreen animate-ping" : "bg-cyberRose"}`}></span>
                <div>
                  <span className="text-[10px] font-black text-white block">HARDWARE DE PESAGEM BLUETOOTH</span>
                  <span className="text-[8px] text-slate-400 font-bold">{btStatus}</span>
                </div>
              </div>
              <button onClick={conectarBalancaBT} className={`cyber-button text-[9px] py-2 px-4 ${btConectado ? "!border-cyberGreen !text-cyberGreen" : ""}`}>
                {btConectado ? "SISTEMA PAREADO" : "CONECTAR HARDWARE BT"}

      const [hidroLevel, setHidroLevel] = useState("-- m");
      const [tempHardware, setTempHardware] = useState("-- C");
      const [isConnecting, setIsConnecting] = useState(false);

      const salvarEConectarIP = async () => {
        try {
          localStorage.setItem("raru_alquino_ip", hardwareIpUrl);
          setIsConnecting(true);
          setStatusHardware("CONECTANDO AO IP...");
          showToast(`Conectando ao IP: ${hardwareIpUrl}`);

          if (data) {

            setHidroLevel(data.nivelAgua ? `${data.nivelAgua} m` : "0.35 m (Estável)");
            setTempHardware(data.temperatura ? `${data.temperatura} C` : "27.1 C");
            setStatusHardware("CONECTADO (ONLINE VIA IP)");

            const gasRand = Math.floor(Math.random() * 25 + 8);

            setGasLevel(`${gasRand} PPM (Normal)`);
            setHidroLevel(`${hidroRand} m (Estável)`);
            setTempHardware("26.8 C");
            setStatusHardware("SIMULAÇÃO ATIVA (IP LOCAL)");

      const desenharGraficoCanvas = (canvasRef, valores, cores, label) => {
        const cv = canvasRef.current;
        if (!cv) return;
        const ctx = cv.getContext("2d");
        const W = cv.width = 320, H = cv.height = 140;
        ctx.clearRect(0, 0, W, H);
        const max = Math.max(...valores, 1);
        const step = W / valores.length;
        valores.forEach((v, i) => {
          const h = (v / max) * (H - 30);
          const x = i * step + 4;
          const grad = ctx.createLinearGradient(0, H - h, 0, H);
          grad.addColorStop(0, cores[0]);
          grad.addColorStop(1, cores[1]);
          ctx.fillStyle = grad;
          ctx.fillRect(x, H - h - 15, step - 6, h);
          ctx.fillStyle = "#00F2FE";
          ctx.font = "bold 9px monospace";
          ctx.fillText(v + label, x, H - h - 18);
        });
      };

        const h = new Date().getHours();

          temps.push(Math.round(hourly.temperature_2m[idx] || 25));
          probs.push(hourly.precipitation_probability[idx] || 0);
        }
        desenharGraficoCanvas(chartTempRef, temps, ["#ff5252", "#ffca28"], "°");

    function VistoriaRARU_NEXUS({ onBackToDashboard, showToast, perfilVozId, userName }) {
      const [mun, setMun] = useState(MUNICIPIOS_92[0]);
      const [fotos, setFotos] = useState([]);
      const [camOn, setCamOn] = useState(false);
      const [zoomLevel, setZoomLevel] = useState(1);
      const [maxZoom, setMaxZoom] = useState(3);
      const [hasZoomSupport, setHasZoomSupport] = useState(false);
      const [nome, setNome] = useState(userName || "");
      const [bairro, setBairro] = useState("");
      const [rel, setRel] = useState("");
      const [gps, setGps] = useState({ lat: 0, lon: 0, acc: "" });
      const [isAiAnalyzing, setIsAiAnalyzing] = useState(false);
      const [clima, setClima] = useState(null);
      const [sha256Hash, setSha256Hash] = useState("");
      const [statusFotoMsg, setStatusFotoMsg] = useState("");

      const [frenteSelecionada, setFrenteSelecionada] = useState(FRENTES_EQUIPES_TABELA[5]);
      const [alarmeRusso, setAlarmeRusso] = useState(false);
      const [alarmeCemaden, setAlarmeCemaden] = useState(false);
      const [vento, setVento] = useState(0);

      const audioRef = useRef(null);
      const sireneIntervalRef = useRef(null);
      const timeoutSireneRef = useRef(null);
      const videoRef = useRef(null);
      const streamRef = useRef(null);
      const trackRef = useRef(null);

      const RISCOS_RARU = [
        "R1 - BAIXO / PREVENTIVO",
        "R2 - MODERADO / ALERTA",
        "R3 - ALTO / ENXURRADA",
        "R4 - EVACUAÇÃO PREVENTIVA",
        "RH - CONVERGÊNCIA SERRAS",
        "RE - ESTRUTURAL / TALUDE"
      ];
      const [risco, setRisco] = useState(RISCOS_RARU[1]);
      const [protAtual, setProtAtual] = useState(null);

      useEffect(() => {
        if (userName && !nome) setNome(userName);
      }, [userName]);

      useEffect(() => {
        if (!mun?.lat) return;
        fetch(`https://api.open-meteo.com/v1/forecast?latitude=${mun.lat}&longitude=${mun.lon}&current=temperature_2m,relative_humidity_2m,precipitation,wind_speed_10m,wind_gusts_10m&timezone=auto`)
          .then(r => r.json())
          .then(d => {
            setClima(d.current);
            setVento(d.current?.wind_gusts_10m || d.current?.wind_speed_10m || 0);
          })
          .catch(() => {});
      }, [mun]);

      useEffect(() => {
        return () => {
          pararTodasSirenes();
          if (streamRef.current) streamRef.current.getTracks().forEach(t => t.stop());
        };
      }, []);

      const pararTodasSirenes = () => {
        setAlarmeRusso(false);
        setAlarmeCemaden(false);
        if (sireneIntervalRef.current) clearInterval(sireneIntervalRef.current);
        if (timeoutSireneRef.current) clearTimeout(timeoutSireneRef.current);
        try {
          audioRef.current?._osc?.stop();
          audioRef.current?.close();
        } catch (e) {}
        audioRef.current = null;
      };

      const dispararSirene5Minutos = (tipo) => {
        pararTodasSirenes();
        if (tipo === "russo") setAlarmeRusso(true);
        else setAlarmeCemaden(true);

        showToast(`Sirene ${tipo === "russo" ? "Alarme Russo" : "CEMADEN"} disparada por 5 minutos.`);
        falarSarah(`Alerta ${tipo === "russo" ? "Alarme Russo" : "CEMADEN"} acionado em ${mun.n}. Prioridade de monitoramento territorial.`, perfilVozId);

        try {
          if (!audioRef.current) audioRef.current = new (window.AudioContext || window.webkitAudioContext)();
          const ctx = audioRef.current;
          ctx.resume();
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = tipo === "russo" ? "sawtooth" : "sine";
          osc.frequency.value = tipo === "russo" ? 450 : 600;
          gain.gain.value = 0.15;
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start();
          audioRef.current._osc = osc;

          let subindo = true;
          sireneIntervalRef.current = setInterval(() => {
            let f = osc.frequency.value;
            if (subindo) { f += 30; if (f >= 950) subindo = false; }
            else { f -= 30; if (f <= 400) subindo = true; }
            osc.frequency.setTargetAtTime(f, ctx.currentTime, 0.1);
          }, 80);

          timeoutSireneRef.current = setTimeout(() => {
            pararTodasSirenes();
            showToast("Ciclo de 5 minutos da sirene encerrado.");
          }, 300000);
        } catch (e) {}
      };

      const atualizarGPS = () => {
        if (!navigator.geolocation) return;
        navigator.geolocation.getCurrentPosition(p => {
          setGps({ lat: p.coords.latitude, lon: p.coords.longitude, acc: Math.round(p.coords.accuracy) });
          setMun(m => ({ ...m, lat: p.coords.latitude, lon: p.coords.longitude }));
          showToast(`GPS ${Math.round(p.coords.accuracy)}m sincronizado.`);
        }, () => {}, { enableHighAccuracy: true, timeout: 5000 });
      };

      const startCam = async () => {
        try {
          const s = await navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: "environment" } } });
          streamRef.current = s;
          const track = s.getVideoTracks()[0];
          trackRef.current = track;
          const caps = track.getCapabilities ? track.getCapabilities() : {};
          if (caps.zoom) {
            setHasZoomSupport(true);
            setMaxZoom(caps.zoom.max || 5);
            setZoomLevel(caps.zoom.min || 1);
          }
          setCamOn(true);
          setTimeout(() => {
            if (videoRef.current) {
              videoRef.current.srcObject = s;
              videoRef.current.play().catch(() => {});
            }
          }, 100);
          atualizarGPS();
          falarSarah(`Câmera de vistoria ativada em ${mun.n}. Leitura visual e telemetria em acompanhamento.`, perfilVozId);
        } catch (err) {
          showToast("Erro ao iniciar câmera: " + err.message);
        }
      };

      const aplicarZoom = async (val) => {
        const z = parseFloat(val);
        setZoomLevel(z);
        if (trackRef.current && hasZoomSupport && trackRef.current.applyConstraints) {
          try { await trackRef.current.applyConstraints({ advanced: [{ zoom: z }] }); } catch (e) {}
        }
      };

      const stopCam = () => {
        if (streamRef.current) streamRef.current.getTracks().forEach(t => t.stop());
        setCamOn(false);
        setHasZoomSupport(false);
      };

      const snapPhoto = async () => {
        const v = videoRef.current;
        if (!v || !v.videoWidth) {
          showToast("Aguarde o vídeo da câmera carregar.");
          return;
        }
        const c = document.createElement("canvas");
        c.width = v.videoWidth;
        c.height = v.videoHeight;
        const ctx = c.getContext("2d");
        ctx.drawImage(v, 0, 0, c.width, c.height);

        const now = new Date();
        const dataHoraStr = `${now.toLocaleDateString("pt-BR")} às ${now.toLocaleTimeString("pt-BR")}`;

        ctx.fillStyle = "rgba(3, 7, 18, 0.85)";
        ctx.fillRect(0, c.height - 95, c.width, 95);
        ctx.strokeStyle = "#00F2FE";
        ctx.lineWidth = 2;
        ctx.strokeRect(1, c.height - 95, c.width - 2, 94);

        ctx.fillStyle = "#00F2FE";
        ctx.font = "bold 12px monospace";
        ctx.fillText(`VISTORIA • ${mun.n} (${mun.ip}) • ${dataHoraStr}`, 15, c.height - 70);

        ctx.fillStyle = "#00FF9D";
        ctx.font = "bold 11px monospace";
        ctx.fillText(`Frente: ${frenteSelecionada} | Risco: ${risco}`, 15, c.height - 48);

        ctx.fillStyle = "#E2E8F0";
        ctx.font = "11px monospace";
        const gpsStr = gps.lat ? `Lat ${gps.lat.toFixed(5)} Lon ${gps.lon.toFixed(5)} (${gps.acc}m)` : "Aguardando GPS";
        ctx.fillText(`Local: ${bairro || "Geral"} | ${gpsStr}`, 15, c.height - 25);

        const dataUrl = c.toDataURL("image/jpeg", 0.88);
        setFotos(prev => [...prev, dataUrl]);

        const hash = await calcularSHA256(dataUrl + dataHoraStr + mun.n + bairro);
        setSha256Hash(hash);
        setStatusFotoMsg("Foto concedida com sucesso — preencha os campos do relatório técnico de forma completa e objetiva.");

        const textoFeedback = "Foto concedida com sucesso. Preencha corretamente os campos de local, risco e descrição técnica no relatório.";
        falarSarah(textoFeedback, perfilVozId);
        showToast("Foto concedida com sucesso. Complete o relatório.");
      };

      const solicitarAnaliseSarah = async () => {
        if (!nome || !rel) {
          showToast("Preencha o nome do responsável e o relato técnico.");
          return;
        }
        setIsAiAnalyzing(true);
        showToast("SARAH AI elaborando laudo técnico...");
        try {
          const contextStr = `Município: ${mun.n} (IP ${mun.ip}), Bairro: ${bairro || "Geral"}, Risco: ${risco}, Frente: ${frenteSelecionada}, Relato: ${rel}, Vento: ${vento} km/h, Clima: ${clima ? JSON.stringify(clima) : "N/A"}, Hash: ${sha256Hash || "Pendente"}.`;
          const aiMsg = await chamarSarahGroq(
            "laudo",
            [{ role: "user", content: `Elaborar laudo técnico de alta complexidade e precisão com base nos dados de campo e telemetria: ${contextStr}` }],
            mun.n,
            bairro,
            "vistoria",
            clima,
            nome
          );
          setRel(prev => `${prev}\n\n--- LAUDO TÉCNICO SARAH AI ---\n${aiMsg}`);
          falarSarah("Laudo técnico integrado ao relatório. Revise os campos obrigatórios antes da transmissão.", perfilVozId);
        } catch (err) {
          showToast("Erro na análise: " + err.message);
        } finally {
          setIsAiAnalyzing(false);
        }
      };

      const gerarProtocolo = async () => {
        if (!nome || !rel) {

          prot,
          data: now.toLocaleDateString("pt-BR"),

          nome,
          bairro,
          rel,
          mun: mun.n,

    function SarahChatModal({ isOpen, onClose, municipioAtual, bairroAtual, abaAtual, userName, perfilVozId }) {
      const [input, setInput] = useState("");
      const [mensagens, setMensagens] = useState([
        {
          role: "assistant",
          content: "SARAH AI, analista técnica sênior do Projeto Cidadão Sensor, com cargo registrado de Analista Técnica Sênior de Monitoramento Climático e Resiliência Territorial. Informe seu nome para iniciarmos o acompanhamento técnico."
        }
      ]);
      const [isLoading, setIsLoading] = useState(false);

      if (!isOpen) return null;

      const handleEnviar = async (e) => {
        e.preventDefault();
        if (!input.trim() || isLoading) return;
        const msgUsuario = input.trim();
        setInput("");
        const novoHistorico = [...mensagens, { role: "user", content: msgUsuario }];
        setMensagens(novoHistorico);
        setIsLoading(true);
        try {
          const resp = await chamarSarahGroq("chat", novoHistorico, municipioAtual, bairroAtual, abaAtual, {}, userName);
          const historicoComResp = [...novoHistorico, { role: "assistant", content: resp }];
          setMensagens(historicoComResp);
          falarSarah(resp, perfilVozId);
        } catch (err) {
          setMensagens([...novoHistorico, { role: "assistant", content: "Falha temporária na consulta. Tente novamente." }]);
        } finally {
          setIsLoading(false);
        }
      };

      return (
        <div className="fixed inset-0 z-[130] flex items-center justify-center bg-void/90 backdrop-blur-2xl p-3 sm:p-4" onClick={onClose}>
          <div className="cyber-card w-full max-w-lg rounded-2xl shadow-2xl overflow-hidden flex flex-col max-h-[85vh] border border-cyberCyan/60 font-mono" onClick={e => e.stopPropagation()}>
            <div className="flex items-center justify-between px-4 py-3 border-b border-cyberCyan/30 bg-deepSpace/95">
              <div className="flex items-center gap-2.5">
                <div className="w-8 h-8 rounded-full overflow-hidden border border-cyberCyan">
                  <SarahLiveSVGAvatar isSpeaking={isLoading} />
                </div>
                <div>
                  <div className="font-display text-xs font-black text-cyberCyan">SARAH AI • ANALISTA TÉCNICA SÊNIOR</div>
                  <div className="text-[9px] text-slate-300">{municipioAtual} • {bairroAtual}</div>
                </div>
              </div>
              <button onClick={onClose} className="cyber-button-danger text-xs py-1 px-3 !min-h-[32px]">FECHAR</button>
            </div>

            <div className="flex-1 overflow-y-auto p-3.5 space-y-2.5 text-xs">
              {mensagens.map((m, idx) => (
                <div
                  key={idx}
                  className={`p-3 rounded-xl leading-relaxed ${
                    m.role === "assistant"
                      ? "bg-void/90 border border-cyberCyan/30 text-slate-100"
                      : "bg-cyberCyan/20 border border-cyberCyan/50 text-white ml-6"
                  }`}
                >
                  {m.content}
                </div>
              ))}
              {isLoading && <div className="text-[11px] text-cyberCyan animate-pulse">Processando análise tática...</div>}
            </div>

            <form onSubmit={handleEnviar} className="p-3 border-t border-cyberCyan/30 bg-deepSpace/95 flex gap-2">
              <input
                type="text"
                value={input}
                onChange={e => setInput(e.target.value)}
                placeholder="Digite sua pergunta técnica ou operacional..."
                className="flex-1 bg-void border border-cyberCyan/40 rounded-xl px-3 py-2.5 text-xs text-white"
              />
              <button type="submit" disabled={isLoading} className="cyber-button-solid text-xs px-4 py-2">
                ENVIAR
              </button>
            </form>
          </div>
        </div>
      );
    }

          return true;

        if (!novo && "speechSynthesis" in window) {
          window.speechSynthesis.cancel();
        }
        showToast(novo ? "Áudio da SARAH AI ativado." : "Áudio da SARAH AI silenciado.");
      };

        e.preventDefault();

          await window.RoboInteligenciaSarah.executarCiclo("acionamento_manual");

        if (window.RoboInteligenciaSarah && typeof window.RoboInteligenciaSarah.iniciar === "function") {
          window.RoboInteligenciaSarah.iniciar();
        }
        const onIntelAtualizada = (ev) => {
          const det = ev?.detail || {};
          setInteligenciaSarah({
            atualizadoEm: det.atualizadoEm || new Date().toISOString(),
            modoFonte: det.modoFonte || "TELEMETRIA_REAL_CONSOLIDADA",
            ultimoErro: det.ultimoErro || null,
            coleta: det.coleta || { resumoConsolidado: "" }
          });
        };
        window.addEventListener("sarah-inteligencia-atualizada", onIntelAtualizada);
        return () => {
          window.removeEventListener("sarah-inteligencia-atualizada", onIntelAtualizada);
        };
      }, []);

      const handleShare = async () => {
        try {
          const iconFile = await gerarArquivoIconeEscudo();
          if (navigator.share) {
            const sharePayload = {
              title: "Base Climática de Monitoramento Tático • Projeto Cidadão Sensor",
              text: shareMessageText,
              url: APP_SHARE_URL
            };
            if (iconFile && navigator.canShare && navigator.canShare({ files: [iconFile] })) {
              await navigator.share({ ...sharePayload, files: [iconFile] });
              return;
            }
            await navigator.share(sharePayload);
            return;
          }
          if (navigator.clipboard) {
            await navigator.clipboard.writeText(shareMessageText);
            showToast("Link copiado para a área de transferência.");
          }
        } catch (err) {}
      };

      const handleWhatsAppShare = async () => {

          const iconFile = await gerarArquivoIconeEscudo();
          if (navigator.share && iconFile && navigator.canShare && navigator.canShare({ files: [iconFile] })) {
            await navigator.share({
              files: [iconFile],
              title: "Base Climática de Monitoramento Tático",
              text: shareMessageText

            />
          )}

          {activeTab === "radar" && <RadarMeteorologicoModule showToast={showToast} perfilVozId={perfilVozId} />}
          {activeTab === "vistoria" && <VistoriaRARU_NEXUS onBackToDashboard={() => setActiveTab("dashboard")} showToast={showToast} perfilVozId={perfilVozId} userName={userName} />}
          {activeTab === "estacao" && <EstacaoSobrevivenciaModuleV12 showToast={showToast} userName={userName} soundEnabled={soundEnabled} perfilVozId={perfilVozId} inteligenciaSarah={inteligenciaSarah} />}
          {activeTab === "alquino" && <RedeAlquinoHardwareModule onGoToDashboard={() => setActiveTab("dashboard")} showToast={showToast} />}
          {activeTab === "balanca" && <ModuloCidadaoSensorModule onGoToDashboard={() => setActiveTab("dashboard")} showToast={showToast} />}
          {activeTab === "radio" && <RadioCyberTatica showToast={showToast} />}
          {activeTab === "admin" && <CadeAdminModule showToast={showToast} perfilVozId={perfilVozId} setPerfilVozId={setPerfilVozId} />}

          <SarahFabButton openSarahChat={() => setIsSarahChatOpen(true)} isSpeaking={false} />

          <SarahChatModal
            isOpen={isSarahChatOpen}
            onClose={() => setIsSarahChatOpen(false)}
            municipioAtual="Mesquita"
            bairroAtual="Rua Amazonas / Vila Sebinho / Maria Cristina / Rocha Sobrinho"
            abaAtual={activeTab}
            userName={userName}
            perfilVozId={perfilVozId}
          />

          <QuemSomosModal
            isOpen={isWhoAmIOpen}
            onClose={() => setIsWhoAmIOpen(false)}
            userName={userName}
          />

          {isNameModalOpen && (
            <div className="fixed inset-0 z-[140] flex items-center justify-center bg-void/90 backdrop-blur-xl p-4" onClick={() => setIsNameModalOpen(false)}>
              <form onSubmit={handleSaveUserName} className="cyber-card w-full max-w-sm rounded-2xl p-4 space-y-3 font-mono border border-cyberCyan/60" onClick={e => e.stopPropagation()}>
                <div className="font-display text-xs font-black text-cyberCyan uppercase">DEFINIR NOME DO OPERADOR</div>
                <input
                  type="text"
                  value={nameInput}
                  onChange={e => setNameInput(e.target.value)}
                  placeholder="Digite o nome de quem está falando..."
                  className="w-full bg-void border border-cyberCyan/40 rounded-xl p-2.5 text-xs text-white"
                />
                <div className="flex gap-2">
                  <button type="submit" className="cyber-button-solid flex-1 text-xs py-2">SALVAR</button>
                  <button type="button" onClick={() => setIsNameModalOpen(false)} className="cyber-button-danger text-xs py-2 px-3">CANCELAR</button>
                </div>
              </form>
            </div>
          )}

          {toastMsg && (
            <div className="fixed bottom-5 left-1/2 -translate-x-1/2 z-[150] bg-deepSpace border border-cyberCyan text-white px-4 py-2.5 rounded-xl text-xs font-mono shadow-xl">
              {toastMsg}
            </div>
          )}
        </div>
      );
    }

    const rootEl = document.getElementById("root");
    const root = ReactDOM.createRoot(rootEl);
    root.render(<App />);
  </script>
</body>
</html>
