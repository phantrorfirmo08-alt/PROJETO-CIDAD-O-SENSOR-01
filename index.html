<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SARAH AI Core v4.0 - Sebinho</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<link rel="manifest" href="manifest.json">
<style>
  body{background:#020617;color:#e2e8f0}
  .avatar{width:48px;height:48px;position:relative;border:1px solid #22d3ee;border-radius:50%;background:radial-gradient(circle,#164e63,#020617);box-shadow:0 0 16px rgba(34,211,238,.45)}
  .avatar::before,.avatar::after{content:"";position:absolute;top:18px;width:5px;height:5px;border-radius:50%;background:#cffafe;box-shadow:0 0 6px #67e8f9}
  .avatar::before{left:13px}.avatar::after{right:13px}
  .mouth{position:absolute;left:50%;bottom:12px;width:9px;height:3px;transform:translateX(-50%);border-radius:50%;background:#a5f3fc}
  .speaking .mouth{animation:talk .2s infinite alternate ease-in-out}
  @keyframes talk{from{width:6px;height:2px}to{width:13px;height:7px}}
</style>
</head>
<body>
<div id="root"></div>
<script type="module">
import React, {useState,useEffect,useRef} from "https://esm.sh/react@18.2.0";
import ReactDOM from "https://esm.sh/react-dom@18.2.0/client";

const agente={model:"llama-3.3-70b-versatile",temp:0.2};

function App(){
  const [font,setFont]=useState(1);
  const [weather,setWeather]=useState(null);
  const [input,setInput]=useState("");
  const [loading,setLoading]=useState(false);
  const [soundEnabled,setSoundEnabled]=useState(true);
  const [isSpeaking,setIsSpeaking]=useState(false);
  const [hasGreeted,setHasGreeted]=useState(false);
  const [deferred,setDeferred]=useState(null);
  const [msgs,setMsgs]=useState([]);

  const speechIdRef=useRef(0);
  const voiceTimerRef=useRef(null);
  const voicesRef=useRef([]);
  const VOICE_DELAY=250;

  const limparTextoParaFala=(text)=> text.replace(/[#*_`~]/g,"").replace(/\[(.*?)\]\(.*?\)/g,"$1").replace(/https?:\/\/\S+/g,"").replace(/\s+/g," ").trim();
  const detectarIdioma=(text)=>{
    if(/[ñ¿¡]/i.test(text)) return "es-ES";
    if(/\b(the|what|how|weather|help|hello|good morning)\b/i.test(text)) return "en-US";
    return "pt-BR";
  };
  const carregarVozes=()=>{ if("speechSynthesis" in window) voicesRef.current=window.speechSynthesis.getVoices(); };

  useEffect(()=>{
    carregarVozes();
    if("speechSynthesis" in window) window.speechSynthesis.onvoiceschanged=carregarVozes;
    return ()=>{ window.speechSynthesis.cancel(); window.speechSynthesis.onvoiceschanged=null; };
  },[]);

  const escolherMelhorVoz=(idioma)=>{
    const vozes=voicesRef.current.length? voicesRef.current : window.speechSynthesis.getVoices();
    const base=idioma.split("-")[0];
    const preferidas=idioma==="pt-BR"? ["Google português do Brasil","Google Português do Brasil","Microsoft Francisca","Microsoft Maria","Luciana"]
    : idioma==="es-ES"? ["Google español","Microsoft Elvira"] : ["Google US English","Microsoft Jenny","Microsoft Aria"];
    return vozes.find(v=>preferidas.some(n=>v.name.toLowerCase().includes(n.toLowerCase()))) || vozes.find(v=>v.lang.toLowerCase()===idioma.toLowerCase()) || vozes.find(v=>v.lang.toLowerCase().startsWith(base)) || vozes[0];
  };

  const stopSpeaking=()=>{
    speechIdRef.current+=1;
    if(voiceTimerRef.current){ clearTimeout(voiceTimerRef.current); voiceTimerRef.current=null; }
    if("speechSynthesis" in window) window.speechSynthesis.cancel();
    setIsSpeaking(false);
  };

  const speakText=(text, referenceText="")=>{
    if(!soundEnabled || !("speechSynthesis" in window)) return;
    const textoFalado=limparTextoParaFala(text); if(!textoFalado) return;
    stopSpeaking();
    const currentId=speechIdRef.current;
    const idioma=detectarIdioma(referenceText||textoFalado);
    voiceTimerRef.current=setTimeout(()=>{
      if(currentId!==speechIdRef.current) return;
      const utt=new SpeechSynthesisUtterance(textoFalado);
      const voz=escolherMelhorVoz(idioma);
      utt.lang=idioma;
      if(voz) utt.voice=voz;
      utt.rate=idioma==="pt-BR"?0.92:0.95; utt.pitch=1.02; utt.volume=1;
      utt.onstart=()=>{ if(currentId===speechIdRef.current) setIsSpeaking(true); };
      utt.onend=()=>{ if(currentId===speechIdRef.current) setIsSpeaking(false); };
      utt.onerror=()=>setIsSpeaking(false);
      window.speechSynthesis.speak(utt);
    },VOICE_DELAY);
  };

  // Apresentação única
  useEffect(()=>{
    if(hasGreeted) return;
    const presentation="Bom dia. Sou a Sara, analista meteorológica do projeto Cidadão Sensor, da Defesa Civil Comunitária, monitorando a Comunidade do Sebinho e a ponte Frigo Eden. Em que posso ajudar?";
    const timer=setTimeout(()=>{
      setHasGreeted(true);
      setMsgs([{sender:'sarah', text:presentation, timestamp: new Date().toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'})}]);
      speakText(presentation,"pt-BR");
    },700);
    return ()=>clearTimeout(timer);
  },[hasGreeted, soundEnabled]);

  useEffect(()=>{
    const listener=(e)=>{ e.preventDefault(); setDeferred(e); };
    window.addEventListener("beforeinstallprompt",listener);
    fetch("https://api.open-meteo.com/v1/forecast?latitude=-22.7845&longitude=-43.4140&current=temperature_2m,precipitation,wind_speed_10m&timezone=America/Sao_Paulo")
      .then(r=>r.json()).then(d=>{ if(d?.current) setWeather(d.current); }).catch(()=>{});
    return ()=>window.removeEventListener("beforeinstallprompt",listener);
  },[]);

  const install=async()=>{ if(deferred){ deferred.prompt(); await deferred.userChoice; setDeferred(null);} else alert("Menu > Adicionar à tela inicial / Instalar app"); };
  const share=async()=>{ if(navigator.share){ try{ await navigator.share({title:"SARAH Sebinho",url:location.href}); }catch{}} else{ await navigator.clipboard.writeText(location.href); alert("Link copiado!"); } };

  const send=async()=>{
    stopSpeaking();
    if(!input.trim()||loading) return;
    const txt=input.trim();
    const agora=new Date();
    const hora=parseInt(new Intl.DateTimeFormat("pt-BR",{timeZone:"America/Sao_Paulo",hour:"numeric",hour12:false}).format(agora));
    const saudacao=hora>=5&&hora<12?"Bom dia":hora<18?"Boa tarde":hora<23?"Boa noite":"Boa madrugada";
    const userMsg={sender:"user", text:txt, timestamp: agora.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'})};
    setMsgs(p=>[...p,userMsg]); setInput(""); setLoading(true);
    try{
      const resp=await fetch("/api/sarah",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({hasGreeted,saudacao,weather:weather?`Chuva ${weather.precipitation}mm vento ${weather.wind_speed_10m}km/h`:"sem dados",historico:msgs.slice(-6),mensagem:txt,model:agente.model,temperature:agente.temp})});
      const data=await resp.json();
      if(!resp.ok) throw new Error(data?.error||"Falha API");
      const reply=data?.resposta||data?.alerta||"Sebinho OK.";
      setMsgs(p=>[...p,{sender:"sarah",text:reply,timestamp:new Date().toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'})}]);
      speakText(reply,txt);
    }catch(e){
      const errMsg=`Modo offline: GitHub Pages não tem cofre Groq. Se estiver na Cloudflare, verifique GROQ_API_KEY no cofre. Erro: ${e.message}`;
      setMsgs(p=>[...p,{sender:"sarah",text:errMsg,timestamp:new Date().toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'})}]);
    }
    setLoading(false);
  };

  const fs=["text-xs","text-sm","text-base","text-lg"][font];

  return React.createElement("div",{className:`min-h-screen flex flex-col justify-between p-3 ${fs}`},
    React.createElement("div",null,
      React.createElement("header",{className:"flex flex-wrap justify-between gap-2 border-b border-cyan-500/30 pb-3"},
        React.createElement("div",{className:"flex items-center gap-3"},
          React.createElement("div",{className:`avatar ${isSpeaking?"speaking":""}`}, React.createElement("div",{className:"mouth"})),
          React.createElement("div",{className:"font-mono text-[11px] text-cyan-400 font-bold leading-tight"}, `SARAH v4.0 - Sebinho / Frigo Eden\n${agente.model} ${isSpeaking?"🔊 falando...":""}`)
        ),
        React.createElement("div",{className:"flex gap-1.5 flex-wrap items-center"},
          React.createElement("button",{onClick:install,className:"px-3 py-1.5 bg-cyan-500 text-black font-bold rounded text-xs"},"📲 Instalar"),
          React.createElement("button",{onClick:share,className:"px-3 py-1.5 bg-slate-800 border border-cyan-500/30 rounded text-xs"},"🔗 Compartilhar"),
          React.createElement("button",{onClick:()=>setFont(f=>Math.max(0,f-1)),className:"px-2 py-1.5 bg-slate-800 rounded text-xs"},"A-"),
          React.createElement("button",{onClick:()=>setFont(f=>Math.min(3,f+1)),className:"px-2 py-1.5 bg-slate-800 rounded text-xs"},"A+"),
          React.createElement("button",{onClick:()=>{ stopSpeaking(); setSoundEnabled(!soundEnabled); },className:`px-3 py-1.5 rounded text-xs font-bold ${soundEnabled?'bg-emerald-600':'bg-slate-700'}`}, soundEnabled?"🔊 Voz":"🔇 Mudo")
        )
      ),
      weather && React.createElement("div",{className:"mt-3 bg-slate-900 border border-cyan-500/20 rounded p-2 font-mono text-[11px] flex gap-4 flex-wrap"}, `🌧️ ${weather.precipitation}mm 💨 ${weather.wind_speed_10m}km/h 🌡️ ${weather.temperature_2m}°C 📍 Confluência Dona Eugênia / Sarapuí`),
      React.createElement("div",{className:"mt-4 space-y-2 max-h-[55vh] overflow-y-auto pr-1"},
        msgs.map((m,i)=> React.createElement("div",{key:i,className:`p-3 rounded leading-relaxed ${m.sender=='user'?'bg-cyan-900/30 ml-6':'bg-slate-800 mr-6 border border-cyan-500/20'}`},
          React.createElement("div",{className:"font-mono text-[10px] opacity-60"}, `${m.sender=='user'?'Você':'Sara'} - ${m.timestamp||''}`),
          React.createElement("div",{className:"mt-1 whitespace-pre-wrap"}, m.text)
        )),
        loading && React.createElement("div",{className:"text-xs font-mono animate-pulse text-cyan-400"},"Sara analisando satélite...")
      ),
      React.createElement("div",{className:"mt-4 flex gap-2"},
        React.createElement("input",{value:input,onChange:e=>setInput(e.target.value),onKeyDown:e=>{ if(e.key==='Enter') send(); },placeholder:"Pergunte qualquer rua no Sebinho...",className:"flex-1 bg-black border border-cyan-500/40 rounded px-3 py-3 text-sm focus:outline-none focus:border-cyan-400"}),
        React.createElement("button",{onClick:send,className:"px-5 py-3 bg-cyan-500 text-black font-bold rounded text-sm"},"Enviar")
      ),
      soundEnabled && isSpeaking && React.createElement("button",{onClick:stopSpeaking,className:"mt-2 text-[11px] underline text-amber-300"},"⏹️ Parar fala")
    ),
    React.createElement("footer",{className:"text-center py-3 font-mono text-[10px] opacity-50 border-t border-slate-800 mt-6"}, `SARAH Core v4.0 - Groq ${agente.model} - ${new Date().toLocaleDateString('pt-BR')}`)
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(App));
</script>
</body>
</html>
