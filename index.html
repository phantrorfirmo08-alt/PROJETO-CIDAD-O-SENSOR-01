<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>RARU NEXUS AI V11 Plus - CENTRAL OPERACIONAL & VISTORIA DE CAMPO</title>
<script src="https://cdn.tailwindcss.com"></script>
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script crossorigin src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
  .panel-dia { background: #0B1120; border: 1px solid rgba(255,255,255,.15); border-radius: 18px; color: #E5E7EB; }
  .panel-noite { background: #030712; border: 1px solid rgba(59,130,246,.3); border-radius: 18px; color: #93C5FD; box-shadow: 0 0 25px rgba(29,78,216,0.2); }
  .label { font-size: 11px; letter-spacing: .08em; font-weight: 800; color: #94A3B8; text-transform: uppercase; }
  .map-box { background: radial-gradient(circle at center, #0F172A 0%, #02040A 100%); border: 1px solid rgba(59,130,246,.3); border-radius: 16px; }
  .btn { width: 100%; padding: 14px; border-radius: 14px; font-weight: 900; font-size: 12px; letter-spacing: .04em; }
  .x { position: absolute; top: 4px; right: 4px; width: 20px; height: 20px; background: #111; color: #fff; border-radius: 50%; display: grid; place-items: center; font-weight: 900; border: 1px solid #fff; cursor: pointer; font-size: 11px; }
  @keyframes pisca { 0%,100% { opacity: 1; transform: scale(1); } 50% { opacity: .7; transform: scale(1.02); } }
  .pisca { animation: pisca 1.5s infinite; }
  @keyframes flutuarNuvem { 0% { transform: translateX(0px); opacity: 0.4; } 50% { transform: translateX(30px); opacity: 0.85; } 100% { transform: translateX(0px); opacity: 0.4; } }
  .nuvem-animada { animation: flutuarNuvem 6s ease-in-out infinite; }
  @keyframes radarGiro { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
  .radar-barred { animation: radarGiro 4s linear infinite; transform-origin: 200px 180px; }
  @keyframes twinkle { 0%, 100% { opacity: 0.3; } 50% { opacity: 1; transform: scale(1.2); } }
  .star { animation: twinkle 2s infinite ease-in-out; fill: #FFFFFF; }
  @keyframes fall { 0% { transform: translateY(-15px); opacity: 0; } 50% { opacity: 0.9; } 100% { transform: translateY(90px); opacity: 0; } }
  .rain-drop { animation: fall 0.7s linear infinite; stroke: #38BDF8; stroke-width: 1.5; stroke-linecap: round; }
  ::-webkit-scrollbar { width: 6px; height: 6px; }
  ::-webkit-scrollbar-track { background: #02040A; border-radius: 8px; }
  ::-webkit-scrollbar-thumb { background: #1E293B; border-radius: 8px; }
  ::-webkit-scrollbar-thumb:hover { background: #3B82F6; }
</style>
</head>
<body id="corpo-pagina" class="p-2 flex justify-center transition-colors duration-700">
<div id="root" class="w-full max-w-[720px]"></div>

<script type="text/babel">
const {useState, useRef, useEffect} = React;
const SARAH_AVATAR = "https://cdn.imagetourls.com/uploads/tyImg/195w5uur9.png";

const MUNICIPIOS_RJ = [
  {n:"Mesquita (Base Anfitriã Oficial - Rocha Sobrinho)",lat:-22.7858,lon:-43.4294,reg:"Baixada Fluminense",bacia:"Bacia do Rio Sarapuí / Iguaçu (Baixada)"},
  {n:"Nova Iguaçu (Baixada Fluminense)",lat:-22.7559,lon:-43.4605,reg:"Baixada Fluminense",bacia:"Bacia do Rio Botas / Sarapuí"},
  {n:"Duque de Caxias (Baixada Fluminense)",lat:-22.7856,lon:-43.3117,reg:"Baixada Fluminense",bacia:"Bacia do Rio Iguaçu / Sarapuí"},
  {n:"São João de Meriti (Baixada Fluminense)",lat:-22.8031,lon:-43.3695,reg:"Baixada Fluminense",bacia:"Bacia do Rio Sarapuí / Pavuna"},
  {n:"Belford Roxo (Baixada Fluminense)",lat:-22.7642,lon:-43.3997,reg:"Baixada Fluminense",bacia:"Bacia do Rio Botas"},
  {n:"Nilópolis (Baixada Fluminense)",lat:-22.8081,lon:-43.4147,reg:"Baixada Fluminense",bacia:"Bacia do Rio Sarapuí"},
  {n:"São Gonçalo (Região Metropolitana)",lat:-22.8267,lon:-43.0631,reg:"Metropolitana",bacia:"Bacia do Rio Imboaçu"},
  {n:"Niterói (Região Metropolitana)",lat:-22.8833,lon:-43.1036,reg:"Metropolitana",bacia:"Bacia do Rio Icaraí / Baía Guanabara"},
  {n:"Petrópolis (Região Serrana)",lat:-22.5055,lon:-43.1789,reg:"Serrana",bacia:"Bacia do Rio Piabanha"},
  {n:"Angra dos Reis",lat:-23.0067,lon:-44.3181,reg:"Costa Verde",bacia:"Bacia Costa Verde"},
  {n:"Rio de Janeiro (Capital)",lat:-22.9068,lon:-43.1729,reg:"Metropolitana",bacia:"Baía de Guanabara"}
];

const ORGAOS_OFICIAIS = [
  "COMPDEC / Defesa Civil Municipal",
  "SEDEC-RJ / Defesa Civil Estadual",
  "GADE - Grupo Comunitário A Chave da Esperança",
  "CEMADEN (Centro Nacional de Monitoramento e Alertas)",
  "INEA (Instituto Estadual do Ambiente)",
  "CRAS / Assistência Social Municipal",
  "NUPDEC (Núcleo Comunitário de Defesa Civil)"
];

const RISCOS_VISTORIA = [
  "R1 - BAIXO / PREVENTIVO (Normal)",
  "R2 - MODERADO / ATENCAO (Observacao)",
  "R3 - ALTO / ALERTA (Risco Elevado)",
  "R4 - IMINENTE / EVACUACAO (Critico)",
  "RH - HIDROLOGICO (Alagamento de Bacia)",
  "RE - ESTRUTURAL (Geotecnia e Encosta)"
];

function App() {
  const [autenticado, setAutenticado] = useState(false);
  const [senha, setSenha] = useState('');
  const [erroSenha, setErroSenha] = useState(false);
  
  const [modoNoite, setModoNoite] = useState(false);
  const [horaAtualStr, setHoraAtualStr] = useState('');
  const [abaAtiva, setAbaAtiva] = useState('central'); // 'central', 'vistoria', 'historico', 'cadastros'
  const [statusConexao, setStatusConexao] = useState(navigator.onLine ? 'ONLINE' : 'OFFLINE (CONTINGÊNCIA)');

  const [mun, setMun] = useState(MUNICIPIOS_RJ[0]);
  const [urlCloudflare, setUrlCloudflare] = useState('https://solitary-snow-2459.phantrorfirmo08.workers.dev/');

  const [modoIA, setModoIA] = useState('laudo');
  const [orgaoSelecionado, setOrgaoSelecionado] = useState(ORGAOS_OFICIAIS[0]);

  const [meteo, setMeteo] = useState({
    temperatura: "27°C",
    umidade: "78%",
    chuvaMm: "14.2 mm/h",
    pressao: "1012 hPa",
    ventoVel: "22 km/h",
    condicao: "Instável / Pancadas Isoladas",
    statusSat: "ONLINE - API OPEN-METEO"
  });
  const [carregandoMeteo, setCarregandoMeteo] = useState(false);

  const [iaLaudo, setIaLaudo] = useState("Cérebro neural ativado. Selecione qualquer município para iniciar a análise falada da telemetria...");
  const [nivelAlertaCor, setNivelAlertaCor] = useState("bg-emerald-500");
  const [nivelAlertaTexto, setNivelAlertaTexto] = useState("R1 - NORMAL / PREVENTIVO");
  const [falarVoz, setFalarVoz] = useState(true);

  // Chat Sarah Flutuante
  const [chatAberto, setChatAberto] = useState(false);
  const [mensagensChat, setMensagensChat] = useState([
    { sender: 'sarah', text: 'Olá, Alexander! Sou a Sarah, sua IA de Defesa Civil pronta para apoiar nas vistorias de campo.' }
  ]);
  const [inputChat, setInputChat] = useState('');

  // Vistoria de Campo & Câmera
  const [fotosVistoria, setFotosVistoria] = useState([]);
  const [camOn, setCamOn] = useState(false);
  const [nomeAgente, setNomeAgente] = useState('Alexander da Silva Firmo');
  const [bairroVistoria, setBairroVistoria] = useState('Sebinho / Rocha Sobrinho');
  const [riscoVistoria, setRiscoVistoria] = useState(RISCOS_VISTORIA[0]);
  const [relatoVistoria, setRelatoVistoria] = useState('');
  const [coordsGPS, setCoordsGPS] = useState({lat: -22.7858, lon: -43.4294});
  const [analisandoIA, setAnalisandoIA] = useState(false);
  
  const [historicoVistorias, setHistoricoVistorias] = useState(() => {
    try { return JSON.parse(localStorage.getItem('raru_vistorias_v11plus') || '[]'); } catch { return []; }
  });

  const videoRef = useRef(null);
  const streamRef = useRef(null);

  // Cadastros GADE
  const [cadastros, setCadastros] = useState(() => {
    try { return JSON.parse(localStorage.getItem('raru_cadastros_offline') || '[{"id":1,"nome":"Alexander da Silva Firmo","municipio":"Mesquita (Base Anfitriã Oficial - Rocha Sobrinho)","bairro":"Sebinho / Rocha Sobrinho","papel":"Agente / Coordenador GADE","data":"2026-07-15"}]'); } catch { return []; }
  });
  const [novoNomeCad, setNovoNomeCad] = useState('');
  const [novoBairroCad, setNovoBairroCad] = useState('');
  const [novoPapelCad, setNovoPapelCad] = useState('Morador / Voluntário');

  // Sirenes
  const [statusBR, setStatusBR] = useState('AGUARDANDO');
  const [timerBR, setTimerBR] = useState('00:00 / 05:00');
  const [statusRU, setStatusRU] = useState('AGUARDANDO');
  const [timerRU, setTimerRU] = useState('00:00 / 05:00');

  const audioCtxRef = useRef(null);
  const oscRef = useRef(null);
  const intervalRef = useRef(null);

  useEffect(() => {
    const checarConexao = () => setStatusConexao(navigator.onLine ? 'ONLINE (NUVEM)' : 'OFFLINE (CONTINGÊNCIA)');
    window.addEventListener('online', checarConexao);
    window.addEventListener('offline', checarConexao);

    const checarHorario = () => {
      const now = new Date();
      const hora = now.getHours();
      const min = now.getMinutes();
      const segundos = now.getSeconds();
      setHoraAtualStr(`${hora.toString().padStart(2,'0')}:${min.toString().padStart(2,'0')}:${segundos.toString().padStart(2,'0')}`);
      
      if (hora >= 19 || hora < 6) {
        setModoNoite(true);
        document.body.style.backgroundColor = '#010308';
      } else {
        setModoNoite(false);
        document.body.style.backgroundColor = '#02040A';
      }
    };
    checarHorario();
    const timer = setInterval(checarHorario, 1000);

    if (navigator.geolocation) {
      navigator.geolocation.getCurrentPosition(
        (pos) => setCoordsGPS({lat: pos.coords.latitude, lon: pos.coords.longitude}),
        () => {}
      );
    }
    return () => {
      clearInterval(timer);
      window.removeEventListener('online', checarConexao);
      window.removeEventListener('offline', checarConexao);
    };
  }, []);

  useEffect(() => {
    try { localStorage.setItem('raru_vistorias_v11plus', JSON.stringify(historicoVistorias)); } catch {}
  }, [historicoVistorias]);

  useEffect(() => {
    try { localStorage.setItem('raru_cadastros_offline', JSON.stringify(cadastros)); } catch {}
  }, [cadastros]);

  const falarTextoIA = (texto) => {
    if (!falarVoz || !('speechSynthesis' in window)) return;
    window.speechSynthesis.cancel();
    const utterance = new SpeechSynthesisUtterance(texto);
    utterance.lang = 'pt-BR';
    utterance.rate = 1.0;
    utterance.pitch = 1.0;
    window.speechSynthesis.speak(utterance);
  };

  const enviarMensagemChat = (e) => {
    e.preventDefault();
    if (!inputChat.trim()) return;
    const txt = inputChat;
    setMensagensChat(p => [...p, { sender: 'user', text: txt }]);
    setInputChat('');
    setTimeout(() => {
      let resp = `Compreendido, Alexander. Monitoramento ativo em ${mun.n.split('(')[0]}.`;
      const lc = txt.toLowerCase();
      if (lc.includes('fé') || lc.includes('deus')) resp = "A fé sustenta o nosso caminhar e a nossa vigilância comunitária no GADE.";
      setMensagensChat(p => [...p, { sender: 'sarah', text: resp }]);
      falarTextoIA(resp);
    }, 700);
  };

  const consultarMeteorologiaSat = async (mObj, modoAtual = modoIA) => {
    setCarregandoMeteo(true);
    try {
      const url = `https://api.open-meteo.com/v1/forecast?latitude=${mObj.lat}&longitude=${mObj.lon}&current=temperature_2m,relative_humidity_2m,precipitation,surface_pressure,wind_speed_10m`;
      const res = await fetch(url);
      const data = await res.json();
      
      if(data && data.current) {
        const c = data.current;
        const mm = c.precipitation;
        
        setMeteo({
          temperatura: `${c.temperature_2m}°C`,
          umidade: `${c.relative_humidity_2m}%`,
          chuvaMm: `${mm} mm/h`,
          pressao: `${c.surface_pressure} hPa`,
          ventoVel: `${c.wind_speed_10m} km/h`,
          condicao: mm > 15 ? "Chuva Forte / Temporal" : mm > 5 ? "Chuva Moderada" : "Estável / Monitoramento",
          statusSat: "SATÉLITE CONECTADO (OPEN-METEO)"
        });

        let nomeSimples = mObj.n.split('(')[0].trim();
        let laudoGerado = "";
        let corAlerta = "bg-emerald-500";
        let textoAlerta = "R1 - NORMAL / PREVENTIVO";

        if(mm > 25) {
          corAlerta = "bg-red-600 pisca";
          textoAlerta = "R4 - EVACUAÇÃO IMINENTE";
        } else if(mm > 10) {
          corAlerta = "bg-orange-500 pisca";
          textoAlerta = "R3 - ALERTA ALTO";
        } else if(mm > 3) {
          corAlerta = "bg-yellow-500";
          textoAlerta = "R2 - ATENÇÃO / MODERADO";
        } else {
          corAlerta = "bg-emerald-500";
          textoAlerta = "R1 - NORMAL / PREVENTIVO";
        }

        if (modoAtual === 'acolhimento') {
          laudoGerado = `[Acolhimento Humanizado • Destinado a: ${orgaoSelecionado}]: Olá, morador(a) de ${nomeSimples}. Compreendemos a apreensão local. Nossa rede comunitária e os voluntários do GADE estão postos para orientá-lo com total segurança e apoio humanitário.`;
        } else if (modoAtual === 'protocolo') {
          laudoGerado = `[Consulta de Protocolos e Auxílios • Destinado a: ${orgaoSelecionado}]: Diretrizes de calamidade ativas para ${nomeSimples}. Em caso de risco, verifique junto à assistência social o cadastro para habitação segura e auxílios.`;
        } else {
          if(mm > 25) {
            laudoGerado = `[LAUDO TÉCNICO EXECUTIVO - USACE/FEMA • ${orgaoSelecionado}]: Acumulado crítico de ${mm} mm/h registrado na bacia ${mObj.bacia} (${nomeSimples}). Risco iminente de escorregamento. Acionamento da brigada recomendado.`;
          } else {
            laudoGerado = `[LAUDO TÉCNICO EXECUTIVO - USACE/FEMA • ${orgaoSelecionado}]: Condição geotécnica estável em ${mun.reg} (${nomeSimples}). Precipitação moderada (${mm} mm/h).`;
          }
        }

        setNivelAlertaCor(corAlerta);
        setNivelAlertaTexto(textoAlerta);
        setIaLaudo(laudoGerado);
        falarTextoIA(`Destino: ${orgaoSelecionado}. ${laudoGerado}`);
      }
    } catch(e) {
      setMeteo(prev => ({...prev, statusSat: "CACHE LOCAL ATIVO"}));
    } finally {
      setCarregandoMeteo(false);
    }
  };

  useEffect(() => {
    consultarMeteorologiaSat(mun, modoIA);
  }, [mun, modoIA, orgaoSelecionado]);

  const startCam = async () => {
    try {
      const s = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: { ideal: "environment" }, width: { ideal: 1280 } }
      });
      streamRef.current = s;
      setCamOn(true);
      setTimeout(() => {
        if(videoRef.current) {
          videoRef.current.srcObject = s;
          videoRef.current.play().catch(() => {});
        }
      }, 150);
    } catch(e) {
      alert('Permissão de câmera negada.');
    }
  };

  const stopCam = () => {
    if(streamRef.current) streamRef.current.getTracks().forEach(t => t.stop());
    setCamOn(false);
  };

  const capturarFotoCampoOffline = () => {
    const v = videoRef.current;
    if(!v || v.videoWidth === 0) return;
    
    setAnalisandoIA(true);
    const c = document.createElement('canvas');
    c.width = 600;
    c.height = Math.round(600 * v.videoHeight / v.videoWidth);
    const ctx = c.getContext('2d');
    
    ctx.drawImage(v, 0, 0, c.width, c.height);
    
    ctx.fillStyle = 'rgba(0,0,0,0.92)';
    ctx.fillRect(0, c.height - 48, c.width, 48);
    
    ctx.fillStyle = '#60A5FA';
    ctx.font = '700 10px monospace';
    const dataHora = new Date().toLocaleString('pt-BR');
    ctx.fillText(`RARU NEXUS | GPS: ${coordsGPS.lat.toFixed(4)}, ${coordsGPS.lon.toFixed(4)} | ${riscoVistoria}`, 10, c.height - 28);
    
    ctx.fillStyle = '#FFFFFF';
    ctx.font = '700 9px monospace';
    ctx.fillText(`${dataHora} | LOCAL: ${bairroVistoria} | AGENTE: ${nomeAgente}`, 10, c.height - 12);
    
    const dataUrl = c.toDataURL('image/jpeg', 0.65);
    setFotosVistoria(p => [...p, dataUrl]);

    setTimeout(() => {
      setAnalisandoIA(false);
      falarTextoIA("Foto capturada e salva com carimbo.");
    }, 600);
  };

  const gerarLaudoPDFEEnviar = async () => {
    if (!relatoVistoria) { alert('Digite um relato de campo.'); return; }
    
    const prot = `PROT-RJ-${mun.n.slice(0,3).toUpperCase()}-2026-${Math.floor(Math.random()*8999+1000)}`;
    const raw = `${prot}-${Date.now()}-${mun.n}`;
    const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(raw));
    const hash = Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2,'0')).join('');

    setHistoricoVistorias(prev => [{
      prot, data: new Date().toLocaleString('pt-BR'), municipio: mun.n.split('(')[0], bairro: bairroVistoria, risco: riscoVistoria, hash: hash.slice(0,16), fotos: fotosVistoria.length, sincronizado: true
    }, ...prev]);

    const { jsPDF } = window.jspdf;
    const doc = new jsPDF('p', 'mm', 'a4');
    
    doc.setFillColor(3, 7, 18);
    doc.rect(0, 0, 210, 297, 'F');
    
    doc.setTextColor(59, 130, 246);
    doc.setFont('helvetica', 'bold');
    doc.setFontSize(13);
    doc.text(`RARU NEXUS AI - LAUDO TÉCNICO OFICIAL (${prot})`, 10, 15);
    
    doc.setTextColor(148, 163, 184);
    doc.setFontSize(8);
    doc.text(`MUNICÍPIO: ${mun.n} - RJ`, 10, 21);
    doc.text(`AGENTE: ${nomeAgente} | BAIRRO: ${bairroVistoria} | ÓRGÃO: ${orgaoSelecionado}`, 10, 26);
    doc.text(`GPS: LAT ${coordsGPS.lat.toFixed(4)}, LON ${coordsGPS.lon.toFixed(4)} | DATA: ${new Date().toLocaleString('pt-BR')}`, 10, 31);
    
    doc.setTextColor(255, 255, 255);
    doc.setFont('helvetica', 'bold');
    doc.text(`RELATO TÉCNICO DA VISTORIA DE CAMPO:`, 10, 40);
    
    doc.setFont('helvetica', 'normal');
    doc.setFontSize(8.5);
    const linhasRelato = doc.splitTextToSize(relatoVistoria, 190);
    doc.text(linhasRelato, 10, 47);

    let y = 100;
    for(let i = 0; i < fotosVistoria.length; i++) {
      if(y > 210) {
        doc.addPage();
        doc.setFillColor(3, 7, 18);
        doc.rect(0, 0, 210, 297, 'F');
        y = 15;
      }
      try { doc.addImage(fotosVistoria[i], 'JPEG', 10 + (i % 2) * 95, y, 88, 50); } catch {}
      if(i % 2 === 1) y += 58;
      else if(i === fotosVistoria.length - 1) y += 58;
    }

    doc.setFontSize(6);
    doc.setTextColor(100, 116, 139);
    doc.text(`HASH SHA-256: ${hash}`, 10, 290);

    const blob = doc.output('blob');
    const pdfFile = new File([blob], `${prot}.pdf`, {type:'application/pdf'});
    
    if(navigator.canShare && navigator.canShare({files:[pdfFile]})) {
      await navigator.share({title: prot, text: `Laudo Técnico ${prot}`, files:[pdfFile]});
    } else {
      window.open(URL.createObjectURL(blob), '_blank');
    }
    falarTextoIA("Laudo gerado em PDF com sucesso.");
  };

  const enviarWhatsAppOffline = () => {
    const texto = `🚨 *RELATÓRIO DE VISTORIA - RARU NEXUS* 🚨\n📍 ${mun.n.split('(')[0]} - RJ\n📌 Bairro: ${bairroVistoria}\n👤 Agente: ${nomeAgente}\n⚠️ Risco: ${riscoVistoria}\n📋 Relato: ${relatoVistoria}`;
    window.open(`https://wa.me/?text=${encodeURIComponent(texto)}`, '_blank');
  };

  const fazerLogin = () => {
    if(senha === 'sarah2026') { setAutenticado(true); setErroSenha(false); }
    else { setErroSenha(true); }
  };

  const cadastrarPessoa = () => {
    if(!novoNomeCad || !novoBairroCad) { alert('Preencha Nome e Bairro.'); return; }
    setCadastros(prev => [{
      id: Date.now(), nome: novoNomeCad, municipio: mun.n, bairro: novoBairroCad, papel: novoPapelCad, data: new Date().toLocaleDateString('pt-BR')
    }, ...prev]);
    setNovoNomeCad(''); setNovoBairroCad('');
  };

  const initAudio = () => {
    if(!audioCtxRef.current) audioCtxRef.current = new (window.AudioContext || window.webkitAudioContext)();
  };

  const pararSirenes = () => {
    if(intervalRef.current) clearInterval(intervalRef.current);
    if(oscRef.current) { try{ oscRef.current.stop(); }catch{} oscRef.current = null; }
    setStatusBR('AGUARDANDO'); setStatusRU('AGUARDANDO');
    setTimerBR('00:00 / 05:00'); setTimerRU('00:00 / 05:00');
  };

  const tocarSomBR = () => {
    initAudio();
    if(oscRef.current) return;
    const ctx = audioCtxRef.current;
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = 'sine'; osc.frequency.setValueAtTime(440, ctx.currentTime);
    gain.gain.setValueAtTime(0.4, ctx.currentTime);
    osc.connect(gain); gain.connect(ctx.destination); osc.start();
    oscRef.current = osc;
  };

  const iniciarBR = () => {
    pararSirenes();
    tocarSomBR();
    setStatusBR('TOCANDO - ALERTA MÁXIMO');
  };

  const iniciarRU = () => {
    pararSirenes();

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
