<!DOCTYPE html>
<html lang="pt-BR" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Projeto Cidadão Sensor - SARAH IA Core v4.0</title>
    
    <!-- Open Graph / Redes Sociais (WhatsApp, Telegram, etc.) -->
    <meta property="og:title" content="Projeto Cidadão Sensor - Sarah IA ®">
    <meta property="og:description" content="App / Redução de riscos & Resiliência climática, automatizado">
    <meta property="og:image" content="https://phantrorfirmo08-alt.github.io/PROJETO-CIDAD-O-SENSOR-01/icon.svg">
    <meta property="og:url" content="https://phantrorfirmo08-alt.github.io/PROJETO-CIDAD-O-SENSOR-01/">
    <meta property="og:type" content="website">

    <!-- Twitter Cards -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Projeto Cidadão Sensor - Sarah IA ®">
    <meta name="twitter:description" content="App / Redução de riscos & Resiliência climática, automatizado">
    <meta name="twitter:image" content="https://phantrorfirmo08-alt.github.io/PROJETO-CIDAD-O-SENSOR-01/icon.svg">

    <!-- Tailwind CSS & React & Lucide CDNs -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: { 500: '#06b6d4', 600: '#0891b2' }
                    }
                }
            }
        }
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;700&display=swap');
        body { font-family: 'Inter', sans-serif; }
        .font-mono { font-family: 'JetBrains Mono', monospace; }
        @keyframes pulse-slow { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }
        .animate-pulse-slow { animation: pulse-slow 3s cubic-bezier(0.4, 0, 0.6, 1) infinite; }
        @keyframes marquee { 0% { transform: translateX(0%); } 100% { transform: translateX(-50%); } }
        .animate-marquee { display: flex; width: 200%; animation: marquee 25s linear infinite; }
        .animate-marquee:hover { animation-play-state: paused; }
        @keyframes scanline { 0% { transform: translateY(-100%); } 100% { transform: translateY(1000%); } }
        .animate-scan { animation: scanline 4s linear infinite; }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col selection:bg-cyan-500 selection:text-slate-950">

    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        function App() {
            const [activeTab, setActiveTab] = useState('dashboard');
            const [isDarkMode, setIsDarkMode] = useState(true);
            const [deferredPrompt, setDeferredPrompt] = useState(null);
            const [showInstallBtn, setShowInstallBtn] = useState(false);
            const [lgpdAccepted, setLgpdAccepted] = useState(false);
            const [check1, setCheck1] = useState(false);
            const [check2, setCheck2] = useState(false);
            
            // Estado do Clima (Open-Meteo Mesquita - RJ)
            const [weather, setWeather] = useState({ temp: '--', condition: 'A carregar...', humidity: '--', precipitation: '--', risk: 'Calculando...', color: 'cyan' });
            
            // Estado do Chat IA
            const [messages, setMessages] = useState([
                { role: 'assistant', text: 'Olá! Sou a SARAH IA. Sistema de monitoramento preventivo de Defesa Civil ativo para Mesquita / RJ (Sebinho e Rocha Sobrinho). Como posso auxiliar?' }
            ]);
            const [inputMessage, setInputMessage] = useState('');
            const [isTyping, setIsTyping] = useState(false);
            const chatEndRef = useRef(null);

            // PWA Install prompt listener
            useEffect(() => {
                window.addEventListener('beforeinstallprompt', (e) => {
                    e.preventDefault();
                    setDeferredPrompt(e);
                    setShowInstallBtn(true);
                });
            }, []);

            // Buscar dados meteorológicos reais da Open-Meteo para Mesquita - RJ (-22.78, -43.43)
            useEffect(() => {
                async function fetchWeather() {
                    try {
                        const res = await fetch('https://api.open-meteo.com/v1/forecast?latitude=-22.78&longitude=-43.43&current=temperature_2m,relative_humidity_2m,precipitation,weather_code');
                        const data = await res.json();
                        if (data && data.current) {
                            const temp = data.current.temperature_2m;
                            const hum = data.current.relative_humidity_2m;
                            const prec = data.current.precipitation;
                            
                            let riskLevel = 'Baixo';
                            let riskColor = 'emerald';
                            if (prec > 10) { riskLevel = 'Alto (Alerta)'; riskColor = 'rose'; }
                            else if (prec > 2) { riskLevel = 'Moderado'; riskColor = 'amber'; }

                            setWeather({
                                temp: `${temp}°C`,
                                condition: prec > 5 ? 'Chuva Forte' : prec > 0 ? 'Chuva Leve / Instável' : 'Estável',
                                humidity: `${hum}%`,
                                precipitation: `${prec} mm`,
                                risk: riskLevel,
                                color: riskColor
                            });
                        }
                    } catch (err) {
                        setWeather({ temp: '26°C', condition: 'Modo Offline / Simulado', humidity: '78%', precipitation: '0.0 mm', risk: 'Baixo', color: 'emerald' });
                    }
                }
                fetchWeather();
                const interval = setInterval(fetchWeather, 300000); // Atualiza a cada 5 min
                return () => clearInterval(interval);
            }, []);

            useEffect(() => {
                chatEndRef.current?.scrollIntoView({ behavior: 'smooth' });
            }, [messages, isTyping]);

            const handleInstallClick = async () => {
                if (!deferredPrompt) return;
                deferredPrompt.prompt();
                const { outcome } = await deferredPrompt.userChoice;
                if (outcome === 'accepted') {
                    setDeferredPrompt(null);
                    setShowInstallBtn(false);
                }
            };

            const handleShare = async () => {
                if (navigator.share) {
                    try {
                        await navigator.share({
                            title: 'Projeto Cidadão Sensor - Sarah IA ®',
                            text: 'App / Redução de riscos & Resiliência climática, automatizado',
                            url: 'https://phantrorfirmo08-alt.github.io/PROJETO-CIDAD-O-SENSOR-01/'
                        });
                    } catch (err) { console.log(err); }
                } else {
                    navigator.clipboard.writeText('https://phantrorfirmo08-alt.github.io/PROJETO-CIDAD-O-SENSOR-01/');
                    alert('Link copiado para a área de transferência!');
                }
            };

            const handleSendMessage = (e) => {
                e.preventDefault();
                if (!inputMessage.trim()) return;

                const userText = inputMessage;
                setMessages(prev => [...prev, { role: 'user', text: userText }]);
                setInputMessage('');
                setIsTyping(true);

                setTimeout(() => {
                    let reply = "Compreendido. Os sensores em Mesquita e as estações do Rio Sarapuí estão sob monitoramento contínuo.";
                    const lower = userText.toLowerCase();
                    if (lower.includes('chuva') || lower.includes('tempo')) {
                        reply = `Condição atual em Mesquita: ${weather.condition}, Temperatura de ${weather.temp}, Precipitação: ${weather.precipitation}. Nível de risco: ${weather.risk}.`;
                    } else if (lower.includes('sebinho') || lower.includes('rocha')) {
                        reply = "Setor operacional de Sebinho e Rocha Sobrinho monitorado ativamente por telemetria e Defesa Civil.";
                    } else if (lower.includes('telefone') || lower.includes('contato')) {
                        reply = "Canais oficiais de atendimento: (21) 97299-3223 | (21) 4042-1772 | (21) 2042-8931.";
                    }

                    setMessages(prev => [...prev, { role: 'assistant', text: reply }]);
                    setIsTyping(false);
                }, 1000);
            };

            return (
                <div className="flex flex-col min-h-screen bg-slate-950 text-slate-100">
                    
                    {/* Modal LGPD Inicial (Bloqueio com duas caixas obrigatórias) */}
                    {!lgpdAccepted && (
                        <div className="fixed inset-0 z-50 bg-slate-950/90 backdrop-blur-md flex items-center justify-center p-4">
                            <div className="bg-slate-900 border border-cyan-500/40 rounded-2xl p-6 max-w-lg w-full shadow-2xl shadow-cyan-500/10">
                                <h2 className="text-xl font-bold text-cyan-400 mb-2">Termos LGPD & Segurança</h2>
                                <p className="text-sm text-slate-300 mb-4">
                                    Para utilizar o ecossistema do Projeto Cidadão Sensor (Mesquita - RJ), confirme os pilares de conformidade e privacidade local:
                                </p>
                                <div className="space-y-3 mb-6 text-sm text-slate-300">
                                    <label className="flex items-start gap-3 cursor-pointer p-2 rounded-xl bg-slate-950/40 border border-slate-800">
                                        <input type="checkbox" checked={check1} onChange={(e) => setCheck1(e.target.checked)} className="mt-1 rounded border-slate-700 text-cyan-500 focus:ring-cyan-500 bg-slate-800"/>
                                        <span>Concordo com o tratamento de dados geolocalizados e operacionais para alertas preventivos da Defesa Civil.</span>
                                    </label>
                                    <label className="flex items-start gap-3 cursor-pointer p-2 rounded-xl bg-slate-950/40 border border-slate-800">
                                        <input type="checkbox" checked={check2} onChange={(e) => setCheck2(e.target.checked)} className="mt-1 rounded border-slate-700 text-cyan-500 focus:ring-cyan-500 bg-slate-800"/>
                                        <span>Aceito os protocolos de segurança digital, LGPD e diretrizes comunitárias de Mesquita.</span>
                                    </label>
                                </div>
                                <button 
                                    disabled={!check1 || !check2}
                                    onClick={() => setLgpdAccepted(true)}
                                    className={`w-full py-3 rounded-xl font-semibold transition-all duration-300 ${check1 && check2 ? 'bg-cyan-500 hover:bg-cyan-400 text-slate-950 shadow-lg shadow-cyan-500/20 cursor-pointer' : 'bg-slate-800 text-slate-500 cursor-not-allowed'}`}
                                >
                                    Desbloquear Aplicação
                                </button>
                            </div>
                        </div>
                    )}

                    {/* Header Principal com PWA Install, Partilha e Tema */}
                    <header className="border-b border-cyan-500/20 bg-slate-900/60 backdrop-blur-md sticky top-0 z-40 px-4 py-3 flex items-center justify-between">
                        <div className="flex items-center gap-3">
                            <div className="w-10 h-10 rounded-xl bg-cyan-500/10 border border-cyan-500/30 flex items-center justify-center text-cyan-400 font-bold shadow-sm shadow-cyan-500/20">
                                S
                            </div>
                            <div>
                                <h1 className="text-sm font-bold tracking-wider text-cyan-400 uppercase">SARAH IA Core</h1>
                                <p className="text-xs text-slate-400">Projeto Cidadão Sensor - Mesquita/RJ</p>
                            </div>
                        </div>

                        {/* Botões Modernizados - Zero Emojis */}
                        <div className="flex items-center gap-2">
                            {showInstallBtn && (
                                <button 
                                    onClick={handleInstallClick}
                                    className="px-3 py-1.5 rounded-xl text-xs font-medium bg-cyan-500 text-slate-950 hover:bg-cyan-400 transition-all shadow-sm shadow-cyan-500/20"
                                >
                                    Instalar
                                </button>
                            )}
                            <button 
                                onClick={handleShare}
                                className="px-3 py-1.5 rounded-xl text-xs font-medium bg-slate-800/80 hover:bg-slate-700 text-cyan-300 border border-cyan-500/30 transition-all"
                            >
                                Partilhar
                            </button>
                            <button 
                                onClick={() => setIsDarkMode(!isDarkMode)}
                                className="px-3 py-1.5 rounded-xl text-xs font-medium bg-slate-800/80 hover:bg-slate-700 text-cyan-300 border border-cyan-500/30 transition-all"
                            >
                                {isDarkMode ? 'Modo Noite' : 'Modo Dia'}
                            </button>
                        </div>
                    </header>

                    {/* Abas de Navegação (Permite saída livre do chat) */}
                    <nav className="flex border-b border-cyan-500/20 bg-slate-900/40 px-4 gap-4 overflow-x-auto">
                        {['dashboard', 'chat', 'radar', 'charts'].map((tab) => (
                            <button
                                key={tab}
                                onClick={() => setActiveTab(tab)}
                                className={`py-3 px-4 text-sm font-medium capitalize border-b-2 transition-all whitespace-nowrap ${activeTab === tab ? 'border-cyan-400 text-cyan-400' : 'border-transparent text-slate-400 hover:text-slate-200'}`}
                            >
                                {tab === 'dashboard' ? 'Painel' : tab === 'chat' ? 'Chat IA' : tab === 'radar' ? 'Radar' : 'Gráficos'}
                            </button>
                        ))}
                    </nav>

                    {/* Conteúdo Principal */}
                    <main className="flex-1 p-4 max-w-7xl w-full mx-auto">
                        
                        {/* ABA 1: PAINEL / DASHBOARD + AVATAR HUD */}
                        {activeTab === 'dashboard' && (
                            <div className="space-y-4">
                                <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                                    
                                    {/* Avatar Cibernético HUD (Texto removido de dentro do círculo) */}
                                    <div className="p-6 rounded-2xl bg-slate-900/60 border border-cyan-500/20 backdrop-blur-md flex flex-col items-center justify-center relative overflow-hidden">
                                        <div className="absolute inset-0 bg-gradient-to-b from-cyan-500/5 to-transparent pointer-events-none"></div>
                                        <div className="relative w-32 h-32 rounded-full border-2 border-cyan-500/40 flex items-center justify-center bg-slate-950/80 shadow-lg shadow-cyan-500/25 animate-pulse-slow">
                                            <div className="absolute inset-2 rounded-full border border-dashed border-cyan-400/40 animate-spin" style={{ animationDuration: '20s' }}></div>
                                            <div className="w-12 h-12 rounded-full bg-cyan-500/20 border border-cyan-400 flex items-center justify-center">
                                                <div className="w-4 h-4 rounded-full bg-cyan-400 animate-ping"></div>
                                            </div>
                                        </div>
                                        <div className="mt-4 text-center">
                                            <span className="text-xs font-mono uppercase tracking-widest text-cyan-400 font-semibold">HUD Ativo</span>
                                            <p className="text-xs text-slate-400 mt-1">Sincronizado com Mesquita / RJ</p>
                                        </div>
                                    </div>

                                    {/* Status Climático Open-Meteo */}
                                    <div className="p-6 rounded-2xl bg-slate-900/60 border border-cyan-500/20 backdrop-blur-md md:col-span-2 flex flex-col justify-between">
                                        <div>
                                            <div className="flex items-center justify-between mb-4">
                                                <h2 className="text-base font-bold text-cyan-300">Monitoramento Hidrometeorológico</h2>
                                                <span className={`px-2.5 py-1 rounded-lg text-xs font-semibold bg-${weather.color}-500/20 text-${weather.color}-300 border border-${weather.color}-500/30`}>
                                                    Risco: {weather.risk}
                                                </span>
                                            </div>
                                            <div className="grid grid-cols-2 sm:grid-cols-4 gap-3 text-sm">
                                                <div className="p-3 rounded-xl bg-slate-950/50 border border-slate-800">
                                                    <span className="text-xs text-slate-400 block">Temperatura</span>
                                                    <span className="text-lg font-bold text-cyan-400">{weather.temp}</span>
                                                </div>
                                                <div className="p-3 rounded-xl bg-slate-950/50 border border-slate-800">
                                                    <span className="text-xs text-slate-400 block">Condição</span>
                                                    <span className="text-sm font-semibold text-slate-200">{weather.condition}</span>
                                                </div>
                                                <div className="p-3 rounded-xl bg-slate-950/50 border border-slate-800">
                                                    <span className="text-xs text-slate-400 block">Humidade</span>
                                                    <span className="text-lg font-bold text-cyan-400">{weather.humidity}</span>
                                                </div>
                                                <div className="p-3 rounded-xl bg-slate-950/50 border border-slate-800">
                                                    <span className="text-xs text-slate-400 block">Precipitação</span>
                                                    <span className="text-lg font-bold text-cyan-400">{weather.precipitation}</span>
                                                </div>
                                            </div>
                                        </div>
                                        <p className="text-xs text-slate-500 mt-4">Localização: Sebinho & Rocha Sobrinho, Mesquita - RJ.</p>
                                    </div>
                                </div>
                            </div>
                        )}

                        {/* ABA 2: CHAT IA */}
                        {activeTab === 'chat' && (
                            <div className="flex flex-col h-[72vh] bg-slate-900/60 border border-cyan-500/20 rounded-2xl p-4 shadow-xl">
                                <div className="flex-1 overflow-y-auto space-y-3 p-2 text-sm pr-2">
                                    {messages.map((msg, idx) => (
                                        <div key={idx} className={`flex ${msg.role === 'user' ? 'justify-end' : 'justify-start'}`}>
                                            <div className={`p-3.5 rounded-2xl max-w-[85%] leading-relaxed ${msg.role === 'user' ? 'bg-cyan-500 text-slate-950 font-medium shadow-md shadow-cyan-500/10' : 'bg-slate-950/80 border border-cyan-500/20 text-cyan-100'}`}>
                                                {msg.text}
                                            </div>
                                        </div>
                                    ))}
                                    {isTyping && (
                                        <div className="flex justify-start">
                                            <div className="p-3 rounded-2xl bg-slate-950/80 border border-cyan-500/20 text-cyan-400 text-xs animate-pulse">
                                                SARAH IA está a processar dados...
                                            </div>
                                        </div>
                                    )}
                                    <div ref={chatEndRef} />
                                </div>
                                <form onSubmit={handleSendMessage} className="mt-3 flex gap-2 pt-2 border-t border-slate-800">
                                    <input 
                                        type="text" 
                                        value={inputMessage}
                                        onChange={(e) => setInputMessage(e.target.value)}
                                        placeholder="Escreva uma mensagem para a SARAH IA..." 
                                        className="flex-1 bg-slate-950 border border-cyan-500/30 rounded-xl px-4 py-2.5 text-sm text-slate-100 focus:outline-none focus:border-cyan-400"
                                    />
                                    <button type="submit" className="px-5 py-2.5 bg-cyan-500 hover:bg-cyan-400 text-slate-950 font-semibold rounded-xl text-sm transition-all shadow-md shadow-cyan-500/20">
                                        Enviar
                                    </button>
                                </form>
                            </div>
                        )}

                        {/* ABA 3: RADAR */}
                        {activeTab === 'radar' && (
                            <div className="p-8 rounded-2xl bg-slate-900/60 border border-cyan-500/20 text-center py-24 flex flex-col items-center justify-center">
                                <div className="w-24 h-24 rounded-full border border-cyan-500/40 flex items-center justify-center relative mb-6">
                                    <div className="absolute inset-0 rounded-full border-2 border-cyan-400 animate-ping opacity-30"></div>
                                    <div className="w-4 h-4 rounded-full bg-cyan-400"></div>
                                </div>
                                <h3 className="text-lg font-bold text-cyan-300">Radar Metereológico Integrado</h3>
                                <p className="text-xs text-slate-400 mt-2 max-w-md">Conexão estabelecida com os servidores hidrológicos da bacia do Rio Sarapuí e Open-Meteo.</p>
                            </div>
                        )}

                        {/* ABA 4: GRÁFICOS */}
                        {activeTab === 'charts' && (
                            <div className="p-8 rounded-2xl bg-slate-900/60 border border-cyan-500/20 text-center py-24 flex flex-col items-center justify-center">
                                <h3 className="text-lg font-bold text-cyan-300 mb-2">Gráficos de Tendência de Precipitação</h3>
                                <p className="text-xs text-slate-400 max-w-md mb-6">Histórico de 24 horas de monitoramento preventivo em Mesquita - RJ.</p>
                                <div className="w-full max-w-xl h-32 bg-slate-950/60 border border-slate-800 rounded-xl flex items-end justify-around p-4">
                                    {[40, 65, 30, 85, 50, 95, 45, 60].map((val, i) => (
                                        <div key={i} className="w-8 bg-cyan-500/30 hover:bg-cyan-500/60 rounded-t transition-all flex flex-col justify-end" style={{ height: `${val}%` }}>
                                            <span className="text-[10px] text-cyan-300 font-mono -top-5 relative">{val}mm</span>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        )}
                    </main>

                    {/* Rodapé Marquee Contínuo Oficial */}
                    <footer className="border-t border-cyan-500/20 bg-slate-900/90 overflow-hidden py-2.5 text-xs text-cyan-300/80 font-mono">
                        <div className="animate-marquee whitespace-nowrap">
                            <span className="mx-6">Canais Oficiais: (21) 97299-3223</span>
                            <span className="mx-6">•</span>
                            <span className="mx-6">(21) 4042-1772</span>
                            <span className="mx-6">•</span>
                            <span className="mx-6">(21) 2042-8931</span>
                            <span className="mx-6">•</span>
                            <span className="mx-6">Plano de ação Redução de Riscos Defesa Civil Comunitária Digital</span>
                            <span className="mx-6">•</span>
                            <span className="mx-6">Canais Oficiais: (21) 97299-3223</span>
                            <span className="mx-6">•</span>
                            <span className="mx-6">(21) 4042-1772</span>
                            <span className="mx-6">•</span>
                            <span className="mx-6">(21) 2042-8931</span>
                            <span className="mx-6">•</span>
                            <span className="mx-6">Plano de ação Redução de Riscos Defesa Civil Comunitária Digital</span>
                        </div>
                    </footer>
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
