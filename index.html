        function App() {
            const [darkMode, setDarkMode] = React.useState(true);
            const [soundEnabled, setSoundEnabled] = React.useState(true);
            const [isSpeaking, setIsSpeaking] = React.useState(false);
            const [isListening, setIsListening] = React.useState(false);
            const [liveWeather, setLiveWeather] = React.useState(null);
            const [hourlyForecast, setHourlyForecast] = React.useState(null);
            const [userCoords, setUserCoords] = React.useState({ lat: -22.7827, lng: -43.4073 });
            
            const [activeTab, setActiveTab] = React.useState("chat");
            
            const [shareModalOpen, setShareModalOpen] = React.useState(false);
            const [installModalOpen, setInstallModalOpen] = React.useState(false);
            const [actionPlanOpen, setActionPlanOpen] = React.useState(false);
            const [pinInput, setPinInput] = React.useState("");
            const [isPlanUnlocked, setIsPlanUnlocked] = React.useState(false);
            const [accessMode, setAccessMode] = React.useState("restricted");
            const [mediaList, setMediaList] = React.useState([]);
            const [selectedCategory, setSelectedCategory] = React.useState("Ação Social");
            const [previewMedia, setPreviewMedia] = React.useState(null);

            // Radar Animation States
            const [radarPlaying, setRadarPlaying] = React.useState(false);
            const [radarTimeLabel, setRadarTimeLabel] = React.useState("Carregando radar...");
            const [radarSliderValue, setRadarSliderValue] = React.useState(0);
            const [radarSliderMax, setRadarSliderMax] = React.useState(0);
            const [zoomWarningVisible, setZoomWarningVisible] = React.useState(false);

            const [toastMessage, setToastMessage] = React.useState(null);
            const [fontSizeScale, setFontSizeScale] = React.useState(100);
            const [deferredPrompt, setDeferredPrompt] = React.useState(null);
            
            const [termsAccepted, setTermsAccepted] = React.useState(
                () => localStorage.getItem("sarah_terms_accepted_v52") === "1"
            );
            const [check1, setCheck1] = React.useState(false);
            const [check2, setCheck2] = React.useState(false);

            const [messages, setMessages] = React.useState([]);
            const [input, setInput] = React.useState("");
            const [isLoadingChat, setIsLoadingChat] = React.useState(false);
            const [hasIntroduced, setHasIntroduced] = React.useState(
                () => localStorage.getItem("sarah_introduced_v52") === "1"
            );

            const speechIdRef = React.useRef(0);
            const voiceTimerRef = React.useRef(null);
            const voicesRef = React.useRef([]);
            const mapRef = React.useRef(null);
            const mapInstanceRef = React.useRef(null);
            const chartRef = React.useRef(null);
            const chartInstanceRef = React.useRef(null);

            // Radar Refs for animation loop
            const radarLayersRef = React.useRef([]);
            const mapFramesRef = React.useRef([]);
            const currentFrameIndexRef = React.useRef(0);
            const playIntervalRef = React.useRef(null);
            const isPlayingRef = React.useRef(false);
            const radarHostRef = React.useRef("https://tilecache.rainviewer.com");

            const showToast = (msg) => {
                setToastMessage(msg);
                setTimeout(() => setToastMessage(null), 3500);
            };

            React.useEffect(() => {
                document.documentElement.style.fontSize = `${fontSizeScale}%`;
            }, [fontSizeScale]);

            React.useEffect(() => {
                if ("geolocation" in navigator) {
                    navigator.geolocation.getCurrentPosition(
                        (position) => {
                            setUserCoords({
                                lat: position.coords.latitude,
                                lng: position.coords.longitude
                            });
                        },
                        (error) => {
                            console.warn("GPS Indisponível, usando padrão Sebinho:", error);
                        },
                        { enableHighAccuracy: true, timeout: 10000 }
                    );
                }
            }, []);

            React.useEffect(() => {
                window.addEventListener('beforeinstallprompt', (e) => {
                    e.preventDefault();
                    setDeferredPrompt(e);
                });
            }, []);

            const handleInstallApp = async () => {
                if (deferredPrompt) {
                    deferredPrompt.prompt();
                    const { outcome } = await deferredPrompt.userChoice;
                    if (outcome === 'accepted') {
                        setDeferredPrompt(null);
                        showToast("🎉 Aplicativo instalado com sucesso!");
                    }
                } else {
                    setInstallModalOpen(true);
                }
            };

            const carregarVozes = () => {
                if ("speechSynthesis" in window) {
                    voicesRef.current = window.speechSynthesis.getVoices();
                }
            };

            React.useEffect(() => {
                if (!("speechSynthesis" in window)) return;
                carregarVozes();
                window.speechSynthesis.onvoiceschanged = carregarVozes;
                return () => {
                    window.speechSynthesis.cancel();
                    window.speechSynthesis.onvoiceschanged = null;
                };
            }, []);

            const limparTextoParaFala = (text) => {
                return String(text)
                    .replace(/[#*_`~]/g, "")
                    .replace(/\[(.*?)\]\(.*?\)/g, "$1")
                    .replace(/https?:\/\/\S+/g, "")
                    .replace(/\s+/g, " ")
                    .trim();
            };

            const escolherMelhorVoz = () => {
                const voices = voicesRef.current.length
                    ? voicesRef.current
                    : window.speechSynthesis.getVoices();
                
                const preferidas = [
                    "Microsoft Francisca Online (Natural) - Portuguese (Brazil)",
                    "Microsoft Maria",
                    "Google português do Brasil",
                    "Google Português do Brasil",
                    "Luciana",
                    "Felipe"
                ];

                for (let pref of preferidas) {
                    const match = voices.find(v => v.name.toLowerCase().includes(pref.toLowerCase()));
                    if (match) return match;
                }

                return (
                    voices.find((voice) => voice.lang.toLowerCase() === "pt-br" && (voice.name.toLowerCase().includes("natural") || voice.name.toLowerCase().includes("neural"))) ||
                    voices.find((voice) => voice.lang.toLowerCase() === "pt-br") ||
                    voices.find((voice) => voice.lang.toLowerCase().startsWith("pt")) ||
                    voices[0]
                );
            };

            const stopSpeaking = () => {
                speechIdRef.current += 1;
                if (voiceTimerRef.current) {
                    clearTimeout(voiceTimerRef.current);
                    voiceTimerRef.current = null;
                }
                if ("speechSynthesis" in window) {
                    window.speechSynthesis.cancel();
                }
                setIsSpeaking(false);
            };

            const speakText = (text) => {
                if (!soundEnabled || !("speechSynthesis" in window)) return;
                const cleanText = limparTextoParaFala(text);
                if (!cleanText) return;
                stopSpeaking();
                const currentId = speechIdRef.current;
                voiceTimerRef.current = setTimeout(() => {
                    if (currentId !== speechIdRef.current) return;
                    const utterance = new SpeechSynthesisUtterance(cleanText);
                    const voice = escolherMelhorVoz();
                    utterance.lang = "pt-BR";
                    utterance.voice = voice || null;
                    utterance.rate = 0.95;
                    utterance.pitch = 1.02;
                    utterance.volume = 1;
                    utterance.onstart = () => {
                        if (currentId === speechIdRef.current) setIsSpeaking(true);
                    };
                    utterance.onend = () => {
                        if (currentId === speechIdRef.current) setIsSpeaking(false);
                    };
                    utterance.onerror = () => setIsSpeaking(false);
                    window.speechSynthesis.speak(utterance);
                }, 200);
            };

            React.useEffect(() => {
                if (!termsAccepted || hasIntroduced) return;
                const greeting = getBrasiliaGreeting();
                const presentation = `${greeting}, sou a SARAH IA Core PRO, seu núcleo inteligente de prevenção e monitoramento da Defesa Civil Comunitária Cidadão Sensor na Comunidade do Sebinho. Prevenção, não é mídia. É gente atenta. Sistemas ativados com sucesso.`;
                const timer = setTimeout(() => {
                    if (!soundEnabled) return;
                    setHasIntroduced(true);
                    localStorage.setItem("sarah_introduced_v52", "1");
                    speakText(presentation);
                }, 700);
                return () => clearTimeout(timer);
            }, [termsAccepted, hasIntroduced, soundEnabled]);

            const handleShareLink = async () => {
                if (navigator.share) {
                    try {
                        await navigator.share({
                            title: 'SARAH IA Core v5.2 PRO • Defesa Civil Comunitária',
                            text: '🛡️ Sistema inteligente de suporte e ações sociais na Comunidade do Sebinho, Mesquita - RJ.',
                            url: window.location.href,
                        });
                        return;
                    } catch (err) {
                        console.log("Compartilhamento nativo cancelado");
                    }
                }
                setShareModalOpen(true);
            };

            const compartilharWhatsApp = () => {
                const text = encodeURIComponent("🛡️ SARAH IA • Defesa Civil Comunitária Cidadão Sensor\n📍 Comunidade do Sebinho (Rua Amazonas), Mesquita - RJ\nAcesse o app oficial: " + window.location.href);
                window.open(`https://api.whatsapp.com/send?text=${text}`, '_blank');
            };

            const compartilharTelegram = () => {
                const text = encodeURIComponent("🛡️ SARAH IA • Defesa Civil Comunitária Cidadão Sensor (Comunidade do Sebinho, Mesquita RJ): " + window.location.href);
                window.open(`https://t.me/share/url?url=${encodeURIComponent(window.location.href)}&text=${text}`, '_blank');
            };

            const copiarLinkComIcone = async () => {
                const shareText = `🛡️ SARAH IA Core PRO • Defesa Civil Comunitária Cidadão Sensor\n📍 Rua Amazonas / Comunidade do Sebinho, Mesquita - RJ\n🔗 ${window.location.href}`;
                if (navigator.clipboard) {
                    await navigator.clipboard.writeText(shareText);
                    showToast("🔗 Link e escudo copiados com sucesso!");
                    setShareModalOpen(false);
                }
            };

            React.useEffect(() => {
                fetch(
                    `https://api.open-meteo.com/v1/forecast?latitude=${userCoords.lat}&longitude=${userCoords.lng}&current=temperature_2m,relative_humidity_2m,precipitation,weather_code,wind_speed_10m&hourly=temperature_2m,precipitation_probability,precipitation`
                )
                    .then((response) => response.json())
                    .then((data) => {
                        if (data && data.current) {
                            setLiveWeather(data.current);
                        }
                        if (data && data.hourly) {
                            setHourlyForecast(data.hourly);
                        }
                    })
                    .catch((error) => {
                        console.warn("Clima indisponível:", error);
                    });
            }, [userCoords]);

            React.useEffect(() => {
                document.documentElement.classList.toggle("dark", darkMode);
                document.documentElement.classList.toggle("light", !darkMode);
            }, [darkMode]);

            // Funções de Gerenciamento do Radar
            const showRadarFrame = (index) => {
                const frames = mapFramesRef.current;
                const map = mapInstanceRef.current;
                if (!map || frames.length === 0 || index < 0 || index >= frames.length) return;

                currentFrameIndexRef.current = parseInt(index);
                setRadarSliderValue(currentFrameIndexRef.current);

                radarLayersRef.current.forEach(layer => {
                    if (map.hasLayer(layer)) {
                        map.removeLayer(layer);
                    }
                });

                const currentZoom = map.getZoom();
                if (currentZoom >= 4 && currentZoom <= 7) {
                    const activeLayer = radarLayersRef.current[currentFrameIndexRef.current];
                    if (activeLayer && !map.hasLayer(activeLayer)) {
                        activeLayer.addTo(map);
                    }
                }

                const frameTime = new Date(frames[currentFrameIndexRef.current].time * 1000);
                const timeString = frameTime.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
                setRadarTimeLabel(`${timeString} (${currentFrameIndexRef.current + 1}/${frames.length})`);
            };

            const verificarZoomRadarFn = () => {
                const map = mapInstanceRef.current;
                if (!map) return;
                const zoom = map.getZoom();
                
                if (zoom < 4 || zoom > 7) {
                    setZoomWarningVisible(true);
                    radarLayersRef.current.forEach(layer => {
                        if (map.hasLayer(layer)) map.removeLayer(layer);
                    });
                } else {
                    setZoomWarningVisible(false);
                    const activeLayer = radarLayersRef.current[currentFrameIndexRef.current];
                    if (activeLayer && !map.hasLayer(activeLayer)) {
                        activeLayer.addTo(map);
                    }
                }
            };

            const prepararCamadasRadarFn = (frames, host, map) => {
                radarLayersRef.current.forEach(layer => {
                    if (map.hasLayer(layer)) map.removeLayer(layer);
                });
                radarLayersRef.current = [];

                frames.forEach((frame) => {
                    const tileUrl = `${host}${frame.path}/512/{z}/{x}/{y}/2/1_1.png`;
                    const layer = L.tileLayer(tileUrl, {
                        tileSize: 512,
                        zoomOffset: -1,
                        opacity: 0.70,
                        attribution: 'Radar &copy; <a href="https://rainviewer.com" target="_blank">RainViewer</a>',
                        zIndex: 100
                    });
                    radarLayersRef.current.push(layer);
                });
            };

            const carregarCamadaRadarCompleta = (map) => {
                fetch('https://api.rainviewer.com/public/weather-maps.json')
                    .then(response => response.json())
                    .then(data => {
                        if (!data || !data.radar || !data.radar.past) return;

                        mapFramesRef.current = data.radar.past;
                        radarHostRef.current = data.host || "https://tilecache.rainviewer.com";

                        setRadarSliderMax(mapFramesRef.current.length - 1);
                        setRadarSliderValue(mapFramesRef.current.length - 1);

                                                        Núcleo inteligente de suporte e monitoramento da Defesa Civil Comunitária Cidadão Sensor na Comunidade do Sebinho (Mesquita - RJ).
                                                    </p>
                                                </div>
                                                <div className="flex flex-wrap gap-2 justify-center pt-2">
                                                    <button onClick={() => handleSendMessage("Qual a situação atual do tempo e do rio?")} className="px-3.5 py-2 bg-slate-900 hover:bg-amber-950 border border-amberAlert/40 rounded-xl text-xs font-mono text-amber-300 transition cursor-pointer">
                                                        🌧️ Condições do Tempo
                                                    </button>
                                                    <button onClick={() => handleSendMessage("Quais os procedimentos de prevenção na Comunidade do Sebinho?")} className="px-3.5 py-2 bg-slate-900 hover:bg-amber-950 border border-amberAlert/40 rounded-xl text-xs font-mono text-amber-300 transition cursor-pointer">
                                                        🛡️ Orientações de Defesa Civil
                                                    </button>
                                                    <button onClick={() => handleSendMessage("Como acionar a Defesa Civil em caso de emergência?")} className="px-3.5 py-2 bg-slate-900 hover:bg-amber-950 border border-amberAlert/40 rounded-xl text-xs font-mono text-amber-300 transition cursor-pointer">
                                                        🚨 Emergência (199)

                                                <div className={`max-w-[82%] sm:max-w-[70%] rounded-2xl p-4 text-xs sm:text-sm leading-relaxed shadow-lg ${
                                                    msg.sender === 'user'

                                                        : 'bg-slate-900/95 text-slate-100 border border-amberAlert/40 rounded-tl-none font-sans'

                                                    <div className="whitespace-pre-wrap">{msg.text}</div>

                                                </div>
                                            </div>

                                    <div className="bg-slate-950 p-3 sm:p-4 border-t border-amberAlert/30 flex items-center gap-2">
                                        <button
                                            onClick={toggleListening}
                                            className={`w-12 h-12 rounded-2xl border flex items-center justify-center transition shrink-0 cursor-pointer ${

                                            className="flex-1 bg-slate-900 border border-amberAlert/40 rounded-2xl px-4 py-3 text-xs sm:text-sm text-slate-100 placeholder-slate-500 focus:outline-none focus:border-amberAlert focus:ring-1 focus:ring-amberAlert font-sans"
                                        />
                                        <button
                                            onClick={() => handleSendMessage()}

                                            className="px-5 py-3 rounded-2xl bg-gradient-to-r from-amberAlert to-orange-500 hover:from-amber-400 hover:to-orange-400 text-slate-950 font-mono text-xs font-bold transition disabled:opacity-40 disabled:cursor-not-allowed shadow-[0_0_15px_rgba(255,183,77,0.4)] cursor-pointer shrink-0"

                                    </div>
                                </div>
                            )}

                            {activeTab === "radar" && (
                                <div className="glass-dark rounded-3xl shadow-[0_0_40px_rgba(0,0,0,0.6)] flex flex-col overflow-hidden flex-1 border border-amberAlert/40 p-4 space-y-4" style={{ minHeight: "520px" }}>
                                    <div className="flex flex-col sm:flex-row items-start sm:items-center justify-between gap-3 bg-slate-950/90 p-4 rounded-2xl border border-amberAlert/30">
                                        <div>
                                            <h3 className="font-mono text-amberAlert text-sm font-bold flex items-center gap-2">
                                                <span>🛰️</span> Radar Meteorológico & Mapa Sebinho (RainViewer)
                                            </h3>

                                        <div className="flex items-center gap-2 w-full sm:w-auto">
                                            <button
                                                onClick={toggleRadarAnimation}
                                                className="px-4 py-2 rounded-xl bg-amberAlert text-slate-950 font-mono text-xs font-bold shadow-[0_0_15px_rgba(255,183,77,0.5)] hover:bg-amber-400 transition cursor-pointer flex-1 sm:flex-none text-center"

                                        </div>
                                    </div>

                                        <div className="bg-amber-950/90 border border-amberAlert text-amber-200 px-4 py-2.5 rounded-xl font-mono text-xs text-center shadow-md animate-pulse">

                                            type="range"
                                            min="0"

                                        />
                                        <span className="font-mono text-xs text-slate-300 whitespace-nowrap">{radarTimeLabel}</span>
                                    </div>
                                </div>
                            )}

                                        <div>
                                            <h3 className="font-mono text-amberAlert text-sm font-bold flex items-center gap-2">
                                                <span>📈</span> Telemetria Térmica & Pluviométrica • Sebinho
                                            </h3>

                                        <div className="bg-slate-950 px-6 py-4 border-b border-amberAlert/30 flex items-center justify-between">
                                            <h3 className="font-mono text-amberAlert text-sm font-bold flex items-center gap-2">
                                                <span>🎬</span> Painel de Produções e Registros • Comunidade do Sebinho

                                                        <input

                                                    </div>

                                                                            <span>{item.date}</span>

                                                                        <div className="flex items-center gap-2 pt-1">
                                                                            <button onClick={() => setPreviewMedia(item)} className="flex-1 py-1.5 bg-amberAlert text-slate-950 font-mono text-[11px] font-bold rounded-xl hover:bg-amber-400 transition cursor-pointer text-center">
                                                                                ▶️ Reproduzir
                                                                            </button>
                                                                            <button onClick={() => removeMediaItem(item.id)} className="px-3 py-1.5 bg-red-950/80 hover:bg-red-900 text-red-300 font-mono text-[11px] font-bold rounded-xl border border-red-800 transition cursor-pointer">
                                                                                🗑️
                                                                            </button>
                                                                        </div>
                                                                    </div>
                                                                ))}
                                                            </div>
                                                        )}
                                                    </div>
                                                </div>
                                            )}
                                        </div>
                                    </div>
                                </div>
                            )}

                                        <div className="bg-slate-950 px-6 py-4 border-b border-amberAlert/30 flex items-center justify-between">
                                            <h3 className="font-mono text-amberAlert text-sm font-bold flex items-center gap-2">
                                                <span>🔗</span> Compartilhar SARAH IA PRO
                                            </h3>
                                            <button onClick={() => setShareModalOpen(false)} className="text-amberAlert hover:text-white font-mono text-xs font-bold bg-amber-950 px-3 py-1 rounded-xl border border-amberAlert/30 cursor-pointer">
                                                ✕
                                            </button>
                                        </div>
                                        <div className="p-6 space-y-4 text-xs font-sans text-slate-300">
                                            <p className="font-mono text-slate-200">
                                                Compartilhe o sistema de Defesa Civil Comunitária Cidadão Sensor com vizinhos e lideranças do Sebinho:
                                            </p>
                                            <div className="grid grid-cols-1 gap-2.5">
                                                <button onClick={copiarLinkComIcone} className="w-full py-3 bg-amberAlert text-slate-950 font-mono text-xs font-bold rounded-xl hover:bg-amber-400 transition flex items-center justify-center gap-2 cursor-pointer shadow-md">
                                                    <span>📋</span> Copiar Link e Escudo
                                                </button>
                                                <button onClick={compartilharWhatsApp} className="w-full py-3 bg-emerald-600 hover:bg-emerald-500 text-white font-mono text-xs font-bold rounded-xl transition flex items-center justify-center gap-2 cursor-pointer shadow-md">
                                                    <span>💬</span> Compartilhar no WhatsApp
                                                </button>
                                                <button onClick={compartilharTelegram} className="w-full py-3 bg-sky-600 hover:bg-sky-500 text-white font-mono text-xs font-bold rounded-xl transition flex items-center justify-center gap-2 cursor-pointer shadow-md">
                                                    <span>✈️</span> Compartilhar no Telegram
                                                </button>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            )}

                            {/* Modal Instalar App */}
                            {installModalOpen && (
                                <div className="fixed inset-0 bg-slate-950/92 backdrop-blur-2xl z-50 flex items-center justify-center p-4">
                                    <div className="glass-dark w-full max-w-md rounded-3xl shadow-[0_0_60px_rgba(255,183,77,0.3)] overflow-hidden flex flex-col border border-amberAlert/40">
                                        <div className="bg-slate-950 px-6 py-4 border-b border-amberAlert/30 flex items-center justify-between">
                                            <h3 className="font-mono text-amberAlert text-sm font-bold flex items-center gap-2">
                                                <span>📱</span> Instalar Aplicativo (PWA)
                                            </h3>
                                            <button onClick={() => setInstallModalOpen(false)} className="text-amberAlert hover:text-white font-mono text-xs font-bold bg-amber-950 px-3 py-1 rounded-xl border border-amberAlert/30 cursor-pointer">
                                                ✕
                                            </button>
                                        </div>
                                        <div className="p-6 space-y-4 text-xs font-sans text-slate-300">
                                            <p className="font-mono text-slate-200">
                                                Para instalar o app <strong>SARAH IA Core PRO</strong> no seu dispositivo:
                                            </p>
                                            <div className="space-y-2 bg-slate-950/90 p-4 rounded-2xl border border-amberAlert/30 font-mono text-[11px]">
                                                <div><strong>No Android (Chrome):</strong> Toque no menu (três pontos) e selecione <em>"Adicionar à tela inicial"</em> ou <em>"Instalar aplicativo"</em>.</div>
                                                <div className="pt-2 border-t border-slate-800"><strong>No iPhone (Safari):</strong> Toque no botão de compartilhamento e selecione <em>"Adicionar à Tela de Início"</em>.</div>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            )}

                        </main>

                        <footer className={`${darkMode ? 'glass-dark border-amberAlert/30' : 'glass-light border-amberAlert/40'} border-t px-4 py-3 text-center text-xs font-mono transition-colors duration-300 mt-auto`}>
                            <div className="max-w-5xl mx-auto flex flex-col sm:flex-row items-center justify-between gap-2 text-amberAlert/80">
                                <span>🛡️ SARAH IA Core v5.2 PRO • Defesa Civil Comunitária Cidadão Sensor</span>
                                <span className="text-slate-400">Comunidade do Sebinho (Rua Amazonas) • Mesquita - RJ</span>
                            </div>
                        </footer>

                    </div>
                </div>
            );
        }

        ReactDOM.render(<App />, document.getElementById("root"));
    </script>
</body>
</html>
