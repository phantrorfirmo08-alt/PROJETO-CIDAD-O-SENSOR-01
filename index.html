async function chamarSarah(tipo, mensagensHistorico, municipioAtual, bairroAtual, abaAtual, dadosClimaContexto, userName = "Alexander") {
  const horaBrasilia = Number(new Intl.DateTimeFormat('pt-BR', {

    hour: 'numeric',
    hour12: false
  }).format(new Date()));

  const saudacaoCerta = horaBrasilia < 12 ? "Bom dia" : horaBrasilia < 18 ? "Boa tarde" : "Boa noite";
  const horaFormatada = new Intl.DateTimeFormat('pt-BR', {
    timeZone: 'America/Sao_Paulo',
    hour: '2-digit',
    minute: '2-digit'
  }).format(new Date());

  const modo = (tipo || 'conversa').toLowerCase();
  const nomeOperador = userName && userName.trim() ? userName.trim() : "Alexander";

  const instrucaoSaudacaoUnica = globalSaudacaoEmitida 
    ? "ATENÇÃO ABSOLUTA: A saudação temporal já foi feita no início. NUNCA inicie frases com 'Bom dia', 'Boa tarde' ou 'Boa noite'. Responda direto ao assunto de forma fluida."
    : `ATENÇÃO ABSOLUTA: Utilize a saudação '${saudacaoCerta}' apenas UMA vez no início desta conversa. Nos diálogos seguintes, nunca repita saudações.`;

  const baseSarah = montarPersonalidadeSarah() + `
[CONTEXTO TÁTICO ATUAL]
Operador: ${nomeOperador}
Município: ${municipioAtual || 'Mesquita'}

  let promptFinal = baseSarah;

  let maxTokens = 400;

      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        model: "openai/gpt-oss-120b",

        temperature: temp,
        max_tokens: maxTokens
      })
    });
    const data = await response.json();
    if (!data.error) {
      const msg = data?.choices?.[0]?.message;
      let texto = msg?.content || msg?.reasoning_content;
      if (texto && texto.trim().length > 0) {
        globalSaudacaoEmitida = true;
        texto = texto.replace(/[*#]/g, '').replace(/cerquilha/gi, '').replace(/asterisco/gi, '');

  try {

  globalSaudacaoEmitida = true;
  return `Calma, ${nomeOperador}, tô contigo aqui na escuta. Vamo resolver isso junto agora.`;

function falarSarah(texto, vozIndex = 0) {
  try {
    const mudoGlobal = localStorage.getItem("raru_sound_enabled");
    if (mudoGlobal === "false") return;
  } catch(e) {}

  if (!("speechSynthesis" in window)) return;
  try {
    window.speechSynthesis.cancel();
    const cleanText = String(texto)
      .replace(/[*#]/g, '')
      .replace(/cerquilha/gi, '')
      .replace(/asterisco/gi, '')
      .replace(/([\u2700-\u27BF]|[\uE000-\uF8FF]|\uD83C[\uDC00-\uDFFF]|\uD83D[\uDC00-\uDFFF]|[\u2011-\u26FF]|\uD83E[\uDD00-\uDDFF])/g, '')
      .replace(/https?:\/\/\S+/g, "")
      .trim();
    if (!cleanText) return;
    const utterance = new SpeechSynthesisUtterance(cleanText);
    utterance.lang = "pt-BR";
    const voices = window.speechSynthesis.getVoices();
    const ptVoices = voices.filter(v => v.lang.toLowerCase().includes('pt'));
    const targetVoice = ptVoices[vozIndex] || ptVoices[0] || voices[0];
    if (targetVoice) utterance.voice = targetVoice;
    utterance.pitch = 1.05;
    utterance.rate = 1.15;
    window.speechSynthesis.speak(utterance);
  } catch(e) {}
}

async function gerarArquivoIconeEscudo() {
  return new Promise((resolve) => {
    const canvas = document.createElement('canvas');
    canvas.width = 512;
    canvas.height = 512;
    const ctx = canvas.getContext('2d');

    const bgGrad = ctx.createRadialGradient(256, 256, 30, 256, 256, 320);
    bgGrad.addColorStop(0, '#0A2547');
    bgGrad.addColorStop(0.6, '#041125');
    bgGrad.addColorStop(1, '#02040A');
    ctx.fillStyle = bgGrad;
    ctx.fillRect(0, 0, 512, 512);

    ctx.strokeStyle = 'rgba(0, 242, 254, 0.07)';
    ctx.lineWidth = 1;
    for (let i = 0; i < 512; i += 32) {
      ctx.beginPath(); ctx.moveTo(i, 0); ctx.lineTo(i, 512); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(0, i); ctx.lineTo(512, i); ctx.stroke();
    }

    ctx.save();
    ctx.beginPath();
    ctx.arc(256, 245, 200, 0, Math.PI * 2);
    ctx.strokeStyle = 'rgba(56, 189, 248, 0.35)';
    ctx.lineWidth = 3;
    ctx.setLineDash([12, 10]);
    ctx.stroke();
    ctx.restore();

    ctx.save();
    ctx.shadowColor = '#00F2FE';
    ctx.shadowBlur = 25;
    ctx.beginPath();
    ctx.moveTo(256, 65);
    ctx.lineTo(410, 130);
    ctx.lineTo(410, 265);
    ctx.quadraticCurveTo(410, 385, 256, 435);
    ctx.quadraticCurveTo(102, 385, 102, 265);
    ctx.lineTo(102, 130);
    ctx.closePath();

    const shieldFill = ctx.createLinearGradient(102, 65, 410, 435);
    shieldFill.addColorStop(0, 'rgba(0, 242, 254, 0.18)');
    shieldFill.addColorStop(1, 'rgba(4, 17, 37, 0.92)');
    ctx.fillStyle = shieldFill;
    ctx.fill();

    ctx.lineWidth = 6;
    ctx.strokeStyle = '#00F2FE';
    ctx.stroke();
    ctx.restore();

    ctx.beginPath();
    ctx.arc(256, 245, 92, 0, Math.PI * 2);
    ctx.strokeStyle = '#00FF9D';
    ctx.lineWidth = 3;
    ctx.stroke();

    const coreGrad = ctx.createRadialGradient(256, 245, 5, 256, 245, 65);
    coreGrad.addColorStop(0, '#00F2FE');
    coreGrad.addColorStop(1, '#041125');
    ctx.beginPath();
    ctx.arc(256, 245, 65, 0, Math.PI * 2);
    ctx.fillStyle = coreGrad;
    ctx.fill();

    ctx.fillStyle = '#FFFFFF';
    ctx.font = '900 34px Orbitron, sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('CLIMA', 256, 242);

    ctx.fillStyle = '#00FF9D';
    ctx.font = '800 20px JetBrains Mono, monospace';
    ctx.fillText('& DADOS PÚBLICOS', 256, 272);

    ctx.fillStyle = '#38BDF8';
    ctx.font = '700 15px JetBrains Mono, monospace';
    ctx.fillText('CIDADÃO SENSOR • MESQUITA RJ', 256, 480);

    canvas.toBlob((blob) => {
      if (blob) {
        resolve(new File([blob], 'BASE_CLIMATICA_TATICA.png', { type: 'image/png' }));
      } else {
        resolve(null);
      }
    }, 'image/png');
  });
}

function PainelRotasEstacaoPublica() {
    const [rotas, setRotas] = React.useState([]);

    React.useEffect(() => {
        const carregarRotas = () => {
            try {
                const r = JSON.parse(localStorage.getItem('rotasFugaReais') || '[]');
                setRotas(r);
            } catch(e) { setRotas([]); }
        };
        carregarRotas();
        window.addEventListener('storage', carregarRotas);
        const interval = setInterval(carregarRotas, 2500);
        return () => {
            window.removeEventListener('storage', carregarRotas);
            clearInterval(interval);
        };
    }, []);

    return (

  const audioRef = useRef(null);

  const radios = [
    { nome: 'Rádio Melodia RJ', freq: '97.5 FM', url: 'https://ice.fabricahost.com.br/melodiaria' },
    { nome: 'Rádio Tupi RJ', freq: '96.5 FM', url: 'https://stream.zeno.fm/f3nnf759wqzuv' },
    { nome: 'CBN Rio', freq: '92.5 FM', url: 'https://playerservices.streamtheworld.com/api/livestream-redirect/CBN_RJ_SC' },
    { nome: 'Rádio Globo RJ', freq: '98.1 FM', url: 'https://playerservices.streamtheworld.com/api/livestream-redirect/RADIO_GLOBOMAR_SC' }
  ];

  const alternarRadio = (rad) => {
    if (estacaoSel === rad.nome && isPlaying) {
      if (audioRef.current) { audioRef.current.pause(); audioRef.current = null; }
      setIsPlaying(false);
      showToast('Rádio pausada.');
    } else {
      if (audioRef.current) { audioRef.current.pause(); }
      const a = new Audio(rad.url);
      a.crossOrigin = "anonymous";
      a.play().then(() => {
        audioRef.current = a;
        setEstacaoSel(rad.nome);
        setIsPlaying(true);
        showToast(`Conectado a ${rad.nome}`);
      }).catch(() => {
        showToast('Falha na transmissão ao vivo da rádio.');
        setIsPlaying(false);
      });
    }
  };

  useEffect(() => {
    return () => { if (audioRef.current) audioRef.current.pause(); };
  }, []);

  return (
    <div className="space-y-4 max-w-4xl mx-auto font-mono">
      <div className="cyber-card p-5 rounded-2xl shadow-xl space-y-4 border border-cyberCyan/50">

  const [camOn, setCamOn] = React.useState(false);
  const [zoomLevel, setZoomLevel] = React.useState(1);
  const [maxZoom, setMaxZoom] = React.useState(3);
  const [hasZoomSupport, setHasZoomSupport] = React.useState(false);
  const [nome, setNome] = React.useState(userName || '');
  const [bairro, setBairro] = React.useState('');
  const [rel, setRel] = React.useState('');
  const [gps, setGps] = React.useState({lat:0, lon:0, acc:''});
  const [frenteSelecionada, setFrenteSelecionada] = React.useState(FRENTES_EQUIPES_TABELA[5]);
  const [risco, setRisco] = React.useState("R2 - MODERADO / ALERTA");

  const videoRef = React.useRef(null);
  const streamRef = React.useRef(null);
  const trackRef = React.useRef(null);

  const startCam = async () => {
    try {
      const s = await navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: "environment" } } });
      streamRef.current = s; 
      const track = s.getVideoTracks()[0];
      trackRef.current = track;
      setCamOn(true);
      setTimeout(() => { if(videoRef.current){ videoRef.current.srcObject = s; videoRef.current.play().catch(() => {}); } }, 100);
    } catch { showToast('Câmera bloqueada.'); }
  };

  const stopCam = () => { if(streamRef.current) streamRef.current.getTracks().forEach(t => t.stop()); setCamOn(false); };

  const capturarFotoFinal = () => {
    const v = videoRef.current; if(!v) return null;
    const canvas = document.createElement('canvas');
    canvas.width = 800; canvas.height = 600;
    const ctx = canvas.getContext('2d');
    ctx.drawImage(v, 0, 0, canvas.width, canvas.height);
    const base64Final = canvas.toDataURL('image/jpeg', 0.85);
    setFotos([base64Final]);
    showToast('Foto capturada.');
  };

  return (
    <div className="w-full space-y-3.5 font-mono max-w-4xl mx-auto">
      <div className="p-4 rounded-2xl border border-cyberCyan/40 space-y-3 bg-[#030712] shadow-2xl cyber-card">

          <button onClick={onBackToDashboard} className="cyber-button-danger text-[10px] py-1 px-3">FECHAR</button>
        </div>
        <button onClick={camOn ? stopCam : startCam} className="cyber-button w-full text-xs py-3">
          {camOn ? 'DESLIGAR CÂMERA' : 'LIGAR CÂMERA'}
        </button>
        <div className="bg-black rounded-xl overflow-hidden border border-cyberCyan/30 relative" style={{ minHeight: '180px' }}>
          <video ref={videoRef} autoPlay playsInline muted style={{ width: '100%', height: '180px', objectFit: 'cover', display: camOn ? 'block' : 'none' }} />
          {!camOn && <div className="h-[180px] grid place-items-center text-slate-500 text-xs">Câmera desligada</div>}

        {camOn && <button onClick={capturarFotoFinal} className="cyber-button-solid w-full text-xs py-3">CAPTURAR FOTO</button>}

  const [isCommandHUDActive, setIsCommandHUDActive] = React.useState(false);
  const [shareModalOpen, setShareModalOpen] = React.useState(false);
  const [toastMsgRef, setToastMsgRef] = React.useState(null);

  // Termo de responsabilidade obrigatório na abertura inicial
  const [termsAccepted, setTermsAccepted] = React.useState(() => { try { return localStorage.getItem("raru_cyber_terms") === "1"; } catch(e) { return false; } });
  const [check1, setCheck1] = React.useState(false);
  const [check2, setCheck2] = React.useState(false);

  const [userName, setUserName] = React.useState(() => { try { return localStorage.getItem("raru_user_name") || "Alexander"; } catch(e) { return "Alexander"; } });
  const [nameModalOpen, setNameModalOpen] = React.useState(false);
  const [tempNameInput, setTempNameInput] = React.useState("");

  const [isChatOpen, setIsChatOpen] = React.useState(false);
  const [input, setInput] = React.useState("");
  const [isProcessing, setIsProcessing] = React.useState(false);

  const [vozSelecionada, setVozSelecionada] = React.useState(0);
  const [customTickerText, setCustomTickerText] = React.useState(() => { try { return localStorage.getItem('raru_custom_ticker') || ""; } catch(e) { return ""; } });

  const showToast = (msg) => { setToastMsgRef(msg); setTimeout(() => setToastMsgRef(null), 3500); };

  const handleSaveName = (e) => {
    e.preventDefault();
    if (!tempNameInput.trim()) return;
    const nomeLimpo = tempNameInput.trim();
    setUserName(nomeLimpo);
    try { localStorage.setItem("raru_user_name", nomeLimpo); } catch(e) {}
    setNameModalOpen(false);
    setTempNameInput("");
    showToast(`Operador ${nomeLimpo} registrado!`);
  };

  const toggleCommandHUD = () => {
    const elem = document.documentElement;
    if (!isCommandHUDActive) {
      try { if (elem.requestFullscreen) elem.requestFullscreen(); } catch (err) {}
      setIsCommandHUDActive(true);
      showToast("HUD TELA CHEIA ATIVO.");
    } else {
      try { if (document.exitFullscreen) document.exitFullscreen(); } catch (err) {}
      setIsCommandHUDActive(false);
      showToast("Modo Padrão.");
    }
  };

  const openShareFromApp = async () => {
    const iconeArquivo = await gerarArquivoIconeEscudo();
    if (navigator.share) {
      try {
        await navigator.share({ title: "Base Climática", text: shareMessageText, url: APP_SHARE_URL });
        return;
      } catch (err) {}
    }
    setShareModalOpen(true);
  };

  // Acionamento ultra avançado do microfone (apertou, já inicia a escuta)
  const toggleListening = () => {
    const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SpeechRec) { showToast("Microfone indisponível neste navegador."); return; }
    if (isListening) { setIsListening(false); return; }
    try {
      const rec = new SpeechRec();
      rec.lang = "pt-BR";
      rec.onstart = () => { setIsListening(true); showToast("Microfone ativo. Ouvindo..."); };
      rec.onresult = (event) => { 
        let final = event.results[0][0].transcript; 
        if (final) { 
          setInput(final); 
          setIsListening(false); 
          handleSendDirectCommand(final); 
        } 
      };
      rec.onerror = () => setIsListening(false);
      rec.onend = () => setIsListening(false);
      rec.start();
    } catch (e) { setIsListening(false); }
  };

  const [messages, setMessages] = React.useState([
    {
      sender: 'assistant',
      text: `Calma, tô contigo! Sou a Sarah, sua assistente tática. Vamo operar junto em Mesquita e na Baixada.`,
      time: new Date().toLocaleTimeString('pt-BR', {hour: '2-digit', minute:'2-digit'})
    }
  ]);

  const handleSendDirectCommand = async (textCustom) => {
    const textToSend = textCustom !== undefined ? textCustom : input;
    if (!textToSend.trim() || isProcessing) return;
    const timeStr = new Date().toLocaleTimeString('pt-BR', {hour: '2-digit', minute:'2-digit'});

    const novoHistorico = [...messages, { sender: 'user', text: textToSend, time: timeStr }];
    setMessages(novoHistorico);
    setInput("");
    setIsProcessing(true);
    setIsSpeaking(true);

    try {
      const formattedHistory = novoHistorico.map(m => ({
        role: m.sender === 'user' ? 'user' : 'assistant',
        content: m.text

              <label className="flex items-start gap-3 cursor-pointer text-xs text-slate-200 bg-commandPanel/80 p-3 rounded-xl border border-cyberCyan/30">
                <input type="checkbox" checked={check2} onChange={(e) => setCheck2(e.target.checked)} className="mt-0.5 rounded text-cyberCyan w-4 h-4 bg-void cursor-pointer shrink-0" />
                <span>Compreendo a diretriz técnica de uso preventivo e autônomo das ferramentas de campo.</span>
              </label>
            </div>
            <button disabled={!check1 || !check2} onClick={() => { setTermsAccepted(true); try { localStorage.setItem("raru_cyber_terms", "1"); } catch(e) {} }} className={`cyber-button-solid w-full text-xs py-4 ${check1 && check2 ? '' : 'opacity-50 cursor-not-allowed'}`}>
              ACEITAR E INICIAR APLICATIVO
            </button>
          </div>
        </div>
      )}

      <header className="cyber-card sticky top-0 z-30 w-full px-4 py-3 border-b border-cyberCyan/40 flex items-center justify-between shadow-lg rounded-2xl mb-2">
        <div className="flex items-center gap-2.5 cursor-pointer" onClick={openSarahChat}>
          <div className="w-8 h-8 overflow-hidden rounded-full border border-cyberCyan shrink-0">
            <SarahLiveSVGAvatar isSpeaking={isSpeaking}/>
          </div>
          <div>
            <h1 className="font-display text-xs sm:text-sm font-black text-white leading-none">Base Climática de Monitoramento Tático</h1>
            <p className="text-[8px] text-cyberCyan font-mono mt-0.5">Operador: {userName || 'Alexander'} • Mesquita - RJ</p>
          </div>
        </div>
        <div className="flex items-center gap-2">
          <button onClick={toggleCommandHUD} className={`cyber-button text-[9px] py-2 px-3 ${isCommandHUDActive ? '!bg-cyberRose !text-void' : ''}`}>TELA CHEIA</button>
          <button onClick={() => { const n = !soundEnabled; setSoundEnabled(n); showToast(n ? "Áudio ON" : "Mudo"); }} className="cyber-button text-[9px] py-2 px-3">
            {soundEnabled ? 'SOM ON' : 'MUDO'}
          </button>
        </div>
      </header>

      <main className="flex-1 w-full mx-auto py-2 space-y-4 pb-28 relative z-10">
        {activeTab === 'dashboard' && (
          <CardIdentidadeVisualRARU
            handleWhoAmIClick={() => setQuemSomosOpen(true)}
            openSarahChat={openSarahChat}
            openShareFromApp={openShareFromApp}
            setActiveTab={setActiveTab}
            toggleCommandHUD={toggleCommandHUD}
            userName={userName}
            onOpenNameModal={() => { setTempNameInput(userName); setNameModalOpen(true); }}
          />
        )}
        {activeTab === 'radar' && <RadarMeteorologicoModule showToast={showToast}/>}
        {activeTab === 'estacao' && <EstacaoSobrevivenciaModuleV12 showToast={showToast} userName={userName}/>}
        {activeTab === 'balanca' && <ModuloCidadaoSensorModule onGoToDashboard={() => setActiveTab('dashboard')} showToast={showToast} />}
        {activeTab === 'radio' && <ModuloRadioComunitariaModule showToast={showToast} />}
        {activeTab === 'relatorio' && <VistoriaRARU_NEXUS onBackToDashboard={() => setActiveTab('dashboard')} showToast={showToast} userName={userName} />}
        {activeTab === 'galeria' && <PublicVideoGalleryModule onGoToDashboard={() => setActiveTab('dashboard')} />}
        {activeTab === 'admin' && <AdminVaultModule onClose={() => setActiveTab('dashboard')} showToast={showToast} vozSelecionada={vozSelecionada} setVozSelecionada={setVozSelecionada} customTickerText={customTickerText} setCustomTickerText={setCustomTickerText} />}

        <AutomatedObservatoryWidget customTickerText={customTickerText}/>
      </main>

      {termsAccepted && <SarahFabButton isSpeaking={isSpeaking} openSarahChat={openSarahChat}/>}
      <SarahChatOverlay
        isOpen={isChatOpen}
        onClose={() => setIsChatOpen(false)}
        isSpeaking={isSpeaking}
        isProcessing={isProcessing}
        messages={messages}
        input={input}
        setInput={setInput}
        handleSendDirectCommand={handleSendDirectCommand}
        toggleListening={toggleListening}
        isListening={isListening}
        userName={userName}
        onOpenNameModal={() => { setTempNameInput(userName); setNameModalOpen(true); }}
      />
      <QuemSomosModal isOpen={quemSomosOpen} onClose={() => setQuemSomosOpen(false)} userName={userName} />

      <footer className="cyber-card fixed bottom-0 left-0 right-0 z-40 border-t border-cyberCyan/40 px-2.5 py-3 flex items-center justify-between gap-1 shadow-2xl backdrop-blur-xl max-w-[1400px] mx-auto rounded-t-2xl pb-[env(safe-area-inset-bottom)]">
        {NAV_TABS.map(tab => (
          <button key={tab.id} onClick={() => handleNavClick(tab.id)} className={`flex flex-col items-center justify-center gap-0.5 cursor-pointer flex-1 py-1.5 transition touch-manipulation rounded-xl ${activeTab === tab.id ? 'text-cyberCyan bg-cyberCyan/15 border border-cyberCyan/40' : 'text-slate-400 hover:text-white border border-transparent'}`}>
            {tab.iconComponent}
            <span className="text-[7px] sm:text-[9px] font-black truncate w-full text-center tracking-tighter px-0.5">{tab.label}</span>
          </button>
        ))}
      </footer>
    </div>
  );
}

try {
  const rootElement = document.getElementById('root');
  ReactDOM.createRoot(rootElement).render(<App/>);
} catch (err) {
  document.getElementById('root').innerHTML = `<div style="padding:20px;color:#FF0055;font-family:monospace;">Erro: ${err.message}</div>`;
}
</script>
</body>
</html>
