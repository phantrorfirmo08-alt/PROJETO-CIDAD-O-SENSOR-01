<style>
:root{--bg:#0f172a;--panel:#1e293b;--gold:#f59e0b;--cyan:#00f2fe;--green:#10b981;--red:#ef4444}
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui,-apple-system,sans-serif}
body{background:var(--bg);color:#f8fafc;display:flex;flex-direction:column;height:100vh;overflow:hidden}

/* Topo Limpo e Profissional */
.top{background:linear-gradient(135deg,#0f172a,#1e293b);padding:10px 14px;border-bottom:2px solid var(--gold);display:flex;justify-content:space-between;align-items:center;flex-shrink:0}
.top-title{font-size:11px;font-weight:900;color:var(--gold);letter-spacing:0.05em}
.top-sub{font-size:9px;color:#94a3b8}

/* Área Principal: Mapa Ocupando o Foco + Painel Deslizante/Lateral */
.app{display:flex;flex:1;position:relative;overflow:hidden}
#map{width:100%;height:100%;position:absolute;inset:0;z-index:1}

/* Gaveta de Controles Flutuante (Sobreposta ao Mapa de forma limpa) */
.floating-panel{position:absolute;top:10px;left:10px;bottom:10px;width:340px;max-width:90vw;background:rgba(30,41,59,0.92);backdrop-filter:blur(10px);border:1px solid rgba(0,242,254,0.3);border-radius:16px;z-index:10;display:flex;flex-direction:column;gap:8px;padding:10px;overflow-y:auto;box-shadow:0 10px 30px rgba(0,0,0,0.5)}

.card{background:rgba(15,23,42,0.7);padding:8px;border-radius:10px;border-left:3px solid var(--gold)}
.card.verificado{border-left-color:var(--green)}
.card.cemaden{border-left-color:#38bdf8}

button{padding:8px;border-radius:8px;border:1px solid #334155;background:#0f172a;color:white;font-weight:700;cursor:pointer;font-size:10px;transition:all 0.2s}
button:hover{border-color:var(--cyan)}
.btn-gold{background:var(--gold);color:#0f172a;border:none}
.btn-green{background:var(--green);color:#0f172a;border:none}
.btn-whats{background:#25D366;color:#0f172a;border:none}

select, input, textarea{width:100%;padding:6px 8px;border-radius:6px;background:#0f172a;color:white;border:1px solid #334155;font-size:10px;margin-top:4px}
@keyframes pisca{0%,100%{opacity:1}50%{opacity:.4}} .piscando{animation:pisca 1s infinite}
</style>
</head>

        <button id="btnAdmin" style="flex:1;border-color:var(--gold);color:var(--gold)">Admin</button>

<div id="modalLider" style="position:fixed;inset:0;background:rgba(0,0,0,.8);display:none;align-items:center;justify-content:center;z-index:9999">

function renderPendentes(){
  var h = '';
  for(var i=0; i<lideres.length; i++){
    var l = lideres[i];
    var cor = l.status == 'verificado' ? '#10b981' : 'var(--gold)';
    var btn = l.status == 'pendente' ? '<button onclick="aprovar(' + l.id + ')" style="margin-top:5px;background:var(--green);color:#0f172a;border:none;padding:4px;font-size:9px;width:100%">✅ Aprovar VERIFICADO</button>' : '';
    h += '<div style="background:#0f172a;padding:7px;border-radius:6px;margin-bottom:5px;border-left:3px solid ' + cor + '"><div style="display:flex;justify-content:space-between"><b style="font-size:11px">' + l.nome + '</b><span style="background:' + cor + ';color:#0f172a;padding:1px 5px;border-radius:8px;font-size:8px">' + l.status.toUpperCase() + '</span></div><div style="font-size:9px;color:#94a3b8">' + l.bairro + ' • ' + (l.motivo || '') + '</div>' + btn + '</div>';
  }
  document.getElementById('listaAdmin').innerHTML = h;
}

window.aprovar = function(id){
  for(var i=0; i<lideres.length; i++){
    if(lideres[i].id == id){
      lideres[i].status = 'verificado';
      usuario = lideres[i];
      renderPendentes();
      document.getElementById('btnNovo').style.display = 'block';
      alert(lideres[i].nome + ' agora é VERIFICADO! Pode publicar prova oficial.');
    }
  }
};
