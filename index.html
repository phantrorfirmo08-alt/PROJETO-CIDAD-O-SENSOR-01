const RISCOS = ["R1 - BAIXO / PREVENTIVO", "R2 - MODERADO / ATENCAO", "R3 - ALTO / ALERTA", "R4 - IMINENTE / EVACUACAO", "RH - HIDROLOGICO", "RE - ESTRUTURAL"];

function App() {
  const [autenticado, setAutenticado] = useState(false);
  const [senha, setSenha] = useState('');
  const [erroSenha, setErroSenha] = useState(false);

  const [mun, setMun] = useState(MUNICIPIOS[0]);
  const [fotos, setFotos] = useState([]);
  const [camOn, setCamOn] = useState(false);
  const [nome, setNome] = useState('');
  const [bairro, setBairro] = useState('');
  const [risco, setRisco] = useState(RISCOS[0]);
  const [rel, setRel] = useState('');
  const [chuva, setChuva] = useState(12);
  const [vento, setVento] = useState(18);

  const [statusBR, setStatusBR] = useState('AGUARDANDO');
  const [timerBR, setTimerBR] = useState('00:00 / 05:00');
  const [statusRU, setStatusRU] = useState('AGUARDANDO');
  const [timerRU, setTimerRU] = useState('00:00 / 05:00');

  const videoRef = useRef(null);
  const streamRef = useRef(null);
  const audioCtxRef = useRef(null);
  const oscRef = useRef(null);
  const intervalRef = useRef(null);

  const fazerLogin = () => {
    if(senha === 'sarah2026') {
      setAutenticado(true);
      setErroSenha(false);
    } else {
      setErroSenha(true);
    }
  };

  const startCam = async () => {
    try {
      const s = await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:"environment"}, width:{ideal:1280}}});
      streamRef.current = s;
      setCamOn(true);
      setTimeout(()=>{ if(videoRef.current){ videoRef.current.srcObject = s; videoRef.current.play().catch(()=>{}); } }, 150);
    } catch(e) { alert('Permissão de câmera negada ou indisponível.'); }
  };

  const stopCam = () => {
    if(streamRef.current) streamRef.current.getTracks().forEach(t => t.stop());
    setCamOn(false);
  };

  const capturar = () => {
    const v = videoRef.current;
    if(!v || v.videoWidth == 0) return;
    const c = document.createElement('canvas');
    c.width = 400;
    c.height = Math.round(400 * v.videoHeight / v.videoWidth);
    const ctx = c.getContext('2d');
    ctx.drawImage(v, 0, 0, c.width, c.height);
    ctx.fillStyle = 'rgba(0,0,0,.9)';
    ctx.fillRect(0, c.height - 36, c.width, 36);
    ctx.fillStyle = '#fff';
    ctx.font = '700 9px monospace';
    ctx.fillText(`${new Date().toLocaleString('pt-BR')} | ${mun.n} | ${bairro} | ${nome}`, 6, c.height - 12);
    setFotos(p => [...p, c.toDataURL('image/jpeg', 0.35)]);
  };

  const gerarPDFBlob = async (prot, hash) => {
    const {jsPDF} = window.jspdf;
    const doc = new jsPDF('p', 'mm', 'a4');
    doc.setFillColor(8, 12, 20);
    doc.rect(0, 0, 210, 297, 'F');
    doc.setTextColor(255, 255, 255);
    doc.setFont('helvetica', 'bold');
    doc.setFontSize(11);
    doc.text(`VISTORIA - ${prot}`, 10, 14);
    doc.setFont('helvetica', 'normal');
    doc.setFontSize(9);
    doc.text(`RESPONSAVEL: ${nome} | ${mun.n} | BAIRRO: ${bairro}`, 10, 20);
    doc.text(`RISCO: ${risco} | BACIA: ${mun.bacia}`, 10, 25);
    const linhas = doc.splitTextToSize(rel, 190);
    doc.text(linhas, 10, 34);
    let y = 50;
    for(let i=0; i<fotos.length; i++) {
      if(y > 210) { doc.addPage(); doc.setFillColor(8, 12, 20); doc.rect(0, 0, 210, 297, 'F'); y = 10; }
      try { doc.addImage(fotos[i], 'JPEG', 10 + (i%2)*95, y, 88, 50); } catch {}
      if(i%2 == 1) y += 55;
      else if(i == fotos.length - 1) y += 55;
    }
    doc.setFontSize(6);
    doc.text(`HASH: ${hash}`, 10, 290);
    return doc.output('blob');
  };

  const enviarRelatorio = async () => {
    if(!nome || !bairro) { alert('Preencha Responsável e Bairro'); return; }
    const prot = `PROT-${mun.n.slice(0,3).toUpperCase()}-2026-${Math.floor(Math.random()*8999+1000)}`;
    const raw = `${prot}-${Date.now()}`;
    const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(raw));
    const hash = Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2,'0')).join('');
    const texto = `VISTORIA SARAH AI\nPROTOCOLO: ${prot}\nRESPONSAVEL: ${nome}\nLOCAL: ${mun.n} - ${bairro}\nBACIA: ${mun.bacia}\nRISCO: ${risco}\nFOTOS: ${fotos.length}\nHASH: ${hash.slice(0,24)}`;
    const fotoFiles = await Promise.all(fotos.map(async (d, i) => {
      const r = await fetch(d);
      const b = await r.blob();
      return new File([b], `FOTO_${i+1}.jpg`, {type:'image/jpeg'});
    }));
    if(navigator.canShare && fotoFiles.length > 0 && navigator.canShare({files: fotoFiles})) {
      await navigator.share({title: prot, text: texto, files: fotoFiles});
    } else {
      window.open(`https://wa.me/?text=${encodeURIComponent(texto)}`, '_blank');
    }
  };

  const enviarPDF = async () => {
    if(!nome || !bairro) { alert('Preencha Responsável e Bairro'); return; }
    const prot = `PROT-${mun.n.slice(0,3).toUpperCase()}-2026-${Math.floor(Math.random()*8999+1000)}`;
    const raw = `${prot}-${Date.now()}`;
    const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(raw));
    const hash = Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2,'0')).join('');
    const blob = await gerarPDFBlob(prot, hash);
    const pdfFile = new File([blob], `${prot}.pdf`, {type:'application/pdf'});
    if(navigator.canShare && navigator.canShare({files:[pdfFile]})) {
      await navigator.share({title: prot, text: `PDF ${prot}`, files:[pdfFile]});
    } else {
      const url = URL.createObjectURL(blob);
      window.open(url, '_blank');
    }
  };

  const initAudio = () => {
    if(!audioCtxRef.current) audioCtxRef.current = new (window.AudioContext || window.webkitAudioContext)();
  };

  const pararSirenes = () => {
    if(intervalRef.current) clearInterval(intervalRef.current);
    if(oscRef.current) { try{ oscRef.current.stop(); }catch{} oscRef.current = null; }
    setStatusBR('AGUARDANDO');
    setStatusRU('AGUARDANDO');
    setTimerBR('00:00 / 05:00');
    setTimerRU('00:00 / 05:00');
  };

  const tocarSomBR = () => {
    initAudio();
    if(oscRef.current) return;
    const ctx = audioCtxRef.current;
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(440, ctx.currentTime);
    gain.gain.setValueAtTime(0.4, ctx.currentTime);
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.start();
    oscRef.current = osc;
    let dir = 1;
    intervalRef.current = setInterval(() => {
      if(!oscRef.current) return;
      let f = oscRef.current.frequency.value;
      if(f > 880) dir = -1;
      if(f < 440) dir = 1;
      oscRef.current.frequency.linearRampToValueAtTime(f + dir * 8, ctx.currentTime + 0.1);
    }, 100);
  };

  const tocarSomRU = () => {
    initAudio();
    if(oscRef.current) return;
    const ctx = audioCtxRef.current;
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = 'sawtooth';
    osc.frequency.setValueAtTime(600, ctx.currentTime);
    gain.gain.setValueAtTime(0.35, ctx.currentTime);
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.start();
    oscRef.current = osc;
    let on = true;
    intervalRef.current = setInterval(() => {
      on = !on;
      gain.gain.setValueAtTime(on ? 0.35 : 0.05, ctx.currentTime);
    }, 400);
  };

  const formatSec = (s) => {
    let m = Math.floor(s/60).toString().padStart(2,'0');
    let ss = (s%60).toString().padStart(2,'0');
    return `${m}:${ss}`;
  };

  const iniciarBR = () => {
    pararSirenes();
    let sec = 0;
    tocarSomBR();
    setStatusBR('TOCANDO - ALERTA MÁXIMO (3 MIN)');
    intervalRef.current = setInterval(() => {
      sec++;
      setTimerBR(`${formatSec(sec)} / 05:00`);
      if(sec === 180) {
        if(oscRef.current) { try{ oscRef.current.stop(); }catch{} oscRef.current = null; }
        setStatusBR('PAUSA DE LUCIDEZ (1 MIN) - ORIENTAR MORADORES');
      }
      if(sec === 240) {
        tocarSomBR();
        setStatusBR('EVACUAÇÃO FINAL (1 MIN)');
      }
      if(sec >= 300) {
        pararSirenes();
        setStatusBR('PROTOCOLO CONCLUÍDO');
      }
    }, 1000);
  };

  const iniciarRU = () => {
    pararSirenes();
    let sec = 0;
    tocarSomRU();
    setStatusRU('TOCANDO - ALERTA TÁTICO (3 MIN)');
    intervalRef.current = setInterval(() => {
      sec++;
      setTimerRU(`${formatSec(sec)} / 05:00`);
      if(sec === 180) {
        if(oscRef.current) { try{ oscRef.current.stop(); }catch{} oscRef.current = null; }
        setStatusRU('PAUSA DE LUCIDEZ (1 MIN) - ABRIGO / DOCUMENTOS');
      }
      if(sec === 240) {
        tocarSomRU();
        setStatusRU('ALERTA FINAL (1 MIN) - ABRIGO IMEDIATO');
      }
      if(sec >= 300) {
        pararSirenes();
        setStatusRU('PROTOCOLO CONCLUÍDO');
      }
    }, 1000);
  };

  if (!autenticado) {
    return (
      <div className="w-full max-w-[420px] panel p-6 space-y-4 shadow-2xl mt-10">
        <div className="text-center space-y-1">
          <p className="text-[10px] text-blue-400 font-bold tracking-widest">ACESSO RESTRITO - ADMINISTRADOR</p>
          <h1 className="text-base font-black text-white">RARU NEXUS AI V11.4 Plus</h1>
          <p className="text-[10px] text-slate-400">Rede Automatizada de Resiliência Urbana, Mesquita - RJ</p>
          <p className="text-[9px] text-slate-500 italic">"Prevenção inteligente para todos."</p>
        </div>
        <div className="space-y-3 pt-2">
          <div>
            <label className="label">Senha do Operador</label>
            <input type="password" value={senha} onChange={e=>setSenha(e.target.value)} placeholder="Digite a senha (sarah2026)..." className="w-full mt-1 bg-black border border-white/20 rounded-xl p-3 text-sm text-white focus:outline-none focus:border-blue-500"/>
          </div>
          <button onClick={fazerLogin} className="btn bg-blue-600 hover:bg-blue-500 text-white">ACESSAR CENTRAL</button>
          {erroSenha && <p className="text-[10px] text-red-400 text-center">Senha incorreta. Acesso negado.</p>}
        </div>
        <div className="text-center pt-2 border-t border-white/5">
          <p className="text-[9px] text-slate-500">Grupo a Chave da Esperança © GADE • Rocha Sobrinho Mesquita RJ</p>
        </div>
      </div>
    );
  }

  return (
    <div className="space-y-3 w-full">

      {/* CABEÇALHO OFICIAL */}
      <div className="panel p-3 flex justify-between items-center">
        <div>
          <h2 className="text-xs font-black text-white">RARU NEXUS AI V11.4 Plus</h2>
          <p className="text-[9px] text-slate-400">Grupo a Chave da Esperança © GADE • Rocha Sobrinho</p>
        </div>
        <button onClick={()=>setAutenticado(false)} className="bg-red-900/30 border border-red-500/40 text-red-400 px-3 py-1.5 rounded-xl text-[9px] font-bold">BLOQUEAR</button>
      </div>

      {/* MAPA TÁTICO PROFISSIONAL (SVG E ESTILO RADAR) */}
      <div className="panel p-3 space-y-2">
        <div className="flex justify-between items-center">
          <p className="label">MAPA TÁTICO ESTADUAL - 92 MUNICÍPIOS (RJ)</p>
          <span className="text-[10px] px-2 py-1 rounded-full bg-blue-900/30 border border-blue-500/30 text-blue-300 font-bold">Foco: {mun.reg}</span>
        </div>
        <div className="map-box p-3">
          <svg viewBox="0 0 800 360" className="w-full h-[220px]" xmlns="http://www.w3.org/2000/svg">
            <rect width="800" height="360" rx="16" fill="#030712"/>
            
            <line x1="0" y1="180" x2="800" y2="180" stroke="#1E293B" strokeWidth="1" strokeDasharray="4,4"/>
            <line x1="400" y1="0" x2="400" y2="360" stroke="#1E293B" strokeWidth="1" strokeDasharray="4,4"/>
            <circle cx="400" cy="180" r="120" stroke="#1E293B" strokeWidth="1" fill="none"/>

            <circle cx="80" cy="50" r="1.5" fill="#fff" opacity=".8"/><circle cx="150" cy="30" r="2" fill="#fff"/><circle cx="300" cy="40" r="1" fill="#fff"/>
            <circle cx="650" cy="45" r="2" fill="#fff"/><circle cx="720" cy="70" r="1.5" fill="#fff"/>

            <g opacity="0.6">
              <path d="M450 40 L700 40 L720 160 L470 150 Z" fill="#0B132B" stroke="#1D4ED8" strokeWidth="1.5"/>
              <text x="540" y="90" fill="#93C5FD" fontSize="11" fontWeight="800">NORTE / NOROESTE / LITORAL</text>

              <path d="M310 50 L430 45 L440 150 L300 140 Z" fill="#0B132B" stroke="#059669" strokeWidth="1.5"/>
              <text x="330" y="95" fill="#6EE7B7" fontSize="11" fontWeight="800">REGIÃO SERRANA</text>
            </g>

            <rect x="180" y="160" width="380" height="150" rx="12" fill="#0A0F1D" stroke="#3B82F6" strokeWidth="1.5"/>
            <text x="200" y="185" fill="#60A5FA" fontSize="10" fontWeight="900">MALHA PRIORITÁRIA - BAIXADA FLUMINENSE & METROPOLITANA</text>

            <g className="cursor-pointer" onClick={()=>setMun(MUNICIPIOS[1])}>
              <rect x="200" y="210" width="105" height="42" rx="8" fill={mun.n.includes("Nova Iguaçu")?"#2563EB":"#172554"} stroke="#60A5FA" strokeWidth="1.5"/>
              <text x="252" y="228" textAnchor="middle" fill="#FFFFFF" fontSize="11" fontWeight="900">NOVA IGUAÇU</text>
              <text x="252" y="242" textAnchor="middle" fill="#93C5FD" fontSize="8">Bacia Sarapuí</text>
            </g>

            <g className="cursor-pointer" onClick={()=>setMun(MUNICIPIOS[2])}>
              <rect x="320" y="210" width="105" height="42" rx="8" fill={mun.n.includes("Duque")?"#2563EB":"#172554"} stroke="#60A5FA" strokeWidth="1.5"/>
              <text x="372" y="228" textAnchor="middle" fill="#FFFFFF" fontSize="11" fontWeight="900">DUQUE CAXIAS</text>
              <text x="372" y="242" textAnchor="middle" fill="#93C5FD" fontSize="8">Bacia Iguaçu</text>
            </g>

            <g className="cursor-pointer" onClick={()=>setMun(MUNICIPIOS[3])}>
              <rect x="435" y="210" width="110" height="42" rx="8" fill={mun.n.includes("Meriti")?"#2563EB":"#172554"} stroke="#60A5FA" strokeWidth="1.5"/>
              <text x="490" y="228" textAnchor="middle" fill="#FFFFFF" fontSize="11" fontWeight="900">S.J. MERITI</text>
              <text x="490" y="242" textAnchor="middle" fill="#93C5FD" fontSize="8">Pavuna / Sarapuí</text>
            </g>

            <g className="pisca cursor-pointer" onClick={()=>setMun(MUNICIPIOS[0])}>
              <circle cx="252" cy="290" r="28" fill="rgba(239,68,68,0.2)"/>
              <circle cx="252" cy="290" r="15" fill="#DC2626"/>
              <rect x="280" y="268" width="170" height="46" rx="10" fill="#991B1B" stroke="#FCA5A5" strokeWidth="2"/>
              <text x="365" y="288" textAnchor="middle" fill="#FFFFFF" fontSize="13" fontWeight="900">📍 MESQUITA</text>
              <text x="365" y="303" textAnchor="middle" fill="#FEE2E2" fontSize="9" fontWeight="800">ROCHA SOBRINHO (BASE)</text>
            </g>
          </svg>
          <p className="text-[10px] text-blue-400 text-center font-bold mt-2">⚡ CLIQUE EM QUALQUER BLOCO DO MAPA PARA FIXAR O MUNICÍPIO EM FOCO</p>
        </div>
      </div>

      {/* TELEMETRIA */}
      <div className="panel p-3 space-y-3">
        <div className="flex justify-between items-center"><p className="label">TELEMETRIA & MUNICÍPIO EM FOCO (92 MUNICÍPIOS)</p><span className="text-[10px] px-3 py-1 rounded-full bg-emerald-900/30 border border-emerald-500/40 text-emerald-300 font-bold">ONLINE</span></div>
        <div>
          <label className="label mb-1 block">SELECIONAR MUNICÍPIO DO ESTADO:</label>
          <select value={mun.n} onChange={e=>{ const m=MUNICIPIOS.find(mm=>mm.n===e.target.value); setMun(m); setChuva(Math.floor(Math.random()*35)); setVento(Math.floor(Math.random()*40)); }} className="w-full bg-black border border-white/20 rounded-xl p-3 text-[12px] font-bold text-white">
            {MUNICIPIOS.map((m,i)=><option key={i} value={m.n}>{m.n} - {m.reg}</option>)}
          </select>
        </div>
        <div className="bg-black border border-white/10 rounded-xl p-3">
          <p className="label">Bacia e Condição Climática:</p>
          <p className="text-[13px] font-black text-white mt-1">{mun.bacia}</p>
          <p className="text-[11px] text-emerald-300 mt-1">• Chuva: {chuva} mm/h | Vento: {vento} km/h ({vento>30?"ALERTA":vento>15?"ATENCAO":"Seguro"})</p>
        </div>
      </div>

      {/* SISTEMA DE SIRENES BR + RU (5 MINUTOS) */}
      <div className="panel p-4 space-y-3">
        <p className="label">SISTEMA ALERTA CRÍTICO - BR + RU (PROTOCOLO 5 MINUTOS)</p>
        <p className="text-[10px] text-slate-400">Sob custódia restrita. 3 min tocando > 1 min pausa lucidez > 1 min evacuação.</p>
        
        <div className="grid grid-cols-1 md:grid-cols-2 gap-3 pt-1">
          <div className="bg-black border border-white/10 rounded-xl p-3 space-y-2">
            <p className="text-[10px] font-bold text-white">ALERTA BRASILEIRO (CEMADEN)</p>
            <div className="flex gap-2">
              <button onClick={iniciarBR} className="btn bg-white text-black py-2.5">DISPARAR BR</button>
              <button onClick={pararSirenes} className="btn bg-black border border-white/20 text-white py-2.5">PARAR</button>
            </div>
            <div className="bg-[#0B1120] rounded p-2 text-[10px]">
              <div><span className="label">STATUS:</span> <span className="text-yellow-400 font-bold">{statusBR}</span></div>
              <div><span className="label">TEMPO:</span> <span className="text-white">{timerBR}</span></div>
            </div>
          </div>

          <div className="bg-black border border-white/10 rounded-xl p-3 space-y-2">
            <p className="text-[10px] font-bold text-white">ALERTA TÁTICO (PADRÃO RUSSO)</p>
            <div className="flex gap-2">
              <button onClick={iniciarRU} className="btn bg-[#E5E7EB] text-black py-2.5">DISPARAR RU</button>
              <button onClick={pararSirenes} className="btn bg-black border border-white/20 text-white py-2.5">PARAR</button>
            </div>
            <div className="bg-[#0B1120] rounded p-2 text-[10px]">
              <div><span className="label">STATUS:</span> <span className="text-yellow-400 font-bold">{statusRU}</span></div>
              <div><span className="label">TEMPO:</span> <span className="text-white">{timerRU}</span></div>
            </div>
          </div>
        </div>
      </div>

      {/* VISTORIA E CAPTURA DE FOTO */}
      <div className="panel p-3 space-y-3">
        <div className="flex justify-between items-center"><p className="label">VISTORIA DE CAMPO - {mun.n.split('(')[0]}</p></div>
        <div className="bg-black border border-white/10 rounded-xl p-2 space-y-2">
          <div className="flex justify-between items-center"><p className="label">Câmera de Campo</p>{!camOn?<button onClick={startCam} className="text-[10px] bg-white text-black font-bold px-3 py-1.5 rounded-lg">LIGAR CÂMERA</button>:<button onClick={stopCam} className="text-[10px] border border-red-500/30 text-red-300 px-3 py-1.5 rounded-lg">DESLIGAR</button>}</div>
          <div className="bg-[#080A12] rounded-lg overflow-hidden"><video ref={videoRef} autoPlay playsInline muted style={{width:'100%', height:'210px', objectFit:'cover', display:camOn?'block':'none'}}></video>{!camOn && <div className="h-[210px] grid place-items-center text-[11px] text-slate-600">CÂMERA DESLIGADA</div>}</div>
          {camOn && <button onClick={capturar} className="w-full py-3 bg-white text-black font-black rounded-xl text-xs">CAPTURAR FOTO COM CARIMBO</button>}
          {fotos.length>0 && <div className="flex gap-2 overflow-x-auto">{fotos.map((f,i)=><div key={i} className="relative shrink-0"><img src={f} className="w-20 h-20 object-cover rounded-lg border border-white/20"/><div className="x" onClick={()=>setFotos(fotos.filter((_,idx)=>idx!==i))}>X</div></div>)}</div>}
        </div>
        <input value={nome} onChange={e=>setNome(e.target.value)} placeholder="RESPONSÁVEL TÉCNICO *" className="w-full bg-black border border-white/10 rounded-xl p-3 text-xs text-white"/>
        <div className="grid grid-cols-2 gap-2">
          <input value={bairro} onChange={e=>setBairro(e.target.value)} placeholder="BAIRRO *" className="bg-black border border-white/10 rounded-xl p-3 text-xs text-white"/>
          <select value={risco} onChange={e=>setRisco(e.target.value)} className="bg-black border border-white/10 rounded-xl p-3 text-[11px] text-white">
            {RISCOS.map((r,i)=><option key={i}>{r}</option>)}
          </select>
        </div>
        <textarea value={rel} onChange={e=>setRel(e.target.value)} rows="2" placeholder="RELATO DE PREVENÇÃO E OCORRÊNCIA" className="w-full bg-black border border-white/10 rounded-xl p-3 text-xs text-white"></textarea>
        <div className="grid grid-cols-1 gap-2">
          <button onClick={enviarRelatorio} className="w-full py-4 bg-[#25D366] text-black font-black rounded-xl text-[12px]">ENVIAR RELATÓRIO + FOTOS (WHATSAPP)</button>
          <button onClick={enviarPDF} className="w-full py-4 bg-white text-black font-black rounded-xl text-[12px]">GERAR E ENVIAR PDF OFICIAL</button>
        </div>
      </div>

      {/* SERVIÇOS VITAIS DE EMERGÊNCIA */}
      <div className="panel p-3 grid grid-cols-2 gap-2">
        <div className="bg-black border border-white/10 rounded-xl p-3 text-center"><p className="label">BOMBEIROS</p><p className="text-red-400 font-black text-[18px]">193</p></div>
        <div className="bg-black border border-white/10 rounded-xl p-3 text-center"><p className="label">DEFESA CIVIL</p><p className="text-amber-300 font-black text-[18px]">199</p></div>
        <div className="bg-black border border-white/10 rounded-xl p-3 text-center"><p className="label">SAMU / SAÚDE</p><p className="text-blue-300 font-black text-[18px]">192</p></div>
        <div className="bg-black border border-white/10 rounded-xl p-3 text-center"><p className="label">APOIO EMOCIONAL</p><p className="text-emerald-300 font-black text-[18px]">188</p></div>
      </div>

    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
