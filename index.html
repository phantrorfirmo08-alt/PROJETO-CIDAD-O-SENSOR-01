<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SARAH AI - Sistema de Monitoramento e Defesa Civil (Sarapuí - Mesquita/RJ)</title>
    
    <!-- Theme Initialization (antes de qualquer JS) -->
    <script>
        const isDark = localStorage.getItem('darkMode') !== 'false';
        if (isDark) document.documentElement.classList.add('dark');
    </script>
    
    <!-- Tailwind CSS -->
    <script defer src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            dark: '#020617',
                            light: '#f8fafc'
                        }
                    }
                }
            }
        }
    </script>
    
    <!-- React & Babel (Async) -->
    <script async src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
    <script async src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
    <script async src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- Leaflet CSS & JS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin=""/>
    <script async src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>

    <!-- Chart.js -->
    <script async src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <!-- PWA Manifest & Meta -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#020617">
</head>
<body class="min-h-screen bg-slate-950 text-slate-100 transition-colors duration-300 pb-12">
    <div id="root"></div>

    <script type="text/babel">
        function App() {
            // Estados Globais e de Configuração
            const [userName, setUserName] = React.useState('Alexander');
            const [awaitingGuestName, setAwaitingGuestName] = React.useState(false);
            const [guestNames, setGuestNames] = React.useState([]);
            const [hfApiKey, setHfApiKey] = React.useState(() => localStorage.getItem('hf_api_key') || '');
            const [darkMode, setDarkMode] = React.useState(() => localStorage.getItem('darkMode') !== 'false');
            const [fontSizeScale, setFontSizeScale] = React.useState('normal');
            const [soundEnabled, setSoundEnabled] = React.useState(true);
            const [isSpeaking, setIsSpeaking] = React.useState(false);
            const [isListening, setIsListening] = React.useState(false);

            // Módulos Recolhíveis
            const [mapOpen, setMapOpen] = React.useState(false);
            const [chartOpen, setChartOpen] = React.useState(false);
            const [termsOpen, setTermsOpen] = React.useState(false);

            // Chat State
            const [messages, setMessages] = React.useState([
                {
                    id: '1',
                    sender: 'sarah',
                    text: `Olá, Alexander. SARAH AI ativa e monitorando o setor Sarapuí-Mesquita dentro dos parâmetros legais e de moderação. Como posso auxiliar em nossa operação hoje?`,
                    timestamp: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
                }
            ]);
            const [input, setInput] = React.useState('');
            const [isLoadingChat, setIsLoadingChat] = React.useState(false);

            // Referências para Mapas e Gráficos
            const mapRef = React.useRef(null);
            const mapInstanceRef = React.useRef(null);
            const chartRef = React.useRef(null);
            const chartInstanceRef = React.useRef(null);

            // Sincronizar Chave Hugging Face
            React.useEffect(() => {
                localStorage.setItem('hf_api_key', hfApiKey);
            }, [hfApiKey]);

            // Sincronizar Modo Dark/Light na tag html
            React.useEffect(() => {
                const rootHtml = document.documentElement;
                localStorage.setItem('darkMode', darkMode ? 'true' : 'false');
                if (darkMode) {
                    rootHtml.classList.add('dark');
                    rootHtml.classList.remove('light');
                } else {
                    rootHtml.classList.remove('dark');
                    rootHtml.classList.add('light');
                }
            }, [darkMode]);

            // Inicializar Mapa Leaflet quando aberto
            React.useEffect(() => {
                if (mapOpen && mapRef.current && !mapInstanceRef.current) {
                    const lat = -22.7845;
                    const lng = -43.4140;
                    const map = L.map(mapRef.current).setView([lat, lng], 16);
                    
                    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                        maxZoom: 19,
                        attribution: '© OpenStreetMap contributors | SARAH AI Defesa Civil'
                    }).addTo(map);

                    L.marker([lat, lng]).addTo(map)
                        .bindPopup('<b>Setor Crítico:</b> Rua Amazonas / Comunidade do Sebinho - Rocha Sobrinho, Mesquita')
                        .openPopup();

                    mapInstanceRef.current = map;
                } else if (mapOpen && mapInstanceRef.current) {
                    mapInstanceRef.current.invalidateSize();
                }
            }, [mapOpen]);

            // Inicializar Gráfico de Métricas do Rio Sarapuí
            React.useEffect(() => {
                if (chartOpen && chartRef.current && !chartInstanceRef.current) {
                    const ctx = chartRef.current.getContext('2d');
                    chartInstanceRef.current = new Chart(ctx, {
                        type: 'line',
                        data: {
                            labels: ['00:00', '03:00', '06:00', '09:00', '12:00', '15:00', '18:00', 'Atual'],
                            datasets: [{
                                label: 'Cota do Rio Sarapuí (m) - [Aguardando Telemetria]',
                                data: [0, 0, 0, 0, 0, 0, 0, 0],
                                borderColor: '#06b6d4',
                                backgroundColor: 'rgba(6, 182, 212, 0.1)',
                                borderWidth: 2,
                                fill: true,
                                tension: 0.3
                            }]
                        },
                        options: {
                            responsive: true,
                            maintainAspectRatio: false,
                            scales: {
                                y: {
                                    beginAtZero: true,
                                    max: 4.0,
                                    grid: { color: 'rgba(148, 163, 184, 0.1)' },
                                    ticks: { color: '#94a3b8', font: { family: 'monospace', size: 10 } }
                                },
                                x: {
                                    grid: { color: 'rgba(148, 163, 184, 0.1)' },
                                    ticks: { color: '#94a3b8', font: { family: 'monospace', size: 10 } }
                                }
                            },
                            plugins: {
                                legend: { labels: { color: '#e2e8f0', font: { family: 'monospace', size: 11 } } }
                            }
                        }
                    });
                }
            }, [chartOpen]);

            // Sistema de Síntese de Voz (TTS)
            const speakText = (text) => {
                if (!soundEnabled || !('speechSynthesis' in window)) return;
                window.speechSynthesis.cancel();
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'pt-BR';
                utterance.pitch = 1.0;
                utterance.rate = 1.0;
                utterance.onstart = () => setIsSpeaking(true);
                utterance.onend = () => setIsSpeaking(false);
                utterance.onerror = () => setIsSpeaking(false);
                window.speechSynthesis.speak(utterance);
            };

            // Reconhecimento de Voz Avançado (STT)
            const toggleListening = () => {
                const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
                if (!SpeechRec) {
                    alert("Seu navegador não suporta reconhecimento de voz avançado.");
                    return;
                }
                if (isListening) {
                    setIsListening(false);
                    return;
                }
                const rec = new SpeechRec();
                rec.lang = 'pt-BR';
                rec.onstart = () => setIsListening(true);
                rec.onresult = (e) => {
                    const txt = e.results[0][0].transcript;
                    setInput(txt);
                    setIsListening(false);
                    handleSendMessage(txt);
                };
                rec.onerror = () => setIsListening(false);
                rec.onend = () => setIsListening(false);
                rec.start();
            };

            // Lógica de Moderação, Nomes e Conversação da SARAH
            const handleSendMessage = async (textCustom) => {
                const textToSend = textCustom !== undefined ? textCustom : input;
                if (!textToSend.trim() || isLoadingChat) return;

                const userMsg = {
                    id: Date.now().toString(),
                    sender: 'user',
                    text: textToSend,
                    timestamp: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
                };

                setMessages(prev => [...prev, userMsg]);
                if (!textCustom) setInput('');
                setIsLoadingChat(true);

                setTimeout(() => {
                    let reply = "";
                    const lowerText = textToSend.toLowerCase();

                    if (awaitingGuestName) {
                        const guestName = textToSend.trim();
                        setGuestNames(prev => [...prev, guestName]);
                        setAwaitingGuestName(false);
                        reply = `Perfeito! Registrei o nome ${guestName} no sistema. A partir de agora, tratarei ${guestName} com toda atenção e respeito no setor. Como mais posso ajudar vocês, ${userName}?`;
                    } 
                    else if (lowerText.includes('outro nome') || lowerText.includes('tem outra pessoa') || lowerText.includes('falar com') || lowerText.includes('meu amigo') || lowerText.includes('colega') || lowerText.includes('aqui tem')) {
                        setAwaitingGuestName(true);
                        reply = `Entendido, ${userName}. Qual é o nome da pessoa que está acompanhando você agora? Por favor, informe para que eu possa chamá-la pelo nome.`;
                    } 
                    else {
                        reply = `Compreendido, ${userName}. Operando com rigor nos padrões de moderação e proteção de dados da Bacia do Sarapuí. Nossos sensores e protocolos estão ativos. Tem mais alguém presente com você cujo nome eu deva registrar?`;
                    }

                    setMessages(prev => [...prev, {
                        id: (Date.now() + 1).toString(),
                        sender: 'sarah',
                        text: reply,
                        timestamp: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
                    }]);
                    setIsLoadingChat(false);
                    speakText(reply);
                }, 700);
            };

            // Controles de Tamanho de Fonte
            const getFontSizeClass = () => {
                switch(fontSizeScale) {
                    case 'small': return 'text-xs';
                    case 'large': return 'text-base';
                    case 'xl': return 'text-lg';
                    default: return 'text-sm';
                }
            };

            const cycleFontSize = () => {
                if (fontSizeScale === 'normal') setFontSizeScale('large');
                else if (fontSizeScale === 'large') setFontSizeScale('xl');
                else if (fontSizeScale === 'xl') setFontSizeScale('small');
                else setFontSizeScale('normal');
            };

            return (
                <div className={`min-h-screen ${darkMode ? 'bg-slate-950 text-slate-100' : 'bg-slate-100 text-slate-900'} ${getFontSizeClass()} transition-colors duration-300 flex flex-col justify-between`}>
                    
                    <div>
                        {/* BARRA DE FERRAMENTAS SUPERIOR COM BOTÕES FUNCIONAIS */}
                        <header className="bg-slate-900/95 border-b border-cyan-500/30 px-3 py-2.5 backdrop-blur-md sticky top-0 z-50 shadow-md">
                            <div className="max-w-4xl mx-auto flex flex-wrap items-center justify-between gap-2">
                                
                                {/* Hugging Face Key Input & Attach */}
                                <div className="flex items-center gap-1.5 w-full sm:w-auto">
                                    <span className="font-mono text-[11px] text-cyan-400 font-bold shrink-0">HF Key:</span>
                                    <input
                                        type="password"
                                        value={hfApiKey}
                                        onChange={(e) => setHfApiKey(e.target.value)}
                                        placeholder="Insira sua HF API Key..."
                                        className="bg-slate-950 border border-cyan-500/40 rounded px-2 py-1 text-xs font-mono text-slate-200 w-full sm:w-48 focus:outline-none focus:border-cyan-400 shadow-inner"
                                    />
                                    <button
                                        onClick={() => alert(hfApiKey ? "Chave HF anexada e salva no navegador com sucesso!" : "Insira uma chave válida.")}
                                        className="px-2 py-1 bg-cyan-500/20 hover:bg-cyan-500/30 text-cyan-300 border border-cyan-500/40 rounded text-xs font-mono transition-colors shrink-0"
                                        title="Anexar Chave ao Sistema do Navegador"
                                    >
                                        Anexar
                                    </button>
                                </div>

                                {/* Botões Operacionais: Instalar, Tema, Compartilhar, Fonte */}
                                <div className="flex items-center flex-wrap gap-1.5 ml-auto">
                                    {/* Instalar PWA */}
                                    <button
                                        onClick={() => {
                                            if ('deferredPrompt' in window && window.deferredPrompt) {
                                                window.deferredPrompt.prompt();
                                            } else {
                                                alert('PWA pronto para instalação ou verifique o menu do seu navegador (Adicionar à Tela Inicial).');
                                            }
                                        }}
                                        className="px-2.5 py-1 bg-cyan-500/20 hover:bg-cyan-500/30 text-cyan-300 border border-cyan-500/40 rounded text-xs font-mono flex items-center gap-1 transition-colors"
                                        title="Instalar Aplicativo PWA"
                                    >
                                        📥 Instalar
                                    </button>

                                    {/* Modo Dia / Noite */}
                                    <button
                                        onClick={() => setDarkMode(!darkMode)}
                                        className="px-2.5 py-1 bg-slate-800 hover:bg-slate-700 text-amber-300 border border-slate-700 rounded text-xs font-mono flex items-center gap-1 transition-colors"
                                        title="Alternar Leitura Confortável (Dia / Noite)"
                                    >
                                        {darkMode ? '☀️ Dia' : '🌙 Noite'}
                                    </button>

                                    {/* Aumentar / Diminuir Letras */}
                                    <button
                                        onClick={cycleFontSize}
                                        className="px-2.5 py-1 bg-slate-800 hover:bg-slate-700 text-slate-300 border border-slate-700 rounded text-xs font-mono transition-colors"
                                        title="Ajustar Tamanho da Fonte"
                                    >
                                        🔠 Fonte ({fontSizeScale})
                                    </button>

                                    {/* Compartilhar Aplicativo */}
                                    <button
                                        onClick={() => {
                                            if (navigator.share) {
                                                navigator.share({
                                                    title: 'SARAH AI - Defesa Civil Mesquita',
                                                    text: 'Sistema inteligente de monitoramento do Rio Sarapuí em Mesquita, RJ.',
                                                    url: window.location.href
                                                }).catch(() => {});
                                            } else {
                                                navigator.clipboard.writeText(window.location.href);
                                                alert('Link do aplicativo copiado para a área de transferência!');
                                            }
                                        }}
                                        className="px-2.5 py-1 bg-emerald-500/20 hover:bg-emerald-500/30 text-emerald-300 border border-emerald-500/40 rounded text-xs font-mono flex items-center gap-1 transition-colors"
                                        title="Compartilhar Aplicativo"
                                    >
                                        🔗 Compartilhar
                                    </button>
                                </div>
                            </div>
                        </header>

                        {/* CONTEÚDO PRINCIPAL */}
                        <main className="max-w-2xl mx-auto pt-6 px-4">
                            
                            {/* CABEÇALHO DO SISTEMA */}
                            <div className="text-center mb-6 relative">
                                <div className="inline-flex flex-col items-center gap-1 mb-3 px-4 py-2 bg-cyan-500/10 border border-cyan-500/30 rounded-2xl shadow-inner">
                                    <span className="font-mono text-xs text-cyan-400 font-bold tracking-widest uppercase">
                                        Sistema Automatizado
                                    </span>
                                    <span className="font-mono text-sm text-slate-100 font-semibold tracking-wide">
                                        Cidadão Sensor_ Sebinho / Mesquita RJ
                                    </span>
                                    <span className="font-mono text-[11px] text-cyan-300 tracking-wider">
                                        Defesa civil Digital Comunitária
                                    </span>
                                </div>
                            </div>

                            {/* MÓDULOS RECOLHÍVEIS */}
                            <div className="space-y-4 mb-6">
                                {/* Botão Mapa */}
                                <button
                                    onClick={() => setMapOpen(!mapOpen)}
                                    className="w-full px-4 py-3 bg-cyan-500/20 hover:bg-cyan-500/30 text-cyan-300 border border-cyan-500/40 rounded font-mono text-sm transition-colors"
                                >
                                    {mapOpen ? '🗺️ Ocultar Mapa' : '🗺️ Ver Mapa - Setor Sarapuí'}
                                </button>
                                {mapOpen && (
                                    <div className="w-full h-80 bg-slate-800 rounded border border-cyan-500/30 overflow-hidden">
                                        <div ref={mapRef} className="w-full h-full"></div>
                                    </div>
                                )}

                                {/* Botão Gráfico */}
                                <button
                                    onClick={() => setChartOpen(!chartOpen)}
                                    className="w-full px-4 py-3 bg-cyan-500/20 hover:bg-cyan-500/30 text-cyan-300 border border-cyan-500/40 rounded font-mono text-sm transition-colors"
                                >
                                    {chartOpen ? '📊 Ocultar Gráfico' : '📊 Ver Métricas - Rio Sarapuí'}
                                </button>
                                {chartOpen && (
                                    <div className="w-full h-80 bg-slate-800 rounded border border-cyan-500/30 p-4">
                                        <canvas ref={chartRef}></canvas>
                                    </div>
                                )}
                            </div>

                            {/* ÁREA DE CHAT */}
                            <div className="bg-slate-800/50 rounded border border-cyan-500/30 p-4 h-96 overflow-y-auto mb-4 space-y-3">
                                {messages.map((msg) => (
                                    <div key={msg.id} className={`flex ${msg.sender === 'user' ? 'justify-end' : 'justify-start'}`}>
                                        <div className={`max-w-xs px-3 py-2 rounded ${msg.sender === 'user' ? 'bg-cyan-600/40 text-cyan-100' : 'bg-slate-700/60 text-slate-100'}`}>
                                            <p className="text-sm">{msg.text}</p>
                                            <span className="text-xs opacity-60 mt-1 block">{msg.timestamp}</span>
                                        </div>
                                    </div>
                                ))}
                                {isLoadingChat && (
                                    <div className="flex justify-start">
                                        <div className="bg-slate-700/60 text-slate-100 px-3 py-2 rounded">
                                            <p className="text-sm">SARAH está digitando...</p>
                                        </div>
                                    </div>
                                )}
                            </div>

                            {/* INPUT DE MENSAGEM */}
                            <div className="flex gap-2">
                                <input
                                    type="text"
                                    value={input}
                                    onChange={(e) => setInput(e.target.value)}
                                    onKeyPress={(e) => e.key === 'Enter' && handleSendMessage()}
                                    placeholder="Digite sua mensagem..."
                                    className="flex-1 bg-slate-900 border border-cyan-500/40 rounded px-3 py-2 text-sm font-mono text-slate-100 focus:outline-none focus:border-cyan-400"
                                    disabled={isLoadingChat}
                                />
                                <button
                                    onClick={() => handleSendMessage()}
                                    disabled={isLoadingChat}
                                    className="px-4 py-2 bg-cyan-500/20 hover:bg-cyan-500/30 text-cyan-300 border border-cyan-500/40 rounded font-mono text-sm transition-colors disabled:opacity-50"
                                >
                                    Enviar
                                </button>
                                <button
                                    onClick={toggleListening}
                                    className={`px-3 py-2 ${isListening ? 'bg-red-500/30 border-red-500/40' : 'bg-cyan-500/20 border-cyan-500/40'} hover:bg-cyan-500/30 text-cyan-300 border rounded font-mono text-sm transition-colors`}
                                    title="Ativar Reconhecimento de Voz"
                                >
                                    🎤 {isListening ? 'Ouvindo...' : 'Voz'}
                                </button>
                            </div>
                        </main>
                    </div>

                    {/* RODAPÉ */}
                    <footer className="max-w-2xl mx-auto w-full px-4 py-4 text-center text-xs text-slate-400 border-t border-slate-800">
                        <p>© 2025 SARAH AI - Defesa Civil Digital | Comunidade Sebinho, Mesquita/RJ</p>
                    </footer>
                </div>
            );
        }

        // Renderizar App
        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
