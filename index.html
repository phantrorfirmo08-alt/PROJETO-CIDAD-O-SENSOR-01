<!DOCTYPE html>
<html lang="pt-BR" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SARAH IA Core v6.2 ULTRA - WeatherAPI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        darkbg: '#0B132B',
                        cardbg: '#1C2541',
                        accent: '#48CAE4'
                    }
                }
            }
        }
    </script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=Rajdhani:wght@400;600&display=swap" rel="stylesheet">
    <style>
        #map-container { width: 100%; height: 300px; border-radius: 12px; border: 1px solid #1c3a5e; position: relative; overflow: hidden; box-shadow: inset 0 0 60px rgba(0,0,0,.7), 0 0 25px rgba(46,196,182,.08); background: #060b13; }
        @media (min-width: 640px) { #map-container { height: 380px; } }
        .corner { position: absolute; width: 26px; height: 26px; z-index: 1200; pointer-events: none; }
        .corner::before, .corner::after { content: ""; position: absolute; background: #2ec4b6; box-shadow: 0 0 8px #2ec4b6; }
        .corner::before { width: 100%; height: 2px; }
        .corner::after { width: 2px; height: 100%; }
        .corner.tl { top: 8px; left: 8px; }
        .corner.tr { top: 8px; right: 8px; transform: scaleX(-1); }
        .corner.bl { bottom: 8px; left: 8px; transform: scaleY(-1); }
        .corner.br { bottom: 8px; right: 8px; transform: scale(-1,-1); }
        #hud-clock { position: absolute; top: 14px; right: 14px; z-index: 1200; font-family: 'Orbitron', sans-serif; font-size: 12px; color: #2ec4b6; background: rgba(6,11,19,.7); padding: 4px 10px; border-radius: 6px; border: 1px solid #1c3a5e; letter-spacing: 2px; }
        .radar-sweep { position: absolute; top: 50%; left: 50%; width: 900px; height: 900px; margin: -450px 0 0 -450px; pointer-events: none; z-index: 1100; mix-blend-mode: screen; background: conic-gradient(from 0deg, rgba(46,196,182,.35) 0deg, rgba(46,196,182,.12) 25deg, transparent 60deg, transparent 360deg); border-radius: 50%; animation: sweep 4s linear infinite; }
        @keyframes sweep { to { transform: rotate(360deg); } }
        .paused .radar-sweep { animation-play-state: paused; opacity: .25; }
        .grid-overlay { position: absolute; inset: 0; z-index: 1050; pointer-events: none; opacity: .12; background-image: linear-gradient(#2ec4b6 1px, transparent 1px), linear-gradient(90deg, #2ec4b6 1px, transparent 1px); background-size: 48px 48px; }
        .marker-pulse { width: 14px; height: 14px; border-radius: 50%; background: #ff4d5e; box-shadow: 0 0 10px #ff4d5e; position: relative; }
        .marker-pulse::after { content: ""; position: absolute; inset: -6px; border-radius: 50%; border: 2px solid #ff4d5e; animation: ring 1.8s ease-out infinite; }
        @keyframes ring { from { transform: scale(.5); opacity: 1; } to { transform: scale(2.2); opacity: 0; } }
        .leaflet-popup-content-wrapper { background: #0d1928; color: #dfe9f3; border: 1px solid #2ec4b6; border-radius: 8px; font-family: 'Rajdhani', sans-serif; }
        .leaflet-popup-tip { background: #0d1928; border: 1px solid #2ec4b6; }
        .orbitron { font-family: 'Orbitron', sans-serif; }
    </style>
</head>
<body class="bg-darkbg text-slate-100 min-h-screen font-sans antialiased">
    <div id="root"></div>
    <script type="text/babel">
        const CENTER = [-22.7685, -43.4116];
        // CHAVE DA WEATHERAPI
        const WEATHER_API_KEY = '193aadf89c3b3cad053c560ee687fa2f';
        
        function MapaMonitor({ onWeatherUpdate }) {
            const mapRef = React.useRef(null);
            const isAnimatingRef = React.useRef(true);
            const [isAnimating, setIsAnimating] = React.useState(true);
            const [clock, setClock] = React.useState("--:--:--");
            const [weather, setWeather] = React.useState({ precip: '--', wind: '--', temp: '--', cond: '--' });
            const [loading, setLoading] = React.useState(true);

            const fetchWeather = React.useCallback(async () => {
                try {
                    const url = `http://api.weatherapi.com/v1/current.json?key=${WEATHER_API_KEY}&q=${CENTER[0]},${CENTER[1]}&aqi=no`;
                    const res = await fetch(url);
                    const data = await res.json();
                    if (data.error) throw new Error(data.error.message);
                    
                    const c = data.current;
                    const novo = {
                        precip: (c.precip_mm || 0).toFixed(1),
                        wind: Math.round(c.wind_kph || 0),
                        temp: Math.round(c.temp_c || 0),
                        cond: c.condition.text,
                        humidade: c.humidity
                    };
                    setWeather(novo);
                    setLoading(false);
                    if(onWeatherUpdate) onWeatherUpdate(novo);
                } catch(e) { 
                    console.warn("Erro clima:",e); 
                    setLoading(false); 
                    setWeather(prev => ({...prev, cond: 'API Erro'}));
                }
            }, [onWeatherUpdate]);

            React.useEffect(() => {
                if(!mapRef.current && document.getElementById('map-container')) {
                    const map = L.map('map-container',{minZoom:9,maxZoom:15,zoomControl:false}).setView(CENTER,13);
                    mapRef.current = map;
                    L.control.zoom({position:'bottomleft'}).addTo(map);
                    L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png',{attribution:'&copy; OSM &copy; CARTO',subdomains:'abcd',minZoom:9,maxZoom:19}).addTo(map);
                    
                    L.circle(CENTER,{color:'#2ec4b6',weight:1.5,dashArray:'6 6',fillColor:'#48cae4',fillOpacity:.08,radius:4000}).addTo(map).bindPopup('<b>ÁREA DE MONITORAMENTO</b><br>Bacias Sarapuí, Dona Eugênia e Prata');
                    
                    const icon = L.divIcon({className:'',html:'<div class="marker-pulse"></div>',iconSize:[14,14],iconAnchor:[7,7]});
                    L.marker([-22.768,-43.415],{icon}).addTo(map).bindPopup('Rio Sarapuí');
                    L.marker([-22.765,-43.408],{icon}).addTo(map).bindPopup('Rio Dona Eugênia');
                    L.marker([-22.771,-43.412],{icon}).addTo(map).bindPopup('Comunidade do Sebinho');

                    const fronts = [
                        {c:L.circle([-22.76,-43.40],{color:'#ff4d5e',fillColor:'#ff4d5e',fillOpacity:.25,radius:1500}).addTo(map),base:1500,speed:1.3},
                        {c:L.circle([-22.80,-43.45],{color:'#ffb703',fillColor:'#ffb703',fillOpacity:.25,radius:2000}).addTo(map),base:2000,speed:.9}
                    ];
                    let step=0, raf;
                    const anim = ()=>{if(isAnimatingRef.current)step+=0.015;fronts.forEach(f=>f.c.setRadius(f.base+Math.sin(step*f.speed)*500));raf=requestAnimationFrame(anim)};
                    anim();
                    setTimeout(()=>map.invalidateSize(),300);
                    return()=>cancelAnimationFrame(raf);
                }
            },[]);

            React.useEffect(()=>{const t=setInterval(()=>setClock(new Date().toLocaleTimeString('pt-BR',{hour12:false})),1000);return()=>clearInterval(t)},[]);
            React.useEffect(()=>{fetchWeather();const i=setInterval(fetchWeather,600000);return()=>clearInterval(i)},[fetchWeather]);

            const nivel = parseFloat(weather.precip)>5?'CRÍTICO':(parseFloat(weather.precip)>1?'ATENÇÃO':'NORMAL');
            const cor = nivel==='CRÍTICO'?'text-red-400':(nivel==='ATENÇÃO'?'text-amber-400':'text-emerald-400');

            return (
                <section className="bg-cardbg p-3 rounded-lg border border-slate-700 space-y-2">
                    <div className="flex justify-between items-center">
                        <h2 className="text-xs font-semibold text-slate-300 uppercase">Radar & Monitoramento</h2>
                        <span className="text-[10px] text-emerald-400 font-mono">● LIVE • WEATHERAPI</span>
                    </div>
                    <div id="map-container" className={isAnimating?'':'paused'}>
                        <div className="grid-overlay"></div>
                        <div className="radar-sweep"></div>
                        <div id="hud-clock">{clock}</div>
                        <div className="corner tl"></div><div className="corner tr"></div><div className="corner bl"></div><div className="corner br"></div>
                    </div>
                    <div className="grid grid-cols-4 gap-2">
                        <div className="bg-slate-950/60 border border-slate-800 rounded-lg p-2 text-center">
                            <div className="orbitron font-bold text-sm text-cyan-400">{loading?'...':weather.precip}<small className="text-[8px]">mm</small></div>
                            <div className="text-[8px] text-slate-500 uppercase">Chuva</div>
                        </div>
                        <div className="bg-slate-950/60 border border-slate-800 rounded-lg p-2 text-center">
                            <div className="orbitron font-bold text-sm text-amber-400">{loading?'...':weather.wind}<small className="text-[8px]">km/h</small></div>
                            <div className="text-[8px] text-slate-500 uppercase">Vento</div>
                        </div>
                        <div className="bg-slate-950/60 border border-slate-800 rounded-lg p-2 text-center">
                            <div className="orbitron font-bold text-sm text-blue-300">{loading?'...':weather.temp}<small className="text-[8px]">°C</small></div>
                            <div className="text-[8px] text-slate-500 uppercase">Temp</div>
                        </div>
                        <div className="bg-slate-950/60 border border-slate-800 rounded-lg p-2 text-center">
                            <div className={`orbitron font-bold text-sm ${cor}`}>{loading?'...':nivel}</div>
                            <div className="text-[8px] text-slate-500 uppercase">Nível</div>
                        </div>
                    </div>
                    <div className="flex gap-2">
                        <button onClick={()=>{setIsAnimating(p=>{isAnimatingRef.current=!p;return!p})}} className="flex-1 bg-cyan-700 hover:bg-cyan-600 text-white py-2 rounded-lg text-[11px] font-semibold transition">{isAnimating?'⏸ PAUSAR':'▶ RETOMAR'}</button>
                        <button onClick={()=>mapRef.current&&mapRef.current.setView(CENTER,13)} className="flex-1 bg-slate-800 hover:bg-slate-700 border border-slate-700 text-slate-200 py-2 rounded-lg text-[11px] font-semibold transition">🔄 RECENTER</button>
                        <button onClick={fetchWeather} className="flex-1 bg-slate-800 hover:bg-slate-700 border border-slate-700 text-slate-200 py-2 rounded-lg text-[11px] font-semibold transition">📶 SINCRONIZAR</button>
                    </div>
                </section>
            );
        }

        function App() {
            const [messages, setMessages] = React.useState([{sender:'sarah',text:'SARAH IA v6.2 ULTRA ativa. Dados reais conectados. Como posso auxiliar?'}]);
            const [inputText, setInputText] = React.useState('');
            const [isListening, setIsListening] = React.useState(false);
            const lastWeather = React.useRef(null);

            const handleWeather = (d)=>{lastWeather.current=d};

            const toggleSpeech = ()=>{
                const SR = window.SpeechRecognition||window.webkitSpeechRecognition;
                if(!SR){alert('Navegador não suporta voz.');return}
                if(isListening){setIsListening(false);return}
                const r = new SR();r.lang='pt-BR';r.interimResults=false;r.maxAlternatives=1;
                r.onstart=()=>setIsListening(true);r.onresult=(e)=>{setInputText(e.results[0][0].transcript);setIsListening(false)};
                r.onerror=r.onend=()=>setIsListening(false);r.start();
            };

            const sendMessage = (e)=>{
                e.preventDefault();if(!inputText.trim())return;
                const msg = inputText;setInputText('');
                setMessages(p=>[...p,{sender:'user',text:msg}]);
                setTimeout(()=>{
                    const w=lastWeather.current;
                    let resp="Varredura regular em Mesquita. Sem alertas críticos.";
                    const l=msg.toLowerCase();
                    if(l.includes('chuva')||l.includes('clima')||l.includes('tempo')){
                        if(w)resp=`📡 LEITURA REAL (Mesquita/RJ):\n• Chuva: ${w.precip} mm\n• Vento: ${w.wind} km/h\n• Temp: ${w.temp}°C\n• Umidade: ${w.humidade}%\n• Condição: ${w.cond}`;
                        else resp="Aguardando sincronização. Toque em SINCRONIZAR.";
                    }else if(l.includes('sarapuí')||l.includes('eugênia')||l.includes('rio'))resp="Sensores nos rios Sarapuí e Dona Eugênia normais.";
                    else if(l.includes('sebinho')||l.includes('amazonas'))resp="Setor Sebinho/Amazonas sob observação preventiva.";
                    else if(l.includes('alerta')||l.includes('emergência'))resp="Emergências: Ligue 199 (Defesa Civil) ou 193 (Bombeiros).";
                    setMessages(p=>[...p,{sender:'sarah',text:resp}]);
                },800);
            };

            return (
                <div className="flex flex-col min-h-screen max-w-md mx-auto bg-darkbg border-x border-slate-800 shadow-2xl">
                    <header className="p-4 bg-cardbg border-b border-slate-700 flex justify-between items-center">
                        <div>
                            <h1 className="text-xs font-bold tracking-wider text-accent">DEFESA CIVIL COMUNITÁRIA</h1>
                            <p className="text-[11px] text-slate-400">SARAH IA v6.2 ULTRA • Mesquita/RJ</p>
                        </div>
                        <span className="text-[10px] px-2 py-1 bg-cyan-900 text-cyan-200 rounded font-semibold">Cidadão Sensor</span>
                    </header>
                    <main className="p-4 flex-1 space-y-4">
                        <MapaMonitor onWeatherUpdate={handleWeather}/>
                        <section className="bg-cardbg p-3 rounded-lg border border-slate-700 flex flex-col h-80">
                            <div className="flex items-center justify-between border-b border-slate-700 pb-2 mb-2">
                                <span className="text-xs font-bold text-accent tracking-wider">CANAL DE DIÁLOGO</span>
                                <span className={`text-[10px] px-2 py-0.5 rounded ${isListening?'bg-red-900 text-red-200 animate-pulse':'bg-cyan-900 text-cyan-200'}`}>{isListening?'Ouvindo...':'Pronta'}</span>
                            </div>
                            <div className="flex-1 overflow-y-auto space-y-2 pr-1 text-xs whitespace-pre-line">
                                {messages.map((m,i)=>(
                                    <div key={i} className={`flex ${m.sender==='user'?'justify-end':'justify-start'}`}>
                                        <div className={`p-2.5 rounded-lg max-w-[85%] ${m.sender==='user'?'bg-cyan-900 text-cyan-100':'bg-slate-800 text-slate-200 border border-slate-700'}`}>{m.text}</div>
                                    </div>
                                ))}
                            </div>
                            <form onSubmit={sendMessage} className="mt-2 flex gap-2 pt-2 border-t border-slate-700">
                                <input type="text" value={inputText} onChange={e=>setInputText(e.target.value)} placeholder="Comando..." className="flex-1 bg-slate-900 border border-slate-700 rounded px-3 py-2 text-xs text-slate-200 focus:outline-none focus:border-accent"/>
                                <button type="button" onClick={toggleSpeech} className={`p-2 rounded border transition ${isListening?'bg-red-600 border-red-500 text-white':'bg-slate-800 border-slate-700 text-slate-300 hover:bg-slate-700'}`}>🎙️</button>
                                <button type="submit" className="bg-cyan-700 hover:bg-cyan-600 text-white px-3 py-2 rounded text-xs font-semibold transition">Enviar</button>
                            </form>
                        </section>
                        <a href="tel:199" className="block w-full text-center bg-gradient-to-r from-rose-700 to-red-500 text-white py-3 rounded-lg font-bold text-sm shadow-lg shadow-red-900/40 animate-pulse">🚨 ACIONAR DEFESA CIVIL — 199</a>
                    </main>
                    <footer className="p-3 bg-cardbg border-t border-slate-700 text-center text-[10px] text-slate-400">
                        Grupo Comunitário A Chave da Esperança
                    </footer>
                </div>
            );
        }
        ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
    </script>
</body>
</html>
