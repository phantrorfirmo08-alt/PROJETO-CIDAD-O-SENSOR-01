    ctx.fillStyle = shieldFill;
    ctx.fill();

    ctx.lineWidth = 6;
    ctx.strokeStyle = '#00F2FE';
    ctx.stroke();
    ctx.restore();

    ctx.beginPath();
    ctx.arc(256, 245, 92, 0, Math.PI * 2);
    ctx.strokeStyle = '#00FF9D';
    ctx.lineWidth = 3;
    ctx.stroke();

    const coreGrad = ctx.createRadialGradient(256, 245, 5, 256, 245, 65);
    coreGrad.addColorStop(0, '#00F2FE');
    coreGrad.addColorStop(1, '#041125');
    ctx.beginPath();
    ctx.arc(256, 245, 65, 0, Math.PI * 2);
    ctx.fillStyle = coreGrad;
    ctx.fill();

    ctx.fillStyle = '#FFFFFF';
    ctx.font = '900 34px Orbitron, sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('CLIMA', 256, 242);

    ctx.fillStyle = '#00FF9D';
    ctx.font = '800 20px JetBrains Mono, monospace';
    ctx.fillText('& DADOS PÚBLICOS', 256, 272);

    ctx.fillStyle = '#38BDF8';
    ctx.font = '700 15px JetBrains Mono, monospace';
    ctx.fillText('CIDADÃO SENSOR • MESQUITA RJ', 256, 480);

    canvas.toBlob((blob) => {
      if (blob) {
        resolve(new File([blob], 'BASE_CLIMATICA_TATICA.png', { type: 'image/png' }));
      } else {
        resolve(null);
      }
    }, 'image/png');
  });
}

function falarRadio(texto) {
  if (!("speechSynthesis" in window)) return;
  window.speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(texto);
  u.lang = "pt-BR"; u.rate = 1.02; u.pitch = 1.02;
  const v = window.speechSynthesis.getVoices().find(x => x.lang.includes("pt-BR"));
  if (v) u.voice = v;
  window.speechSynthesis.speak(u);
}

        const finalizar = (gpsTxt) => {
            const ultimaMsg = base + gpsTxt;
            if(navigator.clipboard) navigator.clipboard.writeText(ultimaMsg).catch(()=>{});
            const agoraStr = tipo + ' - ' + new Date().toLocaleString('pt-BR');
            localStorage.setItem('cadeUltimoSOS', agoraStr);
            setHistoricoSOS('Último SOS: ' + agoraStr);
            setStatusSOS('✅ Mensagem copiada! Abrindo o grupo GADE... é só COLAR e ENVIAR.');
            window.open(GRUPO_GADE, '_blank');
        };

        if(navigator.geolocation){
            navigator.geolocation.getCurrentPosition(
                p => finalizar(`\nGPS: https://maps.google.com/?q=${p.coords.latitude},${p.coords.longitude}`),
                () => finalizar('\nGPS: não disponível'),
                {timeout:8000}
            );
        } else {
            finalizar('\nGPS: não disponível');
        }
    };

                    <button onClick={() => sosCADE('PRECISO DE AJUDA')} style={{background:'#ff3b30', color:'#fff', fontWeight:'bold', border:'none', padding:'14px', borderRadius:'10px', cursor:'pointer'}}>🆘 PRECISO DE AJUDA</button>
                    <button onClick={() => sosCADE('ESTOU BEM')} style={{background:'#00ff88', color:'#000', fontWeight:'bold', border:'none', padding:'14px', borderRadius:'10px', cursor:'pointer'}}>✅ TÔ BEM</button>

                    <button onClick={() => sosCADE('PRECISO DE REMÉDIO / COMIDA / ÁGUA')} style={{background:'#00e5ff', color:'#000', fontWeight:'bold', border:'none', padding:'14px', borderRadius:'10px', cursor:'pointer'}}>💊 REMÉDIO / ÁGUA</button>

}

function RadarMeteorologicoModule({ showToast }) {
  const [dados, setDados] = useState({});
  const [status, setStatus] = useState('Conectando Open-Meteo...');
  const [cidadeSel1, setCidadeSel1] = useState('Mesquita');
  const [cidadeSel2, setCidadeSel2] = useState('Nova Iguaçu');
  const [modoVisualizacao, setModoVisualizacao] = useState('radar');
  const [iframeKey, setIframeKey] = useState(0);

  const [hourlyData, setHourlyData] = useState(null);
  const chartTempRef = useRef(null);
  const chartRainRef = useRef(null);

  function corPorChuva(p){
    if(p >= 70) return '#7C4DFF';
    if(p >= 40) return '#FF0055';
    if(p >= 20) return '#FFB703';
    return '#00FF9D';
  }
  function textoPorChuva(p){
    if(p >= 70) return 'Muito forte';
    if(p >= 40) return 'Forte';
    if(p >= 20) return 'Moderada';
    return 'Fraca / Estável';
  }

  useEffect(() => {
    async function carregar(){
      try{
        const lats = MUNICIPIOS_92.map(c => c.lat).join(',');
        const lons = MUNICIPIOS_92.map(c => c.lon).join(',');
        const url = `https://api.open-meteo.com/v1/forecast?latitude=${lats}&longitude=${lons}&current=temperature_2m,relative_humidity_2m,wind_speed_10m&hourly=temperature_2m,precipitation_probability,wind_speed_10m&timezone=America%2FSao_Paulo&forecast_days=1`;
        const r = await fetch(url);
        const j = await r.json();
        const arr = Array.isArray(j) ? j : [j];
        const mapa = {};
        arr.forEach((item, i) => {
          const c = MUNICIPIOS_92[i];
          if(!c) return;
          const hora = new Date().getHours();
          mapa[c.n] = {
            temp: item.current.temperature_2m,
            umi: item.current.relative_humidity_2m,
            vento: item.current.wind_speed_10m,
            chuva: item.hourly.precipitation_probability[hora] || 0,
            hourly: item.hourly
          };
        });
        setDados(mapa);
        if(mapa[cidadeSel1] && mapa[cidadeSel1].hourly) {
          setHourlyData(mapa[cidadeSel1].hourly);
          desenharGraficosHorarios(mapa[cidadeSel1].hourly);
        }
        setStatus('Open-Meteo conectado · 92 municípios · Dados reais');
      }catch(e){
        setStatus('Sem conexão · Tentando de novo');
      }
    }
    carregar();
    const t = setInterval(carregar, 600000);
    return () => clearInterval(t);
  }, [cidadeSel1]);

  const desenharGraficoCanvas = (canvasRef, valores, cores, sufixo) => {
    const cv = canvasRef.current;
    if(!cv) return;
    const ctx = cv.getContext('2d');
    const W = cv.width = 340, H = cv.height = 140;
    ctx.clearRect(0,0,W,H);
    const max = Math.max(...valores, 1);
    const step = W / valores.length;
    const horaAtual = new Date().getHours();

    valores.forEach((v,i)=>{
      const h = (v/max)*(H-35);
      const x = i*step+4;
      const grad = ctx.createLinearGradient(0,H-h,0,H);
      grad.addColorStop(0,cores[0]);
      grad.addColorStop(1,cores[1]);
      ctx.fillStyle = grad;
      ctx.fillRect(x, H-h-20, step-6, h);
      ctx.fillStyle = '#FFFFFF';
      ctx.font = 'bold 9px monospace';
      ctx.textAlign = 'center';
      ctx.fillText(v+sufixo, x+(step/2), H-h-23);

      const horaLabel = `${String((horaAtual + i) % 24).padStart(2, '0')}h`;
      ctx.fillStyle = '#00F2FE';
      ctx.font = '600 8px monospace';
      ctx.fillText(horaLabel, x+(step/2), H-6);
    });
  };

  const desenharGraficosHorarios = (hourly) => {
    if(!hourly) return;
    const h = new Date().getHours();
    const temps=[], chuvas=[];
    for(let i=0; i<12; i++){
      const idx = (h+i)%24;
      temps.push(Math.round(hourly.temperature_2m[idx] || 25));
      chuvas.push(hourly.precipitation_probability[idx] || 0);
    }
    setTimeout(() => {
      desenharGraficoCanvas(chartTempRef, temps, ['#ff5252','#ffca28'], '°C');
      desenharGraficoCanvas(chartRainRef, chuvas, ['#7c4dff','#29b6f6'], '%');
    }, 100);
  };

  const PONTOS_BACIAS = [
    { rh: 'RH I', nome: 'Baía da Ilha Grande', lat: -23.05, lon: -44.35 },
    { rh: 'RH II', nome: 'Guandu', lat: -22.65, lon: -43.70 },
    { rh: 'RH III', nome: 'Médio Paraíba do Sul', lat: -22.45, lon: -44.15 },
    { rh: 'RH IV', nome: 'Piabanha', lat: -22.35, lon: -43.05 },
    { rh: 'RH V', nome: 'Baía de Guanabara', lat: -22.75, lon: -43.15 },
    { rh: 'RH VI', nome: 'Lagos São João', lat: -22.85, lon: -42.30 },
    { rh: 'RH VII', nome: 'Rio Dois Rios', lat: -22.00, lon: -42.35 },
    { rh: 'RH VIII', nome: 'Macaé e das Ostras', lat: -22.30, lon: -41.95 },
    { rh: 'RH IX', nome: 'Baixo Paraíba do Sul', lat: -21.55, lon: -41.45 },
  ];

  function posRadar(c){
    const minLon = -44.75, maxLon = -41.0, minLat = -23.25, maxLat = -20.9;
    return {
      x: 7 + ((c.lon - minLon) / (maxLon - minLon)) * 86,
      y: 7 + ((maxLat - c.lat) / (maxLat - minLat)) * 86
    };
  }

  function falar(cNome){
    const d = dados[cNome];
    if(!d) return;
    try{
      window.speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(`Em ${cNome}, agora está ${d.temp} graus. Chance de chuva ${d.chuva} por cento. Vento ${d.vento} quilômetros por hora.`);
      u.lang = 'pt-BR';
      window.speechSynthesis.speak(u);
    }catch(e){}
  }

  const d1 = dados[cidadeSel1];
  const d2 = dados[cidadeSel2];

  return (
    <div className="space-y-4 w-full font-mono">
      <div className="rounded-[22px] border border-cyan-400/40 bg-[#02122A] p-4 space-y-3 shadow-[0_0_30px_rgba(0,255,255,0.15)] relative overflow-hidden">
        <div className="flex justify-between items-start gap-2">
          <h3 className="text-[15px] leading-tight font-black text-cyan-300 uppercase tracking-widest text-center flex-1">
            Radar Meteorológico & Previsão Horária (Compatível com Telões e TVs 65")
          </h3>
          <span className="text-[9px] text-emerald-400 font-bold text-right leading-tight shrink-0 pt-1">
            GOES-19 • FLUXO ATIVO
          </span>
        </div>
        <p className="text-[11px] text-slate-300 text-center leading-relaxed">
          {status} Varredura tática com rotação contínua e monitoramento dual de municípios.
        </p>
        <div className="grid grid-cols-2 gap-2">
          <button onClick={() => setModoVisualizacao('radar')} className={`cyber-button text-[10px] py-2 ${modoVisualizacao === 'radar' ? '!bg-cyan-400 !text-void' : ''}`}>RADAR TÁTICO</button>
          <button onClick={() => setModoVisualizacao('satelite')} className={`cyber-button text-[10px] py-2 ${modoVisualizacao === 'satelite' ? '!bg-cyan-400 !text-void' : ''}`}>SATÉLITE GOES-19 (HD)</button>
        </div>
        <div className="grid grid-cols-1 sm:grid-cols-2 gap-2 bg-black/40 p-3 rounded-xl border border-cyan-400/30">
          <div className="space-y-1">
            <label className="text-[8px] text-cyan-300 font-bold uppercase block">Alvo Principal (1):</label>
            <select value={cidadeSel1} onChange={(e) => {
              setCidadeSel1(e.target.value);
              falar(e.target.value);
              if(dados[e.target.value]?.hourly) {
                setHourlyData(dados[e.target.value].hourly);
                desenharGraficosHorarios(dados[e.target.value].hourly);
              }
            }} className="w-full bg-[#030712] text-white border border-cyan-400/40 rounded-xl p-2 text-xs font-bold cursor-pointer">
              {MUNICIPIOS_92.map((m, idx) => <option key={idx} value={m.n}>{m.n}</option>)}
            </select>
          </div>
          <div className="space-y-1">
            <label className="text-[8px] text-cyan-300 font-bold uppercase block">Alvo Secundário (2):</label>
            <select value={cidadeSel2} onChange={(e) => {
              setCidadeSel2(e.target.value);
              falar(e.target.value);
            }} className="w-full bg-[#030712] text-white border border-cyan-400/40 rounded-xl p-2 text-xs font-bold cursor-pointer">
              {MUNICIPIOS_92.map((m, idx) => <option key={idx} value={m.n}>{m.n}</option>)}
            </select>
          </div>
        </div>
        {modoVisualizacao === 'radar' && (
          <div className="relative w-full aspect-square rounded-full border-[3px] border-cyan-400/70 overflow-hidden mx-auto shadow-[inset_0_0_40px_rgba(0,255,255,0.15),0_0_30px_rgba(0,255,255,0.2)] max-w-[380px]" style={{ background: "radial-gradient(circle at 50% 50%, #0A2A4A 0%, #041830 55%, #020A1A 100%)" }}>
            <div className="absolute rounded-full border border-cyan-400/40 pointer-events-none" style={{ width: "92%", height: "92%", left: "50%", top: "50%", transform: "translate(-50%,-50%)" }} />
            <div className="absolute rounded-full border border-cyan-400/40 pointer-events-none" style={{ width: "66%", height: "66%", left: "50%", top: "50%", transform: "translate(-50%,-50%)" }} />
            <div className="absolute rounded-full border border-cyan-400/50 pointer-events-none" style={{ width: "38%", height: "38%", left: "50%", top: "50%", transform: "translate(-50%,-50%)" }} />
            <div className="absolute left-1/2 top-0 bottom-0 w-px bg-cyan-400/40 pointer-events-none" />
            <div className="absolute top-1/2 left-0 right-0 h-px bg-cyan-400/40 pointer-events-none" />
            <div className="absolute inset-0 pointer-events-none animate-radar-sweep" style={{ background: "conic-gradient(from 0deg, rgba(0,255,255,0.45) 0deg, rgba(0,255,255,0.15) 50deg, transparent 90deg)" }} />
            {PONTOS_BACIAS.map(b => {
              const p = posRadar(b);
              return (
                <div key={b.rh} className="absolute text-center cursor-pointer z-[6]" style={{ left: p.x + "%", top: p.y + "%", transform: "translate(-50%,-50%)" }} onClick={() => setCidadeSel1(b.nome)}>

                </div>
              );
            })}
            {MUNICIPIOS_92.map(c => {
              const p = posRadar(c);
              const d = dados[c.n];
              const chuva = d ? d.chuva : 0;
              const cor = d ? corPorChuva(chuva) : '#94A3B8';
              const is1 = c.n === cidadeSel1;

              const sel = is1 || is2;
              return (
                <div key={c.n} onClick={() => {

                  falar(c.n);
                  if(dados[c.n]?.hourly) {
                    setHourlyData(dados[c.n].hourly);
                    desenharGraficosHorarios(dados[c.n].hourly);

                }} className="absolute text-center cursor-pointer z-[5]" style={{ left: p.x + "%", top: p.y + "%", transform: "translate(-50%,-50%)" }}>

        {modoVisualizacao === 'satelite' && (
          <div className="relative w-full aspect-video rounded-2xl overflow-hidden border border-cyan-400/50 bg-black">

function ModuloCidadaoSensorModule({ onGoToDashboard, showToast }) {
  const [petKg, setPetKg] = React.useState(10);
  const [aluminioKg, setAluminioKg] = React.useState(3);
  const [ferroKg, setFerroKg] = React.useState(15);
  const [papelaoKg, setPapelaoKg] = React.useState(20);
  const [vidroKg, setVidroKg] = React.useState(5);
  const [oleoL, setOleoL] = React.useState(4);

  const [precoPet] = React.useState(2.50);
  const [precoAluminio] = React.useState(8.00);
  const [precoFerro] = React.useState(1.20);
  const [precoPapelao] = React.useState(0.70);
  const [precoVidro] = React.useState(0.35);
  const [precoOleo] = React.useState(3.00);

  const [btConectado, setBtConectado] = React.useState(false);
  const [btStatus, setBtStatus] = React.useState("Desconectado");

  const totalPet = petKg * precoPet;
  const totalAluminio = aluminioKg * precoAluminio;
  const totalFerro = ferroKg * precoFerro;
  const totalPapelao = papelaoKg * precoPapelao;
  const totalVidro = vidroKg * precoVidro;
  const totalOleo = oleoL * precoOleo;

  const valorTotalReciclagem = totalPet + totalAluminio + totalFerro + totalPapelao + totalVidro + totalOleo;
  const pesoTotalKg = Number(petKg) + Number(aluminioKg) + Number(ferroKg) + Number(papelaoKg) + Number(vidroKg) + Number(oleoL);

  const aguaEconomizadaL = (petKg * 24) + (aluminioKg * 40) + (papelaoKg * 15);
  const co2EvitadoKg = (petKg * 1.5) + (aluminioKg * 9.0) + (ferroKg * 1.8) + (papelaoKg * 0.9);
  const volumeDesobstruidoM3 = (pesoTotalKg * 0.0035).toFixed(2);

  const conectarBalancaBT = async () => {
    if (!navigator.bluetooth) {
      if (typeof showToast === 'function') showToast("Web Bluetooth não suportado.");
      return;
    }
    try {
      setBtStatus("Buscando balança...");
      const device = await navigator.bluetooth.requestDevice({
        acceptAllDevices: true,
        optionalServices: ['battery_service', '0000181d-0000-1000-8000-00805f9b34fb']
      });
      setBtConectado(true);
      setBtStatus(`Conectado: ${device.name || 'Balança BT'}`);
      if (typeof showToast === 'function') showToast(`Balança pareada: ${device.name || 'OK'}`);
    } catch(e) {
      setBtConectado(false);
      setBtStatus("Desconectado");
      if (typeof showToast === 'function') showToast("Conexão Bluetooth cancelada.");

  const gerarReciboColeta = () => {

    if (navigator.clipboard) {
      navigator.clipboard.writeText(textoRecibo);
      if (typeof showToast === 'function') showToast(`Recibo ${prot} copiado.`);
    }
    window.open(`https://api.whatsapp.com/send?text=${encodeURIComponent(textoRecibo)}`, '_blank');
  };

  return (
    <div className="space-y-4 max-w-5xl mx-auto font-mono">
      <div className="cyber-card p-5 sm:p-6 rounded-[28px] shadow-xl space-y-5 border border-cyberCyan/40">

              <span className="text-cyberCyan">[BALANÇA]</span> CIDADÃO SENSOR - BALANÇA DIGITAL & ESG
            </h2>

          </div>
          <button onClick={onGoToDashboard} className="cyber-button text-[10px] py-2 px-4">PAINEL DE CONTROLE</button>
        </div>

        <div className="bg-void/90 border border-cyberCyan/30 rounded-2xl p-3.5 flex flex-col sm:flex-row items-center justify-between gap-3 shadow-inner">
          <div className="flex items-center gap-2.5">
            <span className={`w-3 h-3 rounded-full ${btConectado ? 'bg-cyberGreen animate-ping' : 'bg-cyberRose'}`}></span>

        <div className="bg-void/90 border border-cyberCyan/40 rounded-2xl p-4 space-y-4 shadow-inner">

function RedeAlquinoHardwareModule({ onGoToDashboard, showToast }) {
  const [sensorId] = React.useState("ALQ-92-MESQUITA");
  const [hardwareIpUrl, setHardwareIpUrl] = React.useState(() => {
    try { return localStorage.getItem("raru_alquino_ip") || "http://192.168.4.1/data"; } catch(e) { return "http://192.168.4.1/data"; }
  });
  const [statusHardware, setStatusHardware] = React.useState("AGUARDANDO CONEXÃO IP");
  const [gasLevel, setGasLevel] = React.useState("-- PPM");
  const [hidroLevel, setHidroLevel] = React.useState("-- m");
  const [tempHardware, setTempHardware] = React.useState("-- C");
  const [isConnecting, setIsConnecting] = React.useState(false);

  const salvarEConectarIP = async () => {
    try {
      localStorage.setItem("raru_alquino_ip", hardwareIpUrl);
      setIsConnecting(true);
      setStatusHardware("CONECTANDO AO IP...");
      showToast(`Conectando ao IP: ${hardwareIpUrl}`);
      const res = await fetch(hardwareIpUrl, { method: 'GET', mode: 'cors' });
      const data = await res.json();
      if(data) {
        setGasLevel(data.gas ? `${data.gas} PPM` : "14 PPM (Normal)");
        setHidroLevel(data.nivelAgua ? `${data.nivelAgua} m` : "0.35 m (Estável)");
        setTempHardware(data.temperatura ? `${data.temperatura} C` : "27.1 C");
        setStatusHardware("CONECTADO (ONLINE VIA IP)");
        showToast("Hardware Alquino Sincronizado.");
      }
    } catch(err) {
      setTimeout(() => {
        const gasRand = Math.floor(Math.random() * 25 + 8);
        const hidroRand = (Math.random() * 0.4 + 0.1).toFixed(2);
        setGasLevel(`${gasRand} PPM (Normal)`);
        setHidroLevel(`${hidroRand} m (Estável)`);
        setTempHardware("26.8 C");
        setStatusHardware("SIMULAÇÃO ATIVA (IP LOCAL)");
        showToast("Modo simulação IP ativado.");
      }, 800);
    } finally {
      setIsConnecting(false);
    }
  };

  return (
    <div className="space-y-3.5 w-full font-mono max-w-4xl mx-auto">
      <div className="cyber-card space-y-3.5 border border-cyberCyan/40 shadow-2xl p-4">

          <div className="space-y-0.5">
            <h2 className="font-display text-[11px] font-black text-white tracking-widest flex items-center gap-1.5">
              REDE ALQUINO - HARDWARE FÍSICO
            </h2>
            <p className="text-[8px] font-mono text-cyberCyan font-bold">ACOPLAMENTO DE APARELHAGEM TECNOLÓGICA</p>
          </div>
          <button onClick={onGoToDashboard} className="cyber-button text-[10px] py-2 px-3">PAINEL</button>
        </div>

        <div className="bg-void/90 border border-cyberCyan/40 p-3 rounded-xl space-y-2 shadow-inner">
          <label className="text-[9px] text-cyberCyan font-bold uppercase block">Endereço IP / URL do Microcontrolador</label>
          <div className="flex flex-col sm:flex-row gap-2">
            <input type="text" value={hardwareIpUrl} onChange={(e) => setHardwareIpUrl(e.target.value)} placeholder="Ex: http://192.168.4.1/data" className="flex-1 bg-deepSpace border border-cyberCyan/40 rounded-xl p-2.5 text-xs text-white font-mono touch-manipulation" />

              {isConnecting ? "CONECTANDO..." : "CONECTAR IP"}
            </button>
          </div>
        </div>

        <div className="grid grid-cols-2 sm:grid-cols-4 gap-2.5">
          <div className="bg-void/90 border border-cyberCyan/30 rounded-xl p-3 space-y-0.5">

            <span className="text-[10px] font-bold text-cyberCyan truncate block">{sensorId}</span>

function App() {

    try { 
      const t = localStorage.getItem("raru-cyber-theme") || "dark";
      if (t === 'warm') document.body.classList.add('theme-warm');
      return t;
    } catch(e) { return "dark"; } 
  });

  const [soundEnabled, setSoundEnabled] = React.useState(() => {
    try {
      const s = localStorage.getItem("raru_sound_enabled");
      return s !== "false";
    } catch(e) { return true; }
  });

  const [isSpeaking, setIsSpeaking] = React.useState(false);
  const [isListening, setIsListening] = React.useState(false);
  const [activeTab, setActiveTab] = React.useState("dashboard");
  const [quemSomosOpen, setQuemSomosOpen] = React.useState(false);
  const [isCommandHUDActive, setIsCommandHUDActive] = React.useState(false);
  const [shareModalOpen, setShareModalOpen] = React.useState(false);
  const [toastMsgRef, setToastMsgRef] = React.useState(null);

  const [termsAccepted, setTermsAccepted] = React.useState(() => { try { return localStorage.getItem("raru_cyber_terms") === "1"; } catch(e) { return false; } });
  const [check1, setCheck1] = React.useState(false);
  const [check2, setCheck2] = React.useState(false);

  const [userName, setUserName] = React.useState(() => { try { return localStorage.getItem("raru_user_name") || "Alexander"; } catch(e) { return "Alexander"; } });
  const [nameModalOpen, setNameModalOpen] = React.useState(false);
  const [tempNameInput, setTempNameInput] = React.useState("");

  const [isChatOpen, setIsChatOpen] = React.useState(false);
  const [input, setInput] = React.useState("");
  const [isProcessing, setIsProcessing] = React.useState(false);

  const [vozSelecionada, setVozSelecionada] = React.useState(() => { try { return Number(localStorage.getItem("raru_voz_index")) || 0; } catch(e) { return 0; } });
  const [customTickerText, setCustomTickerText] = React.useState(() => { try { return localStorage.getItem('raru_custom_ticker') || ""; } catch(e) { return ""; } });

  const [localVideos, setLocalVideos] = React.useState(() => { try { const s = localStorage.getItem('raru_local_videos'); return s ? JSON.parse(s) : []; } catch(e) { return []; } });
  const [youtubeVideos, setYoutubeVideos] = React.useState(() => { try { const s = localStorage.getItem('raru_youtube_videos'); return s ? JSON.parse(s) : []; } catch(e) { return []; } });
  const [publicVideos, setPublicVideos] = React.useState(() => { try { const s = localStorage.getItem('raru_public_videos'); return s ? JSON.parse(s) : []; } catch(e) { return []; } });

  const showToast = (msg) => { setToastMsgRef(msg); setTimeout(() => setToastMsgRef(null), 3500); };

  const handleSaveName = (e) => {
    e.preventDefault();
    if (!tempNameInput.trim()) return;
    const nomeLimpo = tempNameInput.trim();
    setUserName(nomeLimpo);
    try { localStorage.setItem("raru_user_name", nomeLimpo); } catch(e) {}
    setNameModalOpen(false);
    setTempNameInput("");
    const saudacao = `Calma, ${nomeLimpo}, tô contigo! Nome gravado na central. Vamo operar junto em Mesquita e no RJ.`;
    setMessages([{ sender: 'assistant', text: saudacao, time: new Date().toLocaleTimeString('pt-BR', {hour: '2-digit', minute:'2-digit'}) }]);
    if (soundEnabled) falarSarah(saudacao, vozSelecionada);
    showToast(`Operador ${nomeLimpo} registrado!`);
  };

  const toggleCommandHUD = () => {
    const elem = document.documentElement;
    if (!isCommandHUDActive) {
      try {
        if (elem.requestFullscreen) elem.requestFullscreen();
        else if (elem.webkitRequestFullscreen) elem.webkitRequestFullscreen();
      } catch (err) {}
      setIsCommandHUDActive(true);
      showToast("REDE AUTOMATIZADA DE RESILIÊNCIA URBANA • HUD TELA CHEIA ATIVO.");
    } else {
      try {
        if (document.exitFullscreen) document.exitFullscreen();
        else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
      } catch (err) {}
      setIsCommandHUDActive(false);
      showToast("Modo Padrão Restabelecido.");
    }
  };

  const openShareFromApp = async () => {
    showToast("Gerando arquivo compacto...");
    const iconeArquivo = await gerarArquivoIconeEscudo();
    if (navigator.share) {
      try {
        const sharePayload = { title: "Base Climática de Monitoramento Tático", text: shareMessageText, url: APP_SHARE_URL };
        if (iconeArquivo && navigator.canShare && navigator.canShare({ files: [iconeArquivo] })) sharePayload.files = [iconeArquivo];
        await navigator.share(sharePayload);
        return;
      } catch (err) {}
    }
    setShareModalOpen(true);
  };

  const toggleTheme = () => {
    setTheme(prev => {
      const next = prev === 'dark' ? 'warm' : 'dark';
      try { 
        localStorage.setItem("raru-cyber-theme", next); 
        if (next === 'warm') {
          document.body.classList.add('theme-warm');
        } else {
          document.body.classList.remove('theme-warm');
        }
      } catch(e) {}
      showToast(next === 'warm' ? 'Modo Claro / Leitura Diurna Ativo' : 'Modo Escuro / Leitura Noturna Ativo');
      return next;
    });
  };

  const toggleListening = () => {
    const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SpeechRec) { showToast("Microfone indisponível."); return; }
    if (isListening) { setIsListening(false); return; }
    try {
      const rec = new SpeechRec();
      rec.lang = "pt-BR";
      rec.onstart = () => setIsListening(true);
      rec.onresult = (event) => { let final = event.results[0][0].transcript; if (final) { setInput(final); setIsListening(false); handleSendDirectCommand(final); } };
      rec.onerror = () => setIsListening(false);
      rec.onend = () => setIsListening(false);
      rec.start();
    } catch (e) { setIsListening(false); }
  };

  const [messages, setMessages] = React.useState(() => {
    const savedName = (() => { try { return localStorage.getItem("raru_user_name") || "Alexander"; } catch(e) { return "Alexander"; } })();
    return [
      {
        sender: 'assistant',
        text: `Calma, ${savedName}, tô contigo! Sou a Sarah, tua parceira de campo sênior aqui no Projeto Cidadão Sensor e no Grupo A Chave da Esperança. Vamo resolver junto qualquer B.O. em Rocha Sobrinho e nos 92 municípios.`,
        time: new Date().toLocaleTimeString('pt-BR', {hour: '2-digit', minute:'2-digit'})
      }
    ];
  });

  const handleSendDirectCommand = async (textCustom) => {
    const textToSend = textCustom !== undefined ? textCustom : input;
    if (!textToSend.trim() || isProcessing) return;
    const timeStr = new Date().toLocaleTimeString('pt-BR', {hour: '2-digit', minute:'2-digit'});

    let nomeAtualizado = userName;
    const matchNome = textToSend.match(/(?:meu nome [ée]|pode me chamar de|eu sou o|eu sou a|sou o|sou a)\s+([A-Za-zÀ-ÖØ-öø-ÿ]+(?:\s+[A-Za-zÀ-ÖØ-öø-ÿ]+)?)/i);
    if (matchNome && matchNome[1]) {
      const extraido = matchNome[1].trim();
      if (extraido.length >= 2 && extraido.length <= 35) {
        nomeAtualizado = extraido.charAt(0).toUpperCase() + extraido.slice(1);
        setUserName(nomeAtualizado);
        try { localStorage.setItem("raru_user_name", nomeAtualizado); } catch(e) {}
        showToast(`Nome atualizado: ${nomeAtualizado}`);
      }
    }

    const novoHistorico = [...messages, { sender: 'user', text: textToSend, time: timeStr }];
    setMessages(novoHistorico);
    setInput("");
    setIsProcessing(true);
    setIsSpeaking(true);

    try {
      const formattedHistory = novoHistorico.map(m => ({
        role: m.sender === 'user' ? 'user' : 'assistant',
        content: m.text
      }));

      const respostaSarah = await chamarSarahGroq(formattedHistory, "Mesquita", "Rocha Sobrinho", activeTab, { status: "Online" }, nomeAtualizado || "Alexander");
      const replyTime = new Date().toLocaleTimeString('pt-BR', {hour: '2-digit', minute:'2-digit'});
      
      setMessages(prev => [...prev, { sender: 'assistant', text: respostaSarah, time: replyTime }]);
      if (soundEnabled) falarSarah(respostaSarah, vozSelecionada);
    } catch (error) {
      const errorMsg = `Calma, ${nomeAtualizado || 'Alexander'}, deu uma instabilidade aqui na rede, mas tô na escuta. Vamo tentar de novo.`;
      setMessages(prev => [...prev, { sender: 'assistant', text: errorMsg, time: new Date().toLocaleTimeString('pt-BR', {hour: '2-digit', minute:'2-digit'}) }]);
    } finally {
      setIsProcessing(false);
      setIsSpeaking(false);
    }
  };

  const openSarahChat = () => setIsChatOpen(true);

  const NAV_TABS = [
    { id: 'dashboard', iconComponent: <IconDashboard className="w-4 h-4"/>, label: 'Painel' },
    { id: 'radar', iconComponent: <IconRadar className="w-4 h-4"/>, label: 'Radar' },
    { id: 'radio', iconComponent: <IconMusic className="w-4 h-4"/>, label: 'Rádio 24h' },
    { id: 'estacao', iconComponent: <IconEstacao className="w-4 h-4"/>, label: 'Estação' },
    { id: 'balanca', iconComponent: <IconBalanca className="w-4 h-4"/>, label: 'Balança' },
    { id: 'alquino', iconComponent: <IconAlquino className="w-4 h-4"/>, label: 'Alquino' },
    { id: 'compartilhar', iconComponent: <IconInstalar className="w-4 h-4"/>, label: 'Instalar' },
    { id: 'quem-somos', iconComponent: <IconQuemSomos className="w-4 h-4"/>, label: 'Sobre' },
    { id: 'admin', iconComponent: <IconAdmin className="w-4 h-4"/>, label: 'Admin' }
  ];

  const handleNavClick = (tabId) => {
    if (tabId === 'compartilhar') openShareFromApp();
    else if (tabId === 'quem-somos') setQuemSomosOpen(true);
    else {
      setActiveTab(tabId);
      const nomeOp = userName || 'Alexander';
      if(tabId === 'dashboard') {
        const txt = `Calma, ${nomeOp}, tô contigo no painel principal. Tudo em ordem por aqui.`;
        if (soundEnabled) falarSarah(txt, vozSelecionada);
      } else if(tabId === 'radar') {
        const txt = `Abri o radar meteorológico pra gente ver o tempo em Mesquita e nos 92 municípios, ${nomeOp}.`;
        if (soundEnabled) falarSarah(txt, vozSelecionada);
      } else if(tabId === 'radio') {
        const txt = `Sintonia das 5 rádios cibernéticas 24 horas aberta pra você curtir, ${nomeOp}.`;
        if (soundEnabled) falarSarah(txt, vozSelecionada);
      } else if(tabId === 'estacao') {
        const txt = `Estação de Sobrevivência e Grupo A Chave da Esperança na área, ${nomeOp}. Rotas e bacias prontas.`;
        if (soundEnabled) falarSarah(txt, vozSelecionada);
      } else if(tabId === 'balanca') {
        const txt = `Balança digital e ESG ativadas, ${nomeOp}. Triagem de resíduos no esquema.`;
        if (soundEnabled) falarSarah(txt, vozSelecionada);
      } else if(tabId === 'alquino') {
        const txt = `Rede Alquino conectada, ${nomeOp}. Monitorando gases e nível hídrico.`;
        if (soundEnabled) falarSarah(txt, vozSelecionada);
      } else if(tabId === 'admin') {
        const txt = `Área restrita de administração aberta, ${nomeOp}.`;
        if (soundEnabled) falarSarah(txt, vozSelecionada);
      }
    }
  };

  return (
    <div className="seu-container-raru">
      {toastMsgRef && <div className="fixed top-12 left-1/2 -translate-x-1/2 z-50 cyber-card px-4 py-2 rounded-2xl font-display text-[10px] font-black text-cyberCyan tracking-wider shadow-2xl border border-cyberCyan/60 animate-bounce">{toastMsgRef}</div>}

      {shareModalOpen && (
        <div className="fixed inset-0 bg-void/90 backdrop-blur-xl z-50 flex items-center justify-center p-4">
          <div className="cyber-card max-w-sm w-full p-4 rounded-2xl space-y-3 text-center shadow-2xl border border-cyberCyan/50">
            <h3 className="font-display text-xs font-black tracking-widest uppercase text-cyberCyan">INSTALAÇÃO</h3>
            <textarea readOnly value={shareMessageText} className="w-full h-16 bg-void border border-cyberCyan/30 rounded-xl p-2.5 text-[9px] text-slate-300 resize-none font-mono" />
            <button onClick={() => setShareModalOpen(false)} className="cyber-button-danger w-full text-xs py-2.5">FECHAR</button>
          </div>
        </div>
      )}

      {termsAccepted && nameModalOpen && (
        <div className="fixed inset-0 bg-void/95 backdrop-blur-xl z-[200] flex items-center justify-center p-4">
          <div className="cyber-card max-w-md w-full p-6 rounded-3xl shadow-2xl space-y-4 border border-cyberCyan text-center font-mono">
            <div className="w-16 h-16 mx-auto overflow-hidden">
              <SarahAnimatedAvatar isSpeaking={true}/>
            </div>
            <h3 className="font-display text-sm font-black text-cyberCyan uppercase tracking-widest">IDENTIFICAÇÃO NA CENTRAL</h3>
            <p className="text-xs text-slate-200 font-sans leading-relaxed">
              Calma! Sou a <strong>Sarah AI</strong>. Como você quer que eu te chame aqui na central?
            </p>
            <form onSubmit={handleSaveName} className="space-y-3">
              <input
                type="text"
                value={tempNameInput}
                onChange={(e) => setTempNameInput(e.target.value)}
                placeholder="Digite seu nome (ex: Alexander)..."
                className="w-full bg-void border border-cyberCyan/60 rounded-xl p-3 text-sm text-white font-mono text-center focus:outline-none focus:border-cyberCyan"
                required
              />
              <button type="submit" className="cyber-button-solid w-full text-xs py-3.5">
                CONFIRMAR E SALVAR MEU NOME
              </button>
            </form>
          </div>
        </div>
      )}

      {!termsAccepted && (
        <div className="fixed inset-0 bg-void/95 z-[200] flex items-center justify-center p-4 overflow-y-auto">
          <div className="cyber-card max-w-md w-full p-5 rounded-3xl shadow-2xl space-y-3.5 my-auto border border-cyberCyan/70 font-mono text-left">
            <div className="w-14 h-14 mx-auto overflow-hidden">
              <SarahAnimatedAvatar isSpeaking={true}/>
            </div>
            <div className="text-center space-y-1">
              <h2 className="font-display text-xs font-black text-white tracking-widest uppercase">Base Climática de Monitoramento Tático</h2>
              <p className="text-[9px] text-cyberCyan font-bold uppercase">TERMO DE RESPONSABILIDADE & LGPD</p>
            </div>
            <div className="bg-commandPanel/90 border border-cyberCyan/30 rounded-xl p-3 text-[11px] text-slate-200 leading-relaxed space-y-2 shadow-inner">
              <p>Em conformidade com a <strong>Lei Federal nº 13.709/2018 (LGPD)</strong>, este aplicativo opera com armazenamento local exclusivo.</p>
            </div>
            <div className="space-y-2 pt-1">
              <label className="flex items-start gap-2.5 cursor-pointer text-[11px] text-slate-200 bg-commandPanel/80 p-2.5 rounded-xl border border-cyberCyan/30">
                <input type="checkbox" checked={check1} onChange={(e) => setCheck1(e.target.checked)} className="mt-0.5 rounded text-cyberCyan w-4 h-4 bg-void cursor-pointer shrink-0" />
                <span>Aceito os termos da LGPD.</span>
              </label>
              <label className="flex items-start gap-2.5 cursor-pointer text-[11px] text-slate-200 bg-commandPanel/80 p-2.5 rounded-xl border border-cyberCyan/30">
                <input type="checkbox" checked={check2} onChange={(e) => setCheck2(e.target.checked)} className="mt-0.5 rounded text-cyberCyan w-4 h-4 bg-void cursor-pointer shrink-0" />
                <span>Autorizo o uso do GPS exclusivamente para vistorias.</span>
              </label>
            </div>
            <button disabled={!check1 || !check2} onClick={() => { setTermsAccepted(true); try { localStorage.setItem("raru_cyber_terms", "1"); } catch(e) {} }} className={`cyber-button-solid w-full text-xs py-3.5 ${check1 && check2 ? '' : 'opacity-50 cursor-not-allowed'}`}>
              CONCORDAR E INICIAR SALA DE COMANDO
            </button>
          </div>
        </div>
      )}

      <header className="cyber-card sticky top-0 z-30 w-full px-4 py-3 border-b border-cyberCyan/40 flex items-center justify-between shadow-lg rounded-2xl mb-2">
        <div className="flex items-center gap-2.5 cursor-pointer" onClick={openSarahChat}>
          <div className="w-8 h-8 overflow-hidden rounded-full border border-cyberCyan shrink-0">
            <SarahLiveSVGAvatar isSpeaking={isSpeaking}/>
          </div>
          <div>
            <h1 className="font-display text-xs sm:text-sm font-black text-white leading-none">Base Climática de Monitoramento Tático</h1>
            <p className="text-[8px] text-cyberCyan font-mono mt-0.5">Operador: {userName || 'Alexander'} • Rocha Sobrinho, Mesquita • 92 Municípios</p>
          </div>
        </div>
        <div className="flex items-center gap-2">
          <button onClick={toggleCommandHUD} className={`cyber-button text-[9px] py-2 px-3 ${isCommandHUDActive ? '!bg-cyberRose !text-void !border-cyberRose animate-pulse' : ''}`}>HUD TELA CHEIA</button>
          <button onClick={() => {
            const novoEstado = !soundEnabled;
            setSoundEnabled(novoEstado);
            try { localStorage.setItem("raru_sound_enabled", String(novoEstado)); } catch(e){}
            if(!novoEstado && "speechSynthesis" in window) {
              window.speechSynthesis.cancel();
            }
            showToast(novoEstado ? "Áudio da Sarah ATIVADO" : "Sarah SILENCIADA (Mudo)");
          }} className={`cyber-button text-[9px] py-2 px-3 ${!soundEnabled ? '!border-red-500 !text-red-400' : ''}`}>
            {soundEnabled ? 'ÁUDIO ON' : 'MUDO'}
          </button>
          <button onClick={toggleTheme} className="cyber-button text-[9px] py-2 px-3">
            {theme === 'dark' ? 'CLARO / DIURNO' : 'ESCURO / NOTURNO'}
          </button>
        </div>
      </header>

      <main className="flex-1 w-full mx-auto py-2 space-y-4 pb-28 relative z-10">
        {activeTab === 'dashboard' && (
          <CardIdentidadeVisualRARU
            handleWhoAmIClick={() => setQuemSomosOpen(true)}
            openSarahChat={openSarahChat}
            openShareFromApp={openShareFromApp}
            setActiveTab={setActiveTab}
            toggleCommandHUD={toggleCommandHUD}
            userName={userName}
            onOpenNameModal={() => { setTempNameInput(userName); setNameModalOpen(true); }}
          />
        )}
        {activeTab === 'radar' && <RadarMeteorologicoModule showToast={showToast}/>}
        {activeTab === 'radio' && <ModuloRadiosCriadasFuturista onGoToDashboard={() => setActiveTab('dashboard')} />}
        {activeTab === 'estacao' && <EstacaoGADEModule showToast={showToast} soundEnabled={soundEnabled} userName={userName} vozSelecionada={vozSelecionada}/>}
        {activeTab === 'balanca' && <ModuloCidadaoSensorModule onGoToDashboard={() => setActiveTab('dashboard')} showToast={showToast} />}
        {activeTab === 'alquino' && <RedeAlquinoHardwareModule onGoToDashboard={() => setActiveTab('dashboard')} showToast={showToast} />}

        <AutomatedObservatoryWidget customTickerText={customTickerText}/>
      </main>

      {termsAccepted && <SarahFabButton isSpeaking={isSpeaking} openSarahChat={openSarahChat}/>}
      <SarahChatOverlay
        isOpen={isChatOpen}
        onClose={() => setIsChatOpen(false)}
        isSpeaking={isSpeaking}
        isProcessing={isProcessing}
        messages={messages}
        input={input}
        setInput={setInput}
        handleSendDirectCommand={handleSendDirectCommand}
        toggleListening={toggleListening}
        isListening={isListening}
        userName={userName}
        onOpenNameModal={() => { setTempNameInput(userName); setNameModalOpen(true); }}
      />
      <QuemSomosModal isOpen={quemSomosOpen} onClose={() => setQuemSomosOpen(false)} userName={userName} />

      <footer className="cyber-card fixed bottom-0 left-0 right-0 z-40 border-t border-cyberCyan/40 px-2.5 py-3 flex items-center justify-between gap-1 shadow-2xl backdrop-blur-xl max-w-[1400px] mx-auto rounded-t-2xl pb-[env(safe-area-inset-bottom)]">
        {NAV_TABS.map(tab => (
          <button key={tab.id} onClick={() => handleNavClick(tab.id)} className={`flex flex-col items-center justify-center gap-0.5 cursor-pointer flex-1 py-1.5 transition touch-manipulation rounded-xl ${activeTab === tab.id ? 'text-cyberCyan bg-cyberCyan/15 border border-cyberCyan/40 shadow-[0_0_8px_rgba(0,242,254,0.3)]' : 'text-slate-400 hover:text-white border border-transparent'}`}>
            {tab.iconComponent}
            <span className="text-[7px] sm:text-[9px] font-black truncate w-full text-center tracking-tighter px-0.5">{tab.label}</span>
          </button>
        ))}
      </footer>
    </div>
  );
}

try {
  const rootElement = document.getElementById('root');
  ReactDOM.createRoot(rootElement).render(<App/>);
} catch (err) {
  document.getElementById('root').innerHTML = `<div style="padding:20px;color:#FF0055;font-family:monospace;">Erro ao iniciar interface: ${err.message}</div>`;
}
</script>
</body>
</html>
