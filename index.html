<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sarapuí Sentinel AI</title>
    <style>
        /* Base e Fundo Futurista */
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
        body { background: radial-gradient(circle at center, #111e30 0%, #070b12 100%); display: flex; flex-direction: column; height: 100vh; overflow: hidden; color: #ffffff; }
        
        /* Botão Sofisticado de Dados - Vidro com Brilho */
        #btn-graficos { position: absolute; top: 20px; right: 20px; padding: 12px 24px; background: rgba(255, 255, 255, 0.05); color: #00e5ff; border: 1px solid rgba(0, 229, 255, 0.3); border-radius: 30px; cursor: pointer; font-weight: bold; z-index: 10; backdrop-filter: blur(10px); transition: all 0.3s ease; box-shadow: 0 0 15px rgba(0, 229, 255, 0.1); }
        #btn-graficos:hover { background: rgba(0, 229, 255, 0.2); box-shadow: 0 0 25px rgba(0, 229, 255, 0.4); transform: translateY(-2px); }
        
        /* Painel Oculto Ultra Elegante */
        #painel-graficos { display: none; position: absolute; top: 85px; left: 5%; width: 90%; background: rgba(10, 18, 32, 0.85); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 20px; padding: 20px; backdrop-filter: blur(20px); z-index: 9; box-shadow: 0 20px 40px rgba(0,0,0,0.5); }
        .grafico-box { background: rgba(255, 255, 255, 0.03); height: 130px; margin-bottom: 15px; border-radius: 14px; border: 1px solid rgba(255, 255, 255, 0.05); display: flex; align-items: center; justify-content: center; color: #8a99ad; font-weight: 500; font-size: 0.95rem; }
        .grafico-box:last-child { margin-bottom: 0; }

        /* Área Central do Mascote */
        #area-mascote { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; position: relative; }
        
        /* Container do Mascote com Anel de Status Dinâmico (Verde Inicial) */
        .avatar-container { position: relative; width: 190px; height: 190px; border-radius: 50%; display: flex; align-items: center; justify-content: center; transition: all 0.5s ease; animation: flutuar 4s ease-in-out infinite; }
        
        /* Classes de Alerta Climático via Glow de Neon */
        .status-bom { border: 4px solid #00ff87; box-shadow: 0 0 30px rgba(0, 255, 135, 0.3); }
        .status-atencao { border: 4px solid #ffcc00; box-shadow: 0 0 30px rgba(255, 204, 0, 0.3); }
        .status-perigo { border: 4px solid #ff3366; box-shadow: 0 0 30px rgba(255, 51, 102, 0.3); }

        /* Imagem do Mascote Ajustada */
        #mascote { width: 170px; height: 170px; border-radius: 50%; object-fit: cover; background: #0f2b46; }

        /* Elementos Virtuais de Olhos Piscando por cima da imagem */
        .olho { position: absolute; width: 22px; height: 14px; background: #00e5ff; border-radius: 50%; top: 82px; box-shadow: 0 0 15px #00e5ff; animation: piscar 5s infinite; }
        .olho.esquerdo { left: 62px; }
        .olho.direito { right: 62px; }

        /* Balão de Fala Sofisticado (Glassmorphism Completo) */
        #balao-fala { background: rgba(255, 255, 255, 0.06); border: 1px solid rgba(255, 255, 255, 0.1); padding: 18px 25px; border-radius: 24px; margin-top: 25px; max-width: 85%; text-align: center; backdrop-filter: blur(12px); box-shadow: 0 10px 25px rgba(0,0,0,0.2); font-size: 1.05rem; line-height: 1.5; color: #e2e8f0; font-weight: 400; min-height: 24px; }

        /* Barra de Controle de Teste de Status */
        #painel-teste { position: absolute; bottom: 95px; display: flex; gap: 8px; z-index: 5; }
        .btn-teste { padding: 6px 12px; border: none; border-radius: 12px; cursor: pointer; font-size: 0.75rem; font-weight: bold; opacity: 0.6; transition: 0.2s; }
        .btn-teste:hover { opacity: 1; }

        /* Barra de Digitação Inferior Sofisticada */
        #container-chat { background: rgba(7, 11, 18, 0.6); padding: 20px; display: flex; align-items: center; gap: 12px; border-top: 1px solid rgba(255, 255, 255, 0.05); backdrop-filter: blur(10px); }
        
        /* Campo de Texto Premium */
        #input-msg { flex: 1; padding: 14px 24px; background: rgba(255, 255, 255, 0.04); border: 1px solid rgba(255, 255, 255, 0.08); border-radius: 30px; outline: none; color: #fff; font-size: 1rem; transition: all 0.3s ease; }
        #input-msg:focus { border-color: rgba(0, 229, 255, 0.5); background: rgba(255, 255, 255, 0.07); box-shadow: 0 0 15px rgba(0, 229, 255, 0.1); }

        /* Botão do Microfone Tecnológico */
        #btn-microfone { background: rgba(255, 255, 255, 0.04); border: 1px solid rgba(255, 255, 255, 0.08); border-radius: 50%; width: 50px; height: 50px; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: all 0.3s ease; color: #a0aec0; }
        #btn-microfone:hover { background: rgba(255, 51, 102, 0.1); border-color: rgba(255, 51, 102, 0.4); color: #ff3366; box-shadow: 0 0 15px rgba(255, 51, 102, 0.2); }

        /* Botão Enviar com Gradiente Metálico */
        #btn-enviar { background: linear-gradient(135deg, #0072ff 0%, #00f2fe 100%); color: white; border: none; padding: 0 28px; height: 50px; border-radius: 25px; cursor: pointer; font-weight: bold; font-size: 0.95rem; box-shadow: 0 4px 15px rgba(0, 114, 255, 0.3); transition: all 0.3s ease; }
        #btn-enviar:hover { box-shadow: 0 6px 20px rgba(0, 242, 254, 0.5); transform: translateY(-1px); }

        /* Animações Avançadas */
        @keyframes flutuar {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-12px); }
        }
        @keyframes piscar {
            0%, 45%, 55%, 100% { transform: scaleY(1); }
            50% { transform: scaleY(0.1); }
        }
    </style>
</head>
<body>

    <!-- Botão Superior de Dados Ocultos -->
    <button id="btn-graficos" onclick="alternarGraficos()">📊 Painel de Dados</button>

    <!-- Painel de Gráficos Ocultos -->
    <div id="painel-graficos">
        <div class="grafico-box">☁️ Telemetria Atmosférica (Camadas do Céu / Precipitação Radar)</div>
        <div class="grafico-box">🌊 Nível Hidrográfico da Bacia do Rio Sarapuí (Sensores de Escoamento)</div>
    </div>

    <!-- Centro da Interface: Mascote Tecnológico -->
    <div id="area-mascote">
        <div class="avatar-container status-bom" id="anel-status">
            <img id="mascote" src="mascote.png" alt="Sarapuí AI">
            <div class="olho esquerdo"></div>
            <div class="olho direito"></div>
        </div>
        
        <div id="balao-fala"></div>

        <!-- Seletor de Teste de Clima -->
        <div id="painel-teste">
            <button class="btn-teste" style="background: #00ff87; color: #000;" onclick="mudarStatus('bom')">Bom</button>
            <button class="btn-teste" style="background: #ffcc00; color: #000;" onclick="mudarStatus('atencao')">Atenção</button>
            <button class="btn-teste" style="background: #ff3366; color: #fff;" onclick="mudarStatus('perigo')">Perigo</button>
        </div>
    </div>

    <!-- Caixa de Entrada e Comandos de Voz Premium -->
    <div id="container-chat">
        <button id="btn-microfone" title="Ativar Microfone" onclick="gravarVoz()">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 1v10M19 10a7 7 0 0 1-14 0M12 21v2M5 23h14"/></svg>
        </button>
        <input type="text" id="input-msg" placeholder="Consulte dados de clima ou nível da bacia...">
        <button id="btn-enviar" onclick="enviarMensagem()">Enviar</button>
    </div>

    <script>
        let idIntervaloDigitacao;
        function falarTexto(texto) {
            const balao = document.getElementById('balao-fala');
            balao.innerHTML = ""; 
            clearInterval(idIntervaloDigitacao);

            let i = 0;
            idIntervaloDigitacao = setInterval(() => {
                if (i < texto.length) {
                    balao.innerHTML += texto.charAt(i);
                    i++;
                } else {
                    clearInterval(idIntervaloDigitacao);
                }
            }, 30);
        }

        window.onload = function() {
            falarTexto("Sistemas online. Monitorando bacia hidrográfica do Rio Sarapuí e condições atmosféricas em tempo real. Como posso ajudar?");
        };

        function mudarStatus(clima) {
            const anel = document.getElementById('anel-status');
            anel.className = "avatar-container"; 
            
            if(clima === 'bom') {
                anel.classList.add('status-bom');
                falarTexto("Tempo estável na bacia. Sem riscos iminentes de elevação do Rio Sarapuí.");
            } else if(clima === 'atencao') {
                anel.classList.add('status-atencao');
                falarTexto("Atenção: Núcleos de chuva se aproximando da cabeceira do Rio Sarapuí. Monitoramento intensificado.");
            } else if(clima === 'perigo') {
                anel.classList.add('status-perigo');
                falarTexto("ALERTA MÁXIMO: Risco iminente de transbordo na bacia do Rio Sarapuí. Acionando protocolos de emergência!");
            }
        }

        function alternarGraficos() {
            const painel = document.getElementById('painel-graficos');
            painel.style.display = painel.style.display === 'block' ? 'none' : 'block';
        }

        function enviarMensagem() {
            const input = document.getElementById('input-msg');
            const texto = input.value.trim();
            if (texto) {
                falarTexto("Analisando parâmetro: \"" + texto + "\". Consultando histórico e sensores da bacia...");
                input.value = '';
            }
        }

        function gravarVoz() {
            falarTexto("Escutando comandos de voz... Conectando ao módulo de processamento de áudio.");
        }

        document.getElementById('input-msg').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                enviarMensagem();
            }
        });
    </script>
</body>
</html>
