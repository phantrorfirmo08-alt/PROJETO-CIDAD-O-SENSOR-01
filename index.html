        function RadarMeteorologicoModule({ showToast }) {
            const [dados, setDados] = useState({});
            const [status, setStatus] = useState('Conectando Open-Meteo...');
            const [cidadeSel1, setCidadeSel1] = useState('Mesquita');
            const [cidadeSel2, setCidadeSel2] = useState('Nova Iguaçu');
            const [modoVisualizacao, setModoVisualizacao] = useState('radar');
            const [iframeKey, setIframeKey] = useState(0);

            const [hourlyData, setHourlyData] = useState(null);
            const chartTempRef = useRef(null);
            const chartRainRef = useRef(null);

            function corPorChuva(p){
                if(p >= 70) return '#7C4DFF'; if(p >= 40) return '#FF0055'; if(p >= 20) return '#FFB703'; return '#00FF9D';
            }
            function textoPorChuva(p){
                if(p >= 70) return 'Muito forte'; if(p >= 40) return 'Forte'; if(p >= 20) return 'Moderada'; return 'Fraca / Estável';
            }

            useEffect(() => {
                async function carregar(){
                    try{
                        const lats = MUNICIPIOS_92.map(c => c.lat).join(',');
                        const lons = MUNICIPIOS_92.map(c => c.lon).join(',');
                        const url = `https://api.open-meteo.com/v1/forecast?latitude=${lats}&longitude=${lons}&current=temperature_2m,relative_humidity_2m,wind_speed_10m&hourly=temperature_2m,precipitation_probability,wind_speed_10m&timezone=America%2FSao_Paulo&forecast_days=1`;
                        const r = await fetch(url);
                        const j = await r.json();
                        const arr = Array.isArray(j) ? j : [j];
                        const mapa = {};
                        arr.forEach((item, i) => {
                            const c = MUNICIPIOS_92[i];
                            if(!c) return;
                            const hora = new Date().getHours();
                            mapa[c.n] = {
                                temp: item.current.temperature_2m,
                                umi: item.current.relative_humidity_2m,
                                vento: item.current.wind_speed_10m,
                                chuva: item.hourly.precipitation_probability[hora] || 0,
                                hourly: item.hourly
                            };
                        });
                        setDados(mapa);
                        if(mapa[cidadeSel1] && mapa[cidadeSel1].hourly) {
                            setHourlyData(mapa[cidadeSel1].hourly);
                            desenharGraficosHorarios(mapa[cidadeSel1].hourly);
                        }
                        setStatus('Open-Meteo conectado · 92 municípios · Dados reais');
                    }catch(e){ setStatus('Sem conexão · Tentando de novo'); }
                }
                carregar();
                const t = setInterval(carregar, 600000);
                return () => clearInterval(t);
            }, [cidadeSel1]);

            const desenharGraficoCanvas = (canvasRef, valores, cores, sufixo) => {
                const cv = canvasRef.current;
                if(!cv) return;
                const ctx = cv.getContext('2d');
                const W = cv.width = 340, H = cv.height = 140;
                ctx.clearRect(0,0,W,H);
                const max = Math.max(...valores, 1);
                const step = W / valores.length;
                const horaAtual = new Date().getHours();

                valores.forEach((v,i)=>{
                    const h = (v/max)*(H-35);
                    const x = i*step+4;
                    const grad = ctx.createLinearGradient(0,H-h,0,H);
                    grad.addColorStop(0,cores[0]); grad.addColorStop(1,cores[1]);
                    ctx.fillStyle = grad;
                    ctx.fillRect(x, H-h-20, step-6, h);
                    ctx.fillStyle = '#FFFFFF'; ctx.font = 'bold 9px monospace';
                    ctx.textAlign = 'center';
                    ctx.fillText(v+sufixo, x+(step/2), H-h-23);

                    const horaLabel = `${String((horaAtual + i) % 24).padStart(2, '0')}h`;
                    ctx.fillStyle = '#00F2FE'; ctx.font = '600 8px monospace';
                    ctx.fillText(horaLabel, x+(step/2), H-6);
                });
            };

            const desenharGraficosHorarios = (hourly) => {
                if(!hourly) return;
                const h = new Date().getHours();
                const temps=[], chuvas=[];
                for(let i=0; i<12; i++){
                    const idx = (h+i)%24;
                    temps.push(Math.round(hourly.temperature_2m[idx] || 25));
                    chuvas.push(hourly.precipitation_probability[idx] || 0);
                }
                setTimeout(() => {
                    desenharGraficoCanvas(chartTempRef, temps, ['#ff5252','#ffca28'], '°C');
                    desenharGraficoCanvas(chartRainRef, chuvas, ['#7c4dff','#29b6f6'], '%');
                }, 100);
            };

            });

            const [termsAccepted, setTermsAccepted] = React.useState(() => { try { return localStorage.getItem("raru_cyber_terms") === "1"; } catch(e) { return false; } });
            const [check1, setCheck1] = React.useState(false);
            const [check2, setCheck2] = React.useState(false);

            const [isChatOpen, setIsChatOpen] = React.useState(false);
            const [input, setInput] = React.useState("");
            const [isProcessing, setIsProcessing] = React.useState(false);

            const [vozSelecionada, setVozSelecionada] = React.useState(0);
            const [customTickerText, setCustomTickerText] = React.useState("");

            const showToast = (msg) => { setToastMsgRef(msg); setTimeout(() => setToastMsgRef(null), 3500); };

            const toggleCommandHUD = () => {
                if (!isCommandHUDActive) {
                    if (document.documentElement.requestFullscreen) document.documentElement.requestFullscreen().catch(() => {});
                    setIsCommandHUDActive(true);
                    showToast("MODO HUD DE TELA CHEIA ATIVADO.");
                } else {
                    if (document.exitFullscreen && document.fullscreenElement) document.exitFullscreen().catch(() => {});
                    setIsCommandHUDActive(false);
                    showToast("Modo Padrão Restabelecido.");
                }
            };

            const openShareFromApp = async () => {
                showToast("Gerando arquivo compacto...");
                const iconeArquivo = await gerarArquivoIconeEscudo();
                if (navigator.share) {
                    try {
                        const sharePayload = { title: "Projeto Cidadão Sensor - Sala de Comando V11.2", text: shareMessageText, url: APP_SHARE_URL };
                        if (iconeArquivo && navigator.canShare && navigator.canShare({ files: [iconeArquivo] })) sharePayload.files = [iconeArquivo];
                        await navigator.share(sharePayload);
                        return;
                    } catch (err) {}
                }
                setShareModalOpen(true);
            };

            const toggleListening = () => {
                const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
                if (!SpeechRec) { showToast("Microfone indisponível."); return; }
                if (isListening) { setIsListening(false); return; }
                try {
                    const rec = new SpeechRec();
                    rec.lang = "pt-BR";
                    rec.onstart = () => setIsListening(true);
                    rec.onresult = (event) => { let final = event.results[0][0].transcript; if (final) { setInput(final); setIsListening(false); } };
                    rec.onerror = () => setIsListening(false);
                    rec.onend = () => setIsListening(false);
                    rec.start();
                } catch (e) { setIsListening(false); }
            };

            const [messages, setMessages] = React.useState([
                { sender: 'assistant', text: `Olá ${agenteNome}. Sou a analista sênior do Projeto Cidadão Sensor e da Sala de Comando Sarah AI Nexus V11.2. Pronta para operar em qualquer dispositivo.`, time: new Date().toLocaleTimeString('pt-BR', {hour: '2-digit', minute:'2-digit'}) }
            ]);

            const handleSendDirectCommand = async (textCustom) => {
                const textToSend = textCustom !== undefined ? textCustom : input;
                if (!textToSend.trim() || isProcessing) return;
                const timeStr = new Date().toLocaleTimeString('pt-BR', {hour: '2-digit', minute:'2-digit'});
                
                const novoHistorico = [...messages, { sender: 'user', text: textToSend, time: timeStr }];
                setMessages(novoHistorico);
                setInput(""); 
                setIsProcessing(true);
                setIsSpeaking(true);

                try {
                    const formattedHistory = novoHistorico.map(m => ({
                        role: m.sender === 'user' ? 'user' : 'assistant',
                        content: m.text
                    }));

                    const respostaSarah = await chamarSarahGroq(formattedHistory, "Mesquita", "Rocha Sobrinho", activeTab, { status: "Online" }, agenteNome);

                    const replyTime = new Date().toLocaleTimeString('pt-BR', {hour: '2-digit', minute:'2-digit'});
                    setMessages(prev => [...prev, { sender: 'assistant', text: respostaSarah, time: replyTime }]);
                    
                    if (soundEnabled) falarSarah(respostaSarah, vozSelecionada);
                } catch (error) {
                    const errorMsg = `TELEMETRIA INDISPONÍVEL: Falha ao processar comando com a Groq. Tudo bem por aí, ${agenteNome}?`;
                    setMessages(prev => [...prev, { sender: 'assistant', text: errorMsg, time: new Date().toLocaleTimeString('pt-BR', {hour: '2-digit', minute:'2-digit'}) }]);
                } finally {
                    setIsProcessing(false);
                    setIsSpeaking(false);
                }
            };

            const openSarahChat = () => setIsChatOpen(true);

            const NAV_TABS = [
                { id: 'dashboard', iconComponent: <IconDashboard className="w-4 h-4" />, label: 'Painel' },
                { id: 'radar', iconComponent: <IconRadar className="w-4 h-4" />, label: 'Radar' },
                { id: 'relatorio', iconComponent: <IconVistoria className="w-4 h-4" />, label: 'Vistoria' },
                { id: 'estacao', iconComponent: <IconEstacao className="w-4 h-4" />, label: 'Estação' },
                { id: 'balanca', iconComponent: <IconBalanca className="w-4 h-4" />, label: 'Balança' },
                { id: 'alquino', iconComponent: <IconAlquino className="w-4 h-4" />, label: 'Alquino' },
                { id: 'compartilhar', iconComponent: <IconInstalar className="w-4 h-4" />, label: 'Instalar' },
                { id: 'quem-somos', iconComponent: <IconQuemSomos className="w-4 h-4" />, label: 'Sobre' },
                { id: 'admin', iconComponent: <IconAdmin className="w-4 h-4" />, label: 'Admin' }
            ];

            const handleNavClick = (tabId) => {
                if (tabId === 'compartilhar') openShareFromApp();
                else if (tabId === 'quem-somos') setQuemSomosOpen(true);
                else setActiveTab(tabId);
            };

            return (
                <div className="seu-container-raru">
                    {toastMsgRef && <div className="fixed top-12 left-1/2 -translate-x-1/2 z-50 cyber-card px-4 py-2 rounded-2xl font-display text-[10px] font-black text-cyberCyan tracking-wider shadow-2xl border border-cyberCyan/60 animate-bounce">{toastMsgRef}</div>}

                    {shareModalOpen && (
                        <div className="fixed inset-0 bg-void/90 backdrop-blur-xl z-50 flex items-center justify-center p-4">
                            <div className="cyber-card max-w-sm w-full p-4 rounded-2xl space-y-3 text-center shadow-2xl border border-cyberCyan/50">
                                <h3 className="font-display text-xs font-black tracking-widest uppercase text-cyberCyan">INSTALAÇÃO V11.2</h3>
                                <textarea readOnly value={shareMessageText} className="w-full h-16 bg-void border border-cyberCyan/30 rounded-xl p-2.5 text-[9px] text-slate-300 resize-none font-mono" />
                                <button onClick={() => setShareModalOpen(false)} className="cyber-button-danger w-full text-xs py-2.5">FECHAR</button>
                            </div>
                        </div>
                    )}

                    {!termsAccepted && (
                        <div className="fixed inset-0 bg-void/95 z-[200] flex items-center justify-center p-4 overflow-y-auto">
                            <div className="cyber-card max-w-md w-full p-5 rounded-3xl shadow-2xl space-y-3.5 my-auto border border-cyberCyan/70 font-mono text-left">
                                <div className="w-14 h-14 mx-auto overflow-hidden"><SarahAnimatedAvatar isSpeaking={true} /></div>
                                <div className="text-center space-y-1">
                                    <h2 className="font-display text-xs font-black text-white tracking-widest uppercase">Projeto Cidadão Sensor</h2>
                                    <p className="text-[9px] text-cyberCyan font-bold uppercase">TERMO DE RESPONSABILIDADE &amp; LGPD</p>
                                </div>
                                <div className="space-y-2 pt-1">
                                    <label className="flex items-start gap-2.5 cursor-pointer text-[11px] text-slate-200 bg-commandPanel/80 p-2.5 rounded-xl border border-cyberCyan/30">
                                        <input type="checkbox" checked={check1} onChange={(e) => setCheck1(e.target.checked)} className="mt-0.5 rounded text-cyberCyan w-4 h-4 bg-void cursor-pointer shrink-0" />
                                        <span>Aceito os termos da LGPD e operabilidade autônoma.</span>
                                    </label>
                                    <label className="flex items-start gap-2.5 cursor-pointer text-[11px] text-slate-200 bg-commandPanel/80 p-2.5 rounded-xl border border-cyberCyan/30">
                                        <input type="checkbox" checked={check2} onChange={(e) => setCheck2(e.target.checked)} className="mt-0.5 rounded text-cyberCyan w-4 h-4 bg-void cursor-pointer shrink-0" />
                                        <span>Autorizo o uso do GPS e telemetria para vistorias.</span>
                                    </label>
                                </div>
                                <button disabled={!check1 || !check2} onClick={() => { setTermsAccepted(true); try { localStorage.setItem("raru_cyber_terms", "1"); } catch(e) {} }} className={`cyber-button-solid w-full text-xs py-3.5 ${check1 && check2 ? '' : 'opacity-50 cursor-not-allowed'}`}>
                                    CONCORDAR E INICIAR SALA DE COMANDO
                                </button>
                            </div>
                        </div>
                    )}

                    <header className="cyber-card sticky top-0 z-30 w-full px-4 py-3 border-b border-cyberCyan/40 flex items-center justify-between shadow-lg rounded-2xl mb-2">
                        <div className="flex items-center gap-2.5 cursor-pointer" onClick={openSarahChat}>
                            <div className="w-8 h-8 overflow-hidden rounded-full border border-cyberCyan shrink-0">
                                <SarahLiveSVGAvatar isSpeaking={isSpeaking} />
                            </div>
                            <div>
                                <h1 className="font-display text-xs sm:text-sm font-black text-white leading-none">Sarah AI Nexus V11.2 • Comando</h1>
                                <p className="text-[8px] text-cyberCyan font-mono mt-0.5">Agente: {agenteNome}</p>
                            </div>
                        </div>
                        <div className="flex items-center gap-2">
                            <button onClick={toggleCommandHUD} className={`cyber-button text-[9px] py-2 px-3 ${isCommandHUDActive ? '!bg-cyberRose !text-void animate-pulse' : ''}`}>HUD</button>
                            <button onClick={() => setSoundEnabled(!soundEnabled)} className="cyber-button text-[9px] py-2 px-3">ÁUDIO</button>
                        </div>
                    </header>

                    <main className="flex-1 w-full mx-auto py-2 space-y-4 pb-28 relative z-10">
                        {activeTab === 'dashboard' && <CardIdentidadeVisualRARU openShareFromApp={openShareFromApp} openSarahChat={openSarahChat} handleWhoAmIClick={() => setQuemSomosOpen(true)} setActiveTab={setActiveTab} toggleCommandHUD={toggleCommandHUD} agenteNome={agenteNome} />}
                        {activeTab === 'radar' && <RadarMeteorologicoModule showToast={showToast} />}
                        {activeTab === 'estacao' && <EstacaoSobrevivenciaModuleV12 showToast={showToast} />}
                        {activeTab === 'balanca' && <ModuloCidadaoSensorModule onGoToDashboard={() => setActiveTab('dashboard')} showToast={showToast} />}
                        {activeTab === 'alquino' && <RedeAlquinoHardwareModule onGoToDashboard={() => setActiveTab('dashboard')} showToast={showToast} />}
                        {activeTab === 'relatorio' && <VistoriaRARU_NEXUS onBackToDashboard={() => setActiveTab('dashboard')} showToast={showToast} vozSelecionada={vozSelecionada} agenteNome={agenteNome} setAgenteNome={setAgenteNome} />}
                        {activeTab === 'admin' && <AdminVaultModule showToast={showToast} onClose={() => setActiveTab('dashboard')} vozSelecionada={vozSelecionada} setVozSelecionada={setVozSelecionada} customTickerText={customTickerText} setCustomTickerText={setCustomTickerText} />}

                        <AutomatedObservatoryWidget customTickerText={customTickerText} />
                    </main>

                    <SarahChatOverlay isOpen={isChatOpen} onClose={() => setIsChatOpen(false)} isSpeaking={isSpeaking} isProcessing={isProcessing} messages={messages} input={input} setInput={setInput} handleSendDirectCommand={handleSendDirectCommand} toggleListening={toggleListening} isListening={isListening} agenteNome={agenteNome} />
                    <QuemSomosModal isOpen={quemSomosOpen} onClose={() => setQuemSomosOpen(false)} />

                    <footer className="cyber-card fixed bottom-0 left-0 right-0 z-40 border-t border-cyberCyan/40 px-2.5 py-3 flex items-center justify-between gap-1 shadow-2xl backdrop-blur-xl max-w-[1400px] mx-auto rounded-t-2xl pb-[env(safe-area-inset-bottom)]">
                        {NAV_TABS.map(tab => (
                            <button key={tab.id} onClick={() => handleNavClick(tab.id)} className={`flex flex-col items-center justify-center gap-0.5 cursor-pointer flex-1 py-1.5 transition touch-manipulation rounded-xl ${activeTab === tab.id ? 'text-cyberCyan bg-cyberCyan/15 border border-cyberCyan/40' : 'text-slate-400 hover:text-white border border-transparent'}`}>
                                {tab.iconComponent}
                                <span className="text-[7px] sm:text-[9px] font-black truncate w-full text-center tracking-tighter px-0.5">{tab.label}</span>
                            </button>
                        ))}
                    </footer>
                </div>
            );
        }

        try {
            const rootElement = document.getElementById('root');
            ReactDOM.createRoot(rootElement).render(<App />);
        } catch (err) {
            document.getElementById('root').innerHTML = `<div style="padding:20px;color:#FF0055;font-family:monospace;">Erro ao iniciar interface: ${err.message}</div>`;
        }
    </script>
</body>
</html>
