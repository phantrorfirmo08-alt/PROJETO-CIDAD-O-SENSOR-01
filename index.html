<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>SARAH AI NEXUS - VISTORIA CIBERNETICA COMPLETA</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
:root{--void:#02040A;--cyan:#00F2FE;--green:#10B981}
body{background:radial-gradient(ellipse at top,#0D152D 0%,#02040A 60%);color:#fff;font-family:'JetBrains Mono',monospace;min-height:100vh;padding:12px}
.cyber-card{background:rgba(13,21,45,0.96);border:1px solid rgba(0,242,254,0.4);backdrop-filter:blur(12px)}
.cyber-button{background:linear-gradient(90deg,#00F2FE,#10B981);color:#02040A;font-weight:900}
.bg-void{background:#02040A}
.text-cyberCyan{color:#00F2FE}
.border-cyberCyan\/40{border-color:rgba(0,242,254,0.4)}
.text-cyberGreen{color:#10B981}
.border-cyberGreen\/40{border-color:rgba(16,185,129,0.4)}
.bg-cyberGreen{background:#10B981}
.text-cyberRose{color:#FB7185}
.bg-cyberRose\/20{background:rgba(251,113,133,0.2)}
.bg-commandPanel{background:rgba(13,21,45,0.8)}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const {useState,useEffect,useMemo,useRef}=React;
const MUNICIPIOS_92=["Angra dos Reis","Aperibé","Araruama","Areal","Armação dos Búzios","Arraial do Cabo","Barra do Piraí","Barra Mansa","Belford Roxo","Bom Jardim","Bom Jesus do Itabapoana","Cabo Frio","Cachoeiras de Macacu","Cambuci","Campos dos Goytacazes","Cantagalo","Carapebus","Carmo","Casimiro de Abreu","Comendador Levy Gasparian","Conceição de Macabu","Cordeiro","Duas Barras","Duque de Caxias","Engenheiro Paulo de Frontin","Guapimirim","Iguaba Grande","Itaboraí","Itaguaí","Italva","Itaocara","Itaperuna","Itatiaia","Japeri","Laje do Muriaé","Macaé","Macuco","Magé","Mangaratiba","Maricá","Mendes","Mesquita","Miguel Pereira","Miracema","Natividade","Nilópolis","Niterói","Nova Friburgo","Nova Iguaçu","Paracambi","Paraíba do Sul","Paraty","Paty do Alferes","Petrópolis","Pinheiral","Piraí","Porciúncula","Porto Real","Quatis","Queimados","Quissamã","Resende","Rio Bonito","Rio Claro","Rio das Flores","Rio das Ostras","Rio de Janeiro","Santa Maria Madalena","Santo Antônio de Pádua","São Fidélis","São Francisco de Itabapoana","São Gonçalo","São João da Barra","São João de Meriti","São José de Ubá","São José do Vale do Rio Preto","São Pedro da Aldeia","São Sebastião do Alto","Sapucaia","Saquarema","Seropédica","Silva Jardim","Sumidouro","Tanguá","Teresópolis","Trajano de Moraes","Três Rios","Valença","Varre-Sai","Vassouras","Volta Redonda"];
const BAIXADA_13=["Belford Roxo","Duque de Caxias","Itaguaí","Japeri","Magé","Mesquita","Nilópolis","Nova Iguaçu","Paracambi","Queimados","São João de Meriti","Seropédica","Guapimirim"];
const SETORES_PRINT=["🛡️ SEDEC-RJ / Defesa Civil Estadual","🌊 INEA / SERLA (Ambiente e Rios RJ)","🏛️ SEMIMSP / Obras - Municipal","🎓 UERJ, UFRJ, UFF, UFRRJ, IFRJ (Universidades RJ)","🛰️ CEMADEN / INPE (Pesquisa Climática Nacional)","🏠 CRAS / CREAS (Assistência Social RJ)","🏥 SUS / Vigilância em Saúde RJ","🤝 NUPDECs - 92 Municípios RJ","🔔 Projeto Cidadão Sensor (RCS Estadual)","📢 Bom Dia Comunidade (Comunicação Social Estadual)","👤 Cidadão - Participação Direta RJ","🌱 GADE (Grupo A Chave da Esperança)"];

function App(){
const [municipio,setMunicipio]=useState("Mesquita");
const [setor,setSetor]=useState("🤝 NUPDECs - 92 Municípios RJ");
const [equipeBaixada,setEquipeBaixada]=useState("Coletivo Esperança Rocha Sobrinho");
const [nivelRisco,setNivelRisco]=useState("🟢 Risco Baixo / Monitoramento");
const [agente,setAgente]=useState("");
const [local,setLocal]=useState("");
const [desc,setDesc]=useState("");
const [gps,setGps]=useState({lt:'',ln:'',lk:''});
const [gpsSt,setGpsSt]=useState("📍 GPS em espera");
const [hash,setHash]=useState("Calculando...");
const [ocorrencias,setOcorrencias]=useState({deslizamento:false,alagamento:false,trincas:false,arvore:false,valao:false});
const [fotos,setFotos]=useState([{id:1,file:null,preview:null},{id:2,file:null,preview:null},{id:3,file:null,preview:null},{id:4,file:null,preview:null}]);
const [toast,setToast]=useState(null);
const protocolo=useMemo(()=>`CPARC-RRD92-${municipio.substring(0,3).toUpperCase()}-2026-${Math.floor(1000+Math.random()*9000)}`,[municipio]);
const showToast=(m)=>{setToast(m);setTimeout(()=>setToast(null),2500);};

const isBaixada=BAIXADA_13.includes(municipio);
const isNupdecOuComunidade=setor.includes("NUPDECs")||setor.includes("Bom Dia")||setor.includes("Cidadão")||setor.includes("GADE");
const mostrarCaixinhaBaixada=true;

const getEquipeFinal=()=>{
let base=setor;
if(equipeBaixada.trim()!==""){base=`${base} | ${equipeBaixada.trim()}`;}
if(isBaixada) base+=` [${municipio}-RJ BAIXADA 13]`;
return base;
};

useEffect(()=>{
(async()=>{
try{
const str=municipio+setor+equipeBaixada+nivelRisco+agente+local+desc+protocolo+JSON.stringify(ocorrencias);
const buf=new TextEncoder().encode(str);
const hb=await crypto.subtle.digest('SHA-256',buf);
const hex=Array.from(new Uint8Array(hb)).map(b=>b.toString(16).padStart(2,'0')).join('');
setHash(hex.substring(0,32)+"...");
}catch(e){setHash("sha256-secure-fallback");}
})();
},[municipio,setor,equipeBaixada,nivelRisco,agente,local,desc,protocolo,ocorrencias]);

const capturarGps=()=>{
if(!navigator.geolocation)return showToast("⚠️ Sem GPS");
showToast("🛰 Buscando GPS...");
navigator.geolocation.getCurrentPosition(p=>{
const lt=p.coords.latitude.toFixed(6),ln=p.coords.longitude.toFixed(6),lk=`https://www.google.com/maps?q=${lt},${ln}`;
setGps({lt,ln,lk});setLocal(`${lt},${ln}`);setGpsSt("✅ GPS Fixado");showToast("📍 GPS OK!");
},()=>setGpsSt("⚠ Erro GPS"),{enableHighAccuracy:true,timeout:10000});
};

const processar=(file,gpsInfo,ag,loc,eqFinal,muni)=>new Promise((res,rej)=>{
const rd=new FileReader();
rd.onload=e=>{
const img=new Image();
img.onload=()=>{
const cv=document.createElement('canvas');const MAX=600;
let w=img.width,h=img.height;
if(w>MAX||h>MAX){if(w>h){h=Math.round(h*MAX/w);w=MAX;}else{w=Math.round(w*MAX/h);h=MAX;}}
cv.width=w;cv.height=h;const ctx=cv.getContext('2d');
ctx.drawImage(img,0,0,w,h);
const dt=new Intl.DateTimeFormat('pt-BR',{dateStyle:'short',timeStyle:'medium',timeZone:'America/Sao_Paulo'}).format(new Date());
const ct=gpsInfo.lt?`${gpsInfo.lt},${gpsInfo.ln}`:(loc||'Local não fixado');
let sigla="CPARC";
if(eqFinal.includes("SEDEC"))sigla="SEDEC-RJ";
else if(eqFinal.includes("INEA"))sigla="INEA-RJ";
else if(eqFinal.includes("NUPDECs"))sigla="NUPDECs";
else if(eqFinal.includes("Bom Dia"))sigla="BOM DIA COMUNIDADE";
else if(eqFinal.includes("Cidadão Sensor"))sigla="CIDADÃO SENSOR";
else if(eqFinal.includes("GADE"))sigla="GADE";
else if(eqFinal.includes("Cidadão -"))sigla="CIDADÃO DIRETO";
const fs=Math.max(10,Math.round(w*0.028)),pad=8,lh=fs+4,bh=lh*4+pad*2;
ctx.font=`bold ${fs}px sans-serif`;
ctx.fillStyle='rgba(6,11,24,0.92)';ctx.fillRect(0,h-bh,w,bh);
ctx.fillStyle='#00F2FE';ctx.fillRect(0,h-bh,w,2);
ctx.shadowColor='rgba(0,0,0,1)';ctx.shadowBlur=4;
let y=h-bh+pad+fs;
ctx.fillStyle='#00F2FE';ctx.fillText(`📅 ${dt} | ${muni.toUpperCase()}-RJ ${isBaixada?"[BAIXADA]":"[92]"} | ${sigla}`,pad,y);
ctx.fillStyle='#FFFFFF';ctx.fillText(`📍 GPS: ${ct}`,pad,y+lh);
ctx.fillStyle='#94A3B8';ctx.fillText(`👤 Resp.: ${ag||'Equipe de Campo'}`,pad,y+lh*2);
ctx.fillStyle='#FFB86A';ctx.fillText(`👥 Equipe: ${eqFinal.slice(0,62)}`,pad,y+lh*3);
cv.toBlob(b=>{
if(!b)return rej();
const f=new File([b],`vistoria_${sigla.toLowerCase()}_${Date.now()}.jpg`,{type:'image/jpeg'});
res({compressedFile:f,preview:cv.toDataURL('image/jpeg',0.5)});
},'image/jpeg',0.5);
};
img.onerror=()=>rej();
img.src=e.target.result;
};
rd.onerror=()=>rej();
rd.readAsDataURL(file);
});

const handleFoto=async(i,e)=>{
const file=e.target.files[0];if(!file)return;e.target.value="";
showToast(`🔄 Otimizando foto ${i+1}...`);
try{
const{compressedFile,preview}=await processar(file,gps,agente,local,getEquipeFinal(),municipio);
setFotos(p=>{const n=[...p];n[i]={id:n[i].id,file:compressedFile,preview};return n;});
showToast(`📸 Foto ${i+1} CARIMBADA com sucesso!`);
}catch(err){showToast("❌ Erro ao processar foto");}
};

const apagar=(i,e)=>{e.stopPropagation();setFotos(p=>{const n=[...p];n[i]={id:n[i].id,file:null,preview:null};return n;});showToast(`🗑️ Foto ${i+1} removida`);};

const getOcorrenciasTexto=()=>{
const l=[];
if(ocorrencias.deslizamento)l.push("• Deslizamento / Escorregamento");
if(ocorrencias.alagamento)l.push("• Alagamento / Inundação");
if(ocorrencias.trincas)l.push("• Trincas / Rachaduras Estruturais");
if(ocorrencias.arvore)l.push("• Queda de Árvore / Risco Elétrico");
if(ocorrencias.valao)l.push("• Obstrução de Bueiro / Valão");
return l.length>0?l.join("\n"):"• Nenhuma categoria marcada";
};

const montarTexto=()=>{
const c=fotos.filter(f=>f.file).length;
const dh=new Intl.DateTimeFormat('pt-BR',{dateStyle:'short',timeStyle:'medium',timeZone:'America/Sao_Paulo'}).format(new Date());
return `🛡️ *LAUDO DE VISTORIA CIBERNÉTICA • RRD-92 + CPARC v13.0* 🛡️\n━━━━━━━━━━━━━━━━━━━━━━\n📌 *Protocolo:* \`${protocolo}\`\n📍 *Município:* ${municipio}-RJ ${isBaixada?"[BAIXADA 13]":"[92 MUNICÍPIOS]"}\n🏛 *Setor / Instituição:* ${setor}\n👥 *Equipe / Iniciativa Baixada:* ${equipeBaixada||'Não informada'} [CARIMBADA]\n⚠️ *Nível de Risco:* ${nivelRisco}\n👤 *Responsável:* ${agente||'Não informado'}\n📅 *Data/Hora:* ${dh}\n📍 *Localidade:* ${local||'Não informada'}\n${gps.lk?`🔗 *Google Maps:* ${gps.lk}\n`:``}━━━━━━━━━━━━━━━━━━━━━━\n📋 *Tipos de Ocorrência:*\n${getOcorrenciasTexto()}\n━━━━━━━━━━━━━━━━━━━━━━\n📸 *Evidências:* ${c}/4 fotos carimbadas com ${equipeBaixada}\n📝 *Relato:*\n${desc||'Sem descrição.'}\n━━━━━━━━━━━━━━━━━━━━━━\n🔒 *Hash SHA-256:* \`${hash}\`\n⚡ *GADE • Chave Climática & RRD-92 + CPARC v13.0*`;
};

const gerarPdf=async()=>{
showToast("📄 Gerando PDF oficial...");
try{
let J=window.jspdf?window.jspdf.jsPDF:window.jsPDF;
if(!J)return showToast("⚠️ PDF lib indisponível");
const doc=new J({unit:'mm',format:'a4'}),m=15;let y=20;
doc.setFillColor(2,4,10);doc.rect(0,0,210,297,"F");
doc.setTextColor(0,242,254);doc.setFontSize(14);doc.setFont("helvetica","bold");
doc.text("LAUDO TÉCNICO OFICIAL - VISTORIA CIBERNÉTICA",m,y);
y+=7;doc.setFontSize(9);doc.setTextColor(16,185,129);
doc.text(`RRD-92 (92 MUNICÍPIOS + 13 BAIXADA) + CPARC v13.0 • ${municipio}-RJ`,m,y);
y+=10;doc.setDrawColor(0,242,254);doc.line(m,y,195,y);y+=8;
doc.setFontSize(9);doc.setTextColor(255,255,255);doc.setFont("helvetica","normal");
doc.text(`Protocolo: ${protocolo}`,m,y);doc.text(`Data: ${new Date().toLocaleString('pt-BR')}`,m+95,y);y+=6;
doc.text(`Município: ${municipio}-RJ ${isBaixada?"[BAIXADA 13]":"[92]"}`,m,y);y+=6;
doc.text(`Setor: ${setor}`,m,y);y+=6;
const eqL=doc.splitTextToSize(`Equipe Baixada / Iniciativa [CARIMBADA]: ${equipeBaixada}`,180);
doc.setTextColor(255,184,106);doc.text(eqL,m,y);y+=eqL.length*5+2;
doc.setTextColor(255,255,255);
doc.text(`Nível de Risco: ${nivelRisco}`,m,y);doc.text(`Responsável: ${agente||'Não informado'}`,m+95,y);y+=6;
doc.text(`Localidade: ${local||'Não informada'}`,m,y);y+=6;
if(gps.lk){doc.setTextColor(0,242,254);doc.text(`Maps: ${gps.lk}`,m,y);y+=6;doc.setTextColor(255,255,255);}
y+=4;doc.setTextColor(0,242,254);doc.setFont("helvetica","bold");doc.text("CHECKLIST DE OCORRÊNCIAS:",m,y);y+=6;
doc.setFont("helvetica","normal");doc.setTextColor(255,255,255);
getOcorrenciasTexto().split('\n').forEach(l=>{doc.text(l,m+5,y);y+=5;});
y+=4;doc.setTextColor(0,242,254);doc.setFont("helvetica","bold");doc.text("RELATO TÉCNICO:",m,y);y+=6;
doc.setFont("helvetica","normal");doc.setTextColor(255,255,255);
const sp=doc.splitTextToSize(desc||'Sem descrição',180);doc.text(sp,m,y);y+=sp.length*5+8;
doc.setFillColor(13,21,45);doc.roundedRect(m,y,180,14,2,2,"F");
doc.setFontSize(8);doc.setTextColor(0,242,254);doc.text("HASH SHA-256 INTEGRIDADE + EQUIPE BAIXADA CARIMBADA:",m+4,y+4.5);
doc.setTextColor(255,255,255);doc.text(`${hash} | ${equipeBaixada}`,m+4,y+10);y+=20;
const fv=fotos.filter(f=>f.preview);
if(fv.length>0){
if(y>170){doc.addPage();y=20;}
doc.setTextColor(0,242,254);doc.setFont("helvetica","bold");doc.setFontSize(10);
doc.text("EVIDÊNCIAS FOTOGRÁFICAS CARIMBADAS COM EQUIPE BAIXADA:",m,y);y+=6;
let x=m,sy=y,mh=0;
fv.forEach((f,i)=>{
if(x+40>195){x=m;sy+=mh+12;mh=0;}
if(sy>230){doc.addPage();sy=20;x=m;}
try{doc.addImage(f.preview,'JPEG',x,sy,40,40);doc.setFontSize(7);doc.setTextColor(255,255,255);doc.text(`Foto ${i+1} - ${equipeBaixada.slice(0,15)}`,x,sy+44);x+=46;mh=46;}catch(e){}
});
}
doc.save(`Laudo_CIBERNETICO_${protocolo}.pdf`);
showToast("✅ PDF com equipe Baixada gerado!");
}catch(e){showToast("❌ Erro PDF");}
};

const compartilhar=async()=>{
const txt=montarTexto(),files=fotos.filter(f=>f.file).map(f=>f.file);
if(navigator.canShare){
try{
const d={title:'Laudo Cibernético',text:txt,files:files.length?files:undefined};
if(navigator.canShare(d)){await navigator.share(d);showToast("✅ Compartilhado!");return;}
}catch(err){if(err.name==='AbortError')return;}
}
try{await navigator.clipboard.writeText(txt);}catch(e){}
if(files.length>0){files.forEach((f,i)=>{const a=document.createElement('a');a.href=URL.createObjectURL(f);a.download=`vistoria_${municipio}_${i+1}.jpg`;a.click();});}
showToast("📋 Copiado + fotos baixadas!");
setTimeout(()=>window.open(`https://wa.me/?text=${encodeURIComponent(txt)}`,'_blank'),800);
};

return(
<div className="max-w-2xl mx-auto space-y-4">
{toast&&<div className="fixed top-4 left-1/2 -translate-x-1/2 bg-[#00F2FE] text-black px-5 py-2 rounded-xl text-xs font-black z-[999] shadow-2xl">{toast}</div>}
<div className="cyber-card rounded-2xl px-5 py-3 flex items-center justify-between">
<span className="text-[11px] font-black text-[#00F2FE] tracking-widest">SARAH AI NEXUS v8.4.2.1 • VISTORIA CIBERNÉTICA TOTAL • 92 + 13 BAIXADA + CPARC v13.0</span>
<span className="text-[9px] text-orange-400 font-bold">{isBaixada?"BAIXADA 13 ATIVA":"92 MUNICÍPIOS"}</span>
</div>

<div className="cyber-card rounded-[28px] p-6 space-y-4 shadow-2xl">
<div className="space-y-1">
<label className="text-[10px] font-bold text-cyberCyan uppercase">Município (92 + 13 Baixada) - Print Original</label>
<select value={municipio} onChange={e=>setMunicipio(e.target.value)} className="w-full bg-void border border-cyberCyan/40 rounded-2xl p-3.5 text-xs text-white font-bold">
<optgroup label="🔥 BAIXADA FLUMINENSE - 13 MUNICÍPIOS [BAIXADA 13]">{BAIXADA_13.map(m=><option key={m} value={m}>{m} - RJ [BAIXADA 13]</option>)}</optgroup>
<optgroup label="🏛️ 92 MUNICÍPIOS DO ESTADO DO RIO DE JANEIRO">{MUNICIPIOS_92.filter(m=>!BAIXADA_13.includes(m)).map(m=><option key={m} value={m}>{m} - RJ</option>)}</optgroup>
</select>
</div>

<div className="space-y-1">
<label className="text-[10px] font-bold text-cyberCyan uppercase">Setor / Instituição - Igual ao Print que você mandou</label>
<select value={setor} onChange={e=>setSetor(e.target.value)} className="w-full bg-[#1A1A1A] border border-orange-500/50 rounded-2xl p-3.5 text-[12px] text-white">
{SETORES_PRINT.map((s,i)=><option key={i} value={s}>{s}</option>)}
</select>
</div>

<div className="bg-gradient-to-br from-[#1A1A1A] to-[#0D152D] border-2 border-orange-500/80 rounded-2xl p-4 space-y-2 shadow-[0_0_20px_rgba(255,140,0,0.2)]">
<label className="block text-[11px] font-black text-orange-400 uppercase tracking-wider">📢 NOME DA EQUIPE / INICIATIVA DA BAIXADA - CAIXINHA DE APRESENTAÇÃO [NOVA]</label>
<input value={equipeBaixada} onChange={e=>setEquipeBaixada(e.target.value)} placeholder="Ex: Coletivo Esperança Rocha Sobrinho, Associação de Moradores, Defesa Civil Mesquita..." className="w-full bg-void border-2 border-orange-400/80 rounded-xl p-3.5 text-[13px] text-white placeholder:text-slate-500 font-bold"/>
<p className="text-[9px] text-slate-300">Quando o pessoal da Baixada fizer vistoria, se apresenta aqui. Esse nome será <b className="text-cyan-400">CARIMBADO</b> na foto 600px, no PDF oficial e no WhatsApp igual às outras instituições do Estado do RJ.</p>
<div className="bg-black/70 border border-cyan-400/30 rounded-xl p-2.5">
<p className="text-[8px] text-slate-400 uppercase">Prévia do Carimbo na Foto:</p>
<p className="text-[10px] text-cyan-300 font-mono font-bold break-all">👥 {getEquipeFinal()}</p>
</div>
</div>

<div className="space-y-1">
<label className="text-[10px] font-bold text-cyberCyan uppercase">Nível de Risco Avaliado</label>
<select value={nivelRisco} onChange={e=>setNivelRisco(e.target.value)} className="w-full bg-void border border-cyberCyan/40 rounded-2xl p-3.5 text-xs text-white font-bold">
<option>🟢 Risco Baixo / Monitoramento</option><option>🟡 Risco Médio / Atenção</option><option>🟠 Risco Alto / Alerta</option><option>🔴 Risco Muito Alto / Perigo Iminente</option>
</select>
</div>

<div className="space-y-2 bg-void/70 border border-cyberCyan/30 rounded-2xl p-4">
<label className="text-[10px] font-bold text-cyberCyan uppercase block mb-1">Checklist de Ocorrências / Danos Observados</label>
<div className="grid grid-cols-1 sm:grid-cols-2 gap-2 text-xs text-slate-200">
<label className="flex items-center gap-2 cursor-pointer"><input type="checkbox" checked={ocorrencias.deslizamento} onChange={e=>setOcorrencias({...ocorrencias,deslizamento:e.target.checked})} className="rounded w-4 h-4 bg-void"/>Deslizamento / Encosta</label>
<label className="flex items-center gap-2 cursor-pointer"><input type="checkbox" checked={ocorrencias.alagamento} onChange={e=>setOcorrencias({...ocorrencias,alagamento:e.target.checked})} className="rounded w-4 h-4 bg-void"/>Alagamento / Inundação</label>
<label className="flex items-center gap-2 cursor-pointer"><input type="checkbox" checked={ocorrencias.trincas} onChange={e=>setOcorrencias({...ocorrencias,trincas:e.target.checked})} className="rounded w-4 h-4 bg-void"/>Trincas / Rachaduras</label>
<label className="flex items-center gap-2 cursor-pointer"><input type="checkbox" checked={ocorrencias.arvore} onChange={e=>setOcorrencias({...ocorrencias,arvore:e.target.checked})} className="rounded w-4 h-4 bg-void"/>Árvore / Risco Elétrico</label>
<label className="flex items-center gap-2 cursor-pointer sm:col-span-2"><input type="checkbox" checked={ocorrencias.valao} onChange={e=>setOcorrencias({...ocorrencias,valao:e.target.checked})} className="rounded w-4 h-4 bg-void"/>Obstrução de Bueiro / Valão / Canal</label>
</div>
</div>

<div className="grid grid-cols-2 gap-3">
<input value={agente} onChange={e=>setAgente(e.target.value)} placeholder="Nome do Responsável / Agente" className="w-full bg-void border border-cyberCyan/40 rounded-2xl p-3.5 text-xs text-white"/>
<input value={local} onChange={e=>setLocal(e.target.value)} placeholder="Localidade / Bairro / Setor" className="w-full bg-void border border-cyberCyan/40 rounded-2xl p-3.5 text-xs text-white"/>
</div>

<div className="border border-cyberCyan/40 bg-void/80 rounded-2xl p-3.5 flex items-center justify-between">
<span className="text-cyberGreen text-xs font-mono font-bold">{gpsSt} {gps.lt&&`${gps.lt},${gps.ln}`}</span>
<button onClick={capturarGps} className="px-4 py-2 cyber-button rounded-xl text-xs">GPS 🛰</button>
</div>

<textarea value={desc} onChange={e=>setDesc(e.target.value)} placeholder="Descreva a ocorrência, danos observados ou situação de risco..." rows="3" className="w-full bg-void border border-cyberCyan/40 rounded-2xl p-3.5 text-xs text-white resize-none"></textarea>

<div className="bg-void/90 border border-cyberCyan/30 rounded-2xl p-3 text-[10px] font-mono text-cyan-300 break-all">
<b className="text-white">Protocolo:</b> {protocolo} | {isBaixada?"📍 BAIXADA 13 - 100% REGISTRADO":"📍 92 ESTADO"}<br/>
<b className="text-white">Hash SHA-256:</b> {hash}<br/>
<b className="text-white">Equipe Final Carimbada:</b> <span className="text-orange-300">{getEquipeFinal()}</span>
</div>

<div className="grid grid-cols-2 gap-3">
{fotos.map((f,i)=>(
<div key={f.id} className="relative h-36 rounded-2xl border-2 border-dashed border-cyberGreen/40 bg-void flex items-center justify-center overflow-hidden">
{f.preview?(<><img src={f.preview} className="w-full h-full object-cover rounded-2xl"/><button type="button" onClick={e=>apagar(i,e)} className="absolute top-2 right-2 w-7 h-7 bg-cyberRose text-white rounded-full flex items-center justify-center text-xs z-20">✕</button><div className="absolute bottom-1 left-1 right-1 bg-black/80 rounded-lg px-2 py-1"><p className="text-[7px] text-orange-300 font-bold truncate">👥 {equipeBaixada}</p></div></>):(
<label htmlFor={`foto-${i}`} className="w-full h-full flex flex-col items-center justify-center cursor-pointer">
<div className="text-xl">📷</div><div className="text-[10px] text-slate-300 font-bold mt-1">Bloco {i+1}</div><div className="text-[8px] text-slate-400 text-center px-2">Carimbo 600px + {municipio} + {equipeBaixada.slice(0,18)}</div>
</label>)}
<input id={`foto-${i}`} type="file" accept="image/*" capture="environment" className="hidden" onChange={e=>handleFoto(i,e)}/>
{f.preview&&<div className="absolute top-1.5 left-1.5 bg-cyberGreen text-void text-[8px] font-black px-2 py-0.5 rounded-full">CARIMBADA 600px</div>}
</div>))}
</div>

<div className="grid grid-cols-2 gap-2.5">
<button onClick={gerarPdf} className="w-full cyber-button py-3.5 rounded-2xl text-xs uppercase">📄 PDF OFICIAL C/ BAIXADA</button>
<button onClick={()=>navigator.clipboard.writeText(montarTexto()).then(()=>showToast("📋 Copiado!"))} className="w-full bg-commandPanel border border-cyberCyan/40 text-cyberCyan font-extrabold py-3.5 rounded-2xl text-xs uppercase">📋 Copiar Relatório</button>
</div>
<button onClick={compartilhar} className="w-full bg-gradient-to-r from-amber-600 via-orange-600 to-cyberCyan text-white font-extrabold py-4 rounded-2xl text-xs uppercase shadow-xl">🚀 ENVIAR RELATÓRIO + FOTOS + EQUIPE BAIXADA p/ WHATSAPP</button>
<p className="text-[8px] text-center text-slate-500">CARIMBO: 600px MAX 0.5 JPEG | {municipio}-RJ | {getEquipeFinal()} | PROTOCOLO {protocolo} | BAIXADA 13 + 92 MUNICÍPIOS + HASH</p>
</div>
</div>
);
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
