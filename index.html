<!DOCTYPE html>
<html lang="pt-BR" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SARAH IA Core v4.5 PRO - Defesa Civil Comunitária Cidadão Sensor</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        brand: {
                            dark: "#020617",
                            light: "#f8fafc"
                        }
                    },
                    animation: {
                        'scanline': 'scan 3.5s linear infinite',
                        'pulse-glow': 'pulseGlow 2s cubic-bezier(0.4, 0, 0.6, 1) infinite',
                        'cyber-spin': 'cyberSpin 12s linear infinite',
                    },
                    keyframes: {
                        scan: {
                            '0%': { transform: 'translateY(-100%)' },
                            '100%': { transform: 'translateY(100%)' },
                        },
                        pulseGlow: {
                            '0%, 100%': { opacity: '1', filter: 'drop-shadow(0 0 20px rgba(6, 182, 212, 0.7))' },
                            '50%': { opacity: '0.65', filter: 'drop-shadow(0 0 8px rgba(6, 182, 212, 0.3))' },
                        },
                        cyberSpin: {
                            '0%': { transform: 'rotate(0deg)' },
                            '100%': { transform: 'rotate(360deg)' },
                        }
                    }
                }
            }
        };
    </script>
    <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="">
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <meta name="theme-color" content="#020617">
    <link rel="manifest" href="manifest.json">
    <style>
        html, body, #root {
            min-height: 100%;
            margin: 0;
            transition: background-color 0.3s ease, color 0.3s ease;
        }
        body {
            overflow-x: hidden;
            font-family: system-ui, -apple-system, sans-serif;
        }
        .leaflet-container {
            z-index: 10;
        }
        .glass-dark {
            background: rgba(2, 6, 23, 0.92);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(6, 182, 212, 0.35);
        }
        .glass-light {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(14, 165, 233, 0.4);
        }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 selection:bg-cyan-500 selection:text-slate-950">
    <div id="root"></div>
    <script type="text/babel">
        const CLOUDFLARE_WORKER_URL = "https://sarah-envelope.phantrorfirmo08.workers.dev/";

        const getBrasiliaGreeting = () => {
            const hour = parseInt(
                new Intl.DateTimeFormat("pt-BR", {
                    timeZone: "America/Sao_Paulo",
                    hour: "numeric",
                    hour12: false
                }).format(new Date()),
                10
            );
            if (hour >= 0 && hour < 5) return "Boa madrugada";
            if (hour >= 5 && hour < 12) return "Bom dia";
            if (hour >= 12 && hour < 18) return "Boa tarde";
            return "Boa noite";
        };

        // Escudo Vetorial Personalizado (Proporcional para Compartilhamento e Cabeçalho)
        function CyberShieldIcon({ className = "w-6 h-6" }) {
            return (
                <svg className={className} viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M12 2L3 6V11C3 16.55 6.84 21.74 12 23C17.16 21.74 21 16.55 21 11V6L12 2Z" fill="url(#shieldGrad)" stroke="#22d3ee" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round"/>
                    <path d="M12 7V17M9 10H15" stroke="#020617" strokeWidth="1.8" strokeLinecap="round"/>
                    <defs>
                        <linearGradient id="shieldGrad" x1="3" y1="2" x2="21" y2="23" gradientUnits="userSpaceOnUse">
                            <stop stop-color="#22d3ee" />
                            <stop offset="1" stop-color="#0284c7" />
                        </linearGradient>
                    </defs>
                </svg>
            );
        }

        // Avatar Feminino da SARAH IA: Cabelo Escuro, Rosto Volumoso, Queixo Arredondado e Olhos Menores
        function SarahAvatar({ size = "w-10 h-10", showStatus = true, isLarge = false }) {
            const [isBlinking, setIsBlinking] = React.useState(false);

            React.useEffect(() => {
                let timeoutId;
                const triggerBlink = () => {
                    setIsBlinking(true);
                    setTimeout(() => setIsBlinking(false), 110);
                    const randomTime = Math.floor(Math.random() * (4500 - 2200 + 1)) + 2200;
                    timeoutId = setTimeout(triggerBlink, randomTime);
                };
                const initialTime = Math.floor(Math.random() * (4500 - 2200 + 1)) + 2200;
                timeoutId = setTimeout(triggerBlink, initialTime);
                return () => clearTimeout(timeoutId);
            }, []);

            const dimensionClass = isLarge ? "w-32 h-32 sm:w-36 sm:h-36" : size;

            return (
                <div className="relative inline-flex items-center justify-center shrink-0">
                    <div className={`${dimensionClass} rounded-3xl bg-gradient-to-br from-slate-900 via-slate-950 to-cyan-950 border-2 border-cyan-400/60 shadow-[0_0_30px_rgba(6,182,212,0.45)] flex flex-col items-center justify-content relative overflow-hidden select-none animate-pulse-glow`}>
                        <div className="absolute inset-0 opacity-25 bg-[radial-gradient(#06b6d4_1.2px,transparent_1.2px)] [background-size:6px_6px]"></div>
                        <div className="absolute inset-2 rounded-2xl border border-cyan-500/30 border-dashed animate-cyber-spin pointer-events-none"></div>

                        <svg className="w-4/5 h-4/5 text-cyan-400 relative z-10" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <path d="M 17 15 C 13 8, 22 3, 32 3 C 42 3, 51 8, 47 15 C 52 22, 54 38, 48 53 C 46 53, 44 42, 41 32 C 38 20, 26 20, 23 32 C 20 42, 18 53, 16 53 C 10 38, 12 22, 17 15 Z" fill="#0e7490" opacity="0.95" />
                            <path d="M 20 18 C 18 10, 25 8, 32 8 C 39 8, 46 10, 44 18 C 43 32, 42 46, 32 50 C 22 46, 21 32, 20 18 Z" fill="#020617" stroke="#38bdf8" strokeWidth="1.8" />
                            <path d="M 20 20 C 18 28, 21 38, 24 47" stroke="#0e7490" strokeWidth="3.2" strokeLinecap="round" />
                            <path d="M 44 20 C 46 28, 43 38, 40 47" stroke="#0e7490" strokeWidth="3.2" strokeLinecap="round" />
                            <path d="M 21 15 C 24 10, 32 10, 43 15 C 38 12, 26 12, 21 15 Z" fill="#0e7490" />
                            <g className="transition-all duration-75">
                                <ellipse cx="26" cy="26" rx="2.8" ry={isBlinking ? "0.4" : "2.2"} fill="#38bdf8" className="shadow-[0_0_10px_#22d3ee]" />
                                <circle cx="26" cy="26" r={isBlinking ? "0" : "1"} fill="#ffffff" />
                                <path d="M 23 24.2 C 24.5 23.4, 27.5 23.4, 29 24.2" stroke="#38bdf8" strokeWidth="1" strokeLinecap="round" />
                                
                                <ellipse cx="38" cy="26" rx="2.8" ry={isBlinking ? "0.4" : "2.2"} fill="#38bdf8" className="shadow-[0_0_10px_#22d3ee]" />
                                <circle cx="38" cy="26" r={isBlinking ? "0" : "1"} fill="#ffffff" />
                                <path d="M 35 24.2 C 36.5 23.4, 39.5 23.4, 41 24.2" stroke="#38bdf8" strokeWidth="1" strokeLinecap="round" />
                            </g>
                            <path d="M 32 29 L 31.5 33 L 32.5 33" stroke="#38bdf8" strokeWidth="0.9" strokeLinecap="round" opacity="0.7" />
                            <path d="M 28 38 C 30 39.5, 34 39.5, 36 38 C 34 40, 30 40, 28 38 Z" fill="#38bdf8" opacity="0.9" />
                        </svg>

                        <div className="absolute inset-x-0 h-1 bg-gradient-to-r from-transparent via-cyan-300 to-transparent shadow-[0_0_10px_#22d3ee] animate-scanline pointer-events-none opacity-80"></div>
                    </div>
                    {showStatus && (
                        <div className={`absolute ${isLarge ? 'bottom-1.5 right-1.5 w-4.5 h-4.5 border-2' : '-bottom-0.5 right-0.5 w-3.5 h-3.5 border'} bg-emerald-400 rounded-full border-slate-950 shadow-[0_0_12px_#34d399] animate-ping`} title="Core Neural Operacional"></div>
                    )}
                </div>
            );
        }

        function App() {
            const [darkMode, setDarkMode] = React.useState(true);
            const [soundEnabled, setSoundEnabled] = React.useState(true);
            const [isSpeaking, setIsSpeaking] = React.useState(false);
            const [isListening, setIsListening] = React.useState(false);
            const [liveWeather, setLiveWeather] = React.useState(null);
            const [hourlyForecast, setHourlyForecast] = React.useState(null);
            
            const [activeTab, setActiveTab] = React.useState("chat");
            
            const [termsOpen, setTermsOpen] = React.useState(false);
            const [shareModalOpen, setShareModalOpen] = React.useState(false);
            const [toastMessage, setToastMessage] = React.useState(null);
            const [fontSizeScale, setFontSizeScale] = React.useState(100);
            const [deferredPrompt, setDeferredPrompt] = React.useState(null);
            
            const [termsAccepted, setTermsAccepted] = React.useState(
                () => localStorage.getItem("sarah_terms_accepted_v45") === "1"
            );
            const [check1, setCheck1] = React.useState(false);
            const [check2, setCheck2] = React.useState(false);

            const [messages, setMessages] = React.useState([]);
            const [input, setInput] = React.useState("");
            const [isLoadingChat, setIsLoadingChat] = React.useState(false);
            const [hasIntroduced, setHasIntroduced] = React.useState(
                () => localStorage.getItem("sarah_introduced_v45") === "1"
            );

            const speechIdRef = React.useRef(0);
            const voiceTimerRef = React.useRef(null);
            const voicesRef = React.useRef([]);
            const mapRef = React.useRef(null);
            const mapInstanceRef = React.useRef(null);
            const chartRef = React.useRef(null);
            const chartInstanceRef = React.useRef(null);

            const showToast = (msg) => {
                setToastMessage(msg);
                setTimeout(() => setToastMessage(null), 3500);
            };

            React.useEffect(() => {
                window.addEventListener('beforeinstallprompt', (e) => {
                    e.preventDefault();
                    setDeferredPrompt(e);
                });
            }, []);

            const handleInstallApp = async () => {
                if (deferredPrompt) {
                    deferredPrompt.prompt();
                    const { outcome } = await deferredPrompt.userChoice;
                    if (outcome === 'accepted') {
                        setDeferredPrompt(null);
                        showToast("🎉 Aplicativo instalado com sucesso!");
                    }
                } else {
                    showToast("📱 PWA pronto! Adicione à Tela Inicial pelo menu do seu navegador.");
                }
            };

            const carregarVozes = () => {
                if ("speechSynthesis" in window) {
                    voicesRef.current = window.speechSynthesis.getVoices();
                }
            };

            React.useEffect(() => {
                if (!("speechSynthesis" in window)) return;
                carregarVozes();
                window.speechSynthesis.onvoiceschanged = carregarVozes;
                return () => {
                    window.speechSynthesis.cancel();
                    window.speechSynthesis.onvoiceschanged = null;
                };
            }, []);

            const limparTextoParaFala = (text) => {
                return String(text)
                    .replace(/[#*_`~]/g, "")
                    .replace(/\[(.*?)\]\(.*?\)/g, "$1")
                    .replace(/https?:\/\/\S+/g, "")
                    .replace(/\s+/g, " ")
                    .trim();
            };

            const escolherMelhorVoz = () => {
                const voices = voicesRef.current.length
                    ? voicesRef.current
                    : window.speechSynthesis.getVoices();
                const preferidas = [
                    "Google português do Brasil",
                    "Google Português do Brasil",
                    "Microsoft Francisca",
                    "Microsoft Maria"
                ];
                return (
                    voices.find((voice) =>
                        preferidas.some((name) =>
                            voice.name.toLowerCase().includes(name.toLowerCase())
                        )
                    ) ||
                    voices.find((voice) => voice.lang.toLowerCase() === "pt-br") ||
                    voices.find((voice) => voice.lang.toLowerCase().startsWith("pt")) ||
                    voices[0]
                );
            };

            const stopSpeaking = () => {
                speechIdRef.current += 1;
                if (voiceTimerRef.current) {
                    clearTimeout(voiceTimerRef.current);
                    voiceTimerRef.current = null;
                }
                if ("speechSynthesis" in window) {
                    window.speechSynthesis.cancel();
                }
                setIsSpeaking(false);
            };

            const speakText = (text) => {
                if (!soundEnabled || !("speechSynthesis" in window)) return;
                const cleanText = limparTextoParaFala(text);
                if (!cleanText) return;
                stopSpeaking();
                const currentId = speechIdRef.current;
                voiceTimerRef.current = setTimeout(() => {
                    if (currentId !== speechIdRef.current) return;
                    const utterance = new SpeechSynthesisUtterance(cleanText);
                    const voice = escolherMelhorVoz();
                    utterance.lang = "pt-BR";
                    utterance.voice = voice || null;
                    utterance.rate = 0.96;
                    utterance.pitch = 1.0;
                    utterance.volume = 1;
                    utterance.onstart = () => {
                        if (currentId === speechIdRef.current) setIsSpeaking(true);
                    };
                    utterance.onend = () => {
                        if (currentId === speechIdRef.current) setIsSpeaking(false);
                    };
                    utterance.onerror = () => setIsSpeaking(false);
                    window.speechSynthesis.speak(utterance);
                }, 200);
            };

            React.useEffect(() => {
                if (!termsAccepted || hasIntroduced) return;
                const greeting = getBrasiliaGreeting();
                const presentation = `${greeting}, sou a SARAH IA, núcleo de inteligência artificial e monitoramento da Defesa Civil Comunitária Cidadão Sensor. Sistemas de segurança ativados.`;
                const timer = setTimeout(() => {
                    if (!soundEnabled) return;
                    setHasIntroduced(true);
                    localStorage.setItem("sarah_introduced_v45", "1");
                    speakText(presentation);
                }, 700);
                return () => clearTimeout(timer);
            }, [termsAccepted, hasIntroduced, soundEnabled]);

            const handleShareLink = () => {
                setShareModalOpen(true);
            };

            const compartilharWhatsApp = () => {
                const text = encodeURIComponent("🛡️ SARAH IA • Defesa Civil Comunitária Cidadão Sensor\n📍 Comunidade do Sebinho (Rua Amazonas), Mesquita - RJ\nAcesse o app oficial: " + window.location.href);
                window.open(`https://api.whatsapp.com/send?text=${text}`, '_blank');
            };

            const compartilharTelegram = () => {
                const text = encodeURIComponent("🛡️ SARAH IA • Defesa Civil Comunitária Cidadão Sensor (Comunidade do Sebinho, Mesquita RJ): " + window.location.href);
                window.open(`https://t.me/share/url?url=${encodeURIComponent(window.location.href)}&text=${text}`, '_blank');
            };

            const copiarLinkComIcone = async () => {
                const shareText = `🛡️ SARAH IA Core • Defesa Civil Comunitária Cidadão Sensor\n📍 Rua Amazonas / Comunidade do Sebinho, Mesquita - RJ\n🔗 ${window.location.href}`;
                if (navigator.clipboard) {
                    await navigator.clipboard.writeText(shareText);
                    showToast("🔗 Link e escudo copiados com sucesso!");
                    setShareModalOpen(false);
                }
            };

            React.useEffect(() => {
                fetch(
                    "https://api.open-meteo.com/v1/forecast" +
                    "?latitude=-22.7830&longitude=-43.4135" +
                    "&current=temperature_2m,relative_humidity_2m,precipitation,weather_code,wind_speed_10m" +
                    "&hourly=temperature_2m,precipitation_probability,precipitation"
                )
                    .then((response) => response.json())
                    .then((data) => {
                        if (data && data.current) {
                            setLiveWeather(data.current);
                        }
                        if (data && data.hourly) {
                            setHourlyForecast(data.hourly);
                        }
                    })
                    .catch((error) => {
                        console.warn("Clima indisponível:", error);
                    });
            }, []);

            React.useEffect(() => {
                document.documentElement.classList.toggle("dark", darkMode);
                document.documentElement.classList.toggle("light", !darkMode);
            }, [darkMode]);

            // Mapa Leaflet centralizado na Rua Amazonas / Comunidade do Sebinho (com S)
            React.useEffect(() => {
                if (activeTab === "radar" && mapRef.current && !mapInstanceRef.current) {
                    const lat = -22.7830;
                    const lng = -43.4135;
                    const map = L.map(mapRef.current).setView([lat, lng], 17);
                    
                    L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
                        maxZoom: 19,
                        attribution: "© OpenStreetMap | SARAH IA Core"
                    }).addTo(map);

                    L.marker([lat, lng])
                        .addTo(map)
                        .bindPopup("<div style='font-family:monospace; color:#0f172a;'><b>Setor Neural:</b> Rua Amazonas / Comunidade do Sebinho<br>Rocha Sobrinho, Mesquita - RJ<br><i>Monitoramento Ativo.</i></div>")
                        .openPopup();

                    mapInstanceRef.current = map;
                }
                if (activeTab === "radar" && mapInstanceRef.current) {
                    setTimeout(() => {
                        mapInstanceRef.current?.invalidateSize();
                    }, 120);
                }
                if (activeTab !== "radar" && mapInstanceRef.current) {
                    mapInstanceRef.current.remove();
                    mapInstanceRef.current = null;
                }
            }, [activeTab]);

            React.useEffect(() => {
                if (activeTab !== "telemetry" || !chartRef.current) return;

                if (chartInstanceRef.current) {
                    chartInstanceRef.current.destroy();
                    chartInstanceRef.current = null;
                }

                const ctx = chartRef.current.getContext("2d");
                const nowIndex = new Date().getHours();
                const labels = hourlyForecast && hourlyForecast.time 
                    ? hourlyForecast.time.slice(nowIndex, nowIndex + 12).map(t => t.split("T")[1]) 
                    : ["00:00", "02:00", "04:00", "06:00", "08:00", "10:00", "12:00", "14:00", "16:00", "18:00", "20:00", "22:00"];
                
                const tempData = hourlyForecast && hourlyForecast.temperature_2m 
                    ? hourlyForecast.temperature_2m.slice(nowIndex, nowIndex + 12) 
                    : [24, 23.5, 23, 22.5, 24, 27, 29, 31, 30, 28, 26, 25];

                const precipData = hourlyForecast && hourlyForecast.precipitation 
                    ? hourlyForecast.precipitation.slice(nowIndex, nowIndex + 12)
                    : [0, 0, 0.2, 0, 0, 0, 1.5, 0.4, 0, 0, 0, 0];

                chartInstanceRef.current = new Chart(ctx, {
                    type: "bar",
                    data: {
                        labels: labels,
                        datasets: [
                            {
                                type: "line",
                                label: "Temperatura (°C)",
                                data: tempData,
                                borderColor: "#22d3ee",
                                backgroundColor: "rgba(34, 211, 238, 0.18)",
                                borderWidth: 3.5,
                                fill: true,
                                tension: 0.4,
                                yAxisID: 'y',
                                pointBackgroundColor: "#020617",
                                pointBorderColor: "#22d3ee",
                                pointBorderWidth: 3,
                                pointRadius: 6
                            },
                            {
                                type: "bar",
                                label: "Precipitação (mm)",
                                data: precipData,
                                backgroundColor: "rgba(14, 165, 233, 0.7)",
                                borderColor: "#0ea5e9",
                                borderWidth: 1.5,
                                borderRadius: 6,
                                yAxisID: 'y1'
                            }
                        ]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        scales: {
                            y: {
                                type: 'linear',
                                display: true,
                                position: 'left',
                                grid: { color: darkMode ? "rgba(148, 163, 184, 0.15)" : "rgba(15, 23, 42, 0.12)" },
                                ticks: { 
                                    color: darkMode ? "#38bdf8" : "#0369a1", 
                                    font: { family: "monospace", size: 12, weight: 'bold' } 
                                },
                                title: { display: true, text: 'Temp (°C)', color: darkMode ? "#38bdf8" : "#0369a1", font: { family: "monospace", size: 11 } }
                            },
                            y1: {
                                type: 'linear',
                                display: true,
                                position: 'right',
                                grid: { drawOnChartArea: false },
                                ticks: { 
                                    color: darkMode ? "#34d399" : "#047857", 
                                    font: { family: "monospace", size: 12, weight: 'bold' } 
                                },
                                title: { display: true, text: 'Chuva (mm)', color: darkMode ? "#34d399" : "#047857", font: { family: "monospace", size: 11 } }
                            },
                            x: {
                                grid: { color: darkMode ? "rgba(148, 163, 184, 0.1)" : "rgba(15, 23, 42, 0.1)" },
                                ticks: { 
                                    color: darkMode ? "#e2e8f0" : "#0f172a", 
                                    font: { family: "monospace", size: 11, weight: 'bold' } 
                                }
                            }
                        },
                        plugins: {
                            legend: {
                                labels: { color: darkMode ? "#f8fafc" : "#0f172a", font: { family: "monospace", size: 12, weight: 'bold' } }
                            }
                        }
                    }
                });

                return () => {
                    if (chartInstanceRef.current) {
                        chartInstanceRef.current.destroy();
                        chartInstanceRef.current = null;
                    }
                };
            }, [activeTab, hourlyForecast, darkMode]);

            const toggleListening = () => {
                const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
                if (!SpeechRec) {
                    showToast("⚠️ Reconhecimento de voz não suportado neste navegador.");
                    return;
                }
                if (isListening) {
                    setIsListening(false);
                    return;
                }
                const rec = new SpeechRec();
                rec.lang = "pt-BR";
                rec.interimResults = false;
                rec.continuous = false;
                rec.onstart = () => setIsListening(true);
                rec.onresult = (event) => {
                    const text = event.results[0][0].transcript;
                    setInput(text);
                    setIsListening(false);
                    handleSendMessage(text);
                };
                rec.onerror = () => setIsListening(false);
                rec.onend = () => setIsListening(false);
                rec.start();
            };

            const handleSendMessage = async (textCustom) => {
                stopSpeaking();
                const textToSend = textCustom !== undefined ? textCustom : input;
                if (!textToSend.trim() || isLoadingChat) return;

                const userMsg = {
                    id: `${Date.now()}-user`,
                    sender: "user",
                    text: textToSend.trim(),
                    timestamp: new Date().toLocaleTimeString("pt-BR", { hour: "2-digit", minute: "2-digit" })
                };

                const historico = [...messages, userMsg].slice(-8).map((message) => ({
                    role: message.sender === "user" ? "user" : "assistant",
                    content: message.text
                }));

                setMessages((previous) => [...previous, userMsg]);
                setInput("");
                setIsLoadingChat(true);

                const weatherContext = liveWeather
                    ? `Condições meteorológicas atuais em Mesquita/RJ (Rua Amazonas / Comunidade do Sebinho): Temperatura ${liveWeather.temperature_2m}°C, Umidade ${liveWeather.relative_humidity_2m}%, Precipitação ${liveWeather.precipitation} mm, Vento ${liveWeather.wind_speed_10m} km/h.`
                    : "Dados meteorológicos temporariamente indisponíveis.";

                try {
                    const response = await fetch(CLOUDFLARE_WORKER_URL, {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({
                            model: "openai/gpt-oss-120b",
                            messages: [
                                {
                                    role: "system",

                                        <div className="lg:col-span-3 min-h-[420px] rounded-2xl overflow-hidden border border-cyan-500/30 relative shadow-inner">
                                            <div ref={mapRef} className="w-full h-full"></div>
                                        </div>

                                        <div className="glass-dark rounded-2xl p-4 border border-cyan-500/40 flex flex-col justify-between shadow-lg">
                                            <div>
                                                <div className="flex items-center gap-2 font-mono text-xs text-cyan-400 font-bold mb-3 pb-2 border-b border-cyan-500/20">
                                                    <span>📡</span> Demonstração do Radar
                                                </div>
                                                <p className="text-[11px] text-slate-300 font-sans leading-relaxed mb-3">
                                                    Varredura Doppler em tempo real cobrindo a micro-região de Rocha Sobrinho e arredores.
                                                </p>
                                            </div>
                                            
                                            <div className="w-full h-44 rounded-xl bg-slate-950 border border-cyan-500/40 relative overflow-hidden flex items-center justify-center shadow-inner">
                                                <div className="absolute inset-0 bg-[radial-gradient(#06b6d4_1px,transparent_1px)] [background-size:12px_12px] opacity-30"></div>
                                                <div className="w-28 h-28 rounded-full border border-cyan-500/50 absolute animate-ping opacity-75"></div>
                                                <div className="w-16 h-16 rounded-full border border-cyan-400 absolute animate-pulse"></div>
                                                <div className="w-3 h-3 bg-cyan-400 rounded-full shadow-[0_0_15px_#22d3ee] z-10 animate-bounce"></div>
                                                <div className="absolute bottom-2 left-2 text-[9px] font-mono text-cyan-400 bg-slate-900/90 px-2 py-0.5 rounded border border-cyan-500/30">
                                                    SEBINHO / AMAZONAS
                                                </div>
                                            </div>

                                            <div className="mt-3 text-[10px] font-mono text-slate-400 text-center">
                                                Status: Sinais Estáveis
                                            </div>
                                        </div>
                                    </div>

                                    <p className="text-xs text-slate-400 font-mono mt-3">
                                        📍 Localização exata centrada em Rua Amazonas, Comunidade do Sebinho (com S), Rocha Sobrinho, Mesquita - RJ.
                                    </p>
                                </div>
                            )}

                            {activeTab === "telemetry" && (
                                <div className="glass-dark rounded-3xl p-5 border border-cyan-500/40 shadow-2xl flex-1 flex flex-col">
                                    <div className="flex items-center justify-between mb-4 pb-3 border-b border-cyan-500/30">
                                        <h3 className="font-mono text-cyan-400 text-sm font-bold flex items-center gap-2">
                                            <span>📈</span> Monitoramento Horário de Temperatura & Precipitação
                                        </h3>
                                        <button
                                            onClick={() => setActiveTab("chat")}
                                            className="px-3 py-1.5 bg-slate-900 border border-cyan-500/40 text-cyan-300 rounded-xl font-mono text-xs hover:bg-cyan-500/20 transition cursor-pointer"
                                        >
                                            ← Voltar ao Chat
                                        </button>
                                    </div>
                                    <div className="flex-1 min-h-[400px] p-3 bg-slate-950/90 rounded-2xl border border-cyan-500/40 shadow-inner">
                                        <canvas ref={chartRef}></canvas>
                                    </div>
                                    <p className="text-xs text-slate-400 font-mono mt-3">
                                        📊 Projeção analítica horária de alta precisão com eixos numéricos detalhados para a Defesa Civil Comunitária.
                                    </p>
                                </div>
                            )}

                        </main>
                    </div>

                    {/* Modal de Compartilhamento com Escudo Vetorial Proporcional */}
                    {shareModalOpen && (
                        <div className="fixed inset-0 bg-slate-950/85 backdrop-blur-md z-50 flex items-center justify-center p-4">
                            <div className="glass-dark border border-cyan-500/40 w-full max-w-md rounded-3xl shadow-[0_0_40px_rgba(6,182,212,0.3)] overflow-hidden flex flex-col">
                                <div className="bg-slate-950 px-5 py-3.5 border-b border-cyan-500/30 flex justify-between items-center">
                                    <h3 className="font-mono text-cyan-400 text-sm font-bold flex items-center gap-2">
                                        <span>🔗</span> Compartilhar Aplicativo
                                    </h3>
                                    <button
                                        onClick={() => setShareModalOpen(false)}
                                        className="text-slate-400 hover:text-white font-mono text-xs px-3 py-1 rounded-lg bg-slate-900 border border-slate-700 transition cursor-pointer"
                                    >
                                        ✕
                                    </button>
                                </div>
                                <div className="p-6 bg-slate-900/90 text-xs sm:text-sm text-slate-300 flex flex-col items-center text-center space-y-4">
                                    
                                    {/* Ícone de Escudo Vetorial Proporcional (Quadrado bonito) */}
                                    <div className="w-16 h-16 rounded-2xl bg-cyan-500/15 border-2 border-cyan-400/60 flex items-center justify-center text-cyan-400 shadow-[0_0_20px_rgba(6,182,212,0.4)]">
                                        <CyberShieldIcon className="w-10 h-10" />
                                    </div>

                                    <div>
                                        <h4 className="font-bold text-slate-100 font-mono text-sm">Defesa Civil Comunitária Cidadão Sensor</h4>
                                        <p className="text-[11px] text-cyan-400 font-mono mt-1">SARAH IA Core • Comunidade do Sebinho</p>
                                    </div>

                                    <div className="w-full grid grid-cols-2 gap-3">
                                        <button
                                            onClick={compartilharWhatsApp}
                                            className="py-3 px-4 bg-emerald-600 hover:bg-emerald-500 text-white font-mono text-xs font-bold rounded-xl transition flex items-center justify-center gap-2 shadow-md cursor-pointer"
                                        >
                                            <span>💬</span> WhatsApp
                                        </button>
                                        <button
                                            onClick={compartilharTelegram}
                                            className="py-3 px-4 bg-sky-600 hover:bg-sky-500 text-white font-mono text-xs font-bold rounded-xl transition flex items-center justify-center gap-2 shadow-md cursor-pointer"
                                        >
                                            <span>✈️</span> Telegram
                                        </button>
                                    </div>

                                    <button
                                        onClick={copiarLinkComIcone}
                                        className="w-full py-3 bg-slate-950 hover:bg-slate-900 border border-cyan-500/40 text-cyan-300 font-mono text-xs font-bold rounded-xl transition shadow-inner cursor-pointer"
                                    >
                                        📋 Copiar Link Completo
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                    {termsOpen && (
                        <div className="fixed inset-0 bg-slate-950/85 backdrop-blur-md z-50 flex items-center justify-center p-4">
                            <div className="glass-dark border border-cyan-500/40 w-full max-w-xl rounded-3xl shadow-[0_0_40px_rgba(6,182,212,0.3)] overflow-hidden">
                                <div className="bg-slate-950 px-5 py-3.5 border-b border-cyan-500/30 flex justify-between items-center">
                                    <h3 className="font-mono text-cyan-400 text-sm font-bold flex items-center gap-2">
                                        <CyberShieldIcon className="w-5 h-5" /> Conformidade LGPD & Governança
                                    </h3>
                                    <button
                                        onClick={() => setTermsOpen(false)}
                                        className="text-slate-400 hover:text-white font-mono text-xs px-3 py-1 rounded-lg bg-slate-900 border border-slate-700 transition cursor-pointer"
                                    >
                                        ✕ Fechar
                                    </button>
                                </div>
                                <div className="p-6 bg-slate-900/90 text-xs sm:text-sm text-slate-300 space-y-3 leading-relaxed font-sans">
                                    <p>
                                        <strong>SARAH IA Core v4.5 PRO</strong> opera estritamente sob os preceitos da Lei Federal de Proteção de Dados (LGPD - Lei nº 13.709/2018), garantindo criptografia e privacidade aos registros comunitários em Mesquita/RJ.
                                    </p>
                                    <p>
                                        O sistema fornece suporte preventivo de Defesa Civil Comunitária Cidadão Sensor em tempo real com base meteorológica na Comunidade do Sebinho (Rua Amazonas).
                                    </p>
                                    <p className="text-cyan-400 font-mono font-bold">
                                        🚨 Em caso de emergência iminente, acione imediatamente a Defesa Civil pelo número 199.
                                    </p>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* Faixa Oficial de Emergência e Contatos em Movimento ("Indo e Voltando") */}
                    <div className="bg-cyan-950/90 border-t border-cyan-500/30 py-2 overflow-hidden shadow-inner">
                        <marquee behavior="alternate" scrollamount="4" className="font-mono text-xs text-cyan-300 font-bold tracking-wide">
                            🚨 PLANTÃO & EMERGÊNCIA SEBINHO: Defesa Civil (199 / 21 4040-1772) • Bombeiro (193) • CCO: (21) 2042-7020 • Alerta ZAP 📲 (21) 97299-3223 • CRAS Rocha Sobrinho: (21) 2042-8931
                        </marquee>
                    </div>

                    <footer className="bg-slate-950 border-t border-cyan-500/20 py-4 px-4 text-center text-xs font-mono text-slate-400 space-y-1 shadow-inner">
                        <div>Todos os direitos reservados 2024–2028 Grupo a Chave da Esperança Sebinho Mesquita RJ</div>
                        <div className="text-cyan-400 font-bold">Defesa Civil Comunitária Cidadão Sensor • SARAH IA Core v4.5 PRO</div>
                    </footer>
                </div>
            );
        }

        const root = ReactDOM.createRoot(getElementByIdOrFallback());
        function getElementByIdOrFallback() {
            let el = document.getElementById("root");
            if (!el) {
                el = document.createElement("div");
                el.id = "root";
                document.body.appendChild(el);
            }
            return el;
        }
        root.render(<App />);

        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js').catch(() => {});
            });
        }
    </script>
</body>
</html>
