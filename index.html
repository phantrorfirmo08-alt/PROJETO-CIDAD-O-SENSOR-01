    <script type="text/babel">
        const R = React;
        const { useState, useRef, useEffect, useMemo, useCallback, Fragment } = React;
        document.addEventListener('gesturestart', function(e) { e.preventDefault(); });

        let lastTouchEnd = 0;
        document.addEventListener('touchend', function(e) {
            const now = (new Date()).getTime();
            if (now - lastTouchEnd <= 300) { e.preventDefault(); }
            lastTouchEnd = now;
        }, { passive: false });

        const CLOUDFLARE_WORKER_URL = "https://sarah-envelope.phantrorfirmo08.workers.dev/";
        const APP_SHARE_URL = "https://phantrorfirmo08-alt.github.io/PROJETO-CIDAD-O-SENSOR-01/";
        
        const SPLASH_IMAGE_URL = "https://www.image2url.com/r2/default/images/1792314795970-5a397155-f3e3-4aa1-98b3-9d1482626b0f.png";
        const SARAH_CUSTOM_AVATAR_URL = "https://cdn.imagetourls.com/uploads/tyImg/195w5uur9.png";

        const SHARE_ICON_SVG_DATAURI = "data:image/svg+xml;utf8," + encodeURIComponent(`
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
              <defs>
                <radialGradient id="bgG" cx="50%" cy="50%" r="50%">
                  <stop offset="0%" stop-color="#060B18"/>

                  <stop offset="0%" stop-color="#00F2FE"/>
                  <stop offset="50%" stop-color="#4FACFE"/>
                  <stop offset="100%" stop-color="#10B981"/>
                </linearGradient>
                <linearGradient id="goldG" x1="0%" y1="0%" x2="100%" y2="100%">
                  <stop offset="0%" stop-color="#FF9900"/>
                  <stop offset="100%" stop-color="#F59E0B"/>
                </linearGradient>
              </defs>
              <rect width="512" height="512" rx="110" fill="url(#bgG)" stroke="url(#cyberG)" stroke-width="8"/>
              <circle cx="256" cy="256" r="200" fill="none" stroke="url(#cyberG)" stroke-width="2" stroke-dasharray="10 6" opacity="0.4"/>
              <circle cx="256" cy="256" r="160" fill="none" stroke="#00F2FE" stroke-width="4" opacity="0.6"/>
              <path d="M256 116 L316 216 L196 216 Z" fill="none" stroke="url(#goldG)" stroke-width="8" stroke-linejoin="round"/>
              <path d="M256 160 L256 320" stroke="url(#cyberG)" stroke-width="12" stroke-linecap="round"/>
              <circle cx="256" cy="356" r="18" fill="#10B981"/>
              <circle cx="160" cy="256" r="12" fill="#00F2FE"/>
              <circle cx="352" cy="256" r="12" fill="#FF9900"/>
            </svg>
        `);

        const shareMessageText = `REDE DE RESILIÊNCIA ESTENDIDA • MÓDULO AMPLIADO 92 MUNICÍPIOS-RJ\nCiência Cidadã • REMA • Estação Pública Comunitária de Resiliência\nMesquita / RJ • Todos unidos, todos protegidos, Baixada.\n\nInstale o app oficial:\n${APP_SHARE_URL}`;

        async function compartilharComIconeEfetivo(showToast) {
            try {
                const response = await fetch(SHARE_ICON_SVG_DATAURI);
                const blob = await response.blob();
                const file = new File([blob], "cidadao_sensor_icone.svg", { type: "image/svg+xml" });

                const shareData = {
                    title: "Rede de Resiliência Estendida • Cidadão Sensor",
                    text: shareMessageText,
                    url: APP_SHARE_URL,
                    files: [file]
                };

                if (navigator.canShare && navigator.canShare({ files: [file] })) {
                    await navigator.share(shareData);
                    return;
                }
            } catch (e) {
                console.log("Compartilhamento de arquivo não suportado, alternando para texto/link.", e);
            }

            if (navigator.share) {
                try {
                    await navigator.share({
                        title: "Rede de Resiliência Estendida • Cidadão Sensor",
                        text: shareMessageText,
                        url: APP_SHARE_URL
                    });
                    return;
                } catch (err) {
                    if (err.name === 'AbortError') return;
                }
            }

            navigator.clipboard.writeText(shareMessageText);
            if (showToast) showToast("📋 Link e mensagem copiados!");
        }

        // =========================================================================
        // PAINEL CLOUD DA REDE ESTENDIDA CIDADÃO SENSOR EMPREENDIMENTOS
        // =========================================================================
        function ModuloCidadaoSensorCloudModule({ showToast, onGoToDashboard }) {
            const videoRef = useRef(null);
            const canvasRef = useRef(null);
            const [registros, setRegistros] = useState(() => {
                try { return JSON.parse(localStorage.getItem('eprca_registros_v8') || '[]'); } catch(e){ return []; }
            });
            const [protocolo, setProtocolo] = useState('');
            const [validacao, setValidacao] = useState('');
            const [gps, setGps] = useState('GPS aguardando...');
            const [fotos, setFotos] = useState([null, null]);

            const [entidadeId, setEntidadeId] = useState("Iniciativa Grupo A Chave da Esperança");
            const [tipoAcao, setTipoAcao] = useState("Coleta Seletiva / Recicláveis (PET, Papelão, Ferro, Alumínio)");
            const [categoriaMaterial, setCategoriaMaterial] = useState("Papelão / Caixas");
            const [pesoVolume, setPesoVolume] = useState("");
            const [qtdPet, setQtdPet] = useState("0");
            const [valorKg, setValorKg] = useState("1.80");
            const [localizacao, setLocalizacao] = useState("Sebinho - Rocha Sobrinho - Mesquita - RJ");
            const [observacoes, setObservacoes] = useState("");
            const [filtroEntidade, setFiltroEntidade] = useState("");

            useEffect(() => {
                gerarProtocoloNovo();
            }, []);

            const gerarValidacaoHash = async (t) => {
                try {
                    const b = new TextEncoder().encode(t);
                    const h = await crypto.subtle.digest('SHA-256', b);
                    return Array.from(new Uint8Array(h)).map(x => x.toString(16).padStart(2,'0')).join('').toUpperCase();
                } catch(e) { return "HASH-OK-SECURE"; }
            };

            const gerarProtocoloNovo = async () => {
                const p = `PROT-REDE-${Date.now()}-330285810000030`;
                const v = await gerarValidacaoHash(p + Date.now());
                setProtocolo(p);
                setValidacao(v);
            };

            const iniciarCameraGps = async () => {
                try {
                    const s = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
                    if (videoRef.current) videoRef.current.srcObject = s;
                    navigator.geolocation.getCurrentPosition(p => {
                        const coords = `${p.coords.latitude.toFixed(6)}, ${p.coords.longitude.toFixed(6)}`;
                        setGps(coords);
                        setLocalizacao(coords);
                        showToast("📍 GPS Fixado com Sucesso!");
                    }, () => {
                        setGps('GPS Indisponível');
                        showToast("⚠️ GPS indisponível, usando padrão.");
                    }, { enableHighAccuracy: true });
                    showToast("📹 Câmera ativada!");
                } catch(e) {
                    showToast("⚠️ Permissão de câmera negada.");
                }
            };

            const capturarFoto = (i) => {
                const vid = videoRef.current;
                const canv = canvasRef.current;
                if (!vid || !vid.srcObject) { showToast("⚠️ Ative a câmera primeiro!"); iniciarCameraGps(); return; }
                const ctx = canv.getContext('2d');
                canv.width = vid.videoWidth || 640;
                canv.height = vid.videoHeight || 480;
                ctx.drawImage(vid, 0, 0, canv.width, canv.height);
                
                const agora = new Date().toLocaleString('pt-BR');
                ctx.fillStyle = 'rgba(2,4,10,0.88)';
                ctx.fillRect(0, canv.height - 66, canv.width, 66);
                ctx.fillStyle = '#00F2FE';
                ctx.fillRect(0, canv.height - 66, canv.width, 2);
                ctx.fillStyle = '#FFF';
                ctx.font = 'bold 11px monospace';
                ctx.fillText(`REDE ESTENDIDA | ${agora} | ${gps}`, 10, canv.height - 32);
                ctx.font = '8px monospace';
                ctx.fillStyle = '#D4AF37';
                ctx.fillText(`SARAH COORDENADORA | ${protocolo} | ${validacao.substring(0,22)}`, 10, canv.height - 10);
                
                const imgUrl = canv.toDataURL('image/jpeg', 0.85);
                const n = [...fotos];
                n[i] = imgUrl;
                setFotos(n);
                showToast(`📸 Foto 0${i+1} capturada!`);
            };

            const pesoNum = parseFloat(pesoVolume) || 0;
            const qtdNum = parseInt(qtdPet) || 0;
            const valorKgNum = parseFloat(valorKg) || 0;
            const valorTotal = pesoNum * valorKgNum;

            let totalVol = 0, totalRec = 0, totalUn = 0;
            registros.forEach(r => {
                const p = parseFloat(r.pesoVolume) || 0;
                const q = parseInt(r.qtdPet) || 0;
                if (r.tipoAcao && r.tipoAcao.includes('Volumosos')) totalVol += p;
                if (r.tipoAcao && r.tipoAcao.includes('Seletiva')) totalRec += p;
                totalUn += q;
            });

            const salvarRegistroCloud = async (e) => {
                e.preventDefault();
                const novoReg = {
                    id: Date.now(),
                    dataHora: new Date().toLocaleString('pt-BR'),
                    entidadeId,
                    tipoAcao,
                    categoriaMaterial,
                    pesoVolume,
                    qtdPet,
                    valorKg,
                    localizacao,
                    observacoes,
                    protocolo,
                    validacao,
                    gps,
                    fotos: fotos.filter(Boolean)
                };

                const atualizados = [novoReg, ...registros];
                setRegistros(atualizados);
                try { localStorage.setItem('eprca_registros_v8', JSON.stringify(atualizados)); } catch(err){}

                try {
                    await fetch(CLOUDFLARE_WORKER_URL, {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({ action: "save_record", data: novoReg })
                    });
                    showToast("☁️ Salvo e Sincronizado na Nuvem Cloudflare!");
                } catch(err) {
                    showToast("💾 Salvo localmente (Nuvem em fundo).");
                }

                gerarProtocoloNovo();
                setPesoVolume("");
                setQtdPet("0");
                setObservacoes("");
                setFotos([null, null]);
            };

            const exportarJSON = () => {
                const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(registros, null, 2));
                const dlAnchor = document.createElement('a');
                dlAnchor.setAttribute("href", dataStr);
                dlAnchor.setAttribute("download", `rede_cidadao_sensor_${Date.now()}.json`);
                document.body.appendChild(dlAnchor);
                dlAnchor.click();
                dlAnchor.remove();
                showToast("📥 Histórico baixado!");
            };

            const compartilharWhats = () => {
                const txt = `*${entidadeId}*%0A*SARAH - COORDENADORA*%0A📋 ${entidadeId}%0A📦 Material: ${categoriaMaterial}%0A⚖️ Peso: ${pesoVolume}kg | Qtd: ${qtdNum}%0A📍 GPS: ${gps}%0A🔖 ${protocolo}`;
                window.open(`https://wa.me/?text=${txt}`, '_blank');
            };

            const gerarPDFLaudo = () => {
                try {
                    const { jsPDF } = window.jspdf;
                    const doc = new jsPDF();
                    doc.text(`REDE ESTENDIDA - ${protocolo}`, 10, 10);
                    doc.text(`SARAH - ${entidadeId}`, 10, 16);
                    let y = 28;
                    fotos.filter(Boolean).forEach(f => {
                        doc.addImage(f, 'JPEG', 10, y, 90, 55);
                        y += 60;
                        if(y > 250){ doc.addPage(); y = 10; }
                    });
                    doc.save(`${protocolo}.pdf`);
                    showToast("📄 PDF gerado!");
                } catch(e) {
                    showToast("❌ Erro ao gerar PDF.");
                }
            };

            const registrosFiltrados = registros.filter(r => {
                const matchEnt = !entidadeId || (r.entidadeId && r.entidadeId.toLowerCase().includes(entidadeId.toLowerCase()));
                const matchFiltro = !filtroEntidade || (r.entidadeId && r.entidadeId.toLowerCase().includes(filtroEntidade.toLowerCase())) || (r.categoriaMaterial && r.categoriaMaterial.toLowerCase().includes(filtroEntidade.toLowerCase()));
                return matchEnt && matchFiltro;
            });

            return (
                <div className="space-y-4 max-w-4xl mx-auto font-mono">
                    <div className="cyber-card p-4 sm:p-6 rounded-[28px] border border-cyberCyan/50 shadow-2xl space-y-4">
                        <div className="flex items-center justify-between border-b border-cyberCyan/30 pb-3 flex-wrap gap-2">
                            <div>
                                <h2 className="font-display text-xs sm:text-sm font-black text-cyberCyan tracking-wider uppercase">
                                    REDE ESTENDIDA CIDADÃO SENSOR EMPREENDIMENTOS
                                </h2>
                                <p className="text-[10px] text-orange-400 font-bold mt-0.5">
                                    SARAH - COORDENADORA DE VENDAS • Defesa Cidadã Coletiva
                                </p>
                            </div>
                            <div className="flex items-center gap-2">
                                <div className="px-3 py-1 rounded-full bg-emerald-500/15 border border-emerald-400 text-emerald-300 text-[9px] font-bold flex items-center gap-1.5">
                                    <span className="w-2 h-2 rounded-full bg-emerald-400 animate-ping"></span>
                                    NUVEM CLOUDFLARE ATIVA
                                </div>
                                {onGoToDashboard && (
                                    <button onClick={onGoToDashboard} className="px-3 py-1 bg-cyberCyan/20 text-cyberCyan border border-cyberCyan/40 rounded-xl text-[10px] font-bold cursor-pointer">
                                        Painel EPRCA
                                    </button>
                                )}
                            </div>
                        </div>

                                <button disabled={!check1 || !check2} onClick={() => { setTermsAccepted(true); try{localStorage.setItem("cparc_terms_accepted","1");}catch(e){} showToast("🚀 Acesso liberado!"); }} className={`w-full py-3 rounded-xl font-black text-xs uppercase tracking-wider ${check1&&check2?'cyber-button cursor-pointer':'bg-commandPanel text-slate-500 cursor-not-allowed'}`}>
                                    CONCORDAR E ENTRAR
                                </button>
                            </div>
                        </div>
                    )}

                    <header className="cyber-card sticky top-0 z-30 w-full max-w-4xl px-4 py-2.5 border-b border-cyberCyan/30 flex items-center justify-between shadow-lg rounded-b-xl">
                        <div className="flex items-center gap-2.5">
                            <div className="w-9 h-9 rounded-xl flex items-center justify-center bg-void border border-cyberCyan">
                                <img src={SPLASH_IMAGE_URL} className="w-full h-full object-cover rounded-xl"/>
                            </div>
                            <div>
                                <h1 className="font-display text-[10px] sm:text-[11px] font-black text-white">CIDADÃO SENSOR • NUVEM</h1>
                                <p className="text-[8px] text-cyberCyan font-mono font-bold">SARAH COORDENADORA</p>
                            </div>
                        </div>
                        <div className="flex items-center gap-1.5">
                            <button onClick={() => compartilharComIconeEfetivo(showToast)} className="px-3 py-1.5 rounded-xl bg-commandPanel border border-cyberCyan/40 text-cyberCyan text-[10px] font-bold cursor-pointer">
                                🔗 Compartilhar App
                            </button>
                        </div>
                    </header>

                    <nav className="cyber-card w-full max-w-4xl border-b border-cyberCyan/30 px-3 py-2 flex items-center justify-center gap-2 z-20">
                        {NAV_TABS.map(tab => (
                            <button key={tab.id} onClick={() => handleNavClick(tab.id)}
                                className={`px-4 py-2 rounded-xl text-[10px] font-black transition cursor-pointer flex items-center gap-1.5 ${activeTab === tab.id ? 'cyber-button shadow-lg' : 'bg-commandPanel text-slate-300 border border-cyberCyan/20'}`}>
                                {tab.iconComponent} {tab.label}
                            </button>
                        ))}
                    </nav>

                    <main className="flex-1 w-full max-w-4xl mx-auto p-3 sm:p-4 space-y-4 pb-32 relative z-10">
                        <div className="cyber-card p-5 rounded-[24px] text-center space-y-2 border border-cyberCyan/50 shadow-xl">
                            <h2 className="font-display font-black text-xs sm:text-sm text-cyan-200 uppercase tracking-wider leading-relaxed">
                                REDE DE RESILIÊNCIA ESTENDIDA • MÓDULO AMPLIADO 92 MUNICÍPIOS-RJ
                            </h2>
                            <p className="text-[10px] font-bold text-cyberCyan tracking-widest">
                                CIÊNCIA CIDADÃ • REMA
                            </p>
                            <p className="text-[10px] font-bold text-[#D4AF37] tracking-wider">
                                ESTAÇÃO PÚBLICA COMUNITÁRIA DE RESILIÊNCIA • MESQUITA / RJ
                            </p>
                            <div className="pt-1">
                                <span className="inline-block px-3 py-1 rounded-full bg-emerald-500/15 border border-emerald-400 text-emerald-300 text-[9px] font-black tracking-wider uppercase">
                                    "Todos unidos, todos protegidos, Baixada"
                                </span>
                            </div>
                        </div>

                        {activeTab === 'cidadao-cloud' && <ModuloCidadaoSensorCloudModule showToast={showToast} onGoToDashboard={() => setActiveTab('dashboard')} />}
                        {activeTab === 'dashboard' && (
                            <div className="cyber-card p-6 rounded-[28px] text-center space-y-4">
                                <h2 className="font-display font-black text-sm text-cyberCyan">PAINEL GERAL & BALANÇA NUVEM</h2>
                                <p className="text-xs text-slate-300">Gerencie pesagens de recicláveis, volumosos e sincronize com o Cloudflare Worker.</p>
                                <button onClick={() => setActiveTab('cidadao-cloud')} className="cyber-button px-6 py-3 rounded-xl text-xs font-black uppercase">Abrir Módulo Cidadão Sensor</button>
                            </div>
                        )}
                        {activeTab === 'estacao' && <EstacaoSobrevivenciaModule showToast={showToast} />}

                        <div className="text-center py-4 space-y-1">
                            <p className="text-[9px] text-slate-400 font-mono">Rede Estendida Cidadão Sensor • Baixada Fluminense / RJ</p>
                            <div className="mt-2 text-[8px] font-mono font-bold text-slate-400 tracking-widest">
                                @ Todos os direitos reservados - GADE Evolution 2024-2026
                            </div>
                        </div>
                    </main>

                    <NativeHydroWindRadar isOpen={radarOpen} onToggle={() => setRadarOpen(o => !o)} />

                    <footer className="cyber-card fixed bottom-0 left-0 right-0 z-40 border-t border-cyberCyan/30 px-3 py-2.5 flex items-center justify-around shadow-xl backdrop-blur-2xl max-w-4xl mx-auto rounded-t-xl">
                        {NAV_TABS.map(tab => (
                            <button key={tab.id} onClick={() => handleNavClick(tab.id)}
                                className={`flex flex-col items-center gap-0.5 cursor-pointer transition ${activeTab === tab.id ? 'text-cyberCyan scale-105' : 'text-slate-400 hover:text-white'}`}>
                                {tab.iconComponent}
                                <span className="text-[8px] font-black tracking-wider">{tab.label}</span>
                            </button>
                        ))}
                    </footer>
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
