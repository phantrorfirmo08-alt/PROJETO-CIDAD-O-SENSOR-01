<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MINI RADIO NEXUS</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    * { box-sizing: border-box; user-select: none; -webkit-user-select: none; }
    input, textarea, select { user-select: text !important; -webkit-user-select: text !important; }
    body { margin: 0; min-height: 100vh; background: #02040A; color: #E2F1FF; font-family: monospace; }
    .box { background: #050B18; border: 1px solid rgba(0, 242, 254, 0.3); }
    .btn { background: rgba(0, 242, 254, 0.1); border: 1px solid rgba(0, 242, 254, 0.35); color: #E2F1FF; cursor: pointer; transition: background 0.15s ease, border-color 0.15s ease; }
    .btn:hover { border-color: rgba(0, 242, 254, 0.75); }
    .on { border-color: #00FF9D; background: rgba(0, 255, 157, 0.18); color: #FFF; }
    .warn { border-color: #FF2E54; background: rgba(255, 46, 84, 0.25); color: #FFD6DE; }
  </style>
</head>
<body class="p-3">
  <div class="max-w-lg mx-auto space-y-2.5">
    <div class="box rounded-xl p-3 flex items-center justify-between gap-2">
      <div class="flex items-center gap-2 min-w-0">
        <svg class="w-5 h-5 text-cyan-300 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="2.5"></circle>
          <path d="M16.24 7.76a6 6 0 0 1 0 8.49"></path>
          <path d="M7.76 16.24a6 6 0 0 1 0-8.49"></path>
        </svg>
        <div class="truncate">
          <div class="text-xs font-bold text-cyan-300 truncate">MINI RADIO NEXUS // 5 SINTONIAS</div>
          <div id="stTxt" class="text-[10px] text-slate-400 truncate">PRONTO // CLIQUE SINTONIZAR OU TOCAR</div>
        </div>
      </div>
      <div class="flex gap-1.5 shrink-0">
        <button id="bFlag" type="button" class="btn on px-2 py-1 rounded text-[10px] font-bold">ROBO: ON</button>
        <button id="bSync" type="button" class="btn px-2 py-1 rounded text-[10px] font-bold">SINTONIZAR</button>
        <button id="bAlm" type="button" class="btn px-2 py-1 rounded text-[10px] font-bold text-rose-300">ALARME</button>
      </div>
    </div>

    <div id="almBanner" class="hidden rounded-lg border border-rose-500 bg-rose-950/80 px-3 py-2 flex items-center justify-between text-[11px] text-rose-200">
      <span>ALARME ATIVO // RADIO PAUSADA</span>
      <button id="bRel" type="button" class="px-2 py-0.5 rounded bg-rose-500/30 border border-rose-400 text-[10px] font-bold text-white">LIBERAR</button>
    </div>

    <div class="box rounded-xl p-3 space-y-3">
      <div class="flex items-center justify-between gap-2 bg-[#02050D] border border-cyan-500/20 rounded-lg p-2.5">
        <div class="min-w-0">
          <div class="flex items-baseline gap-1.5">
            <span id="dFreq" class="text-xl font-black text-cyan-300">89.5</span>
            <span class="text-[10px] text-emerald-300 font-bold">MHZ</span>
            <span id="dTag" class="text-[10px] text-cyan-200 truncate">SERTANEJO / PAGODE</span>
          </div>
          <div id="dNome" class="text-xs font-bold text-white truncate">SERTANEJO & PAGODE</div>
          <div id="dEstacao" class="text-[10px] text-slate-400 truncate">Clique em SINTONIZAR ou TOCAR</div>
        </div>
        <div class="flex items-center gap-1 shrink-0">
          <button id="bPrev" type="button" class="btn p-2 rounded" title="Anterior" aria-label="Anterior">
            <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="19 20 9 12 19 4 19 20"></polygon><line x1="5" y1="19" x2="5" y2="5"></line></svg>
          </button>
          <button id="bPlay" type="button" class="btn on px-3 py-2 rounded text-xs font-bold flex items-center gap-1">
            <svg id="iPlay" class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="5 3 19 12 5 21 5 3"></polygon></svg>
            <svg id="iPause" class="w-4 h-4 hidden" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="6" y="4" width="4" height="16"></rect><rect x="14" y="4" width="4" height="16"></rect></svg>
            <span id="tPlay">TOCAR</span>
          </button>
          <button id="bNext" type="button" class="btn p-2 rounded" title="Proxima" aria-label="Proxima">
            <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="5 4 15 12 5 20 5 4"></polygon><line x1="19" y1="5" x2="19" y2="19"></line></svg>
          </button>
        </div>
      </div>

      <div class="flex items-center gap-2">
        <svg class="w-4 h-4 text-cyan-300 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon></svg>
        <input id="rVol" type="range" min="0" max="1" step="0.05" value="0.8" class="w-full accent-cyan-400" />
        <span id="vTxt" class="text-[11px] text-cyan-300 font-bold w-9 text-right">80%</span>
      </div>

      <div id="grid5" class="grid grid-cols-1 sm:grid-cols-5 gap-1.5"></div>
    </div>
  </div>

  <audio id="elAudio" playsinline preload="none"></audio>

  <script>
    document.addEventListener("contextmenu", (e) => { if (!["INPUT", "TEXTAREA", "SELECT"].includes(e.target.tagName)) e.preventDefault(); });
    document.addEventListener("copy", (e) => { if (!["INPUT", "TEXTAREA", "SELECT"].includes(e.target.tagName)) e.preventDefault(); });
    document.addEventListener("cut", (e) => { if (!["INPUT", "TEXTAREA", "SELECT"].includes(e.target.tagName)) e.preventDefault(); });

    const STORAGE_KEY = "MINI_RADIO_NEXUS_CACHE_V1";

    const PrototipoRadioConfig = {
      ativo: true,
      alimentadoPorRobo: true,
      sinalizador: "RADIO_PROTOTIPO_ALVO_ROBO_V1",
      prioridadeAlarmeAtiva: false,
      filaProgramacao: [
        {
          freq: "89.5",
          estilo: "SERTANEJO / PAGODE",
          titulo: "SERTANEJO & PAGODE",
          estacao: "",
          tags: ["sertanejo", "pagode", "brazil"],
          countrycode: "BR",
          url: "",
          candidatos: []
        },
        {
          freq: "93.1",
          estilo: "ESPERANCA E LOUVOR",
          titulo: "RADIO ESPERANCA E LOUVOR",
          estacao: "",
          tags: ["gospel", "worship", "christian"],
          countrycode: "BR",
          url: "",
          candidatos: []
        },
        {
          freq: "97.7",
          estilo: "FLASHBACK 80S & 90S",
          titulo: "FLASHBACK 80S & 90S",
          estacao: "",
          tags: ["80s", "90s", "flashback"],
          countrycode: "",
          url: "",
          candidatos: []
        },
        {
          freq: "101.3",
          estilo: "CLASSICO & HIP HOP",
          titulo: "CLASSICO & HIP HOP",
          estacao: "",
          tags: ["hiphop", "classical", "rap"],
          countrycode: "",
          url: "",
          candidatos: []
        },
        {
          freq: "105.9",
          estilo: "JORNALISMO",
          titulo: "JORNALISMO & NOTICIAS",
          estacao: "",
          tags: ["news", "journalism", "talk"],
          countrycode: "BR",
          url: "",
          candidatos: []
        }
      ]
    };

    const RADIO_BROWSER_MIRRORS = [
      "https://de1.api.radio-browser.info",
      "https://fi1.api.radio-browser.info",
      "https://at1.api.radio-browser.info"
    ];

    const elAudio = document.getElementById("elAudio");
    let idx = 0;
    let tocando = false;
    let candIdx = 0;
    let playSessionId = 0;
    let playWatchdog = null;

    const setSt = (m) => { document.getElementById("stTxt").textContent = m; };

    function atualizarBotaoPlay(estaTocando, rotulo = null) {
      tocando = Boolean(estaTocando);
      document.getElementById("iPlay").classList.toggle("hidden", tocando);
      document.getElementById("iPause").classList.toggle("hidden", !tocando);
      document.getElementById("tPlay").textContent = rotulo || (tocando ? "PAUSA" : "TOCAR");
    }

    function limparWatchdog() {
      if (playWatchdog) {
        clearTimeout(playWatchdog);
        playWatchdog = null;
      }
    }

    function salvarCacheLocal() {
      try {
        const payload = PrototipoRadioConfig.filaProgramacao.map((c) => ({
          freq: c.freq,
          estacao: c.estacao || "",
          url: c.url || "",
          candidatos: Array.isArray(c.candidatos) ? c.candidatos.slice(0, 6) : []
        }));
        localStorage.setItem(STORAGE_KEY, JSON.stringify(payload));
      } catch (_) {}
    }

    function carregarCacheLocal() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) return;
        const parsed = JSON.parse(raw);
        if (!Array.isArray(parsed)) return;
        parsed.forEach((salvo) => {
          const alvo = PrototipoRadioConfig.filaProgramacao.find((c) => c.freq === salvo.freq);
          if (!alvo) return;
          if (Array.isArray(salvo.candidatos) && salvo.candidatos.length) {
            alvo.candidatos = salvo.candidatos.filter(isStreamValido);
            alvo.url = alvo.candidatos[0] || "";
          }
          if (salvo.estacao) alvo.estacao = String(salvo.estacao).slice(0, 50);
        });
      } catch (_) {}
    }

    function isStreamValido(u) {
      if (typeof u !== "string") return false;
      const limpa = u.trim();
      if (!/^https?:\/\//i.test(limpa)) return false;
      if (window.location.protocol === "https:" && /^http:\/\//i.test(limpa)) return false;
      return true;
    }

    function sinalizarPrototipoRadio(h = true) {
      PrototipoRadioConfig.ativo = PrototipoRadioConfig.alimentadoPorRobo = Boolean(h);
      window.__SARAH_RADIO_SINALIZADOR__ = {
        sinalizador: PrototipoRadioConfig.sinalizador,
        prontoParaReceberProgramacao: PrototipoRadioConfig.ativo,
        atualizadoEm: new Date().toISOString()
      };
      const b = document.getElementById("bFlag");
      b.classList.toggle("on", PrototipoRadioConfig.ativo);
      b.textContent = PrototipoRadioConfig.ativo ? "ROBO: ON" : "ROBO: OFF";
      setSt(PrototipoRadioConfig.ativo ? "SINALIZADOR ATIVO // ROBO PRONTO" : "SINALIZADOR DESLIGADO");
    }

    function receberGradeDoRobo(itens = []) {
      if (!PrototipoRadioConfig.ativo || !Array.isArray(itens)) return { aceito: false };
      itens.slice(0, 5).forEach((it, i) => {
        const c = PrototipoRadioConfig.filaProgramacao[i];
        if (!c || !it) return;
        const urlsBrutas = Array.isArray(it.candidatos) ? it.candidatos : (it.url ? [it.url] : []);
        const urls = urlsBrutas.map((x) => (typeof x === "string" ? x : x && x.url)).filter(isStreamValido);
        if (urls.length) {
          c.candidatos = urls;
          c.url = urls[0];
        }
        if (it.estacao || it.titulo) c.estacao = String(it.estacao || it.titulo).slice(0, 50);
      });
      salvarCacheLocal();
      render5();
      setSt("SINTONIAS ATUALIZADAS PELO ROBO");
      return { aceito: true };
    }

    function pararRadio(manterRotulo = "TOCAR") {
      playSessionId++;
      limparWatchdog();
      elAudio.pause();
      elAudio.removeAttribute("src");
      elAudio.load();
      atualizarBotaoPlay(false, manterRotulo);
    }

    async function fetchComTimeout(url, ms = 4500) {
      const ctrl = new AbortController();
      const timer = setTimeout(() => ctrl.abort(), ms);
      try {
        const r = await fetch(url, {
          signal: ctrl.signal,
          headers: { "User-Agent": "MiniRadioNexus/1.0" }
        });
        if (!r.ok) return null;
        return await r.json();
      } catch (_) {
        return null;
      } finally {
        clearTimeout(timer);
      }
    }

    async function consultarRadioBrowser(tag, countrycode = "") {
      const params = new URLSearchParams({
        tag,
        limit: "10",
        hidebroken: "true",
        order: "clickcount",
        reverse: "true"
      });
      if (countrycode) params.set("countrycode", countrycode);

      for (const base of RADIO_BROWSER_MIRRORS) {
        const data = await fetchComTimeout(`${base}/json/stations/search?${params.toString()}`, 4000);
        if (Array.isArray(data) && data.length) return data;
      }
      return null;
    }

    async function buscarEstacoesCanal(canal) {
      const encontrados = [];
      const consultas = [];

      for (const tag of canal.tags) {
        if (canal.countrycode) {
          consultas.push({ tag, countrycode: canal.countrycode });
        }
        consultas.push({ tag, countrycode: "" });
      }

      for (const q of consultas) {
        const lista = await consultarRadioBrowser(q.tag, q.countrycode);
        if (!Array.isArray(lista)) continue;

        for (const st of lista) {
          const u = (st.url_resolved || st.url || "").trim();
          const codec = String(st.codec || "").toUpperCase();
          if (codec === "AAC+" || codec === "OGG" && !u.includes(".ogg")) continue;
          if (!isStreamValido(u)) continue;
          if (!encontrados.some((x) => x.url === u)) {
            encontrados.push({
              url: u,
              nome: String(st.name || canal.estilo).trim().slice(0, 50)
            });
          }
          if (encontrados.length >= 6) break;
        }
        if (encontrados.length >= 4) break;
      }

      if (encontrados.length) {
        canal.candidatos = encontrados.map((x) => x.url);
        canal.url = encontrados[0].url;
        canal.estacao = encontrados[0].nome;
        salvarCacheLocal();
        return true;
      }
      return false;
    }

    async function sintonizarTodas() {
      if (!PrototipoRadioConfig.ativo) {
        setSt("ROBO DESLIGADO // LIGUE ROBO: ON");
        return;
      }
      const bSync = document.getElementById("bSync");
      bSync.disabled = true;
      setSt("BUSCANDO ESTACOES NAS 5 SINTONIAS...");
      let okCount = 0;

      for (let i = 0; i < PrototipoRadioConfig.filaProgramacao.length; i++) {
        const canal = PrototipoRadioConfig.filaProgramacao[i];
        setSt(`SINTONIZANDO ${canal.freq} MHZ (${i + 1}/5)...`);
        if (await buscarEstacoesCanal(canal)) okCount++;
        render5();
      }

      bSync.disabled = false;
      setSt(`${okCount} DE 5 SINTONIAS COM ESTACAO DISPONIVEL`);
    }

    function tentarCandidato(canal, pos, sessionId) {
      if (sessionId !== playSessionId || PrototipoRadioConfig.prioridadeAlarmeAtiva) return;

      const lista = canal.candidatos && canal.candidatos.length
        ? canal.candidatos.filter(isStreamValido)
        : (isStreamValido(canal.url) ? [canal.url] : []);

      if (!lista.length || pos >= lista.length) {
        limparWatchdog();
        elAudio.pause();
        elAudio.removeAttribute("src");
        elAudio.load();
        atualizarBotaoPlay(false, "TOCAR");
        document.getElementById("dEstacao").textContent = "Nenhum stream compativel respondeu nesta sintonia";
        setSt("FALHA NO STREAM // TENTE SINTONIZAR OU OUTRO CANAL");
        return;
      }

      candIdx = pos;
      const urlAtual = lista[pos];
      const nomeEstacao = canal.estacao || canal.titulo;

      document.getElementById("dEstacao").textContent = `${nomeEstacao} (${pos + 1}/${lista.length})`;
      setSt(`CONECTANDO ${canal.freq} MHZ...`);

      limparWatchdog();
      playWatchdog = setTimeout(() => {
        if (sessionId === playSessionId && !tocando) {
          tentarCandidato(canal, pos + 1, sessionId);
        }
      }, 7000);

      elAudio.volume = Number(document.getElementById("rVol").value);
      elAudio.src = urlAtual;
      elAudio.load();

      const promessa = elAudio.play();
      if (promessa && typeof promessa.then === "function") {
        promessa.then(() => {
          if (sessionId !== playSessionId) return;
          limparWatchdog();
          canal.url = urlAtual;
          salvarCacheLocal();
          atualizarBotaoPlay(true, "PAUSA");
          setSt(`NO AR: ${nomeEstacao} // ${canal.freq} MHZ`);
        }).catch(() => {
          if (sessionId !== playSessionId) return;
          limparWatchdog();
          tentarCandidato(canal, pos + 1, sessionId);
        });
      }
    }

    async function tocarCanal(i) {
      if (PrototipoRadioConfig.prioridadeAlarmeAtiva) {
        setSt("ALARME ATIVO // CLIQUE LIBERAR PARA TOCAR");
        return;
      }

      const list = PrototipoRadioConfig.filaProgramacao;
      idx = (i + list.length) % list.length;
      const item = list[idx];
      const sessionId = ++playSessionId;

      limparWatchdog();
      elAudio.pause();
      elAudio.removeAttribute("src");
      elAudio.load();
      atualizarBotaoPlay(false, "TOCAR");

      document.getElementById("dFreq").textContent = item.freq;
      document.getElementById("dTag").textContent = item.estilo;
      document.getElementById("dNome").textContent = item.titulo;
      document.getElementById("dEstacao").textContent = item.estacao || "Buscando estacao...";
      render5();

      const temLista = Array.isArray(item.candidatos) && item.candidatos.some(isStreamValido);
      if (!temLista && !isStreamValido(item.url)) {
        if (!PrototipoRadioConfig.ativo) {
          setSt("ROBO DESLIGADO // SEM STREAM CADASTRADO");
          document.getElementById("dEstacao").textContent = "Ligue ROBO: ON ou clique SINTONIZAR";
          return;
        }
        setSt(`BUSCANDO ESTACAO PARA ${item.freq} MHZ...`);
        await buscarEstacoesCanal(item);
        if (sessionId !== playSessionId) return;
        render5();
      }

      tentarCandidato(item, 0, sessionId);
    }

    elAudio.addEventListener("error", () => {
      if (!elAudio.getAttribute("src") || PrototipoRadioConfig.prioridadeAlarmeAtiva) return;
      const sessionId = playSessionId;
      limparWatchdog();
      const canal = PrototipoRadioConfig.filaProgramacao[idx];
      if (canal) tentarCandidato(canal, candIdx + 1, sessionId);
    });

    function acionarPrioridadeAlarme(ativo = true) {
      PrototipoRadioConfig.prioridadeAlarmeAtiva = Boolean(ativo);
      if (ativo) pararRadio("TOCAR");
      document.getElementById("almBanner").classList.toggle("hidden", !ativo);
      document.getElementById("bAlm").classList.toggle("warn", ativo);
      setSt(ativo ? "ALARME ATIVO // PRIORIDADE TOTAL" : "SINALIZADOR ATIVO // ROBO PRONTO");
    }

    function render5() {
      const box = document.getElementById("grid5");
      box.innerHTML = "";
      PrototipoRadioConfig.filaProgramacao.forEach((s, i) => {
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = `btn p-2 rounded-lg text-left ${i === idx ? "on" : ""}`;
        btn.innerHTML = `<div class="text-[10px] font-bold text-cyan-300">${s.freq}</div><div class="text-[10px] font-bold truncate">${s.titulo}</div><div class="text-[9px] text-slate-400 truncate">${s.estacao || "Clique p/ sintonizar"}</div>`;
        btn.onclick = () => tocarCanal(i);
        box.appendChild(btn);
      });
    }

    document.getElementById("bPlay").onclick = () => (tocando ? pararRadio("TOCAR") : tocarCanal(idx));
    document.getElementById("bPrev").onclick = () => tocarCanal(idx - 1);
    document.getElementById("bNext").onclick = () => tocarCanal(idx + 1);
    document.getElementById("bFlag").onclick = () => sinalizarPrototipoRadio(!PrototipoRadioConfig.ativo);
    document.getElementById("bSync").onclick = sintonizarTodas;
    document.getElementById("bAlm").onclick = () => acionarPrioridadeAlarme(!PrototipoRadioConfig.prioridadeAlarmeAtiva);
    document.getElementById("bRel").onclick = () => acionarPrioridadeAlarme(false);
    document.getElementById("rVol").oninput = (e) => {
      const v = Number(e.target.value);
      elAudio.volume = v;
      document.getElementById("vTxt").textContent = `${Math.round(v * 100)}%`;
    };

    window.RaruCyberRadioDeck = {
      sinalizarPrototipoRadio,
      receberGradeDoRobo,
      sintonizarTodas,
      acionarPrioridadeAlarme,
      tocarCanal,
      pararRadio
    };

    carregarCacheLocal();
    sinalizarPrototipoRadio(true);
    const inicial = PrototipoRadioConfig.filaProgramacao[0];
    document.getElementById("dFreq").textContent = inicial.freq;
    document.getElementById("dTag").textContent = inicial.estilo;
    document.getElementById("dNome").textContent = inicial.titulo;
    if (inicial.estacao) document.getElementById("dEstacao").textContent = inicial.estacao;
    render5();
  </script>
</body>
</html>
