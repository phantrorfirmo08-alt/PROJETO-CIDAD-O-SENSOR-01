<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>ORION NEXUS V24.4 • PAINEL DEMONSTRATIVO IA</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script crossorigin src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700;800&family=Orbitron:wght@700;900&display=swap');
body{background:radial-gradient(1200px 600px at 20% -10%,rgba(0,243,255,0.15),transparent),radial-gradient(1000px 500px at 90% 0%,rgba(16,185,129,0.12),transparent),#010205;color:#E2E8F0;font-family:'JetBrains Mono',monospace;overflow-x:hidden}
.hud-panel{background:linear-gradient(180deg,rgba(255,255,255,0.06),rgba(255,255,255,0.02));backdrop-filter:blur(14px);border:1px solid rgba(0,243,255,0.35);border-radius:18px;box-shadow:0 0 0 1px rgba(255,255,255,0.04) inset,0 10px 40px rgba(0,0,0,0.5),0 0 40px rgba(0,243,255,0.12)}
.label-hud{font-family:'Orbitron',sans-serif;font-size:10px;letter-spacing:.18em;font-weight:900;color:#00f3ff;text-transform:uppercase}
.title-nexus{font-family:'Orbitron',sans-serif;font-weight:900;letter-spacing:.08em;background:linear-gradient(90deg,#00f3ff,#a5f3fc,#10b981);-webkit-background-clip:text;background-clip:text;color:transparent}
.x-btn{position:absolute;top:6px;right:6px;width:22px;height:22px;background:#000;color:#00f3ff;border-radius:50%;display:grid;place-items:center;font-weight:900;border:1px solid #00f3ff;cursor:pointer;font-size:11px;z-index:10}
.btn-primary{background:linear-gradient(90deg,#00f3ff,#22d3ee);color:#001014;font-weight:900;box-shadow:0 0 20px rgba(0,243,255,0.4);transition:.2s}
.btn-primary:active{transform:scale(.98)}
.input-futuristic{background:rgba(0,0,0,0.7);border:1px solid rgba(255,255,255,0.12);border-radius:14px;padding:12px;color:#fff;font-size:12px;outline:none;transition:.2s}
.input-futuristic:focus{border-color:#00f3ff;box-shadow:0 0 0 3px rgba(0,243,255,0.15)}

@keyframes pulseGlow{0%{transform:scale(1);box-shadow:0 0 10px currentColor}50%{transform:scale(1.15);box-shadow:0 0 25px currentColor}100%{transform:scale(1);box-shadow:0 0 10px currentColor}}
@keyframes scan{0%{transform:translateY(-100%)}100%{transform:translateY(100%)}}
.scan-line{position:absolute;left:0;right:0;height:2px;background:linear-gradient(90deg,transparent,#00f3ff,transparent);animation:scan 2.5s linear infinite;opacity:.6}
.pulse-node{animation:pulseGlow 2s infinite ease-in-out;}

/* CHAT FLUTUANTE DA GROQ */
.groq-chat-container{position:fixed;bottom:25px;right:20px;z-index:9999;font-family:'JetBrains Mono',monospace;}
.groq-toggle-btn{background:linear-gradient(135deg,#00f3ff,#0088cc);color:#000;border:2px solid #fff;width:56px;height:56px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:'Orbitron';font-weight:900;font-size:0.55rem;cursor:pointer;box-shadow:0 4px 20px rgba(0,243,255,0.5);transition:transform 0.2s;}
.groq-toggle-btn:hover{transform:scale(1.08);}
.groq-chat-box{position:absolute;bottom:70px;right:0;width:320px;max-height:400px;background:rgba(5, 10, 24, 0.95);backdrop-filter:blur(16px);border:1px solid rgba(0,243,255,0.4);border-radius:16px;display:none;flex-direction:column;overflow:hidden;box-shadow:0 10px 30px rgba(0,0,0,0.8);}
.groq-chat-box.active{display:flex;}
.groq-chat-header{background:rgba(0,243,255,0.12);padding:10px 14px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid rgba(0,243,255,0.2);font-family:'Orbitron';font-size:0.6rem;color:#00f3ff;}
.groq-chat-body{height:240px;overflow-y:auto;padding:10px;display:flex;flex-direction:column;gap:8px;}
.g-msg{padding:8px 12px;border-radius:12px;font-size:0.58rem;line-height:1.4;max-width:85%;}
.g-msg-ai{background:rgba(0,243,255,0.15);border:1px solid rgba(0,243,255,0.3);color:#d1fff0;align-self:flex-start;}
.g-msg-user{background:rgba(138,43,226,0.25);border:1px solid rgba(138,43,226,0.4);color:#f3e8ff;align-self:flex-end;}
.groq-chat-footer{display:flex;padding:8px;background:rgba(0,0,0,0.6);border-top:1px solid rgba(255,255,255,0.08);gap:6px;}
.groq-chat-footer input{flex:1;background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.15);color:#fff;padding:8px 10px;border-radius:10px;font-size:0.58rem;outline:none;}
.groq-chat-footer button{background:#00f3ff;color:#000;border:none;padding:0 12px;border-radius:10px;font-weight:bold;font-size:0.6rem;cursor:pointer;}
</style>
</head>
<body class="p-2 flex justify-center min-h-screen">
<div id="root" class="w-full max-w-[760px] pb-24"></div>

<!-- CHAT FLUTUANTE DA GROQ -->
<div class="groq-chat-container">
  <div class="groq-chat-box" id="groqChatBox">
    <div class="groq-chat-header">
      <span>⚡ CHAT GROQ LPU</span>
      <span onclick="toggleGroqChat()" style="cursor:pointer; font-weight:bold; font-size:14px;">✕</span>
    </div>
    <div class="groq-chat-body" id="groqChatBody">
      <div class="g-msg g-msg-ai"><strong>[GROQ AI]:</strong> Painel demonstrativo conceitual ativo para simulação com IA. Como posso ajudar?</div>
    </div>
    <div class="groq-chat-footer">
      <input type="text" id="groqChatInput" placeholder="Digite sua mensagem..." onkeydown="if(event.key==='Enter')sendGroqChatMsg()">
      <button onclick="sendGroqChatMsg()">➤</button>
    </div>
  </div>
  <div class="groq-toggle-btn" onclick="toggleGroqChat()" title="Abrir Chat Groq">
    GROQ
  </div>
</div>

<script>
function toggleGroqChat(){
  const box = document.getElementById('groqChatBox');
  if(box) box.classList.toggle('active');
}
function sendGroqChatMsg(){
  const input = document.getElementById('groqChatInput');
  if(!input || !input.value.trim()) return;
  const texto = input.value;
  const body = document.getElementById('groqChatBody');
  if(!body) return;
  
  const userDiv = document.createElement('div');
  userDiv.className = 'g-msg g-msg-user';
  userDiv.innerHTML = `<strong>[OPERADOR]:</strong> ${texto}`;
  body.appendChild(userDiv);
  input.value = '';
  body.scrollTop = body.scrollHeight;

  setTimeout(()=>{
    const aiDiv = document.createElement('div');
    aiDiv.className = 'g-msg g-msg-ai';
    aiDiv.innerHTML = `<strong>[GROQ AI]:</strong> Simulação executada com sucesso via motor LPU. Parâmetros ajustados.`;
    body.appendChild(aiDiv);
    body.scrollTop = body.scrollHeight;
  }, 700);
}
</script>

<script type="text/babel">
const { useState, useRef, useEffect } = React;

const DEMO_MUNICIPIOS = [
  {n:"Mesquita (Base Sebinho)", reg:"Baixada Fluminense", bacia:"Rio Sarapuí", status:"Monitoramento Ativo", cor:"#7fffd4"},
  {n:"Nova Iguaçu", reg:"Baixada Fluminense", bacia:"Rio Botas", status:"Estável", cor:"#f1ff2a"},
  {n:"Duque de Caxias", reg:"Baixada Fluminense", bacia:"Rio Iguaçu", status:"Atenção Moderada", cor:"#2ecc71"},
  {n:"São João de Meriti", reg:"Baixada Fluminense", bacia:"Rio Sarapuí", status:"Estável", cor:"#ff8c69"},
  {n:"Rio de Janeiro", reg:"Metropolitana", bacia:"Baía de Guanabara", status:"Normal", cor:"#ff1a1a"},
  {n:"Niterói", reg:"Metropolitana", bacia:"Oceânica", status:"Normal", cor:"#1e3cbe"},
  {n:"Petrópolis", reg:"Serrana", bacia:"Piabanha", status:"Alerta Preventivo", cor:"#34d399"}
];

const CORREDOR_ITENS = [
  {nome: 'Serra do Mendanha (Origem das Chuvas)', tipo: 'origem', desc: 'Cabeceira hidrográfica oeste'},
  {nome: 'Maria Cristina', tipo: 'ponto', desc: 'Área de transição urbana'},
  {nome: 'Comunidade do Sebinho', tipo: 'alerta', desc: 'Ponto crítico de monitoramento comunitário'},
  {nome: 'Ponte Subim', tipo: 'ponto', desc: 'Seção de vazão do canal'},
  {nome: 'Rua Amazonas', tipo: 'alerta', desc: 'Setor de acúmulo de água pluvial'},
  {nome: 'Confluência Sarapuí + Dona Eugênia', tipo: 'hidro', desc: 'Ponto de estrangulamento hídrico'}
];

const RISCOS=["R1 - BAIXO / PREVENTIVO","R2 - MODERADO / ATENCAO","R3 - ALTO / ALERTA","R4 - IMINENTE / EVACUACAO"];

function App(){
const [auth,setAuth]=useState(false);const [senha,setSenha]=useState('');
const [munSel,setMunSel]=useState(DEMO_MUNICIPIOS[0]);
const [agente,setAgente]=useState('Alexander da Silva Firmo');
const [bairro,setBairro]=useState('Sebinho / Rocha Sobrinho');
const [risco,setRisco]=useState(RISCOS[0]);
const [relato,setRelato]=useState('');
const [fotos,setFotos]=useState([]);
const [camOn,setCamOn]=useState(false);
const [iaParecer,setIaParecer]=useState("MODO DEMONSTRATIVO IA ATIVO - PRONTO PARA PROCESSAMENTO");
const [processing,setProcessing]=useState(false);
const [vozAtiva,setVozAtiva]=useState(true);
const [toast,setToast]=useState(null);

const videoRef=useRef(null);
const streamRef=useRef(null);
const URL_WORKER="https://solitary-snow-2459.phantrorfirmo08.workers.dev/";

const showToast=(m)=>{setToast(m);setTimeout(()=>setToast(null),3500)};
const falar=(t)=>{if(!vozAtiva||!('speechSynthesis' in window))return;try{window.speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='pt-BR';window.speechSynthesis.speak(u);}catch{}};

const startCam=async()=>{try{const s=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:"environment"},width:{ideal:1280}},audio:false});streamRef.current=s;setCamOn(true);setTimeout(()=>{if(videoRef.current){videoRef.current.srcObject=s;videoRef.current.play().catch(()=>{})}},200);}catch{showToast("Câmera negada")}};
const stopCam=()=>{if(streamRef.current)streamRef.current.getTracks().forEach(t=>t.stop());setCamOn(false)};

const gerarSHA = async (texto) => {
  try {
    const enc = new TextEncoder().encode(texto);
    const buf = await crypto.subtle.digest('SHA-256', enc);
    return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, '0')).join('');
  } catch {
    return 'fallback_hash_' + Math.random();
  }
};

const capturarFoto = async () => {
  const v = videoRef.current; if(!v || v.videoWidth === 0) return;
  const c = document.createElement('canvas');
  c.width = 800; c.height = Math.round(800 * v.videoHeight / v.videoWidth);
  const ctx = c.getContext('2d');
  ctx.drawImage(v, 0, 0, c.width, c.height);

  ctx.fillStyle = 'rgba(2,4,10,0.95)'; ctx.fillRect(0, c.height - 70, c.width, 70);
  ctx.fillStyle = '#00f3ff'; ctx.font = '700 10px JetBrains Mono';
  ctx.fillText(`ORION DEMO | ${munSel.n} | RISCO: ${risco}`, 12, c.height - 45);
  ctx.fillStyle = '#fff'; ctx.font = '9px JetBrains Mono';
  ctx.fillText(`BAIRRO: ${bairro} | RESP: ${agente} | ${new Date().toLocaleString('pt-BR')}`, 12, c.height - 22);

  const dataUrl = c.toDataURL('image/jpeg', 0.85);
  const fotoHash = await gerarSHA(dataUrl + Date.now());
  setFotos(p => [...p, {img: dataUrl, hash: fotoHash}]);
  showToast("Captura realizada com sucesso!");
  falar("Foto registrada");
};

const simularIAProcessamento = async () => {
  if(!relato) return showToast("Digite um relato para simular!");
  setProcessing(true);
  setIaParecer("Analisando dados via IA simulada / API Groq...");
  
  setTimeout(async () => {
    const resultado = `[PARECER SIMULADO IA] Análise concluída para o município de ${munSel.n} (${bairro}). Nível de risco indicado: ${risco}. O corredor hidrológico associado à ${munSel.bacia} apresenta estabilidade com pontos de atenção localizados. Relato processado com sucesso.`;
    setIaParecer(resultado);
    falar("Simulação de IA concluída.");
    setProcessing(false);
  }, 1200);
};

if(!auth){
return(
<div className="w-full max-w-[420px] hud-panel p-7 space-y-5 mt-14 mx-auto relative overflow-hidden">
<div className="scan-line"></div>
<div className="text-center space-y-2">
<p className="label-hud">ACESSO DEMONSTRATIVO</p>
<h1 className="title-nexus text-xl">ORION V24.4</h1>
<p className="text-[10px] text-slate-400 tracking-widest">PAINEL ESQUEMÁTICO • SIMULAÇÃO IA</p>
</div>
<input type="password" value={senha} onChange={e=>setSenha(e.target.value)} placeholder="sarah2026" className="input-futuristic w-full"/>
<button onClick={()=>{if(senha==='sarah2026')setAuth(true);else showToast('Chave incorreta')}} className="w-full py-3.5 btn-primary rounded-[14px] text-xs tracking-widest">ENTRAR NO PAINEL</button>
{toast&&<div className="text-xs text-cyan-300 text-center animate-pulse">{toast}</div>}
</div>
);
}

return(
<div className="space-y-4 w-full">
{toast&&<div className="fixed top-4 left-1/2 -translate-x-1/2 z-[9999] bg-cyan-400 text-black px-6 py-2.5 rounded-xl font-black text-xs shadow-[0_0_30px_rgba(0,243,255,0.6)]">{toast}</div>}

{/* HEADER */}
<div className="hud-panel p-4 flex justify-between items-center relative overflow-hidden">
<div className="scan-line"></div>
<div>
<h2 className="title-nexus text-[13px]">ORION V24.4 • SIMULADOR ESQUEMÁTICO</h2>
<p className="text-[9px] text-slate-400 tracking-widest mt-1">ESTRUTURA DEMONSTRATIVA PARA IA E APIS</p>
</div>
<div className="flex gap-2">
<button onClick={()=>setVozAtiva(!vozAtiva)} className={`text-[9px] px-2.5 py-1.5 rounded-full font-bold border tracking-widest ${vozAtiva?'bg-cyan-400 text-black border-cyan-400':'bg-black text-slate-400 border-white/10'}`}>{vozAtiva?'VOZ ON':'MUDO'}</button>
<button onClick={()=>setAuth(false)} className="bg-red-950/40 border border-red-500/40 text-red-300 px-3 py-1 rounded-full text-[9px] font-bold tracking-widest">SAIR</button>
</div>
</div>

{/* SELETOR ESQUEMÁTICO DE MUNICÍPIOS */}
<div className="hud-panel p-4 space-y-3">
<div className="flex justify-between items-center">
<p className="label-hud">🗺️ MUNICÍPIOS DEMONSTRATIVOS</p>
<span className="text-[9px] px-2.5 py-1 rounded-full bg-cyan-950 text-cyan-300 border border-cyan-500/30 font-bold">{munSel.n}</span>
</div>
<div className="grid grid-cols-2 gap-2">
{DEMO_MUNICIPIOS.map((m,i)=>(
<div key={i} onClick={()=>{setMunSel(m);falar(`Selecionado ${m.n}`);showToast(`Selecionado: ${m.n}`)}} className={`p-3 rounded-xl border text-[10px] cursor-pointer flex justify-between items-center transition ${munSel.n===m.n?'bg-cyan-500/20 border-cyan-400 text-cyan-200 font-bold shadow-[0_0_15px_rgba(0,243,255,0.3)]':'bg-black/50 border-white/10 text-slate-300 hover:border-cyan-400/50'}`}>
<div>
<div className="font-bold">{m.n}</div>
<div className="text-[8px] text-slate-400">{m.bacia}</div>
</div>
<span className="w-2.5 h-2.5 rounded-full pulse-node" style={{backgroundColor: m.cor, color: m.cor}}></span>
</div>
))}
</div>
</div>

{/* ESQUEMA VISUAL DO CORREDOR HIDROLÓGICO */}
<div className="hud-panel p-4 space-y-3 border border-purple-500/40">
<p className="label-hud" style={{color:'#c084fc'}}>⚡ CORREDOR HIDROLÓGICO (ESTRUTURA DEMONSTRATIVA)</p>
<div className="grid grid-cols-1 md:grid-cols-2 gap-2 max-h-[180px] overflow-y-auto pr-1">
{CORREDOR_ITENS.map((item, idx)=>(
<div key={idx} className="bg-black/60 border border-white/10 rounded-xl p-2.5 text-[10px] space-y-1">
<div className="flex justify-between items-center">
<span className="font-bold text-cyan-300">{item.nome}</span>
<span className="text-[8px] px-2 py-0.5 rounded bg-purple-950 text-purple-300 border border-purple-500/30">{item.tipo.toUpperCase()}</span>
</div>
<div className="text-[9px] text-slate-400">{item.desc}</div>
</div>
))}
</div>
</div>

{/* PAINEL DE SIMULAÇÃO DE VISTORIA E IA */}
<div className="hud-panel p-5 space-y-4 border border-cyan-400/30 relative overflow-hidden">
<div className="flex justify-between items-center">
<p className="label-hud">PAINEL DE TESTE & SIMULAÇÃO</p>
<span className="text-[9px] px-3 py-1 rounded-full bg-cyan-950 text-cyan-300 border border-cyan-500/40">DEMO API</span>
</div>

<div className="grid grid-cols-2 gap-3">
<input value={bairro} onChange={e=>setBairro(e.target.value)} className="input-futuristic" placeholder="Bairro / Setor"/>
<input value={agente} onChange={e=>setAgente(e.target.value)} className="input-futuristic" placeholder="Responsável"/>
<select value={risco} onChange={e=>setRisco(e.target.value)} className="input-futuristic">{RISCOS.map((r,i)=><option key={i}>{r}</option>)}</select>
<div className="flex items-center px-3 bg-black/50 border border-white/10 rounded-xl text-[10px] text-cyan-300">
  Status: Pronto para Teste
</div>
</div>

{/* CÂMERA SIMULADA */}
<div className="bg-black/70 border border-white/10 rounded-[16px] p-3.5 space-y-3 relative overflow-hidden">
<div className="scan-line"></div>
<div className="flex justify-between items-center">
<p className="label-hud">📸 CÂMERA SIMULADA</p>
{!camOn ? <button onClick={startCam} className="text-[10px] btn-primary px-4 py-2 rounded-full tracking-widest">LIGAR CÂMERA</button> : <button onClick={stopCam} className="text-[10px] bg-slate-800 text-slate-300 px-4 py-2 rounded-full">DESLIGAR</button>}
</div>
<div className="bg-[#0a0f1a] rounded-[12px] overflow-hidden border border-white/5 relative" style={{height:'220px'}}>
<video ref={videoRef} autoPlay playsInline muted style={{width:'100%',height:'100%',objectFit:'cover',display:camOn?'block':'none'}}></video>
{!camOn && <div className="h-full grid place-items-center text-[11px] text-slate-500 font-bold tracking-widest">CÂMERA DESLIGADA</div>}
{camOn && <div className="absolute top-3 left-3 bg-red-600 text-white text-[8px] font-black px-2 py-1 rounded-full animate-pulse">● SIMULAÇÃO REC</div>}
</div>
{camOn && <button onClick={capturarFoto} className="w-full py-3.5 btn-primary rounded-[14px] text-xs tracking-[0.2em]">📸 CAPTURAR IMAGEM DEMO</button>}

{fotos.length>0 && (
<div className="flex gap-2.5 overflow-x-auto pt-1">
<div className="flex gap-2">
{fotos.map((f,i)=>(
<div key={i} className="relative shrink-0 group">
<img src={f.img} className="w-20 h-20 object-cover rounded-xl border border-cyan-500/40"/>
<div className="x-btn" onClick={()=>setFotos(fotos.filter((_,idx)=>idx!==i))} title="Excluir">✕</div>
</div>
))}
</div>
</div>
)}
</div>

<div className="space-y-2">
<p className="label-hud">RELATO PARA TESTE DE IA</p>
<textarea value={relato} onChange={e=>setRelato(e.target.value)} rows="3" placeholder="Digite uma situação simulada para a IA analisar..." className="input-futuristic w-full resize-none"></textarea>
</div>

<button onClick={simularIAProcessamento} disabled={processing} className="w-full py-3.5 btn-primary rounded-[14px] text-xs tracking-widest disabled:opacity-50">
{processing ? 'PROCESSANDO VIA API...' : '⚡ EXECUTAR SIMULAÇÃO DE IA'}
</button>
</div>

{/* PARECER DA IA */}
<div className="hud-panel p-4 space-y-2.5">
<p className="label-hud">🧠 RESPOSTA / PARECER DA IA (API SIMULADA)</p>
<div className="bg-black/70 border border-white/10 rounded-xl p-3.5">
<p className="text-[11px] text-slate-200 leading-relaxed whitespace-pre-wrap">{iaParecer}</p>
</div>
</div>

</div>
);
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
