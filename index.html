                            setGpsCoords(`Lat: ${lat}, Lng: ${lng}`);
                            showToast("✅ GPS capturado com sucesso!");

                carregarVozes();

                speechIdRef.current += 1;
                if (voiceTimerRef.current) {

                voiceTimerRef.current = setTimeout(() => {
                    if (currentId !== speechIdRef.current) return;
                    try {
                        const utterance = new SpeechSynthesisUtterance(cleanText);
                        utterance.lang = "pt-BR";
                        utterance.voice = escolherMelhorVoz();
                        utterance.rate = 0.98;
                        utterance.onstart = () => { if (currentId === speechIdRef.current) setIsSpeaking(true); };
                        utterance.onend = () => { if (currentId === speechIdRef.current) setIsSpeaking(false); };

                                                        <div className={`text-[9px] mt-1 text-right ${m.sender === 'user' ? 'text-nightBlue/70' : 'text-softCyan'}`}>{m.timestamp}</div>
                                                    </div>
                                                </div>
                                            ))
                                        )}
                                        {isLoadingChat && (
                                            <div className="flex justify-start">
                                                <div className="bg-petroleumPanel p-3.5 rounded-2xl border border-softCyan/30 text-xs text-softCyan animate-pulse">
                                                    🛰 SARAH processando dados e bacias...
                                                </div>
                                            </div>
                                        )}
                                    </div>

                                    <form onSubmit={(e) => { e.preventDefault(); handleSendMessage(); }} className="flex items-center gap-2.5 pt-3 border-t border-softCyan/30">
                                        <button 
                                            type="button" 
                                            onClick={toggleListening}
                                            className={`p-3.5 rounded-2xl border transition cursor-pointer shrink-0 ${isListening ? 'bg-coralAlert text-nightBlue border-coralAlert animate-mic-pulse shadow-[0_0_20px_#FF3366]' : 'bg-nightBlue border-softCyan/50 text-softCyan hover:bg-softCyan/20'}`}
                                            title="Falar com a SARAH"
                                        >
                                            🎙️
                                        </button>
                                        <input 
                                            type="text" 
                                            value={input}
                                            onChange={(e) => setInput(e.target.value)}
                                            placeholder="Digite sua mensagem ou peça imagem de satélite..."
                                            className="flex-1 bg-nightBlue border border-softCyan/40 rounded-2xl px-4 py-3 text-xs text-lightLavender focus:outline-none focus:ring-2 focus:ring-softCyan"
                                        />
                                        <button 
                                            type="submit" 
                                            disabled={isLoadingChat}
                                            className="px-5 py-3 bg-gradient-to-r from-softCyan to-orchidPink hover:opacity-90 text-nightBlue font-black rounded-2xl text-xs transition cursor-pointer btn-animated shadow-lg shrink-0"
                                        >
                                            Enviar
                                        </button>
                                    </form>
                                </div>
                            </div>
                        )}
                    </main>

                    {/* FAIXA MARQUEE DE EMERGÊNCIA */}
                    <div className="bg-petroleumPanel border-t-2 border-softCyan py-3 overflow-hidden shadow-2xl whitespace-nowrap z-20">
                        <marquee behavior="scroll" direction="left" scrollamount="6" className="font-sans text-sm font-black tracking-wider text-white" style={{ textShadow: "0 0 12px rgba(0,245,255,0.8)" }}>

                            <span>1° Edição operacional El Niño GACE</span> &nbsp;•&nbsp; 
                            <span>Conceitos Mesquita do amanhã e Cidades resilientes (ONU)</span> &nbsp;•&nbsp; 
                            <span>Grupo Comunitário A Chave da Esperança</span> &nbsp;•&nbsp; 
                            <span>Plano de Ação: Todos Unidos, Todos Protegidos</span> &nbsp;•&nbsp; 
                            <span>EMERGÊNCIAS: Defesa Civil (199 / 21 4040-1772)</span> &nbsp;•&nbsp; 
                            <span>Bombeiros (193)</span> &nbsp;•&nbsp; 
                            <span>Alertas ZAP 📲 (21) 97299-3223</span> &nbsp;•&nbsp; 
                            <span>Cras de Rocha Sobrinho 21 2042-8931</span> &nbsp;•&nbsp; 
                            <span>Seja voluntário</span> &nbsp;•&nbsp; 
                            <span>Servir é prevenir sempre + NUPDECS</span> &nbsp;•&nbsp; 
                            <span>Espaço reservado para Marketing</span> &nbsp;•&nbsp; 
                            <span>#compartilhe</span> &nbsp;•&nbsp; 
                            <span>Participe</span> &nbsp;•&nbsp;

                        </marquee>
                    </div>

                    {/* RODAPÉ FINAL */}
                    <footer className="bg-nightBlue border-t border-softCyan/40 py-5 px-4 text-center text-xs font-sans space-y-1.5 shadow-inner z-25">
                        <div className="font-bold text-softCyan tracking-wide">
                            Defesa Civil Comunitária Cidadão Sensor • SARAH IA NEXUS v5.2 PRO
                        </div>
                        <div className="text-lightLavender/90 text-[11px] flex flex-wrap items-center justify-center gap-2">
                            <span>Grupo Comunitário A Chave da Esperança</span>
                            <span>•</span>

                    </footer>
                </div>
            );
        }

        const root = ReactDOM.createRoot(getElementByIdOrFallback());
        function getElementByIdOrFallback() {
            let el = document.getElementById("root");
            if (!el) {
                el = document.createElement("div");
                el.id = "root";
                document.body.appendChild(el);
            }
            return el;
        }
        root.render(<App />);

        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js').catch(() => {}));
        }
    </script>
