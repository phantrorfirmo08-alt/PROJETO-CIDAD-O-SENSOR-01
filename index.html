function AppTotal0800() {
  const [abaAtiva, setAbaAtiva] = React.useState('chat');

  const falarSarahGratis = (texto) => { if (!soundEnabled || !("speechSynthesis" in window)) return; try { window.speechSynthesis.cancel(); const clean = texto.replace(/[*#_]/g, '').trim(); const utterance = new SpeechSynthesisUtterance(clean); utterance.lang = "pt-BR"; utterance.pitch = 1.05; utterance.rate = 1.15; const vozes = window.speechSynthesis.getVoices(); const vozPT = vozes.find(v => v.lang.includes('pt-BR') || v.lang.includes('pt')); if (vozPT) utterance.voice = vozPT; window.speechSynthesis.speak(utterance); } catch(e) {} };

    const timeStr = new Date().toLocaleTimeString('pt-BR', {hour:'2-digit', minute:'2-digit'});
    const novoHist = [...messages, { sender: 'user', text: txt, time: timeStr }];

      const response = await fetch(ENVELOPE, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ mensagem: txt, message: txt, prompt: txt, user: userName, municipio: "Mesquita", history: novoHist.map(m => ({ role: m.sender==='user'?'user':'assistant', content: m.text })) }) });
      const textResp = await response.text();
      let resposta = "";
      try { const data = JSON.parse(textResp); resposta = data?.choices?.[0]?.message?.content || data?.reply || data?.resposta || data?.response || data?.text || data?.message || data?.output || ""; } catch { resposta = textResp; }

      setMessages(prev => [...prev, { sender: 'assistant', text: resposta, time: new Date().toLocaleTimeString('pt-BR', {hour:'2-digit', minute:'2-digit'}) }]);
      falarSarahGratis(resposta);
    } catch(err) {
      const fallback = `Falha de conexão com o envelope, ${userName}. Verifica a internet e tenta de novo.`;
      setMessages(prev => [...prev, { sender: 'assistant', text: fallback, time: new Date().toLocaleTimeString('pt-BR', {hour:'2-digit', minute:'2-digit'}) }]);
      falarSarahGratis(fallback);
    } finally { setIsProcessing(false); }
  };

  const toggleListening = () => { const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition; if (!SpeechRec) { showToast("Reconhecimento de voz indisponível neste navegador."); return; } if (isListening) { setIsListening(false); return; } try { const rec = new SpeechRec(); rec.lang = "pt-BR"; rec.onstart = () => setIsListening(true); rec.onresult = (ev) => { let spoken = ev.results[0][0].transcript; if(spoken) { setInput(spoken); setIsListening(false); } }; rec.onerror = () => setIsListening(false); rec.onend = () => setIsListening(false); rec.start(); } catch(e) { setIsListening(false); } };
  const ligarSomVirtual = (tipo) => { try { const AC = window.AudioContext || window.webkitAudioContext; if (!audioRef.current) audioRef.current = new AC(); const ctx = audioRef.current; if (ctx.state === 'suspended') ctx.resume(); const osc = ctx.createOscillator(); const g = ctx.createGain(); osc.type = tipo === 'russo' ? 'sawtooth' : 'sine'; osc.frequency.value = tipo === 'russo' ? 450 : 600; g.gain.value = 0.15; osc.connect(g); g.connect(ctx.destination); osc.start(); audioRef.current._osc = osc; } catch (e) {} };
  const desligarSomVirtual = () => { try { if (audioRef.current?._osc) audioRef.current._osc.stop(); if (audioRef.current?.close) audioRef.current.close(); } catch (e) {} audioRef.current = null; };
  const dispararAlarmeVirtualAuto = (tipo, motivo) => { if (alarmeVirtualAtivo) return; setAlarmeVirtualAtivo(true); setTempoRestanteVirt(180); ligarSomVirtual(tipo); addLog(`[IA AUTÔNOMA] ALARME ${tipo.toUpperCase()} DISPARADO: ${motivo}`); falarSarahGratis(`Alerta preditivo automático. Motivo: ${motivo}.`); };
  const pararAlarmeVirtual = () => { setAlarmeVirtualAtivo(false); setTempoRestanteVirt(300); desligarSomVirtual(); addLog('ALARME VIRTUAL INTERROMPIDO.'); };
  const iniciarFusaoCamera = () => { if (fusaoTimerRef.current) clearInterval(fusaoTimerRef.current); fusaoTimerRef.current = setInterval(async () => { const v = videoRef.current; if (!v || !v.videoWidth) return; const cv = document.createElement('canvas'); cv.width = 320; cv.height = Math.round(320 * v.videoHeight / v.videoWidth); const ctx = cv.getContext('2d'); ctx.drawImage(v, 0, 0, cv.width, cv.height); const data = ctx.getImageData(0,0,cv.width,cv.height).data; let brilho = 0, solo = 0, verde = 0; for (let i=0; i<data.length; i+=16) { const r=data[i], g=data[i+1], b=data[i+2]; if (r>150 && g>150 && b>150) brilho++; if (r<110 && g<100 && b<90) solo++; if (g>90 && g>r+20 && g>b+20) verde++; } const total = cv.width * cv.height / 16; const pctBrilho = (brilho/total)*100; const pctSolo = (solo/total)*100; const pctVerde = (verde/total)*100; let diagnostico = ""; let riscoNum = 0; if (pctBrilho > 18) { diagnostico = "ALERTA: Água correndo forte na via - possível enxurrada"; riscoNum = 85; } if (pctSolo > 25) { diagnostico = "ALERTA: Talude exposto na encosta"; riscoNum = 70; } if (pctVerde < 8 && pctBrilho > 15) { diagnostico = "ZONA DE CALOR EXTREMO - sem sombra, mais de 35 graus"; riscoNum = 60; } if (diagnostico && diagnostico !== ultimoDiagnosticoRef.current) { ultimoDiagnosticoRef.current = diagnostico; addLog(`[FUSÃO] ${diagnostico}`); falarSarahGratis(`${userName}, ${diagnostico}. Cuidado aí.`); try { await fetch(ENVELOPE, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ foto: "carimbo", diagnostico, risco: riscoNum, agente: userName, bairro: bairro, municipio: mun.n, gps: { lat: mun.lat, lon: mun.lon } }) }); } catch(e) {} } }, 6000); };
  const startCam = async () => { try { const s = await navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: "environment" } } }); streamRef.current = s; const track = s.getVideoTracks()[0]; trackRef.current = track; const caps = track.getCapabilities ? track.getCapabilities() : {}; if (caps.zoom) { setHasZoomSupport(true); setMaxZoom(caps.zoom.max || 5); setZoomLevel(caps.zoom.min || 1); } setCamOn(true); setTimeout(() => { if (videoRef.current) { videoRef.current.srcObject = s; videoRef.current.play().catch(() => {}); } }, 100); showToast('Câmera ativada. Fusão ligada.'); setTimeout(() => iniciarFusaoCamera(), 500); } catch (e) { showToast('Erro ao acessar a câmera.'); } };
  const stopCam = () => { if (streamRef.current) streamRef.current.getTracks().forEach(t => t.stop()); if (fusaoTimerRef.current) clearInterval(fusaoTimerRef.current); setCamOn(false); };
  const handleZoomChange = (e) => { const val = parseFloat(e.target.value); setZoomLevel(val); if (trackRef.current && trackRef.current.applyConstraints) { trackRef.current.applyConstraints({ advanced: [{ zoom: val }] }).catch(() => {}); } };
  const capturarFotoComCarimbo = () => { const v = videoRef.current; if (!v) return; const canvas = document.createElement('canvas'); canvas.width = 800; canvas.height = Math.round(800 * (v.videoHeight / v.videoWidth || 0.75)); const ctx = canvas.getContext('2d'); ctx.drawImage(v, 0, 0, canvas.width, canvas.height); ctx.fillStyle = 'rgba(3,7,18,0.92)'; ctx.fillRect(0, canvas.height - 120, canvas.width, 120); ctx.fillStyle = '#00F2FE'; ctx.font = 'bold 11px monospace'; ctx.fillText(`DATA: ${new Date().toLocaleString('pt-BR')} | GPS: -22.7831, -43.4294`, 15, canvas.height - 96); ctx.fillStyle = '#fff'; ctx.font = 'bold 11px monospace'; ctx.fillText(`AGENTE: ${userName} | BAIRRO: ${bairro} - ${mun.n} | ZOOM: ${zoomLevel}x`, 15, canvas.height - 76); ctx.fillStyle = '#FF0055'; ctx.font = 'bold 11px monospace'; ctx.fillText(`CLASSIFICAÇÃO: ${risco}`, 15, canvas.height - 56); ctx.fillStyle = '#FFA500'; ctx.font = 'bold 10px monospace'; ctx.fillText(`FRENTE: ${frente.slice(0, 65)}`, 15, canvas.height - 36); ctx.fillStyle = '#00FF88'; ctx.font = 'bold 10px monospace'; ctx.fillText(`CIDADÃO SENSOR • GRUPO A CHAVE DA ESPERANÇA`, 15, canvas.height - 14); const base64 = canvas.toDataURL('image/jpeg', 0.85); setFotos([base64]); showToast('Foto capturada com carimbo técnico e zoom!'); };
  const gerarLaudoIA = () => { const textoLaudo = `[RELATÓRIO TÉCNICO DE VISTORIA - SARAH AI]\nMunicípio: ${mun.n}\nBairro: ${bairro}\nAgente: ${userName}\nFrente: ${frente}\nRisco: ${risco}\n\nConstatação: Vistoria comunitária realizada com mapeamento de campo e integração ao Projeto Cidadão Sensor.`; setRel(textoLaudo); showToast('Laudo técnico gerado pela IA!'); };
  const enviarWhatsApp = async () => { const texto = `*VISTORIA COMUNITÁRIA - CIDADÃO SENSOR / GADE*\n\nAgente: ${userName}\nLocal: ${mun.n} - ${bairro}\nRisco: ${risco}\nRelato: ${rel || 'Vistoria realizada in loco.'}`; if (fotos[0] && navigator.canShare) { try { const blob = await (await fetch(fotos[0])).blob(); const file = new File([blob], `vistoria-${mun.n}.jpg`, { type: 'image/jpeg' }); if (navigator.canShare({ files: [file] })) { await navigator.share({ text: texto, files: [file] }); showToast('Enviado com foto.'); return; } } catch (e) {} } window.open(`https://api.whatsapp.com/send?text=${encodeURIComponent(texto)}`, '_blank'); };

  return (
    <div className="space-y-4 font-mono w-full">
      {toast && <div className="fixed top-4 left-1/2 -translate-x-1/2 z-50 cyber-card px-4 py-2 text-xs font-bold text-cyan-300 shadow-2xl">{toast}</div>}
      <div className="flex gap-2">
        <button onClick={() => setAbaAtiva('chat')} className={`cyber-button text-xs py-2.5 ${abaAtiva === 'chat' ? '!bg-cyan-400 !text-void' : ''}`}>{I.chat} CHAT & VOZ IA</button>

          <div className="flex-1 overflow-y-auto space-y-3 pr-1">{messages.map((m, idx) => (<div key={idx} className={`flex ${m.sender === 'user' ? 'justify-end' : 'justify-start'}`}><div className={`max-w-[85%] rounded-2xl p-3 text-xs leading-relaxed ${m.sender === 'user' ? 'bg-cyan-400 text-void font-bold rounded-br-none' : 'bg-black/90 text-slate-100 rounded-bl-none border border-cyan-500/30'}`}><div className="text-[8px] opacity-75 mb-1 font-mono">{m.sender === 'user' ? userName : 'Sarah AI'} • {m.time}</div><div className="font-sans whitespace-pre-line">{m.text}</div></div></div>))}{isProcessing && (<div className="flex justify-start"><div className="bg-black/90 border border-cyan-500/30 rounded-2xl p-3 text-xs text-cyan-300 animate-pulse">Sarah processando telemetria...</div></div>)}</div>
          {isListening && (<div className="bg-pink-500/20 border border-pink-500 text-pink-300 p-2 rounded-xl text-center text-xs font-bold animate-pulse my-2 flex items-center justify-center gap-2"><span className="w-2 h-2 bg-pink-500 rounded-full animate-ping"></span> Ouvindo sua voz... Fale agora.</div>)}
          <form onSubmit={handleSendMessage} className="flex gap-2 pt-2 border-t border-cyan-500/30 mt-2"><button type="button" onClick={toggleListening} className={`cyber-button py-2 px-3 text-xs ${isListening ? '!bg-pink-600 !text-white' : ''}`}>{I.mic}</button><input type="text" value={input} onChange={e => setInput(e.target.value)} placeholder={`Fale ou digite para a Sarah, ${userName}...`} className="flex-1 bg-black border border-cyan-500/40 rounded-xl px-3 py-2 text-xs text-white" /><button type="submit" disabled={isProcessing || !input.trim()} className="cyber-button-solid py-2 px-4 text-xs">ENVIAR</button></form>
        </div>
      ) : abaAtiva === 'hibrido' ? (
        <div className="cyber-card space-y-4 shadow-2xl"><div className="flex justify-between items-center text-xs text-cyan-400 border-b border-cyan-500/30 pb-2"><span className="flex items-center gap-2">{I.shield} SARAH AI NEXUS v11.2 PLUS HÍBRIDA</span><span className="flex items-center gap-1">{I.pin} {mun.n}</span></div><div className="bg-black/80 border border-pink-500/40 rounded-2xl p-4 space-y-3"><div className="flex justify-between items-center text-xs text-pink-500 font-black"><span className="flex items-center gap-2">{I.bolt} ALARME VIRTUAL (IA AUTÔNOMA)</span><span className="flex items-center gap-2"><span className={`w-2 h-2 rounded-full ${alarmeVirtualAtivo ? 'bg-pink-500' : 'bg-green-400'}`}></span>{alarmeVirtualAtivo ? 'TOCANDO' : 'MONITORANDO'}</span></div><div className="text-center text-5xl font-black text-white drop-shadow-[0_0_15px_#FF2D55] leading-none">{Math.floor(tempoRestanteVirt / 60)}:{String(tempoRestanteVirt % 60).padStart(2, '0')}</div><div className="flex gap-2 text-xs pt-1"><button onClick={() => setModoAutoVirtual(!modoAutoVirtual)} className={`flex-1 py-2 rounded-xl border font-bold ${modoAutoVirtual ? 'bg-yellow-500/20 text-yellow-400 border-yellow-500/50' : 'bg-gray-800 text-white border-gray-700'}`}>AUTO IA: {modoAutoVirtual ? 'LIGADO' : 'OFF'}</button>{alarmeVirtualAtivo ? (<button onClick={pararAlarmeVirtual} className="flex-1 py-2 bg-pink-600 text-white rounded-xl font-bold">PARAR</button>) : (<button onClick={() => dispararAlarmeVirtualAuto('russo', 'Teste Manual')} className="flex-1 py-2 bg-gray-800 text-cyan-400 border border-cyan-400/40 rounded-xl font-bold">TESTAR</button>)}</div></div><div className="bg-black rounded-xl p-3 text-[10px] text-green-400 min-h-[50px] border border-gray-800 space-y-1"><div className="text-cyan-400">_TERMINAL SARAH_</div>{log.map((l, i) => (<div key={i}>{l}</div>))}</div></div>
      ) : (
        <div className="cyber-card space-y-4 shadow-2xl"><div className="border-b border-cyan-500/30 pb-2"><h2 className="text-xs font-black text-cyan-300 uppercase tracking-widest flex items-center gap-2">{I.camera} MÓDULO DE VISTORIA • CÂMERA COM ZOOM & CARIMBO</h2></div><select value={mun.n} onChange={e => setMun(MUNICIPIOS_92.find(m => m.n === e.target.value))} className="w-full bg-black text-cyan-300 border border-cyan-500/40 rounded-xl p-2.5 text-xs font-bold">{MUNICIPIOS_92.map((m, i) => <option key={i} value={m.n}>{m.n}</option>)}</select><select value={frente} onChange={e => setFrente(e.target.value)} className="w-full bg-black text-white border border-cyan-500/40 rounded-xl p-2.5 text-xs font-bold">{FRENTES_EQUIPES.map((f, i) => <option key={i} value={f}>{f}</option>)}</select><div className="grid grid-cols-1 sm:grid-cols-2 gap-2"><input type="text" value={userName} onChange={e => setUserName(e.target.value)} placeholder="Seu Nome" className="bg-black border border-cyan-500/30 rounded-xl p-2.5 text-xs text-white" /><input type="text" value={bairro} onChange={e => setBairro(e.target.value)} placeholder="Bairro / Comunidade" className="bg-black border border-cyan-500/30 rounded-xl p-2.5 text-xs text-white" /></div><select value={risco} onChange={e => setRisco(e.target.value)} className="w-full bg-black border border-cyan-500/30 rounded-xl p-2.5 text-xs text-pink-500 font-bold">{RISCOS.map((r, i) => <option key={i} value={r}>{r}</option>)}</select><div className="bg-black border border-cyan-500/30 rounded-2xl p-3 space-y-3"><div className="flex justify-between items-center"><span className="text-xs font-bold text-cyan-300 flex items-center gap-2">{I.camera} CÂMERA COM CARIMBO & ZOOM</span>{!camOn ? (<button onClick={startCam} className="cyber-button text-xs py-1.5 px-4">LIGAR CÂMERA</button>) : (<button onClick={stopCam} className="cyber-button-danger text-xs py-1.5 px-4">DESLIGAR</button>)}</div><div className="relative bg-black rounded-xl overflow-hidden border border-cyan-500/30 h-56 flex items-center justify-center"><video ref={videoRef} autoPlay playsInline muted className={`w-full h-full object-cover ${camOn ? 'block' : 'hidden'}`} />{!camOn && <span className="text-slate-500 text-xs">Câmera desligada</span>}{camOn && <div className="animate-raru-scan"></div>}</div>{camOn && hasZoomSupport && (<div className="space-y-1 bg-gray-900 p-2.5 rounded-xl border border-cyan-500/30"><div className="flex justify-between text-[10px] text-cyan-300 font-bold"><span>CONTROLE DE ZOOM</span><span>{zoomLevel.toFixed(1)}x / {maxZoom}x</span></div><input type="range" min="1" max={maxZoom} step="0.1" value={zoomLevel} onChange={handleZoomChange} className="w-full accent-cyan-400 cursor-pointer" /></div>)}{camOn && (<button onClick={capturarFotoComCarimbo} className="cyber-button-solid text-xs py-3">CAPTURAR FOTO COM CARIMBO</button>)}{fotos.length > 0 && (<div className="space-y-2"><img src={fotos[0]} alt="Vistoria" className="w-full rounded-xl border border-cyan-500/40" /><span className="text-[9px] text-green-400 flex items-center justify-center gap-1 font-bold">{I.check} Foto carimbada com zoom aplicada</span></div>)}</div><button onClick={gerarLaudoIA} className="cyber-button text-xs py-3">GERAR LAUDO TÉCNICO COM SARAH AI</button><textarea value={rel} onChange={e => setRel(e.target.value)} rows="4" placeholder="O laudo técnico aparecerá aqui..." className="w-full bg-black border border-cyan-500/30 rounded-xl p-3 text-xs text-white resize-none" /><button onClick={enviarWhatsApp} className="cyber-button-solid text-xs py-3.5">ENVIAR RELATÓRIO NO WHATSAPP</button></div>
      )}
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<AppTotal0800 />);
</script>
</body>
</html>
