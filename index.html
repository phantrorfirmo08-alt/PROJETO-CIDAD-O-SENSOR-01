<body class="selection:bg-cyberCyan selection:text-void hud-grid">
    <div id="root"></div>
    <canvas id="raru-neural-net" style="position:fixed;inset:0;z-index:1;pointer-events:none;"></canvas>

    <script>
    (function RaruNeuralOrganism() {
        const canvas = document.getElementById('raru-neural-net');
        const ctx = canvas.getContext('2d');
        let W, H, nodes = [], touches = [], meshNeurons = [], raf;

        const CONFIG = {
            maxNodes: 42,
            linkDist: 130,
            nodeSpeed: 0.35,
            touchRadius: 180,
            touchBoost: 2.6,
            meshLinkDist: 260,
            colors: { calm: '0,242,254', alert: '255,0,85' }
        };

        function resize() {
            W = canvas.width = window.innerWidth;
            H = canvas.height = window.innerHeight;
            meshNeurons.forEach(m => {
                m.ax *= W / (m._lastW || W);
                m.ay *= H / (m._lastH || H);
                m._lastW = W; m._lastH = H;
            });
        }

        function createNodes() {
            nodes = Array.from({ length: CONFIG.maxNodes }, () => ({
                x: Math.random() * W,
                y: Math.random() * H,
                vx: (Math.random() - 0.5) * CONFIG.nodeSpeed,
                vy: (Math.random() - 0.5) * CONFIG.nodeSpeed,
                r: Math.random() * 1.8 + 0.8,
                phase: Math.random() * Math.PI * 2
            }));
        }

        function getAlertColor() {
            return document.body.classList.contains('organism-alert')
                ? CONFIG.colors.alert : CONFIG.colors.calm;
        }

        window.RARU_ORGANISM = {
            addNeuron(id, label) {
                if (meshNeurons.some(m => m.id === id)) return;
                meshNeurons.push({
                    id, label,
                    ax: Math.random() * (W * 0.7) + W * 0.15,
                    ay: Math.random() * (H * 0.5) + H * 0.25,
                    _lastW: W, _lastH: H,
                    born: performance.now(),
                    phase: Math.random() * Math.PI * 2,
                    drift: { x: (Math.random() - 0.5) * 0.15, y: (Math.random() - 0.5) * 0.15 },
                    flash: 0
                });
            },
            removeNeuron(id) { meshNeurons = meshNeurons.filter(m => m.id !== id); },
            clearNeurons() { meshNeurons = []; },
            count() { return meshNeurons.length; },
            pulse(id) {
                const m = meshNeurons.find(n => n.id === id);
                if (m) m.flash = 1;
            }
        };

        function draw(t) {
            ctx.clearRect(0, 0, W, H);
            const rgb = getAlertColor();
            const now = t / 1000;

            const boosts = touches.map(tc => ({ x: tc.x, y: tc.y, life: tc.life }));
            touches = touches.filter(tc => (tc.life -= 0.015) > 0);

            nodes.forEach(n => {
                let boost = 1;
                boosts.forEach(b => {
                    const dx = n.x - b.x, dy = n.y - b.y;
                    const d = Math.sqrt(dx * dx + dy * dy);
                    if (d < CONFIG.touchRadius) {
                        boost = Math.max(boost, 1 + (1 - d / CONFIG.touchRadius) * CONFIG.touchBoost * b.life);
                    }
                });
                n.x += n.vx * boost;
                n.y += n.vy * boost;
                if (n.x < 0 || n.x > W) n.vx *= -1;
                if (n.y < 0 || n.y > H) n.vy *= -1;
                n.x = Math.max(0, Math.min(W, n.x));
                n.y = Math.max(0, Math.min(H, n.y));
                const pulse = 0.6 + 0.4 * Math.sin(now * 2 + n.phase);
                ctx.beginPath();
                ctx.arc(n.x, n.y, n.r * (boost > 1.4 ? 1.6 : 1) * pulse, 0, Math.PI * 2);
                ctx.fillStyle = 'rgba(' + rgb + ',' + (0.5 * pulse + (boost > 1.4 ? 0.4 : 0)) + ')';
                ctx.fill();
            });

            meshNeurons.forEach(m => {
                m.ax += m.drift.x; m.ay += m.drift.y;
                if (m.ax < W * 0.05 || m.ax > W * 0.95) m.drift.x *= -1;
                if (m.ay < H * 0.12 || m.ay > H * 0.88) m.drift.y *= -1;

                const age = (t - m.born) / 1200;
                const grow = age < 1.2 ? Math.min(1, age / 1.2) : 1;
                const pulse = 0.75 + 0.35 * Math.sin(now * 2 + m.phase);
                const rr = 5 * grow * pulse;

                if (m.flash > 0) m.flash = Math.max(0, m.flash - 0.02);

                const halo = (14 + 5 * Math.sin(now * 2 + m.phase)) * (1 + m.flash * 0.8);
                ctx.beginPath();
                ctx.arc(m.ax, m.ay, halo * grow, 0, Math.PI * 2);
                ctx.strokeStyle = 'rgba(' + rgb + ',' + (0.35 * grow * pulse) + ')';
                ctx.lineWidth = 1;
                ctx.stroke();

                ctx.beginPath();
                ctx.arc(m.ax, m.ay, rr, 0, Math.PI * 2);
                ctx.fillStyle = 'rgba(' + rgb + ',' + (0.9 * grow) + ')';
                ctx.fill();
                ctx.beginPath();
                ctx.arc(m.ax, m.ay, rr, 0, Math.PI * 2);
                ctx.strokeStyle = 'rgba(255,255,255,0.8)';
                ctx.lineWidth = 1;
                ctx.stroke();

                if (grow > 0.9) {
                    ctx.font = '600 8px "JetBrains Mono", monospace';
                    ctx.fillStyle = 'rgba(' + rgb + ',0.9)';
                    ctx.textAlign = 'center';
                    ctx.fillText(m.label, m.ax, m.ay - halo - 6);
                }

                if (m.flash > 0) {
                    ctx.beginPath();
                    ctx.arc(m.ax, m.ay, (1 - m.flash) * 60 + 8, 0, Math.PI * 2);
                    ctx.strokeStyle = 'rgba(0,255,157,' + (m.flash * 0.9) + ')';
                    ctx.lineWidth = 2;
                    ctx.stroke();

                    ctx.beginPath();
                    ctx.arc(m.ax, m.ay, rr + m.flash * 10, 0, Math.PI * 2);
                    ctx.fillStyle = 'rgba(0,255,157,' + (m.flash * 0.35) + ')';
                    ctx.fill();
                }
            });

            raf = requestAnimationFrame(draw);
        }

        function addTouch(x, y) {
            touches.push({ x, y, life: 1 });
            if (touches.length > 5) touches.shift();
        }
        window.addEventListener('touchstart', e => {
            const t = e.touches[0];
            addTouch(t.clientX, t.clientY);
        }, { passive: true });
        window.addEventListener('mousedown', e => addTouch(e.clientX, e.clientY));

        window.addEventListener('resize', () => { resize(); createNodes(); });
        resize();
        createNodes();
        raf = requestAnimationFrame(draw);
    })();

    window.RARU_BUS = {
        _data: {},
        _subs: new Set(),
        push(sensorId, leitura) {
            this._data[sensorId] = Object.assign({}, leitura, { ts: Date.now() });
            this._subs.forEach(fn => { try { fn(sensorId, this._data[sensorId]); } catch(e){} });
        },
        get(sensorId) { return this._data[sensorId] || null; },
        all() { return Object.assign({}, this._data); },
        subscribe(fn) { this._subs.add(fn); return () => this._subs.delete(fn); }
    };
    </script>

            const [aluminioKg, setAluminioKg] = useState(3);
            const [ferroKg, setFerroKg] = useState(15);
            const [papelaoKg, setPapelaoKg] = useState(20);
            const [vidroKg, setVidroKg] = useState(5);
            const [oleoL, setOleoL] = useState(4);

            const showToast = (msg) => {
                setToast(msg);
                setTimeout(() => setToast(null), 3000);
            };

            useEffect(() => {
                falarSarah("Sistema Raru Nexus V11 Plus ativado. Organismo sensorial operacional na Baixada Fluminense.");
            }, []);

            // Registro do neurônio do Alquino no canvas
            useEffect(() => {
                if (window.RARU_ORGANISM) window.RARU_ORGANISM.addNeuron(`SENSOR-${sensorId}`, "ALQUINO");
                return () => {
                    if (window.RARU_ORGANISM) window.RARU_ORGANISM.removeNeuron(`SENSOR-${sensorId}`);
                };
            }, [sensorId]);

            const aplicarLeitura = (data) => {
                const gas = data.gas ?? null;
                const nivel = data.nivelAgua ?? null;
                const temp = data.temperatura ?? null;

                if (gas !== null) setGasLevel(`${gas} PPM`);
                if (nivel !== null) setHidroLevel(`${nivel} m`);
                if (temp !== null) setTempHardware(`${temp} C`);

                window.RARU_BUS.push(sensorId, { gas, nivelAgua: nivel, temperatura: temp });
                if (window.RARU_ORGANISM) window.RARU_ORGANISM.pulse(`SENSOR-${sensorId}`);

                setHistorico(prev => [...prev, { ts: Date.now(), gas, nivel, temp }].slice(-24));

                const critico = (gas !== null && gas > 60) || (nivel !== null && nivel > 1.5);
                if (critico) {
                    falarSarah(`Atenção! Alerta crítico no sensor ${sensorId}.`);
                }
            };

            const conectarIP = async () => {
                try {
                    setStatusHardware("CONECTANDO...");
                    const res = await fetch(hardwareIpUrl, { method: 'GET', mode: 'cors' });
                    const data = await res.json();
                    if (data) {
                        setSensorOnline(true);
                        setStatusHardware("CONECTADO (ONLINE)");
                        aplicarLeitura(data);
                        showToast("Hardware Alquino Sincronizado!");
                    }
                } catch(e) {
                    setSensorOnline(false);
                    setStatusHardware("FALHA NA CONEXAO IP (MODO CEGO)");
                    showToast("IP indisponível — organismo em modo cego.");
                }
            };

            // Cálculos da Balança ESG
            const totalPet = petKg * 2.50;
            const totalAluminio = aluminioKg * 8.00;
            const totalFerro = ferroKg * 1.20;
            const totalPapelao = papelaoKg * 0.70;
            const totalVidro = vidroKg * 0.35;
            const totalOleo = oleoL * 3.00;
            const valorTotalReciclagem = totalPet + totalAluminio + totalFerro + totalPapelao + totalVidro + totalOleo;
            const pesoTotalKg = Number(petkg = petKg) + Number(aluminioKg) + Number(ferroKg) + Number(papelaoKg) + Number(vidroKg) + Number(oleoL);

            const gerarReciboColeta = () => {
                const prot = `REC-SOL-${Math.floor(Math.random() * 89999 + 10000)}`;
                const sensores = window.RARU_BUS.all();
                const textoRecibo = `[COMPROVANTE DE PESAGEM E ECONOMIA CIRCULAR]
Protocolo: ${prot}
Local: Mesquita / Baixada Fluminense (GADE)
Data/Hora: ${new Date().toLocaleString('pt-BR')}
Peso Total Acumulado: ${pesoTotalKg.toFixed(1)} KG / Litros
VALOR ESTIMADO: R$ ${valorTotalReciclagem.toFixed(2)}

GADE - Grupo a Chave da Esperanca - RARU NEXUS AI V11 Plus`;

                if (navigator.clipboard) navigator.clipboard.writeText(textoRecibo);
                window.open(`https://api.whatsapp.com/send?text=${encodeURIComponent(textoRecibo)}`, '_blank');
                showToast("Recibo gerado e copiado!");
            };

            return (
                <div className="seu-container-raru space-y-4 font-mono">
                    <header className="cyber-card p-4 flex items-center justify-between">
                        <div>
                            <h1 className="font-display text-sm font-black text-cyberCyan tracking-widest">RARU NEXUS V11+</h1>
                            <p className="text-[9px] text-slate-400">Cidadão Sensor • Mesquita RJ</p>
                        </div>
                        <div className="flex gap-1 flex-wrap justify-end">
                            <button onClick={() => setAba("dashboard")} className={`cyber-button text-[8px] py-1 px-2 ${aba === 'dashboard' ? '!border-cyberGreen !text-cyberGreen' : ''}`}>Início</button>
                            <button onClick={() => setAba("alquino")} className={`cyber-button text-[8px] py-1 px-2 ${aba === 'alquino' ? '!border-cyberGreen !text-cyberGreen' : ''}`}>Alquino</button>
                            <button onClick={() => setAba("balanca")} className={`cyber-button text-[8px] py-1 px-2 ${aba === 'balanca' ? '!border-cyberGreen !text-cyberGreen' : ''}`}>Balança</button>
                        </div>
                    </header>

                    <main className="space-y-4">
                        {aba === 'dashboard' && (
                            <div className="cyber-card p-6 space-y-4 text-center">
                                <div className="sarah-avatar-stage" onClick={() => falarSarah("Sarah AI operando em modo de resiliência urbana.")}>
                                    <div className="w-16 h-16 rounded-full border-2 border-cyberCyan bg-deepSpace flex items-center justify-center shadow-lg">
                                        <SarahVectorAvatar />
                                    </div>
                                </div>
                                <h2 className="font-display text-base font-black text-white">SARAH AI • NÚCLEO ATIVO</h2>
                                <p className="text-xs text-slate-300">Toque no avatar da Sarah para acionar a voz sintética ou selecione os módulos abaixo.</p>
                                <div className="grid grid-cols-2 gap-3 pt-2">
                                    <button onClick={() => setAba("alquino")} className="cyber-button text-xs py-3">Hardware Alquino IoT</button>
                                    <button onClick={() => setAba("balanca")} className="cyber-button text-xs py-3">Módulo Balança ESG</button>
                                </div>
                            </div>
                        )}

                        {aba === 'alquino' && (
                            <div className="cyber-card p-5 space-y-4">
                                <h2 className="font-display text-sm font-black text-cyberCyan">HARDWARE ALQUINO — SENSOR ORGÂNICO</h2>
                                <div className={`p-3 rounded-xl border flex items-center justify-between ${sensorOnline ? 'border-cyberGreen/50 bg-cyberGreen/10' : 'border-cyberRose/40 bg-cyberRose/10'}`}>
                                    <div>
                                        <span className="text-[10px] font-black text-white block">{sensorOnline ? 'SENSOR ATIVO' : 'MODO CEGO'}</span>
                                        <span className="text-[8px] text-slate-300">{statusHardware}</span>
                                    </div>
                                    <button onClick={conectarIP} className="cyber-button text-[9px] py-2 px-3">Sincronizar IP</button>
                                </div>
                                <div className="grid grid-cols-3 gap-2 text-center">
                                    <div className="bg-deepSpace/80 p-2.5 rounded-xl border border-cyberCyan/30">
                                        <span className="text-[8px] text-slate-400 block">GÁS</span>
                                        <span className="text-xs font-black text-cyberCyan">{gasLevel}</span>
                                    </div>
                                    <div className="bg-deepSpace/80 p-2.5 rounded-xl border border-cyberCyan/30">
                                        <span className="text-[8px] text-slate-400 block">NÍVEL ÁGUA</span>
                                        <span className="text-xs font-black text-cyberGreen">{hidroLevel}</span>
                                    </div>
                                    <div className="bg-deepSpace/80 p-2.5 rounded-xl border border-cyberCyan/30">
                                        <span className="text-[8px] text-slate-400 block">TEMP</span>
                                        <span className="text-xs font-black text-cyberAmber">{tempHardware}</span>
                                    </div>
                                </div>
                                <button onClick={() => setAba("dashboard")} className="cyber-button text-[10px] w-full py-2">Voltar ao Início</button>
                            </div>
                        )}

                        {aba === 'balanca' && (
                            <div className="cyber-card p-5 space-y-4">
                                <h2 className="font-display text-sm font-black text-cyberCyan">MÓDULO CIDADÃO SENSOR • BALANÇA ESG</h2>
                                <div className="space-y-3 text-xs">
                                    <div className="flex justify-between items-center bg-deepSpace/80 p-2.5 rounded-xl border border-cyberCyan/30">
                                        <span>PET ({petKg} kg)</span>
                                        <span className="text-cyberCyan font-bold">R$ {totalPet.toFixed(2)}</span>
                                    </div>
                                    <div className="flex justify-between items-center bg-deepSpace/80 p-2.5 rounded-xl border border-cyberCyan/30">
                                        <span>Alumínio ({aluminioKg} kg)</span>
                                        <span className="text-cyberCyan font-bold">R$ {totalAluminio.toFixed(2)}</span>
                                    </div>
                                    <div className="bg-void p-3 rounded-xl border border-cyberGreen/40 flex justify-between items-center">
                                        <span className="font-bold text-white">TOTAL ESTIMADO:</span>
                                        <span className="text-cyberGreen font-black text-sm">R$ {valorTotalReciclagem.toFixed(2)}</span>
                                    </div>
                                    <button onClick={gerarReciboColeta} className="cyber-button-solid w-full py-3">Gerar Recibo &amp; Enviar WhatsApp</button>
                                </div>
                                <button onClick={() => setAba("dashboard")} className="cyber-button text-[10px] w-full py-2">Voltar ao Início</button>
                            </div>
                        )}
                    </main>

                    {toast && (
                        <div className="fixed bottom-20 left-1/2 -translate-x-1/2 bg-void border border-cyberGreen text-cyberGreen text-xs px-4 py-2 rounded-xl shadow-2xl z-50 animate-pulse-once">
                            {toast}
                        </div>
                    )}
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
