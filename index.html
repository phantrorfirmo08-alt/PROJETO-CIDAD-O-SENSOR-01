        function FieldReportModule({ onBackToDashboard, showToast }) {
            const [setor, setSetor] = React.useState("🛡️ Defesa Civil (Vistoria de Risco / Ocorrência)");
            const [agente, setAgente] = React.useState("");
            const [localizacao, setLocalizacao] = React.useState(""); // CORRIGIDO O ERRO DA TELA PRETA AQUI
            const [descricao, setDescricao] = React.useState("");
            const [gpsCoords, setGpsCoords] = React.useState({ lt: '', ln: '', lk: '' });
            const [gpsStatus, setGpsStatus] = React.useState("📍 GPS em espera");
            
            const [fotos, setFotos] = React.useState([
                { id: 1, status: "vazia", file: null, preview: null },
                { id: 2, status: "vazia", file: null, preview: null },
                { id: 3, status: "vazia", file: null, preview: null },
                { id: 4, status: "vazia", file: null, preview: null }
            ]);

            const capturarGps = () => {
                if (!navigator.geolocation) { showToast("⚠️ Geolocalização não suportada."); return; }
                showToast("🛰 Acionando GPS de alta precisão...");
                navigator.geolocation.getCurrentPosition(
                    (p) => {
                        const lt = p.coords.latitude.toFixed(6);
                        const ln = p.coords.longitude.toFixed(6);
                        const lk = `https://maps.google.com/?q=${lt},${ln}`;
                        setGpsCoords({ lt, ln, lk });
                        setLocalizacao(`${lt}, ${ln}`);
                        setGpsStatus("✅ GPS Fixado com Sucesso");
                        showToast(`📍 Coordenadas obtidas: ${lt}, ${ln}`);
                    },
                    () => { showToast("⚠ Falha ao obter sinal GPS."); setGpsStatus("⚠ Erro de Sinal GPS"); },
                    { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
                );
            };

            const processarFotoVistoria = (file) => {
                return new Promise((resolve, reject) => {
                    const reader = new FileReader();
                    reader.readAsDataURL(file);
                    reader.onload = (event) => {
                        const img = new Image();
                        img.src = event.target.result;
                        img.onload = () => {
                            const canvas = document.createElement('canvas');
                            let width = img.width;
                            let height = img.height;
                            const MAX_DIMENSION = 960;

                            if (width > height) {
                                if (width > MAX_DIMENSION) {
                                    height = Math.round((height * MAX_DIMENSION) / width);
                                    width = MAX_DIMENSION;
                                }
                            } else {
                                if (height > MAX_DIMENSION) {
                                    width = Math.round((width * MAX_DIMENSION) / height);
                                    height = MAX_DIMENSION;
                                }
                            }

                            canvas.width = width;
                            canvas.height = height;
                            const ctx = canvas.getContext('2d');
                            ctx.imageSmoothingEnabled = true;
                            ctx.imageSmoothingQuality = 'high';
                            ctx.drawImage(img, 0, 0, width, height);

                            canvas.toBlob((blob) => {
                                if (!blob) {
                                    reject(new Error("Falha ao gerar blob comprimido"));
                                    return;
                                }
                                const compressedFile = new File([blob], `vistoria_foto_${Date.now()}.jpg`, {
                                    type: 'image/jpeg',
                                    lastModified: Date.now()
                                });
                                const previewUrl = URL.createObjectURL(compressedFile);
                                resolve({ compressedFile, previewUrl });
                            }, 'image/jpeg', 0.70);
                        };
                        img.onerror = reject;
                    };
                    reader.onerror = reject;
                });
            };

            const handleFotoChange = async (i, e) => {
                const file = e.target.files[0];
                if (file) {
                    showToast(`🔄 Otimizando evidência ${i + 1} no oculto...`);
                    try {
                        const { compressedFile, previewUrl } = await processarFotoVistoria(file);
                        const u = [...fotos];
                        u[i] = { id: u[i].id, status: "✅ OK", file: compressedFile, preview: previewUrl };
                        setFotos(u);
                        showToast(`📸 Evidência ${i + 1} comprimida e encaixada com sucesso!`);
                    } catch (err) {
                        showToast(`❌ Erro ao processar foto ${i + 1}.`);
                    }
                }
            };

            const montarTexto = () => {
                const fCount = fotos.filter(f => f.status === "✅ OK").length;
                return `📊 *RELATÓRIO TÉCNICO DE VISTORIA - SARAH IA*\n` +
                       `🏛 *Setor:* ${setor}\n` +
                       `👤 *Agente:* ${agente || 'Não informado'}\n` +
                       `📍 *Local:* ${localizacao || 'Não informado'}\n` +
                       (gpsCoords.lk ? `🔗 *Geolocalização:* ${gpsCoords.lk}\n` : ``) +
                       `📸 *Evidências Fotográficas anexadas:* ${fCount}/4\n` +
                       `📝 *Relato Operacional:*\n${descricao || 'Sem descrição informada'}`;
            };

            const copiarLaudo = () => {
                const texto = montarTexto();
                navigator.clipboard.writeText(texto).then(() => {
                    showToast("📋 Relatório copiado para a área de transferência!");
                }).catch(() => {
                    showToast("❌ Falha ao copiar relatório.");
                });
            };

            const compartilharRelatorioComFotos = async () => {
                const texto = montarTexto();
                const validFiles = fotos.filter(f => f.file instanceof File).map(f => f.file);

                if (navigator.share && navigator.canShare && validFiles.length > 0) {
                    const shareData = {
                        title: 'Relatório Técnico - SARAH IA Nexus',
                        text: texto,
                        files: validFiles
                    };
                    if (navigator.canShare(shareData)) {
                        try {
                            await navigator.share(shareData);
                            showToast("✅ Relatório e fotos enviados com sucesso!");
                            return;
                        } catch (err) {
                            if (err.name === 'AbortError') return;
                        }
                    }
                }

                navigator.clipboard.writeText(texto).catch(() => {});
                if (validFiles.length > 0) {
                    showToast("📋 Texto copiado e fotos prontas! Selecione o WhatsApp na partilha.");
                }

                if (navigator.share) {
                    try {
                        await navigator.share({
                            title: 'Relatório Técnico - SARAH IA Nexus',
                            text: texto
                        });
                        return;
                    } catch (err) {}
                }

                window.open(`https://api.whatsapp.com/send?text=${encodeURIComponent(texto)}`, '_blank');
            };

            return (
                <div className="space-y-4 max-w-xl mx-auto">
                    <div className="flex items-center justify-between glass-panel px-5 py-3.5 rounded-2xl border border-neonCyan/30">
                        <span className="text-xs font-extrabold text-neonCyan flex items-center gap-2"><span>📋</span> Vistoria Meteorológica & Relatório de Campo</span>
                        <button onClick={onBackToDashboard} className="px-3.5 py-1.5 bg-alertCoral/25 text-alertCoral rounded-xl text-xs font-bold cursor-pointer">✕ Fechar</button>
                    </div>
                    
                    <div className="glass-panel rounded-[32px] p-6 sm:p-8 border border-neonCyan/30 shadow-2xl space-y-5">
                        <div className="space-y-1.5">

            const limparTextoParaFala = (text) => {
                return String(text).replace(/([\u2700-\u27BF]|[\uE000-\uF8FF]|\uD83C[\uDC00-\uDFFF]|\uD83D[\uDC00-\uDFFF]|[\u2011-\u26FF]|\uD83E[\uDD00[\uDDFF])/g, '').replace(/\[(.*?)\]\(.*?\)/g, "$1").replace(/https?:\/\/\S+/g, "").replace(/\s+/g, " ").trim();
            };

            const escolherMelhorVoz = () => {
                const voices = voicesRef.current.length ? voicesRef.current : window.speechSynthesis.getVoices();
                return voices.find((voice) => voice.lang.toLowerCase().includes("pt")) || voices[0];
            };

            const stopSpeaking = () => {
                speechIdRef.current += 1;
                if (voiceTimerRef.current) { clearTimeout(voiceTimerRef.current); voiceTimerRef.current = null; }
                if ("speechSynthesis" in window) window.speechSynthesis.cancel();
                setIsSpeaking(false);
            };

            const speakText = (text) => {
                if (!soundEnabled || !("speechSynthesis" in window)) return;

                stopSpeaking();

                voiceTimerRef.current = setTimeout(() => {
                    if (currentId !== speechIdRef.current) return;
                    const utterance = new SpeechSynthesisUtterance(cleanText);
                    utterance.lang = "pt-BR";

                    utterance.rate = 1.0;
                    utterance.onstart = () => { if (currentId === speechIdRef.current) setIsSpeaking(true); };
                    utterance.onend = () => { if (currentId === speechIdRef.current) setIsSpeaking(false); };

                    rec.continuous = false;
                    rec.interimResults = true;
                    rec.onstart = () => { setIsListening(true); showToast("🎙 Ouvindo voz direta para a SARAH..."); };
                    rec.onresult = (event) => {
                        let final = '';
                        for (let i = event.resultIndex; i < event.results.length; ++i) {
                            if (event.results[i].isFinal) final += event.results[i][0].transcript;
                        }
                        if (final) {
                            setInput(final);
                            setIsListening(false);
                            handleSendDirectCommand(final);
                        }
                    };
                    rec.onerror = () => { setIsListening(false); showToast("⚠ Erro no microfone."); };
                    rec.onend = () => { setIsListening(false); };
                    rec.start();
                } catch (e) { setIsListening(false); showToast("⚠️ Erro ao iniciar microfone."); }
            };

            const handleSendDirectCommand = async (textCustom) => {
                stopSpeaking();
                const textToSend = textCustom !== undefined ? textCustom : input;
                if (!textToSend.trim() || isProcessing) return;

                const queryText = textToSend.trim();
                setInput("");
                setIsProcessing(true);
                setCurrentResponse("🔄 SARAH processando áudio e comando direto...");

                const weatherContext = liveWeather
                    ? `Condições meteorológicas atuais em Mesquita/RJ: Temperatura ${liveWeather.temperature_2m}°C, Umidade ${liveWeather.relative_humidity_2m}%, Precipitação ${liveWeather.precipitation} mm, Vento ${liveWeather.wind_speed_10m} km/h. Monitoramento ativo do céu, nuvens, radares e bacias (Rio Sarapuí, Rio Dona Eugênia e Rio Prata).`
                    : "Dados meteorológicos e atmosféricos ativos.";

                try {
                    const response = await fetch(CLOUDFLARE_WORKER_URL, {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({
                            model: "openai/gpt-oss-120b",
                            messages: [
                                {
                                    role: "system",
                                    content: `Você é a SARAH IA NEXUS v5.2 PRO, núcleo de inteligência da Defesa Civil Comunitária (Grupo A Chave da Esperança, Mesquita/RJ). Responda sempre diretamente para o usuário em voz viva e falada, sem histórico de chat. ${weatherContext}`
                                },
                                { role: "user", content: queryText }
                            ],
                            temperature: 0.4,
                            max_tokens: 300
                        })
                    });

                    if (response.status === 404) {
                        throw new Error("Erro 404: Endpoint de IA indisponível na rota configurada.");
                    }

                    const data = await response.json();
                    let reply = data?.choices?.[0]?.message?.content || data?.message || "Análise concluída com sucesso.";

                    reply = reply.replace(/#{1,6}\s?/g, '').replace(/\*\*/g, '').replace(/\|/g, ' ').replace(/---/g, '').trim();

                    setCurrentResponse(reply);
                    speakText(reply);
                } catch (error) {
                    const fallback = error.message.includes("404")
                        ? "Erro 404: Endpoint da IA indisponível na rota configurada."
                        : "Falha de enlace com a rede. Verifique sua conexão.";
                    setCurrentResponse(fallback);
                    speakText(fallback);
                } finally {
                    setIsProcessing(false);
                }
            };

            return (
                <div className="min-h-screen flex flex-col relative bg-obsidian text-slate-100 antialiased selection:bg-neonCyan selection:text-obsidian">
                    
                    {isLoadingSplash && (
                        <div className="fixed inset-0 bg-obsidian z-[100] flex flex-col items-center justify-center p-6">
                            <div className="flex flex-col items-center space-y-6 max-w-sm w-full text-center">
                                <SarahHologramAvatar isLarge={true} isSpeaking={isSpeaking} />
                                <div className="space-y-2">
                                    <h2 className="font-sans text-2xl font-black text-white tracking-wide">SARAH IA NEXUS <span className="text-neonCyan">v5.2 PRO</span></h2>
                                    <p className="font-sans text-xs text-slate-400 font-medium">Modo Comando Direto & Oculto</p>
                                    <p className="font-sans text-[11px] text-emeraldMint font-bold">Grupo A Chave da Esperança (Mesquita/RJ)</p>
                                </div>
                                <div className="w-56 h-1.5 bg-surfaceCard rounded-full overflow-hidden border border-neonCyan/30">
                                    <div className="h-full bg-gradient-to-r from-neonCyan via-electricIndigo to-emeraldMint animate-pulse w-full"></div>
                                </div>
                            </div>
                        </div>
                    )}

                    {toastMessage && (
                        <div className="fixed top-20 left-1/2 -translate-x-1/2 z-50 bg-gradient-to-r from-neonCyan to-emeraldMint text-obsidian px-6 py-3 rounded-2xl font-sans text-xs font-black shadow-[0_10px_30px_rgba(0,242,254,0.4)] border border-white/40 animate-bounce">
                            {toastMessage}
                        </div>
                    )}

                    {shareModalOpen && (
                        <div className="fixed inset-0 bg-obsidian/85 backdrop-blur-xl z-50 flex items-center justify-center p-4">
                            <div className="glass-panel max-w-md w-full p-6 sm:p-8 rounded-[32px] border border-neonCyan/40 space-y-4 text-center shadow-2xl">
                                <h3 className="text-base font-extrabold text-neonCyan">📲 Partilhar Aplicativo</h3>
                                <textarea readOnly value={shareMessageText} className="w-full h-28 bg-obsidian border border-neonCyan/30 rounded-2xl p-3 text-xs text-slate-200 resize-none font-mono input-shadow" />
                                <div className="flex gap-3">
                                    <button onClick={() => { navigator.clipboard.writeText(shareMessageText); showToast("📋 Copiado!"); setShareModalOpen(false); }} className="flex-1 py-3.5 bg-neonCyan text-obsidian font-extrabold rounded-2xl text-xs cursor-pointer btn-interactive">Copiar</button>
                                    <button onClick={() => setShareModalOpen(false)} className="px-5 py-3.5 bg-alertCoral/25 text-alertCoral rounded-2xl text-xs font-bold">Fechar</button>
                                </div>
                            </div>
                        </div>
                    )}

                    {installModalOpen && (
                        <div className="fixed inset-0 bg-obsidian/85 backdrop-blur-xl z-50 flex items-center justify-center p-4">
                            <div className="glass-panel max-w-md w-full p-6 sm:p-8 rounded-[32px] border border-neonCyan/40 space-y-4 text-center shadow-2xl">
                                <h3 className="text-base font-extrabold text-neonCyan">📥 Instalar App</h3>
                                <p className="text-xs text-slate-300 leading-relaxed text-left">Abra o menu do seu navegador e selecione <em>"Adicionar à Tela Inicial"</em> ou <em>"Instalar Aplicativo"</em>.</p>
                                <button onClick={() => setInstallModalOpen(false)} className="w-full py-3.5 bg-neonCyan text-obsidian font-extrabold rounded-2xl text-xs cursor-pointer">Entendido</button>
                            </div>
                        </div>
                    )}

                    {!termsAccepted && (
                        <div className="fixed inset-0 bg-obsidian/95 z-[200] flex items-center justify-center p-4 overflow-y-auto">
                            <div className="glass-panel max-w-lg w-full p-6 sm:p-8 rounded-[36px] border-2 border-neonCyan/65 shadow-2xl space-y-5 my-auto">
                                <div className="text-center space-y-2">
                                    <div className="inline-flex p-3.5 rounded-3xl bg-neonCyan/10 border border-neonCyan/30 text-neonCyan mb-1"><CyberShieldIcon className="w-9 h-9" /></div>
                                    <h2 className="text-lg font-black text-white">SARAH IA NEXUS v5.2 PRO</h2>
                                    <p className="text-xs text-neonCyan font-extrabold uppercase">Termo LGPD & Permissão de GPS</p>
                                </div>
                                <div className="bg-obsidian/90 p-4 rounded-2xl border border-neonCyan/30 text-xs text-slate-300 space-y-2 max-h-52 overflow-y-auto font-sans">
                                    <p>Em conformidade com a <strong>Lei Federal nº 13.709/2018 (LGPD)</strong>, o sistema utiliza o GPS obrigatoriamente para fixar coordenadas precisas em vistorias de Defesa Civil.</p>
                                </div>
                                <div className="space-y-3 font-sans">
                                    <label className="flex items-start gap-3 cursor-pointer text-xs text-slate-300 bg-surfaceCard/50 p-3 rounded-xl border border-neonCyan/20">
                                        <input type="checkbox" checked={check1} onChange={(e) => setCheck1(e.target.checked)} className="mt-0.5 rounded border-neonCyan/50 text-neonCyan w-4 h-4 bg-obsidian shrink-0 cursor-pointer" />
                                        <span>Li e aceito os termos da Lei Geral de Proteção de Dados (LGPD).</span>
                                    </label>
                                    <label className="flex items-start gap-3 cursor-pointer text-xs text-slate-300 bg-surfaceCard/50 p-3 rounded-xl border border-neonCyan/20">
                                        <input type="checkbox" checked={check2} onChange={(e) => setCheck2(e.target.checked)} className="mt-0.5 rounded border-neonCyan/50 text-neonCyan w-4 h-4 bg-obsidian shrink-0 cursor-pointer" />
                                        <span>Compreendo e autorizo o uso obrigatório do GPS para telemetria de campo.</span>
                                    </label>
                                </div>
                                <button disabled={!check1 || !check2} onClick={() => { setTermsAccepted(true); try { localStorage.setItem("sarah_terms_accepted_v52_lgpd", "1"); } catch(e) {} showToast("🚀 Sistema ativado!"); }} className={`w-full py-4 rounded-2xl font-black text-xs uppercase tracking-widest transition shadow-2xl ${check1 && check2 ? 'bg-gradient-to-r from-emeraldMint via-neonCyan to-electricIndigo text-obsidian cursor-pointer btn-interactive' : 'bg-surfaceCard text-slate-500 cursor-not-allowed'}`}>
                                    Concordar e Iniciar Operação
                                </button>
                            </div>
                        </div>
                    )}

                    <header className="glass-panel sticky top-0 z-30 px-4 sm:px-6 py-3.5 border-b border-neonCyan/30 flex items-center justify-between shadow-xl">
                        <div className="flex items-center gap-3">
                            <div className="w-11 h-11 rounded-2xl border-2 border-neonCyan/60 flex items-center justify-center bg-obsidian shadow-[0_0_20px_rgba(0,242,254,0.3)]">
                                <svg width="22" height="22" viewBox="0 0 24 24" fill="url(#headerGrad)"><path d="M13 2L3 14h7l-1 8 10-12h-7l1-8z"/><defs><linearGradient id="headerGrad" x1="3" y1="2" x2="21" y2="22"><stop stopColor="#00F2FE" /><stop offset="1" stopColor="#00F5A0" /></linearGradient></defs></svg>
                            </div>
                            <div>
                                <h1 className="text-xs sm:text-sm font-black text-white tracking-wide">SARAH IA NEXUS <span className="text-neonCyan text-[10px] font-mono">v5.2 PRO</span></h1>
                                <p className="text-[10px] text-emeraldMint font-mono font-bold">VOZ DIRETA & AVATAR ATIVO • MESQUITA/RJ</p>
                            </div>
                        </div>
                        <div className="flex items-center gap-2">
                            <button onClick={() => setSoundEnabled(!soundEnabled)} className={`p-2.5 rounded-xl border text-xs cursor-pointer transition btn-interactive ${soundEnabled ? 'bg-neonCyan/20 border-neonCyan text-neonCyan shadow' : 'bg-surfaceCard border-neonCyan/20 text-slate-500'}`} title={soundEnabled ? "Som Ativado" : "Mudo"}>{soundEnabled ? '🔊' : '🔇'}</button>
                            <button onClick={toggleTheme} className="p-2.5 rounded-xl border border-neonCyan/30 bg-surfaceCard text-neonCyan text-xs cursor-pointer btn-interactive shadow" title="Tema">☀️</button>
                            <button onClick={handleShareLink} className="p-2.5 rounded-xl border border-neonCyan/30 bg-surfaceCard text-neonCyan text-xs cursor-pointer btn-interactive shadow" title="Partilhar">🔗</button>
                            <button onClick={handleInstallApp} className="p-2.5 rounded-xl border border-neonCyan/30 bg-surfaceCard text-neonCyan text-xs cursor-pointer btn-interactive shadow" title="Instalar">📥</button>
                        </div>
                    </header>

                    <nav className="glass-panel border-b border-neonCyan/30 px-4 py-2.5 flex items-center justify-center gap-2 overflow-x-auto z-20">
                        <button onClick={() => setActiveTab("dashboard")} className={`px-4 py-2 rounded-xl text-xs font-extrabold transition cursor-pointer flex items-center gap-2 shrink-0 btn-interactive ${activeTab === 'dashboard' ? 'bg-neonCyan text-obsidian shadow-[0_0_20px_rgba(0,242,254,0.4)]' : 'bg-surfaceCard text-slate-300 border border-neonCyan/20'}`}><span>💬</span> Comando Direto</button>
                        <button onClick={() => setActiveTab("radar")} className={`px-4 py-2 rounded-xl text-xs font-extrabold transition cursor-pointer flex items-center gap-2 shrink-0 btn-interactive ${activeTab === 'radar' ? 'bg-neonCyan text-obsidian shadow-[0_0_20px_rgba(0,242,254,0.4)]' : 'bg-surfaceCard text-slate-300 border border-neonCyan/20'}`}><span>🛰</span> Radar & Clima 24h</button>
                        <button onClick={() => setActiveTab("relatorio")} className={`px-4 py-2 rounded-xl text-xs font-extrabold transition cursor-pointer flex items-center gap-2 shrink-0 btn-interactive ${activeTab === 'relatorio' ? 'bg-neonCyan text-obsidian shadow-[0_0_20px_rgba(0,242,254,0.4)]' : 'bg-surfaceCard text-slate-300 border border-neonCyan/20'}`}><span>📋</span> Vistoria & Relatório</button>
                        <button onClick={() => setActiveTab("galeria")} className={`px-4 py-2 rounded-xl text-xs font-extrabold transition cursor-pointer flex items-center gap-2 shrink-0 btn-interactive ${activeTab === 'galeria' ? 'bg-neonCyan text-obsidian shadow-[0_0_20px_rgba(0,242,254,0.4)]' : 'bg-surfaceCard text-slate-300 border border-neonCyan/20'}`}><span>🎥</span> Vídeos</button>
                        <button onClick={() => setActiveTab("admin")} className={`px-4 py-2 rounded-xl text-xs font-extrabold transition cursor-pointer flex items-center gap-2 shrink-0 btn-interactive ${activeTab === 'admin' ? 'bg-emeraldMint text-obsidian shadow-[0_0_20px_rgba(0,245,160,0.4)]' : 'bg-surfaceCard text-emeraldMint border border-emeraldMint/30'}`}><span>🔒</span> Admin</button>
                    </nav>

                    <main className="flex-1 max-w-3xl w-full mx-auto p-4 sm:p-6 space-y-5 pb-28">
                        {activeTab === 'dashboard' && (
                            <div className="space-y-5">
                                <div className="glass-panel p-6 sm:p-8 rounded-[36px] border border-neonCyan/35 shadow-2xl space-y-6 text-center">
                                    <SarahHologramAvatar isLarge={true} isSpeaking={isSpeaking} />

                                    <div className="space-y-2">
                                        <h2 className="text-base font-black text-white">Comando Direto & Voz da SARAH</h2>
                                        <p className="text-xs text-slate-300 font-medium">
                                            Interface direta por microfone e botão de envio, sem caixas de chat poluidas. Fale diretamente com ela.
                                        </p>
                                    </div>

                                    <div className="bg-obsidian border border-neonCyan/40 p-5 rounded-3xl text-left space-y-2 input-shadow shadow-xl">
                                        <div className="flex items-center justify-between text-[10px] font-mono text-neonCyan font-bold uppercase border-b border-neonCyan/20 pb-2">
                                            <span className="flex items-center gap-2"><span className="w-2 h-2 rounded-full bg-emeraldMint animate-pulse"></span> Resposta Falada Direta da SARAH</span>
                                            <span>Modo Voz Ativa</span>
                                        </div>
                                        <div className="text-xs sm:text-sm font-sans text-slate-100 whitespace-pre-line leading-relaxed py-3">
                                            {currentResponse}
                                        </div>
                                    </div>

                                    <div className="pt-2">
                                        <form onSubmit={(e) => { e.preventDefault(); handleSendDirectCommand(); }} className="flex items-center gap-2 bg-obsidian border-2 border-neonCyan/40 rounded-2xl p-2 input-shadow">
                                            <button 
                                                type="button" 
                                                onClick={toggleListening}
                                                className={`p-3.5 rounded-xl transition cursor-pointer flex items-center justify-center shrink-0 ${isListening ? 'bg-vibrantPink text-white animate-mic-ripple shadow-[0_0_20px_rgba(255,8,68,0.8)]' : 'bg-surfaceCard text-neonCyan hover:bg-neonCyan/20 border border-neonCyan/30'}`}
                                                title="Falar diretamente com a SARAH"
                                            >
                                                🎙️
                                            </button>
                                            <input 
                                                type="text" 
                                                value={input} 
                                                onChange={(e) => setInput(e.target.value)}
                                                placeholder="Digite ou fale diretamente com a SARAH..." 
                                                className="flex-1 bg-transparent border-none px-3 py-2 text-xs text-slate-100 focus:outline-none font-sans"
                                            />
                                            <button 
                                                type="submit" 
                                                disabled={isProcessing || !input.trim()}
                                                className={`px-6 py-3 rounded-xl font-extrabold text-xs transition cursor-pointer btn-interactive shadow-lg ${
                                                    input.trim() && !isProcessing 
                                                        ? 'bg-gradient-to-r from-neonCyan to-emeraldMint text-obsidian' 
                                                        : 'bg-surfaceCard text-slate-500 cursor-not-allowed'
                                                }`}
                                            >
                                                {isProcessing ? 'Ouvindo...' : 'Falar 🚀'}
                                            </button>
                                        </form>
                                    </div>

                                    <div className="flex flex-wrap justify-center gap-2 pt-2">
                                        <button onClick={() => handleSendDirectCommand("Status atual das bacias Sarapuí, Dona Eugênia e Prata")} className="px-3 py-1.5 bg-obsidian border border-neonCyan/30 hover:border-neonCyan text-neonCyan rounded-xl text-[11px] font-bold transition cursor-pointer">🌊 Bacias</button>
                                        <button onClick={() => handleSendDirectCommand("Condições meteorológicas atuais em Mesquita")} className="px-3 py-1.5 bg-obsidian border border-neonCyan/30 hover:border-neonCyan text-neonCyan rounded-xl text-[11px] font-bold transition cursor-pointer">🌦️ Clima</button>
                                        <button onClick={() => handleSendDirectCommand("Diretrizes de prevenção da Defesa Civil")} className="px-3 py-1.5 bg-obsidian border border-neonCyan/30 hover:border-neonCyan text-neonCyan rounded-xl text-[11px] font-bold transition cursor-pointer">🛡️ Defesa Civil</button>
                                    </div>
                                </div>
                            </div>
                        )}

                        {activeTab === 'radar' && <NativeHydroWindRadar liveWeather={liveWeather} />}
                        {activeTab === 'relatorio' && <FieldReportModule onBackToDashboard={() => setActiveTab('dashboard')} showToast={showToast} />}
                        {activeTab === 'galeria' && <PublicVideoGallery localVideos={localVideos} onGoToDashboard={() => setActiveTab('dashboard')} />}
                        {activeTab === 'admin' && (
                            <AdminVaultModule 
                                localVideos={localVideos} 
                                setLocalVideos={setLocalVideos} 
                                marketingText={marketingText}
                                setMarketingText={setMarketingText}
                                showToast={showToast} 
                                onClose={() => setActiveTab('dashboard')} 
                            />
                        )}

                        <AutomatedObservatoryWidget marketingText={marketingText} />
                    </main>

                    <footer className="glass-panel fixed bottom-0 left-0 right-0 z-40 border-t border-neonCyan/30 px-4 py-3 flex items-center justify-around shadow-2xl backdrop-blur-2xl">
                        <button onClick={() => setActiveTab('dashboard')} className={`flex flex-col items-center gap-1 cursor-pointer transition ${activeTab === 'dashboard' ? 'text-neonCyan scale-105' : 'text-slate-400 hover:text-white'}`}>
                            <span className="text-lg">💬</span>
                            <span className="text-[10px] font-extrabold">Comando</span>
                        </button>
                        <button onClick={() => setActiveTab('radar')} className={`flex flex-col items-center gap-1 cursor-pointer transition ${activeTab === 'radar' ? 'text-neonCyan scale-105' : 'text-slate-400 hover:text-white'}`}>
                            <span className="text-lg">🛰</span>
                            <span className="text-[10px] font-extrabold">Radar 24h</span>
                        </button>
                        <button onClick={() => setActiveTab('relatorio')} className={`flex flex-col items-center gap-1 cursor-pointer transition ${activeTab === 'relatorio' ? 'text-neonCyan scale-105' : 'text-slate-400 hover:text-white'}`}>
                            <span className="text-lg">📋</span>
                            <span className="text-[10px] font-extrabold">Vistoria</span>
                        </button>
                        <button onClick={() => setActiveTab('galeria')} className={`flex flex-col items-center gap-1 cursor-pointer transition ${activeTab === 'galeria' ? 'text-neonCyan scale-105' : 'text-slate-400 hover:text-white'}`}>
                            <span className="text-lg">🎥</span>
                            <span className="text-[10px] font-extrabold">Vídeos</span>
                        </button>
                        <button onClick={() => setActiveTab('admin')} className={`flex flex-col items-center gap-1 cursor-pointer transition ${activeTab === 'admin' ? 'text-emeraldMint scale-105' : 'text-emeraldMint/70 hover:text-emeraldMint'}`}>
                            <span className="text-lg">🔒</span>
                            <span className="text-[10px] font-extrabold">Admin</span>
                        </button>
                    </footer>

                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
