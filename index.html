        // Radar com Satélite dinâmico que percorre as linhas e inverte a rotação na última linha
        function NativeHydroWindRadar({ liveWeather }) {
            const canvasRef = React.useRef(null);
            const [brasiliaTime, setBrasiliaTime] = React.useState("");

            React.useEffect(() => {
                const timer = setInterval(() => {
                    const now = new Date();
                    const timeStr = new Intl.DateTimeFormat("pt-BR", {
                        timeZone: "America/Sao_Paulo",
                        hour: "2-digit",
                        minute: "2-digit",
                        second: "2-digit",
                        hour12: false
                    }).format(now);
                    setBrasiliaTime(timeStr);
                }, 1000);
                return () => clearInterval(timer);
            }, []);

            React.useEffect(() => {
                const canvas = canvasRef.current;
                if (!canvas) return;
                const ctx = canvas.getContext('2d');
                let animationFrameId;
                let angle = 0;
                let satProgress = 0;
                let satDirection = 1;

                const radarRadii = [60, 105, 150, 195];

                const windParticles = Array.from({ length: 20 }, () => ({
                    x: Math.random() * canvas.width,
                    y: Math.random() * canvas.height,
                    speed: 1.4 + Math.random() * 2.0,
                    size: 15 + Math.random() * 25
                }));

                const render = () => {
                    ctx.clearRect(0, 0, canvas.width, canvas.height);

                    ctx.fillStyle = '#020617';
                    ctx.fillRect(0, 0, canvas.width, canvas.height);

                    const centerX = canvas.width / 2;
                    const centerY = canvas.height / 2;

                    radarRadii.forEach((r, idx) => {
                        ctx.strokeStyle = idx === radarRadii.length - 1 ? 'rgba(229, 138, 199, 0.5)' : 'rgba(155, 126, 222, 0.3)';
                        ctx.lineWidth = idx === radarRadii.length - 1 ? 2 : 1.2;
                        ctx.beginPath();
                        ctx.arc(centerX, centerY, r, 0, Math.PI * 2);
                        ctx.stroke();
                    });

                    ctx.strokeStyle = 'rgba(155, 126, 222, 0.25)';
                    ctx.beginPath();
                    ctx.moveTo(0, centerY); ctx.lineTo(canvas.width, centerY);
                    ctx.moveTo(centerX, 0); ctx.lineTo(centerX, canvas.height);
                    ctx.stroke();

                    windParticles.forEach(p => {
                        p.x += p.speed;
                        if (p.x > canvas.width + 40) p.x = -40;

                        const cloudGrad = ctx.createRadialGradient(p.x, p.y, 2, p.x, p.y, p.size);
                        cloudGrad.addColorStop(0, 'rgba(99, 230, 226, 0.2)');
                        cloudGrad.addColorStop(1, 'transparent');
                        ctx.fillStyle = cloudGrad;
                        ctx.beginPath();
                        ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                        ctx.fill();
                    });

                    ctx.save();
                    ctx.translate(centerX, centerY);
                    ctx.rotate(angle);
                    const grad = ctx.createLinearGradient(0, 0, 180, -180);
                    grad.addColorStop(0, 'rgba(155, 126, 222, 0.5)');
                    grad.addColorStop(1, 'transparent');
                    ctx.fillStyle = grad;
                    ctx.beginPath();
                    ctx.moveTo(0, 0);
                    ctx.arc(0, 0, 195, -Math.PI / 2, 0);
                    ctx.lineTo(0, 0);
                    ctx.fill();
                    ctx.restore();

                    angle += 0.025 * satDirection;

                    const currentRadius = radarRadii[Math.floor(Math.abs(Math.sin(satProgress * 0.5)) * radarRadii.length)];
                    const satX = centerX + Math.cos(satProgress) * currentRadius;
                    const satY = centerY + Math.sin(satProgress) * currentRadius;

                    ctx.fillStyle = '#63E6E2';
                    ctx.fillRect(satX - 6, satY - 4, 12, 8);
                    ctx.fillStyle = '#9B7EDE';
                    ctx.fillRect(satX - 14, satY - 2, 8, 4);
                    ctx.fillRect(satX + 6, satY - 2, 8, 4);
                    ctx.strokeStyle = '#E58AC7';
                    ctx.lineWidth = 1.5;
                    ctx.beginPath();
                    ctx.arc(satX, satY, 10, 0, Math.PI * 2);
                    ctx.stroke();

                    satProgress += 0.015 * satDirection;
                    if (satProgress > Math.PI * 6 || satProgress < 0) {
                        satDirection *= -1;
                    }

                    const bacias = [
                        { name: "Rio Sarapuí", x: centerX - 85, y: centerY - 50, color: "#63E6E2" },
                        { name: "Rio Dona Eugênia", x: centerX + 40, y: centerY - 60, color: "#72E6B2" },
                        { name: "Rio Prata", x: centerX + 30, y: centerY + 60, color: "#E58AC7" },
                        { name: "Base A Chave da Esperança", x: centerX - 30, y: centerY + 15, color: "#9B7EDE" }
                    ];

                    bacias.forEach(b => {
                        ctx.fillStyle = b.color;
                        ctx.beginPath();
                        ctx.arc(b.x, b.y, 8, 0, Math.PI * 2);
                        ctx.fill();

                        ctx.strokeStyle = '#FFFFFF';
                        ctx.lineWidth = 2;
                        ctx.stroke();

                        ctx.fillStyle = '#FFFFFF';
                        ctx.font = 'bold 12px Inter, sans-serif';
                        ctx.fillText(b.name, b.x + 14, b.y + 4);

                        ctx.fillStyle = '#0D1B2A';
                        ctx.strokeStyle = '#63E6E2';
                        ctx.lineWidth = 1;
                        ctx.fillRect(b.x + 14, b.y + 8, 76, 16);
                        ctx.strokeRect(b.x + 14, b.y + 8, 76, 16);

                        ctx.fillStyle = '#72E6B2';
                        ctx.font = 'bold 9px Inter, sans-serif';
                        ctx.fillText("OPERACIONAIS", b.x + 18, b.y + 20);
                    });

                    animationFrameId = requestAnimationFrame(render);
                };

                render();

                return () => cancelAnimationFrame(animationFrameId);
            }, []);

            return (
                <div className="relative w-full h-[380px] rounded-3xl overflow-hidden border-2 border-sophisticatedViolet/50 shadow-2xl bg-petroleumPanel flex flex-col justify-between p-3">
                    <div className="flex items-center justify-between z-10 bg-nightBlue/90 border border-sophisticatedViolet/50 px-4 py-2 rounded-2xl shadow-lg backdrop-blur-md">
                        <div className="flex items-center gap-2 font-bold text-xs text-softCyan font-sans">
                            <span className="w-2.5 h-2.5 rounded-full bg-mintGreen animate-ping"></span>
                            SATÉLITE ORBITAL & RADAR HIDROGRÁFICO
                        </div>
                        <div className="flex items-center gap-3 font-mono text-xs font-bold text-orchidPink">
                            <span>🕒 {brasiliaTime || "00:00:00"} (Brasília)</span>
                            <span className="text-mintGreen">🌡️ {liveWeather ? `${liveWeather.temperature_2m}°C` : '17.3°C'}</span>
                        </div>
                    </div>
                    <div className="absolute inset-0 flex items-center justify-center pt-8">
                        <canvas ref={canvasRef} width="460" height="300" className="w-full h-full object-contain"></canvas>
                    </div>
                </div>
            );
        }

        function FieldReportModule() {

                    <div className="glass-dark rounded-3xl p-6 space-y-4 border border-sophisticatedViolet/40 shadow-xl">

                        </div>

                            <label className="block text-xs font-medium text-lightLavender mb-1">Comunidade / Localidade:</label>
                            <input type="text" value={localidade} onChange={(e) => setLocalidade(e.target.value)} placeholder="Ex: Comunidade Nova Esperança / Rio Sarapuí" className="w-full bg-nightBlue border border-sophisticatedViolet/40 rounded-xl p-2.5 text-xs text-lightLavender focus:ring-2 focus:ring-softCyan focus:outline-none" />
                        </div>

                        <div className="grid grid-cols-2 gap-4">
                            <div>
                                <label className="block text-xs font-medium text-lightLavender mb-1">Data:</label>
                                <input type="date" value={dataVisita} onChange={(e) => setDataVisita(e.target.value)} className="w-full bg-nightBlue border border-sophisticatedViolet/40 rounded-xl p-2.5 text-xs text-lightLavender focus:ring-2 focus:ring-softCyan focus:outline-none" />
                            </div>

                                <label className="block text-xs font-medium text-lightLavender mb-1">Categoria de Ocorrência:</label>
                                <select value={categoria} onChange={(e) => setCategoria(e.target.value)} className="w-full bg-nightBlue border border-sophisticatedViolet/40 rounded-xl p-2.5 text-xs text-lightLavender focus:ring-2 focus:ring-softCyan focus:outline-none">
                                    <option value="Infraestrutura e Drenagem">Infraestrutura e Drenagem</option>
                                    <option value="Vistoria Habitacional (LMTS)">Vistoria Habitacional (LMTS)</option>
                                    <option value="Risco Geológico / Ambiental">Risco Geológico / Ambiental</option>
                                    <option value="Demanda Social / Apoio">Demanda Social / Apoio</option>
                                </select>
                            </div>
                        </div>

                    .replace(/\s+/g, " ")
                    .trim();
            };

            const escolherMelhorVoz = () => {

                return voices.find((voice) => voice.lang.toLowerCase().includes("pt")) || voices[0];

                    utterance.rate = 0.98;
                    utterance.onstart = () => { if (currentId === speechIdRef.current) setIsSpeaking(true); };

${weatherContext}
Lema fundamental: "Prevenção não é mídia: é gente atenta."`

                                                <span className="w-2 h-2 rounded-full bg-mintGreen animate-ping"></span>
                                            </div>
                                            <div className="text-2xl font-bold font-mono text-white">1.42 m</div>
                                            <div className="text-[10px] text-mintGreen font-bold">↑ +0.08 m • tendência alta</div>
                                        </div>

                                        <div className="glass-dark p-4 rounded-2xl border border-sophisticatedViolet/40 flex flex-col justify-between shadow-lg btn-animated">
                                            <div className="flex items-center justify-between text-xs text-orchidPink font-bold">
                                                <span>🌧️ Precipitação (pico)</span>
                                            </div>
                                            <div className="text-2xl font-bold font-mono text-white">0.45 mm/h</div>
                                            <div className="text-[10px] text-coralAlert font-bold">Alta intensidade • 01:00</div>
                                        </div>

                                        <div className="glass-dark p-4 rounded-2xl border border-sophisticatedViolet/40 flex flex-col justify-between shadow-lg btn-animated">
                                            <div className="flex items-center justify-between text-xs text-softCyan font-bold">
                                                <span>🌡️ Temperatura</span>
                                            </div>
                                            <div className="text-2xl font-bold font-mono text-white">17.3 °C</div>
                                            <div className="text-[10px] text-sophisticatedViolet font-bold">↓ -1.2°C • resfriando</div>
                                        </div>

                                        <a href="tel:199" className="glass-dark p-4 rounded-2xl border-2 border-coralAlert bg-coralAlert/15 hover:bg-coralAlert/30 flex flex-col items-center justify-center text-center shadow-lg transition btn-animated">
                                            <span className="text-xl">🚨</span>
                                            <span className="text-xs font-bold text-coralAlert mt-1">DEFESA CIVIL 199</span>
                                            <span className="text-[9px] text-lightLavender/80">Emergência 24h</span>
                                        </a>
                                    </div>

                                    <div className="grid grid-cols-1 gap-4">
                                        <div className="glass-dark rounded-3xl p-4 border border-sophisticatedViolet/40 shadow-2xl flex flex-col justify-between btn-animated">
                                            <div className="flex items-center justify-between mb-3 pb-2 border-b border-sophisticatedViolet/30">
                                                <h3 className="font-sans text-softCyan text-xs font-bold">🛰️ Satélite em Órbita & Radar Hidrográfico</h3>
                                                <span className="w-2.5 h-2.5 rounded-full bg-mintGreen animate-pulse"></span>
                                            </div>
                                            <NativeHydroWindRadar liveWeather={liveWeather} />
                                        </div>
                                    </div>
                                </div>
                            )}

                            {activeTab === "field_report" && (
                                <div className="space-y-4 flex-1 flex flex-col">
                                    <FieldReportModule />
                                </div>
                            )}

                            {activeTab === "chat" && (
                                <div className="glass-dark rounded-3xl shadow-2xl flex flex-col overflow-hidden flex-1 border border-sophisticatedViolet/40" style={{ minHeight: "520px" }}>
                                    <div className="bg-petroleumPanel/90 px-4 py-2 border-b border-sophisticatedViolet/30 flex items-center justify-between text-xs font-sans">
                                        <span className="text-softCyan font-bold flex items-center gap-1.5">
                                            <span className="w-2 h-2 rounded-full bg-orchidPink animate-pulse"></span>
                                            SARAH IA NEXUS v5.2 PRO • Canal Ativo
                                        </span>
                                        <div className="flex items-center gap-2">
                                            <button onClick={() => setSoundEnabled(!soundEnabled)} className="px-2.5 py-1 rounded-xl bg-nightBlue text-softCyan border border-sophisticatedViolet/50 font-bold cursor-pointer btn-animated">
                                                {soundEnabled ? "🔊 Voz Ativa" : "🔇 Mudo"}
                                            </button>
                                            <button onClick={() => setMessages([])} className="px-3 py-1 bg-nightBlue text-orchidPink rounded-xl border border-sophisticatedViolet/30 font-bold cursor-pointer btn-animated">
                                                🧹 Limpar
                                            </button>
                                        </div>
                                    </div>

                                    <div className="flex-1 overflow-y-auto p-4 sm:p-6 space-y-4">
                                        {messages.length === 0 && (
                                            <div className="h-full flex flex-col items-center justify-center p-4 my-auto">
                                                <div className="w-full max-w-lg bg-petroleumPanel/95 border border-sophisticatedViolet/40 rounded-3xl p-6 shadow-2xl flex flex-col items-center text-center">
                                                    <SarahAvatar showStatus={true} isLarge={true} />
                                                    <h2 className="font-sans text-lg font-bold text-lightLavender mt-4 mb-2">SARAH IA NEXUS v5.2 PRO</h2>
                                                    <p className="text-xs text-softCyan mb-4">"Prevenção não é mídia: é gente atenta."</p>
                                                    <button onClick={() => setActiveTab("dashboard")} className="py-2.5 px-5 bg-sophisticatedViolet/20 hover:bg-sophisticatedViolet/35 border border-sophisticatedViolet/40 text-softCyan rounded-2xl text-xs font-bold cursor-pointer btn-animated">
                                                        🛰️ Aceder ao Radar Climático
                                                    </button>
                                                </div>
                                            </div>
                                        )}

                                        {messages.map((m) => (
                                            <div key={m.id} className={`flex items-start gap-3 ${m.sender === "user" ? "flex-row-reverse" : "flex-row"}`}>
                                                {m.sender === "user" ? (
                                                    <div className="w-10 h-10 rounded-2xl flex items-center justify-center bg-petroleumPanel border border-sophisticatedViolet/50 text-orchidPink">👤</div>
                                                ) : (
                                                    <SarahAvatar size="w-10 h-10" showStatus={false} />
                                                )}
                                                <div className={`p-4 rounded-3xl max-w-[85%] font-sans leading-relaxed ${m.sender === "user" ? "bg-gradient-to-r from-sophisticatedViolet to-orchidPink text-nightBlue rounded-tr-none font-medium" : "bg-petroleumPanel/95 text-lightLavender border border-sophisticatedViolet/40 rounded-tl-none shadow-xl"}`}>
                                                    <div className="flex justify-between text-[10px] opacity-75 mb-1">
                                                        <span>{m.sender === "user" ? "Você" : "SARAH IA NEXUS"}</span>
                                                        <span>{m.timestamp}</span>
                                                    </div>
                                                    <div>{m.text}</div>
                                                </div>
                                            </div>
                                        ))}

                                        {isLoadingChat && (
                                            <div className="flex items-center gap-3">
                                                <SarahAvatar size="w-10 h-10" showStatus={false} />
                                                <div className="bg-petroleumPanel p-3 rounded-2xl text-xs text-softCyan animate-pulse border border-sophisticatedViolet/40">
                                                    SARAH IA a processar telemetria...
                                                </div>
                                            </div>
                                        )}
                                    </div>

                                    <div className="p-3 sm:p-4 bg-nightBlue/95 border-t border-sophisticatedViolet/30">
                                        <div className="flex items-center gap-3 bg-petroleumPanel/90 border border-sophisticatedViolet/40 rounded-2xl p-2.5 shadow-inner">
                                            <button onClick={toggleListening} className={`w-11 h-11 rounded-xl flex items-center justify-center cursor-pointer btn-animated ${isListening ? 'bg-orchidPink text-nightBlue animate-pulse' : 'bg-nightBlue text-orchidPink border border-sophisticatedViolet/40'}`}>
                                                🎤
                                            </button>
                                            <input
                                                type="text"
                                                value={input}
                                                onChange={(e) => setInput(e.target.value)}
                                                onKeyDown={(e) => { if (e.key === "Enter") handleSendMessage(); }}
                                                placeholder="Digite sua mensagem para a SARAH IA NEXUS..."
                                                className="w-full bg-transparent text-lightLavender text-sm focus:outline-none px-1"
                                            />
                                            <button onClick={() => handleSendMessage()} disabled={isLoadingChat || !input.trim()} className="w-11 h-11 rounded-xl bg-gradient-to-r from-indigo-600 to-indigo-500 text-white flex items-center justify-center cursor-pointer disabled:opacity-30 btn-animated">
                                                ➤
                                            </button>
                                        </div>
                                    </div>
                                </div>
                            )}

                        </main>
                    </div>

                    {/* Faixa de Alerta Comunitária / Números de Emergência */}
                    <div className="bg-vibrantLilac border-t-2 border-purple-500 py-2.5 overflow-hidden shadow-inner whitespace-nowrap">
                        <marquee behavior="scroll" direction="left" scrollamount="5" className="font-sans text-xs text-purple-200 font-bold tracking-wide">
                            🛡️ Promovendo ciência cidadã • 1° Edição operacional El Ninõ GACE • Conceitos Mesquita do amanhã e Cidades resilientes (ONU) Grupo Comunitário A Chave da Esperança • Plano de Ação: Todos Unidos, Todos Protegidos • EMERGÊNCIAS: Defesa Civil (199 / 21 4040-1772) • Bombeiros (193) • Alertas ZAP 📲 (21) 97299-3223 • Cras de Rocha Sobrinho 21 2042-8931 • Seja voluntário servir é prevenir sempre +Nupdecs [ Espaço reservado para marketing ] • Participe • "Se o Senhor não guardar a cidade, em vão vigia o sentinela" (Salmos 127:1) • #compartilhe ™ Mesquita RJ 🛡️
                        </marquee>
                    </div>

                    {/* Rodapé com o caractere @ antes de "todos" */}
                    <footer className="bg-petroleumPanel border-t border-sophisticatedViolet/40 py-4 px-4 text-center text-xs font-sans text-softCyan space-y-1 shadow-inner">
                        <div className="font-bold">Defesa Civil Comunitária Cidadão Sensor • SARAH IA NEXUS v5.2 PRO</div>
                        <div className="text-lightLavender/70">Grupo Comunitário A Chave da Esperança • Mesquita/RJ • @todos os direitos reservados 2024–2026</div>
                    </footer>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById("root"));
        root.render(<App />);

        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js').catch(() => {}));
        }
    </script>
</body>
</html>
