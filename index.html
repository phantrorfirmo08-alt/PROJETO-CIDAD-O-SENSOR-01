<!DOCTYPE html>
<html lang="pt-BR" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SARAH AI Core v4.0 - Defesa Civil Mesquita</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        brand: {
                            dark: "#020617",
                            light: "#f8fafc"
                        }
                    }
                }
            }
        };
    </script>
    <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="">
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <meta name="theme-color" content="#020617">
    <style>
        html, body, #root {
            min-height: 100%;
            margin: 0;
        }
        body {
            overflow-x: hidden;
        }
        .leaflet-container {
            z-index: 1;
        }
    </style>
</head>
<body class="min-h-screen bg-slate-950 text-slate-100">
    <div id="root"></div>
    <script type="text/babel">
        const CLOUDFLARE_WORKER_URL = "https://sarah-envelope.phantrorfirmo08.workers.dev/";

        const getBrasiliaGreeting = () => {
            const hour = parseInt(
                new Intl.DateTimeFormat("pt-BR", {
                    timeZone: "America/Sao_Paulo",
                    hour: "numeric",
                    hour12: false
                }).format(new Date()),
                10
            );
            if (hour >= 0 && hour < 5) return "Boa madrugada";
            if (hour >= 5 && hour < 12) return "Bom dia";
            if (hour >= 12 && hour < 18) return "Boa tarde";
            return "Boa noite";
        };

        // Componente do Avatar da SARAH com piscar aleatório (3 a 6 segundos)
        function SarahAvatar({ size = "w-10 h-10", showStatus = true, isLarge = false }) {
            const [isBlinking, setIsBlinking] = React.useState(false);

            React.useEffect(() => {
                let timeoutId;
                const triggerBlink = () => {
                    setIsBlinking(true);
                    setTimeout(() => setIsBlinking(false), 150);

                    const randomTime = Math.floor(Math.random() * (6000 - 3000 + 1)) + 3000;
                    timeoutId = setTimeout(triggerBlink, randomTime);
                };

                const initialTime = Math.floor(Math.random() * (6000 - 3000 + 1)) + 3000;
                timeoutId = setTimeout(triggerBlink, initialTime);

                return () => clearTimeout(timeoutId);
            }, []);

            const dimensionClass = isLarge ? "w-28 h-28" : size;

            return (
                <div className="relative inline-flex items-center justify-center shrink-0">
                    <div className={`${dimensionClass} rounded-full bg-gradient-to-b from-sky-100 to-cyan-200 dark:from-slate-900 dark:to-slate-800 border-2 border-cyan-400 shadow-[0_0_20px_rgba(56,189,248,0.3)] flex flex-col items-center justify-center relative overflow-hidden select-none`}>
                        <svg className="w-3/5 h-3/5 text-cyan-600 dark:text-cyan-400" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <ellipse 
                                cx="20" 
                                cy="24" 
                                rx="4" 
                                ry={isBlinking ? "0.8" : "6"} 
                                fill="currentColor" 
                                className="transition-all duration-75"
                            />
                            <ellipse 
                                cx="44" 
                                cy="24" 
                                rx="4" 
                                ry={isBlinking ? "0.8" : "6"} 
                                fill="currentColor" 
                                className="transition-all duration-75"
                            />
                            <path 
                                d="M 20 38 Q 32 48 44 38" 
                                stroke="currentColor" 
                                strokeWidth="4" 
                                strokeLinecap="round" 
                            />
                        </svg>
                    </div>
                    {showStatus && (
                        <div className={`absolute ${isLarge ? 'bottom-1 right-1 w-4 h-4 border-2' : '-bottom-0.5 right-0.5 w-3 h-3 border'} bg-emerald-500 rounded-full border-slate-950 shadow-md animate-pulse`} title="Sistema Operacional Ativo"></div>
                    )}
                </div>
            );
        }

        function App() {
            const [darkMode, setDarkMode] = React.useState(true);
            const [soundEnabled, setSoundEnabled] = React.useState(true);
            const [isSpeaking, setIsSpeaking] = React.useState(false);
            const [isListening, setIsListening] = React.useState(false);
            const [liveWeather, setLiveWeather] = React.useState(null);
            const [mapOpen, setMapOpen] = React.useState(false);
            const [chartOpen, setChartOpen] = React.useState(false);
            const [termsOpen, setTermsOpen] = React.useState(false);
            
            // Estado do Termo LGPD Inicial Obrigatório
            const [termsAccepted, setTermsAccepted] = React.useState(
                () => localStorage.getItem("sarah_terms_accepted") === "1"
            );
            const [check1, setCheck1] = React.useState(false);
            const [check2, setCheck2] = React.useState(false);

            const [messages, setMessages] = React.useState([]);
            const [input, setInput] = React.useState("");
            const [isLoadingChat, setIsLoadingChat] = React.useState(false);
            const [hasIntroduced, setHasIntroduced] = React.useState(
                () => localStorage.getItem("sarah_introduced") === "1"
            );

            const speechIdRef = React.useRef(0);
            const voiceTimerRef = React.useRef(null);
            const voicesRef = React.useRef([]);
            const mapRef = React.useRef(null);
            const mapInstanceRef = React.useRef(null);
            const chartRef = React.useRef(null);
            const chartInstanceRef = React.useRef(null);

            const carregarVozes = () => {
                if ("speechSynthesis" in window) {
                    voicesRef.current = window.speechSynthesis.getVoices();
                }
            };

            React.useEffect(() => {
                if (!("speechSynthesis" in window)) return;
                carregarVozes();
                window.speechSynthesis.onvoiceschanged = carregarVozes;
                return () => {
                    window.speechSynthesis.cancel();
                    window.speechSynthesis.onvoiceschanged = null;
                };
            }, []);

            const limparTextoParaFala = (text) => {
                return String(text)
                    .replace(/[#*_`~]/g, "")
                    .replace(/\[(.*?)\]\(.*?\)/g, "$1")
                    .replace(/https?:\/\/\S+/g, "")
                    .replace(/\s+/g, " ")
                    .trim();
            };

            const escolherMelhorVoz = () => {
                const voices = voicesRef.current.length
                    ? voicesRef.current
                    : window.speechSynthesis.getVoices();
                const preferidas = [
                    "Google português do Brasil",
                    "Google Português do Brasil",
                    "Microsoft Francisca",
                    "Microsoft Maria"
                ];
                return (
                    voices.find((voice) =>
                        preferidas.some((name) =>
                            voice.name.toLowerCase().includes(name.toLowerCase())
                        )
                    ) ||
                    voices.find((voice) => voice.lang.toLowerCase() === "pt-br") ||
                    voices.find((voice) => voice.lang.toLowerCase().startsWith("pt")) ||
                    voices[0]
                );
            };

            const stopSpeaking = () => {
                speechIdRef.current += 1;
                if (voiceTimerRef.current) {
                    clearTimeout(voiceTimerRef.current);
                    voiceTimerRef.current = null;
                }
                if ("speechSynthesis" in window) {
                    window.speechSynthesis.cancel();
                }
                setIsSpeaking(false);
            };

            const speakText = (text) => {
                if (!soundEnabled || !("speechSynthesis" in window)) return;
                const cleanText = limparTextoParaFala(text);
                if (!cleanText) return;
                stopSpeaking();
                const currentId = speechIdRef.current;
                voiceTimerRef.current = setTimeout(() => {
                    if (currentId !== speechIdRef.current) return;
                    const utterance = new SpeechSynthesisUtterance(cleanText);
                    const voice = escolherMelhorVoz();
                    utterance.lang = "pt-BR";
                    utterance.voice = voice || null;
                    utterance.rate = 0.92;
                    utterance.pitch = 1.02;
                    utterance.volume = 1;
                    utterance.onstart = () => {
                        if (currentId === speechIdRef.current) setIsSpeaking(true);
                    };
                    utterance.onend = () => {
                        if (currentId === speechIdRef.current) setIsSpeaking(false);
                    };
                    utterance.onerror = () => setIsSpeaking(false);
                    window.speechSynthesis.speak(utterance);
                }, 250);
            };

            React.useEffect(() => {
                if (!termsAccepted || hasIntroduced) return;
                const greeting = getBrasiliaGreeting();
                const presentation = `${greeting}, meu nome é Sara, assistente meteorológica do projeto Cidadão Sensor. Em que posso ajudar?`;
                const timer = setTimeout(() => {
                    if (!soundEnabled) return;
                    setHasIntroduced(true);
                    localStorage.setItem("sarah_introduced", "1");
                    speakText(presentation);
                }, 700);
                return () => clearTimeout(timer);
            }, [termsAccepted, hasIntroduced, soundEnabled]);

            const handleShareLink = async () => {
                const shareData = {
                    title: "SARAH AI Core v4.0 - Defesa Civil Mesquita",
                    text: "Monitoramento preventivo da Bacia do Rio Sarapuí.",
                    url: window.location.href
                };
                if (navigator.share) {
                    try {
                        await navigator.share(shareData);
                    } catch (error) {
                        console.log("Compartilhamento cancelado.");
                    }
                } else if (navigator.clipboard) {
                    await navigator.clipboard.writeText(window.location.href);
                    alert("Link copiado para a área de transferência.");
                }
            };

            React.useEffect(() => {
                fetch(
                    "https://api.open-meteo.com/v1/forecast" +
                    "?latitude=-22.7845&longitude=-43.4140" +
                    "&current=temperature_2m,relative_humidity_2m,precipitation,weather_code"
                )
                    .then((response) => response.json())
                    .then((data) => {
                        if (data && data.current) {
                            setLiveWeather(data.current);
                        }
                    })
                    .catch((error) => {
                        console.warn("Clima indisponível:", error);
                    });
            }, []);

            React.useEffect(() => {
                document.documentElement.classList.toggle("dark", darkMode);
                document.documentElement.classList.toggle("light", !darkMode);
            }, [darkMode]);

            React.useEffect(() => {
                if (mapOpen && mapRef.current && !mapInstanceRef.current) {
                    const lat = -22.7845;
                    const lng = -43.4140;
                    const map = L.map(mapRef.current).setView([lat, lng], 16);
                    L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
                        maxZoom: 19,
                        attribution: "© OpenStreetMap contributors | SARAH AI Core v4.0"
                    }).addTo(map);
                    L.marker([lat, lng])
                        .addTo(map)
                        .bindPopup("<b>Setor de referência:</b> Comunidade do Sebinho - Rocha Sobrinho, Mesquita")
                        .openPopup();
                    mapInstanceRef.current = map;
                }
                if (mapOpen && mapInstanceRef.current) {
                    setTimeout(() => {
                        mapInstanceRef.current?.invalidateSize();
                    }, 100);
                }
                if (!mapOpen && mapInstanceRef.current) {
                    mapInstanceRef.current.remove();
                    mapInstanceRef.current = null;
                }
            }, [mapOpen]);

            React.useEffect(() => {
                return () => {
                    if (mapInstanceRef.current) {
                        mapInstanceRef.current.remove();
                        mapInstanceRef.current = null;
                    }
                    if (chartInstanceRef.current) {
                        chartInstanceRef.current.destroy();
                        chartInstanceRef.current = null;
                    }
                };
            }, []);

            React.useEffect(() => {
                if (!chartOpen || !chartRef.current) return;

                if (chartInstanceRef.current) {
                    chartInstanceRef.current.destroy();
                    chartInstanceRef.current = null;
                }

                const ctx = chartRef.current.getContext("2d");

                chartInstanceRef.current = new Chart(ctx, {
                    type: "line",
                    data: {
                        labels: ["00:00", "03:00", "06:00", "09:00", "12:00", "15:00", "18:00", "Atual"],
                        datasets: [
                            {
                                label: "Cota do Rio Sarapuí (m)",
                                data: [
                                    0.8, 0.9, 0.85, 0.92, 1.1, 1.0, 0.95,
                                    liveWeather ? 0.9 + Number(liveWeather.precipitation || 0) * 0.2 : 0.9
                                ],
                                borderColor: "#06b6d4",
                                backgroundColor: "rgba(6, 182, 212, 0.1)",
                                borderWidth: 2,
                                fill: true,
                                tension: 0.3
                            }
                        ]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        scales: {
                            y: {
                                beginAtZero: true,
                                max: 4,
                                grid: { color: "rgba(148, 163, 184, 0.1)" },
                                ticks: { color: "#94a3b8", font: { family: "monospace", size: 10 } }
                            },
                            x: {
                                grid: { color: "rgba(148, 163, 184, 0.1)" },
                                ticks: { color: "#94a3b8", font: { family: "monospace", size: 10 } }
                            }
                        },
                        plugins: {
                            legend: {
                                labels: { color: "#e2e8f0", font: { family: "monospace", size: 11 } }
                            }
                        }
                    }
                });

                return () => {
                    if (chartInstanceRef.current) {
                        chartInstanceRef.current.destroy();
                        chartInstanceRef.current = null;
                    }
                };
            }, [chartOpen, liveWeather]);

            const toggleListening = () => {
                const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
                if (!SpeechRec) {
                    alert("Seu navegador não suporta reconhecimento de voz.");
                    return;
                }
                if (isListening) {
                    setIsListening(false);
                    return;
                }
                const rec = new SpeechRec();
                rec.lang = "pt-BR";
                rec.interimResults = false;
                rec.continuous = false;
                rec.onstart = () => setIsListening(true);
                rec.onresult = (event) => {
                    const text = event.results[0][0].transcript;
                    setInput(text);
                    setIsListening(false);
                    handleSendMessage(text);
                };
                rec.onerror = () => setIsListening(false);
                rec.onend = () => setIsListening(false);
                rec.start();
            };

            const handleSendMessage = async (textCustom) => {
                stopSpeaking();
                const textToSend = textCustom !== undefined ? textCustom : input;
                if (!textToSend.trim() || isLoadingChat) return;

                const userMsg = {
                    id: `${Date.now()}-user`,
                    sender: "user",
                    text: textToSend.trim(),
                    timestamp: new Date().toLocaleTimeString("pt-BR", { hour: "2-digit", minute: "2-digit" })
                };

                const historico = [...messages, userMsg].slice(-8).map((message) => ({
                    role: message.sender === "user" ? "user" : "assistant",
                    content: message.text
                }));

                setMessages((previous) => [...previous, userMsg]);
                setInput("");
                setIsLoadingChat(true);

                const weatherContext = liveWeather
                    ? `Dados meteorológicos atuais para Mesquita/RJ: temperatura ${liveWeather.temperature_2m}°C, umidade ${liveWeather.relative_humidity_2m}%, precipitação ${liveWeather.precipitation} mm.`
                    : "Dados meteorológicos temporariamente indisponíveis.";

                try {
                    const response = await fetch(CLOUDFLARE_WORKER_URL, {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({
                            model: "llama-3.3-70b-versatile",
                            messages: [
                                {
                                    role: "system",
                                    content: `Você é a SARAH AI Core v4.0, assistente de monitoramento preventivo, telemetria, Defesa Civil Comunitária, programas sociais e habitacionais da Bacia do Rio Sarapuí, em Mesquita/RJ. ${weatherContext}

Responda em português do Brasil, de forma clara, objetiva e responsável.
Não invente alertas oficiais, medições ou informações jurídicas.
Não solicite nem revele chaves, senhas ou dados pessoais.
Não mencione nomes de usuários.
Não se reapresente em todas as respostas.
Em situações de risco imediato, oriente o usuário a procurar um local seguro e acionar a Defesa Civil pelo número 199 ou os serviços de emergência locais.`
                                },
                                ...historico
                            ],
                            temperature: 0.6,
                            max_tokens: 900
                        })
                    });

                    const responseText = await response.text();
                    let data;
                    try {
                        data = JSON.parse(responseText);
                    } catch {
                        throw new Error("O Worker retornou uma resposta inválida.");
                    }

                    if (!response.ok) {
                        throw new Error(data?.error || `Erro do servidor (${response.status}).`);
                    }

                    const reply = data?.choices?.[0]?.message?.content || data?.message || data?.reply;
                    if (!reply) {
                        throw new Error("A IA não retornou uma mensagem.");
                    }

                    const assistantMsg = {
                        id: `${Date.now()}-assistant`,
                        sender: "sarah",
                        text: reply,
                        timestamp: new Date().toLocaleTimeString("pt-BR", { hour: "2-digit", minute: "2-digit" })
                    };

                    setMessages((previous) => [...previous, assistantMsg]);
                    speakText(reply);
                } catch (error) {
                    console.error("Erro na comunicação com Cloudflare/Groq:", error);
                    const fallbackReply = "Não foi possível conectar ao agente de inteligência artificial através do cofre seguro. Verifique a conexão.";
                    const errorMsg = {
                        id: `${Date.now()}-error`,
                        sender: "sarah",
                        text: fallbackReply,
                        timestamp: new Date().toLocaleTimeString("pt-BR", { hour: "2-digit", minute: "2-digit" })
                    };
                    setMessages((previous) => [...previous, errorMsg]);
                    speakText(fallbackReply);
                } finally {
                    setIsLoadingChat(false);
                }
            };

            return (
                <div className={`min-h-screen ${darkMode ? "bg-slate-950 text-slate-100" : "bg-slate-100 text-slate-900"} transition-colors duration-300 flex flex-col`}>
                    
                    {/* Modal Inicial de Termos de Responsabilidade e LGPD (Aparece na instalação/abertura) */}
                    {!termsAccepted && (
                        <div className="fixed inset-0 bg-slate-950/90 backdrop-blur-md z-50 flex items-center justify-center p-4">
                            <div className="bg-slate-900 border border-cyan-500/40 w-full max-w-lg rounded-3xl shadow-2xl overflow-hidden flex flex-col max-h-[90vh]">
                                <div className="bg-slate-950 px-6 py-4 border-b border-slate-800 flex items-center justify-between">
                                    <h3 className="font-mono text-cyan-400 text-sm font-bold flex items-center gap-2">
                                        <span>🛡️</span> Termo de Responsabilidade • LGPD
                                    </h3>
                                    <span className="text-xs font-mono text-slate-500">v4.0</span>
                                </div>
                                <div className="p-6 overflow-y-auto space-y-4 text-xs text-slate-300 font-sans leading-relaxed">
                                    <p className="font-mono text-slate-200">
                                        Bem-vindo ao <strong>SARAH AI Core v4.0 - Defesa Civil Mesquita</strong>. Em conformidade com a Lei Federal de Proteção de Dados (LGPD - Lei nº 13.709/2018), este aplicativo opera sob três pilares fundamentais:
                                    </p>
                                    
                                    <div className="space-y-3 bg-slate-950/60 p-4 rounded-xl border border-slate-800 font-mono">
                                        <div>
                                            <span className="text-cyan-400 font-bold">1. Transparência e Tratamento Local:</span> O sistema prioriza o armazenamento e salvaguarda segura em ambiente local (Edge-First), garantindo privacidade nas interações.
                                        </div>
                                        <div>
                                            <span className="text-cyan-400 font-bold">2. Finalidade Comunitária:</span> Os dados são processados estritamente para suporte preventivo, telemetria da Bacia do Rio Sarapuí e Defesa Civil (Rocha Sobrinho / Sebinho).
                                        </div>
                                        <div>
                                            <span className="text-cyan-400 font-bold">3. Segurança e Salvaguarda:</span> Observância rigorosa aos princípios legais de proteção, vedando o uso indevido de informações pessoais dos titulares.
                                        </div>
                                    </div>

                                    {/* Quadradinhos pequenos de aceite obrigatório */}
                                    <div className="space-y-2.5 pt-2 border-t border-slate-800">
                                        <label className="flex items-start gap-2.5 cursor-pointer">
                                            <input 
                                                type="checkbox" 
                                                checked={check1} 
                                                onChange={(e) => setCheck1(e.target.checked)}
                                                className="mt-0.5 w-4 h-4 rounded border-slate-700 bg-slate-950 text-cyan-500 focus:ring-cyan-500 shrink-0" 
                                            />
                                            <span className="text-[11px] text-slate-300">
                                                Compreendi e concordo com os três pilares de proteção de dados e diretrizes da LGPD aplicados ao sistema.
                                            </span>
                                        </label>
                                        <label className="flex items-start gap-2.5 cursor-pointer">
                                            <input 
                                                type="checkbox" 
                                                checked={check2} 
                                                onChange={(e) => setCheck2(e.target.checked)}
                                                className="mt-0.5 w-4 h-4 rounded border-slate-700 bg-slate-950 text-cyan-500 focus:ring-cyan-500 shrink-0" 
                                            />
                                            <span className="text-[11px] text-slate-300">
                                                Autorizo o uso das ferramentas de monitoramento preventivo e geolocalização para fins estritamente comunitários.
                                            </span>
                                        </label>
                                    </div>
                                </div>
                                <div className="bg-slate-950 px-6 py-4 border-t border-slate-800 flex justify-end">
                                    <button
                                        disabled={!check1 || !check2}
                                        onClick={() => {
                                            setTermsAccepted(true);
                                            localStorage.setItem("sarah_terms_accepted", "1");
                                        }}
                                        className="w-full py-3 bg-cyan-500 hover:bg-cyan-400 text-slate-950 font-mono text-xs font-bold rounded-xl transition disabled:opacity-40 disabled:cursor-not-allowed shadow-lg"
                                    >
                                        Aceitar e Acessar SARAH AI
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                    <div className="flex-1 flex flex-col">
                        
                        {/* Cabeçalho Oficial (Idêntico ao Print) */}
                        <header className="bg-white dark:bg-slate-900 border-b border-slate-200 dark:border-slate-800 px-4 py-3 sticky top-0 z-40 shadow-sm">
                            <div className="max-w-4xl mx-auto flex items-center justify-between gap-2">
                                <div className="flex items-center gap-3">
                                    <div className="w-10 h-10 rounded-xl bg-cyan-500/10 border border-cyan-500/20 flex items-center justify-center text-cyan-600 dark:text-cyan-400 text-lg shadow-sm">
                                        🛡️
                                    </div>
                                    <div>
                                        <h1 className="text-sm font-bold text-slate-900 dark:text-slate-100 font-sans tracking-tight">
                                            Projeto Cidadão Sensor
                                        </h1>
                                        <div className="flex items-center gap-1.5 flex-wrap mt-0.5">
                                            <span className="px-1.5 py-0.5 bg-cyan-50 dark:bg-cyan-950/60 border border-cyan-200 dark:border-cyan-500/30 text-cyan-700 dark:text-cyan-300 rounded font-mono text-[10px] font-bold">
                                                SARAH AI
                                            </span>
                                            <span className="text-[11px] text-slate-500 dark:text-slate-400 font-mono">
                                                Mesquita - RJ • Sebinho / Rua Amazonas
                                            </span>
                                        </div>
                                    </div>
                                </div>

                                <div className="flex items-center gap-2">
                                    <button
                                        onClick={handleShareLink}
                                        className="w-9 h-9 rounded-full bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 border border-slate-200 dark:border-slate-700 flex items-center justify-center text-slate-700 dark:text-slate-300 transition shadow-sm"
                                        title="Compartilhar"
                                    >
                                        <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                                            <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M8.684 13.342C8.886 12.938 9 12.482 9 12c0-.482-.114-.938-.316-1.342m0 2.684a3 3 0 110-2.684m0 2.684l6.632 3.316m-6.632-6l6.632-3.316m0 0a3 3 0 105.367-2.684 3.316 3.316 0 00-5.367 2.684zm0 9.316a3 3 0 105.368 2.684 3.316 3.316 0 00-5.368-2.684z"></path>
                                        </svg>
                                    </button>

                                    <button
                                        onClick={() => alert("Cofre de segurança ativo via Cloudflare Worker (Chave protegida no servidor).")}
                                        className="w-9 h-9 rounded-full bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 border border-slate-200 dark:border-slate-700 flex items-center justify-center text-amber-500 transition shadow-sm"
                                        title="Cofre de Segurança"
                                    >
                                        🔑
                                    </button>

                                    <button
                                        onClick={() => setDarkMode((val) => !val)}
                                        className="w-9 h-9 rounded-full bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 border border-slate-200 dark:border-slate-700 flex items-center justify-center text-amber-500 dark:text-cyan-400 transition shadow-sm"
                                        title="Alternar Modo Dia / Noite"
                                    >
                                        {darkMode ? "☀️" : "🌙"}
                                    </button>
                                </div>
                            </div>
                        </header>

                        {/* Barra de Status Secundária */}
                        <div className="bg-slate-900/60 border-b border-slate-800 px-4 py-2 text-xs font-mono text-slate-400 flex flex-wrap items-center justify-between gap-2 max-w-4xl mx-auto w-full">
                            <div className="flex items-center gap-3">
                                <span className="flex items-center gap-1 text-cyan-400">
                                    <span className="w-2 h-2 rounded-full bg-cyan-400 animate-pulse"></span>
                                    Internet (Open-Meteo) • Sebinho / Mesquita
                                </span>
                                {liveWeather && (
                                    <span className="hidden sm:inline text-slate-300">
                                        🌡️ {liveWeather.temperature_2m}°C | 💧 {liveWeather.relative_humidity_2m}% | 🌧️ {liveWeather.precipitation} mm
                                    </span>
                                )}
                            </div>

                            <div className="flex items-center gap-3">
                                <button
                                    onClick={isSpeaking ? stopSpeaking : () => setSoundEnabled((value) => !value)}
                                    className={`px-2.5 py-1 rounded text-xs font-mono border ${
                                        isSpeaking
                                            ? "bg-amber-500/20 text-amber-300 border-amber-500/40 animate-pulse"
                                            : soundEnabled
                                            ? "bg-cyan-500/20 text-cyan-400 border-cyan-500/30"
                                            : "bg-slate-800 text-slate-500 border-slate-700"
                                    }`}
                                >
                                    {isSpeaking ? "⏹ Parar fala" : soundEnabled ? "🔊 Voz ativa" : "🔇 Voz desligada"}
                                </button>
                                <button
                                    onClick={() => setTermsOpen(true)}
                                    className="text-cyan-400 hover:underline text-[11px]"
                                >
                                    Termos LGPD
                                </button>
                            </div>
                        </div>

                        {/* Corpo Principal do Chat */}
                        <main className="max-w-4xl mx-auto p-3 sm:p-4 w-full flex-1 flex flex-col">
                            <div
                                className="bg-slate-900/80 border border-cyan-500/30 rounded-xl shadow-xl flex flex-col overflow-hidden backdrop-blur-md flex-1"
                                style={{ minHeight: "450px" }}
                            >
                                <div className="flex-1 overflow-y-auto p-4 space-y-4">
                                    {messages.length === 0 && (
                                        <div className="h-full flex flex-col items-center justify-center p-4 my-auto">
                                            <div className="w-full max-w-md bg-slate-900/90 border border-cyan-500/30 rounded-3xl p-6 shadow-2xl flex flex-col items-center text-center backdrop-blur-md">
                                                
                                                <div className="relative mb-4">
                                                    <SarahAvatar showStatus={true} isLarge={true} />
                                                </div>

                                                <h2 className="font-mono text-lg font-bold text-slate-100 tracking-wide mb-2">
                                                    SARAH • Sebinho AI
                                                </h2>

                                                <div className="px-4 py-1.5 bg-cyan-950/60 border border-cyan-500/40 rounded-full text-cyan-300 font-mono text-xs mb-6 shadow-inner">
                                                    Monitoramento ativo na Rua Amazonas / Sebinho.
                                                </div>

                                                <div className="w-full space-y-2 text-xs font-mono border-t border-slate-800 pt-4 mb-6 text-slate-300">
                                                    <div className="flex justify-between px-2">
                                                        <span className="text-slate-400">Modelo Neural:</span>
                                                        <span className="text-cyan-400 font-bold">Llama 3.3 (Groq)</span>
                                                    </div>
                                                    <div className="flex justify-between px-2">
                                                        <span className="text-slate-400">Setor Crítico:</span>
                                                        <span className="text-slate-200">Rocha Sobrinho</span>
                                                    </div>
                                                </div>

                                                <div className="w-full space-y-2.5">
                                                    <div className="text-left font-mono text-xs text-cyan-400 font-semibold mb-1 flex items-center gap-1.5">
                                                        <span>⚡</span> Ferramentas de Monitoramento
                                                    </div>
                                                    <button 
                                                        onClick={() => setMapOpen(true)}
                                                        className="w-full py-2.5 px-4 bg-cyan-500/10 hover:bg-cyan-500/20 border border-cyan-500/30 text-cyan-300 rounded-xl text-xs font-mono transition flex items-center justify-center gap-2"
                                                    >
                                                        <span>🗺️</span> Abrir Mapa de Risco (Sebinho)
                                                    </button>
                                                    <button 
                                                        onClick={() => setChartOpen(true)}
                                                        className="w-full py-2.5 px-4 bg-cyan-500/10 hover:bg-cyan-500/20 border border-cyan-500/30 text-cyan-300 rounded-xl text-xs font-mono transition flex items-center justify-center gap-2"
                                                    >
                                                        <span>📈</span> Abrir Gráfico do Rio Sarapuí
                                                    </button>
                                                </div>

                                            </div>
                                        </div>
                                    )}

                                    {messages.map((message) => (
                                        <div
                                            key={message.id}
                                            className={`flex items-start gap-3 ${
                                                message.sender === "user" ? "flex-row-reverse" : "flex-row"
                                            }`}
                                        >
                                            {message.sender === "user" ? (
                                                <div className="w-9 h-9 rounded-xl flex items-center justify-center shrink-0 shadow-md bg-slate-700 text-cyan-300">
                                                    👤
                                                </div>
                                            ) : (
                                                <SarahAvatar size="w-9 h-9" showStatus={false} />
                                            )}

                                            <div
                                                className={`p-3.5 rounded-2xl max-w-[85%] leading-relaxed shadow-md font-sans ${
                                                    message.sender === "user"
                                                        ? "bg-cyan-600 text-white rounded-tr-none"
                                                        : "bg-slate-800/90 text-slate-100 border border-slate-700/60 rounded-tl-none"
                                                }`}
                                            >
                                                <div className="flex items-center justify-between gap-4 mb-1 text-[10px] opacity-75 font-mono">
                                                    <span>{message.sender === "user" ? "Você" : "SARAH AI • Defesa Civil"}</span>
                                                    <span>{message.timestamp}</span>
                                                </div>
                                                <div className="whitespace-pre-wrap break-words">
                                                    {message.text}
                                                </div>
                                            </div>
                                        </div>
                                    ))}

                                    {isLoadingChat && (
                                        <div className="flex items-center gap-3">
                                            <SarahAvatar size="w-9 h-9" showStatus={false} />
                                            <div className="bg-slate-800 p-3 rounded-2xl text-xs font-mono text-cyan-400 animate-pulse border border-cyan-500/30">
                                                SARAH está processando...
                                            </div>
                                        </div>
                                    )}
                                </div>

                                {/* Barra de Comando Avançada (Idêntico ao Print 2) */}
                                <div className="p-3 bg-slate-950/95 border-t border-slate-800">
                                    <div className="w-full bg-slate-950 border border-cyan-500/30 rounded-3xl p-3 shadow-2xl backdrop-blur-md flex flex-col gap-2 font-mono">
                                        <div className="flex items-center justify-between px-2 text-[10px] text-cyan-400">
                                            <span className="flex items-center gap-1.5 bg-cyan-950/80 px-2 py-0.5 rounded-full border border-cyan-500/30">
                                                <span className="w-1.5 h-1.5 rounded-full bg-cyan-400 animate-pulse"></span>
                                                SARAH AI • Live Voice
                                            </span>
                                            <span className="text-slate-500">VOICE MODE • LIVE • 48kHz</span>
                                        </div>

                                        <div className="flex items-center gap-3 bg-slate-900/90 border border-slate-800 rounded-2xl p-2 relative overflow-hidden">
                                            <button
                                                onClick={toggleListening}
                                                className={`w-12 h-12 rounded-full flex items-center justify-center shrink-0 transition shadow-lg ${
                                                    isListening
                                                        ? "bg-cyan-500 text-slate-950 border-2 border-cyan-300 animate-pulse shadow-[0_0_20px_rgba(6,182,212,0.6)]"
                                                        : "bg-slate-950 hover:bg-slate-800 text-cyan-400 border border-cyan-500/30"
                                                }`}
                                                title="Ativar Microfone / Modo Voz"
                                            >
                                                🎤
                                            </button>

                                            <div className="flex-1 flex flex-col justify-center relative">
                                                <input
                                                    type="text"
                                                    value={input}
                                                    onChange={(event) => setInput(event.target.value)}
                                                    onKeyDown={(event) => {
                                                        if (event.key === "Enter") handleSendMessage();
                                                    }}
                                                    placeholder="Fale ou digite sua mensagem..."
                                                    className="w-full bg-transparent text-slate-100 text-sm font-sans focus:outline-none placeholder-slate-500 px-1"
                                                />
                                                
                                                <div className="flex items-center gap-1 px-1 mt-1 h-3">
                                                    {[45, 80, 30, 90, 60, 40, 100, 70, 50, 85, 40, 95, 60, 30, 75, 50, 90, 40, 65, 30].map((height, i) => (
                                                        <div
                                                            key={i}
                                                            className={`w-1 rounded-full transition-all duration-150 ${
                                                                isListening || isSpeaking
                                                                    ? "bg-cyan-400 animate-pulse"
                                                                    : "bg-slate-700 opacity-50"
                                                            }`}
                                                            style={{ height: `${isListening || isSpeaking ? Math.max(20, Math.random() * 100) : height * 0.3}%` }}
                                                        ></div>
                                                    ))}
                                                </div>
                                            </div>

                                            <button
                                                onClick={() => handleSendMessage()}
                                                disabled={isLoadingChat || !input.trim()}
                                                className="w-11 h-11 rounded-full bg-cyan-500 hover:bg-cyan-400 text-slate-950 flex items-center justify-center transition shadow-lg shrink-0 disabled:opacity-40 disabled:cursor-not-allowed"
                                                title="Enviar Mensagem"
                                            >
                                                <svg className="w-5 h-5 translate-x-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                                                    <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2.5" d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z"></path>
                                                </svg>
                                            </button>
                                        </div>

                                        <div className="flex items-center justify-between px-2 text-[11px] text-slate-400">
                                            <div className="flex items-center gap-3">
                                                <button onClick={() => alert("Função de anexar arquivo em breve.")} className="hover:text-cyan-400 transition flex items-center gap-1">
                                                    📎 Attach
                                                </button>
                                                <button onClick={() => alert("Ferramentas de Defesa Civil ativas.")} className="hover:text-cyan-400 transition flex items-center gap-1">
                                                    ✨ Tools
                                                </button>
                                            </div>
                                            <span>SARAH Core v4.0</span>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </main>
                    </div>

                    {/* Modal do Mapa */}
                    {mapOpen && (
                        <div className="fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-50 flex items-center justify-center p-4">
                            <div className="bg-slate-900 border border-cyan-500/40 w-full max-w-2xl rounded-2xl shadow-2xl overflow-hidden">
                                <div className="bg-slate-950 px-4 py-3 border-b border-slate-800 flex justify-between items-center">
                                    <h3 className="font-mono text-cyan-400 text-sm font-bold">
                                        🗺️ Monitoramento Geográfico • Sebinho
                                    </h3>
                                    <button
                                        onClick={() => setMapOpen(false)}
                                        className="text-slate-400 hover:text-white font-mono text-sm px-2 py-1 rounded bg-slate-800"
                                    >
                                        ✕ Fechar
                                    </button>
                                </div>
                                <div className="p-4 bg-slate-900">
                                    <div ref={mapRef} className="w-full h-80 rounded-xl border border-cyan-500/30"></div>
                                    <p className="text-xs text-slate-400 font-mono mt-3">
                                        📍 Coordenadas de referência: -22.7845, -43.4140.
                                    </p>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* Modal do Gráfico */}
                    {chartOpen && (
                        <div className="fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-50 flex items-center justify-center p-4">
                            <div className="bg-slate-900 border border-cyan-500/40 w-full max-w-2xl rounded-2xl shadow-2xl overflow-hidden">
                                <div className="bg-slate-950 px-4 py-3 border-b border-slate-800 flex justify-between items-center">
                                    <h3 className="font-mono text-cyan-400 text-sm font-bold">
                                        📈 Telemetria do Rio Sarapuí
                                    </h3>
                                    <button
                                        onClick={() => setChartOpen(false)}
                                        className="text-slate-400 hover:text-white font-mono text-sm px-2 py-1 rounded bg-slate-800"
                                    >
                                        ✕ Fechar
                                    </button>
                                </div>
                                <div className="p-4 bg-slate-900">
                                    <div className="w-full h-72">
                                        <canvas ref={chartRef}></canvas>
                                    </div>
                                    <p className="text-xs text-slate-400 font-mono mt-3">
                                        📊 Dados meteorológicos e simulação preventiva.
                                    </p>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* Modal de Termos LGPD Detalhado */}
                    {termsOpen && (
                        <div className="fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-50 flex items-center justify-center p-4">
                            <div className="bg-slate-900 border border-cyan-500/40 w-full max-w-xl rounded-2xl shadow-2xl overflow-hidden">
                                <div className="bg-slate-950 px-4 py-3 border-b border-slate-800 flex justify-between items-center">
                                    <h3 className="font-mono text-cyan-400 text-sm font-bold">
                                        ⚖️ Conformidade LGPD & Termos
                                    </h3>
                                    <button
                                        onClick={() => setTermsOpen(false)}
                                        className="text-slate-400 hover:text-white font-mono text-sm px-2 py-1 rounded bg-slate-800"
                                    >
                                        ✕ Fechar
                                    </button>
                                </div>
                                <div className="p-5 bg-slate-900 text-xs text-slate-300 space-y-3 leading-relaxed font-sans">
                                    <p>
                                        <strong>SARAH AI Core v4.0</strong> opera sob os preceitos da Lei Federal de Proteção de Dados (LGPD - Lei nº 13.709/2018), assegurando a total privacidade dos registros locais e comunitários na Bacia do Rio Sarapuí.
                                    </p>
                                    <p>
                                        As diretrizes visam o suporte preventivo de Defesa Civil em Mesquita/RJ, sem armazenamento centralizado de dados sensíveis dos usuários.
                                    </p>
                                    <p>
                                        Em caso de emergência real, acione imediatamente a Defesa Civil pelo número 199.
                                    </p>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* Rodapé Oficial Atualizado */}
                    <footer className="bg-slate-950 border-t border-slate-900 py-4 px-4 text-center text-xs font-mono text-slate-400 space-y-1">
                        <div>Todos os direitos reservados 2024–2028 Grupo a Chave da Esperança Sebinho Mesquita RJ</div>
                        <div className="text-cyan-400 font-bold">Defesa Civil Comunitária Digital</div>
                    </footer>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById("root"));
        root.render(<App />);
    </script>
</body>
</html>
