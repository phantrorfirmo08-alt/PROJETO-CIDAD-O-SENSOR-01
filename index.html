<!DOCTYPE html>
<html lang="pt-BR" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>CHAVE CLIMÁTICA • SARA NEXUS v8.4.2</title>

    <link rel="manifest" href="./manifest.json?v=8.4.2">
    <meta name="theme-color" content="#02040A">
    <meta property="og:title" content="CHAVE CLIMÁTICA • SARA NEXUS v8.4.2">
    <meta property="og:description" content="Monitoramento Climático Integrado, Bacias e Encostas • SARA NEXUS v8.4.2 • Licença Cibernética Ativa.">
    <meta property="og:type" content="website">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Orbitron:wght@600;800;900&family=JetBrains+Mono:wght@400;600;800&display=swap" rel="stylesheet">

    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        @keyframes tickerScroll {
          0% { transform: translateX(0); }
          100% { transform: translateX(-50%); }
        }
        @keyframes cyberPulse {
          0%, 100% { opacity: 1; transform: scale(1); filter: drop-shadow(0 0 15px rgba(0,242,254,0.6)); }
          50% { opacity: 0.7; transform: scale(1.02); filter: drop-shadow(0 0 30px rgba(16,185,129,0.9)); }
        }
        @keyframes matrixGlitch {
          0% { text-shadow: 0 0 5px #00F2FE, 0 0 10px #00F2FE, 0 0 20px #10B981; }
          100% { text-shadow: 0 0 10px #FFFFFF, 0 0 20px #00F2FE, 0 0 40px #10B981; }
        }

        html, body, #root {
            min-height: 100%;
            margin: 0;
            font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
            background-color: #02040A;
            color: #FFFFFF;
            overflow-x: hidden;
            -webkit-user-select: none;
            user-select: none;
            overscroll-behavior-y: none;
        }

        body {
            background-image: 
                radial-gradient(circle at 50% 0%, rgba(0, 242, 254, 0.12) 0%, transparent 60%),
                radial-gradient(circle at 10% 90%, rgba(16, 185, 129, 0.08) 0%, transparent 50%);
        }

        .cyber-card {
            background: linear-gradient(135deg, rgba(13, 21, 45, 0.95) 0%, rgba(6, 11, 24, 0.98) 100%);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(0, 242, 254, 0.35);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.7), inset 0 1px 0 rgba(255, 255, 255, 0.1);
        }

        .cyber-border-glow {
            position: relative;
            border: 1px solid transparent;
            background: 
                linear-gradient(135deg, rgba(6,11,24,0.95), rgba(13,21,45,0.95)) padding-box,
                linear-gradient(135deg, #00F2FE, #4FACFE, #10B981) border-box;
        }

        .cyber-button {
            background: linear-gradient(135deg, #FF9900 0%, #F59E0B 100%);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            color: #02040A !important;
            font-weight: 800;
        }
        .cyber-button:hover {
            box-shadow: 0 0 30px rgba(255, 153, 0, 0.7);
            transform: translateY(-2px);
        }

        .hud-grid {
            background-image: linear-gradient(rgba(0, 242, 254, 0.04) 1px, transparent 1px),
                              linear-gradient(90deg, rgba(0, 242, 254, 0.04) 1px, transparent 1px);
            background-size: 24px 24px;
        }

        ::-webkit-scrollbar { width: 5px; height: 5px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(0,242,254,0.4); border-radius: 9999px; }
    </style>
</head>
<body class="hud-grid pb-10">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;

        const APP_SHARE_URL = "https://phantrorfirmo08-alt.github.io/PROJETO-CIDAD-O-SENSOR-01/";
        const CLOUDFLARE_WORKER_URL = "https://sarah-envelope.phantrorfirmo08.workers.dev/";

        // Ícone Cibernético Padronizado via SVG (Escalável e Nativo)
        function CyberLogoSvg({ className = "w-12 h-12" }) {
            return (
                <svg className={className} viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <defs>
                        <linearGradient id="cyberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                            <stop offset="0%" stop-color="#00F2FE" />
                            <stop offset="50%" stop-color="#4FACFE" />
                            <stop offset="100%" stop-color="#10B981" />
                        </linearGradient>
                        <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
                            <feGaussianBlur stdDeviation="4" result="blur" />
                            <feComposite in="SourceGraphic" in2="blur" operator="over" />
                        </filter>
                    </defs>
                    <polygon points="50,5 95,27 95,73 50,95 5,73 5,27" fill="#060B18" stroke="url(#cyberGrad)" stroke-width="4" filter="url(#glow)" />
                    <circle cx="50" cy="50" r="28" fill="#02040A" stroke="#00F2FE" stroke-width="2" />
                    <circle cx="50" cy="50" r="18" fill="url(#cyberGrad)" opacity="0.3" />
                    <path d="M35 50 L45 60 L65 38" stroke="#10B981" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />
                    <circle cx="50" cy="50" r="3" fill="#FFFFFF" />
                </svg>
            );
        }

        function App() {
            const [activeTab, setActiveTab] = useState("dashboard");
            const [toast, setToast] = useState(null);
            const [soundActive, setSoundActive] = useState(true);
            const [isSpeaking, setIsSpeaking] = useState(false);
            const [weather, setWeather] = useState({ temp: "--", humidity: "--", rain: "--", status: "Conectando Telemetria...", color: "#00F2FE" });
            
            // SARA NEXUS v8.4.2 State
            const [chatInput, setChatInput] = useState("");
            const [chatHistory, setChatHistory] = useState([
                { role: "assistant", text: "SARA NEXUS v8.4.2 online. Licença Cibernética ativada. Central de monitoramento comunitário e bacias operando com organismo vivo ativado." }
            ]);
            const [isProcessing, setIsProcessing] = useState(false);

            const showToast = (msg) => {
                setToast(msg);
                setTimeout(() => setToast(null), 3500);
            };

            // Sintetizador de Voz e Áudio Cibernético
            const speakSara = (text) => {
                if (!soundActive || !("speechSynthesis" in window)) return;
                window.speechSynthesis.cancel();
                const clean = text.replace(/[*#_]/g, '');
                const utterance = new SpeechSynthesisUtterance(clean);
                utterance.lang = "pt-BR";
                utterance.rate = 1.05;
                utterance.onstart = () => setIsSpeaking(true);
                utterance.onend = () => setIsSpeaking(false);
                utterance.onerror = () => setIsSpeaking(false);
                window.speechSynthesis.speak(utterance);
            };

            // Organismo Vivo: Atualização Automática de Clima (Open-Meteo API)
            useEffect(() => {
                const fetchTelemetry = async () => {
                    try {
                        const res = await fetch('https://api.open-meteo.com/v1/forecast?latitude=-22.7831&longitude=-43.4294&current=temperature_2m,relative_humidity_2m,precipitation&timezone=America/Sao_Paulo');
                        const data = await res.json();
                        if (data?.current) {
                            const { temperature_2m: t, relative_humidity_2m: h, precipitation: p } = data.current;
                            setWeather({
                                temp: `${t}°C`,
                                humidity: `${h}%`,
                                rain: `${p} mm`,
                                status: p > 5 ? "⚠️ ALERTA DE CHUVAS" : p > 0.5 ? "🌦️ Chuva Moderada" : "🟢 Estável / Monitorado",
                                color: p > 5 ? "#F43F5E" : p > 0.5 ? "#00F2FE" : "#10B981"
                            });
                        }
                    } catch (e) {
                        setWeather({ temp: "26°C", humidity: "78%", rain: "0 mm", status: "🟢 Rede Comunitária Ativa", color: "#10B981" });
                    }
                };
                fetchTelemetry();
                const interval = setInterval(fetchTelemetry, 300000);
                return () => clearInterval(interval);
            }, []);

            const handleShareApp = async () => {
                const shareText = `CHAVE CLIMÁTICA • SARA NEXUS v8.4.2\nMonitoramento de Bacias, Encostas e Comunidade • Licença Cibernética Ativa 🛡️\n\nAcesse o app:\n${APP_SHARE_URL}`;
                if (navigator.share) {
                    try {
                        await navigator.share({ title: "SARA NEXUS v8.4.2", text: shareText, url: APP_SHARE_URL });
                        showToast("✅ Compartilhado com sucesso!");
                        return;
                    } catch (e) { if (e.name === 'AbortError') return; }
                }
                navigator.clipboard.writeText(shareText);
                showToast("📋 Link e ícone copiados para a área de transferência!");
            };

            const handleSendMessage = async (e) => {
                e.preventDefault();
                if (!chatInput.trim() || isProcessing) return;

                const userMsg = chatInput.trim();
                setChatInput("");
                setChatHistory(prev => [...prev, { role: "user", text: userMsg }]);
                setIsProcessing(true);

                try {
                    const response = await fetch(CLOUDFLARE_WORKER_URL, {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({
                            model: "openai/gpt-oss-120b",
                            messages: [
                                { role: "system", content: "Você é SARA NEXUS v8.4.2, uma inteligência artificial cibernética avançada operando na Chave Climática em Rocha Sobrinho, Mesquita, RJ. Responda com foco em resiliência, bacias, encostas e apoio comunitário." },
                                { role: "user", content: userMsg }
                            ],
                            temperature: 0.5,
                            max_tokens: 300
                        })
                    });
                    const data = await response.json();
                    let reply = data?.choices?.[0]?.message?.content || data?.message || "SARA NEXUS v8.4.2 operando em frequência normal de monitoramento.";
                    reply = reply.replace(/[*#]/g, '');

                    setChatHistory(prev => [...prev, { role: "assistant", text: reply }]);
                    speakSara(reply);
                } catch (err) {
                    const fallback = "SARA NEXus v8.4.2: Telemetria e bacias sob vigilância constante. Como posso auxiliar na sua comunidade hoje?";
                    setChatHistory(prev => [...prev, { role: "assistant", text: fallback }]);
                    speakSara(fallback);
                } finally {
                    setIsProcessing(false);
                }
            };

            return (
                <div className="min-h-screen flex flex-col relative text-slate-100">
                    {/* TOAST NOTIFICATION */}
                    {toast && (
                        <div className="fixed top-20 left-1/2 -translate-x-1/2 z-50 cyber-card px-6 py-3 rounded-2xl font-display text-xs font-black text-cyan-400 tracking-wider shadow-2xl border border-cyan-400/50 animate-bounce">
                            {toast}
                        </div>
                    )}

                    {/* CABEÇALHO CIBERNÉTICO */}
                    <header className="cyber-card sticky top-0 z-30 px-4 sm:px-6 py-3.5 border-b border-cyan-500/30 flex items-center justify-between shadow-2xl">
                        <div className="flex items-center gap-3">
                            <div className="w-11 h-11 rounded-2xl cyber-border-glow flex items-center justify-center bg-void shadow-[0_0_25px_rgba(0,242,254,0.5)]">
                                <CyberLogoSvg className="w-8 h-8 animate-pulse" />
                            </div>
                            <div>
                                <h1 className="font-display text-xs sm:text-sm font-black text-white tracking-[0.15em]" style={{ animation: 'matrixGlitch 3s infinite alternate' }}>
                                    CHAVE CLIMÁTICA
                                </h1>
                                <p className="text-[9px] text-emerald-400 font-mono font-bold tracking-wider">
                                    SARA NEXUS v8.4.2 • LICENÇA CIBERNÉTICA
                                </p>
                            </div>
                        </div>

                        <div className="flex items-center gap-2">
                            <button onClick={() => setSoundActive(!soundActive)} className={`w-9 h-9 rounded-xl border flex items-center justify-center cursor-pointer transition ${soundActive ? 'bg-cyan-500/20 border-cyan-400 text-cyan-400 shadow-[0_0_15px_rgba(0,242,254,0.5)]' : 'bg-slate-900 border-slate-700 text-slate-500'}`} title="Áudio da SARA">
                                🔊
                            </button>
                            <button onClick={handleShareApp} className="px-3.5 py-2 rounded-xl cyber-button text-xs font-black tracking-wider shadow-md cursor-pointer flex items-center gap-1.5">
                                <span>🔗 Compartilhar</span>
                            </button>
                        </div>
                    </header>

                    {/* NAVEGAÇÃO DE ABAS */}
                    <nav className="cyber-card border-b border-cyan-500/30 px-4 py-2.5 flex items-center justify-center gap-2 overflow-x-auto z-20">
                        {[
                            { id: 'dashboard', label: '🛡️ Painel Principal' },
                            { id: 'sara', label: '🤖 SARA NEXUS AI' },
                            { id: 'bacias', label: '🌊 Bacias & Encostas' },
                            { id: 'radar', label: '🛰️ Radar 24h' }
                        ].map(tab => (
                            <button key={tab.id} onClick={() => setActiveTab(tab.id)}
                                className={`px-4 py-2 rounded-2xl text-xs font-black transition cursor-pointer tracking-wider shrink-0 ${
                                    activeTab === tab.id
                                        ? 'cyber-button shadow-[0_0_20px_rgba(255,153,0,0.6)]'
                                        : 'bg-slate-900/80 text-slate-300 border border-cyan-500/20 hover:border-cyan-400'
                                }`}>
                                {tab.label}
                            </button>
                        ))}
                    </nav>

                    {/* CORPO PRINCIPAL */}
                    <main className="flex-1 max-w-3xl w-full mx-auto p-4 sm:p-6 space-y-5 pb-24 relative z-10">
                        {activeTab === 'dashboard' && (
                            <div className="space-y-5">
                                <div className="cyber-card p-6 sm:p-8 rounded-[36px] shadow-[0_0_60px_rgba(0,242,254,0.35)] space-y-6 text-center border-2 border-cyan-500/70">
                                    <div className="w-28 h-28 mx-auto rounded-full cyber-border-glow flex items-center justify-center bg-void shadow-[0_0_40px_rgba(0,242,254,0.6)]">
                                        <CyberLogoSvg className="w-16 h-16 animate-spin" style={{ animationDuration: '15s' }} />
                                    </div>

                                    <div className="space-y-2">
                                        <div className="inline-flex items-center px-4 py-1.5 rounded-full bg-cyan-500/15 border border-cyan-400/40 font-mono text-[10px] text-cyan-300 tracking-widest">
                                            ORGANISMO VIVO • LICENÇA CIBERNÉTICA ATIVA
                                        </div>
                                        <h2 className="font-display text-lg font-black text-white tracking-wide">
                                            SARA NEXUS v8.4.2 • CENTRAL COMUNITÁRIA
                                        </h2>
                                        <p className="text-xs text-slate-300 font-medium leading-relaxed">
                                            Plataforma autônoma de mitigação de riscos, monitoramento de bacias (Rio Sarapuí / Dona Eugênia) e proteção civil para Rocha Sobrinho e Mesquita - RJ.
                                        </p>
                                    </div>

                                    {/* PAINEL DE TELEMETRIA AO VIVO */}
                                    <div className="grid grid-cols-2 sm:grid-cols-4 gap-3">
                                        {[
                                            { l: 'TEMPERATURA', v: weather.temp, c: '#00F2FE' },
                                            { l: 'UMIDADE', v: weather.humidity, c: '#10B981' },
                                            { l: 'PRECIPITAÇÃO', v: weather.rain, c: '#4FACFE' },
                                            { l: 'STATUS', v: weather.status, c: weather.color }
                                        ].map((item, idx) => (
                                            <div key={idx} className="bg-void/90 border border-cyan-500/30 rounded-2xl p-3 text-center shadow-inner">
                                                <div className="text-[9px] text-slate-400 font-black tracking-widest font-display">{item.l}</div>
                                                <div className="text-xs font-mono font-black mt-1 truncate" style={{ color: item.c, textShadow: `0 0 10px ${item.c}66` }}>{item.v}</div>
                                            </div>
                                        ))}
                                    </div>

                                    <button onClick={() => setActiveTab('sara')} className="w-full py-4 cyber-button font-display font-black text-xs uppercase tracking-[0.2em] rounded-2xl shadow-xl cursor-pointer">
                                        🤖 Conversar com SARA NEXUS AI
                                    </button>
                                </div>
                            </div>
                        )}

                        {activeTab === 'sara' && (
                            <div className="cyber-card rounded-[36px] p-6 space-y-4 shadow-2xl border border-cyan-500/40 flex flex-col h-[65vh]">
                                <div className="flex items-center justify-between border-b border-cyan-500/30 pb-3">
                                    <div className="flex items-center gap-3">
                                        <div className="w-10 h-10 rounded-xl cyber-border-glow flex items-center justify-center bg-void">
                                            <CyberLogoSvg className="w-6 h-6 animate-pulse" />
                                        </div>
                                        <div>
                                            <h3 className="font-display text-xs font-black text-cyan-300 tracking-wider">SARA NEXUS v8.4.2 AI</h3>
                                            <p className="text-[9px] font-mono text-emerald-400">ORGANISMO VIVO • ONLINE</p>
                                        </div>
                                    </div>
                                    <span className="text-xs font-mono text-slate-400">{isSpeaking ? "🔊 Falando..." : "Pronta"}</span>
                                </div>

                                <div className="flex-1 overflow-y-auto space-y-3 pr-2">
                                    {chatHistory.map((msg, idx) => (
                                        <div key={idx} className={`flex ${msg.role === 'user' ? 'justify-end' : 'justify-start'}`}>
                                            <div className={`max-w-[85%] p-3.5 rounded-2xl text-xs leading-relaxed ${
                                                msg.role === 'user'
                                                    ? 'bg-cyan-500 text-void font-bold shadow-[0_0_15px_rgba(0,242,254,0.4)]'
                                                    : 'bg-void/90 border border-cyan-500/30 text-slate-100 shadow-inner'
                                            }`}>
                                                {msg.text}
                                            </div>
                                        </div>
                                    ))}
                                    {isProcessing && (
                                        <div className="flex justify-start">
                                            <div className="bg-void/90 border border-cyan-500/30 p-3 rounded-2xl text-xs text-cyan-400 animate-pulse font-mono">
                                                SARA NEXUS processando telemetria...
                                            </div>
                                        </div>
                                    )}
                                </div>

                                <form onSubmit={handleSendMessage} className="flex gap-2 pt-2 border-t border-cyan-500/20">
                                    <input type="text" value={chatInput} onChange={e => setChatInput(e.target.value)} placeholder="Pergunte à SARA NEXUS sobre o clima, bacias ou riscos..." className="flex-1 bg-void border border-cyan-500/40 rounded-2xl px-4 py-3 text-xs text-white focus:outline-none focus:border-cyan-400" />
                                    <button type="submit" disabled={isProcessing} className="px-6 py-3 cyber-button rounded-2xl text-xs font-black cursor-pointer shadow-lg">Enviar</button>
                                </form>
                            </div>
                        )}

                        {activeTab === 'bacias' && (
                            <div className="cyber-card p-6 rounded-[36px] space-y-5 border border-cyan-500/40">
                                <h3 className="font-display text-sm font-black text-cyan-300 tracking-widest border-b border-cyan-500/30 pb-3">🌊 BACIAS & ENCOSTAS • MONITORAMENTO</h3>
                                <div className="space-y-4 text-xs text-slate-300 leading-relaxed">
                                    <div className="bg-void/80 border border-cyan-500/30 rounded-2xl p-4 space-y-2">
                                        <h4 className="font-bold text-white text-xs">Rio Sarapuí & Bacia Hidrográfica</h4>
                                        <p>Monitoramento preventivo de calhas de rios, bueiros e áreas de escoamento em Rocha Sobrinho e adjacências. SARA NEXUS analisa os índices pluviométricos em tempo real para emissão de alertas precoces.</p>
                                    </div>
                                    <div className="bg-void/80 border border-emerald-500/30 rounded-2xl p-4 space-y-2">
                                        <h4 className="font-bold text-white text-xs">Encostas da Serra do Mendanha</h4>
                                        <p>Mapeamento geotécnico integrado com a comunidade para prevenção de deslizamentos e escorregamentos durante tempestades severas.</p>
                                    </div>
                                </div>
                            </div>
                        )}

                        {activeTab === 'radar' && (
                            <div className="cyber-card p-6 rounded-[36px] space-y-4 border border-cyan-500/40 h-[65vh] flex flex-col">
                                <h3 className="font-display text-sm font-black text-cyan-300 tracking-widest">🛰️ RADAR METEOROLÓGICO 24H</h3>
                                <div className="flex-1 rounded-2xl overflow-hidden border border-cyan-500/30 bg-void">
                                    <iframe src="https://embed.windy.com/embed2.html?lat=-22.7845&lon=-43.4190&detailLat=-22.7845&detailLon=-43.4190&width=650&height=500&zoom=10&level=surface&overlay=wind&product=ecmwf&menu=&message=&marker=true&calendar=now&pressure=true&type=map&location=coordinates&detail=true&metricWind=default&metricTemp=default" className="w-full h-full border-none" allowFullScreen></iframe>
                                </div>
                            </div>
                        )}
                    </main>

                    {/* RODAPÉ PADRONIZADO COM DIREITOS RESERVADOS */}
                    <footer className="cyber-card fixed bottom-0 left-0 right-0 z-40 border-t border-cyan-500/30 px-4 py-3 text-center shadow-2xl backdrop-blur-xl">
                        <div className="font-display text-[10px] font-black text-cyan-300 tracking-[0.2em]">
                            CHAVE CLIMÁTICA • SARA NEXUS v8.4.2 • LICENÇA CIBERNÉTICA
                        </div>
                        <div className="text-[9px] font-mono text-slate-400 mt-0.5">
                            Todos os direitos reservados © 2026 • Grupo A Chave da Esperança • Rocha Sobrinho • Mesquita - RJ
                        </div>
                    </footer>
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
