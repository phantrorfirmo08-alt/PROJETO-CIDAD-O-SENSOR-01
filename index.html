<!DOCTYPE html>
<html lang="pt-PT" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Sarah AI Nexus v8.4.2 PRO - Enterprise Full Cyborg Command Grid</title>

    <link rel="manifest" href="./manifest.json?v=8.4.2">
    <meta name="theme-color" content="#010308">
    <link rel="apple-touch-icon" href="https://cdn.imagetourls.com/uploads/tyImg/195w5uur9.png">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Orbitron:wght@600;800;900&family=JetBrains+Mono:wght@400;600;800&display=swap" rel="stylesheet">

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

    <script>
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Plus Jakarta Sans', 'system-ui', 'sans-serif'],
                        display: ['Orbitron', 'sans-serif'],
                        mono: ['JetBrains Mono', 'monospace'],
                    },
                    colors: {
                        void: "#010308",
                        deepSpace: "#040714",
                        commandPanel: "#0A1026",
                        cyberCyan: "#00F2FE",
                        cyberBlue: "#4FACFE",
                        cyberGreen: "#10B981",
                        cyberAmber: "#FF9900",
                        cyberRose: "#F43F5E",
                        cyberPurple: "#8B5CF6"
                    },
                    animation: {
                        'hud-pulse': 'hudPulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite',
                        'radar-sweep': 'radarSweep 4s linear infinite'
                    }
                }
            }
        };
    </script>
    <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        html, body, #root {
            min-height: 100%;
            margin: 0;
            font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
            background-color: #010308;
            color: #FFFFFF;
            overflow-x: hidden;
            -webkit-user-select: none;
            user-select: none;
        }
        body {
            background-image: 
                radial-gradient(circle at 50% 0%, rgba(0, 242, 254, 0.08) 0%, transparent 65%),
                linear-gradient(rgba(0, 242, 254, 0.02) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 242, 254, 0.02) 1px, transparent 1px);
            background-size: 100% 100%, 20px 20px, 20px 20px;
        }
        .cyborg-card {
            background: linear-gradient(135deg, rgba(10, 16, 38, 0.97) 0%, rgba(4, 7, 20, 0.99) 100%);
            backdrop-filter: blur(25px);
            border: 1px solid rgba(0, 242, 254, 0.45);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.9), inset 0 1px 0 rgba(0, 242, 254, 0.3);
        }
        .cyborg-btn {
            background: linear-gradient(135deg, rgba(0, 242, 254, 0.18) 0%, rgba(79, 172, 254, 0.12) 100%);
            border: 1px solid rgba(0, 242, 254, 0.5);
            transition: all 0.25s ease;
        }
        .cyborg-btn:hover {
            background: rgba(0, 242, 254, 0.35);
            border-color: #00F2FE;
            box-shadow: 0 0 20px rgba(0, 242, 254, 0.6);
            transform: translateY(-1px);
        }
        .radar-handle {
            position: fixed;
            right: 0;
            top: 45%;
            z-index: 60;
            writing-mode: vertical-rl;
            padding: 16px 8px;
            border-radius: 12px 0 0 12px;
            background: linear-gradient(180deg, #00F2FE, #10B981);
            color: #010308;
            font-family: 'Orbitron', sans-serif;
            font-size: 9px;
            font-weight: 900;
            letter-spacing: 2px;
            cursor: pointer;
            border: none;
            box-shadow: -5px 0 20px rgba(0, 242, 254, 0.6);
        }
        ::-webkit-scrollbar { width: 5px; height: 5px; }
        ::-webkit-scrollbar-thumb { background: rgba(0,242,254,0.5); border-radius: 99px; }
    </style>
</head>
<body class="pb-16">
    <div id="root">
        <div style="display:flex;align-items:center;justify-content:center;height:100vh;background:#010308;color:#00F2FE;font-family:'Orbitron',sans-serif;font-size:12px;letter-spacing:3px;">
            INICIALIZANDO NÚCLEO CYBORG v8.4.2 PRO (FULL MATRIX)...
        </div>
    </div>

    <script type="text/babel">
        const R = React;
        const SARAH_AVATAR_URL = "https://cdn.imagetourls.com/uploads/tyImg/195w5uur9.png";

        const SETORES_OFICIAIS = [
            "🛡️ Defesa Civil Municipal (COMPDEC-AVD)",
            "🏛️ SEMIMSP / SEMMURB (Obras e Urbanismo)",
            "🎓 Universidades, Institutos (Pesquisa)",
            "🏠 CRAS (Assistência Social)",
            "SUS (Vigilância em Saúde)",
            "🤝 NUPDECs (Núcleos Comunitários)",
            "🔔 Projeto Cidadão Sensor",
            "📢 Projeto Social Bom Dia Comunidade",
            "🏫 CREAS (Média Complexidade)",
            "🏗️ Secretaria de Obras",
            "👤 Cidadão (Participação Direta)"
        ];

        function FullCyborgEnterpriseApp() {
            const [currentTab, setCurrentTab] = React.useState('command');
            const [isRadarDrawerOpen, setIsRadarDrawerOpen] = React.useState(false);
            const [systemToast, setSystemToast] = React.useState(null);

            // Matriz de Telemetria e Monitoramento de Bacias (Rio de Janeiro / Baixada)
            const [baciasData, setBaciasData] = React.useState([
                { id: 'b1', nome: 'Rio Sarapuí / Setor Sebinho', municipio: 'Mesquita', mmH2O: '3.4', nivelRio: '1.15m', status: 'ESTÁVEL' },
                { id: 'b2', nome: 'Rio Dona Eugênia / Rocha Sobrinho', municipio: 'Mesquita', mmH2O: '1.2', nivelRio: '0.85m', status: 'ESTÁVEL' },
                { id: 'b3', nome: 'Rio Iguaçu / Botas', municipio: 'Nova Iguaçu', mmH2O: '16.8', nivelRio: '2.40m', status: 'ATENÇÃO' },
                { id: 'b4', nome: 'Canal do Sapo / Sarapuí', municipio: 'Duque de Caxias', mmH2O: '5.1', nivelRio: '1.50m', status: 'ESTÁVEL' },
                { id: 'b5', nome: 'Rio Quitandinha', municipio: 'Petrópolis', mmH2O: '44.2', nivelRio: '3.90m', status: 'CRÍTICO' }
            ]);

            // Sistema de Vistoria de Campo
            const [formSetor, setFormSetor] = React.useState(SETORES_OFICIAIS[0]);
            const [formRisco, setFormRisco] = React.useState("🟢 Risco Baixo / Monitoramento Preventivo");
            const [formLocal, setFormLocal] = React.useState("");
            const [formRelato, setFormRelato] = React.useState("");
            const [formLaudoFinal, setFormLaudoFinal] = React.useState("");

            const triggerToast = (msg) => {
                setSystemToast(msg);
                setTimeout(() => setSystemToast(null), 3500);
            };

            const emitirVozSarah = (texto) => {
                if ('speechSynthesis' in window) {
                    window.speechSynthesis.cancel();
                    const utterance = new SpeechSynthesisUtterance(texto);
                    utterance.lang = 'pt-BR';
                    utterance.rate = 1.05;
                    window.speechSynthesis.speak(utterance);
                    triggerToast("🔊 Sarah AI ativada por voz sintética.");
                } else {
                    triggerToast("⚠️ Síntese de voz indisponível neste navegador.");
                }
            };

            const processarLaudoIA = () => {
                if (!formRelato.trim()) return triggerToast("⚠️ Digite um relato de campo para a IA estruturar.");
                const laudoGerado = `[RELATÓRIO TÉCNICO OFICIAL - SARAH AI v8.4.2 PRO]\nÓrgão Solicitante: ${formSetor}\nClassificação de Risco: ${formRisco}\nLocalização Mapeada: ${formLocal || 'Não especificada'}\n\n[OBSERVAÇÃO OPERACIONAL]:\n"${formRelato}"\n\n[DIRETRIZ DE AÇÃO]:\nMonitoramento preventivo em malha fechada ativado. Acionamento automatizado da rede comunitária e órgãos competentes para resiliência climática.`;
                setFormLaudoFinal(laudoGerado);
                triggerToast("✨ Laudo técnico estruturado com sucesso!");
            };

            const gerarPDFLaudo = () => {
                if (!window.jspdf) return triggerToast("⚠️ Biblioteca PDF não carregada.");
                const { jsPDF } = window.jspdf;
                const doc = new jsPDF();
                doc.setFont("helvetica", "bold");
                doc.setFontSize(14);
                doc.text("SARAH AI NEXUS v8.4.2 PRO - LAUDO DE VISTORIA", 15, 20);
                doc.setFont("helvetica", "normal");
                doc.setFontSize(10);
                doc.text(`Setor: ${formSetor}`, 15, 30);
                doc.text(`Risco: ${formRisco}`, 15, 38);
                doc.text(`Local: ${formLocal}`, 15, 46);
                doc.splitTextToSize(formLaudoFinal, 180).forEach((line, idx) => {
                    doc.text(line, 15, 60 + (idx * 6));
                });
                doc.save(`Laudo_Vistoria_${Date.now()}.pdf`);
                triggerToast("📄 PDF gerado e baixado com sucesso!");
            };

            const enviarZap = () => {
                const url = `https://api.whatsapp.com/send?text=${encodeURIComponent(formLaudoFinal || 'Vistoria Sarah AI v8.4.2 PRO')}`;
                window.open(url, '_blank');
            };

            return (
                <div className="max-w-6xl mx-auto p-3 sm:p-5 space-y-4 relative">
                    {systemToast && (
                        <div className="fixed top-5 left-1/2 -translate-x-1/2 z-[300] bg-cyan-400 text-void px-5 py-2.5 rounded-2xl font-mono text-xs font-black shadow-[0_0_25px_rgba(0,242,254,0.9)] animate-bounce">
                            {systemToast}
                        </div>
                    )}

                    {/* RADAR DRAWER TOGGLE BUTTON */}
                    <button className="radar-handle" onClick={() => setIsRadarDrawerOpen(!isRadarDrawerOpen)}>
                        {isRadarDrawerOpen ? "✕ FECHAR RADAR" : "🛰 RADAR METEOROLÓGICO 24H ◀"}
                    </button>

                    {/* RADAR FULL DRAWER */}
                    {isRadarDrawerOpen && (
                        <div className="fixed inset-0 z-[250] bg-void/90 backdrop-blur-xl flex justify-end" onClick={() => setIsRadarDrawerOpen(false)}>
                            <div className="w-full max-w-[750px] h-full cyborg-card flex flex-col" onClick={e => e.stopPropagation()}>
                                <div className="flex items-center justify-between px-6 py-4 bg-deepSpace border-b border-cyan-500/30">
                                    <span className="font-display font-black text-xs text-cyan-400">RADAR PLUVIOMÉTRICO E SATELITAL • ESTADO DO RIO DE JANEIRO</span>
                                    <button onClick={() => setIsRadarDrawerOpen(false)} className="px-3.5 py-1.5 bg-rose-950 text-rose-400 border border-rose-500 rounded-xl text-xs font-bold cursor-pointer">✕</button>
                                </div>
                                <iframe src="https://embed.windy.com/embed2.html?lat=-22.7845&lon=-43.4190&width=700&height=600&zoom=10&overlay=rain" className="w-full flex-1 border-none bg-void" sandbox="allow-scripts allow-same-origin allow-popups"></iframe>
                            </div>
                        </div>
                    )}

                    {/* TOP TACTICAL HEADER */}
                    <header className="cyborg-card rounded-3xl p-4 sm:p-5 flex flex-wrap items-center justify-between gap-4 border-cyan-500/50 shadow-2xl">
                        <div className="flex items-center gap-4">
                            <div className="relative w-14 h-14 rounded-2xl bg-void border-2 border-cyan-400 flex items-center justify-center overflow-hidden shadow-[0_0_25px_rgba(0,242,254,0.7)]">
                                <img src={SARAH_AVATAR_URL} alt="Sarah AI" className="w-full h-full object-cover" />
                                <span className="absolute bottom-0 right-0 w-3.5 h-3.5 rounded-full bg-emerald-400 animate-ping"></span>
                            </div>
                            <div>
                                <div className="font-display font-black text-sm sm:text-base text-cyan-400 tracking-wider">SARAH AI NEXUS <span className="text-white">v8.4.2 PRO</span></div>
                                <div className="font-mono text-[10px] sm:text-xs text-slate-400">CYBORG COMMAND GRID • DEFESA CIVIL ESTADUAL • RIO DE JANEIRO</div>
                            </div>
                        </div>

                        {/* NAVEGAÇÃO PRINCIPAL DO SISTEMA */}
                        <div className="flex items-center gap-2 flex-wrap">
                            <button onClick={() => setCurrentTab('command')} className={`px-4 py-2.5 rounded-2xl font-mono text-xs font-bold tracking-wider transition cursor-pointer ${currentTab === 'command' ? 'bg-cyan-400 text-void shadow-[0_0_20px_rgba(0,242,254,0.8)]' : 'cyborg-btn text-cyan-400'}`}>
                                ⚡ COMMAND
                            </button>
                            <button onClick={() => setCurrentTab('vistoria')} className={`px-4 py-2.5 rounded-2xl font-mono text-xs font-bold tracking-wider transition cursor-pointer ${currentTab === 'vistoria' ? 'bg-cyan-400 text-void shadow-[0_0_20px_rgba(0,242,254,0.8)]' : 'cyborg-btn text-cyan-400'}`}>
                                📋 VISTORIA & LAUDOS
                            </button>
                            <button onClick={() => setCurrentTab('telemetria')} className={`px-4 py-2.5 rounded-2xl font-mono text-xs font-bold tracking-wider transition cursor-pointer ${currentTab === 'telemetria' ? 'bg-cyan-400 text-void shadow-[0_0_20px_rgba(0,242,254,0.8)]' : 'cyborg-btn text-cyan-400'}`}>
                                🛰️ TELEMETRIA 24H
                            </button>
                        </div>
                    </header>

                    {/* VIEW: COMMAND */}
                    {currentTab === 'command' && (
                        <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                            <div className="cyborg-card rounded-3xl p-6 md:col-span-2 space-y-4 flex flex-col justify-between shadow-2xl">
                                <div className="flex items-start justify-between">
                                    <div>
                                        <span className="font-mono text-[10px] text-emerald-400 px-3 py-1 rounded-full bg-emerald-950/80 border border-emerald-500/40">NÚCLEO ESTADUAL ONLINE</span>
                                        <h1 className="font-display font-black text-base sm:text-lg text-white mt-2">CENTRAL DE INTELIGÊNCIA PREDITIVA</h1>
                                    </div>
                                    <button onClick={() => emitirVozSarah("Sistema cibernético operando em malha fechada no estado do Rio de Janeiro. Prontidão total para apoio comunitário e monitoramento de bacias.")} className="px-4 py-2 cyborg-btn text-cyan-400 rounded-xl text-xs font-mono font-bold cursor-pointer">🔊 Voz da Sarah</button>
                                </div>
                                <p className="text-xs sm:text-sm text-slate-300 font-mono leading-relaxed bg-void/70 p-4 rounded-2xl border border-cyan-500/25">
                                    "Plataforma de utilidade pública desenvolvida para integrar a automação moderna aos dados oficiais de Defesa Civil. Atuando na prevenção de riscos, desastres e resiliência climática em todas as regiões fluminenses."
                                </p>
                                <div className="grid grid-cols-3 gap-3 pt-2">
                                    <div className="bg-void/80 p-3 rounded-2xl border border-cyan-500/20 text-center">
                                        <div className="font-mono text-[10px] text-slate-400">ESCOPO</div>
                                        <div className="font-display font-bold text-sm text-cyan-400">ESTADUAL</div>
                                    </div>
                                    <div className="bg-void/80 p-3 rounded-2xl border border-cyan-500/20 text-center">
                                        <div className="font-mono text-[10px] text-slate-400">LATÊNCIA</div>
                                        <div className="font-display font-bold text-sm text-emerald-400">0.2ms</div>
                                    </div>
                                    <div className="bg-void/80 p-3 rounded-2xl border border-cyan-500/20 text-center">
                                        <div className="font-mono text-[10px] text-slate-400">VERSÃO</div>
                                        <div className="font-display font-bold text-sm text-amber-400">v8.4.2 PRO</div>
                                    </div>
                                </div>
                            </div>

                            <div className="cyborg-card rounded-3xl p-6 space-y-3 flex flex-col justify-between shadow-2xl">
                                <div className="font-display font-black text-xs text-cyan-400 mb-1">MÓDULOS DE ACESSO RÁPIDO</div>
                                <button onClick={() => setCurrentTab('vistoria')} className="w-full text-left p-3.5 rounded-2xl cyborg-btn flex items-center justify-between text-xs font-mono font-bold cursor-pointer">
                                    <span>📋 Gerar Laudo de Vistoria</span>
                                    <span className="text-cyan-400">▶</span>
                                </button>
                                <button onClick={() => setIsRadarDrawerOpen(true)} className="w-full text-left p-3.5 rounded-2xl cyborg-btn flex items-center justify-between text-xs font-mono font-bold cursor-pointer">
                                    <span>🛰️ Abrir Radar Meteorológico</span>
                                    <span className="text-cyan-400">▶</span>
                                </button>
                                <button onClick={() => setCurrentTab('telemetria')} className="w-full text-left p-3.5 rounded-2xl cyborg-btn flex items-center justify-between text-xs font-mono font-bold cursor-pointer">
                                    <span>📡 Ver Telemetria das Bacias</span>
                                    <span className="text-cyan-400">▶</span>
                                </button>
                                <div className="p-3 rounded-2xl bg-void/50 border border-cyan-500/20 text-[10px] font-mono text-slate-400 text-center">
                                    Grupo A Chave da Esperança • GADE
                                </div>
                            </div>
                        </div>
                    )}

                    {/* VIEW: VISTORIA & LAUDOS */}
                    {currentTab === 'vistoria' && (
                        <div className="cyborg-card rounded-3xl p-6 space-y-4 shadow-2xl">
                            <div className="flex items-center justify-between border-b border-cyan-500/30 pb-3">
                                <h2 className="font-display font-black text-sm text-cyan-400">MÓDULO DE VISTORIA TÉCNICA E EMISSÃO DE LAUDOS</h2>
                                <button onClick={() => setCurrentTab('command')} className="px-3.5 py-1.5 cyborg-btn text-cyan-400 rounded-xl text-xs font-mono cursor-pointer">Voltar</button>
                            </div>

                            <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                <div>
                                    <label className="block text-xs font-mono text-slate-300 mb-1">Órgão / Setor Emissor:</label>
                                    <select value={formSetor} onChange={e => setFormSetor(e.target.value)} className="w-full bg-void border border-cyan-500/40 rounded-2xl p-3 text-xs text-white font-mono">
                                        {SETORES_OFICIAIS.map((s, idx) => <option key={idx} value={s}>{s}</option>)}
                                    </select>
                                </div>
                                <div>
                                    <label className="block text-xs font-mono text-slate-300 mb-1">Nível de Risco Atribuído:</label>
                                    <select value={formRisco} onChange={e => setFormRisco(e.target.value)} className="w-full bg-void border border-cyan-500/40 rounded-2xl p-3 text-xs text-white font-mono">
                                        <option>🟢 Risco Baixo / Monitoramento Preventivo</option>
                                        <option>🟡 Risco Moderado / Atenção Constante</option>
                                        <option>🟠 Risco Alto / Alerta Vermelho</option>
                                        <option>🔴 Risco Iminente / Evacuação Necessária</option>
                                    </select>
                                </div>
                            </div>

                            <div>
                                <label className="block text-xs font-mono text-slate-300 mb-1">Local / Endereço / Bacia da Ocorrência:</label>
                                <input type="text" placeholder="Ex: Rua Amazonas, Setor Sebinho - Mesquita/RJ" value={formLocal} onChange={e => setFormLocal(e.target.value)} className="w-full bg-void border border-cyan-500/40 rounded-2xl p-3 text-xs text-white font-mono" />
                            </div>

                            {/* ASSISTENTE IA PARA FORMATAÇÃO */}
                            <div className="p-4 bg-deepSpace/90 rounded-2xl border border-cyan-500/30 space-y-2">
                                <label className="block text-xs font-mono font-bold text-cyan-400">🤖 ASSISTENTE SARAH AI • FORMATAÇÃO DE LAUDO:</label>
                                <div className="flex gap-2">
                                    <input type="text" placeholder="Descreva o que observou em campo em linguagem simples..." value={formRelato} onChange={e => setFormRelato(e.target.value)} className="flex-1 bg-void border border-cyan-500/40 rounded-xl p-3 text-xs text-white font-mono" />
                                    <button onClick={processarLaudoIA} className="px-5 py-2.5 cyborg-btn text-cyan-400 rounded-xl text-xs font-mono font-bold cursor-pointer">✨ Estruturar Laudo</button>
                                </div>
                            </div>

                            <div>
                                <label className="block text-xs font-mono text-slate-300 mb-1">Laudo Descritivo Consolidado:</label>
                                <textarea rows="5" value={formLaudoFinal} onChange={e => setFormLaudoFinal(e.target.value)} className="w-full bg-void border border-cyan-500/40 rounded-2xl p-3 text-xs text-white font-mono"></textarea>
                            </div>

                            <div className="grid grid-cols-1 sm:grid-cols-2 gap-3 pt-2">
                                <button onClick={gerarPDFLaudo} className="py-3 bg-cyan-600 hover:bg-cyan-500 text-void font-extrabold rounded-2xl text-xs font-mono uppercase tracking-wider shadow-[0_0_20px_rgba(0,242,254,0.5)] transition cursor-pointer">
                                    📄 Baixar Laudo em PDF
                                </button>
                                <button onClick={enviarZap} className="py-3 bg-emerald-600 hover:bg-emerald-500 text-white font-extrabold rounded-2xl text-xs font-mono uppercase tracking-wider shadow-[0_0_20px_rgba(16,185,129,0.5)] transition cursor-pointer">
                                    📲 Enviar via WhatsApp
                                </button>
                            </div>
                        </div>
                    )}

                    {/* VIEW: TELEMETRIA */}
                    {currentTab === 'telemetria' && (
                        <div className="cyborg-card rounded-3xl p-6 space-y-4 shadow-2xl">
                            <div className="flex items-center justify-between border-b border-cyan-500/30 pb-3">
                                <h2 className="font-display font-black text-sm text-cyan-400">STREAM DE TELEMETRIA DAS BACIAS HIDROGRÁFICAS</h2>
                                <button onClick={() => setCurrentTab('command')} className="px-3.5 py-1.5 cyborg-btn text-cyan-400 rounded-xl text-xs font-mono cursor-pointer">Voltar</button>
                            </div>
                            <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                                {baciasData.map(node => (
                                    <div key={node.id} className="bg-void p-4 rounded-2xl border border-cyan-500/30 flex justify-between items-center font-mono">
                                        <div>
                                            <div className="text-xs font-bold text-white">{node.nome}</div>
                                            <div className="text-[10px] text-slate-400">Município: {node.municipio}</div>
                                            <div className="text-[10px] text-cyan-400 mt-1">Precipitação: {node.mmH2O} mm/h | Nível do Rio: {node.nivelRio}</div>
                                        </div>
                                        <span className={`px-2.5 py-1 rounded-xl text-[10px] font-bold ${node.status === 'CRÍTICO' ? 'bg-rose-950 text-rose-400 border border-rose-500' : node.status === 'ATENÇÃO' ? 'bg-amber-950 text-amber-400 border border-amber-500' : 'bg-emerald-950 text-emerald-400 border border-emerald-500'}`}>
                                            {node.status}
                                        </span>
                                    </div>
                                ))}
