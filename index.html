    <script>
      (function() {
        try {
            const savedTheme = localStorage.getItem('sarah-theme') || 'dark';
            if (savedTheme === 'warm') {
                document.documentElement.classList.remove('dark');
                document.documentElement.classList.add('warm');
            } else {
                document.documentElement.classList.add('dark');
                document.documentElement.classList.remove('warm');
            }
        } catch(e) {}
      })();

                        <div className="space-y-4 text-xs sm:text-sm text-slate-200 leading-relaxed">
                            <p>
                                O <strong className="text-cyberCyan">El Niño</strong> é um fenômeno climático natural caracterizado pelo aquecimento anormal das águas superficiais do setor central e oriental do Oceano Pacífico Equatorial. Ele faz parte de um ciclo oceânico-atmosférico conhecido como <strong className="text-cyberCyan">ENSO</strong> (El Niño-Oscilação Sul), gerando profundos impactos nos padrões de circulação atmosférica, chuvas e temperaturas em escala global e regional.

                            <div className="bg-void/80 border border-cyberCyan/30 rounded-2xl p-4 space-y-3">

                                <ul className="list-disc list-inside space-y-2 text-slate-300">

        function FieldReportModule({ onBackToDashboard, showToast }) {
            const [setor, setSetor] = React.useState("Central Pública e Automatizada de Resiliência Comunitária (CPARC)");
            const [agente, setAgente] = React.useState("");
            const [localizacao, setLocalizacao] = React.useState("");
            const [descricao, setDescricao] = React.useState("");
            const [gpsCoords, setGpsCoords] = React.useState({ lt: '', ln: '', lk: '' });
            const [gpsStatus, setGpsStatus] = React.useState("📍 GPS em espera");
            const [hashSha256, setHashSha256] = React.useState("Calculando hash...");
            const [fotos, setFotos] = React.useState([
                { id: 1, status: "vazia", file: null, preview: null },
                { id: 2, status: "vazia", file: null, preview: null },
                { id: 3, status: "vazia", file: null, preview: null },
                { id: 4, status: "vazia", file: null, preview: null }
            ]);

            const protocoloAtual = React.useMemo(() => `CPARC-2026-${Math.floor(1000 + Math.random() * 9000)}`, []);

            React.useEffect(() => {
                const calcularHash = async () => {
                    try {
                        const msgBuffer = new TextEncoder().encode(setor + agente + localizacao + descricao + protocoloAtual);
                        const hashBuffer = await crypto.subtle.digest('SHA-256', msgBuffer);
                        const hashArray = Array.from(new Uint8Array(hashBuffer));
                        const hashHex = hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
                        setHashSha256(hashHex.substring(0, 32) + "...");
                    } catch (e) {
                        setHashSha256("sha256-fallback-secure");
                    }
                };
                calcularHash();
            }, [setor, agente, localizacao, descricao, protocoloAtual]);

            const capturarGps = () => {
                if (!navigator.geolocation) { showToast("⚠️ Sem GPS"); return; }
                showToast("🛰 Buscando GPS...");
                navigator.geolocation.getCurrentPosition(
                    (p) => {
                        const lt = p.coords.latitude.toFixed(6);
                        const ln = p.coords.longitude.toFixed(6);
                        const lk = `https://www.google.com/maps?q=${lt},${ln}`;
                        setGpsCoords({ lt, ln, lk });
                        setLocalizacao(`${lt}, ${ln}`);
                        setGpsStatus("✅ GPS Fixado");
                        showToast(`📍 ${lt}, ${ln}`);
                    },
                    () => setGpsStatus("⚠ Erro GPS"),
                    { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
                );
            };

            const processarFotoVistoria = (file) => {
                return new Promise((resolve, reject) => {
                    const reader = new FileReader();
                    reader.readAsDataURL(file);
                    reader.onload = (e) => {
                        const img = new Image();
                        img.src = e.target.result;
                        img.onload = () => {
                            const canvas = document.createElement('canvas');
                            const MAX = 800;
                            let w = img.width, h = img.height;
                            if (w > MAX || h > MAX) {
                                if (w > h) { h = Math.round(h * MAX / w); w = MAX; }
                                else { w = Math.round(w * MAX / h); h = MAX; }
                            }
                            canvas.width = w; canvas.height = h;
                            const ctx = canvas.getContext('2d');
                            ctx.drawImage(img, 0, 0, w, h);
                            
                            const tarjaAltura = 58;
                            ctx.fillStyle = 'rgba(6, 11, 24, 0.90)';
                            ctx.fillRect(0, canvas.height - tarjaAltura, canvas.width, tarjaAltura);

                            ctx.fillStyle = '#00F2FE';
                            ctx.fillRect(0, canvas.height - tarjaAltura, canvas.width, 2);

                            ctx.font = 'bold 11px monospace';
                            ctx.fillStyle = '#00F2FE';
                            const locTexto = localizacao ? localizacao.substring(0, 22) : 'Mesquita / RJ';
                            const agTexto = agente ? agente.substring(0, 18) : 'Agente SARAH AI';
                            ctx.fillText(`📍 ${locTexto} | 👤 ${agTexto}`, 12, canvas.height - 40);
                            
                            ctx.fillStyle = '#FFFFFF';
                            ctx.font = '10px monospace';
                            ctx.fillText(`GPS: ${gpsCoords.lt || 'N/A'}, ${gpsCoords.ln || 'N/A'}`, 12, canvas.height - 24);

                            ctx.fillStyle = '#94A3B8';
                            ctx.fillText(`📅 ${new Date().toLocaleString('pt-BR')} | Chave Climática • CPARC`, 12, canvas.height - 9);

                            const dataUrl = canvas.toDataURL('image/jpeg', 0.65);
                            canvas.toBlob((blob) => {
                                const compressedFile = new File([blob], `vistoria_${Date.now()}.jpg`, { type: 'image/jpeg' });
                                resolve({ compressedFile, preview: dataUrl });
                            }, 'image/jpeg', 0.65);
                        };
                        img.onerror = reject;
                    };
                    reader.onerror = reject;
                });
            };

            const handleFotoChange = async (i, e) => {
                const file = e.target.files[0];
                if (!file) return;
                e.target.value = "";
                showToast(`🔄 Processando bloco ${i + 1}...`);
                try {
                    const { compressedFile, preview } = await processarFotoVistoria(file);
                    const novo = [...fotos];
                    novo[i] = { id: novo[i].id, status: "✅ OK", file: compressedFile, preview: preview };
                    setFotos(novo);
                    showToast(`📸 Foto ${i + 1} carimbada com sucesso!`);
                } catch (err) {
                    showToast("❌ Erro ao processar foto");
                }
            };

            const montarTexto = () => {
                const fCount = fotos.filter(f => f.file).length;
                return `🛡️ *RELATÓRIO DE VISTORIA - CHAVE CLIMÁTICA (CPARC)* 🛡️\n\n` +
                       `📌 *Protocolo:* \`${protocoloAtual}\`\n` +
                       `🏛 *Iniciativa:* ${setor}\n` +
                       `👤 *Agente/Responsável:* ${agente || 'Não informado'}\n` +
                       `📍 *Localidade:* ${localizacao || 'Não informado'}\n` +
                       (gpsCoords.lk ? `🔗 *Maps:* ${gpsCoords.lk}\n` : ``) +
                       `📸 *Evidências:* ${fCount}/4 anexadas\n` +
                       `🔒 *Hash SHA-256:* \`${hashSha256}\`\n` +
                       `📅 *Data/Hora:* ${new Date().toLocaleString('pt-BR')}\n\n` +
                       `📋 *Relato Técnico / Anomalia:* \n${descricao || 'Sem descrição'}\n\n` +
                       `_Chave Climática • CPARC • SARAH AI (Mesquita / RJ)_`;
            };

            const gerarPdfLaudo = async () => {
                showToast("📄 Gerando PDF oficial...");
                try {
                    let jsPDFClass = window.jspdf ? window.jspdf.jsPDF : null;
                    if (!jsPDFClass && window.jsPDF) { jsPDFClass = window.jsPDF; }

                    if (!jsPDFClass) {
                        showToast("⚠️ Biblioteca PDF carregando... Tente novamente em 2s.");
                        return;
                    }

                    const doc = new jsPDFClass();
                    
                    doc.setFillColor(2, 6, 23);
                    doc.rect(0, 0, 210, 297, "F");

                    doc.setTextColor(0, 242, 254);
                    doc.setFontSize(12);
                    doc.text(`LAUDO TÉCNICO CPARC (${protocoloAtual})`, 15, 20);

                    doc.setFontSize(9);
                    doc.setTextColor(255, 255, 255);
                    doc.text(`Iniciativa: Central Pública e Automatizada de Resiliência Comunitária (CPARC)`, 15, 30);
                    doc.text(`Responsável: ${agente || 'Não informado'}`, 15, 38);
                    doc.text(`Localidade: ${localizacao || 'Não informado'}`, 15, 46);
                    doc.text(`Coordenadas GPS: ${gpsCoords.lt || 'N/A'}, ${gpsCoords.ln || 'N/A'}`, 15, 54);
                    doc.text(`Hash SHA-256: ${hashSha256}`, 15, 62);
                    doc.text(`Data/Hora: ${new Date().toLocaleString('pt-BR')}`, 15, 70);
                    
                    doc.text("Relato Técnico:", 15, 82);
                    const splitText = doc.splitTextToSize(descricao || 'Sem descrição informada', 180);
                    doc.text(splitText, 15, 90);

                    let yPos = 100 + (splitText.length * 6);

                    fotos.forEach((f, i) => {
                        if (f.preview) {
                            if (yPos > 220) { doc.addPage(); yPos = 20; }
                            try {
                                doc.addImage(f.preview, 'JPEG', 15, yPos, 45, 45);
                                doc.text(`Evidência Fotográfica #${i + 1}`, 65, yPos + 22);
                                yPos += 52;
                            } catch (err) {}
                        }
                    });

                    doc.save(`Laudo_CPARC_${protocoloAtual}.pdf`);
                    showToast("✅ PDF baixado com sucesso!");
                } catch (err) {
                    console.error(err);
                    showToast("❌ Erro ao compilar o PDF.");
                }
            };

            const compartilharWhatsApp = async () => {
                const texto = montarTexto();
                const validFiles = fotos.filter(f => f.file).map(f => f.file);

                try {
                    await navigator.clipboard.writeText(texto);
                } catch(e) {}

                if (validFiles.length > 0) {
                    validFiles.forEach((f, index) => {
                        const a = document.createElement('a');
                        a.href = URL.createObjectURL(f);
                        a.download = `CPARC_${protocoloAtual}_foto_${index + 1}.jpg`;
                        a.click();
                    });
                    showToast("📥 Fotos baixadas para anexo no WhatsApp!");
                }

                setTimeout(() => {
                    const url = `https://api.whatsapp.com/send?text=${encodeURIComponent(texto)}`;
                    window.open(url, '_blank');
                }, 500);
            };

            return (
                <div className="space-y-4 max-w-xl mx-auto">
                    <div className="flex items-center justify-between cyber-card px-5 py-3.5 rounded-2xl border border-cyberCyan/30">
                        <span className="text-xs font-extrabold text-cyberCyan">📋 Vistoria • Chave Climática (CPARC)</span>
                        <button onClick={onBackToDashboard} className="px-3.5 py-1.5 bg-cyberRose/20 text-cyberRose rounded-xl text-xs font-bold border border-cyberRose/40">✕ Fechar</button>
                    </div>

                    <div className="cyber-card rounded-[32px] p-6 border border-cyberCyan/40 space-y-4 shadow-2xl">
                        <select value={setor} onChange={e => setSetor(e.target.value)} className="w-full bg-void border border-cyberCyan/40 rounded-2xl p-3.5 text-xs text-white">
                            <option>Central Pública e Automatizada de Resiliência Comunitária (CPARC)</option>
                            <option>🛡️ Grupo A Chave da Esperança & Projeto Bom Dia Comunidade</option>
                        </select>

                        <div className="grid grid-cols-2 gap-3">
                            <input value={agente} onChange={e => setAgente(e.target.value)} placeholder="Seu Nome / Agente" className="w-full bg-void border border-cyberCyan/40 rounded-2xl p-3.5 text-xs text-white" />
                            <input value={localizacao} onChange={e => setLocalizacao(e.target.value)} placeholder="Local / Bairro / Encosta" className="w-full bg-void border border-cyberCyan/40 rounded-2xl p-3.5 text-xs text-white" />
                        </div>

                        <div className="border border-cyberCyan/40 bg-void/80 rounded-2xl p-3.5 flex items-center justify-between shadow-inner">
                            <span className="text-cyberGreen text-xs font-mono font-bold">{gpsStatus}</span>
                            <button onClick={capturarGps} className="px-4 py-2 cyber-button text-void font-black rounded-xl text-xs shadow">GPS 🛰</button>
                        </div>

                        <textarea value={descricao} onChange={e => setDescricao(e.target.value)} placeholder="Descreva a situação na área monitorada..." rows="3" className="w-full bg-void border border-cyberCyan/40 rounded-2xl p-3.5 text-xs text-white resize-none shadow-inner"></textarea>

                        <div className="bg-void/90 border border-cyberCyan/30 rounded-2xl p-3 text-[10px] font-mono text-cyan-300 break-all">
                            <b>Protocolo:</b> {protocoloAtual} <br/>
                            <b>Hash SHA-256:</b> {hashSha256}
                        </div>

                        <div className="grid grid-cols-2 gap-3">
                            {fotos.map((f, idx) => (
                                <label key={f.id} htmlFor={`foto-${idx}`} className="relative h-32 rounded-2xl border-2 border-dashed border-cyberGreen/40 bg-void flex items-center justify-center cursor-pointer overflow-hidden shadow">
                                    {f.preview ? (
                                        <img src={f.preview} alt={`Foto ${idx+1}`} className="w-full h-full object-cover rounded-2xl" />

                                        <div className="text-center">
                                            <div className="text-xl">📷</div>

                                    {f.preview && <div className="absolute bottom-1.5 right-1.5 bg-cyberGreen text-void text-[9px] font-black px-2 py-0.5 rounded-full shadow">OK</div>}
                                </label>
                            ))}
                        </div>

                        <button onClick={gerarPdfLaudo} className="w-full cyber-button text-void font-extrabold py-3.5 rounded-2xl text-xs uppercase shadow-lg tracking-wider">📄 Gerar Laudo em PDF</button>
                        <button onClick={compartilharWhatsApp} className="w-full bg-gradient-to-r from-indigo-600 via-blue-600 to-cyberCyan text-white font-extrabold py-3.5 rounded-2xl text-xs uppercase shadow-xl tracking-wider">🚀 Compartilhar Relatório no WhatsApp</button>
                    </div>
                </div>
            );

            const speechIdRef = React.useRef(0);

                window.addEventListener('beforeinstallprompt', onPrompt);
                window.addEventListener('appinstalled', onInstalled);
                return () => {
                    window.removeEventListener('beforeinstallprompt', onPrompt);
                    window.removeEventListener('appinstalled', onInstalled);
                };
            }, []);

            const handleInstallApp = async () => {
                if (deferredPrompt) {
                    deferredPrompt.prompt();

                    if (outcome === 'accepted') { showToast("🎉 Aplicativo instalado!"); }

            const carregarVozes = () => { if ("speechSynthesis" in window) { voicesRef.current = window.speechSynthesis.getVoices(); } };
            React.useEffect(() => {
                if (!("speechSynthesis" in window)) return;
                carregarVozes();
                window.speechSynthesis.onvoiceschanged = carregarVozes;
                return () => { window.speechSynthesis.cancel(); window.speechSynthesis.onvoiceschanged = null; };
            }, []);

            const limparTextoParaFala = (text) => {
                return String(text).replace(/([\u2700-\u27BF]|[\uE000-\uF8FF]|\uD83C[\uDC00-\uDFFF]|\uD83D[\uDC00-\uDFFF]|[\u2011-\u26FF]|\uD83E[\uDD00-\uDDFF])/g, '').replace(/\[(.*?)\]\(.*?\)/g, "$1").replace(/https?:\/\/\S+/g, "").replace(/\s+/g, " ").trim();
            };

            const escolherMelhorVoz = () => {
                const voices = voicesRef.current.length ? voicesRef.current : window.speechSynthesis.getVoices();
                return voices.find((voice) => voice.lang.toLowerCase().includes("pt")) || voices[0];
            };

            const stopSpeaking = () => {
                speechIdRef.current += 1;
                if (voiceTimerRef.current) { clearTimeout(voiceTimerRef.current); voiceTimerRef.current = null; }
                if ("speechSynthesis" in window) window.speechSynthesis.cancel();
                setIsSpeaking(false);
            };

            const speakText = (text) => {
                if (!soundEnabled || !("speechSynthesis" in window)) return;
                const cleanText = limparTextoParaFala(text);
                if (!cleanText) return;
                stopSpeaking();
                const currentId = speechIdRef.current;
                voiceTimerRef.current = setTimeout(() => {
                    if (currentId !== speechIdRef.current) return;
                    const utterance = new SpeechSynthesisUtterance(cleanText);
                    utterance.lang = "pt-BR";
                    utterance.voice = escolherMelhorVoz();
                    utterance.rate = 1.0;
                    utterance.onstart = () => { if (currentId === speechIdRef.current) setIsSpeaking(true); };
                    utterance.onend = () => { if (currentId === speechIdRef.current) setIsSpeaking(false); };
                    utterance.onerror = () => setIsSpeaking(false);
                    window.speechSynthesis.speak(utterance);
                }, 200);
            };

            React.useEffect(() => {

                const greeting = getBrasiliaGreeting();
                const presentation = `${greeting}, sou a SARAH AI na Central Pública e Automatizada de Resiliência Comunitária, Chave Climática, em Rocha Sobrinho, Mesquita.`;

            React.useEffect(() => {
                try { localStorage.setItem("sarah-theme", theme); } catch(e) {}
                const metaTheme = document.querySelector('meta[name="theme-color"]');
                if (theme === 'warm') {
                    document.documentElement.classList.remove('dark');
                    document.documentElement.classList.add('warm');
                    if (metaTheme) metaTheme.setAttribute('content', '#F4F3EF');
                } else {
                    document.documentElement.classList.add('dark');
                    document.documentElement.classList.remove('warm');
                    if (metaTheme) metaTheme.setAttribute('content', '#02040A');
                }
            }, [theme]);

            const toggleTheme = () => {
                setTheme(prev => {
                    const next = prev === 'dark' ? 'warm' : 'dark';
                    showToast(next === 'warm' ? '🎨 Tema Clean Ativado' : '🌌 Modo Cyber Ativado');
                    return next;
                });
            };

            const toggleListening = () => {
                const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
                if (!SpeechRec) { showToast("⚠️ Reconhecimento de voz indisponível."); return; }
                if (isListening) { setIsListening(false); return; }
                try {
                    const rec = new SpeechRec();
                    rec.lang = "pt-BR";
                    rec.continuous = false;
                    rec.interimResults = true;
                    rec.onstart = () => { setIsListening(true); showToast("🎙 Ouvindo voz..."); };
                    rec.onresult = (event) => {
                        let final = '';
                        for (let i = event.resultIndex; i < event.results.length; ++i) {
                            if (event.results[i].isFinal) final += event.results[i][0].transcript;
                        }
                        if (final) {
                            setInput(final);
                            setIsListening(false);
                            handleSendDirectCommand(final);
                        }
                    };
                    rec.onerror = () => { setIsListening(false); showToast("⚠ Erro no microfone."); };
                    rec.onend = () => { setIsListening(false); };
                    rec.start();
                } catch (e) { setIsListening(false); showToast("⚠️ Erro ao iniciar microfone."); }
            };

            const handleSendDirectCommand = async (textCustom) => {

                try {

                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({
                            model: "openai/gpt-oss-120b",
                            messages: [

                                    role: "system",
                                    content: `Você é a SARAH AI, assistente virtual oficial da CPARC (Central Pública e Automatizada de Resiliência Comunitária) e Chave Climática, localizada em Rocha Sobrinho, Mesquita, RJ.`

                    });

                    if (response.status === 404) {
                        throw new Error("Erro 404: Endpoint indisponível.");
                    }

                    const data = await response.json();
                    let reply = data?.choices?.[0]?.message?.content || data?.message || "Análise concluída.";
                    reply = reply.replace(/#{1,6}\s?/g, '').replace(/\*\*/g, '').replace(/\|/g, ' ').replace(/---/g, '').trim();

                    setCurrentResponse(reply);
                    speakText(reply);
                } catch (error) {
                    const fallback = "SARAH AI à disposição na CPARC (Chave Climática). Como posso ajudar com sua vistoria ou monitoramento hoje?";
                    setCurrentResponse(fallback);
                    speakText(fallback);
                } finally {
                    setIsProcessing(false);
                }
            };

            const openSarahChat = () => {
                setIsChatOpen(true);
                stopSpeaking();
                const greeting = getBrasiliaGreeting();
                speakText(`${greeting}! SARAH AI pronta na CPARC. Como posso auxiliar?`);
            };

            const NAV_TABS = [
                { id: 'dashboard', iconComponent: <HomeCommandIcon className="w-5 h-5" />, label: 'Painel' },
                { id: 'modulo1', iconComponent: <span className="text-sm">🌪️</span>, label: 'Módulo 1' },
                { id: 'radar', iconComponent: <RadarScanIcon className="w-5 h-5" />, label: 'Radar' },
                { id: 'relatorio', iconComponent: <FieldReportIcon className="w-5 h-5" />, label: 'Vistoria' },
                { id: 'galeria', iconComponent: <StreamVideoIcon className="w-5 h-5" />, label: 'Vídeos' },
                { id: 'admin', iconComponent: <AdminVaultIcon className="w-5 h-5" />, label: 'Admin' }
            ];

            return (
                <div className="min-h-screen flex flex-col relative text-slate-100 antialiased">
                    {showSplash && (
                        <AppSplashScreen 
                            splashImageUrl={SPLASH_IMAGE_URL} 
                            onFinish={() => setShowSplash(false)} 
                        />
                    )}

                    {toastMessage && (
                        <div className="fixed top-20 left-1/2 -translate-x-1/2 z-50 cyber-card px-6 py-3 rounded-2xl font-display text-[11px] font-black text-cyberCyan tracking-wider shadow-2xl border border-cyberCyan/50 animate-bounce">
                            {toastMessage}
                        </div>
                    )}

                    {shareModalOpen && (
                        <div className="fixed inset-0 bg-void/90 backdrop-blur-xl z-50 flex items-center justify-center p-4">
                            <div className="cyber-card max-w-md w-full p-6 sm:p-8 rounded-[32px] space-y-4 text-center shadow-2xl border border-cyberCyan/40">
                                <h3 className="font-display text-sm font-black text-cyberCyan tracking-widest">📲 COMPARTILHAR A CPARC</h3>
                                <textarea readOnly value={shareMessageText} className="w-full h-32 bg-void border border-cyberCyan/30 rounded-2xl p-3 text-xs text-slate-200 resize-none font-mono shadow-inner" />
                                <div className="flex gap-3">
                                    <button onClick={() => { navigator.clipboard.writeText(shareMessageText); showToast("📋 Link copiado!"); setShareModalOpen(false); }} className="flex-1 py-3.5 cyber-button font-black rounded-2xl text-xs cursor-pointer shadow-lg">Copiar Link</button>
                                    <button onClick={() => setShareModalOpen(false)} className="px-5 py-3.5 bg-cyberRose/20 text-cyberRose border border-cyberRose/40 rounded-2xl text-xs font-bold cursor-pointer">Fechar</button>
                                </div>
                            </div>
                        </div>
                    )}

                    {installModalOpen && (
                        <div className="fixed inset-0 bg-void/90 backdrop-blur-xl z-50 flex items-center justify-center p-4">
                            <div className="cyber-card max-w-md w-full p-6 sm:p-8 rounded-[32px] space-y-5 text-center shadow-2xl border border-cyberCyan/40 max-h-[88vh] overflow-y-auto">
                                <div className="flex flex-col items-center space-y-2">
                                    <div className="w-24 h-24 rounded-[26px] overflow-hidden border-2 border-cyberCyan/60 shadow-[0_0_40px_rgba(0,242,254,0.4)]">
                                        <img src={MAIN_ICON_URL} alt="Ícone" className="w-full h-full object-cover" />
                                    </div>
                                    <h3 className="font-display text-sm font-black text-cyberCyan tracking-widest">INSTALAR APLICATIVO</h3>
                                    <p className="text-[10px] font-mono text-cyberGreen font-bold tracking-wider">CPARC • Mesquita RJ</p>
                                </div>
                                <button onClick={() => { setInstallModalOpen(false); openShareFromApp(); }}
                                    className="w-full py-3.5 cyber-button font-black rounded-2xl text-xs uppercase tracking-widest cursor-pointer shadow-xl">
                                    📲 Compartilhar CPARC + Link
                                </button>
                                <button onClick={() => setInstallModalOpen(false)}
                                    className="w-full py-3 bg-cyberRose/20 text-cyberRose border border-cyberRose/40 rounded-2xl text-xs font-bold cursor-pointer">
                                    Fechar
                                </button>
                            </div>
                        </div>
                    )}

                    {!termsAccepted && (
                        <div className="fixed inset-0 bg-void/95 z-[200] flex items-center justify-center p-4 overflow-y-auto">
                            <div className="cyber-card max-w-lg w-full p-6 sm:p-8 rounded-[36px] shadow-2xl space-y-5 my-auto border border-cyberCyan/50">
                                <div className="text-center space-y-2">
                                    <h2 className="font-display text-2xl font-black text-white tracking-[0.2em] animate-maluco-glow">CHAVE CLIMÁTICA</h2>
                                    <p className="text-xs text-cyberCyan font-black uppercase tracking-widest">Central Pública e Automatizada de Resiliência Comunitária (CPARC)</p>
                                </div>

                                <div className="space-y-2.5">
                                    <div className="bg-void/90 p-4 rounded-2xl border border-cyberCyan/20 space-y-1">
                                        <div className="text-[10px] font-display font-black text-cyberCyan tracking-widest">
                                            🛡️ SARAH AI • VISTORIAS E TELEMETRIA
                                        </div>
                                        <p className="text-[11px] text-slate-300 leading-relaxed">Central comunitária com assistente inteligente SARAH AI para apoio integrado nas encostas, bacias e Serra do Mendanha em Rocha Sobrinho, Mesquita.</p>
                                    </div>
                                </div>

                                <div className="space-y-3">
                                    <label className="flex items-start gap-3 cursor-pointer text-xs text-slate-300 bg-commandPanel/80 p-3.5 rounded-xl border border-cyberCyan/20">
                                        <input type="checkbox" checked={check1} onChange={(e) => setCheck1(e.target.checked)} className="mt-0.5 rounded border-cyberCyan/50 text-cyberCyan w-4 h-4 bg-void shrink-0 cursor-pointer" />
                                        <span>Concordo com os princípios de solidariedade e transparência da CPARC.</span>
                                    </label>
                                    <label className="flex items-start gap-3 cursor-pointer text-xs text-slate-300 bg-commandPanel/80 p-3.5 rounded-xl border border-cyberCyan/20">
                                        <input type="checkbox" checked={check2} onChange={(e) => setCheck2(e.target.checked)} className="mt-0.5 rounded border-cyberCyan/50 text-cyberCyan w-4 h-4 bg-void shrink-0 cursor-pointer" />
                                        <span>Autorizo o uso de geolocalização para registro das vistorias de campo.</span>
                                    </label>
                                </div>

                                <button disabled={!check1 || !check2} onClick={() => { setTermsAccepted(true); try { localStorage.setItem("cparc_terms_accepted", "1"); } catch(e) {} showToast("🚀 CPARC Ativa!"); }} className={`w-full py-4 rounded-2xl font-display font-black text-xs uppercase tracking-[0.2em] transition shadow-2xl ${check1 && check2 ? 'cyber-button font-black cursor-pointer' : 'bg-commandPanel text-slate-500 cursor-not-allowed'}`}>
                                    Entrar com CHAVE CLIMÁTICA & SARAH AI
                                </button>
                            </div>
                        </div>
                    )}

                    <header className="cyber-card sticky top-0 z-30 px-4 sm:px-6 py-3.5 border-b border-cyberCyan/30 flex items-center justify-between shadow-2xl">
                        <div className="flex items-center gap-3">
                            <div className={`w-11 h-11 rounded-2xl cyber-border-glow flex items-center justify-center bg-void shadow-[0_0_30px_rgba(0,242,254,0.5)] overflow-hidden border border-cyberCyan ${isSpeaking ? 'animate-hud-pulse' : ''}`}>
                                <img src={SARAH_CUSTOM_AVATAR_URL} alt="SARAH AI" className="w-full h-full object-cover" />
                            </div>
                            <div>
                                <h1 className="font-display text-xs sm:text-sm font-black text-white tracking-[0.1em] animate-maluco-glow">CHAVE CLIMÁTICA</h1>
                                <p className="text-[9px] text-cyberGreen font-mono font-bold tracking-wider">CPARC • ROCHA SOBRINHO</p>
                            </div>
                        </div>
                        <div className="flex items-center gap-2">
                            <IconeSomToggle soundEnabled={soundEnabled} setSoundEnabled={setSoundEnabled} />
                            <IconeTemaToggle theme={theme} toggleTheme={toggleTheme} />
                            <IconeCompartilharTopo showToast={showToast} openShareFromApp={openShareFromApp} />
                            <IconeInstalarApp handleInstallApp={handleInstallApp} isInstallable={isInstallable} />
                        </div>
                    </header>

                    <nav className="cyber-card border-b border-cyberCyan/30 px-4 py-2.5 flex items-center justify-center gap-2 overflow-x-auto z-20">
                        {NAV_TABS.map(tab => (
                            <button key={tab.id} onClick={() => tab.id === 'radar' ? setRadarOpen(true) : setActiveTab(tab.id)}
                                className={`px-4 py-2 rounded-2xl text-[11px] font-black transition cursor-pointer flex items-center gap-2 shrink-0 tracking-wider ${
                                    activeTab === tab.id
                                        ? 'cyber-button font-black shadow-[0_0_25px_rgba(255,153,0,0.5)]'
                                        : 'bg-commandPanel text-slate-300 border border-cyberCyan/20'
                                }`}>
                                {tab.iconComponent} {tab.label}
                            </button>
                        ))}
                    </nav>

                    <main className="flex-1 max-w-3xl w-full mx-auto p-4 sm:p-6 space-y-5 pb-36 relative z-10">
                        {activeTab === 'dashboard' && (
                            <div className="space-y-5">
                                <div className="cyber-card p-6 sm:p-8 rounded-[36px] shadow-[0_0_70px_rgba(0,242,254,0.45)] space-y-6 text-center border-2 border-cyberCyan/80">
                                    <SarahHologramAvatar isLarge={true} isSpeaking={isSpeaking} />

                                    <div className="space-y-2">
                                        <div className="inline-flex items-center px-4 py-1.5 rounded-full bg-cyberCyan/15 border border-cyberCyan/35 font-mono text-[10px] text-cyberCyan tracking-widest shadow-inner">
                                            GRUPO A CHAVE DA ESPERANÇA • MESQUITA / RJ
                                        </div>
                                        <h2 className="font-display text-sm font-black text-white tracking-wide">CHAVE CLIMÁTICA • Central Pública e Automatizada de Resiliência Comunitária (CPARC)</h2>
                                        <p className="text-xs text-slate-300 font-medium italic">
                                            "SARAH AI • Monitoramento da Serra do Mendanha e bacias, com apoio emocional, resiliência e suporte técnico."
                                        </p>
                                    </div>

                                    <button onClick={openSarahChat} className="relative w-full max-w-sm mx-auto flex items-center justify-center gap-3 py-4 px-6 rounded-[26px] cyber-button font-display font-black text-sm uppercase tracking-[0.2em] shadow-[0_0_50px_rgba(255,153,0,0.6)] cursor-pointer">
                                        💬 Falar com a SARAH AI
                                    </button>

                                    <div className="flex flex-wrap justify-center gap-2">
                                        <button onClick={() => setActiveTab('modulo1')} className="px-4 py-2 bg-void border border-cyberCyan/30 hover:border-cyberCyan text-cyberCyan rounded-2xl text-[11px] font-bold transition cursor-pointer">🌪️ Módulo 1: El Niño</button>
                                        <button onClick={openSarahChat} className="px-4 py-2 bg-void border border-cyberCyan/30 hover:border-cyberCyan text-cyberCyan rounded-2xl text-[11px] font-bold transition cursor-pointer">⛰️ Serra do Mendanha</button>
                                        <button onClick={openSarahChat} className="px-4 py-2 bg-void border border-cyberCyan/30 hover:border-cyberCyan text-cyberCyan rounded-2xl text-[11px] font-bold transition cursor-pointer">📋 Vistorias CPARC</button>
                                    </div>
                                </div>
                            </div>
                        )}

                        {activeTab === 'modulo1' && <ModuloElNinoModule onGoToDashboard={() => setActiveTab('dashboard')} />}
                        {activeTab === 'relatorio' && <FieldReportModule onBackToDashboard={() => setActiveTab('dashboard')} showToast={showToast} />}
                        {activeTab === 'galeria' && <PublicVideoGallery localVideos={localVideos} onGoToDashboard={() => setActiveTab('dashboard')} />}
                        {activeTab === 'admin' && (
                            <AdminVaultModule
                                localVideos={localVideos}
                                setLocalVideos={setLocalVideos}
                                marketingText={marketingText}
                                setMarketingText={setMarketingText}
                                showToast={showToast}
                                onClose={() => setActiveTab('dashboard')}
                            />
                        )}

                        <AutomatedObservatoryWidget marketingText={marketingText} />
                    </main>

                    {termsAccepted && <SarahFabButton onOpen={openSarahChat} />}

                    <NativeHydroWindRadar isOpen={radarOpen} onToggle={() => setRadarOpen(o => !o)} />

                    <SarahChatOverlay
                        isOpen={isChatOpen}
                        onClose={() => { setIsChatOpen(false); stopSpeaking(); }}
                        isSpeaking={isSpeaking}
                        isProcessing={isProcessing}
                        currentResponse={currentResponse}
                        input={input}
                        setInput={setInput}
                        handleSendDirectCommand={handleSendDirectCommand}
                        toggleListening={toggleListening}
                        isListening={isListening}
                    />

                    <footer className="cyber-card fixed bottom-0 left-0 right-0 z-40 border-t border-cyberCyan/30 px-4 py-3 flex items-center justify-around shadow-2xl backdrop-blur-2xl">
                        {NAV_TABS.map(tab => (
                            <button key={tab.id} onClick={() => tab.id === 'radar' ? setRadarOpen(true) : setActiveTab(tab.id)}
                                className={`flex flex-col items-center gap-1 cursor-pointer transition ${activeTab === tab.id ? 'text-cyberCyan scale-105' : 'text-slate-400 hover:text-white'}`}>
                                {tab.iconComponent}
                                <span className="text-[9px] font-black tracking-wider">{tab.label}</span>
                            </button>
                        ))}
                    </footer>
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
