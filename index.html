<!DOCTYPE html>
<html lang="pt-BR" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SARAH AI Core v4.0 - Defesa Civil Mesquita</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: { brand: { dark: "#020617", light: "#f8fafc" } }
                }
            }
        };
    </script>
    <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="">
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <meta name="theme-color" content="#020617">
    <style>
        html, body, #root { min-height: 100%; margin: 0; }
        body { overflow-x: hidden; }
        .leaflet-container { z-index: 1; }
    </style>
</head>
<body class="min-h-screen bg-slate-950 text-slate-100">
    <div id="root"></div>
    <script type="text/babel">
        const CLOUDFLARE_WORKER_URL = "https://sarah-envelope.phantrorfirmo08.workers.dev/";

        const getBrasiliaGreeting = () => {
            const hour = parseInt(new Intl.DateTimeFormat("pt-BR", { timeZone: "America/Sao_Paulo", hour: "numeric", hour12: false }).format(new Date()), 10);
            if (hour >= 0 && hour < 5) return "Boa madrugada";
            if (hour >= 5 && hour < 12) return "Bom dia";
            if (hour >= 12 && hour < 18) return "Boa tarde";
            return "Boa noite";
        };

        function SarahAvatar({ size = "w-10 h-10", showStatus = true, isLarge = false }) {
            const [isBlinking, setIsBlinking] = React.useState(false);
            React.useEffect(() => {
                let timeoutId;
                const triggerBlink = () => {
                    setIsBlinking(true);
                    setTimeout(() => setIsBlinking(false), 150);
                    timeoutId = setTimeout(triggerBlink, Math.floor(Math.random() * 3000) + 3000);
                };
                timeoutId = setTimeout(triggerBlink, Math.floor(Math.random() * 3000) + 3000);
                return () => clearTimeout(timeoutId);
            }, []);
            const dim = isLarge ? "w-28 h-28" : size;
            return (
                <div className="relative inline-flex items-center justify-center shrink-0">
                    <div className={`${dim} rounded-full bg-gradient-to-b from-sky-100 to-cyan-200 dark:from-slate-900 dark:to-slate-800 border-2 border-cyan-400 shadow-[0_0_20px_rgba(56,189,248,0.3)] flex flex-col items-center justify-center relative overflow-hidden select-none`}>
                        <svg className="w-3/5 h-3/5 text-cyan-600 dark:text-cyan-400" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <ellipse cx="20" cy="24" rx="4" ry={isBlinking ? "0.8" : "6"} fill="currentColor" className="transition-all duration-75"/>
                            <ellipse cx="44" cy="24" rx="4" ry={isBlinking ? "0.8" : "6"} fill="currentColor" className="transition-all duration-75"/>
                            <path d="M 20 38 Q 32 48 44 38" stroke="currentColor" strokeWidth="4" strokeLinecap="round"/>
                        </svg>
                    </div>
                    {showStatus && <div className={`absolute ${isLarge ? 'bottom-1 right-1 w-4 h-4 border-2' : '-bottom-0.5 right-0.5 w-3 h-3 border'} bg-emerald-500 rounded-full border-slate-950 shadow-md animate-pulse`} title="Ativo"></div>}
                </div>
            );
        }

        function App() {
            const [darkMode, setDarkMode] = React.useState(true);
            const [soundEnabled, setSoundEnabled] = React.useState(true);
            const [isSpeaking, setIsSpeaking] = React.useState(false);
            const [isListening, setIsListening] = React.useState(false);
            const [liveWeather, setLiveWeather] = React.useState(null);
            const [mapOpen, setMapOpen] = React.useState(false);
            const [chartOpen, setChartOpen] = React.useState(false);
            const [termsOpen, setTermsOpen] = React.useState(false);
            
            const [termsAccepted, setTermsAccepted] = React.useState(() => localStorage.getItem("sarah_terms_accepted") === "1");
            const [check1, setCheck1] = React.useState(false);
            const [check2, setCheck2] = React.useState(false);

            const [messages, setMessages] = React.useState([]);
            const [input, setInput] = React.useState("");
            const [isLoadingChat, setIsLoadingChat] = React.useState(false);
            const [hasIntroduced, setHasIntroduced] = React.useState(() => localStorage.getItem("sarah_introduced") === "1");

            const speechIdRef = React.useRef(0);
            const voiceTimerRef = React.useRef(null);
            const voicesRef = React.useRef([]);
            const mapRef = React.useRef(null);
            const mapInstanceRef = React.useRef(null);
            const chartRef = React.useRef(null);
            const chartInstanceRef = React.useRef(null);

            const carregarVozes = () => {
                if ("speechSynthesis" in window) voicesRef.current = window.speechSynthesis.getVoices();
            };

            React.useEffect(() => {
                if (!("speechSynthesis" in window)) return;
                carregarVozes();
                window.speechSynthesis.onvoiceschanged = carregarVozes;
                return () => { window.speechSynthesis.cancel(); window.speechSynthesis.onvoiceschanged = null; };
            }, []);

            const limparTextoParaFala = (text) => String(text).replace(/[#*_`~]/g, "").replace(/\[(.*?)\]\(.*?\)/g, "$1").replace(/https?:\/\/\S+/g, "").replace(/\s+/g, " ").trim();

            const escolherMelhorVoz = () => {
                const voices = voicesRef.current.length ? voicesRef.current : window.speechSynthesis.getVoices();
                const prefs = ["Google português do Brasil", "Microsoft Francisca", "Microsoft Maria"];
                return voices.find(v => prefs.some(p => v.name.toLowerCase().includes(p.toLowerCase()))) || voices.find(v => v.lang.toLowerCase().includes("pt")) || voices[0];
            };

            const stopSpeaking = () => {
                speechIdRef.current += 1;
                if (voiceTimerRef.current) { clearTimeout(voiceTimerRef.current); voiceTimerRef.current = null; }
                if ("speechSynthesis" in window) window.speechSynthesis.cancel();
                setIsSpeaking(false);
            };

            const speakText = (text) => {
                if (!soundEnabled || !("speechSynthesis" in window)) return;
                const clean = limparTextoParaFala(text);
                if (!clean) return;
                stopSpeaking();
                const curId = speechIdRef.current;
                voiceTimerRef.current = setTimeout(() => {
                    if (curId !== speechIdRef.current) return;
                    const u = new SpeechSynthesisUtterance(clean);
                    u.lang = "pt-BR";
                    u.voice = escolherMelhorVoz() || null;
                    u.rate = 0.92; u.pitch = 1.02; u.volume = 1;
                    u.onstart = () => { if (curId === speechIdRef.current) setIsSpeaking(true); };
                    u.onend = () => { if (curId === speechIdRef.current) setIsSpeaking(false); };
                    u.onerror = () => setIsSpeaking(false);
                    window.speechSynthesis.speak(u);
                }, 250);
            };

            React.useEffect(() => {
                if (!termsAccepted || hasIntroduced) return;
                const timer = setTimeout(() => {
                    if (!soundEnabled) return;
                    setHasIntroduced(true);
                    localStorage.setItem("sarah_introduced", "1");
                    speakText(`${getBrasiliaGreeting()}, meu nome é Sara, assistente meteorológica do projeto Cidadão Sensor. Em que posso ajudar?`);
                }, 700);
                return () => clearTimeout(timer);
            }, [termsAccepted, hasIntroduced, soundEnabled]);

            const handleShareLink = async () => {
                const data = { title: "SARAH AI Core v4.0", text: "Monitoramento preventivo Bacia do Rio Sarapuí.", url: window.location.href };
                if (navigator.share) {
                    try { await navigator.share(data); } catch (e) {}
                } else if (navigator.clipboard) {
                    await navigator.clipboard.writeText(window.location.href);
                    alert("Link copiado para a área de transferência.");
                }
            };

            // Open-Meteo API (Clima Real com temperatura, umidade, vento e precipitação)
            React.useEffect(() => {
                fetch("https://api.open-meteo.com/v1/forecast?latitude=-22.7845&longitude=-43.4140&current=temperature_2m,relative_humidity_2m,precipitation,wind_speed_10m,weather_code")
                    .then(res => res.json())
                    .then(data => { if (data?.current) setLiveWeather(data.current); })
                    .catch(err => console.warn("Clima indisponível:", err));
            }, []);

            React.useEffect(() => {
                document.documentElement.classList.toggle("dark", darkMode);
                document.documentElement.classList.toggle("light", !darkMode);
            }, [darkMode]);

            // Mapa Leaflet + API RainViewer (Camada de radar ao vivo)
            React.useEffect(() => {
                if (mapOpen && mapRef.current && !mapInstanceRef.current) {
                    const lat = -22.7845, lng = -43.4140;
                    const map = L.map(mapRef.current).setView([lat, lng], 15);
                    L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
                        maxZoom: 19,
                        attribution: "© OpenStreetMap | SARAH AI Core v4.0"
                    }).addTo(map);

                    L.marker([lat, lng]).addTo(map).bindPopup("<b>Setor de referência:</b> Comunidade do Sebinho - Mesquita/RJ").openPopup();

                    // Integração RainViewer Radar Layer
                    fetch("https://api.rainviewer.com/public/weather-maps.json")
                        .then(res => res.json())
                        .then(data => {
                            if (data?.radar?.past && data.radar.past.length > 0) {
                                const latest = data.radar.past[data.radar.past.length - 1];
                                L.tileLayer(`https://tilecache.rainviewer.com${latest.path}/256/{z}/{x}/{y}/2/1_1.png`, {
                                    tileSize: 256,
                                    opacity: 0.65,
                                    attribution: 'Radar © RainViewer'
                                }).addTo(map);
                            }
                        }).catch(e => console.log("RainViewer indisponível", e));

                    mapInstanceRef.current = map;
                }
                if (mapOpen && mapInstanceRef.current) {
                    setTimeout(() => mapInstanceRef.current?.invalidateSize(), 100);
                }
                if (!mapOpen && mapInstanceRef.current) {
                    mapInstanceRef.current.remove();
                    mapInstanceRef.current = null;
                }
            }, [mapOpen]);

            React.useEffect(() => {
                return () => {
                    if (mapInstanceRef.current) { mapInstanceRef.current.remove(); mapInstanceRef.current = null; }
                    if (chartInstanceRef.current) { chartInstanceRef.current.destroy(); chartInstanceRef.current = null; }
                };
            }, []);

            React.useEffect(() => {
                if (!chartOpen || !chartRef.current) return;
                if (chartInstanceRef.current) { chartInstanceRef.current.destroy(); chartInstanceRef.current = null; }
                const ctx = chartRef.current.getContext("2d");
                chartInstanceRef.current = new Chart(ctx, {
                    type: "line",
                    data: {
                        labels: ["00:00", "03:00", "06:00", "09:00", "12:00", "15:00", "18:00", "Atual"],
                        datasets: [{
                            label: "Cota do Rio Sarapuí (m)",
                            data: [0.8, 0.9, 0.85, 0.92, 1.1, 1.0, 0.95, liveWeather ? 0.9 + Number(liveWeather.precipitation || 0) * 0.2 : 0.9],
                            borderColor: "#06b6d4", backgroundColor: "rgba(6, 182, 212, 0.1)", borderWidth: 2, fill: true, tension: 0.3
                        }]
                    },
                    options: {
                        responsive: true, maintainAspectRatio: false,
                        scales: {
                            y: { beginAtZero: true, max: 4, grid: { color: "rgba(148, 163, 184, 0.1)" }, ticks: { color: "#94a3b8", font: { family: "monospace", size: 10 } } },
                            x: { grid: { color: "rgba(148, 163, 184, 0.1)" }, ticks: { color: "#94a3b8", font: { family: "monospace", size: 10 } } }
                        },
                        plugins: { legend: { labels: { color: "#e2e8f0", font: { family: "monospace", size: 11 } } } }
                    }
                });
            }, [chartOpen, liveWeather]);

            const toggleListening = () => {
                const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
                if (!SpeechRec) { alert("Reconhecimento de voz não suportado."); return; }
                if (isListening) { setIsListening(false); return; }
                const rec = new SpeechRec();
                rec.lang = "pt-BR"; rec.interimResults = false; rec.continuous = false;
                rec.onstart = () => setIsListening(true);
                rec.onresult = (e) => { const t = e.results[0][0].transcript; setInput(t); setIsListening(false); handleSendMessage(t); };
                rec.onerror = () => setIsListening(false);
                rec.onend = () => setIsListening(false);
                rec.start();
            };

            const handleSendMessage = async (textCustom) => {
                stopSpeaking();
                const textToSend = textCustom !== undefined ? textCustom : input;
                if (!textToSend.trim() || isLoadingChat) return;

                const userMsg = { id: `${Date.now()}-user`, sender: "user", text: textToSend.trim(), timestamp: new Date().toLocaleTimeString("pt-BR", { hour: "2-digit", minute: "2-digit" }) };
                const history = [...messages, userMsg].slice(-8).map(m => ({ role: m.sender === "user" ? "user" : "assistant", content: m.text }));

                setMessages(prev => [...prev, userMsg]);
                setInput("");
                setIsLoadingChat(true);

                // Contexto dinâmico injetado para a SARAH AI
                const weatherContext = liveWeather
                    ? `Dados meteorológicos em tempo real (Open-Meteo) para Mesquita/RJ: Temperatura ${liveWeather.temperature_2m}°C, Umidade ${liveWeather.relative_humidity_2m}%, Precipitação ${liveWeather.precipitation} mm, Vento ${liveWeather.wind_speed_10m} km/h.`
                    : "Dados meteorológicos temporariamente indisponíveis.";

                try {
                    const res = await fetch(CLOUDFLARE_WORKER_URL, {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({
                            model: "llama-3.3-70b-versatile",
                            messages: [
                                { role: "system", content: `Você é a SARAH AI Core v4.0, assistente de monitoramento preventivo, telemetria e Defesa Civil da Bacia do Rio Sarapuí em Mesquita/RJ. ${weatherContext}\nResponda de forma clara, objetiva e responsável em português do Brasil. Em caso de risco, oriente acionar o 199.` },
                                ...history
                            ],
                            temperature: 0.6, max_tokens: 900
                        })
                    });
                    const data = await res.json();
                    const reply = data?.choices?.[0]?.message?.content || data?.message || data?.reply;
                    if (!reply) throw new Error("Sem resposta do agente.");

                    const aiMsg = { id: `${Date.now()}-assistant`, sender: "sarah", text: reply, timestamp: new Date().toLocaleTimeString("pt-BR", { hour: "2-digit", minute: "2-digit" }) };
                    setMessages(prev => [...prev, aiMsg]);
                    speakText(reply);
                } catch (e) {
                    const fallback = "Não foi possível conectar ao agente de inteligência artificial através do cofre seguro.";
                    setMessages(prev => [...prev, { id: `${Date.now()}-error`, sender: "sarah", text: fallback, timestamp: new Date().toLocaleTimeString("pt-BR", { hour: "2-digit", minute: "2-digit" }) }]);
                    speakText(fallback);
                } finally {
                    setIsLoadingChat(false);
                }
            };

            return (
                <div className={`min-h-screen ${darkMode ? "bg-slate-950 text-slate-100" : "bg-slate-100 text-slate-900"} flex flex-col transition-colors duration-300`}>
                    
                    {!termsAccepted && (
                        <div className="fixed inset-0 bg-slate-950/90 backdrop-blur-md z-50 flex items-center justify-center p-4">
                            <div className="bg-slate-900 border border-cyan-500/40 w-full max-w-lg rounded-3xl shadow-2xl overflow-hidden flex flex-col max-h-[90vh]">
                                <div className="bg-slate-950 px-6 py-4 border-b border-slate-800 flex items-center justify-between">
                                    <h3 className="font-mono text-cyan-400 text-sm font-bold">🛡️ Termo de Responsabilidade • LGPD</h3>
                                    <span className="text-xs font-mono text-slate-500">v4.0</span>
                                </div>
                                <div className="p-6 overflow-y-auto space-y-4 text-xs text-slate-300 font-sans leading-relaxed">
                                    <p className="font-mono text-slate-200">Bem-vindo ao <strong>SARAH AI Core v4.0</strong>. Em conformidade com a LGPD (Lei nº 13.709/2018):</p>
                                    <div className="space-y-3 bg-slate-950/60 p-4 rounded-xl border border-slate-800 font-mono">
                                        <div><span className="text-cyan-400 font-bold">1. Tratamento Local:</span> Privacidade garantida com foco em processamento local e seguro.</div>
                                        <div><span className="text-cyan-400 font-bold">2. Finalidade Comunitária:</span> Uso estrito para telemetria do Rio Sarapuí e Defesa Civil (Sebinho/Mesquita).</div>
                                        <div><span className="text-cyan-400 font-bold">3. Segurança:</span> Observância rigorosa de proteção de dados dos titulares.</div>
                                    </div>
                                    <div className="space-y-2.5 pt-2 border-t border-slate-800">
                                        <label className="flex items-start gap-2.5 cursor-pointer">
                                            <input type="checkbox" checked={check1} onChange={e => setCheck1(e.                                        <label className="flex items-start gap-2.5 cursor-pointer">
                                            <input type="checkbox" checked={check2} onChange={e => setCheck2(e.target.checked)} className="mt-0.5 w-4 h-4 rounded border-slate-700 bg-slate-950 text-cyan-500"/>
                                            <span className="text-[11px] text-slate-300">Autorizo o uso de geolocalização e monitoramento preventivo comunitário.</span>
                                        </label>
                                    </div>
                                </div>
                                <div className="bg-slate-950 px-6 py-4 border-t border-slate-800 flex justify-end">
                                    <button disabled={!check1 || !check2} onClick={() => { setTermsAccepted(true); localStorage.setItem("sarah_terms_accepted", "1"); }} className="w-full py-3 bg-cyan-500 hover:bg-cyan-400 text-slate-950 font-mono text-xs font-bold rounded-xl transition disabled:opacity-40">
                                        Aceitar e Acessar SARAH AI
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                    <div className="flex-1 flex flex-col">
                        <header className="bg-white dark:bg-slate-900 border-b border-slate-200 dark:border-slate-800 px-4 py-3 sticky top-0 z-40 shadow-sm">
                            <div className="max-w-4xl mx-auto flex items-center justify-between gap-2">
                                <div className="flex items-center gap-3">
                                    <div className="w-10 h-10 rounded-xl bg-cyan-500/10 border border-cyan-500/20 flex items-center justify-center text-cyan-600 dark:text-cyan-400 text-lg shadow-sm">🛡️</div>
                                    <div>
                                        <h1 className="text-sm font-bold text-slate-900 dark:text-slate-100 font-sans tracking-tight">Projeto Cidadão Sensor</h1>
                                        <div className="flex items-center gap-1.5 flex-wrap mt-0.5">
                                            <span className="px-1.5 py-0.5 bg-cyan-50 dark:bg-cyan-950/60 border border-cyan-500/30 text-cyan-700 dark:text-cyan-300 rounded font-mono text-[10px] font-bold">SARAH AI</span>
                                            <span className="text-[11px] text-slate-500 dark:text-slate-400 font-mono">Mesquita - RJ • Sebinho</span>
                                        </div>
                                    </div>
                                </div>
                                <div className="flex items-center gap-2">
                                    <button onClick={handleShareLink} className="w-9 h-9 rounded-full bg-slate-100 dark:bg-slate-800 hover:bg-slate-700 border border-slate-700 flex items-center justify-center text-slate-300 transition" title="Compartilhar">🔗</button>
                                    <button onClick={() => alert("Cofre seguro ativo via Cloudflare Worker.")} className="w-9 h-9 rounded-full bg-slate-100 dark:bg-slate-800 hover:bg-slate-700 border border-slate-700 flex items-center justify-center text-amber-500 transition" title="Cofre">🔑</button>
                                    <button onClick={() => setDarkMode(v => !v)} className="w-9 h-9 rounded-full bg-slate-100 dark:bg-slate-800 hover:bg-slate-700 border border-slate-700 flex items-center justify-center text-amber-500 dark:text-cyan-400 transition" title="Tema">{darkMode ? "☀️" : "🌙"}</button>
                                </div>
                            </div>
                        </header>

                        <div className="bg-slate-900/60 border-b border-slate-800 px-4 py-2 text-xs font-mono text-slate-400 flex flex-wrap items-center justify-between gap-2 max-w-4xl mx-auto w-full">
                            <div className="flex items-center gap-3">
                                <span className="flex items-center gap-1 text-cyan-400">
                                    <span className="w-2 h-2 rounded-full bg-cyan-400 animate-pulse"></span> Open-Meteo & RainViewer Ativos
                                </span>
                                {liveWeather && (
                                    <span className="hidden sm:inline text-slate-300">
                                        🌡️ {liveWeather.temperature_2m}°C | 💧 {liveWeather.relative_humidity_2m}% | 🌧️ {liveWeather.precipitation} mm | 💨 {liveWeather.wind_speed_10m} km/h
                                    </span>
                                )}
                            </div>
                            <div className="flex items-center gap-3">
                                <button onClick={isSpeaking ? stopSpeaking : () => setSoundEnabled(v => !v)} className={`px-2.5 py-1 rounded text-xs font-mono border ${isSpeaking ? "bg-amber-500/20 text-amber-300 border-amber-500/40 animate-pulse" : soundEnabled ? "bg-cyan-500/20 text-cyan-400 border-cyan-500/30" : "bg-slate-800 text-slate-500 border-slate-700"}`}>
                                    {isSpeaking ? "⏹ Parar fala" : soundEnabled ? "🔊 Voz ativa" : "🔇 Voz desligada"}
                                </button>
                                <button onClick={() => setTermsOpen(true)} className="text-cyan-400 hover:underline text-[11px]">Termos LGPD</button>
                            </div>
                        </div>

                        <main className="max-w-4xl mx-auto p-3 sm:p-4 w-full flex-1 flex flex-col">
                            <div className="bg-slate-900/80 border border-cyan-500/30 rounded-xl shadow-xl flex flex-col overflow-hidden backdrop-blur-md flex-1" style={{ minHeight: "450px" }}>
                                <div className="flex-1 overflow-y-auto p-4 space-y-4">
                                    {messages.length === 0 && (
                                        <div className="h-full flex flex-col items-center justify-center p-4 my-auto">
                                            <div className="w-full max-w-md bg-slate-900/90 border border-cyan-500/30 rounded-3xl p-6 shadow-2xl flex flex-col items-center text-center backdrop-blur-md">
                                                <div className="relative mb-4"><SarahAvatar showStatus={true} isLarge={true} /></div>
                                                <h2 className="font-mono text-lg font-bold text-slate-100 tracking-wide mb-2">SARAH • Sebinho AI</h2>
                                                <div className="px-4 py-1.5 bg-cyan-950/60 border border-cyan-500/40 rounded-full text-cyan-300 font-mono text-xs mb-6">Radar ao vivo e telemetria ativados.</div>
                                                <div className="w-full space-y-2.5">
                                                    <button onClick={() => setMapOpen(true)} className="w-full py-2.5 px-4 bg-cyan-500/10 hover:bg-cyan-500/20 border border-cyan-500/30 text-cyan-300 rounded-xl text-xs font-mono transition flex items-center justify-center gap-2">
                                                        <span>🗺️</span> Abrir Mapa com Radar (RainViewer)
                                                    </button>
                                                    <button onClick={() => setChartOpen(true)} className="w-full py-2.5 px-4 bg-cyan-500/10 hover:bg-cyan-500/20 border border-cyan-500/30 text-cyan-300 rounded-xl text-xs font-mono transition flex items-center justify-center gap-2">
                                                        <span>📈</span> Abrir Gráfico do Rio Sarapuí
                                                    </button>
                                                </div>
                                            </div>
                                        </div>
                                    )}

                                    {messages.map(m => (
                                        <div key={m.id} className={`flex items-start gap-3 ${m.sender === "user" ? "flex-row-reverse" : "flex-row"}`}>
                                            {m.sender === "user" ? <div className="w-9 h-9 rounded-xl flex items-center justify-center shrink-0 shadow-md bg-slate-700 text-cyan-300">👤</div> : <SarahAvatar size="w-9 h-9" showStatus={false} />}
                                            <div className={`p-3.5 rounded-2xl max-w-[85%] leading-relaxed shadow-md font-sans ${m.sender === "user" ? "bg-cyan-600 text-white rounded-tr-none" : "bg-slate-800/90 text-slate-100 border border-slate-700/60 rounded-tl-none"}`}>
                                                <div className="flex items-center justify-between gap-4 mb-1 text-[10px] opacity-75 font-mono">
                                                    <span>{m.sender === "user" ? "Você" : "SARAH AI"}</span>
                                                    <span>{m.timestamp}</span>
                                                </div>
                                                <div className="whitespace-pre-wrap break-words">{m.text}</div>
                                            </div>
                                        </div>
                                    ))}

                                    {isLoadingChat && (
                                        <div className="flex items-center gap-3">
                                            <SarahAvatar size="w-9 h-9" showStatus={false} />
                                            <div className="bg-slate-800 p-3 rounded-2xl text-xs font-mono text-cyan-400 animate-pulse border border-cyan-500/30">SARAH está processando...</div>
                                        </div>
                                    )}
                                </div>

                                <div className="p-3 bg-slate-950/95 border-t border-slate-800">
                                    <div className="w-full bg-slate-950 border border-cyan-500/30 rounded-3xl p-3 shadow-2xl flex flex-col gap-2 font-mono">
                                        <div className="flex items-center justify-between px-2 text-[10px] text-cyan-400">
                                            <span className="flex items-center gap-1.5 bg-cyan-950/80 px-2 py-0.5 rounded-full border border-cyan-500/30">
                                                <span className="w-1.5 h-1.5 rounded-full bg-cyan-400 animate-pulse"></span> Live Voice Mode
                                            </span>
                                            <span className="text-slate-500">48kHz</span>
                                        </div>
                                        <div className="flex items-center gap-3 bg-slate-900/90 border border-slate-800 rounded-2xl p-2 relative">
                                            <button onClick={toggleListening} className={`w-12 h-12 rounded-full flex items-center justify-center shrink-0 transition shadow-lg ${isListening ? "bg-cyan-500 text-slate-950 border-2 border-cyan-300 animate-pulse" : "bg-slate-950 hover:bg-slate-800 text-cyan-400 border border-cyan-500/30"}`} title="Mic">🎤</button>
                                            <div className="flex-1 flex flex-col justify-center">
                                                <input type="text" value={input} onChange={e => setInput(e.target.value)} onKeyDown={e => { if (e.key === "Enter") handleSendMessage(); }} placeholder="Fale ou digite..." className="w-full bg-transparent text-slate-100 text-sm font-sans focus:outline-none placeholder-slate-500 px-1"/>
                                            </div>
                                            <button onClick={() => handleSendMessage()} disabled={isLoadingChat || !input.trim()} className="w-11 h-11 rounded-full bg-cyan-500 hover:bg-cyan-400 text-slate-950 flex items-center justify-center transition shadow-lg shrink-0 disabled:opacity-40" title="Enviar">
                                                <svg className="w-5 h-5 translate-x-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2.5" d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z"></path></svg>
                                            </button>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </main>
                    </div>

                    {/* Modal do Mapa com RainViewer */}
                    {mapOpen && (
                        <div className="fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-50 flex items-center justify-center p-4">
                            <div className="bg-slate-900 border border-cyan-500/40 w-full max-w-2xl rounded-2xl shadow-2xl overflow-hidden">
                                <div className="bg-slate-950 px-4 py-3 border-b border-slate-800 flex justify-between items-center">
                                    <h3 className="font-mono text-cyan-400 text-sm font-bold">🗺️ Radar ao Vivo (RainViewer) & Sebinho</h3>
                                    <button onClick={() => setMapOpen(false)} className="text-slate-400 hover:text-white font-mono text-sm px-2 py-1 rounded bg-slate-800">✕ Fechar</button>
                                </div>
                                <div className="p-4 bg-slate-900">
                                    <div ref={mapRef} className="w-full h-80 rounded-xl border border-cyan-500/30"></div>
                                    <p className="text-xs text-slate-400 font-mono mt-3">📍 Camada de chuva em tempo real via RainViewer (OpenStreetMap).</p>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* Modal do Gráfico */}
                    {chartOpen && (
                        <div className="fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-50 flex items-center justify-center p-4">
                            <div className="bg-slate-900 border border-cyan-500/40 w-full max-w-2xl rounded-2xl shadow-2xl overflow-hidden">
                                <div className="bg-slate-950 px-4 py-3 border-b border-slate-800 flex justify-between items-center">
                                    <h3 className="font-mono text-cyan-400 text-sm font-bold">📈 Telemetria do Rio Sarapuí</h3>
                                    <button onClick={() => setChartOpen(false)} className="text-slate-400 hover:text-white font-mono text-sm px-2 py-1 rounded bg-slate-800">✕ Fechar</button>
                                </div>
                                <div className="p-4 bg-slate-900">
                                    <div className="w-full h-72"><canvas ref={chartRef}></canvas></div>
                                    <p className="text-xs text-slate-400 font-mono mt-3">📊 Simulação com base nas condições climáticas atuais.</p>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* Modal LGPD */}
                    {termsOpen && (
                        <div className="fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-50 flex items-center justify-center p-4">
                            <div className="bg-slate-900 border border-cyan-500/40 w-full max-w-xl rounded-2xl shadow-2xl overflow-hidden">
                                <div className="bg-slate-950 px-4 py-3 border-b border-slate-800 flex justify-between items-center">
                                    <h3 className="font-mono text-cyan-400 text-sm font-bold">⚖️ Conformidade LGPD</h3>
                                    <button onClick={() => setTermsOpen(false)} className="text-slate-400 hover:text-white font-mono text-sm px-2 py-1 rounded bg-slate-800">✕ Fechar</button>
                                </div>
                                <div className="p-5 bg-slate-900 text-xs text-slate-300 space-y-3 leading-relaxed font-sans">
                                    <p><strong>SARAH AI Core v4.0</strong> opera sob os preceitos da LGPD (Lei nº 13.709/2018), salvaguardando a privacidade local na Bacia do Rio Sarapuí.</p>
                                    <p>Em caso de emergência, ligue imediatamente para a Defesa Civil: <strong>199</strong>.</p>
                                </div>
                            </div>
                        </div>
                    )}

                    <footer className="bg-slate-950 border-t border-slate-900 py-4 px-4 text-center text-xs font-mono text-slate-400 space-y-1">
                        <div>Todos os direitos reservados 2024–2028 Grupo a Chave da Esperança Sebinho Mesquita RJ</div>
                        <div className="text-cyan-400 font-bold">Defesa Civil Comunitária Digital</div>
                    </footer>
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById("root")).render(<App />);
    </script>
</body>
</html>
