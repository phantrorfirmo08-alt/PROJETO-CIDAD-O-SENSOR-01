<!DOCTYPE html>
<html lang="pt-BR" class="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#030712">
<title>SARAH NEXUS v5.2 PRO</title>

<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://unpkg.com">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<style>
*{box-sizing:border-box}
body{margin:0;background:#030712;color:#e5f2ff;font-family:Arial,sans-serif}
.app{min-height:100vh;background:radial-gradient(circle at 20% 10%,#063b4d55,transparent 35%),#030712}
header{padding:18px 24px;border-bottom:1px solid #00f3ff44;display:flex;justify-content:space-between;align-items:center}
.brand{color:#00f3ff;font-weight:bold;letter-spacing:3px}.online{color:#00ff88;font-size:12px}
main{max-width:1150px;margin:auto;padding:24px;display:grid;gap:20px;grid-template-columns:290px 1fr}
.card{background:#071426dd;border:1px solid #00f3ff44;border-radius:18px;padding:20px;box-shadow:0 0 25px #00f3ff12}
.avatar{width:130px;height:130px;margin:auto;border-radius:50%;display:grid;place-items:center;background:linear-gradient(145deg,#123b55,#24134d);border:2px solid #00f3ff;box-shadow:0 0 30px #00f3ff66}
.face{font-size:64px}
.label{color:#8ba5bd;font-size:12px;text-transform:uppercase;letter-spacing:1px}
h1,h2,p{margin-top:0}
.status{color:#00ff88}
#map{height:380px;border:1px solid #00f3ff44;border-radius:14px;overflow:hidden;background:#07111d}
.leaflet-container{background:#07111d!important}
.metrics{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
.metric{padding:12px;border:1px solid #00f3ff22;border-radius:12px;background:#071426}
.value{font-size:18px;font-weight:bold;color:#00f3ff}
.actions{display:flex;gap:10px;flex-wrap:wrap}
.btn{border:1px solid #00f3ff66;background:#00f3ff12;color:#dffcff;padding:12px 16px;border-radius:10px;cursor:pointer}
.btn:hover{background:#00f3ff2b}
.danger{border-color:#ef444466;color:#ff9b9b}
.pulse{width:16px;height:16px;border-radius:50%;background:#ef4444;box-shadow:0 0 14px #ef4444}
video{width:100%;max-height:380px;display:block;border-radius:12px;background:#020617}
@media(max-width:850px){main{grid-template-columns:1fr;padding:14px}.metrics{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>
<div id="root"></div>

<script type="text/babel">
const {useEffect,useRef,useState,useCallback}=React;

const ORIGEM=[-22.82537,-43.49590];
const DESTINO=[-22.78098,-43.43628];
const CENTRO=[-22.80318,-43.46609];
const TZ="America/Sao_Paulo";

function App(){
  const [weather,setWeather]=useState(null);
  const [loading,setLoading]=useState(true);
  const [logText,setLogText]=useState("Sistema pronto para receber comandos.");
  const [videoSrc,setVideoSrc]=useState(null);
  const [videoInfo,setVideoInfo]=useState(null);
  
  const mapRef=useRef(null);
  const mapInstance=useRef(null);

  const carregarClima=useCallback(()=>{
    setLoading(true);
    const params=new URLSearchParams({
      latitude:CENTRO[0],
      longitude:CENTRO[1],
      current:"temperature_2m,relative_humidity_2m,precipitation,wind_speed_10m,wind_direction_10m",
      timezone:TZ
    });

    fetch("https://api.open-meteo.com/v1/forecast?"+params)
      .then(r=>r.json())
      .then(d=>{if(d?.current)setWeather(d.current);})
      .catch(()=>setWeather(null))
      .finally(()=>setLoading(false));
  },[]);

  useEffect(()=>{
    carregarClima();
    const t=setInterval(carregarClima,600000);
    return()=>clearInterval(t);
  },[carregarClima]);

  useEffect(()=>{
    if(!mapRef.current||mapInstance.current)return;
    const m=L.map(mapRef.current,{zoomControl:false}).setView(CENTRO,12);
    mapInstance.current=m;
    L.control.zoom({position:"bottomleft"}).addTo(m);

    L.tileLayer("https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png",{
      attribution:"© OpenStreetMap © CARTO",subdomains:"abcd",maxZoom:19
    }).addTo(m);

    L.marker(ORIGEM).addTo(m).bindPopup("<b>ORIGEM</b><br>Serra do Mendanha");
    
    const icon=L.divIcon({className:"",html:'<div class="pulse"></div>',iconSize:[16,16]});
    L.marker(DESTINO,{icon}).addTo(m).bindPopup("<b>DESTINO</b><br>Comunidade do Sebinho");

    L.polyline([ORIGEM,DESTINO],{color:"#00f3ff",weight:3,dashArray:"8 8"}).addTo(m)
     .bindPopup("Alinhamento Mendanha → Sebinho");

    L.circle(DESTINO,{radius:4000,color:"#00ff88",fillColor:"#00f3ff",fillOpacity:.08}).addTo(m);
  },[]);

  const falar=()=>{
    setLogText("Microfone ativado. Aguardando comando de voz...");
    if("speechSynthesis" in window)speechSynthesis.speak(new SpeechSynthesisUtterance("Microfone ativado. Sistema online."));
  };

  const alerta=()=>{
    setLogText("Alerta registrado no painel tático às "+new Date().toLocaleTimeString("pt-BR")+".");
  };

  const limpar=()=>{
    setLogText("Registro limpo. Sistema pronto.");
  };

  const handleVideo=(e)=>{
    const file=e.target.files[0];
    if(!file)return;
    if(!file.type.startsWith("video/")){
      setLogText("Erro: selecione um arquivo de vídeo válido.");
      return;
    }
    if(videoSrc)URL.revokeObjectURL(videoSrc);
    setVideoSrc(URL.createObjectURL(file));
    setVideoInfo({name:file.name,size:(file.size/1024/1024).toFixed(2)+" MB"});
    setLogText("Vídeo de campo carregado com sucesso.");
  };

  const removerVideo=()=>{
    if(videoSrc)URL.revokeObjectURL(videoSrc);
    setVideoSrc(null);
    setVideoInfo(null);
    setLogText("Vídeo removido.");
  };

  return (
    <div className="app">
      <header>
        <div>
          <div className="brand">SARAH NEXUS</div>
          <small style={{color:"#8ba5bd"}}>v5.2 PRO · DEFESA CIVIL COMUNITÁRIA</small>
        </div>
        <div className="online">● SISTEMA ONLINE</div>
      </header>

      <main>
        {/* Coluna Esquerda: Avatar & Status */}
        <section className="card" style={{display:"flex",flexDirection:"column",justifyContent:"space-between"}}>
          <div>
            <div className="avatar"><div className="face">👩🏻‍💻</div></div>
            <h2 style={{textAlign:"center",margin:"18px 0 5px"}}>SARAH</h2>
            <p style={{textAlign:"center"}} className="status">Núcleo operacional ativo</p>
            <hr style={{borderColor:"#ffffff18",margin:"15px 0"}}>
            
            <p className="label">Integridade</p>
            <strong style={{color:"#00ff88"}}>98% Estável</strong>
            
            <p className="label" style={{margin-top:18px}}>Conexão / Rota</p>
            <strong style={{color:"#00f3ff"}}>Mendanha ⇄ Sebinho</strong>
            
            <p className="label" style={{margin-top:18px}}>Telemetria</p>
            <strong style={{fontSize:"13px"}}>{loading?"Atualizando...":"Sincronizado"}</strong>
          </div>

          <div style={{marginTop:"20px"}}>
            <p className="label">Comando SARAH</p>
            <div className="actions" style={{marginTop:"8px",flexDirection:"column"}}>
              <button className="btn" onClick={falar}>🎙️ Ativar microfone</button>
              <button className="btn" onClick={alerta}>⚠️ Emitir alerta</button>
              <button className="btn danger" onClick={limpar}>Limpar registro</button>
            </div>
          </div>
        </section>

        {/* Coluna Direita: Mapa, Métricas e Vídeo */}
        <div style={{display:"grid",gap:"20px"}}>
          <div className="card">
            <p className="label">Painel principal</p>
            <h1>Monitoramento tático</h1>
            <div className="metrics">
              <div className="metric">
                <p className="label">Temperatura</p>
                <div className="value">{weather?Math.round(weather.temperature_2m):"--"}°C</div>
              </div>
              <div className="metric">
                <p className="label">Umidade</p>
                <div className="value">{weather?Math.round(weather.relative_humidity_2m):"--"}%</div>
              </div>
              <div className="metric">
                <p className="label">Chuva</p>
                <div className="value">{weather?Number(weather.precipitation||0).toFixed(1):"--"} mm</div>
              </div>
              <div className="metric">
                <p className="label">Vento</p>
                <div className="value">{weather?Math.round(weather.wind_speed_10m):"--"} km/h</div>
              </div>
              <div className="metric">
                <p className="label">Direção</p>
                <div className="value">{weather?Math.round(weather.wind_direction_10m||0):"--"}°</div>
              </div>
            </div>
          </div>

          <div className="card">
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:"12px"}}>
              <div>
                <p className="label">Mapa tático operacional</p>
                <h2 style={{margin:0}}>Serra do Mendanha → Sebinho</h2>
              </div>
              <span className="status">● AO VIVO</span>
            </div>
            <div id="map" ref={mapRef}></div>
          </div>

          {/* Central de Mídia Integrada */}
          <div className="card">
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:"12px"}}>
              <div>
                <p className="label">Central visual de campo</p>
                <h2 style={{margin:0}}>Núcleo de mídia SARAH</h2>
              </div>
            </div>

            <div style={{background:"#030712",padding:"10px",borderRadius:"12px",border:"1px solid #00f3ff33"}}>
              {!videoSrc?(
                <div style={{textAlign:"center",padding:"30px",color:"#8ba5bd"}}>
                  <div style={{fontSize:"32px",marginBottom:"8px"}}>▶</div>
                  <p style={{margin:0,fontSize:"14px"}}>Selecione um vídeo da galeria do telefone</p>
                  <small style={{color:"#5a738c"}}>O arquivo é processado localmente no dispositivo</small>
                </div>
              ):(
                <div>
                  <video src={videoSrc} controls playsinline></video>
                  {videoInfo&&(
                    <div style={{marginTop:"8px",display:"flex",justifyContent:"space-between",fontSize:"12px",color:"#00f3ff"}}>
                      <span>{videoInfo.name}</span>
                      <span style={{color:"#8ba5bd"}}>{videoInfo.size}</span>
                    </div>
                  )}
                </div>
              )}
            </div>

            <div style={{marginTop:"12px",display:"flex",gap:"10px",flexWrap:"wrap"}}>
              <label className="btn" style={{display:"inline-block",cursor:"pointer"}}>
                {videoSrc?"Trocar vídeo de campo":"Selecionar vídeo da galeria"}
                <input type="file" accept="video/*" style={{display:"none"}} onChange={handleVideo}/>
              </label>
              {videoSrc&&(
                <button className="btn danger" onClick={removerVideo}>Remover vídeo</button>
              )}
            </div>
          </div>

          <div className="card">
            <p className="label">Log de comandos</p>
            <p id="log" style={{margin:0,color:"#9fb4c8",fontFamily:"monospace"}}>{logText}</p>
          </div>
        </div>
      </main>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
