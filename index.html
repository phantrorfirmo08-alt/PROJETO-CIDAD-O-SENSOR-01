        let lastTouchEnd = 0;
        document.addEventListener('touchend', function(e) {
            const now = (new Date()).getTime();
            if (now - lastTouchEnd <= 300) { e.preventDefault(); }
            lastTouchEnd = now;

        let globalVoiceProfile = localStorage.getItem("raru_sarah_voice_profile") || "oficial";

        function falarSarah(texto, customProfile = null) {
            if (!("speechSynthesis" in window)) return;
            try {
                window.speechSynthesis.cancel();
                const cleanText = String(texto).replace(/([\u2700-\u27BF]|[\uE000-\uF8FF]|\uD83C[\uDC00-\uDFFF]|\uD83D[\uDC00-\uDFFF]|[\u2011-\u26FF]|\uD83E[\uDD00-\uDDFF])/g, '').replace(/https?:\/\/\S+/g, "").trim();
                if (!cleanText) return;
                
                const utterance = new SpeechSynthesisUtterance(cleanText);
                utterance.lang = "pt-BR";
                
                const prof = customProfile || globalVoiceProfile;
                if (prof === 'humana') {
                    utterance.rate = 1.0;
                    utterance.pitch = 1.25;
                } else {
                    utterance.rate = 1.02;
                    utterance.pitch = 1.05;
                }

                const voices = window.speechSynthesis.getVoices();
                const selectedVoice = voices.find(v => v.lang.toLowerCase().includes('pt-br') && v.name.toLowerCase().includes('female')) || voices.find(v => v.lang.toLowerCase().includes('pt')) || voices[0];
                if (selectedVoice) utterance.voice = selectedVoice;
                window.speechSynthesis.speak(utterance);
            } catch(e) {}
        }

        function playChameleonSound() {
            try {
                const AudioCtx = window.AudioContext || window.webkitAudioContext;
                if (!AudioCtx) return;
                const ctx = new AudioCtx();
                if (ctx.state === 'suspended') ctx.resume();
                const bufferSize = ctx.sampleRate * 1.2;
                const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
                const data = buffer.getChannelData(0);
                for (let i = 0; i < bufferSize; i++) { data[i] = (Math.random() * 2 - 1) * Math.sin(i / 800); }
                const noiseSource = ctx.createBufferSource();
                noiseSource.buffer = buffer;
                const filter = ctx.createBiquadFilter();
                filter.type = 'lowpass';
                filter.frequency.setValueAtTime(350, ctx.currentTime);
                filter.frequency.exponentialRampToValueAtTime(120, ctx.currentTime + 1.2);
                const gainNode = ctx.createGain();
                gainNode.gain.setValueAtTime(0.8, ctx.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 1.2);
                noiseSource.connect(filter); filter.connect(gainNode); gainNode.connect(ctx.destination);
                noiseSource.start();
            } catch (e) {}
        }

        function VistoriaRARU_NEXUS({ onBackToDashboard, showToast }) {
            const [mun, setMun] = React.useState(MUNICIPIOS_92.find(m => m.n === 'Mesquita') || MUNICIPIOS_92[0]);
            const [fotos, setFotos] = React.useState([]);
            const [camOn, setCamOn] = React.useState(false);
            const [nome, setNome] = React.useState(''); 
            const [bairro, setBairro] = React.useState('');
            const [docId, setDocId] = React.useState(''); 
            const [rel, setRel] = React.useState('');
            const [gps, setGps] = React.useState({lat:0,lon:0,acc:''});
            const RISCOS_RARU = ["R1 - BAIXO / PREVENTIVO","R2 - MODERADO / ALERTA","R3 - ALTO / ENXURRADA","R4 - EVACUACAO PREVENTIVA","RH - CONVERGENCIA SERRAS","RE - ESTRUTURAL / TALUDE"];
            const [risco, setRisco] = React.useState(RISCOS_RARU[1]);
            const ORGAOS_RARU_NEXUS = ["Universidades e Pesquisadores","CEMADEN / INPE","CRAS / CREAS - Baixada","SUS / Vigilancia Saude","Defesa Civil Municipal","NUPDECs - 92 Municipios","Cidadao Sensor","A Chave da Esperanca","Cidadao Direto"];
            const [org, setOrg] = React.useState(ORGAOS_RARU_NEXUS[4]);
            const [protAtual, setProtAtual] = React.useState(null);
            const videoRef = React.useRef(null); 
            const streamRef = React.useRef(null);
            const toast = m => { if(typeof showToast==='function') showToast(m); };

            const atualizarGPS = () => {
                if(!navigator.geolocation) return;
                navigator.geolocation.getCurrentPosition(p=>{
                  setGps({lat:p.coords.latitude,lon:p.coords.longitude,acc:Math.round(p.coords.accuracy)});
                  setMun(m=>({...m,lat:p.coords.latitude,lon:p.coords.longitude}));
                  toast(`GPS ${Math.round(p.coords.accuracy)}m OK`);
                },()=>{}, {enableHighAccuracy:true,timeout:5000});
            };

            const startCam = async () => {
                try{
                  const s = await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:"environment"}}});
                  streamRef.current=s; setCamOn(true);
                  setTimeout(()=>{if(videoRef.current){videoRef.current.srcObject=s; videoRef.current.play().catch(()=>{})}},100);
                  atualizarGPS();
                }catch{toast('Camera bloqueada')}
            };
            const stopCam = () => { if(streamRef.current)streamRef.current.getTracks().forEach(t=>t.stop()); setCamOn(false); };

            const capturar = () => {
                const v=videoRef.current; if(!v)return;
                const c=document.createElement('canvas'); 
                c.width=400; 
                c.height=Math.round(400*(v.videoHeight/v.videoWidth));
                const ctx=c.getContext('2d'); 
                ctx.drawImage(v,0,0,c.width,c.height);
                
                ctx.fillStyle='rgba(1,8,20,0.85)'; 
                ctx.fillRect(0,c.height-45,c.width,45);
                ctx.fillStyle='#00F2FE'; 
                ctx.font='bold 7px monospace';
                ctx.fillText(`${new Date().toLocaleString('pt-BR')} | ${(gps.lat||mun.lat).toFixed(5)},${(gps.lon||mun.lon).toFixed(5)}`,5,c.height-28);
                ctx.fillText(`${(nome||'CIDADÃO').slice(0,20)} | ${mun.n}-${(bairro||'BAIRRO').slice(0,15)} | ${risco}`,5,c.height-10);
                
                const url=c.toDataURL('image/jpeg',0.40); 
                setFotos(p=>p.length<4?[...p,url]:p);
                
                const a=document.createElement('a'); 
                a.href=url; 
                a.download=`RARU_${Date.now()}.jpg`; 
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                
                toast('📸 Foto capturada e salva!');
            };

            const sha256 = async (str) => {
                const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(str));
                return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, '0')).join('');
            };

            const gerarDados = async () => {
                if(!nome){ toast('Informe o responsável'); return null; }
                if(!bairro){ toast('Informe o bairro'); return null; }
                const seq = Math.floor(Math.random() * 8999 + 1000);
                const sig = mun.n.slice(0, 3).toUpperCase();
                const prot = `PROT-RARU-${sig}-2026-${seq}`;
                const hash = await sha256(`${prot}-${Date.now()}`);
                setProtAtual(prot);
                return { protocolo: prot, hash };
            };

            const gerarPDF = async () => {
                const dados = await gerarDados(); if(!dados) return;
                const { jsPDF } = window.jspdf;
                const doc = new jsPDF();
                doc.setFillColor(1, 8, 20);
                doc.rect(0, 0, 210, 297, 'F');
                doc.setTextColor(0, 242, 254);
                doc.text(`LAUDO RARU - ${dados.protocolo}`, 14, 18);
                doc.setTextColor(255, 255, 255);
                doc.text(`Responsavel: ${nome}`, 14, 36);
                doc.text(`Bairro: ${bairro}`, 14, 42);
                doc.text(`Risco: ${risco}`, 14, 48);
                doc.text(`Orgao: ${org}`, 14, 54);
                doc.text(doc.splitTextToSize(rel || 'Sem relato adicional.', 182), 14, 70);
                let y = 100;
                fotos.forEach((f, i) => {
                    if (y > 200) { doc.addPage(); y = 20; }
                    try { doc.addImage(f, 'JPEG', 14 + (i % 2) * 90, y, 82, 46); } catch(e) {}
                    if (i % 2 === 1) y += 50;
                });
                doc.text(`HASH: ${dados.hash}`, 14, 287);
                doc.save(`RARU_${dados.protocolo}.pdf`);
                toast('📄 PDF gerado e baixado!');
            };

            const enviarWhats = async () => {
                const dados = await gerarDados(); if(!dados) return;
                const msg = `🛡️ LAUDO TÉCNICO RARU NEXUS\n📌 Protocolo: ${dados.protocolo}\n👤 Responsável: ${nome}\n📍 Local: ${mun.n} - ${bairro}\n⚠️ Classificação: ${risco}\n🏛️ Órgão: ${org}\n\n📝 Relato:\n${rel}\n\n🔒 HASH: ${dados.hash}\n\n_Rede Automatizada de Resiliência Urbana - Mesquita/RJ_`;

                if (fotos.length > 0 && navigator.canShare) {
                    try {
                        const files = await Promise.all(
                            fotos.map(async (u, idx) => {
                                const r = await fetch(u);
                                const b = await r.blob();
                                return new File([b], `RARU_${dados.protocolo}_${idx + 1}.jpg`, { type: 'image/jpeg' });
                            })
                        );
                        const shareData = { title: dados.protocolo, text: msg, files };
                        if (navigator.canShare(shareData)) {
                            await navigator.share(shareData);
                            toast('✅ Laudo e fotos enviados!');
                            return;
                        }
                    } catch(e) {}
                }

                navigator.clipboard.writeText(msg).catch(()=>{});
                window.open(`https://api.whatsapp.com/send?text=${encodeURIComponent(msg)}`, '_blank');
                toast('📋 Texto copiado e WhatsApp aberto!');
            };

            return (
                <div className="w-full space-y-3 font-mono">
                    <div className="p-4 rounded-[24px] border border-cyan-500/40 space-y-3 bg-[#010814] shadow-2xl cyber-card">
                        <div className="flex justify-between border-b border-cyan-500/30 pb-2">
                            <h3 className="text-[10px] text-cyan-400 font-black">RARU NEXUS SCAN</h3>
                            <button onClick={onBackToDashboard} className="px-2.5 py-0.5 bg-red-500/20 text-red-400 rounded-lg text-[10px] font-bold border border-red-500/30">X</button>
                        </div>
                        <select value={mun.n} onChange={e => setMun(MUNICIPIOS_92.find(m => m.n === e.target.value))} className="w-full bg-black text-cyan-400 border border-cyan-500/40 rounded-xl p-2 text-[10px] font-bold">
                            {MUNICIPIOS_92.map((m, i) => <option key={i} value={m.n}>{m.n}</option>)}
                        </select>
                        <div className="bg-black border border-cyan-500/30 rounded-xl p-2.5">
                            <div className="flex justify-between">
                                <span className="text-[9px] text-cyan-400 font-bold">CÂMERA DE VISTORIA</span>
                                {!camOn ?
                                    <button onClick={startCam} className="px-2.5 py-0.5 bg-cyan-400/20 border border-cyan-400 text-cyan-400 rounded-lg text-[9px] font-bold">Ligar</button> :
                                    <button onClick={stopCam} className="px-2.5 py-0.5 bg-red-400/20 border border-red-400 text-red-400 rounded-lg text-[9px] font-bold">Desligar</button>
                                }
                            </div>
                            <div className="mt-2 bg-black rounded-xl overflow-hidden border border-cyan-500/30 relative" style={{ minHeight: '180px' }}>
                                <video ref={videoRef} autoPlay playsInline muted style={{ width: '100%', height: '180px', objectFit: 'cover', display: camOn ? 'block' : 'none' }} />
                                {!camOn && <div className="h-[180px] grid place-items-center text-gray-500 text-xs">Toque em Ligar Câmera</div>}
                                {camOn && (
                                    <div className="absolute inset-0 pointer-events-none">
                                        <div className="absolute top-0 left-0 right-0 h-[2px] bg-cyan-400 animate-raru-scan" />
                                        <div className="absolute top-2 left-2 text-[7px] text-cyan-400 bg-black/60 px-1 rounded border border-cyan-400/30">GPS: {gps.lat ? 'FIXO' : 'BUSCANDO'}</div>
                                    </div>
                                )}
                            </div>
                            {camOn && <button onClick={capturar} className="w-full mt-2 py-2.5 bg-green-400 text-black font-black rounded-xl text-xs cursor-pointer shadow-md">📸 ESCANEAR FOTO</button>}
                            {fotos.length > 0 && (
                                <div className="flex gap-2 overflow-x-auto mt-2">
                                    {fotos.map((f, i) => (
                                        <div key={i} className="relative shrink-0">
                                            <img src={f} className="w-16 h-16 rounded-lg border border-cyan-400/40 object-cover" />
                                            <div className="absolute -top-1 -right-1 bg-red-500 text-white rounded-full w-4 h-4 grid place-items-center text-[9px] font-bold cursor-pointer" onClick={() => setFotos(fotos.filter((_, idx) => idx !== i))}>x</div>
                                        </div>
                                    ))}
                                </div>
                            )}
                        </div>
                        <div className="space-y-2">
                            <div className="grid grid-cols-2 gap-2">
                                <input value={nome} onChange={e => setNome(e.target.value)} placeholder="Responsável *" className="bg-black border border-cyan-500/30 rounded-xl p-2.5 text-xs text-white" />
                                <input value={docId} onChange={e => setDocId(e.target.value)} placeholder="CPF" className="bg-black border border-cyan-500/30 rounded-xl p-2.5 text-xs text-white" />
                            </div>
                            <div className="grid grid-cols-2 gap-2">
                                <select value={risco} onChange={e => setRisco(e.target.value)} className="bg-black border border-cyan-500/30 rounded-xl p-2.5 text-[9px] text-cyan-400 font-bold">

                            <textarea value={rel} onChange={e => setRel(e.target.value)} rows="3" placeholder="Relato técnico..." className="w-full bg-black border border-cyan-500/30 rounded-xl p-2.5 text-xs text-white resize-none" />

                                <div className="space-y-0.5">
                                    <h2 className="font-display text-xs font-black text-white tracking-widest uppercase">RARU NEXUS AI V11 Plus</h2>
                                    <p className="text-[8px] text-cyberCyan font-bold uppercase">TERMO LGPD &amp; GPS</p>
                                </div>
                                <div className="bg-commandPanel/90 border border-cyberCyan/30 rounded-xl p-3 text-left text-[9px] text-slate-200 leading-relaxed space-y-1 shadow-inner">
                                    <p>O GPS é utilizado obrigatoriamente para fixar coordenadas precisas em vistorias.</p>
                                    <p className="text-cyberCyan font-bold">NÃO COLETAMOS DADOS PESSOAIS SENSÍVEIS (LGPD).</p>
                                </div>
                                <div className="space-y-1.5 pt-0.5 text-left">
                                    <label className="flex items-start gap-2 cursor-pointer text-[9px] text-slate-200 bg-commandPanel/80 p-2.5 rounded-lg border border-cyberCyan/30">
                                        <input type="checkbox" checked={check1} onChange={(e) => setCheck1(e.target.checked)} className="mt-0.5 rounded text-cyberCyan w-3.5 h-3.5 bg-void cursor-pointer shrink-0" />
                                        <span>Aceito os termos da LGPD.</span>
                                    </label>
                                    <label className="flex items-start gap-2 cursor-pointer text-[9px] text-slate-200 bg-commandPanel/80 p-2.5 rounded-lg border border-cyberCyan/30">
                                        <input type="checkbox" checked={check2} onChange={(e) => setCheck2(e.target.checked)} className="mt-0.5 rounded text-cyberCyan w-3.5 h-3.5 bg-void cursor-pointer shrink-0" />
                                        <span>Autorizo o uso do GPS para vistorias.</span>
                                    </label>
                                </div>
                                <button disabled={!check1 || !check2} onClick={() => { setTermsAccepted(true); try{localStorage.setItem("raru_cyber_terms","1");}catch(e){} showToast("🚀 V11 Plus Ativada!"); }} className={`w-full py-3 rounded-xl font-display font-black text-[10px] uppercase tracking-wider transition shadow-2xl touch-manipulation ${check1 && check2 ? 'cyber-button cursor-pointer' : 'bg-commandPanel text-slate-500 cursor-not-allowed'}`}>
                                    CONCORDAR E INICIAR
                                </button>
                            </div>
                        </div>
                    )}

                    <header className="cyber-card sticky top-0 z-30 w-full px-3 py-2 border-b border-cyberCyan/40 flex items-center justify-between shadow-lg rounded-b-xl">
                        <div className="flex items-center gap-2">
                            <div className="w-8 h-8 overflow-hidden shrink-0">
                                <SarahAnimatedAvatar isSpeaking={isSpeaking} sizeClass="w-full h-full" />
                            </div>
                            <div>
                                <h1 className="font-display text-[9px] font-black text-white tracking-[0.05em]">RARU NEXUS Plus</h1>
                                <p className="text-[7px] text-cyberCyan font-mono font-bold tracking-wider uppercase">
                                    {isCommandHUDActive ? "📺 HUD 360°" : chameleonActive ? "🦎 CAMALEÃO" : "Mesquita - RJ"}
                                </p>
                            </div>
                        </div>
                        <div className="flex items-center gap-1">
                            <button onClick={toggleCommandHUD} className={`px-2 py-1 rounded-lg border text-[8px] font-black cursor-pointer transition touch-manipulation ${isCommandHUDActive ? 'bg-cyberRose text-void border-cyberRose animate-pulse' : 'bg-cyberCyan text-void border-cyberCyan'}`}>
                                {isCommandHUDActive ? '📺 SAIR' : '📺 HUD'}
                            </button>
                            <button onClick={() => { setChameleonActive(!chameleonActive); if(!chameleonActive && soundEnabled) playChameleonSound(); }} className={`px-2 py-1 rounded-lg border text-[7px] font-bold cursor-pointer transition touch-manipulation ${chameleonActive ? 'bg-cyan-500/25 border-cyan-400 text-cyan-300' : 'bg-cyberCyan/25 border-cyberCyan text-cyberCyan'}`}>🦎 Camaleão</button>
                            <button onClick={() => setSoundEnabled(!soundEnabled)} className={`w-8 h-8 rounded-lg border flex items-center justify-center cursor-pointer transition touch-manipulation ${soundEnabled ? 'bg-cyberCyan/25 border-cyberCyan text-cyberCyan' : 'bg-commandPanel border-cyberCyan/30 text-slate-500'}`}>🔊</button>
                            <button onClick={toggleTheme} className="w-8 h-8 rounded-lg border border-cyberCyan bg-gradient-to-br from-commandPanel to-void text-cyberCyan flex items-center justify-center cursor-pointer shadow-md transition touch-manipulation">
                                <span className="text-xs font-black">{theme === 'dark' ? '🌙' : '☀️'}</span>
                            </button>
                            <button onClick={handleInstallApp} className="px-2 py-1 rounded-lg bg-gradient-to-r from-cyberCyan to-cyberBlue text-void font-display font-black text-[8px] uppercase tracking-wider flex items-center gap-0.5 cursor-pointer shadow-md touch-manipulation">
                                <span>📲</span> Instalar
                            </button>
                        </div>
                    </header>

                    <nav className="cyber-card w-full border-b border-cyberCyan/30 px-2 py-1.5 flex items-center justify-center gap-1 overflow-x-auto z-20">
                        {NAV_TABS.map(tab => (
                            <button key={tab.id} onClick={() => handleNavClick(tab.id)} className={`px-2.5 py-1.5 rounded-lg text-[9px] font-black transition cursor-pointer flex items-center gap-1 shrink-0 tracking-wider touch-manipulation ${activeTab === tab.id || (tab.id === 'alquino' && activeTab === 'alquino') || (tab.id === 'quem-somos' && quemSomosOpen) ? 'cyber-button shadow-[0_0_15px_rgba(0,242,254,0.5)]' : 'bg-commandPanel text-slate-300 border border-cyberCyan/20'}`}>
                                {tab.iconComponent} {tab.label}
                            </button>
                        ))}
                    </nav>

                    <main className="flex-1 w-full mx-auto py-3 space-y-3 pb-24 relative z-10">
                        {activeTab === 'dashboard' && <CardIdentidadeVisualRARU openShareFromApp={openShareFromApp} openSarahChat={openSarahChat} handleWhoAmIClick={handleWhoAmIClick} setActiveTab={setActiveTab} marketingTitle={marketingTitle} marketingSubtitle={marketingSubtitle} toggleCommandHUD={toggleCommandHUD} />}
                        {activeTab === 'estacao' && <EstacaoSobrevivenciaModuleV11 showToast={showToast} />}
                        {activeTab === 'alquino' && <RedeAlquinoHardwareModule onGoToDashboard={() => setActiveTab('dashboard')} showToast={showToast} />}
                        {activeTab === 'relatorio' && <VistoriaRARU_NEXUS onBackToDashboard={() => setActiveTab('dashboard')} showToast={showToast} />}
                        {activeTab === 'galeria' && <PublicVideoGallery localVideos={localVideos} onGoToDashboard={() => setActiveTab('dashboard')} />}
                        {activeTab === 'admin' && <AdminVaultModule localVideos={localVideos} setLocalVideos={setLocalVideos} marketingTitle={marketingTitle} setMarketingTitle={setMarketingTitle} marketingSubtitle={marketingSubtitle} setMarketingSubtitle={setMarketingSubtitle} showToast={showToast} onClose={() => setActiveTab('dashboard')} />}

                        <AutomatedObservatoryWidget />
                    </main>

                    {termsAccepted && <SarahFabButton onOpen={openSarahChat} isSpeaking={isSpeaking} />}
                    <NativeHydroWindRadar isOpen={radarOpen} onToggle={() => setRadarOpen(o => !o)} />
                    <SarahChatOverlay isOpen={isChatOpen} onClose={() => { setIsChatOpen(false); }} isSpeaking={isSpeaking} isProcessing={isProcessing} currentResponse={currentResponse} input={input} setInput={setInput} handleSendDirectCommand={handleSendDirectCommand} toggleListening={toggleListening} isListening={isListening} />
                    <QuemSomosModal isOpen={quemSomosOpen} onClose={() => setQuemSomosOpen(false)} />

                    <footer className="cyber-card fixed bottom-0 left-0 right-0 z-40 border-t border-cyberCyan/40 px-2 py-2 flex items-center justify-around shadow-xl backdrop-blur-2xl max-w-[480px] mx-auto rounded-t-xl">
                        {NAV_TABS.map(tab => (
                            <button key={tab.id} onClick={() => handleNavClick(tab.id)} className={`flex flex-col items-center gap-0.5 cursor-pointer transition touch-manipulation ${activeTab === tab.id ? 'text-cyberCyan scale-105' : 'text-slate-400 hover:text-white'}`}>
                                {tab.iconComponent}
                                <span className="text-[7px] font-black tracking-wider">{tab.label}</span>
                            </button>
                        ))}
                    </footer>
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
