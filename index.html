            if (!("speechSynthesis" in window)) return;
            try {
                window.speechSynthesis.cancel();
                const cleanText = String(texto).replace(/([\u2700-\u27BF]|[\uE000-\uF8FF]|\uD83C[\uDC00-\uDFFF]|\uD83D[\uDC00-\uDFFF]|[\u2011-\u26FF]|\uD83E[\uDD00-\uDDFF])/g, '').replace(/https?:\/\/\S+/g, "").trim();

                const utterance = new SpeechSynthesisUtterance(cleanText);
                utterance.lang = "pt-BR";
                
                const prof = customProfile || globalVoiceProfile;
                if (prof === 'humana') {
                    utterance.rate = 1.0;
                    utterance.pitch = 1.25;
                } else {
                    utterance.rate = 1.02;
                    utterance.pitch = 1.05;

                ctx.lineTo(440, 120);
                ctx.lineTo(440, 300);

                ctx.arc(256, 256, 120, 0, Math.PI * 2);
                ctx.strokeStyle = '#38BDF8';
                ctx.lineWidth = 6;
                ctx.stroke();

                ctx.beginPath();
                ctx.arc(256, 256, 45, 0, Math.PI * 2);
                ctx.fillStyle = '#00FF9D';

                ctx.font = '800 36px Orbitron, sans-serif';
                ctx.fillStyle = '#FFFFFF';
                ctx.textAlign = 'center';

        function playChameleonSound() {
            try {
                const AudioCtx = window.AudioContext || window.webkitAudioContext;
                if (!AudioCtx) return;
                const ctx = new AudioCtx();
                if (ctx.state === 'suspended') ctx.resume();
                const bufferSize = ctx.sampleRate * 1.2;
                const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
                const data = buffer.getChannelData(0);
                for (let i = 0; i < bufferSize; i++) { data[i] = (Math.random() * 2 - 1) * Math.sin(i / 800); }
                const noiseSource = ctx.createBufferSource();
                noiseSource.buffer = buffer;
                const filter = ctx.createBiquadFilter();
                filter.type = 'lowpass';
                filter.frequency.setValueAtTime(350, ctx.currentTime);
                filter.frequency.exponentialRampToValueAtTime(120, ctx.currentTime + 1.2);
                const gainNode = ctx.createGain();
                gainNode.gain.setValueAtTime(0.8, ctx.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 1.2);
                noiseSource.connect(filter); filter.connect(gainNode); gainNode.connect(ctx.destination);
                noiseSource.start();
            } catch (e) {}
        }

        // VISTORIA DE CAMPO COM LAUDO EXTENDIDO (~4.500 CARACTERES / MAX_TOKENS: 1000)
        function VistoriaRARU_NEXUS({ onBackToDashboard, showToast }) {
            const [mun, setMun] = useState(MUNICIPIOS_92[4]);
            const [fotos, setFotos] = useState([]);
            const [camOn, setCamOn] = useState(false);
            const [nome, setNome] = useState(''); 
            const [bairro, setBairro] = useState('');
            const [docId, setDocId] = useState(''); 
            const [rel, setRel] = useState('');
            const [gps, setGps] = useState({lat:0,lon:0,acc:''});
            const [isAiAnalyzing, setIsAiAnalyzing] = useState(false);

            const RISCOS_RARU = ["R1 - BAIXO / PREVENTIVO","R2 - MODERADO / ALERTA","R3 - ALTO / ENXURRADA","R4 - EVACUACAO PREVENTIVA","RH - CONVERGENCIA SERRAS","RE - ESTRUTURAL / TALUDE"];
            const [risco, setRisco] = useState(RISCOS_RARU[1]);
            const ORGAOS_RARU_NEXUS = ["Universidades e Pesquisadores","CEMADEN / INPE","CRAS / CREAS - Baixada","SUS / Vigilancia Saude","Defesa Civil Municipal","NUPDECs - 92 Municipios","Cidadao Sensor","A Chave da Esperanca","Cidadao Direto"];
            const [org, setOrg] = useState(ORGAOS_RARU_NEXUS[4]);
            const [protAtual, setProtAtual] = useState(null);
            
            const videoRef = useRef(null); 
            const streamRef = useRef(null);

            const atualizarGPS = () => {
                if(!navigator.geolocation) return;
                navigator.geolocation.getCurrentPosition(p=>{
                  setGps({lat:p.coords.latitude,lon:p.coords.longitude,acc:Math.round(p.coords.accuracy)});
                  setMun(m=>({...m,lat:p.coords.latitude,lon:p.coords.longitude}));
                  showToast(`GPS ${Math.round(p.coords.accuracy)}m OK`);
                },()=>{}, {enableHighAccuracy:true,timeout:5000});
            };

            const startCam = async () => {
                try{
                  const s = await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:"environment"}}});
                  streamRef.current=s; setCamOn(true);
                  setTimeout(()=>{if(videoRef.current){videoRef.current.srcObject=s; videoRef.current.play().catch(()=>{})}},100);
                  atualizarGPS();
                }catch{showToast('Câmera bloqueada ou indisponível')}
            };
            const stopCam = () => { if(streamRef.current)streamRef.current.getTracks().forEach(t=>t.stop()); setCamOn(false); };

            const capturar = () => {
                const v=videoRef.current; if(!v)return;
                const c=document.createElement('canvas'); 
                c.width=400; 
                c.height=Math.round(400*(v.videoHeight/v.videoWidth));
                const ctx=c.getContext('2d'); 
                ctx.drawImage(v,0,0,c.width,c.height);
                
                ctx.fillStyle='rgba(3,7,18,0.85)'; 
                ctx.fillRect(0,c.height-45,c.width,45);
                ctx.fillStyle='#00F2FE'; 
                ctx.font='bold 8px monospace';
                ctx.fillText(`${new Date().toLocaleString('pt-BR')} | ${(gps.lat||mun.lat).toFixed(5)},${(gps.lon||mun.lon).toFixed(5)}`,5,c.height-28);
                ctx.fillText(`${(nome||'CIDADÃO').slice(0,20)} | ${mun.n}-${(bairro||'BAIRRO').slice(0,15)} | ${risco}`,5,c.height-10);
                
                const url=c.toDataURL('image/jpeg',0.40); 
                setFotos(p=>p.length<4?[...p,url]:p);
                
                const a=document.createElement('a'); 
                a.href=url; 
                a.download=`RARU_${Date.now()}.jpg`; 
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                
                showToast('📸 Foto capturada e salva!');
            };

            const gerarLaudoComSarahAI = async () => {
                if(!bairro) { showToast('Informe o bairro para a IA redigir o laudo.'); return; }
                setIsAiAnalyzing(true);
                showToast('🤖 Sarah AI analisando campo e redigindo laudo técnico estendido...');

                const promptAi = `Aja como analista sênior de Defesa Civil da RARU NEXUS V11 Plus. Redija um laudo técnico completo, minucioso e estruturado (até 4000 caracteres) para vistoria urbana no município de ${mun.n}, bairro ${bairro}, com classificação de risco ${risco}. Inclua análise de risco, histórico de precipitação, recomendações preventivas detalhadas para a Defesa Civil e plano de evacuação para moradores.`;

                try {
                    const response = await fetch(CLOUDFLARE_WORKER_URL, {
                        method: "POST", headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({ model: "openai/gpt-oss-120b", messages: [{ role: "system", content: "You are Sarah, Senior Analyst." }, { role: "user", content: promptAi }], temperature: 0.4, max_tokens: 1000 })
                    });
                    const data = await response.json();
                    let aiText = data?.choices?.[0]?.message?.content || `Vistoria realizada no município de ${mun.n}, bairro ${bairro}. Constatadas condições sob classificação ${risco}. Necessário monitoramento contínuo pela Defesa Civil e NUPDECs locais.`;
                    aiText = aiText.replace(/#{1,6}\s?/g, '').replace(/\*\*/g, '').trim();
                    setRel(aiText);
                    showToast('✨ Laudo técnico completo gerado pela Sarah AI!');
                    falarSarah("Laudo técnico completo gerado pela Sarah IA.");
                } catch(e) {
                    const fallbackRel = `Relatório Técnico de Vistoria - Município de ${mun.n} (${bairro}). Classificação de Risco: ${risco}. O local apresenta condições monitoradas pela rede P2P e Grupo A Chave da Esperança. Recomenda-se atenção redobrada em períodos de precipitação intensa. Acionamento preventivo via Defesa Civil (199).`;
                    setRel(fallbackRel);
                    showToast('⚠️ Laudo gerado em modo de redundância local.');
                } finally {
                    setIsAiAnalyzing(false);
                }
            };

            const sha256 = async (str) => {
                const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(str));
                return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, '0')).join('');
            };

            const gerarDados = async () => {
                if(!nome){ showToast('Informe o responsável'); return null; }
                if(!bairro){ showToast('Informe o bairro'); return null; }
                const seq = Math.floor(Math.random() * 8999 + 1000);
                const sig = mun.n.slice(0, 3).toUpperCase();
                const prot = `PROT-RARU-${sig}-2026-${seq}`;

            const pararDualAudio = () => {

                    d.osc.type = 'sawtooth';
                    d.osc.frequency.value = freq;
                    d.gain.gain.value = 0.45;
                    d.osc.connect(d.gain);
                    d.gain.connect(d.ctx.destination);
                    d.osc.start();
                    d.sireneInt = setInterval(() => {
                        if (subindo) { freq += 12; if (freq >= 900) subindo = false; }
                        else { freq -= 12; if (freq <= 400) subindo = true; }
                        if (d.osc) d.osc.frequency.setValueAtTime(freq, d.ctx.currentTime);

                                    onClick={() => { 
                                        setTermsAccepted(true); 
                                        try { localStorage.setItem("raru_cyber_terms", "1"); } catch(e) {} 
                                        showToast("🚀 RARU NEXUS V11 Plus Ativada!"); 
                                    }} 
                                    className={`w-full py-4 rounded-2xl font-display font-black text-xs uppercase tracking-wider transition shadow-2xl touch-manipulation ${check1 && check2 ? 'cyber-button cursor-pointer' : 'bg-commandPanel text-slate-500 cursor-not-allowed'}`}
                                >
                                    CONCORDAR E INICIAR CENTRAL
                                </button>
                            </div>
                        </div>
                    )}

                    <header className="cyber-card sticky top-0 z-30 w-full px-5 py-3 border-b border-cyberCyan/40 flex items-center justify-between shadow-lg rounded-2xl my-2">
                        <div className="flex items-center gap-3">
                            <div className="w-9 h-9 overflow-hidden shrink-0">
                                <SarahAnimatedAvatar isSpeaking={isSpeaking} sizeClass="w-full h-full" />
                            </div>
                            <div>
                                <h1 className="font-display text-xs font-black text-white tracking-wider">RARU NEXUS Plus</h1>
                                <p className="text-[8px] text-cyberCyan font-mono font-bold tracking-wider uppercase">
                                    {isCommandHUDActive ? "📺 HUD 360°" : chameleonActive ? "🦎 CAMALEÃO" : "Mesquita - RJ"}
                                </p>
                            </div>
                        </div>
                        <div className="flex items-center gap-2">
                            <button onClick={openShareFromApp} title="Compartilhar" className="w-9 h-9 rounded-xl border border-cyberCyan bg-cyberCyan/20 text-cyberCyan flex items-center justify-center cursor-pointer shadow-md transition hover:bg-cyberCyan hover:text-void touch-manipulation">
                                📲
                            </button>
                            <button onClick={toggleCommandHUD} className={`px-3 py-1.5 rounded-xl border text-[9px] font-black cursor-pointer transition touch-manipulation ${isCommandHUDActive ? 'bg-cyberRose text-void border-cyberRose animate-pulse' : 'bg-cyberCyan text-void border-cyberCyan'}`}>
                                {isCommandHUDActive ? '📺 SAIR' : '📺 HUD'}
                            </button>
                            <button onClick={() => { setChameleonActive(!chameleonActive); if(!chameleonActive && soundEnabled) playChameleonSound(); }} className={`px-2.5 py-1.5 rounded-xl border text-[8px] font-bold cursor-pointer transition touch-manipulation ${chameleonActive ? 'bg-cyan-500/25 border-cyan-400 text-cyan-300' : 'bg-cyberCyan/25 border-cyberCyan text-cyberCyan'}`}>🦎 Camaleão</button>
                            <button onClick={() => setSoundEnabled(!soundEnabled)} className={`w-9 h-9 rounded-xl border flex items-center justify-center cursor-pointer transition touch-manipulation ${soundEnabled ? 'bg-cyberCyan/25 border-cyberCyan text-cyberCyan' : 'bg-commandPanel border-cyberCyan/30 text-slate-500'}`}>🔊</button>
                            <button onClick={toggleTheme} className="w-9 h-9 rounded-xl border border-cyberCyan bg-gradient-to-br from-commandPanel to-void text-cyberCyan flex items-center justify-center cursor-pointer shadow-md transition touch-manipulation">
                                <span className="text-xs font-black">{theme === 'dark' ? '🌙' : '☀️'}</span>
                            </button>
                        </div>
                    </header>

                    <nav className="cyber-card w-full border-b border-cyberCyan/30 px-3 py-2 flex items-center justify-center gap-2 overflow-x-auto z-20">
                        {NAV_TABS.map(tab => (
                            <button key={tab.id} onClick={() => handleNavClick(tab.id)} className={`px-3.5 py-2 rounded-xl text-xs font-black transition cursor-pointer flex items-center gap-1.5 shrink-0 tracking-wider touch-manipulation ${activeTab === tab.id || (tab.id === 'alquino' && activeTab === 'alquino') || (tab.id === 'quem-somos' && quemSomosOpen) ? 'cyber-button shadow-[0_0_15px_rgba(0,242,254,0.5)]' : 'bg-commandPanel text-slate-300 border border-cyberCyan/20'}`}>
                                {tab.iconComponent} {tab.label}
                            </button>
                        ))}
                    </nav>

                    <main className="flex-1 w-full mx-auto py-5 space-y-6 pb-32 relative z-10">
                        {activeTab === 'dashboard' && (
                            <div className="space-y-6">
                                <CardIdentidadeVisualRARU openShareFromApp={openShareFromApp} openSarahChat={openSarahChat} handleWhoAmIClick={handleWhoAmIClick} setActiveTab={setActiveTab} toggleCommandHUD={toggleCommandHUD} />
                                <MapaLivreLeaflet />
                            </div>
                        )}
                        {activeTab === 'estacao' && <EstacaoSobrevivenciaModuleV11 showToast={showToast} />}
                        {activeTab === 'alquino' && <RedeAlquinoHardwareModule onGoToDashboard={() => setActiveTab('dashboard')} showToast={showToast} />}
                        {activeTab === 'relatorio' && <VistoriaRARU_NEXUS onBackToDashboard={() => setActiveTab('dashboard')} showToast={showToast} />}
                        {activeTab === 'galeria' && <PublicVideoGallery localVideos={localVideos} onGoToDashboard={() => setActiveTab('dashboard')} />}
                        {activeTab === 'admin' && <AdminVaultModule showToast={showToast} onClose={() => setActiveTab('dashboard')} />}

                        <AutomatedObservatoryWidget />
                    </main>

                    {termsAccepted && <SarahFabButton onOpen={openSarahChat} isSpeaking={isSpeaking} />}
                    <NativeHydroWindRadar isOpen={radarOpen} onToggle={() => setRadarOpen(o => !o)} />
                    <SarahChatOverlay isOpen={isChatOpen} onClose={() => setIsChatOpen(false)} isSpeaking={isSpeaking} isProcessing={isProcessing} messages={messages} input={input} setInput={setInput} handleSendDirectCommand={handleSendDirectCommand} toggleListening={toggleListening} isListening={isListening} />
                    <QuemSomosModal isOpen={quemSomosOpen} onClose={() => setQuemSomosOpen(false)} />

                    <footer className="cyber-card-nav">
                        <button onClick={() => setActiveTab('dashboard')} className={`flex flex-col items-center justify-center transition touch-manipulation ${activeTab === 'dashboard' ? 'text-cyberCyan bg-cyberCyan/20 border border-cyberCyan/50 scale-105' : 'text-slate-400 hover:text-white'}`}>
                            <span className="text-lg">🏠</span>
                            <span className="text-[10px] font-black tracking-wider">Painel</span>
                        </button>
                        <button onClick={() => setActiveTab('relatorio')} className={`flex flex-col items-center justify-center transition touch-manipulation ${activeTab === 'relatorio' ? 'text-cyberCyan bg-cyberCyan/20 border border-cyberCyan/50 scale-105' : 'text-slate-400 hover:text-white'}`}>
                            <span className="text-lg">📋</span>
                            <span className="text-[10px] font-black tracking-wider">Vistoria</span>
                        </button>
                        <button onClick={openShareFromApp} className="flex flex-col items-center justify-center text-slate-400 transition touch-manipulation hover:text-white">
                            <span className="text-lg">📲</span>
                            <span className="text-[10px] font-black tracking-wider">Instalar</span>
                        </button>
                    </footer>
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
