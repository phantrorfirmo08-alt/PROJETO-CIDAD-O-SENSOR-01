<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SARAH NEXUS - Painel de Operações</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: #0b0f19;
            color: #f8fafc;
            font-family: system-ui, -apple-system, sans-serif;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        header {
            background: #111827;
            border-bottom: 1px solid #1f2937;
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        header h1 {
            font-size: 1.25rem;
            font-weight: bold;
            letter-spacing: 0.05em;
            color: #38bdf8;
        }
        .status-badge {
            background: #dc2626;
            color: white;
            padding: 4px 12px;
            border-radius: 9999px;
            font-size: 0.85rem;
            font-weight: bold;
        }
        .main-container {
            display: flex;
            flex: 1;
            position: relative;
            overflow: hidden;
        }
        /* Área do Mapa e Radar com Ondas e Linhas Correndo */
        #map-view {
            flex: 1;
            background: #030712;
            position: relative;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .radar-grid {
            position: absolute;
            width: 100%;
            height: 100%;
            background-image: 
                linear-gradient(rgba(56, 189, 248, 0.05) 1px, transparent 1px),
                linear-gradient(90deg, rgba(56, 189, 248, 0.05) 1px, transparent 1px);
            background-size: 40px 40px;
        }
        .radar-waves {
            position: absolute;
            width: 400px;
            height: 400px;
            border: 2px dashed rgba(56, 189, 248, 0.3);
            border-radius: 50%;
            animation: pulseRadar 4s infinite linear;
        }
        .radar-line {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 50%;
            height: 2px;
            background: linear-gradient(90deg, transparent, #38bdf8);
            transform-origin: left center;
            animation: sweepLine 3s infinite linear;
        }
        @keyframes pulseRadar {
            0% { transform: scale(0.8); opacity: 0.2; }
            50% { transform: scale(1.2); opacity: 0.6; }
            100% { transform: scale(0.8); opacity: 0.2; }
        }
        @keyframes sweepLine {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        .map-label {
            position: absolute;
            bottom: 20px;
            left: 20px;
            background: rgba(17, 24, 39, 0.85);
            border: 1px solid #374151;
            padding: 10px 15px;
            border-radius: 8px;
            font-size: 0.9rem;
            z-index: 10;
        }
        /* Painel Lateral de Chat e Comandos */
        .sidebar {
            width: 380px;
            background: #111827;
            border-left: 1px solid #1f2937;
            display: flex;
            flex-direction: column;
        }
        #messages {
            flex: 1;
            overflow-y: auto;
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .msg {
            max-width: 85%;
            padding: 10px 14px;
            border-radius: 8px;
            font-size: 0.9rem;
            line-height: 1.4;
            word-break: break-word;
        }
        .msg.user {
            background: #2563eb;
            color: white;
            align-self: flex-end;
        }
        .msg.bot {
            background: #1f2937;
            color: #e5e7eb;
            align-self: flex-start;
            border: 1px solid #374151;
        }
        .chat-input-area {
            padding: 15px;
            background: #0f172a;
            border-top: 1px solid #1f2937;
        }
        #chatForm {
            display: flex;
            gap: 8px;
        }
        #chatInput {
            flex: 1;
            padding: 10px 12px;
            border-radius: 6px;
            border: 1px solid #4b5563;
            background: #1e293b;
            color: white;
            font-size: 0.95rem;
        }
        #chatInput:focus {
            outline: none;
            border-color: #38bdf8;
        }
        button {
            padding: 10px 14px;
            border-radius: 6px;
            border: none;
            background: #2563eb;
            color: white;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }
        button:hover {
            background: #1d4ed8;
        }
        #micButton {
            background: #374151;
            font-size: 1.1rem;
        }
        #micButton:hover {
            background: #4b5563;
        }
    </style>
</head>
<body>

    <header>
        <h1>SARAH NEXUS - Painel de Operações</h1>
        <div>Risco Atual: <span id="risk" class="status-badge">Moderado</span></div>
    </header>

    <div class="main-container">
        <!-- Visualizador do Radar com Linhas e Ondas -->
        <div id="map-view">
            <div class="radar-grid"></div>
            <div class="radar-waves"></div>
            <div class="radar-line"></div>
            <div class="map-label">
                <strong>Setor Ativo:</strong> Mesquita/RJ (Mendanha ⇄ Sebinho)<br>
                <span style="color: #38bdf8; font-size: 0.8rem;">● Sincronizado com bacias Sarapuí, Dona Eugênia e Prata</span>
            </div>
        </div>

        <!-- Painel de Chat e Inteligência de Comandos -->
        <div class="sidebar">
            <div id="messages">
                <div class="msg bot">Sistema SARAH NEXUS inicializado. Telemetria e radar ativados. Digite ou use o microfone para interagir.</div>
            </div>
            
            <div class="chat-input-area">
                <form id="chatForm">
                    <input type="text" id="chatInput" placeholder="Digite um comando (ex: mapa, nuvem, massa, rota, risco)..." autocomplete="off">
                    <button type="submit">Enviar</button>
                    <button type="button" id="micButton" title="Ativar Reconhecimento de Voz">🎙️</button>
                </form>
            </div>
        </div>
    </div>

    <script>
        // --- 1. Sistema de Atualização de Telemetria ---
        function atualizarTelemetria() {
            const riskEl = document.getElementById("risk");
            if (riskEl) {
                console.log("Telemetria SARAH NEXUS sincronizada com sucesso.");
            }
        }

        atualizarTelemetria();
        setInterval(atualizarTelemetria, 15000);

        // --- 2. Sistema Interno de Chat e Inteligência de Comandos ---
        const chatForm = document.getElementById("chatForm");
        const chatInput = document.getElementById("chatInput");
        const messages = document.getElementById("messages");

        if (chatForm && chatInput && messages) {
            chatForm.addEventListener("submit", function (event) {
                event.preventDefault();
                const text = chatInput.value.trim();
                if (!text) return;
                
                adicionarMensagem(text, "user");
                chatInput.value = "";
                
                setTimeout(() => {
                    const resposta = interpretarComando(text);
                    adicionarMensagem(resposta, "bot");
                }, 400);
            });
        }

        function adicionarMensagem(texto, tipo) {
            if (!messages) return;
            const div = document.createElement("div");
            div.className = "msg " + tipo;
            div.textContent = texto;
            messages.appendChild(div);
            messages.scrollTop = messages.scrollHeight;
        }

        function interpretarComando(texto) {
            const comando = texto.toLowerCase();
            
            if (comando.includes("mapa")) {
                return "Mapa operacional centralizado em Mesquita/RJ.";
            }
            if (comando.includes("nuvem")) {
                return "Camada de nuvens dinâmica ativa no mapa.";
            }
            if (comando.includes("massa")) {
                return "Fluxos de massa de ar representados por vetores com radar ativo.";
            }
            if (comando.includes("rota")) {
                return "Rota ativa com cálculo dinâmico de fluxo entre Mendanha e Sebinho.";
            }
            if (comando.includes("risco")) {
                const riskVal = document.getElementById("risk") ? document.getElementById("risk").textContent : "Moderado";
                return "Nível atual de risco: " + riskVal + ".";
            }
            
            return "Comando recebido. Painel SARAH NEXUS processando telemetria e animações gráficas.";
        }

        // --- 3. Integração do Reconhecimento de Voz ---
        const micButton = document.getElementById("micButton");
        
        if (micButton) {
            micButton.addEventListener("click", function () {
                const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
                
                if (!SpeechRecognition) {
                    alert("Reconhecimento de voz não suportado neste navegador.");
                    return;
                }
                
                const recognition = new SpeechRecognition();
                recognition.lang = "pt-BR";
                
                recognition.onstart = () => { 
                    micButton.textContent = "🔴"; 
                };
                
                recognition.onend = () => { 
                    micButton.textContent = "🎙️"; 
                };
                
                recognition.onresult = event => {
                    if (chatInput && event.results[0] && event.results[0][0]) {
                        chatInput.value = event.results[0][0].transcript;
                        chatInput.focus();
                    }
                };
                
                recognition.onerror = (event) => {
                    console.error("Erro no reconhecimento de voz: ", event.error);
                    micButton.textContent = "🎙️";
                };

                recognition.start();
            });
        }
    </script>
</body>
</html>
