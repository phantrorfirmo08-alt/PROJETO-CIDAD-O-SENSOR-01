    <script type="text/babel">
        const CLOUDFLARE_WORKER_URL = "https://sarah-envelope.phantrorfirmo08.workers.dev/";

        const getBrasiliaGreeting = () => {
            const hour = parseInt(
                new Intl.DateTimeFormat("pt-BR", {
                    timeZone: "America/Sao_Paulo",
                    hour: "numeric",
                    hour12: false
                }).format(new Date()),
                10
            );
            if (hour >= 0 && hour < 5) return "Boa madrugada";
            if (hour >= 5 && hour < 12) return "Bom dia";
            if (hour >= 12 && hour < 18) return "Boa tarde";
            return "Boa noite";
        };

                            <g className="transition-all duration-75">

                                <circle cx="39" cy="49" r={isBlinking ? "0" : "2"} fill="#ffffff" />
                                <path d="M 33 44 L 35 42 M 39 43 L 39 41 M 45 44 L 43 42" stroke="currentColor" strokeWidth="1.2" strokeLinecap="round"/>

                                <ellipse cx="61" cy="49" rx="5.5" ry={isBlinking ? "0.6" : "4.5"} fill="#38bdf8" className="shadow-[0_0_15px_#38bdf8]" />
                                <circle cx="61" cy="49" r={isBlinking ? "0" : "2"} fill="#ffffff" />

                    </div>
                    {showStatus && (
                        <div className={`absolute ${isLarge ? 'bottom-1.5 right-1.5 w-4.5 h-4.5 border-2' : '-bottom-0.5 right-0.5 w-3.5 h-3.5 border'} bg-emerald-400 rounded-full border-slate-950 shadow-[0_0_12px_#34d399] animate-ping`} title="Core Neural Operacional"></div>
                    )}
                </div>

        }

        function App() {
            const [darkMode, setDarkMode] = React.useState(true);
            const [soundEnabled, setSoundEnabled] = React.useState(true);
            const [isSpeaking, setIsSpeaking] = React.useState(false);
            const [isListening, setIsListening] = React.useState(false);
            const [liveWeather, setLiveWeather] = React.useState(null);
            const [hourlyForecast, setHourlyForecast] = React.useState(null);
            const [userCoords, setUserCoords] = React.useState({ lat: -22.7827, lng: -43.4073 });
            
            const [activeTab, setActiveTab] = React.useState("chat");
            
            const [termsOpen, setTermsOpen] = React.useState(false);
            const [shareModalOpen, setShareModalOpen] = React.useState(false);
            const [installModalOpen, setInstallModalOpen] = React.useState(false);
            const [actionPlanOpen, setActionPlanOpen] = React.useState(false);
            const [pinInput, setPinInput] = React.useState("");
            const [isPlanUnlocked, setIsPlanUnlocked] = React.useState(false);
            const [accessMode, setAccessMode] = React.useState("restricted");
            const [mediaList, setMediaList] = React.useState([]);
            const [selectedCategory, setSelectedCategory] = React.useState("Ação Social");
            const [previewMedia, setPreviewMedia] = React.useState(null);
            const [satelliteDrawerOpen, setSatelliteDrawerOpen] = React.useState(false);

            const [toastMessage, setToastMessage] = React.useState(null);
            const [fontSizeScale, setFontSizeScale] = React.useState(100);
            const [deferredPrompt, setDeferredPrompt] = React.useState(null);
            
            const [termsAccepted, setTermsAccepted] = React.useState(
                () => localStorage.getItem("sarah_terms_accepted_v54") === "1"
            );
            const [check1, setCheck1] = React.useState(false);
            const [check2, setCheck2] = React.useState(false);

            const [messages, setMessages] = React.useState([]);
            const [input, setInput] = React.useState("");
            const [isLoadingChat, setIsLoadingChat] = React.useState(false);
            const [hasIntroduced, setHasIntroduced] = React.useState(
                () => localStorage.getItem("sarah_introduced_v54") === "1"
            );

            const speechIdRef = React.useRef(0);
            const voiceTimerRef = React.useRef(null);
            const voicesRef = React.useRef([]);
            const mapRef = React.useRef(null);
            const mapInstanceRef = React.useRef(null);
            const chartRef = React.useRef(null);
            const chartInstanceRef = React.useRef(null);

            const showToast = (msg) => {
                setToastMessage(msg);
                setTimeout(() => setToastMessage(null), 3500);
            };

            React.useEffect(() => {
                document.documentElement.style.fontSize = `${fontSizeScale}%`;
            }, [fontSizeScale]);

            React.useEffect(() => {
                if ("geolocation" in navigator) {
                    navigator.geolocation.getCurrentPosition(
                        (position) => {
                            setUserCoords({
                                lat: position.coords.latitude,
                                lng: position.coords.longitude
                            });
                        },
                        (error) => {
                            console.warn("GPS Indisponível, usando padrão Sebinho:", error);
                        },
                        { enableHighAccuracy: true, timeout: 10000 }
                    );
                }
            }, []);

            React.useEffect(() => {
                window.addEventListener('beforeinstallprompt', (e) => {
                    e.preventDefault();
                    setDeferredPrompt(e);
                });
            }, []);

            const handleInstallApp = async () => {
                if (deferredPrompt) {
                    deferredPrompt.prompt();
                    const { outcome } = await deferredPrompt.userChoice;
                    if (outcome === 'accepted') {
                        setDeferredPrompt(null);
                        showToast("🎉 Aplicativo instalado com sucesso!");
                    }
                } else {
                    setInstallModalOpen(true);
                }
            };

            const carregarVozes = () => {
                if ("speechSynthesis" in window) {
                    voicesRef.current = window.speechSynthesis.getVoices();
                }
            };

            React.useEffect(() => {
                if (!("speechSynthesis" in window)) return;
                carregarVozes();
                window.speechSynthesis.onvoiceschanged = carregarVozes;
                return () => {
                    window.speechSynthesis.cancel();
                    window.speechSynthesis.onvoiceschanged = null;
                };
            }, []);

            const limparTextoParaFala = (text) => {
                return String(text)
                    .replace(/[#*_`~]/g, "")
                    .replace(/\[(.*?)\]\(.*?\)/g, "$1")
                    .replace(/https?:\/\/\S+/g, "")
                    .replace(/\s+/g, " ")
                    .trim();
            };

            const escolherMelhorVoz = () => {
                const voices = voicesRef.current.length
                    ? voicesRef.current
                    : window.speechSynthesis.getVoices();
                
                const preferidas = [
                    "Microsoft Francisca Online (Natural) - Portuguese (Brazil)",
                    "Microsoft Maria",
                    "Google português do Brasil",
                    "Google Português do Brasil",
                    "Luciana",
                    "Felipe"
                ];

                for (let pref of preferidas) {
                    const match = voices.find(v => v.name.toLowerCase().includes(pref.toLowerCase()));
                    if (match) return match;
                }

                return (
                    voices.find((voice) => voice.lang.toLowerCase() === "pt-br" && (voice.name.toLowerCase().includes("natural") || voice.name.toLowerCase().includes("neural"))) ||
                    voices.find((voice) => voice.lang.toLowerCase() === "pt-br") ||
                    voices.find((voice) => voice.lang.toLowerCase().startsWith("pt")) ||
                    voices[0]
                );
            };

            const stopSpeaking = () => {
                speechIdRef.current += 1;
                if (voiceTimerRef.current) {
                    clearTimeout(voiceTimerRef.current);
                    voiceTimerRef.current = null;
                }
                if ("speechSynthesis" in window) {
                    window.speechSynthesis.cancel();
                }
                setIsSpeaking(false);
            };

            const speakText = (text) => {
                if (!soundEnabled || !("speechSynthesis" in window)) return;
                const cleanText = limparTextoParaFala(text);
                if (!cleanText) return;
                stopSpeaking();
                const currentId = speechIdRef.current;
                voiceTimerRef.current = setTimeout(() => {
                    if (currentId !== speechIdRef.current) return;
                    const utterance = new SpeechSynthesisUtterance(cleanText);
                    const voice = escolherMelhorVoz();
                    utterance.lang = "pt-BR";
                    utterance.voice = voice || null;
                    utterance.rate = 0.95;
                    utterance.pitch = 1.02;
                    utterance.volume = 1;
                    utterance.onstart = () => {
                        if (currentId === speechIdRef.current) setIsSpeaking(true);
                    };
                    utterance.onend = () => {
                        if (currentId === speechIdRef.current) setIsSpeaking(false);
                    };
                    utterance.onerror = () => setIsSpeaking(false);
                    window.speechSynthesis.speak(utterance);
                }, 200);
            };

            React.useEffect(() => {
                if (!termsAccepted || hasIntroduced) return;
                const greeting = getBrasiliaGreeting();
                const presentation = `${greeting}, sou a SARAH IA Core PRO, seu núcleo inteligente de prevenção e monitoramento da Defesa Civil Comunitária Cidadão Sensor na Comunidade do Sebinho. Prevenção, não é mídia. É gente atenta. Sistemas ativados com sucesso.`;
                const timer = setTimeout(() => {
                    if (!soundEnabled) return;
                    setHasIntroduced(true);
                    localStorage.setItem("sarah_introduced_v54", "1");
                    speakText(presentation);
                }, 700);
                return () => clearTimeout(timer);
            }, [termsAccepted, hasIntroduced, soundEnabled]);

            const handleShareLink = async () => {
                if (navigator.share) {
                    try {
                        await navigator.share({
                            title: 'SARAH IA Core v5.4 PRO • Defesa Civil Comunitária',
                            text: '🛡️ Sistema inteligente de suporte e ações sociais na Comunidade do Sebinho, Mesquita - RJ.',
                            url: window.location.href,
                        });
                        return;
                    } catch (err) {
                        console.log("Compartilhamento nativo cancelado");
                    }
                }
                setShareModalOpen(true);
            };

            const compartilharWhatsApp = () => {
                const text = encodeURIComponent("🛡️ SARAH IA • Defesa Civil Comunitária Cidadão Sensor\n📍 Comunidade do Sebinho (Rua Amazonas), Mesquita - RJ\nAcesse o app oficial: " + window.location.href);
                window.open(`https://api.whatsapp.com/send?text=${text}`, '_blank');
            };

            const compartilharTelegram = () => {
                const text = encodeURIComponent("🛡️ SARAH IA • Defesa Civil Comunitária Cidadão Sensor (Comunidade do Sebinho, Mesquita RJ): " + window.location.href);
                window.open(`https://t.me/share/url?url=${encodeURIComponent(window.location.href)}&text=${text}`, '_blank');
            };

            const copiarLinkComIcone = async () => {
                const shareText = `🛡️ SARAH IA Core PRO • Defesa Civil Comunitária Cidadão Sensor\n📍 Rua Amazonas / Comunidade do Sebinho, Mesquita - RJ\n🔗 ${window.location.href}`;
                if (navigator.clipboard) {
                    await navigator.clipboard.writeText(shareText);
                    showToast("🔗 Link e escudo copiados com sucesso!");
                    setShareModalOpen(false);
                }
            };

            React.useEffect(() => {
                fetch(
                    `https://api.open-meteo.com/v1/forecast?latitude=${userCoords.lat}&longitude=${userCoords.lng}&current=temperature_2m,relative_humidity_2m,precipitation,weather_code,wind_speed_10m&hourly=temperature_2m,precipitation_probability,precipitation`
                )
                    .then((response) => response.json())
                    .then((data) => {
                        if (data && data.current) {
                            setLiveWeather(data.current);
                        }
                        if (data && data.hourly) {
                            setHourlyForecast(data.hourly);
                        }
                    })
                    .catch((error) => {
                        console.warn("Clima indisponível:", error);
                    });
            }, [userCoords]);

            React.useEffect(() => {
                document.documentElement.classList.toggle("dark", darkMode);
                document.documentElement.classList.toggle("light", !darkMode);
            }, [darkMode]);

            React.useEffect(() => {
                if (activeTab === "radar" && mapRef.current && !mapInstanceRef.current) {
                    const map = L.map(mapRef.current).setView([userCoords.lat, userCoords.lng], 18);
                    
                    L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
                        maxZoom: 19,
                        attribution: "© OpenStreetMap | SARAH IA Core PRO"
                    }).addTo(map);

                    const marker = L.marker([userCoords.lat, userCoords.lng]).addTo(map);
                    marker.bindPopup("<div style='font-family:monospace; color:#0f172a;'><b>Setor Neural (GPS):</b> Rua Amazonas / Comunidade do Sebinho<br>Rocha Sobrinho, Mesquita - RJ<br><i>Monitoramento Ativo 24/7.</i></div>").openPopup();

                    L.circle([userCoords.lat, userCoords.lng], {
                        color: '#4ade80',
                        fillColor: '#22c55e',
                        fillOpacity: 0.25,
                        radius: 90
                    }).addTo(map);

                    mapInstanceRef.current = map;
                }
                if (activeTab === "radar" && mapInstanceRef.current) {
                    setTimeout(() => {
                        mapInstanceRef.current?.invalidateSize();
                    }, 120);
                }
                if (activeTab !== "radar" && mapInstanceRef.current) {
                    mapInstanceRef.current.remove();
                    mapInstanceRef.current = null;
                }
            }, [activeTab, userCoords]);

            React.useEffect(() => {
                if (activeTab !== "telemetry" || !chartRef.current) return;

                if (chartInstanceRef.current) {
                    chartInstanceRef.current.destroy();
                    chartInstanceRef.current = null;
                }

                const ctx = chartRef.current.getContext("2d");
                const nowIndex = new Date().getHours();
                const labels = hourlyForecast && hourlyForecast.time 
                    ? hourlyForecast.time.slice(nowIndex, nowIndex + 12).map(t => t.split("T")[1]) 
                    : ["00:00", "02:00", "04:00", "06:00", "08:00", "10:00", "12:00", "14:00", "16:00", "18:00", "20:00", "22:00"];
                
                const tempData = hourlyForecast && hourlyForecast.temperature_2m 
                    ? hourlyForecast.temperature_2m.slice(nowIndex, nowIndex + 12) 
                    : [24, 23.5, 23, 22.5, 24, 27, 29, 31, 30, 28, 26, 25];

                const precipData = hourlyForecast && hourlyForecast.precipitation 
                    ? hourlyForecast.precipitation.slice(nowIndex, nowIndex + 12)
                    : [0, 0, 0.2, 0, 0, 0, 1.5, 0.4, 0, 0, 0, 0];

                chartInstanceRef.current = new Chart(ctx, {
                    type: "bar",
                    data: {
                        labels: labels,
                        datasets: [
                            {
                                type: "line",
                                label: "Temperatura (°C)",
                                data: tempData,
                                borderColor: "#4ade80",
                                backgroundColor: "rgba(74, 222, 128, 0.18)",
                                borderWidth: 3.5,
                                fill: true,
                                tension: 0.4,
                                yAxisID: 'y',
                                pointBackgroundColor: "#020617",
                                pointBorderColor: "#4ade80",
                                pointBorderWidth: 3,
                                pointRadius: 6
                            },
                            {
                                type: "bar",
                                label: "Precipitação (mm)",
                                data: precipData,
                                backgroundColor: "rgba(34, 197, 94, 0.7)",
                                borderColor: "#22c55e",
                                borderWidth: 1.5,
                                borderRadius: 6,
                                yAxisID: 'y1'
                            }
                        ]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        scales: {
                            y: {
                                type: 'linear',
                                display: true,
                                position: 'left',
                                grid: { color: darkMode ? "rgba(148, 163, 184, 0.15)" : "rgba(15, 23, 42, 0.12)" },
                                ticks: { 
                                    color: darkMode ? "#4ade80" : "#15803d",

                                                        🎬 Vídeos Armazenados na Vitrine ({mediaList.length}):
                                                    </h4>
                                                    <span className="text-[10px] font-mono text-emerald-400">Comunidade do Sebinho</span>
                                                </div>

                                                {mediaList.length === 0 ? (
                                                    <div className="p-10 text-center text-slate-500 font-mono text-xs bg-slate-900/50 rounded-2xl border border-slate-800 space-y-2">
                                                        <div className="text-2xl">📼</div>
                                                        <div>Nenhum vídeo de evento ou ação social carregado.</div>
                                                    </div>
                                                ) : (
                                                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-3 max-h-72 overflow-y-auto p-1">
                                                        {mediaList.map(item => (
                                                            <div key={item.id} className="bg-slate-900 border border-emerald-500/40 rounded-2xl p-3 flex flex-col justify-between shadow-md hover:border-emerald-400 transition">
                                                                <div className="flex items-center justify-between mb-2">
                                                                    <span className="px-2 py-0.5 rounded-md bg-emerald-950 border border-emerald-500/40 font-mono text-[10px] text-emerald-300 font-bold">
                                                                        {item.category}
                                                                    </span>
                                                                    {accessMode === "restricted" && (
                                                                        <button
                                                                            onClick={() => removeMediaItem(item.id)}
                                                                            className="text-slate-400 hover:text-red-400 font-mono text-xs p-1 transition cursor-pointer"
                                                                            title="Excluir"
                                                                        >
                                                                            🗑️
                                                                        </button>
                                                                    )}
                                                                </div>

                                                                <div 
                                                                    className="cursor-pointer overflow-hidden rounded-xl border border-slate-800 mb-2 bg-slate-950 flex items-center justify-center h-32 relative group"
                                                                    onClick={() => setPreviewMedia(item)}
                                                                >
                                                                    <video src={item.url} className="w-full h-full object-cover group-hover:scale-105 transition duration-300" />
                                                                    <div className="absolute inset-0 bg-slate-950/40 opacity-0 group-hover:opacity-100 transition flex items-center justify-center font-mono text-xs text-white font-bold gap-2">
                                                                        ▶️ Reproduzir Vídeo
                                                                    </div>
                                                                </div>

                                                                <div className="space-y-0.5 font-mono text-[10px] text-slate-400">
                                                                    <div className="truncate text-slate-200 font-bold">{item.name}</div>
                                                                    <div className="flex justify-between">
                                                                        <span>{item.size}</span>
                                                                        <span>{item.date}</span>
                                                                    </div>
                                                                </div>
                                                            </div>
                                                        ))}
                                                    </div>
                                                )}
                                            </div>
                                        </div>
                                    )}
                                </div>
                            </div>
                        </div>
                    )}

                    {installModalOpen && (
                        <div className="fixed inset-0 bg-slate-950/85 backdrop-blur-md z-50 flex items-center justify-center p-4">
                            <div className="glass-dark border border-emerald-500/40 w-full max-w-md rounded-3xl shadow-[0_0_40px_rgba(74,222,128,0.3)] overflow-hidden flex flex-col">
                                <div className="bg-slate-950 px-5 py-3.5 border-b border-emerald-500/30 flex justify-between items-center">
                                    <h3 className="font-mono text-emerald-400 text-sm font-bold flex items-center gap-2">
                                        <span>📱</span> Instalação do Aplicativo SARAH IA
                                    </h3>
                                    <button
                                        onClick={() => setInstallModalOpen(false)}
                                        className="text-slate-400 hover:text-white font-mono text-xs px-3 py-1 rounded-lg bg-slate-900 border border-slate-700 transition cursor-pointer"
                                    >
                                        ✕
                                    </button>
                                </div>
                                <div className="p-6 bg-slate-900/90 text-xs sm:text-sm text-slate-300 space-y-4 text-left font-sans leading-relaxed">
                                    <p className="font-mono text-emerald-300 font-bold">
                                        Como adicionar à Tela Inicial do seu dispositivo:
                                    </p>
                                    <div className="space-y-3 font-mono text-[11px] bg-slate-950/80 p-4 rounded-2xl border border-emerald-500/30">
                                        <div className="pb-2 border-b border-slate-800">
                                            <span className="text-emerald-400 font-bold">No Android (Google Chrome):</span><br/>
                                            Toque no menu (três pontinhos <b>⋮</b> no canto superior direito) e selecione <b>"Adicionar à tela inicial"</b> ou <b>"Instalar aplicativo"</b>.
                                        </div>
                                        <div>
                                            <span className="text-emerald-400 font-bold">No iPhone (Safari / iOS):</span><br/>
                                            Toque no botão Compartilhar (quadrado com seta para cima <b>⎋</b> na barra inferior) e selecione <b>"Adicionar à Tela de Início"</b>.
                                        </div>
                                    </div>
                                    <button
                                        onClick={() => setInstallModalOpen(false)}
                                        className="w-full py-3 bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-mono text-xs font-bold rounded-xl transition cursor-pointer shadow-[0_0_15px_rgba(74,222,128,0.5)]"
                                    >
                                        ENTENDIDO
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                    {shareModalOpen && (
                        <div className="fixed inset-0 bg-slate-950/85 backdrop-blur-md z-50 flex items-center justify-center p-4">
                            <div className="glass-dark border border-emerald-500/40 w-full max-w-md rounded-3xl shadow-[0_0_40px_rgba(74,222,128,0.3)] overflow-hidden flex flex-col">
                                <div className="bg-slate-950 px-5 py-3.5 border-b border-emerald-500/30 flex justify-between items-center">
                                    <h3 className="font-mono text-emerald-400 text-sm font-bold flex items-center gap-2">
                                        <span>🔗</span> Compartilhar Aplicativo
                                    </h3>
                                    <button
                                        onClick={() => setShareModalOpen(false)}
                                        className="text-slate-400 hover:text-white font-mono text-xs px-3 py-1 rounded-lg bg-slate-900 border border-slate-700 transition cursor-pointer"
                                    >
                                        ✕
                                    </button>
                                </div>
                                <div className="p-6 bg-slate-900/90 text-xs sm:text-sm text-slate-300 flex flex-col items-center text-center space-y-4">
                                    <div className="w-16 h-16 rounded-2xl bg-emerald-500/15 border-2 border-emerald-400/60 flex items-center justify-center text-emerald-400 shadow-[0_0_20px_rgba(74,222,128,0.4)]">
                                        <CyberShieldIcon className="w-10 h-10" />
                                    </div>
                                    <div>
                                        <h4 className="font-bold text-slate-100 font-mono text-sm">Defesa Civil Comunitária Cidadão Sensor</h4>
                                        <p className="text-[11px] text-emerald-400 font-mono mt-1">SARAH IA Core • Grupo A Chave da Esperança</p>
                                    </div>
                                    <div className="w-full grid grid-cols-2 gap-3">
                                        <button
                                            onClick={compartilharWhatsApp}
                                            className="py-3 px-4 bg-emerald-600 hover:bg-emerald-500 text-white font-mono text-xs font-bold rounded-xl transition flex items-center justify-center gap-2 shadow-md cursor-pointer"
                                        >
                                            <span>💬</span> WhatsApp
                                        </button>
                                        <button
                                            onClick={compartilharTelegram}
                                            className="py-3 px-4 bg-sky-600 hover:bg-sky-500 text-white font-mono text-xs font-bold rounded-xl transition flex items-center justify-center gap-2 shadow-md cursor-pointer"
                                        >
                                            <span>✈️</span> Telegram
                                        </button>
                                    </div>
                                    <button
                                        onClick={copiarLinkComIcone}
                                        className="w-full py-3 bg-slate-950 hover:bg-slate-900 border border-emerald-500/40 text-emerald-300 font-mono text-xs font-bold rounded-xl transition shadow-inner cursor-pointer"
                                    >
                                        📋 Copiar Link Completo
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                    {termsOpen && (
                        <div className="fixed inset-0 bg-slate-950/85 backdrop-blur-md z-50 flex items-center justify-center p-4">
                            <div className="glass-dark border border-emerald-500/40 w-full max-w-xl rounded-3xl shadow-[0_0_40px_rgba(74,222,128,0.3)] overflow-hidden">
                                <div className="bg-slate-950 px-5 py-3.5 border-b border-emerald-500/30 flex justify-between items-center">
                                    <h3 className="font-mono text-emerald-400 text-sm font-bold flex items-center gap-2">
                                        <CyberShieldIcon className="w-5 h-5" /> Conformidade LGPD & Governança
                                    </h3>
                                    <button
                                        onClick={() => setTermsOpen(false)}
                                        className="text-slate-400 hover:text-white font-mono text-xs px-3 py-1 rounded-lg bg-slate-900 border border-slate-700 transition cursor-pointer"
                                    >
                                        ✕ Fechar
                                    </button>
                                </div>
                                <div className="p-6 bg-slate-900/90 text-xs sm:text-sm text-slate-300 space-y-3 leading-relaxed font-sans">
                                    <p>
                                        <strong>SARAH IA Core v5.4 PRO</strong> opera estritamente sob os preceitos da Lei Federal de Proteção de Dados (LGPD - Lei nº 13.709/2018), garantindo criptografia e privacidade aos registros comunitários em Mesquita/RJ.
                                    </p>
                                    <p>
                                        Lema: <em>Prevenção, não é mídia. é gente atenta.</em>
                                    </p>
                                    <p className="text-emerald-400 font-mono font-bold">
                                        🚨 Em caso de emergência iminente, acione imediatamente a Defesa Civil pelo número 199.
                                    </p>
                                </div>
                            </div>
                        </div>
                    )}

                    <div className="bg-emerald-950/90 border-t border-emerald-500/30 py-2.5 overflow-hidden shadow-inner whitespace-nowrap">
                        <marquee behavior="scroll" direction="left" scrollamount="5" className="font-mono text-xs text-emerald-300 font-bold tracking-wide">
                            🚨 Seja voluntário servir é prevenir sempre + Nupdecs • PLANTÃO & EMERGÊNCIA SEBINHO: Defesa Civil (199 / 21 4040-1772) • Bombeiro (193) • CCO: (21) 2042-7020 • Alerta ZAP 📲 (21) 97299-3223 • CRAS Rocha Sobrinho: (21) 2042-8931
                        </marquee>
                    </div>

                    <footer className="bg-slate-950 border-t border-emerald-500/20 py-4 px-4 text-center text-xs font-mono text-slate-400 space-y-1 shadow-inner">
                        <div>Todos os direitos reservados 2024–2026 Grupo a Chave da Esperança Sebinho Mesquita RJ</div>
                        <div className="text-emerald-400 font-bold">Defesa Civil Comunitária Cidadão Sensor • SARAH IA Core v5.4 PRO</div>
                    </footer>
                </div>
            );
        }

        const root = ReactDOM.createRoot(getElementByIdOrFallback());
        function getElementByIdOrFallback() {
            let el = document.getElementById("root");
            if (!el) {
                el = document.createElement("div");
                el.id = "root";
                document.body.appendChild(el);
            }
            return el;
        }
        root.render(<App />);

        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js').catch(() => {});
            });
        }
    </script>
</body>
</html>
