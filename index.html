        function NativeHydroWindRadar({ liveWeather }) {
            const canvasRef = React.useRef(null);
            const [brasiliaTime, setBrasiliaTime] = React.useState("");

            React.useEffect(() => {
                const timer = setInterval(() => {
                    const now = new Date();
                    const timeStr = new Intl.DateTimeFormat("pt-BR", {
                        timeZone: "America/Sao_Paulo",
                        hour: "2-digit",
                        minute: "2-digit",
                        second: "2-digit",
                        hour12: false
                    }).format(now);
                    setBrasiliaTime(timeStr);
                }, 1000);
                return () => clearInterval(timer);
            }, []);

            React.useEffect(() => {
                const canvas = canvasRef.current;
                if (!canvas) return;
                const ctx = canvas.getContext('2d');
                let animationFrameId;
                let angle = 0;

                const render = () => {
                    ctx.clearRect(0, 0, canvas.width, canvas.height);
                    ctx.fillStyle = '#020617';
                    ctx.fillRect(0, 0, canvas.width, canvas.height);
                    const centerX = canvas.width / 2;
                    const centerY = canvas.height / 2;

                    [40, 75, 110, 145].forEach((r) => {
                        ctx.strokeStyle = 'rgba(155,126,222,0.3)';
                        ctx.lineWidth = 1;
                        ctx.beginPath(); ctx.arc(centerX, centerY, r, 0, Math.PI * 2); ctx.stroke();
                    });

                    ctx.save();
                    ctx.translate(centerX, centerY);
                    ctx.rotate(angle);
                    const grad = ctx.createLinearGradient(0, 0, 130, -130);
                    grad.addColorStop(0, 'rgba(192,132,252,0.4)');
                    grad.addColorStop(1, 'transparent');
                    ctx.fillStyle = grad;
                    ctx.beginPath(); ctx.moveTo(0, 0); ctx.arc(0, 0, 145, -Math.PI/2, 0); ctx.lineTo(0, 0); ctx.fill();
                    ctx.restore();

                    angle += 0.03;
                    animationFrameId = requestAnimationFrame(render);
                };
                render();
                return () => cancelAnimationFrame(animationFrameId);
            }, []);

            return (
                <div className="relative w-full h-[320px] rounded-3xl overflow-hidden border-2 border-purple-500/50 shadow-2xl bg-[#120921] flex flex-col justify-between p-3">

                        <canvas ref={canvasRef} width="360" height="240" className="w-full h-full object-contain"></canvas>
                    </div>
                </div>
            );
        }

        function App() {
            const [darkMode, setDarkMode] = React.useState(true);
            const [soundEnabled, setSoundEnabled] = React.useState(true);
            const [isSpeaking, setIsSpeaking] = React.useState(false);
            const [activeTab, setActiveTab] = React.useState("chat");
            const [toastMessage, setToastMessage] = React.useState(null);
            const [messages, setMessages] = React.useState([]);
            const [input, setInput] = React.useState("");
            const [isLoadingChat, setIsLoadingChat] = React.useState(false);

            const showToast = (msg) => {
                setToastMessage(msg);
                setTimeout(() => setToastMessage(null), 3500);
            };

            const speakText = (text) => {
                if (!soundEnabled || !("speechSynthesis" in window)) return;
                window.speechSynthesis.cancel();
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = "pt-BR";
                utterance.onstart = () => setIsSpeaking(true);
                utterance.onend = () => setIsSpeaking(false);
                utterance.onerror = () => setIsSpeaking(false);
                window.speechSynthesis.speak(utterance);
            };

            const handleSendMessage = async () => {
                if (!input.trim() || isLoadingChat) return;
                const userMsg = { id: Date.now(), sender: "user", text: input.trim(), timestamp: new Date().toLocaleTimeString("pt-BR", { hour: "2-digit", minute: "2-digit" }) };
                setMessages(prev => [...prev, userMsg]);
                setInput("");
                setIsLoadingChat(true);

                try {
                    const response = await fetch(CLOUDFLARE_WORKER_URL, {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({
                            model: "openai/gpt-oss-120b",
                            messages: [{ role: "system", content: "SARAH IA NEXUS v5.2 PRO - Defesa Civil Comunitária (A Chave da Esperança, Mesquita/RJ)." }, { role: "user", content: userMsg.text }]
                        })
                    });
                    const data = await response.json();
                    const reply = data?.choices?.[0]?.message?.content || data?.message || "Sistemas operando normalmente.";
                    setMessages(prev => [...prev, { id: Date.now() + 1, sender: "sarah", text: reply, timestamp: new Date().toLocaleTimeString("pt-BR", { hour: "2-digit", minute: "2-digit" }) }]);
                    speakText(reply);
                } catch {
                    setMessages(prev => [...prev, { id: Date.now(), sender: "sarah", text: "Falha de enlace com a internet.", timestamp: "00:00" }]);
                } finally {
                    setIsLoadingChat(false);
                }
            };

            return (
                <div className="min-h-screen flex flex-col relative bg-nightBlue text-lightLavender">
                    {toastMessage && (
                        <div className="fixed top-20 left-1/2 -translate-x-1/2 z-50 bg-purple-600 text-white px-6 py-3 rounded-2xl text-xs font-bold shadow-2xl border-2 border-pink-400">
                            {toastMessage}
                        </div>
                    )}

                    <header className="glass-dark border-b border-purple-500/30 px-4 py-3 sticky top-0 z-40 shadow-xl">
                        <div className="max-w-5xl mx-auto flex items-center justify-between">
                            <div className="flex items-center gap-3">
                                <div className="w-11 h-11 rounded-2xl bg-purple-500/15 border border-purple-500/60 flex items-center justify-center text-purple-300">
                                    <CyberShieldIcon className="w-6 h-6" />
                                </div>
                                <div>
                                    <h1 className="text-sm font-bold text-white">SARAH IA NEXUS v5.2 PRO</h1>
                                    <span className="text-xs text-purple-300">Grupo Comunitário A Chave da Esperança (Mesquita/RJ)</span>
                                </div>
                            </div>
                        </div>
                    </header>

                    <div className="bg-[#120921] border-b border-purple-500/30 px-4 py-2">
                        <div className="max-w-5xl mx-auto flex items-center gap-2 overflow-x-auto">
                            <button onClick={() => setActiveTab("chat")} className={`px-4 py-2 rounded-xl text-xs font-bold cursor-pointer ${activeTab === "chat" ? "bg-purple-600 text-white" : "bg-nightBlue text-purple-300 border border-purple-500/40"}`}>💬 Chat</button>
                            <button onClick={() => setActiveTab("dashboard")} className={`px-4 py-2 rounded-xl text-xs font-bold cursor-pointer ${activeTab === "dashboard" ? "bg-purple-600 text-white" : "bg-nightBlue text-purple-300 border border-purple-500/40"}`}>🛰️ Radar</button>
                            <button onClick={() => setActiveTab("field_report")} className={`px-4 py-2 rounded-xl text-xs font-bold cursor-pointer ${activeTab === "field_report" ? "bg-purple-600 text-white" : "bg-nightBlue text-purple-300 border border-purple-500/40"}`}>📋 Laudos</button>
                            <button onClick={() => setActiveTab("regional_hub")} className={`px-4 py-2 rounded-xl text-xs font-bold cursor-pointer ${activeTab === "regional_hub" ? "bg-purple-600 text-white" : "bg-nightBlue text-purple-300 border border-purple-500/40"}`}>📑 Hub</button>
                            <button onClick={() => setActiveTab("videos")} className={`px-4 py-2 rounded-xl text-xs font-bold cursor-pointer ${activeTab === "videos" ? "bg-purple-600 text-white" : "bg-nightBlue text-purple-300 border border-purple-500/40"}`}>🎥 Cofre</button>
                        </div>
                    </div>

                    <main className="max-w-5xl mx-auto p-4 w-full flex-1 flex flex-col">
                        {activeTab === "dashboard" && <NativeHydroWindRadar />}
                        {activeTab === "field_report" && <FieldReportModule onBackToChat={() => setActiveTab("chat")} showToast={showToast} />}
                        {activeTab === "regional_hub" && <RegionalHubModule showToast={showToast} />}
                        {activeTab === "videos" && <VideoVaultModule showToast={showToast} />}
                        {activeTab === "chat" && (
                            <div className="glass-dark rounded-3xl shadow-2xl flex flex-col overflow-hidden flex-1 border border-purple-500/40" style={{ minHeight: "500px" }}>
                                <div className="flex-1 overflow-y-auto p-4 space-y-4">
                                    {messages.length === 0 && (
                                        <div className="h-full flex flex-col items-center justify-center p-4 my-auto">
                                            <SarahHologramAvatar isLarge={true} isSpeaking={isSpeaking} />
                                            <h2 className="text-base font-bold text-white mt-3">SARAH IA NEXUS v5.2 PRO</h2>
                                            <p className="text-xs text-purple-300">"Prevenção não é mídia: é gente atenta."</p>
                                        </div>
                                    )}
                                    {messages.map(m => (
                                        <div key={m.id} className={`flex items-start gap-3 ${m.sender === "user" ? "flex-row-reverse" : "flex-row"}`}>
                                            {m.sender === "user" ? <div className="w-10 h-10 rounded-2xl bg-[#120921] flex items-center justify-center text-purple-300">👤</div> : <SarahHologramAvatar isSpeaking={isSpeaking} />}
                                            <div className={`p-4 rounded-3xl max-w-[85%] text-xs ${m.sender === "user" ? "bg-purple-600 text-white" : "bg-[#120921] text-lightLavender border border-purple-500/40"}`}>{m.text}</div>
                                        </div>
                                    ))}
                                </div>
                                <div className="p-4 bg-nightBlue/95 border-t border-purple-500/30 flex gap-2">
                                    <input type="text" value={input} onChange={e => setInput(e.target.value)} onKeyDown={e => e.key === "Enter" && handleSendMessage()} placeholder="Digite sua mensagem..." className="flex-1 bg-[#120921] border border-purple-500/40 rounded-xl px-3 py-2 text-xs text-white outline-none" />
                                    <button onClick={handleSendMessage} className="px-4 py-2 bg-purple-600 text-white font-bold rounded-xl text-xs cursor-pointer">➤</button>
                                </div>
                            </div>
                        )}
                    </main>

                    <div className="bg-[#4a154b] border-t-2 border-purple-500 py-2.5 overflow-hidden whitespace-nowrap">
                        <marquee behavior="scroll" direction="left" scrollamount="4" className="text-xs font-bold text-[#FF7A00]">
                            🛡️ Promovendo ciência cidadã • 1° Edição operacional El Ninõ GACE • Conceitos Mesquita do amanhã e Cidades resilientes (ONU) Grupo Comunitário A Chave da Esperança • Plano de Ação: Todos Unidos, Todos Protegidos • EMERGÊNCIAS: Defesa Civil (199 / 21 4040-1772) • Bombeiros (193) • Alertas ZAP 📲 (21) 97299-3223 • Cras de Rocha Sobrinho 21 2042-8931 • Seja voluntário servir é prevenir sempre +Nupdecs • Participe • "Se o Senhor não guardar a cidade, em vão vigia o sentinela" (Salmos 127:1) • #compartilhe ™ Mesquita RJ 🛡️
                        </marquee>
                    </div>

                    <footer className="bg-[#120921] border-t border-purple-500/40 py-3 px-2 text-center text-xs space-y-1 font-bold shadow-inner">
                        <div style={{ color: "#9B7EDE" }}>Defesa Civil Comunitária Cidadão Sensor • SARAH IA NEXUS v5.2 PRO</div>
                        <div style={{ color: "#E58AC7" }}>Grupo Comunitário A Chave da Esperança • Mesquita/RJ</div>
                        <div style={{ color: "#72E6B2" }}>@ &nbsp; Todos os direitos reservados 2024–2026</div>
                    </footer>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById("root"));
        root.render(<App />);
    </script>
</body>
</html>
