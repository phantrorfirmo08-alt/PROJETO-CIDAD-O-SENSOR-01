<!DOCTYPE html>
<html lang="pt-BR" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SARAH AI Core v4.0 - Mesquita RJ</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        cyber: { 500: '#06b6d4', 950: '#020617' }
                    }
                }
            }
        }
    </script>
    
    <!-- React & Babel -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Leaflet Map CSS & JS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <!-- Marked.js para renderizar Markdown -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

    <!-- Estilização personalizada para o Markdown da IA -->
    <style>
        .markdown-content p { margin-bottom: 0.5rem; line-height: 1.5; }
        .markdown-content p:last-child { margin-bottom: 0; }
        .markdown-content ul { list-style-type: disc; margin-left: 1.25rem; margin-bottom: 0.5rem; }
        .markdown-content ol { list-style-type: decimal; margin-left: 1.25rem; margin-bottom: 0.5rem; }
        .markdown-content li { margin-bottom: 0.25rem; }
        .markdown-content strong { color: #38bdf8; font-weight: 600; }
        .markdown-content code { background-color: #020617; padding: 0.15rem 0.3rem; border-radius: 0.25rem; font-size: 0.85em; border: 1px solid #1e293b; }
        .markdown-content pre { background-color: #020617; padding: 0.75rem; border-radius: 0.5rem; overflow-x: auto; margin: 0.5rem 0; border: 1px solid #1e293b; }
        .markdown-content blockquote { border-left: 3px solid #06b6d4; padding-left: 0.75rem; color: #94a3b8; font-style: italic; margin: 0.5rem 0; }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen selection:bg-cyan-500 selection:text-white">
    <div id="root"></div>

    <script type="text/babel">
        // --- 1. AVATAR CIBERNÉTICO HEXAGONAL ---
        function SarahAvatar({ size = "w-12 h-12", showStatus = true, isLarge = false }) {
            const [isBlinking, setIsBlinking] = React.useState(false);

            React.useEffect(() => {
                let timeoutId;
                const triggerBlink = () => {
                    setIsBlinking(true);
                    setTimeout(() => setIsBlinking(false), 140);
                    const randomTime = Math.floor(Math.random() * (5500 - 2500 + 1)) + 2500;
                    timeoutId = setTimeout(triggerBlink, randomTime);
                };
                const initialTime = Math.floor(Math.random() * (5500 - 2500 + 1)) + 2500;
                timeoutId = setTimeout(triggerBlink, initialTime);
                return () => clearTimeout(timeoutId);
            }, []);

            const dimensionClass = isLarge ? "w-32 h-32" : size;

            return (
                <div className="relative inline-flex items-center justify-center shrink-0">
                    <div className={`${dimensionClass} flex items-center justify-center relative select-none`}>
                        <svg className="w-full h-full drop-shadow-[0_0_12px_rgba(6,182,212,0.4)]" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <defs>
                                <linearGradient id="hexBorder" x1="0%" y1="0%" x2="100%" y2="100%">
                                    <stop offset="0%" stopColor="#38bdf8" />
                                    <stop offset="50%" stopColor="#0284c7" />
                                    <stop offset="100%" stopColor="#0f172a" />
                                </linearGradient>
                                <linearGradient id="hexInner" x1="0%" y1="0%" x2="0%" y2="100%">
                                    <stop offset="0%" stopColor="#090d16" />
                                    <stop offset="100%" stopColor="#020617" />
                                </linearGradient>
                            </defs>
                            <path d="M50 4 L92 27 L92 73 L50 96 L8 73 L8 27 Z" fill="url(#hexInner)" stroke="url(#hexBorder)" strokeWidth="3"/>
                            <path d="M50 12 L84 31 L84 69 L50 88 L16 69 L16 31 Z" fill="#030712" stroke="#1e293b" strokeWidth="1.5"/>
                            <g transform="translate(25, 28) scale(0.5)">
                                <path d="M10 20 L90 20 L80 70 L50 85 L20 70 Z" fill="#0f172a" stroke="#06b6d4" strokeWidth="2.5" opacity="0.9"/>
                                <path d="M30 45 L50 45 L50 65" stroke="#0284c7" strokeWidth="1.5" fill="none"/>
                                <circle cx="50" cy="65" r="2" fill="#06b6d4"/>
                                <g className="transition-all duration-75">
                                    <ellipse cx="32" cy="35" rx="7" ry={isBlinking ? "1" : "6"} fill="#38bdf8" filter="drop-shadow(0 0 6px #38bdf8)"/>
                                    <circle cx="30" cy="33" r="2" fill="#ffffff" opacity={isBlinking ? "0" : "0.9"}/>
                                    <ellipse cx="68" cy="35" rx="7" ry={isBlinking ? "1" : "6"} fill="#38bdf8" filter="drop-shadow(0 0 6px #38bdf8)"/>
                                    <circle cx="66" cy="33" r="2" fill="#ffffff" opacity={isBlinking ? "0" : "0.9"}/>
                                </g>
                                <path d="M42 55 Q50 50 58 55" stroke="#38bdf8" strokeWidth="2" strokeLinecap="round" opacity="0.8"/>
                            </g>
                        </svg>
                    </div>
                    {showStatus && (
                        <div className={`absolute ${isLarge ? 'bottom-1 right-1 w-4 h-4 border-2' : '-bottom-0.5 right-0.5 w-3 h-3 border'} bg-emerald-500 rounded-full border-slate-950 shadow-md animate-pulse`} title="Online"></div>
                    )}
                </div>
            );
        }

        // --- 2. MODAL LGPD ---
        function LgpdModal({ onAccept }) {
            const [check1, setCheck1] = React.useState(false);
            const [check2, setCheck2] = React.useState(false);

            return (
                <div className="fixed inset-0 z-50 bg-slate-950/90 backdrop-blur-md flex items-center justify-center p-4">
                    <div className="bg-slate-900 border border-cyan-500/40 rounded-2xl max-w-lg w-full p-6 shadow-[0_0_30px_rgba(6,182,212,0.2)] text-slate-200">
                        <div className="flex items-center gap-3 mb-4">
                            <div className="w-10 h-10 rounded-xl bg-cyan-950 border border-cyan-500/50 flex items-center justify-center text-cyan-400 font-bold">🛡️</div>
                            <div>
                                <h2 className="text-lg font-bold text-white">Termo de Responsabilidade & LGPD</h2>
                                <p className="text-xs text-cyan-400">Lei Geral de Proteção de Dados (Lei nº 13.709/2018)</p>
                            </div>
                        </div>

                        <div className="space-y-2 text-xs text-slate-300 bg-slate-950/50 p-4 rounded-xl border border-slate-800 mb-4">
                            <p className="font-semibold text-cyan-300">3 Pilares de Privacidade e Segurança:</p>
                            <ul className="space-y-1.5 text-slate-300">
                                <li><strong className="text-white">1. Transparência e Finalidade:</strong> Dados processados estritamente para suporte meteorológico e consultoria assistencial.</li>
                                <li><strong className="text-white">2. Privacidade e Sigilo:</strong> Nenhuma informação pessoal sensível é compartilhada com terceiros, sob rigorosos padrões de segurança.</li>
                                <li><strong className="text-white">3. Consentimento Ativo:</strong> Uso voluntário fundamentado no aceite expresso destas diretrizes.</li>
                            </ul>
                        </div>

                        <div className="space-y-3 mb-6">
                            <label className="flex items-start gap-3 cursor-pointer text-xs text-slate-300">
                                <input type="checkbox" checked={check1} onChange={(e) => setCheck1(e.target.checked)} className="mt-0.5 w-4 h-4 rounded border-slate-700 text-cyan-600 focus:ring-cyan-500 bg-slate-950"/>
                                <span>Compreendo e concordo com os 3 pilares de proteção de dados e privacidade estabelecidos pela LGPD.</span>
                            </label>
                            <label className="flex items-start gap-3 cursor-pointer text-xs text-slate-300">
                                <input type="checkbox" checked={check2} onChange={(e) => setCheck2(e.target.checked)} className="mt-0.5 w-4 h-4 rounded border-slate-700 text-cyan-600 focus:ring-cyan-500 bg-slate-950"/>
                                <span>Autorizo o processamento temporário das interações para o funcionamento dos serviços da assistente.</span>
                            </label>
                        </div>

                        <button
                            disabled={!check1 || !check2}
                            onClick={onAccept}
                            className={`w-full py-3 rounded-xl font-medium transition shadow-lg text-sm ${
                                check1 && check2 
                                    ? 'bg-gradient-to-r from-cyan-600 to-blue-600 hover:from-cyan-500 hover:to-blue-500 text-white shadow-cyan-500/25 cursor-pointer' 
                                    : 'bg-slate-800 text-slate-500 cursor-not-allowed border border-slate-700'
                            }`}
                        >
                            Aceitar Termos e Entrar no Sistema
                        </button>
                    </div>
                </div>
            );
        }

        // --- 3. MODAL DO MAPA LEAFLET & RAINVIEWER ---
        function WeatherMapModal({ onClose }) {
            React.useEffect(() => {
                const map = L.map('map-container').setView([-22.7856, -43.4128], 12);
                L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                    maxZoom: 19,
                    attribution: '© OpenStreetMap'
                }).addTo(map);

                L.marker([-22.7856, -43.4128]).addTo(map)
                    .bindPopup('<b>Mesquita - RJ</b><br/>Base de Monitoramento Defesa Civil')
                    .openPopup();

                fetch('https://api.rainviewer.com/public/weather-maps.json')
                    .then(res => res.json())
                    .then(data => {
                        if (data.radar && data.radar.past && data.radar.past.length > 0) {
                            const latest = data.radar.past[data.radar.past.length - 1];
                            L.tileLayer(`https://tilecache.rainviewer.com${latest.path}/256/{z}/{x}/{y}/2/1_1.png`, {
                                opacity: 0.6,
                                attribution: 'RainViewer'
                            }).addTo(map);
                        }
                    }).catch(e => console.log('Erro ao carregar radar:', e));

                return () => { map.remove(); };
            }, []);

            return (
                <div className="fixed inset-0 z-50 bg-slate-950/80 backdrop-blur-sm flex items-center justify-center p-4">
                    <div className="bg-slate-900 border border-slate-700 rounded-2xl max-w-2xl w-full p-4 flex flex-col h-[450px]">
                        <div className="flex justify-between items-center mb-3">
                            <h3 className="text-sm font-bold text-white flex items-center gap-2">Radar Meteorológico & Mesquita-RJ</h3>
                            <button onClick={onClose} className="px-3 py-1 bg-slate-800 hover:bg-slate-700 text-xs rounded-lg text-slate-300">Fechar ✕</button>
                        </div>
                        <div id="map-container" className="flex-1 rounded-xl overflow-hidden border border-slate-800 z-10"></div>
                    </div>
                </div>
            );
        }

        // --- 4. APLICATIVO PRINCIPAL ---
        function App() {
            const [lgpdAccepted, setLgpdAccepted] = React.useState(() => {
                try { return localStorage.getItem('sarah_lgpd') === 'true'; } catch(e) { return false; }
            });
            const [fontSizeScale, setFontSizeScale] = React.useState(100);
            
            const [messages, setMessages] = React.useState(() => {
                try {
                    const saved = localStorage.getItem('sarah_chat_messages');
                    return saved ? JSON.parse(saved) : [];
                } catch(e) { return []; }
            });
            
            const [input, setInput] = React.useState('');
            const [loading, setLoading] = React.useState(false);
            const [showMap, setShowMap] = React.useState(false);
            const [weatherData, setWeatherData] = React.useState(null);

            const [deferredPrompt, setDeferredPrompt] = React.useState(null);
            const [showInstallBtn, setShowInstallBtn] = React.useState(false);

            React.useEffect(() => {
                try {
                    localStorage.setItem('sarah_chat_messages', JSON.stringify(messages));
                } catch(e) {}
            }, [messages]);

            React.useEffect(() => {
                window.addEventListener('beforeinstallprompt', (e) => {
                    e.preventDefault();
                    setDeferredPrompt(e);
                    setShowInstallBtn(true);
                });

                fetch('https://api.open-meteo.com/v1/forecast?latitude=-22.7856&longitude=-43.4128&current=temperature_2m,relative_humidity_2m,apparent_temperature,precipitation,wind_speed_10m')
                    .then(res => res.json())
                    .then(data => setWeatherData(data.current))
                    .catch(err => console.log('Erro clima:', err));
            }, []);

            const installApp = () => {
                if (deferredPrompt) {
                    deferredPrompt.prompt();
                    deferredPrompt.userChoice.then((choiceResult) => {
                        if (choiceResult.outcome === 'accepted') setShowInstallBtn(false);
                        setDeferredPrompt(null);
                    });
                }
            };

            const limparChat = () => {
                setMessages([]);
                try { localStorage.removeItem('sarah_chat_messages'); } catch(e) {}
            };

            const falarTexto = (texto) => {
                if ('speechSynthesis' in window) {
                    window.speechSynthesis.cancel();
                    const utterance = new SpeechSynthesisUtterance(texto);
                    utterance.lang = 'pt-BR';
                    utterance.rate = 1.0;
                    window.speechSynthesis.speak(utterance);
                }
            };

            const sendMessage = async (e) => {
                e.preventDefault();
                if (!input.trim() || loading) return;

                const userMsg = input.trim();
                setInput('');
                const newMessages = [...messages, { role: 'user', content: userMsg }];
                setMessages(newMessages);
                setLoading(true);

                try {
                    const response = await fetch('https://seu-worker.seu-subdominio.workers.dev', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ 
                            system: "Você é a SARAH AI Core v4.0, assistente oficial de monitoramento da Defesa Civil e consultoria geral em Mesquita-RJ. Atue com empatia, precisão técnica e clareza.",
                            messages: newMessages 
                        })
                    });
                    const data = await response.json();
                    const reply = data.choices?.[0]?.message?.content || "Erro ao processar resposta.";
                    
                    const updatedMessages = [...newMessages, { role: 'assistant', content: reply }];
                    setMessages(updatedMessages);
                } catch (err) {
                    setMessages([...newMessages, { role: 'assistant', content: "Desculpe, ocorreu um erro de conexão com o servidor do Worker." }]);
                } finally {
                    setLoading(false);
                }
            };

            return (
                <div style={{ fontSize: `${fontSizeScale}%` }} className="min-h-screen bg-slate-950 text-slate-100 flex flex-col">
                    {!lgpdAccepted && (
                        <LgpdModal onAccept={() => {
                            setLgpdAccepted(true);
                            try { localStorage.setItem('sarah_lgpd', 'true'); } catch(e) {}
                        }} />
                    )}

                    {showMap && <WeatherMapModal onClose={() => setShowMap(false)} />}

                    {/* Cabeçalho */}
                    <header className="bg-slate-900/80 backdrop-blur border-b border-slate-800 px-4 py-3 flex items-center justify-between sticky top-0 z-40">
                        <div className="flex items-center gap-3">
                            <SarahAvatar size="w-10 h-10" />
                            <div>
                                <h1 className="font-bold text-sm text-white flex items-center gap-2">
                                    SARAH <span className="text-[10px] bg-cyan-950 text-cyan-400 px-2 py-0.5 rounded-full border border-cyan-500/30">v4.0</span>
                                </h1>
                                <p className="text-[11px] text-slate-400">Defesa Civil & Consultoria Geral • Mesquita-RJ</p>
                            </div>
                        </div>

                        <div className="flex items-center gap-2">
                            <button onClick={() => setShowMap(true)} className="px-3 py-1.5 bg-cyan-950 hover:bg-cyan-900 text-cyan-400 border border-cyan-500/30 text-xs rounded-lg font-medium transition flex items-center gap-1 cursor-pointer">
                                🗺️ Radar
                            </button>
                            {showInstallBtn && (
                                <button onClick={installApp} className="px-3 py-1.5 bg-emerald-600 hover:bg-emerald-500 text-white text-xs rounded-lg font-medium shadow transition cursor-pointer">
                                    📱 Instalar
                                </button>
                            )}
                            <div className="flex items-center bg-slate-800 border border-slate-700 rounded-lg overflow-hidden text-xs">
                                <button onClick={() => setFontSizeScale(p => Math.max(85, p - 10))} className="px-2 py-1.5 hover:bg-slate-700 text-slate-300 font-bold transition cursor-pointer">A-</button>
                                <span className="px-1 text-slate-400">{fontSizeScale}%</span>
                                <button onClick={() => setFontSizeScale(p => Math.min(130, p + 10))} className="px-2 py-1.5 hover:bg-slate-700 text-slate-300 font-bold transition cursor-pointer">A+</button>
                            </div>
                            <button onClick={limparChat} className="p-2 rounded-lg bg-slate-800 hover:bg-slate-700 border border-slate-700 text-slate-300 transition text-xs cursor-pointer" title="Limpar Conversa">
                                🗑️
                            </button>
                        </div>
                    </header>

                    {/* Barra de Clima em Tempo Real */}
                    {weatherData && (
                        <div className="bg-slate-900/50 border-b border-slate-800/80 px-4 py-2 text-xs flex flex-wrap items-center justify-center gap-6 text-slate-300">
                            <span>🌡️ Temp: <strong>{weatherData.temperature_2m}°C</strong></span>
                            <span>💧 Umidade: <strong>{weatherData.relative_humidity_2m}%</strong></span>
                            <span>🌧️ Precipitação: <strong>{weatherData.precipitation} mm</strong></span>
                            <span>💨 Vento: <strong>{weatherData.wind_speed_10m} km/h</strong></span>
                        </div>
                    )}

                    {/* Corpo do Chat */}
                    <main className="flex-1 max-w-4xl w-full mx-auto p-4 flex flex-col gap-4 overflow-y-auto pb-36">
                        {messages.length === 0 ? (
                            <div className="text-center my-auto py-12 px-4 space-y-4">
                                <div className="inline-flex p-4 rounded-2xl bg-cyan-950/40 border border-cyan-500/30">
                                    <SarahAvatar size="w-20 h-20" showStatus={false} isLarge={true} />
                                </div>
                                <h2 className="text-lg font-bold text-white">Olá! Eu sou a SARAH.</h2>
                                <p className="text-xs text-slate-400 max-w-md mx-auto">
                                    Estou pronta para monitorar o clima de Mesquita-RJ, debater programas sociais, religião, esportes, atualidades ou oferecer suporte emocional humanizado. Como posso te ajudar hoje?
                                </p>
                            </div>
                        ) : (
                            messages.map((m, idx) => (
                                <div key={idx} className={`flex gap-3 ${m.role === 'user' ? 'justify-end' : 'justify-start'}`}>
                                    {m.role === 'assistant' && <SarahAvatar size="w-8 h-8" showStatus={false} />}
                                    <div className={`relative group max-w-[85%] p-3.5 rounded-2xl text-sm leading-relaxed ${
                                        m.role === 'user' 
                                            ? 'bg-cyan-600 text-white rounded-tr-none' 
                                            : 'bg-slate-900 border border-slate-800 text-slate-200 rounded-tl-none shadow-md'
                                    }`}>
                                        {m.role === 'assistant' ? (
                                            <div>
                                                <div dangerouslySetInnerHTML={{ __html: marked.parse(m.content) }} className="markdown-content space-y-2" />
                                                <button 
                                                    onClick={() => falarTexto(m.content)}
                                                    className="absolute -bottom-3 right-3 bg-slate-800 hover:bg-slate-700 text-cyan-400 border border-slate-700 px-2 py-0.5 rounded-md text-[10px] shadow opacity-80 group-hover:opacity-100 transition cursor-pointer flex items-center gap-1"
                                                    title="Ouvir resposta"
                                                >
                                                    🔊 Ouvir
                                                </button>
                                            </div>
                                        ) : (
                                            m.content
                                        )}
                                    </div>
                                </div>
                            ))
                        )}
                        {loading && (
                            <div className="flex gap-3 items-center text-slate-400 text-xs italic">
                                <SarahAvatar size="w-6 h-6" showStatus={false} />
                                SARAH está processando...
                            </div>
                        )}
                    </main>

                    {/* Rodapé Oficial Completo */}
                    <footer className="fixed bottom-0 left-0 right-0 bg-slate-900/95 backdrop-blur-md border-t border-slate-800/80 px-4 py-3 z-40 shadow-2xl">
                        <div className="max-w-4xl mx-auto flex flex-col gap-2">
                            <form onSubmit={sendMessage} className="flex gap-2 items-center">
                                <input
                                    type="text"
                                    value={input}
                                    onChange={(e) => setInput(e.target.value)}
                                    placeholder="Digite sua dúvida sobre o clima, programas sociais, apoio ou outros temas..."
                                    className="flex-1 bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-sm text-slate-200 focus:outline-none focus:border-cyan-500 transition shadow-inner"
                                />
                                <button
                                    type="submit"
                                    disabled={loading || !input.trim()}
                                    className="px-5 py-3 bg-gradient-to-r from-cyan-600 to-blue-600 hover:from-cyan-500 hover:to-blue-500 disabled:opacity-40 disabled:cursor-not-allowed text-white font-medium rounded-xl transition shadow-lg shadow-cyan-600/20 text-sm shrink-0 flex items-center gap-1.5 cursor-pointer"
                                >
                                    <span>Enviar</span>
                                </button>
                            </form>
                            
                            <div className="text-[10px] text-slate-400 text-center flex flex-wrap items-center justify-center gap-2 select-none">
                                <span className="text-cyan-400/90 font-medium">SARAH AI Core v4.0</span>
                                <span>•</span>
                                <span>Defesa Civil de Mesquita-RJ</span>
                                <span>•</span>
                                <span>Operação e Monitoramento Assistencial</span>
                            </div>
                        </div>
                    </footer>
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
