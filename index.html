<!doctype html>
<html lang="pt-BR" class="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0b132b">
<title>SARAH IA NEXUS V5.2</title>

<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<style>
:root{--bg:#0b132b;--card:#1c2541;--cyan:#48cae4;--green:#2ec4b6}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(circle at top,#172554,#0b132b 45%,#050914);color:#f8fafc;font-family:Arial,sans-serif}
#map{height:390px;border:1px solid #1c3a5e;border-radius:16px;overflow:hidden}
.leaflet-container{background:#07111d}
.video-panel{background:linear-gradient(145deg,#172554,#111936 55%,#24104f);border:1px solid #48cae455;box-shadow:0 0 35px #48cae41c}
.video-frame{min-height:220px;background:#050914;border:1px solid #48cae433}
video{width:100%;max-height:430px;display:block;border-radius:12px;background:#020617}
.pulse{width:14px;height:14px;border-radius:50%;background:#ef4444;box-shadow:0 0 14px #ef4444}
.card{border:1px solid #48cae433;background:#1c2541;border-radius:12px;padding:12px}
</style>
</head>

<body>
<div id="root"></div>

<script>
const ORIGEM=[-22.82537,-43.49590];
const DESTINO=[-22.78098,-43.43628];
const CENTRO=[-22.80318,-43.46609];
const TZ="America/Sao_Paulo";
const CACHE_KEY="sarah-weather-cache-v1";

const $=id=>document.getElementById(id);

function hora(){
 return new Intl.DateTimeFormat("pt-BR",{
  timeZone:TZ,hour:"2-digit",minute:"2-digit",second:"2-digit"
 }).format(new Date());
}

function statusVideo(text,tipo="normal"){
 const el=$("video-status");
 if(!el) return;
 el.textContent=text;
 el.className=tipo==="error"?"text-xs text-red-300":
 tipo==="ok"?"text-xs text-emerald-300":"text-xs text-slate-400";
}

function limparVideo(){
 const video=$("video-preview");
 if(!video) return;
 if(video.src)URL.revokeObjectURL(video.src);
 video.pause();
 video.removeAttribute("src");
 video.load();

 $("video-file").value="";
 $("video-empty").classList.remove("hidden");
 video.classList.add("hidden");
 $("video-info").classList.add("hidden");
 $("remove-video").classList.add("hidden");
 $("choose-video").textContent="Selecionar vídeo da galeria";
 statusVideo("Nenhum vídeo selecionado");
}

function carregarVideo(file){
 if(!file)return;

 if(!file.type.startsWith("video/")){
  statusVideo("Selecione um arquivo de vídeo válido","error");
  return;
 }

 const video=$("video-preview");
 if(video.src)URL.revokeObjectURL(video.src);

 video.src=URL.createObjectURL(file);
 video.classList.remove("hidden");
 $("video-empty").classList.add("hidden");
 $("video-info").classList.remove("hidden");
 $("remove-video").classList.remove("hidden");
 $("choose-video").textContent="Trocar vídeo";

 $("video-name").textContent=file.name;
 $("video-size").textContent=(file.size/1024/1024).toFixed(2)+" MB";

 video.onloadedmetadata=()=>{
  const min=Math.floor(video.duration/60);
  const sec=Math.floor(video.duration%60).toString().padStart(2,"0");
  $("video-duration").textContent=`${min}:${sec}`;
 };

 statusVideo("Vídeo carregado da galeria","ok");
}

function iniciarMapa(){
 const map=L.map("map").setView(CENTRO,12);

 L.control.zoom({position:"bottomleft"}).addTo(map);

 L.tileLayer(
  "https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png",
  {
   attribution:"© OpenStreetMap © CARTO",
   subdomains:"abcd",
   maxZoom:19
  }
 ).addTo(map);

 L.marker(ORIGEM).addTo(map)
  .bindPopup("<b>ORIGEM</b><br>Serra do Mendanha");

 const icon=L.divIcon({
  className:"",
  html:'<div class="pulse"></div>',
  iconSize:[14,14]
 });

 L.marker(DESTINO,{icon}).addTo(map)
  .bindPopup("<b>DESTINO</b><br>Comunidade do Sebinho");

 L.polyline([ORIGEM,DESTINO],{
  color:"#48cae4",
  weight:3,
  dashArray:"8 8"
 }).addTo(map)
 .bindPopup("Alinhamento Mendanha → Sebinho");

 L.circle(DESTINO,{
  radius:4000,
  color:"#2ec4b6",
  fillColor:"#48cae4",
  fillOpacity:.08
 }).addTo(map);
}

function atualizarStatus(texto,tipo="normal"){
 const el=$("weather-status");
 if(!el) return;
 el.textContent=texto;
 el.className=tipo==="error"
  ?"text-xs text-red-300"
  :"text-xs text-slate-400";
}

function mostrarClima(w,cache=false){
 if($("temp")) $("temp").textContent=w.temp+"°C";
 if($("hum")) $("hum").textContent=w.hum+"%";
 if($("rain")) $("rain").textContent=w.rain+" mm";
 if($("wind")) $("wind").textContent=w.wind+" km/h";
 if($("direction")) $("direction").textContent=w.dir+"°";

 atualizarStatus(cache?"Exibindo dados armazenados anteriormente":"Dados atualizados");
}

async function buscarClima(){
 atualizarStatus("Atualizando Open-Meteo...");

 const params=new URLSearchParams({
  latitude:CENTRO[0],
  longitude:CENTRO[1],
  current:"temperature_2m,relative_humidity_2m,precipitation,wind_speed_10m,wind_direction_10m",
  forecast_days:"1",
  timezone:TZ
 });

 const controller=new AbortController();
 const timeout=setTimeout(()=>controller.abort(),8000);

 try{
  const resposta=await fetch(
   "https://api.open-meteo.com/v1/forecast?"+params,
   {signal:controller.signal}
  );

  if(!resposta.ok)throw new Error("Fonte indisponível");

  const dados=await resposta.json();
  const c=dados.current;

  const clima={
   temp:Math.round(c.temperature_2m),
   hum:Math.round(c.relative_humidity_2m),
   rain:Number(c.precipitation||0).toFixed(1),
   wind:Math.round(c.wind_speed_10m),
   dir:Math.round(c.wind_direction_10m||0),
   salvoEm:Date.now()
  };

  localStorage.setItem(CACHE_KEY,JSON.stringify(clima));
  mostrarClima(clima);
 }catch(erro){
  const salvo=localStorage.getItem(CACHE_KEY);

  if(salvo)mostrarClima(JSON.parse(salvo),true);
  else atualizarStatus("Fonte temporariamente indisponível","error");
 }finally{
  clearTimeout(timeout);
 }
}

function App(){
 return `
 <main class="mx-auto min-h-screen max-w-5xl p-4 sm:p-8">

  <header class="mb-6 text-center">
   <div class="mx-auto flex h-24 w-24 items-center justify-center rounded-full border-2 border-cyan-400/40">
    <div class="h-14 w-14 rounded-full bg-gradient-to-br from-cyan-300 to-blue-700 shadow-[0_0_35px_#48cae4]"></div>
   </div>

   <h1 class="mt-4 text-2xl font-bold tracking-wide text-cyan-300">
    SARAH IA NEXUS V5.2
   </h1>

   <p class="mt-2 text-sm text-slate-400">
    Monitoramento meteorológico inteligente
   </p>
  </header>

  <section class="video-panel mb-5 rounded-2xl p-4 sm:p-5">
   <div class="mb-4 flex flex-wrap items-center justify-between gap-2">
    <div>
     <p class="text-xs uppercase tracking-[.25em] text-cyan-300">
      Central visual
     </p>
     <h2 class="text-xl font-semibold text-white">
      Núcleo de mídia SARAH
     </h2>
    </div>

    <span id="video-status" class="text-xs text-slate-400">
     Nenhum vídeo selecionado
    </span>
   </div>

   <div class="video-frame rounded-xl p-2">
    <div id="video-empty" class="flex min-h-[205px] flex-col items-center justify-center text-center text-slate-400">
     <div class="mb-3 text-4xl">▶</div>
     <p class="text-sm">Selecione um vídeo da galeria do telefone</p>
     <p class="mt-1 text-xs text-slate-500">O arquivo permanece no dispositivo</p>
    </div>

    <video id="video-preview" class="hidden" controls playsinline></video>
   </div>

   <div id="video-info" class="mt-3 hidden rounded-lg border border-cyan-400/20 bg-black/20 p-3 text-xs">
    <div class="flex flex-wrap justify-between gap-2">
     <span id="video-name" class="max-w-full truncate text-cyan-200"></span>
     <span id="video-size" class="text-slate-400"></span>
     <span id="video-duration" class="text-slate-400"></span>
    </div>
   </div>

   <div class="mt-4 flex flex-wrap gap-2">
    <label id="choose-video" class="cursor-pointer rounded-lg bg-cyan-400 px-4 py-2 text-sm font-semibold text-slate-950 hover:bg-cyan-300">
     Selecionar vídeo da galeria
     <input id="video-file" type="file" accept="video/*" class="hidden">
    </label>

    <button id="remove-video" class="hidden rounded-lg border border-red-400/50 px-4 py-2 text-sm text-red-300 hover:bg-red-400/10">
     Remover vídeo
    </button>
   </div>
  </section>

  <section class="rounded-2xl border border-cyan-400/20 bg-[#1c2541]/80 p-4 shadow-2xl">
   <div class="mb-3 flex items-center justify-between">
    <h2 class="text-lg font-semibold text-cyan-300">Mapa operacional</h2>
    <span id="clock" class="text-xs text-emerald-300"></span>
   </div>

   <div id="map"></div>

   <div class="mt-3 grid grid-cols-2 gap-2 sm:grid-cols-5">
    <div class="card"><small>Temperatura</small><strong id="temp">--</strong></div>
    <div class="card"><small>Umidade</small><strong id="hum">--</strong></div>
    <div class="card"><small>Chuva atual</small><strong id="rain">--</strong></div>
    <div class="con-card card"><small>Vento</small><strong id="wind">--</strong></div>
    <div class="card"><small>Direção</small><strong id="direction">--</strong></div>
   </div>

   <div class="mt-3 flex flex-wrap items-center justify-between gap-2">
    <span id="weather-status" class="text-xs text-slate-400">
     Carregando dados...
    </span>

    <button id="refresh-weather"
     class="rounded-lg border border-cyan-400/40 px-4 py-2 text-xs text-cyan-300 hover:bg-cyan-400/10">
     Atualizar dados
    </button>
   </div>

   <div class="mt-3 rounded-lg border border-amber-400/20 bg-amber-400/5 p-3 text-xs text-slate-300">
    <b class="text-amber-300">IA operacional:</b>
    os dados são informativos e não substituem alertas oficiais da Defesa Civil,
    INMET ou CEMADEN.
   </div>
  </section>

  <footer class="mt-5 text-center text-xs text-slate-500">
   Open-Meteo · OpenStreetMap · CARTO · SARAH IA NEXUS V5.2
  </footer>
 </main>
 `;
}

$("root").innerHTML=App();

// Eventos de mídia e clima após renderizar o template
document.addEventListener("change", e => {
 if(e.target && e.target.id === "video-file"){
  carregarVideo(e.target.files[0]);
 }
});

document.addEventListener("click", e => {
 if(e.target && e.target.id === "remove-video") limparVideo();
 if(e.target && e.target.id === "refresh-weather") buscarClima();
});

function atualizarRelogio(){
 const clockEl = $("clock");
 if(clockEl) clockEl.textContent=hora();
}

iniciarMapa();
buscarClima();
atualizarRelogio();

setInterval(atualizarRelogio,1000);
setInterval(buscarClima,600000);

window.addEventListener("online",buscarClima);
window.addEventListener("offline",()=>{
 atualizarStatus("Sem conexão — usando dados armazenados","error");
});
</script>
</body>
</html>
