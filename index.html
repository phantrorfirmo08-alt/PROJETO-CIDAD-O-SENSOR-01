    <div id="root"></div>
    <script type="text/babel">
        document.addEventListener('gesturestart', function(e) { e.preventDefault(); });

        let lastTouchEnd = 0;
        document.addEventListener('touchend', function(e) {
            const now = (new Date()).getTime();
            if (now - lastTouchEnd <= 300) { e.preventDefault(); }
            lastTouchEnd = now;
        }, { passive: false });

        const CLOUDFLARE_WORKER_URL = "https://sarah-envelope.phantrorfirmo08.workers.dev/";

        const getBrasiliaGreeting = () => {
            const hour = parseInt(
                new Intl.DateTimeFormat("pt-BR", {
                    timeZone: "America/Sao_Paulo",
                    hour: "numeric",
                    hour12: false
                }).format(new Date()),
                10
            );
            if (hour >= 0 && hour < 5) return "Boa madrugada";
            if (hour >= 5 && hour < 12) return "Bom dia";
            if (hour >= 12 && hour < 18) return "Boa tarde";
            return "Boa noite";
        };

        function CyberShieldIcon({ className = "w-6 h-6" }) {
            return (
                <svg className={className} viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M12 2L3 6V11C3 16.55 6.84 21.74 12 23C17.16 21.74 21 16.55 21 11V6L12 2Z" fill="url(#shieldGrad)" stroke="#00F0FF" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round"/>
                    <path d="M12 7C9.79 7 8 8.79 8 11C8 12.1 8.44 13.09 9.14 13.8L9 18H11V20H13V18H15V14.8C15.56 14.09 16 13.1 16 11C16 8.79 14.21 7 12 7ZM12 9C13.1 9 14 9.9 14 11C14 12.1 13.1 13 12 13C10.9 13 10 12.1 10 11C10 9.9 10.9 9 12 9Z" fill="#0F172A"/>
                    <defs>
                        <linearGradient id="shieldGrad" x1="3" y1="2" x2="21" y2="23" gradientUnits="userSpaceOnUse">
                            <stop stopColor="#00F0FF" />
                            <stop offset="0.5" stopColor="#8B5CF6" />
                            <stop offset="1" stopColor="#EC4899" />
                        </linearGradient>
                    </defs>
                </svg>
            );
        }

        function SarahHologramAvatar({ isLarge = false, isSpeaking = false }) {
            const containerSizeClass = isLarge 
                ? "w-full max-w-[320px] aspect-square mx-auto p-5 rounded-[32px] border-2 border-white/40 bg-petroleumPanel shadow-2xl flex flex-col items-center justify-center relative overflow-hidden" 
                : "w-12 h-12 rounded-full p-1.5 border-2 border-white/40 bg-petroleumPanel shrink-0 flex items-center justify-center relative overflow-hidden";

            return (
                <div className={containerSizeClass}>
                    <div className="absolute inset-0 flex items-center justify-center pointer-events-none">
                        <div className={`absolute rounded-full border-2 border-white/30 bg-white/5 animate-sensor-pulse ${isLarge ? 'w-48 h-48' : 'w-16 h-16'}`}></div>
                        <div className={`absolute rounded-full border border-cyberNeon/30 bg-cyberNeon/5 animate-sensor-pulse ${isLarge ? 'w-64 h-64' : 'w-22 h-22'}`} style={{ animationDelay: '1.2s' }}></div>
                    </div>

                    <div 
                        className={`relative rounded-full flex items-center justify-center bg-black border-4 border-white/80 shadow-[0_0_30px_rgba(255,255,255,0.4)] transition-all duration-300 ease-in-out z-10 ${
                            isLarge ? 'w-32 h-32' : 'w-9 h-9'
                        } ${isSpeaking ? 'animate-avatar-speaking' : 'animate-avatar-idle'}`}
                    >
                        <svg width={isLarge ? "48" : "20"} height={isLarge ? "48" : "20"} viewBox="0 0 24 24" fill="#00F0FF">
                            <path d="M13 2L3 14h7l-1 8 10-12h-7l1-8z"/>
                        </svg>
                    </div>

                    {isLarge && (
                        <div className="mt-3 text-center font-sans z-10 space-y-1">
                            <div className="inline-block px-2.5 py-0.5 rounded-full bg-white/10 border border-white/30 font-mono text-[9px] text-lightSilver tracking-wider">
                                {isSpeaking ? "● PROCESSANDO..." : "● PRONTA"}
                            </div>
                            <div className="font-black text-xl text-white tracking-widest">
                                SARAH IA <span className="text-transparent bg-clip-text bg-gradient-to-r from-cyberNeon to-white">NEXUS</span>
                            </div>
                            <div className="text-[10px] tracking-[0.2em] text-lightSilver/80 font-extrabold">CIDADÃO SENSOR 🛡️ PRO</div>
                        </div>
                    )}
                </div>
            );
        }

        function NativeHydroWindRadar({ liveWeather, onClose }) {
            const [brasiliaTime, setBrasiliaTime] = React.useState("");

            React.useEffect(() => {
                const timer = setInterval(() => {
                    const now = new Date();
                    const timeStr = new Intl.DateTimeFormat("pt-BR", {
                        timeZone: "America/Sao_Paulo",
                        hour: "2-digit",
                        minute: "2-digit",
                        second: "2-digit",
                        hour12: false
                    }).format(now);
                    setBrasiliaTime(timeStr);
                }, 1000);
                return () => clearInterval(timer);
            }, []);

            return (
                <div className="relative w-full h-[580px] rounded-3xl overflow-hidden border-2 border-cyberNeon/60 shadow-2xl bg-petroleumPanel flex flex-col justify-between p-2">
                    <div className="flex items-center justify-between z-30 bg-nightBlue/98 border border-cyberNeon/50 px-3 py-1.5 rounded-xl shadow-xl backdrop-blur-md gap-2">
                        <div className="flex items-center gap-1.5 font-bold text-[11px] text-cyberNeon font-sans truncate">
                            <span className="w-2 h-2 rounded-full bg-mintEmerald animate-ping shrink-0"></span>
                            <span>RADAR METEOROLÓGICO, SATÉLITE & BACIAS</span>
                        </div>
                        <div className="flex items-center gap-2">
                            <span className="font-mono text-[10px] font-bold text-lightSilver hidden sm:inline">🕒 {brasiliaTime || "00:00"}</span>
                            <button 
                                onClick={onClose} 
                                className="px-3 py-1 bg-coralAlert hover:bg-red-600 text-white rounded-lg text-[10px] font-black cursor-pointer transition shadow"
                            >
                                Sair
                            </button>
                        </div>
                    </div>
                    
                    <div className="absolute inset-0 pt-12">
                        <iframe 
                            src="https://embed.windy.com/embed2.html?lat=-22.7845&lon=-43.4190&detailLat=-22.7845&detailLon=-43.4190&width=650&height=550&zoom=13&level=surface&overlay=wind&product=ecmwf&menu=&message=&marker=true&calendar=now&pressure=true&type=map&location=coordinates&detail=true&metricWind=default&metricTemp=default" 
                            className="w-full h-full border-none"
                            allowFullScreen>
                        </iframe>
                    </div>
                </div>
            );
        }

        function FieldReportModule({ onBackToChat, showToast }) {
            const [tecnico, setTecnico] = React.useState("");
            const [localidade, setLocalidade] = React.useState("");
            const [dataVisita, setDataVisita] = React.useState("");
            const [categoria, setCategoria] = React.useState("Infraestrutura e Drenagem");
            const [descricao, setDescdescricao] = React.useState("");
            const [anexosNome, setAnexosNome] = React.useState("Nenhum anexo adicionado.");
            const [galeriaMidia, setGaleriaMidia] = React.useState([]);
            const [gpsData, setGpsData] = React.useState(null);
            const [isAcquiringGps, setIsAcquiringGps] = React.useState(false);

            const handleAcquireGps = () => {
                if (!navigator.geolocation) {
                    showToast("❌ Geolocalização não suportada pelo navegador.");
                    return;
                }
                setIsAcquiringGps(true);
                showToast("🛰 Acionando GPS para acompanhamento da demanda...");
                navigator.geolocation.getCurrentPosition(
                    (position) => {
                        const lat = position.coords.latitude.toFixed(6);
                        const lng = position.coords.longitude.toFixed(6);
                        const acc = position.coords.accuracy.toFixed(1);
                        setGpsData({ lat, lng, acc });
                        setIsAcquiringGps(false);
                        showToast(`📍 GPS Conectado! Lat: ${lat}, Lng: ${lng}`);
                    },
                    (error) => {
                        setIsAcquiringGps(false);
                        showToast("⚠ Falha ao obter sinal de GPS. Verifique as permissões.");
                    },
                    { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
                );
            };

            const handleFileChange = (e) => {
                const files = Array.from(e.target.files);
                if (files.length > 0) {
                    let nomes = files.map(f => f.name).join(', ');
                    setAnexosNome(`${files.length} arquivo(s): ${nomes}`);
                    
                    files.forEach(file => {
                        const reader = new FileReader();
                        reader.onload = (uploadEvt) => {
                            setGaleriaMidia(prev => [...prev, {
                                name: file.name,
                                url: uploadEvt.target.result,
                                type: file.type
                            }]);
                            showToast(`📁 "${file.name}" carregado com sucesso!`);
                        };
                        reader.readAsDataURL(file);
                    });
                } else {
                    setAnexosNome("Nenhum anexo adicionado.");
                }
            };

            const gerarPDF = () => {
                const elemento = document.getElementById('conteudoRelatorioPDF');
                const opcoes = {
                    margin:       10,
                    filename:     'relatorio_tecnico_campo_sarah.pdf',
                    image:        { type: 'jpeg', quality: 0.98 },
                    html2canvas:  { scale: 2, useCORS: true },
                    jsPDF:        { unit: 'mm', format: 'a4', orientation: 'portrait' }
                };
                html2pdf().from(elemento).set(opcoes).save();
                showToast("📥 Relatório PDF gerado com sucesso!");
            };

            return (
                <div className="space-y-4">
                    <div className="flex items-center justify-between glass-dark px-4 py-3 rounded-2xl border border-cyberNeon/40">
                        <span className="text-xs font-bold text-cyberNeon flex items-center gap-2">
                            <span>📋</span> Painel de Laudos Técnicos & Galeria Comunitária
                        </span>
                        <button 
                            onClick={onBackToChat} 
                            className="px-3.5 py-1.5 bg-coralAlert/25 hover:bg-coralAlert/40 text-coralAlert border border-coralAlert/50 rounded-xl text-xs font-bold transition cursor-pointer btn-animated flex items-center gap-1.5"
                        >
                            <span>✕</span> Fechar
                        </button>
                    </div>

                    <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                        <div className="glass-dark rounded-3xl p-6 space-y-4 border border-cyberNeon/40 shadow-xl">
                            <h2 className="text-sm font-bold text-cyberNeon border-b border-cyberNeon/30 pb-2">1. Registro de Atividades e Vistoria com GPS</h2>
                            
                            <div>
                                <label className="block text-xs font-medium text-lightSilver mb-1">Nome do Técnico:</label>
                                <input type="text" value={tecnico} onChange={(e) => setTecnico(e.target.value)} placeholder="Ex: Alexander da Silva Firmo" className="w-full bg-nightBlue border border-cyberNeon/40 rounded-xl p-2.5 text-xs text-lightSilver focus:ring-2 focus:ring-cyberNeon focus:outline-none" />
                            </div>

                            <div>
                                <label className="block text-xs font-medium text-lightSilver mb-1">Comunidade / Localidade:</label>
                                <input type="text" value={localidade} onChange={(e) => setLocalidade(e.target.value)} placeholder="Ex: Comunidade Sebinho / Rio Sarapuí - Mesquita/RJ" className="w-full bg-nightBlue border border-cyberNeon/40 rounded-xl p-2.5 text-xs text-lightSilver focus:ring-2 focus:ring-cyberNeon focus:outline-none" />
                            </div>

                            <div className="bg-nightBlue p-3 rounded-2xl border border-cyberNeon/40 space-y-2">
                                <div className="flex items-center justify-between">
                                    <span className="text-xs font-bold text-cyberNeon flex items-center gap-1.5">
                                        <span>📍</span> Acionador de GPS para Laudo
                                    </span>
                                    <button 
                                        type="button" 
                                        onClick={handleAcquireGps}
                                        disabled={isAcquiringGps}
                                        className="px-3 py-1.5 bg-mintEmerald text-nightBlue font-black rounded-xl text-xs cursor-pointer btn-animated shadow"
                                    >
                                        {isAcquiringGps ? "Buscando..." : "Ligar GPS 🛰"}
                                    </button>
                                </div>
                                {gpsData ? (
                                    <div className="text-[11px] font-mono text-mintEmerald bg-petroleumPanel p-2 rounded-xl border border-mintEmerald/30">
                                        Lat: {gpsData.lat} | Lng: {gpsData.lng} (Precisão: ±{gpsData.acc}m)
                                    </div>
                                ) : (
                                    <div className="text-[10px] text-lightSilver/60 italic">
                                        Nenhum sinal de GPS ativado para este laudo ainda. Clique em "Ligar GPS" para vincular as coordenadas exatas da demanda.
                                    </div>
                                )}
                            </div>

                            <div className="grid grid-cols-2 gap-4">
                                <div>
                                    <label className="block text-xs font-medium text-lightSilver mb-1">Data:</label>
                                    <input type="date" value={dataVisita} onChange={(e) => setDataVisita(e.target.value)} className="w-full bg-nightBlue border border-cyberNeon/40 rounded-xl p-2.5 text-xs text-lightSilver focus:ring-2 focus:ring-cyberNeon focus:outline-none" />
                                </div>
                                <div>
                                    <label className="block text-xs font-medium text-lightSilver mb-1">Categoria:</label>
                                    <select value={categoria} onChange={(e) => setCategoria(e.target.value)} className="w-full bg-nightBlue border border-cyberNeon/40 rounded-xl p-2.5 text-xs text-lightSilver focus:ring-2 focus:ring-cyberNeon focus:outline-none">
                                        <option value="Infraestrutura e Drenagem">Infraestrutura e Drenagem</option>
                                        <option value="Vistoria Habitacional (LMTS)">Vistoria Habitacional (LMTS)</option>
                                        <option value="Risco Geológico / Ambiental">Risco Geológico / Ambiental</option>
                                        <option value="Demanda Social / Apoio">Demanda Social / Apoio</option>
                                    </select>
                                </div>
                            </div>

                            <div>
                                <label className="block text-xs font-medium text-lightSilver mb-1">Resumo Executivo / Descrição:</label>
                                <textarea rows="3" value={descricao} onChange={(e) => setDescdescricao(e.target.value)} placeholder="Descreva os fatos observados, dados levantados e necessidades imediatas..." className="w-full bg-nightBlue border border-cyberNeon/40 rounded-xl p-2.5 text-xs text-lightSilver focus:ring-2 focus:ring-cyberNeon focus:outline-none resize-none"></textarea>
                            </div>

                            <div>
                                <label className="block text-xs font-medium text-lightSilver mb-1">Anexar Mídia da Galeria:</label>
                                <input type="file" multiple accept="image/*,video/*,.pdf" onChange={handleFileChange} className="w-full bg-nightBlue border border-cyberNeon/40 rounded-xl p-2 text-xs text-lightSilver file:mr-3 file:py-1.5 file:px-3 file:rounded-lg file:border-0 file:text-xs file:font-semibold file:bg-cyberNeon file:text-nightBlue cursor-pointer" />
                            </div>

                            {galeriaMidia.length > 0 && (
                                <div className="grid grid-cols-3 gap-2 pt-2">
                                    {galeriaMidia.map((m, idx) => (
                                        <div key={idx} className="relative rounded-lg overflow-hidden border border-cyberNeon/30 bg-nightBlue p-1">
                                            {m.type.startsWith('image') ? (
                                                <img src={m.url} className="w-full h-16 object-cover rounded" alt="Anexo" />
                                            ) : (

            const speechIdRef = React.useRef(0);

            const showToast = (msg) => {

                setTimeout(() => setToastMessage(null), 3500);
            };

                messagesEndRef.current?.scrollIntoView({ behavior: "smooth" });

            React.useEffect(() => {

            React.useEffect(() => {
                const splashTimer = setTimeout(() => setIsLoadingSplash(false), 2400);
                return () => clearTimeout(splashTimer);

            React.useEffect(() => {
                const handleOnline = () => { setIsOnline(true); showToast("🌐 Rede reconectada!"); };
                const handleOffline = () => { setIsOnline(false); showToast("⚠ Conexão perdida. Modo offline."); };
                window.addEventListener('online', handleOnline);
                window.addEventListener('offline', handleOffline);
                return () => {
                    window.removeEventListener('online', handleOnline);
                    window.removeEventListener('offline', handleOffline);
                };
            }, []);

            React.useEffect(() => {
                window.addEventListener('beforeinstallprompt', (e) => {
                    e.preventDefault();
                    setDeferredPrompt(e);

            const handleInstallApp = async () => {
                if (deferredPrompt) {
                    deferredPrompt.prompt();

                        setDeferredPrompt(null);
                        showToast("🎉 Aplicativo instalado!");
                    }
                } else {
                    setInstallModalOpen(true);
                }
            };

            const carregarVozes = () => {
                if ("speechSynthesis" in window) {
                    voicesRef.current = window.speechSynthesis.getVoices();
                }
            };

            React.useEffect(() => {
                if (!("speechSynthesis" in window)) return;
                carregarVozes();
                window.speechSynthesis.onvoiceschanged = carregarVozes;
                return () => {
                    window.speechSynthesis.cancel();
                    window.speechSynthesis.onvoiceschanged = null;
                };
            }, []);

            const limparTextoParaFala = (text) => {
                return String(text)
                    .replace(/([\u2700-\u27BF]|[\uE000-\uF8FF]|\uD83C[\uDC00-\uDFFF]|\uD83D[\uDC00-\uDFFF]|[\u2011-\u26FF]|\uD83E[\uDD00-\uDDFF])/g, '')
                    .replace(/[#*_`~]/g, "")
                    .replace(/\[(.*?)\]\(.*?\)/g, "$1")
                    .replace(/https?:\/\/\S+/g, "")
                    .replace(/\s+/g, " ")
                    .trim();
            };

            const escolherMelhorVoz = () => {
                const voices = voicesRef.current.length ? voicesRef.current : window.speechSynthesis.getVoices();
                return voices.find((voice) => voice.lang.toLowerCase().includes("pt")) || voices[0];
            };

            const stopSpeaking = () => {
                speechIdRef.current += 1;
                if (voiceTimerRef.current) {
                    clearTimeout(voiceTimerRef.current);
                    voiceTimerRef.current = null;
                }
                if ("speechSynthesis" in window) window.speechSynthesis.cancel();
                setIsSpeaking(false);
            };

            const speakText = (text) => {
                if (!soundEnabled || !("speechSynthesis" in window)) return;
                const cleanText = limparTextoParaFala(text);
                if (!cleanText) return;
                stopSpeaking();
                const currentId = speechIdRef.current;
                voiceTimerRef.current = setTimeout(() => {
                    if (currentId !== speechIdRef.current) return;
                    const utterance = new SpeechSynthesisUtterance(cleanText);
                    utterance.lang = "pt-BR";
                    utterance.voice = escolherMelhorVoz();
                    utterance.rate = 1.0;
                    utterance.onstart = () => { if (currentId === speechIdRef.current) setIsSpeaking(true); };
                    utterance.onend = () => { if (currentId === speechIdRef.current) setIsSpeaking(false); };
                    utterance.onerror = () => setIsSpeaking(false);
                    window.speechSynthesis.speak(utterance);
                }, 200);
            };

            React.useEffect(() => {

                const timer = setTimeout(() => {
                    if (!soundEnabled) return;
                    setHasIntroduced(true);
                    localStorage.setItem("sarah_introduced_v52", "1");

                )
                    .then((res) => res.json())
                    .then((data) => {
                        if (data && data.current) setLiveWeather(data.current);
                    })
                    .catch((err) => console.warn("Clima indisponível:", err));
            }, [userCoords]);

            React.useEffect(() => {
                localStorage.setItem("sarah-theme", theme);

                    document.documentElement.classList.remove('dark');
                    document.documentElement.classList.add('warm');
                    if (metaTheme) metaTheme.setAttribute('content', '#fbf8f5');
                } else {
                    document.documentElement.classList.add('dark');
                    document.documentElement.classList.remove('warm');
                    if (metaTheme) metaTheme.setAttribute('content', '#030712');
                }
            }, [theme]);

            const toggleTheme = () => {
                setTheme(prev => {
                    const next = prev === 'dark' ? 'warm' : 'dark';
                    showToast(next === 'warm' ? '🎨 Tema Comunitário Ativado' : '🌙 Modo Escuro Ativado');
                    return next;
                });

            const toggleListening = () => {
                const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
                if (!SpeechRec) {
                    showToast("⚠️ Reconhecimento de voz indisponível.");
                    return;
                }
                if (isListening) {
                    setIsListening(false);
                    return;
                }
                const rec = new SpeechRec();
                rec.lang = "pt-BR";
                rec.onstart = () => {
                    setIsListening(true);
                    showToast("🎙 Microfone sofisticado escutando...");
                };
                rec.onresult = (event) => {
                    setInput(event.results[0][0].transcript);
                    setIsListening(false);
                    handleSendMessage(event.results[0][0].transcript);

                rec.start();

                                    role: "system",
                                    content: `Você é a SARAH IA NEXUS v5.2 PRO, núcleo inteligente de suporte e prevenção da Defesa Civil Comunitária (*Grupo Comunitário A Chave da Esperança*, Mesquita/RJ, atuando no monitoramento meteorológico e nas bacias da região, incluindo Sarapuí, Dona Eugênia, Prata e adjacências). 
${weatherContext}
Lema fundamental: "Prevenção não é mídia: é gente atenta."`
                                },
                                ...historico
                            ],
                            temperature: 0.4,
                            max_tokens: 500
                        })
                    });

                        sender: "sarah",
                        text: reply,
                        timestamp: new Date().toLocaleTimeString("pt-BR", { hour: "2-digit", minute: "2-digit" })
                    };

                    setMessages((previous) => [...previous, assistantMsg]);
                    speakText(reply);

                }
