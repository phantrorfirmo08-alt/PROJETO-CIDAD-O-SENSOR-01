<style>
@import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700;800&family=Orbitron:wght@700;900&display=swap');
body{background:radial-gradient(1200px 600px at 20% -10%,rgba(0,243,255,0.15),transparent),radial-gradient(1000px 500px at 90% 0%,rgba(16,185,129,0.12),transparent),#010205;color:#E2E8F0;font-family:'JetBrains Mono',monospace;overflow-x:hidden}

.x-btn{position:absolute;top:6px;right:6px;width:22px;height:22px;background:#000;color:#00f3ff;border-radius:50%;display:grid;place-items:center;font-weight:900;border:1px solid #00f3ff;cursor:pointer;font-size:11px;z-index:10}
.btn-primary{background:linear-gradient(90deg,#00f3ff,#22d3ee);color:#001014;font-weight:900;box-shadow:0 0 20px rgba(0,243,255,0.4);transition:.2s}
.btn-primary:active{transform:scale(.98)}
.input-futuristic{background:rgba(0,0,0,0.7);border:1px solid rgba(255,255,255,0.12);border-radius:14px;padding:12px;color:#fff;font-size:12px;outline:none;transition:.2s}
.input-futuristic:focus{border-color:#00f3ff;box-shadow:0 0 0 3px rgba(0,243,255,0.15)}

@keyframes pulseGlow{0%{transform:scale(1);box-shadow:0 0 10px currentColor}50%{transform:scale(1.15);box-shadow:0 0 25px currentColor}100%{transform:scale(1);box-shadow:0 0 10px currentColor}}
@keyframes scan{0%{transform:translateY(-100%)}100%{transform:translateY(100%)}}
.scan-line{position:absolute;left:0;right:0;height:2px;background:linear-gradient(90deg,transparent,#00f3ff,transparent);animation:scan 2.5s linear infinite;opacity:.6}
.pulse-node{animation:pulseGlow 2s infinite ease-in-out;}

/* MAPA ESPACIAL TÁTICO COM ALTO CONTRASTE E BORDAS SÓLIDAS */
.tactical-map-viewport{position:relative;width:100%;height:460px;background:#050b18;border-radius:14px;border:2px solid rgba(0,243,255,0.5);overflow:hidden;box-shadow:inset 0 0 40px rgba(0,0,0,0.9);}

.map-node:hover{transform:translate(-50%, -50%) scale(1.12);z-index:20;border-color:#00f3ff;box-shadow:0 0 25px rgba(0,243,255,0.8);}
.map-node.active{border-color:#00f3ff;background:rgba(0, 243, 255, 0.25);box-shadow:0 0 30px #00f3ff;z-index:25;}

.m-japeri { color: #f5b7b1; border-color: #c27ba0; }

.m-itaguai { color: #85c1e9; border-color: #2c3e9e; }

.m-niteroi { color: #85c1e9; border-color: #1e3cbe; }

/* CHAT DA GROQ */
.groq-chat-container{position:fixed;bottom:25px;right:20px;z-index:9999;font-family:'JetBrains Mono',monospace;}
.groq-toggle-btn{background:linear-gradient(135deg,#00f3ff,#0088cc);color:#000;border:2px solid #fff;width:56px;height:56px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:'Orbitron';font-weight:900;font-size:0.55rem;cursor:pointer;box-shadow:0 4px 20px rgba(0,243,255,0.5);transition:transform 0.2s;}
.groq-toggle-btn:hover{transform:scale(1.08);}
.groq-chat-box{position:absolute;bottom:70px;right:0;width:320px;max-height:400px;background:rgba(5, 10, 24, 0.95);backdrop-filter:blur(16px);border:1px solid rgba(0,243,255,0.4);border-radius:16px;display:none;flex-direction:column;overflow:hidden;box-shadow:0 10px 30px rgba(0,0,0,0.8);}
.groq-chat-box.active{display:flex;}
.groq-chat-header{background:rgba(0,243,255,0.12);padding:10px 14px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid rgba(0,243,255,0.2);font-family:'Orbitron';font-size:0.6rem;color:#00f3ff;}
.groq-chat-body{height:240px;overflow-y:auto;padding:10px;display:flex;flex-direction:column;gap:8px;}
.g-msg{padding:8px 12px;border-radius:12px;font-size:0.58rem;line-height:1.4;max-width:85%;}
.g-msg-ai{background:rgba(0,243,255,0.15);border:1px solid rgba(0,243,255,0.3);color:#d1fff0;align-self:flex-start;}
.g-msg-user{background:rgba(138,43,226,0.25);border:1px solid rgba(138,43,226,0.4);color:#f3e8ff;align-self:flex-end;}
.groq-chat-footer{display:flex;padding:8px;background:rgba(0,0,0,0.6);border-top:1px solid rgba(255,255,255,0.08);gap:6px;}
.groq-chat-footer input{flex:1;background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.15);color:#fff;padding:8px 10px;border-radius:10px;font-size:0.58rem;outline:none;}
.groq-chat-footer button{background:#00f3ff;color:#000;border:none;padding:0 12px;border-radius:10px;font-weight:bold;font-size:0.6rem;cursor:pointer;}

<body class="p-2 flex justify-center min-h-screen">
<div id="root" class="w-full max-w-[760px] pb-24"></div>

<!-- CHAT DA GROQ -->
<div class="groq-chat-container">
  <div class="groq-chat-box" id="groqChatBox">
    <div class="groq-chat-header">
      <span>⚡ CHAT GROQ LPU</span>
      <span onclick="toggleGroqChat()" style="cursor:pointer; font-weight:bold; font-size:14px;">✕</span>
    </div>
    <div class="groq-chat-body" id="groqChatBody">
      <div class="g-msg g-msg-ai"><strong>[GROQ AI]:</strong> Mapa tático de alto contraste carregado com sucesso. Como posso ajudar?</div>
    </div>
    <div class="groq-chat-footer">
      <input type="text" id="groqChatInput" placeholder="Digite sua mensagem..." onkeydown="if(event.key==='Enter')sendGroqChatMsg()">
      <button onclick="sendGroqChatMsg()">➤</button>
    </div>
  </div>
  <div class="groq-toggle-btn" onclick="toggleGroqChat()" title="Abrir Chat Groq">
    GROQ
  </div>
</div>

<script>
function toggleGroqChat(){
  const box = document.getElementById('groqChatBox');
  if(box) box.classList.toggle('active');
}
function sendGroqChatMsg(){
  const input = document.getElementById('groqChatInput');
  if(!input || !input.value.trim()) return;
  const texto = input.value;
  const body = document.getElementById('groqChatBody');
  if(!body) return;
  
  const userDiv = document.createElement('div');
  userDiv.className = 'g-msg g-msg-user';
  userDiv.innerHTML = `<strong>[OPERADOR]:</strong> ${texto}`;
  body.appendChild(userDiv);
  input.value = '';
  body.scrollTop = body.scrollHeight;

  setTimeout(()=>{
    const aiDiv = document.createElement('div');
    aiDiv.className = 'g-msg g-msg-ai';
    aiDiv.innerHTML = `<strong>[GROQ AI]:</strong> Processamento efetuado com sucesso na Baixada Fluminense.`;
    body.appendChild(aiDiv);
    body.scrollTop = body.scrollHeight;
  }, 700);
}
</script>

function App(){

const streamRef=useRef(null);
const URL_WORKER="https://solitary-snow-2459.phantrorfirmo08.workers.dev/";

const showToast=(m)=>{setToast(m);setTimeout(()=>setToast(null),3500)};
const falar=(t)=>{if(!vozAtiva||!('speechSynthesis' in window))return;try{window.speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='pt-BR';window.speechSynthesis.speak(u);}catch{}};

const startCam=async()=>{try{const s=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:"environment"},width:{ideal:1280}},audio:false});streamRef.current=s;setCamOn(true);setTimeout(()=>{if(videoRef.current){videoRef.current.srcObject=s;videoRef.current.play().catch(()=>{})}},200);}catch{showToast("Câmera negada")}};
const stopCam=()=>{if(streamRef.current)streamRef.current.getTracks().forEach(t=>t.stop());setCamOn(false)};

const gerarSHA = async (texto) => {
  try {
    const enc = new TextEncoder().encode(texto);
    const buf = await crypto.subtle.digest('SHA-256', enc);
    return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, '0')).join('');
  } catch {
    return 'fallback_hash_' + Math.random();
  }
};

const capturarFoto = async () => {
  const v = videoRef.current; if(!v || v.videoWidth === 0) return;
  const c = document.createElement('canvas');
  c.width = 800; c.height = Math.round(800 * v.videoHeight / v.videoWidth);
  const ctx = c.getContext('2d');
  ctx.drawImage(v, 0, 0, c.width, c.height);

  ctx.fillStyle = 'rgba(2,4,10,0.95)'; ctx.fillRect(0, c.height - 70, c.width, 70);
  ctx.fillStyle = '#00f3ff'; ctx.font = '700 10px JetBrains Mono';

<div className="scan-line"></div>
<div className="flex justify-between items-center">
<p className="label-hud">📸 CÂMERA TÁTICA</p>
{!camOn ? <button onClick={startCam} className="text-[10px] btn-primary px-4 py-2 rounded-full tracking-widest">LIGAR CÂMERA</button> : <button onClick={stopCam} className="text-[10px] bg-slate-800 text-slate-300 px-4 py-2 rounded-full">DESLIGAR</button>}
</div>
<div className="bg-[#0a0f1a] rounded-[12px] overflow-hidden border border-white/5 relative" style={{height:'220px'}}>
<video ref={videoRef} autoPlay playsInline muted style={{width:'100%',height:'100%',objectFit:'cover',display:camOn?'block':'none'}}></video>
{!camOn && <div className="h-full grid place-items-center text-[11px] text-slate-500 font-bold tracking-widest">CÂMERA DESLIGADA</div>}
{camOn && <div className="absolute top-3 left-3 bg-red-600 text-white text-[8px] font-black px-2 py-1 rounded-full animate-pulse">● REC TÁTICO</div>}
</div>
{camOn && <button onClick={capturarFoto} className="w-full py-3.5 btn-primary rounded-[14px] text-xs tracking-[0.2em]">📸 CAPTURAR IMAGEM TÁTICA</button>}

{fotos.length>0 && (
<div className="flex gap-2.5 overflow-x-auto pt-1">
<div className="flex gap-2">
{fotos.map((f,i)=>(
<div key={i} className="relative shrink-0 group">
<img src={f.img} className="w-20 h-20 object-cover rounded-xl border border-cyan-500/40"/>
<div className="x-btn" onClick={()=>setFotos(fotos.filter((_,idx)=>idx!==i))} title="Excluir">✕</div>
</div>
))}
</div>
</div>
)}
</div>

<div className="space-y-2">
<p className="label-hud">RELATO TÉCNICO DE CAMPO</p>
<textarea value={relato} onChange={e=>setRelato(e.target.value)} rows="3" placeholder="Descreva a situação na Baixada Fluminense..." className="input-futuristic w-full resize-none"></textarea>
</div>

<button onClick={simularIAProcessamento} disabled={processing} className="w-full py-3.5 btn-primary rounded-[14px] text-xs tracking-widest disabled:opacity-50">
{processing ? 'PROCESSANDO...' : '⚡ EXECUTAR ANÁLISE DA IA'}
</button>
</div>

{/* PARECER DA IA */}
<div className="hud-panel p-4 space-y-2.5">
<p className="label-hud">🧠 PARECER TÉCNICO DA IA</p>
<div className="bg-black/70 border border-white/10 rounded-xl p-3.5">
<p className="text-[11px] text-slate-200 leading-relaxed whitespace-pre-wrap">{iaParecer}</p>
</div>
</div>

</div>
);
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
