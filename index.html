        function falarSarah(texto) {
            if (!("speechSynthesis" in window)) return;
            try {
                window.speechSynthesis.cancel();
                const cleanText = String(texto).replace(/([\u2700-\u27BF]|[\uE000-\uF8FF]|\uD83C[\uDC00-\uDFFF]|\uD83D[\uDC00-\uDFFF]|[\u2011-\u26FF]|\uD83E[\uDD00-\uDDFF])/g, '').replace(/https?:\/\/\S+/g, "").trim();
                if (!cleanText) return;
                const utterance = new SpeechSynthesisUtterance(cleanText);
                utterance.lang = "pt-BR";
                utterance.rate = 1.02; utterance.pitch = 1.05;
                const voices = window.speechSynthesis.getVoices();
                const selectedVoice = voices.find(v => v.lang.toLowerCase().includes('pt-br') && v.name.toLowerCase().includes('female')) || voices[0];
                if (selectedVoice) utterance.voice = selectedVoice;
                window.speechSynthesis.speak(utterance);
            } catch(e) {}
        }

        // Radar Tático em CSS/SVG puro (Sem tela preta)
        function RadarMeteorologicoModule() {
            const [dados, setDados] = useState({});
            const [status, setStatus] = useState('Conectando Open-Meteo...');
            const [cidadeSel, setCidadeSel] = useState('Mesquita');

            function corPorChuva(p){
                if(p >= 70) return '#7C4DFF';
                if(p >= 40) return '#FF0055';
                if(p >= 20) return '#FFB703';
                return '#00FF9D';
            }
            function textoPorChuva(p){
                if(p >= 70) return 'Muito forte';
                if(p >= 40) return 'Forte';
                if(p >= 20) return 'Moderada';
                return 'Fraca / Estável';
            }

            useEffect(() => {
                async function carregar(){
                    try{
                        const lats = MUNICIPIOS_92.map(c => c.lat).join(',');
                        const lons = MUNICIPIOS_92.map(c => c.lon).join(',');
                        const url = `https://api.open-meteo.com/v1/forecast?latitude=${lats}&longitude=${lons}&current=temperature_2m,relative_humidity_2m,wind_speed_10m&hourly=precipitation_probability&timezone=America%2FSao_Paulo&forecast_days=1`;
                        const r = await fetch(url);
                        const j = await r.json();
                        const arr = Array.isArray(j) ? j : [j];
                        const mapa = {};
                        arr.forEach((item, i) => {
                            const c = MUNICIPIOS_92[i];
                            if(!c) return;
                            const hora = new Date().getHours();
                            mapa[c.n] = {
                                temp: item.current.temperature_2m,
                                umi: item.current.relative_humidity_2m,
                                vento: item.current.wind_speed_10m,
                                chuva: item.hourly.precipitation_probability[hora] || 0
                            };
                        });
                        setDados(mapa);
                        setStatus('Open-Meteo conectado · 92 municípios · Dados reais');
                    }catch(e){ setStatus('Modo simulação ativo'); }
                }
                carregar();
            }, []);

            function posRadar(c){
                const minLon = -44.75, maxLon = -41.0, minLat = -23.25, maxLat = -20.9;
                return {
                    x: 7 + ((c.lon - minLon) / (maxLon - minLon)) * 86,
                    y: 7 + ((maxLat - c.lat) / (maxLat - minLat)) * 86
                };
            }

                { rh: 'RH I', nome: 'Baía da Ilha Grande', lat: -23.05, lon: -44.35 },
                { rh: 'RH II', nome: 'Guandu', lat: -22.65, lon: -43.70 },
                { rh: 'RH V', nome: 'Baía de Guanabara', lat: -22.75, lon: -43.15 },
            ];

            function falar(cNome){
                const d = dados[cNome];
                if(!d) return;
                setCidadeSel(cNome);
                try{
                    window.speechSynthesis.cancel();
                    const u = new SpeechSynthesisUtterance(`Em ${cNome}, agora está ${d.temp} graus. Chance de chuva ${d.chuva} por cento.`);
                    u.lang = 'pt-BR';
                    window.speechSynthesis.speak(u);
                }catch(e){}
            }

            const dSel = dados[cidadeSel];

            return (
                <div className="space-y-4 w-full font-mono">
                    <div className="rounded-[22px] border border-cyan-400/40 bg-[#02122A] p-4 space-y-3 shadow-[0_0_30px_rgba(0,255,255,0.15)] relative overflow-hidden">
                        <div className="flex justify-between items-start gap-2">
                            <h3 className="text-[14px] leading-tight font-black text-cyan-300 uppercase tracking-widest text-center flex-1">Radar Meteorológico<br/>& Nuvens ao Vivo</h3>
                            <span className="text-[9px] text-emerald-400 font-bold text-right leading-tight shrink-0 pt-1">GOES-19 • FLUXO<br/>ATIVO</span>
                        </div>
                        <p className="text-[11px] text-slate-300 text-center leading-relaxed">{status}<br/>Varredura tática com animação contínua de massas e tempestades na Baixada Fluminense.</p>

                        <div className="relative w-full aspect-square rounded-full border-[3px] border-cyan-400/70 overflow-hidden mx-auto shadow-[inset_0_0_40px_rgba(0,255,255,0.15),0_0_30px_rgba(0,255,255,0.2)] max-w-[320px]" style={{ background: "radial-gradient(circle at 50% 50%, #0A2A4A 0%, #041830 55%, #020A1A 100%)" }}>
                            <div className="absolute rounded-full border border-cyan-400/40 pointer-events-none" style={{ width: "92%", height: "92%", left: "50%", top: "50%", transform: "translate(-50%,-50%)" }} />
                            <div className="absolute rounded-full border border-cyan-400/40 pointer-events-none" style={{ width: "66%", height: "66%", left: "50%", top: "50%", transform: "translate(-50%,-50%)" }} />
                            <div className="absolute rounded-full border border-cyan-400/50 pointer-events-none" style={{ width: "38%", height: "38%", left: "50%", top: "50%", transform: "translate(-50%,-50%)" }} />
                            <div className="absolute left-1/2 top-0 bottom-0 w-px bg-cyan-400/40 pointer-events-none" />
                            <div className="absolute top-1/2 left-0 right-0 h-px bg-cyan-400/40 pointer-events-none" />
                            <div className="absolute inset-0 pointer-events-none radar-sweep" style={{ background: "conic-gradient(from 0deg, rgba(0,255,255,0.35) 0deg, rgba(0,255,255,0.12) 40deg, transparent 70deg)" }} />

                            {PONTOS_BACIAS.map(b => {
                                const p = posRadar(b);
                                return (
                                    <div key={b.rh} className="absolute text-center cursor-pointer z-[6]" style={{ left: p.x + "%", top: p.y + "%", transform: "translate(-50%,-50%)" }} onClick={() => setCidadeSel(b.nome)}>
                                        <div className="mx-auto w-[14px] h-[14px] rotate-45 border-2 border-white rounded-[3px]" style={{ background: '#00FF9D', boxShadow: "0 0 8px #00FF9D" }} />
                                        <span className="text-[7px] px-1 py-[1px] rounded mt-[2px] inline-block font-black" style={{ background: "#00E676", color: "#02240F" }}>{b.rh}</span>
                                    </div>
                                );
                            })}

                            {MUNICIPIOS_92.map(c => {
                                const p = posRadar(c);
                                const d = dados[c.n];
                                const chuva = d ? d.chuva : 0;
                                const cor = d ? corPorChuva(chuva) : '#94A3B8';
                                const sel = c.n === cidadeSel;
                                return (

                                    </div>

                        </div>

            return (
                <div className="space-y-4 max-w-4xl mx-auto font-mono">
                    <div className="cyber-card p-5 rounded-[28px] shadow-xl space-y-4 border border-cyan-400/40">
                        <div className="flex items-center justify-between border-b border-cyan-400/25 pb-3">
                            <h2 className="text-xs font-black text-cyan-300 tracking-widest">[BALANÇA] CIDADÃO SENSOR • ESG</h2>
                            <button onClick={onGoToDashboard} className="cyber-button text-[10px] py-2 px-4">RADAR</button>
                        </div>
                        <div className="bg-void/90 border border-cyan-400/30 rounded-xl p-4 space-y-2">
                            <span className="text-xs font-bold text-white">Peso Total: {pesoTotalKg.toFixed(1)} kg/L</span>
                            <span className="text-xs font-bold text-cyan-400 block">Valor Estimado: R$ {valorTotal.toFixed(2)}</span>
                        </div>
                    </div>
                </div>
            );
        }

        // Módulo Cloudflare Workers
        function AdminAreaRestritaModule({ showToast, onClose }) {
            const [pin, setPin] = useState("");
            const [unlocked, setUnlocked] = useState(false);
            const [workerUrlInput, setWorkerUrlInput] = useState(() => localStorage.getItem("raru_cloudflare_worker_url") || "");

            return (
                <div className="cyber-card p-4 space-y-4 border border-cyan-400/50 font-mono">
                    <div className="flex justify-between items-center border-b border-cyan-400/30 pb-2">
                        <h3 className="text-xs font-black text-cyan-300 uppercase">ÁREA RESTRITA • CLOUDFLARE WORKERS</h3>
                        <button onClick={onClose} className="cyber-button text-[9px] py-1 px-3 !border-rose-500 !text-rose-500">FECHAR</button>
                    </div>

                    {!unlocked ? (
                        <form onSubmit={(e) => { e.preventDefault(); if(pin==="303500"){ setUnlocked(true); showToast("Desbloqueado com sucesso."); } else showToast("PIN Incorreto."); }} className="flex gap-2">
                            <input type="password" placeholder="PIN (303500)" value={pin} onChange={e=>setPin(e.target.value)} className="flex-1 bg-void border border-cyan-400/40 rounded-xl p-2.5 text-xs text-white text-center" />
                            <button type="submit" className="cyber-button text-xs py-2 px-4">ENTRAR</button>
                        </form>
                    ) : (
                        <div className="space-y-3">
                            <input type="text" value={workerUrlInput} onChange={e=>setWorkerUrlInput(e.target.value)} placeholder="https://seu-worker.workers.dev" className="w-full bg-deepSpace border border-cyan-400/40 rounded-xl p-2.5 text-xs text-white" />
                            <button onClick={() => { localStorage.setItem("raru_cloudflare_worker_url", workerUrlInput); showToast("URL salva!"); }} className="cyber-button w-full text-xs py-2.5">SALVAR CONFIGURAÇÃO</button>
                        </div>
                    )}
                </div>
            );
        }

        // App Principal
        function App() {
            const [activeTab, setActiveTab] = useState("radar");
            const [toast, setToast] = useState(null);
            const showToast = (msg) => { setToast(msg); setTimeout(() => setToast(null), 3000); };

            return (
                <div className="seu-container-raru">
                    {toast && <div className="fixed top-4 left-1/2 -translate-x-1/2 z-50 cyber-card px-4 py-2 text-xs text-cyan-300 font-black shadow-2xl border border-cyan-400/60">{toast}</div>}
                    
                    <header className="cyber-card px-3 py-2 flex items-center justify-between mb-2">
                        <h1 className="text-[11px] font-black text-white">SARAH AI NEXUS V11.4 • CIDADÃO SENSOR</h1>
                    </header>

                    <main className="w-full py-2 space-y-4 pb-20">
                        {activeTab === "radar" && <RadarMeteorologicoModule />}
                        {activeTab === "balanca" && <ModuloCidadaoSensorModule onGoToDashboard={() => setActiveTab("radar")} showToast={showToast} />}
                        {activeTab === "admin" && <AdminAreaRestritaModule showToast={showToast} onClose={() => setActiveTab("radar")} />}
                    </main>

                    <footer className="cyber-card fixed bottom-0 left-0 right-0 z-40 p-2 flex justify-around max-w-[640px] mx-auto rounded-t-2xl">
                        <button onClick={() => setActiveTab("radar")} className={`cyber-button text-[10px] py-2 px-4 ${activeTab === 'radar' ? '!bg-cyan-400 !text-black' : ''}`}>Radar</button>
                        <button onClick={() => setActiveTab("balanca")} className={`cyber-button text-[10px] py-2 px-4 ${activeTab === 'balanca' ? '!bg-cyan-400 !text-black' : ''}`}>Balança</button>
                        <button onClick={() => setActiveTab("admin")} className={`cyber-button text-[10px] py-2 px-4 ${activeTab === 'admin' ? '!bg-cyan-400 !text-black' : ''}`}>Cloudflare</button>
                    </footer>
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
