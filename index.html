        // IndexedDB Inove Storage para dados pesados e vídeos (Sem limite de 5MB)
        const InoveStorage = {
            dbName: "CPARC_Inove_DB",
            storeName: "multimedia",
            open() {
                return new Promise((resolve, reject) => {
                    const req = indexedDB.open(this.dbName, 1);
                    req.onupgradeneeded = (e) => {
                        const db = e.target.result;
                        if (!db.objectStoreNames.contains(this.storeName)) {
                            db.createObjectStore(this.storeName, { keyPath: "id" });
                        }
                    };
                    req.onsuccess = (e) => resolve(e.target.result);
                    req.onerror = (e) => reject(e.target.error);
                });
            },
            async save(item) {
                const db = await this.open();
                return new Promise((resolve, reject) => {
                    const tx = db.transaction(this.storeName, "readwrite");
                    const store = tx.objectStore(this.storeName);
                    store.put(item);
                    tx.oncomplete = () => resolve(true);
                    tx.onerror = (e) => reject(e.target.error);
                });
            },
            async getAll() {
                const db = await this.open();
                return new Promise((resolve, reject) => {
                    const tx = db.transaction(this.storeName, "readonly");
                    const store = tx.objectStore(this.storeName);
                    const req = store.getAll();
                    req.onsuccess = (e) => resolve(e.target.result || []);
                    req.onerror = (e) => reject(e.target.error);
                });
            },
            async remove(id) {
                const db = await this.open();
                return new Promise((resolve, reject) => {
                    const tx = db.transaction(this.storeName, "readwrite");
                    const store = tx.objectStore(this.storeName);
                    store.delete(id);
                    tx.oncomplete = () => resolve(true);
                    tx.onerror = (e) => reject(e.target.error);
                });
            }
        };

        function FieldReportModule({ onBackToDashboard, showToast }) {
            const [setor, setSetor] = React.useState("🛡️ Defesa Civil Municipal");

            const [agente, setAgente] = React.useState("");
            const [local, setLocal] = React.useState("");
            const [desc, setDesc] = React.useState("");
            const [gps, setGps] = React.useState({ lt: '', ln: '', lk: '' });
            const [gpsSt, setGpsSt] = React.useState("📍 GPS em espera");
            const [fotos, setFotos] = React.useState([
                { id: 1, file: null, preview: null },
                { id: 2, file: null, preview: null },
                { id: 3, file: null, preview: null },
                { id: 4, file: null, preview: null }
            ]);

            const capturarGps = () => {
                if (!navigator.geolocation) return showToast("⚠️ Sem GPS");
                showToast("🛰 Buscando GPS...");
                navigator.geolocation.getCurrentPosition(
                    p => {
                        const lt = p.coords.latitude.toFixed(6);
                        const ln = p.coords.longitude.toFixed(6);
                        const lk = `https://www.google.com/maps?q=${lt},${ln}`;
                        setGps({ lt, ln, lk });
                        setLocal(`${lt}, ${ln}`);
                        setGpsSt("✅ GPS Fixado");
                        showToast("📍 Obtido com sucesso!");
                    },
                    () => setGpsSt("⚠ Erro ao obter GPS"),
                    { enableHighAccuracy: true, timeout: 10000 }
                );
            };

            const processar = (file, gpsInfo, ag, loc) => new Promise((res, rej) => {
                const rd = new FileReader();
                rd.readAsDataURL(file);
                rd.onload = e => {
                    const img = new Image();
                    img.src = e.target.result;
                    img.onload = () => {
                        const cv = document.createElement('canvas'), MAX = 600;
                        let w = img.width, h = img.height;
                        if (w > MAX || h > MAX) {
                            if (w > h) { h = Math.round(h * MAX / w); w = MAX; }
                            else { w = Math.round(w * MAX / h); h = MAX; }
                        }
                        cv.width = w; cv.height = h;
                        const ctx = cv.getContext('2d');
                        ctx.drawImage(img, 0, 0, w, h);
                        const dt = new Intl.DateTimeFormat('pt-BR', { dateStyle: 'short', timeStyle: 'medium', timeZone: 'America/Sao_Paulo' }).format(new Date()),
                              ct = gpsInfo.lt ? `${gpsInfo.lt},${gpsInfo.ln}` : (loc || 'Local não fixado'),
                              fs = Math.max(10, Math.round(w * 0.03)), pad = 8, lh = fs + 4, bh = lh * 3 + pad * 2;
                        ctx.font = `bold ${fs}px sans-serif`;
                        ctx.fillStyle = 'rgba(0,0,0,0.85)';
                        ctx.fillRect(0, h - bh, w, bh);
                        ctx.fillStyle = '#FF9900';
                        ctx.shadowColor = 'rgba(0,0,0,1)';
                        ctx.shadowBlur = 4;
                        let y = h - bh + pad + fs;
                        ctx.fillText(`📅 ${dt}`, pad, y);
                        ctx.fillText(`📍 GPS: ${ct}`, pad, y + lh);
                        ctx.fillText(`👤 Resp.: ${ag || 'Equipe de Campo / GADE'}`, pad, y + lh * 2);
                        cv.toBlob(b => {
                            if (!b) return rej();
                            const f = new File([b], `vistoria_leve_${Date.now()}.jpg`, { type: 'image/jpeg' });
                            res({ compressedFile: f, preview: cv.toDataURL('image/jpeg', 0.5) });
                        }, 'image/jpeg', 0.5);
                    };
                    img.onerror = rej;
                };
                rd.onerror = rej;
            });

            const handleFoto = async (i, e) => {
                const file = e.target.files[0];
                if (!file) return;
                e.target.value = "";
                showToast(`🔄 Otimizando foto ${i + 1}...`);
                try {
                    const { compressedFile, preview } = await processar(file, gps, agente, local);
                    setFotos(p => {
                        const n = [...p];
                        n[i] = { id: n[i].id, file: compressedFile, preview };
                        return n;
                    });
                    showToast(`📸 Foto ${i + 1} carimbada e leve!`);
                } catch {
                    showToast("❌ Erro ao processar foto");
                }
            };

            const apagar = (i, e) => {
                e.stopPropagation();
                setFotos(p => {
                    const n = [...p];
                    n[i] = { id: n[i].id, file: null, preview: null };
                    return n;
                });
                showToast(`🗑️ Foto ${i + 1} removida!`);
            };

            const montarTexto = () => {
                const c = fotos.filter(f => f.file).length,
                      dh = new Intl.DateTimeFormat('pt-BR', { dateStyle: 'short', timeStyle: 'medium', timeZone: 'America/Sao_Paulo' }).format(new Date());
                return `🚨 *RELATÓRIO TÉCNICO DE VISTORIA* 🛡️\n━━━━━━━━━━━━━━━━━━━━━━\n🏛 *Setor / Origem:* ${setor}\n⚠️ *Nível de Risco:* ${nivelRisco}\n👤 *Responsável / Agente:* ${agente || 'Não informado'}\n📅 *Data/Hora:* ${dh}\n📍 *Localidade:* ${local || 'Não informada'}\n${gps.lk ? `🔗 *Link Google Maps:* ${gps.lk}\n` : ``}━━━━━━━━━━━━━━━━━━━━━━\n📸 *Evidências Anexadas:* ${c}/4 fotos\n📝 *Relato da Ocorrência / Risco:*\n${desc || 'Sem descrição.'}\n━━━━━━━━━━━━━━━━━━━━━━\n⚡ *Sarah AI Nexus PRO* • Defesa Civil & Rede Comunitária`;
            };

            const copiar = () => navigator.clipboard.writeText(montarTexto()).then(() => showToast("📋 Relatório copiado!"));

            const compartilhar = async () => {
                const txt = montarTexto(), files = fotos.filter(f => f.file).map(f => f.file);
                if (navigator.canShare) {
                    try {
                        const d = { title: 'Relatório Técnico Sarah AI', text: txt, files: files.length ? files : undefined };
                        if (navigator.canShare(d)) { await navigator.share(d); showToast("✅ Compartilhado com sucesso!"); return; }
                    } catch (err) { if (err.name === 'AbortError') return; }
                }
                try { await navigator.clipboard.writeText(txt); } catch (e) {}
                if (files.length > 0) {
                    files.forEach((f, i) => {
                        const a = document.createElement('a');
                        a.href = URL.createObjectURL(f);
                        a.download = `vistoria_${i + 1}.jpg`;
                        a.click();
                    });
                }
                showToast("📋 Texto copiado e fotos baixadas para envio!");
                setTimeout(() => window.open(`https://wa.me/?text=${encodeURIComponent(txt)}`, '_blank'), 800);
            };

            return (
                <div className="space-y-4 max-w-xl mx-auto">
                    <div className="flex items-center justify-between cyber-card px-5 py-3.5 rounded-2xl border border-cyberCyan/30">

                        <button onClick={onBackToDashboard} className="px-3.5 py-1.5 bg-cyberRose/20 text-cyberRose rounded-xl text-xs font-bold border border-cyberRose/40">✕ Fechar</button>
                    </div>

                    <div className="cyber-card rounded-[32px] p-6 border border-cyberCyan/40 space-y-4 shadow-2xl">
                        <div className="space-y-1">
                            <label className="text-[10px] font-bold text-cyberCyan uppercase">Setor / Instituição / Coletivo</label>
                            <select value={setor} onChange={e => setSetor(e.target.value)} className="w-full bg-void border border-cyberCyan/40 rounded-2xl p-3.5 text-xs text-white">
                                <option>🛡️ Defesa Civil Municipal</option>
                                <option>🤝 Assistência Social / CRAS</option>
                                <option>🎓 Pesquisa Acadêmica / Universidade</option>
                                <option>🌱 Grupo A Chave da Esperança</option>
                                <option>👁️ Cidadão Sensor / Iniciativa Comunitária</option>
                                <option>🛠️ Técnico de Campo / Mutuário Independente</option>
                            </select>
                        </div>

                        <div className="space-y-1">
                            <label className="text-[10px] font-bold text-cyberCyan uppercase">Nível de Risco Avaliado</label>
                            <select value={nivelRisco} onChange={e => setNivelRisco(e.target.value)} className="w-full bg-void border border-cyberCyan/40 rounded-2xl p-3.5 text-xs text-white font-bold">
                                <option>🟢 Risco Baixo / Monitoramento</option>
                                <option>🟡 Risco Médio / Atenção</option>
                                <option>🟠 Risco Alto / Alerta</option>
                                <option>🔴 Risco Muito Alto / Perigo Iminente</option>
                            </select>
                        </div>

                        <div className="grid grid-cols-2 gap-3">
                            <input value={agente} onChange={e => setAgente(e.target.value)} placeholder="Nome do Responsável / Agente" className="w-full bg-void border border-cyberCyan/40 rounded-2xl p-3.5 text-xs text-white" />
                            <input value={local} onChange={e => setLocal(e.target.value)} placeholder="Localidade / Setor" className="w-full bg-void border border-cyberCyan/40 rounded-2xl p-3.5 text-xs text-white" />

                        <div className="border border-cyberCyan/40 bg-void/80 rounded-2xl p-3.5 flex items-center justify-between">

                        <div className="grid grid-cols-2 gap-3">
                            {fotos.map((f, i) => (
                                <div key={f.id} className="relative h-32 rounded-2xl border-2 border-dashed border-cyberGreen/40 bg-void flex items-center justify-center overflow-hidden">

            };

            const stopSpeaking = () => {
                speechIdRef.current += 1;
                if (voiceTimerRef.current) { clearTimeout(voiceTimerRef.current); voiceTimerRef.current = null; }
                if ("speechSynthesis" in window) window.speechSynthesis.cancel();
                setIsSpeaking(false);
            };

            const speakText = (text) => {
                if (!soundEnabled || !("speechSynthesis" in window)) return;
                const cleanText = limparTextoParaFala(text);
                if (!cleanText) return;
                stopSpeaking();
                const currentId = speechIdRef.current;
                voiceTimerRef.current = setTimeout(() => {
                    if (currentId !== speechIdRef.current) return;
                    const utterance = new SpeechSynthesisUtterance(cleanText);
                    utterance.lang = "pt-BR";
                    utterance.voice = escolherMelhorVoz();
                    utterance.rate = 1.0;
                    utterance.onstart = () => { if (currentId === speechIdRef.current) setIsSpeaking(true); };
                    utterance.onend = () => { if (currentId === speechIdRef.current) setIsSpeaking(false); };
                    utterance.onerror = () => setIsSpeaking(false);
                    window.speechSynthesis.speak(utterance);
                }, 200);
            };

            React.useEffect(() => {
                if (!termsAccepted || hasIntroduced) return;
                const greeting = getBrasiliaGreeting();
                const presentation = `${greeting}, sou a SARAH AI versão 13.0 na Central Pública e Automatizada de Resiliência Comunitária, Chave Climática, integrando os 92 municípios do Rio de Janeiro.`;
                const timer = setTimeout(() => {
                    if (!soundEnabled) return;
                    setHasIntroduced(true);
                    try { localStorage.setItem("cparc_introduced_v130", "1"); } catch(e) {}
                    speakText(presentation);
                }, 700);
                return () => clearTimeout(timer);
            }, [termsAccepted, hasIntroduced, soundEnabled]);

            const openShareFromApp = async () => {
                const manifestData = { title: "CPARC • Chave Climática", text: shareMessageText, url: APP_SHARE_URL };
                if (navigator.share) {
                    try { await navigator.share(manifestData); return; } catch (err) { if (err.name === 'AbortError') return; }
                }
                setShareModalOpen(true);
            };

            React.useEffect(() => {
                try { localStorage.setItem("sarah-theme", theme); } catch(e) {}
                const metaTheme = document.querySelector('meta[name="theme-color"]');
                if (theme === 'warm') {
                    document.documentElement.classList.remove('dark');
                    document.documentElement.classList.add('warm');
                    if (metaTheme) metaTheme.setAttribute('content', '#F4F3EF');
                } else {
                    document.documentElement.classList.add('dark');
                    document.documentElement.classList.remove('warm');
                    if (metaTheme) metaTheme.setAttribute('content', '#02040A');
                }
            }, [theme]);

            const toggleTheme = () => {
                setTheme(prev => {
                    const next = prev === 'dark' ? 'warm' : 'dark';
                    showToast(next === 'warm' ? '🎨 Tema Clean Ativado' : '🌌 Modo Cyber Ativado');
                    return next;
                });
            };

            const toggleListening = () => {
                const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
                if (!SpeechRec) { showToast("⚠️ Reconhecimento de voz indisponível."); return; }
                if (isListening) { setIsListening(false); return; }
                try {
                    const rec = new SpeechRec();
                    rec.lang = "pt-BR";
                    rec.continuous = false;
                    rec.interimResults = true;
                    rec.onstart = () => { setIsListening(true); showToast("🎙 Ouvindo voz..."); };
                    rec.onresult = (event) => {
                        let final = '';
                        for (let i = event.resultIndex; i < event.results.length; ++i) {
                            if (event.results[i].isFinal) final += event.results[i][0].transcript;
                        }
                        if (final) {
                            setInput(final);
                            setIsListening(false);
                            handleSendDirectCommand(final);
                        }
                    };
                    rec.onerror = () => { setIsListening(false); showToast("⚠ Erro no microfone."); };
                    rec.onend = () => { setIsListening(false); };
                    rec.start();
                } catch (e) { setIsListening(false); showToast("⚠️ Erro ao iniciar microfone."); }
            };

            const handleSendDirectCommand = async (textCustom) => {
                stopSpeaking();
                const textToSend = textCustom !== undefined ? textCustom : input;
                if (!textToSend.trim() || isProcessing) return;

                const queryText = textToSend.trim();
                setInput("");
                setIsProcessing(true);
                setCurrentResponse("🔄 SARAH AI processando solicitação...");

                try {
                    const response = await fetch(CLOUDFLARE_WORKER_URL, {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({
                            model: "openai/gpt-oss-120b",
                            messages: [
                                {
                                    role: "system",
                                    content: `Você é a SARAH AI versão 13.0, assistente virtual oficial da CPARC (Central Pública e Automatizada de Resiliência Comunitária) e Chave Climática, cobrindo os 92 municípios do Estado do Rio de Janeiro.`
                                },
                                { role: "user", content: queryText }
                            ],
                            temperature: 0.5,
                            max_tokens: 300
                        })
                    });

                    if (response.status === 404) {
                        throw new Error("Erro 404: Endpoint indisponível.");
                    }

                    const data = await response.json();
                    let reply = data?.choices?.[0]?.message?.content || data?.message || "Análise concluída.";
                    reply = reply.replace(/#{1,6}\s?/g, '').replace(/\*\*/g, '').replace(/\|/g, ' ').replace(/---/g, '').trim();

                    setCurrentResponse(reply);
                    speakText(reply);
                } catch (error) {
                    const fallback = "SARAH AI v13.0 à disposição na CPARC (Chave Climática). Como posso ajudar com os 92 municípios, vistorias ou monitoramento hoje?";
                    setCurrentResponse(fallback);
                    speakText(fallback);
                } finally {
                    setIsProcessing(false);
                }
            };

            const openSarahChat = () => {
                setIsChatOpen(true);
                stopSpeaking();
                const greeting = getBrasiliaGreeting();
                speakText(`${greeting}! SARAH AI v13.0 pronta na CPARC para os 92 municípios do RJ. Como posso auxiliar?`);
            };

            const NAV_TABS = [
                { id: 'dashboard', iconComponent: <HomeCommandIcon className="w-5 h-5" />, label: 'Painel' },
                { id: 'municipios', iconComponent: <MunicipiosIcon className="w-5 h-5" />, label: '92 Municípios' },
                { id: 'radar', iconComponent: <RadarScanIcon className="w-5 h-5" />, label: 'Radar' },
                { id: 'relatorio', iconComponent: <FieldReportIcon className="w-5 h-5" />, label: 'Vistoria' },
                { id: 'galeria', iconComponent: <StreamVideoIcon className="w-5 h-5" />, label: 'Vídeos' },
                { id: 'admin', iconComponent: <AdminVaultIcon className="w-5 h-5" />, label: 'Admin' }
            ];

            return (
                <div className="min-h-screen flex flex-col relative text-slate-100 antialiased">
                    {showSplash && (
                        <AppSplashScreen 
                            splashImageUrl={SPLASH_IMAGE_URL} 
                            onFinish={() => setShowSplash(false)} 
                        />
                    )}

                    {toastMessage && (
                        <div className="fixed top-20 left-1/2 -translate-x-1/2 z-50 cyber-card px-6 py-3 rounded-2xl font-display text-[11px] font-black text-cyberCyan tracking-wider shadow-2xl border border-cyberCyan/50 animate-bounce">
                            {toastMessage}
                        </div>
                    )}

                    {shareModalOpen && (
                        <div className="fixed inset-0 bg-void/90 backdrop-blur-xl z-50 flex items-center justify-center p-4">
                            <div className="cyber-card max-w-md w-full p-6 sm:p-8 rounded-[32px] space-y-4 text-center shadow-2xl border border-cyberCyan/40">
                                <h3 className="font-display text-sm font-black text-cyberCyan tracking-widest">📲 COMPARTILHAR A CPARC</h3>
                                <textarea readOnly value={shareMessageText} className="w-full h-32 bg-void border border-cyberCyan/30 rounded-2xl p-3 text-xs text-slate-200 resize-none font-mono shadow-inner" />
                                <div className="flex gap-3">
                                    <button onClick={() => { navigator.clipboard.writeText(shareMessageText); showToast("📋 Link copiado!"); setShareModalOpen(false); }} className="flex-1 py-3.5 cyber-button font-black rounded-2xl text-xs cursor-pointer shadow-lg">Copiar Link</button>
                                    <button onClick={() => setShareModalOpen(false)} className="px-5 py-3.5 bg-cyberRose/20 text-cyberRose border border-cyberRose/40 rounded-2xl text-xs font-bold cursor-pointer">Fechar</button>
                                </div>
                            </div>
                        </div>
                    )}

                    {installModalOpen && (
                        <div className="fixed inset-0 bg-void/90 backdrop-blur-xl z-50 flex items-center justify-center p-4">
                            <div className="cyber-card max-w-md w-full p-6 sm:p-8 rounded-[32px] space-y-5 text-center shadow-2xl border border-cyberCyan/40 max-h-[88vh] overflow-y-auto">
                                <div className="flex flex-col items-center space-y-2">
                                    <div className="w-24 h-24 rounded-[26px] overflow-hidden border-2 border-cyberCyan/60 shadow-[0_0_40px_rgba(0,242,254,0.4)]">
                                        <img src={MAIN_ICON_URL} alt="Ícone" className="w-full h-full object-cover" />
                                    </div>
                                    <h3 className="font-display text-sm font-black text-cyberCyan tracking-widest">INSTALAR APLICATIVO</h3>
                                    <p className="text-[10px] font-mono text-cyberGreen font-bold tracking-wider">CPARC • 92 Municípios RJ</p>
                                </div>
                                <button onClick={() => { setInstallModalOpen(false); openShareFromApp(); }}
                                    className="w-full py-3.5 cyber-button font-black rounded-2xl text-xs uppercase tracking-widest cursor-pointer shadow-xl">
                                    📲 Compartilhar CPARC + Link
                                </button>
                                <button onClick={() => setInstallModalOpen(false)}
                                    className="w-full py-3 bg-cyberRose/20 text-cyberRose border border-cyberRose/40 rounded-2xl text-xs font-bold cursor-pointer">
                                    Fechar
                                </button>
                            </div>
                        </div>
                    )}

                    {!termsAccepted && (
                        <div className="fixed inset-0 bg-void/95 z-[200] flex items-center justify-center p-4 overflow-y-auto">
                            <div className="cyber-card max-w-lg w-full p-6 sm:p-8 rounded-[36px] shadow-2xl space-y-5 my-auto border border-cyberCyan/50">
                                <div className="text-center space-y-2">
                                    <h2 className="font-display text-2xl font-black text-white tracking-[0.2em] animate-maluco-glow">CHAVE CLIMÁTICA v13.0</h2>
                                    <p className="text-xs text-cyberCyan font-black uppercase tracking-widest">Central Pública e Automatizada de Resiliência Comunitária (CPARC)</p>
                                </div>

                                <div className="space-y-2.5">
                                    <div className="bg-void/90 p-4 rounded-2xl border border-cyberCyan/20 space-y-1">
                                        <div className="text-[10px] font-display font-black text-cyberCyan tracking-widest">
                                            🛡️ SARAH AI v13.0 • 92 MUNICÍPIOS DO RJ
                                        </div>
                                        <p className="text-[11px] text-slate-300 leading-relaxed">Central comunitária com assistente inteligente SARAH AI para apoio integrado nos 92 municípios do Estado do Rio de Janeiro.</p>
                                    </div>
                                </div>

                                <div className="space-y-3">
                                    <label className="flex items-start gap-3 cursor-pointer text-xs text-slate-300 bg-commandPanel/80 p-3.5 rounded-xl border border-cyberCyan/20">
                                        <input type="checkbox" checked={check1} onChange={(e) => setCheck1(e.target.checked)} className="mt-0.5 rounded border-cyberCyan/50 text-cyberCyan w-4 h-4 bg-void shrink-0 cursor-pointer" />
                                        <span>Concordo com os princípios de solidariedade e transparência da CPARC.</span>
                                    </label>
                                    <label className="flex items-start gap-3 cursor-pointer text-xs text-slate-300 bg-commandPanel/80 p-3.5 rounded-xl border border-cyberCyan/20">
                                        <input type="checkbox" checked={check2} onChange={(e) => setCheck2(e.target.checked)} className="mt-0.5 rounded border-cyberCyan/50 text-cyberCyan w-4 h-4 bg-void shrink-0 cursor-pointer" />
                                        <span>Autorizo o uso de geolocalização para registro das vistorias de campo.</span>
                                    </label>
                                </div>

                                <button disabled={!check1 || !check2} onClick={() => { setTermsAccepted(true); try { localStorage.setItem("cparc_terms_accepted", "1"); } catch(e) {} showToast("🚀 CPARC Ativa!"); }} className={`w-full py-4 rounded-2xl font-display font-black text-xs uppercase tracking-[0.2em] transition shadow-2xl ${check1 && check2 ? 'cyber-button font-black cursor-pointer' : 'bg-commandPanel text-slate-500 cursor-not-allowed'}`}>
                                    Entrar com CHAVE CLIMÁTICA & SARAH AI
                                </button>
                            </div>
                        </div>
                    )}

                    <header className="cyber-card sticky top-0 z-30 px-4 sm:px-6 py-3.5 border-b border-cyberCyan/30 flex items-center justify-between shadow-2xl">
                        <div className="flex items-center gap-3">
                            <div className={`w-11 h-11 rounded-2xl cyber-border-glow flex items-center justify-center bg-void shadow-[0_0_30px_rgba(0,242,254,0.5)] overflow-hidden border border-cyberCyan ${isSpeaking ? 'animate-hud-pulse' : ''}`}>
                                <img src={SARAH_CUSTOM_AVATAR_URL} alt="SARAH AI" className="w-full h-full object-cover" />
                            </div>
                            <div>
                                <h1 className="font-display text-xs sm:text-sm font-black text-white tracking-[0.1em] animate-maluco-glow">CHAVE CLIMÁTICA</h1>
                                <p className="text-[9px] text-cyberGreen font-mono font-bold tracking-wider">SARAH AI • 92 MUNICÍPIOS DO RJ</p>
                            </div>
                        </div>
                        <div className="flex items-center gap-2">
                            <IconeSomToggle soundEnabled={soundEnabled} setSoundEnabled={setSoundEnabled} />
                            <IconeTemaToggle theme={theme} toggleTheme={toggleTheme} />
                            <IconeCompartilharTopo showToast={showToast} openShareFromApp={openShareFromApp} />
                            <IconeInstalarApp handleInstallApp={handleInstallApp} isInstallable={isInstallable} />
                        </div>
                    </header>

                    <nav className="cyber-card border-b border-cyberCyan/30 px-4 py-2.5 flex items-center justify-center gap-2 overflow-x-auto z-20">
                        {NAV_TABS.map(tab => (
                            <button key={tab.id} onClick={() => tab.id === 'radar' ? setRadarOpen(true) : setActiveTab(tab.id)}
                                className={`px-4 py-2 rounded-2xl text-[11px] font-black transition cursor-pointer flex items-center gap-2 shrink-0 tracking-wider ${
                                    activeTab === tab.id
                                        ? 'cyber-button font-black shadow-[0_0_25px_rgba(255,153,0,0.5)]'
                                        : 'bg-commandPanel text-slate-300 border border-cyberCyan/20'
                                }`}>
                                {tab.iconComponent} {tab.label}
                            </button>
                        ))}
                    </nav>

                    <main className="flex-1 max-w-3xl w-full mx-auto p-4 sm:p-6 space-y-5 pb-36 relative z-10">
                        {activeTab === 'dashboard' && (
                            <div className="space-y-5">
                                <div className="cyber-card p-6 sm:p-8 rounded-[36px] shadow-[0_0_70px_rgba(0,242,254,0.45)] space-y-6 text-center border-2 border-cyberCyan/80">
                                    <SarahHologramAvatar isLarge={true} isSpeaking={isSpeaking} />

                                    <div className="space-y-2">
                                        <div className="inline-flex items-center px-4 py-1.5 rounded-full bg-cyberCyan/15 border border-cyberCyan/35 font-mono text-[10px] text-cyberCyan tracking-widest shadow-inner">
                                            92 MUNICÍPIOS DO ESTADO DO RIO DE JANEIRO • CPARC
                                        </div>
                                        <h2 className="font-display text-sm font-black text-white tracking-wide">CHAVE CLIMÁTICA • Central Pública e Automatizada de Resiliência Comunitária</h2>
                                        <p className="text-xs text-slate-300 font-medium italic">
                                            "SARAH AI v13.0 • Monitoramento integrado estadual, bacias, encostas e suporte a vistorias de campo com banco Inove."
                                        </p>
                                    </div>

                                    <button onClick={openSarahChat} className="relative w-full max-w-sm mx-auto flex items-center justify-center gap-3 py-4 px-6 rounded-[26px] cyber-button font-display font-black text-sm uppercase tracking-[0.2em] shadow-[0_0_50px_rgba(255,153,0,0.6)] cursor-pointer">
                                        <svg className="w-5 h-5 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
                                        <span>FALAR COM A SARAH AI</span>
                                    </button>

                                    <div className="flex flex-wrap justify-center gap-2">
                                        <button onClick={() => setActiveTab('municipios')} className="px-4 py-2 bg-void border border-cyberCyan/30 hover:border-cyberCyan text-cyberCyan rounded-2xl text-[11px] font-bold transition cursor-pointer">🏛️ 92 Municípios RJ</button>
                                        <button onClick={() => setActiveTab('relatorio')} className="px-4 py-2 bg-void border border-cyberCyan/30 hover:border-cyberCyan text-cyberCyan rounded-2xl text-[11px] font-bold transition cursor-pointer">📋 Vistorias CPARC</button>
                                        <button onClick={() => setRadarOpen(true)} className="px-4 py-2 bg-void border border-cyberCyan/30 hover:border-cyberCyan text-cyberCyan rounded-2xl text-[11px] font-bold transition cursor-pointer">🛰️ Radar 24h</button>
                                        <button onClick={() => setActiveTab('galeria')} className="px-4 py-2 bg-void border border-cyberCyan/30 hover:border-cyberCyan text-cyberCyan rounded-2xl text-[11px] font-bold transition cursor-pointer">🎥 Streams</button>
                                    </div>
                                </div>
                            </div>
                        )}

                        {activeTab === 'municipios' && <MunicipiosModule onGoToDashboard={() => setActiveTab('dashboard')} showToast={showToast} />}
                        {activeTab === 'relatorio' && <FieldReportModule onBackToDashboard={() => setActiveTab('dashboard')} showToast={showToast} />}
                        {activeTab === 'galeria' && <PublicVideoGallery localVideos={localVideos} onGoToDashboard={() => setActiveTab('dashboard')} />}
                        {activeTab === 'admin' && (
                            <AdminVaultModule
                                localVideos={localVideos}
                                setLocalVideos={setLocalVideos}
                                marketingText={marketingText}
                                setMarketingText={setMarketingText}
                                showToast={showToast}
                                onClose={() => setActiveTab('dashboard')}
                            />
                        )}

                        <AutomatedObservatoryWidget marketingText={marketingText} />
                    </main>

                    {termsAccepted && <SarahFabButton onOpen={openSarahChat} />}

                    <NativeHydroWindRadar isOpen={radarOpen} onToggle={() => setRadarOpen(o => !o)} />

                    <SarahChatOverlay
                        isOpen={isChatOpen}
                        onClose={() => { setIsChatOpen(false); stopSpeaking(); }}
                        isSpeaking={isSpeaking}
                        isProcessing={isProcessing}
                        currentResponse={currentResponse}
                        input={input}
                        setInput={setInput}
                        handleSendDirectCommand={handleSendDirectCommand}
                        toggleListening={toggleListening}
                        isListening={isListening}
                    />

                    <footer className="cyber-card fixed bottom-0 left-0 right-0 z-40 border-t border-cyberCyan/30 px-4 py-3 flex items-center justify-around shadow-2xl backdrop-blur-2xl">
                        {NAV_TABS.map(tab => (
                            <button key={tab.id} onClick={() => tab.id === 'radar' ? setRadarOpen(true) : setActiveTab(tab.id)}
                                className={`flex flex-col items-center gap-1 cursor-pointer transition ${activeTab === tab.id ? 'text-cyberCyan scale-105' : 'text-slate-400 hover:text-white'}`}>
                                {tab.iconComponent}
                                <span className="text-[9px] font-black tracking-wider">{tab.label}</span>
                            </button>
                        ))}
                    </footer>
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
