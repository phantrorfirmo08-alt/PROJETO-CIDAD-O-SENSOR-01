  <script>
    (() => {
      const tema = localStorage.getItem("temaSarah");

      if (tema === "dark" || (!tema && matchMedia("(prefers-color-scheme: dark)").matches)) {
        document.documentElement.classList.add("dark");
      }

      const fonte = Number(localStorage.getItem("tamanhoFonteSarah"));
      if (fonte >= 11 && fonte <= 18) {
        document.documentElement.style.setProperty("--app-font-size", `${fonte}px`);
      }
    })();
  </script>

  <style>
    :root {
      --app-font-size: 14px;

    .mic-active {
      animation: pulse 1s infinite;
      background-color: #06b6d4 !important;
      color: white !important;
    }

    @keyframes pulse {
      50% {
        transform: scale(1.06);
        box-shadow: 0 0 0 8px rgba(6, 182, 212, .15);
      }
    }

    ::-webkit-scrollbar {
      width: 5px;
      height: 5px;

  </style>
