        // Radar Vetorial em Canvas com Cores Ciano/Azul
        function CanvasVectorRadar({ userCoords, liveWeather }) {
            const canvasRef = React.useRef(null);
            const [riskLevel, setRiskLevel] = React.useState("normal");

            React.useEffect(() => {
                if (liveWeather) {
                    if (liveWeather.precipitation > 15 || liveWeather.wind_speed_10m > 40) {
                        setRiskLevel("danger");
                    } else if (liveWeather.precipitation > 3 || liveWeather.wind_speed_10m > 25) {
                        setRiskLevel("attention");
                    } else {
                        setRiskLevel("normal");
                    }
                }
            }, [liveWeather]);

            React.useEffect(() => {
                const canvas = canvasRef.current;
                if (!canvas) return;
                const ctx = canvas.getContext("2d");
                let animationFrameId;
                let isPaused = false;

                let particles = Array.from({ length: 45 }, () => ({
                    x: Math.random() * canvas.width,
                    y: Math.random() * canvas.height,
                    length: Math.random() * 18 + 8,
                    speed: Math.random() * 2.5 + 1.2,
                    angle: Math.PI / 4 + (Math.random() * 0.2 - 0.1)
                }));

                const handleVisibilityChange = () => { isPaused = document.hidden; };
                document.addEventListener("visibilitychange", handleVisibilityChange);

                const render = () => {
                    if (!isPaused && ctx) {
                        canvas.width = canvas.parentElement.clientWidth || 400;
                        canvas.height = canvas.parentElement.clientHeight || 300;

                        ctx.fillStyle = "rgba(2, 6, 23, 0.25)";
                        ctx.fillRect(0, 0, canvas.width, canvas.height);

                        ctx.strokeStyle = riskLevel === 'danger' ? 'rgba(239, 68, 68, 0.3)' : riskLevel === 'attention' ? 'rgba(251, 191, 36, 0.3)' : 'rgba(56, 189, 248, 0.3)';
                        ctx.lineWidth = 1.2;
                        const centerX = canvas.width / 2;
                        const centerY = canvas.height / 2;

                        for (let r = 50; r < Math.max(canvas.width, canvas.height); r += 60) {
                            ctx.beginPath();
                            ctx.arc(centerX, centerY, r, 0, Math.PI * 2);
                            ctx.stroke();
                        }

                        ctx.beginPath();
                        ctx.moveTo(0, centerY); ctx.lineTo(canvas.width, centerY);
                        ctx.moveTo(centerX, 0); ctx.lineTo(centerX, canvas.height);
                        ctx.stroke();

                        particles.forEach(p => {
                            p.x += Math.cos(p.angle) * p.speed;
                            p.y += Math.sin(p.angle) * p.speed;

                            if (p.x > canvas.width) p.x = 0;
                            if (p.y > canvas.height) p.y = 0;

                            ctx.strokeStyle = riskLevel === 'danger' ? '#ef4444' : riskLevel === 'attention' ? '#fbbf24' : '#38bdf8';
                            ctx.lineWidth = 2;
                            ctx.beginPath();
                            ctx.moveTo(p.x, p.y);
                            ctx.lineTo(p.x - Math.cos(p.angle) * p.length, p.y - Math.sin(p.angle) * p.length);
                            ctx.stroke();
                        });

                        ctx.fillStyle = riskLevel === 'danger' ? '#ef4444' : riskLevel === 'attention' ? '#fbbf24' : '#38bdf8';
                        ctx.beginPath();
                        ctx.arc(centerX, centerY, 8, 0, Math.PI * 2);
                        ctx.fill();
                        ctx.strokeStyle = '#ffffff';
                        ctx.lineWidth = 2;
                        ctx.stroke();
                    }
                    animationFrameId = requestAnimationFrame(render);
                };

                render();

                return () => {
                    cancelAnimationFrame(animationFrameId);
                    document.removeEventListener("visibilitychange", handleVisibilityChange);
                };
            }, [riskLevel]);

            return (
                <div className="relative w-full h-full flex flex-col items-center justify-center">
                    <canvas ref={canvasRef} className="w-full h-full rounded-2xl block bg-[#050b1d]"></canvas>
                    <div className="absolute top-3 left-3 z-10 flex items-center gap-2">
                        <span className={`px-3 py-1 rounded-xl font-mono text-[11px] font-bold border shadow-md flex items-center gap-1.5 ${
                            riskLevel === 'danger' ? 'bg-red-950 text-red-400 border-red-500/50 animate-pulse' :
                            riskLevel === 'attention' ? 'bg-amber-950 text-amber-400 border-amber-500/50' :
                            'bg-blue-950 text-cyanAccent border-cyanAccent/50'
                        }`}>
                            <span className={`w-2.5 h-2.5 rounded-full ${
                                riskLevel === 'danger' ? 'bg-red-500 animate-ping' :
                                riskLevel === 'attention' ? 'bg-amber-400 animate-ping' :
                                'bg-cyanAccent animate-pulse'
                            }`}></span>
                            {riskLevel === 'danger' ? 'ALERTA MÓDULO VERMELHO (PERIGO)' : riskLevel === 'attention' ? 'ATENÇÃO (MONITORAMENTO)' : 'ESTADO NORMAL (VERDE/CIANO)'}
                        </span>
                    </div>
                </div>
            );
        }

                }
            }, []);

            React.useEffect(() => {
                window.addEventListener('beforeinstallprompt', (e) => {
                    e.preventDefault();
                    setDeferredPrompt(e);
                });
            }, []);

            const handleInstallApp = async () => {
                if (deferredPrompt) {
                    deferredPrompt.prompt();
                    const { outcome } = await deferredPrompt.userChoice;

                        setDeferredPrompt(null);
                        showToast("🎉 App instalado com sucesso!");
                    }
                } else {
                    setInstallModalOpen(true);
                }
            };

            const carregarVozes = () => {
                if ("speechSynthesis" in window) {
                    voicesRef.current = window.speechSynthesis.getVoices();
                }
            };

            React.useEffect(() => {
                if (!("speechSynthesis" in window)) return;
                carregarVozes();
                window.speechSynthesis.onvoiceschanged = carregarVozes;
                return () => {
                    window.speechSynthesis.cancel();
                    window.speechSynthesis.onvoiceschanged = null;
                };
            }, []);

            const limparTextoParaFala = (text) => {
                return String(text).replace(/[#*_`~]/g, "").replace(/\[(.*?)\]\(.*?\)/g, "$1").replace(/https?:\/\/\S+/g, "").replace(/\s+/g, " ").trim();
            };

            const escolherMelhorVoz = () => {
                const voices = voicesRef.current.length ? voicesRef.current : window.speechSynthesis.getVoices();
                return voices.find((voice) => voice.lang.toLowerCase() === "pt-br" && (voice.name.toLowerCase().includes("natural") || voice.name.toLowerCase().includes("neural"))) ||
                       voices.find((voice) => voice.lang.toLowerCase() === "pt-br") || voices[0];
            };

            const stopSpeaking = () => {
                speechIdRef.current += 1;
                if (voiceTimerRef.current) { clearTimeout(voiceTimerRef.current); voiceTimerRef.current = null; }
                if ("speechSynthesis" in window) { window.speechSynthesis.cancel(); }
                setIsSpeaking(false);
            };

            const speakText = (text) => {
                if (!soundEnabled || !("speechSynthesis" in window)) return;
                const cleanText = limparTextoParaFala(text);
                if (!cleanText) return;
                stopSpeaking();
                const currentId = speechIdRef.current;
                voiceTimerRef.current = setTimeout(() => {
                    if (currentId !== speechIdRef.current) return;
                    const utterance = new SpeechSynthesisUtterance(cleanText);
                    utterance.lang = "pt-BR";
                    utterance.voice = escolherMelhorVoz();
                    utterance.rate = 0.95;
                    utterance.pitch = 1.02;
                    utterance.onstart = () => { if (currentId === speechIdRef.current) setIsSpeaking(true); };
                    utterance.onend = () => { if (currentId === speechIdRef.current) setIsSpeaking(false); };
                    utterance.onerror = () => setIsSpeaking(false);
                    window.speechSynthesis.speak(utterance);
                }, 200);
            };

            React.useEffect(() => {

                                    <div className="p-3 sm:p-4 bg-[#020617] border-t border-cyanAccent/30">
                                        <div className="w-full bg-[#070e22] border border-cyanAccent/40 rounded-3xl p-3 sm:p-4 shadow-2xl flex flex-col gap-2 font-mono">
                                            <div className="flex items-center gap-3 bg-slate-900 border border-cyanAccent/35 rounded-2xl p-2.5 shadow-inner">
                                                <button
                                                    onClick={toggleListening}
                                                    className={`w-12 h-12 rounded-xl flex items-center justify-center shrink-0 transition cursor-pointer ${isListening ? "bg-cyanAccent text-slate-950 animate-pulse shadow-[0_0_20px_#38bdf8]" : "bg-[#020617] hover:bg-cyanAccent/20 text-cyanAccent border border-cyanAccent/40"}`}
                                                >
                                                    🎤
                                                </button>
                                                <input
                                                    type="text"
                                                    value={input}
                                                    onChange={(e) => setInput(e.target.value)}
                                                    onKeyDown={(e) => { if (e.key === "Enter") handleSendMessage(); }}
                                                    placeholder="Digite seu comando para a SARAH v16..."
                                                    className="w-full bg-transparent text-slate-100 text-sm sm:text-base font-sans focus:outline-none placeholder-slate-500 px-1"
                                                />
                                                <button
                                                    onClick={() => handleSendMessage()}
                                                    disabled={isLoadingChat || !input.trim()}
                                                    className="w-12 h-12 rounded-xl bg-gradient-to-r from-cyanAccent to-blue-600 hover:from-cyan-400 text-slate-950 flex items-center justify-center transition disabled:opacity-30 cursor-pointer shadow-[0_0_20px_rgba(56,189,248,0.5)]"
                                                >
                                                    🚀
                                                </button>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            )}

                            {/* RADAR TAB */}
                            {activeTab === "radar" && (
                                <div className="glass-cyan rounded-3xl p-5 border border-cyanAccent/40 shadow-2xl flex-1 flex flex-col">
                                    <div className="flex items-center justify-between mb-4 pb-3 border-b border-cyanAccent/30">
                                        <h3 className="font-mono text-cyanAccent text-sm font-bold flex items-center gap-2">
                                            <span>🛰️</span> Radar Vetorial Multi-Bacia • Sebinho & Rocha Sobrinho
                                        </h3>
                                        <button onClick={() => setActiveTab("chat")} className="px-4 py-2 bg-gradient-to-r from-cyan-600 to-blue-600 text-white rounded-xl font-mono text-xs font-bold cursor-pointer">
                                            ← Voltar ao Chat
                                        </button>
                                    </div>
                                    <div className="grid grid-cols-1 lg:grid-cols-4 gap-4 flex-1">
                                        <div className="lg:col-span-3 min-h-[440px] rounded-2xl overflow-hidden border-2 border-cyanAccent/50 relative shadow-2xl flex flex-col bg-[#050b1d]">
                                            <CanvasVectorRadar userCoords={userCoords} liveWeather={liveWeather} />
                                        </div>
                                        <div className="glass-cyan rounded-2xl p-4 border border-cyanAccent/40 flex flex-col justify-between shadow-lg">
                                            <div>
                                                <div className="font-mono text-xs text-cyanAccent font-bold mb-2 pb-2 border-b border-cyanAccent/20">
                                                    📡 LIGAÇÃO SATÉLITE V16
                                                </div>
                                                <p className="text-[11px] text-slate-300 font-sans leading-relaxed mb-3">
                                                    Monitoramento hidrometeorológico em tempo real nas bacias dos rios Sarapuí, Dona Eugênia e Prata.
                                                </p>
                                            </div>
                                            <div className="space-y-2">
                                                <button onClick={() => setRiverDrawerOpen(!riverDrawerOpen)} className="w-full py-2 bg-slate-900 hover:bg-blue-950 border border-cyanAccent/40 text-cyan-300 font-mono text-xs font-bold rounded-xl transition cursor-pointer">
                                                    🌊 Nível dos Rios
                                                </button>
                                                <button onClick={() => setSatelliteDrawerOpen(!satelliteDrawerOpen)} className="w-full py-2 bg-slate-900 hover:bg-blue-950 border border-cyanAccent/40 text-cyan-300 font-mono text-xs font-bold rounded-xl transition cursor-pointer">
                                                    🔭 Apontamento Satélite
                                                </button>
                                            </div>
                                        </div>
                                    </div>

                                    {riverDrawerOpen && (
                                        <div className="mt-4 bg-[#070e22] border-2 border-cyanAccent/50 rounded-2xl p-4 animate-fadeIn">
                                            <div className="flex items-center justify-between mb-3 pb-2 border-b border-cyanAccent/30 font-mono text-xs text-cyanAccent font-bold">
                                                <span>🌊 Bacias Fluviais</span>
                                                <button onClick={() => setRiverDrawerOpen(false)} className="text-slate-400 hover:text-white cursor-pointer">✕</button>
                                            </div>
                                            <div className="grid grid-cols-1 md:grid-cols-3 gap-3">
                                                <div className="bg-[#020617] p-3 rounded-xl border border-cyanAccent/30">
                                                    <div className="text-[10px] font-mono text-cyanAccent font-bold">RIO SARAPUÍ</div>
                                                    <div className="font-mono text-sm text-white font-bold mt-1">Nível: 1.3m (Normal)</div>
                                                </div>
                                                <div className="bg-[#020617] p-3 rounded-xl border border-cyanAccent/30">
                                                    <div className="text-[10px] font-mono text-cyanAccent font-bold">RIO DONA EUGÊNIA</div>
                                                    <div className="font-mono text-sm text-white font-bold mt-1">Nível: 0.9m (Normal)</div>
                                                </div>
                                                <div className="bg-[#020617] p-3 rounded-xl border border-cyanAccent/30">
                                                    <div className="text-[10px] font-mono text-cyanAccent font-bold">RIO PRATA</div>
                                                    <div className="font-mono text-sm text-white font-bold mt-1">Nível: 0.8m (Normal)</div>
                                                </div>
                                            </div>
                                        </div>
                                    )}

                                    {satelliteDrawerOpen && (
                                        <div className="mt-4 bg-[#070e22] border-2 border-cyanAccent/50 rounded-2xl p-4 animate-fadeIn">
                                            <div className="flex items-center justify-between mb-3 pb-2 border-b border-cyanAccent/30 font-mono text-xs text-cyanAccent font-bold">
                                                <span>📡 Star One D2 (70W) / Sky B1 (43W)</span>
                                                <button onClick={() => setSatelliteDrawerOpen(false)} className="text-slate-400 hover:text-white cursor-pointer">✕</button>
                                            </div>
                                            <p className="font-mono text-xs text-slate-300">Azimute: ~302° | Elevação: ~54° | LNB: ~7h30 (Star One D2)</p>
                                        </div>
                                    )}
                                </div>
                            )}

                            {/* TELEMETRY TAB */}
                            {activeTab === "telemetry" && (
                                <div className="glass-cyan rounded-3xl p-5 border border-cyanAccent/40 shadow-2xl flex-1 flex flex-col">
                                    <div className="flex items-center justify-between mb-4 pb-3 border-b border-cyanAccent/30">
                                        <h3 className="font-mono text-cyanAccent text-sm font-bold flex items-center gap-2">
                                            <span>📈</span> Monitoramento Horário • Gráfico Polished v16
                                        </h3>
                                        <button onClick={() => setActiveTab("chat")} className="px-3 py-1.5 bg-slate-900 border border-cyanAccent/40 text-cyan-300 rounded-xl font-mono text-xs cursor-pointer">
                                            ← Voltar
                                        </button>
                                    </div>
                                    <div className="flex-1 min-h-[400px] p-3 bg-[#050b1d] rounded-2xl border border-cyanAccent/40">
                                        <canvas ref={chartRef}></canvas>
                                    </div>
                                </div>
                            )}

                        </main>
                    </div>

                    {/* MODAL PAINEL DE REGISTROS / VÍDEOS */}
                    {actionPlanOpen && (
                        <div className="fixed inset-0 bg-slate-950/90 backdrop-blur-md z-50 flex items-center justify-center p-4">
                            <div className="glass-cyan border border-cyanAccent/40 w-full max-w-3xl rounded-3xl shadow-[0_0_60px_rgba(56,189,248,0.4)] overflow-hidden flex flex-col max-h-[92vh]">
                                <div className="bg-[#020617] px-6 py-4 border-b border-cyanAccent/30 flex justify-between items-center">
                                    <h3 className="font-mono text-cyanAccent text-sm font-bold flex items-center gap-2">
                                        <span>🎬</span> Painel de Produções e Registros v16
                                    </h3>
                                    <button onClick={() => { setActionPlanOpen(false); setPinInput(""); }} className="text-slate-400 hover:text-white font-mono text-xs px-3 py-1 rounded-lg bg-slate-900 border border-slate-700 cursor-pointer">
                                        ✕ Fechar
                                    </button>
                                </div>

                                <div className="p-6 space-y-5 overflow-y-auto">
                                    {!isPlanUnlocked ? (
                                        <div className="flex flex-col items-center text-center space-y-4 py-10">
                                            <div className="w-20 h-20 rounded-3xl bg-cyan-500/15 border-2 border-cyanAccent/60 flex items-center justify-center text-cyanAccent shadow-[0_0_30px_rgba(56,189,248,0.5)] text-2xl">
                                                🔒
                                            </div>
                                            <div>
                                                <h4 className="font-bold text-slate-100 font-mono text-base">Cofre Restrito v16</h4>
                                                <p className="text-xs text-cyanAccent font-mono mt-1">Insira o PIN de segurança autorizado (Ex: 24,25,30)</p>
                                            </div>
                                            <div className="w-full max-w-sm flex gap-2 pt-2">
                                                <input
                                                    type="password"
                                                    value={pinInput}
                                                    onChange={(e) => setPinInput(e.target.value)}
                                                    onKeyDown={(e) => {
                                                        if (e.key === "Enter") {
                                                            if (pinInput.trim() === "24,25,30" || pinInput.trim() === "24 25 30" || pinInput.trim() === "242530") {
                                                                setIsPlanUnlocked(true);
                                                                showToast("🔓 Acesso liberado ao Cofre!");
                                                            } else {
                                                                showToast("❌ PIN incorreto.");
                                                            }
                                                        }
                                                    }}
                                                    placeholder="Digite o PIN"
                                                    className="w-full bg-slate-900 border border-cyanAccent/40 rounded-2xl px-4 py-3 text-xs text-slate-100 font-mono focus:outline-none"
                                                />
                                                <button
                                                    onClick={() => {
                                                        if (pinInput.trim() === "24,25,30" || pinInput.trim() === "24 25 30" || pinInput.trim() === "242530") {
                                                            setIsPlanUnlocked(true);
                                                            showToast("🔓 Acesso liberado ao Cofre!");
                                                        } else {
                                                            showToast("❌ PIN incorreto.");
                                                        }
                                                    }}
                                                    className="px-6 py-3 bg-cyanAccent hover:bg-cyan-400 text-slate-950 font-mono text-xs font-bold rounded-2xl cursor-pointer shrink-0"
                                                >
                                                    Liberar
                                                </button>
                                            </div>
                                            <button
                                                onClick={() => { setIsPlanUnlocked(true); setAccessMode("free"); showToast("🔓 Acesso Livre Ativado!"); }}
                                                className="text-xs font-mono text-cyan-300 underline mt-2 cursor-pointer"
                                            >
                                                Ou clique aqui para Acesso Livre 🔓
                                            </button>
                                        </div>
                                    ) : (
                                        <div className="space-y-5 font-sans text-xs">
                                            <div className="grid grid-cols-1 sm:grid-cols-2 gap-4 bg-slate-900/80 p-4 rounded-2xl border border-cyanAccent/30">
                                                <div className="space-y-2">
                                                    <label className="block font-mono text-slate-300 text-[11px]">🏷️ Categoria:</label>
                                                    <select value={selectedCategory} onChange={(e) => setSelectedCategory(e.target.value)} className="w-full bg-slate-950 border border-cyanAccent/40 rounded-xl p-2.5 text-xs text-cyan-300 font-mono">
                                                        <option value="Ação Social">🤝 Ação Social na Comunidade</option>
                                                        <option value="Atividade do Grupo">👥 Atividade do Grupo A Chave da Esperança</option>
                                                        <option value="Órgãos Públicos">🏛️ Ação com Órgãos Públicos</option>
                                                    </select>
                                                </div>
                                                <div className="space-y-2">
                                                    <label className="block font-mono text-slate-300 text-[11px]">📥 Enviar Vídeo:</label>
                                                    <input type="file" multiple accept="video/*" onChange={handleFileUpload} className="w-full text-xs text-slate-400 file:mr-3 file:py-2 file:px-3 file:rounded-xl file:border-0 file:text-xs file:font-mono file:font-bold file:bg-cyanAccent file:text-slate-950 cursor-pointer bg-slate-950 p-2 rounded-xl border border-cyanAccent/30" />
                                                </div>
                                            </div>

                                            <div className="space-y-3">
                                                <h4 className="font-mono text-xs font-bold text-slate-200">📼 Registros Fixos ({mediaList.length}):</h4>
                                                {mediaList.length === 0 ? (
                                                    <div className="p-10 text-center text-slate-500 font-mono text-xs bg-slate-900/50 rounded-2xl border border-slate-800">
                                                        Nenhum vídeo carregado no momento.
                                                    </div>
                                                ) : (
                                                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-4 max-h-[50vh] overflow-y-auto p-1">
                                                        {mediaList.map(item => (
                                                            <div key={item.id} className="bg-slate-900 border-2 border-cyanAccent/50 rounded-2xl p-3 flex flex-col justify-between shadow-lg">
                                                                <div className="flex items-center justify-between mb-2">
                                                                    <span className="px-2 py-0.5 rounded-md bg-blue-950 border border-cyanAccent/40 font-mono text-[10px] text-cyan-300 font-bold truncate max-w-[180px]">{item.category}</span>
                                                                    <button onClick={() => removeMediaItem(item.id)} className="text-slate-400 hover:text-red-400 font-mono text-xs cursor-pointer">🗑️ Excluir</button>
                                                                </div>
                                                                <div className="w-full bg-black rounded-xl overflow-hidden border border-cyanAccent/30 aspect-video mb-2">
                                                                    <video src={item.url} className="w-full h-full object-contain" controls playsInline preload="metadata" />
                                                                </div>
                                                                <div className="space-y-0.5 font-mono text-[10px] text-slate-300">
                                                                    <div className="truncate font-bold text-cyan-200">{item.name}</div>
                                                                    <div className="flex justify-between text-slate-400">
                                                                        <span>{item.size}</span>
                                                                        <span>{item.date}</span>
                                                                    </div>
                                                                </div>
                                                            </div>
                                                        ))}
                                                    </div>
                                                )}
                                            </div>
                                        </div>
                                    )}
                                </div>
                            </div>
                        </div>
                    )}

                    {/* MARQUEE INFERIOR */}
                    <div className="bg-[#0b1329] border-t-2 border-cyanAccent py-2.5 overflow-hidden shadow-inner whitespace-nowrap">
                        <marquee behavior="scroll" direction="left" scrollamount="5" className="font-mono text-xs text-cyanAccent font-bold tracking-wide">
                            🛡️ Plano de Ação: Todos Unidos, Todos Protegidos • Seja voluntário: servir é prevenir sempre <span className="text-yellow-400 text-base font-extrabold">+</span> Nupdecs • PLANTÃO & EMERGÊNCIA SEBINHO: Defesa Civil (199 / 21 4040-1772) • Bombeiro (193) • CCO: (21) 2042-7020 • Alertas ZAP 📲 (21) 97299-3223 • CRAS Rocha Sobrinho: (21) 2042-8931
                        </marquee>
                    </div>

                    <footer className="bg-[#0b1329] border-t border-cyanAccent/40 py-4 px-4 text-center text-xs font-mono text-cyanAccent space-y-1">
                        <div className="font-bold">Defesa Civil Comunitária Cidadão Sensor • SARAH IA Core v16 PRO</div>
                        <div className="text-slate-300">Todos os direitos reservados 2024–2026 Grupo A Chave da Esperança Sebinho Mesquita RJ</div>
                    </footer>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById("root"));
        root.render(<App />);

        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js').catch(() => {});
            });
        }
    </script>
</body>
</html>
