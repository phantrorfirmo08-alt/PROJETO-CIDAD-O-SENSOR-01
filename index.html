<h1 className="font-display font-black text-[15px] text-white tracking-widest">RARU NEXUS AI V11 Plus</h1><p className="text-[10px] text-slate-300 font-bold uppercase">Rede Automatizada de Resiliência Urbana • Mesquita - RJ • IP 10.10.21.15</p>
<div onClick={falar} className="py-2 cursor-pointer"><SarahAnimatedAvatar isSpeaking={isSpeaking} /><p className="text-[9px] text-cyberCyan font-mono mt-2 bg-void/80 px-3 py-1 rounded-full border border-cyberCyan/30 inline-block">Sarah • IA Supervisor | DEFESA CIVIL • Nó-Mãe Mesquita</p></div>
<p className="text-xs bg-black/60 p-3 rounded-xl border border-cyberCyan/20 font-mono">"{speech}"</p>
<button onClick={()=>setTab('hud')} className="w-full py-3 px-4 rounded-xl bg-gradient-to-r from-cyberCyan to-blue-500 text-void font-display font-black text-[11px] uppercase tracking-wider shadow-[0_0_15px_rgba(0,242,254,0.4)]">SALA DE COMANDO (HUD 360°)</button>
<div className="grid grid-cols-2 gap-2">
<button onClick={falar} className="py-2.5 bg-void/90 border border-cyberCyan/45 text-cyberCyan rounded-xl text-[10px] font-bold">Chat Sarah AI</button>
<button onClick={()=>showToast('Manifesto Institucional: Prevenção inteligente para todos')} className="py-2.5 bg-void/90 border border-cyberCyan/45 text-cyberCyan rounded-xl text-[10px] font-bold">Quem Somos</button>
<button onClick={()=>setTab('estacao')} className="py-2.5 bg-deepSpace/90 border border-cyberCyan/35 text-cyberCyan rounded-xl text-[10px] font-bold">Estação Plus</button>
<button onClick={()=>setTab('vistoria')} className="py-2.5 bg-deepSpace/90 border border-cyberCyan/35 text-cyberGreen rounded-xl text-[10px] font-bold">Vistoria & Laudo</button>
</div>
</div>
<div className="cyber-card p-4 space-y-3 border border-cyberRose/40 shadow-[0_0_20px_rgba(255,0,85,0.15)]">
<div className="flex justify-between items-center border-b border-cyberRose/30 pb-2"><b className="text-cyberRose text-[10px] uppercase tracking-wider animate-pulse">📍 SUBESTAÇÃO MESQUITA • NÓ-MÃE • EM FOCO</b><span className="text-cyberGreen text-[9px] font-bold">● ONLINE • P2P ATIVA</span></div>
<div className="grid grid-cols-2 gap-2 text-[10px] font-mono">
<div className="bg-void/90 border border-cyberRose/40 rounded-xl p-2.5 mesquita-pulse"><span className="text-cyberRose font-bold block text-[8px]">IP / NÓ LÓGICO</span><span className="text-white font-black text-[11px]">10.10.21.15</span><br/><span className="text-slate-300">-22.78, -43.43</span></div>
<div className="bg-void/90 border border-cyberCyan/30 rounded-xl p-2.5"><span className="text-cyberCyan font-bold block text-[8px]">BACIA HIDROGRÁFICA</span><span className="text-white">Guandu</span><br/><span className="text-cyberGreen">Status: Estável (Baixo)</span></div>
</div>
<div ref={mapRef} className="w-full h-[360px] rounded-xl overflow-hidden border-2 border-cyberRose/50 shadow-[0_0_25px_rgba(255,0,85,0.25)]"></div>
<div className="flex gap-2 text-[9px] font-bold"><span className="flex items-center gap-1"><span className="w-2.5 h-2.5 rounded-full bg-cyberRose animate-ping"></span> MESQUITA IP - EM FOCO</span><span className="flex items-center gap-1"><span className="w-2.5 h-2.5 rounded-full bg-cyberCyan"></span> 91 SUBESTAÇÕES</span><span className="flex items-center gap-1"><span className="w-2.5 h-2.5 rounded-full bg-cyberGreen"></span> ONLINE</span></div>
</div>
{tab==='estacao' && <div className="cyber-card space-y-3"><h3 className="text-cyberCyan font-black text-xs uppercase">ESTAÇÃO SOBREVIVÊNCIA PLUS • TELEMETRIA P2P</h3><select value={mun.n} onChange={e=>{const m=MUNICIPIOS_92.find(x=>x.n===e.target.value);setMun(m);showToast(`Conectando ao nó ${m.ip}...`); falarSarah(`Conectando ao nó ${m.n}, IP ${m.ip}.`);}} className="w-full bg-void border border-cyberCyan/40 rounded-xl p-2.5 text-xs text-white font-bold">{MUNICIPIOS_92.map((m,i)=><option key={i} value={m.n}>{m.n} (IP:{m.ip})</option>)}</select><div className="bg-void/90 p-3 rounded-xl border border-cyberCyan/30 text-xs">Nó IP: {mun.ip} | Lat: {mun.lat} | Lon: {mun.lon}<br/>Bacia: {mun.baciaId} | Rede: P2P Ativa | 0800 Operacional</div><button onClick={()=>{showToast(`Sincronizando ${mun.n}...`);falarSarah(`Sincronizando ${mun.n}.`);setTimeout(()=>{showToast(`${mun.n} ${mun.ip} • Temp 26°C • Chuva 0.2mm`);falarSarah(`${mun.n} sincronizado. Temperatura 26 graus, chuva 0.2 milímetros.`);},1200);}} className="w-full cyber-button text-xs">SINCRONIZAR SUBESTAÇÃO IP</button></div>}
{tab==='vistoria' && <VistoriaModule showToast={showToast} mun={mun} />}
{tab==='hud' && <div className="cyber-card space-y-3"><h3 className="text-cyberCyan font-black text-xs">SALA DE COMANDO HUD 360° • MESQUITA EM FOCO</h3><div className="grid grid-cols-2 gap-2 text-[10px]"><div className="bg-void border border-cyberRose rounded-xl p-3 text-center"><b className="text-cyberRose block">NÓ-MÃE</b>Mesquita<br/>10.10.21.15</div><div className="bg-void border border-cyberCyan rounded-xl p-3 text-center"><b className="text-cyberCyan block">REDE</b>92 Municípios<br/>187 Subestações</div><div className="bg-void border border-cyberGreen rounded-xl p-3 text-center"><b className="text-cyberGreen block">SARAH IA</b>Supervisor<br/>2 Vozes Ativas</div><div className="bg-void border border-cyberAmber rounded-xl p-3 text-center"><b className="text-cyberAmber block">ALARME DUAL</b>CEMADEN / Russo<br/>5 min ciclo</div></div><button onClick={()=>setTab('dashboard')} className="w-full py-2 bg-white text-black font-black rounded-xl text-xs">VOLTAR AO PAINEL</button></div>}
<div className="text-center text-[8px] text-slate-500 font-mono pt-2">DEFESA CIVIL • SISTEMA CONECTADO • SEGURANÇA PÚBLICA RJ • V11 PLUS • MESQUITA IP 10.10.21.15 • IDENTIDADE VISUAL NOVA 2026</div>
</div>
);
}

function VistoriaModule({showToast,mun}){
const [fotos,setFotos]=useState([]);const [camOn,setCamOn]=useState(false);const [nome,setNome]=useState('');const [bairro,setBairro]=useState('');const [risco,setRisco]=useState('R2 - MODERADO / ALERTA');const [rel,setRel]=useState('');const [clima,setClima]=useState(null);const [acompanhando,setAcompanhando]=useState(false);
const vRef=useRef(null);const sRef=useRef(null);const intervaloRef=useRef(null);
const pararAcompanhamento=()=>{if(intervaloRef.current) clearInterval(intervaloRef.current); setAcompanhando(false); window.speechSynthesis?.cancel();};
const iniciarAcompanhamento=()=>{pararAcompanhamento(); setAcompanhando(true); const passos=[`Olá, sou a Sarah. Estou te acompanhando na vistoria de ${mun.n}, nó ${mun.ip}. Aponte para a rua, me mostre o nível da água.`,"Passo 2: Agora mostre o bueiro mais próximo. Está entupido ou limpo?","Passo 3: Mostre a encosta ou talude. Tem rachadura ou infiltração?","Passo 4: Mostre as casas próximas. Tem família em área de risco?","Perfeito. Agora capture a foto que eu fecho o laudo para você."]; let i=0; falarSarah(passos[0]); i=1; intervaloRef.current=setInterval(()=>{if(i>=passos.length){pararAcompanhamento();return;} showToast(passos[i]); falarSarah(passos[i]); i++;},6000);};
useEffect(()=>{if(!mun?.lat) return; fetch(`https://api.open-meteo.com/v1/forecast?latitude=${mun.lat}&longitude=${mun.lon}&current=temperature_2m,relative_humidity_2m,precipitation,wind_speed_10m&timezone=auto`).then(r=>r.json()).then(d=>{setClima(d.current); falarMunicipio(mun,d.current);}).catch(()=>{});},[mun]);
useEffect(()=>{return()=>{if(sRef.current) sRef.current.getTracks().forEach(t=>t.stop()); pararAcompanhamento();};},[]);
const startCam=async()=>{try{const s=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:"environment"}}});sRef.current=s;setCamOn(true);setTimeout(()=>{if(vRef.current){vRef.current.srcObject=s;vRef.current.play();}},100); setTimeout(()=>iniciarAcompanhamento(),500);}catch{showToast('Câmera bloqueada');}};
const stopCam=()=>{if(sRef.current)sRef.current.getTracks().forEach(t=>t.stop());setCamOn(false); pararAcompanhamento();};
const capturar=()=>{const v=vRef.current;if(!v)return;const c=document.createElement('canvas');c.width=400;c.height=Math.round(400*(v.videoHeight/v.videoWidth));const ctx=c.getContext('2d');ctx.drawImage(v,0,0,c.width,c.height);ctx.fillStyle='rgba(3,7,18,0.85)';ctx.fillRect(0,c.height-45,c.width,45);ctx.fillStyle='#00F2FE';ctx.font='bold 8px monospace';ctx.fillText(`${new Date().toLocaleString('pt-BR')} | ${mun.n} IP:${mun.ip} | ${risco}`,5,c.height-15);const url=c.toDataURL('image/jpeg',0.5);setFotos(p=>[...p,url].slice(0,4));showToast('Foto capturada!'); falarSarah('Foto registrada com sucesso.');};
const gerarLaudoSarah=()=>{falarSarah(`Analisando vistoria de ${mun.n}. Aguarde, estou cruzando clima e fotos.`); const chuva=clima?.precipitation||0; const texto=`RELATÓRIO COMPLETO - SARAH IA - RARU NEXUS\n1. IDENTIFICAÇÃO: Município: ${mun.n} (${mun.ip}) | Bairro: ${bairro||'Não informado'} | Responsável: ${nome||'A preencher'} | Data: ${new Date().toLocaleString('pt-BR')}\n2. CLIMA TEMPO REAL: ${clima?`${clima.temperature_2m}°C | Chuva ${chuva}mm | Umidade ${clima.relative_humidity_2m}% | Vento ${clima.wind_speed_10m} km/h`:'N/D'}\n3. EVIDÊNCIAS: ${fotos.length} foto(s) anexadas. ${fotos.length===0?'ALERTA: Fotografe via, bueiro, encosta, alagamento.':'Fotos validadas com marca d\'água.'}\n4. DIAGNÓSTICO: RISCO ${risco}\n5. PONTOS OBSERVADOS: Via, bueiro, encosta, infiltração, nível da água, moradias em risco.\n6. AÇÃO: ${risco.includes('R4')?'Avaliar evacuação. Acionar Defesa Civil e CEMADEN.':risco.includes('R3')?'Acionar GADE e Defesa Civil. Vistoriar encostas.':risco.includes('R2')?'Atenção à microdrenagem, verificar bueiros.':'Monitoramento de rotina.'}\n7. ACOMPANHAMENTO: Sarah acompanhou vistoria pela câmera em tempo real.\n8. VALIDAÇÃO: Laudo gerado por Sarah IA + validação humana. Rede 92 nós IPÊ - RJ | Nó-Mãe Mesquita 10.10.21.15`; setRel(texto); showToast('Laudo completo gerado!'); falarSarah(`Laudo pronto para ${mun.n}. Risco ${risco}. Chuva ${chuva} milímetros.`);};
const gerarPDF=async()=>{falarSarah(`Gerando PDF oficial para ${mun.n}.`); const {jsPDF}=window.jspdf;const doc=new jsPDF();doc.setFillColor(3,7,18);doc.rect(0,0,210,297,'F');doc.setTextColor(0,242,254);doc.text(`LAUDO RARU - MESQUITA FOCO ${mun.ip}`,14,18);doc.setTextColor(255,255,255);doc.text(`Responsável: ${nome}`,14,30);doc.text(`Bairro: ${bairro} | Risco: ${risco}`,14,36);doc.text(`Clima: ${clima?`${clima.temperature_2m}C | Chuva ${clima.precipitation}mm`:''}`,14,42);doc.text(doc.splitTextToSize(rel||'Sem relato',182),14,54);fotos.forEach((f,i)=>{try{doc.addImage(f,'JPEG',14+(i%2)*90,130+(Math.floor(i/2)*50),82,46);}catch{}});doc.save(`RARU_${mun.n}_${Date.now()}.pdf`);showToast('PDF gerado!'); falarSarah(`PDF baixado com sucesso para ${mun.n}.`);};
return(<div className="cyber-card space-y-3"><h3 className="text-cyberCyan font-black text-[11px] uppercase">VISTORIA DE CAMPO + LAUDO TÉCNICO SARAH IA • MESQUITA FOCO</h3><div className="bg-black border border-cyberRose/30 rounded-xl p-2 text-[9px] text-cyberRose font-bold text-center">NÓ-MÃE MESQUITA IP 10.10.21.15 • MODO DESTAQUE ATIVO</div>
{clima && <div className="bg-emerald-500/10 border border-emerald-500/30 rounded-xl p-2 text-[10px] text-emerald-300">🌡️ {clima.temperature_2m}°C | Chuva: {clima.precipitation}mm | Umidade: {clima.relative_humidity_2m}% | Vento: {clima.wind_speed_10m} km/h</div>}
<div className="bg-black rounded-xl overflow-hidden border border-cyberCyan/30 relative" style={{minHeight:'180px'}}>{camOn?<video ref={vRef} autoPlay playsInline muted style={{width:'100%',height:'180px',objectFit:'cover'}}/>:<div className="h-[180px] grid place-items-center text-slate-500 text-xs">Toque em Ligar Câmera</div>}{camOn && <div className="absolute top-0 left-0 right-0 h-[2px] bg-cyberCyan animate-raru-scan shadow-[0_0_12px_#00F2FE]"></div>}</div>
<div className="flex gap-2">{!camOn?<button onClick={startCam} className="flex-1 py-2 bg-cyberCyan/20 border border-cyberCyan text-cyberCyan rounded-xl text-[10px] font-bold">Ligar Câmera</button>:<><button onClick={stopCam} className="px-3 py-2 bg-red-400/20 border border-red-400 text-red-400 rounded-xl text-[10px] font-bold">Desligar</button><button onClick={capturar} className="flex-1 py-2 bg-cyberCyan text-black font-black rounded-xl text-[10px]">ESCANEAR COM LASER</button></>}</div>
{camOn && <button onClick={acompanhando?pararAcompanhamento:iniciarAcompanhamento} className={`w-full py-2.5 font-black rounded-xl text-[10px] uppercase border ${acompanhando?'bg-red-500 text-white animate-pulse':'bg-gradient-to-r from-purple-500 to-pink-500 text-white'}`}>{acompanhando?'⏹️ Sarah falando... Toque para silenciar':'🎥 Sarah, me acompanhar pela câmera'}</button>}
{fotos.length>0 && <div className="flex gap-2 overflow-x-auto">{fotos.map((f,i)=><img key={i} src={f} className="w-14 h-14 rounded-xl border border-cyberCyan/40 object-cover"/>)}</div>}
<input value={nome} onChange={e=>setNome(e.target.value)} placeholder="Responsável Técnico *" className="w-full bg-black border border-cyberCyan/30 rounded-xl p-2.5 text-xs text-white"/><input value={bairro} onChange={e=>setBairro(e.target.value)} placeholder="Bairro / Comunidade * (Rocha Sobrinho, etc)" className="w-full bg-black border border-cyberCyan/30 rounded-xl p-2.5 text-xs text-white"/><select value={risco} onChange={e=>setRisco(e.target.value)} className="w-full bg-black border border-cyberCyan/30 rounded-xl p-2.5 text-xs text-cyberCyan font-bold"><option>R1 - BAIXO / PREVENTIVO</option><option>R2 - MODERADO / ALERTA</option><option>R3 - ALTO / ENXURRADA</option><option>R4 - EVACUAÇÃO PREVENTIVA</option></select>
<button onClick={gerarLaudoSarah} className="w-full py-2.5 bg-gradient-to-r from-sky-500 to-indigo-600 text-white font-black text-[10px] uppercase rounded-xl">🤖 Sarah, Gerar Laudo Completo com IA</button>
<textarea value={rel} onChange={e=>setRel(e.target.value)} rows="4" placeholder="Laudo da Sarah IA aparecerá aqui..." className="w-full bg-black border border-cyberCyan/30 rounded-xl p-3 text-xs text-white"/><div className="grid grid-cols-2 gap-2"><button onClick={gerarPDF} className="py-2.5 bg-white text-black font-black rounded-xl text-xs">GERAR PDF</button><button onClick={()=>{const msg=`🛡️ LAUDO RARU • MESQUITA EM FOCO\nIP: ${mun.ip}\nLocal: ${mun.n} - ${bairro}\nRisco: ${risco}\nResp: ${nome}\n${rel}`; falarSarah(`Compartilhando laudo de ${mun.n} no WhatsApp.`); navigator.clipboard.writeText(msg);window.open(`https://api.whatsapp.com/send?text=${encodeURIComponent(msg)}`,'_blank');}} className="py-2.5 bg-[#25D366] text-black font-black rounded-xl text-xs">WHATSAPP + FOTO</button></div></div>);
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
