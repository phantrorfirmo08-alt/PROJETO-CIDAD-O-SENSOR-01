const capturar=()=>{const v=vRef.current;if(!v)return;const c=document.createElement('canvas');c.width=400;c.height=Math.round(400*(v.videoHeight/v.videoWidth));const ctx=c.getContext('2d');ctx.drawImage(v,0,0,c.width,c.height);ctx.fillStyle='rgba(3,7,18,0.85)';ctx.fillRect(0,c.height-45,c.width,45);ctx.fillStyle='#00F2FE';ctx.font='bold 8px monospace';ctx.fillText(`${new Date().toLocaleString('pt-BR')} | ${mun.n} IP:${mun.ip} | ${risco}`,5,c.height-15);const url=c.toDataURL('image/jpeg',0.5);setFotos(p=>[...p,url].slice(0,4));showToast('Foto capturada!');};
const gerarPDF=async()=>{const {jsPDF}=window.jspdf;const doc=new jsPDF();doc.setFillColor(3,7,18);doc.rect(0,0,210,297,'F');doc.setTextColor(0,242,254);doc.text(`LAUDO RARU - MESQUITA FOCO ${mun.ip}`,14,18);doc.setTextColor(255,255,255);doc.text(`Responsável: ${nome}`,14,30);doc.text(`Bairro: ${bairro} | Risco: ${risco}`,14,36);doc.text(doc.splitTextToSize(rel||'Sem relato',182),14,50);fotos.forEach((f,i)=>{try{doc.addImage(f,'JPEG',14+(i%2)*90,120+(Math.floor(i/2)*50),82,46);}catch{}});doc.save(`RARU_${mun.n}_${Date.now()}.pdf`);showToast('PDF gerado!');};
return(<div className="cyber-card space-y-3"><h3 className="text-cyberCyan font-black text-[11px] uppercase">VISTORIA DE CAMPO + LAUDO TÉCNICO SARAH IA • MESQUITA FOCO</h3><div className="bg-black border border-cyberRose/30 rounded-xl p-2 text-[9px] text-cyberRose font-bold text-center">NÓ-MÃE MESQUITA IP 10.10.21.15 • MODO DESTAQUE ATIVO</div><div className="bg-black rounded-xl overflow-hidden border border-cyberCyan/30" style={{minHeight:'180px'}}>{camOn?<video ref={vRef} autoPlay playsInline muted style={{width:'100%',height:'180px',objectFit:'cover'}}/>:<div className="h-[180px] grid place-items-center text-slate-500 text-xs">Toque em Ligar Câmera</div>}{camOn && <div className="absolute top-0 left-0 right-0 h-[2px] bg-cyberCyan animate-raru-scan shadow-[0_0_12px_#00F2FE]"></div>}</div><div className="flex gap-2">{!camOn?<button onClick={startCam} className="flex-1 py-2 bg-cyberCyan/20 border border-cyberCyan text-cyberCyan rounded-xl text-[10px] font-bold">Ligar Câmera</button>:<><button onClick={stopCam} className="px-3 py-2 bg-red-400/20 border border-red-400 text-red-400 rounded-xl text-[10px] font-bold">Desligar</button><button onClick={capturar} className="flex-1 py-2 bg-cyberCyan text-black font-black rounded-xl text-[10px]">ESCANEAR COM LASER</button></>}</div>{fotos.length>0 && <div className="flex gap-2 overflow-x-auto">{fotos.map((f,i)=><img key={i} src={f} className="w-14 h-14 rounded-xl border border-cyberCyan/40 object-cover"/>)}</div>}<input value={nome} onChange={e=>setNome(e.target.value)} placeholder="Responsável Técnico *" className="w-full bg-black border border-cyberCyan/30 rounded-xl p-2.5 text-xs text-white"/><input value= {bairro} onChange={e=>setBairro(e.target.value)} placeholder="Bairro / Comunidade * (Rocha Sobrinho, etc)" className="w-full bg-black border border-cyberCyan/30 rounded-xl p-2.5 text-xs text-white"/><select value={risco} onChange={e=>setRisco(e.target.value)} className="w-full bg-black border border-cyberCyan/30 rounded-xl p-2.5 text-xs text-cyberCyan font-bold"><option>R1 - BAIXO / PREVENTIVO</option><option>R2 - MODERADO / ALERTA</option><option>R3 - ALTO / ENXURRADA</option><option>R4 - EVACUAÇÃO PREVENTIVA</option></select><textarea value={rel} onChange={e=>setRel(e.target.value)} rows="3" placeholder="Relato técnico..." className="w-full bg-black border border-cyberCyan/30 rounded-xl p-3 text-xs text-white"/><div className="grid grid-cols-2 gap-2"><button onClick={gerarPDF} className="py-2.5 bg-white text-black font-black rounded-xl text-xs">GERAR PDF</button><button onClick={()=>{const msg=`🛡️ LAUDO RARU • MESQUITA EM FOCO\nIP: ${mun.ip}\nLocal: ${mun.n} - ${bairro}\nRisco: ${risco}\nResp: ${nome}\n${rel}`;navigator.clipboard.writeText(msg);window.open(`https://api.whatsapp.com/send?text=${encodeURIComponent(msg)}`,'_blank');}} className="py-2.5 bg-[#25D366] text-black font-black rounded-xl text-xs">WHATSAPP + FOTO</button></div></div>);
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
