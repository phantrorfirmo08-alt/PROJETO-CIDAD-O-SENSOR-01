        function App() {
            const [theme, setTheme] = React.useState(() => { try { return localStorage.getItem("sarah-theme") || "dark"; } catch(e) { return "dark"; } });
            const [soundEnabled, setSoundEnabled] = React.useState(true);
            const [isSpeaking, setIsSpeaking] = React.useState(false);
            const [isListening, setIsListening] = React.useState(false);

            const [activeTab, setActiveTab] = React.useState("dashboard");

            const [toastMessage, setToastMessage] = React.useState(null);
            const [deferredPrompt, setDeferredPrompt] = React.useState(null);
            const [isInstallable, setIsInstallable] = React.useState(false);

            const [termsAccepted, setTermsAccepted] = React.useState(
                () => { try { return localStorage.getItem("sarah_terms_accepted_v52_lgpd") === "1"; } catch(e) { return false; } }
            );
            const [check1, setCheck1] = React.useState(false);
            const [check2, setCheck2] = React.useState(false);

            const [isChatOpen, setIsChatOpen] = React.useState(false);
            const [input, setInput] = React.useState("");
            const [isProcessing, setIsProcessing] = React.useState(false);
            const [currentResponse, setCurrentResponse] = React.useState("Olá! Sou a Sarah IA, núcleo inteligente da comunidade. Falo sobre fé, cultura, lazer, culinária, cidadania e prevenção. Toque no microfone para falar ou escreva sua pergunta.");
            const [hasIntroduced, setHasIntroduced] = React.useState(
                () => { try { return localStorage.getItem("sarah_introduced_v52") === "1"; } catch(e) { return false; } }

            const [saraTip, setSaraTip] = React.useState(null);

            const [marketingText, setMarketingText] = React.useState(() => {
                try { return localStorage.getItem("sarah_marketing_text_v52") || "JUNINHO DO MERCADINHO • Preços baixos é aqui"; } catch(e) { return "JUNINHO DO MERCADINHO • Preços baixos é aqui"; }
            });

            const [localVideos, setLocalVideos] = React.useState(() => {
                try {

                } catch(e) {}
                return [{ id: 1, title: "Monitoramento Meteorológico & Hidrometeorológico - Mesquita", url: "https://www.w3schools.com/html/mov_bbb.mp4", isPinned: true }];

            React.useEffect(() => {

            const speechIdRef = React.useRef(0);
            const voiceTimerRef = React.useRef(null);
            const voicesRef = React.useRef([]);
            const topicIndexRef = React.useRef(0);

            React.useEffect(() => {
                const onPrompt = (e) => { e.preventDefault(); setDeferredPrompt(e); setIsInstallable(true); };
                const onInstalled = () => { setIsInstallable(false); showToast("🎉 SARAH IA NEXUS instalada com sucesso!"); };
                window.addEventListener('beforeinstallprompt', onPrompt);

                return () => {
                    window.removeEventListener('beforeinstallprompt', onPrompt);
                    window.removeEventListener('appinstalled', onInstalled);

            const handleInstallApp = async () => {
                if (deferredPrompt) {

                    setDeferredPrompt(null);

            const carregarVozes = () => { if ("speechSynthesis" in window) { voicesRef.current = window.speechSynthesis.getVoices(); } };
            React.useEffect(() => {
                if (!("speechSynthesis" in window)) return;
                carregarVozes();
                window.speechSynthesis.onvoiceschanged = carregarVozes;
                return () => { window.speechSynthesis.cancel(); window.speechSynthesis.onvoiceschanged = null; };
            }, []);

            const limparTextoParaFala = (text) => {
                return String(text).replace(/([\u2700-\u27BF]|[\uE000-\uF8FF]|\uD83C[\uDC00-\uDFFF]|\uD83D[\uDC00-\uDFFF]|[\u2011-\u26FF]|\uD83E[\uDD00-\uDDFF])/g, '').replace(/\[(.*?)\]\(.*?\)/g, "$1").replace(/https?:\/\/\S+/g, "").replace(/\s+/g, " ").trim();
            };

            const escolherMelhorVoz = () => {
                const voices = voicesRef.current.length ? voicesRef.current : window.speechSynthesis.getVoices();
                return voices.find((voice) => voice.lang.toLowerCase().includes("pt")) || voices[0];
            };

            const stopSpeaking = () => {
                speechIdRef.current += 1;
                if (voiceTimerRef.current) { clearTimeout(voiceTimerRef.current); voiceTimerRef.current = null; }
                if ("speechSynthesis" in window) window.speechSynthesis.cancel();
                setIsSpeaking(false);
            };

            const speakText = (text) => {
                if (!soundEnabled || !("speechSynthesis" in window)) return;
                const cleanText = limparTextoParaFala(text);
                if (!cleanText) return;
                stopSpeaking();
                const currentId = speechIdRef.current;
                voiceTimerRef.current = setTimeout(() => {
                    if (currentId !== speechIdRef.current) return;
                    const utterance = new SpeechSynthesisUtterance(cleanText);
                    utterance.lang = "pt-BR";
                    utterance.voice = escolherMelhorVoz();
                    utterance.rate = 1.0;
                    utterance.onstart = () => { if (currentId === speechIdRef.current) setIsSpeaking(true); };
                    utterance.onend = () => { if (currentId === speechIdRef.current) setIsSpeaking(false); };
                    utterance.onerror = () => setIsSpeaking(false);
                    window.speechSynthesis.speak(utterance);
                }, 200);
            };

            React.useEffect(() => {
                if (!termsAccepted || hasIntroduced) return;
                const greeting = getBrasiliaGreeting();
                const presentation = `${greeting}, sou a Sarah IA NEXUS v6.0 AURORA. Toque no botão flutuante para falar comigo. Vou compartilhar reflexões, cultura, culinária e cidadania com você.`;
                const timer = setTimeout(() => {
                    if (!soundEnabled) return;
                    setHasIntroduced(true);
                    try { localStorage.setItem("sarah_introduced_v52", "1"); } catch(e) {}
                    speakText(presentation);
                }, 700);
                return () => clearTimeout(timer);
            }, [termsAccepted, hasIntroduced, soundEnabled]);

            React.useEffect(() => {
                if (!termsAccepted) return;
                const interval = setInterval(() => {
                    if (!soundEnabled || isProcessing || isListening || isChatOpen || isSpeaking) return;
                    const topic = SARAH_TALK_TOPICS[topicIndexRef.current % SARAH_TALK_TOPICS.length];
                    const line = topic.lines[Math.floor(Math.random() * topic.lines.length)];
                    const greeting = getBrasiliaGreeting();
                    const msg = `${greeting}! ${topic.icon} ${topic.tag}. ${line}`;
                    topicIndexRef.current += 1;
                    setSaraTip({ icon: topic.icon, tag: topic.tag, text: line });
                    speakText(msg);

                return () => clearInterval(interval);
            }, [termsAccepted, soundEnabled, isProcessing, isListening, isChatOpen, isSpeaking]);

            const shareMessageText = `🛡️ *SARAH IA NEXUS v6.0 AURORA*\nDefesa Civil Comunitária • Projeto Cidadão Sensor\nCéu, Clima, Chuva, Vento & Bacias Hidrográficas\n\n⬇️ *INSTALE O APLICATIVO AQUI:*\n${APP_SHARE_URL}`;

            // Mecanismo confiável gerando ícone em memória via Canvas (Sem erros de CORS/Rede)
            const getShareIconFile = async () => {
                try {
                    const canvas = document.createElement('canvas');
                    canvas.width = 512;
                    canvas.height = 512;
                    const ctx = canvas.getContext('2d');
                    
                    const grad = ctx.createLinearGradient(0, 0, 512, 512);
                    grad.addColorStop(0, '#05070F');
                    grad.addColorStop(0.5, '#111A2E');
                    grad.addColorStop(1, '#0B1120');
                    ctx.fillStyle = grad;
                    ctx.fillRect(0, 0, 512, 512);

                    ctx.strokeStyle = '#22D3EE';
                    ctx.lineWidth = 14;
                    ctx.strokeRect(24, 24, 464, 464);

                    ctx.fillStyle = '#22D3EE';
                    ctx.font = '900 68px Orbitron, sans-serif';
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    ctx.fillText('SARAH IA', 256, 210);

                    ctx.fillStyle = '#FBBF24';
                    ctx.font = '700 32px Space Grotesk, sans-serif';
                    ctx.fillText('DEFESA CIVIL', 256, 290);

                    ctx.fillStyle = '#34D399';
                    ctx.font = '600 24px JetBrains Mono, monospace';
                    ctx.fillText('NEXUS v6.0', 256, 350);

                    return await new Promise((resolve) => {
                        canvas.toBlob((blob) => {
                            if (blob) {
                                resolve(new File([blob], 'sarah-ia-nexus.png', { type: 'image/png' }));
                            } else {
                                resolve(null);
                            }
                        }, 'image/png');
                    });
                } catch (e) {
                    return null;
                }
            };

            const openShareFromApp = async () => {
                try {
                    const iconFile = await getShareIconFile();
                    const shareData = {
                        title: "SARAH IA NEXUS AURORA - Defesa Civil Comunitária",
                        text: shareMessageText,
                        url: APP_SHARE_URL,
                        files: iconFile ? [iconFile] : []
                    };

                    if (navigator.canShare && navigator.canShare(shareData)) {
                        await navigator.share(shareData);
                        showToast("📲 App e ícone compartilhados com sucesso!");
                        return;
                    } else if (navigator.share) {
                        await navigator.share({ title: shareData.title, text: shareData.text, url: shareData.url });
                        showToast("📲 Compartilhado!");
                        return;
                    }
                } catch (err) {
                    if (err?.name === 'AbortError') return;
                }
                setShareModalOpen(true);
            };

            React.useEffect(() => {
                fetch('https://api.open-meteo.com/v1/forecast?latitude=-22.7831&longitude=-43.4294&current=temperature_2m,relative_humidity_2m,precipitation,weather_code,wind_speed_10m')
                    .then((res) => res.json())
                    .then((data) => { if (data && data.current) setLiveWeather(data.current); })
                    .catch((err) => console.warn("Clima indisponível:", err));
            }, []);

            React.useEffect(() => {
                try { localStorage.setItem("sarah-theme", theme); } catch(e) {}
                const metaTheme = document.querySelector('meta[name="theme-color"]');
                if (theme === 'warm') {
                    document.documentElement.classList.remove('dark');
                    document.documentElement.classList.add('warm');
                    if (metaTheme) metaTheme.setAttribute('content', '#F8F6F0');
                } else {
                    document.documentElement.classList.add('dark');
                    document.documentElement.classList.remove('warm');
                    if (metaTheme) metaTheme.setAttribute('content', '#05070F');
                }
            }, [theme]);

            const toggleTheme = () => {
                setTheme(prev => {
                    const next = prev === 'dark' ? 'warm' : 'dark';
                    showToast(next === 'warm' ? '🎨 Tema Comunitário Ativado' : '🌌 Modo Aurora Ativado');
                    return next;
                });
            };

            const toggleListening = () => {
                const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
                if (!SpeechRec) { showToast("⚠️ Reconhecimento de voz indisponível."); return; }
                if (isListening) { setIsListening(false); return; }
                try {
                    const rec = new SpeechRec();
                    rec.lang = "pt-BR";
                    rec.continuous = false;
                    rec.interimResults = true;
                    rec.onstart = () => { setIsListening(true); showToast("🎙 Ouvindo voz direta para a Sarah..."); };
                    rec.onresult = (event) => {
                        let final = '';
                        for (let i = event.resultIndex; i < event.results.length; ++i) {
                            if (event.results[i].isFinal) final += event.results[i][0].transcript;
                        }
                        if (final) {
                            setInput(final);
                            setIsListening(false);
                            handleSendDirectCommand(final);
                        }
                    };
                    rec.onerror = () => { setIsListening(false); showToast("⚠ Erro no microfone."); };
                    rec.onend = () => { setIsListening(false); };
                    rec.start();
                } catch (e) { setIsListening(false); showToast("⚠️ Erro ao iniciar microfone."); }
            };

            const handleSendDirectCommand = async (textCustom) => {
                stopSpeaking();
                const textToSend = textCustom !== undefined ? textCustom : input;
                if (!textToSend.trim() || isProcessing) return;

                const queryText = textToSend.trim();
                setInput("");
                setIsProcessing(true);
                setCurrentResponse("🔄 Sarah processando seu comando com o núcleo AURORA...");

                const weatherContext = liveWeather
                    ? `Condições meteorológicas atuais em Mesquita/RJ: Temperatura ${liveWeather.temperature_2m}°C, Umidade ${liveWeather.relative_humidity_2m}%, Precipitação ${liveWeather.precipitation} mm, Vento ${liveWeather.wind_speed_10m} km/h. Monitoramento ativo das bacias (Rio Sarapuí, Rio Dona Eugênia e Rio Prata).`
                    : "Dados meteorológicos e atmosféricos ativos.";

                try {
                    const response = await fetch(CLOUDFLARE_WORKER_URL, {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({
                            model: "openai/gpt-oss-120b",

                                {
                                    role: "system",
                                    content: `Você é a Sarah IA NEXUS v6.0 AURORA, núcleo de inteligência da Defesa Civil Comunitária (Grupo A Chave da Esperança, Mesquita/RJ). Responda sempre diretamente para o usuário em voz viva e falada. Você também conversa sobre fé e religião, cultura, lazer, culinária e cidadania/política de forma positiva e comunitária. ${weatherContext}`
                                },

                            temperature: 0.5,
                            max_tokens: 300
                        })
                    });

                    if (response.status === 404) {
                        throw new Error("Erro 404: Endpoint de IA indisponível na rota configurada.");

                    const data = await response.json();
                    let reply = data?.choices?.[0]?.message?.content || data?.message || "Análise concluída com sucesso.";
                    reply = reply.replace(/#{1,6}\s?/g, '').replace(/\*\*/g, '').replace(/\|/g, ' ').replace(/---/g, '').trim();

                    const fallback = error.message.includes("404")

                    speakText(fallback);

            const openSarahChat = () => {
                setIsChatOpen(true);

            return (

                                <div className="flex gap-3">

                                    <button onClick={() => setShareModalOpen(false)} className="px-5 py-3.5 bg-alertRed/15 text-alertRed border border-alertRed/35 rounded-2xl text-xs font-bold">Fechar</button>
                                </div>

                    {installModalOpen && (

                                <div className="flex flex-col items-center space-y-2">
                                    <div className="w-24 h-24 rounded-[26px] overflow-hidden border-2 border-auroraCyan/60 shadow-[0_0_40px_rgba(34,211,238,0.4)]">
                                        <img src={APP_ICON_URL} alt="Ícone SARAH IA NEXUS" className="w-full h-full object-cover" />
                                    </div>
                                    <h3 className="font-display text-sm font-black text-auroraCyan tracking-widest">INSTALAR SARAH IA NEXUS</h3>
                                    <p className="text-[10px] font-mono text-auroraMint font-bold tracking-wider">v6.0 AURORA • DEFESA CIVIL COMUNITÁRIA</p>

                                {(() => {

                                    if (isIOS) {

                                                {[

                                    if (isAndroid) {

                                    return (
                                        <div className="bg-void/85 border border-auroraCyan/30 rounded-2xl p-4 space-y-2 text-left">

                                        </div>

                                <button onClick={() => { setInstallModalOpen(false); openShareFromApp(); }}
                                    className="w-full py-3.5 btn-aurora text-void font-black rounded-2xl text-xs uppercase tracking-widest cursor-pointer btn-neo shadow-xl">
                                    📲 Compartilhar App + Ícone + Link
                                </button>
                                <button onClick={() => setInstallModalOpen(false)}
                                    className="w-full py-3 bg-alertRed/15 text-alertRed border border-alertRed/35 rounded-2xl text-xs font-bold cursor-pointer">
                                    Fechar
                                </button>
                            </div>
                        </div>
                    )}

                    {!termsAccepted && (
                        <div className="fixed inset-0 bg-void/95 z-[200] flex items-center justify-center p-4 overflow-y-auto">
                            <div className="aurora-border max-w-lg w-full p-6 sm:p-8 rounded-[36px] shadow-2xl space-y-5 my-auto">
                                <div className="text-center space-y-2">
                                    <div className="inline-flex p-3.5 rounded-3xl bg-auroraViolet/10 border border-auroraViolet/35 text-auroraViolet mb-1"><CyberShieldIcon className="w-9 h-9" /></div>
                                    <h2 className="font-display text-lg font-black text-white tracking-wide">TERMO DE RESPONSABILIDADES</h2>
                                    <p className="text-xs text-auroraCyan font-black uppercase tracking-widest">SARAH IA NEXUS v6.0 AURORA • LGPD</p>
                                </div>

                                <div className="space-y-2.5">
                                    {[
                                        { icon: "🛡️", title: "PILAR I — FINALIDADE E PREVENÇÃO", text: "Os dados coletados destinam-se exclusivamente ao monitoramento comunitário e resposta da Defesa Civil." },
                                        { icon: "⚖️", title: "PILAR II — BASE LEGAL E TRANSPARÊNCIA", text: "O tratamento observa a Lei Federal nº 13.709/2018 (LGPD)." },
                                        { icon: "🔒", title: "PILAR III — SEGURANÇA E RESPONSABILIDADE", text: "Medidas técnicas para proteção das informações." }
                                    ].map((p, i) => (
                                        <div key={i} className="bg-void/85 p-4 rounded-2xl border border-auroraViolet/25 space-y-1">
                                            <div className="flex items-center gap-2 text-[10px] font-display font-black text-auroraViolet tracking-widest">
                                                <span>{p.icon}</span> {p.title}
                                            </div>
                                            <p className="text-[11px] text-slate-300 leading-relaxed">{p.text}</p>
                                        </div>
                                    ))}
                                </div>

                                <div className="space-y-3">
                                    <label className="flex items-start gap-3 cursor-pointer text-xs text-slate-300 bg-panel/60 p-3 rounded-xl border border-auroraViolet/20">
                                        <input type="checkbox" checked={check1} onChange={(e) => setCheck1(e.target.checked)} className="mt-0.5 rounded border-auroraViolet/50 text-auroraViolet w-4 h-4 bg-void shrink-0 cursor-pointer" />
                                        <span>Li e aceito os Termos e a LGPD.</span>
                                    </label>
                                    <label className="flex items-start gap-3 cursor-pointer text-xs text-slate-300 bg-panel/60 p-3 rounded-xl border border-auroraViolet/20">
                                        <input type="checkbox" checked={check2} onChange={(e) => setCheck2(e.target.checked)} className="mt-0.5 rounded border-auroraViolet/50 text-auroraViolet w-4 h-4 bg-void shrink-0 cursor-pointer" />
                                        <span>Autorizo o uso obrigatório do GPS para vistorias.</span>
                                    </label>
                                </div>

                                <button disabled={!check1 || !check2} onClick={() => { setTermsAccepted(true); try { localStorage.setItem("sarah_terms_accepted_v52_lgpd", "1"); } catch(e) {} showToast("🚀 Núcleo AURORA ativado!"); }} className={`w-full py-4 rounded-2xl font-display font-black text-xs uppercase tracking-[0.2em] transition shadow-2xl ${check1 && check2 ? 'btn-aurora text-void cursor-pointer btn-neo' : 'bg-panel text-slate-500 cursor-not-allowed'}`}>
                                    Concordar e Iniciar Operação
                                </button>
                            </div>
                        </div>
                    )}

                    <header className="glass-panel sticky top-0 z-30 px-4 sm:px-6 py-3.5 border-b border-auroraViolet/25 flex items-center justify-between shadow-2xl">
                        <div className="flex items-center gap-3">
                            <div className="w-11 h-11 rounded-2xl aurora-border flex items-center justify-center bg-void shadow-[0_0_22px_rgba(99,102,241,0.35)]">
                                <svg width="22" height="22" viewBox="0 0 24 24" fill="url(#headerGrad)"><path d="M13 2L3 14h7l-1 8 10-12h-7l1-8z"/><defs><linearGradient id="headerGrad" x1="3" y1="2" x2="21" y2="22"><stop stopColor="#22D3EE" /><stop offset="0.6" stopColor="#6366F1" /><stop offset="1" stopColor="#FBBF24" /></linearGradient></defs></svg>
                            </div>
                            <div>
                                <h1 className="font-display text-xs sm:text-sm font-black text-white tracking-[0.15em]">SARAH IA NEXUS <span className="bg-gradient-to-r from-auroraCyan to-auroraViolet bg-clip-text text-transparent text-[10px]">v6.0 AURORA</span></h1>
                                <p className="text-[9px] text-auroraMint font-mono font-bold tracking-wider">NÚCLEO COMUNITÁRIO • MESQUITA/RJ</p>
                            </div>
                        </div>
                        <div className="flex items-center gap-2">
                            <button onClick={() => setSoundEnabled(!soundEnabled)} className={`p-2.5 rounded-xl border text-xs cursor-pointer transition btn-neo ${soundEnabled ? 'bg-auroraViolet/20 border-auroraViolet text-auroraViolet shadow' : 'bg-panel border-auroraViolet/20 text-slate-500'}`} title={soundEnabled ? "Som Ativado" : "Mudo"}>{soundEnabled ? '🔊' : '🔇'}</button>
                            <button onClick={toggleTheme} className="p-2.5 rounded-xl border border-auroraCyan/30 bg-panel text-auroraCyan text-xs cursor-pointer btn-neo shadow" title="Tema">🎨</button>
                            <button onClick={openShareFromApp} className="p-2.5 rounded-xl border border-auroraCyan/30 bg-panel text-auroraCyan text-xs cursor-pointer btn-neo shadow" title="Compartilhar pelo ícone do app">📲</button>
                            <button onClick={handleInstallApp}
                                className={`p-2.5 rounded-xl border text-xs cursor-pointer btn-neo shadow transition ${isInstallable ? 'bg-auroraMint/20 border-auroraMint text-auroraMint animate-pulse' : 'border-auroraCyan/30 bg-panel text-auroraCyan'}`}
                                title={isInstallable ? "Instalar agora — 1 clique!" : "Instalar"}>
                                📥
                            </button>
                        </div>
                    </header>

                    <nav className="glass-panel border-b border-auroraViolet/25 px-4 py-2.5 flex items-center justify-center gap-2 overflow-x-auto z-20">
                        {NAV_TABS.map(tab => (
                            <button key={tab.id} onClick={() => tab.id === 'radar' ? setRadarOpen(true) : setActiveTab(tab.id)}
                                className={`px-4 py-2 rounded-2xl text-[11px] font-black transition cursor-pointer flex items-center gap-2 shrink-0 btn-neo tracking-wider ${
                                    activeTab === tab.id
                                        ? 'btn-aurora text-void shadow-[0_0_22px_rgba(99,102,241,0.5)]'
                                        : 'bg-panel text-slate-300 border border-auroraViolet/20'
                                }`}>
                                {renderTabIcon(tab)} {tab.label}
                            </button>
                        ))}
                    </nav>

                    <main className="flex-1 max-w-3xl w-full mx-auto p-4 sm:p-6 space-y-5 pb-32 relative z-10">
                        {activeTab === 'dashboard' && (
                            <div className="space-y-5">
                                <div className="aurora-border p-6 sm:p-8 rounded-[36px] shadow-2xl space-y-6 text-center">
                                    <SarahHologramAvatar isLarge={true} isSpeaking={isSpeaking} />

                                    <div className="space-y-2">
                                        <div className="inline-flex items-center px-4 py-1.5 rounded-full bg-auroraViolet/10 border border-auroraViolet/30 font-mono text-[10px] text-auroraViolet tracking-widest shadow-inner">
                                            NÚCLEO INTELIGENTE DE PREVENÇÃO • FÉ • CULTURA • CIDADANIA
                                        </div>
                                        <h2 className="font-display text-base font-black text-white tracking-wide">CENTRAL AURORA & CLIMA</h2>
                                        <p className="text-xs text-slate-300 font-medium italic">
                                            "Prevenção não é mídia: é gente atenta." A Sarah conversa sobre clima, bacias, fé, cultura, lazer, culinária e cidadania.
                                        </p>
                                    </div>

                                    <button onClick={openSarahChat} className="relative w-full max-w-sm mx-auto flex items-center justify-center gap-3 py-4 px-6 rounded-[26px] btn-aurora text-void font-display font-black text-sm uppercase tracking-[0.2em] shadow-[0_0_45px_rgba(99,102,241,0.55)] cursor-pointer btn-neo">
                                        💬 Falar com a Sarah IA
                                    </button>

                                    {saraTip && (
                                        <div className="bg-void/80 border border-auroraPink/30 rounded-2xl p-4 text-left space-y-1.5">
                                            <div className="flex items-center gap-2 text-[10px] font-display font-black text-auroraPink tracking-widest">
                                                <span className="w-1.5 h-1.5 rounded-full bg-auroraPink animate-pulse"></span>
                                                SARAH FALANDO AGORA • {saraTip.tag}
                                            </div>
                                            <p className="text-xs text-slate-200 leading-relaxed">{saraTip.text}</p>
                                        </div>
                                    )}

                                    <div className="flex flex-wrap justify-center gap-2">
                                        <button onClick={openSarahChat} className="px-4 py-2 bg-void border border-auroraCyan/30 hover:border-auroraCyan text-auroraCyan rounded-2xl text-[11px] font-bold transition cursor-pointer btn-neo">🌊 Bacias</button>
                                        <button onClick={openSarahChat} className="px-4 py-2 bg-void border border-auroraCyan/30 hover:border-auroraCyan text-auroraCyan rounded-2xl text-[11px] font-bold transition cursor-pointer btn-neo">🌦️ Clima</button>
                                        <button onClick={openSarahChat} className="px-4 py-2 bg-void border border-auroraCyan/30 hover:border-auroraCyan text-auroraCyan rounded-2xl text-[11px] font-bold transition cursor-pointer btn-neo">🛡️ Defesa Civil</button>
                                        <button onClick={openSarahChat} className="px-4 py-2 bg-void border border-auroraPink/30 hover:border-auroraPink text-auroraPink rounded-2xl text-[11px] font-bold transition cursor-pointer btn-neo">🙏 Fé & Cultura</button>
                                    </div>
                                </div>
                            </div>
                        )}

                        {activeTab === 'relatorio' && <FieldReportModule onBackToDashboard={() => setActiveTab('dashboard')} showToast={showToast} />}
                        {activeTab === 'galeria' && <PublicVideoGallery localVideos={localVideos} onGoToDashboard={() => setActiveTab('dashboard')} />}
                        {activeTab === 'admin' && (
                            <AdminVaultModule
                                localVideos={localVideos}
                                setLocalVideos={setLocalVideos}
                                marketingText={marketingText}
                                setMarketingText={setMarketingText}
                                showToast={showToast}
                                onClose={() => setActiveTab('dashboard')}
                            />
                        )}

                        <AutomatedObservatoryWidget marketingText={marketingText} />
                    </main>

                    {termsAccepted && <SarahFabButton onOpen={openSarahChat} />}

                    <NativeHydroWindRadar isOpen={radarOpen} onToggle={() => setRadarOpen(o => !o)} />

                    <SarahChatOverlay
                        isOpen={isChatOpen}
                        onClose={() => { setIsChatOpen(false); stopSpeaking(); }}
                        isSpeaking={isSpeaking}
                        isProcessing={isProcessing}
                        currentResponse={currentResponse}
                        input={input}
                        setInput={setInput}
                        handleSendDirectCommand={handleSendDirectCommand}
                        toggleListening={toggleListening}
                        isListening={isListening}
                    />

                    <footer className="glass-panel fixed bottom-0 left-0 right-0 z-40 border-t border-auroraViolet/25 px-4 py-3 flex items-center justify-around shadow-2xl backdrop-blur-2xl">
                        {NAV_TABS.map(tab => (
                            <button key={tab.id} onClick={() => tab.id === 'radar' ? setRadarOpen(true) : setActiveTab(tab.id)}
                                className={`flex flex-col items-center gap-1 cursor-pointer transition ${activeTab === tab.id ? 'text-auroraCyan scale-105' : 'text-slate-400 hover:text-white'}`}>
                                {renderTabIcon(tab)}
                                <span className="text-[9px] font-black tracking-wider">{tab.label}</span>
                            </button>
                        ))}
                    </footer>
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
    <script>
        if ("serviceWorker" in navigator) {
            window.addEventListener("load", () => {
                navigator.serviceWorker.register("./service-worker.js")
                    .then((reg) => console.log("🛡 SARAH NEXUS: Service Worker ativo."))
                    .catch((err) => console.warn("SW não registrado:", err));
            });
        }
    </script>
</body>
</html>
