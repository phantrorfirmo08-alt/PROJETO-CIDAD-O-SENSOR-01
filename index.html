<!DOCTYPE html>
<html lang="pt-BR" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#020617">
  <meta name="description" content="SARAH AI Core — Defesa Civil Comunitária e monitoramento preventivo">
  <title>SARAH AI Core v4.6</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            brand: {
              dark: "#020617",
              cyan: "#06b6d4"
            }
          }
        }
      }
    };
  </script>

  <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    crossorigin=""
  >
  <script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    crossorigin=""
  ></script>

  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body,
    #root {
      min-height: 100%;
      margin: 0;
    }

    body {
      background: #020617;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, sans-serif;
    }

    button, input, textarea {
      font: inherit;
    }

    ::-webkit-scrollbar {
      width: 8px;
      height: 8px;
    }

    ::-webkit-scrollbar-track {
      background: #020617;
    }

    ::-webkit-scrollbar-thumb {
      background: #155e75;
      border-radius: 999px;
    }

    .sarah-avatar {
      width: 58px;
      height: 58px;
      position: relative;
      overflow: hidden;
      border: 1px solid rgba(34, 211, 238, 0.55);
      border-radius: 18px;
      background: radial-gradient(circle at 50% 35%, rgba(34, 211, 238, 0.3), transparent 38%), linear-gradient(145deg, #0f172a, #082f49);
      box-shadow: 0 0 18px rgba(6, 182, 212, 0.25), inset 0 0 18px rgba(34, 211, 238, 0.12);
    }

    .sarah-head {
      position: absolute;
      left: 50%;
      top: 9px;
      width: 31px;
      height: 34px;
      transform: translateX(-50%);
      border: 1px solid #67e8f9;
      border-radius: 48% 48% 44% 44%;
      background: linear-gradient(160deg, #164e63, #0e7490);
      box-shadow: 0 0 12px rgba(34, 211, 238, 0.45);
    }

    .sarah-shoulders {
      position: absolute;
      left: 50%;
      bottom: -8px;
      width: 52px;
      height: 28px;
      transform: translateX(-50%);
      border: 1px solid #22d3ee;
      border-radius: 50% 50% 0 0;
      background: linear-gradient(180deg, #155e75, #082f49);
    }

    .sarah-eye {
      position: absolute;
      top: 13px;
      width: 4px;
      height: 4px;
      border-radius: 50%;
      background: #cffafe;
      box-shadow: 0 0 6px #67e8f9;
      animation: sarahBlink 4.5s infinite;
    }

    .sarah-eye.left { left: 8px; }
    .sarah-eye.right { right: 8px; }

    .sarah-mouth {
      position: absolute;
      left: 50%;
      bottom: 7px;
      width: 8px;
      height: 3px;
      transform: translateX(-50%);
      border-radius: 50%;
      background: #a5f3fc;
      box-shadow: 0 0 5px #22d3ee;
    }

    .sarah-avatar.speaking .sarah-mouth {
      animation: sarahTalk 0.22s infinite alternate ease-in-out;
    }

    @keyframes sarahBlink {
      0%, 92%, 100% { transform: scaleY(1); }
      95% { transform: scaleY(0.12); }
    }

    @keyframes sarahTalk {
      from { width: 5px; height: 2px; }
      to { width: 11px; height: 7px; }
    }

    .sarah-avatar.listening {
      animation: sarahListening 1s infinite alternate ease-in-out;
    }

    @keyframes sarahListening {
      from { box-shadow: 0 0 12px rgba(34, 211, 238, 0.25); }
      to { box-shadow: 0 0 26px rgba(34, 211, 238, 0.8); }
    }
  </style>
</head>

<body class="min-h-screen bg-slate-950 text-slate-100">
  <div id="root"></div>

  <script type="text/babel">
    const { useEffect, useRef, useState } = React;

    function App() {
      const [userName] = useState("Alexander");
      const [darkMode, setDarkMode] = useState(true);
      const [fontSizeLevel, setFontSizeLevel] = useState(1);
      const [soundEnabled, setSoundEnabled] = useState(true);
      const [isSpeaking, setIsSpeaking] = useState(false);
      const [isListening, setIsListening] = useState(false);
      const [isLoadingChat, setIsLoadingChat] = useState(false);

      const [input, setInput] = useState("");
      const [liveWeather, setLiveWeather] = useState(null);

      const [mapOpen, setMapOpen] = useState(false);
      const [chartOpen, setChartOpen] = useState(false);
      const [termsOpen, setTermsOpen] = useState(false);

      const [messages, setMessages] = useState([
        {
          id: "welcome",
          sender: "sarah",
          text: "Olá. Eu sou a Sara, assistente da SARAH AI Core. Estou conectada ao monitoramento preventivo da Bacia do Rio Sarapuí, em Mesquita. Como posso ajudar?",
          timestamp: new Date().toLocaleTimeString("pt-BR", { hour: "2-digit", minute: "2-digit" })
        }
      ]);

      const mapRef = useRef(null);
      const mapInstanceRef = useRef(null);
      const chartRef = useRef(null);
      const chartInstanceRef = useRef(null);
      const recognitionRef = useRef(null);

      useEffect(() => {
        document.documentElement.classList.toggle("dark", darkMode);
      }, [darkMode]);

      useEffect(() => {
        fetch(
          "https://api.open-meteo.com/v1/forecast?latitude=-22.7845&longitude=-43.4140&current=temperature_2m,relative_humidity_2m,precipitation,weather_code&timezone=America%2FSao_Paulo"
        )
          .then((res) => res.json())
          .then((data) => {
            if (data?.current) setLiveWeather(data);
          })
          .catch(() => {});
      }, []);

      useEffect(() => {
        if (!mapOpen || !mapRef.current || mapInstanceRef.current) {
          if (mapOpen && mapInstanceRef.current) {
            setTimeout(() => mapInstanceRef.current.invalidateSize(), 100);
          }
          return;
        }
        const lat = -22.7845;
        const lon = -43.4140;
        const map = L.map(mapRef.current).setView([lat, lon], 16);
        L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
          maxZoom: 19,
          attribution: "© OpenStreetMap"
        }).addTo(map);
        L.marker([lat, lon]).addTo(map).bindPopup("<b>Rocha Sobrinho / Sebinho</b> — Mesquita").openPopup();
        mapInstanceRef.current = map;
      }, [mapOpen]);

      useEffect(() => {
        if (!chartOpen || !chartRef.current) return;
        if (chartInstanceRef.current) chartInstanceRef.current.destroy();

        chartInstanceRef.current = new Chart(chartRef.current.getContext("2d"), {
          type: "line",
          data: {
            labels: ["00:00", "03:00", "06:00", "09:00", "12:00", "15:00", "18:00", "Atual"],
            datasets: [{
              label: "Cota do Rio Sarapuí (m)",
              data: [0.8, 0.9, 0.85, 0.92, 1.1, 1.0, 0.95, 0.9],
              borderColor: "#22d3ee",
              backgroundColor: "rgba(34, 211, 238, 0.12)",
              borderWidth: 2,
              fill: true,
              tension: 0.35
            }]
          },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            scales: {
              y: { beginAtZero: true, max: 4, grid: { color: "rgba(148, 163, 184, 0.12)" }, ticks: { color: "#94a3b8" } },
              x: { grid: { color: "rgba(148, 163, 184, 0.12)" }, ticks: { color: "#94a3b8" } }
            }
          }
        });
      }, [chartOpen]);

      const speakText = (text) => {
        if (!soundEnabled || !("speechSynthesis" in window)) return;
        window.speechSynthesis.cancel();
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = "pt-BR";
        utterance.onstart = () => setIsSpeaking(true);
        utterance.onend = () => setIsSpeaking(false);
        utterance.onerror = () => setIsSpeaking(false);
        window.speechSynthesis.speak(utterance);
      };

      const handleSendMessage = async (customText) => {
        const textToSend = customText !== undefined ? customText : input;
        if (!textToSend.trim() || isLoadingChat) return;
        const cleanText = textToSend.trim();

        const userMsg = {
          id: `user-${Date.now()}`,
          sender: "user",
          text: cleanText,
          timestamp: new Date().toLocaleTimeString("pt-BR", { hour: "2-digit", minute: "2-digit" })
        };

        setMessages(prev => [...prev, userMsg]);
        if (customText === undefined) setInput("");
        setIsLoadingChat(true);

        try {
          // Tentativa de chamar a API (caso exista backend)
          const response = await fetch("/api/sarah", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ mensagem: cleanText, nome_usuario: userName })
          });
          const data = await response.json();
          if (!response.ok) throw new Error();
          
          const reply = data?.resposta || data?.alerta || "Entendido.";
          setMessages(prev => [...prev, { id: `sarah-${Date.now()}`, sender: "sarah", text: reply, timestamp: new Date().toLocaleTimeString("pt-BR", { hour: "2-digit", minute: "2-digit" }) }]);
          speakText(reply);
        } catch {
          // Fallback automático para funcionamento estático no GitHub Pages
          setTimeout(() => {
            const fallbackReply = `Olá ${userName}! Recebi sua mensagem sobre "${cleanText}". Como estamos rodando em modo estático no GitHub Pages, o núcleo de IA simulado confirma que o monitoramento da Bacia do Rio Sarapuí em Mesquita está ativo e vigilante.`;
            setMessages(prev => [...prev, { id: `sarah-${Date.now()}`, sender: "sarah", text: fallbackReply, timestamp: new Date().toLocaleTimeString("pt-BR", { hour: "2-digit", minute: "2-digit" }) }]);
            speakText(fallbackReply);
            setIsLoadingChat(false);
          }, 800);
          return;
        } finally {
          setIsLoadingChat(false);
        }
      };

      const getFontSizeClass = () => ["text-xs", "text-sm", "text-base", "text-lg"][fontSizeLevel] || "text-sm";
      const weather = liveWeather?.current;

      return (
        <div className={`${darkMode ? "bg-slate-950 text-slate-100" : "bg-slate-100 text-slate-900"} ${getFontSizeClass()} min-h-screen transition-colors`}>
          <header className="sticky top-0 z-50 border-b border-cyan-500/30 bg-slate-900/95 px-3 py-3 shadow-lg backdrop-blur-md">
            <div className="mx-auto flex max-w-4xl flex-wrap items-center justify-between gap-3">
              <div className="flex items-center gap-3">
                <div className={`sarah-avatar ${isSpeaking ? "speaking" : ""} ${isListening ? "listening" : ""}`}>
                  <div className="sarah-head">
                    <span className="sarah-eye left"></span>
                    <span className="sarah-eye right"></span>
                    <span className="sarah-mouth"></span>
                  </div>
                  <div className="sarah-shoulders"></div>
                </div>
                <div>
                  <div className="font-mono text-sm font-black text-cyan-300">SARAH AI CORE</div>
                  <div className="text-[10px] text-slate-400">Defesa Civil Comunitária</div>
                </div>
              </div>

              <div className="flex flex-wrap items-center gap-1.5">
                <button onClick={() => setDarkMode(v => !v)} className="rounded border border-slate-700 bg-slate-800 px-2.5 py-1.5 text-xs text-amber-300">
                  {darkMode ? "☀️ Dia" : "🌙 Noite"}
                </button>
                <div className="flex overflow-hidden rounded border border-slate-700 bg-slate-800">
                  <button onClick={() => setFontSizeLevel(v => Math.max(0, v - 1))} className="px-2 py-1.5 text-xs text-cyan-300">A-</button>
                  <span className="border-x border-slate-700 px-1 py-1.5 text-[10px] text-slate-400">Letra</span>
                  <button onClick={() => setFontSizeLevel(v => Math.min(3, v + 1))} className="px-2 py-1.5 text-xs text-cyan-300">A+</button>
                </div>
              </div>
            </div>
          </header>

          <main className="mx-auto max-w-2xl px-4 pt-6">
            <div className="mb-6 text-center">
              <div className="mb-3 inline-flex flex-col items-center gap-1 rounded-2xl border border-cyan-500/30 bg-cyan-500/10 px-4 py-2 shadow-inner">
                <span className="font-mono text-xs font-bold uppercase tracking-widest text-cyan-400">Defesa Civil Comunitária & Programas Sociais</span>
                <span className="font-mono text-sm font-semibold tracking-wide text-slate-100">Cidadão Sensor — Sebinho / Mesquita RJ</span>
              </div>
              <h1 className="text-2xl font-black tracking-tight text-white md:text-3xl">
                SARAH AI <span className="font-mono text-lg text-cyan-400">Core v4.6</span>
              </h1>
            </div>

            {weather && (
              <div className="mb-4 flex items-center justify-between rounded-2xl border border-cyan-500/30 bg-cyan-950/40 p-3 font-mono text-xs text-cyan-300 shadow-md">
                <span>🌡️ Mesquita: <b>{weather.temperature_2m}°C</b></span>
                <span>💧 Umidade: <b>{weather.relative_humidity_2m}%</b></span>
                <span>🌧️ Chuva: <b>{weather.precipitation} mm</b></span>
              </div>
            )}

            <div className="mb-4 grid grid-cols-3 gap-2">
              <button onClick={() => setMapOpen(v => !v)} className={`rounded-xl border px-3 py-2 text-xs font-bold transition-all ${mapOpen ? "border-cyan-400 bg-cyan-500 text-slate-950" : "border-cyan-500/30 bg-slate-900 text-cyan-300"}`}>
                🗺️ {mapOpen ? "Ocultar" : "Mapa"}
              </button>
              <button onClick={() => setChartOpen(v => !v)} className={`rounded-xl border px-3 py-2 text-xs font-bold transition-all ${chartOpen ? "border-cyan-400 bg-cyan-500 text-slate-950" : "border-cyan-500/30 bg-slate-900 text-cyan-300"}`}>
                📊 {chartOpen ? "Ocultar" : "Telemetria"}
              </button>
              <button onClick={() => setTermsOpen(v => !v)} className={`rounded-xl border px-3 py-2 text-xs font-bold transition-all ${termsOpen ? "border-cyan-400 bg-cyan-500 text-slate-950" : "border-cyan-500/30 bg-slate-900 text-cyan-300"}`}>
                ⚖️ {termsOpen ? "Ocultar" : "LGPD"}
              </button>
            </div>

            {mapOpen && (
              <section className="mb-4 rounded-2xl border-2 border-cyan-500/40 bg-slate-900/95 p-3 shadow-xl">
                <div className="mb-2 flex items-center justify-between">
                  <span className="font-mono text-xs font-bold uppercase text-cyan-300">📍 Rocha Sobrinho / Sebinho — Mesquita</span>
                  <button onClick={() => setMapOpen(false)} className="font-mono text-xs text-slate-400">✕ Fechar</button>
                </div>
                <div ref={mapRef} className="h-64 w-full rounded-xl border border-cyan-500/30"></div>
              </section>
            )}

            {chartOpen && (
              <section className="mb-4 rounded-2xl border-2 border-cyan-500/40 bg-slate-900/95 p-3 shadow-xl">
                <div className="mb-2 flex items-center justify-between">
                  <span className="font-mono text-xs font-bold uppercase text-cyan-300">📈 Métricas do Rio Sarapuí</span>
                  <button onClick={() => setChartOpen(false)} className="font-mono text-xs text-slate-400">✕ Fechar</button>
                </div>
                <div className="relative h-56 w-full"><canvas ref={chartRef}></canvas></div>
              </section>
            )}

            {termsOpen && (
              <section className="mb-4 rounded-2xl border-2 border-cyan-500/40 bg-slate-900/95 p-4 shadow-xl">
                <div className="mb-3 flex items-center justify-between border-b border-cyan-500/20 pb-2">
                  <span className="font-mono text-xs font-bold uppercase text-cyan-300">⚖️ Termos e LGPD</span>
                  <button onClick={() => setTermsOpen(false)} className="font-mono text-xs text-slate-400">✕ Fechar</button>
                </div>
                <div className="space-y-3 text-xs leading-relaxed text-slate-300">
                  <div className="rounded-xl border border-cyan-500/20 bg-slate-950 p-3">
                    <strong className="mb-1 block text-cyan-400">Finalidade</strong>
                    Dados usados para apoio comunitário, Defesa Civil, programas sociais e habitação.
                  </div>
                </div>
              </section>
            )}

            <section className="relative z-20 rounded-3xl border-2 border-cyan-500/40 bg-slate-900/90 p-4 shadow-2xl">
              <div className="mb-3 flex items-center justify-between border-b border-cyan-500/20 pb-2.5">
                <div className="flex items-center gap-2">
                  <span className="h-2.5 w-2.5 animate-pulse rounded-full bg-cyan-400"></span>
                  <span className="font-mono text-xs font-bold uppercase tracking-wider text-cyan-300">Sara • Analista • Conexão ativa</span>
                </div>
                <button onClick={() => setSoundEnabled(v => !v)} className={`rounded-lg border px-2 py-1 text-xs font-mono ${soundEnabled ? "border-cyan-400/50 bg-cyan-500/20 text-cyan-300" : "border-slate-700 bg-slate-800 text-slate-400"}`}>
                  {soundEnabled ? "🔊 Voz ativa" : "🔇 Mudo"}
                </button>
              </div>

              <div className="mb-4 h-72 space-y-3 overflow-y-auto pr-2">
                {messages.map(msg => (
                  <div key={msg.id} className={`flex flex-col ${msg.sender === "user" ? "items-end" : "items-start"}`}>
                    <div className={`max-w-[85%] rounded-2xl px-4 py-2.5 shadow-md ${msg.sender === "user" ? "rounded-br-none bg-cyan-600 text-white" : "rounded-bl-none border border-cyan-500/30 bg-slate-800/90 text-slate-200"}`}>
                      <p className="whitespace-pre-wrap leading-relaxed">{msg.text}</p>
                    </div>
                    <span className="mt-1 px-1 font-mono text-[10px] text-slate-500">{msg.timestamp}</span>
                  </div>
                ))}
                {isLoadingChat && (
                  <div className="w-fit animate-pulse rounded-xl bg-slate-800/50 p-2 font-mono text-xs text-cyan-400">⏳ Sara está processando...</div>
                )}
              </div>

              <div className="flex items-center gap-2">
                <input
                  type="text"
                  value={input}
                  onChange={e => setInput(e.target.value)}
                  onKeyDown={e => { if (e.key === "Enter") handleSendMessage(); }}
                  placeholder="Digite sua mensagem para a Sara..."
                  className="flex-1 rounded-xl border border-cyan-500/30 bg-slate-950 px-4 py-2.5 text-slate-100 placeholder-slate-500 outline-none focus:border-cyan-400"
                />
                <button onClick={() => handleSendMessage()} className="rounded-xl bg-cyan-500 px-4 py-2.5 font-bold text-slate-950 shadow-lg shadow-cyan-500/20">Enviar 🚀</button>
              </div>
            </section>
          </main>

          <footer className="mx-auto mt-12 w-full max-w-2xl border-t border-cyan-500/20 px-4 pb-6 pt-6 text-center font-mono text-xs text-slate-400">
            <p className="text-slate-300">Todos os direitos reservados 2024–2028</p>
            <p className="font-bold tex
