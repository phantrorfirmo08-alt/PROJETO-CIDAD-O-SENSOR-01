<!DOCTYPE html>
<html lang="pt-BR" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IA Studio Pro v14.3 - Conectado Real</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: { extend: { colors: { brand: { 500: '#10b981', 600: '#059669' } } } }
        }
    </script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col font-sans selection:bg-emerald-500 selection:text-slate-950">

    <!-- TELA DE AUTENTICAÇÃO E TERMOS (CARTÃO DE VISITA) -->
    <div id="auth-screen" class="fixed inset-0 z-50 bg-slate-950/95 backdrop-blur-md flex items-center justify-center p-4 transition-opacity duration-300">
        <div class="bg-slate-900 border border-slate-800 rounded-3xl p-6 w-full max-w-sm shadow-2xl space-y-4 text-center">
            <div class="w-12 h-12 bg-emerald-500/10 text-emerald-500 rounded-2xl flex items-center justify-center mx-auto text-xl font-bold shadow-inner">⚡</div>
            <div>
                <h1 class="text-base font-bold text-slate-100">IA Studio Pro v14.3</h1>
                <p class="text-[11px] text-slate-400 mt-1">Motor de IA Conectado via Cloudflare (Redmi 11).</p>
            </div>
            <div class="bg-slate-950 p-3 rounded-2xl border border-slate-800 text-left space-y-2">
                <div class="flex items-center gap-2 text-[11px] text-emerald-400 font-medium">
                    <span>🔒</span> Privacidade Total: Chave Segura no Servidor
                </div>
                <input type="password" id="pin-input" placeholder="PIN de Acesso (Padrão: 0800)" class="w-full bg-slate-900 border border-slate-800 rounded-xl px-3 py-2 text-xs text-slate-100 focus:outline-none focus:border-emerald-500">
                <label class="flex items-center gap-2 text-[10px] text-slate-400 cursor-pointer pt-1">
                    <input type="checkbox" id="lgpd-check" class="rounded border-slate-700 text-emerald-600 focus:ring-emerald-500"> Concordo com os protocolos de processamento seguro.
                </label>
            </div>
            <button onclick="inicializarEstudio()" class="w-full bg-emerald-600 hover:bg-emerald-500 text-slate-950 font-bold py-2.5 rounded-xl text-xs transition shadow-lg active:scale-95">Carregar Motor V14</button>
        </div>
    </div>

    <!-- INTERFACE PRINCIPAL -->
    <div id="app-screen" class="flex flex-col min-h-screen hidden opacity-0 transition-opacity duration-500">
        <header class="bg-slate-900/80 backdrop-blur-md border-b border-slate-800 p-3.5 sticky top-0 z-40 flex justify-between items-center">
            <div class="flex items-center gap-2.5">
                <div class="w-8 h-8 rounded-lg bg-emerald-500/10 flex items-center justify-center text-emerald-500 font-bold text-sm">⚡</div>
                <div>
                    <h2 class="text-xs font-bold text-slate-100">IA Studio Pro <span class="text-emerald-400">v14.3</span></h2>
                    <p class="text-[9px] text-slate-400">Conectado ao Cloudflare</p>
                </div>
            </div>
            <div class="flex items-center gap-2">
                <span id="conn-status" class="text-[10px] font-medium bg-emerald-500/10 text-emerald-400 px-2 py-0.5 rounded-full border border-emerald-500/20">Online</span>
            </div>
        </header>

        <main class="flex-1 max-w-3xl w-full mx-auto p-4 flex flex-col gap-4">
            <!-- Área de Prompt -->
            <div class="bg-slate-900 border border-slate-800 rounded-2xl p-4 flex flex-col gap-3">
                <div class="flex justify-between items-center text-xs text-slate-400">
                    <span>Prompt do Sistema (GPT-OSS 120B)</span>
                    <span id="status-text">Pronto</span>
                </div>
                <textarea id="user-prompt" rows="3" placeholder="Digite sua instrução para a IA..." class="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-xs text-slate-100 focus:outline-none focus:border-emerald-500 resize-none"></textarea>
                <button onclick="executarInferencia()" class="bg-emerald-600 hover:bg-emerald-500 text-slate-950 font-bold py-2 px-4 rounded-xl text-xs transition self-end">Enviar para IA</button>
            </div>

            <!-- Área de Saída -->
            <div id="output-container" class="bg-slate-900 border border-slate-800 rounded-2xl p-4 min-h-[120px] text-xs text-slate-300 font-mono hidden">
                <div class="text-emerald-400 font-bold mb-1">>> Resposta do Modelo:</div>
                <div id="output-text"></div>
            </div>
        </main>
    </div>

    <script>
        // CONFIGURAÇÃO: COLOQUE AQUI O LINK DO SEU CLOUDFLARE WORKER
        // Exemplo: https://seu-app.workers.dev
        const API_URL = "https://SEU-NOME.workers.dev"; 

        function inicializarEstudio() {
            const pin = document.getElementById('pin-input').value;
            const lgpd = document.getElementById('lgpd-check').checked;
            
            if (pin !== "0800" && pin !== "") {
                alert("PIN incorreto. Utilize o padrão: 0800");
                return;
            }
            if (!lgpd) {
                alert("Você deve aceitar os termos de diretrizes locais para prosseguir.");
                return;
            }

            const authScreen = document.getElementById('auth-screen');
            const appScreen = document.getElementById('app-screen');
            
            authScreen.classList.add('opacity-0');
            setTimeout(() => {
                authScreen.style.display = 'none';
                appScreen.classList.remove('hidden');
                setTimeout(() => appScreen.classList.remove('opacity-0'), 50);
            }, 300);
        }

        async function executarInferencia() {
            const prompt = document.getElementById('user-prompt').value;
            const container = document.getElementById('output-container');
            const textOutput = document.getElementById('output-text');
            const statusText = document.getElementById('status-text');

            if (!prompt.trim()) {
                alert("Insira uma instrução válida.");
                return;
            }

            // Mostra o container imediatamente
            container.classList.remove('hidden');
            textOutput.textContent = ""; // Limpa texto anterior
            statusText.textContent = "Conectando...";
            
            // Estado de carregamento real (sem simulação de tempo fixo)
            textOutput.innerHTML = `<span class="animate-pulse">🔄 Conectando ao servidor seguro...</span>`;

            try {
                // Chamada REAL para o seu Cloudflare Worker
                const response = await fetch(API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: prompt })
                });

                if (!response.ok) {
                    throw new Error(`Erro na conexão: ${response.status}`);
                }

                const data = await response.json();
                
                // Exibe a resposta real da IA
                const respostaFinal = data.reply || data.content || "Resposta não encontrada.";
                textOutput.textContent = respostaFinal;
                statusText.textContent = "Concluído";

            } catch (error) {
                console.error("Erro na IA:", error);
                textOutput.textContent = `Erro: ${error.message}\nVerifique se a URL (API_URL) está correta no código.`;
                statusText.textContent = "Erro";
            }
        }
    </script>
</body>
</html>
