function limparTextoParaFala(texto) {
  return String(texto || "")
    .replace(/[*#_`]/g, '')
    .replace(/cerquilha/gi, '')
    .replace(/asterisco/gi, '')
    .replace(/([\u2700-\u27BF]|[\uE000-\uF8FF]|\uD83C[\uDC00-\uDFFF]|\uD83D[\uDC00-\uDFFF]|[\u2011-\u26FF]|\uD83E[\uDD00-\uDDFF])/g, '')
    .replace(/https?:\/\/\S+/g, "")
    .replace(/\s+/g, " ")
    .trim();
}

function escolherVozPtBr(perfilId) {
  const voices = carregarVozesDisponiveis();
  if (!voices || voices.length === 0) return null;
  const ptVoices = voices.filter(v => (v.lang || "").toLowerCase().includes("pt"));
  if (ptVoices.length === 0) return voices[0];
  const idx = PERFIS_VOZ_OFICIAIS.findIndex(p => p.id === perfilId);
  if (idx >= 0) return ptVoices[idx % ptVoices.length];
  return ptVoices.find(v => (v.name || "").toLowerCase().includes("google")) || ptVoices[0];
}

function falarImitada(texto, perfilId = 'sarah') {
  try {
    if (localStorage.getItem("raru_sound_enabled") === "false") return;
  } catch (e) {}
  if (!("speechSynthesis" in window)) return;
  const textoLimpo = limparTextoParaFala(texto);
  if (!textoLimpo) return;

  const perfilSalvo = (() => {
    try { return localStorage.getItem("raru_perfil_voz") || perfilId || 'sarah'; }
    catch (e) { return perfilId || 'sarah'; }
  })();
  const perfil = PERFIS_VOZ_OFICIAIS.find(p => p.id === perfilSalvo) || PERFIS_VOZ_OFICIAIS[0];

  try {
    window.speechSynthesis.cancel();
    const textoImitado = limparTextoParaFala(perfil.transform(textoLimpo));
    const frases = textoImitado.split(/(?<=[.!?])\s+/).filter(Boolean);
    const fila = frases.length > 0 ? frases : [textoImitado];
    const vozEscolhida = escolherVozPtBr(perfil.id);

    const falarSequencia = (index) => {
      if (index >= fila.length) return;
      try {
        if (localStorage.getItem("raru_sound_enabled") === "false") return;
      } catch (e) {}

      const u = new SpeechSynthesisUtterance(fila[index]);
      u.lang = "pt-BR";
      const osc = (Math.random() - 0.5) * perfil.variacao;
      u.pitch = Math.max(0.5, Math.min(2.0, perfil.pitch + osc));
      u.rate = Math.max(0.5, Math.min(2.0, perfil.rate));
      u.volume = Math.max(0, Math.min(1, perfil.volume));
      if (vozEscolhida) u.voice = vozEscolhida;

      u.onend = () => {
        if (index + 1 < fila.length) setTimeout(() => falarSequencia(index + 1), perfil.pausaFrase);
      };
      u.onerror = () => {
        if (index + 1 < fila.length) setTimeout(() => falarSequencia(index + 1), perfil.pausaFrase);
      };
      window.speechSynthesis.speak(u);
    };

    falarSequencia(0);
  } catch (e) {}
}

async function calcularSHA256(texto) {
  const str = String(texto || "");
  try {
    if (window.crypto && window.crypto.subtle && window.TextEncoder) {
      const encoder = new TextEncoder();
      const data = encoder.encode(str);
      const hashBuffer = await window.crypto.subtle.digest('SHA-256', data);
      const hashArray = Array.from(new Uint8Array(hashBuffer));
      return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
    }
  } catch (e) {}
  let h1 = 0xdeadbeef, h2 = 0x41c6ce57;
  for (let i = 0; i < str.length; i++) {
    const ch = str.charCodeAt(i);
    h1 = Math.imul(h1 ^ ch, 2654435761);
    h2 = Math.imul(h2 ^ ch, 1597334677);
  }
  h1 = Math.imul(h1 ^ (h1 >>> 16), 2246822507) ^ Math.imul(h2 ^ (h2 >>> 13), 3266489909);
  h2 = Math.imul(h2 ^ (h2 >>> 16), 2246822507) ^ Math.imul(h1 ^ (h1 >>> 13), 3266489909);
  const combinado = (4294967296 * (2097151 & h2) + (h1 >>> 0)).toString(16).padStart(16, '0');
  return combinado.repeat(4).slice(0, 64);
}

async function chamarSarahGroq(mensagensHistorico, municipioAtual, bairroAtual, abaAtual, dadosClimaContexto, userName = "") {
  const horaBrasilia = Number(new Intl.DateTimeFormat('pt-BR', {
    timeZone: 'America/Sao_Paulo',
    hour: 'numeric',
    hour12: false
  }).format(new Date()));
  const saudacaoCerta = horaBrasilia < 12 ? "Bom dia" : horaBrasilia < 18 ? "Boa tarde" : "Boa noite";
  const nomePessoa = userName && userName.trim() ? userName.trim() : "";
  const instrucaoSaudacao = globalSaudacaoEmitida
    ? "A saudação inicial já foi feita. Não repita saudações prontas."
    : `Cumprimente de forma leve com '${saudacaoCerta}'.`;

  const systemPrompt = montarPersonalidadeSarah(bairroAtual || 'Rocha Sobrinho', municipioAtual || 'Mesquita', nomePessoa, dadosClimaContexto) + `\nAba ativa: ${abaAtual || 'dashboard'}. ${instrucaoSaudacao}`;

  try {
    const response = await fetch(SARAH_PROXY_URL, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        model: "openai/gpt-oss-120b",
        messages: [{ role: "system", content: systemPrompt }, ...mensagensHistorico],
        temperature: 0.72,
        max_tokens: 450
      })
    });
    const data = await response.json();
    if (!data.error) {
      const msg = data?.choices?.[0]?.message;
      const texto = msg?.content || msg?.reasoning_content;
      if (texto && texto.trim().length > 0) {
        globalSaudacaoEmitida = true;
        return limparTextoParaFala(texto).trim();
      }
    }
  } catch (e) {}

  try {
    const ultimaMensagem = mensagensHistorico[mensagensHistorico.length - 1]?.content || "Olá";
    const promptCompleto = systemPrompt + "\n\nMensagem em " + (municipioAtual || 'Mesquita') + ": " + ultimaMensagem;
    const aiRes = await fetch("https://text.pollinations.ai/" + encodeURIComponent(promptCompleto));
    if (aiRes.ok) {
      const t = await aiRes.text();
      if (t && t.trim().length > 0) {
        globalSaudacaoEmitida = true;
        return limparTextoParaFala(t).trim();
      }
    }
  } catch (e) {}

  globalSaudacaoEmitida = true;
  if (dadosClimaContexto && dadosClimaContexto.municipio) {
    const t = dadosClimaContexto.temp != null ? `${Number(dadosClimaContexto.temp).toFixed(1)} graus` : "sem leitura";
    const r = dadosClimaContexto.rain != null ? `${Number(dadosClimaContexto.rain).toFixed(1)} milímetros por hora` : "sem chuva";
    const w = dadosClimaContexto.windKmh != null ? `${Math.round(dadosClimaContexto.windKmh)} quilômetros por hora` : "vento calmo";
    const prefixo = nomePessoa ? `${nomePessoa}, ` : "";
    return `${prefixo}monitorando ${dadosClimaContexto.municipio} no MAPA RARU: temperatura ${t}, chuva ${r} e vento a ${w}.`;
  }
  return nomePessoa
    ? `Estou acompanhando o mapa por aqui, ${nomePessoa}. Qual ponto ou camada você quer verificar?`
    : "Estou acompanhando o mapa por aqui. Como você se chama e qual município ou camada vamos monitorar?";
}

async function gerarArquivoIconeEscudo() {
  return new Promise((resolve) => {
    const canvas = document.createElement('canvas');
    canvas.width = 512;
    canvas.height = 512;
    const ctx = canvas.getContext('2d');
    const bgGrad = ctx.createRadialGradient(256, 256, 30, 256, 256, 320);
    bgGrad.addColorStop(0, '#0A2547');
    bgGrad.addColorStop(0.6, '#041125');
    bgGrad.addColorStop(1, '#02040A');
    ctx.fillStyle = bgGrad;
    ctx.fillRect(0, 0, 512, 512);

    ctx.beginPath();
    ctx.moveTo(256, 65);
    ctx.lineTo(410, 130);
    ctx.lineTo(410, 265);
    ctx.quadraticCurveTo(410, 385, 256, 435);
    ctx.quadraticCurveTo(102, 385, 102, 265);
    ctx.lineTo(102, 130);
    ctx.closePath();
    ctx.lineWidth = 6;
    ctx.strokeStyle = '#00F2FE';
    ctx.stroke();

    ctx.fillStyle = '#FFFFFF';
    ctx.font = '900 30px Orbitron, sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('RARU NEXUS', 256, 240);
    ctx.fillStyle = '#00FF9D';
    ctx.font = '800 18px JetBrains Mono, monospace';
    ctx.fillText('V11.2 PLUS • RJ', 256, 270);
    ctx.fillStyle = '#38BDF8';
    ctx.font = '700 15px JetBrains Mono, monospace';
    ctx.fillText('CIDADÃO SENSOR • MESQUITA RJ', 256, 480);

    canvas.toBlob((blob) => {
      if (blob) resolve(new File([blob], 'RARU_NEXUS_V11_2_PLUS.png', { type: 'image/png' }));
      else resolve(null);
    }, 'image/png');
  });
}

  {id:'mesquita',name:'Mesquita · Rocha Sobrinho',lat:-22.7828,lon:-43.4314,zoom:12.6},{id:'angra',name:'Angra dos Reis',lat:-23.0067,lon:-44.3181,zoom:11},{id:'aperibe',name:'Aperibé',lat:-21.6228,lon:-42.1028,zoom:12},{id:'araruama',name:'Araruama',lat:-22.8728,lon:-42.3436,zoom:11},{id:'areal',name:'Areal',lat:-22.2308,lon:-43.1047,zoom:12},{id:'buzios',name:'Armação dos Búzios',lat:-22.7469,lon:-41.8817,zoom:12},{id:'arraial',name:'Arraial do Cabo',lat:-22.9661,lon:-42.0278,zoom:12},{id:'barra_pirai',name:'Barra do Piraí',lat:-22.4708,lon:-43.8264,zoom:11},{id:'barra_mansa',name:'Barra Mansa',lat:-22.5442,lon:-44.1714,zoom:11},{id:'belford',name:'Belford Roxo',lat:-22.7642,lon:-43.3994,zoom:12.5},{id:'bom_jardim',name:'Bom Jardim',lat:-22.1519,lon:-42.4208,zoom:11},{id:'bom_jesus',name:'Bom Jesus do Itabapoana',lat:-21.1336,lon:-41.6819,zoom:11},{id:'cabo_frio',name:'Cabo Frio',lat:-22.8783,lon:-42.0197,zoom:11.5},{id:'cachoeiras',name:'Cachoeiras de Macacu',lat:-22.4628,lon:-42.6528,zoom:11},{id:'cambuci',name:'Cambuci',lat:-21.575,lon:-41.9119,zoom:11},{id:'campos',name:'Campos dos Goytacazes',lat:-21.7622,lon:-41.3181,zoom:10.5},{id:'cantagalo',name:'Cantagalo',lat:-21.9828,lon:-42.3689,zoom:11},{id:'carapebus',name:'Carapebus',lat:-22.1858,lon:-41.6619,zoom:11},{id:'duque',name:'Duque de Caxias · São Bento',lat:-22.7856,lon:-43.3117,zoom:12},{id:'guapimirim',name:'Guapimirim',lat:-22.5328,lon:-42.9836,zoom:11},{id:'itaborai',name:'Itaboraí',lat:-22.7447,lon:-42.8619,zoom:11},{id:'itaguai',name:'Itaguaí',lat:-22.8619,lon:-43.7797,zoom:11},{id:'japeri',name:'Japeri',lat:-22.6425,lon:-43.6536,zoom:12},{id:'macae',name:'Macaé',lat:-22.3708,lon:-41.7869,zoom:11},{id:'mage',name:'Magé',lat:-22.6561,lon:-43.0406,zoom:11},{id:'mangaratiba',name:'Mangaratiba',lat:-22.9608,lon:-44.0408,zoom:11},{id:'marica',name:'Maricá',lat:-22.9197,lon:-42.8186,zoom:11},{id:'nilopolis',name:'Nilópolis',lat:-22.8083,lon:-43.4147,zoom:12.8},{id:'niteroi',name:'Niterói',lat:-22.8832,lon:-43.1034,zoom:12},{id:'nova_friburgo',name:'Nova Friburgo',lat:-22.2819,lon:-42.5311,zoom:11},{id:'nova_iguacu',name:'Nova Iguaçu',lat:-22.7592,lon:-43.4511,zoom:12.2},{id:'paracambi',name:'Paracambi',lat:-22.6083,lon:-43.7097,zoom:12},{id:'paraty',name:'Paraty',lat:-23.2228,lon:-44.7178,zoom:11},{id:'petropolis',name:'Petrópolis',lat:-22.505,lon:-43.1786,zoom:11.5},{id:'queimados',name:'Queimados',lat:-22.7147,lon:-43.5553,zoom:12},{id:'resende',name:'Resende',lat:-22.4686,lon:-44.4469,zoom:11},{id:'rio',name:'Rio de Janeiro',lat:-22.9068,lon:-43.1729,zoom:11},{id:'sao_goncalo',name:'São Gonçalo',lat:-22.8269,lon:-43.0539,zoom:11.5},{id:'sao_joao_meriti',name:'São João de Meriti',lat:-22.8047,lon:-43.3722,zoom:12.7},{id:'seropedica',name:'Seropédica',lat:-22.7408,lon:-43.7086,zoom:11},{id:'teresopolis',name:'Teresópolis',lat:-22.4119,lon:-42.9836,zoom:11},{id:'volta',name:'Volta Redonda',lat:-22.5231,lon:-44.1042,zoom:11.4}
];

const MAPA_RARU_BACIAS = [
  {name:'Rio Sarapuí',color:'#0284c7',labelLat:-22.768,labelLon:-43.428,points:[[-22.738,-43.462],[-22.768,-43.428],[-22.796,-43.382],[-22.815,-43.325]]},
  {name:'Rio Dona Eugênia',color:'#0d9488',labelLat:-22.784,labelLon:-43.434,points:[[-22.762,-43.448],[-22.7828,-43.4314],[-22.802,-43.402]]},
  {name:'Serra do Mendanha -> São Bento',color:'#d97706',labelLat:-22.755,labelLon:-43.375,points:[[-22.828,-43.515],[-22.7828,-43.4314],[-22.755,-43.375],[-22.735,-43.342]]}
];

const MAPA_RARU_BANDAS = {
  estavel: {label:'Estável / Limpo', badgeClass:'bg-emerald-500/20 text-emerald-200 border-emerald-400/40'},
  pancadas: {label:'Pancadas / Instável', badgeClass:'bg-cyan-500/20 text-cyan-200 border-cyan-400/40'},
  chuva_forte: {label:'Chuva Forte', badgeClass:'bg-blue-600/25 text-blue-200 border-blue-400/45'},
  ventania: {label:'Ventania / Rajadas', badgeClass:'bg-orange-500/25 text-orange-200 border-orange-400/45'},
  tempestade: {label:'Tempestade / Raio', badgeClass:'bg-purple-600/25 text-purple-200 border-purple-400/45'},
  severo: {label:'Severo / Extremo', badgeClass:'bg-rose-600/25 text-rose-200 border-rose-400/45'}
};

function MapaRaruModule({ onGoToDashboard, showToast, userName, perfilVozId, onSyncCentralTelemetry, onOpenSarahChat }) {
  const [selectedId, setSelectedId] = useState('mesquita');
  const [viewState, setViewState] = useState({ lat: -22.7828, lon: -43.4314, zoom: 12.6 });
  const [opacityPct, setOpacityPct] = useState(82);
  const [climateBand, setClimateBand] = useState('pancadas');
  const [preset, setPreset] = useState('auto');
  const [playing, setPlaying] = useState(true);
  const [frameIndex, setFrameIndex] = useState(0);
  const [promptInput, setPromptInput] = useState('');
  const [aiLog, setAiLog] = useState('SARAH (IA Unificada) monitorando o MAPA RARU em tempo real.');
  const [centralConnected, setCentralConnected] = useState(false);

  const [layers, setLayers] = useState({
    clouds: true,
    precipitation: true,
    wind: true,
    temperature: true,
    lightningCape: true,
    basins: true
  });

  const [live, setLive] = useState({
    temp: null, hum: null, press: null, cloud: 58, rain: 0,
    windKmh: 14, windDirDeg: 115, gust: 24, cape: 420,
    usingFallback: true, u: 0, v: 0
  });

  const weatherCanvasRef = useRef(null);
  const leafletRef = useRef(null);
  const goesLayerRef = useRef(null);
  const radarLayerRef = useRef(null);
  const liveRef = useRef(live);
  const layersRef = useRef(layers);
  const viewRef = useRef(viewState);
  const opacityRef = useRef(opacityPct / 100);
  const bandRef = useRef(climateBand);
  const frameRef = useRef(frameIndex);

  liveRef.current = live;
  layersRef.current = layers;
  viewRef.current = viewState;
  opacityRef.current = opacityPct / 100;
  bandRef.current = climateBand;
  frameRef.current = frameIndex;

  const currentMun = MAPA_RARU_MUNICIPIOS.find(m => m.id === selectedId) || MAPA_RARU_MUNICIPIOS[0];

  const computeUV = (s, d) => {
    const vMag = (Number(s) || 0) / 3.6;
    const rad = ((Number(d) || 0) * Math.PI) / 180;
    return { u: -vMag * Math.sin(rad), v: -vMag * Math.cos(rad) };
  };

  const getGoesDate = () => {
    const dt = new Date();
    dt.setDate(dt.getDate() - 1);
    return dt.toISOString().split('T')[0];
  };

  const latLonToCanvas = (lat, lon, w, h) => {
    const v = viewRef.current;
    const scale = Math.pow(2, v.zoom - 11.5) * 165;
    const dx = (lon - v.lon) * scale * Math.cos((v.lat * Math.PI) / 180);
    const dy = -(lat - v.lat) * scale;
    return { x: w / 2 + dx, y: h / 2 + dy };
  };

  const renderOverlay = () => {
    const wCv = weatherCanvasRef.current;
    if (!wCv) return;
    const container = wCv.parentElement;
    const w = Math.max(1, container ? container.clientWidth : 600);
    const h = Math.max(1, container ? container.clientHeight : 360);
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    wCv.width = Math.round(w * dpr);
    wCv.height = Math.round(h * dpr);
    const ctx = wCv.getContext('2d');
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, w, h);

    const t = liveRef.current;
    const op = opacityRef.current;

    if (layersRef.current.basins) {
      MAPA_RARU_BACIAS.forEach(b => {
        ctx.strokeStyle = b.color;
        ctx.lineWidth = 3;
        ctx.beginPath();
        b.points.forEach((pt, i) => {
          const p = latLonToCanvas(pt[0], pt[1], w, h);
          if (i === 0) ctx.moveTo(p.x, p.y);
          else ctx.lineTo(p.x, p.y);
        });
        ctx.stroke();
      });
    }

    if (layersRef.current.precipitation && t.rain != null && t.rain > 0.2) {
      const grd = ctx.createRadialGradient(w / 2, h / 2, 8, w / 2, h / 2, 120);
      grd.addColorStop(0, `rgba(37,99,235,${Math.min(0.55, t.rain / 14) * op})`);
      grd.addColorStop(1, 'rgba(37,99,235,0)');
      ctx.fillStyle = grd;
      ctx.beginPath();
      ctx.arc(w / 2, h / 2, 120, 0, Math.PI * 2);
      ctx.fill();
    }

    if (layersRef.current.wind) {
      const spd = Math.hypot(t.u, t.v);
      const nx = spd > 0.01 ? t.u / spd : 1;
      const ny = spd > 0.01 ? t.v / spd : 0;
      for (let i = 0; i < 32; i++) {
        const sx = (((i * 73) % 1000) / 1000) * w;
        const sy = (((i * 137) % 1000) / 1000) * h;
        const phase = ((frameRef.current * 9 + i * 7) % 36) - 18;
        const x1 = sx + nx * phase;
        const y1 = sy + ny * phase;
        ctx.strokeStyle = `rgba(255,255,255,${0.82 * op})`;
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(x1, y1);
        ctx.lineTo(x1 + nx * 14, y1 + ny * 14);
        ctx.stroke();
      }
    }

    if (layersRef.current.lightningCape && t.cape > 300) {
      ctx.fillStyle = 'rgba(250, 204, 21, 0.9)';
      ctx.beginPath();
      ctx.arc(w / 2 + 24, h / 2 - 24, 5, 0, Math.PI * 2);
      ctx.fill();
    }
  };

  const publicarNaSarahUnificada = (munObj, liveObj, bandAtual = bandRef.current) => {
    const payload = {
      source: 'MAPA_RARU',
      municipio: munObj.name,
      lat: munObj.lat,
      lon: munObj.lon,
      zoom: viewRef.current.zoom,
      climateBand: bandAtual,
      temp: liveObj.temp,
      rain: liveObj.rain,
      windKmh: liveObj.windKmh,
      windDirDeg: liveObj.windDirDeg,
      cape: liveObj.cape,
      cloud: liveObj.cloud,
      bacias: ['Rio Sarapuí', 'Rio Dona Eugênia', 'Serra do Mendanha -> São Bento'],
      timestamp: new Date().toISOString()
    };
    window.__RARU_MAPA_STATE = payload;
    window.dispatchEvent(new CustomEvent('raru:mapa-telemetry-sync', { detail: payload }));
    if (typeof onSyncCentralTelemetry === 'function') {
      onSyncCentralTelemetry(payload);
    }
  };

  const fetchTelemetry = async (munObj = currentMun, simPreset = preset, bandAtual = climateBand) => {
    try {
      const url = `https://api.open-meteo.com/v1/forecast?latitude=${munObj.lat}&longitude=${munObj.lon}&current=temperature_2m,relative_humidity_2m,precipitation,pressure_msl,cloud_cover,wind_speed_10m,wind_direction_10m,wind_gusts_10m&hourly=precipitation,cape&forecast_days=1`;
      const res = await fetch(url);
      const data = await res.json();
      const cur = data?.current || {};
      const hr = data?.hourly || {};
      const uv = computeUV(cur.wind_speed_10m, cur.wind_direction_10m);

      let nextLive = {
        temp: cur.temperature_2m ?? 26.5,
        hum: cur.relative_humidity_2m ?? 72,
        press: cur.pressure_msl ?? 1013,
        cloud: cur.cloud_cover ?? 55,
        rain: cur.precipitation ?? 0,
        windKmh: cur.wind_speed_10m ?? 14,
        windDirDeg: cur.wind_direction_10m ?? 115,
        gust: cur.wind_gusts_10m ?? 22,
        cape: (hr.cape && hr.cape[0]) || 420,
        usingFallback: false,
        u: uv.u,
        v: uv.v
      };

      if (simPreset === 'limpo') nextLive = { ...nextLive, cloud: 12, rain: 0, windKmh: 9, gust: 14, cape: 120 };
      else if (simPreset === 'nublado') nextLive = { ...nextLive, cloud: 88, rain: 0.2, windKmh: 12, gust: 18, cape: 280 };
      else if (simPreset === 'chuva') nextLive = { ...nextLive, cloud: 92, rain: 6.8, windKmh: 18, gust: 32, cape: 520 };
      else if (simPreset === 'rajadas') nextLive = { ...nextLive, cloud: 64, rain: 0.6, windKmh: 46, gust: 68, cape: 380, windDirDeg: 210 };
      else if (simPreset === 'tempestade') nextLive = { ...nextLive, cloud: 96, rain: 18.5, windKmh: 28, gust: 62, cape: 1450 };

      const uvFinal = computeUV(nextLive.windKmh, nextLive.windDirDeg);
      nextLive.u = uvFinal.u;
      nextLive.v = uvFinal.v;

      setLive(nextLive);
      publicarNaSarahUnificada(munObj, nextLive, bandAtual);
    } catch (_) {
      const fallbackLive = { ...liveRef.current, usingFallback: true };
      setLive(fallbackLive);
      publicarNaSarahUnificada(munObj, fallbackLive, bandAtual);
    }
  };

  useEffect(() => {
    const checkCentral = () => {
      const ok = Boolean(window.RARU_AI && typeof window.RARU_AI.ask === 'function') || Boolean(window.__RARU_CENTRAL_LISTENING);
      setCentralConnected(ok);
    };
    checkCentral();
    window.addEventListener('raru:central-ready', checkCentral);
    const id = setInterval(checkCentral, 4000);
    return () => {
      window.removeEventListener('raru:central-ready', checkCentral);
      clearInterval(id);
    };
  }, []);

  useEffect(() => {
    let mounted = true;
    const box = document.getElementById('raruMapaLeafletBox');
    if (window.L && box && !leafletRef.current) {
      const map = L.map(box, { zoomControl: true, crs: L.CRS.EPSG3857 }).setView([viewState.lat, viewState.lon], viewState.zoom);
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        maxZoom: 19,
        attribution: '&copy; OpenStreetMap'
      }).addTo(map);
      const goes = L.tileLayer(
        `https://gibs.earthdata.nasa.gov/wmts/epsg3857/best/GOES-East_ABI_Band13_Clean_Infrared/default/${getGoesDate()}/4km/{z}/{y}/{x}.png`,
        { opacity: 0.28, maxZoom: 9, minZoom: 3, zIndex: 5, attribution: 'NASA GIBS' }
      ).addTo(map);
      const radar = L.tileLayer('', { opacity: 0, zIndex: 10, maxZoom: 12 }).addTo(map);
      map.on('move', () => {
        if (!mounted) return;
        const c = map.getCenter();
        setViewState({ lat: c.lat, lon: c.lng, zoom: map.getZoom() });
      });
      leafletRef.current = map;
      goesLayerRef.current = goes;
      radarLayerRef.current = radar;

      fetch('https://api.rainviewer.com/public/weather-maps.json')
        .then(r => r.json())
        .then(rv => {
          if (!mounted) return;
          const past = rv?.radar?.past || [];
          if (past.length > 0 && radarLayerRef.current) {
            const lastQ = past[past.length - 1];
            radarLayerRef.current.setUrl(`${rv.host}${lastQ.path}/512/{z}/{x}/{y}/2/1_1.png`);
            radarLayerRef.current.setOpacity(0.52 * (opacityRef.current || 0.82));
          }
        })
        .catch(() => {});
    }

    fetchTelemetry(currentMun, preset, climateBand);
    return () => {
      mounted = false;
      if (leafletRef.current) {
        try { leafletRef.current.remove(); } catch (_) {}
        leafletRef.current = null;
      }
    };
  }, []);

  useEffect(() => {
    if (!playing) return;
    const id = setInterval(() => {
      setFrameIndex(prev => (prev + 1) % 12);
    }, 2400);
    return () => clearInterval(id);
  }, [playing]);

  useEffect(() => {
    renderOverlay();
  }, [selectedId, viewState, opacityPct, climateBand, frameIndex, layers, live]);

  useEffect(() => {
    if (goesLayerRef.current && leafletRef.current) {
      goesLayerRef.current.setOpacity(0.28 * (opacityPct / 100) + 0.05);
      if (layers.clouds && !leafletRef.current.hasLayer(goesLayerRef.current)) leafletRef.current.addLayer(goesLayerRef.current);
      else if (!layers.clouds && leafletRef.current.hasLayer(goesLayerRef.current)) leafletRef.current.removeLayer(goesLayerRef.current);
    }
    if (radarLayerRef.current) {
      radarLayerRef.current.setOpacity(layers.precipitation ? 0.52 * (opacityPct / 100) : 0);
    }
  }, [layers, opacityPct]);

  const focarMunicipio = (id) => {
    const alvo = MAPA_RARU_MUNICIPIOS.find(m => m.id === id);
    if (!alvo) return;
    setSelectedId(alvo.id);
    setViewState({ lat: alvo.lat, lon: alvo.lon, zoom: alvo.zoom });
    if (leafletRef.current) leafletRef.current.setView([alvo.lat, alvo.lon], alvo.zoom);
    fetchTelemetry(alvo, preset, climateBand);
  };

  const consultarSarahUnificada = async (texto) => {
    const q = String(texto || '').trim();
    if (!q) return;
    const lower = q.toLowerCase();
    let alvoMun = currentMun;
    const encontrado = MAPA_RARU_MUNICIPIOS.find(m => lower.includes(m.name.toLowerCase().split('·')[0].trim()));
    if (encontrado) {
      alvoMun = encontrado;
      focarMunicipio(encontrado.id);
    }
    if (lower.includes('liga o vento')) setLayers(prev => ({ ...prev, wind: true }));
    if (lower.includes('desliga o vento')) setLayers(prev => ({ ...prev, wind: false }));
    if (lower.includes('liga a chuva')) setLayers(prev => ({ ...prev, precipitation: true }));
    if (lower.includes('desliga a chuva')) setLayers(prev => ({ ...prev, precipitation: false }));

    publicarNaSarahUnificada(alvoMun, liveRef.current, bandRef.current);

    const ctx = {
      app: 'MAPA_RARU',
      municipio: alvoMun.name,
      lat: alvoMun.lat,
      lon: alvoMun.lon,
      climateBand: bandRef.current,
      live: liveRef.current,
      layers: layersRef.current,
      operator: userName || ''
    };

    try {
      if (window.RARU_AI && typeof window.RARU_AI.ask === 'function') {
        const resp = await window.RARU_AI.ask(q, ctx);
        const finalText = typeof resp === 'string' ? resp : (resp?.answer || resp?.text);
        if (finalText && finalText.trim()) {
          const limpo = limparTextoParaFala(finalText);
          setAiLog(limpo);
          falarImitada(limpo, perfilVozId);
          return;
        }
      }
    } catch (_) {}

    const replyFallback = await chamarSarahGroq([{ role: 'user', content: q }], alvoMun.name, 'Rocha Sobrinho', 'mapa_raru', ctx, userName);
    setAiLog(replyFallback);
    falarImitada(replyFallback, perfilVozId);
  };

  const bandCfg = MAPA_RARU_BANDAS[climateBand] || MAPA_RARU_BANDAS.pancadas;

  return (
    <div className="space-y-4 w-full max-w-5xl mx-auto font-mono">
      <div className="cyber-card p-4 rounded-2xl border border-cyberCyan/50 space-y-3">
        <div className="flex flex-wrap items-center justify-between gap-2 border-b border-cyberCyan/25 pb-2.5">
          <div>
            <h2 className="font-display text-xs sm:text-sm font-black text-cyberCyan uppercase tracking-wider">
              MAPA RARU · INTERLIGADO À SARAH
            </h2>
            <p className="text-[10px] text-slate-300 mt-0.5">
              {currentMun.name} ({currentMun.lat.toFixed(4)}, {currentMun.lon.toFixed(4)}) · WGS84 · 92 Municípios RJ
            </p>
          </div>
          <div className="flex items-center gap-2 flex-wrap">
            <span className={`text-[9px] px-2.5 py-1 rounded-full font-bold border ${centralConnected ? 'bg-emerald-500/20 text-emerald-300 border-emerald-400/40' : 'bg-cyberCyan/20 text-cyberCyan border-cyberCyan/40'}`}>
              {centralConnected ? 'SARAH UNIFICADA ATIVA' : 'MONITORAMENTO SARAH'}
            </span>
            {typeof onOpenSarahChat === 'function' && (
              <button type="button" onClick={onOpenSarahChat} className="cyber-button-solid text-[10px] py-1 px-2.5">
                CHAT SARAH
              </button>
            )}
            <button type="button" onClick={onGoToDashboard} className="cyber-button text-[10px] py-1 px-2.5">
              PAINEL
            </button>
          </div>
        </div>

        <div className="grid grid-cols-1 sm:grid-cols-3 gap-2 bg-void/90 p-2.5 rounded-xl border border-cyberCyan/30">
          <select
            value={selectedId}
            onChange={(e) => focarMunicipio(e.target.value)}
            className="bg-deepSpace text-white border border-cyberCyan/40 rounded-lg px-2.5 py-1.5 text-xs font-bold cursor-pointer"
          >
            {MAPA_RARU_MUNICIPIOS.map(m => (
              <option key={m.id} value={m.id}>{m.name}</option>
            ))}
          </select>

          <select
            value={preset}
            onChange={(e) => {
              const nextP = e.target.value;
              setPreset(nextP);
              fetchTelemetry(currentMun, nextP, climateBand);
            }}
            className="bg-deepSpace text-cyan-200 border border-cyberCyan/40 rounded-lg px-2.5 py-1.5 text-xs font-bold cursor-pointer"
          >
            <option value="auto">Automático (Telemetria Real)</option>
            <option value="limpo">Teste: Céu Limpo</option>
            <option value="nublado">Teste: Nuvens Densas (88%)</option>
            <option value="chuva">Teste: Chuva Ativa (6.8 mm/h)</option>
            <option value="rajadas">Teste: Rajadas Fortes (46 km/h)</option>
            <option value="tempestade">Teste: Tempestade / CAPE (18.5 mm/h)</option>
          </select>

          <button
            type="button"
            onClick={() => focarMunicipio('mesquita')}
            className="cyber-button text-[10px]"
          >
            ROCHA SOBRINHO
          </button>
        </div>

function VistoriaLaudoModule({ showToast }) {
  const [frenteSelecionada, setFrenteSelecionada] = useState(FRENTES_EQUIPES_TABELA[0]);
  const [municipio, setMunicipio] = useState("Mesquita");
  const [bairro, setBairro] = useState("Rocha Sobrinho");
  const [local, setLocal] = useState("");
  const [tipoRisco, setTipoRisco] = useState("Inundação / Alagamento / Enxurrada");
  const [nivel, setNivel] = useState("MODERADO");
  const [relato, setRelato] = useState("");
  const [laudoHash, setLaudoHash] = useState("");
  const [laudosSalvos, setLaudosSalvos] = useState(() => {
    try { return JSON.parse(localStorage.getItem('raru_laudos_v11') || '[]'); } catch (e) { return []; }
  });

  // Estados de reparo e operação da câmera
  const [cameraActive, setCameraActive] = useState(false);
  const [cameraStarting, setCameraStarting] = useState(false);
  const [facingMode, setFacingMode] = useState("environment");
  const [cameraStatusMsg, setCameraStatusMsg] = useState("Câmera pronta para ativação ou reparo.");
  const [cameraDiagReport, setCameraDiagReport] = useState([]);
  const [capturedPhoto, setCapturedPhoto] = useState(null);

  const videoRef = useRef(null);
  const streamRef = useRef(null);
  const photoCanvasRef = useRef(null);

  const pararStreamCamera = () => {
    try {
      if (streamRef.current && typeof streamRef.current.getTracks === 'function') {
        streamRef.current.getTracks().forEach(trk => {
          try { trk.stop(); } catch (_) {}
        });
      }
      streamRef.current = null;
      if (videoRef.current) {
        videoRef.current.srcObject = null;
      }
    } catch (_) {}
    setCameraActive(false);
  };

  const diagnosticarERepararCamera = async () => {
    const checks = [];
    const isSecure = Boolean(window.isSecureContext || location.protocol === 'https:' || location.hostname === 'localhost' || location.hostname === '127.0.0.1');
    checks.push(`Contexto seguro (HTTPS/Localhost): ${isSecure ? 'OK' : 'BLOQUEADO (requer HTTPS)'}`);

    const hasGetUserMedia = Boolean(navigator.mediaDevices && typeof navigator.mediaDevices.getUserMedia === 'function');
    checks.push(`API getUserMedia disponível: ${hasGetUserMedia ? 'OK' : 'INDISPONÍVEL'}`);

    let permState = 'desconhecida';
    try {
      if (navigator.permissions && typeof navigator.permissions.query === 'function') {
        const p = await navigator.permissions.query({ name: 'camera' });
        permState = p.state || 'desconhecida';
      }
    } catch (_) {}
    checks.push(`Permissão registrada no navegador: ${permState}`);

    let devicesCount = 0;
    try {
      if (hasGetUserMedia && typeof navigator.mediaDevices.enumerateDevices === 'function') {
        const devs = await navigator.mediaDevices.enumerateDevices();
        devicesCount = devs.filter(d => d.kind === 'videoinput').length;
      }
    } catch (_) {}
    checks.push(`Câmeras detectadas no dispositivo: ${devicesCount}`);

    setCameraDiagReport(checks);
    pararStreamCamera();
    await destravarEIniciarCamera(facingMode);
  };

  const destravarEIniciarCamera = async (modoAlvo = facingMode) => {
    setCameraStarting(true);
    setCameraStatusMsg("Destravando e iniciando fluxo de vídeo...");
    pararStreamCamera();

    if (!navigator.mediaDevices || typeof navigator.mediaDevices.getUserMedia !== 'function') {
      setCameraStarting(false);
      setCameraStatusMsg("Navegador sem suporte a getUserMedia. Use o seletor de foto abaixo para anexar imagem.");
      showToast("API de câmera indisponível; use anexar foto.", "warning");
      return;
    }

    const tentativas = [
      { video: { facingMode: { ideal: modoAlvo }, width: { ideal: 1280 }, height: { ideal: 720 } }, audio: false },
      { video: { facingMode: modoAlvo }, audio: false },
      { video: true, audio: false }
    ];

    let streamObtido = null;
    let ultimoErro = null;

    for (const constraints of tentativas) {
      try {
        streamObtido = await navigator.mediaDevices.getUserMedia(constraints);
        if (streamObtido) break;
      } catch (err) {
        ultimoErro = err;
      }
    }

    if (!streamObtido) {
      setCameraStarting(false);
      const errName = ultimoErro?.name || 'Erro';
      let orientacao = "Verifique a permissão de câmera no navegador e tente novamente.";
      if (errName === 'NotAllowedError' || errName === 'PermissionDeniedError') {
        orientacao = "Permissão negada no navegador. Libere a câmera no cadeado/configurações do site ou use anexar foto.";
      } else if (errName === 'NotReadableError' || errName === 'TrackStartError') {
        orientacao = "Câmera em uso por outro app ou travada no sistema. Feche outros apps e toque em REPARAR CÂMERA.";
      } else if (errName === 'NotFoundError' || errName === 'DevicesNotFoundError') {
        orientacao = "Nenhuma câmera encontrada no dispositivo. Use anexar foto.";
      }
      setCameraStatusMsg(`Câmera bloqueada (${errName}): ${orientacao}`);
      showToast(`Câmera bloqueada (${errName}).`, "warning");
      return;
    }

    try {
      streamRef.current = streamObtido;
      if (videoRef.current) {
        videoRef.current.muted = true;
        videoRef.current.playsInline = true;
        videoRef.current.srcObject = streamObtido;
        await videoRef.current.play();
      }
      setCameraActive(true);
      setCameraStarting(false);
      setCameraStatusMsg("Câmera desbloqueada e ativa.");
      showToast("Câmera desbloqueada com sucesso.", "success");
    } catch (playErr) {
      setCameraStarting(false);
      setCameraStatusMsg("Fluxo obtido, mas reprodução bloqueada: toque em REPARAR CÂMERA.");
      showToast("Falha ao reproduzir vídeo da câmera.", "warning");
    }
  };

  const capturarFotoDaCamera = () => {
    try {
      if (!videoRef.current || !photoCanvasRef.current) return;
      const v = videoRef.current;
      const cv = photoCanvasRef.current;
      const w = v.videoWidth || 640;
      const h = v.videoHeight || 480;
      cv.width = w;
      cv.height = h;
      const ctx = cv.getContext('2d');
      ctx.drawImage(v, 0, 0, w, h);
      const dataUrl = cv.toDataURL('image/jpeg', 0.85);
      setCapturedPhoto(dataUrl);
      setCameraStatusMsg("Foto capturada para o registro de vistoria.");
      showToast("Foto capturada.", "success");
    } catch (_) {
      showToast("Não foi possível capturar o quadro.", "warning");
    }
  };

  const handleFileFallback = (e) => {
    const file = e.target.files && e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      setCapturedPhoto(String(reader.result || ''));

      foto: capturedPhoto || null, hash, data: new Date().toLocaleString('pt-BR')

    const next = [registro, ...laudosSalvos];
    setLaudosSalvos(next);
    setLaudoHash(hash);

function EstacaoSobrevivenciaModule({ showToast, userName, setUserName }) {
  const [coords, setCoords] = useState(null);
  const [loadingGps, setLoadingGps] = useState(false);
  const [nomeInput, setNomeInput] = useState(userName || "");

  const capturarGps = () => {
    setLoadingGps(true);
    if (!navigator.geolocation) {
      setLoadingGps(false);
      return showToast("Geolocalização não disponível neste navegador.", "warning");
    }
    navigator.geolocation.getCurrentPosition(
      (pos) => {
        setCoords({ lat: pos.coords.latitude.toFixed(6), lon: pos.coords.longitude.toFixed(6), acc: Math.round(pos.coords.accuracy) });
        setLoadingGps(false);
        showToast("Coordenadas GPS capturadas com sucesso.", "success");
      },
      () => {
        setLoadingGps(false);
        showToast("Não foi possível obter a localização GPS.", "warning");
      },
      { enableHighAccuracy: true, timeout: 10000 }
    );
  };

  return (
    <div className="space-y-4 font-mono w-full max-w-4xl mx-auto">
      <div className="cyber-card p-5 rounded-2xl border border-cyberCyan/50 space-y-4">
        <h2 className="font-display text-sm sm:text-base font-black text-cyberCyan uppercase">ESTAÇÃO DE APOIO E COORDENADAS</h2>

        <div className="bg-void/90 p-3.5 rounded-xl border border-cyberCyan/30 space-y-2">
          <label className="text-[10px] text-cyberCyan font-bold block uppercase">IDENTIFICAÇÃO NA CONVERSA (DINÂMICA POR PESSOA)</label>
          <div className="flex gap-2">
            <input
              type="text"
              value={nomeInput}
              onChange={(e) => setNomeInput(e.target.value)}
              placeholder="Digite o nome da pessoa que está falando agora"
              className="flex-1 bg-deepSpace border border-cyberCyan/40 rounded-lg px-3 py-2 text-xs text-white"
            />
            <button
              type="button"
              onClick={() => {
                setUserName(nomeInput.trim());
                showToast(nomeInput.trim() ? `Nome "${nomeInput.trim()}" salvo para esta conversa.` : "Nome dinâmico limpo.", "success");
              }}
              className="cyber-button-solid text-[10px]"
            >
              SALVAR NOME
            </button>
          </div>
        </div>

        <div className="bg-void/90 p-3.5 rounded-xl border border-cyberCyan/30 space-y-2">
          <div className="flex items-center justify-between">
            <span className="text-[11px] font-bold text-white uppercase">LOCALIZAÇÃO E COORDENADAS GPS</span>
            <button type="button" onClick={capturarGps} disabled={loadingGps} className="cyber-button text-[10px]">
              {loadingGps ? "LENDO GPS..." : "OBTER GPS"}
            </button>
          </div>
          {coords ? (
            <div className="text-xs text-emerald-300 font-bold">
              LAT: {coords.lat} | LON: {coords.lon} | PRECISÃO: {coords.acc}m
            </div>
          ) : (
            <div className="text-[11px] text-slate-400">Toque em OBTER GPS para exibir as coordenadas exatas do ponto.</div>
          )}
        </div>
      </div>
    </div>
  );
}

function App() {
  const [activeTab, setActiveTab] = useState(() => {
    try { return localStorage.getItem('raru_active_tab') || 'dashboard'; } catch (e) { return 'dashboard'; }
  });
  const [userName, setUserName] = useState(() => {
    try { return localStorage.getItem('raru_dynamic_user_name') || ''; } catch (e) { return ''; }
  });
  const [dayMode, setDayMode] = useState(() => {
    try { return localStorage.getItem('raru_day_mode') === 'true'; } catch (e) { return false; }
  });
  const [perfilVozId, setPerfilVozId] = useState(() => {
    try { return localStorage.getItem('raru_perfil_voz') || 'sarah'; } catch (e) { return 'sarah'; }
  });
  const [customTickerText, setCustomTickerText] = useState(() => {
    try { return localStorage.getItem('raru_custom_ticker') || ''; } catch (e) { return ''; }
  });
  const [mapaRaruSync, setMapaRaruSync] = useState(() => {
    try { return window.__RARU_MAPA_STATE || null; } catch (_) { return null; }
  });

  const [chatOpen, setChatOpen] = useState(false);
  const [chatInput, setChatInput] = useState("");
  const [isTyping, setIsTyping] = useState(false);
  const [isSpeaking, setIsSpeaking] = useState(false);
  const [chatMessages, setChatMessages] = useState([
    {
      id: 'init-1',
      sender: 'bot',
      text: 'Olá! Sou a SARAH, inteligência única interligada ao MAPA RARU. Qual é o seu nome e o que vamos monitorar agora?',
      time: new Date().toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' })
    }
  ]);

  const chatMessagesRef = useRef(chatMessages);
  chatMessagesRef.current = chatMessages;
  const chatEndRef = useRef(null);
  const [toast, setToast] = useState(null);

  const showToast = (msg, type = 'info') => {
    setToast({ msg, type });
    setTimeout(() => setToast(null), 3200);
  };

  useEffect(() => {
    try { localStorage.setItem('raru_active_tab', activeTab); } catch (e) {}
  }, [activeTab]);

  useEffect(() => {
    try { localStorage.setItem('raru_dynamic_user_name', userName || ''); } catch (e) {}
  }, [userName]);

  useEffect(() => {
    document.body.classList.toggle('raru-day-mode', dayMode);
    document.documentElement.classList.toggle('raru-day-mode', dayMode);
    try { localStorage.setItem('raru_day_mode', String(dayMode)); } catch (e) {}
  }, [dayMode]);

  useEffect(() => {
    const onMapaSync = (ev) => {
      if (ev && ev.detail) setMapaRaruSync(ev.detail);
    };
    window.addEventListener('raru:mapa-telemetry-sync', onMapaSync);
    window.__RARU_CENTRAL_LISTENING = true;
    window.RARU_AI = {
      ask: async (prompt, mapContext) => {
        const snap = mapContext?.live || mapContext || mapaRaruSync || {};
        const munNome = mapContext?.municipio || snap.municipio || 'Mesquita · Rocha Sobrinho';
        const hist = [
          ...chatMessagesRef.current.slice(-4).map(m => ({ role: m.sender === 'user' ? 'user' : 'assistant', content: m.text })),
          { role: 'user', content: prompt }
        ];
        return await chamarSarahGroq(hist, munNome, 'Rocha Sobrinho', activeTab, { ...snap, municipio: munNome }, userName);
      }
    };
    window.dispatchEvent(new CustomEvent('raru:central-ready', { detail: { source: 'CENTRAL_RARU_NEXUS' } }));
    return () => window.removeEventListener('raru:mapa-telemetry-sync', onMapaSync);
  }, [userName, activeTab, mapaRaruSync]);

  useEffect(() => {
    if (chatEndRef.current) {
      chatEndRef.current.scrollIntoView({ behavior: 'smooth' });
    }
  }, [chatMessages, chatOpen]);

  const handleInstallClick = async () => {
    try {
      const iconFile = await gerarArquivoIconeEscudo();
      if (navigator.share && iconFile && navigator.canShare && navigator.canShare({ files: [iconFile] })) {
        await navigator.share({ title: 'RARU NEXUS V11.2 PLUS', text: shareMessageText, files: [iconFile] });
        return;
      }
      if (navigator.share) {
        await navigator.share({ title: 'RARU NEXUS V11.2 PLUS', text: shareMessageText, url: APP_SHARE_URL });
        return;
      }
      if (navigator.clipboard && navigator.clipboard.writeText) {
        await navigator.clipboard.writeText(shareMessageText);
        showToast("Link copiado para a área de transferência.", "success");
      }
    } catch (_) {}
  };

  const handleSendChat = async (e) => {
    e.preventDefault();
    const txt = chatInput.trim();
    if (!txt) return;
    setChatInput("");

    const nameMatch = txt.match(/(?:meu nome [ée]|me chamo|sou o|sou a|pode me chamar de)\s+([A-Za-zÀ-ÿ]{2,25})/i);
    let activeUser = userName;
    if (nameMatch && nameMatch[1]) {
      const detected = nameMatch[1].charAt(0).toUpperCase() + nameMatch[1].slice(1);
      activeUser = detected;
      setUserName(detected);
    }

    const userMsg = {
      id: 'u-' + Date.now(),
      sender: 'user',
      text: txt,
      time: new Date().toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' })
    };
    const nextHist = [...chatMessagesRef.current, userMsg];
    setChatMessages(nextHist);
    setIsTyping(true);

    const apiHist = nextHist.slice(-6).map(m => ({
      role: m.sender === 'user' ? 'user' : 'assistant',
      content: m.text
    }));

    const reply = await chamarSarahGroq(apiHist, mapaRaruSync?.municipio || 'Mesquita', 'Rocha Sobrinho', activeTab, mapaRaruSync, activeUser);
    setIsTyping(false);

    const botMsg = {
      id: 'b-' + Date.now(),
      sender: 'bot',
      text: reply,
      time: new Date().toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' })
    };
    setChatMessages(prev => [...prev, botMsg]);
    setIsSpeaking(true);
    falarImitada(reply, perfilVozId);
    setTimeout(() => setIsSpeaking(false), 3000);
  };

  return (
    <div className="seu-container-raru">
      {toast && (
        <div className="fixed top-4 right-4 z-50 bg-deepSpace border border-cyberCyan text-white px-4 py-2 rounded-xl text-xs font-bold shadow-xl">
          {toast.msg}
        </div>
      )}

      <header className="w-full py-2 px-3 mb-3 flex items-center justify-between bg-gradient-to-r from-deepSpace/95 via-commandPanel/95 to-deepSpace/95 border border-cyberCyan/45 rounded-2xl shadow-lg sticky top-1 z-40 backdrop-blur-md gap-2 flex-wrap">
        <div onClick={() => setActiveTab('dashboard')} className="flex items-center gap-2 cursor-pointer min-w-0">
          <div className="w-9 h-9 rounded-xl bg-void border border-cyberCyan flex items-center justify-center shrink-0">
            <span className="font-display font-black text-cyberCyan text-sm">R</span>
          </div>
          <div className="flex flex-col min-w-0">
            <span className="font-display font-black text-xs tracking-wider text-white truncate">RARU NEXUS V11.2 PLUS</span>
            <span className="text-[8px] font-mono text-cyberCyan font-bold uppercase tracking-wider truncate">
              {userName ? `${userName} • MESQUITA RJ` : 'REDE COMUNITÁRIA • 92 MUNICÍPIOS RJ'}
            </span>
          </div>
        </div>

        <div className="flex items-center gap-1.5 flex-wrap justify-end">
          <button
            type="button"
            onClick={() => setActiveTab('mapa_raru')}
            className={`compact-nav-btn ${activeTab === 'mapa_raru' ? 'compact-nav-btn-active' : ''}`}
          >
            <IconMapaRaro size={13} color={activeTab === 'mapa_raru' ? '#030712' : '#00F2FE'} />
            <span>MAPA RARU</span>
          </button>

          <button
            type="button"
            onClick={() => setDayMode(d => !d)}
            className="compact-nav-btn"
            title={dayMode ? "Mudar para Modo Noite" : "Mudar para Modo Dia"}
          >
            <IconSunMoon size={13} color="#00F2FE" />
            <span>{dayMode ? "NOITE" : "DIA"}</span>
          </button>

          <button
            type="button"
            onClick={handleInstallClick}
            className="compact-nav-btn compact-nav-btn-active"
          >
            <IconInstalar size={13} color="#030712" />
            <span>COMPARTILHAR</span>
          </button>
        </div>
      </header>

      <AutomatedObservatoryWidget customTickerText={customTickerText} />

      <main className="flex-1 w-full">
        {activeTab === 'dashboard' && (
          <div className="space-y-4 w-full max-w-4xl mx-auto font-mono">
            <div className="cyber-card text-center relative overflow-hidden">
              <div className="relative z-10 flex flex-col items-center">
                <SarahAnimatedAvatar isSpeaking={isSpeaking} />
                <h1 className="font-display text-lg sm:text-xl font-black text-white mt-2 tracking-wider">
                  RARU NEXUS V11.2 PLUS
                </h1>
                <p className="text-[11px] text-cyberCyan font-bold uppercase tracking-widest mt-0.5">
                  REDE COMUNITÁRIA DE MONITORAMENTO CLIMÁTICO • 92 MUNICÍPIOS RJ
                </p>
                {mapaRaruSync && (
                  <p className="text-[10px] text-emerald-300 mt-1">
                    MAPA RARU sincronizado com SARAH: {mapaRaruSync.municipio} ({Number(mapaRaruSync.lat).toFixed(4)}, {Number(mapaRaruSync.lon).toFixed(4)})
                  </p>
                )}
                <div className="flex flex-wrap justify-center gap-2 mt-4">
                  <button type="button" onClick={() => setActiveTab('mapa_raru')} className="cyber-button-solid text-[10px]">
                    <IconMapaRaro size={13} color="#030712" />
                    <span>MAPA RARU</span>
                  </button>
                  <button type="button" onClick={() => setActiveTab('radar')} className="cyber-button text-[10px]">
                    <IconRadar size={13} color="#00F2FE" />
                    <span>RADAR & SATÉLITE</span>
                  </button>
                  <button type="button" onClick={() => setChatOpen(true)} className="cyber-button text-[10px]">
                    <span>CONVERSAR COM SARAH</span>
                  </button>
                </div>
              </div>
            </div>
          </div>
        )}

        {activeTab === 'mapa_raru' && (
          <MapaRaruModule
            onGoToDashboard={() => setActiveTab('dashboard')}
            showToast={showToast}
            userName={userName}
            perfilVozId={perfilVozId}
            onSyncCentralTelemetry={(payload) => setMapaRaruSync(payload)}
            onOpenSarahChat={() => setChatOpen(true)}
          />
        )}

        {activeTab === 'radar' && <RadarMeteorologicoModule perfilVozId={perfilVozId} />}
        {activeTab === 'vistoria' && <VistoriaLaudoModule showToast={showToast} />}
        {activeTab === 'estacao' && <EstacaoSobrevivenciaModule showToast={showToast} userName={userName} setUserName={setUserName} />}
        {activeTab === 'alquino' && <AlquinoModule perfilVozId={perfilVozId} />}
        {activeTab === 'balanca' && <BalancaModule showToast={showToast} />}
        {activeTab === 'videos' && <VideosModule perfilVozId={perfilVozId} />}
        {activeTab === 'admin' && (
          <AdminModule
            showToast={showToast}
            customTickerText={customTickerText}
            setCustomTickerText={setCustomTickerText}
            perfilVozId={perfilVozId}
            setPerfilVozId={setPerfilVozId}
          />
        )}
      </main>

      <footer className="mt-8 mb-14 py-2.5 px-2.5 bg-gradient-to-r from-deepSpace/95 via-commandPanel/95 to-deepSpace/95 border border-cyberCyan/45 rounded-2xl w-full shadow-lg">
        <div className="flex flex-wrap items-center justify-center gap-1.5">
          {[
            { id: 'dashboard', label: 'PAINEL', Icon: IconDashboard },
            { id: 'mapa_raru', label: 'MAPA RARU', Icon: IconMapaRaro },
            { id: 'radar', label: 'RADAR & SAT', Icon: IconRadar },
            { id: 'vistoria', label: 'VISTORIA', Icon: IconVistoria },
            { id: 'estacao', label: 'ESTAÇÃO', Icon: IconEstacao },
            { id: 'alquino', label: 'ALQUINO', Icon: IconAlquino },
            { id: 'balanca', label: 'BALANÇA', Icon: IconBalanca },
            { id: 'videos', label: 'VÍDEOS', Icon: IconVideos },
            { id: 'admin', label: 'ADMIN', Icon: IconAdmin },
          ].map(item => {
            const ativo = activeTab === item.id;
            const CompIcon = item.Icon;
            return (
              <button
                key={item.id}
                type="button"
                onClick={() => setActiveTab(item.id)}
                className={`compact-nav-btn ${ativo ? 'compact-nav-btn-active' : ''}`}
              >
                <CompIcon size={13} color={ativo ? "#030712" : "#00F2FE"} />
                <span>{item.label}</span>
              </button>
            );
          })}
        </div>
      </footer>

      <SarahFabButton openSarahChat={() => setChatOpen(true)} isSpeaking={isSpeaking} />

      {chatOpen && (
        <div className="fixed inset-0 bg-black/75 z-50 flex items-end sm:items-center justify-center p-2 sm:p-4 backdrop-blur-sm">
          <div className="bg-deepSpace border border-cyberCyan/60 rounded-2xl w-full max-w-md flex flex-col h-[80vh] sm:h-[540px] shadow-2xl overflow-hidden font-mono">
            <div className="bg-commandPanel px-4 py-3 border-b border-cyberCyan/30 flex items-center justify-between">
              <div className="flex items-center gap-2.5">
                <div className="w-8 h-8 rounded-full border border-cyberCyan overflow-hidden">
                  <SarahVectorAvatar />
                </div>
                <div>
                  <h3 className="font-display text-xs font-black text-cyberCyan uppercase">SARAH • SALA CENTRAL</h3>
                  <p className="text-[9px] text-slate-300">
                    {userName ? `Conversando com ${userName}` : 'Pergunte e informe seu nome na conversa'}
                  </p>
                </div>
              </div>
              <button type="button" onClick={() => setChatOpen(false)} className="cyber-button-danger text-[10px] px-2.5 py-1 !min-h-[30px]">
                FECHAR
              </button>
            </div>

            <div className="flex-1 overflow-y-auto p-3 space-y-2.5">
              {chatMessages.map(m => (
                <div key={m.id} className={`flex flex-col max-w-[85%] rounded-xl px-3 py-2 text-xs ${m.sender === 'user' ? 'self-end bg-cyberCyan text-void font-semibold' : 'self-start bg-void/90 border border-cyberCyan/30 text-slate-100'}`}>
                  <span>{m.text}</span>
                  <span className={`text-[8px] mt-1 ${m.sender === 'user' ? 'text-void/70 text-right' : 'text-slate-400'}`}>{m.time}</span>
                </div>
              ))}
              {isTyping && <div className="text-[10px] text-cyberCyan animate-pulse">SARAH respondendo...</div>}
              <div ref={chatEndRef} />
            </div>

            <form onSubmit={handleSendChat} className="p-2.5 bg-commandPanel border-t border-cyberCyan/30 flex gap-2">
              <input
                type="text"
                value={chatInput}
                onChange={(e) => setChatInput(e.target.value)}
                placeholder="Digite sua mensagem ou diga seu nome..."
                className="flex-1 bg-void border border-cyberCyan/40 rounded-lg px-3 py-2 text-xs text-white"
              />
              <button type="submit" className="cyber-button-solid text-[10px]">
                ENVIAR
              </button>
            </form>
          </div>
        </div>
      )}
    </div>
  );
}

const rootEl = document.getElementById("root");
ReactDOM.createRoot(rootEl).render(<App />);
</script>
</body>
</html>
