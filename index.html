function FieldReportModule({onBackToDashboard,showToast}){
    const[setor,setSetor]=R.useState("🛡️ Defesa Civil Municipal"),[nivelRisco,setNivelRisco]=R.useState("🟢 Risco Baixo / Monitoramento"),[agente,setAgente]=R.useState(""),[local,setLocal]=R.useState(""),[desc,setDesc]=R.useState(""),[gps,setGps]=R.useState({lt:'',ln:'',lk:''}),[gpsSt,setGpsSt]=R.useState("📍 GPS em espera"),[fotos,setFotos]=R.useState([{id:1,file:null,preview:null},{id:2,file:null,preview:null},{id:3,file:null,preview:null},{id:4,file:null,preview:null}]);
    const capturarGps=()=>{if(!navigator.geolocation)return showToast("⚠️ Sem GPS");showToast("🛰 Buscando...");navigator.geolocation.getCurrentPosition(p=>{const lt=p.coords.latitude.toFixed(6),ln=p.coords.longitude.toFixed(6),lk=`https://www.google.com/maps?q=${lt},${ln}`;setGps({lt,ln,lk});setLocal(`${lt},${ln}`);setGpsSt("✅ GPS Fixado");},()=>setGpsSt("⚠ Erro GPS"),{enableHighAccuracy:false,timeout:15000,maximumAge:60000})};
    const processar=(f,g,a,l)=>new Promise((ok,err)=>{const img=new Image();const urlTmp=URL.createObjectURL(f);img.src=urlTmp;img.onload=()=>{try{const cv=document.createElement('canvas');const MAX=600;let w=img.width,h=img.height;if(w>MAX||h>MAX){if(w>h){h=Math.round(h*MAX/w);w=MAX}else{w=Math.round(w*MAX/h);h=MAX}}cv.width=w;cv.height=h;const ctx=cv.getContext('2d',{alpha:false});ctx.drawImage(img,0,0,w,h);const dt=new Intl.DateTimeFormat('pt-BR',{dateStyle:'short',timeStyle:'medium',timeZone:'America/Sao_Paulo'}).format(new Date());const coord=g.lt?`${g.lt},${g.ln}`:(l||'Sem GPS');const fs=Math.max(11,Math.round(w*0.028));ctx.font=`bold ${fs}px sans-serif`;const pad=8,lh=fs+5,bh=lh*3+pad*2;ctx.fillStyle='rgba(0,0,0,0.82)';ctx.fillRect(0,h-bh,w,bh);ctx.fillStyle='#FF9900';let y=h-bh+pad+fs;ctx.fillText(`📅 ${dt}`,pad,y);ctx.fillText(`📍 GPS: ${coord}`,pad,y+lh);ctx.fillText(`👤 Resp.: ${a||'Defesa Civil'}`,pad,y+lh*2);cv.toBlob(b=>{URL.revokeObjectURL(urlTmp);if(!b)return err();const file=new File([b],`vistoria_${Date.now()}.jpg`,{type:'image/jpeg'});const previewUrl=URL.createObjectURL(b);ok({file,preview:previewUrl});},'image/jpeg',0.50);}catch(e){URL.revokeObjectURL(urlTmp);err(e);}};img.onerror=()=>{URL.revokeObjectURL(urlTmp);err();};});
    const handleFoto=async(i,e)=>{const file=e.target.files[0];if(!file)return;if(file.size>15*1024*1024){showToast("⚠️ Foto muito grande!");return;}e.target.value="";showToast(`🔄 Compactando bloco ${i+1}...`);try{const{file:cf,preview}=await processar(file,gps,agente,local);setFotos(v=>{const n=[...v];if(n[i].preview)URL.revokeObjectURL(n[i].preview);n[i]={id:n[i].id,file:cf,preview};return n;});showToast(`✅ Bloco ${i+1} pronto!`);}catch(err){showToast("❌ Erro memória, tente 1 por vez");}};
    const apagar=(i,e)=>{e.stopPropagation();setFotos(v=>{const n=[...v];if(n[i].preview)URL.revokeObjectURL(n[i].preview);n[i]={id:n[i].id,file:null,preview:null};return n;})};
    const montarTexto=()=>{const c=fotos.filter(f=>f.file).length;const dh=new Intl.DateTimeFormat('pt-BR',{dateStyle:'short',timeStyle:'medium',timeZone:'America/Sao_Paulo'}).format(new Date());return `🚨 *RELATORIO TECNICO* 🛡️\n🏛 ${setor}\n⚠️ ${nivelRisco}\n👤 ${agente||'Nao informado'}\n📅 ${dh}\n📍 ${local||'Nao informada'}\n${gps.lk?`🔗 ${gps.lk}\n`:''}📸 ${c}/4 fotos\n📝 ${desc||'Sem descricao.'}\n⚡ *SARAH IA NEXUS PRO*`;};
    const copiar=()=>navigator.clipboard.writeText(montarTexto()).then(()=>showToast("📋 Copiado!"));
    const compartilhar=async()=>{const txt=montarTexto(),files=fotos.filter(f=>f.file).map(f=>f.file);if(!files.length)return showToast("⚠️ Anexe 1 foto!");if(navigator.canShare){try{const data={title:'Relatorio SARAH IA',text:txt,files};if(navigator.canShare(data)){await navigator.share(data);showToast("✅ Enviado!");return;}}catch(e){if(e.name==='AbortError')return;}}try{await navigator.clipboard.writeText(txt);}catch{}window.open(`https://wa.me/?text=${encodeURIComponent(txt)}`,'_blank');};
    return(<div className="space-y-4 max-w-xl mx-auto"><div className="flex justify-between cyber-card px-5 py-3.5 rounded-2xl border border-cyberCyan/30"><span className="text-xs font-extrabold text-cyberCyan">📋 Vistoria BLINDADA v8.5 - SEM INSUFICIÊNCIA</span><button onClick={onBackToDashboard} className="px-3 py-1 bg-cyberRose/20 text-cyberRose rounded-xl text-xs font-bold cursor-pointer">✕</button></div><div className="cyber-card rounded-[32px] p-6 border border-cyberCyan/40 space-y-3"><select value={setor} onChange={e=>setSetor(e.target.value)} className="w-full bg-void border border-cyberCyan/40 rounded-2xl p-3 text-xs text-white"><option>🛡️ Defesa Civil Municipal</option><option>🤝 Assistencia Social / CRAS</option><option>🎓 Pesquisa Academica</option><option>🌱 Grupo A Chave da Esperanca</option><option>👁️ Cidadao Sensor</option><option>🛠️ Tecnico de Campo</option></select><select value={nivelRisco} onChange={e=>setNivelRisco(e.target.value)} className="w-full bg-void border border-cyberCyan/40 rounded-2xl p-3 text-xs text-white"><option>🟢 Risco Baixo</option><option>🟡 Risco Medio</option><option>🟠 Risco Alto</option><option>🔴 Risco Muito Alto</option></select><div className="grid grid-cols-2 gap-2"><input value={agente} onChange={e=>setAgente(e.target.value)} placeholder="Responsável" className="w-full bg-void border border-cyberCyan/40 rounded-2xl p-3 text-xs text-white"/><input value={local} onChange={e=>setLocal(e.target.value)} placeholder="Localidade" className="w-full bg-void border border-cyberCyan/40 rounded-2xl p-3 text-xs text-white"/></div><div className="border border-cyberCyan/40 bg-void/80 rounded-2xl p-3 flex justify-between items-center"><span className="text-cyberGreen text-xs font-mono">{gpsSt}</span><button onClick={capturarGps} className="px-3 py-1 cyber-button font-black rounded-xl text-xs cursor-pointer">GPS 🛰</button></div><textarea value={desc} onChange={e=>setDesc(e.target.value)} placeholder="Descreva a ocorrência..." rows="3" className="w-full bg-void border border-cyberCyan/40 rounded-2xl p-3 text-xs text-white"></textarea><div className="grid grid-cols-2 gap-2">{fotos.map((f,i)=>(<div key={f.id} className="relative h-28 rounded-2xl border-2 border-dashed border-cyberGreen/40 bg-void flex items-center justify-center overflow-hidden">{f.preview?(<><img src={f.preview} className="w-full h-full object-cover"/><button onClick={e=>apagar(i,e)} className="absolute top-1 right-1 w-6 h-6 bg-cyberRose text-white rounded-full text-xs cursor-pointer">✕</button></>):(<label htmlFor={`foto-${i}`} className="w-full h-full flex flex-col items-center justify-center cursor-pointer"><div>📷</div><div className="text-[9px] text-slate-300">Bloco {i+1}</div></label>)}<input id={`foto-${i}`} type="file" accept="image/*" capture="environment" className="hidden" onChange={e=>handleFoto(i,e)}/></div>))}</div><button onClick={copiar} className="w-full cyber-button font-bold py-3 rounded-2xl text-xs cursor-pointer">📋 Copiar Relatório</button><button onClick={compartilhar} className="w-full bg-gradient-to-r from-amber-600 to-cyberCyan text-white font-bold py-3 rounded-2xl text-xs cursor-pointer">🚀 Enviar + Fotos WhatsApp</button></div></div>);
}

function PublicVideoGallery({localVideos,onGoToDashboard}){

function AdminVaultModule({localVideos,setLocalVideos,marketingText,setMarketingText,showToast,onClose}){
    const[pinInput,setPinInput]=R.useState("");const[isUnlocked,setIsUnlocked]=R.useState(false);const[marketingInput,setMarketingInput]=R.useState(marketingText);
    const handleUnlock=(e)=>{e.preventDefault();if(pinInput==="303500"){setIsUnlocked(true);showToast("🔓 Acesso Autorizado!");}else showToast("❌ PIN Incorreto.");};
    const handleUploadVideo=(e)=>{const files=Array.from(e.target.files);files.forEach(file=>{showToast(`🔄 Salvando ${file.name}...`);const reader=new FileReader();reader.onload=(evt)=>{const newVid={id:Date.now()+Math.random(),title:file.name,url:evt.target.result,date:new Date().toLocaleDateString('pt-BR')};setLocalVideos(prev=>{const upd=[newVid,...prev];try{localStorage.setItem("sarah_persistent_videos_v84_permanent",JSON.stringify(upd));}catch(err){showToast("⚠️ Vídeo grande demais!");}return upd;});showToast(`📹 ${file.name} fixado!`);};reader.readAsDataURL(file);});e.target.value="";};
    const handleDeleteVideo=(id,title)=>{if(confirm(`Excluir ${title}?`)){setLocalVideos(prev=>{const upd=prev.filter(v=>v.id!==id);try{localStorage.setItem("sarah_persistent_videos_v84_permanent",JSON.stringify(upd));}catch{}return upd;});showToast(`🗑️ ${title} excluído!`);}};
    return(<div className="space-y-4 max-w-xl mx-auto"><div className="cyber-card p-6 rounded-[36px] space-y-5"><div className="flex justify-between border-b border-cyberCyan/25 pb-4"><h2 className="font-display text-xs font-black text-cyberCyan">🔒 VAULT ADMINISTRATIVO</h2><button onClick={onClose} className="px-3 py-1.5 bg-cyberRose/20 text-cyberRose border border-cyberRose/40 rounded-xl text-[11px] font-bold">✕</button></div>{!isUnlocked?(<form onSubmit={handleUnlock} className="flex gap-3"><input type="password" maxLength="6" value={pinInput} onChange={e=>setPinInput(e.target.value)} placeholder="PIN 🔒" className="flex-1 bg-void border border-cyberCyan/40 rounded-2xl px-4 py-3.5 text-center text-white font-mono text-lg"/><button type="submit" className="px-6 py-3.5 cyber-button font-black rounded-2xl text-xs">Acessar</button></form>):(<div className="space-y-4"><div className="bg-void/80 border border-cyberCyan/40 p-4 rounded-2xl space-y-2"><h3 className="text-[11px] font-black text-cyberCyan">📢 PATROCINADORES / MARKETING</h3><textarea rows="2" value={marketingInput} onChange={e=>setMarketingInput(e.target.value)} className="w-full bg-deepSpace border border-cyberCyan/30 rounded-xl p-3 text-xs text-slate-100"/><button onClick={()=>{setMarketingText(marketingInput);try{localStorage.setItem("sarah_marketing_text_v52",marketingInput);}catch(e){}showToast("💾 Campanha salva!");}} className="w-full py-3 cyber-button font-black rounded-xl text-[11px]">Salvar Campanha</button></div><label className="block text-center px-4 py-4 bg-gradient-to-r from-cyberGreen to-cyberCyan text-void font-black rounded-2xl text-xs cursor-pointer">➕ Enviar Novo Vídeo (Fixo)<input type="file" accept="video/*" onChange={handleUploadVideo} className="hidden"/></label><div className="space-y-3">{localVideos.map(vid=>(<div key={vid.id} className="flex justify-between bg-void/90 p-3 rounded-2xl border border-cyberCyan/30"><div className="truncate text-xs font-bold">▶ {vid.title}</div><button onClick={()=>handleDeleteVideo(vid.id,vid.title)} className="px-3 py-1.5 bg-cyberRose/20 text-cyberRose border border-cyberRose/40 rounded-xl text-[10px] font-bold">🗑️ Excluir</button></div>))}</div></div>)}</div></div>);
}

function AutomatedObservatoryWidget({marketingText}){
    const[w,setW]=R.useState({temp:"--",humidity:"--",rain:"--",status:"Sincronizando...",color:"#00F2FE"});
    R.useEffect(()=>{const fetchW=async()=>{try{const res=await fetch('https://api.open-meteo.com/v1/forecast?latitude=-22.7831&longitude=-43.4294&current=temperature_2m,relative_humidity_2m,precipitation&timezone=America/Sao_Paulo');const d=await res.json();if(d?.current){const{temperature_2m:tp,relative_humidity_2m:hm,precipitation:pr}=d.current;setW({temp:`${tp}°C`,humidity:`${hm}%`,rain:`${pr} mm`,status:pr>5?"ALERTA CHUVAS":pr>0.5?"CHUVA LEVE":"CÉU ESTÁVEL",color:pr>5?"#F43F5E":pr>0.5?"#00F2FE":"#10B981"});}else throw new Error();}catch(e){setW({temp:"N/D",humidity:"N/D",rain:"N/D",status:"OFFLINE",color:"#64748B"});}};fetchW();const tw=setInterval(fetchW,600000);return()=>clearInterval(tw);},[]);
    const tickerTxt = '🛡️ Ciência cidadã • El Niño GACE • Cidades resilientes ONU Habitat • Grupo A Chave da Esperança • Todos unidos, todos protegidos • EMERGÊNCIAS: 199 (21 4040-1772) • Bombeiros 193 • ZAP 📲 (21) 97299-3223 • CRAS Rocha Sobrinho 21 2042-8931 • Sarah AI v8.4 PRO 🛡 • Salmos 127 🛡️ • ';
    return(<div className="cyber-card rounded-[32px] overflow-hidden border border-cyberCyan/30 shadow-2xl"><div className="px-5 py-4 bg-gradient-to-r from-deepSpace via-commandPanel to-deepSpace border-b border-cyberCyan/30"><div className="font-display font-black text-[11px] text-center tracking-[0.3em] text-cyberCyan">🛰 OBSERVATÓRIO METEOROLÓGICO • MESQUITA / RJ</div></div><div style={{display:'grid',gridTemplateColumns:'repeat(auto-fit,minmax(120px,1fr))',gap:'10px'}} className="p-4">{[{l:'TEMPERATURA',v:w.temp,c:'#00F2FE'},{l:'UMIDADE',v:w.humidity,c:'#10B981'},{l:'PRECIPITAÇÃO',v:w.rain,c:'#4FACFE'},{l:'STATUS',v:w.status,c:w.color}].map((x,i)=>(<div key={i} className="bg-void/80 border border-cyberCyan/20 rounded-2xl p-3 text-center"><div className="text-[9px] text-slate-400 font-black font-display">{x.l}</div><div className="text-sm font-mono font-black mt-1" style={{color:x.c}}>{x.v}</div></div>))}</div><div className="px-4 pb-3"><div className="flex gap-2.5 overflow-x-auto pb-1">{[{n:"199",label:"DEFESA CIVIL",c:"#F43F5E"},{n:"193",label:"BOMBEIROS",c:"#F472B6"},{n:"192",label:"SAMU",c:"#10B981"}].map((e,i)=>(<a key={i} href={`tel:${e.n}`} className="shrink-0 flex items-center gap-2 px-4 py-2.5 rounded-2xl bg-void/90 border" style={{borderColor:`${e.c}55`}}><span className="font-display font-black text-base" style={{color:e.c}}>{e.n}</span><span className="text-[9px] font-black text-slate-300">{e.label}</span></a>))}</div></div><div className="relative h-11 bg-gradient-to-r from-void via-deepSpace to-void border-t border-cyberCyan/20 overflow-hidden flex items-center"><div className="absolute left-0 top-0 bottom-0 z-10 px-3.5 flex items-center bg-gradient-to-r from-cyan-600 to-teal-600 rounded-r-xl"><span className="font-display font-black text-[9px] text-white">⚡ OMEGA</span></div><div style={{display:'flex',width:'max-content',whiteSpace:'nowrap'}} className="ml-28"><span style={{paddingRight:'80px',animation:'tickerScroll 40s linear infinite',display:'inline-block'}} className="font-bold text-xs text-cyberCyan">{tickerTxt}</span><span style={{paddingRight:'80px',animation:'tickerScroll 40s linear infinite',display:'inline-block'}} className="font-bold text-xs text-cyberCyan">{tickerTxt}</span></div></div><div className="px-5 py-4 bg-gradient-to-r from-deepSpace via-commandPanel to-deepSpace border-t border-cyberCyan/35 text-center"><div className="font-display font-black text-xs tracking-wider bg-gradient-to-r from-cyberCyan via-blue-400 to-teal-200 bg-clip-text text-transparent">{marketingText||"GRUPO A CHAVE DA ESPERANÇA • ROCHA SOBRINHO / MESQUITA"}</div><div className="mt-3 text-[10px] font-mono font-bold text-slate-400">@ Todos os Direitos Reservados - GADE ®</div></div></div>);
}

function SarahFabButton({onOpen}){return(<button className="fixed z-[60] w-14 h-14 rounded-full cyber-border-glow flex items-center justify-center cursor-pointer animate-hud-pulse bg-deepSpace shadow-[0_0_35px_rgba(0,242,254,0.6)]" style={{right:'16px',bottom:'92px'}} onClick={onOpen}><img src={SARAH_CUSTOM_AVATAR_URL} alt="Sarah FAB" className="w-10 h-10 rounded-full object-cover border border-cyberCyan"/><span className="absolute -top-1 -right-1 w-3.5 h-3.5 rounded-full bg-cyberGreen border-2 border-void"></span><span className="absolute -bottom-5 right-0 font-display font-black text-[7px] text-cyberCyan">SARAH AI</span></button>);}

function SarahChatOverlay({isOpen,onClose,isSpeaking,isProcessing,currentResponse,input,setInput,handleSendDirectCommand,toggleListening,isListening}){
    if(!isOpen) return null;
    return(<div className="fixed inset-0 z-[90] flex items-end sm:items-center justify-center bg-void/85 backdrop-blur-2xl" onClick={onClose}><div className="cyber-card w-full sm:max-w-lg rounded-t-[36px] sm:rounded-[36px] shadow-2xl overflow-hidden max-h-[88vh] flex flex-col border border-cyberCyan/40" onClick={e=>e.stopPropagation()}><div className="flex items-center justify-between px-5 py-4 border-b border-cyberCyan/30 bg-deepSpace/90"><div className="flex items-center gap-3"><div className={`w-11 h-11 rounded-2xl cyber-border-glow flex items-center justify-center overflow-hidden ${isSpeaking?'animate-hud-pulse':''}`}><img src={SARAH_CUSTOM_AVATAR_URL} className="w-full h-full object-cover"/></div><div><div className="font-display text-sm font-black text-white">SARAH AI PRO</div><div className="text-[10px] font-mono text-cyberCyan font-bold">{isProcessing?"processando...":isListening?"🎙 ouvindo...":isSpeaking?"🔊 falando...":"núcleo omega pro • v8.4"}</div></div></div><button onClick={onClose} className="w-9 h-9 rounded-xl bg-cyberRose/20 border border-cyberRose/40 text-cyberRose font-black">✕</button></div><div className="flex-1 overflow-y-auto px-5 py-4 min-h-[190px]"><div className="bg-void/90 border border-cyberCyan/30 rounded-2xl p-4 text-xs sm:text-sm text-slate-100 whitespace-pre-line leading-relaxed">{currentResponse}</div></div><div className="px-4 pb-5 pt-1"><form onSubmit={e=>{e.preventDefault();handleSendDirectCommand();}} className="flex items-center gap-2 bg-void border-2 border-cyberCyan/40 rounded-2xl p-2"><button type="button" onClick={toggleListening} className={`p-3.5 rounded-xl ${isListening?'bg-cyberRose text-white animate-pulse':'bg-commandPanel text-cyberCyan border border-cyberCyan/30'}`}>🎙️</button><input type="text" value={input} onChange={e=>setInput(e.target.value)} placeholder="Fale com a Sarah AI..." className="flex-1 bg-transparent border-none px-3 py-2 text-xs text-white focus:outline-none"/><button type="submit" disabled={isProcessing||!input.trim()} className={`px-5 py-3 rounded-xl font-black text-xs ${input.trim()&&!isProcessing?'cyber-button':'bg-commandPanel text-slate-500'}`}>Enviar</button></form></div></div></div>);
}

function App(){
    const[showSplash,setShowSplash]=R.useState(true);
    const[activeTab,setActiveTab]=R.useState("dashboard");
    const[radarOpen,setRadarOpen]=R.useState(false);
    const[toastMessage,setToastMessage]=R.useState(null);
    const[isChatOpen,setIsChatOpen]=R.useState(false);
    const[input,setInput]=R.useState("");
    const[isProcessing,setIsProcessing]=R.useState(false);
    const[isSpeaking,setIsSpeaking]=R.useState(false);
    const[isListening,setIsListening]=R.useState(false);
    const[currentResponse,setCurrentResponse]=R.useState("Olá! Sou a Sarah AI Pro, núcleo inteligente OMEGA v8.4. Falo sobre fé, cultura, lazer, culinária, cidadania e prevenção. Como posso ajudar hoje?");
    const[localVideos,setLocalVideos]=R.useState(()=>{try{return JSON.parse(localStorage.getItem("sarah_persistent_videos_v84_permanent")||"[]")}catch{return[]}});
    const[marketingText,setMarketingText]=R.useState(()=>{try{return localStorage.getItem("sarah_marketing_text_v52")||"GRUPO A CHAVE DA ESPERANÇA • ROCHA SOBRINHO / MESQUITA"}catch{return"GRUPO A CHAVE DA ESPERANÇA • ROCHA SOBRINHO / MESQUITA"}});
    const showToast=(m)=>{setToastMessage(m);setTimeout(()=>setToastMessage(null),3000);};
    const speak=(t)=>{if(!window.speechSynthesis) return; window.speechSynthesis.cancel(); const u=new SpeechSynthesisUtterance(t); u.lang='pt-BR'; u.rate=1; setIsSpeaking(true); u.onend=()=>setIsSpeaking(false); window.speechSynthesis.speak(u);};
    const handleSendDirectCommand=(customText)=>{
        const txt=(customText||input).trim(); if(!txt) return;
        setIsProcessing(true); setInput("");
        setTimeout(()=>{
            const topics=["FÉ & RELIGIÃO","CULTURA & LAZER","CULINÁRIA","POLÍTICA & CIDADANIA","PREVENÇÃO"];
            const resp=`${txt.includes("bacia")?"🌊 STATUS BACIAS: Sarapuí, Dona Eugênia e Prata em nível de atenção. Monitoramento 24h ativo.":txt.includes("clima")?"🌦️ CLIMA MESQUITA: Céu instável, possibilidade de pancadas isoladas. Fique atento aos alertas.":"🛡️ DEFESA CIVIL: Evite áreas de risco, mantenha bueiros limpos e cadastre-se no ZAP (21) 97299-3223."}\n\n💡 Tema: ${topics[Math.floor(Math.random()*topics.length)]} - A prevenção começa na comunidade unida!`;
            setCurrentResponse(resp); speak(resp); setIsProcessing(false);
        },800);
    };
    const toggleListening=()=>{if(!('webkitSpeechRecognition' in window || 'SpeechRecognition' in window)){showToast("⚠️ Navegador sem suporte a voz");return;}const SR=window.SpeechRecognition||window.webkitSpeechRecognition;const rec=new SR();rec.lang='pt-BR';rec.onstart=()=>setIsListening(true);rec.onend=()=>setIsListening(false);rec.onresult=(e)=>{setInput(e.results[0][0].transcript);};rec.start();};

    if(showSplash) return <AppSplashScreen onFinish={()=>setShowSplash(false)}/>;

    return(
        <div className="min-h-screen max-w-[1200px] mx-auto p-3 sm:p-5 space-y-4">
            <div className="flex items-center justify-between cyber-card px-4 py-3 rounded-2xl border border-cyberCyan/30">
                <div className="flex items-center gap-3"><SarahHologramAvatar isSpeaking={isSpeaking}/><div><div className="font-display font-black text-[11px] text-white tracking-widest">SARAH AI NEXUS v8.4 PRO</div><div className="text-[9px] font-mono text-cyberCyan font-bold">CYBER COMMAND CENTER • ONLINE</div></div></div>
                <div className="flex items-center gap-2">
                    <button onClick={()=>setActiveTab("dashboard")} className={`px-3 py-1.5 rounded-xl text-[10px] font-black ${activeTab==="dashboard"?'cyber-button':'bg-commandPanel border border-cyberCyan/30 text-cyberCyan'}`}>HOME</button>
                    <button onClick={()=>setActiveTab("videos")} className={`px-3 py-1.5 rounded-xl text-[10px] font-black ${activeTab==="videos"?'cyber-button':'bg-commandPanel border border-cyberCyan/30 text-cyberCyan'}`}>VÍDEOS</button>
                    <button onClick={()=>setActiveTab("admin")} className={`px-3 py-1.5 rounded-xl text-[10px] font-black ${activeTab==="admin"?'cyber-button':'bg-commandPanel border border-cyberCyan/30 text-cyberCyan'}`}>VAULT</button>
                </div>
            </div>

            {activeTab==="dashboard"&&<div className="space-y-4"><AutomatedObservatoryWidget marketingText={marketingText}/><div className="grid grid-cols-2 gap-3"><button onClick={()=>setActiveTab("report")} className="cyber-card rounded-[24px] p-5 border border-cyberCyan/30 hover:border-cyberCyan text-left space-y-2"><div className="text-xl">📋</div><div className="font-display font-black text-xs text-white">VISTORIA TÉCNICA</div><div className="text-[10px] text-slate-400">Relatório blindado v8.5</div></button><button onClick={()=>setRadarOpen(true)} className="cyber-card rounded-[24px] p-5 border border-cyberGreen/30 hover:border-cyberGreen text-left space-y-2"><div className="text-xl">🛰</div><div className="font-display font-black text-xs text-white">RADAR 24H</div><div className="text-[10px] text-slate-400">Windy • Mesquita/RJ</div></button></div></div>}

            {activeTab==="report"&&<FieldReportModule onBackToDashboard={()=>setActiveTab("dashboard")} showToast={showToast}/>}
            {activeTab==="videos"&&<PublicVideoGallery localVideos={localVideos} onGoToDashboard={()=>setActiveTab("dashboard")}/>}
            {activeTab==="admin"&&<AdminVaultModule localVideos={localVideos} setLocalVideos={setLocalVideos} marketingText={marketingText} setMarketingText={setMarketingText} showToast={showToast} onClose={()=>setActiveTab("dashboard")}/>}

            <NativeHydroWindRadar isOpen={radarOpen} onToggle={()=>setRadarOpen(!radarOpen)}/>
            <SarahFabButton onOpen={()=>setIsChatOpen(true)}/>
            <SarahChatOverlay isOpen={isChatOpen} onClose={()=>setIsChatOpen(false)} isSpeaking={isSpeaking} isProcessing={isProcessing} currentResponse={currentResponse} input={input} setInput={setInput} handleSendDirectCommand={handleSendDirectCommand} toggleListening={toggleListening} isListening={isListening}/>

            {toastMessage&&<div className="fixed top-4 left-1/2 -translate-x-1/2 z-[100] bg-void border border-cyberCyan/40 text-cyberCyan px-5 py-3 rounded-2xl text-xs font-bold shadow-[0_0_20px_rgba(0,242,254,0.5)] animate-hud-pulse">{toastMessage}</div>}
        </div>
    );
}
const root=ReactDOM.createRoot(document.getElementById('root'));
root.render(<App/>);
</script>
</body>
</html>
