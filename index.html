function escolherVozPtBr(perfilId) {
  const voices = carregarVozesDisponiveis();
  if (!voices || voices.length === 0) return null;
  const ptVoices = voices.filter(v => (v.lang || "").toLowerCase().includes("pt"));
  if (ptVoices.length === 0) return voices[0];
  const idx = PERFIS_VOZ_OFICIAIS.findIndex(p => p.id === perfilId);
  if (idx >= 0) return ptVoices[idx % ptVoices.length];
  return ptVoices.find(v => (v.name || "").toLowerCase().includes("google")) || ptVoices[0];
}

function falarImitada(texto, perfilId = 'sarah') {
  try {
    if (localStorage.getItem("raru_sound_enabled") === "false") return;
  } catch (e) {}
  if (!("speechSynthesis" in window)) return;
  const textoLimpo = limparTextoParaFala(texto);
  if (!textoLimpo) return;

  const perfilSalvo = (() => {
    try { return localStorage.getItem("raru_perfil_voz") || perfilId || 'sarah'; }
    catch (e) { return perfilId || 'sarah'; }
  })();
  const perfil = PERFIS_VOZ_OFICIAIS.find(p => p.id === perfilSalvo) || PERFIS_VOZ_OFICIAIS[0];

  try {
    window.speechSynthesis.cancel();
    const textoImitado = limparTextoParaFala(perfil.transform(textoLimpo));
    const frases = textoImitado.split(/(?<=[.!?])\s+/).filter(Boolean);
    const fila = frases.length > 0 ? frases : [textoImitado];
    const vozEscolhida = escolherVozPtBr(perfil.id);

    const falarSequencia = (index) => {
      if (index >= fila.length) return;
      try {
        if (localStorage.getItem("raru_sound_enabled") === "false") return;
      } catch (e) {}

      const u = new SpeechSynthesisUtterance(fila[index]);
      u.lang = "pt-BR";
      const osc = (Math.random() - 0.5) * perfil.variacao;
      u.pitch = Math.max(0.5, Math.min(2.0, perfil.pitch + osc));
      u.rate = Math.max(0.5, Math.min(2.0, perfil.rate));
      u.volume = Math.max(0, Math.min(1, perfil.volume));
      if (vozEscolhida) u.voice = vozEscolhida;

      u.onend = () => {
        if (index + 1 < fila.length) setTimeout(() => falarSequencia(index + 1), perfil.pausaFrase);
      };
      u.onerror = () => {
        if (index + 1 < fila.length) setTimeout(() => falarSequencia(index + 1), perfil.pausaFrase);
      };
      window.speechSynthesis.speak(u);
    };

    falarSequencia(0);
  } catch (e) {}
}

async function calcularSHA256(texto) {
  const str = String(texto || "");
  try {
    if (window.crypto && window.crypto.subtle && window.TextEncoder) {
      const encoder = new TextEncoder();
      const data = encoder.encode(str);
      const hashBuffer = await window.crypto.subtle.digest('SHA-256', data);
      const hashArray = Array.from(new Uint8Array(hashBuffer));
      return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
    }
  } catch (e) {}
  let h1 = 0xdeadbeef, h2 = 0x41c6ce57;
  for (let i = 0; i < str.length; i++) {
    const ch = str.charCodeAt(i);
    h1 = Math.imul(h1 ^ ch, 2654435761);
    h2 = Math.imul(h2 ^ ch, 1597334677);
  }
  h1 = Math.imul(h1 ^ (h1 >>> 16), 2246822507) ^ Math.imul(h2 ^ (h2 >>> 13), 3266489909);
  h2 = Math.imul(h2 ^ (h2 >>> 16), 2246822507) ^ Math.imul(h1 ^ (h1 >>> 13), 3266489909);
  const combinado = (4294967296 * (2097151 & h2) + (h1 >>> 0)).toString(16).padStart(16, '0');
  return combinado.repeat(4).slice(0, 64);
}

// Compartilhamento com LINK UNICO (sem duplicidade)
async function compartilharLinkUnicoOficial(showToast, extraFile = null) {
  const textoLimpo = shareMessageText.trim();
  try {
    if (extraFile && navigator.canShare && navigator.canShare({ files: [extraFile] })) {
      await navigator.share({
        title: 'RARU NEXUS V11.2 PLUS',
        text: textoLimpo,
        files: [extraFile]
      });
      if (showToast) showToast("Compartilhado com link único (sem duplicidade).");
      return;
    }
  } catch (e) {
    if (e && e.name === 'AbortError') return;
  }

  try {
    if (navigator.share) {
      await navigator.share({ text: textoLimpo });
      if (showToast) showToast("Compartilhado com link único (sem duplicidade).");
      return;
    }
  } catch (e) {
    if (e && e.name === 'AbortError') return;
  }

  try {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      await navigator.clipboard.writeText(textoLimpo);
    }
  } catch (e) {}
  if (showToast) showToast("Texto com link único copiado sem duplicidade.");
}

async function gerarArquivoIconeEscudo() {
  return new Promise((resolve) => {
    const canvas = document.createElement('canvas');
    canvas.width = 512;
    canvas.height = 512;
    const ctx = canvas.getContext('2d');

    const bgGrad = ctx.createRadialGradient(256, 256, 30, 256, 256, 320);
    bgGrad.addColorStop(0, '#0A2547');
    bgGrad.addColorStop(0.6, '#041125');
    bgGrad.addColorStop(1, '#02040A');
    ctx.fillStyle = bgGrad;
    ctx.fillRect(0, 0, 512, 512);

    ctx.save();
    ctx.shadowColor = '#00F2FE';
    ctx.shadowBlur = 25;
    ctx.beginPath();
    ctx.moveTo(256, 65);
    ctx.lineTo(410, 130);
    ctx.lineTo(410, 265);
    ctx.quadraticCurveTo(410, 385, 256, 435);
    ctx.quadraticCurveTo(102, 385, 102, 265);
    ctx.lineTo(102, 130);
    ctx.closePath();

    const shieldFill = ctx.createLinearGradient(102, 65, 410, 435);
    shieldFill.addColorStop(0, 'rgba(0, 242, 254, 0.18)');
    shieldFill.addColorStop(1, 'rgba(4, 17, 37, 0.92)');
    ctx.fillStyle = shieldFill;
    ctx.fill();
    ctx.lineWidth = 6;
    ctx.strokeStyle = '#00F2FE';
    ctx.stroke();
    ctx.restore();

    ctx.fillStyle = '#FFFFFF';
    ctx.font = '900 30px Orbitron, sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('RARU NEXUS', 256, 240);

    ctx.fillStyle = '#00FF9D';
    ctx.font = '800 18px JetBrains Mono, monospace';
    ctx.fillText('V11.2 PLUS • RJ', 256, 270);

    ctx.fillStyle = '#38BDF8';
    ctx.font = '700 15px JetBrains Mono, monospace';
    ctx.fillText('CIDADÃO SENSOR • MESQUITA RJ', 256, 480);

    canvas.toBlob((blob) => {
      if (blob) resolve(new File([blob], 'RARU_NEXUS_V11_2_PLUS.png', { type: 'image/png' }));
      else resolve(null);
    }, 'image/png');
  });
}

// Modulo RARU MAPA + Robo SVG acoplado na subaba Telemetria IP
function RaruMapaTelemetria({ municipioSelecionado, onSelecionarMunicipio, showToast, openSarahChat, userName, perfilVozId }) {
  const [camada, setCamada] = useState('vento');
  const [alertaAtivo, setAlertaAtivo] = useState(false);
  const [telemetria, setTelemetria] = useState({
    temp: '--',
    vento: '--',
    chuva: '--',
    condicao: 'Sincronizando...'
  });
  const [roboStatus, setRoboStatus] = useState('BRAYAN RARU + SARAH • PATRULHA ATIVA');
  const [roboMsg, setRoboMsg] = useState(`Nó ${municipioSelecionado.n} (IP ${municipioSelecionado.ip}) acoplado ao endpoint. Monitorando vento, chuva e 9 bacias do RJ.`);
  const mapRef = useRef(null);
  const mapInstance = useRef(null);
  const layersRef = useRef([]);

  useEffect(() => {
    if (!municipioSelecionado?.lat) return;
    fetch(`https://api.open-meteo.com/v1/forecast?latitude=${municipioSelecionado.lat}&longitude=${municipioSelecionado.lon}&current=temperature_2m,precipitation,wind_speed_10m&timezone=America%2FSao_Paulo`)
      .then(r => r.json())
      .then(d => {
        if (d?.current) {
          const tp = d.current.temperature_2m;
          const vn = d.current.wind_speed_10m;
          const ch = d.current.precipitation ?? 0;
          const emAlerta = ch >= 5 || vn >= 40;
          setAlertaAtivo(emAlerta);
          setTelemetria({
            temp: `${tp}°C`,
            vento: `${vn} km/h`,
            chuva: `${ch} mm`,
            condicao: emAlerta ? 'ALERTA ATIVO' : 'ESTÁVEL'
          });
        }
      })
      .catch(() => {});
  }, [municipioSelecionado]);

  useEffect(() => {
    if (!mapRef.current || !window.L) return;
    if (!mapInstance.current) {
      mapInstance.current = L.map(mapRef.current).setView([municipioSelecionado.lat, municipioSelecionado.lon], 9);
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '© OpenStreetMap • RARU MAPA'
      }).addTo(mapInstance.current);
    } else {
      mapInstance.current.setView([municipioSelecionado.lat, municipioSelecionado.lon], 9);
    }

    layersRef.current.forEach(l => {
      try { mapInstance.current.removeLayer(l); } catch (e) {}
    });
    layersRef.current = [];

    MUNICIPIOS_92.forEach(c => {
      const ehFoco = c.n === municipioSelecionado.n;
      const corPonto = camada === 'vento' ? '#00F2FE' : camada === 'chuva' ? '#38BDF8' : '#00FF9D';
      const marker = L.circleMarker([c.lat, c.lon], {
        radius: ehFoco ? 10 : 4.5,
        color: '#FFFFFF',
        weight: ehFoco ? 2 : 1,
        fillColor: ehFoco ? '#00FF9D' : corPonto,
        fillOpacity: 0.9
      }).addTo(mapInstance.current);

      marker.bindPopup(`<b>${c.n}</b><br>IP: ${c.ip}<br>Camada: ${camada.toUpperCase()}`);
      marker.on('click', () => {
        onSelecionarMunicipio(c);
        setRoboStatus(`ALVO TRAVADO • ${c.n.toUpperCase()}`);
        setRoboMsg(`Robô RARU e Sarah travados em ${c.n} (IP ${c.ip}) na camada ${camada.toUpperCase()}.`);
      });
      layersRef.current.push(marker);
    });

    setTimeout(() => {
      try { mapInstance.current && mapInstance.current.invalidateSize(); } catch (e) {}
    }, 180);
  }, [municipioSelecionado, camada]);

  useEffect(() => {
    return () => {
      if (mapInstance.current) {
        try { mapInstance.current.remove(); } catch (e) {}
        mapInstance.current = null;
      }
    };
  }, []);

  const acionarLevantamento = async () => {
    setRoboStatus(`VARRENDO NÓ ${municipioSelecionado.n.toUpperCase()}...`);
    const resumo = `Em ${municipioSelecionado.n}, IP ${municipioSelecionado.ip}: ${telemetria.temp}, vento ${telemetria.vento}, chuva ${telemetria.chuva}.`;
    setRoboMsg(`${resumo} Consultando endpoint...`);
    try {
      const resp = await chamarSarah(
        'telemetria',
        [{ role: 'user', content: `Faça um resumo direto de telemetria para ${municipioSelecionado.n} (IP ${municipioSelecionado.ip}), camada ${camada}: ${resumo}` }],
        municipioSelecionado.n,
        'Telemetria IP',
        'estacao',
        telemetria,
        userName
      );
      setRoboStatus(`SYNC ENDPOINT • ${municipioSelecionado.n.toUpperCase()}`);
      setRoboMsg(resp);
      falarImitada(resp, perfilVozId);
    } catch (e) {
      setRoboStatus(`NÓ ATIVO • ${municipioSelecionado.n.toUpperCase()}`);
      setRoboMsg(resumo);
    }
    if (showToast) showToast(`Telemetria levantada em ${municipioSelecionado.n}.`);
  };

  return (
    <div className="space-y-3 bg-void/90 border border-cyberCyan/40 rounded-2xl p-3.5 shadow-inner">
      <div className="flex flex-wrap items-center justify-between gap-2 border-b border-cyberCyan/25 pb-2.5">
        <div>
          <span className="text-[11px] font-display font-black text-cyberCyan uppercase tracking-wider block">
            RARU MAPA • TELEMETRIA IP (ESTAÇÃO DE SOBREVIVÊNCIA)
          </span>
          <span className="text-[10px] text-slate-400">
            Nó {municipioSelecionado.n} • IP {municipioSelecionado.ip} • {telemetria.temp} • Vento {telemetria.vento} • Chuva {telemetria.chuva}
          </span>
        </div>
        <div className="flex items-center gap-1.5 flex-wrap">
          <button type="button" onClick={acionarLevantamento} className="raru-store-btn ativo">
            <IconRadar size={12} color="#030712" />
            <span>Levantar</span>
          </button>
          <button type="button" onClick={openSarahChat} className="raru-store-btn">
            <IconEstacao size={12} color="#00F2FE" />
            <span>Sarah</span>
          </button>
          <button type="button" onClick={() => compartilharLinkUnicoOficial(showToast)} className="raru-store-btn">
            <IconShare size={12} color="#00F2FE" />
            <span>Link Único</span>
          </button>
        </div>
      </div>

      {/* Robo SVG acoplado ao mapa e a Sarah */}
      <div className="bg-deepSpace/95 border border-cyberCyan/40 rounded-xl p-3 flex flex-col sm:flex-row items-center justify-between gap-3">
        <div className="flex items-center gap-3 w-full sm:w-auto">

function PainelRotasEstacaoPublica() {
  const [rotas, setRotas] = useState([]);

  useEffect(() => {
    const carregarRotas = () => {
      try {
        const r = JSON.parse(localStorage.getItem('rotasFugaReais') || '[]');
        setRotas(r);
      } catch (e) { setRotas([]); }
    };
    carregarRotas();
    window.addEventListener('storage', carregarRotas);
    const interval = setInterval(carregarRotas, 2500);
    return () => {
      window.removeEventListener('storage', carregarRotas);
      clearInterval(interval);
    };
  }, []);

  const etiquetaPorTipo = {
    'Ponto de Encontro': 'PONTO DE ENCONTRO',
    'Casa de Morador': 'CASA DE MORADOR',
    'Igreja': 'IGREJA / APOIO',
    'Escola / CRAS / Clínica': 'ESCOLA / CRAS / CLÍNICA',
    'Ponto Alto Seguro': 'PONTO ALTO SEGURO'

  return (
    <div id="painelRotasEstacao" style={{ background: 'rgba(2, 4, 10, 0.88)', border: '1px solid #00F2FE', borderRadius: '16px', padding: '16px', color: '#fff', boxShadow: '0 0 22px rgba(0, 242, 254, 0.22)', backdropFilter: 'blur(8px)', marginTop: '14px', marginBottom: '16px', fontFamily: 'Segoe UI, sans-serif' }}>
      <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', borderBottom: '1px solid rgba(0, 242, 254, 0.25)', paddingBottom: '10px', marginBottom: '12px' }}>
        <div style={{ display: 'flex', alignItems: 'center', gap: '8px' }}>
          <span style={{ display: 'inline-block', width: '10px', height: '10px', borderRadius: '50%', background: '#00F2FE', boxShadow: '0 0 10px #00F2FE' }}></span>
          <h3 style={{ margin: 0, fontSize: '0.98rem', color: '#00F2FE', letterSpacing: '1px', textTransform: 'uppercase' }}>
            ROTAS DE FUGA E ABRIGOS ATIVOS
          </h3>

        <span id="contadorRotasEstacao" style={{ background: 'rgba(0, 242, 254, 0.12)', color: '#00F2FE', border: '1px solid #00F2FE', padding: '2px 10px', borderRadius: '20px', fontSize: '0.72rem', fontFamily: 'monospace', fontWeight: 700 }}>
          {rotas.length} {rotas.length === 1 ? 'ATIVO' : 'ATIVOS'}
        </span>
      </div>

      <div style={{ fontSize: '0.75rem', color: '#7fc9d8', marginBottom: '12px', fontFamily: 'monospace' }}>

      <div id="listaRotasPublica" style={{ display: 'flex', flexDirection: 'column', gap: '10px' }}>
        {rotas.length === 0 ? (
          <div style={{ background: 'rgba(11, 15, 25, 0.8)', border: '1px dashed rgba(0, 242, 254, 0.35)', borderRadius: '12px', padding: '14px', textAlign: 'center', color: '#7fc9d8', fontSize: '0.82rem' }}>
            Nenhum ponto de apoio ou rota de fuga ativado pela central no momento.
          </div>
        ) : (
          rotas.map((r, i) => (
            <div key={i} style={{ background: 'linear-gradient(135deg, rgba(4, 30, 46, 0.85), rgba(2, 4, 10, 0.95))', border: '1px solid rgba(0, 242, 254, 0.45)', borderLeft: '4px solid #00F2FE', borderRadius: '12px', padding: '12px', boxShadow: '0 4px 12px rgba(0, 0, 0, 0.4)' }}>
              <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: '4px' }}>
                <span style={{ background: 'rgba(212, 175, 55, 0.15)', color: '#D4AF37', border: '1px solid rgba(212, 175, 55, 0.5)', padding: '2px 8px', borderRadius: '6px', fontSize: '0.68rem', fontWeight: 700, letterSpacing: '0.5px', textTransform: 'uppercase' }}>
                  {etiquetaPorTipo[r.tipo] || r.tipo || 'PONTO SEGURO'}
                </span>
                <span style={{ color: '#7ED321', fontSize: '0.68rem', fontFamily: 'monospace', fontWeight: 700 }}>LIBERADO</span>
              </div>
              <div style={{ color: '#ffffff', fontSize: '0.95rem', fontWeight: 700, marginTop: '4px' }}>{r.nome}</div>
              <div style={{ color: '#00F2FE', fontSize: '0.82rem', marginTop: '3px' }}><strong>Endereço:</strong> {r.endereco}</div>
              {r.info && <div style={{ color: '#cfeef5', fontSize: '0.78rem', marginTop: '5px', background: 'rgba(0, 242, 254, 0.06)', padding: '6px 8px', borderRadius: '6px' }}>{r.info}</div>}

        )}

    </div>
  );
}

function CadeAdminModule({ showToast }) {
  const MUNICIPIOS = MUNICIPIOS_92.map(m => m.n);
  const [abaAtiva, setAbaAtiva] = useState('rota');
  const [rotas, setRotas] = useState(() => JSON.parse(localStorage.getItem('rotasFugaReais') || '[]'));
  const [rNome, setRNome] = useState('');
  const [rEnd, setREnd] = useState('');
  const [rInfo, setRInfo] = useState('');
  const [rTipo, setRTipo] = useState('Ponto de Encontro');

  const [monitores, setMonitores] = useState(() => JSON.parse(localStorage.getItem('monitoresCADE') || '[]'));
  const [bloqueados, setBloqueados] = useState(() => JSON.parse(localStorage.getItem('monitoresBloqueadosCADE') || '[]'));
  const [mNome, setMNome] = useState('');
  const [mZap, setMZap] = useState('');
  const [mSenha, setMSenha] = useState('');
  const [mMun, setMMun] = useState('');
  const [mBairro, setMBairro] = useState('');
  const [mFuncao, setMFuncao] = useState('Monitor do Tempo');
  const [mObs, setMObs] = useState('');
  const [filtroMon, setFiltroMon] = useState('');

  const salvarRota = () => {
    if (!rNome.trim() || !rEnd.trim()) { showToast('Escreve o nome e o endereço.'); return; }
    const atualizadas = [...rotas, { nome: rNome.trim(), endereco: rEnd.trim(), info: rInfo.trim(), tipo: rTipo }];
    setRotas(atualizadas);
    try { localStorage.setItem('rotasFugaReais', JSON.stringify(atualizadas)); } catch (e) {}
    setRNome(''); setREnd(''); setRInfo('');
    showToast('Rota salva e publicada na Estação.');
  };

  const excluirRota = (i) => {
    if (!confirm('Excluir essa rota?')) return;
    const atualizadas = [...rotas];
    atualizadas.splice(i, 1);
    setRotas(atualizadas);
    try { localStorage.setItem('rotasFugaReais', JSON.stringify(atualizadas)); } catch (e) {}
  };

  const cadastrarMonitor = () => {
    if (!mNome.trim() || !mMun || !mBairro.trim() || !mSenha.trim()) { showToast('Preencha nome, município, bairro e crie a senha.'); return; }
    let c = parseInt(localStorage.getItem('contadorMonitorCADE') || '0', 10) + 1;
    try { localStorage.setItem('contadorMonitorCADE', String(c)); } catch (e) {}
    const idGerado = 'GADE-M-' + String(c).padStart(3, '0');
    const novoM = { id: idGerado, nome: mNome.trim(), zap: mZap.trim(), senha: mSenha.trim(), municipio: mMun, bairro: mBairro.trim(), funcao: mFuncao, obs: mObs.trim(), data: new Date().toLocaleString('pt-BR') };
    const atualizados = [...monitores, novoM];
    setMonitores(atualizados);
    try { localStorage.setItem('monitoresCADE', JSON.stringify(atualizados)); } catch (e) {}
    setMNome(''); setMZap(''); setMSenha(''); setMBairro(''); setMObs('');
    showToast(`Monitor cadastrado: ${idGerado}`);
  };

  const bloquearMonitor = (idx) => {
    const x = monitores[idx];
    const motivo = prompt(`Excluindo ${x.nome} - ${x.id}\nMotivo? Ex: mau uso`);
    if (motivo === null) return;
    if (!confirm(`CONFIRMAR BLOQUEIO?\n\n${x.id} - ${x.nome}`)) return;
    const l = [...monitores]; l.splice(idx, 1);
    setMonitores(l); try { localStorage.setItem('monitoresCADE', JSON.stringify(l)); } catch (e) {}
    const bb = [...bloqueados, { ...x, motivo: motivo || 'Sem motivo', dataBloqueio: new Date().toLocaleString('pt-BR') }];
    setBloqueados(bb); try { localStorage.setItem('monitoresBloqueadosCADE', JSON.stringify(bb)); } catch (e) {}
    showToast(`Monitor ${x.id} bloqueado.`);
  };

  const desbloquearMonitor = (idx) => {
    const x = bloqueados[idx];
    if (!confirm(`Desbloquear ${x.id} - ${x.nome}?`)) return;
    const bb = [...bloqueados]; bb.splice(idx, 1);
    setBloqueados(bb); try { localStorage.setItem('monitoresBloqueadosCADE', JSON.stringify(bb)); } catch (e) {}
    const l = [...monitores, { id: x.id, nome: x.nome, zap: x.zap, senha: x.senha, municipio: x.municipio, bairro: x.bairro, funcao: x.funcao, obs: x.obs, data: x.data }];
    setMonitores(l); try { localStorage.setItem('monitoresCADE', JSON.stringify(l)); } catch (e) {}
    showToast(`Monitor ${x.id} desbloqueado.`);
  };

  const exportarMonitoresGrupo = () => {
    if (!monitores.length) { showToast('Nenhum monitor ativo.'); return; }
    const msg = `MONITORES GADE - ${monitores.length} ativos\n\n` + monitores.map(x => `${x.id} - ${x.nome} - ${x.funcao}\nLocal: ${x.municipio} - ${x.bairro}\nZap: ${x.zap || ''}`).join('\n\n') + `\n\nProjeto: GADE - Grupo A Chave da Esperança`;
    if (navigator.clipboard) navigator.clipboard.writeText(msg).catch(() => {});
    showToast('Lista copiada sem senha. Abrindo WhatsApp.');
    window.open('https://chat.whatsapp.com/D1wrk9nTBH57Wya2Uv44ZW', '_blank');
  };

  const monitoresFiltrados = monitores.filter(x => (x.id + ' ' + x.nome + ' ' + x.municipio + ' ' + x.bairro).toLowerCase().includes(filtroMon.toLowerCase()));

  return (
    <div id="cadeAdmin" style={{ background: '#021a2a', border: '1px solid #00e5ff', borderRadius: '16px', padding: '14px', fontFamily: 'sans-serif' }}>
      <b style={{ color: '#00e5ff', fontSize: '16px' }}>ÁREA RESTRITA - GADE</b>
      <div style={{ color: '#fff', fontSize: '12px', opacity: .8 }}>GADE - Grupo A Chave da Esperança / Projeto Cidadão Sensor</div>
      <div style={{ display: 'flex', gap: '8px', marginTop: '12px' }}>
        <button type="button" onClick={() => setAbaAtiva('rota')} style={{ flex: 1, background: abaAtiva === 'rota' ? '#00e5ff' : '#041e2e', color: abaAtiva === 'rota' ? '#000' : '#fff', fontWeight: 'bold', border: 'none', padding: '12px', borderRadius: '10px', cursor: 'pointer' }}>ROTAS DE FUGA</button>
        <button type="button" onClick={() => setAbaAtiva('monitor')} style={{ flex: 1, background: abaAtiva === 'monitor' ? '#00ff88' : '#041e2e', color: abaAtiva === 'monitor' ? '#000' : '#fff', fontWeight: 'bold', border: '1px solid #00e5ff', padding: '12px', borderRadius: '10px', cursor: 'pointer' }}>MONITORES</button>
      </div>
      {abaAtiva === 'rota' ? (
        <div id="painelRota">
          <input value={rNome} onChange={e => setRNome(e.target.value)} placeholder="Nome do local" style={{ width: '100%', padding: '12px', marginTop: '12px', borderRadius: '10px', border: 'none', boxSizing: 'border-box', color: '#000' }} />
          <input value={rEnd} onChange={e => setREnd(e.target.value)} placeholder="Endereço completo" style={{ width: '100%', padding: '12px', marginTop: '8px', borderRadius: '10px', border: 'none', boxSizing: 'border-box', color: '#000' }} />
          <input value={rInfo} onChange={e => setRInfo(e.target.value)} placeholder="Informações" style={{ width: '100%', padding: '12px', marginTop: '8px', borderRadius: '10px', border: 'none', boxSizing: 'border-box', color: '#000' }} />
          <select value={rTipo} onChange={e => setRTipo(e.target.value)} style={{ width: '100%', padding: '12px', marginTop: '8px', borderRadius: '10px', color: '#000' }}>
            <option>Ponto de Encontro</option>
            <option>Casa de Morador</option>
            <option>Igreja</option>
            <option>Escola / CRAS / Clínica</option>
            <option>Ponto Alto Seguro</option>
          </select>
          <button type="button" onClick={salvarRota} style={{ width: '100%', background: '#00e5ff', color: '#000', fontWeight: 'bold', border: 'none', padding: '14px', borderRadius: '10px', marginTop: '12px', cursor: 'pointer' }}>SALVAR E PUBLICAR NA ESTAÇÃO</button>
          <div id="listaRotasAdmin" style={{ marginTop: '12px' }}>
            {rotas.length === 0 ? (
              <div style={{ color: '#fff', opacity: .7, fontSize: '13px' }}>Nenhuma rota cadastrada ainda.</div>
            ) : (
              rotas.map((x, i) => (
                <div key={i} style={{ background: '#041e2e', padding: '10px', borderRadius: '10px', marginTop: '8px', color: '#fff', fontSize: '13px' }}>
                  <b>{x.tipo} - {x.nome}</b><br />{x.endereco}<br />{x.info || ''}<br />
                  <button type="button" onClick={() => excluirRota(i)} style={{ background: '#ff3b30', color: '#fff', border: 'none', padding: '6px 10px', borderRadius: '8px', marginTop: '6px', cursor: 'pointer', fontWeight: 'bold' }}>Excluir Rota</button>
                </div>
              ))
            )}
          </div>
        </div>
      ) : (
        <div id="painelMonitor">
          <div style={{ background: '#041e2e', borderRadius: '10px', padding: '10px', marginTop: '12px', color: '#fff', fontSize: '13px' }}>
            Ativos: <b style={{ color: '#00e5ff' }}>{monitores.length}</b> | Municípios: <b style={{ color: '#00ff88' }}>{new Set(monitores.map(x => x.municipio)).size}</b> / 92 | Bloqueados: <b style={{ color: '#ff3b30' }}>{bloqueados.length}</b>
          </div>
          <input value={mNome} onChange={e => setMNome(e.target.value)} placeholder="Nome completo do monitor" style={{ width: '100%', padding: '11px', borderRadius: '10px', border: 'none', boxSizing: 'border-box', marginTop: '10px', color: '#000' }} />
          <input value={mZap} onChange={e => setMZap(e.target.value)} placeholder="WhatsApp" style={{ width: '100%', padding: '11px', borderRadius: '10px', border: 'none', boxSizing: 'border-box', marginTop: '8px', color: '#000' }} />
          <input value={mSenha} onChange={e => setMSenha(e.target.value)} placeholder="Crie a senha dele - ex: rocha123" style={{ width: '100%', padding: '11px', borderRadius: '10px', border: 'none', boxSizing: 'border-box', marginTop: '8px', color: '#000' }} />
          <select value={mMun} onChange={e => setMMun(e.target.value)} style={{ width: '100%', padding: '11px', borderRadius: '10px', marginTop: '8px', color: '#000' }}>
            <option value="">Selecione o município - 92 municípios do RJ</option>
            {MUNICIPIOS.map((m, i) => <option key={i} value={m}>{m}</option>)}
          </select>
          <input value={mBairro} onChange={e => setMBairro(e.target.value)} placeholder="Bairro / Comunidade que vai monitorar" style={{ width: '100%', padding: '11px', borderRadius: '10px', border: 'none', boxSizing: 'border-box', marginTop: '8px', color: '#000' }} />
          <select value={mFuncao} onChange={e => setMFuncao(e.target.value)} style={{ width: '100%', padding: '11px', borderRadius: '10px', marginTop: '8px', color: '#000' }}>
            <option>Monitor do Tempo</option>
            <option>Monitor da Comunidade</option>
            <option>Monitor do Rio / Alagamento</option>
            <option>Monitor de Abrigo / Rota</option>
            <option>Apoio / Divulgação</option>
          </select>
          <input value={mObs} onChange={e => setMObs(e.target.value)} placeholder="Observações" style={{ width: '100%', padding: '11px', borderRadius: '10px', border: 'none', boxSizing: 'border-box', marginTop: '8px', color: '#000' }} />
          <button type="button" onClick={cadastrarMonitor} style={{ width: '100%', background: '#00ff88', color: '#000', fontWeight: 'bold', border: 'none', padding: '14px', borderRadius: '10px', marginTop: '10px', cursor: 'pointer' }}>CADASTRAR MONITOR - GERAR NÚMERO + SENHA</button>
          <div style={{ display: 'flex', gap: '8px', marginTop: '10px' }}>
            <input value={filtroMon} onChange={e => setFiltroMon(e.target.value)} placeholder="Filtrar por número, nome, município..." style={{ flex: 1, padding: '10px', borderRadius: '10px', border: 'none', color: '#000' }} />
            <button type="button" onClick={exportarMonitoresGrupo} style={{ background: '#25D366', border: 'none', padding: '10px 12px', borderRadius: '10px', fontWeight: 'bold', cursor: 'pointer' }}>GRUPO</button>
          </div>
          <div id="listaMonitores" style={{ marginTop: '10px' }}>
            {monitoresFiltrados.length === 0 ? (
              <div style={{ color: '#fff', opacity: .7, fontSize: '13px' }}>Nenhum monitor ativo.</div>
            ) : (
              monitoresFiltrados.map((x) => {
                const idx = monitores.indexOf(x);
                return (
                  <div key={idx} style={{ background: '#041e2e', padding: '10px', borderRadius: '10px', marginTop: '8px', color: '#fff', fontSize: '13px' }}>
                    <b style={{ background: '#00e5ff', color: '#000', padding: '2px 8px', borderRadius: '20px', fontSize: '12px' }}>{x.id}</b> <b>{x.nome}</b> <span style={{ color: '#00e5ff' }}>- {x.funcao}</span><br />
                    Local: {x.municipio} - {x.bairro}<br />
                    Zap: {x.zap || 'sem zap'}<br />
                    Senha: <b style={{ color: '#ffcc00' }}>{x.senha}</b> <span style={{ fontSize: '11px', opacity: .7 }}>(só você vê)</span><br />
                    {x.obs && <span>Obs: {x.obs}<br /></span>}
                    <span style={{ fontSize: '11px', opacity: .7 }}>Cadastrado: {x.data}</span><br />
                    <button type="button" onClick={() => bloquearMonitor(idx)} style={{ background: '#ff3b30', color: '#fff', border: 'none', padding: '6px 10px', borderRadius: '8px', marginTop: '6px', cursor: 'pointer', fontWeight: 'bold' }}>EXCLUIR / BLOQUEAR</button>
                  </div>
                );
              })
            )}
          </div>
          <div style={{ background: '#2a0505', border: '1px solid #ff3b30', borderRadius: '12px', padding: '12px', marginTop: '14px' }}>
            <b style={{ color: '#ff3b30' }}>MONITORES BLOQUEADOS / EXCLUÍDOS</b>

function RadarMeteorologicoModule({ perfilVozId }) {
  const [dados, setDados] = useState({});
  const [status, setStatus] = useState('Conectando Open-Meteo...');
  const [cidadeSel1, setCidadeSel1] = useState('Mesquita');
  const [cidadeSel2, setCidadeSel2] = useState('Duque de Caxias');
  const [modoVisualizacao, setModoVisualizacao] = useState('radar');
  const [iframeKey, setIframeKey] = useState(0);

  const chartTempRef = useRef(null);
  const chartRainRef = useRef(null);

  function corPorChuva(p) {
    if (p >= 70) return '#7C4DFF';
    if (p >= 40) return '#FF0055';
    if (p >= 20) return '#FFB703';
    return '#00FF9D';
  }
  function textoPorChuva(p) {
    if (p >= 70) return 'Muito forte';
    if (p >= 40) return 'Forte';
    if (p >= 20) return 'Moderada';
    return 'Fraca / Estável';
  }

  const desenharGraficoCanvas = (canvasRef, valores, cores, sufixo) => {
    const cv = canvasRef.current;
    if (!cv) return;
    const ctx = cv.getContext('2d');
    const W = cv.width = 340, H = cv.height = 140;
    ctx.clearRect(0, 0, W, H);
    const max = Math.max(...valores, 1);
    const step = W / valores.length;
    const horaAtual = new Date().getHours();

    valores.forEach((v, i) => {
      const h = (v / max) * (H - 35);
      const x = i * step + 4;
      const grad = ctx.createLinearGradient(0, H - h, 0, H);
      grad.addColorStop(0, cores[0]);
      grad.addColorStop(1, cores[1]);
      ctx.fillStyle = grad;
      ctx.fillRect(x, H - h - 20, step - 6, h);
      ctx.fillStyle = '#FFFFFF';
      ctx.font = 'bold 9px monospace';
      ctx.textAlign = 'center';
      ctx.fillText(v + sufixo, x + (step / 2), H - h - 23);

      const horaLabel = `${String((horaAtual + i) % 24).padStart(2, '0')}h`;
      ctx.fillStyle = '#00F2FE';
      ctx.font = '600 8px monospace';
      ctx.fillText(horaLabel, x + (step / 2), H - 6);
    });
  };

  const desenharGraficosHorarios = (hourly) => {
    if (!hourly) return;
    const h = new Date().getHours();
    const temps = [], chuvas = [];
    for (let i = 0; i < 12; i++) {
      const idx = (h + i) % 24;
      temps.push(Math.round(hourly.temperature_2m[idx] || 25));
      chuvas.push(hourly.precipitation_probability[idx] || 0);
    }
    setTimeout(() => {
      desenharGraficoCanvas(chartTempRef, temps, ['#ff5252', '#ffca28'], '°C');
      desenharGraficoCanvas(chartRainRef, chuvas, ['#7c4dff', '#29b6f6'], '%');

function ModuloCidadaoSensorModule({ onGoToDashboard, showToast }) {
  const [petKg, setPetKg] = useState(10);
  const [aluminioKg, setAluminioKg] = useState(3);
  const [ferroKg, setFerroKg] = useState(15);
  const [papelaoKg, setPapelaoKg] = useState(20);
  const [vidroKg, setVidroKg] = useState(5);
  const [oleoL, setOleoL] = useState(4);

  const precoPet = 2.50, precoAluminio = 8.00, precoFerro = 1.20, precoPapelao = 0.70, precoVidro = 0.35, precoOleo = 3.00;
  const [btConectado, setBtConectado] = useState(false);
  const [btStatus, setBtStatus] = useState("Desconectado");

  const totalPet = petKg * precoPet;
  const totalAluminio = aluminioKg * precoAluminio;
  const totalFerro = ferroKg * precoFerro;
  const totalPapelao = papelaoKg * precoPapelao;
  const totalVidro = vidroKg * precoVidro;
  const totalOleo = oleoL * precoOleo;

  const valorTotalReciclagem = totalPet + totalAluminio + totalFerro + totalPapelao + totalVidro + totalOleo;
  const pesoTotalKg = Number(petKg) + Number(aluminioKg) + Number(ferroKg) + Number(papelaoKg) + Number(vidroKg) + Number(oleoL);

  const aguaEconomizadaL = (petKg * 24) + (aluminioKg * 40) + (papelaoKg * 15);
  const co2EvitadoKg = (petKg * 1.5) + (aluminioKg * 9.0) + (ferroKg * 1.8) + (papelaoKg * 0.9);

  const conectarBalancaBT = async () => {

        acceptAllDevices: true,
        optionalServices: ['battery_service', '0000181d-0000-1000-8000-00805f9b34fb']

      setBtConectado(true);
      setBtStatus(`Conectado: ${device.name || 'Balança BT'}`);
      showToast(`Balança pareada: ${device.name || 'OK'}`);

    if (navigator.clipboard) {
      navigator.clipboard.writeText(textoRecibo).catch(() => {});
      showToast(`Recibo ${prot} copiado.`);
    }
    window.open(`https://api.whatsapp.com/send?text=${encodeURIComponent(textoRecibo)}`, '_blank');

  return (
    <div className="space-y-4 max-w-5xl mx-auto font-mono">

              <span className="text-cyberCyan">[BALANÇA]</span> CIDADÃO SENSOR - BALANÇA DIGITAL &amp; ESG
            </h2>
            <p className="text-[9px] font-mono text-cyberCyan font-bold">TECNOLOGIA SOCIAL - ECONOMIA CIRCULAR &amp; DRENAGEM</p>
          </div>
          <button type="button" onClick={onGoToDashboard} className="cyber-button text-[10px] py-2 px-4">PAINEL DE CONTROLE</button>
        </div>

        <div className="bg-void/90 border border-cyberCyan/30 rounded-2xl p-3.5 flex flex-col sm:flex-row items-center justify-between gap-3 shadow-inner">
          <div className="flex items-center gap-2.5">

        setStatusHardware("CONECTADO (ONLINE VIA IP)");
        showToast("Hardware Alquino Sincronizado.");
      }

        setGasLevel(`${gasRand} PPM (Normal)`);
        setHidroLevel(`${hidroRand} m (Estável)`);
        setTempHardware("26.8 C");
        setStatusHardware("SIMULAÇÃO ATIVA (IP LOCAL)");
        showToast("Modo simulação IP ativado.");
      }, 800);
    } finally {
      setIsConnecting(false);
    }
  };

  return (
    <div className="space-y-3.5 w-full font-mono max-w-4xl mx-auto">
      <div className="cyber-card space-y-3.5 border border-cyberCyan/40 shadow-2xl p-4">

  const [clima, setClima] = useState(null);
  const [sha256Hash, setSha256Hash] = useState('');
  const [frenteSelecionada, setFrenteSelecionada] = useState(FRENTES_EQUIPES_TABELA[5]);
  const [alarmeRusso, setAlarmeRusso] = useState(false);
  const [alarmeCemaden, setAlarmeCemaden] = useState(false);
  const [vento, setVento] = useState(0);

  const audioRef = useRef(null);
  const sireneIntervalRef = useRef(null);
  const timeoutSireneRef = useRef(null);
  const videoRef = useRef(null);
  const streamRef = useRef(null);
  const trackRef = useRef(null);

  const RISCOS_RARU = ["R1 - BAIXO / PREVENTIVO", "R2 - MODERADO / ALERTA", "R3 - ALTO / ENXURRADA", "R4 - EVACUAÇÃO PREVENTIVA", "RH - CONVERGÊNCIA SERRAS", "RE - ESTRUTURAL / TALUDE"];
  const [risco, setRisco] = useState(RISCOS_RARU[1]);
  const [protAtual, setProtAtual] = useState(null);

  const vozAtiva = perfilVozId || vozSelecionada;

  useEffect(() => {
    if (userName && !nome) setNome(userName);
  }, [userName]);

  useEffect(() => {
    if (!mun?.lat) return;
    fetch(`https://api.open-meteo.com/v1/forecast?latitude=${mun.lat}&longitude=${mun.lon}&current=temperature_2m,relative_humidity_2m,precipitation,wind_speed_10m,wind_gusts_10m&timezone=auto`)
      .then(r => r.json())
      .then(d => {
        setClima(d.current);
        setVento(d.current?.wind_gusts_10m || d.current?.wind_speed_10m || 0);
      })
      .catch(() => {});
  }, [mun]);

  useEffect(() => {
    return () => {
      pararTodasSirenes();
      if (streamRef.current) streamRef.current.getTracks().forEach(t => t.stop());
    };
  }, []);

  const pararTodasSirenes = () => {
    setAlarmeRusso(false);
    setAlarmeCemaden(false);
    if (sireneIntervalRef.current) clearInterval(sireneIntervalRef.current);
    if (timeoutSireneRef.current) clearTimeout(timeoutSireneRef.current);
    try { audioRef.current?._osc?.stop(); audioRef.current?.close(); } catch (e) {}
    audioRef.current = null;
  };

  const dispararSirene5Minutos = (tipo) => {
    pararTodasSirenes();
    if (tipo === 'russo') setAlarmeRusso(true);
    else setAlarmeCemaden(true);

    showToast(`Sirene ${tipo === 'russo' ? 'Alarme Russo' : 'CEMADEN'} disparada por 5 minutos.`);
    falarSarah(`Acionei o alerta preditivo aqui${userName ? ', ' + userName : ''}. Vamo ficar de olho.`, vozAtiva);

    try {
      if (!audioRef.current) audioRef.current = new (window.AudioContext || window.webkitAudioContext)();
      const ctx = audioRef.current; ctx.resume();
      const osc = ctx.createOscillator(); const gain = ctx.createGain();
      osc.type = tipo === 'russo' ? 'sawtooth' : 'sine';
      osc.frequency.value = tipo === 'russo' ? 450 : 600;
      gain.gain.value = 0.15;
      osc.connect(gain); gain.connect(ctx.destination); osc.start();
      audioRef.current._osc = osc;

      let subindo = true;
      sireneIntervalRef.current = setInterval(() => {
        let f = osc.frequency.value;
        if (subindo) { f += 30; if (f >= 950) subindo = false; }
        else { f -= 30; if (f <= 400) subindo = true; }
        osc.frequency.setTargetAtTime(f, ctx.currentTime, 0.1);
      }, 80);

      timeoutSireneRef.current = setTimeout(() => {
        pararTodasSirenes();
        showToast("Ciclo de 5 minutos da sirene encerrado.");
      }, 300000);
    } catch (e) {}
  };

  const atualizarGPS = () => {
    if (!navigator.geolocation) return;
    navigator.geolocation.getCurrentPosition(p => {
      setGps({ lat: p.coords.latitude, lon: p.coords.longitude, acc: Math.round(p.coords.accuracy) });
      setMun(m => ({ ...m, lat: p.coords.latitude, lon: p.coords.longitude }));
      showToast(`GPS ${Math.round(p.coords.accuracy)}m sincronizado.`);
    }, () => {}, { enableHighAccuracy: true, timeout: 5000 });
  };

  const startCam = async () => {
    try {
      const s = await navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: "environment" } } });
      streamRef.current = s;
      const track = s.getVideoTracks()[0];
      trackRef.current = track;
      const caps = track.getCapabilities ? track.getCapabilities() : {};
      if (caps.zoom) { setHasZoomSupport(true); setMaxZoom(caps.zoom.max || 5); setZoomLevel(caps.zoom.min || 1); }
      setCamOn(true);
      setTimeout(() => { if (videoRef.current) { videoRef.current.srcObject = s; videoRef.current.play().catch(() => {}); } }, 100);
      atualizarGPS();
      falarSarah(`Câmera ligada em ${mun.n}. Tô vendo tudo com você${userName ? ', ' + userName : ''}.`, vozAtiva);
    } catch { showToast('Câmera bloqueada.'); }
  };

  const stopCam = () => { if (streamRef.current) streamRef.current.getTracks().forEach(t => t.stop()); setCamOn(false); };

  const handleZoomChange = (e) => {
    const val = parseFloat(e.target.value);
    setZoomLevel(val);
    if (trackRef.current && trackRef.current.applyConstraints) {
      trackRef.current.applyConstraints({ advanced: [{ zoom: val }] }).catch(() => {});
    }
  };

  const capturarFotoFinal = async () => {
    if (capturandoFoto) return null;
    const v = videoRef.current; if (!v) return null;
    setCapturandoFoto(true);
    try {
      const canvas = document.createElement('canvas');
      canvas.width = 800;
      canvas.height = Math.round(800 * (v.videoHeight / v.videoWidth || 0.75));
      const ctx = canvas.getContext('2d');
      ctx.drawImage(v, 0, 0, canvas.width, canvas.height);

      const dataHoraAtual = new Date().toLocaleString('pt-BR');
      const latStr = (gps.lat || mun.lat).toFixed(5);
      const lonStr = (gps.lon || mun.lon).toFixed(5);
      const agenteStr = (nome || userName || 'Comunitário').slice(0, 22);
      const bairroStr = (bairro || 'Local').slice(0, 18);
      const payloadHash = `${dataHoraAtual}|${latStr},${lonStr}|${agenteStr}|${bairroStr}|${risco}|${frenteSelecionada}|${zoomLevel}x`;
      const hashGerado = await calcularSHA256(payloadHash);
      setSha256Hash(hashGerado);

      ctx.fillStyle = 'rgba(3,7,18,0.92)';
      ctx.fillRect(0, canvas.height - 124, canvas.width, 124);
      ctx.fillStyle = '#00F2FE'; ctx.font = 'bold 11px monospace';
      ctx.fillText(`DATA ${dataHoraAtual} | GPS ${latStr}, ${lonStr}`, 15, canvas.height - 102);
      ctx.fillStyle = '#fff'; ctx.font = 'bold 11px monospace';
      ctx.fillText(`AGENTE ${agenteStr} | LOCALIDADE ${bairroStr} | ZOOM ${zoomLevel}x`, 15, canvas.height - 82);
      ctx.fillStyle = '#FF0055'; ctx.font = 'bold 11px monospace';
      ctx.fillText(`RISCO ${risco}`, 15, canvas.height - 62);
      ctx.fillStyle = '#FFA500'; ctx.font = 'bold 10px monospace';
      ctx.fillText(`FRENTE ${frenteSelecionada.slice(0, 55)}`, 15, canvas.height - 42);
      ctx.fillStyle = '#00F2FE'; ctx.font = 'bold 9px monospace';
      ctx.fillText(`SHA-256 ${hashGerado.slice(0, 32)}...`, 15, canvas.height - 24);
      ctx.fillStyle = '#00FF88'; ctx.font = 'bold 10px monospace';
      ctx.fillText(`RARU NEXUS V11.2 PLUS • CIDADÃO SENSOR - GADE`, 15, canvas.height - 8);

      const base64Final = canvas.toDataURL('image/jpeg', 0.85);
      setFotos([base64Final]);
      showToast(`Foto com zoom, carimbo e SHA-256 gerada.`);
      falarSarah("Boa foto capturada com hash SHA-256. Registro pronto para o laudo.", vozAtiva);
      return base64Final;
    } finally {
      setCapturandoFoto(false);
    }
  };

  const obterHashRegistro = async () => {
    if (sha256Hash) return sha256Hash;
    const baseStr = `${new Date().toISOString()}|${mun.n}|${bairro}|${nome || userName}|${risco}|${frenteSelecionada}|${(gps.lat || mun.lat).toFixed(5)},${(gps.lon || mun.lon).toFixed(5)}`;
    const h = await calcularSHA256(baseStr);
    setSha256Hash(h);
    return h;
  };

  const textoVistoria = (prot, hashVal = '') => {
    const linhaHash = hashVal ? `\nSHA-256: ${hashVal}` : '';
    return `[RARU NEXUS V11.2 PLUS • REGISTRO DE VISTORIA COMUNITÁRIA]\nProtocolo: ${prot || protAtual || 'PROT-RARU'}\nAgente: ${nome || userName || 'Comunitário'}\nLocal: ${mun.n} - ${bairro}\nClassificação: ${risco}\nFrente: ${frenteSelecionada}\nZoom: ${zoomLevel}x${linhaHash}\nGOES-19 | Chuva ${clima?.precipitation || 0}mm | Vento ${vento}km/h\nGPS: ${(gps.lat || mun.lat).toFixed(5)}, ${(gps.lon || mun.lon).toFixed(5)}\nRelatório: ${rel}\nAnexo: 1 foto com carimbo técnico e zoom`;
  };

  const gerarDados = async () => {
    if (!nome) { showToast('Informe o nome do responsável.'); return null; }
    if (!bairro) { showToast('Informe o bairro.'); return null; }
    const seq = Math.floor(Math.random() * 8999 + 1000);
    const sig = mun.n.slice(0, 3).toUpperCase();
    const prot = `PROT-RARU-${sig}-2026-${seq}`;
    const hashVal = await obterHashRegistro();
    setProtAtual(prot);
    return { protocolo: prot, sha256: hashVal };
  };

  const baixarFotoLeve = (base64) => { const a = document.createElement('a'); a.href = base64; a.download = `vistoria-${mun.n}.jpg`; a.click(); };

  const enviarWhatsComum = async () => {
    const dados = await gerarDados(); if (!dados) return;
    const hashVal = await obterHashRegistro();
    const texto = textoVistoria(dados.protocolo, hashVal);
    if (fotos[0] && navigator.canShare) {
      try {
        const blob = await (await fetch(fotos[0])).blob();

    showToast('WhatsApp Comum aberto.');
  };

  const enviarWhatsBusiness = async () => {
    const dados = await gerarDados(); if (!dados) return;
    const hashVal = await obterHashRegistro();
    window.open(`https://wa.me/?text=${encodeURIComponent(textoVistoria(dados.protocolo, hashVal))}`, '_blank');

  };

  const adicionarNoStatusComFoto = async () => {
    if (fotos.length === 0) { showToast('Capture 1 foto primeiro.'); return; }
    const hashVal = await obterHashRegistro();
    const texto = textoVistoria(protAtual, hashVal);
    try {
      const blob = await (await fetch(fotos[0])).blob();
      const file = new File([blob], `vistoria-${mun.n}.jpg`, { type: 'image/jpeg' });
      if (navigator.canShare && navigator.canShare({ files: [file] })) {
        await navigator.share({ title: 'Vistoria Comunitária', text: texto, files: [file] });

  };

  const gerarLaudoComSarahAI = async () => {
    if (!bairro) { showToast('Informe o bairro para a IA redigir o relatório.'); return; }
    setIsAiAnalyzing(true);
    showToast('Sarah AI redigindo relatório técnico...');
    const hashVal = await obterHashRegistro();
    const promptVistoria = `Elabore um Relatório Técnico Preliminar de Vistoria Comunitária e Geotécnica para o município de ${mun.n}, bairro ${bairro}, sob a frente ${frenteSelecionada}. Agente responsável: ${nome || userName}. Classificação de Risco: ${risco}. Hash SHA-256: ${hashVal}. Dados climáticos atuais: precipitação ${clima?.precipitation || 0}mm, vento ${vento}km/h. Relato adicional do agente: ${rel}. Estruture com rigor técnico e inclua recomendações preventivas claras.`;
    try {
      const respostaGroq = await chamarSarah('laudo', [{ role: 'user', content: promptVistoria }], mun.n, bairro, 'vistoria', clima, userName);
      setRel(respostaGroq);
      setIsAiAnalyzing(false);
      showToast('Relatório técnico gerado pela Sarah AI.');
      falarSarah("Laudo técnico redigido com sucesso. Vamo conferir.", vozAtiva);
    } catch (e) {
      setRel(`RELATÓRIO TÉCNICO COMUNITÁRIO - RARU NEXUS V11.2 PLUS\nMunicípio: ${mun.n} | Bairro: ${bairro}\nAgente: ${nome || userName}\nFrente: ${frenteSelecionada}\nClassificação de Risco: ${risco}\nSHA-256: ${hashVal}\nCondições: ${clima?.precipitation || 0}mm precipitação, vento ${vento}km/h.`);
      setIsAiAnalyzing(false);
      showToast('Relatório padrão aplicado.');
    }
  };

  const gerarPDFLeve = async () => {
    const dados = await gerarDados(); if (!dados) return;
    const canvas = document.createElement('canvas');
    canvas.width = 600; canvas.height = 800;
    const ctx = canvas.getContext('2d');
    ctx.fillStyle = '#02040A'; ctx.fillRect(0, 0, 600, 800);
    ctx.fillStyle = '#00F2FE'; ctx.font = 'bold 16px monospace';
    ctx.fillText('RELATÓRIO COMUNITÁRIO - RARU NEXUS V11.2 PLUS', 20, 35);
    ctx.fillStyle = '#fff'; ctx.font = '11px monospace';
    ctx.fillText(`Protocolo: ${dados.protocolo}`, 20, 60);
    ctx.fillText(`Agente/Responsável: ${nome}`, 20, 82);
    ctx.fillText(`Local: ${mun.n} - ${bairro}`, 20, 104);
    ctx.fillText(`Frente: ${frenteSelecionada.slice(0, 50)}`, 20, 126);
    ctx.fillText(`Risco: ${risco}`, 20, 148);
    ctx.fillStyle = '#00F2FE'; ctx.font = '9px monospace';
    ctx.fillText(`SHA-256: ${dados.sha256}`, 20, 170);
    const finalizar = () => {
      const base64PDF = canvas.toDataURL('image/jpeg', 0.70);
      const win = window.open('', '_blank');
      if (win) {
        win.document.write(`<html><head><title>Relatório Comunitário</title><style>body{margin:0;background:#000;display:flex;justify-content:center} img{width:100%;max-width:600px} .btn{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#00F2FE;color:#000;font-weight:900;padding:12px 20px;border-radius:999px;border:0} @media print{.btn{display:none}}</style></head><body><img src="${base64PDF}"><button class="btn" onclick="window.print()">SALVAR RELATÓRIO PDF</button></body></html>`);
      }
      showToast('Relatório PDF gerado.');
    };
    if (fotos[0]) { const img = new Image(); img.onload = () => { ctx.drawImage(img, 20, 430, 280, 180); finalizar(); }; img.src = fotos[0]; }
    else finalizar();
  };

  return (
    <div className="w-full space-y-3.5 font-mono max-w-4xl mx-auto">
      <style>{`.carimbo-css{ background:rgba(3,7,18,0.88); border:1px solid #00F2FE; border-radius:8px; padding:6px 8px; display:flex; flex-direction:column; gap:2px; font-size:8px; color:#00F2FE; line-height:1.4; } .carimbo-css span:nth-child(2){ color:#fff; } .carimbo-css span:nth-child(3){ color:#FF0055; font-weight:900; }`}</style>
      <div className="p-4 rounded-2xl border border-cyberCyan/40 space-y-3 bg-[#030712] shadow-2xl cyber-card relative overflow-hidden">
        <div className="absolute inset-0 cloud-layer-anim"></div>
        <div className="relative z-10 flex justify-between items-center border-b border-cyberCyan/30 pb-2.5">
          <h3 className="text-[11px] text-cyberCyan font-black uppercase tracking-wider">VISTORIA COMUNITÁRIA &amp; SIRENES (5 MIN) • V11.2 PLUS</h3>
          <button type="button" onClick={onBackToDashboard} className="cyber-button-danger text-[10px] py-1 px-3 !min-h-[32px]">FECHAR</button>
        </div>
        <div className="bg-black border border-cyberRose/30 rounded-xl p-2 text-[9px] text-cyberRose font-bold text-center">NÓ-MÃE MESQUITA IP 10.10.21.15 - SISTEMA DE ALERTA POPULAR</div>

        <div className="bg-black border border-orange-500/40 rounded-xl p-3 space-y-2">
          <div className="flex justify-between items-center">
            <b className="text-[10px] text-white">CONTROLE DE SIRENES (DURAÇÃO: 5 MIN)</b>
            <span className="text-[9px] text-cyberCyan font-bold">SHA-256: {sha256Hash ? `${sha256Hash.slice(0, 12)}...` : 'ATIVO'}</span>
          </div>
          <div className="grid grid-cols-2 gap-2">
            <button type="button" onClick={() => alarmeRusso ? pararTodasSirenes() : dispararSirene5Minutos('russo')} className={`cyber-button text-[10px] py-2.5 ${alarmeRusso ? '!bg-red-500 !text-white !border-red-400 animate-pulse' : '!border-red-500/50 !text-red-300'}`}>
              {alarmeRusso ? 'PARAR ALARME RUSSO' : 'DISPARAR ALARME RUSSO (5 MIN)'}
            </button>
            <button type="button" onClick={() => alarmeCemaden ? pararTodasSirenes() : dispararSirene5Minutos('cemaden')} className={`cyber-button text-[10px] py-2.5 ${alarmeCemaden ? '!bg-amber-500 !text-black !border-amber-400 animate-pulse' : '!border-amber-500/50 !text-amber-300'}`}>
              {alarmeCemaden ? 'PARAR SIRENE CEMADEN' : 'DISPARAR SIRENE CEMADEN (5 MIN)'}
            </button>
          </div>
        </div>

        <div className="space-y-1.5 bg-void/90 p-3 rounded-xl border border-cyberCyan/30">
          <label className="text-[9px] text-cyberCyan font-bold uppercase block">Selecionar Frente / Ator Comunitário ou Técnico:</label>
          <select value={frenteSelecionada} onChange={e => setFrenteSelecionada(e.target.value)} className="w-full bg-black text-white border border-cyberCyan/40 rounded-xl p-2.5 text-[10px] font-bold cursor-pointer">
            {FRENTES_EQUIPES_TABELA.map((f, i) => <option key={i} value={f}>{f}</option>)}
          </select>
        </div>

        <select value={mun.n} onChange={e => { const m = MUNICIPIOS_92.find(x => x.n === e.target.value); setMun(m); }} className="w-full bg-black text-cyberCyan border border-cyberCyan/40 rounded-xl p-2.5 text-xs font-bold cursor-pointer">
          {MUNICIPIOS_92.map((m, i) => <option key={i} value={m.n}>{m.n} (IP: {m.ip})</option>)}
        </select>

        <div className="bg-black border border-cyberCyan/30 rounded-xl p-3 space-y-2.5">
          <div className="flex justify-between items-center">
            <span className="text-[10px] text-cyberCyan font-bold uppercase">CÂMERA COM CARIMBO, ZOOM E SHA-256</span>
            {!camOn ?
              <button type="button" onClick={startCam} className="cyber-button text-[10px] py-1.5 px-3">LIGAR CÂMERA</button> :
              <button type="button" onClick={stopCam} className="cyber-button-danger text-[10px] py-1.5 px-3">DESLIGAR</button>
            }
          </div>
          <div className="bg-black rounded-xl overflow-hidden border border-cyberCyan/30 relative" style={{ minHeight: '180px' }}>
            <video ref={videoRef} autoPlay playsInline muted style={{ width: '100%', height: '180px', objectFit: 'cover', display: camOn ? 'block' : 'none' }} />
            {!camOn && <div className="h-[180px] grid place-items-center text-slate-500 text-xs font-bold">Toque em Ligar Câmera para registrar</div>}
            {camOn && (
              <div className="absolute inset-0 pointer-events-none">
                <div className="absolute top-0 left-0 right-0 h-[2px] bg-cyberCyan animate-raru-scan" />
                <div className="absolute bottom-2 left-2 right-2">
                  <div className="carimbo-css">
                    <span>{`GPS ${(gps.lat || mun.lat).toFixed(4)}, ${(gps.lon || mun.lon).toFixed(4)} | ZOOM ${zoomLevel}x`}</span>
                    <span>RISCO {risco}</span>
                    <span>{`SHA-256 ${sha256Hash ? sha256Hash.slice(0, 24) + '...' : 'PRONTO AO CAPTURAR'}`}</span>
                  </div>
                </div>
              </div>
            )}
          </div>

          {camOn && hasZoomSupport && (
            <div className="space-y-1 bg-gray-900 p-2.5 rounded-xl border border-cyberCyan/30">
              <div className="flex justify-between text-[10px] text-cyberCyan font-bold">
                <span>CONTROLE DE ZOOM</span>
                <span>{zoomLevel.toFixed(1)}x / {maxZoom}x</span>
              </div>
              <input type="range" min="1" max={maxZoom} step="0.1" value={zoomLevel} onChange={handleZoomChange} className="w-full accent-cyberCyan cursor-pointer" />
            </div>
          )}

          {camOn && (
            <button type="button" disabled={capturandoFoto} onClick={capturarFotoFinal} className="cyber-button-solid w-full text-xs py-3">
              {capturandoFoto ? "PROCESSANDO FOTO & SHA-256..." : "CAPTURAR FOTO COM ZOOM, CARIMBO E SHA-256"}
            </button>
          )}
          {fotos.length > 0 && (
            <div className="grid grid-cols-1 gap-2 pt-2">
              {fotos.map((img, idx) => (
                <div key={idx} className="relative rounded-lg overflow-hidden border border-cyberCyan/40">
                  <img src={img} alt="Vistoria" className="w-full h-32 object-cover" />
                  <button type="button" onClick={() => setFotos([])} className="absolute top-1 right-1 bg-red-500 text-white w-5 h-5 text-[10px] font-bold flex items-center justify-center rounded-full">X</button>
                  <span className="absolute bottom-1 left-1 bg-black/80 text-[8px] text-green-300 px-2 py-1 rounded">FOTO FINAL + SHA-256 APLICADA</span>
                </div>
              ))}
            </div>
          )}
        </div>

        <div className="space-y-3">
          <input value={nome} onChange={e => setNome(e.target.value)} placeholder="Agente Comunitário / Responsável *" className="w-full bg-black border border-cyberCyan/30 rounded-xl p-2.5 text-xs text-white" />
          <select value={risco} onChange={e => setRisco(e.target.value)} className="w-full bg-black border border-cyberCyan/30 rounded-xl p-2.5 text-xs text-cyberCyan font-bold cursor-pointer">
            {RISCOS_RARU.map((r, i) => <option key={i} value={r}>{r}</option>)}
          </select>
          <input value={bairro} onChange={e => setBairro(e.target.value)} placeholder="Bairro / Comunidade * (Rocha Sobrinho, Comunidade do Sebinho...)" className="w-full bg-black border border-cyberCyan/30 rounded-xl p-2.5 text-xs text-white" />
          <button type="button" onClick={gerarLaudoComSarahAI} disabled={isAiAnalyzing} className="cyber-button-solid w-full text-xs py-3.5">
            {isAiAnalyzing ? "SARAH AI REDIGINDO RELATÓRIO..." : "GERAR RELATÓRIO TÉCNICO COM SARAH AI"}
          </button>
          <textarea value={rel} onChange={e => setRel(e.target.value)} rows="5" placeholder="Relato técnico da inspeção comunitária..." className="w-full bg-black border border-cyberCyan/30 rounded-xl p-3 text-xs text-white resize-none leading-relaxed" />

          <button type="button" onClick={gerarPDFLeve} className="cyber-button w-full text-xs py-3">GERAR RELATÓRIO PDF COMUNITÁRIO</button>
          <div className="grid grid-cols-2 gap-2.5">
            <button type="button" onClick={enviarWhatsComum} className="cyber-button text-xs py-3">WHATSAPP COMUM</button>
            <button type="button" onClick={enviarWhatsBusiness} className="cyber-button text-xs py-3">WHATSAPP BUSINESS</button>
          </div>
          <button type="button" onClick={adicionarNoStatusComFoto} className="cyber-button-solid w-full text-xs py-3">PUBLICAR NO STATUS COM FOTO</button>
        </div>
      </div>
    </div>
  );
}

function AdminVaultModule({ showToast, onClose, localVideos, setLocalVideos, publicVideos, onSelecionarPerfilVoz, perfilVozId, customTickerText, setCustomTickerText }) {
  const [pinInput, setPinInput] = useState("");
  const [isUnlocked, setIsUnlocked] = useState(false);
  const [adminSubTab, setAdminSubTab] = useState('cade');
  const [tickerInput, setTickerInput] = useState(customTickerText);

  const handleUnlock = (e) => {
    e.preventDefault();
    if (pinInput === "303500") { setIsUnlocked(true); showToast("Acesso Restrito Autorizado."); } else { showToast("PIN Incorreto."); }
  };

  const salvarTicker = (e) => {
    e.preventDefault();
    setCustomTickerText(tickerInput);
    try { localStorage.setItem('raru_custom_ticker', tickerInput); } catch (e) {}
    showToast("Faixa marquee atualizada com sucesso.");
  };

  const handleUploadGaleriaDireto = (e) => {
    const file = e.target.files[0];
    if (!file || !file.type.startsWith('video/')) { showToast("Selecione um vídeo válido."); return; }
    if (file.size > 3.5 * 1024 * 1024) {
      const objectUrl = URL.createObjectURL(file);
      const novoItem = { id: Date.now(), title: file.name, url: objectUrl, type: 'local' };
      setLocalVideos(prev => [novoItem, ...prev]);
      showToast("Vídeo grande carregado na sessão (sem salvar no cache local).");
      return;
    }
    const reader = new FileReader();
    reader.onload = (uploadEvent) => {
      const novoItem = { id: Date.now(), title: file.name, url: uploadEvent.target.result, type: 'local' };
      const atualizados = [novoItem, ...localVideos];

function AutomatedObservatoryWidget({ customTickerText }) {
  const [w, setW] = useState({ temp: "--", humidity: "--", rain: "--", status: "Sincronizando...", color: "#00F2FE" });

  useEffect(() => {
    const fetchW = async () => {
      try {
        const res = await fetch('https://api.open-meteo.com/v1/forecast?latitude=-22.7831&longitude=-43.4294&current=temperature_2m,relative_humidity_2m,precipitation&timezone=America/Sao_Paulo');
        const d = await res.json();
        if (d?.current) {
          const { temperature_2m: tp, relative_humidity_2m: hm, precipitation: pr } = d.current;
          setW({ temp: `${tp}°C`, humidity: `${hm}%`, rain: `${pr} mm`, status: pr > 5 ? "ALERTA CHUVAS" : pr > 0.5 ? "CHUVA LEVE" : "CÉU ESTÁVEL", color: pr > 5 ? "#FF0055" : pr > 0.5 ? "#00F2FE" : "#00FF9D" });
        }
      } catch (e) {}
    };
    fetchW();
  }, []);

  const defaultTicker = "RARU NEXUS V11.2 PLUS • REDE COMUNITÁRIA DE MONITORAMENTO CLIMÁTICO • CLIMA & DADOS PÚBLICOS • PERIFERIA VIVA PAC SELEÇÕES CIDADES RESILIENTES PROJETO IGUAÇU PARQUE SARAPUÍ ESPAÇO RARU CIENTISTAS DA CIDADANIA";
  const textoAtivo = customTickerText && customTickerText.trim() ? customTickerText.trim() : defaultTicker;

  useEffect(() => {
    const calcularVelocidadeMarquee = () => {
      if (!marqueeTrackRef.current) return;
      const larguraMetadePx = marqueeTrackRef.current.scrollWidth / 2;

      const duracaoCalculada = Math.max(18, Math.round((larguraMetadePx / pixelsPorSegundo) * 10) / 10);

    const timer = setTimeout(calcularVelocidadeMarquee, 60);

      </div>
      <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(100px, 1fr))', gap: '6px' }} className="px-3 pt-0.5 relative z-10">
        {[{ l: 'TEMP', v: w.temp, c: '#00F2FE' }, { l: 'UMIDADE', v: w.humidity, c: '#38BDF8' }, { l: 'CHUVA', v: w.rain, c: '#00F2FE' }, { l: 'STATUS', v: w.status, c: w.color }].map((x, i) => (
          <div key={i} className="bg-void/90 border border-cyberCyan/30 rounded-xl p-2 text-center shadow-inner">

    document.addEventListener('dragstart', onDragStart, { capture: true });

    return () => {
      document.removeEventListener('contextmenu', onContextMenu, { capture: true });
      document.removeEventListener('selectstart', onSelectStart, { capture: true });
      document.removeEventListener('copy', onCopyOrCut, { capture: true });
      document.removeEventListener('cut', onCopyOrCut, { capture: true });
      document.removeEventListener('dragstart', onDragStart, { capture: true });
    };
  }, []);

  useEffect(() => {
    try {
      const htmlEl = document.documentElement;
      const bodyEl = document.body;
      if (isDayMode) {
        htmlEl.classList.add('raru-day-mode');
        bodyEl.classList.add('raru-day-mode');
      } else {
        htmlEl.classList.remove('raru-day-mode');
        bodyEl.classList.remove('raru-day-mode');
      }
      localStorage.setItem('raru_day_mode', String(isDayMode));
    } catch (e) {}
  }, [isDayMode]);

  useEffect(() => {
    const handleResize = () => {
      const w = window.innerWidth, h = window.innerHeight;
      let t = 'Celular / Mobile';
      if (w >= 1400) t = 'Telão / TV 4K';
      else if (w >= 1024) t = 'Notebook / TV HD';
      else if (w >= 768) t = 'Tablet / Laptop';
      setScreenInfo({ width: w, height: h, type: t });
    };
    handleResize();
    window.addEventListener('resize', handleResize);
    return () => window.removeEventListener('resize', handleResize);
  }, []);

  useEffect(() => {
    const handler = (e) => { e.preventDefault(); setDeferredPrompt(e); };
    window.addEventListener('beforeinstallprompt', handler);
    return () => window.removeEventListener('beforeinstallprompt', handler);
  }, []);

  const toggleWallMode = (forceState = null) => {
    const novoEstado = typeof forceState === 'boolean' ? forceState : !isWallMode;
    setIsWallMode(novoEstado);
    if (novoEstado) {
      document.body.classList.add('hud-wall-mode');
      document.body.classList.add('hud-expanded-mode');
      const wrap = document.getElementById('hudWrap');
      if (wrap) {
        wrap.classList.add('modo-parede');
        wrap.classList.add('ativo');
      }
      showToast('WALL MODE: ON • Tela expandida.');
      try {
        if (!document.fullscreenElement && document.documentElement.requestFullscreen) {
          document.documentElement.requestFullscreen().catch(() => {});
        }
      } catch (e) {}
    } else {
      document.body.classList.remove('hud-wall-mode');
      document.body.classList.remove('hud-expanded-mode');
      const wrap = document.getElementById('hudWrap');
      if (wrap) {
        wrap.classList.remove('modo-parede');
        wrap.classList.remove('ativo');
      }
      showToast('WALL MODE: OFF • Modo normal.');
      try {
        if (document.fullscreenElement && document.exitFullscreen) {
          document.exitFullscreen().catch(() => {});
        }
      } catch (e) {}
    }
  };

  useEffect(() => {
    const handleKeyDown = (e) => {
      if (e.key === 'F11' || (e.shiftKey && e.key && e.key.toUpperCase() === 'W')) {
        e.preventDefault();
        toggleWallMode();
      }
    };
    window.addEventListener('keydown', handleKeyDown);
    return () => window.removeEventListener('keydown', handleKeyDown);
  }, [isWallMode]);

  const handleInstallClick = async () => {
    if (deferredPrompt) {
      deferredPrompt.prompt();
      await deferredPrompt.userChoice;
      setDeferredPrompt(null);
      return;
    }
    setShowInstallHelpModal(true);
  };

  const handleShareApp = async () => {
    const file = await gerarArquivoIconeEscudo();
    await compartilharLinkUnicoOficial(showToast, file);
  };

  const handleVoiceOutput = (texto) => {
    const limpa = limparTextoParaFala(texto);
    if (!limpa || !soundEnabled) return;
    setIsSpeaking(true);
    falarImitada(limpa, perfilVozId || vozSelecionada);
    const duracaoEstimada = Math.max(2000, Math.min(10000, limpa.length * 60));
    setTimeout(() => setIsSpeaking(false), duracaoEstimada);
  };

  const extrairNomeSeInformado = (texto) => {
    const m = texto.match(/(?:meu nome é|me chamo|sou o|sou a|aqui é)\s+([A-Za-zÀ-ÿ]{2,25})/i);
    if (m && m[1]) {
      const nomeCapturado = m[1].charAt(0).toUpperCase() + m[1].slice(1).toLowerCase();
      setUserName(nomeCapturado);
      try { localStorage.setItem("raru_user_name", nomeCapturado); } catch (e) {}
      return nomeCapturado;
    }
    return userName;
  };

  const handleSendDirectCommand = async (userMessage) => {
    if (!userMessage.trim()) return;
    const nomeAtual = extrairNomeSeInformado(userMessage);
    const novaMsgUsuario = { sender: 'user', text: userMessage };
    setSarahMessages(prev => [...prev, novaMsgUsuario]);
    setIsProcessing(true);

    const historicoFormatado = [...sarahMessages, novaMsgUsuario].map(m => ({
      role: m.sender === 'user' ? 'user' : 'assistant',
      content: m.text
    }));

    try {
      const respostaIa = await chamarSarah('conversa', historicoFormatado, 'Mesquita', 'Rocha Sobrinho', activeTab, null, nomeAtual);
      const respostaFinal = limparTextoParaFala(respostaIa);
      setSarahMessages(prev => [...prev, { sender: 'ai', text: respostaFinal }]);
      setIsProcessing(false);
      handleVoiceOutput(respostaFinal);
    } catch (e) {
      const fallback = nomeAtual
        ? `Tô contigo aqui na escuta, ${nomeAtual}. Me diz como tá por aí.`
        : "Tô contigo aqui na escuta. Qual é o seu nome e o que tá rolando por aí?";
      setSarahMessages(prev => [...prev, { sender: 'ai', text: fallback }]);
      setIsProcessing(false);
      handleVoiceOutput(fallback);
    }
  };

  const recognitionRef = useRef(null);
  const toggleListening = () => {
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SR) { showToast("Reconhecimento de voz não suportado neste navegador."); return; }
    if (isListening) {
      try { recognitionRef.current && recognitionRef.current.stop(); } catch (e) {}
      setIsListening(false);
      return;
    }
    const rec = new SR();
    rec.lang = 'pt-BR';
    rec.interimResults = false;
    rec.onstart = () => setIsListening(true);
    rec.onresult = (ev) => {
      const transcript = ev.results?.[0]?.[0]?.transcript || "";
      if (transcript.trim()) {
        setSarahInput('');
        handleSendDirectCommand(transcript.trim());
      }
    };
    rec.onerror = () => setIsListening(false);
    rec.onend = () => setIsListening(false);
    recognitionRef.current = rec;
    try { rec.start(); } catch (e) { setIsListening(false); }
  };

  const handleSelectTab = (tabId) => {
    setActiveTab(tabId);
    window.scrollTo({ top: 0, behavior: 'smooth' });
  };

  return (
    <div id="raruAppShell" className="seu-container-raru" style={{ fontSize: `${fontScale * 100}%` }}>
      {toastMsg && (
        <div className="fixed bottom-4 left-1/2 -translate-x-1/2 z-[150] bg-void/95 border border-cyberCyan text-cyberCyan px-4 py-2 rounded-full text-xs font-mono font-bold shadow-2xl">
          {toastMsg}
        </div>
      )}

      <header className="w-full mb-4 bg-gradient-to-r from-deepSpace via-commandPanel to-deepSpace border border-cyberCyan/50 rounded-2xl p-3 flex items-center justify-between gap-2 shadow-xl flex-wrap">
        <div className="flex items-center gap-2.5 min-w-0">
          <div className="w-9 h-9 rounded-full overflow-hidden border border-cyberCyan shrink-0 bg-void flex items-center justify-center">
            <SarahLiveSVGAvatar isSpeaking={isSpeaking} />
          </div>
          <div className="min-w-0">
            <div className="font-display font-black text-xs sm:text-sm text-white tracking-wider truncate">
              RARU NEXUS V11.2 PLUS
            </div>
            <div className="font-mono text-[9px] text-cyberCyan truncate">
              CIDADÃO SENSOR • GADE • MESQUITA RJ
            </div>
          </div>
        </div>

        <div className="flex items-center gap-1.5 flex-wrap">
          <button type="button" onClick={() => setFontScale(s => Math.max(0.85, Number((s - 0.05).toFixed(2))))} className="raru-store-btn">A-</button>
          <button type="button" onClick={() => setFontScale(s => Math.min(1.3, Number((s + 0.05).toFixed(2))))} className="raru-store-btn">A+</button>
          <button
            type="button"
            onClick={() => {
              const novo = !soundEnabled;
              setSoundEnabled(novo);
              try { localStorage.setItem("raru_sound_enabled", String(novo)); } catch (e) {}
              if (!novo && "speechSynthesis" in window) {
                try { window.speechSynthesis.cancel(); } catch (e) {}
              }
              showToast(novo ? "Voz da Sarah ativada." : "Voz da Sarah silenciada.");
            }}
            className={`raru-store-btn ${soundEnabled ? 'ativo' : ''}`}
          >
            <span>{soundEnabled ? 'VOZ ON' : 'VOZ OFF'}</span>
          </button>
          <button type="button" onClick={() => setIsDayMode(d => !d)} className="raru-store-btn">
            <IconSunMoon size={12} color="#00F2FE" />
            <span>{isDayMode ? 'NOITE' : 'DIA'}</span>
          </button>
        </div>
      </header>

      <nav className="w-full mb-4 bg-void/90 border border-cyberCyan/35 rounded-2xl p-2 flex items-center gap-1.5 overflow-x-auto">
        <button type="button" onClick={() => handleSelectTab('dashboard')} className={`raru-store-btn shrink-0 ${activeTab === 'dashboard' ? 'ativo' : ''}`}>
          <IconDashboard size={12} color={activeTab === 'dashboard' ? '#030712' : '#00F2FE'} />
          <span>Painel</span>
        </button>
        <button type="button" onClick={() => handleSelectTab('radar')} className={`raru-store-btn shrink-0 ${activeTab === 'radar' ? 'ativo' : ''}`}>
          <IconRadar size={12} color={activeTab === 'radar' ? '#030712' : '#00F2FE'} />
          <span>Radar &amp; GOES-19</span>
        </button>
        <button type="button" onClick={() => handleSelectTab('vistoria')} className={`raru-store-btn shrink-0 ${activeTab === 'vistoria' ? 'ativo' : ''}`}>
          <IconVistoria size={12} color={activeTab === 'vistoria' ? '#030712' : '#00F2FE'} />
          <span>Vistoria &amp; Sirenes</span>
        </button>
        <button type="button" onClick={() => handleSelectTab('estacao')} className={`raru-store-btn shrink-0 ${activeTab === 'estacao' ? 'ativo' : ''}`}>
          <IconEstacao size={12} color={activeTab === 'estacao' ? '#030712' : '#00F2FE'} />
          <span>Estação &amp; GADE</span>
        </button>
        <button type="button" onClick={() => handleSelectTab('alquino')} className={`raru-store-btn shrink-0 ${activeTab === 'alquino' ? 'ativo' : ''}`}>
          <IconAlquino size={12} color={activeTab === 'alquino' ? '#030712' : '#00F2FE'} />
          <span>Rede Alquino</span>
        </button>
        <button type="button" onClick={() => handleSelectTab('balanca')} className={`raru-store-btn shrink-0 ${activeTab === 'balanca' ? 'ativo' : ''}`}>
          <IconBalanca size={12} color={activeTab === 'balanca' ? '#030712' : '#00F2FE'} />
          <span>Balança &amp; ESG</span>
        </button>
        <button type="button" onClick={() => handleSelectTab('videos')} className={`raru-store-btn shrink-0 ${activeTab === 'videos' ? 'ativo' : ''}`}>
          <IconVideos size={12} color={activeTab === 'videos' ? '#030712' : '#00F2FE'} />
          <span>Vídeos</span>
        </button>
        <button type="button" onClick={() => handleSelectTab('admin')} className={`raru-store-btn shrink-0 ${activeTab === 'admin' ? 'ativo' : ''}`}>
          <IconAdmin size={12} color={activeTab === 'admin' ? '#030712' : '#00F2FE'} />
          <span>Admin</span>
        </button>
        <button type="button" onClick={handleInstallClick} className="raru-store-btn shrink-0">
          <IconInstalar size={12} color="#00F2FE" />
          <span>Instalar</span>
        </button>
        <button type="button" onClick={handleShareApp} className="raru-store-btn shrink-0 ativo">
          <IconShare size={12} color="#030712" />
          <span>Compartilhar</span>
        </button>
      </nav>

      <main className="w-full flex-1">
        {activeTab === 'dashboard' && (
          <div className="space-y-4">
            <CardIdentidadeVisualRARU
              openSarahChat={() => setIsSarahChatOpen(true)}
              handleWhoAmIClick={() => setIsWhoAmIOpen(true)}
              setActiveTab={handleSelectTab}
              toggleWallMode={toggleWallMode}
              isWallMode={isWallMode}
              screenInfo={screenInfo}
              userName={userName}
              onOpenNameModal={() => setIsNameModalOpen(true)}
            />
            <AutomatedObservatoryWidget customTickerText={customTickerText} />
          </div>
        )}

        {activeTab === 'radar' && <RadarMeteorologicoModule perfilVozId={perfilVozId || vozSelecionada} />}

        {activeTab === 'vistoria' && (
          <VistoriaRARU_NEXUS
            onBackToDashboard={() => handleSelectTab('dashboard')}
            showToast={showToast}
            vozSelecionada={vozSelecionada}
            perfilVozId={perfilVozId}
            userName={userName}
          />
        )}

        {activeTab === 'estacao' && (
          <EstacaoSobrevivenciaModuleV12
            showToast={showToast}
            userName={userName}
            soundEnabled={soundEnabled}
            vozSelecionada={vozSelecionada}
            perfilVozId={perfilVozId}
            openSarahChat={() => setIsSarahChatOpen(true)}
          />
        )}

        {activeTab === 'alquino' && (
          <RedeAlquinoHardwareModule onGoToDashboard={() => handleSelectTab('dashboard')} showToast={showToast} />
        )}

        {activeTab === 'balanca' && (
          <ModuloCidadaoSensorModule onGoToDashboard={() => handleSelectTab('dashboard')} showToast={showToast} />
        )}

        {activeTab === 'videos' && (
          <PublicVideoGalleryModule publicVideos={publicVideos} localVideos={localVideos} onGoToDashboard={() => handleSelectTab('dashboard')} />
        )}

        {activeTab === 'admin' && (
          <AdminVaultModule
            showToast={showToast}
            onClose={() => handleSelectTab('dashboard')}
            localVideos={localVideos}
            setLocalVideos={setLocalVideos}
            publicVideos={publicVideos}
            onSelecionarPerfilVoz={(id) => setPerfilVozId(id)}
            perfilVozId={perfilVozId}
            customTickerText={customTickerText}
            setCustomTickerText={setCustomTickerText}
          />
        )}
      </main>

      <SarahFabButton openSarahChat={() => setIsSarahChatOpen(true)} isSpeaking={isSpeaking} />

      <SarahChatOverlay
        isOpen={isSarahChatOpen}
        onClose={() => setIsSarahChatOpen(false)}
        isSpeaking={isSpeaking}
        isProcessing={isProcessing}
        messages={sarahMessages}
        input={sarahInput}
        setInput={setSarahInput}
        handleSendDirectCommand={handleSendDirectCommand}
        toggleListening={toggleListening}
        isListening={isListening}
        userName={userName}
        onOpenNameModal={() => setIsNameModalOpen(true)}
      />

      <ModalDefinirNomeUsuario
        isOpen={isNameModalOpen}
        onClose={() => setIsNameModalOpen(false)}
        userName={userName}
        setUserName={setUserName}
        showToast={showToast}
      />

      <QuemSomosModal
        isOpen={isWhoAmIOpen}
        onClose={() => setIsWhoAmIOpen(false)}
        userName={userName}
      />

      <ModalAjudaInstalacao
        isOpen={showInstallHelpModal}
        onClose={() => setShowInstallHelpModal(false)}
        showToast={showToast}
      />
    </div>
  );
}

const rootEl = document.getElementById('root');
ReactDOM.createRoot(rootEl).render(<App />);
</script>
</body>
</html>
