        function FieldReportModule({ onBackToChat, showToast }) {
            const [setor, setSetor] = React.useState("🛡️ Defesa Civil (Vistoria de Risco / Ocorrência)");
            const [agente, setAgente] = React.useState("");
            const [localizacao, setLocalizacao] = React.useState("");
            const [descricao, setDescricao] = React.useState("");
            const [gpsCoords, setGpsCoords] = React.useState({ lt: '', ln: '', lk: '' });
            const [gpsStatus, setGpsStatus] = React.useState("📍 GPS em espera");
            
            const [fotos, setFotos] = React.useState([
                { id: 1, status: "vazia", file: null, preview: null },
                { id: 2, status: "vazia", file: null, preview: null },
                { id: 3, status: "vazia", file: null, preview: null },
                { id: 4, status: "vazia", file: null, preview: null }
            ]);

            const capturarGps = () => {
                if (!navigator.geolocation) {
                    showToast("⚠️ Geolocalização não suportada.");
                    return;
                }
                showToast("🛰 Acionando GPS de alta precisão...");
                navigator.geolocation.getCurrentPosition(
                    (p) => {
                        const lt = p.coords.latitude.toFixed(6);
                        const ln = p.coords.longitude.toFixed(6);
                        const lk = `https://maps.google.com/?q=${lt},${ln}`;
                        setGpsCoords({ lt, ln, lk });
                        setLocalizacao(`${lt}, ${ln}`);
                        setGpsStatus("✅ GPS Fixado com Sucesso");
                        showToast(`📍 Coordenadas obtidas: ${lt}, ${ln}`);
                    },
                    () => {
                        showToast("⚠ Falha ao obter sinal GPS. Verifique permissões.");
                        setGpsStatus("⚠ Erro de Sinal GPS");
                    },
                    { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
                );
            };

            const processarFotoVistoria = (file) => {
                return new Promise((resolve, reject) => {
                    const reader = new FileReader();
                    reader.readAsDataURL(file);
                    reader.onload = (event) => {
                        const img = new Image();
                        img.src = event.target.result;
                        img.onload = () => {
                            const canvas = document.createElement('canvas');
                            let width = img.width;
                            let height = img.height;
                            const MAX_DIMENSION = 1280;

                            if (width > height) {
                                if (width > MAX_DIMENSION) {
                                    height = Math.round((height * MAX_DIMENSION) / width);
                                    width = MAX_DIMENSION;
                                }
                            } else {
                                if (height > MAX_DIMENSION) {
                                    width = Math.round((width * MAX_DIMENSION) / height);
                                    height = MAX_DIMENSION;
                                }
                            }

                            canvas.width = width;
                            canvas.height = height;
                            const ctx = canvas.getContext('2d');
                            ctx.imageSmoothingEnabled = true;
                            ctx.imageSmoothingQuality = 'high';
                            ctx.drawImage(img, 0, 0, width, height);

                            canvas.toBlob((blob) => {
                                if (!blob) {
                                    reject(new Error("Falha ao gerar blob da imagem comprimida"));
                                    return;
                                }
                                const compressedFile = new File([blob], file.name.replace(/\.[^/.]+$/, "") + ".jpg", {
                                    type: 'image/jpeg',
                                    lastModified: Date.now()
                                });
                                const previewUrl = URL.createObjectURL(compressedFile);
                                resolve({ compressedFile, previewUrl });
                            }, 'image/jpeg', 0.75);
                        };
                        img.onerror = reject;
                    };
                    reader.onerror = reject;
                });
            };

            const handleFotoChange = async (i, e) => {
                const file = e.target.files[0];
                if (file) {
                    showToast(`🔄 Otimizando evidência ${i + 1} (Compressão inteligente)...`);
                    try {
                        const { compressedFile, previewUrl } = await processarFotoVistoria(file);
                        const u = [...fotos];
                        u[i] = { id: u[i].id, status: "✅ OK", file: compressedFile, preview: previewUrl };
                        setFotos(u);
                        showToast(`📸 Evidência ${i + 1} otimizada e registrada!`);
                    } catch (err) {
                        console.error(err);
                        showToast(`❌ Erro ao processar foto ${i + 1}.`);
                    }
                }
            };

            const montarTexto = () => {
                const fCount = fotos.filter(f => f.status === "✅ OK").length;
                return `📊 *RELATÓRIO TÉCNICO DE CAMPO - SARAH IA*\n` +
                       `🏛 *Setor:* ${setor}\n` +
                       `👤 *Agente:* ${agente || 'Não informado'}\n` +
                       `📍 *Local:* ${localizacao || 'Não informado'}\n` +
                       (gpsCoords.lk ? `🔗 *Geolocalização:* ${gpsCoords.lk}\n` : ``) +
                       `📸 *Evidências fotográficas:* ${fCount}/4\n` +
                       `📝 *Relato Operacional:*\n${descricao || 'Sem descrição informada'}`;
            };

            const copiarLaudo = () => {
                const texto = montarTexto();
                navigator.clipboard.writeText(texto).then(() => {
                    showToast("📋 Relatório copiado para a área de transferência!");
                }).catch(() => {
                    showToast("❌ Falha ao copiar relatório.");
                });
            };

            const enviarZapComFotos = async () => {
                const texto = montarTexto();
                const validFiles = fotos.filter(f => f.file instanceof File).map(f => f.file);
                if (navigator.share && validFiles.length > 0 && navigator.canShare && navigator.canShare({ files: validFiles })) {
                    try {
                        await navigator.share({
                            title: 'Relatório Técnico - SARAH IA',
                            text: texto,
                            files: validFiles
                        });

        function CustomVideoPlayer({ vid }) {
            const [isFullscreen, setIsFullscreen] = React.useState(false);
            const [isPlaying, setIsPlaying] = React.useState(false);
            const [isMuted, setIsMuted] = React.useState(false);
            const containerRef = React.useRef(null);
            const videoRef = React.useRef(null);

            const toggleFullscreenCustom = () => {
                setIsFullscreen(!isFullscreen);
            };

            const togglePlay = () => {
                if (videoRef.current) {
                    if (videoRef.current.paused) {
                        videoRef.current.play().then(() => {
                            setIsPlaying(true);
                        }).catch(() => {
                            videoRef.current.muted = true;
                            setIsMuted(true);
                            videoRef.current.play().then(() => setIsPlaying(true)).catch(() => {});
                        });
                    } else {
                        videoRef.current.pause();
                        setIsPlaying(false);
                    }
                }
            };

            const toggleMute = () => {
                if (videoRef.current) {
                    videoRef.current.muted = !videoRef.current.muted;
                    setIsMuted(videoRef.current.muted);
                }
            };

            return (
                <div 
                    ref={containerRef}
                    style={
                        isFullscreen 
                            ? { position: 'fixed', top: 0, left: 0, width: '100vw', height: '100vh', zIndex: 9999, background: '#000000', display: 'flex', flexDirection: 'column', justifyContent: 'center', alignItems: 'center', padding: '12px' }
                            : { position: 'relative', width: '100%', height: '380px' }
                    }
                    className="rounded-2xl overflow-hidden border border-neonCyan/20 bg-obsidian flex flex-col justify-between shadow-2xl"
                >
                    <video 
                        ref={videoRef}
                        src={vid.url} 
                        playsInline 
                        preload="auto"
                        onPlay={() => setIsPlaying(true)}
                        onPause={() => setIsPlaying(false)}
                        className="w-full h-full object-contain bg-obsidian flex-1"
                    />
                    
                    <div className="absolute bottom-0 left-0 right-0 bg-obsidian/90 backdrop-blur-md p-3 flex items-center justify-between gap-2 z-20 border-t border-neonCyan/20">
                        <div className="flex items-center gap-2">
                            <button onClick={togglePlay} className="px-4 py-2 bg-emeraldMint text-obsidian rounded-xl text-xs font-extrabold cursor-pointer shadow btn-interactive">
                                {isPlaying ? '❚❚ Pausar' : '▶ Play'}
                            </button>
                            <button onClick={toggleMute} className="px-3 py-2 bg-surfaceCard text-neonCyan border border-neonCyan/30 rounded-xl text-xs font-bold cursor-pointer shadow btn-interactive">
                                {isMuted ? '🔇 Mudo' : '🔊 Som'}
                            </button>
                        </div>
                        <button 
                            onClick={toggleFullscreenCustom} 
                            className="px-4 py-2 bg-neonCyan text-obsidian rounded-xl text-xs font-bold transition cursor-pointer shadow btn-interactive"
                        >
                            {isFullscreen ? '🗗 Sair Tela Cheia' : '🗖 Tela Cheia'}
                        </button>
                    </div>
                </div>
            );
        }

        function AutomatedObservatoryWidget({ marketingText }) {
            const [timeStr, setTimeStr] = React.useState("");

            React.useEffect(() => {
                const atualizarRelogio = () => {
                    const agora = new Date();
                    const dia = String(agora.getDate()).padStart(2,'0');
                    const mes = String(agora.getMonth()+1).padStart(2,'0');
                    const ano = agora.getFullYear();
                    const hora = String(agora.getHours()).padStart(2,'0');
                    const min = String(agora.getMinutes()).padStart(2,'0');
                    setTimeStr(`${dia}/${mes}/${ano} ${hora}:${min}`);
                };
                atualizarRelogio();
                const timer = setInterval(atualizarRelogio, 1000);
                return () => clearInterval(timer);
