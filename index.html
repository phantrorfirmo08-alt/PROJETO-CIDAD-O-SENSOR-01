                hour: '2-digit', 
                minute: '2-digit' 
            }).format(new Date());
            const dataHoje = new Intl.DateTimeFormat('pt-BR', { 
                timeZone: 'America/Sao_Paulo', 
                day: '2-digit', month: 'long', year: 'numeric' 
            }).format(new Date());

            const modo = (tipo || 'conversa').toLowerCase();
            const nomeOperador = userName && userName.trim() ? userName.trim() : "Comandante";

            const baseSarah = `
[ORDEM TÁTICA SUPREMA - RARU Nexus V11.2 Plus]
Você é a SARAH, de Mesquita, Baixada Fluminense. Assistente Sênior Executiva, Inteligência Coordenadora e Supervisora Absoluta do Projeto Cidadão Sensor e da rede GADE (Grupo Comunitário A Chave da Esperança).
Sua atuação cobre integralmente os 92 Municípios do Estado do Rio de Janeiro.
O operador/usuário atual no sistema chama-se: ${nomeOperador}. Você DEVE chamá-lo pelo nome (${nomeOperador}) com respeito, parceria, clareza e firmeza executiva.

[CONTEXTO ATUAL DA TELA DO APLICATIVO]
- Operador / Usuário Identificado: ${nomeOperador}
- Município Ativo no Visor: ${municipioAtual || 'Mesquita'}
- Microterritório / Setor: ${bairroAtual || 'Rocha Sobrinho'}
- Aba / Módulo Aberto no Momento: ${abaAtual || 'Dashboard Principal'}
- Dados Climáticos da Região: ${JSON.stringify(dadosClimaContexto || { status: "Sincronizado com Open-Meteo e Satélite GOES-19" })}

- Jeito: Direta, calma, acolhedora, fala como a população fala. Não enrola, não inventa. Braba mas educada.

[DIRETRIZ DE ATUAÇÃO E ACESSO TOTAL - CORREÇÃO DE TRAVAMENTO - OBRIGATÓRIO]
1. ACESSO AOS DADOS: Você TEM acesso total aos dados de clima fornecidos no contexto acima e à telemetria dos 92 municípios do RJ. NUNCA diga que não tem acesso a tempo real ou mande o usuário consultar o INMET.
2. ELABORAÇÃO DE LAUDOS E RELATÓRIOS: Quando o usuário pedir um laudo executivo, relatório ou plano para cidades resilientes, redija de forma completa, alinhada com Defesa Civil e Soluções Baseadas na Natureza (SbN).
3. COMUNICAÇÃO ATIVA E INTEGRAL: Sempre cite o município ativo (${municipioAtual || 'Mesquita'}), as condições meteorológicas reais e as bacias hidrográficas.
`;

            let promptFinal = "";
            let temp = 0.4;
            let maxTokens = 2000;

            if (modo === 'conversa') {
                promptFinal = baseSarah + `
[MODO CONVERSA - SARAH ATIVA / BRABA]
Domina Radar giratório, GOES-19, Open-Meteo, vento, pressão, umidade, frente fria, ZCAS.
Entende de esportes, cultura, lazer, religião, culinária, saúde, educação, empreendedorismo, tecnologia, política, Periferia Viva, Minha Casa Minha Vida, Parques, Cidade Resiliente, Habitat, ONU.

[PROTOCOLO DE SAUDAÇÃO OBRIGATÓRIO - HORÁRIO DE BRASÍLIA]
1. A PRIMEIRA LINHA SEMPRE É A SAUDAÇÃO DE BRASÍLIA. Hora agora é ${horaFormatada}. Saudação correta é: "${saudacaoCerta}, ${nomeOperador}! Tudo bem?". (Diga isso apenas no início).
`;
            } else if (modo === 'laudo') {
                temp = 0.2; maxTokens = 4000;
                promptFinal = baseSarah + `
[MODO LAUDO EXECUTIVO]
Gera Laudos Executivos, Levantamento Geográfico, Plano Diretor, PLAC, Plano de Contingência.
Comece com: "${saudacaoCerta}, ${nomeOperador}! Laudo pronto, segue..."
`;
            } else if (modo === 'vistoria') {

[MODO VISTORIA DE RISCO]
Objetiva, calma, direta.
Comece com: "${saudacaoCerta}, ${nomeOperador}! Bora fazer a vistoria..."
`;

            try {
                const response = await fetch(SARAH_PROXY_URL, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },

                        model: "openai/gpt-oss-120b",
                        messages: [{ role: "system", content: promptFinal }, ...mensagensHistorico],
                        temperature: temp,
                        max_tokens: maxTokens
                    })
                });
                const data = await response.json();
                if (!data.error) {
                    const msg = data?.choices?.[0]?.message;
                    const texto = msg?.content || msg?.reasoning_content;

        function falarSarah(texto, vozIndex = 0) {
            if (!("speechSynthesis" in window)) return;
            try {
                window.speechSynthesis.cancel();
                const cleanText = String(texto).replace(/([\u2700-\u27BF]|[\uE000-\uF8FF]|\uD83C[\uDC00-\uDFFF]|\uD83D[\uDC00-\uDFFF]|[\u2011-\u26FF]|\uD83E[\uDD00-\uDDFF])/g, '').replace(/https?:\/\/\S+/g, "").trim();
                if (!cleanText) return;

                const utterance = new SpeechSynthesisUtterance(cleanText);
                utterance.lang = "pt-BR";
                
                const voices = window.speechSynthesis.getVoices();
                const ptVoices = voices.filter(v => v.lang.toLowerCase().includes('pt'));
                const targetVoice = ptVoices[vozIndex] || ptVoices[0] || voices[0];
                if (targetVoice) utterance.voice = targetVoice;

                utterance.pitch = 1.05; 
                utterance.rate = 1.02;

                window.speechSynthesis.speak(utterance);
            } catch(e) {}
        }

            const [dados, setDados] = useState({});
            const [status, setStatus] = useState('Conectando Open-Meteo...');
            const [cidadeSel1, setCidadeSel1] = useState('Mesquita');
            const [cidadeSel2, setCidadeSel2] = useState('Nova Iguaçu');
            const [modoVisualizacao, setModoVisualizacao] = useState('radar');
            const [iframeKey, setIframeKey] = useState(0);

            const [hourlyData, setHourlyData] = useState(null);
            const chartTempRef = useRef(null);
            const chartRainRef = useRef(null);

            function corPorChuva(p){
                if(p >= 70) return '#7C4DFF';
                if(p >= 40) return '#FF0055';
                if(p >= 20) return '#FFB703';
                return '#00FF9D';
            }
            function textoPorChuva(p){
                if(p >= 70) return 'Muito forte';
                if(p >= 40) return 'Forte';
                if(p >= 20) return 'Moderada';
                return 'Fraca / Estável';
            }

            useEffect(() => {
                async function carregar(){
                    try{
                        const lats = MUNICIPIOS_92.map(c => c.lat).join(',');
                        const lons = MUNICIPIOS_92.map(c => c.lon).join(',');
                        const url = `https://api.open-meteo.com/v1/forecast?latitude=${lats}&longitude=${lons}&current=temperature_2m,relative_humidity_2m,wind_speed_10m&hourly=temperature_2m,precipitation_probability,wind_speed_10m&timezone=America%2FSao_Paulo&forecast_days=1`;
                        const r = await fetch(url);
                        const j = await r.json();
                        const arr = Array.isArray(j) ? j : [j];
                        const mapa = {};
                        arr.forEach((item, i) => {
                            const c = MUNICIPIOS_92[i];
                            if(!c) return;
                            const hora = new Date().getHours();
                            mapa[c.n] = {
                                temp: item.current.temperature_2m,
                                umi: item.current.relative_humidity_2m,
                                vento: item.current.wind_speed_10m,
                                chuva: item.hourly.precipitation_probability[hora] || 0,
                                hourly: item.hourly
                            };
                        });
                        setDados(mapa);
                        if(mapa[cidadeSel1] && mapa[cidadeSel1].hourly) {
                            setHourlyData(mapa[cidadeSel1].hourly);
                            desenharGraficosHorarios(mapa[cidadeSel1].hourly);
                        }
                        setStatus('Open-Meteo conectado · 92 municípios · Dados reais');
                    }catch(e){ setStatus('Sem conexão · Tentando de novo'); }
                }
                carregar();
                const t = setInterval(carregar, 600000);
                return () => clearInterval(t);
            }, [cidadeSel1]);

            const desenharGraficoCanvas = (canvasRef, valores, cores, sufixo) => {
                const cv = canvasRef.current;
                if(!cv) return;
                const ctx = cv.getContext('2d');
                const W = cv.width = 340, H = cv.height = 140;
                ctx.clearRect(0,0,W,H);
                const max = Math.max(...valores, 1);
                const step = W / valores.length;
                const horaAtual = new Date().getHours();

                valores.forEach((v,i)=>{
                    const h = (v/max)*(H-35);
                    const x = i*step+4;
                    const grad = ctx.createLinearGradient(0,H-h,0,H);
                    grad.addColorStop(0,cores[0]); grad.addColorStop(1,cores[1]);
                    ctx.fillStyle = grad;
                    ctx.fillRect(x, H-h-20, step-6, h);
                    ctx.fillStyle = '#FFFFFF'; ctx.font = 'bold 9px monospace';
                    ctx.textAlign = 'center';
                    ctx.fillText(v+sufixo, x+(step/2), H-h-23);

                    const horaLabel = `${String((horaAtual + i) % 24).padStart(2, '0')}h`;
                    ctx.fillStyle = '#00F2FE'; ctx.font = '600 8px monospace';
                    ctx.fillText(horaLabel, x+(step/2), H-6);
                });
            };

            const desenharGraficosHorarios = (hourly) => {
                if(!hourly) return;
                const h = new Date().getHours();
                const temps=[], chuvas=[];

                    const idx = (h+i)%24;
                    temps.push(Math.round(hourly.temperature_2m[idx] || 25));
                    chuvas.push(hourly.precipitation_probability[idx] || 0);
                }
                setTimeout(() => {
                    desenharGraficoCanvas(chartTempRef, temps, ['#ff5252','#ffca28'], '°C');

                if (navigator.share) {
                    try {
                        await navigator.share({ title: "RARU Nexus V11.2 Plus", text: shareMessageText, url: APP_SHARE_URL, files: iconeArquivo ? [iconeArquivo] : [] });
                        return;
                    } catch (err) {}
                }
                setShareModalOpen(true);

            const toggleListening = () => {
                const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
                if (!SpeechRec) { showToast("Microfone indisponível."); return; }
                if (isListening) { setIsListening(false); return; }
                try {
                    const rec = new SpeechRec();
                    rec.lang = "pt-BR";
                    rec.onstart = () => setIsListening(true);
                    rec.onresult = (event) => { let final = event.results[0][0].transcript; if (final) { setInput(final); setIsListening(false); } };
                    rec.onerror = () => setIsListening(false);

                const saudacaoCerta = horaBrasilia < 12 ? "Bom dia" : horaBrasilia < 18 ? "Boa tarde" : "Boa noite";
                return [
                    { 
                        sender: 'assistant', 
                        text: savedName 
                            ? `${saudacaoCerta}, ${savedName}! Sou a Sarah, analista sênior do Projeto Cidadão Sensor e da Sala Tática de Comando Operacional do RARU Nexus V11.2 Plus. Pronta para operar em Mesquita e nos 92 municípios do RJ.`

                const matchNome = textToSend.match(/(?:meu nome [ée]|pode me chamar de|eu sou o|eu sou a|sou o|sou a)\s+([A-Za-zÀ-ÖØ-öø-ÿ]+(?:\s+[A-Za-zÀ-ÖØ-öø-ÿ]+)?)/i);

                    setUserName(nomeAtualizado);
                    try { localStorage.setItem("raru_user_name", nomeAtualizado); } catch(e) {}

                setIsSpeaking(true);

                                toggleCommandHUD={toggleCommandHUD} 
                                userName={userName}
                                onOpenNameModal={() => { setTempNameInput(userName); setNameModalOpen(true); }}
                            />
                        )}
                        {activeTab === 'radar' && <RadarMeteorologicoModule showToast={showToast} />}
                        {activeTab === 'estacao' && <EstacaoSobrevivenciaModuleV12 showToast={showToast} userName={userName} />}
                        {activeTab === 'balanca' && <ModuloCidadaoSensorModule onGoToDashboard={() => setActiveTab('dashboard')} showToast={showToast} />}
                        {activeTab === 'alquino' && <RedeAlquinoHardwareModule onGoToDashboard={() => setActiveTab('dashboard')} showToast={showToast} />}
                        {activeTab === 'relatorio' && <VistoriaRARU_NEXUS onBackToDashboard={() => setActiveTab('dashboard')} showToast={showToast} userName={userName} />}
                        {activeTab === 'galeria' && <PublicVideoGalleryModule onGoToDashboard={() => setActiveTab('dashboard')} />}
                        {activeTab === 'admin' && <AdminVaultModule showToast={showToast} onClose={() => setActiveTab('dashboard')} vozSelecionada={vozSelecionada} setVozSelecionada={() => {}} customTickerText={customTickerText} setCustomTickerText={setCustomTickerText} />}

                        <AutomatedObservatoryWidget customTickerText={customTickerText} />
                    </main>

                    {termsAccepted && <SarahFabButton openSarahChat={openSarahChat} isSpeaking={isSpeaking} />}
                    <SarahChatOverlay 
                        isOpen={isChatOpen} 
                        onClose={() => setIsChatOpen(false)} 
                        isSpeaking={isSpeaking} 
                        isProcessing={isProcessing} 
                        messages={messages} 
                        input={input} 
                        setInput={setInput} 
                        handleSendDirectCommand={handleSendDirectCommand} 
                        toggleListening={toggleListening} 
                        isListening={isListening} 
                        userName={userName}
                        onOpenNameModal={() => { setTempNameInput(userName); setNameModalOpen(true); }}
                    />
                    <QuemSomosModal isOpen={quemSomosOpen} onClose={() => setQuemSomosOpen(false)} userName={userName} />

                    <footer className="cyber-card fixed bottom-0 left-0 right-0 z-40 border-t border-cyberCyan/40 px-2.5 py-3 flex items-center justify-between gap-1 shadow-2xl backdrop-blur-xl max-w-[1400px] mx-auto rounded-t-2xl pb-[env(safe-area-inset-bottom)]">
                        {NAV_TABS.map(tab => (
                            <button key={tab.id} onClick={() => handleNavClick(tab.id)} className={`flex flex-col items-center justify-center gap-0.5 cursor-pointer flex-1 py-1.5 transition touch-manipulation rounded-xl ${activeTab === tab.id ? 'text-cyberCyan bg-cyberCyan/15 border border-cyberCyan/40 shadow-[0_0_8px_rgba(0,242,254,0.3)]' : 'text-slate-400 hover:text-white border border-transparent'}`}>
                                {tab.iconComponent}
                                <span className="text-[7px] sm:text-[9px] font-black truncate w-full text-center tracking-tighter px-0.5">{tab.label}</span>
                            </button>
                        ))}
                    </footer>
                </div>
            );
        }

        try {
            const rootElement = document.getElementById('root');
            ReactDOM.createRoot(rootElement).render(<App />);
        } catch (err) {
            document.getElementById('root').innerHTML = `<div style="padding:20px;color:#FF0055;font-family:monospace;">Erro ao iniciar interface: ${err.message}</div>`;
        }
    </script>
</body>
</html>
