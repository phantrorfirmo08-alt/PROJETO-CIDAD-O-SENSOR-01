<div class="groq-chat-container">

    <div class="groq-chat-header">
      <span>⚡ CHAT GROQ LPU</span>
      <span onclick="toggleGroqChat()" style="cursor:pointer; font-weight:bold; font-size:14px;">✕</span>
    </div>
    <div class="groq-chat-body" id="groqChatBody">
      <div class="g-msg g-msg-ai"><strong>[GROQ AI]:</strong> Monitoramento integral dos 92 municípios do Estado do Rio de Janeiro ativo. Dados meteorológicos e bacias hidrográficas estaduais sincronizados. Como posso ajudar?</div>
    </div>
    <div class="groq-chat-footer">
      <input type="text" id="groqChatInput" placeholder="Digite sua mensagem..." onkeydown="if(event.key==='Enter')sendGroqChatMsg()">
      <button onclick="sendGroqChatMsg()">➤</button>
    </div>
  </div>
  <div class="groq-toggle-btn" onclick="toggleGroqChat()" title="Abrir Chat Groq">
    GROQ
  </div>
</div>

<script>
function toggleGroqChat(){
  const box = document.getElementById('groqChatBox');
  if(box) box.classList.toggle('active');
}
function sendGroqChatMsg(){
  const input = document.getElementById('groqChatInput');
  if(!input || !input.value.trim()) return;
  const texto = input.value;
  const body = document.getElementById('groqChatBody');
  if(!body) return;
  
  const userDiv = document.createElement('div');
  userDiv.className = 'g-msg g-msg-user';
  userDiv.innerHTML = `<strong>[OPERADOR]:</strong> ${texto}`;
  body.appendChild(userDiv);
  input.value = '';
  body.scrollTop = body.scrollHeight;

  setTimeout(()=>{
    const aiDiv = document.createElement('div');
    aiDiv.className = 'g-msg g-msg-ai';
    aiDiv.innerHTML = `<strong>[GROQ AI]:</strong> Processamento LPU ultrarrápido concluído para a malha estadual do Rio de Janeiro. Parâmetros seguros.`;
    body.appendChild(aiDiv);
    body.scrollTop = body.scrollHeight;
  }, 700);
}
</script>

const enviarWorker=async()=>{
if(!relato)return showToast("Digite relato");
setProcessing(true);setIaParecer("Transmitindo para Groq AI • Análise estadual dos 92 municípios do RJ...");
const protocolo=`CORTE-RJ-${mun.n.substring(0,3).toUpperCase()}-2026-${Math.floor(1000+Math.random()*9000)}`;
try{
const r=await fetch(URL_WORKER,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({municipio:mun.n.split('(')[0].trim(),bairro,relato,responsavel:agente,risco,orgaos:[orgao],modo:"LAUDO_ESTADUAL_RJ"})});
const data=await r.json();const parecer=data.engenheiraChefeParecer||data.parecerEngenhariaECerebro||data.orientacaoAssistente||relato;
setIaParecer(parecer);falar("Parecer estadual validado");await gerarPDF(protocolo,parecer);
}catch{setIaParecer("[MODO ESTADUAL AUTÔNOMO] Worker offline. Laudo gerado com sucesso.");await gerarPDF(protocolo,relato);}
finally{setProcessing(false)}
};

const municipiosFiltrados = MUNICIPIOS_92.filter(m => m.n.toLowerCase().includes(filtroMun.toLowerCase()));

if(!auth){
return(
<div className="w-full max-w-[420px] hud-panel p-7 space-y-5 mt-14 mx-auto relative overflow-hidden">
<div className="scan-line"></div>
<div className="text-center space-y-2">
<p className="label-hud">AUTENTICAÇÃO ESTADUAL RJ</p>
<h1 className="title-nexus text-xl">ORION V24.2</h1>
<p className="text-[10px] text-slate-400 tracking-widest">92 MUNICÍPIOS • GROQ AI • MAPA ESRI</p>
</div>
<input type="password" value={senha} onChange={e=>setSenha(e.target.value)} placeholder="sarah2026" className="input-futuristic w-full"/>
<button onClick={()=>{if(senha==='sarah2026')setAuth(true);else showToast('Chave incorreta')}} className="w-full py-3.5 btn-primary rounded-[14px] text-xs tracking-widest">ENTRAR - SISTEMA ESTADUAL</button>
{toast&&<div className="text-xs text-cyan-300 text-center animate-pulse">{toast}</div>}
</div>
);
}

return(
<div className="space-y-4 w-full">
{toast&&<div className="fixed top-4 left-1/2 -translate-x-1/2 z-[9999] bg-cyan-400 text-black px-6 py-2.5 rounded-xl font-black text-xs shadow-[0_0_30px_rgba(0,243,255,0.6)]">{toast}</div>}

{/* HEADER */}
<div className="hud-panel p-4 flex justify-between items-center relative overflow-hidden">
<div className="scan-line"></div>
<div>
<h2 className="title-nexus text-[13px]">ORION V24.2 • 92 MUNICÍPIOS RJ</h2>
<p className="text-[9px] text-slate-400 tracking-widest mt-1">ESTADO DO RIO DE JANEIRO • BACIAS & METEOROLOGIA</p>
</div>
<div className="flex gap-2">
<button onClick={()=>setVozAtiva(!vozAtiva)} className={`text-[9px] px-2.5 py-1.5 rounded-full font-bold border tracking-widest ${vozAtiva?'bg-cyan-400 text-black border-cyan-400':'bg-black text-slate-400 border-white/10'}`}>{vozAtiva?'VOZ ON':'MUDO'}</button>
<button onClick={()=>setAuth(false)} className="bg-red-950/40 border border-red-500/40 text-red-300 px-3 py-1 rounded-full text-[9px] font-bold tracking-widest">SAIR</button>
</div>
</div>

{/* SELETOR DOS 92 MUNICÍPIOS DO RIO DE JANEIRO */}
<div className="hud-panel p-4 space-y-3">
<div className="flex justify-between items-center">
<p className="label-hud">🗺️ SELECIONAR MUNICÍPIO (92 RJ) • FALA VOZ ATIVA</p>
<span className="text-[9px] px-2.5 py-1 rounded-full bg-cyan-950 text-cyan-300 border border-cyan-500/30 font-bold">{mun.n}</span>
</div>
<input type="text" value={filtroMun} onChange={e=>setFiltroMun(e.target.value)} placeholder="🔍 Buscar município do RJ..." className="input-futuristic w-full py-2.5"/>
<div className="max-height:140px overflow-y-auto grid grid-cols-2 gap-2 max-h-[130px] p-1">
{municipiosFiltrados.map((m,i)=>(
<div key={i} onClick={()=>selecionarMunicipioEstadual(m)} className={`p-2.5 rounded-xl border text-[10px] cursor-pointer flex justify-between items-center transition ${mun.n===m.n?'bg-cyan-500/20 border-cyan-400 text-cyan-200 font-bold shadow-[0_0_15px_rgba(0,243,255,0.3)]':'bg-black/50 border-white/10 text-slate-300 hover:border-cyan-400/50'}`}>
<span className="truncate">{m.n}</span>
<span className={`w-2 h-2 rounded-full ${mun.n===m.n?'bg-cyan-400 shadow-[0_0_8px_#00f3ff]':'bg-slate-600'}`}></span>
</div>
))}
</div>
</div>

{/* MAPA OFICIAL SATÉLITE ESRI */}
<div className="hud-panel p-3 space-y-2.5 border border-cyan-400/40">
<div className="flex justify-between items-center">
<p className="label-hud">MAPA SATÉLITE ESRI • {mun.n}</p>
<span className="text-[9px] px-2.5 py-1 rounded-full bg-emerald-950 text-emerald-300 border border-emerald-500/30">GPS ATIVO</span>
</div>
<div ref={mapRef} style={{width:'100%',height:'300px',borderRadius:'14px',border:'1px solid rgba(0,243,255,0.45)'}}></div>
<div className="flex gap-2 items-center bg-black/60 p-2.5 rounded-xl border border-cyan-500/20">
<div className="flex-1 text-[10px] text-slate-300 tracking-wide">📡 GPS: {gps.lat.toFixed(6)}, {gps.lon.toFixed(6)} • {mun.bacia}</div>
<button onClick={capturarGps} className="px-4 py-1.5 bg-cyan-500/20 border border-cyan-400 text-cyan-300 rounded-full text-[10px] font-black tracking-widest">FIXAR GPS</button>
</div>
</div>

{/* PAINEL DE VISTORIA */}
<div className="hud-panel p-5 space-y-4 border border-cyan-400/30 relative overflow-hidden">
<div className="flex justify-between items-center">
<p className="label-hud">PAINEL DE VISTORIA ESTADUAL</p>
<span className="text-[9px] px-3 py-1 rounded-full bg-cyan-950 text-cyan-300 border border-cyan-500/40">V24.2 PRO</span>
</div>

<div className="grid grid-cols-2 gap-3">
<input value={bairro} onChange={e=>setBairro(e.target.value)} className="input-futuristic" placeholder="Bairro - Setor"/>
<input value={agente} onChange={e=>setAgente(e.target.value)} className="input-futuristic" placeholder="Agente Responsável"/>
<input value={cpf} onChange={e=>setCpf(e.target.value)} className="input-futuristic" placeholder="CPF - Identificação"/>
<select value={risco} onChange={e=>setRisco(e.target.value)} className="input-futuristic">{RISCOS.map((r,i)=><option key={i}>{r}</option>)}</select>
</div>

{/* CÂMERA 900PX COM CARIMBO E EXCLUSÃO LIMPA */}
<div className="bg-black/70 border border-white/10 rounded-[16px] p-3.5 space-y-3 relative overflow-hidden">
<div className="scan-line"></div>
<div className="flex justify-between items-center">
<p className="label-hud">📸 CÂMERA TÁTICA 900PX</p>
{!camOn ? <button onClick={startCam} className="text-[10px] btn-primary px-4 py-2 rounded-full tracking-widest">LIGAR CÂMERA</button> : <button onClick={stopCam} className="text-[10px] btn-ghost px-4 py-2 rounded-full">DESLIGAR</button>}
</div>
<div className="bg-[#0a0f1a] rounded-[12px] overflow-hidden border border-white/5 relative" style={{height:'240px'}}>
<video ref={videoRef} autoPlay playsInline muted style={{width:'100%',height:'100%',objectFit:'cover',display:camOn?'block':'none'}}></video>
{!camOn && <div className="h-full grid place-items-center text-[11px] text-slate-500 font-bold tracking-widest">CÂMERA DESLIGADA</div>}
{camOn && <div className="absolute top-3 left-3 bg-red-600 text-white text-[8px] font-black px-2 py-1 rounded-full animate-pulse">● REC • 900PX</div>}
</div>
{camOn && <button onClick={capturarFoto} className="w-full py-3.5 btn-primary rounded-[14px] text-xs tracking-[0.2em]">📸 CAPTURAR FOTO 900PX COM CARIMBO</button>}

{fotos.length>0 && (
<div className="flex gap-2.5 overflow-x-auto pt-1">
<div className="flex gap-2">
{fotos.map((f,i)=>(
<div key={i} className="relative shrink-0 group">
<img src={f} className="w-20 h-20 object-cover rounded-xl border border-cyan-500/40"/>
<div className="x-btn" onClick={()=>setFotos(fotos.filter((_,idx)=>idx!==i))} title="Excluir">✕</div>
<span className="absolute -bottom-1 left-1/2 -translate-x-1/2 bg-cyan-400 text-black text-[7px] font-black px-1.5 py-0.5 rounded-full">{i+1}</span>
</div>
))}
</div>
</div>
)}
</div>

<div className="space-y-2">
<p className="label-hud">RELATO TÉCNICO DE CAMPO</p>
<textarea value={relato} onChange={e=>setRelato(e.target.value)} rows="3" placeholder="Descreva o cenário geotécnico, hidrológico ou estrutural..." className="input-futuristic w-full resize-none"></textarea>
</div>

<div className="grid grid-cols-2 gap-3">
<button onClick={enviarWppFoto} className="py-3.5 bg-[#25D366] text-black font-black rounded-[14px] text-[11px] tracking-widest shadow-[0_0_20px_rgba(37,211,102,0.4)]">📲 WPP FOTO + RELATÓRIO</button>
<button onClick={enviarWorker} disabled={processing} className="py-3.5 btn-primary rounded-[14px] text-[11px] tracking-widest disabled:opacity-50">{processing?'VALIDANDO...':'📄 PDF OFICIAL'}</button>
</div>
</div>

{/* PARECER DA IA */}
<div className="hud-panel p-4 space-y-2.5">
<p className="label-hud">🧠 PARECER GROQ AI • ESTADUAL RJ</p>
<div className="bg-black/70 border border-white/10 rounded-xl p-3.5">
<p className="text-[11px] text-slate-200 leading-relaxed whitespace-pre-wrap">{iaParecer}</p>
</div>
</div>

</div>
);
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
