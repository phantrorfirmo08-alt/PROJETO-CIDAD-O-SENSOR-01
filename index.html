        // Função principal de voz integrada com os 6 perfis de entonação
        function falarSarah(texto) {
            if (!("speechSynthesis" in window)) return;
            try {
                window.speechSynthesis.cancel();
                const perfilAtivo = localStorage.getItem("raru_sarah_voice_profile") || "oficial";
                if (perfilAtivo === 'mudo') return; // Respeita o modo silenciado

                const cleanText = String(texto).replace(/([\u2700-\u27BF]|[\uE000-\uF8FF]|\uD83C[\uDC00-\uDFFF]|\uD83D[\uDC00-\uDFFF]|[\u2011-\u26FF]|\uD83E[\uDD00-\uDDFF])/g, '').replace(/https?:\/\/\S+/g, "").trim();
                if (!cleanText) return;

                const utterance = new SpeechSynthesisUtterance(cleanText);
                utterance.lang = "pt-BR";

                // Modulação por perfil de voz
                if (perfilAtivo === 'humana') {
                    utterance.rate = 1.05; utterance.pitch = 1.25;
                } else if (perfilAtivo === 'operacional') {
                    utterance.rate = 1.15; utterance.pitch = 1.1;
                } else if (perfilAtivo === 'calmo') {
                    utterance.rate = 0.92; utterance.pitch = 0.9;
                } else if (perfilAtivo === 'futurista') {
                    utterance.rate = 1.0; utterance.pitch = 0.6;
                } else {
                    utterance.rate = 1.02; utterance.pitch = 1.05; // Oficial
                }

                const voices = window.speechSynthesis.getVoices();
                const selectedVoice = voices.find(v => v.lang.toLowerCase().includes('pt-br') && v.name.toLowerCase().includes('female')) || voices[0];
                if (selectedVoice) utterance.voice = selectedVoice;
                
                window.speechSynthesis.speak(utterance);
            } catch(e) {}
        }

        // INTEGRAÇÃO COM CLOUDFLARE WORKER E CRIPTOGRAFIA DE ENVELOPE (SARAH ENVELOPE)
        async function enviarParaCloudflareEnvelope(actionType, municipioNome, dadosPayload) {
            const endpointWorker = localStorage.getItem("raru_cloudflare_worker_url") || "https://sarah-nexus-worker.sua-conta.workers.dev/api/sarah/envelope";
            try {
                const res = await fetch(endpointWorker, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        action: actionType || "encrypt",
                        municipio: municipioNome,
                        payload: dadosPayload,
                        timestamp: new Date().toISOString()
                    })
                });
                const responseData = await res.json();
                return responseData;
            } catch(err) {
                return {
                    status: "local_envelope_fallback",
                    wrappedKey: btoa(Math.random().toString()),
                    cipherText: btoa(JSON.stringify(dadosPayload))
                };
            }
        }

            useEffect(() => {
                const timer = setTimeout(() => {
                    if (mapRadarRef.current && window.L) {
                        if (mapRadarInstance.current) {
                            mapRadarInstance.current.remove();
                            mapRadarInstance.current = null;
                        }

                        const m = L.map(mapRadarRef.current).setView([-22.78, -43.43], 8);
                        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { 
                            attribution: '© OpenStreetMap contributors' 
                        }).addTo(m);

                        L.tileLayer('https://tile.openweathermap.org/map/precipitation_new/{z}/{x}/{y}.png?appid=90bf852924158498871032fcf273b4ef', {
                            opacity: 0.55,
                            maxZoom: 18,
                            attribution: 'Precipitation / Nuvens'
                        }).addTo(m);

                        MUNICIPIOS_92.forEach((c, idx) => {
                            let corStatus = '#00FF9D';
                            if (idx % 7 === 0) corStatus = '#FF0055';
                            else if (idx % 5 === 0) corStatus = '#FFB703';
                            else if (idx % 3 === 0) corStatus = '#38BDF8';

                            L.circleMarker([c.lat, c.lon], { 
                                radius: c.n === 'Mesquita' ? 8 : 5, 
                                color: '#ffffff', 
                                fillColor: corStatus, 
                                fillOpacity: 0.95,
                                weight: 1.5
                            }).addTo(m).bindPopup(`<b>${c.n}</b><br>IP: ${c.ip}<br>Status: <span style="color:${corStatus}">Ativo / Monitorado</span>`);
                        });

                        mapRadarInstance.current = m;
                    }
                }, 150);
                return () => clearTimeout(timer);

        function ModuloCidadaoSensorModule({ onGoToDashboard, showToast }) {
            const [petKg, setPetKg] = React.useState(10);
            const [aluminioKg, setAluminioKg] = React.useState(3);
            const [ferroKg, setFerroKg] = React.useState(15);
            const [papelaoKg, setPapelaoKg] = React.useState(20);
            const [vidroKg, setVidroKg] = React.useState(5);
            const [oleoL, setOleoL] = React.useState(4);

            const [precoPet] = React.useState(2.50);
            const [precoAluminio] = React.useState(8.00);
            const [precoFerro] = React.useState(1.20);
            const [precoPapelao] = React.useState(0.70);
            const [precoVidro] = React.useState(0.35);
            const [precoOleo] = React.useState(3.00);

            const [btConectado, setBtConectado] = React.useState(false);
            const [btStatus, setBtStatus] = React.useState("Desconectado");

            const totalPet = petKg * precoPet;
            const totalAluminio = aluminioKg * precoAluminio;
            const totalFerro = ferroKg * precoFerro;
            const totalPapelao = papelaoKg * precoPapelao;
            const totalVidro = vidroKg * precoVidro;
            const totalOleo = oleoL * precoOleo;

            const valorTotalReciclagem = totalPet + totalAluminio + totalFerro + totalPapelao + totalVidro + totalOleo;
            const pesoTotalKg = Number(petKg) + Number(aluminioKg) + Number(ferroKg) + Number(papelaoKg) + Number(vidroKg) + Number(oleoL);

            const aguaEconomizadaL = (petKg * 24) + (aluminioKg * 40) + (papelaoKg * 15);
            const co2EvitadoKg = (petKg * 1.5) + (aluminioKg * 9.0) + (ferroKg * 1.8) + (papelaoKg * 0.9);
            const volumeDesobstruidoM3 = (pesoTotalKg * 0.0035).toFixed(2);

            const conectarBalancaBT = async () => {
                if (!navigator.bluetooth) {
                    if (typeof showToast === 'function') showToast("Web Bluetooth não suportado.");
                    return;
                }
                try {
                    setBtStatus("Buscando balança...");
                    const device = await navigator.bluetooth.requestDevice({
                        acceptAllDevices: true,
                        optionalServices: ['battery_service', '0000181d-0000-1000-8000-00805f9b34fb']
                    });
                    setBtConectado(true);
                    setBtStatus(`Conectado: ${device.name || 'Balança BT'}`);
                    if (typeof showToast === 'function') showToast(`Balança pareada: ${device.name || 'OK'}`);
                } catch(e) {
                    setBtConectado(false);
                    setBtStatus("Desconectado");
                    if (typeof showToast === 'function') showToast("Conexão Bluetooth cancelada.");
                }

                      const chuva = d.current.precipitation;
                      const alerta = chuva >= 5 ? "Alerta de temporal e risco de enxurrada." : chuva > 0 ? "Chuva moderada em andamento." : "Tempo firme na região.";

                      const falaOficial = `Atenção. Município alterado para ${munObj.n}. Bacia hidrográfica: ${munObj.baciaId}. Precipitação atual de ${chuva} milímetros. Situação: ${alerta}`;
                      setSarahState({ isSpeaking: true, speechText: falaOficial });
                      if (soundEnabled) falarSarah(falaOficial);
                      setTimeout(() => setSarahState(prev => ({ ...prev, isSpeaking: false })), 4000);

                      setCloudEnvelopeStatus("Transmitindo Envelope...");
                      await enviarParaCloudflareEnvelope("encrypt", munObj.n, { clima: d.current, ip: munObj.ip });
                      setCloudEnvelopeStatus("Protegido no Cloudflare Edge");
                      if (showToast) showToast(`Monitorando: ${munObj.n} (Nuvem OK)`);
                  }
              } catch(e) {
                  const falaFallback = `Subestação ${munObj.n} ativada. Bacia de referência: ${munObj.baciaId}. Telemetria em prontidão.`;
                  setSarahState({ isSpeaking: true, speechText: falaFallback });
                  if (soundEnabled) falarSarah(falaFallback);
                  setTimeout(() => setSarahState(prev => ({ ...prev, isSpeaking: false })), 4000);
              }
          };

          useEffect(() => {
              trocarEMonitorarMunicipio(MUNICIPIOS_92[0].n);
          }, []);

          useEffect(() => {
              if (estacaoSubTab === 'telemetria') {
                  const timer = setTimeout(() => {
                      if (mapEstacaoRef.current && window.L) {
                          if (mapEstacaoInstance.current) {
                              mapEstacaoInstance.current.remove();
                              mapEstacaoInstance.current = null;
                          }

                          const m = L.map(mapEstacaoRef.current).setView([municipioSelecionado.lat, municipioSelecionado.lon], 9);
                          L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { 
                              attribution: '© OpenStreetMap contributors' 
                          }).addTo(m);
                          
                          L.tileLayer('https://tile.openweathermap.org/map/precipitation_new/{z}/{x}/{y}.png?appid=90bf852924158498871032fcf273b4ef', {
                              opacity: 0.55,
                              maxZoom: 18,
                              attribution: 'Precipitation / Nuvens'
                          }).addTo(m);

                          L.circleMarker([-22.85, -43.55], { radius: 7, color: '#fff', fillColor: '#FF0055', fillOpacity: 1 }).addTo(m).bindPopup('<b>Radar Mendanha - Alerta Rio</b>');
                          L.circleMarker([-22.94, -43.21], { radius: 7, color: '#fff', fillColor: '#FF0055', fillOpacity: 1 }).addTo(m).bindPopup('<b>Radar Sumaré - Alerta Rio</b>');

                          MUNICIPIOS_92.forEach(c => {
                              L.circleMarker([c.lat, c.lon], { 
                                  radius: c.n === municipioSelecionado.n ? 9 : 4, 
                                  color: '#00F2FE', 
                                  fillColor: c.n === municipioSelecionado.n ? '#00FF9D' : '#00F2FE', 
                                  fillOpacity: 0.9 
                              }).addTo(m).bindPopup(`<b>${c.n}</b><br>IP: ${c.ip}`);
                          });
                          
                          mapEstacaoInstance.current = m;
                      }
                  }, 150);
                  return () => clearTimeout(timer);
              }
          }, [estacaoSubTab, municipioSelecionado]);

          const desenharGraficoCanvas = (canvasRef, valores, cores, label) => {
              const cv = canvasRef.current;
              if(!cv) return;
              const ctx = cv.getContext('2d');
              const W = cv.width = 320, H = cv.height = 140;
              ctx.clearRect(0,0,W,H);
              const max = Math.max(...valores, 1);
              const step = W / valores.length;
              valores.forEach((v,i)=>{
                  const h = (v/max)*(H-30);
                  const x = i*step+4;
                  const grad = ctx.createLinearGradient(0,H-h,0,H);
                  grad.addColorStop(0,cores[0]); grad.addColorStop(1,cores[1]);
                  ctx.fillStyle = grad;
                  ctx.fillRect(x, H-h-15, step-6, h);
                  ctx.fillStyle = '#00F2FE'; ctx.font = 'bold 9px monospace';
                  ctx.fillText(v+label, x, H-h-18);
              });
          };

          const desenharGraficosEstacao = (hourly) => {
              const h = new Date().getHours();
              const temps=[], probs=[];
              for(let i=0;i<8;i++){
                  const idx = (h+i)%24;
                  temps.push(Math.round(hourly.temperature_2m[idx] || 25));
                  probs.push(hourly.precipitation_probability[idx] || 0);
              }
              desenharGraficoCanvas(chartTempRef, temps, ['#ff5252','#ffca28'], '°');
              desenharGraficoCanvas(chartRainRef, probs, ['#7c4dff','#29b6f6'], '%');
          };

          const iniciarScanBLE = async () => {
            setIsScanning(true);
            falarSarah("Iniciando varredura Bluetooth para nós P2P próximos.");
            setTimeout(() => {
              setIsScanning(false);
              setPeers([
                { id: "NO-ROCHA-01", name: "Redmi Note 11 (Rocha Sobrinho)", status: "Conectado", rssi: "-58 dBm" },
                { id: "NO-SEBINHO-02", name: "Estação Vila Sebinho", status: "Conectado", rssi: "-64 dBm" }
              ]);
              showToast("2 Nós P2P acoplados com sucesso.");
            }, 1500);
          };

          const adicionarZeladoria = (e) => {
            e.preventDefault();
            if (!acaoZel || !localZel) { showToast("Preencha a ação e o local."); return; }
            const novo = { id: Date.now(), acao: acaoZel, local: localZel, resp: "Alexander", data: new Date().toLocaleDateString('pt-BR'), status: "Registrado" };
            const atualizados = [novo, ...zeladoriaLogs];
            setZeladoriaLogs(atualizados);
            try { localStorage.setItem("raru_zeladoria_logs", JSON.stringify(atualizados)); } catch(e){}
            setAcaoZel(''); setLocalZel('');
            showToast("Atividade salva no Diário de Zeladoria.");
          };

          return (
            <div className="space-y-4 font-mono w-full">
              <div className="cyber-card p-5 flex flex-col md:flex-row items-center gap-5 relative overflow-hidden border border-cyberCyan/60 shadow-2xl">
                <div className="absolute inset-0 cloud-layer-anim"></div>
                <div onClick={() => trocarEMonitorarMunicipio(municipioSelecionado.n)} className="cursor-pointer shrink-0 touch-manipulation z-10">
                  <SarahAnimatedAvatar isSpeaking={sarahState.isSpeaking} />
                </div>
                <div className="flex-1 text-center md:text-left space-y-3 z-10 w-full">
                  <div className="inline-flex items-center gap-2 px-3.5 py-1.5 rounded-full bg-cyberCyan/10 border border-cyberCyan/30 text-cyberCyan text-xs font-bold">
                    <span className="w-2.5 h-2.5 rounded-full bg-cyberCyan animate-ping"></span>
                    ESTAÇÃO DE SOBREVIVÊNCIA • SARAH AI NEXUS
                  </div>
                  <p className="text-xs sm:text-sm text-slate-200 bg-black/70 p-3.5 rounded-xl border border-cyberCyan/20 leading-relaxed font-mono">
                    "{sarahState.speechText}"
                  </p>
                </div>
              </div>

              <div className="cyber-card p-4 border border-cyberCyan/50 space-y-3 shadow-xl">
                <div className="flex justify-between items-center border-b border-cyberCyan/30 pb-2">
                    <span className="text-[10px] font-black text-cyberCyan uppercase tracking-widest">TELEMETRIA • 92 MUNICÍPIOS RJ</span>
                    <span className="text-[9px] text-cyberGreen font-bold animate-pulse">{cloudEnvelopeStatus}</span>
                </div>
                <div className="space-y-1.5">
                    <label className="text-[9px] text-cyberCyan font-bold uppercase block">Selecionar Subestação / Município (Anúncio por Voz):</label>
                    <select value={municipioSelecionado.n} onChange={(e) => trocarEMonitorarMunicipio(e.target.value)} className="w-full bg-void border border-cyberCyan/40 rounded-xl p-3 text-xs text-white font-bold cursor-pointer">
                      {MUNICIPIOS_92.map((m, idx) => <option key={idx} value={m.n}>{m.n} (IP: {m.ip})</option>)}
                    </select>
                </div>
                <div className="grid grid-cols-2 sm:grid-cols-4 gap-2.5 pt-1">
                    <div className="bg-void/90 border border-cyberCyan/30 rounded-xl p-2.5 text-center">
                        <span className="text-[7px] text-slate-400 block">TEMPERATURA</span>
                        <span className="text-xs font-bold text-cyberCyan">{estacaoClima ? `${estacaoClima.temperature_2m}°C` : '--'}</span>
                    </div>
                    <div className="bg-void/90 border border-cyberCyan/30 rounded-xl p-2.5 text-center">
                        <span className="text-[7px] text-slate-400 block">UMIDADE DO AR</span>
                        <span className="text-xs font-bold text-cyberBlue">{estacaoClima ? `${estacaoClima.relative_humidity_2m}%` : '--'}</span>
                    </div>
                    <div className="bg-void/90 border border-cyberCyan/30 rounded-xl p-2.5 text-center">
                        <span className="text-[7px] text-slate-400 block">CHUVA ATUAL</span>
                        <span className="text-xs font-bold text-cyberGreen">{estacaoClima ? `${estacaoClima.precipitation} mm` : '--'}</span>
                    </div>
                    <div className="bg-void/90 border border-cyberCyan/30 rounded-xl p-2.5 text-center">
                        <span className="text-[7px] text-slate-400 block">VENTO</span>
                        <span className="text-xs font-bold text-cyberAmber">{estacaoClima ? `${estacaoClima.wind_speed_10m} km/h` : '--'}</span>
                    </div>
                </div>
              </div>

              <div className="cyber-card p-4 border border-cyberCyan/50 space-y-4 shadow-2xl">
                <div className="flex justify-between items-center border-b border-cyberCyan/30 pb-3 overflow-x-auto gap-2">
                  <div className="flex gap-2 flex-wrap">
                    <button onClick={() => setEstacaoSubTab('telemetria')} className={`cyber-button text-xs py-2 px-3.5 ${estacaoSubTab === 'telemetria' ? '!bg-cyberCyan !text-void' : ''}`}>TELEMETRIA IP</button>
                    <button onClick={() => setEstacaoSubTab('bacias')} className={`cyber-button text-xs py-2 px-3.5 ${estacaoSubTab === 'bacias' ? '!bg-blue-600 !text-white !border-blue-400' : '!border-blue-500/40 !text-blue-300'}`}>BACIAS RJ</button>
                    <button onClick={() => setEstacaoSubTab('graficos')} className={`cyber-button text-xs py-2 px-3.5 ${estacaoSubTab === 'graficos' ? '!bg-emerald-600 !text-white !border-emerald-400' : '!border-emerald-500/40 !text-emerald-300'}`}>GRÁFICOS</button>
                    <button onClick={() => setEstacaoSubTab('mesh')} className={`cyber-button text-xs py-2 px-3.5 ${estacaoSubTab === 'mesh' ? '!bg-purple-600 !text-white !border-purple-400' : '!border-purple-500/40 !text-purple-300'}`}>P2P MESH</button>
                    <button onClick={() => setEstacaoSubTab('zeladoria')} className={`cyber-button text-xs py-2 px-3.5 ${estacaoSubTab === 'zeladoria' ? '!bg-amber-500 !text-black !border-amber-400' : '!border-amber-500/40 !text-amber-300'}`}>ZELADORIA</button>
                  </div>
                </div>

                {estacaoSubTab === 'telemetria' && (
                  <div className="space-y-3">
                    <div className="bg-void/90 p-4 rounded-xl border border-cyberCyan/30 space-y-1">
                      <span className="text-cyberCyan font-bold block text-xs">NÓ IP ATIVO • MUNICÍPIO: {municipioSelecionado.n}</span>
                      <p className="text-white font-mono text-xs">IP: {municipioSelecionado.ip} | Bacia: {municipioSelecionado.baciaId}</p>
                    </div>
                    <div className="relative w-full h-[260px] rounded-xl overflow-hidden border border-cyberCyan/40">
                        <div ref={mapEstacaoRef} className="w-full h-full"></div>
                        <div className="absolute inset-0 cloud-layer-anim pointer-events-none z-[400]" style={{ opacity: 0.35 }}></div>
                    </div>
                  </div>
                )}

                {estacaoSubTab === 'bacias' && (
                  <div className="space-y-3">
                    <div className="flex items-center justify-between border-b border-cyberCyan/30 pb-2">
                        <b className="text-cyberCyan text-xs uppercase tracking-wider">PILARES DA BACIA HIDROGRÁFICA (RJ)</b>
                        <span className="text-[9px] text-emerald-400 font-bold">MONITORAMENTO REGIONAL</span>
                    </div>
                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                        {baciasHidrograficasRJ.map((b, i) => (
                          <div key={i} className="bg-void/90 p-3.5 rounded-xl border space-y-2 shadow-inner" style={{ borderColor: `${b.cor}66` }}>
                            <div className="flex justify-between items-center">
                              <span className="font-bold text-white text-xs">{b.rh} - {b.nome}</span>
                              <span className="text-[9px] px-2 py-0.5 rounded-full font-black uppercase" style={{backgroundColor: `${b.cor}25`, color: b.cor, border: `1px solid ${b.cor}`}}>{b.alerta}</span>
                            </div>
                            <div className="text-[9px] text-slate-300 font-mono">{b.obs}</div>
                            <div className="flex justify-between items-center text-[10px] font-mono pt-1 border-t border-cyberCyan/20">
                                <span className="text-cyberCyan">Nível: <strong>{b.nivel}%</strong></span>
                                <span className="text-cyberGreen">Chuva: <strong>{b.chuva}%</strong></span>
                            </div>
                          </div>
                        ))}
                    </div>
                  </div>
                )}

                {estacaoSubTab === 'graficos' && (
                  <div className="space-y-4">
                    <div className="bg-void/90 p-3.5 rounded-xl border border-emerald-500/30 space-y-2">
                      <span className="text-xs font-black text-emerald-300 block">EVOLUÇÃO TÉRMICA PRÓXIMAS 8H ({municipioSelecionado.n})</span>
                      <canvas ref={chartTempRef} className="w-full h-[140px] bg-void rounded-lg"></canvas>
                    </div>
                    <div className="bg-void/90 p-3.5 rounded-xl border border-emerald-500/30 space-y-2">
                      <span className="text-xs font-black text-cyberCyan block">PROBABILIDADE DE PRECIPITAÇÃO (%)</span>
                      <canvas ref={chartRainRef} className="w-full h-[140px] bg-void rounded-lg"></canvas>
                    </div>
                  </div>
                )}

                {estacaoSubTab === 'mesh' && (
                  <div className="space-y-3">
                    <button onClick={iniciarScanBLE} disabled={isScanning} className="cyber-button w-full py-3 text-xs uppercase !bg-purple-600 !text-white !border-purple-400">
                      {isScanning ? "PROCURANDO NÓS MESH..." : "ESCANEAR BLUETOOTH PRÓXIMO"}
                    </button>
                    <div className="space-y-2">
                      {peers.map((p, i) => (
                        <div key={i} className="flex justify-between items-center bg-deepSpace p-2.5 rounded-xl border border-purple-500/30 text-xs">
                          <span className="font-bold text-white">{p.name}</span>
                          <span className="text-[9px] bg-emerald-500/20 text-emerald-300 px-2 py-0.5 rounded-full font-bold">{p.status}</span>
                        </div>
                      ))}
                    </div>
                  </div>
                )}

                {estacaoSubTab === 'zeladoria' && (
                  <div className="space-y-3">
                    <form onSubmit={adicionarZeladoria} className="bg-void/90 p-3 rounded-xl border border-amber-500/30 space-y-2.5">
                      <b className="text-amber-300 text-xs block">NOVO REGISTRO DE ZELADORIA (GADE)</b>
                      <input type="text" value={acaoZel} onChange={e=>setAcaoZel(e.target.value)} placeholder="Ação (ex: Limpeza de bueiro)..." className="w-full bg-deepSpace border border-amber-500/30 rounded-xl p-2.5 text-xs text-white" />
                      <input type="text" value={localZel} onChange={e=>setLocalZel(e.target.value)} placeholder="Local / Rua (ex: Vila Sebinho)..." className="w-full bg-deepSpace border border-amber-500/30 rounded-xl p-2.5 text-xs text-white" />
                      <button type="submit" className="cyber-button w-full py-2.5 text-xs uppercase !bg-amber-500 !text-black !border-amber-400">SALVAR ATIVIDADE</button>
                    </form>
                    <div className="space-y-2 max-h-40 overflow-y-auto">
                      {zeladoriaLogs.map(log => (
                        <div key={log.id} className="bg-void p-2.5 rounded-xl border border-amber-500/30 flex justify-between items-center text-xs">
                          <div>
                            <span className="font-bold text-white block">{log.acao}</span>
                            <span className="text-[9px] text-slate-400">{log.local} - {log.resp}</span>
                          </div>
                          <span className="text-[9px] text-amber-300 font-bold">{log.data}</span>
                        </div>
                      ))}
                    </div>
                  </div>
                )}
              </div>
            </div>
          );
        }

        function AdminAreaRestritaModule({ showToast, onClose }) {
            const [pin, setPin] = useState("");
            const [unlocked, setUnlocked] = useState(false);
            const [workerUrlInput, setWorkerUrlInput] = useState(() => localStorage.getItem("raru_cloudflare_worker_url") || "");

            const salvarWorkerUrl = (e) => {
                e.preventDefault();
                localStorage.setItem("raru_cloudflare_worker_url", workerUrlInput);
                showToast("URL do Worker / Endpoint Cloudflare Salva!");
            };

            return (
                <div className="cyber-card p-4 space-y-4 border border-cyberCyan/50 font-mono">
                    <div className="flex justify-between items-center border-b border-cyberCyan/30 pb-2">
                        <h3 className="text-xs font-black text-cyberCyan uppercase">ÁREA RESTRITA • CHAVE DE ENVELOPE DA SARAH &amp; WORKERS</h3>
                        <button onClick={onClose} className="cyber-button-danger text-[9px] py-1 px-3">FECHAR</button>
                    </div>

                    {!unlocked ? (
                        <form onSubmit={(e) => { e.preventDefault(); if(pin==="303500"){ setUnlocked(true); showToast("Desbloqueado."); } else showToast("PIN Incorreto."); }} className="flex gap-2">
                            <input type="password" placeholder="PIN (303500)" value={pin} onChange={e=>setPin(e.target.value)} className="flex-1 bg-void border border-cyberCyan/40 rounded-xl p-2.5 text-xs text-white text-center" />
                            <button type="submit" className="cyber-button text-xs py-2 px-4">ENTRAR</button>
                        </form>
                    ) : (
                        <div className="space-y-4">
                            <form onSubmit={salvarWorkerUrl} className="space-y-2 bg-void/90 p-3 rounded-xl border border-cyberCyan/30">
                                <label className="text-[9px] text-cyberCyan font-bold uppercase block">ENDPOINT DO CLOUDFLARE WORKER (ENVELOPE ENCRYPTION):</label>
                                <input type="text" value={workerUrlInput} onChange={e=>setWorkerUrlInput(e.target.value)} placeholder="https://sarah-worker.sua-conta.workers.dev/api/sarah/envelope" className="w-full bg-deepSpace border border-cyberCyan/40 rounded-xl p-2.5 text-xs text-white" />
                                <button type="submit" className="cyber-button-solid w-full text-xs py-2.5">SALVAR CONFIGURAÇÃO DE NUVEM</button>
                            </form>
                        </div>
                    )}
                </div>
            );
        }

        function App() {
            const [activeTab, setActiveTab] = useState("estacao");
            const [toast, setToast] = useState(null);

            const showToast = (msg) => { setToast(msg); setTimeout(() => setToast(null), 3000); };

            const NAV_TABS = [
                { id: 'estacao', iconComponent: <IconEstacao className="w-4 h-4" />, label: 'Estação' },
                { id: 'radar', iconComponent: <IconRadar className="w-4 h-4" />, label: 'Radar' },
                { id: 'balanca', iconComponent: <IconBalanca className="w-4 h-4" />, label: 'Balança' },
                { id: 'admin', iconComponent: <IconAdmin className="w-4 h-4" />, label: 'Nuvem' }
            ];

            return (
                <div className="seu-container-raru">
                    {toast && <div className="fixed top-4 left-1/2 -translate-x-1/2 z-50 cyber-card px-4 py-2 text-xs text-cyberCyan font-black shadow-2xl border border-cyberCyan/60">{toast}</div>}
                    
                    <header className="cyber-card sticky top-0 z-30 w-full px-3 py-2 border-b border-cyberCyan/40 flex items-center justify-between mb-2">
                        <div className="flex items-center gap-2">
                            <div className="w-7 h-7 overflow-hidden rounded-full border border-cyberCyan"><SarahVectorAvatar /></div>
                            <div>
                                <h1 className="font-display text-[10px] font-black text-white leading-none">Sarah AI Nexus V11.4</h1>
                                <p className="text-[7px] text-cyberCyan font-mono mt-0.5">Projeto Cidadão Sensor • Mesquita</p>
                            </div>
                        </div>
                    </header>

                    <main className="w-full py-2 space-y-4 pb-28">
                        {activeTab === "estacao" && <EstacaoSobrevivenciaModuleV12 showToast={showToast} />}
                        {activeTab === "radar" && <RadarMeteorologicoModule />}
                        {activeTab === "balanca" && <ModuloCidadaoSensorModule onGoToDashboard={() => setActiveTab("estacao")} showToast={showToast} />}
                        {activeTab === "admin" && <AdminAreaRestritaModule showToast={showToast} onClose={() => setActiveTab("estacao")} />}
                    </main>

                    <footer className="cyber-card fixed bottom-0 left-0 right-0 z-40 border-t border-cyberCyan/40 px-2 py-2.5 flex items-center justify-around max-w-[640px] mx-auto rounded-t-2xl pb-[env(safe-area-inset-bottom)]">
                        {NAV_TABS.map(tab => (
                            <button key={tab.id} onClick={() => setActiveTab(tab.id)} className={`flex flex-col items-center justify-center gap-0.5 cursor-pointer flex-1 py-1.5 transition touch-manipulation rounded-xl ${activeTab === tab.id ? 'text-cyberCyan bg-cyberCyan/15 border border-cyberCyan/40 shadow-[0_0_8px_rgba(0,242,254,0.3)]' : 'text-slate-400 hover:text-white border border-transparent'}`}>
                                {tab.iconComponent}
                                <span className="text-[7px] font-black truncate w-full text-center tracking-tighter px-0.5">{tab.label}</span>
                            </button>
                        ))}
                    </footer>
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
