        const InoveStorage = {
            dbName: "CPARC_Biociber_DB",
            storeName: "multimedia",
            open() {
                return new Promise((resolve, reject) => {
                    const req = indexedDB.open(this.dbName, 1);
                    req.onupgradeneeded = (e) => {
                        const db = e.target.result;
                        if (!db.objectStoreNames.contains(this.storeName)) {
                            db.createObjectStore(this.storeName, { keyPath: "id" });
                        }
                    };
                    req.onsuccess = (e) => resolve(e.target.result);
                    req.onerror = (e) => reject(e.target.error);
                });
            },
            async save(item) {
                const db = await this.open();
                return new Promise((resolve, reject) => {
                    const tx = db.transaction(this.storeName, "readwrite");
                    const store = tx.objectStore(this.storeName);
                    store.put(item);
                    tx.oncomplete = () => resolve(true);
                    tx.onerror = (e) => reject(e.target.error);
                });
            },
            async getAll() {
                const db = await this.open();
                return new Promise((resolve, reject) => {
                    const tx = db.transaction(this.storeName, "readonly");
                    const store = tx.objectStore(this.storeName);
                    const req = store.getAll();
                    req.onsuccess = (e) => resolve(e.target.result || []);
                    req.onerror = (e) => reject(e.target.error);
                });
            },
            async remove(id) {
                const db = await this.open();
                return new Promise((resolve, reject) => {
                    const tx = db.transaction(this.storeName, "readwrite");
                    const store = tx.objectStore(this.storeName);
                    store.delete(id);
                    tx.oncomplete = () => resolve(true);
                    tx.onerror = (e) => reject(e.target.error);
                });
            }
        };

        const getBrasiliaGreeting = () => {
            const hour = parseInt(
                new Intl.DateTimeFormat("pt-BR", { timeZone: "America/Sao_Paulo", hour: "numeric", hour12: false }).format(new Date()),
                10
            );
            if (hour >= 0 && hour < 5) return "Boa madrugada";
            if (hour >= 5 && hour < 12) return "Bom dia";
            if (hour >= 12 && hour < 18) return "Boa tarde";
            return "Boa noite";
        };

        // Componente da Sala de Controle Biocibernética Completa
        function SalaBiociberneticaModule({ showToast }) {
            const [searchTerm, setSearchTerm] = useState("");
            const [filteredMun, setFilteredMun] = useState(LISTA_92_MUNICIPIOS);
            const [activeMunData, setActiveMunData] = useState({ name: "Mesquita", temp: "24.5", chuva: "0.0", vento: "12", status: "ONLINE" });
            const [heartRate, setHeartRate] = useState(78);
            const [homeostasis, setHomeostasis] = useState("ESTÁVEL");
            const [chatMessages, setChatMessages] = useState([
                { sender: "sarah", text: "Sistema biocibernético ativado! 92 municípios sincronizados com telemetria em tempo real." },
                { sender: "sarah", text: "Selecione qualquer município na grade abaixo para carregar dados meteorológicos dinâmicos." }
            ]);
            const [chatInput, setChatInput] = useState("");
            const [sensorModalOpen, setSensorModalOpen] = useState(false);
            const [ocorrenciaMun, setOcorrenciaMun] = useState("Mesquita");
            const [ocorrenciaTipo, setOcorrenciaTipo] = useState("Alagamento / Inundação");
            const [ocorrenciaDesc, setOcorrenciaDesc] = useState("");

            const canvasRef = useRef(null);

            const addChatMsg = (text, sender) => {
                setChatMessages(prev => [...prev, { sender, text }]);
            };

            const falarVoz = (t) => {
                try {
                    if ('speechSynthesis' in window) {
                        let m = new SpeechSynthesisUtterance(t);
                        m.lang = 'pt-BR';
                        m.rate = 0.92;
                        window.speechSynthesis.speak(m);
                    }
                } catch(e) {}
            };

            const selecionarMunicipio = async (nome) => {
                addChatMsg(`Telemetria: ${nome} • Consultando Open-Meteo...`, 'user');
                const coord = MUN_COORDS[nome] || {-22.7831, -43.4294};
                try {
                    const res = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${coord[0]}&longitude=${coord[1]}&current=temperature_2m,wind_speed_10m,precipitation&timezone=America/Sao_Paulo`);
                    const j = await res.json();
                    if (j?.current) {
                        const temp = j.current.temperature_2m;
                        const chuva = j.current.precipitation;
                        const vento = j.current.wind_speed_10m;
                        let statusStr = "ONLINE";
                        if (chuva > 10 || vento > 40) {
                            statusStr = "⚠️ ALERTA CRÍTICO";
                            addChatMsg(`🚨 ALERTA EM ${nome.toUpperCase()}: Chuva ${chuva}mm | Vento ${vento}km/h ultrapassaram o limiar!`, 'sarah');
                        }
                        setActiveMunData({ name: nome, temp, chuva, vento, status: statusStr });
                        addChatMsg(`${nome}: ${temp}°C | Chuva ${chuva}mm | Vento ${vento}km/h | Status: ${statusStr}`, 'sarah');
                        falarVoz(`${nome} monitorado`);
                    } else { throw new Error(); }
                } catch(e) {
                    const temp = (21 + Math.random() * 8).toFixed(1);
                    const chuva = (Math.random() * 4).toFixed(1);
                    setActiveMunData({ name: nome, temp, chuva, vento: "14.2", status: "ONLINE (Simulado)" });
                    addChatMsg(`${nome}: ${temp}°C | Chuva ${chuva}mm | ONLINE`, 'sarah');
                }
            };

            const filtrarMunicipios = (e) => {
                const q = e.target.value.toLowerCase();
                setSearchTerm(q);
                setFilteredMun(LISTA_92_MUNICIPIOS.filter(m => m.toLowerCase().includes(q)));
            };

            const sendUserMsg = () => {
                if (!chatInput.trim()) return;
                const txt = chatInput;
                addChatMsg(txt, 'user');
                falarVoz(txt);
                setChatInput("");
                setTimeout(() => {
                    addChatMsg(`Comando processado. Vetores biocibernéticos verificados para os 92 municípios.`, 'sarah');
                }, 800);
            };

            const injectNutrients = () => { addChatMsg('ATP injetado nos 92 nodes. Homeostase otimizada.', 'sarah'); setHomeostasis('OTIMIZADO'); };
            const triggerFever = () => { addChatMsg('Estresse térmico simulado nos 92 municípios.', 'sarah'); setHomeostasis('ESTRESSE TÉRMICO'); };
            const triggerRegeneration = () => { addChatMsg('Ciclo de regeneração ativado na rede estadual.', 'sarah'); setHomeostasis('ESTÁVEL'); };
            const exportarRelatorio = () => { addChatMsg('Relatório biocibernético de 92 municípios exportado com sucesso.', 'sarah'); showToast('📊 Relatório exportado!'); };

            const enviarOcorrencia = () => {
                const hora = new Intl.DateTimeFormat('pt-BR', { timeZone: 'America/Sao_Paulo', hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false }).format(new Date());
                addChatMsg(`⚡ [CIDADÃO SENSOR] ${ocorrenciaMun} | ${ocorrenciaTipo} | "${ocorrenciaDesc || 'Sem observações'}" (${hora})`, 'user');
                setSensorModalOpen(false);
                setOcorrenciaDesc("");
                setTimeout(() => {
                    addChatMsg(`SARAH IA: Alerta de campo integrado à malha de ${ocorrenciaMun}. Defesa Civil informada.`, 'sarah');
                    falarVoz(`Ocorrência registrada em ${ocorrenciaMun}`);
                }, 800);
            };

            // Canvas Radar Animation Loop
            useEffect(() => {
                const canvas = canvasRef.current;
                if (!canvas) return;
                const ctx = canvas.getContext('2d');
                let animId;
                let radarAngle = 0;
                let pulsePhase = 0;

                const resizeCanvas = () => {
                    if (canvas.parentElement) {
                        canvas.width = canvas.parentElement.clientWidth;
                        canvas.height = canvas.parentElement.clientHeight;
                    }
                };
                resizeCanvas();
                window.addEventListener('resize', resizeCanvas);

                let windParticles = [];
                for (let i = 0; i < 18; i++) windParticles.push({ x: Math.random() * canvas.width, y: Math.random() * canvas.height, length: Math.random() * 18 + 6 });

                const render = () => {
                    ctx.fillStyle = 'rgba(1,4,8,0.38)';
                    ctx.fillRect(0, 0, canvas.width, canvas.height);
                    radarAngle += 0.03 + (heartRate / 2500);
                    let cx = canvas.width / 2, cy = canvas.height / 2;

                    ctx.strokeStyle = 'rgba(0,255,204,0.12)';
                    [35, 70, 105, 140].forEach(r => {
                        ctx.beginPath();
                        ctx.arc(cx, cy, r, 0, Math.PI * 2);
                        ctx.stroke();
                    });

                    let sx = cx + Math.cos(radarAngle) * 160, sy = cy + Math.sin(radarAngle) * 160;
                    ctx.strokeStyle = 'rgba(0,255,204,0.7)';
                    ctx.beginPath();
                    ctx.moveTo(cx, cy);
                    ctx.lineTo(sx, sy);
                    ctx.stroke();

                    ctx.strokeStyle = 'rgba(255,255,255,0.35)';
                    windParticles.forEach(wp => {
                        wp.x += 2;
                        if (wp.x > canvas.width) { wp.x = -20; wp.y = Math.random() * canvas.height; }
                        ctx.beginPath();
                        ctx.moveTo(wp.x, wp.y);
                        ctx.lineTo(wp.x + wp.length, wp.y);
                        ctx.stroke();
                    });

                    pulsePhase += heartRate / 600;
                    let p = Math.sin(pulsePhase) * 3;
                    ctx.fillStyle = '#00ffcc';
                    ctx.beginPath();
                    ctx.arc(cx - 30, cy - 10, 5 + p * 0.4, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.fillStyle = '#ffaa00';
                    ctx.beginPath();
                    ctx.arc(cx + 40, cy + 20, 5 + p * 0.4, 0, Math.PI * 2);
                    ctx.fill();

                    animId = requestAnimationFrame(render);
                };
                render();

                return () => {
                    cancelAnimationFrame(animId);
                    window.removeEventListener('resize', resizeCanvas);
                };
            }, [heartRate]);

            return (
                <div className="space-y-4 max-w-lg mx-auto pb-10">
                    {sensorModalOpen && (

                                        <option value="Risco de Deslizamento">Risco de Deslizamento</option>
                                        <option value="Queda de Árvore / Poste">Queda de Árvore / Poste</option>

                                    </select>
                                </div>
                                <div className="space-y-1">
                                    <label className="text-[10px] text-cyan-300">Relato de Campo:</label>

                                <div className="flex gap-2 pt-1">
                                    <button onClick={() => setSensorModalOpen(false)} className="flex-1 py-2 bg-rose-500/20 text-rose-300 border border-rose-500/40 rounded-xl font-bold text-xs">CANCELAR</button>
                                    <button onClick={enviarOcorrencia} className="flex-1 py-2 bg-emerald-500/20 text-emerald-300 border border-emerald-500/40 rounded-xl font-bold text-xs">TRANSMITIR</button>
                                </div>
                            </div>
                        </div>
                    )}

                    <div className="cyber-card rounded-2xl p-4 space-y-3">
                        <div className="border-b border-[#00ffcc]/40 pb-2 flex justify-between items-center">
                            <div>
                                <h1 className="font-display text-xs font-black text-[#00ffcc] tracking-wider">CENTRAL BIOCIBERNÉTICA • 92 MUNICÍPIOS RJ</h1>
                                <p className="text-[9px] text-[#ffd700] font-display mt-0.5">PILOTO: SEBINHO (MESQUITA) & DOM BOSCO (CAXIAS)</p>
                            </div>
                            <div className="text-right text-[10px]">
                                <span className="text-white font-bold">ESTADO: </span><span className="text-[#00ffcc] font-display">{homeostasis}</span>
                            </div>
                        </div>

                        <div className="border border-[#00ffcc] rounded-xl p-2 bg-[#00ffcc]/10 text-[10px] flex justify-between items-center font-display">
                            <span>PULSO: <strong className="text-white">{heartRate} BPM</strong></span>
                            <span>NODES: <strong className="text-amber-400">92/92 ONLINE</strong></span>
                            <span>SEL: <strong className="text-cyan-300">{activeMunData.name}</strong></span>
                        </div>

                        <div className="relative bg-[#020509] border border-[#00ffcc] h-[150px] rounded-lg overflow-hidden flex items-center justify-center">
                            <div className="absolute top-1 left-1 text-[9px] text-[#00ffcc] bg-black/80 px-1.5 py-0.5 rounded border border-[#00ffcc]/40 z-10">VENTO: {activeMunData.vento} KM/H</div>
                            <div className="absolute top-1 right-1 text-[9px] text-amber-400 bg-black/80 px-1.5 py-0.5 rounded border border-amber-400/40 z-10">CHUVA: {activeMunData.chuva}mm</div>
                            <canvas ref={canvasRef} className="absolute inset-0 w-full h-full cursor-pointer" />
                            <div className="absolute bottom-0 w-full text-[8px] bg-black/90 py-1 text-center text-[#aaffcc] border-t border-[#00ffcc]/30 z-10">
                                MENDANHA ➔ SEBINHO | TINGUÁ ➔ DOM BOSCO | 92 MUNICÍPIOS RJ
                            </div>
                        </div>

                        {/* SARAH AI Chat Section */}
                        <div className="bg-[#040a12] border-2 border-[#00ffcc] rounded-xl p-3 space-y-2 shadow-lg">
                            <div className="font-display text-[11px] text-[#00ffcc] border-b border-[#00ffcc]/30 pb-2 flex justify-between items-center font-black">
                                <span>🤖 SARAH AI NEXUS • CANAL FUTURISTA</span>
                                <span className="text-[9px] text-emerald-300 bg-emerald-500/20 px-2 py-0.5 rounded-full border border-emerald-500/40">● VOZ ATIVA</span>
                            </div>
                            <div className="h-[180px] overflow-y-auto space-y-2 p-2 bg-black/50 rounded-lg border border-[#00ffcc]/20">
                                {chatMessages.map((msg, idx) => (
                                    <div key={idx} className={`text-[10px] p-2 rounded-xl leading-relaxed max-w-[92%] ${msg.sender === 'sarah' ? 'bg-[#00ffcc]/10 border-l-2 border-[#00ffcc] text-emerald-100' : 'bg-amber-500/10 border-r-2 border-amber-400 text-amber-100 ml-auto'}`}>
                                        <strong>[{msg.sender === 'sarah' ? 'SARAH IA' : 'OPERADOR'}]:</strong> {msg.text}
                                    </div>
                                ))}
                            </div>
                            <div className="flex gap-2">
                                <input type="text" value={chatInput} onChange={e => setChatInput(e.target.value)} onKeyDown={e => e.key === 'Enter' && sendUserMsg()} placeholder="Comando tático para SARAH..." className="flex-1 bg-black border border-[#00ffcc] text-white p-2 rounded-xl text-[10px] outline-none" />
                                <button onClick={sendUserMsg} className="px-3 py-2 bg-[#00ffcc]/20 border border-[#00ffcc] text-[#00ffcc] rounded-xl font-display font-bold text-[10px] cursor-pointer">ENVIAR</button>
                            </div>
                        </div>

                        {/* 92 Municípios Grid Section */}
                        <div className="bg-[#040a12] border border-[#00ffcc]/40 rounded-xl p-3 space-y-2">
                            <div className="font-display text-[11px] text-[#00ffcc] border-b border-[#00ffcc]/30 pb-1 flex justify-between items-center">
                                <span>🗺️ MONITORAMENTO • 92 MUNICÍPIOS RJ</span>
                                <span className="text-[10px] text-cyan-300">{filteredMun.length} ATIVOS</span>
                            </div>
                            <input type="text" value={searchTerm} onChange={filtrarMunicipios} placeholder="🔍 Buscar município..." className="w-full bg-black border border-[#00ffcc]/40 text-white p-2 rounded-lg text-[10px] outline-none" />
                            <div className="max-h-[140px] overflow-y-auto grid grid-cols-2 gap-1.5 p-1">
                                {filteredMun.map((nome, i) => {
                                    const isAlert = nome === 'Petrópolis' || nome === 'Angra dos Reis';
                                    const isActive = activeMunData.name === nome;
                                    return (
                                        <div key={i} onClick={() => selecionarMunicipio(nome)} className={`text-[10px] p-2 rounded border cursor-pointer flex justify-between items-center transition ${isActive ? 'bg-[#00ffcc]/30 border-[#00ffcc] text-white font-bold' : 'bg-[#00ffcc]/5 border-[#00ffcc]/20 text-[#aaffcc] hover:bg-[#00ffcc]/15'}`}>
                                            <span>{i+1}. {nome}</span>
                                            <span className={`w-2 h-2 rounded-full ${isAlert ? 'bg-rose-500 animate-pulse' : 'bg-emerald-400'}`}></span>
                                        </div>
                                    );
                                })}
                            </div>
                        </div>

                        {/* Control Buttons */}
                        <div className="grid grid-cols-2 gap-2">
                            <button onClick={injectNutrients} className="py-2 bg-[#00ffcc]/10 border border-[#00ffcc] text-[#00ffcc] font-display text-[10px] font-bold rounded-lg cursor-pointer">🟢 INJETAR ATP</button>
                            <button onClick={triggerFever} className="py-2 bg-[#00ffcc]/10 border border-[#00ffcc] text-[#00ffcc] font-display text-[10px] font-bold rounded-lg cursor-pointer">⚡ ESTRESSE TÉRMICO</button>
                            <button onClick={() => setSensorModalOpen(true)} className="col-span-2 py-2.5 bg-amber-500/20 border border-amber-400 text-amber-300 font-display text-[10px] font-black rounded-lg cursor-pointer animate-pulse">⚡ REGISTRAR OCORRÊNCIA (CIDADÃO SENSOR)</button>
                            <button onClick={exportarRelatorio} className="py-2 bg-[#00ffcc]/10 border border-[#00ffcc] text-[#00ffcc] font-display text-[10px] font-bold rounded-lg cursor-pointer">📊 EXPORTAR RELATÓRIO</button>
                            <button onClick={() => alert('DEFESA CIVIL 199 - 92 MUNICÍPIOS')} className="py-2 bg-rose-500/30 border border-rose-500 text-rose-200 font-display text-[10px] font-bold rounded-lg cursor-pointer animate-pulse">📞 DEFESA CIVIL 199</button>
                        </div>
                    </div>
                </div>
            );
        }

        function App() {
            const [showSplash, setShowSplash] = useState(true);
            const [theme, setTheme] = useState(() => { try { return localStorage.getItem("sarah-theme") || "dark"; } catch(e) { return "dark"; } });
            const [soundEnabled, setSoundEnabled] = useState(true);
            const [activeTab, setActiveTab] = useState("dashboard");
            const [radarOpen, setRadarOpen] = useState(false);
            const [shareModalOpen, setShareModalOpen] = useState(false);
            const [toastMessage, setToastMessage] = useState(null);
            const [termsAccepted, setTermsAccepted] = useState(() => { try { return localStorage.getItem("cparc_terms_accepted") === "1"; } catch(e) { return false; } });
            const [check1, setCheck1] = useState(false);
            const [check2, setCheck2] = useState(false);
            const [localVideos, setLocalVideos] = useState([]);
            const [marketingText, setMarketingText] = useState("Monitoramento integrado dos 92 municípios do Estado do Rio de Janeiro • CPARC v13.1");

            const showToast = (msg) => { setToastMessage(msg); setTimeout(() => setToastMessage(null), 3500); };

            useEffect(() => {
                InoveStorage.getAll().then(vids => {
                    if (vids && vids.length > 0) {
                        setLocalVideos(vids);
                    } else {
                        const defaultVid = { id: 1, title: "SARAH AI v13.1 • Monitoramento dos 92 Municípios", url: "https://www.w3schools.com/html/mov_bbb.mp4", date: "Sistema" };
                        InoveStorage.save(defaultVid);
                        setLocalVideos([defaultVid]);
                    }
                }).catch(() => {});
            }, []);

            const openShareFromApp = async () => {
                const manifestData = { title: "CPARC • Sala Biocibernética", text: shareMessageText, url: APP_SHARE_URL };
                if (navigator.share) {
                    try { await navigator.share(manifestData); return; } catch (err) { if (err.name === 'AbortError') return; }
                }
                setShareModalOpen(true);
            };

            const NAV_TABS = [
                { id: 'dashboard', label: 'Início' },
                { id: 'biociber', label: 'Sala Biocibernética' },
                { id: 'municipios', label: '92 Cidades' },
                { id: 'radar', label: 'Radar' },
                { id: 'relatorio', label: 'Vistoria' }
            ];

            return (
                <div className="min-h-screen flex flex-col relative text-slate-100 antialiased">
                    {showSplash && (
                        <div className="fixed inset-0 z-[300] bg-[#010306] flex flex-col items-center justify-center p-3 text-center">
                            <div className="w-[90vw] max-w-[340px] rounded-[28px] border-2 border-[#00ffcc] flex flex-col items-center justify-center bg-deepSpace/95 p-4 space-y-3 shadow-[0_0_80px_rgba(0,255,204,0.6)]">
                                <h1 className="font-display font-black text-lg text-white tracking-[0.2em] uppercase">CENTRAL BIOCIBERNÉTICA</h1>
                                <p className="text-[10px] text-cyan-300 font-mono">CHAVE CLIMÁTICA • 92 MUNICÍPIOS RJ</p>
                                <img src={SPLASH_IMAGE_URL} alt="Splash" className="w-full h-auto max-h-[220px] object-contain rounded-xl border border-[#00ffcc]/30" onError={e=>e.target.style.display='none'} />
                                <button onClick={() => setShowSplash(false)} className="w-full py-3 cyber-button font-black rounded-xl text-xs uppercase tracking-widest cursor-pointer shadow-lg">ACESSAR SALA DE CONTROLE</button>
                            </div>
                        </div>
                    )}

                    {toastMessage && (
                        <div className="fixed top-20 left-1/2 -translate-x-1/2 z-50 cyber-card px-6 py-3 rounded-2xl font-display text-[11px] font-black text-[#00ffcc] tracking-wider shadow-2xl border border-[#00ffcc]">
                            {toastMessage}
                        </div>
                    )}

                    {!termsAccepted && (
                        <div className="fixed inset-0 bg-void/95 z-[200] flex items-center justify-center p-4">
                            <div className="cyber-card max-w-md w-full p-6 rounded-3xl space-y-4 shadow-2xl">
                                <h2 className="font-display text-lg font-black text-white text-center">CHAVE CLIMÁTICA v13.1</h2>
                                <p className="text-xs text-cyan-300 text-center">Central Pública e Automatizada de Resiliência Comunitária</p>
                                <div className="space-y-2 text-xs">
                                    <label className="flex items-center gap-2 cursor-pointer"><input type="checkbox" checked={check1} onChange={e=>setCheck1(e.target.checked)} /> Concordo com os princípios da CPARC.</label>
                                    <label className="flex items-center gap-2 cursor-pointer"><input type="checkbox" checked={check2} onChange={e=>setCheck2(e.target.checked)} /> Autorizo geolocalização para vistorias.</label>
                                </div>
                                <button disabled={!check1||!check2} onClick={()=>{setTermsAccepted(true); try{localStorage.setItem("cparc_terms_accepted","1");}catch(e){}}} className={`w-full py-3 rounded-xl font-black text-xs ${check1&&check2?'cyber-button cursor-pointer':'bg-gray-800 text-gray-500'}`}>ENTRAR NA CENTRAL</button>
                            </div>
                        </div>
                    )}

                    <header className="cyber-card sticky top-0 z-30 px-4 py-3 border-b border-[#00ffcc]/40 flex items-center justify-between">
                        <div className="flex items-center gap-2.5">
                            <img src={SARAH_CUSTOM_AVATAR_URL} alt="SARAH" className="w-10 h-10 rounded-xl object-cover border border-[#00ffcc]" />
                            <div>
                                <h1 className="font-display text-xs font-black text-white tracking-widest">CENTRAL BIOCIBERNÉTICA</h1>
                                <p className="text-[8px] text-[#00ffcc] font-mono font-bold">92 MUNICÍPIOS DO RJ • CPARC</p>
                            </div>
                        </div>
                        <div className="flex gap-2">
                            <button onClick={openShareFromApp} className="px-3 py-1.5 bg-[#00ffcc]/20 border border-[#00ffcc] text-[#00ffcc] rounded-xl text-[10px] font-bold">📲 Compartilhar</button>
                        </div>
                    </header>

                    <nav className="cyber-card border-b border-[#00ffcc]/30 px-2 py-2 flex justify-around items-center overflow-x-auto z-20">
                        {NAV_TABS.map(tab => (
                            <button key={tab.id} onClick={() => tab.id === 'radar' ? setRadarOpen(true) : setActiveTab(tab.id)}
                                className={`px-3 py-1.5 rounded-xl text-[10px] font-black transition cursor-pointer whitespace-nowrap ${activeTab === tab.id ? 'bg-[#00ffcc] text-void font-black shadow-[0_0_15px_rgba(0,255,204,0.6)]' : 'bg-black/60 text-[#00ffcc] border border-[#00ffcc]/30'}`}>
                                {tab.label}
                            </button>
                        ))}
                    </nav>

                    <main className="flex-1 max-w-xl w-full mx-auto p-3 space-y-4">
                        {activeTab === 'dashboard' && (
                            <div className="cyber-card rounded-3xl p-6 text-center space-y-4 border-2 border-[#00ffcc]">
                                <h2 className="font-display text-sm font-black text-white">SISTEMA ESTADUAL UNIFICADO</h2>
                                <p className="text-xs text-cyan-200">Sala de Controle Biocibernética, Radar Meteorológico 24h e Inteligência SARAH AI integrados para os 92 municípios do Rio de Janeiro.</p>
                                <button onClick={() => setActiveTab('biociber')} className="w-full py-3.5 cyber-button font-display font-black text-xs uppercase tracking-widest rounded-2xl shadow-lg cursor-pointer">⚡ ABRIR SALA BIOCIBERNÉTICA</button>
                            </div>
                        )}

                        {activeTab === 'biociber' && <SalaBiociberneticaModule showToast={showToast} />}
                    </main>

                    {/* Radar Lateral */}
                    {radarOpen && (
                        <div className="fixed inset-0 z-[90] bg-black/80 backdrop-blur-md flex items-center justify-end" onClick={()=>setRadarOpen(false)}>
                            <div className="w-full max-w-[600px] h-full cyber-card flex flex-col p-4" onClick={e=>e.stopPropagation()}>
                                <div className="flex justify-between items-center border-b border-[#00ffcc]/40 pb-2 mb-2">
                                    <span className="font-display text-xs text-[#00ffcc]">🛰️ RADAR METEOROLÓGICO 24H • RJ</span>
                                    <button onClick={()=>setRadarOpen(false)} className="px-3 py-1 bg-rose-500/20 text-rose-300 border border-rose-500/40 rounded-lg text-xs">✕ Fechar</button>
                                </div>
                                <iframe src="https://embed.windy.com/embed2.html?lat=-22.7845&lon=-43.4190&detailLat=-22.7845&detailLon=-43.4190&width=600&height=500&zoom=10&level=surface&overlay=wind&product=ecmwf&menu=&message=&marker=true" className="w-full flex-1 border-none bg-black rounded-lg"></iframe>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
