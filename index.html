        .orbitron { font-family: 'Orbitron', sans-serif; }

        /* ===== ESTILOS DO AVATAR NEURAL ===== */
        .avatar-container {
            width: 120px; height: 120px; border-radius: 50%;
            position: relative; margin: 0 auto;
            display: flex; align-items: center; justify-content: center;
        }
        .neural-core {
            width: 60px; height: 60px; border-radius: 50%;
            background: radial-gradient(circle, #48CAE4 0%, #0077b6 100%);
            box-shadow: 0 0 20px #48CAE4, inset 0 0 10px #060b13;
            position: relative; z-index: 10;
            animation: breathe 3s ease-in-out infinite;
        }
        @keyframes breathe {
            0%, 100% { transform: scale(1); box-shadow: 0 0 20px #48CAE4; }
            50% { transform: scale(1.1); box-shadow: 0 0 35px #48CAE4; }
        }
        .neural-ring {
            position: absolute; top: 50%; left: 50%;
            width: 100%; height: 100%; transform: translate(-50%, -50%);
            border: 2px solid rgba(72, 202, 228, 0.3);
            border-radius: 50%;
            animation: spin 8s linear infinite;
        }
        .neural-ring:nth-child(2) {
            width: 80%; height: 80%;
            border-color: rgba(72, 202, 228, 0.5);
            animation-duration: 6s;
            animation-direction: reverse;
        }
        .neural-ring:nth-child(3) {
            width: 90%; height: 90%;
            border-color: rgba(72, 202, 228, 0.2);
            animation-duration: 10s;
        }
        @keyframes spin { to { transform: translate(-50%, -50%) rotate(360deg); } }
        
        .neural-eyes {
            position: absolute; top: 35%; left: 50%; transform: translateX(-50%);
            display: flex; gap: 8px; z-index: 11;
        }
        .eye {
            width: 6px; height: 3px; background: #fff; border-radius: 2px;
            box-shadow: 0 0 5px #fff;
            animation: blink 4s infinite;
        }
        @keyframes blink { 0%, 96%, 100% { height: 3px; } 98% { height: 0.5px; } }

        .talking .neural-core {
            animation: talk-pulse 0.5s ease-in-out infinite;
        }
        @keyframes talk-pulse {
            0%, 100% { transform: scale(1.1); }
            50% { transform: scale(1.25); box-shadow: 0 0 40px #48CAE4; }
        }
    </style>
</head>
