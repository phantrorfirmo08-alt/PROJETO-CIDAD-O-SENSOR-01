<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sarah IA vs 4.0 - Defesa Civil Mesquita/RJ</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- Babel para JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Leaflet Map CSS & JS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@19.4.0/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@19.4.0/dist/leaflet.js"></script>
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        @keyframes marquee { 0% { transform: translateX(0%); } 100% { transform: translateX(-50%); } }
        .animate-marquee { display: flex; width: 200%; animation: marquee 25s linear infinite; }
        body { background-color: #020617; color: #f8fafc; }
    </style>
</head>
<body>
<div id="root"></div>

<script type="text/babel">
    const { useState, useEffect, useRef } = React;
    const CLOUDFLARE_WORKER_URL = "https://silent-shadow-7299.phantrorfirmo08.workers.dev";

    function SarahAvatar({ size = "w-10 h-10", showStatus = true }) {
        return (
            <div className={`relative ${size} rounded-2xl bg-gradient-to-tr from-cyan-600 to-emerald-500 p-0.5 shadow-lg flex items-center justify-center shrink-0`}>
                <div className="w-full h-full bg-slate-950 rounded-[14px] flex items-center justify-center text-cyan-400 font-bold text-sm">🛡️</div>
                {showStatus && <span className="absolute -bottom-0.5 -right-0.5 w-3 h-3 bg-emerald-500 border-2 border-slate-950 rounded-full animate-pulse"></span>}
            </div>
        );
    }

    function App() {
        const [messages, setMessages] = useState([]);
        const [input, setInput] = useState("");
        const [isLoadingChat, setIsLoadingChat] = useState(false);
        const [termsAccepted, setTermsAccepted] = useState(() => localStorage.getItem("sarah_lgpd_accepted") === "true");
        const [chk1, setChk1] = useState(false);
        const [chk2, setChk2] = useState(false);
        const [liveWeather, setLiveWeather] = useState(null);
        
        // Modais & Controles
        const [mapOpen, setMapOpen] = useState(false);
        const [chartOpen, setChartOpen] = useState(false);
        const [pinModalOpen, setPinModalOpen] = useState(false);
        const [pinInput, setPinInput] = useState("");
        const [pinError, setPinError] = useState(false);
        const [galleryOpen, setGalleryOpen] = useState(false);
        const [fontSizeLevel, setFontSizeLevel] = useState(1); // 0: A-, 1: Normal, 2: A+
        const [deferredPrompt, setDeferredPrompt] = useState(null);

        const mapRef = useRef(null);
        const leafletMapRef = useRef(null);
        const chartRef = useRef(null);
        const chartInstanceRef = useRef(null);

        // Clima Open-Meteo Mesquita/RJ
        useEffect(() => {
            fetch("https://api.open-meteo.com/v1/forecast?latitude=-22.7858&longitude=-43.4258&current=temperature_2m,relative_humidity_2m,precipitation,wind_speed_10m")
                .then(res => res.json())
                .then(data => data?.current && setLiveWeather(data.current))
                .catch(err => console.error("Erro clima:", err));

            window.addEventListener("beforeinstallprompt", (e) => {
                e.preventDefault();
                setDeferredPrompt(e);
            });
        }, []);

        // Inicializar Mapa Leaflet
        useEffect(() => {
            if (mapOpen && !leafletMapRef.current) {
                setTimeout(() => {
                    if (mapRef.current) {
                        leafletMapRef.current = L.map(mapRef.current).setView([-22.7858, -43.4258], 14);
                        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19 }).addTo(leafletMapRef.current);
                        L.marker([-22.7858, -43.4258]).addTo(leafletMapRef.current)
                          .bindPopup('<b>Defesa Civil - Mesquita/RJ</b><br/>Monitoramento Ativo.').openPopup();
                    }
                }, 200);
            }
        }, [mapOpen]);

        // Inicializar Gráfico Chart.js
        useEffect(() => {
            if (chartOpen) {
                setTimeout(() => {
                    if (chartRef.current) {
                        if (chartInstanceRef.current) chartInstanceRef.current.destroy();
                        chartInstanceRef.current = new Chart(chartRef.current, {
                            type: 'line',
                            data: {
                                labels: ['06h', '09h', '12h', '15h', '18h', '21h'],
                                datasets: [
                                    { label: 'Temperatura (°C)', data: [24, 27, 31, 30, 26, 25], borderColor: '#06b6d4', backgroundColor: 'rgba(6,182,212,0.1)', tension: 0.3 },
                                    { label: 'Precipitação (mm)', data: [0, 0, 1.2, 3.5, 0.5, 0], borderColor: '#10b981', backgroundColor: 'rgba(16,185,129,0.1)', tension: 0.3 }
                                ]
                            },
                            options: { responsive: true, maintainAspectRatio: false }
                        });
                    }
                }, 200);
            }
        }, [chartOpen]);

        const getFontClass = () => fontSizeLevel === 0 ? "text-xs" : fontSizeLevel === 2 ? "text-base" : "text-sm";
        const changeFontSize = (dir) => setFontSizeLevel(prev => dir === 'up' ? Math.min(prev + 1, 2) : Math.max(prev - 1, 0));
        const clearChat = () => setMessages([]);
        const installPwa = () => {
            if (deferredPrompt) {
                deferredPrompt.prompt();
                deferredPrompt.userChoice.then(() => setDeferredPrompt(null));
            } else {
                alert("Para instalar, acesse o menu do seu navegador e selecione 'Adicionar à Tela Inicial'.");
            }
        };

        const stopSpeaking = () => window.speechSynthesis && window.speechSynthesis.cancel();
        const speakText = (txt) => {
            if ('speechSynthesis' in window) {
                stopSpeaking();
                const utter = new SpeechSynthesisUtterance(txt);
                utter.lang = 'pt-BR';
                window.speechSynthesis.speak(utter);
            }
        };

        const verifyPin = () => {
            if (pinInput === "0001") {
                setPinError(false);
                setPinModalOpen(false);
                setPinInput("");
                alert("Acesso Administrativo Cidadão Sensor concedido com sucesso!");
            } else {
                setPinError(true);
            }
        };

        const handleSendMessage = async () => {
            const textToSend = input.trim();
            if (!textToSend || isLoadingChat) return;
            stopSpeaking();

            const userMsg = { id: `${Date.now()}-user`, sender: "user", text: textToSend, timestamp: new Date().toLocaleTimeString("pt-BR", { hour: "2-digit", minute: "2-digit" }) };
            const historico = [...messages, userMsg].slice(-8).map(m => ({ role: m.sender === "user" ? "user" : "assistant", content: m.text }));

            setMessages(prev => [...prev, userMsg]);
            setInput("");
            setIsLoadingChat(true);

            const weatherCtx = liveWeather ? `Condições em Mesquita/RJ: Temp ${liveWeather.temperature_2m}°C, Umidade ${liveWeather.relative_humidity_2m}%, Chuva ${liveWeather.precipitation} mm.` : "";

            try {
                const res = await fetch(CLOUDFLARE_WORKER_URL, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        model: "openai/gpt-oss-120b",
                        messages: [
                            { role: "system", content: `Você é a Sarah IA vs 4.0, assistente de monitoramento e Defesa Civil em Mesquita/RJ. ${weatherCtx} Responda em português do Brasil.` },
                            ...historico
                        ],
                        temperature: 0.6,
                        max_tokens: 900
                    })
                });
                const data = await res.json();
                if (!res.ok) throw new Error(data?.error || "Erro no servidor.");
                const reply = data?.choices?.[0]?.message?.content || data?.message || data?.reply;
                if (!reply) throw new Error("Sem resposta da IA.");

                const assistantMsg = { id: `${Date.now()}-assistant`, sender: "sarah", text: reply, timestamp: new Date().toLocaleTimeString("pt-BR", { hour: "2-digit", minute: "2-digit" }) };
                setMessages(prev => [...prev, assistantMsg]);
                speakText(reply);
            } catch (err) {
                console.error(err);
                setMessages(prev => [...prev, { id: `${Date.now()}-err`, sender: "sarah", text: "Erro ao conectar com a inteligência artificial através do cofre seguro.", timestamp: new Date().toLocaleTimeString("pt-BR", { hour: "2-digit", minute: "2-digit" }) }]);
            } finally {
                setIsLoadingChat(false);
            }
        };

        return (
            <div className={`min-h-screen bg-slate-950 text-slate-100 flex flex-col font-sans relative overflow-x-hidden ${getFontClass()}`}>
                
                {/* MODAL LGPD */}
                {!termsAccepted && (
                    <div className="fixed inset-0 z-50 bg-slate-950/95 backdrop-blur-md flex items-center justify-center p-4">
                        <div className="bg-slate-900 border-2 border-cyan-500/50 rounded-3xl max-w-md w-full p-6 shadow-2xl flex flex-col gap-4">
                            <div className="flex items-center gap-3">
                                <div className="w-12 h-12 rounded-2xl bg-cyan-500/10 border border-cyan-400 flex items-center justify-center text-cyan-400 font-bold text-xl">🛡️</div>
                                <div>
                                    <h2 className="text-base font-bold text-cyan-300">Sarah IA vs 4.0</h2>
                                    <p className="text-xs text-slate-400">Termo de Responsabilidade & LGPD</p>
                                </div>
                            </div>
                            <div className="bg-slate-950/80 p-3.5 rounded-xl border border-slate-800 text-xs text-slate-300 space-y-2">
                                <p className="font-semibold text-cyan-400">Pilares de Proteção de Dados:</p>
                                <ul className="list-disc pl-4 space-y-1 text-slate-400">
                                    <li><strong className="text-slate-200">Transparência:</strong> Dados operacionais e de defesa civil.</li>
                                    <li><strong className="text-slate-200">Segurança:</strong> Criptografia e controle por PIN.</li>
                                    <li><strong className="text-slate-200">Privacidadse:</strong> Integridade e respeito aos dados.</li>
                                </ul>
                            </div>
                            <div className="space-y-3 pt-1">
                                <label className="flex items-start gap-3 cursor-pointer text-xs text-slate-300">
                                    <input type="checkbox" checked={chk1} onChange={e => setChk1(e.target.checked)} className="mt-0.5 rounded border-slate-700 bg-slate-950 text-cyan-500" />
                                    <span>Li e compreendi os 3 pilares fundamentais da LGPD.</span>
                                </label>
                                <label className="flex items-start gap-3 cursor-pointer text-xs text-slate-300">
                                    <input type="checkbox" checked={chk2} onChange={e => setChk2(e.target.checked)} className="mt-0.5 rounded border-slate-700 bg-slate-950 text-cyan-500" />
                                    <span>Concordo com os termos de uso e diretrizes operacionais.</span>
                                </label>
                            </div>
                            <button disabled={!chk1 || !chk2} onClick={() => { setTermsAccepted(true); localStorage.setItem("sarah_lgpd_accepted", "true"); }} className={`w-full py-3 rounded-xl font-bold text-xs transition-all ${chk1 && chk2 ? "bg-cyan-500 hover:bg-cyan-400 text-slate-950 cursor-pointer shadow-cyan-500/30 shadow-lg" : "bg-slate-800 text-slate-500 cursor-not-allowed"}`}>
                                Aceitar e Entrar no Sistema
                            </button>
                        </div>
                    </div>
                )}

                {/* HEADER */}
                <header className="bg-slate-900/90 backdrop-blur-md border-b border-slate-800 px-4 py-3 flex items-center justify-between sticky top-0 z-30 shadow-md">
                    <div className="flex items-center gap-3">
                        <SarahAvatar size="w-10 h-10" showStatus={true} />
                        <div>
                            <h1 className="font-bold text-sm tracking-wide text-cyan-400">Sarah IA vs 4.0</h1>
                            <span className="text-[10px] text-emerald-400 flex items-center gap-1 font-medium">
                                <span className="w-1.5 h-1.5 rounded-full bg-emerald-500 animate-pulse"></span> Sistema Ativo
                            </span>
                        </div>
                    </div>
                    <div className="flex items-center gap-2">
                        <div className="flex items-center bg-slate-950 border border-slate-800 rounded-lg overflow-hidden text-xs">
                            <button onClick={() => changeFontSize('down')} className="px-2 py-1 text-slate-400 hover:bg-slate-800">A-</button>
                            <span className="px-1 text-[10px] text-slate-500 border-x border-slate-800">Fonte</span>
                            <button onClick={() => changeFontSize('up')} className="px-2 py-1 text-slate-400 hover:bg-slate-800">A+</button>
                        </div>
                        <button onClick={clearChat} className="p-2 bg-slate-950 border border-slate-800 hover:bg-rose-950/30 rounded-lg text-slate-400 hover:text-rose-400" title="Limpar Chat">🗑️</button>
                        <button onClick={installPwa} className="p-2 bg-cyan-950/40 border border-cyan-800/60 rounded-lg text-cyan-300 text-xs px-3 font-medium">📲 Instalar</button>
                    </div>
                </header>

                {/* CORPO / CHAT */}
                <main className="flex-1 max-w-4xl w-full mx-auto p-4 flex flex-col gap-4 pb-36">
                    <div className="bg-gradient-to-r from-emerald-950/50 to-cyan-950/50 border border-emerald-800/40 rounded-2xl p-3.5 flex flex-col sm:flex-row items-center justify-between gap-3 shadow-md">
                        <div className="flex items-center gap-3">
                            <span className="text-2xl">📢</span>
                            <div>
                                <h2 className="text-xs font-bold text-emerald-300">Grupo a chave da esperança</h2>
                                <p className="text-[11px] text-slate-400">Envie ocorrências para fortalecer nossa rede.</p>
                            </div>
                        </div>
                        <a href="https://chat.whatsapp.com/D1wrk9nTBH57Wya2Uv44ZW?s=sh&p=a&mlu=4&ilr=4" target="_blank" rel="noopener noreferrer" className="bg-emerald-600 hover:bg-emerald-500 text-slate-950 font-bold px-4 py-2 rounded-xl text-xs transition-all whitespace-nowrap shadow-lg">
                            Entrar no Grupo ↗
                        </a>
                    </div>

                    <div className="flex-1 space-y-3 flex flex-col">
                        {messages.length === 0 && (
                            <div className="flex gap-3 justify-start items-start">
                                <SarahAvatar size="w-9 h-9" showStatus={false} />
                                <div className="max-w-[80%] p-4 rounded-2xl bg-slate-900 border border-slate-800 text-slate-200 rounded-bl-sm shadow-sm">
                                    Olá! Sou a Sarah IA vs 4.0, sua assistente de monitoramento e defesa civil. Como posso ajudar?
                                </div>
                            </div>
                        )}
                        {messages.map(m => (
                            <div key={m.id} className={`flex gap-3 items-start ${m.sender === "user" ? "justify-end" : "justify-start"}`}>
                                {m.sender !== "user" && <SarahAvatar size="w-9 h-9" showStatus={false} />}
                                <div className={`max-w-[80%] p-4 rounded-2xl shadow-sm ${m.sender === "user" ? "bg-cyan-600 text-slate-950 font-medium rounded-br-sm" : "bg-slate-900 border border-slate-800 text-slate-200 rounded-bl-sm"}`}>
                                    <div className="text-[10px] opacity-75 mb-1 font-mono">{m.sender === "user" ? "Você" : "Sarah IA vs 4.0"} • {m.timestamp}</div>
                                    <div className="whitespace-pre-wrap">{m.text}</div>
                                </div>
                            </div>
                        ))}
                        {isLoadingChat && (
                            <div className="flex gap-3 items-center justify-start">
                                <SarahAvatar size="w-9 h-9" showStatus={false} />
                                <div className="p-3 rounded-2xl bg-slate-900 border border-slate-800 text-cyan-400 animate-pulse text-xs font-mono">
                                    Sarah IA está processando...
                                </div>
                            </div>
                        )}
                    </div>
                </main>

                {/* INPUT FIXO */}
                <div className="fixed bottom-20 left-0 right-0 p-3 bg-slate-950/90 backdrop-blur-md border-t border-slate-800 z-20">
                    <div className="max-w-4xl mx-auto flex items-center gap-2">
                        <input type="text" value={input} onChange={e => setInput(e.target.value)} onKeyDown={e => e.key === "Enter" && handleSendMessage()} placeholder="Digite sua ocorrência ou comando..." className="flex-1 bg-slate-900 border border-slate-800 rounded-xl px-4 py-3 text-sm text-slate-100 placeholder:text-slate-500 focus:outline-none focus:border-cyan-500" />
                        <button onClick={handleSendMessage} className="bg-cyan-500 hover:bg-cyan-400 text-slate-950 font-bold px-5 py-3 rounded-xl text-sm shadow-cyan-500/20 shadow-lg transition">Enviar</button>
                    </div>
                </div>

                {/* RODAPÉ & LETREIRO */}
                <footer className="fixed bottom-0 left-0 right-0 bg-slate-900 border-t border-slate-800 z-30 flex flex-col shadow-2xl">
                    <div className="bg-slate-950 text-cyan-400 text-[11px] font-semibold py-1.5 overflow-hidden whitespace-nowrap border-b border-slate-800/80 flex">
                        <div className="animate-marquee flex gap-8 items-center px-4 font-mono">
                            <span>🚨 ZAP alertas (21) 97299-3223</span><span className="text-slate-600">•</span>
                            <span>📞 (21) 4042-1772 ocorrências</span><span className="text-slate-600">•</span>
                            <span>🏢 CRAS (21) 2042-8931 Rocha Sobrinho</span><span className="text-slate-600">•</span>
                            <span>🚨 ZAP alertas (21) 97299-3223</span><span className="text-slate-600">•</span>
                            <span>📞 (21) 4042-1772 ocorrências</span><span className="text-slate-600">•</span>
                            <span>🏢 CRAS (21) 2042-8931 Rocha Sobrinho</span>
                        </div>
                    </div>
                    <div className="flex items-center justify-around px-2 py-2 bg-slate-900 text-xs">
                        <button onClick={() => setMapOpen(true)} className="flex flex-col items-center gap-0.5 text-slate-400 hover:text-cyan-400"><span>🗺️</span><span>Mapa</span></button>
                        <button onClick={() => setChartOpen(true)} className="flex flex-col items-center gap-0.5 text-slate-400 hover:text-cyan-400"><span>📊</span><span>Gráfico</span></button>
                        <button onClick={() => setPinModalOpen(true)} className="flex flex-col items-center gap-0.5 text-slate-400 hover:text-cyan-400"><span>🔒</span><span>Cidadão Sensor</span></button>
                        <button onClick={() => setGalleryOpen(true)} className="flex flex-col items-center gap-0.5 text-slate-400 hover:text-cyan-400"><span>📹</span><span>Mídia Livre</span></button>
                    </div>
                </footer>

                {/* MODAL MAPA */}
                {mapOpen && (
                    <div className="fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-50 flex items-center justify-center p-4">
                        <div className="bg-slate-900 border border-cyan-500/40 w-full max-w-2xl rounded-2xl shadow-2xl overflow-hidden">
                            <div className="bg-slate-950 px-4 py-3 border-b border-slate-800 flex justify-between items-center">
                                <h3 className="font-mono text-cyan-400 text-sm font-bold">🗺️ Mapa Operacional da Defesa Civil</h3>
                                <button onClick={() => setMapOpen(false)} className="text-slate-400 hover:text-white font-mono text-xs px-2 py-1 rounded bg-slate-800">✕ Fechar</button>
                            </div>
                            <div className="p-4 bg-slate-900">
                                <div ref={mapRef} className="w-full h-80 rounded-xl border border-cyan-500/30"></div>
                                <p className="text-xs text-slate-400 font-mono mt-3">Monitoramento meteorológico em tempo real (Mesquita/RJ).</p>
                            </div>
                        </div>
                    </div>
                )}

                {/* MODAL GRÁFICO */}
                {chartOpen && (
                    <div className="fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-50 flex items-center justify-center p-4">
                        <div className="bg-slate-900 border border-cyan-500/40 w-full max-w-2xl rounded-2xl shadow-2xl overflow-hidden">
                            <div className="bg-slate-950 px-4 py-3 border-b border-slate-800 flex justify-between items-center">
                                <h3 className="font-mono text-cyan-400 text-sm font-bold">📊 Gráfico Analítico de Ocorrências</h3>
                                <button onClick={() => setChartOpen(false)} className="text-slate-400 hover:text-white font-mono text-xs px-2 py-1 rounded bg-slate-800">✕ Fechar</button>
                            </div>
                            <div className="p-4 bg-slate-900">
                                <div className="w-full h-72"><canvas ref={chartRef}></canvas></div>
                                <p className="text-xs text-slate-400 font-mono mt-3">Estatísticas horárias de temperatura e precipitação.</p>
                            </div>
                        </div>
                    </div>
                )}

                {/* MODAL PIN ADMIN */}
                {pinModalOpen && (
                    <div className="fixed inset-0 z-50 bg-slate-950/80 backdrop-blur-sm flex items-center justify-center p-4">
                        <div className="bg-slate-900 border border-slate-800 rounded-2xl max-w-xs w-full p-5 shadow-2xl flex flex-col gap-4">
                            <div className="text-center">
                                <h3 className="text-sm font-bold text-cyan-400">Cidadão Sensor (Admin)</h3>
                                <p className="text-[11px] text-slate-400 mt-1">Insira o PIN administrativo (0001)</p>
                            </div>
                            <input type="password" maxLength="4" value={pinInput} onChange={e => setPinInput(e.target.value)} placeholder="••••" className="bg-slate-950 border border-slate-800 text-center tracking-widest text-lg rounded-xl py-2 text-slate-100 focus:outline-none focus:border-cyan-500 font-mono" />
                            {pinError && <p className="text-[10px] text-rose-400 text-center font-medium">PIN Incorreto. Tente novamente.</p>}
                            <div className="flex gap-2">
                                <button onClick={() => setPinModalOpen(false)} className="flex-1 bg-slate-800 hover:bg-slate-700 text-slate-300 py-2 rounded-xl text-xs font-medium">Cancelar</button>
                                <button onClick={verifyPin} className="flex-1 bg-cyan-500 hover:bg-cyan-400 text-slate-950 py-2 rounded-xl text-xs font-bold shadow-lg">Confirmar</button>
                            </div>
                        </div>
                    </div>
                )}

                {/* MODAL GALERIA DE MÍDIA */}
                {galleryOpen && (
                    <div className="fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-50 flex items-center justify-center p-4">
                        <div className="bg-slate-900 border border-cyan-500/40 w-full max-w-lg rounded-2xl shadow-2xl overflow-hidden">
                            <div className="bg-slate-950 px-4 py-3 border-b border-slate-800 flex justify-between items-center">
                                <h3 className="font-mono text-cyan-400 text-sm font-bold">📹 Galeria de Vídeos e Fotos • Mídia Livre</h3>
                                <button onClick={() => setGalleryOpen(false)} className="text-slate-400 hover:text-white font-mono text-xs px-2 py-1 rounded bg-slate-800">✕ Fechar</button>
                            </div>
                            <div className="p-5 bg-slate-900 space-y-3 text-xs text-slate-300">
                                <p className="font-semibold text-cyan-300">Relatórios Visuais da Comunidade</p>
                                <p className="text-slate-400">Consulte ou envie vídeos e fotos de ocorrências em Mesquita - RJ.</p>
                                <div className="p-4 bg-slate-950 rounded-xl border border-slate-800 flex flex-col items-center justify-center gap-2">
                                    <span className="text-2xl">📁</span>
                                    <span className="text-slate-400 text-[11px]">Nenhum arquivo carregado no momento.</span>
                                    <label className="bg-cyan-600 hover:bg-cyan-500 text-slate-950 font-bold px-4 py-2 rounded-lg text-xs cursor-pointer transition mt-2">
                                        Carregar Foto ou Vídeo
                                        <input type="file" accept="image/*,video/*" className="hidden" onChange={() => alert("Arquivo selecionado para análise.")} />
                                    </label>
                                </div>
                            </div>
                        </div>
                    </div>
                )}

            </div>
        );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
