<!DOCTYPE html>
<html lang="pt-BR" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SARAH AI Core v4.5 PRO - Defesa Civil Mesquita</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        brand: {
                            dark: "#020617",
                            light: "#f8fafc"
                        }
                    },
                    animation: {
                        'scanline': 'scan 3.5s linear infinite',
                        'pulse-glow': 'pulseGlow 2s cubic-bezier(0.4, 0, 0.6, 1) infinite',
                        'cyber-spin': 'cyberSpin 12s linear infinite',
                    },
                    keyframes: {
                        scan: {
                            '0%': { transform: 'translateY(-100%)' },
                            '100%': { transform: 'translateY(100%)' },
                        },
                        pulseGlow: {
                            '0%, 100%': { opacity: '1', filter: 'drop-shadow(0 0 20px rgba(6, 182, 212, 0.7))' },
                            '50%': { opacity: '0.65', filter: 'drop-shadow(0 0 8px rgba(6, 182, 212, 0.3))' },
                        },
                        cyberSpin: {
                            '0%': { transform: 'rotate(0deg)' },
                            '100%': { transform: 'rotate(360deg)' },
                        }
                    }
                }
            }
        };
    </script>
    <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="">
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <meta name="theme-color" content="#020617">
    <link rel="manifest" href="manifest.json">
    <style>
        html, body, #root {
            min-height: 100%;
            margin: 0;
            transition: background-color 0.3s ease, color 0.3s ease;
        }
        body {
            overflow-x: hidden;
            font-family: system-ui, -apple-system, sans-serif;
        }
        .leaflet-container {
            z-index: 10;
        }
        .glass-dark {
            background: rgba(2, 6, 23, 0.82);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(6, 182, 212, 0.25);
        }
        .glass-light {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(14, 165, 233, 0.3);
        }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 selection:bg-cyan-500 selection:text-slate-950">
    <div id="root"></div>
    <script type="text/babel">
        const CLOUDFLARE_WORKER_URL = "https://sarah-envelope.phantrorfirmo08.workers.dev/";

        const getBrasiliaGreeting = () => {
            const hour = parseInt(
                new Intl.DateTimeFormat("pt-BR", {
                    timeZone: "America/Sao_Paulo",
                    hour: "numeric",
                    hour12: false
                }).format(new Date()),
                10
            );
            if (hour >= 0 && hour < 5) return "Boa madrugada";
            if (hour >= 5 && hour < 12) return "Bom dia";
            if (hour >= 12 && hour < 18) return "Boa tarde";
            return "Boa noite";
        };

        // Avatar Neural Frontal Futurista de Alta Precisão (Sério, focado em monitoramento, com piscada realista)
        function SarahAvatar({ size = "w-10 h-10", showStatus = true, isLarge = false }) {
            const [isBlinking, setIsBlinking] = React.useState(false);

            React.useEffect(() => {
                let timeoutId;
                const triggerBlink = () => {
                    setIsBlinking(true);
                    setTimeout(() => setIsBlinking(false), 110);
                    const randomTime = Math.floor(Math.random() * (4500 - 2200 + 1)) + 2200;
                    timeoutId = setTimeout(triggerBlink, randomTime);
                };
                const initialTime = Math.floor(Math.random() * (4500 - 2200 + 1)) + 2200;
                timeoutId = setTimeout(triggerBlink, initialTime);
                return () => clearTimeout(timeoutId);
            }, []);

            const dimensionClass = isLarge ? "w-32 h-32 sm:w-36 sm:h-36" : size;

            return (
                <div className="relative inline-flex items-center justify-center shrink-0">
                    <div className={`${dimensionClass} rounded-3xl bg-gradient-to-br from-slate-900 via-slate-950 to-cyan-950 border-2 border-cyan-400/60 shadow-[0_0_30px_rgba(6,182,212,0.45)] flex flex-col items-center justify-center relative overflow-hidden select-none animate-pulse-glow`}>
                        {/* Grade neural holográfica de fundo */}
                        <div className="absolute inset-0 opacity-25 bg-[radial-gradient(#06b6d4_1.2px,transparent_1.2px)] [background-size:6px_6px]"></div>
                        
                        {/* Anel orbital futurista giratório */}
                        <div className="absolute inset-2 rounded-2xl border border-cyan-500/30 border-dashed animate-cyber-spin pointer-events-none"></div>

                        {/* Rosto Frontal Cibernético - Expressão Séria & Avançada */}
                        <svg className="w-4/5 h-4/5 text-cyan-400 relative z-10" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
                            {/* Estrutura cranial geométrica frontal */}
                            <path d="M 20 18 L 44 18 L 50 32 L 44 48 L 20 48 L 14 32 Z" stroke="currentColor" strokeWidth="1" strokeOpacity="0.4" fill="rgba(6,182,212,0.05)" />
                            
                            {/* Olhos Frontais com Sensor de Monitoramento Ativo e Piscada */}
                            <g className="transition-all duration-75">
                                {/* Olho Esquerdo */}
                                <rect x="18" y="24" width="11" height={isBlinking ? "1.2" : "6.5"} rx="3" fill="currentColor" className="shadow-[0_0_12px_#22d3ee]" />
                                <circle cx="23.5" cy="27.25" r={isBlinking ? "0" : "1.8"} fill="#ffffff" />
                                
                                {/* Olho Direito */}
                                <rect x="35" y="24" width="11" height={isBlinking ? "1.2" : "6.5"} rx="3" fill="currentColor" className="shadow-[0_0_12px_#22d3ee]" />
                                <circle cx="40.5" cy="27.25" r={isBlinking ? "0" : "1.8"} fill="#ffffff" />
                            </g>

                            {/* Sensor Nasal Analítico */}
                            <path d="M 32 28 L 30 38 L 34 38 Z" fill="currentColor" opacity="0.6" />
                            <circle cx="32" cy="38" r="1.5" fill="#38bdf8" className="animate-ping" />

                            {/* Linha de Boca Neutra / Decisiva (Profissional) */}
                            <line x1="24" y1="44" x2="40" y2="44" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round" className="opacity-90" />
                            <line x1="28" y1="44" x2="36" y2="44" stroke="#ffffff" strokeWidth="1" strokeLinecap="round" />
                        </svg>

                        {/* Linha de Varredura Laser (Scanline) */}
                        <div className="absolute inset-x-0 h-1 bg-gradient-to-r from-transparent via-cyan-300 to-transparent shadow-[0_0_10px_#22d3ee] animate-scanline pointer-events-none opacity-80"></div>
                    </div>
                    {showStatus && (
                        <div className={`absolute ${isLarge ? 'bottom-1.5 right-1.5 w-4.5 h-4.5 border-2' : '-bottom-0.5 right-0.5 w-3.5 h-3.5 border'} bg-emerald-400 rounded-full border-slate-950 shadow-[0_0_12px_#34d399] animate-ping`} title="Core Neural Operacional"></div>
                    )}
                </div>
            );
        }

        function App() {
            const [darkMode, setDarkMode] = React.useState(true);
            const [soundEnabled, setSoundEnabled] = React.useState(true);
            const [isSpeaking, setIsSpeaking] = React.useState(false);
            const [isListening, setIsListening] = React.useState(false);
            const [liveWeather, setLiveWeather] = React.useState(null);
            const [hourlyForecast, setHourlyForecast] = React.useState(null);
            
            // Abas de Navegação (Pill Navigation) para evitar que o usuário fique preso
            const [activeTab, setActiveTab] = React.useState("chat"); // "chat" | "radar" | "telemetry"
            
            const [termsOpen, setTermsOpen] = React.useState(false);
            const [toastMessage, setToastMessage] = React.useState(null);
            const [fontSizeScale, setFontSizeScale] = React.useState(100); // Zoom A- / A+
            
            const [termsAccepted, setTermsAccepted] = React.useState(
                () => localStorage.getItem("sarah_terms_accepted_v45") === "1"
            );
            const [check1, setCheck1] = React.useState(false);
            const [check2, setCheck2] = React.useState(false);

            const [messages, setMessages] = React.useState([]);
            const [input, setInput] = React.useState("");
            const [isLoadingChat, setIsLoadingChat] = React.useState(false);
            const [hasIntroduced, setHasIntroduced] = React.useState(
                () => localStorage.getItem("sarah_introduced_v45") === "1"
            );

            const speechIdRef = React.useRef(0);
            const voiceTimerRef = React.useRef(null);
            const voicesRef = React.useRef([]);
            const mapRef = React.useRef(null);
            const mapInstanceRef = React.useRef(null);
            const chartRef = React.useRef(null);
            const chartInstanceRef = React.useRef(null);

            const showToast = (msg) => {
                setToastMessage(msg);
                setTimeout(() => setToastMessage(null), 3500);
            };

            const carregarVozes = () => {
                if ("speechSynthesis" in window) {
                    voicesRef.current = window.speechSynthesis.getVoices();
                }
            };

            React.useEffect(() => {
                if (!("speechSynthesis" in window)) return;
                carregarVozes();
                window.speechSynthesis.onvoiceschanged = carregarVozes;
                return () => {
                    window.speechSynthesis.cancel();
                    window.speechSynthesis.onvoiceschanged = null;
                };
            }, []);

            const limparTextoParaFala = (text) => {
                return String(text)
                    .replace(/[#*_`~]/g, "")
                    .replace(/\[(.*?)\]\(.*?\)/g, "$1")
                    .replace(/https?:\/\/\S+/g, "")
                    .replace(/\s+/g, " ")
                    .trim();
            };

            const escolherMelhorVoz = () => {
                const voices = voicesRef.current.length
                    ? voicesRef.current
                    : window.speechSynthesis.getVoices();
                const preferidas = [
                    "Google português do Brasil",
                    "Google Português do Brasil",
                    "Microsoft Francisca",
                    "Microsoft Maria"
                ];
                return (
                    voices.find((voice) =>
                        preferidas.some((name) =>
                            voice.name.toLowerCase().includes(name.toLowerCase())
                        )
                    ) ||
                    voices.find((voice) => voice.lang.toLowerCase() === "pt-br") ||
                    voices.find((voice) => voice.lang.toLowerCase().startsWith("pt")) ||
                    voices[0]
                );
            };

            const stopSpeaking = () => {
                speechIdRef.current += 1;
                if (voiceTimerRef.current) {
                    clearTimeout(voiceTimerRef.current);
                    voiceTimerRef.current = null;
                }
                if ("speechSynthesis" in window) {
                    window.speechSynthesis.cancel();
                }
                setIsSpeaking(false);
            };

            const speakText = (text) => {
                if (!soundEnabled || !("speechSynthesis" in window)) return;
                const cleanText = limparTextoParaFala(text);
                if (!cleanText) return;
                stopSpeaking();
                const currentId = speechIdRef.current;
                voiceTimerRef.current = setTimeout(() => {
                    if (currentId !== speechIdRef.current) return;
                    const utterance = new SpeechSynthesisUtterance(cleanText);
                    const voice = escolherMelhorVoz();
                    utterance.lang = "pt-BR";
                    utterance.voice = voice || null;
                    utterance.rate = 0.96;
                    utterance.pitch = 1.0;
                    utterance.volume = 1;
                    utterance.onstart = () => {
                        if (currentId === speechIdRef.current) setIsSpeaking(true);
                    };
                    utterance.onend = () => {
                        if (currentId === speechIdRef.current) setIsSpeaking(false);
                    };
                    utterance.onerror = () => setIsSpeaking(false);
                    window.speechSynthesis.speak(utterance);
                }, 200);
            };

            React.useEffect(() => {
                if (!termsAccepted || hasIntroduced) return;
                const greeting = getBrasiliaGreeting();
                const presentation = `${greeting}, sou a SARAH, núcleo de inteligência artificial e monitoramento meteorológico da Defesa Civil de Mesquita. Sistemas de segurança ativados.`;
                const timer = setTimeout(() => {
                    if (!soundEnabled) return;
                    setHasIntroduced(true);
                    localStorage.setItem("sarah_introduced_v45", "1");
                    speakText(presentation);
                }, 700);
                return () => clearTimeout(timer);
            }, [termsAccepted, hasIntroduced, soundEnabled]);

            // Compartilhamento otimizado com ícone e link oficial
            const handleShareLink = async () => {
                const shareData = {
                    title: "SARAH AI Core v4.5 PRO - Defesa Civil Mesquita",
                    text: "Núcleo avançado de monitoramento meteorológico e Defesa Civil Comunitária - Sebinho / Mesquita RJ.",
                    url: window.location.href
                };
                if (navigator.share) {
                    try {
                        await navigator.share(shareData);
                        showToast("Aplicativo compartilhado com sucesso!");
                    } catch (error) {
                        console.log("Compartilhamento cancelado.");
                    }
                } else if (navigator.clipboard) {
                    await navigator.clipboard.writeText(window.location.href);
                    showToast("🔗 Link oficial e ícone copiados para a área de transferência!");
                }
            };

            React.useEffect(() => {
                fetch(
                    "https://api.open-meteo.com/v1/forecast" +
                    "?latitude=-22.7845&longitude=-43.4140" +
                    "&current=temperature_2m,relative_humidity_2m,precipitation,weather_code,wind_speed_10m" +
                    "&hourly=temperature_2m,precipitation_probability,precipitation"
                )
                    .then((response) => response.json())
                    .then((data) => {
                        if (data && data.current) {
                            setLiveWeather(data.current);
                        }
                        if (data && data.hourly) {
                            setHourlyForecast(data.hourly);
                        }
                    })
                    .catch((error) => {
                        console.warn("Clima indisponível:", error);
                    });
            }, []);

            React.useEffect(() => {
                document.documentElement.classList.toggle("dark", darkMode);
                document.documentElement.classList.toggle("light", !darkMode);
            }, [darkMode]);

            // Inicialização do Mapa Leaflet sem animações obstrutivas
            React.useEffect(() => {
                if (activeTab === "radar" && mapRef.current && !mapInstanceRef.current) {
                    const lat = -22.7845;
                    const lng = -43.4140;
                    const map = L.map(mapRef.current).setView([lat, lng], 13);
                    
                    L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
                        maxZoom: 19,
                        attribution: "© OpenStreetMap | SARAH AI Core v4.5"
                    }).addTo(map);

                    fetch('https://api.rainviewer.com/public/weather-maps.json')
                        .then(res => res.json())
                        .then(apiData => {
                            if (apiData && apiData.radar && apiData.radar.past && apiData.radar.past.length > 0) {
                                const latestFrame = apiData.radar.past[apiData.radar.past.length - 1];
                                L.tileLayer(`https://tile.rainviewer.com${latestFrame.path}/256/{z}/{x}/{y}/2/1_1.png`, {
                                    opacity: 0.75,
                                    attribution: 'Radar © RainViewer'
                                }).addTo(map);
                            }
                        })
                        .catch(err => console.warn("Camada de radar indisponível:", err));

                    L.marker([lat, lng])
                        .addTo(map)
                        .bindPopup("<div style='font-family:monospace; color:#0f172a;'><b>Setor Neural:</b> Sebinho / Rocha Sobrinho, Mesquita<br><i>Camada de satélite ativa.</i></div>")
                        .openPopup();

                    mapInstanceRef.current = map;
                }
                if (activeTab === "radar" && mapInstanceRef.current) {
                    setTimeout(() => {
                        mapInstanceRef.current?.invalidateSize();
                    }, 120);
                }
                if (activeTab !== "radar" && mapInstanceRef.current) {
                    mapInstanceRef.current.remove();
                    mapInstanceRef.current = null;
                }
            }, [activeTab]);

            // Inicialização do Gráfico Chart.js
            React.useEffect(() => {
                if (activeTab !== "telemetry" || !chartRef.current) return;

                if (chartInstanceRef.current) {
                    chartInstanceRef.current.destroy();
                    chartInstanceRef.current = null;
                }

                const ctx = chartRef.current.getContext("2d");
                const nowIndex = new Date().getHours();
                const labels = hourlyForecast && hourlyForecast.time 
                    ? hourlyForecast.time.slice(nowIndex, nowIndex + 8).map(t => t.split("T")[1]) 
                    : ["00:00", "03:00", "06:00", "09:00", "12:00", "15:00", "18:00", "21:00"];
                
                const tempData = hourlyForecast && hourlyForecast.temperature_2m 
                    ? hourlyForecast.temperature_2m.slice(nowIndex, nowIndex + 8) 
                    : [24, 23, 22, 25, 28, 29, 27, 25];

                chartInstanceRef.current = new Chart(ctx, {
                    type: "line",
                    data: {
                        labels: labels,
                        datasets: [
                            {
                                label: "Temperatura (°C)",
                                data: tempData,
                                borderColor: "#22d3ee",
                                backgroundColor: "rgba(34, 211, 238, 0.12)",
                                borderWidth: 3,
                                fill: true,
                                tension: 0.38,
                                pointBackgroundColor: "#020617",
                                pointBorderColor: "#22d3ee",
                                pointBorderWidth: 2.5,
                                pointRadius: 5
                            }
                        ]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        scales: {
                            y: {
                                grid: { color: darkMode ? "rgba(148, 163, 184, 0.08)" : "rgba(15, 23, 42, 0.08)" },
                                ticks: { color: darkMode ? "#94a3b8" : "#334155", font: { family: "monospace", size: 11 } }
                            },
                            x: {
                                grid: { color: darkMode ? "rgba(148, 163, 184, 0.08)" : "rgba(15, 23, 42, 0.08)" },
                                ticks: { color: darkMode ? "#94a3b8" : "#334155", font: { family: "monospace", size: 11 } }
                            }
                        },
                        plugins: {
                            legend: {
                                labels: { color: darkMode ? "#e2e8f0" : "#0f172a", font: { family: "monospace", size: 12 } }
                            }
                        }
                    }
                });

                return () => {
                    if (chartInstanceRef.current) {
                        chartInstanceRef.current.destroy();
                        chartInstanceRef.current = null;
                    }
                };
            }, [activeTab, hourlyForecast, darkMode]);

            const toggleListening = () => {
                const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
                if (!SpeechRec) {
                    showToast("⚠️ Reconhecimento de voz não suportado neste navegador.");
                    return;
                }
                if (isListening) {
                    setIsListening(false);
                    return;
                }
                const rec = new SpeechRec();
                rec.lang = "pt-BR";
                rec.interimResults = false;
                rec.continuous = false;
                rec.onstart = () => setIsListening(true);
                rec.onresult = (event) => {
                    const text = event.results[0][0].transcript;
                    setInput(text);
                    setIsListening(false);
                    handleSendMessage(text);
                };
                rec.onerror = () => setIsListening(false);
                rec.onend = () => setIsListening(false);
                rec.start();
            };

            const handleSendMessage = async (textCustom) => {
                stopSpeaking();
                const textToSend = textCustom !== undefined ? textCustom : input;
                if (!textToSend.trim() || isLoadingChat) return;

                const userMsg = {
                    id: `${Date.now()}-user`,
                    sender: "user",
                    text: textToSend.trim(),
                    timestamp: new Date().toLocaleTimeString("pt-BR", { hour: "2-digit", minute: "2-digit" })
                };

                const historico = [...messages, userMsg].slice(-8).map((message) => ({
                    role: message.sender === "user" ? "user" : "assistant",
                    content: message.text
                }));

                setMessages((previous) => [...previous, userMsg]);
                setInput("");
                setIsLoadingChat(true);

                const weatherContext = liveWeather
                    ? `Condições meteorológicas atuais em Mesquita/RJ (Open-Meteo): Temperatura ${liveWeather.temperature_2m}°C, Umidade ${liveWeather.relative_humidity_2m}%, Precipitação ${liveWeather.precipitation} mm, Vento ${liveWeather.wind_speed_10m} km/h.`
                    : "Dados meteorológicos temporariamente indisponíveis.";

                try {
                    const response = await fetch(CLOUDFLARE_WORKER_URL, {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({
                            model: "openai/gpt-oss-120b",
                            messages: [
                                {
                                    role: "system",
                                    content: `Você é a SARAH AI Core v4.5 PRO, núcleo cibernético avançado de monitoramento meteorológico preventivo e Defesa Civil Comunitária em Mesquita/RJ. ${weatherContext}

Responda em português do Brasil, de forma altamente técnica, clara, executiva e responsável.
Baseie-se estritamente em dados meteorológicos reais. Não invente medições.
Em situações de risco, oriente o usuário a procurar um local seguro e acionar a Defesa Civil pelo número 199.`
                                },
                                ...historico
                            ],
                            temperature: 0.4,
                            max_tokens: 900
                        })
                    });

                    const responseText = await response.text();
                    let data;
                    try {
                        data = JSON.parse(responseText);
                    } catch {
                        throw new Error("O Worker retornou uma resposta inválida.");
                    }

                    if (!response.ok) {
                        throw new Error(data?.error || `Erro do servidor (${response.status}).`);
                    }

                    const reply = data?.choices?.[0]?.message?.content || data?.message || data?.reply;
                    if (!reply) {
                        throw new Error("A IA não retornou uma mensagem.");
                    }

                    const assistantMsg = {
                        id: `${Date.now()}-assistant`,
                        sender: "sarah",
                        text: reply,
                        timestamp: new Date().toLocaleTimeString("pt-BR", { hour: "2-digit", minute: "2-digit" })
                    };

                    setMessages((previous) => [...previous, assistantMsg]);
                    speakText(reply);
                } catch (error) {
                    console.error("Erro na comunicação com Cloudflare/Groq:", error);
                    const fallbackReply = "Falha de enlace com o cofre de segurança neural. Verifique sua conexão com a rede.";
                    const errorMsg = {
                        id: `${Date.now()}-error`,
                        sender: "sarah",
                        text: fallbackReply,
                        timestamp: new Date().toLocaleTimeString("pt-BR", { hour: "2-digit", minute: "2-digit" })
                    };
                    setMessages((previous) => [...previous, errorMsg]);
                    speakText(fallbackReply);
                } finally {
                    setIsLoadingChat(false);
                }
            };

            return (
                <div 
                    className={`min-h-screen flex flex-col relative selection:bg-cyan-500 selection:text-slate-950 ${darkMode ? 'bg-slate-950 text-slate-100' : 'bg-slate-100 text-slate-900'}`}
                    style={{ fontSize: `${fontSizeScale}%` }}
                >
                    
                    {/* Toast Notification Moderno */}
                    {toastMessage && (
                        <div className="fixed top-20 left-1/2 -translate-x-1/2 z-50 bg-cyan-500 text-slate-950 px-6 py-3 rounded-2xl font-mono text-xs font-bold shadow-[0_0_25px_rgba(6,182,212,0.6)] border-2 border-cyan-200 animate-bounce">
                            {toastMessage}
                        </div>
                    )}

                    {/* Modal Termos de Responsabilidade - Exibido se não aceito */}
                    {!termsAccepted && (
                        <div className="fixed inset-0 bg-slate-950/92 backdrop-blur-2xl z-50 flex items-center justify-center p-4">
                            <div className="glass-dark w-full max-w-lg rounded-3xl shadow-[0_0_60px_rgba(6,182,212,0.3)] overflow-hidden flex flex-col max-h-[92vh] border border-cyan-500/40">
                                <div className="bg-slate-950 px-6 py-4 border-b border-cyan-500/30 flex items-center justify-between">
                                    <h3 className="font-mono text-cyan-400 text-sm font-bold flex items-center gap-2">

                                        🚨 Em caso de emergência iminente, acione imediatamente a Defesa Civil pelo número 199.
                                    </p>
                                </div>
                            </div>
                        </div>
                    )}

                    <footer className="bg-slate-950 border-t border-cyan-500/20 py-4 px-4 text-center text-xs font-mono text-slate-400 space-y-1 shadow-inner">
                        <div>Todos os direitos reservados 2024–2028 Grupo a Chave da Esperança Sebinho Mesquita RJ</div>
                        <div className="text-cyan-400 font-bold">Defesa Civil Comunitária Digital • SARAH AI Core v4.5 PRO</div>
                    </footer>
                </div>
            );
        }

        const root = ReactDOM.createRoot(getElementByIdOrFallback());
        function getElementByIdOrFallback() {
            let el = document.getElementById("root");
            if (!el) {
                el = document.createElement("div");
                el.id = "root";
                document.body.appendChild(el);
            }
            return el;
        }
        root.render(<App />);

        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js').catch(() => {});
            });
        }
    </script>
</body>
