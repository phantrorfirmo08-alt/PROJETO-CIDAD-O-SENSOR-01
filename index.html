                document.documentElement.classList.add('warm');

            const [l, setL] = React.useState("");

            const [historico, setHistorico] = React.useState("");
            const [levantamento, setLevantamento] = React.useState("");
            const [g, setG] = React.useState({ lk: '' });
            const [f, setF] = React.useState([0, 1, 2, 3].map(i => ({ file: null, prev: null })));

            const gps = () => navigator.geolocation.getCurrentPosition(p => {
                const lt = p.coords.latitude.toFixed(6);
                const ln = p.coords.longitude.toFixed(6);
                setG({ lk: `https://maps.google.com/?q=${lt},${ln}` });
                setL(`${lt},${ln}`);
                showToast("📍 GPS capturado com precisão!");
            }, () => showToast("⚠️ Erro ao capturar GPS. Verifique as permissões."));

            const comp = file => new Promise(r => {
                const rd = new FileReader();
                rd.readAsDataURL(file);
                rd.onload = e => {
                    const I = new Image();
                    I.src = e.target.result;
                    I.onload = () => {
                        let w = I.width, h = I.height, M = 1024;
                        if (w > h && w > M) { h = h * M / w; w = M; } else if (h > M) { w = w * M / h; h = M; }
                        const C = document.createElement('canvas');
                        C.width = w; C.height = h;
                        C.getContext('2d').drawImage(I, 0, 0, w, h);
                        C.toBlob(b => {
                            r({ file: new File([b], `vistoria_${Date.now()}.jpg`, { type: 'image/jpeg' }), prev: URL.createObjectURL(b) });
                        }, 'image/jpeg', 0.75);
                    };
                };
            });

            const onF = async (i, e) => {
                const file = e.target.files[0];
                if (!file) return;
                if (file.size > 20 * 1024 * 1024) { showToast("⚠️ Foto muito grande (>20MB)."); return; }
                const { file: fl, prev } = await comp(file);
                const n = [...f];
                if (n[i].prev) URL.revokeObjectURL(n[i].prev);
                n[i] = { file: fl, prev };
                setF(n);
                showToast(`📷 Foto ${i + 1} otimizada e comprimida com sucesso!`);

            const txt = () => `📊 *RELATÓRIO DE VISTORIA • SARAH IA NEXUS*\n🏛 *Setor:* ${s}\n👤 *Agente:* ${a || 'Não informado'}\n📍 *Coordenadas:* ${l || 'Não capturado'}\n${g.lk ? `🔗 *Mapa:* ${g.lk}\n` : ''}\n📝 *Laudo Técnico:* ${laudo || 'N/A'}\n📜 *Histórico:* ${historico || 'N/A'}\n🔍 *Levantamento de Campo:* ${levantamento || 'N/A'}\n\n📸 *Evidências Fotográficas:* ${f.filter(x => x.file).length}/4 anexadas`;

            const share = async () => {
                const t = txt();
                const fs = f.filter(x => x.file).map(x => x.file);
                if (navigator.canShare && navigator.canShare({ files: fs })) {
                    try {
                        await navigator.share({ text: t, files: fs });
                        showToast("🚀 Relatório e fotos enviados com sucesso!");
                        return;
                    } catch (e) { /* fallback */ }
                }
                open(`https://api.whatsapp.com/send?text=${encodeURIComponent(t)}`);
                showToast("📲 WhatsApp aberto com o relatório consolidado!");
            };

            return (

                        </div>

                        <div>
                            <label className="text-[10px] font-mono text-auroraCyan font-bold">Nome do Agente / Vistoriador</label>
                            <input value={a} onChange={e => setA(e.target.value)} placeholder="Ex: Agente Carlos Silva" className="w-full bg-void border border-auroraCyan/30 p-3 rounded-2xl text-xs text-white focus:outline-none mt-1"/>
                        </div>

                        <div>
                            <div className="flex justify-between items-center">
                                <label className="text-[10px] font-mono text-auroraCyan font-bold">Geolocalização (GPS)</label>
                                <button onClick={gps} className="px-3 py-1 bg-auroraCyan/20 hover:bg-auroraCyan text-auroraCyan hover:text-void border border-auroraCyan/40 rounded-xl font-bold text-[10px] cursor-pointer transition">📍 Capturar GPS</button>
                            </div>
                            <input value={l} onChange={e => setL(e.target.value)} placeholder="Latitude, Longitude" className="w-full bg-void border border-auroraCyan/30 p-3 rounded-2xl text-xs text-white focus:outline-none mt-1 font-mono"/>

                            <textarea value={laudo} onChange={e => setLaudo(e.target.value)} placeholder="Descreva o laudo da vistoria..." className="w-full bg-void border border-auroraCyan/30 p-3 rounded-2xl text-xs text-white resize-none focus:outline-none mt-1" rows="2"/>

                                <button type="submit" disabled={isProcessing || !input.trim()}

        function App() {
            const [theme, setTheme] = React.useState(() => { try { return localStorage.getItem("sarah-theme") || "dark"; } catch(e) { return "dark"; } });
            const [soundEnabled, setSoundEnabled] = React.useState(true);
            const [isSpeaking, setIsSpeaking] = React.useState(false);
            const [isListening, setIsListening] = React.useState(false);
            const [liveWeather, setLiveWeather] = React.useState(null);

            const [isLoadingSplash, setIsLoadingSplash] = React.useState(true);
            const [activeTab, setActiveTab] = React.useState("dashboard");
            const [radarOpen, setRadarOpen] = React.useState(false);

            const [shareModalOpen, setShareModalOpen] = React.useState(false);
            const [installModalOpen, setInstallModalOpen] = React.useState(false);
            const [toastMessage, setToastMessage] = React.useState(null);
            const [deferredPrompt, setDeferredPrompt] = React.useState(null);

            const [termsAccepted, setTermsAccepted] = React.useState(
                () => { try { return localStorage.getItem("sarah_terms_accepted_v52_lgpd") === "1"; } catch(e) { return false; } }

            const [check1, setCheck1] = React.useState(false);
            const [check2, setCheck2] = React.useState(false);

            const [isChatOpen, setIsChatOpen] = React.useState(false);
            const [input, setInput] = React.useState("");
            const [isProcessing, setIsProcessing] = React.useState(false);
            const [currentResponse, setCurrentResponse] = React.useState("Olá! Sou a SARA IA, núcleo inteligente da comunidade. Falo sobre fé, cultura, lazer, culinária, cidadania e prevenção. Toque no microfone para falar ou escreva sua pergunta.");
            const [hasIntroduced, setHasIntroduced] = React.useState(
                () => { try { return localStorage.getItem("sarah_introduced_v52") === "1"; } catch(e) { return false; } }

            const [saraTip, setSaraTip] = React.useState(null);

            const [marketingText, setMarketingText] = React.useState(() => {
                try { return localStorage.getItem("sarah_marketing_text_v52") || "JUNINHO DO MERCADINHO • Preços baixos é aqui"; } catch(e) { return "JUNINHO DO MERCADINHO • Preços baixos é aqui"; }
            });

            const [localVideos, setLocalVideos] = React.useState(() => {

            React.useEffect(() => {

            const speechIdRef = React.useRef(0);

                window.addEventListener('beforeinstallprompt', onPrompt);
                window.addEventListener('appinstalled', onInstalled);
                return () => {
                    window.removeEventListener('beforeinstallprompt', onPrompt);
                    window.removeEventListener('appinstalled', onInstalled);

            const handleInstallApp = async () => {
                if (deferredPrompt) {

                    showToast("⏳ Preparando instalação... tente de novo em instantes.");

                    setInstallModalOpen(true);
                }

            const carregarVozes = () => { if ("speechSynthesis" in window) { voicesRef.current = window.speechSynthesis.getVoices(); } };
            React.useEffect(() => {
                if (!("speechSynthesis" in window)) return;
                carregarVozes();
                window.speechSynthesis.onvoiceschanged = carregarVozes;
                return () => { window.speechSynthesis.cancel(); window.speechSynthesis.onvoiceschanged = null; };
            }, []);

            const limparTextoParaFala = (text) => {
                return String(text).replace(/([\u2700-\u27BF]|[\uE000-\uF8FF]|\uD83C[\uDC00-\uDFFF]|\uD83D[\uDC00-\uDFFF]|[\u2011-\u26FF]|\uD83E[\uDD00-\uDDFF])/g, '').replace(/\[(.*?)\]\(.*?\)/g, "$1").replace(/https?:\/\/\S+/g, "").replace(/\s+/g, " ").trim();
            };

            const escolherMelhorVoz = () => {
                const voices = voicesRef.current.length ? voicesRef.current : window.speechSynthesis.getVoices();
                return voices.find((voice) => voice.lang.toLowerCase().includes("pt")) || voices[0];
            };

            const stopSpeaking = () => {
                speechIdRef.current += 1;
                if (voiceTimerRef.current) { clearTimeout(voiceTimerRef.current); voiceTimerRef.current = null; }
                if ("speechSynthesis" in window) window.speechSynthesis.cancel();
                setIsSpeaking(false);
            };

            const speakText = (text) => {
                if (!soundEnabled || !("speechSynthesis" in window)) return;
                const cleanText = limparTextoParaFala(text);
                if (!cleanText) return;
                stopSpeaking();
                const currentId = speechIdRef.current;
                voiceTimerRef.current = setTimeout(() => {
                    if (currentId !== speechIdRef.current) return;
                    const utterance = new SpeechSynthesisUtterance(cleanText);
                    utterance.lang = "pt-BR";
                    utterance.voice = escolherMelhorVoz();
                    utterance.rate = 1.0;
                    utterance.onstart = () => { if (currentId === speechIdRef.current) setIsSpeaking(true); };
                    utterance.onend = () => { if (currentId === speechIdRef.current) setIsSpeaking(false); };
                    utterance.onerror = () => setIsSpeaking(false);
                    window.speechSynthesis.speak(utterance);
                }, 200);
            };

            React.useEffect(() => {
                if (!termsAccepted || hasIntroduced || isLoadingSplash) return;
                const greeting = getBrasiliaGreeting();
                const presentation = `${greeting}, sou a SARA IA NEXUS v6.0 AURORA. Toque no botão flutuante para falar comigo. Vou compartilhar reflexões, cultura, culinária e cidadania com você.`;
                const timer = setTimeout(() => {
                    if (!soundEnabled) return;
                    setHasIntroduced(true);
                    try { localStorage.setItem("sarah_introduced_v52", "1"); } catch(e) {}
                    speakText(presentation);
                }, 700);
                return () => clearTimeout(timer);
            }, [termsAccepted, hasIntroduced, soundEnabled, isLoadingSplash]);

            React.useEffect(() => {
                if (!termsAccepted || isLoadingSplash) return;
                const interval = setInterval(() => {
                    if (!soundEnabled || isProcessing || isListening || isChatOpen || isSpeaking) return;
                    const topic = SARA_TALK_TOPICS[topicIndexRef.current % SARA_TALK_TOPICS.length];
                    const line = topic.lines[Math.floor(Math.random() * topic.lines.length)];
                    const greeting = getBrasiliaGreeting();
                    const msg = `${greeting}! ${topic.icon} ${topic.tag}. ${line}`;
                    topicIndexRef.current += 1;
                    setSaraTip({ icon: topic.icon, tag: topic.tag, text: line });
                    speakText(msg);
                }, 180000);
                return () => clearInterval(interval);
            }, [termsAccepted, isLoadingSplash, soundEnabled, isProcessing, isListening, isChatOpen, isSpeaking]);

            const shareMessageText = `🛡️ *SARAH IA NEXUS v6.0 AURORA*\nDefesa Civil Comunitária • Projeto Cidadão Sensor\nCéu, Clima, Chuva, Vento & Bacias Hidrográficas\n\n⬇️ *INSTALE O APP AQUI:*\n${APP_SHARE_URL}\n\n🪪 Ícone oficial do app:\n${APP_ICON_URL}`;

            const openShareFromApp = async () => {
                const manifestData = { title: "SARAH IA NEXUS AURORA - Defesa Civil Comunitária", text: shareMessageText, url: APP_SHARE_URL };
                try {
                    const iconResp = await fetch(APP_ICON_URL);
                    const iconBlob = await iconResp.blob();
                    const iconFile = new File([iconBlob], "sarah-ia-nexus.png", { type: iconBlob.type || "image/jpeg" });
                    if (navigator.canShare && navigator.canShare({ files: [iconFile] })) {
                        await navigator.share({ title: manifestData.title, text: shareMessageText, files: [iconFile] });
                        showToast("📲 Compartilhado com ícone!");
                        return;
                    }
                } catch (e) { /* segue para o fallback */ }
                if (navigator.share) {
                    try { await navigator.share(manifestData); return; } catch (err) { if (err.name === 'AbortError') return; }
                }
                setShareModalOpen(true);
            };

            React.useEffect(() => {
                fetch('https://api.open-meteo.com/v1/forecast?latitude=-22.7831&longitude=-43.4294&current=temperature_2m,relative_humidity_2m,precipitation,weather_code,wind_speed_10m')
                    .then((res) => res.json())
                    .then((data) => { if (data && data.current) setLiveWeather(data.current); })
                    .catch((err) => console.warn("Clima indisponível:", err));
            }, []);

            React.useEffect(() => {
                try { localStorage.setItem("sarah-theme", theme); } catch(e) {}
                const metaTheme = document.querySelector('meta[name="theme-color"]');
                if (theme === 'warm') {
                    document.documentElement.classList.remove('dark');
                    document.documentElement.classList.add('warm');
                    if (metaTheme) metaTheme.setAttribute('content', '#F8F6F0');
                } else {
                    document.documentElement.classList.add('dark');
                    document.documentElement.classList.remove('warm');
                    if (metaTheme) metaTheme.setAttribute('content', '#05070F');
                }
            }, [theme]);

            const toggleTheme = () => {
                setTheme(prev => {
                    const next = prev === 'dark' ? 'warm' : 'dark';
                    showToast(next === 'warm' ? '🎨 Tema Comunitário Ativado' : '🌌 Modo Aurora Ativado');
                    return next;
                });
            };

            const toggleListening = () => {
                const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
                if (!SpeechRec) { showToast("⚠️ Reconhecimento de voz indisponível."); return; }
                if (isListening) { setIsListening(false); return; }
                try {
                    const rec = new SpeechRec();
                    rec.lang = "pt-BR";
                    rec.continuous = false;
                    rec.interimResults = true;
                    rec.onstart = () => { setIsListening(true); showToast("🎙 Ouvindo voz direta para a SARA..."); };
                    rec.onresult = (event) => {
                        let final = '';
                        for (let i = event.resultIndex; i < event.results.length; ++i) {
                            if (event.results[i].isFinal) final += event.results[i][0].transcript;
                        }
                        if (final) {
                            setInput(final);
                            setIsListening(false);
                            handleSendDirectCommand(final);
                        }
                    };
                    rec.onerror = () => { setIsListening(false); showToast("⚠ Erro no microfone."); };
                    rec.onend = () => { setIsListening(false); };
                    rec.start();
                } catch (e) { setIsListening(false); showToast("⚠️ Erro ao iniciar microfone."); }
            };

            const handleSendDirectCommand = async (textCustom) => {
                stopSpeaking();
                const textToSend = textCustom !== undefined ? textCustom : input;
                if (!textToSend.trim() || isProcessing) return;

                const queryText = textToSend.trim();
                setInput("");
                setIsProcessing(true);
                setCurrentResponse("🔄 SARA processando seu comando com o núcleo AURORA...");

                const weatherContext = liveWeather

                    : "Dados meteorológicos e atmosféricos ativos.";

                try {
                    const response = await fetch(CLOUDFLARE_WORKER_URL, {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({
                            model: "openai/gpt-oss-120b",
                            messages: [
                                {
                                    role: "system",
                                    content: `Você é a SARA IA NEXUS v6.0 AURORA, núcleo de inteligência da Defesa Civil Comunitária (Grupo A Chave da Esperança, Mesquita/RJ). Responda sempre diretamente para o usuário em voz viva e falada. Você também conversa sobre fé e religião, cultura, lazer, culinária e cidadania/política de forma positiva e comunitária. ${weatherContext}`
                                },
                                { role: "user", content: queryText }
                            ],
                            temperature: 0.5,
                            max_tokens: 300
                        })
                    });

                    if (response.status === 404) {
                        throw new Error("Erro 404: Endpoint de IA indisponível na rota configurada.");
                    }

                    const data = await response.json();
                    let reply = data?.choices?.[0]?.message?.content || data?.message || "Análise concluída com sucesso.";
                    reply = reply.replace(/#{1,6}\s?/g, '').replace(/\*\*/g, '').replace(/\|/g, ' ').replace(/---/g, '').trim();

                    setCurrentResponse(reply);
                    speakText(reply);

                    const fallback = error.message.includes("404")

                    setCurrentResponse(fallback);
                    speakText(fallback);
                } finally {
                    setIsProcessing(false);
                }
            };

            const openSarahChat = () => {
                setIsChatOpen(true);
                stopSpeaking();
                const greeting = getBrasiliaGreeting();
                speakText(`${greeting}! Aqui é a SARA IA, núcleo AURORA. Como posso ajudar você agora? Posso falar sobre clima, prevenção, fé, cultura, lazer, culinária ou cidadania.`);

                { id: 'admin', icon: '🔒', label: 'Admin' }
            ];

            return (

                            <div className="flex flex-col items-center space-y-6 max-w-sm w-full text-center">
                                <SarahHologramAvatar isLarge={true} isSpeaking={isSpeaking} />
                                <div className="space-y-2">
                                    <h2 className="font-display text-2xl font-black text-white tracking-[0.15em]">SARAH IA NEXUS <span className="bg-gradient-to-r from-auroraCyan to-auroraViolet bg-clip-text text-transparent">v6.0 AURORA</span></h2>
                                    <p className="text-xs text-slate-400 font-medium">Núcleo Conversacional & Comunitário</p>
                                    <p className="text-[11px] text-auroraMint font-bold">Grupo A Chave da Esperança (Mesquita/RJ)</p>
                                </div>
                                <div className="w-56 h-1.5 bg-panel rounded-full overflow-hidden border border-auroraViolet/30">
                                    <div className="h-full btn-aurora animate-pulse w-full"></div>
                                </div>
                            </div>

                    {toastMessage && (
                        <div className="fixed top-20 left-1/2 -translate-x-1/2 z-50 aurora-border px-6 py-3 rounded-2xl font-display text-[11px] font-black text-white tracking-wider shadow-2xl animate-bounce">
                            {toastMessage}
                        </div>
                    )}

                    {shareModalOpen && (
                        <div className="fixed inset-0 bg-void/90 backdrop-blur-xl z-50 flex items-center justify-center p-4">
                            <div className="aurora-border max-w-md w-full p-6 sm:p-8 rounded-[32px] space-y-4 text-center shadow-2xl">
                                <h3 className="font-display text-sm font-black text-auroraCyan tracking-widest">📲 COMPARTILHAR NEXUS</h3>
                                <textarea readOnly value={shareMessageText} className="w-full h-32 bg-void border border-auroraViolet/30 rounded-2xl p-3 text-xs text-slate-200 resize-none font-mono input-shadow" />
                                <div className="flex gap-3">
                                    <button onClick={() => { navigator.clipboard.writeText(shareMessageText); showToast("📋 Link copiado!"); setShareModalOpen(false); }} className="flex-1 py-3.5 btn-aurora text-void font-black rounded-2xl text-xs cursor-pointer btn-neo">Copiar Link</button>
                                    <button onClick={() => setShareModalOpen(false)} className="px-5 py-3.5 bg-alertRed/15 text-alertRed border border-alertRed/35 rounded-2xl text-xs font-bold">Fechar</button>
                                </div>
                            </div>
                        </div>
                    )}

                    {installModalOpen && (
                        <div className="fixed inset-0 bg-void/90 backdrop-blur-xl z-50 flex items-center justify-center p-4">
                            <div className="aurora-border max-w-md w-full p-6 sm:p-8 rounded-[32px] space-y-5 text-center shadow-2xl max-h-[88vh] overflow-y-auto">

                                </div>

                                {(() => {
                                    const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
                                    const isAndroid = /Android/.test(navigator.userAgent);

                                    if (isIOS) {
                                        return (

                                                {[
                                                    { n: "1", t: "Toque no ícone ⬆️ Compartilhar no Safari." },
                                                    { n: "2", t: "Toque em “Adicionar à Tela de Início”." },
                                                    { n: "3", t: "Confirme o nome e toque em “Adicionar”." }
                                                ].map((s, i) => (

                                                        <span className="shrink-0 w-6 h-6 rounded-full btn-aurora text-void font-display font-black text-[10px] flex items-center justify-center">{s.n}</span>
                                                        <p className="text-[11px] text-slate-200 leading-relaxed">{s.t}</p>
                                                    </div>
                                                ))}
                                            </div>
                                        );
                                    }

                                    if (isAndroid) {
                                        return (
                                            <div className="bg-void/85 border border-auroraMint/30 rounded-2xl p-4 space-y-3 text-left">
                                                <div className="text-[10px] font-display font-black text-auroraMint tracking-widest">🤖 ANDROID — INSTALAÇÃO DIRETA</div>
                                                <p className="text-[11px] text-slate-100 leading-relaxed">Feche esta janela e toque no botão <strong>📥</strong> no topo para instalar o app instantaneamente.</p>
                                            </div>
                                        );
                                    }

                                    return (
                                        <div className="bg-void/85 border border-auroraCyan/30 rounded-2xl p-4 space-y-2 text-left">
                                            <div className="text-[10px] font-display font-black text-auroraCyan tracking-widest">💻 COMPUTADOR</div>
                                            <p className="text-[11px] text-slate-200 leading-relaxed">Clique no ícone de instalação na barra de endereço ou no menu do navegador.</p>
                                        </div>
                                    );
                                })()}

                                <button onClick={() => { setInstallModalOpen(false); openShareFromApp(); }} className="w-full py-3.5 btn-aurora text-void font-black rounded-2xl text-xs uppercase tracking-widest cursor-pointer btn-neo shadow-xl">
                                    📲 Compartilhar App + Ícone + Link
                                </button>
                                <button onClick={() => setInstallModalOpen(false)} className="w-full py-3 bg-alertRed/15 text-alertRed border border-alertRed/35 rounded-2xl text-xs font-bold cursor-pointer">Fechar</button>
                            </div>
                        </div>
                    )}

                    {!termsAccepted && (
                        <div className="fixed inset-0 bg-void/95 z-[200] flex items-center justify-center p-4 overflow-y-auto">
                            <div className="aurora-border max-w-lg w-full p-6 sm:p-8 rounded-[36px] shadow-2xl space-y-5 my-auto">
                                <div className="text-center space-y-2">
                                    <div className="inline-flex p-3.5 rounded-3xl bg-auroraViolet/10 border border-auroraViolet/35 text-auroraViolet mb-1"><CyberShieldIcon className="w-9 h-9" /></div>
                                    <h2 className="font-display text-lg font-black text-white tracking-wide">TERMO DE RESPONSABILIDADES</h2>
                                    <p className="text-xs text-auroraCyan font-black uppercase tracking-widest">SARAH IA NEXUS v6.0 AURORA • LGPD</p>
                                </div>

                                <div className="space-y-2.5">
                                    {[
                                        { icon: "🛡️", title: "PILAR I — FINALIDADE E PREVENÇÃO", text: "Os dados coletados (GPS, fotos de vistoria e relatos) destinam-se exclusivamente ao monitoramento comunitário e à resposta da Defesa Civil." },
                                        { icon: "⚖️", title: "PILAR II — BASE LEGAL E TRANSPARÊNCIA", text: "O tratamento observa a Lei Federal nº 13.709/2018 (LGPD). O titular pode solicitar acesso, correção ou exclusão de seus dados." },
                                        { icon: "🔒", title: "PILAR III — SEGURANÇA E RESPONSABILIDADE", text: "O operador adota medidas técnicas de proteção. O usuário é responsável pela veracidade dos relatos e vistorias enviadas." }
                                    ].map((p, i) => (
                                        <div key={i} className="bg-void/85 p-4 rounded-2xl border border-auroraViolet/25 space-y-1">
                                            <div className="flex items-center gap-2 text-[10px] font-display font-black text-auroraViolet tracking-widest">
                                                <span>{p.icon}</span> {p.title}
                                            </div>
                                            <p className="text-[11px] text-slate-300 leading-relaxed">{p.text}</p>
                                        </div>
                                    ))}
                                </div>

                                <div className="space-y-3">
                                    <label className="flex items-start gap-3 cursor-pointer text-xs text-slate-300 bg-panel/60 p-3 rounded-xl border border-auroraViolet/20">
                                        <input type="checkbox" checked={check1} onChange={(e) => setCheck1(e.target.checked)} className="mt-0.5 rounded border-auroraViolet/50 text-auroraViolet w-4 h-4 bg-void shrink-0 cursor-pointer" />
                                        <span>Concordo com os Termos de Uso, Política de Privacidade e LGPD.</span>
                                    </label>
                                    <label className="flex items-start gap-3 cursor-pointer text-xs text-slate-300 bg-panel/60 p-3 rounded-xl border border-auroraViolet/20">
                                        <input type="checkbox" checked={check2} onChange={(e) => setCheck2(e.target.checked)} className="mt-0.5 rounded border-auroraViolet/50 text-auroraViolet w-4 h-4 bg-void shrink-0 cursor-pointer" />
                                        <span>Compreendo que a geolocalização (GPS) é essencial para as vistorias técnicas da Defesa Civil.</span>
                                    </label>
                                </div>

                                <button
                                    disabled={!check1 || !check2}
                                    onClick={() => {
                                        if (check1 && check2) {
                                            setTermsAccepted(true);
                                            try { localStorage.setItem("sarah_terms_accepted_v52_lgpd", "1"); } catch(e) {}
                                            showToast("🚀 Acesso liberado ao Sistema Nexus!");
                                        }
                                    }}
                                    className={`w-full py-4 rounded-2xl font-black text-xs uppercase tracking-widest shadow-xl transition cursor-pointer ${check1 && check2 ? 'btn-aurora text-void btn-neo' : 'bg-panel text-slate-500 cursor-not-allowed'}`}>
                                    Entrar no Sistema Nexus 🛡️
                                </button>
                            </div>
                        </div>
                    )}

                    <header className="sticky top-0 z-50 bg-void/90 backdrop-blur-2xl border-b border-auroraCyan/25">
                        <div className="max-w-4xl mx-auto px-4 py-3 flex items-center justify-between">
                            <div className="flex items-center gap-3">
                                <div className="w-10 h-10 rounded-2xl aurora-border flex items-center justify-center bg-void">
                                    <CyberShieldIcon className="w-6 h-6" />
                                </div>
                                <div>
                                    <div className="font-display font-black text-xs sm:text-sm tracking-[0.2em] text-white flex items-center gap-2">
                                        SARAH IA <span className="text-auroraCyan">v6.0 AURORA</span>
                                    </div>
                                    <div className="text-[9px] font-mono text-auroraViolet font-bold tracking-wider">
                                        DEFESA CIVIL COMUNITÁRIA • MESQUITA
                                    </div>
                                </div>
                            </div>
                            <div className="flex items-center gap-2">
                                {isInstallable && (
                                    <button onClick={handleInstallApp} className="px-3 py-1.5 btn-aurora text-void font-black rounded-xl text-[10px] cursor-pointer btn-neo shadow-md flex items-center gap-1.5">
                                        <span>📥</span> Instalar App
                                    </button>
                                )}
                                <button onClick={() => setRadarOpen(true)} className="px-3 py-1.5 bg-auroraCyan/20 hover:bg-auroraCyan text-auroraCyan hover:text-void border border-auroraCyan/40 rounded-xl font-bold text-[10px] cursor-pointer transition">
                                    🛰 Radar
                                </button>
                                <button onClick={toggleTheme} className="w-9 h-9 rounded-xl bg-panel border border-auroraViolet/30 text-auroraViolet flex items-center justify-center cursor-pointer transition hover:scale-105" title="Alternar Tema">
                                    {theme === 'dark' ? '☀️' : '🌙'}
                                </button>
                                <button onClick={openShareFromApp} className="w-9 h-9 rounded-xl bg-panel border border-auroraCyan/30 text-auroraCyan flex items-center justify-center cursor-pointer transition hover:scale-105" title="Compartilhar">
                                    🔗
                                </button>
                            </div>
                        </div>
                    </header>

                    <main className="flex-1 max-w-4xl w-full mx-auto p-4 space-y-6 relative z-10">
                        {activeTab === 'dashboard' && (
                            <div className="space-y-6 animate-panel-slide-up">
                                <div className="grid grid-cols-1 md:grid-cols-3 gap-6 items-center glass-panel p-6 rounded-[36px]">
                                    <div className="flex justify-center md:justify-start">
                                        <div onClick={openSarahChat} className="cursor-pointer transition hover:scale-105">
                                            <SarahHologramAvatar isLarge={false} isSpeaking={isSpeaking} />
                                        </div>
                                    </div>
                                    <div className="md:col-span-2 space-y-3 text-center md:text-left">
                                        <div className="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-auroraCyan/10 border border-auroraCyan/30 text-auroraCyan font-mono text-[10px]">
                                            <span className="w-2 h-2 rounded-full bg-auroraMint animate-ping"></span>
                                            SARA IA ONLINE • TOQUE PARA FALAR
                                        </div>
                                        <h1 className="font-display text-lg sm:text-xl font-black text-white tracking-wide">
                                            Sistema Consolidado de Prevenção Comunitária
                                        </h1>
                                        <p className="text-xs text-slate-300 leading-relaxed">
                                            Monitoramento 24h de bacias, emissão de alertas de Defesa Civil, vistorias técnicas e bate-papo interativo com a SARA.
                                        </p>
                                        <div className="flex flex-wrap gap-2 justify-center md:justify-start pt-1">
                                            <button onClick={openSarahChat} className="px-5 py-2.5 btn-aurora text-void font-black rounded-2xl text-xs cursor-pointer btn-neo shadow-lg">
                                                🎙️ Conversar com SARA
                                            </button>
                                            <button onClick={() => setActiveTab('relatorio')} className="px-5 py-2.5 bg-void border border-auroraCyan/40 hover:border-auroraCyan text-auroraCyan font-black rounded-2xl text-xs cursor-pointer btn-neo">
                                                📋 Fazer Vistoria
                                            </button>
                                        </div>
                                    </div>
                                </div>

                                <AutomatedObservatoryWidget marketingText={marketingText} />

                                {saraTip && (
                                    <div className="aurora-border p-5 rounded-[28px] bg-void/80 space-y-2 shadow-xl">
                                        <div className="flex items-center gap-2 text-[11px] font-display font-black text-auroraViolet">
                                            <span>{saraTip.icon}</span> {saraTip.tag} • REFLEXÃO DA SARA
                                        </div>
                                        <p className="text-xs text-slate-200 leading-relaxed italic">"{saraTip.text}"</p>
                                    </div>
                                )}
                            </div>
                        )}

                        {activeTab === 'radar' && <NativeHydroWindRadar isOpen={true} onToggle={() => setActiveTab('dashboard')} />}
                        {activeTab === 'relatorio' && <FieldReportModule onBackToDashboard={() => setActiveTab('dashboard')} showToast={showToast} />}
                        {activeTab === 'galeria' && <PublicVideoGallery localVideos={localVideos} onGoToDashboard={() => setActiveTab('dashboard')} />}
                        {activeTab === 'admin' && <AdminVaultModule localVideos={localVideos} setLocalVideos={setLocalVideos} marketingText={marketingText} setMarketingText={setMarketingText} showToast={showToast} onClose={() => setActiveTab('dashboard')} />}
                    </main>

                    {/* Botão flutuante da SARA posicionado próximo ao rodapé / cadeado */}
                    <SarahFabButton onOpen={openSarahChat} />

                    <SarahChatOverlay
                        isOpen={isChatOpen}
                        onClose={() => setIsChatOpen(false)}
                        isSpeaking={isSpeaking}
                        isProcessing={isProcessing}
                        currentResponse={currentResponse}
                        input={input}
                        setInput={setInput}
                        handleSendDirectCommand={handleSendDirectCommand}
                        toggleListening={toggleListening}
                        isListening={isListening}
                    />

                    <NativeHydroWindRadar isOpen={radarOpen} onToggle={() => setRadarOpen(prev => !prev)} />

                    <nav className="fixed bottom-0 left-0 right-0 z-50 bg-void/95 backdrop-blur-xl border-t border-auroraCyan/25 px-4 py-2">
                        <div className="max-w-md mx-auto flex items-center justify-around">
                            {NAV_TABS.map((tab) => {
                                const active = activeTab === tab.id;
                                return (
                                    <button
                                        key={tab.id}
                                        onClick={() => {
                                            if (tab.id === 'radar') { setRadarOpen(true); }
                                            else { setActiveTab(tab.id); setRadarOpen(false); }
                                        }}
                                        className={`flex flex-col items-center py-1.5 px-3 rounded-2xl transition cursor-pointer ${
                                            active ? 'text-auroraCyan bg-auroraCyan/10 border border-auroraCyan/30 shadow-[0_0_15px_rgba(34,211,238,0.3)]' : 'text-slate-400 hover:text-slate-200'
                                        }`}
                                    >
                                        {renderTabIcon(tab)}
                                        <span className="text-[9px] font-display font-black tracking-wider mt-1">{tab.label}</span>
                                    </button>
                                );
                            })}
                        </div>
                    </nav>
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
