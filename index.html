                            <stop offset="100%" stopColor="#FF9100"/>
                        </linearGradient>
                        <radialGradient id="gradAtomCore" cx="50%" cy="50%" r="50%">
                            <stop offset="0%" stopColor="#FFFFFF"/>
                            <stop offset="40%" stopColor="#00F2FE"/>
                            <stop offset="100%" stopColor="#041125"/>
                        </radialGradient>
                        <radialGradient id="gradAtomCyan" cx="35%" cy="35%" r="65%">
                            <stop offset="0%" stopColor="#E0FFFF"/>
                            <stop offset="60%" stopColor="#00F2FE"/>
                            <stop offset="100%" stopColor="#005B66"/>
                        </radialGradient>
                        <radialGradient id="gradAtomOrange" cx="35%" cy="35%" r="65%">
                            <stop offset="0%" stopColor="#FFF3E0"/>
                            <stop offset="60%" stopColor="#FF9100"/>
                            <stop offset="100%" stopColor="#7A4500"/>
                        </radialGradient>
                    </defs>
                </svg>
            );
        }

        function SarahAnimatedAvatar({ isSpeaking, sizeClass = "w-full max-w-[85px]" }) {
            return (
                <div className={`sarah-avatar-stage ${isSpeaking ? 'speaking' : ''} ${sizeClass}`}>
                    <div className="cyan-outer-boundary"></div>
                    <div className="wave-ring"></div>
                    <div className="wave-ring"></div>
                    <div className="wave-ring"></div>
                    <div className="avatar-aura"></div>
                    <div className="avatar-core-wrapper">
                        <div className="glass-overlay"></div>
                        <SarahVectorAvatar />
                    </div>
                </div>
            );
        }

        const MUNICIPIOS_92 = [
            {n:"Mesquita",lat:-22.78,lon:-43.43,ip:"10.10.21.15"},
            {n:"Duque de Caxias",lat:-22.78,lon:-43.31,ip:"10.10.23.14"},
            {n:"Nova Iguaçu",lat:-22.75,lon:-43.45,ip:"10.10.22.12"},
            {n:"Belford Roxo",lat:-22.76,lon:-43.39,ip:"10.10.60.09"},
            {n:"São João de Meriti",lat:-22.80,lon:-43.37,ip:"10.10.60.62"},
            {n:"Nilópolis",lat:-22.81,lon:-43.41,ip:"10.10.60.39"},
            {n:"Queimados",lat:-22.71,lon:-43.55,ip:"10.10.60.50"},
            {n:"Japeri",lat:-22.64,lon:-43.65,ip:"10.10.60.28"},
            {n:"Rio de Janeiro",lat:-22.90,lon:-43.17,ip:"10.10.11.10"}
        ];

        function EstacaoSobrevivenciaModuleV12({ showToast }) {
          const [estacaoSubTab, setEstacaoSubTab] = React.useState('telemetria');
          const [relatorioComparativo, setRelatorioComparativo] = React.useState(null);
          const [idxMun1, setIdxMun1] = React.useState(0); // Mesquita
          const [idxMun2, setIdxMun2] = React.useState(4); // São João de Meriti
          const [carregandoTelemetria, setCarregandoTelemetria] = React.useState(false);

          const carregarTelemetriaAvancada = async () => {
            setCarregandoTelemetria(true);
            showToast("Conectando às fontes oficiais de telemetria...");
            const res = await executarModuloRaru(idxMun1, idxMun2);
            if(res) {
              setRelatorioComparativo(res);
              showToast("Relatório de Telemetria Gerado!");
            } else {
              showToast("Falha ao consultar APIs meteorológicas.");
            }
            setCarregandoTelemetria(false);
          };

          useEffect(() => {
            if (estacaoSubTab === 'telemetria' && !relatorioComparativo) {
              carregarTelemetriaAvancada();
            }
          }, [estacaoSubTab]);

          return (
            <div className="space-y-4 font-mono w-full">
              <div className="cyber-card p-4 border border-cyberCyan/50 space-y-4 shadow-2xl">
                <div className="flex justify-between items-center border-b border-cyberCyan/30 pb-3 overflow-x-auto gap-2">
                  <div className="flex gap-2">
                    <button onClick={() => setEstacaoSubTab('telemetria')} className={`px-3.5 py-2 rounded-xl text-xs font-black cursor-pointer transition ${estacaoSubTab === 'telemetria' ? 'bg-cyberCyan text-void shadow-md' : 'bg-void border border-cyberCyan/30 text-cyberCyan'}`}>📡 Telemetria &amp; fontes</button>
                  </div>
                </div>

                {estacaoSubTab === 'telemetria' && (
                  <div className="space-y-3">
                    <div className="bg-void/90 p-3 rounded-xl border border-cyberCyan/40 space-y-3">
                      <span className="text-[10px] text-cyberCyan font-bold uppercase block">COMPARAÇÃO HIDROLÓGICA OPERACIONAL</span>
                      <div className="grid grid-cols-1 sm:grid-cols-2 gap-2 text-xs">
                        <div>
                          <label className="text-[9px] text-slate-400 block font-bold mb-1">MUNICÍPIO BASE 1</label>
                          <select value={idxMun1} onChange={e=>setIdxMun1(Number(e.target.value))} className="w-full bg-deepSpace border border-cyberCyan/40 rounded-xl p-2 text-white font-bold">
                            {RARU_MUNICIPIOS.map((m, i) => <option key={i} value={i}>{m.n} ({m.baciaId})</option>)}
                          </select>
                        </div>
                        <div>
                          <label className="text-[9px] text-slate-400 block font-bold mb-1">MUNICÍPIO COMPARATIVO 2</label>
                          <select value={idxMun2} onChange={e=>setIdxMun2(Number(e.target.value))} className="w-full bg-deepSpace border border-cyberCyan/40 rounded-xl p-2 text-white font-bold">
                            {RARU_MUNICIPIOS.map((m, i) => <option key={i} value={i}>{m.n} ({m.baciaId})</option>)}
                          </select>
                        </div>
                      </div>
                      <button onClick={carregarTelemetriaAvancada} disabled={carregandoTelemetria} className="w-full py-2.5 cyber-button font-black rounded-xl text-xs uppercase cursor-pointer shadow-md">
                        {carregandoTelemetria ? "PROCESSANDO MODELO..." : "ATUALIZAR TELEMETRIA OPERACIONAL"}
                      </button>
                    </div>

                    {relatorioComparativo && (
                      <div className="space-y-3 text-xs">
                        <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                          <div className="bg-deepSpace/95 p-3 rounded-xl border border-cyberCyan/40 space-y-1 shadow-inner">
                            <div className="flex justify-between items-center">
                              <b className="text-cyberCyan">{relatorioComparativo.municipio1.nome}</b>
                              <span className="text-[9px] bg-cyberCyan/20 text-cyberCyan px-2 py-0.5 rounded-full font-bold">{relatorioComparativo.municipio1.ip}</span>
                            </div>
                            <p className="text-[9px] text-slate-400">{relatorioComparativo.municipio1.bacia}</p>
                            <div className="pt-1.5 space-y-0.5 text-slate-200">
                              <p>🌡️ Temp: <b>{relatorioComparativo.municipio1.temperatura}°C</b></p>
                              <p>🌧️ Chuva: <b>{relatorioComparativo.municipio1.chuvaEstimadaMm} mm</b></p>
                              <p>📡 dBZ Estimado: <b className="text-cyberGreen">{relatorioComparativo.municipio1.dbzIndiretoEstimado} dBZ</b></p>
                              <p>💨 Vento: {relatorioComparativo.municipio1.ventoVelocidade} km/h</p>
                            </div>
                          </div>

                          <div className="bg-deepSpace/95 p-3 rounded-xl border border-cyberCyan/40 space-y-1 shadow-inner">
                            <div className="flex justify-between items-center">
                              <b className="text-cyberCyan">{relatorioComparativo.municipio2.nome}</b>
                              <span className="text-[9px] bg-cyberCyan/20 text-cyberCyan px-2 py-0.5 rounded-full font-bold">{relatorioComparativo.municipio2.ip}</span>
                            </div>
                            <p className="text-[9px] text-slate-400">{relatorioComparativo.municipio2.bacia}</p>
                            <div className="pt-1.5 space-y-0.5 text-slate-200">
                              <p>🌡️ Temp: <b>{relatorioComparativo.municipio2.temperatura}°C</b></p>
                              <p>🌧️ Chuva: <b>{relatorioComparativo.municipio2.chuvaEstimadaMm} mm</b></p>
                              <p>📡 dBZ Estimado: <b className="text-cyberGreen">{relatorioComparativo.municipio2.dbzIndiretoEstimado} dBZ</b></p>
                              <p>💨 Vento: {relatorioComparativo.municipio2.ventoVelocidade} km/h</p>
                            </div>
                          </div>
                        </div>

                        <div className="bg-void p-3 rounded-xl border border-cyberRose/40 space-y-1.5">
                          <b className="text-cyberRose text-[10px] uppercase font-bold block">⚠️ SALVAGUARDA LEGAL & FONTES OPERACIONAIS</b>
                          <p className="text-[9px] text-slate-300 leading-relaxed">{relatorioComparativo.emergencia.avisoLegal}</p>
                          <div className="pt-1 border-t border-cyberRose/20 text-[8px] text-slate-400 space-y-0.5">
                            {relatorioComparativo.emergencia.fontesOficiais.map((f, i) => <div key={i}>• {f}</div>)}
                          </div>
                        </div>
                      </div>
                    )}
                  </div>
                )}
              </div>
            </div>
          );
        }

        function App() {
            const [toastMsgRef, setToastMsgRef] = React.useState(null);
            const showToast = (msg) => { setToastMsgRef(msg); setTimeout(() => setToastMsgRef(null), 3500); };

            return (
                <div className="seu-container-raru">
                    {toastMsgRef && <div className="fixed top-6 left-1/2 -translate-x-1/2 z-50 cyber-card px-4 py-2 rounded-2xl font-display text-[10px] font-black text-cyberCyan tracking-wider shadow-2xl border border-cyberCyan/60 animate-bounce">{toastMsgRef}</div>}
                    <header className="py-3 text-center">
                      <h1 className="font-display text-sm font-black text-white uppercase tracking-widest">RARU NEXUS AI V11 Plus</h1>
                      <p className="text-[9px] text-cyberCyan font-bold">MÓDULO DE TELEMETRIA E FONTES DE EMERGÊNCIA</p>
                    </header>
                    <main className="py-2">
                        <EstacaoSobrevivenciaModuleV12 showToast={showToast} />
                    </main>
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
