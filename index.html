        function playChameleonSound() {
            try {
                const AudioCtx = window.AudioContext || window.webkitAudioContext;
                if (!AudioCtx) return;
                const ctx = new AudioCtx();
                if (ctx.state === 'suspended') ctx.resume();

                const bufferSize = ctx.sampleRate * 1.2;
                const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
                const data = buffer.getChannelData(0);
                for (let i = 0; i < bufferSize; i++) {
                    data[i] = (Math.random() * 2 - 1) * Math.sin(i / 800);
                }

                const noiseSource = ctx.createBufferSource();
                noiseSource.buffer = buffer;

                const filter = ctx.createBiquadFilter();
                filter.type = 'lowpass';
                filter.frequency.setValueAtTime(350, ctx.currentTime);
                filter.frequency.exponentialRampToValueAtTime(120, ctx.currentTime + 1.2);

                const gainNode = ctx.createGain();
                gainNode.gain.setValueAtTime(0.8, ctx.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 1.2);

                noiseSource.connect(filter);
                filter.connect(gainNode);
                gainNode.connect(ctx.destination);

                noiseSource.start();
            } catch (e) {
                console.log("Áudio bloqueado:", e);
            }
        }

            const protocolo = React.useMemo(() => `CPRCA-RRD92-${municipio.substring(0,3).toUpperCase()}-2026-${Math.floor(1000 + Math.random() * 9000)}`, [municipio]);
            const getFinal = () => equipe.trim() ? `${setor} | ${equipe.trim()}` : setor;

            React.useEffect(() => {
                const calcularHash = async () => {
                    try {
                        const s = municipio + setor + equipe + nivel + agente + local + desc + protocolo + JSON.stringify(oc);
                        const hb = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(s));
                        setHash(Array.from(new Uint8Array(hb)).map(b => b.toString(16).padStart(2, '0')).join('').substring(0, 32) + "...");
                    } catch (e) {
                        setHash("sha256-ok");
                    }
                };
                calcularHash();
            }, [municipio, setor, equipe, nivel, agente, local, desc, protocolo, oc]);

            const capturarGps = () => {
                if (!navigator.geolocation) return showToast("⚠️ Geolocalização não suportada");
                showToast("🛰 Buscando GPS...");
                navigator.geolocation.getCurrentPosition(
                    (p) => {
                        const lt = p.coords.latitude.toFixed(6);

                        setGps({ lt, ln, lk: `https://www.google.com/maps?q=${lt},${ln}` });

                    () => setGpsSt("⚠ Erro ao obter GPS"),
                    { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
                );
            };

            const processar = (file, gpsInfo, ag, loc, eqFinal, muni) => new Promise((res, rej) => {
                const rd = new FileReader();
                rd.readAsDataURL(file);
                rd.onload = (e) => {
                    const img = new Image();
                    img.src = e.target.result;
                    img.onload = () => {
                        const cv = document.createElement('canvas');
                        const MAX = 600;
                        let w = img.width, h = img.height;
                        if (w > MAX || h > MAX) {
                            if (w > h) { h = Math.round(h * MAX / w); w = MAX; }
                            else { w = Math.round(w * MAX / h); h = MAX; }
                        }
                        cv.width = w;
                        cv.height = h;
                        const ctx = cv.getContext('2d');
                        ctx.drawImage(img, 0, 0, w, h);

                        const dt = new Date().toLocaleString('pt-BR');
                        const ct = gpsInfo.lt ? `${gpsInfo.lt},${gpsInfo.ln}` : loc;
                        let sigla = "CPRCA";

                        ctx.fillRect(0, h - bh, w, bh);
                        ctx.fillStyle = '#00F2FE';
                        ctx.fillRect(0, h - bh, w, 2);
                        ctx.font = `bold ${fs}px monospace`;
                        
                        let y = h - bh + pad + fs;
                        ctx.fillStyle = '#00F2FE';
                        ctx.fillText(`📅 ${dt} | ${muni}-RJ | ${sigla}`.slice(0, 80), pad, y);
                        ctx.fillStyle = '#fff';
                        ctx.fillText(`📍 ${ct}`.slice(0, 85), pad, y + lh);
                        ctx.fillStyle = '#94A3B8';
                        ctx.fillText(`👤 ${ag || 'Campo'}`.slice(0, 80), pad, y + lh * 2);

                        cv.toBlob((b) => {
                            const f = new File([b], `vistoria_${Date.now()}.jpg`, { type: 'image/jpeg' });
                            res({ compressedFile: f, preview: cv.toDataURL('image/jpeg', 0.5) });
                        }, 'image/jpeg', 0.5);
                    };
                    img.onerror = () => rej(new Error("Falha ao carregar imagem"));

            const handleUploadVideo = (e) => {
                const files = Array.from(e.target.files);
                if (files.length === 0) return;

                files.forEach(file => {
                    showToast(`🔄 Salvando "${file.name}"...`);
                    const reader = new FileReader();
                    reader.onload = (uploadEvt) => {
                        const base64Data = uploadEvt.target.result;
                        const newVid = { 
                            id: Date.now() + Math.random(), 
                            title: file.name, 
                            url: base64Data, 
                            date: new Date().toLocaleDateString('pt-BR'),
                            isPinned: true 
                        };
                        
                        setLocalVideos(prev => {
                            const updated = [newVid, ...prev];
                            try { localStorage.setItem("cparc_videos_permanent", JSON.stringify(updated)); } catch(err) {}
                            return updated;
                        });
                        showToast(`📹 Vídeo "${file.name}" salvo com sucesso!`);
                    };
                    reader.readAsDataURL(file);
                });
                e.target.value = "";
            };

            const handleDeleteVideo = (id, title) => {
                if (confirm(`Excluir "${title}"?`)) {
                    setLocalVideos(prev => {
                        const updated = prev.filter(v => v.id !== id);
                        try { localStorage.setItem("cparc_videos_permanent", JSON.stringify(updated)); } catch(err) {}

                stopSpeaking();
                const greeting = getBrasiliaGreeting();
                speakText(`${greeting}! SARAH AI NEXUS V8.4.2 PRO pronta na CPRCA. Como posso auxiliar?`);
            };

            const NAV_TABS = [
                { id: 'dashboard', iconComponent: <HomeCommandIcon className="w-5 h-5" />, label: 'Painel' },
                { id: 'estacao', iconComponent: <SurvivalStationIcon className="w-5 h-5" />, label: 'Estação' },
                { id: 'modulo1', iconComponent: <span className="text-sm">🌪️</span>, label: 'Módulo 1' },
                { id: 'modulo2', iconComponent: <span className="text-sm">📡</span>, label: 'Cidadão' },
                { id: 'radar', iconComponent: <RadarScanIcon className="w-5 h-5" />, label: 'Radar' },
                { id: 'relatorio', iconComponent: <FieldReportIcon className="w-5 h-5" />, label: 'Vistoria' },
                { id: 'galeria', iconComponent: <StreamVideoIcon className="w-5 h-5" />, label: 'Vídeos' },
                { id: 'admin', iconComponent: <AdminVaultIcon className="w-5 h-5" />, label: 'Admin' }
            ];

            return (
                <div className="min-h-screen flex flex-col relative text-slate-100 antialiased items-center justify-start">
                    {showSplash && (
                        <AppSplashScreen 
                            splashImageUrl={SPLASH_IMAGE_URL} 
                            onFinish={() => setShowSplash(false)} 
                        />
                    )}

                    {toastMessage && (
                        <div className="fixed top-20 left-1/2 -translate-x-1/2 z-50 cyber-card px-6 py-3 rounded-2xl font-display text-[11px] font-black text-cyberCyan tracking-wider shadow-2xl border border-cyberCyan/50 animate-bounce">
                            {toastMessage}
                        </div>
                    )}

                    {shareModalOpen && (
                        <div className="fixed inset-0 bg-void/90 backdrop-blur-xl z-50 flex items-center justify-center p-4">
                            <div className="cyber-card max-w-md w-full p-6 sm:p-8 rounded-[32px] space-y-4 text-center shadow-2xl border border-cyberCyan/40">
                                <h3 className="font-display text-sm font-black text-cyberCyan tracking-widest">📲 COMPARTILHAR A CPRCA</h3>
                                <div className="flex justify-center my-3">
                                    <img src={SHARE_ICON_SVG_DATAURI} alt="Ícone SVG CPRCA" className="w-24 h-24 rounded-2xl border border-cyberCyan/50 shadow-[0_0_20px_rgba(0,242,254,0.4)] object-contain bg-void p-1" />
                                </div>
                                <textarea readOnly value={shareMessageText} className="w-full h-28 bg-void border border-cyberCyan/30 rounded-2xl p-3 text-xs text-slate-200 resize-none font-mono shadow-inner" />
                                <div className="flex gap-3">
                                    <button onClick={() => { navigator.clipboard.writeText(shareMessageText); showToast("📋 Link e mensagem copiados!"); setShareModalOpen(false); }} className="flex-1 py-3.5 cyber-button font-black rounded-2xl text-xs cursor-pointer shadow-lg">Copiar Tudo</button>
                                    <button onClick={() => setShareModalOpen(false)} className="px-5 py-3.5 bg-cyberRose/20 text-cyberRose border border-cyberRose/40 rounded-2xl text-xs font-bold cursor-pointer">Fechar</button>
                                </div>
                            </div>
                        </div>
                    )}

                    {installModalOpen && (
                        <div className="fixed inset-0 bg-void/90 backdrop-blur-xl z-50 flex items-center justify-center p-4">
                            <div className="cyber-card max-w-md w-full p-6 sm:p-8 rounded-[32px] space-y-5 text-center shadow-2xl border border-cyberCyan/40 max-h-[88vh] overflow-y-auto">
                                <div className="flex flex-col items-center space-y-2">
                                    <div className="w-24 h-24 rounded-[26px] overflow-hidden border-2 border-cyberCyan/60 shadow-[0_0_40px_rgba(0,242,254,0.4)] bg-void p-1 flex items-center justify-center">
                                        <img src={SHARE_ICON_SVG_DATAURI} alt="Ícone SVG" className="w-full h-full object-contain" />
                                    </div>
                                    <h3 className="font-display text-sm font-black text-cyberCyan tracking-widest">INSTALAR APLICATIVO</h3>
                                    <p className="text-[10px] font-mono text-cyberGreen font-bold tracking-wider">92 Municípios • RJ</p>
                                </div>
                                <button onClick={() => { setInstallModalOpen(false); openShareFromApp(); }}
                                    className="w-full py-3.5 cyber-button font-black rounded-2xl text-xs uppercase tracking-widest cursor-pointer shadow-xl">
                                    📲 Compartilhar CPRCA + Ícone SVG
                                </button>
                                <button onClick={() => setInstallModalOpen(false)}
                                    className="w-full py-3 bg-cyberRose/20 text-cyberRose border border-cyberRose/40 rounded-2xl text-xs font-bold cursor-pointer">
                                    Fechar
                                </button>
                            </div>
                        </div>
                    )}

                    {!termsAccepted && (
                        <div className="fixed inset-0 bg-void/95 z-[200] flex items-center justify-center p-4 overflow-y-auto">
                            <div className="cyber-card max-w-lg w-full p-6 sm:p-8 rounded-[36px] shadow-2xl space-y-5 my-auto border border-cyberCyan/50">
                                <div className="text-center space-y-2">
                                    <h2 className="font-display text-2xl font-black text-white tracking-[0.2em] animate-maluco-glow">SARAH AI NEXUS V8.4.2 PRO</h2>
                                    <p className="text-xs text-cyberCyan font-black uppercase tracking-widest">NUPDECs • 92 Municípios do Rio de Janeiro</p>
                                </div>

                                <div className="space-y-2.5">
                                    <div className="bg-void/90 p-4 rounded-2xl border border-cyberCyan/20 space-y-1">
                                        <div className="text-[10px] font-display font-black text-cyberCyan tracking-widest">
                                            🛡️ SARAH AI NEXUS V8.4.2 PRO • VISTORIAS E RRD-92
                                        </div>
                                        <p className="text-[11px] text-slate-300 leading-relaxed">Central estadual com assistente inteligente SARAH AI NEXUS para apoio integrado em todos os 92 municípios fluminenses.</p>
                                    </div>
                                </div>

                                <div className="space-y-3">
                                    <label className="flex items-start gap-3 cursor-pointer text-xs text-slate-300 bg-commandPanel/80 p-3.5 rounded-xl border border-cyberCyan/20">
                                        <input type="checkbox" checked={check1} onChange={(e) => setCheck1(e.target.checked)} className="mt-0.5 rounded border-cyberCyan/50 text-cyberCyan w-4 h-4 bg-void shrink-0 cursor-pointer" />
                                        <span>Concordo com os princípios de solidariedade e transparência da CPRCA e NUPDECs RJ.</span>
                                    </label>
                                    <label className="flex items-start gap-3 cursor-pointer text-xs text-slate-300 bg-commandPanel/80 p-3.5 rounded-xl border border-cyberCyan/20">
                                        <input type="checkbox" checked={check2} onChange={(e) => setCheck2(e.target.checked)} className="mt-0.5 rounded border-cyberCyan/50 text-cyberCyan w-4 h-4 bg-void shrink-0 cursor-pointer" />
                                        <span>Autorizo o uso de geolocalização para registro das vistorias de campo.</span>
                                    </label>
                                </div>

                                <button disabled={!check1 || !check2} onClick={() => { setTermsAccepted(true); try { localStorage.setItem("cparc_terms_accepted", "1"); } catch(e) {} showToast("🚀 CPRCA & NUPDECs Ativos!"); }} className={`w-full py-4 rounded-2xl font-display font-black text-xs uppercase tracking-[0.2em] transition shadow-2xl ${check1 && check2 ? 'cyber-button font-black cursor-pointer' : 'bg-commandPanel text-slate-500 cursor-not-allowed'}`}>
                                    Entrar com CHAVE CLIMÁTICA & NUPDECs
                                </button>
                            </div>
                        </div>
                    )}

                    <header className="cyber-card sticky top-0 z-30 w-full max-w-3xl px-4 sm:px-6 py-3.5 border-b border-cyberCyan/30 flex items-center justify-between shadow-2xl rounded-b-2xl">
                        <div className="flex items-center gap-3">
                            <div className={`w-11 h-11 rounded-2xl cyber-border-glow flex items-center justify-center bg-void shadow-[0_0_30px_rgba(0,242,254,0.5)] overflow-hidden border border-cyberCyan ${isSpeaking ? 'animate-hud-pulse' : ''}`}>
                                <img src={SARAH_CUSTOM_AVATAR_URL} alt="SARAH AI" className="w-full h-full object-cover" />
                            </div>
                            <div>
                                <h1 className="font-display text-[11px] sm:text-xs font-black text-white tracking-[0.06em] animate-maluco-glow">SARAH AI NEXUS V8.4.2 PRO</h1>
                                <p className="text-[9px] text-cyberCyan font-mono font-bold tracking-wider uppercase">
                                    {chameleonActive ? "🦎 CAMALEÃO ATIVO" : "DEFESA CIVIL COMUNITÁRIA • MESQUITA/RJ"}
                                </p>
                            </div>
                        </div>
                        <div className="flex items-center gap-2">
                            <button 
                                onClick={() => {
                                    setChameleonActive(!chameleonActive);
                                    if (!chameleonActive && soundEnabled) playChameleonSound();
                                    showToast(chameleonActive ? "🔄 Modo Padrão Restabelecido" : "🦎 Efeito Camaleão Testado!");
                                }}
                                className={`px-2.5 py-1.5 rounded-xl border text-[9px] font-bold cursor-pointer transition ${chameleonActive ? 'bg-emerald-500/20 border-emerald-400 text-emerald-300' : 'bg-cyberCyan/20 border-cyberCyan text-cyberCyan'}`}
                                title="Testar Efeito Camaleão Manualmente"
                            >
                                {chameleonActive ? "🦎 Camaleão ON" : "🦎 Camaleão"}
                            </button>
                            <IconeSomToggle soundEnabled={soundEnabled} setSoundEnabled={setSoundEnabled} />
                            <IconeTemaToggle theme={theme} toggleTheme={toggleTheme} />
                            <IconeCompartilharTopo openShareFromApp={openShareFromApp} />
                            <IconeInstalarApp handleInstallApp={handleInstallApp} isInstallable={isInstallable} />
                        </div>
                    </header>

                    <nav className="cyber-card w-full max-w-3xl border-b border-cyberCyan/30 px-4 py-2.5 flex items-center justify-center gap-2 overflow-x-auto z-20">
                        {NAV_TABS.map(tab => (
                            <button key={tab.id} onClick={() => tab.id === 'radar' ? setRadarOpen(true) : setActiveTab(tab.id)}
                                className={`px-4 py-2 rounded-2xl text-[11px] font-black transition cursor-pointer flex items-center gap-2 shrink-0 tracking-wider ${
                                    activeTab === tab.id
                                        ? 'cyber-button font-black shadow-[0_0_25px_rgba(255,153,0,0.5)]'
                                        : 'bg-commandPanel text-slate-300 border border-cyberCyan/20'
                                }`}>
                                {tab.iconComponent} {tab.label}
                            </button>
                        ))}
                    </nav>

                    <main className="flex-1 w-full max-w-3xl mx-auto p-4 sm:p-6 space-y-5 pb-36 relative z-10">
                        {activeTab === 'dashboard' && (
                            <div className="space-y-5">
                                <div className="cyber-card p-6 sm:p-8 rounded-[36px] shadow-[0_0_70px_rgba(0,242,254,0.45)] space-y-6 text-center border-2 border-cyberCyan/80">
                                    <SarahHologramAvatar isLarge={true} isSpeaking={isSpeaking} />

                                    <div className="space-y-2">
                                        <div className="inline-flex items-center px-4 py-1.5 rounded-full bg-cyberCyan/15 border border-cyberCyan/35 font-mono text-[10px] text-cyberCyan tracking-widest shadow-inner">
                                            NUPDECs • 92 MUNICÍPIOS DO RIO DE JANEIRO
                                        </div>
                                        <h2 className="font-display text-sm font-black text-white tracking-wide">CHAVE CLIMÁTICA • Central Pública de Resiliência Comunitária Automatizada (CPRCA)</h2>
                                        <p className="text-xs text-slate-300 font-medium italic">
                                            "SARAH AI NEXUS V8.4.2 PRO • Abrangência total nos 92 municípios do RJ com NUPDECs e suporte técnico."
                                        </p>
                                    </div>

                                    <div className="flex flex-col sm:flex-row items-center justify-center gap-3 w-full max-w-md mx-auto">
                                        <button onClick={openSarahChat} className="flex-1 w-full flex items-center justify-center gap-3 py-4 px-6 rounded-[26px] cyber-button font-display font-black text-xs uppercase tracking-[0.15em] shadow-[0_0_50px_rgba(255,153,0,0.6)] cursor-pointer">
                                            <svg className="w-5 h-5 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
                                            <span>FALAR COM A SARAH AI</span>
                                        </button>
                                        <button onClick={handleWhoAmIClick} className="w-full sm:w-auto flex items-center justify-center gap-2 py-4 px-5 rounded-[26px] bg-gradient-to-r from-teal-500 to-cyan-500 text-void font-display font-black text-xs uppercase tracking-[0.15em] shadow-[0_0_30px_rgba(0,242,254,0.5)] cursor-pointer transition hover:scale-105">
                                            <span>Quem Somos</span>
                                        </button>
                                    </div>

                                    <div className="flex flex-wrap justify-center gap-2">
                                        <button onClick={() => setActiveTab('estacao')} className="px-4 py-2 bg-void border border-cyberCyan/30 hover:border-cyberCyan text-cyberCyan rounded-2xl text-[11px] font-bold transition cursor-pointer">🌡️ Estação de Sobrevivência</button>
                                        <button onClick={() => setActiveTab('modulo1')} className="px-4 py-2 bg-void border border-cyberCyan/30 hover:border-cyberCyan text-cyberCyan rounded-2xl text-[11px] font-bold transition cursor-pointer">🌪️ Módulo 1: El Niño</button>
                                        <button onClick={() => setActiveTab('relatorio')} className="px-4 py-2 bg-void border border-cyberCyan/30 hover:border-cyberCyan text-cyberCyan rounded-2xl text-[11px] font-bold transition cursor-pointer">📋 Vistorias NUPDECs</button>
                                    </div>
                                </div>
                            </div>
                        )}

                        {activeTab === 'estacao' && <EstacaoSobrevivenciaModule onGoToDashboard={() => setActiveTab('dashboard')} showToast={showToast} />}
                        {activeTab === 'modulo1' && <ModuloElNinoModule onGoToDashboard={() => setActiveTab('dashboard')} />}
                        {activeTab === 'modulo2' && <ModuloCidadaoSensorModule onGoToDashboard={() => setActiveTab('dashboard')} />}
                        {activeTab === 'relatorio' && <FieldReportModule onBackToDashboard={() => setActiveTab('dashboard')} showToast={showToast} />}
                        {activeTab === 'galeria' && <PublicVideoGallery localVideos={localVideos} onGoToDashboard={() => setActiveTab('dashboard')} />}
                        {activeTab === 'admin' && (
                            <AdminVaultModule
                                localVideos={localVideos}
                                setLocalVideos={setLocalVideos}
                                marketingText={marketingText}
                                setMarketingText={setMarketingText}
                                showToast={showToast}
                                onClose={() => setActiveTab('dashboard')}
                            />
                        )}

                        <AutomatedObservatoryWidget marketingText={marketingText} />
                    </main>

                    {termsAccepted && <SarahFabButton onOpen={openSarahChat} />}

                    <NativeHydroWindRadar isOpen={radarOpen} onToggle={() => setRadarOpen(o => !o)} />

                    <SarahChatOverlay
                        isOpen={isChatOpen}
                        onClose={() => { setIsChatOpen(false); stopSpeaking(); }}
                        isSpeaking={isSpeaking}
                        isProcessing={isProcessing}
                        currentResponse={currentResponse}
                        input={input}
                        setInput={setInput}
                        handleSendDirectCommand={handleSendDirectCommand}
                        toggleListening={toggleListening}
                        isListening={isListening}
                    />

                    <footer className="cyber-card fixed bottom-0 left-0 right-0 z-40 border-t border-cyberCyan/30 px-4 py-3 flex items-center justify-around shadow-2xl backdrop-blur-2xl max-w-3xl mx-auto rounded-t-2xl">
                        {NAV_TABS.map(tab => (
                            <button key={tab.id} onClick={() => tab.id === 'radar' ? setRadarOpen(true) : setActiveTab(tab.id)}
                                className={`flex flex-col items-center gap-1 cursor-pointer transition ${activeTab === tab.id ? 'text-cyberCyan scale-105' : 'text-slate-400 hover:text-white'}`}>
                                {tab.iconComponent}
                                <span className="text-[9px] font-black tracking-wider">{tab.label}</span>
                            </button>
                        ))}
                    </footer>
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
