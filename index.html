        // Radar Hidrográfico com Satélite Orbital animado em Canvas
        function NativeHydroWindRadar({ liveWeather }) {
            const canvasRef = React.useRef(null);
            const [brasiliaTime, setBrasiliaTime] = React.useState("");

            React.useEffect(() => {
                const timer = setInterval(() => {
                    const now = new Date();
                    const timeStr = new Intl.DateTimeFormat("pt-BR", {
                        timeZone: "America/Sao_Paulo",
                        hour: "2-digit",
                        minute: "2-digit",
                        second: "2-digit",
                        hour12: false
                    }).format(now);
                    setBrasiliaTime(timeStr);
                }, 1000);
                return () => clearInterval(timer);
            }, []);

            React.useEffect(() => {
                const canvas = canvasRef.current;
                if (!canvas) return;
                const ctx = canvas.getContext('2d');
                let animationFrameId;
                let angle = 0;
                let satelliteAngle = 0;

                const windParticles = Array.from({ length: 24 }, () => ({
                    x: Math.random() * canvas.width,
                    y: Math.random() * canvas.height,
                    speed: 1.6 + Math.random() * 2.2,
                    size: 20 + Math.random() * 30
                }));

                const render = () => {
                    ctx.clearRect(0, 0, canvas.width, canvas.height);

                    ctx.fillStyle = '#070B18';
                    ctx.fillRect(0, 0, canvas.width, canvas.height);

                    const centerX = canvas.width / 2;
                    const centerY = canvas.height / 2;

                    ctx.strokeStyle = 'rgba(155, 126, 222, 0.3)';
                    ctx.lineWidth = 1.4;
                    for (let r = 60; r < 200; r += 45) {
                        ctx.beginPath();
                        ctx.arc(centerX, centerY, r, 0, Math.PI * 2);
                        ctx.stroke();
                    }

                    ctx.beginPath();
                    ctx.moveTo(0, centerY); ctx.lineTo(canvas.width, centerY);
                    ctx.moveTo(centerX, 0); ctx.lineTo(centerX, canvas.height);
                    ctx.stroke();

                    windParticles.forEach(p => {
                        p.x += p.speed;
                        if (p.x > canvas.width + 50) p.x = -50;

                        const cloudGrad = ctx.createRadialGradient(p.x, p.y, 2, p.x, p.y, p.size);
                        cloudGrad.addColorStop(0, 'rgba(99, 230, 226, 0.25)');
                        cloudGrad.addColorStop(1, 'transparent');
                        ctx.fillStyle = cloudGrad;
                        ctx.beginPath();
                        ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                        ctx.fill();
                    });

                    ctx.save();
                    ctx.translate(centerX, centerY);
                    ctx.rotate(angle);
                    const grad = ctx.createLinearGradient(0, 0, 180, -180);
                    grad.addColorStop(0, 'rgba(155, 126, 222, 0.6)');
                    grad.addColorStop(1, 'transparent');
                    ctx.fillStyle = grad;
                    ctx.beginPath();
                    ctx.moveTo(0, 0);
                    ctx.arc(0, 0, 190, -Math.PI / 2, 0);
                    ctx.lineTo(0, 0);
                    ctx.fill();
                    ctx.restore();

                    angle += 0.03;

                    const satOrbitRadius = 125;
                    const satX = centerX + Math.cos(satelliteAngle) * satOrbitRadius;
                    const satY = centerY + Math.sin(satelliteAngle) * (satOrbitRadius * 0.5);

                    ctx.strokeStyle = 'rgba(99, 230, 226, 0.4)';
                    ctx.lineWidth = 1;
                    ctx.beginPath();
                    ctx.ellipse(centerX, centerY, satOrbitRadius, satOrbitRadius * 0.5, 0, 0, Math.PI * 2);
                    ctx.stroke();

                    ctx.fillStyle = '#63E6E2';
                    ctx.fillRect(satX - 6, satY - 4, 12, 8);
                    ctx.fillStyle = '#9B7EDE';
                    ctx.fillRect(satX - 16, satY - 2, 9, 4);
                    ctx.fillRect(satX + 7, satY - 2, 9, 4);
                    ctx.strokeStyle = '#E58AC7';
                    ctx.lineWidth = 1.5;
                    ctx.beginPath();
                    ctx.arc(satX, satY, 12 + Math.sin(Date.now() * 0.01) * 4, 0, Math.PI * 2);
                    ctx.stroke();

                    satelliteAngle += 0.012;

                    const bacias = [
                        { name: "Rio Sarapuí", x: centerX - 80, y: centerY - 55, color: "#63E6E2", status: "Estável" },
                        { name: "Rio Dona Eugênia", x: centerX + 50, y: centerY - 65, color: "#72E6B2", status: "Monitorado" },
                        { name: "Rio Prata", x: centerX + 35, y: centerY + 65, color: "#E58AC7", status: "Atenção" },
                        { name: "Base A Chave da Esperança", x: centerX - 25, y: centerY + 15, color: "#9B7EDE", status: "Operacional" }
                    ];

                    bacias.forEach(b => {
                        ctx.fillStyle = b.color;
                        ctx.beginPath();
                        ctx.arc(b.x, b.y, 10, 0, Math.PI * 2);
                        ctx.fill();

                        ctx.strokeStyle = '#FFFFFF';
                        ctx.lineWidth = 2.5;
                        ctx.stroke();

                        ctx.fillStyle = '#FFFFFF';
                        ctx.font = 'bold 14px Inter, sans-serif';
                        ctx.shadowColor = 'rgba(0, 0, 0, 0.8)';
                        ctx.shadowBlur = 6;
                        ctx.fillText(`${b.name} (${b.status})`, b.x + 16, b.y + 5);
                        ctx.shadowBlur = 0;
                    });

                    animationFrameId = requestAnimationFrame(render);
                };

                render();

                return () => {
                    cancelAnimationFrame(animationFrameId);
                };
            }, []);

            return (
                <div className="relative w-full h-[360px] rounded-3xl overflow-hidden border-2 border-sophisticatedViolet/50 shadow-2xl bg-petroleumPanel flex flex-col justify-between p-3">
                    <div className="flex items-center justify-between z-10 bg-nightBlue/90 border border-sophisticatedViolet/50 px-4 py-2 rounded-2xl shadow-lg backdrop-blur-md">
                        <div className="flex items-center gap-2 font-bold text-xs text-softCyan font-sans">
                            <span className="w-2.5 h-2.5 rounded-full bg-mintGreen animate-ping"></span>
                            SATÉLITE ORBITAL & RADAR HIDROGRÁFICO
                        </div>
                        <div className="flex items-center gap-3 font-mono text-xs font-bold text-orchidPink">
                            <span>🕒 {brasiliaTime || "00:00:00"} (Brasília)</span>
                            <span className="text-mintGreen">🌡️ {liveWeather ? `${liveWeather.temperature_2m}°C` : '17.3°C'}</span>
                        </div>
                    </div>
                    <div className="absolute inset-0 flex items-center justify-center pt-8">
                        <canvas ref={canvasRef} width="460" height="300" className="w-full h-full object-contain"></canvas>
                    </div>
                </div>
            );
        }

                    .replace(/[#*_`~]/g, "")

                    .replace(/https?:\/\/\S+/g, "")
                    .replace(/\s+/g, " ")
                    .trim();

                const voices = voicesRef.current.length

                    : window.speechSynthesis.getVoices();

                    "Microsoft Francisca Online (Natural) - Portuguese (Brazil)",
                    "Microsoft Maria",
                    "Google português do Brasil",
                    "Google Português do Brasil",
                    "Luciana",
                    "Felipe"
                ];

                for (let pref of preferidas) {
                    const match = voices.find(v => v.name.toLowerCase().includes(pref.toLowerCase()));
                    if (match) return match;
                }

                return (
                    voices.find((voice) => voice.lang.toLowerCase() === "pt-br" && (voice.name.toLowerCase().includes("natural") || voice.name.toLowerCase().includes("neural"))) ||
                    voices.find((voice) => voice.lang.toLowerCase() === "pt-br") ||
                    voices.find((voice) => voice.lang.toLowerCase().startsWith("pt")) ||
                    voices[0]

                                                </button>
                                            </div>
                                        </div>
                                    ) : (
                                        <div className="space-y-5 font-sans text-xs">
                                            <div className="flex items-center justify-between bg-petroleumPanel p-3.5 rounded-2xl border border-sophisticatedViolet/40 font-sans text-softCyan shadow-inner">
                                                <span className="flex items-center gap-2">
                                                    {accessMode === "free" ? "🔓 Visualização em Acesso Livre" : "✅ Apresentações e Registros Desbloqueados"}
                                                </span>
                                                {accessMode === "restricted" && (
                                                    <button onClick={() => setIsPlanUnlocked(false)} className="text-[11px] underline hover:text-white cursor-pointer text-orchidPink">
                                                        Bloquear Novamente
                                                    </button>
                                                )}
                                            </div>

                                            {accessMode === "restricted" && (
                                                <div className="grid grid-cols-1 sm:grid-cols-2 gap-4 bg-petroleumPanel/80 p-4 rounded-2xl border border-sophisticatedViolet/30">
                                                    <div className="space-y-2">
                                                        <label className="block font-sans text-lightLavender/80 text-[11px]">🏷️ Categoria do Evento / Registro:</label>
                                                        <select
                                                            value={selectedCategory}
                                                            onChange={(e) => setSelectedCategory(e.target.value)}
                                                            className="w-full bg-nightBlue border border-sophisticatedViolet/40 rounded-xl p-2.5 text-xs text-softCyan font-sans focus:outline-none"
                                                        >
                                                            <option value="Vídeos / Eventos e Registros">🎬 Vídeos e Registros de Eventos</option>
                                                            <option value="Ação Comunitária GACE">🤝 Ação Comunitária (GACE)</option>
                                                            <option value="Nota Técnica Universitária">🎓 Nota Técnica Universitária</option>
                                                        </select>
                                                    </div>

                                                    <div className="space-y-2">
                                                        <label className="block font-sans text-lightLavender/80 text-[11px]">📥 Enviar Vídeo / Registro:</label>
                                                        <input
                                                            type="file"
                                                            multiple
                                                            accept="video/*,image/*,.pdf"
                                                            onChange={handleFileUpload}
                                                            className="w-full text-xs text-lightLavender/70 file:mr-3 file:py-2 file:px-3 file:rounded-xl file:border-0 file:text-xs file:font-sans file:font-bold file:bg-gradient-to-r file:from-sophisticatedViolet file:to-orchidPink file:text-nightBlue hover:file:opacity-90 file:cursor-pointer bg-nightBlue p-2 rounded-xl border border-sophisticatedViolet/30"
                                                        />
                                                    </div>
                                                </div>
                                            )}

                                            <div className="space-y-3">
                                                <div className="flex items-center justify-between">
                                                    <h4 className="font-sans text-xs font-bold text-lightLavender">🎬 Registros e Apresentações ({mediaList.length}):</h4>
                                                    <span className="text-[10px] font-sans text-orchidPink">Arraste para baixo para minimizar 🔽</span>
                                                </div>

                                                {mediaList.length === 0 ? (
                                                    <div className="p-10 text-center text-lightLavender/40 font-sans text-xs bg-petroleumPanel/50 rounded-2xl border border-sophisticatedViolet/20 space-y-2">
                                                        <div className="text-2xl">🎬</div>
                                                        <div>Nenhum vídeo ou registro de evento adicionado no momento.</div>
                                                    </div>
                                                ) : (
                                                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-4 max-h-[50vh] overflow-y-auto p-1">
                                                        {mediaList.map(item => (
                                                            <div key={item.id} className="bg-petroleumPanel border-2 border-sophisticatedViolet/50 rounded-2xl p-3 flex flex-col justify-between shadow-lg btn-animated">
                                                                <div className="flex items-center justify-between mb-2">
                                                                    <span className="px-2 py-0.5 rounded-md bg-nightBlue border border-sophisticatedViolet/40 font-sans text-[10px] text-softCyan font-bold truncate max-w-[180px]">
                                                                        {item.category}
                                                                    </span>
                                                                    {accessMode === "restricted" && (
                                                                        <button onClick={() => removeMediaItem(item.id)} className="text-coralAlert hover:text-white font-sans text-xs p-1 transition cursor-pointer">
                                                                            🗑️ Excluir
                                                                        </button>
                                                                    )}
                                                                </div>

                                                                <div className="w-full bg-black rounded-xl overflow-hidden border border-sophisticatedViolet/30 aspect-video mb-2 shadow-inner relative flex items-center justify-center">
                                                                    {item.type === 'video' ? (
                                                                        <video src={item.url} className="w-full h-full object-contain" controls playsInline preload="metadata" />
                                                                    ) : (
                                                                        <div className="text-softCyan font-sans text-xs text-center p-2">📄 Registro de Evento Salvo</div>
                                                                    )}
                                                                </div>

                                                                <div className="space-y-0.5 font-sans text-[10px] text-lightLavender/80">
                                                                    <div className="truncate font-bold text-softCyan">{item.name}</div>
                                                                    <div className="flex justify-between text-lightLavender/50">
                                                                        <span>{item.size}</span>
                                                                        <span>{item.date}</span>
                                                                    </div>
                                                                </div>
                                                            </div>
                                                        ))}
                                                    </div>
                                                )}
                                            </div>
                                        </div>
                                    )}
                                </div>
                            </div>
                        </div>
                    )}

                    {installModalOpen && (
                        <div className="fixed inset-0 bg-nightBlue/85 backdrop-blur-md z-50 flex items-center justify-center p-4">
                            <div className="glass-dark border border-sophisticatedViolet/40 w-full max-w-md rounded-3xl shadow-[0_0_40px_rgba(155,126,222,0.3)] overflow-hidden flex flex-col">
                                <div className="bg-petroleumPanel px-5 py-3.5 border-b border-sophisticatedViolet/30 flex justify-between items-center">
                                    <h3 className="font-sans text-softCyan text-sm font-bold flex items-center gap-2"><span>📱</span> Instalação</h3>
                                    <button onClick={() => setInstallModalOpen(false)} className="text-lightLavender/70 hover:text-white font-sans text-xs px-3 py-1 rounded-lg bg-nightBlue border border-sophisticatedViolet/40 transition cursor-pointer btn-animated">✕</button>
                                </div>
                                <div className="p-6 bg-petroleumPanel/90 text-xs sm:text-sm text-lightLavender space-y-4">
                                    <p className="font-sans text-softCyan font-bold">Adicionar ao Ecrã Inicial:</p>
                                    <button onClick={() => setInstallModalOpen(false)} className="w-full py-3 bg-gradient-to-r from-sophisticatedViolet to-orchidPink hover:opacity-95 text-nightBlue font-sans text-xs font-bold rounded-xl transition cursor-pointer btn-animated">ENTENDIDO</button>
                                </div>
                            </div>
                        </div>
                    )}

                    {shareModalOpen && (
                        <div className="fixed inset-0 bg-nightBlue/85 backdrop-blur-md z-50 flex items-center justify-center p-4">
                            <div className="glass-dark border border-sophisticatedViolet/40 w-full max-w-md rounded-3xl shadow-[0_0_40px_rgba(155,126,222,0.3)] overflow-hidden flex flex-col">
                                <div className="bg-petroleumPanel px-5 py-3.5 border-b border-sophisticatedViolet/30 flex justify-between items-center">
                                    <h3 className="font-sans text-softCyan text-sm font-bold flex items-center gap-2"><span>🔗</span> Partilhar Aplicação</h3>
                                    <button onClick={() => setShareModalOpen(false)} className="text-lightLavender/70 hover:text-white font-sans text-xs px-3 py-1 rounded-lg bg-nightBlue border border-sophisticatedViolet/40 transition cursor-pointer btn-animated">✕</button>
                                </div>
                                <div className="p-6 bg-petroleumPanel/90 text-xs sm:text-sm text-lightLavender flex flex-col items-center text-center space-y-4">
                                    <div className="w-full grid grid-cols-2 gap-3">
                                        <button onClick={compartilharWhatsApp} className="py-3 px-4 bg-emerald-600 hover:bg-emerald-500 text-white font-sans text-xs font-bold rounded-xl transition cursor-pointer btn-animated">WhatsApp</button>
                                        <button onClick={compartilharTelegram} className="py-3 px-4 bg-sky-600 hover:bg-sky-500 text-white font-sans text-xs font-bold rounded-xl transition cursor-pointer btn-animated">Telegram</button>
                                    </div>
                                    <button onClick={copiarLinkComIcone} className="w-full py-3 bg-nightBlue hover:bg-petroleumPanel border border-sophisticatedViolet/40 text-softCyan font-sans text-xs font-bold rounded-xl transition cursor-pointer btn-animated">Copiar Link</button>
                                </div>
                            </div>
                        </div>
                    )}

                    {termsOpen && (
                        <div className="fixed inset-0 bg-nightBlue/85 backdrop-blur-md z-50 flex items-center justify-center p-4">
                            <div className="glass-dark border border-sophisticatedViolet/40 w-full max-w-xl rounded-3xl shadow-[0_0_40px_rgba(155,126,222,0.3)] overflow-hidden">
                                <div className="bg-petroleumPanel px-5 py-3.5 border-b border-sophisticatedViolet/30 flex justify-between items-center">
                                    <h3 className="font-sans text-softCyan text-sm font-bold flex items-center gap-2"><CyberShieldIcon className="w-5 h-5" /> Conformidade & Privacidade</h3>
                                    <button onClick={() => setTermsOpen(false)} className="text-lightLavender/70 hover:text-white font-sans text-xs px-3 py-1 rounded-lg bg-nightBlue border border-sophisticatedViolet/40 transition cursor-pointer btn-animated">✕ Fechar</button>
                                </div>
                                <div className="p-6 bg-petroleumPanel/90 text-xs sm:text-sm text-lightLavender space-y-3 leading-relaxed font-sans">
                                    <p>O sistema opera com anonimização geográfica e restrição de zoom nas bacias de Sarapuí, Dona Eugênia e Prata para salvaguardar a segurança dos residentes em Mesquita.</p>
                                </div>
                            </div>
                        </div>
                    )}

                    <div className="bg-vibrantLilac border-t-2 border-purple-500 py-2.5 overflow-hidden shadow-inner whitespace-nowrap">
                        <marquee behavior="scroll" direction="left" scrollamount="5" className="font-sans text-xs text-purple-200 font-bold tracking-wide">
                            🛡️ Promovendo ciência cidadã • 1° Edição operacional El Ninõ GACE • Conceitos Mesquita do amanhã e Cidades resilientes (ONU) Grupo Comunitário A Chave da Esperança • Plano de Ação: Todos Unidos, Todos Protegidos • EMERGÊNCIAS: Defesa Civil (199 / 21 4040-1772) • Bombeiros (193) • Alertas ZAP 📲 (21) 97299-3223 • Cras de Rocha Sobrinho 21 2042-8931 • Seja voluntário servir é prevenir sempre +Nupdecs [ Espaço reservado para marketing ] • Participe • "Se o Senhor não guardar a cidade, em vão vigia o sentinela" (Salmos 127:1) • #compartilhe ™ Mesquita RJ 🛡️
                        </marquee>
                    </div>

                    <footer className="bg-petroleumPanel border-t border-sophisticatedViolet/40 py-4 px-4 text-center text-xs font-sans text-softCyan space-y-1 shadow-inner">
                        <div className="font-bold">Defesa Civil Comunitária Cidadão Sensor • Sara s a r a h v5.2 PRO</div>
                        <div className="text-lightLavender/70">Grupo Comunitário A Chave da Esperança • Mesquita/RJ • Todos os direitos reservados 2024–2026</div>
                    </footer>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById("root"));
        root.render(<App />);

        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js').catch(() => {});
            });
        }
    </script>
</body>
</html>
