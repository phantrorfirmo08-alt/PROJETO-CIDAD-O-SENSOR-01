<body class="selection:bg-vibrantPink selection:text-white">
    <div id="root"></div>
    <script type="text/babel">
        document.addEventListener('gesturestart', function(e) { e.preventDefault(); });

        let lastTouchEnd = 0;
        document.addEventListener('touchend', function(e) {
            const now = (new Date()).getTime();
            if (now - lastTouchEnd <= 300) { e.preventDefault(); }
            lastTouchEnd = now;
        }, { passive: false });

        function SarahHologramAvatar({ isLarge = false, isSpeaking = false }) {
            const containerSizeClass = isLarge 
                ? "w-full max-w-[320px] aspect-square mx-auto p-6 rounded-[36px] border border-neonCyan/30 bg-surfaceCard shadow-[0_0_50px_rgba(0,242,254,0.12)] flex flex-col items-center justify-center relative overflow-hidden" 
                : "w-10 h-10 rounded-2xl p-1.5 border border-neonCyan/40 bg-surfaceCard shrink-0 flex items-center justify-center relative overflow-hidden shadow-md";

            return (
                <div className={containerSizeClass}>
                    <div className="absolute inset-0 flex items-center justify-center pointer-events-none">
                        <div className={`absolute rounded-full border border-neonCyan/20 bg-neonCyan/5 animate-ping ${isLarge ? 'w-52 h-52' : 'w-14 h-14'}`} style={{ animationDuration: '4s' }}></div>
                        <div className={`absolute rounded-full border border-emeraldMint/20 bg-emeraldMint/5 animate-pulse ${isLarge ? 'w-72 h-72' : 'w-20 h-20'}`}></div>
                    </div>

                    <div 
                        className={`relative rounded-full flex items-center justify-center bg-obsidian border-2 border-neonCyan/80 shadow-[0_0_35px_rgba(0,242,254,0.5)] transition-all duration-300 ease-out z-10 ${
                            isLarge ? 'w-36 h-36' : 'w-8 h-8'
                        } ${isSpeaking ? 'animate-avatar-speaking' : 'animate-avatar-idle'}`}
                    >
                        <div className="absolute inset-0 rounded-full bg-gradient-to-tr from-neonCyan/20 to-emeraldMint/20 animate-spin" style={{ animationDuration: '10s' }}></div>
                        <svg width={isLarge ? "52" : "18"} height={isLarge ? "52" : "18"} viewBox="0 0 24 24" fill="url(#avatarGrad)" className="relative z-10">
                            <path d="M13 2L3 14h7l-1 8 10-12h-7l1-8z"/>
                            <defs>
                                <linearGradient id="avatarGrad" x1="3" y1="2" x2="21" y2="22">
                                    <stop stopColor="#00F2FE" />
                                    <stop offset="1" stopColor="#00F5A0" />
                                </linearGradient>
                            </defs>
                        </svg>
                    </div>

                    {isLarge && (
                        <div className="mt-4 text-center font-sans z-10 space-y-1.5">
                            <div className="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-neonCyan/10 border border-neonCyan/30 font-mono text-[10px] text-neonCyan tracking-wider shadow-inner">
                                <span className="w-1.5 h-1.5 rounded-full bg-emeraldMint animate-pulse"></span>
                                {isSpeaking ? "PROCESSANDO TELEMETRIA..." : "SISTEMA NÚCLEO v5.2 PRO ATIVO"}
                            </div>
                            <div className="font-extrabold text-lg text-white tracking-wider">
                                SARAH IA NEXUS
                            </div>
                            <div className="text-[10px] tracking-[0.25em] text-slate-400 font-bold uppercase">CIDADÃO SENSOR 🛡️ PRO</div>
                        </div>
                    )}
                </div>
            );
        }

        function NativeHydroWindRadar() {
            const [radarKey, setRadarKey] = React.useState(1);
            const [isCollapsed, setIsCollapsed] = React.useState(false);

            return (
                <div className={`relative w-full rounded-[28px] overflow-hidden border border-neonCyan/40 shadow-2xl bg-surfaceCard flex flex-col justify-between p-2.5 transition-all duration-300 ${isCollapsed ? 'h-[75px]' : 'h-[600px]'}`}>
                    <div className="absolute top-3 left-3 right-3 flex items-center justify-between z-30 bg-obsidian/95 border border-neonCyan/30 px-4 py-2.5 rounded-2xl shadow-xl backdrop-blur-xl">
                        <div className="flex items-center gap-2.5 overflow-hidden whitespace-nowrap">
                            <span className="w-2 h-2 rounded-full bg-neonCyan animate-ping"></span>
                            <span className="font-extrabold text-xs text-neonCyan tracking-wide truncate">
                                RADAR 24H • CLIMA, NUVENS, CHUVA & VENTOS
                            </span>
                        </div>
                        <div className="flex items-center gap-2 shrink-0">
                            <button onClick={() => setRadarKey(p => p + 1)} className="px-3 py-1.5 bg-neonCyan/20 hover:bg-neonCyan text-neonCyan hover:text-obsidian border border-neonCyan/40 rounded-xl font-bold text-[11px] cursor-pointer transition shadow">🔄 Recarregar</button>
                            <button onClick={() => setIsCollapsed(!isCollapsed)} className="px-3 py-1.5 bg-deepPlate text-neonCyan border border-neonCyan/30 rounded-xl font-bold text-[11px] cursor-pointer shadow">{isCollapsed ? '▼ Expandir' : '▲ Recolher'}</button>
                        </div>
                    </div>
                    {!isCollapsed && (
                        <div className="absolute inset-0 pt-[64px]">
                            <iframe key={radarKey} src="https://embed.windy.com/embed2.html?lat=-22.7845&lon=-43.4190&detailLat=-22.7845&detailLon=-43.4190&width=650&height=550&zoom=11&level=surface&overlay=wind&product=ecmwf&menu=&message=&marker=true&calendar=now&pressure=true&type=map&location=coordinates&detail=true&metricWind=default&metricTemp=default" className="w-full h-full border-none relative z-10 bg-obsidian rounded-2xl" sandbox="allow-scripts allow-same-origin allow-popups allow-forms" allowFullScreen></iframe>
                        </div>
                    )}
                </div>
            );
        }

        function FieldReportModule({ onBackToChat, showToast }) {
            const [setor, setSetor] = React.useState("🛡️ Defesa Civil (Vistoria de Risco / Ocorrência)");
            const [agente, setAgente] = React.useState("");
            const [localizacao, setLocalizacao] = React.useState("");
            const [descricao, setDescricao] = React.useState("");
            const [gpsStatus, setGpsStatus] = React.useState("📍 GPS em espera");
            const [fotos, setFotos] = React.useState([
                { id: 1, status: "vazia", file: null, preview: null },
                { id: 2, status: "vazia", file: null, preview: null },
                { id: 3, status: "vazia", file: null, preview: null },
                { id: 4, status: "vazia", file: null, preview: null }
            ]);

            const capturarGps = () => {
                if (!navigator.geolocation) { showToast("⚠️ Geolocalização não suportada."); return; }
                showToast("🛰️ Acionando GPS de alta precisão...");
                navigator.geolocation.getCurrentPosition(
                    (p) => {
                        const lt = p.coords.latitude.toFixed(6), ln = p.coords.longitude.toFixed(6);
                        setLocalizacao(`${lt}, ${ln}`);
                        setGpsStatus("✅ GPS Fixado com Sucesso");
                        showToast(`📍 Coordenadas obtidas!`);
                    },
                    () => { showToast("⚠ Falha ao obter sinal GPS."); setGpsStatus("⚠ Erro de Sinal GPS"); },
                    { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
                );
            };

            const handleFotoChange = (i, e) => {
                const file = e.target.files[0];
                if (file) {
                    showToast(`🔄 Otimizando evidência ${i + 1}...`);
                    const reader = new FileReader();
                    reader.readAsDataURL(file);
                    reader.onload = (event) => {
                        const img = new Image();
                        img.src = event.target.result;
                        img.onload = () => {
                            const canvas = document.createElement('canvas');
                            let w = img.width, h = img.height;
                            const MAX = 1280;
                            if (w > h) { if (w > MAX) { h = Math.round(h * MAX / w); w = MAX; } }
                            else { if (h > MAX) { w = Math.round(w * MAX / h); h = MAX; } }
                            canvas.width = w; canvas.height = h;
                            const ctx = canvas.getContext('2d');
                            ctx.drawImage(img, 0, 0, w, h);
                            canvas.toBlob((blob) => {
                                const previewUrl = URL.createObjectURL(blob);
                                const u = [...fotos];
                                u[i] = { id: u[i].id, status: "✅ OK", file: blob, preview: previewUrl };
                                setFotos(u);
                                showToast(`📸 Evidência ${i + 1} registrada!`);
                            }, 'image/jpeg', 0.75);
                        };
                    };
                }
            };

            const montarTexto = () => {
                const fCount = fotos.filter(f => f.status === "✅ OK").length;
                return `📊 *RELATÓRIO TÉCNICO DE CAMPO - SARAH IA*\n` +
                       `🏛️ *Setor:* ${setor}\n` +
                       `👤 *Agente:* ${agente || 'Não informado'}\n` +
                       `📍 *Local:* ${localizacao || 'Não informado'}\n` +
                       `📸 *Evidências fotográficas:* ${fCount}/4\n` +
                       `📝 *Relato Operacional:*\n${descricao || 'Sem descrição informada'}`;
            };

            return (
                <div className="space-y-4 max-w-xl mx-auto">
                    <div className="flex items-center justify-between glass-panel px-5 py-3.5 rounded-2xl border border-neonCyan/30">
                        <span className="text-xs font-extrabold text-neonCyan">📋 Mapeamento de Campo & Vistoria</span>
                        <button onClick={onBackToChat} className="px-3.5 py-1.5 bg-alertCoral/25 text-alertCoral border border-alertCoral/40 rounded-xl text-xs font-bold cursor-pointer btn-interactive">✕ Fechar</button>
                    </div>

                    <div className="glass-panel rounded-[32px] p-6 border border-neonCyan/30 shadow-2xl space-y-4">
                        <h2 className="text-lg font-extrabold text-white">Inspeção & Vistoria Comunitária</h2>
                        
                        <div className="space-y-1">
                            <label className="block text-[11px] font-extrabold text-slate-400 uppercase">Setor</label>
                            <select value={setor} onChange={(e) => setSetor(e.target.value)} className="w-full bg-obsidian border border-neonCyan/30 rounded-2xl p-3 text-xs text-slate-200">
                                <option>🛡 Defesa Civil (Vistoria de Risco / Ocorrência)</option>
                                <option>🤝 Assistência Social (Vulnerabilidade / Cadastro)</option>
                                <option>🎓 Universidade (Pesquisa / Extensão)</option>
                            </select>
                        </div>

                        <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                            <input type="text" value={agente} onChange={(e) => setAgente(e.target.value)} placeholder="Nome do Agente" className="bg-obsidian border border-neonCyan/30 rounded-2xl p-3 text-xs text-slate-200" />
                            <input type="text" value={localizacao} onChange={(e) => setLocalizacao(e.target.value)} placeholder="Localidade / Referência" className="bg-obsidian border border-neonCyan/30 rounded-2xl p-3 text-xs text-slate-200" />
                        </div>
                        
                        <div className="border border-neonCyan/30 bg-obsidian/90 rounded-2xl p-3 flex items-center justify-between text-xs">
                            <span className="text-emeraldMint font-mono font-bold">{gpsStatus}</span>
                            <button type="button" onClick={capturarGps} className="px-3 py-2 bg-neonCyan text-obsidian font-black rounded-xl text-xs cursor-pointer btn-interactive">Capturar GPS 🛰</button>
                        </div>

                        <textarea rows="3" value={descricao} onChange={(e) => setDescricao(e.target.value)} placeholder="Descreva as condições..." className="w-full bg-obsidian border border-neonCyan/30 rounded-2xl p-3 text-xs text-slate-200"></textarea>

                        <div className="grid grid-cols-2 gap-2">
                            {fotos.map((f, idx) => (
                                <label key={f.id} htmlFor={`f-${idx}`} className="border border-dashed border-emeraldMint/40 bg-obsidian rounded-2xl p-2 text-center cursor-pointer h-24 flex flex-col items-center justify-center">
                                    <span className="text-neonCyan text-sm">📷</span>
                                    <span className="text-[10px] text-slate-300">{f.preview ? `✅ Foto ${idx+1}` : `+ Foto ${idx+1}`}</span>
                                    <input type="file" id={`f-${idx}`} accept="image/*" capture="environment" className="hidden" onChange={(e) => handleFotoChange(idx, e)} />
                                </label>
                            ))}
                        </div>

                        <button onClick={() => { navigator.clipboard.writeText(montarTexto()); showToast("📋 Relatório copiado!"); }} className="w-full bg-gradient-to-r from-emeraldMint to-neonCyan text-obsidian font-extrabold py-3 rounded-2xl text-xs uppercase cursor-pointer btn-interactive shadow-lg">Copiar Relatório Formatado</button>
                    </div>
                </div>
            );
        }

        function CustomVideoPlayer({ vid }) {
            const [isPlaying, setIsPlaying] = React.useState(false);
            const videoRef = React.useRef(null);
            return (
                <div className="relative w-full h-[280px] rounded-2xl overflow-hidden border border-neonCyan/20 bg-obsidian flex flex-col justify-between shadow-2xl">
                    <video ref={videoRef} src={vid.url} playsInline preload="auto" className="w-full h-full object-contain bg-obsidian flex-1" />
                    <div className="absolute bottom-0 left-0 right-0 bg-obsidian/90 p-2.5 flex items-center justify-between z-20 border-t border-neonCyan/20">
                        <button onClick={() => {
                            if(videoRef.current.paused) { videoRef.current.play(); setIsPlaying(true); }
                            else { videoRef.current.pause(); setIsPlaying(false); }
                        }} className="px-3 py-1.5 bg-emeraldMint text-obsidian rounded-xl text-xs font-extrabold cursor-pointer">
                            {isPlaying ? '❚❚ Pausar' : '▶ Play'}
                        </button>
                    </div>
                </div>
            );
        }

        function PublicVideoGallery({ localVideos, onGoToChat }) {
            return (
                <div className="glass-panel p-6 rounded-[32px] border border-neonCyan/35 shadow-2xl space-y-4">
                    <div className="flex items-center justify-between border-b border-neonCyan/20 pb-3">
                        <h2 className="text-xs font-extrabold text-neonCyan">🎥 Galeria de Vídeos Comunitários</h2>
                        <button onClick={onGoToChat} className="px-3 py-1 bg-neonCyan text-obsidian rounded-xl text-xs font-black cursor-pointer">💬 Voltar ao Chat</button>
                    </div>
                    <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                        {localVideos.map(vid => (
                            <div key={vid.id} className="bg-obsidian/90 p-3 rounded-2xl border border-neonCyan/30 space-y-2">
                                <span className="text-xs font-bold text-neonCyan truncate">📺 {vid.title}</span>
                                <CustomVideoPlayer vid={vid} />
                            </div>
                        ))}
                    </div>
                </div>
            );
        }

        function AdminVaultModule({ localVideos, setLocalVideos, showToast, onClose }) {
            const [pinInput, setPinInput] = React.useState("");
            const [isUnlocked, setIsUnlocked] = React.useState(false);
            const [sponsorInput, setSponsorInput] = React.useState(() => localStorage.getItem("sarah_custom_sponsor_text") || "JUNINHO DO MERCADINHO • Preços baixos e atendimento nota 10");

            return (
                <div className="glass-panel p-6 rounded-[32px] border border-neonCyan/40 shadow-2xl space-y-4 max-w-md mx-auto">
                    <div className="flex items-center justify-between border-b border-neonCyan/20 pb-3">
                        <h2 className="text-xs font-extrabold text-neonCyan">🔒 Painel Administrativo</h2>
                        <button onClick={onClose} className="px-3 py-1 bg-alertCoral/25 text-alertCoral rounded-xl text-xs font-bold cursor-pointer">✕ Fechar</button>
                    </div>
                    {!isUnlocked ? (
                        <div className="space-y-4 text-center py-6">
                            <div className="text-2xl text-neonCyan">🔒</div>
                            <input type="password" maxLength="6" value={pinInput} onChange={(e) => setPinInput(e.target.value)} placeholder="Digite o PIN" className="w-full bg-obsidian border border-neonCyan/40 rounded-2xl p-3 text-center text-xs text-white font-mono tracking-widest" />
                            <button onClick={() => { if(pinInput === "303500") { setIsUnlocked(true); showToast("🔓 Acesso Autorizado!"); } else { showToast("❌ PIN incorreto."); } }} className="w-full py-3 bg-neonCyan text-obsidian font-extrabold rounded-2xl text-xs cursor-pointer shadow-lg">Desbloquear</button>
                        </div>
                    ) : (
                        <div className="space-y-4">
                            <div className="space-y-2">
                                <label className="text-xs font-extrabold text-neonCyan">📢 Patrocínio / Quadro de Marketing</label>
                                <input type="text" value={sponsorInput} onChange={(e) => setSponsorInput(e.target.value)} className="w-full bg-obsidian border border-neonCyan/40 rounded-2xl p-3 text-xs text-white" />
                                <button onClick={() => { localStorage.setItem("sarah_custom_sponsor_text", sponsorInput); showToast("✅ Patrocínio salvo!"); }} className="w-full py-2.5 bg-emeraldMint text-obsidian font-extrabold rounded-xl text-xs cursor-pointer">Salvar Patrocínio 💾</button>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        function AutomatedObservatoryWidget() {
            const [timeStr, setTimeStr] = React.useState("");
            const [marketingText, setMarketingText] = React.useState(() => localStorage.getItem("sarah_custom_sponsor_text") || "JUNINHO DO MERCADINHO • Preços baixos e atendimento nota 10");

            React.useEffect(() => {
                const u = () => {
                    const a = new Date();
                    setTimeStr(`${String(a.getDate()).padStart(2,'0')}/${String(a.getMonth()+1).padStart(2,'0')}/${a.getFullYear()} ${String(a.getHours()).padStart(2,'0')}:${String(a.getMinutes()).padStart(2,'0')}`);
                };
                u();
                const t = setInterval(u, 1000);
                const sync = setInterval(() => {
                    const saved = localStorage.getItem("sarah_custom_sponsor_text");
                    if (saved) setMarketingText(saved);
                }, 1500);
                return () => { clearInterval(t); clearInterval(sync); };
            }, []);

            return (
                <div style={{width:'100%',margin:'12px auto',background:'rgba(0,0,0,0.6)',border:'1px solid rgba(0,229,255,0.3)',borderRadius:'16px',padding:'14px'}}>
                    <div style={{color:'#FFF',fontWeight:800,fontSize:'13px',textAlign:'center',marginBottom:'12px'}}>🛰 OBSERVATÓRIO AUTOMATIZADO</div>
                    <div style={{display:'flex',justifyContent:'center',gap:'10px',marginBottom:'12px',flexWrap:'wrap'}}>
                        <div style={{background:'rgba(0,201,80,0.15)',border:'1px solid rgba(0,201,80,0.4)',color:'#4ADE80',padding:'8px 16px',borderRadius:'20px',fontSize:'12px',fontWeight:700}}>● Sistema Online</div>
                        <div style={{background:'rgba(255,255,255,0.08)',border:'1px solid rgba(255,255,255,0.1)',color:'#FFF',padding:'8px 16px',borderRadius:'20px',fontSize:'12px',fontWeight:700}}>🕐 Relógio Oficial: {timeStr||"--/--/---- --:--"}</div>
                    </div>
                    <div style={{position:'relative',height:'28px',background:'#102a45',overflow:'hidden',display:'flex',alignItems:'center',borderRadius:'8px 8px 0 0'}}>
                        <div style={{display:'inline-block',whiteSpace:'nowrap',color:'#7DD3FC',font:'700 12px/28px "Segoe UI"',animation:'rolarFaixa 40s linear infinite',padding:'0 32px'}}>🛡️️ Promovendo Ciência cidadã • 1° Edição El Niño GACE • Cidades resilientes (ONU Habitat) • A Chave da Esperança • Todos unidos, todos protegidos • EMERGÊNCIAS: 199 (21 4040-1772) • Bombeiros 193 • ZAP (21) 97299-3223 • Cras Rocha Sobrinho 21 2042-8931 • Sarah Nexus v5.2 • "Se o Senhor não guardar a cidade, em vão vigia o sentinela" (Salmos 127:1) •</div>
                    </div>
                    <div style={{background:'linear-gradient(135deg, rgba(0,242,254,0.08) 0%, rgba(0,245,160,0.08) 100%)',border:'2px solid rgba(0,242,254,0.5)',borderRadius:'0 0 12px 12px',padding:'12px 16px',textAlign:'center',marginTop:'3px'}}>
                        <div style={{color:'#00F5A0',fontSize:'11px',fontWeight:'900',letterSpacing:'2px',marginBottom:'4px'}}>★ PATROCÍNIO OFICIAL & APOIO COMUNITÁRIO ★</div>
                        <div style={{background:'linear-gradient(90deg,#00F2FE 0%,#00F5A0 50%,#4FACFE 100%)',WebkitBackgroundClip:'text',WebkitTextFillColor:'transparent',fontSize:'14px',fontWeight:'900',filter:'drop-shadow(0 0 8px rgba(0,242,254,0.7))'}}>
                            {marketingText}
                        </div>
                    </div>
                </div>
            );
        }

        function App() {
            const [isSpeaking, setIsSpeaking] = React.useState(false);
            const [isLoadingSplash, setIsLoadingSplash] = React.useState(true);
            const [activeTab, setActiveTab] = React.useState("chat"); 
            const [toastMessage, setToastMessage] = React.useState(null);
            const [termsAccepted, setTermsAccepted] = React.useState(() => localStorage.getItem("sarah_terms_accepted_v52_lgpd") === "1");
            const [check1, setCheck1] = React.useState(false);
            const [check2, setCheck2] = React.useState(false);

            const [messages, setMessages] = React.useState([]);
            const [input, setInput] = React.useState("");
            const [localVideos, setLocalVideos] = React.useState([
                { id: 1, title: "Monitoramento Hidrometeorológico", url: "https://www.w3schools.com/html/mov_bbb.mp4", isPinned: true },
                { id: 2, title: "Ação Comunitária - Chave da Esperança", url: "https://www.w3schools.com/html/movie.mp4", isPinned: true }
            ]);

            const showToast = (msg) => { setToastMessage(msg); setTimeout(() => setToastMessage(null), 3500); };
            const messagesEndRef = React.useRef(null);
            React.useEffect(() => { messagesEndRef.current?.scrollIntoView({ behavior: "smooth" }); }, [messages]);
            React.useEffect(() => { setTimeout(() => setIsLoadingSplash(false), 1800); }, []);

            if (isLoadingSplash) {
                return (
                    <div className="fixed inset-0 bg-obsidian flex flex-col items-center justify-center p-6 z-50">
                        <SarahHologramAvatar isLarge={true} isSpeaking={true} />
                        <div className="mt-6 text-center space-y-2">
                            <div className="text-neonCyan font-mono text-xs tracking-widest uppercase animate-pulse">CARREGANDO NÚCLEO INTELIGENTE...</div>
                            <div className="text-white text-base font-extrabold">SARAH IA NEXUS v5.2 PRO</div>
                        </div>
                    </div>
                );
            }

            if (!termsAccepted) {
                return (
                    <div className="fixed inset-0 bg-obsidian/95 backdrop-blur-xl flex items-center justify-center p-4 z-50 overflow-y-auto">
                        <div className="glass-panel max-w-md w-full p-6 rounded-[36px] border border-neonCyan/40 shadow-2xl space-y-5">
                            <div className="flex items-center gap-3">
                                <div className="w-10 h-10 rounded-2xl bg-neonCyan/10 border border-neonCyan/30 flex items-center justify-center text-neonCyan font-black">🛡</div>
                                <div>
                                    <h2 className="text-base font-extrabold text-white">Termos de Uso & LGPD</h2>
                                    <div className="text-[10px] text-neonCyan font-mono">DEFESA CIVIL COMUNITÁRIA</div>
                                </div>
                            </div>
                            <div className="bg-obsidian/90 p-3 rounded-2xl border border-neonCyan/20 text-xs text-slate-300 space-y-2 leading-relaxed">
                                <p>O <strong>SARAH IA NEXUS v5.2</strong> é um assistente de apoio à ciência cidadã, monitoramento meteorológico e prevenção de riscos nas comunidades.</p>
                            </div>
                            <div className="space-y-2.5 text-xs text-slate-300">
                                <label className="flex items-start gap-2.5 cursor-pointer"><input type="checkbox" checked={check1} onChange={e => setCheck1(e.target.checked)} className="mt-1" />Compreendi os objetivos de prevenção de riscos.</label>
                                <label className="flex items-start gap-2.5 cursor-pointer"><input type="checkbox" checked={check2} onChange={e => setCheck2(e.target.checked)} className="mt-1" />Concordo com o compartilhamento ético para Defesa Civil.</label>
                            </div>
                            <button disabled={!check1 || !check2} onClick={() => { setTermsAccepted(true); localStorage.setItem("sarah_terms_accepted_v52_lgpd", "1"); showToast("✅ Acesso autorizado!"); }} className={`w-full py-3.5 rounded-2xl font-black text-xs uppercase tracking-wider transition cursor-pointer ${check1 && check2 ? 'bg-gradient-to-r from-neonCyan to-emeraldMint text-obsidian shadow-xl btn-interactive' : 'bg-slate-800 text-slate-500 cursor-not-allowed'}`}>
                                Iniciar Sistema v5.2 🛡
                            </button>
                        </div>
                    </div>
                );
            }

            return (
                <div className="min-h-screen flex flex-col bg-obsidian text-slate-100 font-sans relative">
                    {toastMessage && (
                        <div className="fixed top-4 left-1/2 -translate-x-1/2 z-50 bg-surfaceCard/95 border border-neonCyan/60 px-4 py-2.5 rounded-2xl shadow-2xl text-xs font-extrabold text-neonCyan animate-bounce">
                            🛡 {toastMessage}
                        </div>
                    )}

                    {/* CABEÇALHO SUPERIOR MODERNIZADO */}
                    <header className="glass-panel sticky top-0 z-40 px-4 py-3 border-b border-neonCyan/20 flex items-center justify-between">
                        <div className="flex items-center gap-2.5">
                            <div className="w-9 h-9 rounded-2xl bg-neonCyan/15 border border-neonCyan/40 flex items-center justify-center text-neonCyan shadow-inner">⚡</div>
                            <div>
                                <h1 className="text-xs font-extrabold text-white tracking-wider">SARAH IA NEXUS</h1>
                                <p className="text-[9px] text-neonCyan font-mono">v5.2 PRO • CIDADÃO SENSOR • MESQUITA/RJ</p>
                            </div>
                        </div>

                        <div className="flex items-center gap-2">
                            <button onClick={() => setActiveTab("admin")} className="w-9 h-9 rounded-xl bg-surfaceCard hover:bg-neonCyan/20 text-neonCyan border border-neonCyan/30 flex items-center justify-center cursor-pointer transition shadow btn-interactive" title="Painel Admin">🔒</button>
                            <button onClick={() => { navigator.clipboard.writeText(window.location.href); showToast("📋 Link copiado!"); }} className="w-9 h-9 rounded-xl bg-surfaceCard hover:bg-neonCyan/20 text-neonCyan border border-neonCyan/30 flex items-center justify-center cursor-pointer transition shadow btn-interactive" title="Compartilhar Link">🔗</button>
                            <button onClick={() => showToast("📱 App pronto para uso comunitário!")} className="px-3.5 py-1.5 bg-gradient-to-r from-neonCyan to-emeraldMint text-obsidian rounded-xl text-xs font-black cursor-pointer shadow btn-interactive tracking-wide">Instalar 📱</button>
                        </div>
                    </header>

                    {/* CONTEÚDO PRINCIPAL */}
                    <main className="flex-1 max-w-3xl w-full mx-auto p-4 space-y-4">
                        <div className="space-y-4">
                            <div className="glass-panel p-6 rounded-[32px] border border-neonCyan/40 shadow-2xl relative overflow-hidden text-center space-y-3">
                                <div className="absolute top-0 right-0 w-32 h-32 bg-neonCyan/10 rounded-full blur-2xl pointer-events-none"></div>
                                <SarahHologramAvatar isLarge={true} isSpeaking={isSpeaking} />
                                <div className="inline-block px-3 py-1 rounded-full bg-neonCyan/10 border border-neonCyan/30 font-mono text-[10px] text-neonCyan">Núcleo Inteligente de Prevenção Ativo</div>
                                <h2 className="text-lg font-extrabold text-white">Central de Atendimento & Clima</h2>
                                <p className="text-xs text-slate-300 max-w-md mx-auto leading-relaxed">
                                    "Prevenção não é mídia: é gente atenta." Monitore as condições meteorológicas em tempo real (chuvas, vento, nuvens e bacias da região de Mesquita/RJ).
                                </p>

                                <div className="grid grid-cols-2 sm:grid-cols-4 gap-2.5 pt-2">
                                    <div className="bg-obsidian/80 border border-neonCyan/20 rounded-2xl p-2.5 text-center">
                                        <div className="text-[10px] text-slate-400">🌡 Temp</div>
                                        <div className="text-xs font-bold text-neonCyan font-mono mt-0.5">26.2°C</div>
                                    </div>
                                    <div className="bg-obsidian/80 border border-neonCyan/20 rounded-2xl p-2.5 text-center">
                                        <div className="text-[10px] text-slate-400">💧 Umidade</div>
                                        <div className="text-xs font-bold text-emeraldMint font-mono mt-0.5">78%</div>
                                    </div>
                                    <div className="bg-obsidian/80 border border-neonCyan/80 rounded-2xl p-2.5 text-center">
                                        <div className="text-[10px] text-slate-400">🌧 Chuva</div>
                                        <div className="text-xs font-bold text-neonCyan font-mono mt-0.5">0.1 mm/h</div>
                                    </div>
                                    <div className="bg-obsidian/80 border border-neonCyan/20 rounded-2xl p-2.5 text-center">
                                        <div className="text-[10px] text-slate-400">💨 Vento</div>
                                        <div className="text-xs font-bold text-slate-200 font-mono mt-0.5">8.4 km/h</div>
                                    </div>
                                </div>

                                <div className="pt-2">
                                    <a href="tel:199" className="inline-flex items-center justify-center gap-2 w-full py-3 bg-gradient-to-r from-alertCoral to-vibrantPink text-white font-extrabold rounded-2xl text-xs uppercase tracking-wider shadow-lg btn-interactive">
                                        🚨 Ligar Direto: 199 (Defesa Civil)
                                    </a>
                                </div>
                            </div>
                        </div>

                        {/* BOTÕES DE FUNCIONALIDADES / ABAS */}
                        <div className="grid grid-cols-2 sm:grid-cols-4 gap-2">
                            <button onClick={() => setActiveTab("chat")} className={`p-3 rounded-2xl text-xs font-extrabold transition cursor-pointer flex items-center justify-center gap-1.5 shadow-md btn-interactive ${activeTab === 'chat' ? 'bg-neonCyan text-obsidian' : 'glass-panel text-slate-200 border-neonCyan/30'}`}><span>💬</span> Chat IA</button>
                            <button onClick={() => setActiveTab("radar")} className={`p-3 rounded-2xl text-xs font-extrabold transition cursor-pointer flex items-center justify-center gap-1.5 shadow-md btn-interactive ${activeTab === 'radar' ? 'bg-neonCyan text-obsidian' : 'glass-panel text-slate-200 border-neonCyan/30'}`}><span>🛰</span> Radar 24h</button>
                            <button onClick={() => setActiveTab("report")} className={`p-3 rounded-2xl text-xs font-extrabold transition cursor-pointer flex items-center justify-center gap-1.5 shadow-md btn-interactive ${activeTab === 'report' ? 'bg-neonCyan text-obsidian' : 'glass-panel text-slate-200 border-neonCyan/30'}`}><span>📋</span> Vistoria</button>
                            <button onClick={() => setActiveTab("videos")} className={`p-3 rounded-2xl text-xs font-extrabold transition cursor-pointer flex items-center justify-center gap-1.5 shadow-md btn-interactive ${activeTab === 'videos' ? 'bg-neonCyan text-obsidian' : 'glass-panel text-slate-200 border-neonCyan/30'}`}><span>🎥</span> Vídeos</button>
                        </div>

                        {activeTab === "chat" && (
                            <div className="space-y-4">
                                <div className="glass-panel p-4 rounded-[32px] border border-neonCyan/30 shadow-2xl space-y-3">
                                    <div className="min-h-[250px] max-h-[350px] overflow-y-auto space-y-2.5 p-2">
                                        {messages.length === 0 ? (
                                            <div className="text-center py-10 space-y-2">
                                                <div className="text-xs font-extrabold text-white">Inicie uma conversa com a SARAH IA</div>
                                                <p className="text-[11px] text-slate-400">Tire dúvidas sobre riscos, relate ocorrências ou consulte o clima da bacia.</p>
                                            </div>
                                        ) : (
                                            messages.map((m, idx) => (
                                                <div key={idx} className={`flex ${m.sender === 'user' ? 'justify-end' : 'justify-start'}`}>
                                                    <div className={`max-w-[85%] p-3.5 rounded-2xl text-xs leading-relaxed ${m.sender === 'user' ? 'bg-neonCyan text-obsidian font-bold shadow' : 'bg-surfaceCard border border-neonCyan/30 text-slate-200'}`}>{m.text}</div>
                                                </div>
                                            ))
                                        )}
                                        <div ref={messagesEndRef} />
                                    </div>

                                    <div className="flex gap-2">
                                        <input 
                                            type="text" 
                                            value={input} 
                                            onChange={(e) => setInput(e.target.value)}
                                            onKeyDown={(e) => {
                                                if (e.key === 'Enter' && input.trim()) {
                                                    const txt = input; setInput('');
                                                    setMessages(prev => [...prev, { sender: 'user', text: txt }]);
                                                    setIsSpeaking(true);
                                                    setTimeout(() => {
                                                        setMessages(prev => [...prev, { sender: 'sarah', text: `Recebido com atenção! Analisando telemetria para: "${txt}". Alerta preventivo ativo na região.` }]);
                                                        setIsSpeaking(false);
                                                    }, 900);
                                                }
                                            }}
                                            placeholder="Digite sua mensagem para a Sarah..."
                                            className="flex-1 bg-obsidian border border-neonCyan/30 rounded-2xl px-4 py-3 text-xs text-slate-200 focus:outline-none focus:ring-2 focus:ring-neonCyan input-shadow"
                                        />
                                        <button 
                                            onClick={() => {
                                                if (!input.trim()) return;
                                                const txt = input; setInput('');
                                                setMessages(prev => [...prev, { sender: 'user', text: txt }]);
                                                setIsSpeaking(true);
                                                setTimeout(() => {
                                                    setMessages(prev => [...prev, { sender: 'sarah', text: `Recebido com atenção! Analisando telemetria para: "${txt}". Alerta preventivo ativo na região.` }]);
                                                    setIsSpeaking(false);
                                                }, 900);
                                            }}
                                            className="px-5 py-3 bg-gradient-to-r from-neonCyan to-emeraldMint text-obsidian font-black rounded-2xl text-xs cursor-pointer btn-interactive shadow-lg"
                                        >
                                            Enviar 🚀
                                        </button>
                                    </div>
                                </div>

                                <AutomatedObservatoryWidget />
                            </div>
                        )}

                        {activeTab === "radar" && <NativeHydroWindRadar />}
                        {activeTab === "report" && <FieldReportModule onBackToChat={() => setActiveTab("chat")} showToast={showToast} />}
                        {activeTab === "videos" && <PublicVideoGallery localVideos={localVideos} onGoToChat={() => setActiveTab("chat")} />}
                        {activeTab === "admin" && <AdminVaultModule localVideos={localVideos} setLocalVideos={setLocalVideos} showToast={showToast} onClose={() => setActiveTab("chat")} />}
                    </main>

                    {/* RODAPÉ OFICIAL INTEGRADO */}
                    <footer className="w-full text-center py-6 px-4 mt-8 glass-panel border-t border-neonCyan/30 space-y-1.5 text-xs shadow-2xl">
                        <div className="font-extrabold text-neonCyan tracking-wide">
                            Defesa Civil Comunitária Cidadão Sensor • SARAH IA NEXUS v5.2 PRO
                        </div>
                        <div className="text-slate-300 font-medium">
                            Grupo Comunitário A Chave da Esperança • Mesquita/RJ
                        </div>
                        <div className="text-emeraldMint font-mono font-bold pt-1">
                            @Todos os direitos reservados 2024–2026
                        </div>
                    </footer>
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
