    ctx.fillStyle = '#00F2FE'; ctx.font = 'bold 11px monospace'; ctx.fillText(`DATA ${new Date().toLocaleString('pt-BR')} | GPS ${gps.lat.toFixed(5)}, ${gps.lon.toFixed(5)}`, 12, y0 + 20);
    ctx.fillStyle = '#FFFFFF'; ctx.font = 'bold 11px monospace'; ctx.fillText(`AGENTE ${(nome || 'Comunitario').slice(0,24)} | ${bairro.slice(0,18)} | ${mun.n}`, 12, y0 + 40);
    ctx.fillStyle = '#FF0055'; ctx.font = 'bold 11px monospace'; ctx.fillText(`DEMANDA: ${categoriaDemanda.slice(0, 46)}`, 12, y0 + 60);
    ctx.fillStyle = '#FFA500'; ctx.font = 'bold 10px monospace'; ctx.fillText(`SEVERIDADE: ${severidade}`, 12, y0 + 78);
    ctx.fillStyle = '#FFD600'; ctx.font = 'bold 10px monospace'; ctx.fillText(`GOES-19 | CHUVA ${clima?.precipitation||0}mm | VENTO ${vento||0}km/h | PROT ${prot || protAtualRef.current || 'PROT-GADE'}`, 12, y0 + 96);
    ctx.fillStyle = '#00F2FE'; ctx.font = 'bold 9px monospace'; ctx.fillText(`SHA-256: ${APP_SHA256}`, 12, y0 + 112);
    ctx.fillStyle = '#00FF88'; ctx.font = 'bold 9px monospace'; ctx.fillText(`CIDAdao SENSOR - GRUPO A CHAVE DA ESPERANCA (GADE)`.toUpperCase(), 12, y0 + 126);
  };
  const capturarFotoFinal = () => { const v = videoRef.current; if(!v) return null; const canvas = document.createElement('canvas'); canvas.width = 720; canvas.height = Math.round(720 * (v.videoHeight / v.videoWidth)); const ctx = canvas.getContext('2d'); ctx.drawImage(v, 0, 0, canvas.width, canvas.height); const prot = gerarDadosProtocolo(); desenharCarimbo(ctx, canvas.width, canvas.height, prot); const base64Final = canvas.toDataURL('image/jpeg', 0.82); setFotos([base64Final]); showToast(`Foto gerada com carimbo calibrado e SHA-256.`); return base64Final; };
  const gerarDadosProtocolo = () => { if(!nome) { showToast('Informe o nome do agente comunitário.'); return null; } if(!bairro) { showToast('Informe a localidade ou bairro.'); return null; } const seq = Math.floor(Math.random() * 8999 + 1000); const sig = mun.n.slice(0, 3).toUpperCase(); const prot = `PROT-GADE-${sig}-2026-${seq}`; protAtualRef.current = prot; return prot; };
  const textoVistoria = (prot) => `[PARECER TECNICO DE VISTORIA E PERCEPCAO DE RISCO COMUNITARIO]\nProtocolo: ${prot || protAtualRef.current || 'PROT-GADE'}\nAgente Responsavel: ${nome || userName || 'Comunitario'}\nLocal: ${mun.n} - ${bairro}\nCategoria da Demanda: ${categoriaDemanda}\nSeveridade Comunitaria: ${severidade}\nFrente de Atuacao: ${frenteSelecionada}\nParametros GOES-19: Chuva ${clima?.precipitation||0}mm | Vento ${vento}km/h\nCoordenadas GPS: ${gps.lat.toFixed(5)}, ${gps.lon.toFixed(5)}\nAssinatura Criptografica SHA-256: ${APP_SHA256}\n\nRELATORIO / PARECER TECNICO:\n${rel || 'Inspecao e registro autonomo realizado in loco pela iniciativa comunitaria independente.'}\n\nNOTA DE CONFORMIDADE:\nDocumento gerado de forma autonoma pelo Projeto Cidadao Sensor e Grupo A Chave da Esperanca (GADE), amparado pelo direito civico de fiscalizacao e alerta preventivo comunitario.\n\nFoto em anexo.`;
  const baixarFotoLeve = (base64) => { const a=document.createElement('a'); a.href=base64; a.download=`vistoria-${mun.n}-${Date.now()}.jpg`; a.click(); };
  // WHATSAPP COMUM - FOTO + TEXTO JUNTOS
  const enviarWhatsComum = async () => {
    const prot = gerarDadosProtocolo(); if(!prot) return;
    const texto = textoVistoria(prot);
    let foto = fotos[0];
    if (!foto && camOn) foto = capturarFotoFinal();
    if (foto) {
      try {
        const blob = await (await fetch(foto)).blob();
        const file = new File([blob], `vistoria-${mun.n}.jpg`, {type:'image/jpeg'});
        if (navigator.canShare && navigator.canShare({files:[file]})) {
          await navigator.share({ title: 'Vistoria Comunitaria GADE', text: texto, files: [file] });
          showToast('WhatsApp Comum enviado com foto + laudo juntos.');
          return;
        }
      } catch(e) {}
      // Fallback: baixa foto + abre WhatsApp com texto
      baixarFotoLeve(foto);
      window.open(`https://api.whatsapp.com/send?text=${encodeURIComponent(texto + '\n\n[Foto baixada automaticamente, anexe ela aqui]')}`, '_blank');
      showToast('Foto baixada. Anexe ela no WhatsApp que abriu.');
      return;
    }
    window.open(`https://api.whatsapp.com/send?text=${encodeURIComponent(texto)}`, '_blank');
    showToast('WhatsApp Comum aberto com laudo. Capture a foto antes para enviar junto.');
  };
  const adicionarNoStatusComFoto = async () => {
    if(fotos.length===0){ showToast('Capture 1 foto primeiro.'); return; }
    const prot = gerarDadosProtocolo() || 'PROT-GADE'; const texto = textoVistoria(prot);
    try{ const blob = await (await fetch(fotos[0])).blob(); const file = new File([blob], `vistoria-${mun.n}.jpg`, {type:'image/jpeg'}); if(navigator.canShare && navigator.canShare({files:[file]})){ await navigator.share({ title:'Vistoria Comunitaria', text: texto, files:[file] }); showToast('Selecione 【entity-WhatsApp¦canonical_name=WhatsApp】 > Status.'); return; } }catch(e){}
    baixarFotoLeve(fotos[0]); window.open(`https://wa.me/?text=${encodeURIComponent(texto)}`, '_blank');
  };
  const gerarLaudoComSarahAI = async () => {
    if(!bairro) { showToast('Informe o bairro para a IA redigir o parecer.'); return; } setIsAiAnalyzing(true); showToast('Sarah AI redigindo parecer técnico comunitário...');
    const promptVistoria = `Elabore um Parecer Tecnico Preliminar de Vistoria e Percepcao de Risco Comunitario para o municipio de ${mun.n}, bairro ${bairro}, referente a demanda: ${categoriaDemanda}, sob a severidade ${severidade}. Agente responsavel: ${nome || userName}. Frente: ${frenteSelecionada}. Dados climaticos: precipitacao ${clima?.precipitation||0}mm, vento ${vento}km/h. Assinatura SHA-256: ${APP_SHA256}. Relato adicional: ${rel}. Estruture com rigor tecnico autonomo do Grupo A Chave da Esperanca (GADE) e encerre com a Nota de Conformidade civica.`;
    try { const response = await fetch(ENVELOPE, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ model: GROQ_MODEL, messages: [{ role: "user", content: promptVistoria }], temperature: 0.4, max_tokens: 600 }) }); const textResp = await response.text(); let respostaGroq = ""; try { const data = JSON.parse(textResp); respostaGroq = data?.choices?.[0]?.message?.content || data?.reply || data?.resposta || ""; } catch { respostaGroq = textResp; } setRel(respostaGroq.replace(/[*#_]/g, '').trim() + `\n\n[Assinatura Criptografica SHA-256: ${APP_SHA256}]`); setIsAiAnalyzing(false); showToast('Parecer tecnico gerado pela Sarah AI.'); } catch(e) { setRel(`PARECER TECNICO DE VISTORIA E PERCEPCAO DE RISCO COMUNITARIO\nMunicipio: ${mun.n} | Bairro: ${bairro}\nDemanda: ${categoriaDemanda}\nAgente: ${nome || userName}\nSeveridade: ${severidade}\nSHA-256: ${APP_SHA256}`); setIsAiAnalyzing(false); showToast('Parecer padrao aplicado.'); }
  };
  // PDF CORRIGIDO - TEXTO QUEBRADO, CARIMBO E FOTO
  const gerarPDFTecnico = () => {
    const prot = gerarDadosProtocolo() || 'PROT-GADE';
    const win = window.open('', '_blank'); if(!win) { showToast('Permita pop-up para gerar PDF.'); return; }
    const textoLimpo = textoVistoria(prot).replace(/\n/g, '<br/>');
    win.document.write(`<html><head><title>Parecer Tecnico Comunitario - ${prot}</title><style>body{font-family:monospace;padding:20px;background:#fff;color:#000;max-width:700px;margin:0 auto} h1{font-size:16px;color:#0077cc} .box{border:2px solid #000;padding:16px;border-radius:10px} .carimbo{background:#030712;color:#00F2FE;padding:12px;border-radius:8px;font-size:11px;line-height:1.6;margin-top:12px} .carimbo b{color:#fff} img{width:100%;max-width:600px;border:2px solid #000;border-radius:8px;margin-top:12px} .btn{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#00F2FE;color:#000;font-weight:900;padding:12px 20px;border-radius:999px;border:0;cursor:pointer} @media print{.btn{display:none}}</style></head><body><h1>PARECER TECNICO COMUNITARIO - GADE</h1><div class="box">${textoLimpo}</div><div class="carimbo"><b>PROTOCOLO:</b> ${prot}<br/><b>GPS:</b> ${gps.lat.toFixed(5)}, ${gps.lon.toFixed(5)} | <b>DATA:</b> ${new Date().toLocaleString('pt-BR')}<br/><b>DEMANDA:</b> ${categoriaDemanda}<br/><b>SEVERIDADE:</b> ${severidade}<br/><b>SHA-256:</b> ${APP_SHA256}<br/><b>CIDAdao SENSOR - GRUPO A CHAVE DA ESPERANCA (GADE)</b></div>${fotos[0] ? `<img src="${fotos[0]}" />` : '<p style="font-size:12px;color:#666">[Sem foto - capture antes de gerar o PDF para incluir a foto com carimbo]</p>'}<br/><button class="btn" onclick="window.print()">SALVAR RELATORIO PDF</button></body></html>`);
    win.document.close(); showToast('Relatorio PDF gerado com carimbo e foto.');
  };
  const formatarTempo = (s) => `${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`;
  return (
    <div className="w-full space-y-3.5 font-mono max-w-4xl mx-auto">
      <div className="p-4 rounded-2xl border border-cyan-500/40 space-y-3 bg-[#030712] shadow-2xl cyber-card relative overflow-hidden">
        <div className="relative z-10 flex justify-between items-center border-b border-cyan-500/30 pb-2.5"><h3 className="text-[11px] text-cyan-300 font-black uppercase tracking-wider">PAINEL DE VISTORIA & DEMANDAS TECNICAS (GADE)</h3></div>
        <div className="bg-black border border-pink-500/30 rounded-xl p-2 text-[9px] text-pink-500 font-bold text-center">NO-MAE MESQUITA IP 10.10.21.15 - AUTONOMIA E SEGURANCA SHA-256</div>
        <div className="bg-black border border-orange-500/40 rounded-xl p-3 space-y-2">
          <div className="flex justify-between items-center"><b className="text-[10px] text-white">CONTROLE DE SIRENES - 3 MIN TOCA + 1 MIN PAUSA + 1 MIN TOCA = 5 MIN</b><span className="text-[9px] text-yellow-300 font-bold">{faseAlarme || 'PRONTIDAO GADE ATIVA'}</span></div>
          {(alarmeRusso || alarmeComunitario) && (<div className="text-center"><div className="text-3xl font-black text-white">{formatarTempo(tempoAlarme)}</div><div className="text-[9px] text-cyan-300">{faseAlarme}</div></div>)}
          <div className="grid grid-cols-2 gap-2">
            <button onClick={() => alarmeRusso ? pararTodasSirenes() : dispararSirene5Minutos('russo')} className={`cyber-button text-[10px] py-2.5 ${alarmeRusso ? '!bg-red-500 !text-white !border-red-400 animate-pulse' : '!border-red-500/50 !text-red-300'}`}>{alarmeRusso ? 'PARAR ALARME RUSSO' : 'DISPARAR ALARME RUSSO (3+1+1)'}</button>
            <button onClick={() => alarmeComunitario ? pararTodasSirenes() : dispararSirene5Minutos('comunitario')} className={`cyber-button text-[10px] py-2.5 ${alarmeComunitario ? '!bg-amber-500 !text-black !border-amber-400 animate-pulse' : '!border-amber-500/50 !text-amber-300'}`}>{alarmeComunitario ? 'PARAR SIRENE COMUNITARIA' : 'PRONTIDAO COMUNITARIA (3+1+1)'}</button>
          </div>
        </div>
        {dicaAtual && camOn && (<div className="bg-cyan-500/10 border border-cyan-500/40 rounded-xl p-2.5 text-[11px] text-cyan-200 leading-relaxed">SARAH NO CAMPO: {dicaAtual}</div>)}
        <div className="space-y-2 bg-black/90 p-3 rounded-xl border border-cyan-500/30">
          <div><label className="text-[9px] text-cyan-300 font-bold uppercase block mb-1">Frente de Atuacao / Ator Comunitario:</label><select value={frenteSelecionada} onChange={e => setFrenteSelecionada(e.target.value)} className="w-full bg-black text-white border border-cyan-500/40 rounded-xl p-2 text-[10px] font-bold">{FRENTES_EQUIPES_TABELA.map((f, i) => <option key={i} value={f}>{f}</option>)}</select></div>
          <div><label className="text-[9px] text-cyan-300 font-bold uppercase block mb-1">Categoria da Demanda Urbana:</label><select value={categoriaDemanda} onChange={e => setCategoriaDemanda(e.target.value)} className="w-full bg-black text-cyan-300 border border-cyan-500/40 rounded-xl p-2 text-[10px] font-bold">{CATEGORIAS_DEMANDAS.map((c, i) => <option key={i} value={c}>{c}</option>)}</select></div>
          <div><label className="text-[9px] text-cyan-300 font-bold uppercase block mb-1">Indicador de Severidade Comunitaria:</label><select value={severidade} onChange={e => setSeveridade(e.target.value)} className="w-full bg-black text-pink-400 border border-cyan-500/40 rounded-xl p-2 text-[10px] font-bold">{SEVERIDADES_COMUNITARIAS.map((s, i) => <option key={i} value={s}>{s}</option>)}</select></div>
        </div>
        <select value={mun.n} onChange={e => { const m = MUNICIPIOS_92.find(x => x.n === e.target.value); setMun(m); }} className="w-full bg-black text-cyan-300 border border-cyan-500/40 rounded-xl p-2.5 text-xs font-bold cursor-pointer">{MUNICIPIOS_92.map((m, i) => <option key={i} value={m.n}>{m.n} (IP: {m.ip})</option>)}</select>
        <div className="bg-black border border-cyan-500/30 rounded-xl p-3 space-y-2.5">
          <div className="flex justify-between items-center"><span className="text-[10px] text-cyan-300 font-bold uppercase">CAMERA COM CARIMBO CALIBRADO & SHA-256</span>{!camOn ? <button onClick={startCam} className="cyber-button text-[10px] py-1.5 px-3">LIGAR Camera</button> : <button onClick={stopCam} className="cyber-button-danger text-[10px] py-1.5 px-3">DESLIGAR</button>}</div>
          <div className="bg-black rounded-xl overflow-hidden border border-cyan-500/30 relative" style={{ minHeight: '180px' }}><video ref={videoRef} autoPlay playsInline muted style={{ width: '100%', height: '180px', objectFit: 'cover', display: camOn ? 'block' : 'none' }} />{!camOn && <div className="h-[180px] grid place-items-center text-slate-500 text-xs font-bold">Toque em Ligar Camera para registrar</div>}{camOn && (<div className="absolute inset-0 pointer-events-none"><div className="absolute top-0 left-0 right-0 h-[2px] bg-cyan-400 animate-raru-scan" /><div className="absolute bottom-2 left-2 right-2"><div className="carimbo-css"><span>{`GPS ${gps.lat.toFixed(4)}, ${gps.lon.toFixed(4)} | ${severidade.slice(0, 22)}`}</span><span>{categoriaDemanda.slice(0, 36)}...</span><span>SHA-256: {APP_SHA256.slice(0, 20)}...</span></div></div></div>)}</div>
          {camOn && (<button onClick={capturarFotoFinal} className="cyber-button-solid w-full text-xs py-3">CAPTURAR FOTO COM CARIMBO TECNICO CALIBRADO</button>)}
          {fotos.length > 0 && (<div className="grid grid-cols-1 gap-2 pt-2">{fotos.map((img, idx) => (<div key={idx} className="relative rounded-lg overflow-hidden border border-cyan-500/40"><img src={img} alt="Vistoria" className="w-full h-32 object-cover" /><button onClick={() => setFotos([])} className="absolute top-1 right-1 bg-red-500 text-white w-5 h-5 text-[10px] font-bold flex items-center justify-center rounded-full">X</button><span className="absolute bottom-1 left-1 bg-black/80 text-[8px] text-green-300 px-2 py-1 rounded">FOTO COM CARIMBO CALIBRADO & SHA-256</span></div>))}</div>)}
        </div>
        <div className="space-y-3"><input value={nome} onChange={e => setNome(e.target.value)} placeholder="Agente Comunitario Responsavel *" className="w-full bg-black border border-cyan-500/30 rounded-xl p-2.5 text-xs text-white" /><input value={bairro} onChange={e => setBairro(e.target.value)} placeholder="Bairro / Comunidade * (Rocha Sobrinho, Chatuba...)" className="w-full bg-black border border-cyan-500/30 rounded-xl p-2.5 text-xs text-white" /><button onClick={gerarLaudoComSarahAI} disabled={isAiAnalyzing} className="cyber-button-solid w-full text-xs py-3.5">{isAiAnalyzing ? "SARAH AI REDIGINDO PARECER TECNICO..." : "GERAR PARECER TECNICO COM SARAH AI"}</button><textarea value={rel} onChange={e => setRel(e.target.value)} rows="5" placeholder="Relato tecnico da inspecao comunitaria e urbana..." className="w-full bg-black border border-cyan-500/30 rounded-xl p-3 text-xs text-white resize-none leading-relaxed" /><button onClick={gerarPDFTecnico} className="cyber-button w-full text-xs py-3">GERAR PARECER TECNICO EM PDF - COM FOTO + CARIMBO</button><button onClick={enviarWhatsComum} className="cyber-button-solid w-full text-xs py-3.5">ENVIAR WHATSAPP COMUM - FOTO + LAUDO JUNTOS</button><button onClick={adicionarNoStatusComFoto} className="cyber-button w-full text-xs py-3">PUBLICAR NO STATUS COM FOTO</button></div>
      </div>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<AppTotalCompleto />);
</script>
</body>
</html>
