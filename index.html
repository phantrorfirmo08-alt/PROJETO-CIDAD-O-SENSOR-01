<style>
  :root {
    --neon-cyan: #00f2fe;
    --neon-blue: #0072ff;
    --dark-bg: #030712;
    --hud-glass: rgba(5, 13, 26, 0.85);
  }

  body {
    background-color: var(--dark-bg);
    color: #e2e8f0;
    font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    overflow-x: hidden;
  }

  .cyber-glass {
    background: var(--hud-glass);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border: 1px solid rgba(0, 242, 254, 0.2);
    box-shadow: 0 0 20px rgba(0, 0, 0, 0.8), inset 0 0 15px rgba(0, 242, 254, 0.05);
    border-radius: 16px;
    position: relative;
  }

  .cyber-glass::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0; height: 1px;
    background: linear-gradient(90deg, transparent, var(--neon-cyan), transparent);
  }

  /* Avatar Compacto (140px) com Aura de Vento e Respiração Cibernética */
  .sara-holobox {
    position: relative;
    width: 100%;
    height: 140px;
    background: #000;
    border-radius: 16px;
    overflow: hidden;
    border: 1.5px solid rgba(0, 242, 254, 0.4);
    box-shadow: 0 0 15px rgba(0, 242, 254, 0.2), inset 0 0 10px rgba(0, 242, 254, 0.1);
    transition: all 0.4s ease;
  }

  /* Efeito de Aura Aspirando o Vento ao Redor (Respiro Ativo) */
  .sara-holobox::after {
    content: '';
    position: absolute;
    inset: -4px;
    border-radius: 18px;
    border: 2px solid rgba(0, 242, 254, 0.6);
    box-shadow: 0 0 15px rgba(0, 242, 254, 0.4), inset 0 0 15px rgba(0, 242, 254, 0.4);
    opacity: 0.7;
    pointer-events: none;
    animation: auraRespiracao 3.5s infinite ease-in-out;
  }

  @keyframes auraRespiracao {
    0%, 100% { transform: scale(1); opacity: 0.4; box-shadow: 0 0 10px rgba(0, 242, 254, 0.2), inset 0 0 10px rgba(0, 242, 254, 0.2); }
    50% { transform: scale(1.02); opacity: 0.9; box-shadow: 0 0 25px rgba(0, 242, 254, 0.8), inset 0 0 25px rgba(0, 242, 254, 0.7); }
  }

  /* Quando falando, a aura acelera e simula a inalação forte do sistema */
  .sara-holobox.active-transmission::after {
    animation: auraInalacao 0.9s infinite ease-in-out;
    border-color: #ffffff;
  }

  @keyframes auraInalacao {
    0%, 100% { transform: scale(0.99); opacity: 0.5; box-shadow: 0 0 10px rgba(0, 242, 254, 0.5); }
    50% { transform: scale(1.03); opacity: 1; box-shadow: 0 0 35px rgba(0, 242, 254, 1), inset 0 0 30px rgba(255, 255, 255, 0.8); }
  }

  .sara-holobox img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: center 20%;
    filter: contrast(1.15) saturate(1.1);
  }

  .hud-badge {
    position: absolute;
    bottom: 8px;
    left: 50%;
    transform: translateX(-50%);
    background: rgba(3, 7, 18, 0.85);
    padding: 3px 10px;
    border-radius: 6px;
    font-size: 8px;
    font-weight: 700;
    letter-spacing: 1.5px;
    color: var(--neon-cyan);
    border: 1px solid rgba(0, 242, 254, 0.3);
    text-transform: uppercase;
    z-index: 10;
  }

  .cyber-btn {
    background: linear-gradient(135deg, rgba(0, 242, 254, 0.15), rgba(0, 114, 255, 0.15));
    border: 1px solid rgba(0, 242, 254, 0.4);
    color: #fff;
    font-weight: 600;
    transition: all 0.2s ease;
    cursor: pointer;
  }

  .cyber-btn:active {
    transform: scale(0.97);
  }

  .cyber-btn-primary {
    background: linear-gradient(135deg, #00f2fe, #0072ff);
    color: #030712;
    font-weight: 800;
    box-shadow: 0 0 15px rgba(0, 242, 254, 0.4);
  }

  .cyber-btn-primary:active {
    transform: scale(0.97);
  }

  .cyber-input {
    background: rgba(3, 7, 18, 0.9);
    border: 1px solid rgba(0, 242, 254, 0.3);
    color: #fff;
    border-radius: 10px;
    outline: none;
    transition: all 0.2s;
  }

  .cyber-input:focus {
    border-color: var(--neon-cyan);
    box-shadow: 0 0 10px rgba(0, 242, 254, 0.25);
  }

  ::-webkit-scrollbar { width: 3px; }
  ::-webkit-scrollbar-thumb { background: rgba(0, 242, 254, 0.4); border-radius: 3px; }

function falar(t){
  let texto = t || document.getElementById('txt').value;
  speechSynthesis.cancel();
  let u = new SpeechSynthesisUtterance(texto);
  u.lang = 'pt-BR'; u.rate = 0.95; u.pitch = 1.1;
  
  let box = document.getElementById('saraBox');
  let status = document.getElementById('saraStatus');

  u.onstart = () => {
    box.classList.add('active-transmission');
    status.innerText = "SARA: INALANDO SINAL / TRANSMITINDO...";
  };
  
  u.onend = () => {
    box.classList.remove('active-transmission');
    status.innerText = "SARA: STANDBY (RESPIRAÇÃO ATIVA)";
  };
  
  speechSynthesis.speak(u);
}

async function atualizarClima() {
  let munKey = document.getElementById('mun').value;
  let loc = coords[munKey] || coords['mesquita'];
  
  document.getElementById('temp').innerText = '...';
  document.getElementById('chuva').innerText = 'Sincronizando satélite...';

  try {
    let res = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${loc.lat}&longitude=${loc.lon}&current=temperature_2m,relative_humidity_2m,rain,precipitation`);
    let data = await res.json();
    
    let temp = data.current.temperature_2m;
    let hum = data.current.relative_humidity_2m;
    let rain = data.current.rain || data.current.precipitation || 0;
    let statusRain = rain > 1.5 ? 'CRÍTICO' : 'ESTÁVEL';

    document.getElementById('temp').innerText = temp + '°C';
    document.getElementById('chuva').innerText = `${rain}mm/h • ${hum}% • ${statusRain}`;
    
    falar(`Telemetria de ${loc.name} atualizada. ${temp} graus e ${rain} milímetros de chuva por hora.`);
  } catch (e) {
    document.getElementById('temp').innerText = 'ERRO';
    document.getElementById('chuva').innerText = 'Falha de link';
    falar('Erro de conexão com o satélite meteorológico.');
  }
}

let alarmInt, actx;
function alarme(tipo){
  pararAlarme();
  actx = new (window.AudioContext || window.webkitAudioContext)();
  let speed = tipo == 'br' ? 350 : 160, tog = false;
  alarmInt = setInterval(()=>{
    let o = actx.createOscillator(), g = actx.createGain();
    o.type = 'square'; o.frequency.value = tog ? 900 : 400; g.gain.value = 0.15;
    o.connect(g); g.connect(actx.destination); o.start();
    o.stop(actx.currentTime + speed/1000); tog = !tog;
  }, speed);
  falar(tipo == 'br' ? 'Alarme padrão brasileiro ativado' : 'Alarme tático russo ativado');
}

function pararAlarme(){
  if(alarmInt){ clearInterval(alarmInt); alarmInt = null; }
}

function enviarChat(){
  let i = document.getElementById('chatIn');
  if(!i.value) return;
  let ch = document.getElementById('chat');
  ch.innerHTML += '<div class="text-cyan-400">&gt; '+i.value+'</div>';
  let r = 'Processado: '+i.value;
  ch.innerHTML += '<div class="text-gray-300">&gt; SARA: '+r+'</div>';
  ch.scrollTop = ch.scrollHeight;
  falar(r);
  i.value = '';
}

function escolherMun(){
  let mSelect = document.getElementById('mun');
  let mName = mSelect.options[mSelect.selectedIndex].text;
  document.getElementById('munInfo').innerText = mName + ' • ATIVO';
  atualizarClima();
}

window.onload = () => {
  atualizarClima();
};
