<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel de Monitoramento Real - Comunidade do Sebinho / Mesquita</title>
    <style>
        .painel-real-container {
            width: 100%;
            max-width: 1000px;
            margin: 0 auto;
            background: #0a0f1d;
            border: 2px solid #00f0ff;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.6);
            font-family: Arial, sans-serif;
        }
        .painel-header {
            background: #111b2b;
            color: #00f0ff;
            padding: 12px 15px;
            font-weight: bold;
            font-size: 13px;
            letter-spacing: 1px;
            border-bottom: 1px solid #00f0ff;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .status-ao-vivo {
            display: flex;
            align-items: center;
            gap: 6px;
            color: #00ff66;
            font-size: 11px;
        }
        .ponto-verde {
            width: 8px;
            height: 8px;
            background: #00ff66;
            border-radius: 50%;
            box-shadow: 0 0 8px #00ff66;
            animation: piscar 1s infinite alternate;
        }
        .mapa-frame-wrapper {
            position: relative;
            width: 100%;
            height: 550px;
            background: #000;
        }
        .mapa-frame-wrapper iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
        @keyframes piscar {
            from { opacity: 0.3; }
            to { opacity: 1; }
        }
    </style>
</head>
<body>

    <div class="painel-real-container">
        <div class="painel-header">
            <span>MAPA OFICIAL EM TEMPO REAL: SEBINHO / RIO SARAPUÍ (VIA LIGHT x LINHA FÉRREA)</span>
            <div class="status-ao-vivo">
                <div class="ponto-verde"></div>
                RADAR E VENTO AO VIVO
            </div>
        </div>
        
        <div class="mapa-frame-wrapper">
            <!-- MAPA METEOROLÓGICO REAL E OFICIAL (WINDY EMBED - SATÉLITE, NUVENS E VENTO AO VIVO) -->
            <!-- Coordenadas exatas focadas milimetricamente entre a Linha Férrea e a Via Light em Mesquita/RJ -->
            <iframe 
                src="https://embed.windy.com/embed2.html?lat=-22.7845&lon=-43.4190&detailLat=-22.7845&detailLon=-43.4190&width=650&height=550&zoom=15&level=surface&overlay=wind&product=ecmwf&menu=&message=&marker=true&calendar=now&pressure=true&type=map&location=coordinates&detail=true&metricWind=default&metricTemp=default" 
                allowfullscreen>
            </iframe>
        </div>
    </div>

</body>
</html>
