function montarPersonalidadeSarah(){

}

function contextoTempoBrasilia(){
  const agora = new Date();
  const fmt = (opts) => new Intl.DateTimeFormat('pt-BR', { timeZone: 'America/Sao_Paulo', ...opts }).format(agora);
  const hora = fmt({ hour: '2-digit', minute: '2-digit', hour12: false });
  const dataCompleta = fmt({ weekday: 'long', day: '2-digit', month: 'long', year: 'numeric' });
  const diaAno = Math.floor((agora - new Date(agora.getFullYear(), 0, 0)) / 86400000);
  const diasNoAno = ((agora.getFullYear() % 4 === 0 && agora.getFullYear() % 100 !== 0) || agora.getFullYear() % 400 === 0) ? 366 : 365;
  const meses = ["Janeiro","Fevereiro","Março","Abril","Maio","Junho","Julho","Agosto","Setembro","Outubro","Novembro","Dezembro"];
  const mesAtual = meses[agora.getMonth()];
  const diasNoMes = new Date(agora.getFullYear(), agora.getMonth() + 1, 0).getDate();
  const estacao = (() => {
    const m = agora.getMonth() + 1, d = agora.getDate();
    if ((m === 12 && d >= 21) || m <= 3 || (m === 3 && d < 20)) return "Verão";
    if ((m === 3 && d >= 20) || m <= 6 || (m === 6 && d < 21)) return "Outono";
    if ((m === 6 && d >= 21) || m <= 9 || (m === 9 && d < 23)) return "Inverno";
    return "Primavera";
  })();
  return { hora, dataCompleta, mesAtual, diasNoMes, diaAno, diasNoAno, estacao };
}

async function chamarSarah(tipo, mensagensHistorico, municipioAtual, bairroAtual, abaAtual, dadosClimaContexto, userName = "Alexander") {

  const nomeOperador = userName && userName.trim() ? userName.trim() : "Alexander";

  const instrucaoSaudacaoUnica = globalSaudacaoEmitida
    ? "ATENÇÃO ABSOLUTA: A saudação temporal já foi feita no início. NUNCA inicie frases com 'Bom dia', 'Boa tarde' ou 'Boa noite'. Responda direto ao assunto de forma fluida."
    : `ATENÇÃO ABSOLUTA: Utilize a saudação '${saudacaoCerta}' apenas UMA vez no início desta conversa. Nos diálogos seguintes, nunca repita saudações.`;

  const baseSarah = montarPersonalidadeSarah() + `
[CONTEXTO TÁTICO ATUAL]
Operador: ${nomeOperador}
Município: ${municipioAtual || 'Mesquita'}
Bairro/Setor: ${bairroAtual || 'Rocha Sobrinho'}

Calendário: ${t.mesAtual}, dia ${t.diaAno} de ${t.diasNoAno} do ano, estação: ${t.estacao}
${instrucaoSaudacaoUnica}`;

  let promptFinal = baseSarah;
  try {
    const response = await fetch(SARAH_PROXY_URL, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        model: "openai/gpt-oss-120b",
        messages: [{ role: "system", content: promptFinal }, ...mensagensHistorico],
        temperature: 0.5,
        max_tokens: 400
      })
    });
    const data = await response.json();
    if (!data.error) {
      const msg = data?.choices?.[0]?.message;
      let texto = msg?.content || msg?.reasoning_content;
      if (texto && texto.trim().length > 0) {
        globalSaudacaoEmitida = true;
        texto = texto.replace(/[*#]/g, '').replace(/cerquilha/gi, '').replace(/asterisco/gi, '');

  } catch (e) {}

  try {

  globalSaudacaoEmitida = true;
  return `Calma, ${nomeOperador}, tô contigo aqui na escuta. Vamo resolver isso junto agora.`;

function falarSarah(texto, vozIndex = 0) {
  try {
    if (localStorage.getItem("raru_sound_enabled") === "false") return;
  } catch(e) {}
  if (!("speechSynthesis" in window)) return;
  try {
    window.speechSynthesis.cancel();
    const cleanText = String(texto).replace(/[*#]/g, '').replace(/https?:\/\/\S+/g, "").trim();
    if (!cleanText) return;
    const utterance = new SpeechSynthesisUtterance(cleanText);
    utterance.lang = "pt-BR";
    const voices = window.speechSynthesis.getVoices();
    const ptVoices = voices.filter(v => v.lang.toLowerCase().includes('pt'));
    const targetVoice = ptVoices[vozIndex] || ptVoices[0] || voices[0];
    if (targetVoice) utterance.voice = targetVoice;
    let perfil = null;
    try { perfil = PERFIS_VOZ_OFICIAIS.find(p => p.id === localStorage.getItem("raru_perfil_voz")); } catch(e) {}
    if (perfil) {
      utterance.pitch = perfil.pitch;
      utterance.rate = perfil.rate;
    } else {
      utterance.pitch = 1.05;
      utterance.rate = 1.15;
    }
    window.speechSynthesis.speak(utterance);
  } catch(e) {}
}

async function gerarArquivoIconeEscudo() {
  return new Promise((resolve) => {
    const canvas = document.createElement('canvas');
    canvas.width = 512; canvas.height = 512;
    const ctx = canvas.getContext('2d');
    const bgGrad = ctx.createRadialGradient(256, 256, 30, 256, 256, 320);
    bgGrad.addColorStop(0, '#0A2547'); bgGrad.addColorStop(1, '#02040A');
    ctx.fillStyle = bgGrad; ctx.fillRect(0, 0, 512, 512);
    canvas.toBlob((blob) => resolve(blob ? new File([blob], 'BASE_CLIMATICA_TATICA.png', { type: 'image/png' }) : null), 'image/png');
  });
}

  const [mObs, setMObs] = React.useState('');
  const [filtroMon, setFiltroMon] = React.useState('');

  const salvarRota = () => {
    if(!rNome.trim() || !rEnd.trim()) { showToast('Escreve o nome e o endereço.'); return; }
    const nova = { nome: rNome.trim(), endereco: rEnd.trim(), info: rInfo.trim(), tipo: rTipo };
    const atualizadas = [...rotas, nova];
    setRotas(atualizadas);
    localStorage.setItem('rotasFugaReais', JSON.stringify(atualizadas));
    setRNome(''); setREnd(''); setRInfo('');
    showToast('Rota salva!');
  };

  const excluirRota = (i) => {
    if(!confirm('Excluir essa rota?')) return;
    const atualizadas = [...rotas]; atualizadas.splice(i, 1);

    if(!mNome.trim() || !mMun || !mBairro.trim() || !mSenha.trim()) { showToast('Preencha os campos obrigatórios.'); return; }

function RadarMeteorologicoModule({ showToast }) {
  const [dados, setDados] = useState({});
  const [status, setStatus] = useState('Conectando Open-Meteo...');
  const [cidadeSel1, setCidadeSel1] = useState('Mesquita');
  const [cidadeSel2, setCidadeSel2] = useState('Nova Iguaçu');
  const [modoVisualizacao, setModoVisualizacao] = useState('radar');
  const chartTempRef = useRef(null);
  const chartRainRef = useRef(null);

  useEffect(() => {
    async function carregar(){
      try{
        const lats = MUNICIPIOS_92.map(c => c.lat).join(',');
        const lons = MUNICIPIOS_92.map(c => c.lon).join(',');
        const url = `https://api.open-meteo.com/v1/forecast?latitude=${lats}&longitude=${lons}&current=temperature_2m,relative_humidity_2m,wind_speed_10m&hourly=temperature_2m,precipitation_probability,wind_speed_10m&timezone=America%2FSao_Paulo&forecast_days=1`;
        const r = await fetch(url);
        const j = await r.json();
        const arr = Array.isArray(j) ? j : [j];
        const mapa = {};
        arr.forEach((item, i) => {
          const c = MUNICIPIOS_92[i];
          if(!c) return;
          const hora = new Date().getHours();
          mapa[c.n] = {
            temp: item.current.temperature_2m,
            umi: item.current.relative_humidity_2m,
            vento: item.current.wind_speed_10m,
            chuva: item.hourly.precipitation_probability[hora] || 0,
            hourly: item.hourly
          };
        });
        setDados(mapa);
        setStatus('Open-Meteo conectado · 92 municípios');
      }catch(e){ setStatus('Sem conexão'); }
    }
    carregar();
  }, [cidadeSel1]);

  return (
    <div className="space-y-4 w-full font-mono">
      <div className="rounded-[22px] border border-cyan-400/40 bg-[#02122A] p-4 space-y-3">
        <h3 className="text-[15px] font-black text-cyan-300 uppercase tracking-widest text-center">Radar Meteorológico (92 Municípios)</h3>
        <p className="text-[11px] text-slate-300 text-center">{status}</p>
        <div className="grid grid-cols-2 gap-2">
          <button onClick={() => setModoVisualizacao('radar')} className={`cyber-button text-[10px] py-2 ${modoVisualizacao === 'radar' ? '!bg-cyan-400 !text-void' : ''}`}>RADAR</button>
          <button onClick={() => setModoVisualizacao('satelite')} className={`cyber-button text-[10px] py-2 ${modoVisualizacao === 'satelite' ? '!bg-cyan-400 !text-void' : ''}`}>SATÉLITE</button>
        </div>
        <select value={cidadeSel1} onChange={(e) => setCidadeSel1(e.target.value)} className="w-full bg-[#030712] text-white border border-cyan-400/40 rounded-xl p-2 text-xs font-bold">
          {MUNICIPIOS_92.map((m, idx) => <option key={idx} value={m.n}>{m.n}</option>)}
        </select>
        {modoVisualizacao === 'satelite' && (
          <div className="relative w-full aspect-video rounded-2xl overflow-hidden border border-cyan-400/50 bg-black">
            <iframe src="https://www.star.nesdis.noaa.gov/GOES/fulldisk_band.php?sat=G19&band=GEOCOLOR&length=12&dim=1" title="Satélite" className="w-full h-full border-none" />
          </div>
        )}
      </div>
    </div>
  );
}

  const [rel, setRel] = React.useState('');
  const [gps, setGps] = React.useState({lat:0, lon:0, acc:''});
  const [isAiAnalyzing, setIsAiAnalyzing] = React.useState(false);
  const [clima, setClima] = React.useState(null);

  const [frenteSelecionada, setFrenteSelecionada] = React.useState(FRENTES_EQUIPES_TABELA[5]);
  const [alarmeRusso, setAlarmeRusso] = React.useState(false);
  const [alarmeCemaden, setAlarmeCemaden] = React.useState(false);
  const [cemadenNivel, setCemadenNivel] = React.useState('VERDE');
  const [vento, setVento] = React.useState(0);

  const audioRef = React.useRef(null);
  const sireneIntervalRef = React.useRef(null);
  const timeoutSireneRef = React.useRef(null);
  const videoRef = React.useRef(null);
  const streamRef = React.useRef(null);
  const trackRef = React.useRef(null);

  const RISCOS_RARU = ["R1 - BAIXO / PREVENTIVO","R2 - MODERADO / ALERTA","R3 - ALTO / ENXURRADA","R4 - EVACUAÇÃO PREVENTIVA","RH - CONVERGÊNCIA SERRAS","RE - ESTRUTURAL / TALUDE"];
  const [risco, setRisco] = React.useState(RISCOS_RARU[1]);
  const [protAtual, setProtAtual] = React.useState(null);

  React.useEffect(() => {
    if (userName && !nome) setNome(userName);
  }, [userName]);

  React.useEffect(() => {
    if (!mun?.lat) return;
    fetch(`https://api.open-meteo.com/v1/forecast?latitude=${mun.lat}&longitude=${mun.lon}&current=temperature_2m,relative_humidity_2m,precipitation,wind_speed_10m,wind_gusts_10m&timezone=auto`)
    .then(r => r.json())
    .then(d => {
      setClima(d.current);
      setVento(d.current?.wind_gusts_10m || d.current?.wind_speed_10m || 0);
      const chuva = d.current?.precipitation || 0;
      if(chuva >= 50) setCemadenNivel('VERMELHO');
      else if(chuva >= 30) setCemadenNivel('LARANJA');
      else if(chuva >= 10) setCemadenNivel('AMARELO');
      else setCemadenNivel('VERDE');
    })
    .catch(() => {});
  }, [mun]);

  React.useEffect(() => {
    return () => {
      pararTodasSirenes();
      if (streamRef.current) streamRef.current.getTracks().forEach(t => t.stop());
    };
  }, []);

  const pararTodasSirenes = () => {
    setAlarmeRusso(false);
    setAlarmeCemaden(false);
    if(sireneIntervalRef.current) clearInterval(sireneIntervalRef.current);
    if(timeoutSireneRef.current) clearTimeout(timeoutSireneRef.current);
    try{ audioRef.current?._osc?.stop(); audioRef.current?.close(); }catch(e){}
    audioRef.current = null;
  };

  const dispararSirene5Minutos = (tipo) => {
    pararTodasSirenes();
    if (tipo === 'russo') setAlarmeRusso(true);
    else setAlarmeCemaden(true);

    showToast(`Sirene ${tipo === 'russo' ? 'Alarme Russo' : 'CEMADEN'} disparada por 5 minutos.`);
    falarSarah(`Calma, ${userName || 'Alexander'}, acionei o alerta preditivo aqui. Vamo ficar de olho.`, vozSelecionada);

    try {
      if(!audioRef.current) audioRef.current = new (window.AudioContext||window.webkitAudioContext)();
      const ctx = audioRef.current; ctx.resume();
      const osc = ctx.createOscillator(); const gain = ctx.createGain();
      osc.type = tipo === 'russo' ? 'sawtooth' : 'sine';
      osc.frequency.value = tipo === 'russo' ? 450 : 600;
      gain.gain.value = 0.15;
      osc.connect(gain); gain.connect(ctx.destination); osc.start();
      audioRef.current._osc = osc;

      let subindo = true;
      sireneIntervalRef.current = setInterval(()=>{
        let f = osc.frequency.value;
        if(subindo){ f+=30; if(f>=950) subindo=false; }
        else { f-=30; if(f<=400) subindo=true; }
        osc.frequency.setTargetAtTime(f, ctx.currentTime, 0.1);
      }, 80);

      timeoutSireneRef.current = setTimeout(() => {
        pararTodasSirenes();
        showToast("Ciclo de 5 minutos da sirene encerrado.");
      }, 300000);
    } catch(e) {}
  };

  const atualizarGPS = () => {
    if(!navigator.geolocation) return;
    navigator.geolocation.getCurrentPosition(p => {
      setGps({ lat: p.coords.latitude, lon: p.coords.longitude, acc: Math.round(p.coords.accuracy) });
      setMun(m => ({ ...m, lat: p.coords.latitude, lon: p.coords.longitude }));
      showToast(`GPS ${Math.round(p.coords.accuracy)}m sincronizado.`);
    }, () => {}, { enableHighAccuracy: true, timeout: 5000 });
  };

  const startCam = async () => {
    try {
      const s = await navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: "environment" } } });
      streamRef.current = s;
      const track = s.getVideoTracks()[0];
      trackRef.current = track;
      const caps = track.getCapabilities ? track.getCapabilities() : {};
      if (caps.zoom) { setHasZoomSupport(true); setMaxZoom(caps.zoom.max || 5); setZoomLevel(caps.zoom.min || 1); }
      setCamOn(true);
      setTimeout(() => { if(videoRef.current){ videoRef.current.srcObject = s; videoRef.current.play().catch(() => {}); } }, 100);
      atualizarGPS();
      falarSarah(`Câmera ligada em ${mun.n}. Tô vendo tudo com você, ${userName || 'Alexander'}.`, vozSelecionada);
    } catch { showToast('Câmera bloqueada.'); }
  };

  const stopCam = () => { if(streamRef.current) streamRef.current.getTracks().forEach(t => t.stop()); setCamOn(false); };

  const handleZoomChange = (e) => {
    const val = parseFloat(e.target.value);
    setZoomLevel(val);
    if (trackRef.current && trackRef.current.applyConstraints) {
      trackRef.current.applyConstraints({ advanced: [{ zoom: val }] }).catch(() => {});
    }
  };

  const capturarFotoFinal = () => {
    const v = videoRef.current; if(!v) return null;
    const canvas = document.createElement('canvas');
    canvas.width = 800;
    canvas.height = Math.round(800 * (v.videoHeight / v.videoWidth || 0.75));
    const ctx = canvas.getContext('2d');
    ctx.drawImage(v, 0, 0, canvas.width, canvas.height);

    ctx.fillStyle = 'rgba(3,7,18,0.92)';
    ctx.fillRect(0, canvas.height - 120, canvas.width, 120);
    ctx.fillStyle = '#00F2FE'; ctx.font = 'bold 11px monospace';
    ctx.fillText(`DATA ${new Date().toLocaleString('pt-BR')} | GPS ${(gps.lat||mun.lat).toFixed(5)}, ${(gps.lon||mun.lon).toFixed(5)}`, 15, canvas.height - 96);
    ctx.fillStyle = '#fff'; ctx.font = 'bold 11px monospace';
    ctx.fillText(`AGENTE ${(nome || 'Comunitário').slice(0,22)} | LOCALIDADE ${(bairro || 'Local').slice(0,18)} | ZOOM ${zoomLevel}x`, 15, canvas.height - 76);
    ctx.fillStyle = '#FF0055'; ctx.font = 'bold 11px monospace';
    ctx.fillText(`RISCO ${risco} | CEMADEN ${cemadenNivel}`, 15, canvas.height - 56);
    ctx.fillStyle = '#FFA500'; ctx.font = 'bold 10px monospace';
    ctx.fillText(`FRENTE ${frenteSelecionada.slice(0, 55)}`, 15, canvas.height - 36);
    ctx.fillStyle = '#00FF88'; ctx.font = 'bold 10px monospace';
    ctx.fillText(`CIDADÃO SENSOR - GADE (GRUPO A CHAVE DA ESPERANÇA)`, 15, canvas.height - 14);

    const base64Final = canvas.toDataURL('image/jpeg', 0.85);
    setFotos([base64Final]);
    showToast(`Foto com zoom e carimbo gerada.`);
    falarSarah("Boa foto capturada. Registro pronto para o laudo.", vozSelecionada);
    return base64Final;
  };

  const textoVistoria = (prot) => `[REGISTRO DE VISTORIA COMUNITÁRIA - CIDADÃO SENSOR]\nProtocolo: ${prot || protAtual || 'PROT-RARU'}\nAgente: ${nome || userName || 'Comunitário'}\nLocal: ${mun.n} - ${bairro}\nClassificação: ${risco}\nFrente: ${frenteSelecionada}\nCEMADEN: ${cemadenNivel} | Zoom: ${zoomLevel}x\nGOES-19 | Chuva ${clima?.precipitation||0}mm | Vento ${vento}km/h\nGPS: ${(gps.lat||mun.lat).toFixed(5)}, ${(gps.lon||mun.lon).toFixed(5)}\nRelatório: ${rel}`;

  const enviarWhatsComum = async () => {
    const dados = await gerarDados(); if(!dados) return;
    const texto = textoVistoria(dados.protocolo);
    if(fotos[0] && navigator.canShare){
      try{
        const blob = await (await fetch(fotos[0])).blob();
        const file = new File([blob], `vistoria-${mun.n}.jpg`, {type:'image/jpeg'});
        if(navigator.canShare({files:[file]})){ await navigator.share({text: texto, files:[file]}); showToast('WhatsApp Comum enviado com foto.'); return; }
      }catch(e){}
    }
    window.open(`https://api.whatsapp.com/send?text=${encodeURIComponent(texto)}`, '_blank');
    if(fotos[0]) baixarFotoLeve(fotos[0]);
    showToast('WhatsApp Comum aberto.');
  };

  const enviarWhatsBusiness = () => {
    gerarDados().then(dados => { if(!dados) return;
      window.open(`https://wa.me/?text=${encodeURIComponent(textoVistoria(dados.protocolo))}`, '_blank');
      if(fotos[0]) baixarFotoLeve(fotos[0]);
      showToast('Selecione WhatsApp Business.');
    });
  };

  const adicionarNoStatusComFoto = async () => {
    if(fotos.length===0){ showToast('Capture 1 foto primeiro.'); return; }
    const texto = textoVistoria();
    try{
      const blob = await (await fetch(fotos[0])).blob();
      const file = new File([blob], `vistoria-${mun.n}.jpg`, {type:'image/jpeg'});
      if(navigator.canShare && navigator.canShare({files:[file]})){
        await navigator.share({ title:'Vistoria Comunitária', text: texto, files:[file] });
        showToast('Selecione WhatsApp > Status.'); return;
      }
    }catch(e){}
    baixarFotoLeve(fotos[0]);
    window.open(`https://wa.me/?text=${encodeURIComponent(texto)}`, '_blank');
  };

  const baixarFotoLeve = (base64) => { const a=document.createElement('a'); a.href=base64; a.download=`vistoria-${mun.n}.jpg`; a.click(); };

  const gerarLaudoComSarahAI = async () => {
    if(!bairro) { showToast('Informe o bairro para a IA redigir o relatório.'); return; }
    setIsAiAnalyzing(true);
    showToast('Sarah AI redigindo relatório técnico...');
    const tCtx = contextoTempoBrasilia();
    const promptVistoria = `Elabore um Relatório Técnico Preliminar de Vistoria Comunitária e Geotécnica para o município de ${mun.n}, bairro ${bairro}, sob a frente ${frenteSelecionada}. Agente responsável: ${nome || userName}. Classificação de Risco: ${risco}. Dados climáticos atuais: precipitação ${clima?.precipitation||0}mm, vento ${vento}km/h, nível CEMADEN ${cemadenNivel}. Data e hora oficial de Brasília: ${tCtx.dataCompleta}, ${tCtx.hora}. Relato do agente: ${rel}.`;
    try {
      const respostaGroq = await chamarSarah('laudo', [{ role: 'user', content: promptVistoria }], mun.n, bairro, 'vistoria', clima, userName);
      setRel(respostaGroq);
      setIsAiAnalyzing(false);
      showToast('Relatório técnico gerado pela Sarah AI.');
      falarSarah("Laudo técnico redigido com sucesso. Vamo conferir.", vozSelecionada);
    } catch(e) {
      setRel(`RELATÓRIO TÉCNICO COMUNITÁRIO - CIDADÃO SENSOR\nMunicípio: ${mun.n} | Bairro: ${bairro}\nAgente: ${nome || userName}\nFrente: ${frenteSelecionada}\nClassificação de Risco: ${risco}.`);
      setIsAiAnalyzing(false);
      showToast('Relatório padrão aplicado.');
    }
  };

  const gerarDados = async () => {
    if(!nome) { showToast('Informe o nome do responsável.'); return null; }
    if(!bairro) { showToast('Informe o bairro.'); return null; }
    const seq = Math.floor(Math.random() * 8999 + 1000);
    const sig = mun.n.slice(0, 3).toUpperCase();
    const prot = `PROT-RARU-${sig}-2026-${seq}`;
    setProtAtual(prot);
    return { protocolo: prot };
  };

  const gerarPDFLeve = async () => {
    const dados = await gerarDados(); if(!dados) return;
    const canvas = document.createElement('canvas');
    canvas.width = 600; canvas.height = 800;
    const ctx = canvas.getContext('2d');
    ctx.fillStyle = '#02040A'; ctx.fillRect(0,0,600,800);
    ctx.fillStyle = '#00F2FE'; ctx.font = 'bold 16px monospace';
    ctx.fillText('RELATÓRIO COMUNITÁRIO - CIDADÃO SENSOR', 20, 35);
    ctx.fillStyle = '#fff'; ctx.font = '11px monospace';
    ctx.fillText(`Protocolo: ${dados.protocolo}`, 20, 60);
    ctx.fillText(`Agente/Responsável: ${nome}`, 20, 82);
    ctx.fillText(`Local: ${mun.n} - ${bairro}`, 20, 104);
    ctx.fillText(`Frente: ${frenteSelecionada.slice(0, 50)}`, 20, 126);
    ctx.fillText(`Risco: ${risco} | CEMADEN: ${cemadenNivel}`, 20, 148);
    const finalizar = () => {
      const base64PDF = canvas.toDataURL('image/jpeg', 0.70);
      const win = window.open('', '_blank');
      win.document.write(`<html><head><title>Relatório Comunitário</title><style>body{margin:0;background:#000;display:flex;justify-content:center} img{width:100%;max-width:600px} .btn{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#00F2FE;color:#000;font-weight:900;padding:12px 20px;border-radius:999px;border:0} @media print{.btn{display:none}}</style></head><body><img src="${base64PDF}"><button class="btn" onclick="window.print()">SALVAR RELATÓRIO PDF</button></body></html>`);
      showToast('Relatório PDF gerado.');
    };
    if(fotos[0]){ const img = new Image(); img.onload = ()=>{ ctx.drawImage(img, 20, 430, 280, 180); finalizar(); }; img.src = fotos[0]; }
    else finalizar();
  };

  return (
    <div className="w-full space-y-3.5 font-mono max-w-4xl mx-auto">
      <style>{`.carimbo-css{ background:rgba(3,7,18,0.88); border:1px solid #00F2FE; border-radius:8px; padding:6px 8px; display:flex; flex-direction:column; gap:2px; font-size:8px; color:#00F2FE; line-height:1.4; } .carimbo-css span:nth-child(2){ color:#fff; } .carimbo-css span:nth-child(3){ color:#FF0055; font-weight:900; }`}</style>
      <div className="p-4 rounded-2xl border border-cyberCyan/40 space-y-3 bg-[#030712] shadow-2xl cyber-card relative overflow-hidden">
        <div className="absolute inset-0 cloud-layer-anim"></div>
        <div className="relative z-10 flex justify-between items-center border-b border-cyberCyan/30 pb-2.5">
          <h3 className="text-[11px] text-cyberCyan font-black uppercase tracking-wider">VISTORIA COMUNITÁRIA & SIRENES (5 MIN)</h3>
          <button onClick={onBackToDashboard} className="cyber-button-danger text-[10px] py-1 px-3 !min-h-[32px]">FECHAR</button>
        </div>

        <div className="bg-black border border-orange-500/40 rounded-xl p-3 space-y-2">
          <div className="flex justify-between items-center">
            <b className="text-[10px] text-white">CONTROLE DE SIRENES (DURAÇÃO: 5 MIN)</b>
            <span className="text-[9px] text-yellow-300 font-bold">CEMADEN: {cemadenNivel}</span>
          </div>
          <div className="grid grid-cols-2 gap-2">
            <button onClick={() => alarmeRusso ? pararTodasSirenes() : dispararSirene5Minutos('russo')} className={`cyber-button text-[10px] py-2.5 ${alarmeRusso ? '!bg-red-500 !text-white !border-red-400 animate-pulse' : '!border-red-500/50 !text-red-300'}`}>
              {alarmeRusso ? 'PARAR ALARME RUSSO' : 'DISPARAR ALARME RUSSO (5 MIN)'}
            </button>
            <button onClick={() => alarmeCemaden ? pararTodasSirenes() : dispararSirene5Minutos('cemaden')} className={`cyber-button text-[10px] py-2.5 ${alarmeCemaden ? '!bg-amber-500 !text-black !border-amber-400 animate-pulse' : '!border-amber-500/50 !text-amber-300'}`}>
              {alarmeCemaden ? 'PARAR SIRENE CEMADEN' : 'DISPARAR SIRENE CEMADEN (5 MIN)'}
            </button>
          </div>
        </div>

        <div className="space-y-1.5 bg-void/90 p-3 rounded-xl border border-cyberCyan/30">
          <label className="text-[9px] text-cyberCyan font-bold uppercase block">Selecionar Frente / Ator Comunitário ou Técnico:</label>
          <select value={frenteSelecionada} onChange={e => setFrenteSelecionada(e.target.value)} className="w-full bg-black text-white border border-cyberCyan/40 rounded-xl p-2.5 text-[10px] font-bold cursor-pointer">
            {FRENTES_EQUIPES_TABELA.map((f, i) => <option key={i} value={f}>{f}</option>)}
          </select>
        </div>

        <select value={mun.n} onChange={e => { const m = MUNICIPIOS_92.find(x => x.n === e.target.value); setMun(m); }} className="w-full bg-black text-cyberCyan border border-cyberCyan/40 rounded-xl p-2.5 text-xs font-bold cursor-pointer">
          {MUNICIPIOS_92.map((m, i) => <option key={i} value={m.n}>{m.n} (IP: {m.ip})</option>)}
        </select>

        <div className="bg-black border border-cyberCyan/30 rounded-xl p-3 space-y-2.5">
          <div className="flex justify-between items-center">
            <span className="text-[10px] text-cyberCyan font-bold uppercase">CÂMERA COM CARIMBO E ZOOM</span>
            {!camOn ?
              <button onClick={startCam} className="cyber-button text-[10px] py-1.5 px-3">LIGAR Câmera</button> :
              <button onClick={stopCam} className="cyber-button-danger text-[10px] py-1.5 px-3">DESLIGAR</button>
            }
          </div>
          <div className="bg-black rounded-xl overflow-hidden border border-cyberCyan/30 relative" style={{ minHeight: '180px' }}>
            <video ref={videoRef} autoPlay playsInline muted style={{ width: '100%', height: '180px', objectFit: 'cover', display: camOn ? 'block' : 'none' }} />
            {!camOn && <div className="h-[180px] grid place-items-center text-slate-500 text-xs font-bold">Toque em Ligar Câmera para registrar</div>}
            {camOn && (
              <div className="absolute inset-0 pointer-events-none">
                <div className="absolute top-0 left-0 right-0 h-[2px] bg-cyberCyan animate-raru-scan" />
                <div className="absolute bottom-2 left-2 right-2">
                  <div className="carimbo-css">
                    <span>{`GPS ${(gps.lat||mun.lat).toFixed(4)}, ${(gps.lon||mun.lon).toFixed(4)} | ZOOM ${zoomLevel}x`}</span>
                    <span>RISCO {risco}</span>
                    <span>FRENTE {frenteSelecionada.slice(0, 38)}...</span>
                  </div>
                </div>
              </div>
            )}
          </div>

          {camOn && hasZoomSupport && (
            <div className="space-y-1 bg-gray-900 p-2.5 rounded-xl border border-cyberCyan/30">
              <div className="flex justify-between text-[10px] text-cyberCyan font-bold">
                <span>CONTROLE DE ZOOM</span>
                <span>{zoomLevel.toFixed(1)}x / {maxZoom}x</span>
              </div>
              <input type="range" min="1" max={maxZoom} step="0.1" value={zoomLevel} onChange={handleZoomChange} className="w-full accent-cyberCyan cursor-pointer" />
            </div>
          )}

          {camOn && (
            <button onClick={capturarFotoFinal} className="cyber-button-solid w-full text-xs py-3">
              CAPTURAR FOTO COM ZOOM E CARIMBO TÉCNICO
            </button>
          )}
          {fotos.length > 0 && (
            <div className="grid grid-cols-1 gap-2 pt-2">
              {fotos.map((img, idx) => (
                <div key={idx} className="relative rounded-lg overflow-hidden border border-cyberCyan/40">
                  <img src={img} alt="Vistoria" className="w-full h-32 object-cover" />
                  <button onClick={() => setFotos([])} className="absolute top-1 right-1 bg-red-500 text-white w-5 h-5 text-[10px] font-bold flex items-center justify-center rounded-full">X</button>
                </div>
              ))}
            </div>
          )}
        </div>

        <div className="space-y-3">
          <input value={nome} onChange={e => setNome(e.target.value)} placeholder="Agente Comunitário / Responsável *" className="w-full bg-black border border-cyberCyan/30 rounded-xl p-2.5 text-xs text-white" />
          <select value={risco} onChange={e => setRisco(e.target.value)} className="w-full bg-black border border-cyberCyan/30 rounded-xl p-2.5 text-xs text-cyberCyan font-bold cursor-pointer">
            {RISCOS_RARU.map((r, i) => <option key={i} value={r}>{r}</option>)}
          </select>
          <input value={bairro} onChange={e => setBairro(e.target.value)} placeholder="Bairro / Comunidade * (Rocha Sobrinho, Vila Sebinho...)" className="w-full bg-black border border-cyberCyan/30 rounded-xl p-2.5 text-xs text-white" />
          <button onClick={gerarLaudoComSarahAI} disabled={isAiAnalyzing} className="cyber-button-solid w-full text-xs py-3.5">
            {isAiAnalyzing ? "SARAH AI REDIGINDO RELATÓRIO..." : "GERAR RELATÓRIO TÉCNICO COM SARAH AI"}
          </button>
          <textarea value={rel} onChange={e => setRel(e.target.value)} rows="5" placeholder="Relato técnico da inspeção comunitária..." className="w-full bg-black border border-cyberCyan/30 rounded-xl p-3 text-xs text-white resize-none leading-relaxed" />

          <button onClick={gerarPDFLeve} className="cyber-button w-full text-xs py-3">GERAR RELATÓRIO PDF COMUNITÁRIO</button>
          <div className="grid grid-cols-2 gap-2.5">
            <button onClick={enviarWhatsComum} className="cyber-button text-xs py-3">WHATSAPP COMUM</button>
            <button onClick={enviarWhatsBusiness} className="cyber-button text-xs py-3">WHATSAPP BUSINESS</button>
          </div>
          <button onClick={adicionarNoStatusComFoto} className="cyber-button-solid w-full text-xs py-3">PUBLICAR NO STATUS COM FOTO</button>
        </div>
      </div>
    </div>
  );
}

function AdminVaultModule({ showToast, onClose, vozSelecionada, setVozSelecionada }) {
  const [pinInput, setPinInput] = React.useState("");
  const [isUnlocked, setIsUnlocked] = React.useState(false);
  const [adminSubTab, setAdminSubTab] = React.useState('vozes');

  return (
    <div className="space-y-4 w-full font-mono max-w-4xl mx-auto">
      <div className="cyber-card p-4 shadow-xl space-y-4 border border-cyberCyan/40">
        <div className="flex items-center justify-between border-b border-cyberCyan/25 pb-2.5">
          <h2 className="font-display text-xs font-black text-cyberCyan tracking-widest">ÁREA RESTRITA (ADMIN VAULT)</h2>
          <button onClick={onClose} className="cyber-button-danger text-xs py-1 px-3 !min-h-[32px]">FECHAR</button>
        </div>

        {!isUnlocked ? (
          <form onSubmit={(e) => { e.preventDefault(); if(pinInput==="303500"){ setIsUnlocked(true); showToast("Liberado"); } else showToast("PIN Incorreto"); }} className="flex gap-2">
            <input type="password" maxLength="6" value={pinInput} onChange={(e) => setPinInput(e.target.value)} placeholder="PIN (303500)" className="flex-1 bg-void border border-cyberCyan/40 rounded-xl px-3 py-2.5 text-center text-slate-100 font-mono text-xs" />
            <button type="submit" className="cyber-button text-xs py-2.5 px-4">ACESSAR</button>
          </form>
        ) : (
          <div className="space-y-4">
            <div className="flex gap-2 border-b border-cyberCyan/30 pb-2">
              <button onClick={() => setAdminSubTab('vozes')} className="cyber-button text-xs py-2 px-3">VOZES OFICIAIS</button>
              <button onClick={() => setAdminSubTab('cade')} className="cyber-button text-xs py-2 px-3">PAINEL GADE</button>
            </div>
            {adminSubTab === 'vozes' && (
              <div className="grid grid-cols-1 sm:grid-cols-2 gap-2">
                {PERFIS_VOZ_OFICIAIS.map((p, idx) => (
                  <button key={p.id} onClick={() => { setVozSelecionada(idx); localStorage.setItem('raru_voz_index', String(idx)); localStorage.setItem('raru_perfil_voz', p.id); showToast(`Voz ${p.nome} ativa`); }} className={`cyber-button text-[10px] py-2 px-3 ${vozSelecionada===idx?'!bg-cyberGreen !text-void':''}`}>
                    {p.nome} - {p.cargo}
                  </button>
                ))}
              </div>
            )}
            {adminSubTab === 'cade' && <CadeAdminModule showToast={showToast}/>}
          </div>
        )}
      </div>
    </div>
  );
}

function AutomatedObservatoryWidget({ customTickerText }) {
  const [w, setW] = React.useState({temp:"--", humidity:"--", rain:"--", status:"Sincronizando..."});
  React.useEffect(() => {
    fetch('https://api.open-meteo.com/v1/forecast?latitude=-22.7831&longitude=-43.4294&current=temperature_2m,relative_humidity_2m,precipitation&timezone=America/Sao_Paulo')
    .then(r => r.json())
    .then(d => {
      if(d?.current) setW({temp:`${d.current.temperature_2m}°C`, humidity:`${d.current.relative_humidity_2m}%`, rain:`${d.current.precipitation} mm`, status:d.current.precipitation>5?"ALERTA CHUVAS":"CÉU ESTÁVEL"});
    }).catch(() => {});
  }, []);

  return (
    <div className="cyber-card rounded-2xl overflow-hidden shadow-xl border border-cyberCyan/40 space-y-2.5 w-full col-span-full relative">
      <div className="relative z-10 px-3 py-2 bg-deepSpace border-b border-cyberCyan/40 text-center">
        <div className="font-display font-black text-[11px] text-cyan-200 uppercase">PROJETO CIDADÃO SENSOR • GADE (GRUPO A CHAVE DA ESPERANÇA)</div>
      </div>
      <div className="grid grid-cols-4 gap-2 px-3 text-center">
        <div className="bg-void/90 p-2 rounded-xl border border-cyberCyan/30"><div className="text-[7px] text-slate-400">TEMP</div><div className="text-[10px] font-bold text-cyberCyan">{w.temp}</div></div>
        <div className="bg-void/90 p-2 rounded-xl border border-cyberCyan/30"><div className="text-[7px] text-slate-400">UMIDADE</div><div className="text-[10px] font-bold text-cyberBlue">{w.humidity}</div></div>
        <div className="bg-void/90 p-2 rounded-xl border border-cyberCyan/30"><div className="text-[7px] text-slate-400">CHUVA</div><div className="text-[10px] font-bold text-cyberGreen">{w.rain}</div></div>
        <div className="bg-void/90 p-2 rounded-xl border border-cyberCyan/30"><div className="text-[7px] text-slate-400">STATUS</div><div className="text-[10px] font-bold text-cyberAmber">{w.status}</div></div>
      </div>
    </div>
  );
}

function SarahChatOverlay({ isOpen, onClose, isSpeaking, isProcessing, messages, input, setInput, handleSendDirectCommand, toggleListening, isListening, userName, onOpenNameModal }) {
  if (!isOpen) return null;
  return (
    <div className="fixed inset-0 z-[90] flex items-end sm:items-center justify-center bg-void/85 backdrop-blur-xl p-0 sm:p-4" onClick={onClose}>
      <div className="cyber-card w-full max-w-2xl rounded-t-3xl sm:rounded-3xl shadow-2xl overflow-hidden h-[85vh] flex flex-col border border-cyberCyan/60 p-0" onClick={(e) => e.stopPropagation()}>
        <div className="flex items-center justify-between px-4 py-3 border-b border-cyberCyan/30 bg-deepSpace/95">
          <div className="flex items-center gap-2.5">
            <div className="w-9 h-9 overflow-hidden rounded-full border border-cyberCyan/60 bg-void flex items-center justify-center">
              <SarahLiveSVGAvatar isSpeaking={isSpeaking}/>
            </div>
            <div>
              <div className="font-display text-xs font-black text-white">Sarah AI Nexus V11.2 PLUS</div>
              <div className="text-[8px] font-mono text-cyberGreen font-bold">Online • Mesquita RJ</div>
            </div>
          </div>
          <button onClick={onClose} className="cyber-button-danger text-xs py-1.5 px-3">FECHAR</button>
        </div>
        <div className="flex-1 overflow-y-auto p-4 space-y-3 font-mono">
          {messages.map((m, i) => (
            <div key={i} className={`flex ${m.sender === 'user' ? 'justify-end' : 'justify-start'}`}>
              <div className={`max-w-[85%] rounded-2xl p-3 text-xs ${m.sender === 'user' ? 'bg-cyberCyan text-void font-bold' : 'bg-deepSpace text-slate-100 border border-cyberCyan/40'}`}>
                {m.text}
              </div>
            </div>
          ))}
        </div>
        <div className="p-3 bg-deepSpace border-t border-cyberCyan/35 flex gap-2">
          <input type="text" value={input} onChange={e => setInput(e.target.value)} placeholder="Digite sua mensagem..." className="flex-1 bg-void border border-cyberCyan/50 rounded-xl px-3 py-2 text-xs text-white" />
          <button onClick={() => handleSendDirectCommand()} className="cyber-button-solid text-xs py-2 px-4">ENVIAR</button>
        </div>
      </div>
    </div>
  );
}

function App() {
  const [theme, setTheme] = React.useState('dark');
  const [soundEnabled, setSoundEnabled] = React.useState(true);
  const [isSpeaking, setIsSpeaking] = React.useState(false);
  const [isListening, setIsListening] = React.useState(false);
  const [activeTab, setActiveTab] = React.useState("dashboard");
  const [quemSomosOpen, setQuemSomosOpen] = React.useState(false);
  const [isCommandHUDActive, setIsCommandHUDActive] = React.useState(false);
  const [shareModalOpen, setShareModalOpen] = React.useState(false);
  const [toastMsgRef, setToastMsgRef] = React.useState(null);

  const [termsAccepted, setTermsAccepted] = React.useState(() => localStorage.getItem("raru_cyber_terms") === "1");
  const [check1, setCheck1] = React.useState(false);
  const [check2, setCheck2] = React.useState(false);

  const [userName, setUserName] = React.useState(() => localStorage.getItem("raru_user_name") || "Alexander");
  const [nameModalOpen, setNameModalOpen] = React.useState(false);
  const [tempNameInput, setTempNameInput] = React.useState("");

  const [isChatOpen, setIsChatOpen] = React.useState(false);
  const [input, setInput] = React.useState("");
  const [isProcessing, setIsProcessing] = React.useState(false);
  const [vozSelecionada, setVozSelecionada] = React.useState(0);

  const [messages, setMessages] = React.useState([
    { sender: 'assistant', text: `Calma, ${localStorage.getItem("raru_user_name") || "Alexander"}, tô contigo! Sou a Sarah, tua parceira de campo sênior. Vamo resolver junto qualquer B.O. em Mesquita e nos 92 municípios.`, time: new Date().toLocaleTimeString('pt-BR', {hour: '2-digit', minute:'2-digit'}) }
  ]);

  const showToast = (msg) => { setToastMsgRef(msg); setTimeout(() => setToastMsgRef(null), 3500); };

  const handleSaveName = (e) => {
    e.preventDefault();
    if (!tempNameInput.trim()) return;
    const nomeLimpo = tempNameInput.trim();
    setUserName(nomeLimpo);
    localStorage.setItem("raru_user_name", nomeLimpo);
    setNameModalOpen(false);
    showToast(`Operador ${nomeLimpo} registrado!`);
  };

  const toggleCommandHUD = () => {
    const elem = document.documentElement;
    if (!isCommandHUDActive) {
      if (elem.requestFullscreen) elem.requestFullscreen();
      setIsCommandHUDActive(true);
    } else {
      if (document.exitFullscreen) document.exitFullscreen();
      setIsCommandHUDActive(false);
    }
  };

  const handleSendDirectCommand = async () => {
    if (!input.trim() || isProcessing) return;
    const t = input;
    setInput('');
    setMessages(prev => [...prev, { sender: 'user', text: t, time: new Date().toLocaleTimeString() }]);
    setIsProcessing(true);
    const resp = await chamarSarah('conversa', [{ role: 'user', content: t }], 'Mesquita', 'Rocha Sobrinho', activeTab, {}, userName);
    setMessages(prev => [...prev, { sender: 'assistant', text: resp, time: new Date().toLocaleTimeString() }]);
    setIsProcessing(false);
    if (soundEnabled) falarSarah(resp, vozSelecionada);
  };

  const NAV_TABS = [
    { id: 'dashboard', iconComponent: <IconDashboard className="w-4 h-4"/>, label: 'Painel' },
    { id: 'radar', iconComponent: <IconRadar className="w-4 h-4"/>, label: 'Radar' },
    { id: 'relatorio', iconComponent: <IconVistoria className="w-4 h-4"/>, label: 'Vistoria' },
    { id: 'estacao', iconComponent: <IconEstacao className="w-4 h-4"/>, label: 'Estação' },
    { id: 'balanca', iconComponent: <IconBalanca className="w-4 h-4"/>, label: 'Balança' },
    { id: 'alquino', iconComponent: <IconAlquino className="w-4 h-4"/>, label: 'Alquino' },
    { id: 'compartilhar', iconComponent: <IconInstalar className="w-4 h-4"/>, label: 'Instalar' },
    { id: 'quem-somos', iconComponent: <IconQuemSomos className="w-4 h-4"/>, label: 'Sobre' },
    { id: 'admin', iconComponent: <IconAdmin className="w-4 h-4"/>, label: 'Admin' }
  ];

  return (
    <div className="seu-container-raru">
      {toastMsgRef && <div className="fixed top-12 left-1/2 -translate-x-1/2 z-50 cyber-card px-4 py-2 rounded-2xl text-[10px] font-black text-cyberCyan shadow-2xl animate-bounce">{toastMsgRef}</div>}

      {!termsAccepted && (
        <div className="fixed inset-0 bg-void/95 z-[200] flex items-center justify-center p-4">
          <div className="cyber-card max-w-md w-full p-5 rounded-3xl space-y-3.5 border border-cyberCyan font-mono text-center">
            <h2 className="font-display text-xs font-black text-white uppercase">Termos de Responsabilidade e LGPD</h2>
            <div className="space-y-2 text-left">
              <label className="flex items-center gap-2 text-xs text-slate-200"><input type="checkbox" checked={check1} onChange={e=>setCheck1(e.target.checked)}/> Aceito os termos da LGPD.</label>
              <label className="flex items-center gap-2 text-xs text-slate-200"><input type="checkbox" checked={check2} onChange={e=>setCheck2(e.target.checked)}/> Autorizo o uso do GPS para vistorias.</label>
            </div>
            <button disabled={!check1 || !check2} onClick={() => { setTermsAccepted(true); localStorage.setItem("raru_cyber_terms", "1"); }} className="cyber-button-solid w-full text-xs py-3">INICIAR SALA DE COMANDO</button>
          </div>
        </div>
      )}

      <header className="cyber-card sticky top-0 z-30 w-full px-4 py-3 border-b border-cyberCyan/40 flex items-center justify-between shadow-lg rounded-2xl mb-2">
        <div className="flex items-center gap-2.5 cursor-pointer" onClick={() => setIsChatOpen(true)}>
          <div className="w-8 h-8 overflow-hidden rounded-full border border-cyberCyan shrink-0">
            <SarahLiveSVGAvatar isSpeaking={isSpeaking}/>
          </div>
          <div>
            <h1 className="font-display text-xs sm:text-sm font-black text-white leading-none">Base Climática de Monitoramento Tático</h1>
            <p className="text-[8px] text-cyberCyan font-mono mt-0.5">Operador: {userName} • Mesquita - RJ • 92 Municípios</p>
          </div>
        </div>
        <div className="flex items-center gap-2">
          <button onClick={toggleCommandHUD} className="cyber-button text-[9px] py-2 px-3">HUD</button>
          <button onClick={() => setSoundEnabled(!soundEnabled)} className="cyber-button text-[9px] py-2 px-3">{soundEnabled ? 'ÁUDIO ON' : 'MUDO'}</button>
        </div>
      </header>

      <main className="flex-1 w-full mx-auto py-2 space-y-4 pb-28 relative z-10">
        {activeTab === 'dashboard' && (
          <CardIdentidadeVisualRARU
            handleWhoAmIClick={() => setQuemSomosOpen(true)}
            openSarahChat={() => setIsChatOpen(true)}
            openShareFromApp={() => setShareModalOpen(true)}
            setActiveTab={setActiveTab}
            toggleCommandHUD={toggleCommandHUD}
            userName={userName}
            onOpenNameModal={() => { setTempNameInput(userName); setNameModalOpen(true); }}
          />
        )}
        {activeTab === 'radar' && <RadarMeteorologicoModule showToast={showToast}/>}
        {activeTab === 'estacao' && <EstacaoSobrevivenciaModuleV12 showToast={showToast} soundEnabled={soundEnabled} userName={userName} vozSelecionada={vozSelecionada}/>}
        {activeTab === 'balanca' && <ModuloCidadaoSensorModule onGoToDashboard={() => setActiveTab('dashboard')} showToast={showToast} />}
        {activeTab === 'alquino' && <RedeAlquinoHardwareModule onGoToDashboard={() => setActiveTab('dashboard')} showToast={showToast} />}
        {activeTab === 'relatorio' && <VistoriaRARU_NEXUS onBackToDashboard={() => setActiveTab('dashboard')} showToast={showToast} vozSelecionada={vozSelecionada} userName={userName} />}
        {activeTab === 'quem-somos' && setQuemSomosOpen(true)}
        {activeTab === 'admin' && <AdminVaultModule onClose={() => setActiveTab('dashboard')} showToast={showToast} vozSelecionada={vozSelecionada} setVozSelecionada={setVozSelecionada} />}

        <AutomatedObservatoryWidget/>
      </main>

      <SarahFabButton isSpeaking={isSpeaking} openSarahChat={() => setIsChatOpen(true)}/>
      <SarahChatOverlay
        isOpen={isChatOpen}
        onClose={() => setIsChatOpen(false)}
        isSpeaking={isSpeaking}
        isProcessing={isProcessing}
        messages={messages}
        input={input}
        setInput={setInput}
        handleSendDirectCommand={handleSendDirectCommand}
        toggleListening={()=>{}}
        isListening={isListening}
        userName={userName}
        onOpenNameModal={() => { setTempNameInput(userName); setNameModalOpen(true); }}
      />
      <QuemSomosModal isOpen={quemSomosOpen} onClose={() => setQuemSomosOpen(false)} userName={userName} />

      <footer className="cyber-card fixed bottom-0 left-0 right-0 z-40 border-t border-cyberCyan/40 px-2.5 py-3 flex items-center justify-between gap-1 shadow-2xl backdrop-blur-xl max-w-[1400px] mx-auto rounded-t-2xl pb-[env(safe-area-inset-bottom)]">
        {NAV_TABS.map(tab => (
          <button key={tab.id} onClick={() => {
            if(tab.id==='compartilhar') setShareModalOpen(true);
            else if(tab.id==='quem-somos') setQuemSomosOpen(true);
            else setActiveTab(tab.id);
          }} className={`flex flex-col items-center justify-center gap-0.5 cursor-pointer flex-1 py-1.5 transition rounded-xl ${activeTab === tab.id ? 'text-cyberCyan bg-cyberCyan/15 border border-cyberCyan/40' : 'text-slate-400 hover:text-white'}`}>
            {tab.iconComponent}
            <span className="text-[7px] sm:text-[9px] font-black truncate w-full text-center">{tab.label}</span>
          </button>
        ))}
      </footer>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
