        function NativeHydroWindRadar() {
            const canvasRef = React.useRef(null);
            const [timeStr, setTimeStr] = React.useState("00:00:00");
            const [chuvaVal, setChuvaVal] = React.useState("4.2mm");
            const [nivelVal, setNivelVal] = React.useState("2.34m");

            React.useEffect(() => {
                const canvas = canvasRef.current;
                if (!canvas) return;
                const X = canvas.getContext('2d');
                let A = 0, N = [];
                for(let i=0; i<16; i++) {
                    N.push({x: 35 + Math.random()*60, y: 25 + Math.random()*50, vx: 0.5 + Math.random()*0.5});
                }
                let animId;

                const D = () => {
                    X.fillStyle = '#030108';
                    X.fillRect(0, 0, 360, 280);
                    let cx = 180, cy = 140, sx = 40, sy = 40;

                    [45, 90, 135, 175].forEach(r => {
                        X.strokeStyle = 'rgba(139,92,246,0.22)';
                        X.lineWidth = 1;
                        X.beginPath(); X.arc(cx, cy, r, 0, Math.PI*2); X.stroke();
                    });

                    X.strokeStyle = 'rgba(139,92,246,0.15)';
                    X.beginPath();
                    X.moveTo(0, cy); X.lineTo(360, cy);
                    X.moveTo(cx, 0); X.lineTo(cx, 280);
                    X.stroke();

                    X.strokeStyle = '#fbbf24'; X.lineWidth = 2.2; X.setLineDash([6,4]); X.shadowBlur = 12; X.shadowColor = '#fbbf24';
                    X.beginPath(); X.moveTo(sx, sy); X.lineTo(cx-10, cy); X.stroke(); X.setLineDash([]); X.shadowBlur = 0;

                    X.fillStyle = '#fbbf24'; X.beginPath(); X.arc(sx, sy, 5, 0, Math.PI*2); X.fill();
                    X.fillStyle = '#fff'; X.font = '700 7px Inter'; X.fillText('SERRA MENDANHA', sx-14, sy-8);

                    X.fillStyle = '#22c55e'; X.shadowBlur = 14; X.shadowColor = '#22c55e';
                    X.beginPath(); X.arc(cx-10, cy, 6, 0, Math.PI*2); X.fill(); X.shadowBlur = 0;
                    X.fillStyle = '#fff'; X.fillText('SEBINHO / SARAPUÍ', cx+6, cy-4);

                    X.save(); X.translate(cx, cy); X.rotate(A);
                    let g = X.createConicGradient(0,0,0);
                    g.addColorStop(0, 'rgba(251,146,60,0.7)');
                    g.addColorStop(0.25, 'rgba(251,146,60,0.2)');
                    g.addColorStop(0.5, 'transparent');
                    X.fillStyle = g; X.beginPath(); X.moveTo(0,0); X.arc(0,0,175,-0.5,0.5); X.lineTo(0,0); X.fill();
                    X.strokeStyle = '#fb923c'; X.lineWidth = 2; X.shadowBlur = 15; X.shadowColor = '#fb923c';
                    X.beginPath(); X.moveTo(0,0); X.lineTo(175,0); X.stroke(); X.restore();

                    N.forEach(p => {
                        X.globalAlpha = 0.8; X.fillStyle = '#c084fc';
                        X.beginPath(); X.arc(p.x, p.y, 8, 0, Math.PI*2); X.arc(p.x+9, p.y+3, 6, 0, Math.PI*2); X.fill();
                        p.x += (cx - p.x) * 0.0035; p.y += (cy - p.y) * 0.0035;
                        if(Math.hypot(cx - p.x, cy - p.y) < 15) { p.x = sx; p.y = sy; }
                    });
                    X.globalAlpha = 1;

                    A += 0.028;
                    animId = requestAnimationFrame(D);
                };
                D();

                const interval = setInterval(() => {
                    setTimeStr(new Date().toLocaleTimeString('pt-BR',{timeZone:'America/Sao_Paulo'}));
                    setChuvaVal((2.5 + Math.random()*5).toFixed(1)+'mm');
                    setNivelVal((1.9 + Math.random()*0.7).toFixed(2)+'m');
                }, 2000);

                return () => {
                    cancelAnimationFrame(animId);
                    clearInterval(interval);
                };
            }, []);

            return (
                <div style={{background:'#060310', border:'1.8px solid #7c3aed', borderRadius:'18px', overflow:'hidden', boxShadow:'0 15px 35px rgba(0,0,0,0.6)'}}>
                    <div style={{display:'flex', justifyContent:'space-between', padding:'10px 14px', background:'#1a0e32', borderBottom:'1px solid #4c1d95', alignItems:'center'}}>
                        <span style={{fontSize:'10px', fontWeight:'900', color:'#ddd6fe', letterSpacing:'0.5px'}}>🛰️ RADAR HIDROGRÁFICO TÁTICO PRO (SARAPUÍ / DONA EUGÊNIA) - SEBINHO</span>
                        <span style={{fontSize:'10px', color:'#a78bfa', fontFamily:'monospace', fontWeight:'700'}}>{timeStr}</span>
                    </div>
                    <canvas ref={canvasRef} width="360" height="280" style={{width:'100%', display:'block', background:'#030108'}}></canvas>
                    <div style={{display:'flex', gap:'8px', padding:'8px', background:'#080411'}}>
                        <div style={{flex:1, background:'#140c29', borderRadius:'10px', padding:'6px', textAlign:'center', border:'1px solid #22c55e33'}}>
                            <div style={{fontSize:'7px', color:'#86efac', fontWeight:'700'}}>CHUVA 1H</div>
                            <div style={{fontSize:'12px', fontWeight:'900', color:'#fff'}}>{chuvaVal}</div>
                        </div>
                        <div style={{flex:1, background:'#140c29', borderRadius:'10px', padding:'6px', textAlign:'center', border:'1px solid #38bdf833'}}>
                            <div style={{fontSize:'7px', color:'#93c5fd', fontWeight:'700'}}>NÍVEL RIO</div>
                            <div style={{fontSize:'12px', fontWeight:'900', color:'#fff'}}>{nivelVal}</div>
                        </div>
                        <div style={{flex:1, background:'#140c29', borderRadius:'10px', padding:'6px', textAlign:'center', border:'1px solid #fbbf2433'}}>
                            <div style={{fontSize:'7px', color:'#fde68a', fontWeight:'700'}}>VENTO</div>
                            <div style={{fontSize:'12px', fontWeight:'900', color:'#fff'}}>14.2 km/h</div>
                        </div>
                    </div>
                </div>
            );
        }

                if (file) {
                    const url = URL.createObjectURL(file);
                    const newVid = { id: Date.now(), title: file.name, url };
                    setVideos(prev => [newVid, ...prev]);
                    showToast(`📹 Vídeo "${file.name}" carregado com sucesso!`);
                }
            };

            const handleDelete = (id, title) => {
                if (confirm(`Deseja apagar permanentemente o registro "${title}"?`)) {
                    setVideos(prev => prev.filter(v => v.id !== id));
                    showToast(`🗑️ Vídeo "${title}" apagado do sistema.`);
                }
            };

            const handleTouchStart = (e) => {
                setTouchStartY(e.touches[0].clientY);
            };

            const handleTouchEnd = (e) => {
                const touchEndY = e.changedTouches[0].clientY;
                if (touchEndY - touchStartY > 90) {
                    setSelectedVideoModal(null);
                }
            };

            return (
                <div className="glass-dark p-6 rounded-3xl border border-purple-500/40 shadow-xl space-y-4">
                    <div className="flex flex-col sm:flex-row items-center justify-between border-b border-purple-500/30 pb-3 gap-3">
                        <div className="flex items-center gap-2">
                            <span className="text-sm font-bold text-purple-300">🎥 Central de Vídeos & Produções</span>
                        </div>
                        <div className="flex items-center gap-2">
                            <button 
                                onClick={() => setActiveSubTab("livre")}
                                className={`px-3.5 py-1.5 rounded-xl text-xs font-bold transition cursor-pointer ${activeSubTab === "livre" ? 'bg-purple-600 text-white shadow-lg' : 'bg-nightBlue text-purple-300 border border-purple-500/40'}`}
                            >
                                🌐 Acesso Livre (Moradores)
                            </button>
                            <button 
                                onClick={() => setActiveSubTab("producao")}
                                className={`px-3.5 py-1.5 rounded-xl text-xs font-bold transition cursor-pointer ${activeSubTab === "producao" ? 'bg-purple-600 text-white shadow-lg' : 'bg-nightBlue text-purple-300 border border-purple-500/40'}`}
                            >
                                🔒 Produções e Registros (Admin)
                            </button>
                        </div>
                    </div>

                    {activeSubTab === "producao" && !isUnlocked && (
                        <div className="bg-[#120921] p-6 rounded-2xl border border-purple-500/40 text-center space-y-3 max-w-md mx-auto">
                            <div className="text-xl">🔐</div>
                            <h3 className="text-xs font-bold text-purple-300">Área Restrita - Produções e Registros</h3>
                            <p className="text-[11px] text-lightLavender/80">Insira o PIN de Administrador (303500) para gerenciar e apagar vídeos:</p>
                            <div className="flex gap-2 justify-center">
                                <input 
                                    type="password" 
                                    maxLength="6" 
                                    value={pinInput} 
                                    onChange={e => setPinInput(e.target.value)} 
                                    placeholder="PIN" 
                                    className="bg-black border border-purple-500/50 rounded-xl px-3 py-2 text-center text-white w-32 text-xs outline-none" 
                                />
                                <button 
                                    onClick={() => { 
                                        if (pinInput === "303500") { 
                                            setIsUnlocked(true); 
                                            showToast("🔓 Acesso de Administrador Liberado!"); 
                                        } else { 
                                            showToast("❌ PIN incorreto."); 
                                        } 
                                    }} 
                                    className="px-4 py-2 bg-purple-600 text-white font-bold rounded-xl text-xs cursor-pointer"
                                >
                                    Entrar
                                </button>
                            </div>
                        </div>
                    )}

                    {(activeSubTab === "livre" || (activeSubTab === "producao" && isUnlocked)) && (
                        <div className="space-y-4">
                            {activeSubTab === "producao" && isUnlocked && (
                                <div className="flex justify-between items-center bg-purple-950/40 p-3 rounded-xl border border-purple-500/30">
                                    <div className="flex items-center gap-2">
                                        <span className="w-2.5 h-2.5 rounded-full bg-emerald-400 animate-ping"></span>
                                        <span className="text-purple-300 font-bold text-xs">Modo Administrador Ativo (Upload e Exclusão Permitidos)</span>
                                    </div>
                                    <label className="px-3.5 py-1.5 bg-purple-600 hover:bg-purple-700 text-white font-bold rounded-xl text-xs cursor-pointer btn-animated flex items-center gap-1.5">
                                        <span>➕</span> Carregar Novo Vídeo
                                        <input type="file" accept="video/*" onChange={handleUpload} className="hidden" />
                                    </label>
                                </div>
                            )}

                            {activeSubTab === "livre" && (
                                <div className="bg-nightBlue/70 border border-purple-500/30 p-3 rounded-2xl text-[11px] text-purple-300 flex items-center justify-between">
                                    <span>🌐 <strong>Acesso Livre:</strong> Visualização pública dos registros comunitários em tempo real.</span>
                                </div>
                            )}

                            <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                                {videos.map(v => (
                                    <div key={v.id} className="bg-[#120921] p-3 rounded-2xl border border-purple-500/30 space-y-2 relative shadow-lg">
                                        <div className="flex justify-between items-center">
                                            <p className="font-bold text-purple-300 text-xs truncate max-w-[200px]">{v.title}</p>
                                            {activeSubTab === "producao" && isUnlocked && (
                                                <button 
                                                    onClick={() => handleDelete(v.id, v.title)} 
                                                    className="px-2.5 py-1 bg-red-900/60 hover:bg-red-900 text-red-200 rounded-lg text-[10px] font-bold cursor-pointer transition"
                                                    title="Apagar permanentemente"
                                                >
                                                    🗑️ Apagar
                                                </button>
                                            )}
                                        </div>
                                        <video src={v.url} controls className="w-full h-36 rounded-xl bg-black object-cover"></video>
                                        <button 
                                            onClick={() => setSelectedVideoModal(v)}
                                            className="w-full py-1.5 bg-purple-500/20 hover:bg-purple-500/40 text-purple-300 font-bold text-[11px] rounded-xl transition cursor-pointer"
                                        >
                                            📺 Tela Cheia
                                        </button>
                                    </div>
                                ))}
                            </div>
                        </div>
                    )}

                    {selectedVideoModal && (
                        <div 
                            onTouchStart={handleTouchStart}
                            onTouchEnd={handleTouchEnd}
                            className="fixed inset-0 bg-nightBlue/95 backdrop-blur-md z-50 flex items-center justify-center p-4 animate-fadeIn"
                        >
                            <div className="glass-dark max-w-xl w-full p-4 rounded-3xl border border-purple-500/50 space-y-3 relative shadow-2xl">
                                <div className="flex items-center justify-between border-b border-purple-500/30 pb-2">
                                    <span className="text-xs font-bold text-purple-300 truncate">{selectedVideoModal.title}</span>
                                    <button 
                                        onClick={() => setSelectedVideoModal(null)} 
                                        className="px-3 py-1 bg-red-900/50 text-red-300 rounded-lg text-xs font-bold cursor-pointer"
                                    >
                                        ✕ Fechar (Arraste p/ baixo)
                                    </button>
                                </div>
                                <video src={selectedVideoModal.url} controls autoPlay className="w-full max-h-[65vh] rounded-2xl bg-black object-contain" />
                                <p className="text-[10px] text-center text-lightLavender/60 italic">💡 Dica: Arraste a tela de cima para baixo para fechar rapidamente.</p>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        function RegionalHubModule({ showToast }) {
            const [lote, setLote] = React.useState("Lote 1: Novo PAC");
            const [equipe, setEquipe] = React.useState("");
            const [zap, setZap] = React.useState("");
            const [relato, setRelato] = React.useState("");

            const enviarZap = () => {
                if (!zap.trim()) { alert("Digite o número do WhatsApp com DDD!"); return; }
                const msg = encodeURIComponent(`[HUB REGIONAL - ${lote}] Equipe: ${equipe || 'G.C.E.'} | Relato: ${relato || 'Vistoria'}`);
                window.open(`https://wa.me/55${zap.replace(/\D/g, '')}?text=${msg}`, '_blank');
            };

            return (
                <div className="glass-dark p-6 rounded-3xl border border-purple-500/40 shadow-xl space-y-3 max-w-lg mx-auto w-full">
                    <h2 className="text-sm font-bold text-purple-300 border-b border-purple-500/30 pb-2">📑 Hub Regional & 6 Lotes Institucionais</h2>
                    
                    <div>
                        <label className="block text-xs font-medium text-lightLavender mb-1">Selecione o Lote (1 a 6):</label>
                        <select value={lote} onChange={e => setLote(e.target.value)} className="w-full bg-[#120921] border border-purple-500/30 rounded-xl p-2.5 text-white text-xs outline-none">
                            <option>Lote 1: Novo PAC</option>
                            <option>Lote 2: Defesa Civil</option>
                            <option>Lote 3: Universidades</option>
                            <option>Lote 4: Secretarias Municipais</option>
                            <option>Lote 5: SUAS & Socioeconômico</option>
                            <option>Lote 6: Grupos Comunitários / OSC / ONGs</option>
                        </select>
                    </div>

                    <div>
                        <label className="block text-xs font-medium text-lightLavender mb-1">Nome da Equipe / Responsável:</label>
                        <input type="text" value={equipe} onChange={e => setEquipe(e.target.value)} placeholder="Ex: G.C.E. A Chave da Esperança" className="w-full bg-[#120921] border border-purple-500/30 rounded-xl p-2.5 text-white text-xs outline-none" />
                    </div>

                    <div>
                        <label className="block text-xs font-medium text-lightLavender mb-1">WhatsApp para Envio (DDD + Número):</label>
                        <input type="text" value={zap} onChange={e => setZap(e.target.value)} placeholder="Ex: 21983625875" className="w-full bg-[#120921] border border-purple-500/30 rounded-xl p-2.5 text-white text-xs outline-none" />
                    </div>

                    <div>
                        <label className="block text-xs font-medium text-lightLavender mb-1">Relato ou Ocorrência de Campo:</label>
                        <textarea rows="3" value={relato} onChange={e => setRelato(e.target.value)} placeholder="Descreva os dados coletados..." className="w-full bg-[#120921] border border-purple-500/30 rounded-xl p-2.5 text-white text-xs resize-none outline-none"></textarea>
                    </div>

                    <button onClick={enviarZap} className="w-full py-3 bg-emerald-600 hover:bg-emerald-700 text-white font-bold rounded-xl shadow text-xs cursor-pointer btn-animated">💬 Enviar Relatório via WhatsApp</button>
                </div>
            );
        }

        function App() {
            const [darkMode, setDarkMode] = React.useState(true);
            const [soundEnabled, setSoundEnabled] = React.useState(true);
            const [isSpeaking, setIsSpeaking] = React.useState(false);
            const [isListening, setIsListening] = React.useState(false);
            const [activeTab, setActiveTab] = React.useState("chat");
            const [toastMessage, setToastMessage] = React.useState(null);
            const [messages, setMessages] = React.useState([]);
            const [input, setInput] = React.useState("");
            const [isLoadingChat, setIsLoadingChat] = React.useState(false);

            const showToast = (msg) => {
                setToastMessage(msg);
                setTimeout(() => setToastMessage(null), 3500);
            };

            const speakText = (text) => {
                if (!soundEnabled || !("speechSynthesis" in window)) return;
                window.speechSynthesis.cancel();
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = "pt-BR";
                utterance.onstart = () => setIsSpeaking(true);
                utterance.onend = () => setIsSpeaking(false);
                utterance.onerror = () => setIsSpeaking(false);
                window.speechSynthesis.speak(utterance);
            };

            const toggleListening = () => {
                const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
                if (!SpeechRec) {
                    showToast("⚠️ Reconhecimento de voz indisponível neste navegador.");
                    return;
                }
                if (isListening) {
                    setIsListening(false);
                    return;
                }
                const rec = new SpeechRec();
                rec.lang = "pt-BR";
                rec.onstart = () => {
                    setIsListening(true);
                    showToast("🎙️ Microfone PWA Avançado ouvindo...");
                };
                rec.onresult = (event) => {
                    const transcript = event.results[0][0].transcript;
                    setInput(transcript);
                    setIsListening(false);
                    handleSendMessage(transcript);
                };
                rec.onerror = () => setIsListening(false);
                rec.onend = () => setIsListening(false);
                rec.start();
            };

            const handleSendMessage = async (textCustom) => {
                const textToSend = textCustom !== undefined ? textCustom : input;
                if (!textToSend.trim() || isLoadingChat) return;
                const userMsg = { id: Date.now(), sender: "user", text: textToSend.trim(), timestamp: new Date().toLocaleTimeString("pt-BR", { hour: "2-digit", minute: "2-digit" }) };
                setMessages(prev => [...prev, userMsg]);
                if (!textCustom) setInput("");
                setIsLoadingChat(true);

                try {
                    const response = await fetch(CLOUDFLARE_WORKER_URL, {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({
                            model: "openai/gpt-oss-120b",
                            messages: [{ role: "system", content: "SARAH IA NEXUS v5.2 PRO - Defesa Civil Comunitária (A Chave da Esperança, Mesquita/RJ)." }, { role: "user", content: userMsg.text }]
                        })
                    });
                    const data = await response.json();
                    const reply = data?.choices?.[0]?.message?.content || data?.message || "Sistemas operando normalmente.";
                    setMessages(prev => [...prev, { id: Date.now() + 1, sender: "sarah", text: reply, timestamp: new Date().toLocaleTimeString("pt-BR", { hour: "2-digit", minute: "2-digit" }) }]);
                    speakText(reply);
                } catch {
                    setMessages(prev => [...prev, { id: Date.now(), sender: "sarah", text: "Falha de enlace com a internet.", timestamp: "00:00" }]);
                } finally {
                    setIsLoadingChat(false);
                }
            };

            return (
                <div className={`min-h-screen flex flex-col relative ${darkMode ? 'bg-nightBlue text-lightLavender' : 'bg-slate-100 text-slate-900'}`}>
                    {toastMessage && (
                        <div className="fixed top-20 left-1/2 -translate-x-1/2 z-50 bg-purple-600 text-white px-6 py-3 rounded-2xl text-xs font-bold shadow-2xl border-2 border-pink-400 animate-bounce">
                            {toastMessage}
                        </div>
                    )}

                    <header className="glass-dark border-b border-purple-500/30 px-4 py-3 sticky top-0 z-40 shadow-xl">
                        <div className="max-w-5xl mx-auto flex items-center justify-between">
                            <div className="flex items-center gap-3">
                                <div className="w-11 h-11 rounded-2xl bg-purple-500/15 border border-purple-500/60 flex items-center justify-center text-purple-300">
                                    <CyberShieldIcon className="w-6 h-6" />
                                </div>
                                <div>
                                    <h1 className="text-sm font-bold">SARAH IA NEXUS v5.2 PRO</h1>
                                    <span className="text-xs text-purple-300">Grupo Comunitário A Chave da Esperança (Mesquita/RJ)</span>
                                </div>
                            </div>
                            <div className="flex items-center gap-2">
                                <button onClick={() => {
                                    if (navigator.share) {
                                        navigator.share({ title: 'SARAH IA', url: window.location.href }).catch(()=>{});
                                    } else {
                                        showToast("🔗 Link pronto para partilha!");
                                    }
                                }} className="px-3 py-1.5 bg-purple-500/20 border border-purple-500/40 rounded-xl text-xs font-bold text-purple-300 cursor-pointer btn-animated">🔗 Partilhar</button>
                                <button onClick={() => setDarkMode(!darkMode)} className="w-9 h-9 bg-purple-500/20 border border-purple-500/40 rounded-xl flex items-center justify-center text-purple-300 cursor-pointer btn-animated">{darkMode ? "☀️" : "🌙"}</button>
                            </div>
                        </div>
                    </header>

                    {/* Card de Partilhamento SVG Integrado */}
                    <div className="bg-[#180c30] border-b border-purple-500/40 p-4">
                        <div className="max-w-5xl mx-auto flex flex-col md:flex-row items-center justify-between gap-4 glass-dark p-4 rounded-2xl border border-purple-500/40">
                            <div className="flex items-center gap-3">
                                <svg width="56" height="56" viewBox="0 0 100 100" className="shrink-0 drop-shadow-[0_0_10px_#9B7EDE]">
                                    <circle cx="50" cy="50" r="46" fill="#0f051d" stroke="#c084fc" stroke-width="3"/>
                                    <circle cx="50" cy="50" r="32" fill="none" stroke="#e879f9" stroke-width="1.5" stroke-dasharray="4 2"/>
                                    <path d="M50 18 L75 35 L75 65 L50 82 L25 65 L25 35 Z" fill="url(#cardGrad)" stroke="#00E5CC" stroke-width="2"/>
                                    <circle cx="50" cy="50" r="10" fill="#00E5CC"/>
                                    <defs>
                                        <linearGradient id="cardGrad" x1="0" y1="0" x2="1" y2="1">
                                            <stop offset="0%" stopColor="#4c1d95" />
                                            <stop offset="100%" stopColor="#2e1065" />
                                        </linearGradient>
                                    </defs>
                                </svg>
                                <div>
                                    <h3 className="text-xs font-bold text-white uppercase">App//Monitoramento Comunitário 🛰️ SARAH IA NEXUS v5.2 PRO</h3>
                                    <p className="text-[11px] text-purple-300">Projeto Cidadão Sensor 🛡️ • Automatizado com Inteligência Artificial</p>
                                </div>
                            </div>
                            <button onClick={() => {
                                navigator.clipboard.writeText(window.location.href);
                                showToast("📋 Link e identidade visual copiados!");
                            }} className="px-4 py-2 bg-gradient-to-r from-purple-600 to-pink-600 text-white font-bold text-xs rounded-xl shadow cursor-pointer btn-animated whitespace-nowrap">
                                🔗 Copiar Link de Partilha
                            </button>
                        </div>
                    </div>

                    <div className="bg-[#120921] border-b border-purple-500/30 px-4 py-2">
                        <div className="max-w-5xl mx-auto flex items-center gap-2 overflow-x-auto">
                            <button onClick={() => setActiveTab("chat")} className={`px-4 py-2 rounded-xl text-xs font-bold cursor-pointer ${activeTab === "chat" ? "bg-purple-600 text-white" : "bg-nightBlue text-purple-300 border border-purple-500/40"}`}>💬 Chat</button>
                            <button onClick={() => setActiveTab("dashboard")} className={`px-4 py-2 rounded-xl text-xs font-bold cursor-pointer ${activeTab === "dashboard" ? "bg-purple-600 text-white" : "bg-nightBlue text-purple-300 border border-purple-500/40"}`}>🛰️ Radar Táti.co</button>
                            <button onClick={() => setActiveTab("field_report")} className={`px-4 py-2 rounded-xl text-xs font-bold cursor-pointer ${activeTab === "field_report" ? "bg-purple-600 text-white" : "bg-nightBlue text-purple-300 border border-purple-500/40"}`}>📋 Laudos</button>
                            <button onClick={() => setActiveTab("regional_hub")} className={`px-4 py-2 rounded-xl text-xs font-bold cursor-pointer ${activeTab === "regional_hub" ? "bg-purple-600 text-white" : "bg-nightBlue text-purple-300 border border-purple-500/40"}`}>📑 Hub (6 Lotes)</button>
                            <button onClick={() => setActiveTab("videos")} className={`px-4 py-2 rounded-xl text-xs font-bold cursor-pointer ${activeTab === "videos" ? "bg-purple-600 text-white" : "bg-nightBlue text-purple-300 border border-purple-500/40"}`}>🎥 Produções & Registros</button>
                        </div>
                    </div>

                    <main className="max-w-5xl mx-auto p-4 w-full flex-1 flex flex-col">
                        {activeTab === "dashboard" && <NativeHydroWindRadar />}
                        {activeTab === "field_report" && <FieldReportModule onBackToChat={() => setActiveTab("chat")} showToast={showToast} />}
                        {activeTab === "regional_hub" && <RegionalHubModule showToast={showToast} />}
                        {activeTab === "videos" && <VideoVaultModule showToast={showToast} />}
                        {activeTab === "chat" && (
                            <div className="glass-dark rounded-3xl shadow-2xl flex flex-col overflow-hidden flex-1 border border-purple-500/40" style={{ minHeight: "500px" }}>
                                <div className="flex-1 overflow-y-auto p-4 space-y-4">
                                    {messages.length === 0 && (
                                        <div className="h-full flex flex-col items-center justify-center p-4 my-auto">
                                            <SarahHologramAvatar isLarge={true} isSpeaking={isSpeaking} />
                                            <h2 className="text-base font-bold text-white mt-3">SARAH IA NEXUS v5.2 PRO</h2>
                                            <p className="text-xs text-purple-300">"Prevenção não é mídia: é gente atenta."</p>
                                        </div>
                                    )}
                                    {messages.map(m => (
                                        <div key={m.id} className={`flex items-start gap-3 ${m.sender === "user" ? "flex-row-reverse" : "flex-row"}`}>
                                            {m.sender === "user" ? <div className="w-10 h-10 rounded-2xl bg-[#120921] flex items-center justify-center text-purple-300">👤</div> : <SarahHologramAvatar isSpeaking={isSpeaking} />}
                                            <div className={`p-4 rounded-3xl max-w-[85%] text-xs ${m.sender === "user" ? "bg-purple-600 text-white" : "bg-[#120921] text-lightLavender border border-purple-500/40"}`}>{m.text}</div>
                                        </div>
                                    ))}
                                </div>
                                <div className="p-4 bg-nightBlue/95 border-t border-purple-500/30 flex gap-2 items-center">
                                    <button 
                                        onClick={toggleListening} 
                                        className={`w-11 h-11 rounded-xl flex items-center justify-center cursor-pointer transition ${isListening ? 'bg-pink-500 text-white animate-mic-pulse' : 'bg-purple-500/20 border border-purple-500/40 text-purple-300'}`}
                                        title="Microfone PWA Avançado"
                                    >
                                        🎙️
                                    </button>
                                    <input type="text" value={input} onChange={e => setInput(e.target.value)} onKeyDown={e => e.key === "Enter" && handleSendMessage()} placeholder="Digite sua mensagem ou use o microfone..." className="flex-1 bg-[#120921] border border-purple-500/40 rounded-xl px-3 py-2 text-xs text-white outline-none" />
                                    <button onClick={() => handleSendMessage()} className="px-4 py-2 bg-purple-600 text-white font-bold rounded-xl text-xs cursor-pointer btn-animated">➤</button>
                                </div>
                            </div>
                        )}
                    </main>

                    <div className="bg-[#3b0764] border-t-2 border-purple-500 py-3 overflow-hidden whitespace-nowrap shadow-md">
                        <marquee behavior="scroll" direction="left" scrollamount="4.5" className="text-sm font-extrabold tracking-wide text-[#fde047]">
                            🛡️ Promovendo ciência cidadã • 1° Edição operacional El Niño GACE • Conceitos Mesquita do amanhã e Cidades resilientes (ONU) Grupo Comunitário A Chave da Esperança • Plano de Ação: Todos Unidos, Todos Protegidos • EMERGÊNCIAS: Defesa Civil (199 / 21 4040-1772) • Bombeiros (193) • Alertas ZAP 📲 (21) 97299-3223 • Cras de Rocha Sobrinho 21 2042-8931 • Seja voluntário servir é prevenir sempre +Nupdecs • Participe • "Se o Senhor não guardar a cidade, em vão vigia o sentinela" (Salmos 127:1) • #compartilhe ™ Mesquita RJ 🛡️
                        </marquee>
                    </div>

                    <footer className="bg-[#120921] border-t border-purple-500/40 py-3 px-2 text-center text-xs space-y-1 font-bold shadow-inner">
                        <div className="text-white text-xs">Grupo Comunitário A Chave da Esperança • 2024–2026</div>
                        <div style={{ color: "#9B7EDE" }}>Defesa Civil Comunitária Cidadão Sensor • SARAH IA NEXUS v5.2 PRO</div>
                        <div style={{ color: "#72E6B2" }}>@&nbsp;Todos os direitos reservados 2024–2026</div>
                    </footer>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById("root"));
        root.render(<App />);
    </script>
</body>
</html>
