<style>
 body { background: #04060A; color: #F1F5F9; font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; font-size: 15px; }
 .mono { font-family: 'JetBrains Mono', monospace; }
 .glass { background: rgba(9, 14, 25, 0.96); backdrop-filter: blur(24px); border: 1px solid rgba(255, 255, 255, 0.12); }
 .glass-card { background: rgba(14, 21, 37, 0.9); border: 1px solid rgba(255, 255, 255, 0.1); }
 .input-pro { background: #070A14; border: 1px solid rgba(255, 255, 255, 0.2); color: #FFF; font-size: 14px; font-weight: 600; transition: all 0.2s ease; }
 .input-pro:focus { border-color: #3B82F6; box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.3); outline: none; }
 .badge-pulse { animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite; }
 @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .4; } }
 @keyframes radarPulse { 0% { r: 10px; opacity: 0.9; } 70% { r: 48px; opacity: 0; } 100% { r: 10px; opacity: 0; } }
 .radar-ring { animation: radarPulse 2.2s cubic-bezier(0.215, 0.61, 0.355, 1) infinite; transform-origin: center; }
::-webkit-scrollbar { width: 8px; height: 8px; }
::-webkit-scrollbar-track { background: #04060A; }
::-webkit-scrollbar-thumb { background: #3B82F6; border-radius: 4px; }
</style>

<script type="text/babel">
const { useState, useRef, useEffect } = React;

const MUNICIPIOS_RJ_92 = [
 "Mesquita (Base Oficial - Rocha Sobrinho)",
 "Nova Iguaçu",
 "Duque de Caxias",

 "Resende",
 "Rio Bonito",

 "Rio das Flores",
 "Rio das Ostras",
 "Rio de Janeiro (Capital)",
 "Santa Maria Madalena",
 "Santo Antônio de Pádua",
 "São Fidélis",
 "São Francisco de Itabapoana",
 "São João da Barra",
 "São José de Ubá",
 "São José do Vale do Rio Preto",
 "São Pedro da Aldeia",
 "São Sebastião do Alto",
 "Sapucaia",
 "Saquarema",
 "Seropédica",
 "Silva Jardim",
 "Sumidouro",
 "Tanguá",
 "Teresópolis",
 "Trajano de Moraes",
 "Três Rios",
 "Valença",
 "Varre-Sai",
 "Vassouras",
 "Volta Redonda"
].map(m => ({ n: m, lat: -22.7858, lon: -43.4294 }));

const RISCOS = [
  { id: "R1", label: "R1 - BAIXO / PREVENTIVO" },
  { id: "R2", label: "R2 - MODERADO / ATENÇÃO" },
  { id: "R3", label: "R3 - ALTO / ALERTA" },
  { id: "R4", label: "R4 - IMINENTE / EVACUAÇÃO" },
  { id: "RH", label: "RH - HIDROLÓGICO / ENCHENTE" },
  { id: "RE", label: "RE - ESTRUTURAL / TALUDE" }
];

const ORGAOS = [
  "COMPDEC / SEDEC-RJ",
  "GADE - GRUPO A CHAVE DA ESPERANÇA",
  "BOM DIA COMUNIDADE",
  "CIDADÃO SENSOR (RCS)",
  "INEA / SERLA",
  "CEMADEN / INPE",
  "CRAS / CREAS",
  "DEFESA CIVIL MUNICIPAL",
  "NUPDECs - 92 MUNICÍPIOS RJ"
];

function App() {
  const [municipios] = useState(MUNICIPIOS_RJ_92);
  const [mun, setMun] = useState(MUNICIPIOS_RJ_92[0]);
  const [fotos, setFotos] = useState([]);
  const [camOn, setCamOn] = useState(false);
  const [facingMode, setFacingMode] = useState("environment");
  const [nome, setNome] = useState("Alexander da Silva Firmo");
  const [docId, setDocId] = useState("AG-COMUNITARIO-01");
  const [bairro, setBairro] = useState("Comunidade do Sebinho (Maria Cristina)");
  const [risco, setRisco] = useState(RISCOS[1].label);
  const [org, setOrg] = useState(ORGAOS[3]);
  const [rel, setRel] = useState("");
  const [iaDiag, setIaDiag] = useState("SARAH-AI: TELEMETRIA 92 MUNICÍPIOS EM PRONTIDÃO.");
  const [deviceInfo, setDeviceInfo] = useState("PLATAFORMA UNIVERSAL");
  const [viewMode, setViewMode] = useState("auto");
  const [loadingPdf, setLoadingPdf] = useState(false);

  // Alarme / Ciclo de Vistoria (Alarme Russo / Semáforo)
  const [timerAtivo, setTimerAtivo] = useState(false);
  const [tempoRestante, setTempoRestante] = useState(300);

  const videoRef = useRef(null);
  const streamRef = useRef(null);

  useEffect(() => {
    const ua = navigator.userAgent;
    if (/android/i.test(ua)) setDeviceInfo("ANDROID OS // NATIVO");
    else if (/iPad|iPhone|iPod/.test(ua)) setDeviceInfo("iOS SAFARI // NATIVO");
    else if (/SmartTV|GoogleTV|NetTV|Tizen|WebOS/i.test(ua)) setDeviceInfo("SMART TV // EXIBIÇÃO");
    else setDeviceInfo("COMPUTADOR / DESKTOP");
  }, []);

  useEffect(() => {
    let interval = null;
    if (timerAtivo && tempoRestante > 0) {
      interval = setInterval(() => setTempoRestante(t => t - 1), 1000);
    } else if (tempoRestante === 0 && timerAtivo) {
      alert("SARAH-AI: CICLO DE VISTORIA CONCLUÍDO (ALARME ATIVO)");
      setTimerAtivo(false);
    }
    return () => clearInterval(interval);
  }, [timerAtivo, tempoRestante]);

  useEffect(() => {
    if (risco.includes("R1")) setIaDiag("SARAH-AI: ESTABILIDADE GEOTÉCNICA ESTÁVEL. MONITORAMENTO PREVENTIVO ATIVO.");
    else if (risco.includes("R2")) setIaDiag("SARAH-AI: SATURAÇÃO PARCIAL DE TALUDE / MICRODRENAGEM SOB CARGA.");
    else if (risco.includes("R3")) setIaDiag("SARAH-AI: ALERTA DE MOVIMENTAÇÃO DE MASSA / RISCO ESTRUTURAL.");
    else if (risco.includes("R4")) setIaDiag("SARAH-AI: RISCO CRÍTICO IMINENTE. EVACUAÇÃO RECOMENDADA.");
    else if (risco.includes("RH")) setIaDiag("SARAH-AI: ELEVAÇÃO RÁPIDA DE COTA HÍDRICA / BACIA EM ALERTA.");
    else setIaDiag("SARAH-AI: ANOMALIA ESTRUTURAL DETECTADA EM ELEMENTOS DE CONTENÇÃO.");
  }, [risco]);

  const startCamera = async (mode = facingMode) => {
    try {
      if (streamRef.current) streamRef.current.getTracks().forEach(t => t.stop());
      const s = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: { exact: mode }, width: { ideal: 1280 }, height: { ideal: 720 } }
      }).catch(() => navigator.mediaDevices.getUserMedia({ video: true }));

      streamRef.current = s;
      setCamOn(true);
      setTimeout(() => {
        if (videoRef.current) {
          videoRef.current.srcObject = s;
          videoRef.current.onloadedmetadata = () => videoRef.current.play().catch(() => {});
        }
      }, 200);
    } catch (e) {
      alert('ERRO DE CÂMERA: VERIFIQUE PERMISSÕES HTTPS (ANDROID, iOS, PC).');
    }
  };

  const stopCamera = () => {
    if (streamRef.current) streamRef.current.getTracks().forEach(t => t.stop());
    if (videoRef.current) videoRef.current.srcObject = null;
    setCamOn(false);
  };

  const capturarFoto = () => {
    const v = videoRef.current;
    if (!v || v.videoWidth === 0) { alert('AGUARDE O FOCO DA CÂMERA'); return; }
    
    const c = document.createElement('canvas');
    c.width = 900;
    c.height = Math.round(900 * (v.videoHeight / v.videoWidth));
    const ctx = c.getContext('2d');
    ctx.drawImage(v, 0, 0, c.width, c.height);

    ctx.fillStyle = 'rgba(4, 6, 10, 0.94)';
    ctx.fillRect(0, 0, c.width, 42);
    ctx.fillRect(0, c.height - 60, c.width, 60);

    ctx.fillStyle = '#3B82F6';
    ctx.font = '800 15px "JetBrains Mono", monospace';
    ctx.fillText(`SARAH AI NEXUS // VISTORIA FORENSE TÁTICA`, 16, 27);

    ctx.fillStyle = '#FFFFFF';
    ctx.font = '700 13px "JetBrains Mono", monospace';
    const agoraStr = new Date().toLocaleString('pt-BR');
    ctx.fillText(`${agoraStr} | ${mun.n}`, 16, c.height - 35);
    ctx.fillText(`GEO: ${mun.lat.toFixed(4)}, ${mun.lon.toFixed(4)} | RESP: ${nome.split(' ')[0]}`, 16, c.height - 15);

    const url = c.toDataURL('image/jpeg', 0.8);
    setFotos(p => [...p, url]);
  };

  const gerarHashUnico = async (prot) => {
    const raw = `${prot}-${nome}-${Date.now()}`;
    const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(raw));
    return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, '0')).join('');
  };

  const gerarPDFBlob = async (prot, hash) => {
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF('p', 'mm', 'a4');

    doc.setFillColor(4, 6, 10);
    doc.rect(0, 0, 210, 297, 'F');

    doc.setFillColor(14, 21, 37);
    doc.rect(10, 10, 190, 24, 'F');
    doc.setDrawColor(59, 130, 246);
    doc.rect(10, 10, 190, 24);

    doc.setTextColor(59, 130, 246);
    doc.setFont('helvetica', 'bold');
    doc.setFontSize(10);
    doc.text('SARAH AI NEXUS // LAUDO TÉCNICO DOS 92 MUNICÍPIOS DO RJ', 15, 18);

    doc.setTextColor(255, 255, 255);
    doc.setFontSize(8);
    doc.text(`PROTOCOLO: ${prot}`, 15, 26);
    doc.text(`DATA: ${new Date().toLocaleString('pt-BR')}`, 135, 26);

    doc.setFillColor(14, 21, 37);
    doc.rect(10, 38, 190, 34, 'F');
    doc.rect(10, 38, 190, 34);

    doc.setTextColor(148, 163, 184);
    doc.setFontSize(7);
    doc.text('RESPONSÁVEL TÉCNICO:', 14, 45);
    doc.text('MUNICÍPIO / BAIRRO / GPS:', 14, 55);
    doc.text('RISCO / ÓRGÃO DESTINO:', 14, 65);

    doc.setTextColor(255, 255, 255);
    doc.setFont('helvetica', 'bold');
    doc.setFontSize(8);
    doc.text(`${nome} (${docId})`, 75, 45);
    doc.text(`${mun.n} | ${bairro} (${mun.lat.toFixed(4)}, ${mun.lon.toFixed(4)})`, 75, 55);
    doc.text(`${risco} | ${org}`, 75, 65);

    doc.setFillColor(14, 21, 37);
    doc.rect(10, 76, 190, 48, 'F');
    doc.rect(10, 76, 190, 48);

    doc.setTextColor(59, 130, 246);
    doc.setFont('helvetica', 'bold');
    doc.text('DIAGNÓSTICO PREDITIVO DE IA & RELATO:', 14, 83);

    doc.setTextColor(200, 200, 200);
    doc.setFont('helvetica', 'normal');
    doc.setFontSize(7.5);
    doc.text(`[IA] ${iaDiag}`, 14, 90);

    const linhasRelato = doc.splitTextToSize(rel || 'Sem observações textuais adicionais.', 182);
    doc.text(linhasRelato, 14, 98);

    let y = 130;
    doc.setTextColor(59, 130, 246);
    doc.setFont('helvetica', 'bold');
    doc.setFontSize(9);
    doc.text(`REGISTRO FOTOGRÁFICO DE CAMPO (${fotos.length} IMAGENS):`, 10, y);
    y += 6;

    for (let i = 0; i < fotos.length; i++) {
      if (y > 220) {
        doc.addPage();
        doc.setFillColor(4, 6, 10);
        doc.rect(0, 0, 210, 297, 'F');
        y = 15;
      }
      try {
        const xPos = 10 + (i % 2) * 96;
        doc.addImage(fotos[i], 'JPEG', xPos, y, 88, 52);
        doc.setDrawColor(255, 255, 255, 0.2);
        doc.rect(xPos, y, 88, 52);
      } catch (e) {}

      if (i % 2 === 1) y += 58;
      else if (i === fotos.length - 1) y += 58;
    }

    doc.setFillColor(7, 10, 20);
    doc.rect(10, 278, 190, 14, 'F');
    doc.setTextColor(148, 163, 184);
    doc.setFont('helvetica', 'normal');
    doc.setFontSize(6.5);
    doc.text(`HASH SHA-256: ${hash}`, 14, 284);
    doc.text(`SISTEMA SARAH AI NEXUS // COBERTURA ESTADUAL 92 MUNICÍPIOS`, 14, 289);

    return doc.output('blob');
  };

  const enviarWhatsapp = async () => {
    if (!nome || !bairro) { alert('PREENCHA RESPONSÁVEL E BAIRRO'); return; }
    if (fotos.length === 0) { alert('CAPTURE AO MENOS 1 FOTO'); return; }

    const prot = `PROT-VIST-${mun.n.slice(0, 3).toUpperCase()}-2026-${Math.floor(Math.random() * 8999 + 1000)}`;
    const hash = await gerarHashUnico(prot);

    const texto = `*SARAH AI NEXUS // VISTORIA TÉCNICA*
──────────────────
*PROTOCOLO:* ${prot}
*RESPONSÁVEL:* ${nome}
*MUNICÍPIO:* ${mun.n}
*BAIRRO:* ${bairro}
*RISCO:* ${risco}
*DESTINO:* ${org}
*IA:* ${iaDiag}
*RELATO:* ${rel || 'N/A'}
*FOTOS:* ${fotos.length}
*HASH:* ${hash.slice(0, 20)}...`;

    const fotoFiles = await Promise.all(fotos.map(async (d, i) => {
      const r = await fetch(d);
      const b = await r.blob();
      return new File([b], `FOTO_${i + 1}_${prot}.jpg`, { type: 'image/jpeg' });
    }));

    if (navigator.canShare && navigator.canShare({ files: fotoFiles })) {
      try {
        await navigator.share({ title: prot, text: texto, files: fotoFiles });
        return;
      } catch (e) {}
    }
    window.open(`https://wa.me/?text=${encodeURIComponent(texto)}`, '_blank');
  };

  const exportarPDF = async () => {
    if (!nome || !bairro) { alert('PREENCHA RESPONSÁVEL E BAIRRO'); return; }
    if (fotos.length === 0) { alert('CAPTURE AO MENOS 1 FOTO'); return; }

    setLoadingPdf(true);
    try {
      const prot = `PROT-VIST-${mun.n.slice(0, 3).toUpperCase()}-2026-${Math.floor(Math.random() * 8999 + 1000)}`;
      const hash = await gerarHashUnico(prot);
      const blob = await gerarPDFBlob(prot, hash);
      const pdfFile = new File([blob], `${prot}_LAUDO.pdf`, { type: 'application/pdf' });

      if (navigator.canShare && navigator.canShare({ files: [pdfFile] })) {
        await navigator.share({ title: prot, text: `Laudo - ${prot}`, files: [pdfFile] });
      } else {
        const url = URL.createObjectURL(blob);
        window.open(url, '_blank');
      }
    } catch (e) {
      alert('ERRO AO GERAR O PDF.');
    } finally {
      setLoadingPdf(false);
    }
  };

  return (
    <div className="glass rounded-3xl p-4 sm:p-8 space-y-6 shadow-2xl border border-white/10 w-full">
      
      {/* Top Header & Seletor Universal */}
      <div className="flex flex-col sm:flex-row justify-between items-center border-b border-white/15 pb-4 gap-4">
        <div className="flex items-center space-x-3">
          <div className="w-4 h-4 rounded-full bg-blue-500 badge-pulse"></div>
          <div>
            <h1 className="text-base font-black tracking-wider text-white uppercase mono">SARAH AI NEXUS // VISTORIA V16.0 PRO</h1>
            <p className="text-xs text-blue-400 font-semibold">Painel Tático Unificado (Computador, Android, iOS e Smart TV)</p>
          </div>
        </div>
        
        <div className="flex flex-wrap gap-2 bg-black/50 p-2 rounded-xl border border-white/15">
          <button onClick={() => setViewMode("auto")} className={`px-3.5 py-2 rounded-lg text-xs font-bold transition ${viewMode==='auto'?'bg-blue-600 text-white':'text-slate-300 hover:text-white'}`}>AUTO ({deviceInfo.split('/')[0]})</button>
          <button onClick={() => setViewMode("pc")} className={`px-3.5 py-2 rounded-lg text-xs font-bold transition ${viewMode==='pc'?'bg-blue-600 text-white':'text-slate-300 hover:text-white'}`}>💻 Computador</button>
          <button onClick={() => setViewMode("mobile")} className={`px-3.5 py-2 rounded-lg text-xs font-bold transition ${viewMode==='mobile'?'bg-blue-600 text-white':'text-slate-300 hover:text-white'}`}>📱 Android/iOS</button>
          <button onClick={() => setViewMode("tv")} className={`px-3.5 py-2 rounded-lg text-xs font-bold transition ${viewMode==='tv'?'bg-blue-600 text-white':'text-slate-300 hover:text-white'}`}>📺 Smart TV</button>
        </div>
      </div>

      {/* MAPA TÁTICO GEOGRÁFICO EXPANDIDO E AMPLIADO */}
      <div className="glass-card rounded-2xl p-5 border border-blue-500/40 space-y-4 shadow-2xl">
        <div className="flex justify-between items-center">
          <div className="flex items-center space-x-2.5">
            <span className="w-3 h-3 rounded-full bg-emerald-400 badge-pulse"></span>
            <span className="text-sm font-black uppercase tracking-widest text-blue-400 mono">RADAR TÁTICO GEOGRÁFICO // 92 MUNICÍPIOS DO RIO DE JANEIRO</span>
          </div>
          <span className="text-xs font-bold mono px-3 py-1.5 rounded-lg bg-blue-500/20 text-blue-200 border border-blue-400/30">BASE: MESQUITA / SEBINHO</span>
        </div>

        {/* SVG Ampliado com letras grandes e alta visibilidade */}
        <div className="w-full rounded-2xl overflow-hidden border border-blue-500/50 bg-[#04060A] shadow-2xl">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 460" width="100%" height="100%" style={{background:'#04060A', display:'block', minHeight:'360px'}}>
            <defs>
              <linearGradient id="mapBg" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#090E19"/>
                <stop offset="100%" stop-color="#020408"/>
              </linearGradient>
              <linearGradient id="baixadaGrad" x1="0%" y1="0%" x2="100%" y2="0%">
                <stop offset="0%" stop-color="#1D4ED8" stop-opacity="0.4"/>
                <stop offset="100%" stop-color="#3B82F6" stop-opacity="0.15"/>
              </linearGradient>
              <filter id="glowMap" x="-30%" y="-30%" width="160%" height="160%">
                <feGaussianBlur stdDeviation="6" result="blur"/>
                <feComposite in="SourceGraphic" in2="blur" operator="over"/>
              </filter>
              <style>
                {`
                  .map-label { font-size: 13px; font-family: 'JetBrains Mono', monospace; font-weight: 700; fill: #E2E8F0; }
                  .map-label-destaque { font-size: 14.5px; font-family: 'JetBrains Mono', monospace; font-weight: 800; fill: #FFFFFF; }
                `}
              </style>
            </defs>

            <rect width="1100" height="460" fill="url(#mapBg)"/>
            
            {/* Grid Cartográfico */}
            <g stroke="#ffffff" stroke-opacity="0.07" stroke-width="1.2">
              <path d="M 0,80 H 1100 M 0,160 H 1100 M 0,240 H 1100 M 0,320 H 1100 M 0,400 H 1100" />
              <path d="M 137,0 V 460 M 274,0 V 460 M 411,0 V 460 M 548,0 V 460 M 685,0 V 460 M 822,0 V 460 M 959,0 V 460" />
            </g>

            <g transform="translate(60, 30)">
              <path d="M 300,150 Q 390,110 500,160 T 630,200 Q 590,310 500,340 T 320,320 Z" fill="url(#baixadaGrad)" stroke="#3B82F6" stroke-width="2.5" stroke-opacity="0.5" stroke-dasharray="8,4"/>
              
              <path d="M 160,90 Q 300,190 410,300 T 590,390" fill="none" stroke="#06B6D4" stroke-width="2.5" stroke-opacity="0.6" stroke-dasharray="10,5"/>

              <g stroke="#3B82F6" stroke-opacity="0.35" stroke-width="1.5">
                <line x1="360" y1="170" x2="440" y2="210" />
                <line x1="360" y1="170" x2="310" y2="250" />
                <line x1="360" y1="170" x2="490" y2="150" />
                <line x1="440" y1="210" x2="570" y2="250" />
                <line x1="310" y1="250" x2="210" y2="220" />
                <line x1="490" y1="150" x2="680" y2="180" />
              </g>

              {/* Municípios RJ com Letras Grandes (13px a 14.5px) */}
              <circle cx="490" cy="290" r="5" fill="#3B82F6" opacity="0.8"/><text x="506" y="295" class="map-label">Rio de Janeiro (Capital)</text>
              <circle cx="680" cy="310" r="5" fill="#3B82F6" opacity="0.8"/><text x="696" y="315" class="map-label">Niterói</text>
              <circle cx="440" cy="210" r="6" fill="#3B82F6" opacity="0.95"/><text x="458" y="215" class="map-label-destaque">Duque de Caxias</text>
              <circle cx="310" cy="150" r="6" fill="#3B82F6" opacity="0.95"/><text x="180" y="145" class="map-label-destaque">Nova Iguaçu</text>
              <circle cx="390" cy="235" r="6" fill="#3B82F6" opacity="0.95"/><text x="408" y="240" class="map-label-destaque">São João de Meriti</text>
              <circle cx="360" cy="170" r="6" fill="#3B82F6" opacity="0.95"/><text x="210" y="175" class="map-label-destaque">Belford Roxo</text>
              <circle cx="530" cy="95" r="5" fill="#06B6D4" opacity="0.9"/><text x="548" y="100" class="map-label">Petrópolis (Serra)</text>
              <circle cx="130" cy="370" r="5" fill="#06B6D4" opacity="0.9"/><text x="148" y="375" class="map-label">Angra dos Reis</text>

              {/* MARCADOR PRINCIPAL / BASE ATIVA: MESQUITA // SEBINHO (Texto Super Visível) */}
              <g transform="translate(360, 170)">
                <circle cx="0" cy="0" r="36" fill="none" stroke="#25D366" stroke-width="2.5" class="radar-ring"/>
                <circle cx="0" cy="0" r="20" fill="none" stroke="#25D366" stroke-width="1.5" class="radar-ring" style="animation-delay: 0.8s;"/>
                <circle cx="0" cy="0" r="8.5" fill="#25D366" filter="url(#glowMap)"/>
                <circle cx="0" cy="0" r="3.5" fill="#FFFFFF"/>
                
                <rect x="-95" y="-42" width="190" height="30" rx="7" fill="#070A14" stroke="#25D366" stroke-width="2" filter="url(#glowMap)"/>
                <text x="0" y="-23" fill="#25D366" font-size="12" font-weight="900" text-anchor="middle" font-family="monospace">MESQUITA // SEBINHO</text>
              </g>
            </g>

            <g transform="translate(24, 24)">
              <rect x="0" y="0" width="380" height="38" rx="7" fill="#070A14" stroke="#3B82F6" stroke-width="1.5" stroke-opacity="0.7"/>
              <circle cx="18" cy="19" r="5" fill="#25D366" class="badge-pulse"/>
              <text x="36" y="24" fill="#3B82F6" font-size="11.5" font-weight="800" font-family="monospace">📡 RADAR TÁTICO: 92 MUNICÍPIOS DO RJ</text>
            </g>
          </svg>
        </div>

        {/* Telemetria com Fontes Maiores */}
        <div className="grid grid-cols-2 sm:grid-cols-4 gap-3 text-center">
          <div className="bg-black/60 p-3.5 rounded-xl border border-white/10">
            <p className="text-[10px] text-slate-400 uppercase font-extrabold tracking-wider">Município Alvo</p>
            <p className="text-sm font-black text-white truncate mt-1">{mun.n}</p>
          </div>
          <div className="bg-black/60 p-3.5 rounded-xl border border-white/10">
            <p className="text-[10px] text-slate-400 uppercase font-extrabold tracking-wider">Coordenadas GPS</p>
            <p className="text-xs font-black text-emerald-400 mono mt-1">{mun.lat.toFixed(4)}, {mun.lon.toFixed(4)}</p>
          </div>
          <div className="bg-black/60 p-3.5 rounded-xl border border-white/10">
            <p className="text-[10px] text-slate-400 uppercase font-extrabold tracking-wider">Status Câmera</p>
            <p className="text-xs font-black text-blue-400 mt-1">{camOn ? 'ONLINE' : 'STANDBY'}</p>
          </div>
          <div className="bg-black/60 p-3.5 rounded-xl border border-white/10">
            <p className="text-[10px] text-slate-400 uppercase font-extrabold tracking-wider">Evidências</p>
            <p className="text-xs font-black text-purple-400 mt-1">{fotos.length} FOTO(S)</p>
          </div>
        </div>
      </div>

      {/* Alarme / Ciclo de Vistoria (Alarme Russo / Semáforo de Campo) */}
      <div className="glass-card rounded-2xl p-4 border border-amber-500/40 space-y-3">
        <div className="flex flex-col sm:flex-row justify-between items-center gap-3">
          <div className="flex items-center space-x-3">
            <div className={`w-3.5 h-3.5 rounded-full ${timerAtivo ? 'bg-rose-500 animate-ping' : 'bg-amber-400'}`}></div>
            <span className="text-xs sm:text-sm font-black uppercase tracking-widest text-amber-300 mono">CRONÔMETRO DE CAMPO // CICLO ALARME RUSSO (5M / 3M / 1M)</span>
          </div>
          <div className="flex items-center space-x-3">
            <span className="text-sm mono font-black text-white bg-black/70 px-4 py-2 rounded-xl border border-amber-500/40">
              {Math.floor(tempoRestante / 60)}:{(tempoRestante % 60).toString().padStart(2, '0')}
            </span>
            {!timerAtivo ? (
              <button onClick={() => setTimerAtivo(true)} className="text-xs font-black px-5 py-2.5 rounded-xl bg-amber-500 text-black hover:bg-amber-400 transition shadow-lg">
                INICIAR CICLO
              </button>
            ) : (
              <button onClick={() => setTimerAtivo(false)} className="text-xs font-bold px-4 py-2.5 rounded-xl bg-rose-500/20 text-rose-300 border border-rose-500/40">
                PAUSAR
              </button>
            )}
          </div>
        </div>
      </div>

      {/* Grid Principal com Tipografia Ampla e Legível */}
      <div className="grid grid-cols-1 lg:grid-cols-2 gap-6">
        
        {/* Coluna Esquerda: Câmera & Evidências */}
        <div className="space-y-4">
          <div className="glass-card rounded-2xl p-5 space-y-4">
            <div className="flex justify-between items-center">
              <span className="text-xs sm:text-sm font-extrabold text-slate-200 uppercase tracking-wide">Câmera Forense & Telemetria AI</span>
              <div className="flex space-x-2">
                {camOn && (
                  <button onClick={() => setFacingMode(facingMode === "environment" ? "user" : "environment")} className="text-xs font-bold px-3 py-2 rounded-xl bg-slate-800 text-slate-200 border border-white/15">
                    INVERTER
                  </button>
                )}
                {!camOn ? (
                  <button onClick={() => startCamera(facingMode)} className="text-xs font-black px-5 py-2.5 rounded-xl bg-blue-600 text-white hover:bg-blue-500 shadow-lg shadow-blue-600/30 transition">
                    LIGAR CÂMERA
                  </button>
                ) : (
                  <button onClick={stopCamera} className="text-xs font-bold px-3.5 py-2 rounded-xl bg-rose-500/20 text-rose-300 border border-rose-500/30">
                    DESLIGAR
                  </button>
                )}
              </div>
            </div>

            <div className="relative rounded-2xl overflow-hidden bg-black border border-white/15 shadow-inner" style={{ minHeight: '300px' }}>
              <video ref={videoRef} autoPlay playsInline muted className="w-full h-[300px] object-cover" style={{ display: camOn ? 'block' : 'none' }}></video>
              {!camOn && (
                <div className="absolute inset-0 flex flex-col items-center justify-center text-slate-400 space-y-2">
                  <svg className="w-14 h-14 opacity-35 animate-pulse" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="1.5" d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z"></path><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="1.5" d="M15 13a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
                  <span className="text-xs font-semibold">CÂMERA EM ESPERA (COMPATÍVEL PC, ANDROID, iOS)</span>
                </div>
              )}
              {camOn && (
                <div className="absolute top-3 left-3 bg-black/80 px-3.5 py-1.5 rounded-lg text-xs mono text-blue-400 border border-white/15 font-bold">
                  REC ● {mun.lat.toFixed(3)}, {mun.lon.toFixed(3)}
                </div>
              )}
            </div>

            {camOn && (
              <button onClick={capturarFoto} className="w-full py-4 bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-500 hover:to-indigo-500 text-white font-black rounded-xl text-sm tracking-wider shadow-lg transition">
                CAPTURAR FOTO COM CARIMBO DE TELEMETRIA
              </button>
            )}

            {fotos.length > 0 && (
              <div className="flex gap-3 overflow-x-auto pt-1 pb-1">
                {fotos.map((f, i) => (
                  <div key={i} className="relative shrink-0 group">
                    <img src={f} className="w-24 h-24 object-cover rounded-xl border border-white/25 shadow-md" alt={`Evidência ${i+1}`} />
                    <button onClick={() => setFotos(fotos.filter((_, idx) => idx !== i))} className="absolute -top-2 -right-2 w-6 h-6 bg-rose-600 text-white rounded-full font-black text-xs flex items-center justify-center shadow">×</button>
                    <span className="absolute bottom-1 left-1 bg-black/85 px-2 py-0.5 rounded text-[10px] mono text-white font-bold">#{i+1}</span>
                  </div>
                ))}
              </div>
            )}

            <div className="p-3.5 rounded-xl bg-blue-950/30 border border-blue-500/30 flex items-start space-x-2.5">
              <div className="w-3 h-3 rounded-full bg-blue-400 mt-1 shrink-0 badge-pulse"></div>
              <p className="text-xs mono text-blue-200 leading-relaxed font-semibold">
                <strong className="text-blue-400">DIAGNÓSTICO IA:</strong> {iaDiag}
              </p>
            </div>
          </div>
        </div>

        {/* Coluna Direita: Parâmetros & Formulário com Letras Ampliadas */}
        <div className="space-y-4">
          <div className="glass-card rounded-2xl p-5 space-y-4">
            <span className="text-xs sm:text-sm font-extrabold text-slate-200 uppercase tracking-wide">Parâmetros Oficiais &amp; 92 Municípios RJ</span>
            
            <div className="grid grid-cols-1 gap-3.5">
              <div>
                <label className="text-[11px] uppercase font-extrabold text-slate-300 tracking-wider mb-1.5 block">Município Alvo (Lista Oficial 92 RJ)</label>
                <select value={mun.n} onChange={e => setMun(municipios.find(m => m.n === e.target.value))} className="w-full input-pro rounded-xl p-3.5 text-sm font-bold">
                  {municipios.map((m, i) => <option key={i} value={m.n}>{m.n}</option>)}
                </select>
              </div>

              <div className="grid grid-cols-1 sm:grid-cols-2 gap-3.5">
                <div>
                  <label className="text-[11px] uppercase font-extrabold text-slate-300 tracking-wider mb-1.5 block">Órgão Destinatário</label>
                  <select value={org} onChange={e => setOrg(e.target.value)} className="w-full input-pro rounded-xl p-3.5 text-xs font-bold">
                    {ORGAOS.map((o, i) => <option key={i} value={o}>{o}</option>)}
                  </select>
                </div>
                <div>
                  <label className="text-[11px] uppercase font-extrabold text-slate-300 tracking-wider mb-1.5 block">Classificação de Risco</label>
                  <select value={risco} onChange={e => setRisco(e.target.value)} className="w-full input-pro rounded-xl p-3.5 text-xs font-black text-amber-300">
                    {RISCOS.map((r, i) => <option key={i} value={r.label}>{r.label}</option>)}
                  </select>
                </div>
              </div>

              <div className="grid grid-cols-1 sm:grid-cols-2 gap-3.5">
                <div>
                  <label className="text-[11px] uppercase font-extrabold text-slate-300 tracking-wider mb-1.5 block">Responsável Técnico</label>
                  <input value={nome} onChange={e => setNome(e.target.value)} className="w-full input-pro rounded-xl p-3.5 text-xs font-bold" />
                </div>
                <div>
                  <label className="text-[11px] uppercase font-extrabold text-slate-300 tracking-wider mb-1.5 block">Credencial / ID</label>
                  <input value={docId} onChange={e => setDocId(e.target.value)} className="w-full input-pro rounded-xl p-3.5 text-xs font-bold" />
                </div>
              </div>

              <div>
                <label className="text-[11px] uppercase font-extrabold text-slate-300 tracking-wider mb-1.5 block">Bairro / Comunidade / Localidade</label>
                <input value={bairro} onChange={e => setBairro(e.target.value)} placeholder="Ex: Comunidade do Sebinho, Chatuba..." className="w-full input-pro rounded-xl p-3.5 text-xs font-bold" />
              </div>

              <div>
                <label className="text-[11px] uppercase font-extrabold text-slate-300 tracking-wider mb-1.5 block">Relato Técnico &amp; Ações de Campo</label>
                <textarea value={rel} onChange={e => setRel(e.target.value)} rows="3" placeholder="Descreva as condições estruturais, trincas, vazamentos ou medidas mitigadoras..." className="w-full input-pro rounded-xl p-3.5 text-xs font-semibold resize-none"></textarea>
              </div>
            </div>
          </div>
        </div>
      </div>

      {/* Botões de Ação Final */}
      <div className="grid grid-cols-1 sm:grid-cols-2 gap-3.5 pt-2">
        <button onClick={enviarWhatsapp} className="w-full py-4.5 bg-[#25D366] hover:bg-[#20ba5a] text-black font-black rounded-xl text-xs sm:text-sm tracking-wider shadow-lg transition flex items-center justify-center space-x-2">
          <span>ENVIAR RELATÓRIO + FOTOS (WHATSAPP)</span>
        </button>

        <button onClick={exportarPDF} disabled={loadingPdf} className="w-full py-4.5 bg-white hover:bg-slate-100 text-black font-black rounded-xl text-xs sm:text-sm tracking-wider shadow-lg transition flex items-center justify-center space-x-2">
          {loadingPdf ? <span className="animate-pulse">PROCESSANDO LAUDO PDF...</span> : <span>EXPORTAR LAUDO PDF OFICIAL (HASH SHA-256)</span>}
        </button>
      </div>

      <p className="text-[10px] text-slate-400 text-center tracking-widest uppercase mono pt-2">
        SARAH AI NEXUS // SUPORTE INTEGRAL COMPUTADOR, ANDROID, iOS &amp; SMART TV
      </p>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
