        function playChameleonSound() {
            try {
                const AudioCtx = window.AudioContext || window.webkitAudioContext;
                if (!AudioCtx) return;
                const ctx = new AudioCtx();
                if (ctx.state === 'suspended') ctx.resume();
                const bufferSize = ctx.sampleRate * 1.2;
                const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
                const data = buffer.getChannelData(0);
                for (let i = 0; i < bufferSize; i++) { data[i] = (Math.random() * 2 - 1) * Math.sin(i / 800); }
                const noiseSource = ctx.createBufferSource();
                noiseSource.buffer = buffer;
                const filter = ctx.createBiquadFilter();
                filter.type = 'lowpass';
                filter.frequency.setValueAtTime(350, ctx.currentTime);
                filter.frequency.exponentialRampToValueAtTime(120, ctx.currentTime + 1.2);
                const gainNode = ctx.createGain();
                gainNode.gain.setValueAtTime(0.8, ctx.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 1.2);
                noiseSource.connect(filter); filter.connect(gainNode); gainNode.connect(ctx.destination);
                noiseSource.start();
            } catch (e) {}
        }

        function VistoriaECDM_BlocosFuturistas({ onBackToDashboard, showToast }) {
            const videoRef = React.useRef(null);
            const canvasRef = React.useRef(null);
            const [municipio, setMunicipio] = React.useState("Mesquita");
            const [setor, setSetor] = React.useState(SETORES_FIXO_OFICIAL[0]);
            const [equipe, setEquipe] = React.useState("Grupo a Chave da Esperança © GADE");
            const [nivel, setNivel] = React.useState("🟢 Risco Baixo");
            const [agente, setAgente] = React.useState("");
            const [local, setLocal] = React.useState("");
            const [desc, setDesc] = React.useState("");
            const [gps, setGps] = React.useState({ lt: '', ln: '', lk: '' });
            const [gpsSt, setGpsSt] = React.useState("📍 GPS em espera");
            const [hash, setHash] = React.useState("...");
            const [cameraAtiva, setCameraAtiva] = React.useState(false);

            const [oc, setOc] = React.useState({ deslizamento: false, alagamento: false, trincas: false, arvore: false, valao: false });

            const protocolo = React.useMemo(() => `ECDM-9F-${municipio.substring(0,3).toUpperCase()}-2026-${Math.floor(1000 + Math.random() * 9000)}`, [municipio]);
            const getFinal = () => equipe.trim() ? `${setor} | ${equipe.trim()}` : setor;
            const gpsStrFmt = gps.lt ? `${gps.lt},${gps.ln}` : (local || "Rocha Sobrinho/Mesquita-RJ");

            const [fotos, setFotos] = React.useState([null, null, null, null]);

            React.useEffect(() => {
                const calcularHash = async () => {
                    try {
                        const s = municipio + setor + equipe + nivel + agente + local + desc + protocolo + JSON.stringify(oc);
                        const hb = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(s));
                        setHash(Array.from(new Uint8Array(hb)).map(b => b.toString(16).padStart(2, '0')).join('').substring(0, 32) + "...");
                    } catch (e) { setHash("sha256-ok"); }
                };
                calcularHash();
            }, [municipio, setor, equipe, nivel, agente, local, desc, protocolo, oc]);

            const capturarGps = () => {
                if (!navigator.geolocation) return showToast("⚠️ Geolocalização não suportada");
                showToast("🛰 Buscando GPS...");
                navigator.geolocation.getCurrentPosition(
                    (p) => {
                        const lt = p.coords.latitude.toFixed(6);
                        const ln = p.coords.longitude.toFixed(6);
                        setGps({ lt, ln, lk: `https://www.google.com/maps?q=${lt},${ln}` });
                        setLocal(`${lt},${ln}`);
                        setGpsSt("✅ GPS Fixado");
                        showToast("📍 Coordenadas obtidas!");
                    },
                    () => setGpsSt("⚠ Erro ao obter GPS"),
                    { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
                );
            };

            const ligarCamera = async () => {
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' }, audio: false });
                    if (videoRef.current) { videoRef.current.srcObject = stream; setCameraAtiva(true); showToast("📷 Câmera Ativada!"); }
                } catch (e) { showToast("⚠️ Erro ao acessar a câmera."); }
            };

            const desligarCamera = () => {
                if (videoRef.current && videoRef.current.srcObject) {
                    videoRef.current.srcObject.getTracks().forEach(t => t.stop());
                    videoRef.current.srcObject = null;
                }
                setCameraAtiva(false);
            };

            React.useEffect(() => { ligarCamera(); return () => { desligarCamera(); }; }, []);

            const capturar = (i) => {
                const video = videoRef.current; const canvas = canvasRef.current; 
                if (!video || !canvas || !video.srcObject) { ligarCamera(); return; }
                const ctx = canvas.getContext('2d');
                canvas.width = video.videoWidth || 640; canvas.height = video.videoHeight || 480;
                ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
                
                const agora = new Date().toLocaleString('pt-BR');
                ctx.fillStyle = 'rgba(2,4,10,0.88)'; ctx.fillRect(0, canvas.height - 75, canvas.width, 75);
                ctx.fillStyle = '#00F2FE'; ctx.fillRect(0, canvas.height - 75, canvas.width, 3);
                ctx.fillStyle = '#FFF'; ctx.font = 'bold 11px monospace'; 
                ctx.fillText(`ECDM | 9 FONTES | ${agora} | ${gpsStrFmt}`.slice(0, 80), 10, canvas.height - 45);
                ctx.fillStyle = '#00F2FE'; ctx.fillText(`SETOR: ${setor}`.slice(0, 80), 10, canvas.height - 28);
                ctx.fillStyle = '#FFB86A'; ctx.fillText(`EQUIPE: ${getFinal()}`.slice(0, 75), 10, canvas.height - 12);

                const img = canvas.toDataURL('image/jpeg', 0.85);
                const n = [...fotos]; n[i] = img; setFotos(n);
                showToast(`📸 Foto 0${i+1} carimbada com sucesso!`);
            };

            const apagarFoto = (i, e) => { e.stopPropagation(); const n = [...fotos]; n[i] = null; setFotos(n); showToast(`🗑️ Foto removida.`); };

            const getOcTxt = () => {
                const l = [];
                if (oc.deslizamento) l.push("• Deslizamento");
                if (oc.alagamento) l.push("• Alagamento");
                if (oc.trincas) l.push("• Trincas");
                if (oc.arvore) l.push("• Árvore");
                if (oc.valao) l.push("• Bueiro/Valão");
                return l.length ? l.join("\n") : "• Nenhuma ocorrência marcada";
            };

            const montarLaudo = () => `🛡️ LAUDO ECDM • 9 FONTES OFICIAIS\n📌 ${protocolo}\n📍 ${municipio}-RJ\n🏛 ${setor}\n👥 ${getFinal()}\n⚠️ ${nivel}\n📍 ${gpsStrFmt}\n${getOcTxt()}\n📝 ${desc || 'Sem observações'}\n🔒 ${hash}\n✨ Todos unidos, todos protegidos. GADE.`;

            const gerarPdf = async () => {
                showToast("📄 Gerando PDF oficial...");
                try {
                    let J = window.jspdf ? window.jspdf.jsPDF : null;
                    if (!J && window.jsPDF) J = window.jsPDF;
                    const doc = new J();
                    let y = 20, m = 15;
                    doc.text(`LAUDO ECDM (9 Fontes) - ${municipio}-RJ`, m, y);
                    y += 8; doc.setFontSize(9);
                    doc.text(`Protocolo: ${protocolo}`, m, y); y += 6;
                    doc.text(`Setor: ${setor}`, m, y); y += 6;
                    doc.text(`Equipe: ${getFinal()}`, m, y); y += 6;
                    doc.text(`Risco: ${nivel}`, m, y); y += 10;
                    doc.text(getOcTxt(), m, y); y += 12;
                    doc.text(doc.splitTextToSize(desc || 'Sem descrição', 180), m, y); y += 15;
                    doc.text(`HASH: ${hash}`, m, y);
                    fotos.filter(Boolean).forEach(imgData => {
                        if (y > 240) { doc.addPage(); y = 20; }
                        doc.addImage(imgData, 'JPEG', m, y, 40, 40); y += 45;
                    });
                    doc.save(`${protocolo}.pdf`);
                    showToast("✅ PDF gerado!");
                } catch(e) { showToast("❌ Erro ao gerar PDF."); }
            };

            return (
                <div className="max-w-xl mx-auto space-y-4 cyber-card p-4 sm:p-5 rounded-[28px] border border-cyberCyan/40 shadow-2xl font-mono">
                    <style>{`
                        .grid-futuro { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:12px; }
                        .bloco-foto { height:110px; border-radius:14px; position:relative; overflow:hidden; background: linear-gradient(145deg, rgba(10,26,51,0.9), rgba(2,4,10,0.9)); border:1px solid rgba(0,242,254,0.3); cursor:pointer; transition: all 0.3s ease; }
                        .bloco-foto:hover { border-color:#00F2FE; box-shadow: 0 0 25px rgba(0,242,254,0.4); transform: translateY(-2px); }
                        .bloco-foto .scan { position:absolute; top:0; left:0; width:100%; height:2px; background:#00F2FE; box-shadow: 0 0 10px #00F2FE; animation: scan 2.5s linear infinite; opacity:0.6; }
                        @keyframes scan { 0%{ top:0 } 100%{ top:100% } }
                        .bloco-label { position:absolute; bottom:6px; left:6px; right:6px; background: rgba(2,4,10,0.8); border:1px solid rgba(0,242,254,0.2); border-radius:8px; padding:4px 6px; font-size:8px; color:#00F2FE; display:flex; justify-content:space-between; }

                        .placeholder { width:100%; height:100%; display:flex; flex-direction:column; align-items:center; justify-content:center; color:#00F2FE; gap:6px; }
                    `}</style>

                    <div className="flex items-center justify-between border-b border-cyberCyan/30 pb-3">
                        <div className="space-y-0.5">
                            <span className="text-xs font-black text-cyberCyan uppercase tracking-wider block">📋 Vistoria &amp; Laudo • 9 Fontes Oficiais</span>
                            <span className="text-[9px] text-slate-400">ECDM • Estado do Rio de Janeiro</span>
                        </div>
                        <button onClick={onBackToDashboard} className="px-3 py-1 bg-cyberRose/20 text-cyberRose rounded-xl text-xs font-bold border border-cyberRose/40 cursor-pointer">✕ Fechar</button>
                    </div>

                    <div className="space-y-3">
                        <div>
                            <label className="text-[10px] text-cyan-400 font-bold uppercase">Município - RJ</label>
                            <select value={municipio} onChange={e => setMunicipio(e.target.value)} className="w-full bg-void border border-cyan-400/40 rounded-xl p-2.5 text-xs text-white font-bold mt-1">

        function AdminVaultModule({ localVideos, setLocalVideos, marketingText, setMarketingText, showToast, onClose }) {
            const [pinInput, setPinInput] = React.useState("");
            const [isUnlocked, setIsUnlocked] = React.useState(false);
            const [marketingInput, setMarketingInput] = React.useState(marketingText);

            const handleUnlock = (e) => {
                e.preventDefault();
                if (pinInput === "303500") { setIsUnlocked(true); showToast("🔓 Acesso Autorizado!"); } else { showToast("❌ PIN Incorreto."); }
            };

            const handleUploadVideo = (e) => {
                const files = Array.from(e.target.files);
                if (files.length === 0) return;
                files.forEach(file => {
                    const reader = new FileReader();
                    reader.onload = (uploadEvt) => {
                        const newVid = { id: Date.now() + Math.random(), title: file.name, url: uploadEvt.target.result, date: new Date().toLocaleDateString('pt-BR') };
                        setLocalVideos(prev => {
                            const updated = [newVid, ...prev];
                            try { localStorage.setItem("ecdm_cyber_videos", JSON.stringify(updated)); } catch(err) {}
                            return updated;
                        });
                        showToast(`📹 Vídeo salvo!`);
                    };
                    reader.readAsDataURL(file);
                });
            };

            return (
                <div className="space-y-4 max-w-xl mx-auto">
                    <div className="cyber-card p-5 rounded-[28px] shadow-xl space-y-4">

            const [input, setInput] = React.useState("");
            const [isProcessing, setIsProcessing] = React.useState(false);
            const [currentResponse, setCurrentResponse] = React.useState("Olá! Sou a SARAH AI NEXUS V8.4.2 PWA, sua Analista Sênior na ECDM. Estou monitorando autonomamente as 9 fontes oficiais de dados públicos. Como posso auxiliar?");
            const [hasIntroduced, setHasIntroduced] = React.useState(
                () => { try { return localStorage.getItem("ecdm_cyber_intro") === "1"; } catch(e) { return false; } }
            );

            const [marketingText, setMarketingText] = React.useState(() => {
                try { return localStorage.getItem("ecdm_cyber_marketing") || "Todos unidos, todos protegidos."; } catch(e) { return "Todos unidos, todos protegidos."; }
            });

            const [localVideos, setLocalVideos] = React.useState(() => {
                try {
                    const saved = localStorage.getItem("ecdm_cyber_videos");
                    if (saved) { const parsed = JSON.parse(saved); if (Array.isArray(parsed) && parsed.length > 0) return parsed; }
                } catch(e) {}
                return [{ id: 1, title: "ECDM PWA • 9 Fontes Oficiais", url: "https://www.w3schools.com/html/mov_bbb.mp4", date: "Sistema", isPinned: true }];
            });

            const showToast = (msg) => { setToastMessage(msg); setTimeout(() => setToastMessage(null), 3500); };

            useEffect(() => {
                const interval = setInterval(() => {
                    const now = new Date();
                    const formatter = new Intl.DateTimeFormat("pt-BR", { timeZone: "America/Sao_Paulo", hour: "numeric", minute: "numeric", hour12: false });
                    const parts = formatter.formatToParts(now);
                    let hours = 0, minutes = 0;
                    for (let p of parts) {
                        if (p.type === 'hour') hours = parseInt(p.value, 10);
                        if (p.type === 'minute') minutes = parseInt(p.value, 10);
                    }
                    if (hours === 19 && minutes === 20) {
                        const todayStr = now.toDateString();
                        if (localStorage.getItem('chameleon_last') !== todayStr) {
                            setChameleonActive(true);
                            localStorage.setItem('chameleon_last', todayStr);
                            if (soundEnabled) playChameleonSound();
                            showToast("🦎 EFEITO CAMALEÃO ATIVADO (19:20 Brasília)!");
                        }
                    }
                }, 10000);
                return () => clearInterval(interval);
            }, [soundEnabled]);

            useEffect(() => {
                if (chameleonActive) document.body.classList.add('chameleon-active');
                else document.body.classList.remove('chameleon-active');
            }, [chameleonActive]);

            React.useEffect(() => {
                const onPrompt = (e) => { e.preventDefault(); setDeferredPrompt(e); setIsInstallable(true); };
                const onInstalled = () => { setIsInstallable(false); showToast("🎉 Aplicativo PWA instalado!"); };
                window.addEventListener('beforeinstallprompt', onPrompt);
                window.addEventListener('appinstalled', onInstalled);
                return () => {
                    window.removeEventListener('beforeinstallprompt', onPrompt);
                    window.removeEventListener('appinstalled', onInstalled);
                };
            }, []);

            const handleInstallApp = async () => {
                if (deferredPrompt) {
                    deferredPrompt.prompt();
                    const { outcome } = await deferredPrompt.userChoice;
                    if (outcome === 'accepted') { showToast("🎉 Instalado!"); }
                    setDeferredPrompt(null);
                    setIsInstallable(false);
                } else {
                    setInstallModalOpen(true);
                }
            };

            const speakText = (text) => {
                if (!soundEnabled || !("speechSynthesis" in window)) return;
                const cleanText = String(text).replace(/([\u2700-\u27BF]|[\uE000-\uF8FF]|\uD83C[\uDC00-\uDFFF]|\uD83D[\uDC00-\uDFFF]|[\u2011-\u26FF]|\uD83E[\uDD00-\uDDFF])/g, '').replace(/https?:\/\/\S+/g, "").trim();
                if (!cleanText) return;
                window.speechSynthesis.cancel();
                const u = new SpeechSynthesisUtterance(cleanText);
                u.lang = "pt-BR";
                u.onstart = () => setIsSpeaking(true);
                u.onend = () => setIsSpeaking(false);
                u.onerror = () => setIsSpeaking(false);
                window.speechSynthesis.speak(u);
            };

            React.useEffect(() => {
                if (!termsAccepted || hasIntroduced) return;
                const greeting = getBrasiliaGreeting();
                const presentation = `${greeting}, sou a Analista Sênior SARAH AI NEXUS na ECDM. Estou monitorando autonomamente as 9 fontes de dados públicos. Todos unidos, todos protegidos.`;
                const timer = setTimeout(() => {
                    if (!soundEnabled) return;
                    setHasIntroduced(true);
                    try { localStorage.setItem("ecdm_cyber_intro", "1"); } catch(e) {}
                    speakText(presentation);
                }, 700);
                return () => clearTimeout(timer);
            }, [termsAccepted, hasIntroduced, soundEnabled]);

            const openShareFromApp = async () => {
                const manifestData = { title: "ECDM • Chave Climática", text: shareMessageText, url: APP_SHARE_URL };
                if (navigator.share) {
                    try { await navigator.share(manifestData); return; } catch (err) { if (err.name === 'AbortError') return; }
                }
                setShareModalOpen(true);
            };

            const toggleTheme = () => {
                setTheme(prev => {
                    const next = prev === 'dark' ? 'warm' : 'dark';
                    try { localStorage.setItem("ecdm-cyber-theme", next); } catch(e) {}
                    showToast(next === 'warm' ? '🎨 Tema Clean' : '🌌 Modo Cyber PWA');
                    return next;
                });
            };

            const toggleListening = () => {
                const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
                if (!SpeechRec) { showToast("⚠️ Voz indisponível."); return; }
                if (isListening) { setIsListening(false); return; }
                try {
                    const rec = new SpeechRec();
                    rec.lang = "pt-BR";
                    rec.onstart = () => { setIsListening(true); showToast("🎙 Ouvindo..."); };
                    rec.onresult = (event) => {
                        let final = event.results[0][0].transcript;
                        if (final) { setInput(final); setIsListening(false); handleSendDirectCommand(final); }
                    };
                    rec.onerror = () => setIsListening(false);
                    rec.onend = () => setIsListening(false);
                    rec.start();
                } catch (e) { setIsListening(false); }
            };

            const handleWhoAmIClick = () => {
                setQuemSomosOpen(true);
            };

            const handleSendDirectCommand = async (textCustom) => {
                const textToSend = textCustom !== undefined ? textCustom : input;
                if (!textToSend.trim() || isProcessing) return;
                setInput(""); setIsProcessing(true);
                setCurrentResponse("🔄 SARAH (Analista Sênior) processando nas 9 fontes oficiais...");
                try {
                    const response = await fetch(CLOUDFLARE_WORKER_URL, {
                        method: "POST", headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({ model: "openai/gpt-oss-120b", messages: [{ role: "system", content: "Você é SARAH, Analista Sênior da ECDM PWA, autônoma no monitoramento das 9 fontes públicas." }, { role: "user", content: textToSend }], temperature: 0.5, max_tokens: 300 })
                    });
                    const data = await response.json();
                    let reply = data?.choices?.[0]?.message?.content || "Análise concluída.";
                    reply = reply.replace(/#{1,6}\s?/g, '').replace(/\*\*/g, '').trim();
                    setCurrentResponse(reply); speakText(reply);
                } catch (error) {
                    setCurrentResponse("ECDM PWA operando com autonomia nas 9 fontes públicas.");
                    speakText("ECDM PWA online.");
                } finally { setIsProcessing(false); }
            };

            const openSarahChat = () => { setIsChatOpen(true); speakText("Analista Sarah pronta para monitorar."); };

            const NAV_TABS = [
                { id: 'cidadao-sensor', iconComponent: <span className="text-xs">📡</span>, label: 'Cidadão Sensor' },
                { id: 'quem-somos', iconComponent: <HomeCommandIcon className="w-4 h-4" />, label: 'Quem somos' },
                { id: 'sarah-chat', iconComponent: <div className="w-4 h-4 rounded-full overflow-hidden border border-cyberCyan"><img src={SARAH_CUSTOM_AVATAR_URL} className="w-full h-full object-cover"/></div>, label: 'Sarah' },
                { id: 'dashboard', iconComponent: <HomeCommandIcon className="w-4 h-4" />, label: 'Painel' },
                { id: 'estacao', iconComponent: <SurvivalStationIcon className="w-4 h-4" />, label: 'Estação' },
                { id: 'radar', iconComponent: <RadarScanIcon className="w-4 h-4" />, label: 'Radar' },
                { id: 'relatorio', iconComponent: <FieldReportIcon className="w-4 h-4" />, label: 'Vistoria' },
                { id: 'galeria', iconComponent: <StreamVideoIcon className="w-4 h-4" />, label: 'Vídeos' },
                { id: 'admin', iconComponent: <AdminVaultIcon className="w-4 h-4" />, label: 'Admin' }
            ];

            const handleNavClick = (tabId) => {
                if (tabId === 'radar') setRadarOpen(true);
                else if (tabId === 'sarah-chat') openSarahChat();
                else if (tabId === 'quem-somos') handleWhoAmIClick();
                else if (tabId === 'cidadao-sensor') setActiveTab('modulo2');
                else setActiveTab(tabId);
            };

            return (
                <div className="min-h-screen flex flex-col relative text-slate-100 antialiased items-center justify-start">
                    {showSplash && <AppSplashScreen splashImageUrl={SPLASH_IMAGE_URL} onFinish={() => setShowSplash(false)} />}
                    {toastMessage && <div className="fixed top-16 left-1/2 -translate-x-1/2 z-50 cyber-card px-5 py-2.5 rounded-xl font-display text-[10px] font-black text-cyberCyan tracking-wider shadow-2xl border border-cyberCyan/60 animate-bounce">{toastMessage}</div>}

                    {shareModalOpen && (
                        <div className="fixed inset-0 bg-void/90 backdrop-blur-xl z-50 flex items-center justify-center p-4">
                            <div className="cyber-card max-w-md w-full p-6 rounded-[28px] space-y-4 text-center shadow-2xl border border-cyberCyan/50">
                                <h3 className="font-display text-xs font-black text-cyberCyan tracking-widest">📲 COMPARTILHAR ECDM PWA</h3>
                                <div className="flex justify-center my-2"><img src={SHARE_ICON_SVG_DATAURI} alt="SVG" className="w-20 h-20 rounded-2xl border border-cyberCyan/50 bg-void p-1" /></div>
                                <textarea readOnly value={shareMessageText} className="w-full h-24 bg-void border border-cyberCyan/30 rounded-xl p-2.5 text-xs text-slate-200 resize-none font-mono" />
                                <div className="flex gap-2.5">
                                    <button onClick={() => { navigator.clipboard.writeText(shareMessageText); showToast("📋 Copiado!"); setShareModalOpen(false); }} className="flex-1 py-3 cyber-button font-black rounded-xl text-xs cursor-pointer">Copiar Tudo</button>
                                    <button onClick={() => setShareModalOpen(false)} className="px-4 py-3 bg-cyberRose/20 text-cyberRose border border-cyberRose/40 rounded-xl text-xs font-bold cursor-pointer">Fechar</button>
                                </div>
                            </div>
                        </div>
                    )}

                    {!termsAccepted && (
                        <div className="fixed inset-0 bg-void/95 z-[200] flex items-center justify-center p-4 overflow-y-auto">
                            <div className="cyber-card max-w-lg w-full p-6 rounded-[28px] shadow-2xl space-y-4 my-auto border border-cyberCyan/60 font-mono">
                                <div className="text-center space-y-1 border-b border-cyberCyan/30 pb-3">
                                    <h2 className="font-display text-base font-black text-white tracking-widest animate-maluco-glow">⚖️ ECDM PWA • LGPD &amp; 9 FONTES</h2>
                                    <p className="text-[9px] text-cyberCyan font-bold uppercase tracking-wider">Grupo a Chave da Esperança © GADE</p>
                                </div>
                                <div className="space-y-3 text-[11px] text-slate-300 leading-relaxed max-h-[45vh] overflow-y-auto pr-1">
                                    <p>Aplicação PWA de alta performance com autonomia analítica da inteligência artificial Sarah, unificando 9 fontes públicas oficiais (INMET, CEMADEN, CPTEC, GOES-19, INEA, Alerta Rio, MonitorAr, Open-Meteo e Painel El Niño) sob a Lei Federal nº 12.608/2012.</p>
                                </div>
                                <div className="space-y-2.5 pt-2 border-t border-cyberCyan/30">
                                    <label className="flex items-start gap-2.5 cursor-pointer text-[10px] text-slate-200 bg-commandPanel/80 p-2.5 rounded-xl border border-cyberCyan/20">
                                        <input type="checkbox" checked={check1} onChange={(e) => setCheck1(e.target.checked)} className="mt-0.5 rounded text-cyberCyan w-4 h-4 bg-void cursor-pointer" />
                                        <span>Concordo com os termos de privacidade, LGPD e 9 fontes abertas.</span>
                                    </label>
                                    <label className="flex items-start gap-2.5 cursor-pointer text-[10px] text-slate-200 bg-commandPanel/80 p-2.5 rounded-xl border border-cyberCyan/20">
                                        <input type="checkbox" checked={check2} onChange={(e) => setCheck2(e.target.checked)} className="mt-0.5 rounded text-cyberCyan w-4 h-4 bg-void cursor-pointer" />
                                        <span>Autorizo o uso do GPS em tempo real para vistorias.</span>
                                    </label>
                                </div>
                                <button disabled={!check1 || !check2} onClick={() => { setTermsAccepted(true); try{localStorage.setItem("ecdm_cyber_terms","1");}catch(e){} showToast("🚀 ECDM Ativada!"); }} className={`w-full py-3.5 rounded-xl font-display font-black text-xs uppercase tracking-[0.15em] transition shadow-xl ${check1 && check2 ? 'cyber-button cursor-pointer' : 'bg-commandPanel text-slate-500 cursor-not-allowed'}`}>
                                    CONCORDAR E ENTRAR NA ECDM PWA &gt;
                                </button>
                            </div>
                        </div>
                    )}

                    <header className="cyber-card sticky top-0 z-30 w-full max-w-2xl px-4 py-2.5 border-b border-cyberCyan/40 flex items-center justify-between shadow-lg rounded-b-xl">
                        <div className="flex items-center gap-2.5">
                            <div className={`w-9 h-9 rounded-xl cyber-border-glow flex items-center justify-center bg-void shadow-[0_0_20px_rgba(0,242,254,0.5)] overflow-hidden border border-cyberCyan ${isSpeaking ? 'animate-hud-pulse' : ''}`}>
                                <img src={SARAH_CUSTOM_AVATAR_URL} alt="SARAH AI" className="w-full h-full object-cover" />
                            </div>
                            <div>
                                <h1 className="font-display text-[10px] sm:text-[11px] font-black text-white tracking-[0.05em] animate-maluco-glow">ECDM • ANALISTA SÊNIOR</h1>
                                <p className="text-[8px] text-cyberCyan font-mono font-bold tracking-wider uppercase">
                                    {chameleonActive ? "🦎 CAMALEÃO ATIVO" : "92 MUNICÍPIOS • RJ"}
                                </p>
                            </div>
                        </div>
                        <div className="flex items-center gap-1.5">
                            <button onClick={() => { setChameleonActive(!chameleonActive); if(!chameleonActive && soundEnabled) playChameleonSound(); }} className={`px-2 py-1 rounded-lg border text-[8px] font-bold cursor-pointer transition ${chameleonActive ? 'bg-emerald-500/25 border-emerald-400 text-emerald-300' : 'bg-cyberCyan/25 border-cyberCyan text-cyberCyan'}`}>🦎 Camaleão</button>
                            <button onClick={() => setSoundEnabled(!soundEnabled)} className={`w-9 h-9 rounded-xl border flex items-center justify-center cursor-pointer transition ${soundEnabled ? 'bg-cyberCyan/25 border-cyberCyan text-cyberCyan' : 'bg-commandPanel border-cyberCyan/30 text-slate-500'}`}>🔊</button>
                            <button onClick={toggleTheme} className="w-9 h-9 rounded-xl border border-cyberCyan/40 bg-commandPanel text-cyberCyan flex items-center justify-center cursor-pointer">🎨</button>
                            <button onClick={openShareFromApp} className="w-9 h-9 rounded-xl bg-commandPanel border border-cyberCyan/40 text-cyberGreen flex items-center justify-center cursor-pointer">🔗</button>
                            <button onClick={handleInstallApp} className={`w-9 h-9 rounded-xl border flex items-center justify-center cursor-pointer ${isInstallable ? 'bg-cyberGreen/25 border-cyberGreen text-cyberGreen animate-pulse' : 'border-cyberCyan/40 bg-commandPanel text-cyberCyan'}`}>📲</button>
                        </div>
                    </header>

                    <nav className="cyber-card w-full max-w-2xl border-b border-cyberCyan/30 px-3 py-2 flex items-center justify-center gap-1.5 overflow-x-auto z-20">
                        {NAV_TABS.map(tab => (
                            <button key={tab.id} onClick={() => handleNavClick(tab.id)} className={`px-3 py-1.5 rounded-xl text-[10px] font-black transition cursor-pointer flex items-center gap-1.5 shrink-0 tracking-wider ${activeTab === tab.id || (tab.id === 'cidadao-sensor' && activeTab === 'modulo2') || (tab.id === 'quem-somos' && quemSomosOpen) ? 'cyber-button font-black shadow-[0_0_20px_rgba(255,153,0,0.5)]' : 'bg-commandPanel text-slate-300 border border-cyberCyan/20'}`}>
                                {tab.iconComponent} {tab.label}
                            </button>
                        ))}
                    </nav>

                    <main className="flex-1 w-full max-w-2xl mx-auto p-3 sm:p-4 space-y-4 pb-28 relative z-10">
                        {activeTab === 'dashboard' && <CardIdentidadeVisualECDM openShareFromApp={openShareFromApp} openSarahChat={openSarahChat} handleWhoAmIClick={handleWhoAmIClick} setActiveTab={setActiveTab} />}
                        {activeTab === 'estacao' && <EstacaoSobrevivenciaModule showToast={showToast} />}
                        {activeTab === 'modulo1' && <ModuloElNinoModule onGoToDashboard={() => setActiveTab('dashboard')} />}
                        {activeTab === 'modulo2' && <ModuloCidadaoSensorModule onGoToDashboard={() => setActiveTab('dashboard')} showToast={showToast} />}
                        {activeTab === 'relatorio' && <VistoriaECDM_BlocosFuturistas onBackToDashboard={() => setActiveTab('dashboard')} showToast={showToast} />}
                        {activeTab === 'galeria' && <PublicVideoGallery localVideos={localVideos} onGoToDashboard={() => setActiveTab('dashboard')} />}
                        {activeTab === 'admin' && <AdminVaultModule localVideos={localVideos} setLocalVideos={setLocalVideos} marketingText={marketingText} setMarketingText={setMarketingText} showToast={showToast} onClose={() => setActiveTab('dashboard')} />}

                        <AutomatedObservatoryWidget />
                    </main>

                    {termsAccepted && <SarahFabButton onOpen={openSarahChat} />}
                    <NativeHydroWindRadar isOpen={radarOpen} onToggle={() => setRadarOpen(o => !o)} />
                    <SarahChatOverlay isOpen={isChatOpen} onClose={() => { setIsChatOpen(false); }} isSpeaking={isSpeaking} isProcessing={isProcessing} currentResponse={currentResponse} input={input} setInput={setInput} handleSendDirectCommand={handleSendDirectCommand} toggleListening={toggleListening} isListening={isListening} />
                    <QuemSomosModal isOpen={quemSomosOpen} onClose={() => setQuemSomosOpen(false)} />

                    <footer className="cyber-card fixed bottom-0 left-0 right-0 z-40 border-t border-cyberCyan/40 px-3 py-2.5 flex items-center justify-around shadow-xl backdrop-blur-2xl max-w-2xl mx-auto rounded-t-xl">
                        {NAV_TABS.map(tab => (
                            <button key={tab.id} onClick={() => handleNavClick(tab.id)} className={`flex flex-col items-center gap-0.5 cursor-pointer transition ${activeTab === tab.id ? 'text-cyberCyan scale-105' : 'text-slate-400 hover:text-white'}`}>
                                {tab.iconComponent}
                                <span className="text-[8px] font-black tracking-wider">{tab.label}</span>
                            </button>
                        ))}
                    </footer>
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
