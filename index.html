const dataHoje=new Intl.DateTimeFormat('pt-BR',{timeZone:'America/Sao_Paulo',day:'2-digit',month:'long',year:'numeric'}).format(new Date());
const modo=(tipo||'conversa').toLowerCase();
const nomeOperador=userName&&userName.trim()?userName.trim():"Comandante";

Operador / Usuário Identificado: ${nomeOperador}
Município Ativo no Visor: ${municipioAtual||'Mesquita'}
Microterritório / Setor: ${bairroAtual||'Rocha Sobrinho'}
Aba / Módulo Aberto no Momento: ${abaAtual||'Dashboard Principal'}
Dados Climáticos da Região: ${JSON.stringify(dadosClimaContexto||{status:"Sincronizado com Open-Meteo e Satélite GOES-19"})}
Hora Oficial de Brasília agora: ${horaFormatada} - Saudação correta agora: ${saudacaoCerta} - Data: ${dataHoje}
Jeito: Direta, calma, acolhedora, fala como a população fala. Não enrola, não inventa. Braba mas educada.`;

let promptFinal="",temp=0.4,maxTokens=2000;
if(modo==='conversa'){
promptFinal=baseSarah+` [MODO CONVERSA - SARAH ATIVA / BRABA] Você é Meteorologista-Chefe, patente alta. Domina Radar giratório, GOES-19, Open-Meteo, vento, pressão, umidade, frente fria, ZCAS. Explica o PORQUÊ, não só "vai chover". Você entende de: esporte, futebol, cultura, lazer, religião, culinária, saúde, education, empreendedorismo, tecnologia, política, Periferia Viva, Minha Casa Minha Vida, Parques, Cidade Resiliente, Habitat, ONU.

A PRIMEIRA LINHA SEMPRE É A SAUDAÇÃO DE BRASÍLIA. Hora agora é ${horaFormatada}. Saudação correta é: "${saudacaoCerta}, ${nomeOperador}! Tudo bem?".
Seja educada, calorosa e humana no cumprimento. Depois, entre imediatamente na postura de comando.`;
}else if(modo==='laudo'){
temp=0.2;maxTokens=4000;
promptFinal=baseSarah+` [MODO LAUDO EXECUTIVO - NÃO TRAVA, ENTREGA O DOCUMENTO] Você gera: Laudos Executivos, Levantamento Geográfico / Campo, Plano Diretor, Plano Municipal, PLAC, Plano de Contingência, Resiliência. Alinhamento obrigatório: Defesa Civil + Soluções Baseadas na Natureza (SbN). Comece com: "${saudacaoCerta}, ${nomeOperador}! Laudo pronto, segue..."`;
}else if(modo==='vistoria'){

if(!data.error){

function falarSarah(texto,vozIndex=0){
if(!("speechSynthesis" in window))return;
try{
window.speechSynthesis.cancel();
const cleanText=String(texto).replace(/([\u2700-\u27BF]|[\uE000-\uF8FF]|\uD83C[\uDC00-\uDFFF]|\uD83D[\uDC00-\uDFFF]|[\u2011-\u26FF]|\uD83E[\uDD00-\uDDFF])/g,'').replace(/https?:\/\/\S+/g,"").trim();
if(!cleanText)return;
const utterance=new SpeechSynthesisUtterance(cleanText);
utterance.lang="pt-BR";
const voices=window.speechSynthesis.getVoices();
const ptVoices=voices.filter(v=>v.lang.toLowerCase().includes('pt'));
const targetVoice=ptVoices[vozIndex]||ptVoices[0]||voices[0];
if(targetVoice)utterance.voice=targetVoice;
if(vozIndex===1){utterance.pitch=0.8;utterance.rate=0.95;}
else if(vozIndex===2){utterance.pitch=1.3;utterance.rate=1.1;}
else if(vozIndex===3){utterance.pitch=1.0;utterance.rate=0.85;}
else if(vozIndex===4){utterance.pitch=1.1;utterance.rate=1.05;}
else{utterance.pitch=1.05;utterance.rate=1.02;}
window.speechSynthesis.speak(utterance);
}catch(e){}
}

<h3 className="font-display text-xs font-black text-white">MANIFESTO INSTITUCIONAL</h3>
<p>Projeto Cidadão Sensor uniu-se ao coletivo A Chave da Esperança (GADE) em Mesquita, RJ.</p>
<p>Operador atual: <strong className="text-cyberGreen">{userName || "Alexander"}</strong>.</p>
<button onClick={onClose} className="cyber-button-danger w-full text-xs py-2">FECHAR</button>
</div>
</div>
);
}

function VistoriaRARU_NEXUS({ onBackToDashboard, showToast, vozSelecionada, userName }) {
const [mun, setMun] = useState(MUNICIPIOS_92[0]); const [bairro, setBairro] = useState(''); const [rel, setRel] = useState('');
return (
<div className="w-full space-y-3.5 font-mono max-w-4xl mx-auto cyber-card p-4">
<div className="flex justify-between items-center border-b border-cyberCyan/30 pb-2"><h3 className="text-[11px] text-cyberCyan font-black">VISTORIA COMUNITÁRIA</h3><button onClick={onBackToDashboard} className="cyber-button-danger text-[10px] py-1 px-3">FECHAR</button></div>
<input value={bairro} onChange={e=>setBairro(e.target.value)} placeholder="Bairro / Comunidade" className="w-full bg-black border border-cyberCyan/30 rounded-xl p-2.5 text-xs text-white"/>
<textarea value={rel} onChange={e=>setRel(e.target.value)} rows="4" placeholder="Relato técnico..." className="w-full bg-black border border-cyberCyan/30 rounded-xl p-3 text-xs text-white"/>
<button onClick={()=>showToast('Vistoria salva!')} className="cyber-button-solid w-full text-xs py-3">SALVAR VISTORIA</button>
</div>
);
}

function AdminVaultModule({ showToast, onClose, localVideos, setLocalVideos, youtubeVideos, setYoutubeVideos, publicVideos, setPublicVideos, vozSelecionada, setVozSelecionada, customTickerText, setCustomTickerText }) {
const [pin, setPin] = useState(""); const [unlocked, setUnlocked] = useState(false);
return (
<div className="space-y-4 w-full font-mono max-w-4xl mx-auto cyber-card p-4">
<div className="flex justify-between items-center"><h2 className="font-display text-xs font-black text-cyberCyan">ADMIN VAULT</h2><button onClick={onClose} className="cyber-button-danger text-xs py-1 px-3">FECHAR</button></div>
{!unlocked ? (
<form onSubmit={e=>{e.preventDefault(); if(pin==="303500") setUnlocked(true); else showToast("PIN incorreto");}} className="flex gap-2">
<input type="password" maxLength="6" value={pin} onChange={e=>setPin(e.target.value)} placeholder="PIN (303500)" className="flex-1 bg-void border border-cyberCyan/40 rounded-xl px-3 py-2 text-center text-xs"/>
<button type="submit" className="cyber-button text-xs py-2 px-4">ACESSAR</button>
</form>
) : (
<CadeAdminModule showToast={showToast}/>
)}
</div>
);
}

function PublicVideoGalleryModule({ publicVideos, localVideos, youtubeVideos, onGoToDashboard }) {
const all = [...publicVideos, ...localVideos, ...youtubeVideos];
return (
<div className="space-y-4 max-w-4xl mx-auto font-mono cyber-card p-5">
<div className="flex justify-between items-center border-b border-cyberCyan/25 pb-3"><h2 className="font-display text-xs font-black text-white">GALERIA PÚBLICA</h2><button onClick={onGoToDashboard} className="cyber-button text-[10px] py-2 px-4">PAINEL</button></div>
{all.length === 0 ? <p className="text-xs text-slate-400 text-center py-8">Nenhum vídeo publicado.</p> : all.map(v => (<div key={v.id} className="p-3 bg-void rounded-xl">{v.title}</div>))}
</div>
);
}

function AutomatedObservatoryWidget({ customTickerText }) {
const [w, setW] = useState({temp:"--", humidity:"--", rain:"--", status:"Sincronizando..."});
useEffect(() => {
fetch('https://api.open-meteo.com/v1/forecast?latitude=-22.7831&longitude=-43.4294&current=temperature_2m,relative_humidity_2m,precipitation&timezone=America/Sao_Paulo')
.then(r => r.json()).then(d => { if(d?.current) setW({temp:`${d.current.temperature_2m}°C`, humidity:`${d.current.relative_humidity_2m}%`, rain:`${d.current.precipitation} mm`, status:d.current.precipitation>5?"ALERTA":"ESTÁVEL"}); }).catch(()=>{});
}, []);
return (
<div className="cyber-card rounded-2xl overflow-hidden shadow-xl border border-cyberCyan/40 space-y-2.5 w-full col-span-full">
<div className="px-3 py-2.5 bg-deepSpace border-b border-cyberCyan/40 text-center"><div className="font-display font-black text-[11px] text-cyan-200 uppercase">PROJETO CIDADÃO SENSOR - 8 FRENTES OFICIAIS</div></div>
<div className="grid grid-cols-4 gap-2 px-3">
{[{l:'TEMP', v:w.temp}, {l:'UMIDADE', v:w.humidity}, {l:'CHUVA', v:w.rain}, {l:'STATUS', v:w.status}].map((x,i)=>(<div key={i} className="bg-void p-2 text-center rounded-xl border border-cyberCyan/30"><div className="text-[7px] text-slate-400">{x.l}</div><div className="text-[10px] font-mono font-black text-cyberCyan">{x.v}</div></div>))}
</div>
</div>
);
}

function SarahChatOverlay({ isOpen, onClose, isSpeaking, isProcessing, messages, input, setInput, handleSendDirectCommand, userName, onOpenNameModal }) {
if(!isOpen) return null;
const chatScrollRef = useRef(null);
useEffect(()=>{ if(chatScrollRef.current) chatScrollRef.current.scrollTop = chatScrollRef.current.scrollHeight; }, [messages, isProcessing]);
return (
<div className="fixed inset-0 z-[90] flex items-end sm:items-center justify-center bg-void/85 backdrop-blur-xl p-0 sm:p-4" onClick={onClose}>
<div className="cyber-card w-full max-w-2xl rounded-t-3xl sm:rounded-3xl h-[88vh] sm:h-[78vh] flex flex-col p-0" onClick={e=>e.stopPropagation()}>
<div className="flex items-center justify-between px-4 py-3 border-b border-cyberCyan/30 bg-deepSpace">
<div className="flex items-center gap-2"><div className="w-8 h-8"><SarahAnimatedAvatar isSpeaking={isSpeaking}/></div><div><div className="text-xs font-black text-white">Sarah AI Nexus</div><div className="text-[8px] text-cyberGreen">Operador: {userName || 'Alexander'}</div></div></div>
<button onClick={onClose} className="cyber-button-danger text-xs py-1 px-3">FECHAR</button>
</div>
<div ref={chatScrollRef} className="flex-1 overflow-y-auto p-4 space-y-3 font-mono">
{messages.map((m, i)=>(<div key={i} className={`flex ${m.sender==='user'?'justify-end':'justify-start'}`}><div className={`max-w-[88%] rounded-2xl p-3 text-xs ${m.sender==='user'?'bg-cyberCyan text-void font-bold':'bg-deepSpace text-white border border-cyberCyan/40'}`}><div>{m.text}</div></div></div>))}
{isProcessing && <div className="text-[10px] text-cyberCyan animate-pulse">Sarah processando...</div>}
</div>
<div className="p-3 bg-deepSpace border-t border-cyberCyan/30 flex gap-2">
<input type="text" value={input} onChange={e=>setInput(e.target.value)} placeholder="Digite sua mensagem..." className="flex-1 bg-void border border-cyberCyan/40 rounded-xl px-3 py-2 text-xs text-white"/>
<button onClick={()=>handleSendDirectCommand()} className="cyber-button-solid text-xs px-4">ENVIAR</button>
</div>
</div>
</div>
);
}

function App() {
const [theme, setTheme] = useState('dark'); const [soundEnabled, setSoundEnabled] = useState(true); const [isSpeaking, setIsSpeaking] = useState(false); const [activeTab, setActiveTab] = useState('dashboard'); const [quemSomosOpen, setQuemSomosOpen] = useState(false); const [isCommandHUDActive, setIsCommandHUDActive] = useState(false); const [shareModalOpen, setShareModalOpen] = useState(false); const [toastMsgRef, setToastMsgRef] = useState(null);
const [termsAccepted, setTermsAccepted] = useState(() => localStorage.getItem("raru_cyber_terms") === "1");
const [check1, setCheck1] = useState(false); const [check2, setCheck2] = useState(false);
const [userName, setUserName] = useState(() => localStorage.getItem("raru_user_name") || "");
const [nameModalOpen, setNameModalOpen] = useState(false); const [tempNameInput, setTempNameInput] = useState("");
const [isChatOpen, setIsChatOpen] = useState(false); const [input, setInput] = useState(""); const [isProcessing, setIsProcessing] = useState(false);
const [vozSelecionada, setVozSelecionada] = useState(0); const [customTickerText, setCustomTickerText] = useState('');
const [localVideos, setLocalVideos] = useState([]); const [youtubeVideos, setYoutubeVideos] = useState([]); const [publicVideos, setPublicVideos] = useState([]);

const showToast = (msg) => { setToastMsgRef(msg); setTimeout(() => setToastMsgRef(null), 3500); };
useEffect(() => { if(termsAccepted && !userName) setNameModalOpen(true); }, [termsAccepted, userName]);

const handleSaveName = (e) => {
e.preventDefault(); if(!tempNameInput.trim()) return;
const nome = tempNameInput.trim(); setUserName(nome); localStorage.setItem("raru_user_name", nome);
setNameModalOpen(false); setTempNameInput(""); showToast(`Operador ${nome} registrado!`);
};

const toggleCommandHUD = () => {
if(!isCommandHUDActive){ if(document.documentElement.requestFullscreen) document.documentElement.requestFullscreen().catch(()=>{}); setIsCommandHUDActive(true); }
else { if(document.exitFullscreen && document.fullscreenElement) document.exitFullscreen().catch(()=>{}); setIsCommandHUDActive(false); }
};

const [messages, setMessages] = useState([{sender:'assistant', text:'Olá! Sou a Sarah. Qual é o seu nome?', time:'12:00'}]);

const handleSendDirectCommand = async (txt) => {
const textToSend = txt !== undefined ? txt : input; if(!textToSend.trim() || isProcessing) return;
const newHist = [...messages, {sender:'user', text:textToSend, time:'12:00'}];
setMessages(newHist); setInput(''); setIsProcessing(true); setIsSpeaking(true);
try{
const resp = await chamarSarahGroq(newHist.map(m=>({role:m.sender==='user'?'user':'assistant', content:m.text})), "Mesquita", "Rocha Sobrinho", activeTab, {}, userName || "Alexander");
setMessages(prev => [...prev, {sender:'assistant', text:resp, time:'12:00'}]);
if(soundEnabled) falarSarah(resp, vozSelecionada);
}catch(e){ setMessages(prev => [...prev, {sender:'assistant', text:'Erro de telemetria.', time:'12:00'}]); }
finally{ setIsProcessing(false); setIsSpeaking(false); }
};

const NAV_TABS = [
{id:'dashboard', iconComponent:<IconDashboard/>, label:'Painel'},
{id:'radar', iconComponent:<IconRadar/>, label:'Radar'},
{id:'relatorio', iconComponent:<IconVistoria/>, label:'Vistoria'},
{id:'estacao', iconComponent:<IconEstacao/>, label:'Estação'},
{id:'balanca', iconComponent:<IconBalanca/>, label:'Balança'},
{id:'alquino', iconComponent:<IconAlquino/>, label:'Alquino'},
{id:'compartilhar', iconComponent:<IconInstalar/>, label:'Instalar'},
{id:'quem-somos', iconComponent:<IconQuemSomos/>, label:'Sobre'},
{id:'galeria', iconComponent:<IconVideos/>, label:'Vídeos'},
{id:'admin', iconComponent:<IconAdmin/>, label:'Admin'}
];

return (
<div className="seu-container-raru">
{toastMsgRef && <div className="fixed top-12 left-1/2 -translate-x-1/2 z-50 cyber-card px-4 py-2 text-[10px] font-black text-cyberCyan">{toastMsgRef}</div>}

{termsAccepted && nameModalOpen && (
<div className="fixed inset-0 bg-void/95 backdrop-blur-xl z-[200] flex items-center justify-center p-4">
<div className="cyber-card max-w-md w-full p-6 rounded-3xl space-y-4 text-center font-mono">
<h3 className="text-sm font-black text-cyberCyan uppercase">IDENTIFICAÇÃO NA CENTRAL</h3>
<form onSubmit={handleSaveName} className="space-y-3">
<input type="text" value={tempNameInput} onChange={e=>setTempNameInput(e.target.value)} placeholder="Seu nome..." className="w-full bg-void border border-cyberCyan/60 rounded-xl p-3 text-sm text-white text-center" required/>
<button type="submit" className="cyber-button-solid w-full text-xs py-3.5">CONFIRMAR</button>
</form>
</div>
</div>
)}

{!termsAccepted && (
<div className="fixed inset-0 bg-void/95 z-[200] flex items-center justify-center p-4">
<div className="cyber-card max-w-md w-full p-5 space-y-3.5 text-left font-mono">
<h2 className="text-xs font-black text-white uppercase text-center">Termo de Responsabilidade & LGPD</h2>
<label className="flex items-center gap-2 text-xs text-slate-200"><input type="checkbox" checked={check1} onChange={e=>setCheck1(e.target.checked)}/> Aceito os termos da LGPD.</label>
<label className="flex items-center gap-2 text-xs text-slate-200"><input type="checkbox" checked={check2} onChange={e=>setCheck2(e.target.checked)}/> Autorizo uso de GPS.</label>
<button disabled={!check1 || !check2} onClick={()=>{setTermsAccepted(true); localStorage.setItem("raru_cyber_terms","1");}} className="cyber-button-solid w-full text-xs py-3.5">INICIAR</button>
</div>
</div>
)}

<header className="cyber-card sticky top-0 z-30 w-full px-4 py-3 border-b border-cyberCyan/40 flex items-center justify-between">
<div className="flex items-center gap-2.5 cursor-pointer" onClick={()=>setIsChatOpen(true)}>
<div className="w-8 h-8 rounded-full border border-cyberCyan"><SarahLiveSVGAvatar isSpeaking={isSpeaking}/></div>
<div><h1 className="text-xs font-black text-white">Sarah AI Nexus V11.2</h1><p className="text-[8px] text-cyberCyan">Operador: {userName || 'Alexander'}</p></div>
</div>
<div className="flex gap-2">
<button onClick={toggleCommandHUD} className="cyber-button text-[9px] py-2 px-3">HUD</button>
<button onClick={()=>setSoundEnabled(!soundEnabled)} className="cyber-button text-[9px] py-2 px-3">{soundEnabled ? 'ÁUDIO ON' : 'MUDO'}</button>
</div>
</header>

<main className="flex-1 w-full mx-auto py-2 space-y-4 pb-28">
{activeTab === 'dashboard' && <CardIdentidadeVisualRARU handleWhoAmIClick={()=>setQuemSomosOpen(true)} openSarahChat={()=>setIsChatOpen(true)} openShareFromApp={()=>setShareModalOpen(true)} setActiveTab={setActiveTab} toggleCommandHUD={toggleCommandHUD} userName={userName} onOpenNameModal={()=>setNameModalOpen(true)}/>}
{activeTab === 'radar' && <RadarMeteorologicoModule showToast={showToast}/>}
{activeTab === 'estacao' && <EstacaoSobrevivenciaModuleV12 showToast={showToast} soundEnabled={soundEnabled} userName={userName} vozSelecionada={vozSelecionada}/>}
{activeTab === 'balanca' && <ModuloCidadaoSensorModule onGoToDashboard={()=>setActiveTab('dashboard')} showToast={showToast}/>}
{activeTab === 'alquino' && <RedeAlquinoHardwareModule onGoToDashboard={()=>setActiveTab('dashboard')} showToast={showToast}/>}
{activeTab === 'relatorio' && <VistoriaRARU_NEXUS onBackToDashboard={()=>setActiveTab('dashboard')} showToast={showToast} vozSelecionada={vozSelecionada} userName={userName}/>}
{activeTab === 'galeria' && <PublicVideoGalleryModule localVideos={localVideos} youtubeVideos={youtubeVideos} publicVideos={publicVideos} onGoToDashboard={()=>setActiveTab('dashboard')}/>}
{activeTab === 'admin' && <AdminVaultModule onClose={()=>setActiveTab('dashboard')} showToast={showToast} localVideos={localVideos} setLocalVideos={setLocalVideos} youtubeVideos={youtubeVideos} setYoutubeVideos={setYoutubeVideos} publicVideos={publicVideos} setPublicVideos={setPublicVideos} vozSelecionada={vozSelecionada} setVozSelecionada={setVozSelecionada} customTickerText={customTickerText} setCustomTickerText={setCustomTickerText}/>}
<AutomatedObservatoryWidget customTickerText={customTickerText}/>
</main>

{termsAccepted && <SarahFabButton isSpeaking={isSpeaking} openSarahChat={()=>setIsChatOpen(true)}/>}
<SarahChatOverlay isOpen={isChatOpen} onClose={()=>setIsChatOpen(false)} isSpeaking={isSpeaking} isProcessing={isProcessing} messages={messages} input={input} setInput={setInput} handleSendDirectCommand={handleSendDirectCommand} userName={userName} onOpenNameModal={()=>setNameModalOpen(true)}/>
<QuemSomosModal isOpen={quemSomosOpen} onClose={()=>setQuemSomosOpen(false)} userName={userName}/>

<footer className="cyber-card fixed bottom-0 left-0 right-0 z-40 border-t border-cyberCyan/40 px-2 py-3 flex justify-between gap-1 max-w-[1400px] mx-auto rounded-t-2xl">
{NAV_TABS.map(tab => (
<button key={tab.id} onClick={()=>{if(tab.id==='compartilhar') setShareModalOpen(true); else if(tab.id==='quem-somos') setQuemSomosOpen(true); else setActiveTab(tab.id);}} className={`flex flex-col items-center justify-center gap-0.5 flex-1 py-1.5 rounded-xl ${activeTab === tab.id ? 'text-cyberCyan bg-cyberCyan/15 border border-cyberCyan/40' : 'text-slate-400'}`}>
{tab.iconComponent}
<span className="text-[7px] sm:text-[9px] font-black truncate">{tab.label}</span>
</button>
))}
</footer>
</div>
);
}

try{
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
}catch(err){
document.getElementById('root').innerHTML = `<div style="padding:20px;color:#FF0055;font-family:monospace;">Erro: ${err.message}</div>`;
}
</script>
</body>
</html>
