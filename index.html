function escolherVozMasculinaPtBr() {

function falarRoboMasculino(texto, onStart = null, onEnd = null) {
  try {
    if (localStorage.getItem("raru_sound_enabled") === "false") {
      if (onEnd) onEnd();
      return;
    }
  } catch (e) {}
  if (!("speechSynthesis" in window)) {
    if (onEnd) onEnd();
    return;
  }
  const textoLimpo = limparTextoParaFala(texto);
  if (!textoLimpo) {
    if (onEnd) onEnd();
    return;
  }

  try {
    window.speechSynthesis.cancel();
    const frases = textoLimpo.split(/(?<=[.!?])\s+/).filter(Boolean);
    const fila = frases.length > 0 ? frases : [textoLimpo];
    const vozMasc = escolherVozMasculinaPtBr();

    if (onStart) onStart();

    const falarSequencia = (index) => {
      if (index >= fila.length) {
        if (onEnd) onEnd();
        return;
      }
      try {
        if (localStorage.getItem("raru_sound_enabled") === "false") {
          if (onEnd) onEnd();
          return;
        }
      } catch (e) {}

      const u = new SpeechSynthesisUtterance(fila[index]);
      u.lang = "pt-BR";
      u.pitch = 0.68;
      u.rate = 0.96;
      u.volume = 1.0;
      if (vozMasc) u.voice = vozMasc;

      u.onend = () => {
        if (index + 1 < fila.length) setTimeout(() => falarSequencia(index + 1), 260);
        else if (onEnd) onEnd();
      };
      u.onerror = () => {
        if (index + 1 < fila.length) setTimeout(() => falarSequencia(index + 1), 260);
        else if (onEnd) onEnd();
      };
      window.speechSynthesis.speak(u);
    };

    falarSequencia(0);
  } catch (e) {
    if (onEnd) onEnd();
  }
}

function falarImitada(texto, perfilId = 'sarah') {

  } catch (e) {}
  if (!("speechSynthesis" in window)) return;
  const textoLimpo = limparTextoParaFala(texto);
  if (!textoLimpo) return;

  const perfilSalvo = (() => {
    try { return localStorage.getItem("raru_perfil_voz") || perfilId || 'sarah'; }
    catch (e) { return perfilId || 'sarah'; }
  })();
  const perfil = PERFIS_VOZ_OFICIAIS.find(p => p.id === perfilSalvo) || PERFIS_VOZ_OFICIAIS[0];

  try {
    window.speechSynthesis.cancel();
    const textoImitado = limparTextoParaFala(perfil.transform(textoLimpo));
    const frases = textoImitado.split(/(?<=[.!?])\s+/).filter(Boolean);
    const fila = frases.length > 0 ? frases : [textoImitado];
    const vozEscolhida = escolherVozPtBr(perfil.id);

    const falarSequencia = (index) => {
      if (index >= fila.length) return;
      try {
        if (localStorage.getItem("raru_sound_enabled") === "false") return;
      } catch (e) {}

      const u = new SpeechSynthesisUtterance(fila[index]);
      u.lang = "pt-BR";
      const osc = (Math.random() - 0.5) * perfil.variacao;
      u.pitch = Math.max(0.5, Math.min(2.0, perfil.pitch + osc));
      u.rate = Math.max(0.5, Math.min(2.0, perfil.rate));
      u.volume = Math.max(0, Math.min(1, perfil.volume));
      if (vozEscolhida) u.voice = vozEscolhida;

      u.onend = () => {
        if (index + 1 < fila.length) setTimeout(() => falarSequencia(index + 1), perfil.pausaFrase);
      };
      u.onerror = () => {
        if (index + 1 < fila.length) setTimeout(() => falarSequencia(index + 1), perfil.pausaFrase);
      };
      window.speechSynthesis.speak(u);
    };

    falarSequencia(0);
  } catch (e) {}
}

async function calcularSHA256(texto) {
  const str = String(texto || "");
  try {
    if (window.crypto && window.crypto.subtle && window.TextEncoder) {
      const encoder = new TextEncoder();
      const data = encoder.encode(str);
      const hashBuffer = await window.crypto.subtle.digest('SHA-256', data);
      const hashArray = Array.from(new Uint8Array(hashBuffer));
      return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
    }
  } catch (e) {}
  let h1 = 0xdeadbeef, h2 = 0x41c6ce57;
  for (let i = 0; i < str.length; i++) {
    const ch = str.charCodeAt(i);
    h1 = Math.imul(h1 ^ ch, 2654435761);
    h2 = Math.imul(h2 ^ ch, 1597334677);
  }
  h1 = Math.imul(h1 ^ (h1 >>> 16), 2246822507) ^ Math.imul(h2 ^ (h2 >>> 13), 3266489909);
  h2 = Math.imul(h2 ^ (h2 >>> 16), 2246822507) ^ Math.imul(h1 ^ (h1 >>> 13), 3266489909);
  const combinado = (4294967296 * (2097151 & h2) + (h1 >>> 0)).toString(16).padStart(16, '0');
  return combinado.repeat(4).slice(0, 64);
}

function quebrarTextoCanvas(ctx, texto, maxWidth) {
  const palavras = String(texto || '').split(/\s+/).filter(Boolean);
  if (palavras.length === 0) return [''];
  const linhas = [];
  let atual = palavras[0];

  for (let i = 1; i < palavras.length; i++) {
    const teste = atual + ' ' + palavras[i];
    if (ctx.measureText(teste).width <= maxWidth) {
      atual = teste;
    } else {
      if (ctx.measureText(atual).width > maxWidth) {
        let pedaco = '';
        for (const ch of atual) {
          if (ctx.measureText(pedaco + ch).width <= maxWidth) pedaco += ch;
          else {
            linhas.push(pedaco);
            pedaco = ch;
          }
        }
        if (pedaco) atual = pedaco;
      }
      linhas.push(atual);
      atual = palavras[i];
    }
  }

  if (ctx.measureText(atual).width > maxWidth) {
    let pedaco = '';
    for (const ch of atual) {
      if (ctx.measureText(pedaco + ch).width <= maxWidth) pedaco += ch;
      else {
        linhas.push(pedaco);
        pedaco = ch;
      }
    }
    if (pedaco) linhas.push(pedaco);
  } else {
    linhas.push(atual);
  }
  return linhas;
}

function montarPdfBlobAPartirDeJpegDataUrl(jpegDataUrl, larguraPx = 794, alturaPx = 1123) {
  const base64 = String(jpegDataUrl || '').split(',')[1] || '';
  const binStr = atob(base64);
  const imgBytes = new Uint8Array(binStr.length);
  for (let i = 0; i < binStr.length; i++) {
    imgBytes[i] = binStr.charCodeAt(i);
  }

  const ptW = 595.28;
  const ptH = Math.max(841.89, +(595.28 * (alturaPx / Math.max(1, larguraPx))).toFixed(2));
  const encoder = new TextEncoder();
  const chunks = [];
  const offsets = [0];
  let totalLen = 0;

  const pushStr = (str) => {
    const arr = encoder.encode(str);
    chunks.push(arr);
    totalLen += arr.length;
  };

  const pushBytes = (arr) => {
    chunks.push(arr);
    totalLen += arr.length;
  };

  const startObj = (id) => {
    offsets[id] = totalLen;
    pushStr(`${id} 0 obj\n`);
  };

  pushStr('%PDF-1.4\n');
  startObj(1);
  pushStr('<< /Type /Catalog /Pages 2 0 R >>\nendobj\n');

  startObj(2);
  pushStr('<< /Type /Pages /Kids [3 0 R] /Count 1 >>\nendobj\n');

  startObj(3);
  pushStr(`<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${ptW} ${ptH}] /Resources << /XObject << /Im0 4 0 R >> >> /Contents 5 0 R >>\nendobj\n`);

  startObj(4);
  pushStr(`<< /Type /XObject /Subtype /Image /Width ${larguraPx} /Height ${alturaPx} /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${imgBytes.length} >>\nstream\n`);
  pushBytes(imgBytes);
  pushStr('\nendstream\nendobj\n');

  const contentStream = `q\n${ptW} 0 0 ${ptH} 0 0 cm\n/Im0 Do\nQ\n`;
  startObj(5);
  pushStr(`<< /Length ${contentStream.length} >>\nstream\n${contentStream}endstream\nendobj\n`);

  const xrefPos = totalLen;
  pushStr(`xref\n0 6\n0000000000 65535 f \n`);
  for (let i = 1; i <= 5; i++) {
    pushStr(`${String(offsets[i]).padStart(10, '0')} 00000 n \n`);
  }
  pushStr(`trailer\n<< /Size 6 /Root 1 0 R >>\nstartxref\n${xrefPos}\n%%EOF`);

  const out = new Uint8Array(totalLen);
  let pos = 0;
  for (const c of chunks) {
    out.set(c, pos);
    pos += c.length;
  }
  return new Blob([out], { type: 'application/pdf' });
}

async function compartilharEscudoComTextoUnico(showToast) {
  const textoLimpo = shareMessageText.trim();
  const escudoFile = await gerarArquivoIconeEscudo();

  try {
    if (escudoFile && navigator.canShare && navigator.canShare({ files: [escudoFile] })) {
      await navigator.share({
        title: 'RARU NEXUS V11.2 PLUS',
        text: textoLimpo,
        files: [escudoFile]
      });
      if (showToast) showToast("Ícone do escudo + texto com link único compartilhados.");
      return;
    }
  } catch (e) {
    if (e && e.name === 'AbortError') return;
  }

  if (escudoFile) {
    try {
      const urlImg = URL.createObjectURL(escudoFile);
      const a = document.createElement('a');
      a.href = urlImg;
      a.download = escudoFile.name;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      setTimeout(() => URL.revokeObjectURL(urlImg), 3000);
    } catch (e) {}
  }

  try {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      await navigator.clipboard.writeText(textoLimpo);
    }
  } catch (e) {}

  if (showToast) showToast("Ícone do escudo baixado + texto com link único copiado.");
}

  const [telemetria, setTelemetria] = useState({
    temp: '--',
    vento: '--',
    chuva: '--',

function PainelRotasEstacaoPublica() {
  const [rotas, setRotas] = useState([]);

  useEffect(() => {
    const carregarRotas = () => {
      try {
        const r = JSON.parse(localStorage.getItem('rotasFugaReais') || '[]');
        setRotas(r);
      } catch (e) { setRotas([]); }
    };
    carregarRotas();
    window.addEventListener('storage', carregarRotas);
    const interval = setInterval(carregarRotas, 2500);
    return () => {
      window.removeEventListener('storage', carregarRotas);

function CadeAdminModule({ showToast }) {

  const salvarRota = () => {
    if (!rNome.trim() || !rEnd.trim()) { showToast('Escreve o nome e o endereço.'); return; }

    if (!confirm('Excluir essa rota?')) return;

    setUltimaMsgPronta(base);
    if (navigator.clipboard) navigator.clipboard.writeText(base).catch(() => {});
    const agoraStr = tipo + ' - ' + new Date().toLocaleString('pt-BR');
    try { localStorage.setItem('cadeUltimoSOS', agoraStr); } catch (e) {}
    setHistoricoSOS('Último SOS: ' + agoraStr);
    setStatusSOS('Mensagem copiada e grupo aberto. Buscando GPS...');

    const abrirGrupo = window.open(GRUPO_GADE, '_blank');
    if (!abrirGrupo) window.location.href = GRUPO_GADE;

    if (navigator.geolocation) {
      navigator.geolocation.getCurrentPosition(

  ];

  const [kitCheck, setKitCheck] = useState(() => {

function RadarMeteorologicoModule({ perfilVozId }) {
  const [dados, setDados] = useState({});
  const [status, setStatus] = useState('Conectando Open-Meteo...');
  const [cidadeSel1, setCidadeSel1] = useState('Mesquita');
  const [cidadeSel2, setCidadeSel2] = useState('Duque de Caxias');
  const [modoVisualizacao, setModoVisualizacao] = useState('radar');
  const [iframeKey, setIframeKey] = useState(0);

  const chartTempRef = useRef(null);
  const chartRainRef = useRef(null);

  function corPorChuva(p) {
    if (p >= 70) return '#7C4DFF';
    if (p >= 40) return '#FF0055';
    if (p >= 20) return '#FFB703';
    return '#00FF9D';
  }
  function textoPorChuva(p) {
    if (p >= 70) return 'Muito forte';
    if (p >= 40) return 'Forte';
    if (p >= 20) return 'Moderada';
    return 'Fraca / Estável';
  }

  const desenharGraficoCanvas = (canvasRef, valores, cores, sufixo) => {
    const cv = canvasRef.current;
    if (!cv) return;
    const ctx = cv.getContext('2d');
    const W = cv.width = 340, H = cv.height = 140;
    ctx.clearRect(0, 0, W, H);
    const max = Math.max(...valores, 1);
    const step = W / valores.length;
    const horaAtual = new Date().getHours();

    valores.forEach((v, i) => {
      const h = (v / max) * (H - 35);
      const x = i * step + 4;
      const grad = ctx.createLinearGradient(0, H - h, 0, H);
      grad.addColorStop(0, cores[0]);
      grad.addColorStop(1, cores[1]);
      ctx.fillStyle = grad;
      ctx.fillRect(x, H - h - 20, step - 6, h);
      ctx.fillStyle = '#FFFFFF';
      ctx.font = 'bold 9px monospace';
      ctx.textAlign = 'center';
      ctx.fillText(v + sufixo, x + (step / 2), H - h - 23);

      const horaLabel = `${String((horaAtual + i) % 24).padStart(2, '0')}h`;
      ctx.fillStyle = '#00F2FE';
      ctx.font = '600 8px monospace';
      ctx.fillText(horaLabel, x + (step / 2), H - 6);
    });
  };

  const desenharGraficosHorarios = (hourly) => {
    if (!hourly) return;
    const h = new Date().getHours();
    const temps = [], chuvas = [];
    for (let i = 0; i < 12; i++) {
      const idx = (h + i) % 24;
      temps.push(Math.round(hourly.temperature_2m[idx] || 25));
      chuvas.push(hourly.precipitation_probability[idx] || 0);
    }
    setTimeout(() => {
      desenharGraficoCanvas(chartTempRef, temps, ['#ff5252', '#ffca28'], '°C');
      desenharGraficoCanvas(chartRainRef, chuvas, ['#7c4dff', '#29b6f6'], '%');
    }, 80);
  };

  useEffect(() => {
    async function carregar() {
      try {
        const lats = MUNICIPIOS_92.map(c => c.lat).join(',');
        const lons = MUNICIPIOS_92.map(c => c.lon).join(',');
        const url = `https://api.open-meteo.com/v1/forecast?latitude=${lats}&longitude=${lons}&current=temperature_2m,relative_humidity_2m,wind_speed_10m&hourly=temperature_2m,precipitation_probability,wind_speed_10m&timezone=America%2FSao_Paulo&forecast_days=1`;
        const r = await fetch(url);
        const j = await r.json();
        const arr = Array.isArray(j) ? j : [j];
        const mapa = {};
        arr.forEach((item, i) => {
          const c = MUNICIPIOS_92[i];
          if (!c || !item?.current) return;
          const hora = new Date().getHours();
          mapa[c.n] = {
            temp: item.current.temperature_2m,
            umi: item.current.relative_humidity_2m,
            vento: item.current.wind_speed_10m,
            chuva: item.hourly?.precipitation_probability?.[hora] || 0,
            hourly: item.hourly
          };
        });
        setDados(mapa);
        setStatus('Open-Meteo conectado · 92 municípios · Dados reais');
      } catch (e) {
        setStatus('Sem conexão · Tentando de novo');
      }
    }
    carregar();
    const t = setInterval(carregar, 600000);
    return () => clearInterval(t);
  }, []);

  useEffect(() => {
    if (dados[cidadeSel1]?.hourly) {
      desenharGraficosHorarios(dados[cidadeSel1].hourly);
    }
  }, [cidadeSel1, dados, modoVisualizacao]);

  const PONTOS_BACIAS = [
    { rh: 'RH I', nome: 'Baía da Ilha Grande', lat: -23.05, lon: -44.35 },
    { rh: 'RH II', nome: 'Guandu', lat: -22.65, lon: -43.70 },
    { rh: 'RH III', nome: 'Médio Paraíba do Sul', lat: -22.45, lon: -44.15 },
    { rh: 'RH IV', nome: 'Piabanha', lat: -22.35, lon: -43.05 },
    { rh: 'RH V', nome: 'Baía de Guanabara', lat: -22.75, lon: -43.15 },
    { rh: 'RH VI', nome: 'Lagos São João', lat: -22.85, lon: -42.30 },
    { rh: 'RH VII', nome: 'Rio Dois Rios', lat: -22.00, lon: -42.35 },
    { rh: 'RH VIII', nome: 'Macaé e das Ostras', lat: -22.30, lon: -41.95 },
    { rh: 'RH IX', nome: 'Baixo Paraíba do Sul', lat: -21.55, lon: -41.45 },
  ];

  function posRadar(c) {
    const minLon = -44.75, maxLon = -41.0, minLat = -23.25, maxLat = -20.9;
    return {
      x: 7 + ((c.lon - minLon) / (maxLon - minLon)) * 86,
      y: 7 + ((maxLat - c.lat) / (maxLat - minLat)) * 86
    };
  }

  function falar(cNome) {
    const d = dados[cNome];
    if (!d) return;
    falarImitada(`Em ${cNome}, agora está ${d.temp} graus. Chance de chuva ${d.chuva} por cento. Vento ${d.vento} quilômetros por hora.`, perfilVozId);
  }

  const d1 = dados[cidadeSel1];
  const d2 = dados[cidadeSel2];

  return (
    <div className="space-y-4 w-full font-mono">
      <div className="rounded-[22px] border border-cyan-400/40 bg-[#02122A] p-4 space-y-3 shadow-[0_0_30px_rgba(0,255,255,0.15)] relative overflow-hidden">
        <div className="flex justify-between items-start gap-2">
          <h3 className="text-[15px] leading-tight font-black text-cyan-300 uppercase tracking-widest text-center flex-1">
            Radar Meteorológico &amp; Previsão Horária (Compatível com Telões e TVs 65&quot;)
          </h3>
          <span className="text-[9px] text-emerald-400 font-bold text-right leading-tight shrink-0 pt-1">
            GOES-19 • FLUXO ATIVO
          </span>
        </div>
        <p className="text-[11px] text-slate-300 text-center leading-relaxed">{status}</p>
        <div className="grid grid-cols-2 gap-2">
          <button type="button" onClick={() => setModoVisualizacao('radar')} className={`cyber-button text-[10px] py-2 ${modoVisualizacao === 'radar' ? '!bg-cyan-400 !text-void' : ''}`}>RADAR TÁTICO</button>
          <button type="button" onClick={() => setModoVisualizacao('satelite')} className={`cyber-button text-[10px] py-2 ${modoVisualizacao === 'satelite' ? '!bg-cyan-400 !text-void' : ''}`}>SATÉLITE GOES-19 (HD)</button>
        </div>
        <div className="grid grid-cols-1 sm:grid-cols-2 gap-2 bg-black/40 p-3 rounded-xl border border-cyan-400/30">
          <div className="space-y-1">
            <label className="text-[8px] text-cyan-300 font-bold uppercase block">Alvo Principal (1):</label>
            <select value={cidadeSel1} onChange={(e) => {
              setCidadeSel1(e.target.value);
              falar(e.target.value);
            }} className="w-full bg-[#030712] text-white border border-cyan-400/40 rounded-xl p-2 text-xs font-bold cursor-pointer">
              {MUNICIPIOS_92.map((m, idx) => <option key={idx} value={m.n}>{m.n}</option>)}
            </select>
          </div>
          <div className="space-y-1">
            <label className="text-[8px] text-cyan-300 font-bold uppercase block">Alvo Secundário (2):</label>
            <select value={cidadeSel2} onChange={(e) => {
              setCidadeSel2(e.target.value);
              falar(e.target.value);
            }} className="w-full bg-[#030712] text-white border border-cyan-400/40 rounded-xl p-2 text-xs font-bold cursor-pointer">
              {MUNICIPIOS_92.map((m, idx) => <option key={idx} value={m.n}>{m.n}</option>)}
            </select>
          </div>
        </div>
        {modoVisualizacao === 'radar' && (
          <div className="relative w-full aspect-square rounded-full border-[3px] border-cyan-400/70 overflow-hidden mx-auto shadow-[inset_0_0_40px_rgba(0,255,255,0.15),0_0_30px_rgba(0,255,255,0.2)] max-w-[380px]" style={{ background: "radial-gradient(circle at 50% 50%, #0A2A4A 0%, #041830 55%, #020A1A 100%)" }}>

            <div className="absolute rounded-full border border-cyan-400/40 pointer-events-none" style={{ width: "66%", height: "66%", left: "50%", top: "50%", transform: "translate(-50%,-50%)" }} />
            <div className="absolute rounded-full border border-cyan-400/50 pointer-events-none" style={{ width: "38%", height: "38%", left: "50%", top: "50%", transform: "translate(-50%,-50%)" }} />
            <div className="absolute left-1/2 top-0 bottom-0 w-px bg-cyan-400/40 pointer-events-none" />
            <div className="absolute top-1/2 left-0 right-0 h-px bg-cyan-400/40 pointer-events-none" />
            <div className="absolute inset-0 pointer-events-none animate-radar-sweep" style={{ background: "conic-gradient(from 0deg, rgba(0,255,255,0.45) 0deg, rgba(0,255,255,0.15) 50deg, transparent 90deg)" }} />
            {PONTOS_BACIAS.map(b => {

              return (

function ModuloCidadaoSensorModule({ onGoToDashboard, showToast }) {

  const totalAluminio = aluminioKg * precoAluminio;
  const totalFerro = ferroKg * precoFerro;
  const totalPapelao = papelaoKg * precoPapelao;
  const totalVidro = vidroKg * precoVidro;
  const totalOleo = oleoL * precoOleo;

  const valorTotalReciclagem = totalPet + totalAluminio + totalFerro + totalPapelao + totalVidro + totalOleo;
  const pesoTotalKg = Number(petKg) + Number(aluminioKg) + Number(ferroKg) + Number(papelaoKg) + Number(vidroKg) + Number(oleoL);

  const aguaEconomizadaL = (petKg * 24) + (aluminioKg * 40) + (papelaoKg * 15);
  const co2EvitadoKg = (petKg * 1.5) + (aluminioKg * 9.0) + (ferroKg * 1.8) + (papelaoKg * 0.9);
  const volumeDesobstruidoM3 = (pesoTotalKg * 0.0035).toFixed(2);

  const conectarBalancaBT = async () => {
    if (!navigator.bluetooth) { showToast("Web Bluetooth não suportado."); return; }
    try {
      setBtStatus("Buscando balança...");
      const device = await navigator.bluetooth.requestDevice({
        acceptAllDevices: true,
        optionalServices: ['battery_service', '0000181d-0000-1000-8000-00805f9b34fb']
      });
      setBtConectado(true);
      setBtStatus(`Conectado: ${device.name || 'Balança BT'}`);
      showToast(`Balança pareada: ${device.name || 'OK'}`);
    } catch (e) {
      setBtConectado(false);
      setBtStatus("Desconectado");
      showToast("Conexão Bluetooth cancelada.");

    const prot = `REC-SOL-${Math.floor(Math.random() * 89999 + 10000)}`;

    if (navigator.clipboard) {
      navigator.clipboard.writeText(textoRecibo).catch(() => {});
      showToast(`Recibo ${prot} copiado.`);
    }
    window.open(`https://api.whatsapp.com/send?text=${encodeURIComponent(textoRecibo)}`, '_blank');

  return (

              <span className="text-cyberCyan">[BALANÇA]</span> CIDADÃO SENSOR - BALANÇA DIGITAL &amp; ESG
            </h2>
            <p className="text-[9px] font-mono text-cyberCyan font-bold">TECNOLOGIA SOCIAL - ECONOMIA CIRCULAR &amp; DRENAGEM</p>
          </div>
          <button type="button" onClick={onGoToDashboard} className="cyber-button text-[10px] py-2 px-4">PAINEL DE CONTROLE</button>

        <div className="bg-void/90 border border-cyberCyan/30 rounded-2xl p-3.5 flex flex-col sm:flex-row items-center justify-between gap-3 shadow-inner">
          <div className="flex items-center gap-2.5">
            <span className={`w-3 h-3 rounded-full ${btConectado ? 'bg-cyberGreen animate-ping' : 'bg-cyberRose'}`}></span>
            <div>
              <span className="text-[10px] font-black text-white block">HARDWARE DE PESAGEM BLUETOOTH</span>

          <button type="button" onClick={conectarBalancaBT} className={`cyber-button text-[9px] py-2 px-4 ${btConectado ? '!border-cyberGreen !text-cyberGreen' : ''}`}>

  const [isConnecting, setIsConnecting] = useState(false);

  const salvarEConectarIP = async () => {
    try {
      localStorage.setItem("raru_alquino_ip", hardwareIpUrl);
      setIsConnecting(true);
      setStatusHardware("CONECTANDO AO IP...");
      showToast(`Conectando ao IP: ${hardwareIpUrl}`);

      setTimeout(() => {
        const gasRand = Math.floor(Math.random() * 25 + 8);
        const hidroRand = (Math.random() * 0.4 + 0.1).toFixed(2);
        setGasLevel(`${gasRand} PPM (Normal)`);
        setHidroLevel(`${hidroRand} m (Estável)`);
        setTempHardware("26.8 C");
        setStatusHardware("SIMULAÇÃO ATIVA (IP LOCAL)");

      setIsConnecting(false);

    const cv = canvasRef.current;
    if (!cv) return;
    const ctx = cv.getContext('2d');
    const W = cv.width = 320, H = cv.height = 140;
    ctx.clearRect(0, 0, W, H);
    const max = Math.max(...valores, 1);
    const step = W / valores.length;
    valores.forEach((v, i) => {
      const h = (v / max) * (H - 30);
      const x = i * step + 4;
      const grad = ctx.createLinearGradient(0, H - h, 0, H);
      grad.addColorStop(0, cores[0]); grad.addColorStop(1, cores[1]);
      ctx.fillStyle = grad;
      ctx.fillRect(x, H - h - 15, step - 6, h);
      ctx.fillStyle = '#00F2FE'; ctx.font = 'bold 9px monospace';
      ctx.fillText(v + label, x, H - h - 18);
    });

function VistoriaRARU_NEXUS({ onBackToDashboard, showToast, vozSelecionada, perfilVozId, userName }) {
  const RASCUNHO_KEY = "raru_nexus_v11_2_scan_rascunho";

  const carregarRascunhoInicial = () => {
    try {
      const raw = localStorage.getItem(RASCUNHO_KEY);
      if (raw) {
        const d = JSON.parse(raw);
        if (d && typeof d === "object") return d;
      }
    } catch (e) {}
    return null;
  };

  const rascunhoInit = carregarRascunhoInicial();

  const [munIdx, setMunIdx] = useState(() => {
    const idx = Number(rascunhoInit?.municipioIdx);
    return (!Number.isNaN(idx) && MUNICIPIOS_92[idx]) ? idx : 0;
  });
  const mun = MUNICIPIOS_92[munIdx] || MUNICIPIOS_92[0];

  const [vozLigada, setVozLigada] = useState(true);
  const [vozAtivada, setVozAtivada] = useState(false);
  const [statusVoz, setStatusVoz] = useState(rascunhoInit ? "Rascunho automático restaurado. Toque em ATIVAR VOZ para começar" : "Toque em ATIVAR VOZ para começar");
  const [textoBalao, setTextoBalao] = useState("Oi! Eu sou a Sarah. Primeiro toque em ATIVAR VOZ.");

  const [tipoOcorrencia, setTipoOcorrencia] = useState(() => rascunhoInit?.tipoOcorrencia || "BURACOS NA VIA");
  const [categoriaOcorrencia, setCategoriaOcorrencia] = useState(() => rascunhoInit?.categoriaOcorrencia || "MANUTENÇÃO / ZELADORIA");
  const [angulo, setAngulo] = useState(() => typeof rascunhoInit?.angulo === "number" ? rascunhoInit.angulo : 0);
  const [scanAtivo, setScanAtivo] = useState(() => typeof rascunhoInit?.scanAtivo === "boolean" ? rascunhoInit.scanAtivo : true);
  const [cameraExpandida, setCameraExpandida] = useState(false);

  const [foto, setFoto] = useState("");
  const [fotoBlob, setFotoBlob] = useState(null);
  const [infoFoto, setInfoFoto] = useState("Foto leve - base64 compactado");
  const [camOn, setCamOn] = useState(false);
  const [ligandoCam, setLigandoCam] = useState(false);
  const [capturandoFoto, setCapturandoFoto] = useState(false);
  const [gerandoPdf, setGerandoPdf] = useState(false);
  const [zoomLevel, setZoomLevel] = useState(1);
  const [maxZoom, setMaxZoom] = useState(5);
  const [hasZoomSupport, setHasZoomSupport] = useState(false);

  const [nome, setNome] = useState(() => rascunhoInit?.nome || userName || "");
  const [bairro, setBairro] = useState(() => rascunhoInit?.bairro || "");
  const [rel, setRel] = useState(() => rascunhoInit?.relato || "");
  const [gps, setGps] = useState({ lat: 0, lon: 0, acc: "" });
  const [isAiAnalyzing, setIsAiAnalyzing] = useState(false);
  const [clima, setClima] = useState(null);
  const [sha256Hash, setSha256Hash] = useState("");
  const [frenteSelecionada, setFrenteSelecionada] = useState(() => rascunhoInit?.frente || FRENTES_EQUIPES_TABELA[5]);
  const [sAtiva, setSAtiva] = useState("");
  const [vento, setVento] = useState(0);

  const audioCtxRef = useRef(null);
  const oscRef = useRef(null);
  const sInterRef = useRef(null);
  const sTimerRef = useRef(null);
  const videoRef = useRef(null);
  const streamRef = useRef(null);
  const trackRef = useRef(null);

  const RISCOS_RARU = [
    "R1 - BAIXO / PREVENTIVO",
    "R2 - MODERADO / ALERTA",
    "R3 - ALTO / ENXURRADA",
    "R4 - EVACUAÇÃO PREVENTIVA",
    "RH - CONVERGÊNCIA SERRAS",
    "RE - ESTRUTURAL / TALUDE"
  ];
  const [risco, setRisco] = useState(() => {
    if (rascunhoInit?.risco && RISCOS_RARU.includes(rascunhoInit.risco)) return rascunhoInit.risco;
    return RISCOS_RARU[1];
  });
  const [protAtual, setProtAtual] = useState("");

  const vozAtiva = perfilVozId || vozSelecionada;
  const isAlerta = categoriaOcorrencia.includes("ALERTA");

  useEffect(() => {
    try {
      localStorage.setItem(RASCUNHO_KEY, JSON.stringify({
        nome,
        bairro,
        municipioIdx: munIdx,
        risco,
        relato: rel,
        frente: frenteSelecionada,
        tipoOcorrencia,
        categoriaOcorrencia,
        angulo,
        scanAtivo
      }));
    } catch (e) {}
  }, [nome, bairro, munIdx, risco, rel, frenteSelecionada, tipoOcorrencia, categoriaOcorrencia, angulo, scanAtivo]);

  useEffect(() => {
    if (!mun?.lat) return;
    fetch(`https://api.open-meteo.com/v1/forecast?latitude=${mun.lat}&longitude=${mun.lon}&current=temperature_2m,precipitation,wind_speed_10m,wind_gusts_10m&timezone=auto`)
      .then(r => r.json())
      .then(d => {
        setClima(d.current);
        setVento(d.current?.wind_gusts_10m || d.current?.wind_speed_10m || 0);
      })
      .catch(() => {});
  }, [mun]);

  useEffect(() => {
    return () => {
      pararSirenes();
      if (streamRef.current) streamRef.current.getTracks().forEach(t => t.stop());
    };
  }, []);

  const falarSarahLocal = (txt) => {
    setTextoBalao(txt);
    if (!vozLigada) {
      setStatusVoz("Voz desligada - Leia no balão");
      return;
    }
    if (!vozAtivada) {
      setStatusVoz("Toque em ATIVAR VOZ primeiro!");
      return;
    }
    if (!("speechSynthesis" in window)) {
      setStatusVoz("Seu navegador não tem voz - Leia no balão");
      return;
    }
    try {
      window.speechSynthesis.cancel();
      window.speechSynthesis.resume();
      const vozObj = escolherVozPtBr(vozAtiva);
      let grupo = "", blocos = [];
      for (const f of (txt.match(/[^.!?]+[.!?]+/g) || [txt])) {
        if ((grupo + " " + f).length > 180 && grupo) {
          blocos.push(grupo.trim());
          grupo = f;
        } else {
          grupo = (grupo ? grupo + " " : "") + f;
        }
      }
      if (grupo.trim()) blocos.push(grupo.trim());
      blocos.forEach((p, i) => {
        const m = new SpeechSynthesisUtterance(p);
        m.lang = "pt-BR";
        m.rate = 1;
        m.pitch = 1.05;
        if (vozObj) m.voice = vozObj;
        if (i === blocos.length - 1) m.onend = () => setStatusVoz("Pronta - Voz ligada");
        window.speechSynthesis.speak(m);
      });
    } catch (e) {}
  };

  const ativarVozSarah = () => {
    if (!("speechSynthesis" in window)) {
      setStatusVoz("Seu navegador não tem voz. Use o Chrome no Android.");
      return;
    }
    try {
      window.speechSynthesis.cancel();
      window.speechSynthesis.resume();
      setVozAtivada(true);
      setVozLigada(true);
      setStatusVoz("Voz ativada - Sarah está falando...");
      const msg = "Oi! Eu sou a Sarah, do RARU Nexus. Agora minha voz está ativada.";
      setTextoBalao(msg);
      const t = new SpeechSynthesisUtterance(msg);
      t.lang = "pt-BR";
      const vObj = escolherVozPtBr(vozAtiva);
      if (vObj) t.voice = vObj;
      window.speechSynthesis.speak(t);
    } catch (e) {}
  };

  const pausarFalaSarah = () => {
    if ("speechSynthesis" in window) {
      try { window.speechSynthesis.cancel(); } catch (e) {}
    }
    setStatusVoz("Fala pausada");
  };

  const alternarVozSarah = () => {
    const next = !vozLigada;
    setVozLigada(next);
    setStatusVoz(next ? "Pronta - Voz ligada" : "Voz desligada - Leia no balão");
    if (!next) pausarFalaSarah();
  };

      if (oscRef.current) oscRef.current.stop();

    } catch (e) {}
    audioCtxRef.current = null;

    showToast(`Sirene ${t === "russo" ? "Alarme Russo" : "Alerta 2"} disparada por 5 minutos.`);
    falarSarahLocal("Acionei o alerta preditivo aqui. Vamos ficar de olho.");
    try {
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      ctx.resume();
      const osc = ctx.createOscillator();
      const g = ctx.createGain();
      osc.type = t === "russo" ? "sawtooth" : "sine";
      osc.frequency.value = t === "russo" ? 450 : 600;
      g.gain.value = 0.15;
      osc.connect(g);
      g.connect(ctx.destination);
      osc.start();
      audioCtxRef.current = ctx;
      oscRef.current = osc;
      let up = true;
      sInterRef.current = setInterval(() => {
        let f = osc.frequency.value;
        if (up) {
          f += 30;
          if (f >= 950) up = false;
        } else {
          f -= 30;
          if (f <= 400) up = true;
        }
        osc.frequency.setTargetAtTime(f, ctx.currentTime, 0.1);
      }, 80);
      sTimerRef.current = setTimeout(() => {
        pararSirenes();
        showToast("Ciclo de 5 minutos da sirene encerrado.");
      }, 300000);
    } catch (e) {}
  };

          <button type="submit" className="cyber-button text-[9px] py-1 px-2.5 !min-h-[32px]">SALVAR</button>
        </form>

        <div className="px-3 pt-2 pb-1 bg-void/70 border-b border-cyberCyan/15 shrink-0">
          <SeletorVozGlobal perfilVozId={perfilVozId} setPerfilVozId={setPerfilVozId} />
        </div>

        <div className="flex-1 overflow-y-auto p-4 space-y-3 bg-void/40">
          {messages.map((m, idx) => (
            <div key={idx} className={`flex flex-col ${m.sender === 'user' ? 'items-end' : 'items-start'}`}>
              <span className="text-[8px] font-mono text-slate-400 uppercase mb-1 px-1">
                {m.sender === 'user' ? (userName || "VOCÊ") : "SARAH"}
              </span>
              <div className={`max-w-[85%] rounded-2xl px-3.5 py-2.5 text-xs font-mono leading-relaxed permitir-selecao ${
                m.sender === 'user'
                  ? 'bg-cyberCyan/20 border border-cyberCyan/50 text-white'
                  : 'bg-deepSpace/95 border border-slate-700/80 text-slate-200'
              }`}>
                {m.text}
              </div>
            </div>
          ))}
          {isThinking && (
            <div className="text-[10px] font-mono text-cyberCyan animate-pulse px-2">
              Sarah analisando o cenário...
            </div>
          )}
        </div>

        <div className="px-3 py-2 bg-deepSpace/90 border-t border-cyberCyan/20 flex gap-1.5 overflow-x-auto shrink-0">
          {["Qual o clima em Mesquita?", "Como agir na chuva forte?", "Resumo da vistoria"].map((sug, i) => (
            <button key={i} type="button" onClick={() => handleQuickSuggestion(sug)} className="raru-store-btn text-[8px] py-1 px-2.5 shrink-0">
              {sug}
            </button>
          ))}
        </div>

        <form onSubmit={handleSend} className="p-3 bg-deepSpace border-t border-cyberCyan/30 flex items-center gap-2 shrink-0">
          <input
            type="text"
            value={input}
            onChange={(e) => setInput(e.target.value)}
            placeholder={userName ? `Fale com a Sarah, ${userName}...` : "Digite seu nome ou pergunte algo à Sarah..."}
            className="flex-1 bg-void border border-cyberCyan/40 rounded-xl px-3 py-2.5 text-xs text-white font-mono permitir-selecao"
          />
          <button type="submit" disabled={isThinking} className="cyber-button-solid text-xs py-2.5 px-4 !min-h-[42px]">
            ENVIAR
          </button>
        </form>
      </div>
    </div>
  );
}

function App() {
  const [activeTab, setActiveTab] = useState('dashboard');
  const [isNightMode, setIsNightMode] = useState(() => {
    try { return localStorage.getItem('raru_day_mode') !== 'true'; } catch (e) { return true; }
  });
  const [isWallMode, setIsWallMode] = useState(false);

  const [userName, setUserName] = useState(() => {
    try { return localStorage.getItem('raru_user_name') || ''; } catch (e) { return ''; }
  });
  const [showNameModal, setShowNameModal] = useState(false);
  const [tempNameInput, setTempNameInput] = useState('');

  const [toastMsg, setToastMsg] = useState('');
  const [screenInfo, setScreenInfo] = useState({ type: 'MOBILE', width: 390, height: 844 });

  const [sarahModalOpen, setSarahModalOpen] = useState(false);
  const [whoAmIModalOpen, setWhoAmIModalOpen] = useState(false);

  const [perfilVozId, setPerfilVozId] = useState(() => {
    try { return localStorage.getItem('raru_perfil_voz') || 'sarah'; } catch (e) { return 'sarah'; }
  });

  const [messages, setMessages] = useState(() => [{
    sender: 'sarah',
    text: "Oi! Como posso te chamar e o que você precisa ver no sistema agora?"
  }]);
  const [input, setInput] = useState('');
  const [isThinking, setIsThinking] = useState(false);
  const [isSpeaking, setIsSpeaking] = useState(false);

  const showToast = (msg) => {
    setToastMsg(msg);
    setTimeout(() => { setToastMsg(''); }, 3500);
  };

  const atualizarNomeUsuario = (novoNome) => {
    const limpo = String(novoNome || '').trim();
    setUserName(limpo);
    try {
      if (limpo) localStorage.setItem('raru_user_name', limpo);
      else localStorage.removeItem('raru_user_name');
    } catch (e) {}
    if (limpo) {
      setMessages(prev => [...prev, {
        sender: 'sarah',
        text: `Beleza, ${limpo}. A partir de agora eu te chamo de ${limpo}. Como posso te ajudar?`
      }]);
      showToast(`Nome salvo: ${limpo}`);
    }
  };

  useEffect(() => {
    const handleContextMenu = (e) => {
      if (['INPUT', 'TEXTAREA', 'SELECT'].includes(e.target.tagName) || e.target.classList.contains('permitir-selecao')) return;
      e.preventDefault();
      showToast("Segurança tática RARU ativa: cópia bloqueada.");
    };
    const handleKeyDown = (e) => {
      if (e.ctrlKey && ['c', 'u', 's', 'a', 'p'].includes(e.key.toLowerCase())) {
        e.preventDefault();
        showToast("Atalho bloqueado pelo escudo RARU.");
      }
    };
    document.addEventListener('contextmenu', handleContextMenu);
    document.addEventListener('keydown', handleKeyDown);
    return () => {
      document.removeEventListener('contextmenu', handleContextMenu);
      document.removeEventListener('keydown', handleKeyDown);
    };
  }, []);

  useEffect(() => {
    const htmlEl = document.documentElement;
    if (isNightMode) {
      htmlEl.classList.remove('raru-day-mode');
      document.body.classList.remove('raru-day-mode');
    } else {
      htmlEl.classList.add('raru-day-mode');
      document.body.classList.add('raru-day-mode');
    }
    try { localStorage.setItem('raru_day_mode', String(!isNightMode)); } catch (e) {}
  }, [isNightMode]);

  const toggleWallMode = (forceValue) => {
    const nextState = typeof forceValue === 'boolean' ? forceValue : !isWallMode;
    setIsWallMode(nextState);
    if (nextState) {
      document.body.classList.add('hud-wall-mode');
      document.body.classList.add('hud-expanded-mode');
      showToast("Modo Telão / Wall Mode ATIVADO.");
    } else {
      document.body.classList.remove('hud-wall-mode');
      document.body.classList.remove('hud-expanded-mode');
      showToast("Modo Telão / Wall Mode DESATIVADO.");
    }
  };

  useEffect(() => {
    const checkViewport = () => {
      const w = window.innerWidth;
      const h = window.innerHeight;
      let t = 'MOBILE';
      if (w >= 1200) t = 'DESKTOP / TV HD';
      else if (w >= 768) t = 'TABLET';
      setScreenInfo({ type: t, width: w, height: h });
    };
    checkViewport();
    window.addEventListener('resize', checkViewport);
    return () => window.removeEventListener('resize', checkViewport);
  }, []);

  const handleSend = async (e) => {
    if (e) e.preventDefault();
    if (!input.trim() || isThinking) return;

    const userMsgText = input.trim();
    setInput('');

    let nomeAtual = userName;
    const matchNome = userMsgText.match(/(?:meu nome [ée]|me chamo|pode me chamar de|sou o|sou a)\s+([a-zà-ú]+)/i);
    if (matchNome && matchNome[1]) {
      nomeAtual = matchNome[1].charAt(0).toUpperCase() + matchNome[1].slice(1).toLowerCase();
      setUserName(nomeAtual);
      try { localStorage.setItem('raru_user_name', nomeAtual); } catch (err) {}
    }

    const updatedMsgs = [...messages, { sender: 'user', text: userMsgText }];
    setMessages(updatedMsgs);
    setIsThinking(true);

    try {
      const apiHist = updatedMsgs.map(m => ({ role: m.sender === 'user' ? 'user' : 'assistant', content: m.text }));
      const aiResponse = await chamarSarah('conversa', apiHist, 'Mesquita', 'Rocha Sobrinho', activeTab, null, nomeAtual);
      const respostaFinal = bloquearCalmaAlexander(aiResponse);

      setMessages(prev => [...prev, { sender: 'sarah', text: respostaFinal }]);
      setIsThinking(false);
      setIsSpeaking(true);
      falarImitada(respostaFinal, perfilVozId);
      setTimeout(() => setIsSpeaking(false), 4500);
    } catch (err) {
      const fallback = nomeAtual
        ? `Tô aqui contigo, ${nomeAtual}. Me fala o que você quer conferir no sistema.`
        : "Tô aqui na escuta. Qual é o seu nome e o que você precisa?";
      setMessages(prev => [...prev, { sender: 'sarah', text: fallback }]);
      setIsThinking(false);
      setIsSpeaking(true);
      falarImitada(fallback, perfilVozId);
      setTimeout(() => setIsSpeaking(false), 3000);
    }
  };

  const handleQuickSuggestion = (sugText) => {
    setInput(sugText);
    setTimeout(() => { handleSend(); }, 50);
  };

  const handleSaveNameModal = (e) => {
    e.preventDefault();
    atualizarNomeUsuario(tempNameInput);
    setShowNameModal(false);
  };

  const handleWhoAmIClick = () => {
    setWhoAmIModalOpen(true);
    const msg = userName
      ? `Eu sou o ROBOT SARAH SYSTEM RARU do RARU NEXUS V11.2 PLUS, ${userName}. Tô aqui pra somar com você no campo.`
      : "Eu sou o ROBOT SARAH SYSTEM RARU do RARU NEXUS V11.2 PLUS. Qual é o seu nome pra gente se falar certinho?";
    falarImitada(msg, perfilVozId);
  };

  const handleNavClick = (tabId) => {
    setActiveTab(tabId);
    const tabNames = {
      dashboard: 'Painel de Controle',
      radar: 'Radar Meteorológico',
      vistoria: 'Vistoria e Sirenes',
      estacao: 'Estação e Telemetria',
      alquino: 'Rede Alquino',
      balanca: 'Balança e ESG',
      videos: 'Vídeos e Tutoriais',
      admin: 'Área Restrita'
    };
    showToast(`Módulo ativo: ${tabNames[tabId] || tabId}`);
  };

  const navItems = [
    { id: 'dashboard', label: 'Painel', Icon: IconDashboard },
    { id: 'radar', label: 'Radar', Icon: IconRadar },
    { id: 'vistoria', label: 'Vistoria', Icon: IconVistoria },
    { id: 'estacao', label: 'Estação', Icon: IconEstacao },
    { id: 'alquino', label: 'Alquino', Icon: IconAlquino },
    { id: 'balanca', label: 'Balança', Icon: IconBalanca },
    { id: 'videos', label: 'Vídeos', Icon: IconVideos },
    { id: 'admin', label: 'Admin', Icon: IconAdmin },
  ];

  return (
    <div className="seu-container-raru">
      {toastMsg && (
        <div className="fixed top-16 left-1/2 -translate-x-1/2 z-[150] bg-deepSpace border border-cyberCyan text-cyberCyan font-mono text-xs font-bold px-4 py-2.5 rounded-full shadow-[0_0_25px_rgba(0,242,254,0.45)] animate-bounce">
          {toastMsg}
        </div>
      )}

      {showNameModal && (
        <div className="fixed inset-0 z-[140] flex items-center justify-center bg-void/90 backdrop-blur-xl p-4" onClick={() => setShowNameModal(false)}>
          <form onSubmit={handleSaveNameModal} className="cyber-card w-full max-w-sm rounded-2xl p-5 space-y-4 border border-cyberCyan/60 font-mono" onClick={e => e.stopPropagation()}>
            <h3 className="font-display text-sm font-black text-cyberCyan uppercase tracking-wider">IDENTIFICAÇÃO NA CONVERSA</h3>
            <p className="text-[11px] text-slate-300 leading-relaxed">
              Informe o nome que você quer que a Sarah use durante a conversa. O nome do desenvolvedor não fica fixado no sistema.
            </p>
            <input
              type="text"
              value={tempNameInput}
              onChange={(e) => setTempNameInput(e.target.value)}
              placeholder="Digite seu nome..."
              className="w-full bg-void border border-cyberCyan/40 rounded-xl p-3 text-xs text-white font-mono permitir-selecao"
            />
            <div className="flex gap-2 justify-end">
              <button type="button" onClick={() => setShowNameModal(false)} className="cyber-button text-[10px] py-2 px-3 !min-h-[36px]">CANCELAR</button>
              <button type="submit" className="cyber-button-solid text-[10px] py-2 px-4 !min-h-[36px]">SALVAR</button>
            </div>
          </form>
        </div>
      )}

      <header className="w-full bg-deepSpace/95 border border-cyberCyan/40 rounded-2xl px-4 py-3 mb-4 flex flex-wrap items-center justify-between gap-2 shadow-lg">
        <div className="flex items-center gap-2.5">
          <EscudoRaruSVG size={24} color="#00F2FE" />
          <div>
            <h1 className="font-display text-sm sm:text-base font-black text-white tracking-wider uppercase leading-none">
              RARU <span className="text-cyberCyan">NEXUS</span> V11.2 PLUS
            </h1>
            <span className="text-[9px] font-mono text-cyberGreen font-bold tracking-widest">
              MESQUITA RJ • GADE • CIDADÃO SENSOR
            </span>
          </div>
        </div>

        <div className="flex items-center gap-1.5 flex-wrap">
          <button type="button" onClick={() => setIsNightMode(n => !n)} className="raru-store-btn" title="Alternar Dia / Noite">
            <IconSunMoon size={12} color="#00F2FE" />
            <span>{isNightMode ? 'Noite' : 'Dia'}</span>
          </button>
          <button type="button" onClick={() => toggleWallMode()} className={`raru-store-btn ${isWallMode ? 'ativo' : ''}`}>
            <IconExpand size={12} color={isWallMode ? '#030712' : '#00F2FE'} />
            <span>{isWallMode ? 'Telão ON' : 'Telão'}</span>
          </button>
          <button type="button" onClick={() => compartilharEscudoComTextoUnico(showToast)} className="raru-store-btn ativo">
            <EscudoRaruSVG size={12} color="#030712" />
            <span>Compartilhar</span>
          </button>
        </div>
      </header>

      <main className="flex-1 w-full">
        {activeTab === 'dashboard' && (
          <CardIdentidadeVisualRARU
            openSarahChat={() => setSarahModalOpen(true)}
            handleWhoAmIClick={handleWhoAmIClick}
            setActiveTab={setActiveTab}
            toggleWallMode={toggleWallMode}
            isWallMode={isWallMode}
            screenInfo={screenInfo}
            userName={userName}
            onOpenNameModal={() => { setTempNameInput(userName); setShowNameModal(true); }}
          />
        )}

        {activeTab === 'radar' && (
          <RadarMeteorologicoModule perfilVozId={perfilVozId} />
        )}

        {activeTab === 'vistoria' && (
          <VistoriaRARU_NEXUS
            onBackToDashboard={() => setActiveTab('dashboard')}
            showToast={showToast}
            vozSelecionada={perfilVozId}
            perfilVozId={perfilVozId}
            userName={userName}
          />
        )}

        {activeTab === 'estacao' && (
          <EstacaoSobrevivenciaModuleV12
            showToast={showToast}
            userName={userName}
            onAtualizarNome={atualizarNomeUsuario}
            onNavegarModulo={setActiveTab}
            soundEnabled={true}
            vozSelecionada={perfilVozId}
            perfilVozId={perfilVozId}
            openSarahChat={() => setSarahModalOpen(true)}
          />
        )}

        {activeTab === 'alquino' && (
          <RedeAlquinoHardwareModule
            onGoToDashboard={() => setActiveTab('dashboard')}
            showToast={showToast}
          />
        )}

        {activeTab === 'balanca' && (
          <ModuloCidadaoSensorModule
            onGoToDashboard={() => setActiveTab('dashboard')}
            showToast={showToast}
          />
        )}

        {activeTab === 'videos' && (
          <div className="cyber-card space-y-4 font-mono max-w-4xl mx-auto">
            <div className="flex items-center justify-between border-b border-cyberCyan/30 pb-3">
              <h2 className="font-display text-sm font-black text-white uppercase tracking-wider">
                CANAL DE VÍDEOS E ORIENTAÇÃO COMUNITÁRIA
              </h2>
              <button type="button" onClick={() => setActiveTab('dashboard')} className="cyber-button text-[10px] py-1.5 px-3 !min-h-[34px]">PAINEL</button>
            </div>
            <div className="grid grid-cols-1 sm:grid-cols-2 gap-3 text-xs">
              <div className="bg-void/90 border border-cyberCyan/30 rounded-xl p-3.5 space-y-2">
                <span className="text-cyberCyan font-black block">01 • VISTORIA E REGISTRO FOTOGRÁFICO</span>
                <p className="text-slate-300 text-[11px] leading-relaxed">
                  Como registrar ocorrências com GPS, carimbo técnico, código SHA-256 e gerar relatório em PDF para o Google Drive e WhatsApp.
                </p>
                <button type="button" onClick={() => setActiveTab('vistoria')} className="cyber-button text-[10px] py-1.5 px-3 !min-h-[34px]">ABRIR VISTORIA</button>
              </div>
              <div className="bg-void/90 border border-cyberCyan/30 rounded-xl p-3.5 space-y-2">
                <span className="text-cyberGreen font-black block">02 • ECONOMIA CIRCULAR E DRENAGEM</span>
                <p className="text-slate-300 text-[11px] leading-relaxed">
                  Pesagem de resíduos recicláveis e cálculo do volume de material que deixa de obstruir bueiros e galerias em dias de chuva.
                </p>
                <button type="button" onClick={() => setActiveTab('balanca')} className="cyber-button text-[10px] py-1.5 px-3 !min-h-[34px]">ABRIR BALANÇA</button>
              </div>
            </div>
          </div>
        )}

        {activeTab === 'admin' && (
          <div className="max-w-4xl mx-auto space-y-4">
            <div className="flex justify-end">
              <button type="button" onClick={() => setActiveTab('dashboard')} className="cyber-button text-[10px] py-1.5 px-3 !min-h-[34px]">VOLTAR AO PAINEL</button>
            </div>
            <CadeAdminModule showToast={showToast} />
          </div>
        )}
      </main>

      <SarahFabButton openSarahChat={() => setSarahModalOpen(true)} isSpeaking={isSpeaking} />

      <SarahTacticalChatModal
        isOpen={sarahModalOpen}
        onClose={() => setSarahModalOpen(false)}
        messages={messages}
        input={input}
        setInput={setInput}
        handleSend={handleSend}
        isThinking={isThinking}
        isSpeaking={isSpeaking}
        handleQuickSuggestion={handleQuickSuggestion}
        userName={userName}
        onAtualizarNome={atualizarNomeUsuario}
        perfilVozId={perfilVozId}
        setPerfilVozId={setPerfilVozId}
      />

      <QuemSomosModal
        isOpen={whoAmIModalOpen}
        onClose={() => setWhoAmIModalOpen(false)}
        userName={userName}
      />

      <nav className="fixed bottom-0 left-0 right-0 z-40 bg-deepSpace/95 backdrop-blur-xl border-t border-cyberCyan/40 px-2 py-1.5">
        <div className="max-w-5xl mx-auto grid grid-cols-4 sm:grid-cols-8 gap-1">
          {navItems.map(({ id, label, Icon }) => {
            const ativo = activeTab === id;
            return (
              <button
                key={id}
                type="button"
                onClick={() => handleNavClick(id)}
                className={`flex flex-col items-center justify-center py-1.5 px-1 rounded-xl font-mono text-[9px] font-bold transition cursor-pointer ${
                  ativo
                    ? 'bg-cyberCyan/20 text-cyberCyan border border-cyberCyan/60 shadow-[0_0_12px_rgba(0,242,254,0.25)]'
                    : 'text-slate-400 hover:text-white border border-transparent'
                }`}
              >
                <Icon size={15} color={ativo ? '#00F2FE' : '#94A3B8'} />
                <span className="mt-0.5 truncate">{label}</span>
              </button>
            );
          })}
        </div>
      </nav>
    </div>
  );
}

const rootEl = document.getElementById('root');
if (rootEl) {
  ReactDOM.createRoot(rootEl).render(<App />);
}
</script>
</body>
</html>
