function RelogioTaticoAltaPrecisaoReal() {
  const [horaCompleta, setHoraCompleta] = React.useState('');
  const [dataCompleta, setDataCompleta] = React.useState('');
  
  React.useEffect(() => {
    const atualizarRelogio = () => {
      const agora = new Date();
      const h = String(agora.getHours()).padStart(2, '0');
      const m = String(agora.getMinutes()).padStart(2, '0');
      const s = String(agora.getSeconds()).padStart(2, '0');
      setHoraCompleta(`${h}:${m}:${s}`);

      const opcoes = { weekday: 'short', year: 'numeric', month: 'short', day: 'numeric' };
      setDataCompleta(agora.toLocaleDateString('pt-BR', opcoes).toUpperCase());
    };
    atualizarRelogio();
    const timer = setInterval(atualizarRelogio, 1000);
    return () => clearInterval(timer);
  }, []);

  return (
    <div className="flex items-center gap-3 bg-void/90 border border-cyan-400/50 px-4 py-2 rounded-2xl font-mono shadow-xl">
      <div className="w-2.5 h-2.5 rounded-full bg-cyan-400 animate-ping"></div>

      </div>
    </div>
  );
}

function RadarMeteorologicoModule({ showToast }) {
  const [dados, setDados] = useState({});

  const [cidadeSel1, setCidadeSel1] = useState('Mesquita');

  const [modoVisualizacao, setModoVisualizacao] = useState('radar');

  useEffect(() => {
    async function carregarDadosMeteorologicos(){
      try{
        const lats = MUNICIPIOS_92.map(c => c.lat).join(',');
        const lons = MUNICIPIOS_92.map(c => c.lon).join(',');
        const url = `https://api.open-meteo.com/v1/forecast?latitude=${lats}&longitude=${lons}&current=temperature_2m,relative_humidity_2m,wind_speed_10m&hourly=temperature_2m,precipitation_probability,wind_speed_10m&timezone=America%2FSao_Paulo&forecast_days=1`;
        const r = await fetch(url);
        const j = await r.json();
        const arr = Array.isArray(j) ? j : [j];
        const mapa = {};
        arr.forEach((item, i) => {
          const c = MUNICIPIOS_92[i];
          if(!c) return;
          const hora = new Date().getHours();
          mapa[c.n] = {
            temp: item.current?.temperature_2m || 26,
            umi: item.current?.relative_humidity_2m || 75,
            vento: item.current?.wind_speed_10m || 12,
            chuva: item.hourly?.precipitation_probability?.[hora] || 15
          };
        });
        setDados(mapa);
        setStatus('Open-Meteo conectado · 92 municípios do RJ sincronizados.');
      }catch(e){
        setStatus('Erro de conexão com a API Open-Meteo. Usando cache local.');
      }

    carregarDadosMeteorologicos();

function VistoriaRARU_NEXUS({ onBackToDashboard, showToast, userName }) {
  const [mun, setMun] = React.useState(MUNICIPIOS_92[0]);
  const [camOn, setCamOn] = React.useState(false);
  const [zoomLevel, setZoomLevel] = React.useState(1);
  const [maxZoom, setMaxZoom] = React.useState(3);
  const [hasZoomSupport, setHasZoomSupport] = React.useState(false);
  const [operadorNome] = React.useState(userName || 'Alexander da Silva Firmo');
  const [bairro, setBairro] = React.useState('Rocha Sobrinho');
  const [fotoCapturada, setFotoCapturada] = React.useState(null);
  const videoRef = React.useRef(null);
  const streamRef = React.useRef(null);
  const trackRef = React.useRef(null);

  const startCam = async () => {
    try {
      const s = await navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: "environment" } } });
      streamRef.current = s;
      const track = s.getVideoTracks()[0];
      trackRef.current = track;
      const caps = track.getCapabilities ? track.getCapabilities() : {};
      if (caps.zoom) {
        setHasZoomSupport(true);
        setMaxZoom(caps.zoom.max || 5);
        setZoomLevel(caps.zoom.min || 1);
      }
      setCamOn(true);
      setTimeout(() => {
        if(videoRef.current){
          videoRef.current.srcObject = s;
          videoRef.current.play().catch(()=>{});
        }
      }, 100);
      showToast('Câmera tática de campo ativada com sucesso.');
    } catch {
      showToast('Erro ao acessar a câmera do dispositivo.');
    }
  };

  const stopCam = () => {
    if(streamRef.current) streamRef.current.getTracks().forEach(t => t.stop());
    setCamOn(false);
  };

  const handleZoomChange = async (val) => {
    setZoomLevel(val);
    if(trackRef.current && trackRef.current.applyConstraints){
      try { await trackRef.current.applyConstraints({ advanced: [{ zoom: val }] }); } catch(e){}
    }
  };

  const tirarFotoComCarimbo = () => {
    if(!videoRef.current) return;
    const video = videoRef.current;
    const canvas = document.createElement('canvas');
    canvas.width = video.videoWidth || 1280;
    canvas.height = video.videoHeight || 720;
    const ctx = canvas.getContext('2d');
    ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

    ctx.fillStyle = 'rgba(3, 7, 18, 0.88)';
    ctx.fillRect(20, canvas.height - 140, canvas.width - 40, 120);
    ctx.strokeStyle = '#00F2FE';
    ctx.lineWidth = 3;
    ctx.strokeRect(20, canvas.height - 140, canvas.width - 40, 120);

    ctx.fillStyle = '#00F2FE';
    ctx.font = 'bold 22px "JetBrains Mono", monospace';
    ctx.fillText('PROJETO CIDADÃO SENSOR • VISTORIA TÁTICA DE CAMPO', 40, canvas.height - 100);

    ctx.fillStyle = '#ffffff';
    ctx.font = '16px "JetBrains Mono", monospace';
    const agoraStr = new Date().toLocaleString('pt-BR');
    ctx.fillText(`Data/Hora: ${agoraStr} | Operador: ${operadorNome}`, 40, canvas.height - 70);
    ctx.fillText(`Setor: ${bairro} - ${mun.n} / RJ | IP Coleta: ${mun.ip}`, 40, canvas.height - 45);

    const dataUrl = canvas.toDataURL('image/jpeg', 0.95);
    setFotoCapturada(dataUrl);
    showToast('Foto capturada com carimbo técnico embutido.');
  };

  return (
    <div className="w-full space-y-4 font-mono max-w-4xl mx-auto">
      <div className="p-5 rounded-2xl border border-cyan-400/40 space-y-4 bg-[#030712] cyber-card">
        <div className="flex justify-between items-center border-b border-cyan-500/30 pb-3">
          <h3 className="text-xs text-cyan-300 font-black uppercase tracking-widest">VISTORIA COMUNITÁRIA & REGISTRO COM CARIMBO</h3>
          <button onClick={onBackToDashboard} className="cyber-button-danger text-[10px] py-1.5 px-4">FECHAR</button>
        </div>

function falarSarahOficialExtendido(texto, perfilObj) {
  try {
    const mudo = localStorage.getItem("raru_sound_enabled");
    if (mudo === "false") return;
  } catch(e) {}

  if (!("speechSynthesis" in window)) return;
  try {
    window.speechSynthesis.cancel();
    const cleanText = String(texto)
      .replace(/[*#]/g, '')
      .replace(/cerquilha/gi, '')
      .replace(/asterisco/gi, '')
      .replace(/([\u2700-\u27BF]|[\uE000-\uF8FF]|\uD83C[\uDC00-\uDFFF]|\uD83D[\uDC00-\uDFFF]|[\u2011-\u26FF]|\uD83E[\uDD00-\uDDFF])/g, '')
      .replace(/https?:\/\/\S+/g, "")
      .trim();
    if (!cleanText) return;
    const utterance = new SpeechSynthesisUtterance(cleanText);
    utterance.lang = "pt-BR";
    utterance.pitch = perfilObj?.id === 'elza' ? 0.95 : perfilObj?.id === 'brenda' ? 1.15 : 1.05;
    utterance.rate = perfilObj?.id === 'milane' ? 1.2 : 1.12;
    const voices = window.speechSynthesis.getVoices();
    const ptVoices = voices.filter(v => v.lang.toLowerCase().includes('pt'));
    const targetVoice = ptVoices[0] || voices[0];
    if (targetVoice) utterance.voice = targetVoice;
    window.speechSynthesis.speak(utterance);
  } catch(e) {}
}

        <button onClick={() => { setAbaAtual('balanca'); setMobileMenuOpen(false); }} className={`cyber-button text-[11px] py-3 flex items-center justify-center gap-2 ${abaAtual === 'balanca' ? '!bg-cyan-400 !text-void font-black' : ''}`}>
          <IconBalanca className="w-4 h-4"/> ESG RECICLA
        </button>
        <button onClick={() => { setAbaAtual('admin'); setMobileMenuOpen(false); }} className={`cyber-button text-[11px] py-3 flex items-center justify-center gap-2 ${abaAtual === 'admin' ? '!bg-cyan-400 !text-void font-black' : ''}`}>
          <IconAdmin className="w-4 h-4"/> ADMIN
        </button>
      </nav>

      <main className="flex-1 w-full space-y-6">
        {abaAtual === 'dashboard' && (
          <div className="space-y-6">
            <div className="grid grid-cols-1 md:grid-cols-3 gap-5">
              <div className="cyber-card p-6 rounded-[24px] border border-cyan-400/40 space-y-3 shadow-xl">
                <div className="text-xs text-cyan-400 font-bold uppercase tracking-wider">STATUS OPERACIONAL</div>
                <div className="text-lg font-black text-white">ONLINE • 92 MUNICÍPIOS</div>
                <p className="text-xs text-slate-300 leading-relaxed">Rede integrada de monitoramento meteorológico, alertas preventivos e abrigos ativos na Baixada Fluminense.</p>
              </div>
              <div className="cyber-card p-6 rounded-[24px] border border-cyan-400/40 space-y-3 shadow-xl">
                <div className="text-xs text-cyan-400 font-bold uppercase tracking-wider">COORDENAÇÃO COMUNITÁRIA</div>
                <div className="text-base font-black text-white">Grupo A Chave da Esperança</div>
                <p className="text-xs text-slate-300 leading-relaxed">Coordenador: <span className="text-cyan-300 font-bold">{userName}</span> • Comunidade do Sebinho (Rocha Sobrinho, Mesquita-RJ).</p>
              </div>
              <div className="cyber-card p-6 rounded-[24px] border border-cyan-400/40 space-y-3 shadow-xl">
                <div className="text-xs text-cyan-400 font-bold uppercase tracking-wider">SISTEMA DE VOZ OFICIAL</div>
                <div className="text-base font-black text-cyan-300">{PERFIS_VOZ_OFICIAIS.find(p => p.id === vozAtual)?.nome} Ativa</div>
                <p className="text-xs text-slate-300 leading-relaxed">Seletor com 5 perfis oficiais da central de notícias, rádio comunitária e Defesa Civil.</p>
              </div>
            </div>

            <div className="cyber-card p-6 rounded-[24px] border border-cyan-400/40 space-y-4">
              <h3 className="text-xs font-black text-cyan-300 uppercase tracking-widest">FRENTES OFICIAIS DE ATUAÇÃO E PARCERIAS</h3>
              <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                {FRENTES_EQUIPES_TABELA.map((frente, idx) => (
                  <div key={idx} className="bg-black/60 border border-cyan-500/30 rounded-xl p-3.5 text-xs text-slate-200 flex items-start gap-2.5">
                    <span className="w-1.5 h-1.5 rounded-full bg-cyan-400 mt-1.5 shrink-0"></span>
                    <span>{frente}</span>
                  </div>
                ))}
              </div>
            </div>

            <PainelRotasEstacaoPublica />
          </div>
        )}

        {abaAtual === 'radar' && <RadarMeteorologicoModule showToast={showToast} />}
        {abaAtual === 'vistoria' && <VistoriaRARU_NEXUS onBackToDashboard={() => setAbaAtual('dashboard')} showToast={showToast} userName={userName} />}
        {abaAtual === 'chat' && <SarahGPTProChatModuleExtended showToast={showToast} vozAtual={vozAtual} setVozAtual={setVozAtual} chameleonActive={chameleonActive} setChameleonActive={setChameleonActive} userName={userName} />}
        {abaAtual === 'estacao' && <EstacaoGADEModule showToast={showToast} />}
        {abaAtual === 'balanca' && <ModuloCidadaoSensorModule onGoToDashboard={() => setAbaAtual('dashboard')} />}
        {abaAtual === 'admin' && <CadeAdminModule showToast={showToast} />}
      </main>

      <footer className="mt-16 text-center text-[11px] text-slate-400 font-mono border-t border-cyan-500/30 pt-6 space-y-1">
        <div>PROJETO CIDADÃOSENSOR • REDE GADE • GRUPO A CHAVE DA ESPERANÇA</div>
        <div>Mesquita, Baixada Fluminense, Rio de Janeiro, Brasil • Operando em 92 Municípios</div>
      </footer>
    </div>
  );
}

const containerRaiz = document.getElementById('root');
if (containerRaiz) {
  const raizApp = ReactDOM.createRoot(containerRaiz);
  raizApp.render(<App />);
}
</script>
</body>
</html>
