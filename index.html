        :root {

            --card: #ffffff;
            --text: #1e293b;
            --muted: #64748b;
            --chat-bg: #ffffff;
            --bubble: #f1f5f9;

            padding: 10px;
            min-height: 100vh;

            transition: background 0.3s;

            justify-content: center;
            z-index: 9999;

        .modal-title {

            font-weight: 800;
            color: var(--text);
            line-height: 1.2;
        }
        .modal-desc {
            font-size: 13px;
            line-height: 1.6;
            color: var(--muted);
        }
        .modal-input {
            width: 100%;

            border: 2px solid var(--border);
            border-radius: 14px;
            background: var(--input);
            color: var(--text);
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s;
        }
        .modal-input:focus { border-color: var(--primary); }
        .modal-btn {
            padding: 14px;
            border: none;
            border-radius: 14px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
        }
        .modal-btn.primary { background: var(--primary); color: white; }

        .modal-btn.secondary { background: var(--border); color: var(--muted); }
        .modal-btn.secondary:hover { background: #cbd5e1; }

            gap: 6px;
        }
        .top-btn {
            display: flex;
            align-items: center;
            gap: 5px;
            padding: 7px 12px;
            border-radius: 12px;
            border: none;
            font-size: 11px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
        }
        .top-btn.install {
            background: var(--safe);
            color: white;
            display: none;
        }
        .top-btn.install:hover { background: #27ae60; }
        .top-btn.share {
            background: var(--primary);
            color: white;
        }
        .top-btn.share:hover { background: #1d4ed8; }
        .top-btn.icon {
            background: none;
            color: var(--muted);
            padding: 7px;
            font-size: 16px;
        }
        .top-btn.icon:hover { background: var(--input); color: var(--primary); }

            letter-spacing: 0.5px;

        .header-main .sensor {

            flex-shrink: 0;
            transition: all 0.3s;
        }
