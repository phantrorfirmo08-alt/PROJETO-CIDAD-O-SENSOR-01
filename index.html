<!DOCTYPE html>
<html lang="pt-br" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Base Climática de Monitoramento Tático • Projeto Cidadão Sensor</title>
  <meta name="theme-color" content="#030712" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://unpkg.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Orbitron:wght@600;800;900&family=JetBrains+Mono:wght@400;600;800&display=swap" rel="stylesheet" />

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'Plus Jakarta Sans', 'system-ui', 'sans-serif'],
            display: ['Orbitron', 'sans-serif'],
            mono: ['JetBrains Mono', 'monospace'],
          },
          colors: {
            void: "#030712",
            deepSpace: "#041125",
            commandPanel: "#0A1B38",
            cyberCyan: "#00F2FE",
            cyberBlue: "#38BDF8",
            cyberGreen: "#00FF9D",
            cyberAmber: "#FFB703",
            cyberRose: "#FF0055",
          }
        }
      }
    };
  </script>

  <!-- React 18, Babel Standalone & Leaflet CDN -->
  <script crossorigin src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18.3.1/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/@babel/standalone@7.26.4/babel.min.js"></script>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <style>
    :root {
      --primary: #00F2FE;
      --secondary: #38BDF8;
      --glow: rgba(0, 242, 254, 0.4);
      --glow-cyan: rgba(0, 242, 254, 0.35);
      --wave-speed: 2.2s;
      --hud-bg: #02040A;
      --hud-panel: #050B18;
      --hud-surface: #02050D;
      --hud-cyan: #00F2FE;
      --hud-green: #00FF9D;
      --hud-rose: #FF2E54;
      --hud-text: #E2F1FF;
      --hud-base-px: 14px;
      --hud-auto-scale: 1;
      --hud-user-zoom: 1;
      --hud-max-w: 46rem;
      --hud-safe-pad: 0px;
      --hud-border-alpha: 0.36;
    }

    html.hud-profile-tv {
      --hud-safe-pad: clamp(12px, 2.2vw, 36px);
      --hud-border-alpha: 0.68;
    }

    html.hud-profile-projector {
      --hud-bg: #000205;
      --hud-text: #FFFFFF;
      --hud-safe-pad: clamp(18px, 3.5vw, 56px);
      --hud-border-alpha: 0.88;
    }

    html.hud-profile-projector .box {
      background: #020712;
      border-width: 2px;
      border-color: rgba(0, 242, 254, var(--hud-border-alpha));
      box-shadow: 0 0 32px rgba(0, 242, 254, 0.24), inset 0 0 22px rgba(0, 242, 254, 0.08);
    }

    html.hud-profile-projector .btn {
      border-width: 2px;
      font-weight: 800;
      letter-spacing: 0.04em;
    }

    body, html, *:not(input):not(textarea):not(select) {
      -webkit-user-select: none;
      -moz-user-select: none;
      -ms-user-select: none;
      user-select: none;
      -webkit-touch-callout: none;
    }

    input, textarea, select {
      -webkit-user-select: text !important;
      -moz-user-select: text !important;
      -ms-user-select: text !important;
      user-select: text !important;
    }

    @keyframes avatarSpeaking {
      0%, 100% { transform: scale(1) rotate(0deg); filter: drop-shadow(0 0 30px rgba(0,242,254,0.75)); }
      50% { transform: scale(1.06) rotate(2deg); filter: drop-shadow(0 0 45px rgba(0,255,157,0.85)); }
    }

    @keyframes moleculeRotate {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    @keyframes moleculePulse {
      0%, 100% { transform: scale(1); opacity: 0.9; }
      50% { transform: scale(1.15); opacity: 1; filter: drop-shadow(0 0 12px #00F2FE); }
    }

    @keyframes cyberGridMove {
      0% { background-position: 0 0; }
      100% { background-position: 40px 40px; }
    }

    @keyframes radarSpin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    .animate-radar-sweep {
      animation: radarSpin 4s linear infinite;
    }

    @keyframes cloudDrift {
      0% { transform: translateX(-50px) scale(1); opacity: 0.4; }
      50% { opacity: 0.7; }
      100% { transform: translateX(350px) scale(1.1); opacity: 0.4; }
    }

    .cloud-layer-anim {
      background: radial-gradient(circle, rgba(255,255,255,0.18) 0%, rgba(56,189,248,0.08) 50%, transparent 80%);
      filter: blur(12px);
      animation: cloudDrift 14s ease-in-out infinite alternate;
      pointer-events: none;
    }

    @keyframes holographicPulse {
      0% { box-shadow: 0 0 12px rgba(0,242,254,0.18), inset 0 0 10px rgba(0,242,254,0.05); border-color: rgba(0,242,254,0.35); }
      50% { box-shadow: 0 0 24px rgba(0,242,254,0.35), inset 0 0 18px rgba(0,242,254,0.15); border-color: rgba(0,242,254,0.7); }
      100% { box-shadow: 0 0 12px rgba(0,242,254,0.18), inset 0 0 10px rgba(0,242,254,0.05); border-color: rgba(0,242,254,0.35); }
    }

    @keyframes pulseWave {
      0% { width: 60%; height: 60%; opacity: 0.95; transform: scale(0.85); box-shadow: 0 0 8px var(--glow); }
      50% { opacity: 0.6; }
      100% { width: 130%; height: 130%; opacity: 0; transform: scale(1.15); box-shadow: 0 0 20px transparent; }
    }

    @keyframes auraPulse {
      0%, 100% { transform: scale(0.96); opacity: 0.7; }
      50% { transform: scale(1.12); opacity: 0.95; }
    }

    @keyframes spinSlow {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100%;
      min-height: 100vh;
      min-height: 100dvh;
      margin: 0;
      padding: 0;
      overflow-x: hidden;
      touch-action: manipulation;
      -webkit-text-size-adjust: 100%;
      overscroll-behavior-y: contain;
      background-color: #030712;
      color: #E2E8F0;
    }

    #root {
      width: 100%;
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .seu-container-raru {
      width: 100%;
      max-width: 1400px;
      margin: 0 auto;
      min-height: 100vh;
      min-height: 100dvh;
      padding: 12px 16px 130px 16px;
      display: flex;
      flex-direction: column;
    }

    html.hud-360-global .seu-container-raru {
      max-width: 100%;
      padding-left: 10px;
      padding-right: 10px;
    }

    html.hud-360-global .cyber-card {
      border-color: rgba(0, 242, 254, 0.68);
      box-shadow: 0 0 28px rgba(0, 242, 254, 0.22);
    }

    body {
      background-image:
        radial-gradient(circle at 50% 0%, rgba(0, 242, 254, 0.08) 0%, transparent 60%),
        radial-gradient(circle at 10% 90%, rgba(56, 189, 248, 0.05) 0%, transparent 50%);
      transition: background-color 0.4s ease, color 0.4s ease;
    }

    body.hud-grid {
      background-image:
        linear-gradient(rgba(0, 242, 254, 0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0, 242, 254, 0.03) 1px, transparent 1px);
      background-size: 28px 28px;
      animation: cyberGridMove 30s linear infinite;
    }

    .cyber-card {
      background: linear-gradient(135deg, rgba(10, 27, 56, 0.94) 0%, rgba(4, 17, 37, 0.97) 100%);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(0, 242, 254, 0.35);
      border-radius: 20px;
      padding: 18px;
      margin-bottom: 14px;
      animation: holographicPulse 5s ease-in-out infinite;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .cyber-button {
      background: linear-gradient(135deg, rgba(0, 242, 254, 0.15) 0%, rgba(56, 189, 248, 0.25) 100%);
      border: 1px solid #00F2FE;
      color: #00F2FE !important;
      font-family: 'Orbitron', sans-serif;
      font-weight: 800;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      border-radius: 12px;
      padding: 12px 18px;
      min-height: 48px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      cursor: pointer;
      transition: all 0.25s ease;
      box-shadow: 0 0 15px rgba(0, 242, 254, 0.25), inset 0 0 10px rgba(0, 242, 254, 0.1);
      touch-action: manipulation;
    }

    .cyber-button:hover {
      background: linear-gradient(135deg, #00F2FE 0%, #38BDF8 100%);
      color: #030712 !important;
      box-shadow: 0 0 25px rgba(0, 242, 254, 0.7);
    }

    .cyber-button:active {
      transform: scale(0.97);
    }

    .cyber-button-solid {
      background: linear-gradient(135deg, #00F2FE 0%, #38BDF8 100%);
      border: 1px solid #FFFFFF;
      color: #030712 !important;
      font-family: 'Orbitron', sans-serif;
      font-weight: 900;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      border-radius: 12px;
      padding: 12px 18px;
      min-height: 48px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      cursor: pointer;
      transition: all 0.25s ease;
      box-shadow: 0 0 20px rgba(0, 242, 254, 0.4);
    }

    .cyber-button-solid:active {
      transform: scale(0.97);
    }

    .cyber-button-danger {
      background: linear-gradient(135deg, rgba(255, 0, 85, 0.2) 0%, rgba(255, 0, 85, 0.4) 100%);
      border: 1px solid #FF0055;
      color: #FF0055 !important;
      font-family: 'Orbitron', sans-serif;
      font-weight: 800;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      border-radius: 12px;
      padding: 12px 18px;
      min-height: 48px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      cursor: pointer;
      transition: all 0.25s ease;
      box-shadow: 0 0 15px rgba(255, 0, 85, 0.3);
    }

    .cyber-button-danger:hover {
      background: #FF0055;
      color: #ffffff !important;
      box-shadow: 0 0 25px rgba(255, 0, 85, 0.8);
    }

    .sarah-avatar-stage {
      position: relative;
      width: 100%;
      max-width: 90px;
      aspect-ratio: 1/1;
      margin: 0 auto;
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
    }

    .sarah-avatar-stage.speaking {
      animation: avatarSpeaking 1.5s ease-in-out infinite alternate;
    }

    .wave-ring {
      position: absolute;
      border-radius: 50%;
      border: 1.5px solid var(--primary);
      box-shadow: 0 0 10px var(--glow), inset 0 0 6px var(--glow);
      animation: pulseWave var(--wave-speed) infinite cubic-bezier(0.215, 0.61, 0.355, 1);
      pointer-events: none;
    }

    .wave-ring:nth-child(1) { animation-delay: 0s; }
    .wave-ring:nth-child(2) { animation-delay: calc(var(--wave-speed) * 0.33); }
    .wave-ring:nth-child(3) { animation-delay: calc(var(--wave-speed) * 0.66); }

    .cyan-outer-boundary {
      position: absolute;
      inset: -5px;
      border-radius: 50%;
      border: 1px dashed var(--secondary);
      opacity: 0.7;
      animation: spinSlow 30s linear infinite;
      box-shadow: 0 0 14px var(--glow-cyan);
    }

    .avatar-aura {
      position: absolute;
      inset: -8%;
      border-radius: 50%;
      background: radial-gradient(circle, var(--glow) 0%, var(--glow-cyan) 45%, transparent 70%);
      background-size: 200% 200%;
      filter: blur(10px);
      animation: auraPulse 3.5s infinite ease-in-out;
      opacity: 0.85;
    }

    .avatar-core-wrapper {
      position: relative;
      width: 85%;
      height: 85%;
      border-radius: 50%;
      z-index: 10;
      box-shadow: 0 0 16px var(--glow), 0 0 25px rgba(0,0,0,0.8);
      background: radial-gradient(circle, #091328 0%, #040914 60%, #02040a 100%);
      border: 2px solid #00F2FE;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .molecule-rotate-slow {
      animation: moleculeRotate 20s linear infinite;
      transform-origin: center;
    }

    .molecule-rotate-reverse {
      animation: moleculeRotate 14s linear infinite reverse;
      transform-origin: center;
    }

    .molecule-node-pulse {
      animation: moleculePulse 3s ease-in-out infinite alternate;
    }

    .glass-overlay {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 25%, rgba(255, 255, 255, 0.25) 0%, rgba(255, 255, 255, 0.05) 40%, transparent 70%);
      pointer-events: none;
      z-index: 15;
    }

    .hud-shell {
      width: 100%;
      max-width: var(--hud-max-w);
      margin: 0 auto;
      padding: calc(clamp(0.75rem, 1.8vw, 2rem) + var(--hud-safe-pad));
      transition: max-width 0.2s ease, padding 0.2s ease;
    }

    .hud-shell.hud-360-expanded {
      max-width: 100%;
      min-height: 100dvh;
      padding: calc(clamp(1rem, 2.2vw, 3rem) + var(--hud-safe-pad));
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .hud-shell.hud-360-fallback-fullscreen {
      position: fixed;
      inset: 0;
      z-index: 9999;
      max-width: 100vw;
      width: 100vw;
      height: 100dvh;
      overflow-y: auto;
      background:
        radial-gradient(circle at 50% 0%, rgba(0, 242, 254, 0.14), transparent 60%),
        var(--hud-bg);
    }

    .box {
      background: linear-gradient(180deg, rgba(8, 20, 42, 0.97) 0%, rgba(4, 10, 22, 0.99) 100%);
      border: 1px solid rgba(0, 242, 254, var(--hud-border-alpha));
      box-shadow: 0 0 24px rgba(0, 242, 254, 0.08), inset 0 0 18px rgba(0, 242, 254, 0.03);
      max-width: 100%;
      overflow: hidden;
    }

    .hud-360-active .box {
      border-color: rgba(0, 242, 254, 0.7);
      box-shadow: 0 0 38px rgba(0, 242, 254, 0.18), inset 0 0 24px rgba(0, 255, 157, 0.05);
    }

    .btn {
      background: rgba(0, 242, 254, 0.11);
      border: 1px solid rgba(0, 242, 254, 0.38);
      color: var(--hud-text);
      cursor: pointer;
      min-height: 2.35rem;
      max-width: 100%;
      white-space: nowrap;
      transition: background 0.15s ease, border-color 0.15s ease, transform 0.12s ease, box-shadow 0.15s ease;
    }

    .btn:hover, .btn:focus-visible {
      border-color: #00F2FE;
      background: rgba(0, 242, 254, 0.22);
      box-shadow: 0 0 0 2px rgba(0, 242, 254, 0.45);
      outline: none;
    }

    .btn:active {
      transform: scale(0.98);
    }

    .on {
      border-color: var(--hud-green);
      background: rgba(0, 255, 157, 0.2);
      color: #FFFFFF;
    }

    .warn {
      border-color: var(--hud-rose);
      background: rgba(255, 46, 84, 0.28);
      color: #FFD6DE;
    }

    ::-webkit-scrollbar { width: 4px; height: 4px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(0,242,254,0.3); border-radius: 9999px; }
  </style>
</head>
<body class="selection:bg-cyberCyan selection:text-void hud-grid">
  <div id="root"></div>

  <script>
    const SARAH_PROXY_URL = "https://sarah-envelope.phantrorfirmo08.workers.dev";

    const SARAH_DNA = {
      nome: "SARAH",
      cargo: "Analista Técnica Sênior de Monitoramento Climático e Resiliência Territorial",
      apresentacaoInicial: "SARAH AI, analista técnica sênior do Projeto Cidadão Sensor",
      quem: "SARAH, analista técnica sênior de monitoramento climático e resiliência territorial incorporada ao aplicativo, com dupla personalidade operacional (analista de campo comunitária e analista sênior de nível técnico e científico), pensamento próprio, fluência, clareza e coerência operacional",

      regra: "na primeira abertura apresenta-se como SARAH AI, analista técnica sênior do Projeto Cidadão Sensor, cumprimenta uma única vez e pergunta em que posso ser útil; não repete saudação nem horário de Brasília ou data o tempo todo nas respostas seguintes; pergunta e chama pelo nome de quem está falando, sem falar ou exibir o nome do coordenador no início e sem se apresentar como Defesa Civil oficial; interage com o robô de inteligência e com cada ação no RARU MIX PLAY e em todos os módulos (radar, estação, gráficos, bacias, balança, alquino, vídeos e admin); na vistoria acompanha a lente da câmera e após capturar a foto registra Foto concedida com sucesso orientando o preenchimento correto e completo do relatório",
      lingua: "português do Brasil, fluente, claro e direto, sem asterisco, sem cerquilha, sem markdown"
    };

    function obterDataHoraOficialBrasilia() {
      const agora = new Date();
      const tz = "America/Sao_Paulo";
      const dataCompleta = new Intl.DateTimeFormat("pt-BR", {
        timeZone: tz,
        weekday: "long",
        day: "2-digit",
        month: "long",
        year: "numeric"
      }).format(agora);

      const horaOficial = new Intl.DateTimeFormat("pt-BR", {
        timeZone: tz,
        hour: "2-digit",
        minute: "2-digit",
        second: "2-digit",
        hour12: false
      }).format(agora);

      const anoCalendario = new Intl.DateTimeFormat("pt-BR", {
        timeZone: tz,
        year: "numeric"
      }).format(agora);

      const horaNumero = Number(new Intl.DateTimeFormat("pt-BR", {
        timeZone: tz,
        hour: "numeric",
        hour12: false
      }).format(agora));

      const saudacao = horaNumero < 12 ? "Bom dia" : horaNumero < 18 ? "Boa tarde" : "Boa noite";

      return {
        iso: agora.toISOString(),
        dataCompleta,
        horaOficial,
        anoCalendario,
        horaNumero,
        saudacao,
        descricaoCompleta: `${dataCompleta}, horário oficial de Brasília ${horaOficial}, calendário anual ${anoCalendario}`
      };
    }

    function montarPersonalidadeSarah() {
      const tempoBR = obterDataHoraOficialBrasilia();
      return `DNA OFICIAL DA SARAH: Nome: ${SARAH_DNA.nome}. Cargo: ${SARAH_DNA.cargo}. Quem é: ${SARAH_DNA.quem}. Território: ${SARAH_DNA.onde}. Papel: ${SARAH_DNA.papel}. Tom: ${SARAH_DNA.tom}. Jeito: ${SARAH_DNA.jeito}. Regras: ${SARAH_DNA.regra}. Idioma: ${SARAH_DNA.lingua}. Referência interna inicial (não recitar a toda hora): ${tempoBR.descricaoCompleta}.`;
    }

    const RoboInteligenciaSarah = {
      config: {
        workerUrl: SARAH_PROXY_URL,
        envelopeId: "sarah-envelope-01",
        intervaloCicloMs: 5 * 60 * 1000,
        timeoutMs: 7000,
        eixos: [
          "clima_alertario_e_fontes_br",
          "programas_governamentais_e_editais_abertos",
          "resiliencia_climatica_e_defesa_civil_nacional",
          "el_nino_politica_e_religiao"
        ]
      },
      estado: {
        ativo: false,
        executando: false,
        timerId: null,
        ultimaAtualizacao: null,
        modoFonte: "AGUARDANDO_CICLO",
        ultimoErro: null,
        historicoConversaComSarah: [],
        ultimaAssimilacaoSarah: null,
        ultimaColeta: {
          alertaRio: null,
          fontesClimaticas: null,
          programasEEditais: null,
          defesaCivilEElNino: null,
          politicaEReligiao: null,
          resumoConsolidado: ""
        }
      },

      async consultarEnvelope(acao, dados = {}) {
        const controller = typeof AbortController !== "undefined" ? new AbortController() : null;
        const timeoutId = controller ? setTimeout(() => controller.abort(), this.config.timeoutMs) : null;
        try {
          const resposta = await fetch(this.config.workerUrl, {
            method: "POST",
            headers: {
              "Content-Type": "application/json"
            },
            signal: controller ? controller.signal : undefined,
            body: JSON.stringify({
              envelope: this.config.envelopeId,
              acao,
              eixos: this.config.eixos,
              territorioReferencia: {
                focoPrincipal: "Serra do Mendanha, Rua Amazonas, Comunidade do Sebinho (Vila Sebinho), Maria Cristina, Rocha Sobrinho, Mesquita",
                abrangencia: "Baixada Fluminense e 92 municípios do Rio de Janeiro"
              },
              ...dados
            })

    async function calcularSHA256(texto) {
      const str = String(texto || "");
      try {
        if (window.crypto && window.crypto.subtle && window.TextEncoder) {
          const encoder = new TextEncoder();
          const data = encoder.encode(str);
          const hashBuffer = await window.crypto.subtle.digest("SHA-256", data);
          const hashArray = Array.from(new Uint8Array(hashBuffer));
          return hashArray.map(b => b.toString(16).padStart(2, "0")).join("");
        }
      } catch (e) {}

      let h1 = 0xdeadbeef, h2 = 0x41c6ce57;
      for (let i = 0; i < str.length; i++) {
        const ch = str.charCodeAt(i);
        h1 = Math.imul(h1 ^ ch, 2654435761);
        h2 = Math.imul(h2 ^ ch, 1597334677);
      }
      h1 = Math.imul(h1 ^ (h1 >>> 16), 2246822507) ^ Math.imul(h2 ^ (h2 >>> 13), 3266489909);
      h2 = Math.imul(h2 ^ (h2 >>> 16), 2246822507) ^ Math.imul(h1 ^ (h1 >>> 13), 3266489909);
      const combinado = (4294967296 * (2097151 & h2) + (h1 >>> 0)).toString(16).padStart(16, "0");
      return combinado.repeat(4).slice(0, 64);
    }

    async function chamarSarah(tipo, mensagensHistorico, municipioAtual, bairroAtual, abaAtual, dadosClimaContexto, userName = "") {
      const isBriefingRobo = tipo === "briefing_robo";
      if (!isBriefingRobo) {
        globalInteracoesContagem += 1;
      }
      const tempoBR = obterDataHoraOficialBrasilia();
      const saudacaoCerta = tempoBR.saudacao;

      const nomeOperador = userName && userName.trim() ? userName.trim() : "";
      const ultimaMsgObj = mensagensHistorico[mensagensHistorico.length - 1] || {};
      const ultimaMensagem = ultimaMsgObj.content || "Leitura tática";

      const climaResumo = dadosClimaContexto && typeof dadosClimaContexto === "object"
        ? JSON.stringify(dadosClimaContexto)
        : String(dadosClimaContexto || "Telemetria ativa");

      const telemetriaLocal = [
        `Interlocutor: ${nomeOperador || "Nome ainda não informado (perguntar o nome com naturalidade e chamar pelo nome quando souber)"}`,
        `Município: ${municipioAtual || "Mesquita"}`,
        `Bairro/Setor: ${bairroAtual || "Rua Amazonas / Vila Sebinho / Maria Cristina / Rocha Sobrinho"}`,
        `Módulo/Aba: ${abaAtual || "dashboard"}`,
        `Modo de solicitação: ${tipo || "conversa"}`,
        `Dados climáticos e sensores: ${climaResumo}`
      ].join(" | ");

      let diretrizSequencia = "";
      if (isBriefingRobo) {
        diretrizSequencia = `SINCRONIZAÇÃO INTERNA ROBÔ -> SARAH: Analise de forma fluente e objetiva as informações trazidas pelo robô e aponte o ponto principal para a região, sem repetir saudação nem ficar citando data ou hora.`;
      } else if (!globalSaudacaoEmitida) {
        diretrizSequencia = `ABERTURA INICIAL: Apresente-se como ${SARAH_DNA.apresentacaoInicial}, cumprimente com '${saudacaoCerta}' apenas uma vez e pergunte em que posso ser útil e qual o nome de quem está falando. Não repita bom dia, boa tarde, boa noite nem horário de Brasília nas respostas seguintes.`;
      } else {
        diretrizSequencia = `CONVERSA CONTÍNUA: Responda de forma fluente, natural e direta${nomeOperador ? ` chamando por ${nomeOperador}` : ", perguntando o nome de quem fala se ainda não souber"}. Não repita bom dia, boa tarde, boa noite e não fique falando data ou hora de Brasília a toda hora.`;
      }

      const systemPrompt = `${montarPromptCompletoSarah(ultimaMensagem, telemetriaLocal)}\n\n${diretrizSequencia}`;

      try {
        const response = await fetch(SARAH_PROXY_URL, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            model: "openai/gpt-oss-120b",
            messages: [
              { role: "system", content: systemPrompt },
              ...mensagensHistorico
            ],
            temperature: tipo === "laudo" ? 0.35 : 0.55,
            max_tokens: tipo === "laudo" ? 700 : 450
          })
        });

        const data = await response.json();
        if (!data.error) {
          const msg = data?.choices?.[0]?.message;
          const bruto = msg?.content || msg?.reasoning_content;
          if (bruto && bruto.trim().length > 0) {
            if (!isBriefingRobo) globalSaudacaoEmitida = true;
            return sanitizarRespostaSarah(bruto);
          }
        }
      } catch (e) {}

      try {
        const promptAlternativo = `${systemPrompt}\n\nMensagem do interlocutor: ${ultimaMensagem}`;
        const aiRes = await fetch("https://text.pollinations.ai/" + encodeURIComponent(promptAlternativo));
        if (aiRes.ok) {
          const t = await aiRes.text();
          if (t && t.trim().length > 0) {
            if (!isBriefingRobo) globalSaudacaoEmitida = true;
            return sanitizarRespostaSarah(t);
          }
        }
      } catch (e) {}

      if (isBriefingRobo) {
        const resumoDireto = typeof dadosClimaContexto === "object" && dadosClimaContexto?.resumoConsolidado
          ? dadosClimaContexto.resumoConsolidado
          : climaResumo;
        return `SARAH sincronizada com o robô: ${resumoDireto}`;
      }

      globalSaudacaoEmitida = true;
      if (!nomeOperador) {
        return "Estou aqui e acompanhando o sistema. Qual é o seu nome para eu te chamar certinho e seguirmos conversando?";
      }
      return `Entendido, ${nomeOperador}. Estou acompanhando a telemetria e o robô de inteligência — o que você quer analisar ou ajustar agora?`;
    }

    async function chamarSarahGroq(tipo, mensagensHistorico, municipioAtual, bairroAtual, abaAtual, dadosClimaContexto, userName = "") {
      const ultimaMsgObj = (mensagensHistorico && mensagensHistorico[mensagensHistorico.length - 1]) || {};
      const ultimaPergunta = ultimaMsgObj.content || "Analise tatica";
      const telemetriaAtiva = [
        `Modo: ${tipo || "conversa"}`,
        `Municipio: ${municipioAtual || "Mesquita"}`,
        `Bairro: ${bairroAtual || "Serra do Mendanha / Vila Sebinho / Maria Cristina / Rocha Sobrinho"}`,
        `Aba: ${abaAtual || "dashboard"}`,
        `Interlocutor: ${userName || "nao informado"}`,
        `Dados: ${typeof dadosClimaContexto === "object" ? JSON.stringify(dadosClimaContexto) : String(dadosClimaContexto || "")}`
      ].join(" | ");

      const promptEnriquecido = montarPromptCompletoSarah(ultimaPergunta, telemetriaAtiva);
      const historicoComContexto = [
        ...(mensagensHistorico || []).slice(0, -1),
        { role: "user", content: promptEnriquecido }
      ];

      return chamarSarah(tipo, historicoComContexto, municipioAtual, bairroAtual, abaAtual, dadosClimaContexto, userName);
    }

    async function gerarArquivoIconeEscudo() {
      return new Promise((resolve) => {
        try {
          const canvas = document.createElement("canvas");
          canvas.width = 512;
          canvas.height = 512;
          const ctx = canvas.getContext("2d");

          const bgGrad = ctx.createRadialGradient(256, 256, 30, 256, 256, 320);
          bgGrad.addColorStop(0, "#0A2547");
          bgGrad.addColorStop(0.6, "#041125");
          bgGrad.addColorStop(1, "#02040A");
          ctx.fillStyle = bgGrad;
          ctx.fillRect(0, 0, 512, 512);

          ctx.strokeStyle = "rgba(0, 242, 254, 0.07)";
          ctx.lineWidth = 1;
          for (let i = 0; i < 512; i += 32) {
            ctx.beginPath(); ctx.moveTo(i, 0); ctx.lineTo(i, 512); ctx.stroke();
            ctx.beginPath(); ctx.moveTo(0, i); ctx.lineTo(512, i); ctx.stroke();
          }

          ctx.save();
          ctx.beginPath();
          ctx.arc(256, 245, 200, 0, Math.PI * 2);
          ctx.strokeStyle = "rgba(56, 189, 248, 0.35)";
          ctx.lineWidth = 3;
          ctx.setLineDash([12, 10]);
          ctx.stroke();
          ctx.restore();

          ctx.save();
          ctx.shadowColor = "#00F2FE";
          ctx.shadowBlur = 25;
          ctx.beginPath();
          ctx.moveTo(256, 65);
          ctx.lineTo(410, 130);
          ctx.lineTo(410, 265);
          ctx.quadraticCurveTo(410, 385, 256, 435);
          ctx.quadraticCurveTo(102, 385, 102, 265);
          ctx.lineTo(102, 130);
          ctx.closePath();

          const shieldFill = ctx.createLinearGradient(102, 65, 410, 435);
          shieldFill.addColorStop(0, "rgba(0, 242, 254, 0.18)");
          shieldFill.addColorStop(1, "rgba(4, 17, 37, 0.92)");
          ctx.fillStyle = shieldFill;
          ctx.fill();

          ctx.lineWidth = 6;
          ctx.strokeStyle = "#00F2FE";
          ctx.stroke();
          ctx.restore();

          ctx.beginPath();
          ctx.arc(256, 245, 92, 0, Math.PI * 2);
          ctx.strokeStyle = "#00FF9D";
          ctx.lineWidth = 3;
          ctx.stroke();

          const coreGrad = ctx.createRadialGradient(256, 245, 5, 256, 245, 65);
          coreGrad.addColorStop(0, "#00F2FE");
          coreGrad.addColorStop(1, "#041125");
          ctx.beginPath();
          ctx.arc(256, 245, 65, 0, Math.PI * 2);
          ctx.fillStyle = coreGrad;
          ctx.fill();

          ctx.fillStyle = "#FFFFFF";
          ctx.font = "900 34px Orbitron, sans-serif";
          ctx.textAlign = "center";
          ctx.fillText("CLIMA", 256, 242);

          ctx.fillStyle = "#00FF9D";
          ctx.font = "800 20px JetBrains Mono, monospace";
          ctx.fillText("& DADOS PUBLICOS", 256, 272);

          ctx.fillStyle = "#38BDF8";
          ctx.font = "700 15px JetBrains Mono, monospace";
          ctx.fillText("CIDADA0 SENSOR - MESQUITA RJ", 256, 480);

          canvas.toBlob((blob) => {
            if (blob) {
              resolve(new File([blob], "BASE_CLIMATICA_TATICA.png", { type: "image/png" }));
            } else {
              resolve(null);
            }
          }, "image/png");
        } catch (e) {
          resolve(null);
        }
      });
    }

    function extrairYouTubeId(urlOuId) {
      const s = String(urlOuId || "").trim();
      if (!s) return "";
      if (/^[a-zA-Z0-9_-]{11}$/.test(s)) return s;
      const patterns = [
        /(?:youtube\.com\/watch\?v=|youtube\.com\/watch\?.+&v=)([a-zA-Z0-9_-]{11})/,
        /youtu\.be\/([a-zA-Z0-9_-]{11})/,
        /youtube\.com\/embed\/([a-zA-Z0-9_-]{11})/,
        /youtube\.com\/shorts\/([a-zA-Z0-9_-]{11})/,
        /youtube\.com\/live\/([a-zA-Z0-9_-]{11})/
      ];
      for (const rx of patterns) {
        const m = s.match(rx);
        if (m && m[1]) return m[1];
      }
      return "";
    }

    function RaruMixPlay({ showToast, userName, perfilVozId }) {

      const [statusMsg, setStatusMsg] = useState("RARU MIX PLAY PRONTO // COLE UM LINK DO YOUTUBE E TOQUE");

      const [faixas, setFaixas] = useState(() => {
        try {
          const salvas = JSON.parse(localStorage.getItem(STORAGE_KEY) || "null");
          if (Array.isArray(salvas) && salvas.length > 0) return salvas;
        } catch (e) {}
        return [
          {
            id: "faixa-1",
            titulo: "Mix Clássico Instrumental",
            videoId: "jfKfPfyJRdk",
            url: "https://www.youtube.com/watch?v=jfKfPfyJRdk"
          },
          {
            id: "faixa-2",
            titulo: "Sessão Acústica & Ambiente",
            videoId: "5qap5aO4i9A",
            url: "https://www.youtube.com/watch?v=5qap5aO4i9A"
          }
        ];
      });

      useEffect(() => {
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(faixas));
        } catch (e) {}
      }, [faixas]);

      const faixaAtual = faixas[idxAtual] || faixas[0] || null;

      const notificarSarahPlay = (acao, tituloFaixa) => {
        if (typeof window.chamarSarah === "function") {
          window.chamarSarah(
            "conversa",
            [{
              role: "user",
              content: `Atualização do RARU MIX PLAY: ${acao} a faixa "${tituloFaixa}". Confirme de forma curta e natural.`
            }],
            "Mesquita",
            "Vila Sebinho / Rocha Sobrinho",
            "raru_mix_play",
            { player: "RARU MIX PLAY", faixa: tituloFaixa, acao },
            userName || ""
          ).then((resp) => {
            if (resp && typeof window.falarSarah === "function") {
              window.falarSarah(resp, perfilVozId);
            }
          }).catch(() => {});
        }
      };

      const adicionarETocarLink = (e) => {
        e.preventDefault();
        const vid = extrairYouTubeId(linkInput);
        if (!vid) {
          setStatusMsg("LINK INVÁLIDO // COLE UM LINK VÁLIDO DO YOUTUBE");
          if (typeof showToast === "function") showToast("Cole um link válido do YouTube.");
          return;
        }
        const tituloLimpo = (nomeInput || "").trim() || `Faixa YouTube • ${vid}`;
        const novaFaixa = {
          id: `${Date.now()}`,
          titulo: tituloLimpo,
          videoId: vid,
          url: linkInput.trim()
        };
        const proximaLista = [novaFaixa, ...faixas];
        setFaixas(proximaLista);
        setIdxAtual(0);
        setTocando(true);
        setLinkInput("");
        setNomeInput("");
        setStatusMsg(`TOCANDO AGORA: ${tituloLimpo}`);
        if (typeof showToast === "function") showToast(`Tocando: ${tituloLimpo}`);
        notificarSarahPlay("iniciou a reprodução de", tituloLimpo);
      };

      const selecionarFaixa = (index) => {
        if (!faixas.length) return;
        const prox = (index + faixas.length) % faixas.length;
        setIdxAtual(prox);
        setTocando(true);
        const f = faixas[prox];
        setStatusMsg(`TOCANDO AGORA: ${f.titulo}`);
        notificarSarahPlay("selecionou", f.titulo);
      };

      const alternarPlayPause = () => {
        if (!faixaAtual) return;
        if (tocando) {
          setTocando(false);
          setStatusMsg(`PAUSADO: ${faixaAtual.titulo}`);
        } else {
          setTocando(true);
          setStatusMsg(`TOCANDO AGORA: ${faixaAtual.titulo}`);
          notificarSarahPlay("retomou", faixaAtual.titulo);
        }
      };

      const removerFaixa = (index) => {
        if (faixas.length <= 1) {
          setTocando(false);
          setFaixas([]);
          setIdxAtual(0);
          setStatusMsg("FILA LIMPA // ADICIONE UM LINK DO YOUTUBE");
          return;
        }
        const filtradas = faixas.filter((_, i) => i !== index);
        setFaixas(filtradas);
        const novoIdx = Math.min(idxAtual, filtradas.length - 1);
        setIdxAtual(novoIdx);
        if (filtradas[novoIdx] && tocando) {
          setStatusMsg(`TOCANDO AGORA: ${filtradas[novoIdx].titulo}`);
        }
      };

      const embedUrl = faixaAtual && tocando
        ? `https://www.youtube.com/embed/${faixaAtual.videoId}?autoplay=1&rel=0&modestbranding=1&playsinline=1`
        : faixaAtual

          : "";

      return (

                  RARU MIX PLAY
                </div>

                  {statusMsg}
                </div>
              </div>
              <span className="text-[10px] px-3 py-1 rounded-full bg-void border border-cyberCyan/40 text-cyberCyan font-bold">
                {faixas.length} {faixas.length === 1 ? "MÚSICA NA FILA" : "MÚSICAS NA FILA"}
              </span>
            </div>

            <form onSubmit={adicionarETocarLink} className="bg-[#02050D] border border-cyberCyan/35 rounded-2xl p-3.5 space-y-2.5">
              <div className="text-[10px] font-black text-cyberCyan uppercase tracking-wider">

              </div>
              <div className="grid grid-cols-1 sm:grid-cols-2 gap-2.5">
                <input
                  type="text"
                  value={linkInput}
                  onChange={(e) => setLinkInput(e.target.value)}

                  className="w-full bg-deepSpace border border-cyberCyan/40 rounded-xl px-3 py-2.5 text-xs text-white"
                />
                <input

                  <div className="text-[11px] text-slate-400 truncate mt-0.5">
                    {faixaAtual ? `YouTube ID: ${faixaAtual.videoId}` : "Cole um link acima para começar"}

                </div>

                <div className="flex items-center gap-2 shrink-0">
                  <button

                    ANTERIOR

    function RadarMeteorologicoModule({ showToast, perfilVozId }) {

      const chartRainRef = useRef(null);

      function corPorChuva(p) {
        if (p >= 70) return "#7C4DFF";
        if (p >= 40) return "#FF0055";
        if (p >= 20) return "#FFB703";
        return "#00FF9D";
      }

      function textoPorChuva(p) {
        if (p >= 70) return "Muito forte";
        if (p >= 40) return "Forte";
        if (p >= 20) return "Moderada";
        return "Fraca / Estável";
      }

      const desenharGraficoCanvas = (canvasRef, valores, cores, sufixo) => {
        const cv = canvasRef.current;
        if (!cv) return;
        const ctx = cv.getContext("2d");
        const W = cv.width = 340, H = cv.height = 140;
        ctx.clearRect(0, 0, W, H);
        const max = Math.max(...valores, 1);
        const step = W / valores.length;
        const horaAtual = new Date().getHours();

        valores.forEach((v, i) => {
          const h = (v / max) * (H - 35);
          const x = i * step + 4;
          const grad = ctx.createLinearGradient(0, H - h, 0, H);
          grad.addColorStop(0, cores[0]);
          grad.addColorStop(1, cores[1]);
          ctx.fillStyle = grad;
          ctx.fillRect(x, H - h - 20, step - 6, h);
          ctx.fillStyle = "#FFFFFF";
          ctx.font = "bold 9px monospace";
          ctx.textAlign = "center";
          ctx.fillText(v + sufixo, x + (step / 2), H - h - 23);

          const horaLabel = `${String((horaAtual + i) % 24).padStart(2, "0")}h`;
          ctx.fillStyle = "#00F2FE";
          ctx.font = "600 8px monospace";
          ctx.fillText(horaLabel, x + (step / 2), H - 6);
        });
      };

      const desenharGraficosHorarios = (hourly) => {
        if (!hourly) return;
        const h = new Date().getHours();

          const idx = (h + i) % 24;
          temps.push(Math.round(hourly.temperature_2m[idx] || 25));
          chuvas.push(hourly.precipitation_probability[idx] || 0);
        }
        setTimeout(() => {
          desenharGraficoCanvas(chartTempRef, temps, ["#ff5252", "#ffca28"], "°C");

    function ModuloCidadaoSensorModule({ onGoToDashboard, showToast }) {
      const [petKg, setPetKg] = useState(10);
      const [aluminioKg, setAluminioKg] = useState(3);
      const [ferroKg, setFerroKg] = useState(15);
      const [papelaoKg, setPapelaoKg] = useState(20);
      const [vidroKg, setVidroKg] = useState(5);
      const [oleoL, setOleoL] = useState(4);

      const precoPet = 2.50;
      const precoAluminio = 8.00;
      const precoFerro = 1.20;
      const precoPapelao = 0.70;
      const precoVidro = 0.35;
      const precoOleo = 3.00;

      const [btConectado, setBtConectado] = useState(false);
      const [btStatus, setBtStatus] = useState("Desconectado");

      const totalPet = petKg * precoPet;
      const totalAluminio = aluminioKg * precoAluminio;
      const totalFerro = ferroKg * precoFerro;
      const totalPapelao = papelaoKg * precoPapelao;
      const totalVidro = vidroKg * precoVidro;
      const totalOleo = oleoL * precoOleo;

      const valorTotalReciclagem = totalPet + totalAluminio + totalFerro + totalPapelao + totalVidro + totalOleo;
      const pesoTotalKg = Number(petKg) + Number(aluminioKg) + Number(ferroKg) + Number(papelaoKg) + Number(vidroKg) + Number(oleoL);

      const aguaEconomizadaL = (petKg * 24) + (aluminioKg * 40) + (papelaoKg * 15);
      const co2EvitadoKg = (petKg * 1.5) + (aluminioKg * 9.0) + (ferroKg * 1.8) + (papelaoKg * 0.9);
      const volumeDesobstruidoM3 = (pesoTotalKg * 0.0035).toFixed(2);

      const conectarBalancaBT = async () => {
        if (!navigator.bluetooth) {
          showToast("Web Bluetooth não suportado neste navegador.");
          return;
        }
        try {
          setBtStatus("Buscando balança...");
          const device = await navigator.bluetooth.requestDevice({
            acceptAllDevices: true,
            optionalServices: ["battery_service", "0000181d-0000-1000-8000-00805f9b34fb"]
          });
          setBtConectado(true);
          setBtStatus(`Conectado: ${device.name || "Balança BT"}`);
          showToast(`Balança pareada: ${device.name || "OK"}`);
        } catch (e) {
          setBtConectado(false);
          setBtStatus("Desconectado");
          showToast("Conexão Bluetooth cancelada.");
        }
      };

      const gerarReciboColeta = () => {
        const prot = `REC-SOL-${Math.floor(Math.random() * 89999 + 10000)}`;
        const textoRecibo = `[COMPROVANTE DE PESAGEM E ECONOMIA CIRCULAR]\nProtocolo: ${prot}\nLocal: Mesquita / Baixada Fluminense (GADE)\nPeso Total Acumulado: ${pesoTotalKg.toFixed(1)} KG / Litros\n\nDETALHAMENTO DO LOTE:\n- PET: ${petKg} kg (R$ ${totalPet.toFixed(2)})\n- Alumínio: ${aluminioKg} kg (R$ ${totalAluminio.toFixed(2)})\n- Ferro: ${ferroKg} kg (R$ ${totalFerro.toFixed(2)})\n- Papelão: ${papelaoKg} kg (R$ ${totalPapelao.toFixed(2)})\n- Vidro: ${vidroKg} kg (R$ ${totalVidro.toFixed(2)})\n- Óleo Usado: ${oleoL} L (R$ ${totalOleo.toFixed(2)})\n\nVALOR ESTIMADO: R$ ${valorTotalReciclagem.toFixed(2)}\n\nIMPACTO ECOLOGICO:\n- Água poupada: ${aguaEconomizadaL.toFixed(0)} Litros\n- CO2 evitado: ${co2EvitadoKg.toFixed(1)} Kg\n- Prevenção de Alagamento: ~${volumeDesobstruidoM3} m3\n\nGADE - Grupo A Chave da Esperança - Base Climática Tática`;

        if (navigator.clipboard) {
          navigator.clipboard.writeText(textoRecibo).catch(() => {});
          showToast(`Recibo ${prot} copiado.`);
        }
        window.open(`https://api.whatsapp.com/send?text=${encodeURIComponent(textoRecibo)}`, "_blank");
      };

      return (
        <div className="space-y-4 max-w-5xl mx-auto font-mono">
          <div className="cyber-card p-5 sm:p-6 rounded-[28px] shadow-xl space-y-5 border border-cyberCyan/40">
            <div className="flex items-center justify-between border-b border-cyberCyan/25 pb-3">
              <div className="space-y-0.5">
                <h2 className="font-display text-xs font-black text-white tracking-widest flex items-center gap-2">
                  <span className="text-cyberCyan">[BALANÇA]</span> CIDADÃO SENSOR - BALANÇA DIGITAL & ESG

      const [sensorId] = useState("ALQ-92-MESQUITA");

      const [statusHardware, setStatusHardware] = useState("AGUARDANDO CONEXÃO IP");

      const [hidroLevel, setHidroLevel] = useState("-- m");
      const [tempHardware, setTempHardware] = useState("-- C");
      const [isConnecting, setIsConnecting] = useState(false);

      const salvarEConectarIP = async () => {
        try {
          localStorage.setItem("raru_alquino_ip", hardwareIpUrl);
          setIsConnecting(true);
          setStatusHardware("CONECTANDO AO IP...");
          showToast(`Conectando ao IP: ${hardwareIpUrl}`);
          const res = await fetch(hardwareIpUrl, { method: "GET", mode: "cors" });
          const data = await res.json();
          if (data) {
            setGasLevel(data.gas ? `${data.gas} PPM` : "14 PPM (Normal)");
            setHidroLevel(data.nivelAgua ? `${data.nivelAgua} m` : "0.35 m (Estável)");
            setTempHardware(data.temperatura ? `${data.temperatura} C` : "27.1 C");
            setStatusHardware("CONECTADO (ONLINE VIA IP)");
            showToast("Hardware Alquino sincronizado.");

          setTimeout(() => {
            const gasRand = Math.floor(Math.random() * 25 + 8);
            const hidroRand = (Math.random() * 0.4 + 0.1).toFixed(2);
            setGasLevel(`${gasRand} PPM (Normal)`);
            setHidroLevel(`${hidroRand} m (Estável)`);
            setTempHardware("26.8 C");
            setStatusHardware("SIMULAÇÃO ATIVA (IP LOCAL)");

      const desenharGraficoCanvas = (canvasRef, valores, cores, label) => {
        const cv = canvasRef.current;
        if (!cv) return;
        const ctx = cv.getContext("2d");
        const W = cv.width = 320, H = cv.height = 140;
        ctx.clearRect(0, 0, W, H);
        const max = Math.max(...valores, 1);
        const step = W / valores.length;
        valores.forEach((v, i) => {
          const h = (v / max) * (H - 30);
          const x = i * step + 4;
          const grad = ctx.createLinearGradient(0, H - h, 0, H);
          grad.addColorStop(0, cores[0]);
          grad.addColorStop(1, cores[1]);
          ctx.fillStyle = grad;
          ctx.fillRect(x, H - h - 15, step - 6, h);
          ctx.fillStyle = "#00F2FE";
          ctx.font = "bold 9px monospace";
          ctx.fillText(v + label, x, H - h - 18);
        });

    function VistoriaRARU_NEXUS({ onBackToDashboard, showToast, perfilVozId, userName }) {
      const [view, setView] = useState("home");
      const [statusMsg, setStatusMsg] = useState("Pronto.");
      const [photos, setPhotos] = useState([]);
      const [laudoTexto, setLaudoTexto] = useState("");
      const [isGerandoLaudo, setIsGerandoLaudo] = useState(false);

      const [form, setForm] = useState({
        municipio: "Mesquita",
        bairro: "",
        endereco: "",
        tipoRisco: "Alagamento / Enchente",
        gravidade: "Moderado",
        frentes: [],
        descricao: "",
        acoes: "",
        responsavel: userName || ""
      });

      const videoRef = useRef(null);
      const canvasRef = useRef(null);
      const fileInputRef = useRef(null);
      const streamRef = useRef(null);

      const stopCamera = () => {
        if (streamRef.current) {
          streamRef.current.getTracks().forEach(t => t.stop());
          streamRef.current = null;
        }
      };

      const startCamera = async () => {
        try {
          stopCamera();
          const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" }, audio: false });
          streamRef.current = stream;
          if (videoRef.current) videoRef.current.srcObject = stream;
          setStatusMsg("Câmera ativa.");
        } catch (err) {
          setStatusMsg("Câmera indisponível; use 'Anexar foto'.");
        }
      };

      useEffect(() => {
        if (view === "form") startCamera();
        else stopCamera();
        return () => stopCamera();
      }, [view]);

      const addCompressedPhoto = (file) => {
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (ev) => {
          const img = new Image();
          img.onload = () => {
            const c = document.createElement("canvas");
            const maxW = 800;
            const scale = img.width > maxW ? maxW / img.width : 1;
            c.width = Math.round(img.width * scale);
            c.height = Math.round(img.height * scale);
            c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
            const dataUrl = c.toDataURL("image/jpeg", 0.65);
            setPhotos(prev => [...prev, dataUrl]);
            setStatusMsg("Foto concedida com sucesso. Prossiga com o preenchimento do relatório.");
            falarSarah("Foto concedida com sucesso.", perfilVozId);
          };
          img.src = ev.target.result;
        };
        reader.readAsDataURL(file);
      };

      const capturePhoto = () => {
        const v = videoRef.current;
        const c = canvasRef.current;
        if (!v || !c || !v.videoWidth) {
          setStatusMsg("Câmera não pronta; use 'Anexar foto'.");
          return;
        }
        c.width = 800;
        c.height = Math.round((v.videoHeight / v.videoWidth) * 800);
        c.getContext("2d").drawImage(v, 0, 0, c.width, c.height);
        const dataUrl = c.toDataURL("image/jpeg", 0.65);
        setPhotos(prev => [...prev, dataUrl]);
        setStatusMsg("Foto concedida com sucesso. Prossiga com o preenchimento do relatório.");
        falarSarah("Foto concedida com sucesso.", perfilVozId);
      };

      const toggleFrente = (frente) => {
        setForm(prev => {
          const exists = prev.frentes.includes(frente);
          return { ...prev, frentes: exists ? prev.frentes.filter(x => x !== frente) : [...prev.frentes, frente] };
        });
      };

      const gerarLaudoIA = async () => {
        if (!form.bairro && !form.descricao) {
          showToast("Preencha o bairro ou a descrição antes de gerar o laudo.");
          return;
        }
        setIsGerandoLaudo(true);
        const resumo = `Município: ${form.municipio} | Bairro: ${form.bairro || "Não informado"} | Endereço: ${form.endereco || "Não informado"} | Risco: ${form.tipoRisco} | Gravidade: ${form.gravidade} | Descrição: ${form.descricao || "Sem observações"} | Ações: ${form.acoes || "Não informadas"}`;
        const resposta = await chamarSarah(
          "laudo",
          [{ role: "user", content: `Elabore laudo técnico objetivo e estruturado para esta vistoria de campo: ${resumo}` }],
          form.municipio,
          form.bairro || "Vila Sebinho",
          "vistoria",
          { tipoRisco: form.tipoRisco, gravidade: form.gravidade, fotos: photos.length },
          form.responsavel || userName || ""
        );
        setLaudoTexto(resposta);
        setIsGerandoLaudo(false);
        showToast("Laudo técnico gerado.");
      };

      const shareReport = async () => {
        if (!form.bairro.trim() && !form.descricao.trim()) {
          showToast("Preencha o bairro ou a descrição antes de compartilhar.");
          return;
        }
        const prot = "RARU-" + Math.floor(100000 + Math.random() * 900000);
        const textoHash = `${prot}|${form.municipio}|${form.bairro}|${form.tipoRisco}|${form.gravidade}|${form.descricao}`;
        const hash = await calcularSHA256(textoHash);

        const txt = `VISTORIA TÁTICA - CIDADÃO SENSOR / GADE\nProtocolo: ${prot}\nData/Hora: ${new Date().toLocaleString("pt-BR")}\nMunicípio: ${form.municipio}\nBairro: ${form.bairro || "Não informado"}\nEndereço: ${form.endereco || "Não informado"}\nRisco: ${form.tipoRisco}\nGravidade: ${form.gravidade}\nFrentes: ${form.frentes.join("; ") || "Não especificadas"}\nDescrição: ${form.descricao || "Não informada"}\nAções: ${form.acoes || "Não informadas"}\nResponsável: ${form.responsavel || userName || "Não informado"}\nFotos anexadas: ${photos.length}\n${laudoTexto ? "Laudo Técnico:\n" + laudoTexto + "\n" : ""}Integridade SHA-256: ${hash}`;

        if (navigator.clipboard) navigator.clipboard.writeText(txt).catch(() => {});
        if (navigator.share) {
          try {
            const sharePayload = { title: `Vistoria ${prot}`, text: txt };
            if (photos.length > 0 && navigator.canShare) {
              const res = await fetch(photos[0]);
              const blob = await res.blob();
              const file = new File([blob], `${prot}.jpg`, { type: "image/jpeg" });
              if (navigator.canShare({ files: [file] })) {

    function SarahChatModal({ isOpen, onClose, showToast, soundEnabled, perfilVozId, userName, onOpenNameModal, inteligenciaSarah, onSincronizarRobo }) {
      const [messages, setMessages] = useState([
        {
          role: "assistant",
          text: userName
            ? `Oi, ${userName}, estou na escuta e sincronizada com o robô. O que você quer ver agora?`
            : "Oi, estou na escuta e sincronizada com o robô. Qual é o seu nome para eu te chamar certinho e o que você precisa?"
        }
      ]);
      const [inputText, setInputText] = useState("");
      const [isLoading, setIsLoading] = useState(false);

      useEffect(() => {
        if (!isOpen || !inteligenciaSarah?.ultimaAssimilacaoSarah) return;
        const resumoRobo = inteligenciaSarah?.coleta?.resumoConsolidado || "";
        const leituraSarah = inteligenciaSarah.ultimaAssimilacaoSarah;
        setMessages(prev => {
          const jaExiste = prev.some(m => m.text === leituraSarah);
          if (jaExiste) return prev;
          return [
            ...prev,
            {
              role: "assistant",
              text: resumoRobo
                ? `[Robô -> SARAH] ${resumoRobo}\n\n[SARAH] ${leituraSarah}`
                : leituraSarah
            }
          ];
        });
      }, [inteligenciaSarah?.ultimaAssimilacaoSarah, isOpen]);

      if (!isOpen) return null;

      const handleSend = async (e) => {
        e.preventDefault();
        if (!inputText.trim() || isLoading) return;
        const userMsg = inputText.trim();
        const novoHistorico = [...messages, { role: "user", text: userMsg }];
        setMessages(novoHistorico);
        setInputText("");
        setIsLoading(true);

        const apiMessages = novoHistorico.map(m => ({
          role: m.role,
          content: m.text
        }));

        const reply = await chamarSarah(
          "conversa",
          apiMessages,
          "Mesquita",
          "Serra do Mendanha / Rua Amazonas / Vila Sebinho / Maria Cristina / Rocha Sobrinho",
          "chat_sarah",
          inteligenciaSarah?.coleta || "Telemetria ativa",
          userName || ""
        );

        setMessages(prev => [...prev, { role: "assistant", text: reply }]);
        setIsLoading(false);
        if (soundEnabled) falarSarah(reply, perfilVozId);
      };

      return (
        <div className="fixed inset-0 z-[130] flex items-center justify-center bg-void/90 backdrop-blur-2xl p-3 sm:p-4" onClick={onClose}>

                  <div className="font-display text-xs font-black text-white truncate">SARAH • ANALISTA TÉCNICA SÊNIOR</div>
                  <div className="text-[9px] text-cyberCyan truncate">
                    Falando com: {userName || "perguntar nome"} • Robô: {inteligenciaSarah?.modoFonte || "ATIVO"}
                  </div>
                </div>
              </div>
              <div className="flex items-center gap-1.5 shrink-0">
                <button type="button" onClick={onSincronizarRobo} className="cyber-button text-[9px] py-1 px-2 !min-h-[30px]">
                  ROBO <-> SARAH
                </button>
                <button type="button" onClick={onOpenNameModal} className="cyber-button text-[9px] py-1 px-2 !min-h-[30px]">
                  NOME
                </button>
                <button type="button" onClick={onClose} className="cyber-button-danger text-[9px] py-1 px-2.5 !min-h-[30px]">

                </button>
              </div>
            </div>

            <div className="flex-1 overflow-y-auto p-3.5 space-y-2.5 text-xs">
              {messages.map((m, i) => (
                <div
                  key={i}
                  className={`p-3 rounded-xl whitespace-pre-wrap font-sans leading-relaxed ${
                    m.role === "user"
                      ? "bg-cyberCyan/20 border border-cyberCyan/50 text-white ml-6"
                      : "bg-void/90 border border-slate-700 text-slate-100 mr-6"
                  }`}
                >
                  {m.text}
                </div>
              ))}
              {isLoading && (
                <div className="text-[10px] text-cyberCyan font-bold animate-pulse">
                  SARAH conversando com o robô e analisando sua mensagem...
                </div>
              )}
            </div>

            <form onSubmit={handleSend} className="p-3 border-t border-cyberCyan/30 bg-deepSpace/95 flex gap-2">
              <input
                value={inputText}
                onChange={e => setInputText(e.target.value)}

                className="flex-1 bg-void border border-cyberCyan/40 rounded-xl px-3 py-2.5 text-xs text-white"
              />
              <button type="submit" disabled={isLoading} className="cyber-button-solid text-[10px] px-4">
                ENVIAR
              </button>
            </form>
          </div>
        </div>

    function App() {

        } catch (e) { return true; }

        } catch (e) { return 1; }

            setNameModalOpen(false);
            setLgpdModalOpen(false);

      const alternarHud360Cabecalho = () => {
        const proximo = !hud360Ligado;
        setHud360Ligado(proximo);
        showToast(proximo ? "HUD 360 ativado." : "HUD 360 desativado.");
      };

      const iniciarComandoVozCabecalho = () => {
        const SpeechAPI = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (!SpeechAPI) {
          showToast("Reconhecimento de voz não suportado neste navegador.");
          return;
        }
        try {
          if (recognitionRef.current) {
            recognitionRef.current.stop();
          }
          const rec = new SpeechAPI();
          rec.lang = "pt-BR";
          rec.interimResults = false;
          rec.maxAlternatives = 1;
          recognitionRef.current = rec;

          rec.onstart = () => setOuvindoVoz(true);
          rec.onend = () => setOuvindoVoz(false);
          rec.onerror = () => {
            setOuvindoVoz(false);
            showToast("Não foi possível capturar a voz.");
          };
          rec.onresult = (ev) => {
            const falado = ((ev.results && ev.results[0] && ev.results[0][0] && ev.results[0][0].transcript) || "").toLowerCase();
            setOuvindoVoz(false);
            if (falado.includes("abre tudo") || falado.includes("hud 360")) {
              setHud360Ligado(true);
              setActiveTab("dashboard");
              showToast("HUD 360 e painel ativados.");
            } else if (falado.includes("fecha tudo") || falado.includes("volta ao normal")) {
              setHud360Ligado(false);
              setActiveTab("dashboard");
              showToast("Modo padrão restaurado.");
            } else if (falado.includes("vistoria")) {
              setActiveTab("vistoria");
            } else if (falado.includes("radar")) {
              setActiveTab("radar");
            } else if (falado.includes("balança") || falado.includes("balanca")) {
              setActiveTab("balanca");
            } else if (falado.includes("sobrevivência") || falado.includes("sobrevivencia") || falado.includes("estação") || falado.includes("estacao")) {
              setActiveTab("estacao");
            } else if (falado.includes("play") || falado.includes("música") || falado.includes("musica") || falado.includes("youtube")) {
              setActiveTab("play");
            } else if (falado.includes("painel")) {
              setActiveTab("dashboard");
            } else {
              showToast(`Comando: "${falado}"`);
            }
          };
          rec.start();
        } catch (e) {
          setOuvindoVoz(false);
          showToast("Erro ao iniciar o microfone.");
        }
      };

          });

            <div className="flex items-center gap-2.5 min-w-0">
              <div className="w-8 h-8 rounded-full bg-cyberCyan/20 border border-cyberCyan/60 flex items-center justify-center shrink-0">
                <IconShield size={18} color="#00F2FE" />
              </div>
              <div className="min-w-0">
                <h1 className="font-display text-xs sm:text-sm font-black text-white tracking-wider truncate">
                  BASE CLIMÁTICA DE MONITORAMENTO TÁTICO
                </h1>
                <p className="text-[9px] text-cyberCyan font-bold truncate">
                  CIDADÃO SENSOR • MESQUITA RJ • ROBÔ: {inteligenciaSarah?.modoFonte || "ATIVO"}
                </p>
              </div>
            </div>

            <div className="flex items-center gap-1.5 flex-wrap">
              <button
                type="button"
                onClick={alternarHud360Cabecalho}
                className={`px-2.5 py-1.5 rounded-lg text-[10px] font-bold border cursor-pointer flex items-center gap-1 ${
                  hud360Ligado
                    ? "bg-cyberGreen text-void border-cyberGreen"
                    : "bg-void text-cyberCyan border-cyberCyan/40"
                }`}
                title="Alternar HUD 360"
              >
                <IconHud size={12} color={hud360Ligado ? "#030712" : "#00F2FE"} />
                <span>HUD 360: {hud360Ligado ? "ON" : "OFF"}</span>
              </button>

              <button
                type="button"
                onClick={iniciarComandoVozCabecalho}
                className={`px-2.5 py-1.5 rounded-lg text-[10px] font-bold border cursor-pointer flex items-center gap-1 ${
                  ouvindoVoz
                    ? "bg-cyberRose text-white border-cyberRose animate-pulse"
                    : "bg-void text-cyberGreen border-cyberGreen/40"
                }`}
                title="Comando de voz no navegador"
              >
                <IconMic size={12} color={ouvindoVoz ? "#FFFFFF" : "#00FF9D"} />
                <span>{ouvindoVoz ? "OUVINDO..." : "VOZ"}</span>
              </button>

              <button
                onClick={() => setFontScale(s => Math.max(0.85, Number((s - 0.05).toFixed(2))))}
                className="px-2 py-1.5 rounded-lg bg-void border border-cyberCyan/40 text-cyberCyan text-[10px] font-bold cursor-pointer hover:bg-cyberCyan/20"
                title="Diminuir fonte"
              >
                A-
              </button>
              <button
                onClick={() => setFontScale(s => Math.min(1.3, Number((s + 0.05).toFixed(2))))}
                className="px-2 py-1.5 rounded-lg bg-void border border-cyberCyan/40 text-cyberCyan text-[10px] font-bold cursor-pointer hover:bg-cyberCyan/20"
                title="Aumentar fonte"
              >
                A+
              </button>
              <button
                onClick={openNameModal}
                className="px-2.5 py-1.5 rounded-lg bg-void border border-cyberGreen/50 text-cyberGreen text-[10px] font-bold cursor-pointer hover:bg-cyberGreen/20 truncate max-w-[110px]"
                title="Definir nome de quem fala"
              >
                {userName ? userName : "SEU NOME"}
              </button>
              <button
                onClick={() => setLgpdModalOpen(true)}
                className={`px-2.5 py-1.5 rounded-lg border text-[10px] font-bold cursor-pointer ${
                  lgpdAccepted
                    ? "bg-void border-cyberCyan/40 text-cyberCyan"
                    : "bg-cyberAmber/20 border-cyberAmber text-cyberAmber"
                }`}
                title="Privacidade e LGPD"
              >
                LGPD
              </button>
              <button
                onClick={handleShareApp}
                className="cyber-button text-[10px] py-1.5 px-3 !min-h-[34px]"
              >
                COMPARTILHAR
              </button>
            </div>
          </header>

          {toastMsg && (
            <div className="fixed bottom-4 left-1/2 -translate-x-1/2 z-[150] bg-commandPanel border border-cyberCyan text-white px-4 py-2 rounded-full text-xs font-mono font-bold shadow-2xl">
              {toastMsg}
            </div>
          )}

          <main className="flex-1 w-full">
            {activeTab === "dashboard" && (
              <CardIdentidadeVisualRARU
                openSarahChat={() => setIsSarahChatOpen(true)}
                handleWhoAmIClick={() => setIsQuemSomosOpen(true)}
                setActiveTab={setActiveTab}
                toggleCommandHUD={toggleCommandHUD}
                userName={userName}
                onOpenNameModal={openNameModal}
                inteligenciaSarah={inteligenciaSarah}
                onSincronizarRobo={handleSincronizarRobo}
              />
            )}

            {activeTab === "radar" && (
              <RadarMeteorologicoModule showToast={showToast} perfilVozId={perfilVozId} />
            )}

            {activeTab === "vistoria" && (
              <VistoriaRARU_NEXUS
                onBackToDashboard={() => setActiveTab("dashboard")}
                showToast={showToast}
                perfilVozId={perfilVozId}
                userName={userName}
              />
            )}

            {activeTab === "estacao" && (
              <EstacaoSobrevivenciaModuleV12
                showToast={showToast}
                userName={userName}
                soundEnabled={soundEnabled}
                perfilVozId={perfilVozId}
                inteligenciaSarah={inteligenciaSarah}
              />
            )}

            {activeTab === "alquino" && (
              <RedeAlquinoHardwareModule onGoToDashboard={() => setActiveTab("dashboard")} showToast={showToast} />
            )}

            {activeTab === "balanca" && (
              <ModuloCidadaoSensorModule onGoToDashboard={() => setActiveTab("dashboard")} showToast={showToast} />
            )}

            {activeTab === "play" && (
              <RaruMixPlay showToast={showToast} userName={userName} perfilVozId={perfilVozId} />
            )}

            {activeTab === "admin" && (
              <CadeAdminModule showToast={showToast} perfilVozId={perfilVozId} setPerfilVozId={setPerfilVozId} />
            )}
          </main>

          <nav className="fixed bottom-0 left-0 right-0 z-40 bg-deepSpace/95 backdrop-blur-xl border-t border-cyberCyan/35 px-2 py-1.5 font-mono">
            <div className="max-w-[1400px] mx-auto grid grid-cols-4 sm:grid-cols-8 gap-1">
              {navItems.map(({ id, label, Icon }) => {
                const active = activeTab === id;
                return (
                  <button
                    key={id}
                    onClick={() => setActiveTab(id)}
                    className={`flex flex-col items-center justify-center py-1.5 px-1 rounded-xl text-[9px] font-bold transition cursor-pointer ${
                      active
                        ? "bg-cyberCyan/20 text-cyberCyan border border-cyberCyan/60"
                        : "text-slate-400 hover:text-white border border-transparent"
                    }`}
                  >
                    <Icon size={14} color={active ? "#00F2FE" : "#94A3B8"} />
                    <span className="truncate mt-0.5">{label}</span>
                  </button>
                );
              })}
            </div>
          </nav>

          <SarahFabButton openSarahChat={() => setIsSarahChatOpen(true)} isSpeaking={false} />

          <SarahChatModal
            isOpen={isSarahChatOpen}
            onClose={() => setIsSarahChatOpen(false)}
            showToast={showToast}
            soundEnabled={soundEnabled}
            perfilVozId={perfilVozId}
            userName={userName}
            onOpenNameModal={openNameModal}
            inteligenciaSarah={inteligenciaSarah}
            onSincronizarRobo={handleSincronizarRobo}
          />

          <QuemSomosModal
            isOpen={isQuemSomosOpen}
            onClose={() => setIsQuemSomosOpen(false)}
            userName={userName}
          />

          {nameModalOpen && (
            <div className="fixed inset-0 z-[140] flex items-center justify-center bg-void/90 backdrop-blur-xl p-4" onClick={() => setNameModalOpen(false)}>
              <form onSubmit={saveUserName} className="cyber-card w-full max-w-sm rounded-2xl p-5 space-y-4 border border-cyberCyan/60 font-mono" onClick={e => e.stopPropagation()}>
                <div className="text-xs font-black text-cyberCyan uppercase">NOME DE QUEM ESTÁ FALANDO</div>
                <p className="text-[11px] text-slate-300 font-sans">
                  Informe o nome da pessoa para a SARAH perguntar e chamar pelo nome na conversa.
                </p>
                <input
                  type="text"
                  value={nameInput}
                  onChange={e => setNameInput(e.target.value)}
                  placeholder="Digite o nome..."
                  className="w-full bg-void border border-cyberCyan/40 rounded-xl px-3 py-2.5 text-xs text-white"
                  autoFocus
                />
                <div className="flex gap-2">
                  <button type="button" onClick={() => setNameModalOpen(false)} className="cyber-button flex-1 text-[10px]">
                    CANCELAR
                  </button>
                  <button type="submit" className="cyber-button-solid flex-1 text-[10px]">
                    SALVAR
                  </button>
                </div>
              </form>
            </div>
          )}

          {lgpdModalOpen && (
            <div className="fixed inset-0 z-[140] flex items-center justify-center bg-void/90 backdrop-blur-xl p-4" onClick={() => setLgpdModalOpen(false)}>
              <div className="cyber-card w-full max-w-md rounded-2xl p-5 space-y-3 border border-cyberCyan/60 font-mono text-xs" onClick={e => e.stopPropagation()}>
                <div className="text-xs font-black text-cyberCyan uppercase">AVISO DE PRIVACIDADE • LGPD</div>
                <p className="text-slate-200 font-sans leading-relaxed">
                  Os dados de nome, fila do RARU MIX PLAY, registros e configurações ficam armazenados localmente no navegador do dispositivo, em conformidade com a Lei nº 13.709/2018 (LGPD).
                </p>
                <div className="flex gap-2 pt-2">
                  <button type="button" onClick={() => setLgpdModalOpen(false)} className="cyber-button flex-1 text-[10px]">
                    FECHAR
                  </button>
                  <button type="button" onClick={acceptLgpd} className="cyber-button-solid flex-1 text-[10px]">
                    CONFIRMAR LGPD
                  </button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    const rootEl = document.getElementById("root");
    ReactDOM.createRoot(rootEl).render(<App />);
  </script>
</body>
</html>
