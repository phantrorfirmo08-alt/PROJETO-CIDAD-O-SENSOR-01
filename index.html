                    hour: "numeric",
                    hour12: false
                }).format(new Date()),
                10
            );
            if (hour >= 0 && hour < 5) return "Boa madrugada";
            if (hour >= 5 && hour < 12) return "Bom dia";
            if (hour >= 12 && hour < 18) return "Boa tarde";
            return "Boa noite";

        function FieldReportModule({ onBackToChat, showToast }) {

                            setGaleriaMidia(prev => [...prev, {
                                name: file.name,
                                url: uploadEvt.target.result,
                                type: file.type
                            }]);
                            showToast(`📁 "${file.name}" carregado com maestria!`);
                        };
                        reader.readAsDataURL(file);
                    });

                    setAnexosNome("Nenhum anexo adicionado.");

        function VideoVaultModule({ showToast }) {

            const [videoSubTab, setVideoSubTab] = React.useState("livre"); // "livre" ou "admin"
            const [localVideos, setLocalVideos] = React.useState([
                { id: 1, title: "Monitoramento de Enchente - Rio Sarapuí", source: "Aparelho (Restrito)", url: "https://www.w3schools.com/html/mov_bbb.mp4", restricted: true },
                { id: 2, title: "Ação Comunitária - Chave da Esperança", source: "Acesso Livre", url: "https://www.w3schools.com/html/movie.mp4", restricted: false }
            ]);

            const handleUnlock = (e) => {
                e.preventDefault();
                if (pinInput === "303500") {
                    setIsUnlocked(true);
                    setVideoSubTab("admin");
                    showToast("🔓 Acesso administrativo liberado!");
                } else {
                    showToast("❌ PIN incorreto.");
                }
            };

            const handleUploadVideo = (e) => {
                const files = Array.from(e.target.files);
                files.forEach(file => {
                    const videoURL = URL.createObjectURL(file);
                    const newVid = {
                        id: Date.now(),
                        title: file.name,
                        source: "Aparelho (Administrativo)",
                        url: videoURL,
                        restricted: true
                    };
                    setLocalVideos(prev => [newVid, ...prev]);
                    showToast(`📹 Vídeo "${file.name}" carregado com sucesso!`);
                });
            };

                if (confirm(`Deseja excluir permanentemente o vídeo "${title}"?`)) {

            const [isLoadingSplash, setIsLoadingSplash] = React.useState(true);
            const [activeTab, setActiveTab] = React.useState("chat"); 
            
            const [shareModalOpen, setShareModalOpen] = React.useState(false);
            const [installModalOpen, setInstallModalOpen] = React.useState(false);
            
            const [toastMessage, setToastMessage] = React.useState(null);
            const [deferredPrompt, setDeferredPrompt] = React.useState(null);
            
            const [termsAccepted, setTermsAccepted] = React.useState(
                () => localStorage.getItem("sarah_terms_accepted_v52") === "1"
            );
            const [check1, setCheck1] = React.useState(false);
            const [check2, setCheck2] = React.useState(false);

            const [messages, setMessages] = React.useState([]);
            const [input, setInput] = React.useState("");
            const [isLoadingChat, setIsLoadingChat] = React.useState(false);
            const [hasIntroduced, setHasIntroduced] = React.useState(
                () => localStorage.getItem("sarah_introduced_v52") === "1"
            );

            const speechIdRef = React.useRef(0);
            const voiceTimerRef = React.useRef(null);
            const voicesRef = React.useRef([]);

            const showToast = (msg) => {
                setToastMessage(msg);
                setTimeout(() => setToastMessage(null), 3500);
            };

            React.useEffect(() => {
                const splashTimer = setTimeout(() => setIsLoadingSplash(false), 2400);
                return () => clearTimeout(splashTimer);
            }, []);

            React.useEffect(() => {
                const handleOnline = () => { setIsOnline(true); showToast("🌐 Rede reconectada!"); };
                const handleOffline = () => { setIsOnline(false); showToast("⚠️ Conexão perdida. Modo offline."); };
                window.addEventListener('online', handleOnline);
                window.addEventListener('offline', handleOffline);
                return () => {
                    window.removeEventListener('online', handleOnline);
                    window.removeEventListener('offline', handleOffline);
                };
            }, []);

            React.useEffect(() => {
                window.addEventListener('beforeinstallprompt', (e) => {
                    e.preventDefault();
                    setDeferredPrompt(e);
                });
            }, []);

            const handleInstallApp = async () => {
                if (deferredPrompt) {
                    deferredPrompt.prompt();
                    const { outcome } = await deferredPrompt.userChoice;
                    if (outcome === 'accepted') {
                        setDeferredPrompt(null);
                        showToast("🎉 Aplicativo instalado!");
                    }
                } else {
                    setInstallModalOpen(true);
                }
            };

            const carregarVozes = () => {
                if ("speechSynthesis" in window) {
                    voicesRef.current = window.speechSynthesis.getVoices();
                }
            };

            React.useEffect(() => {
                if (!("speechSynthesis" in window)) return;
                carregarVozes();
                window.speechSynthesis.onvoiceschanged = carregarVozes;
                return () => {
                    window.speechSynthesis.cancel();
                    window.speechSynthesis.onvoiceschanged = null;
                };
            }, []);

            const limparTextoParaFala = (text) => {
                return String(text)
                    .replace(/([\u2700-\u27BF]|[\uE000-\uF8FF]|\uD83C[\uDC00-\uDFFF]|\uD83D[\uDC00-\uDFFF]|[\u2011-\u26FF]|\uD83E[\uDD00-\uDDFF])/g, '')
                    .replace(/[#*_`~]/g, "")
                    .replace(/\[(.*?)\]\(.*?\)/g, "$1")
                    .replace(/https?:\/\/\S+/g, "")
                    .replace(/\s+/g, " ")
                    .trim();
            };

            const escolherMelhorVoz = () => {
                const voices = voicesRef.current.length ? voicesRef.current : window.speechSynthesis.getVoices();
                return voices.find((voice) => voice.lang.toLowerCase().includes("pt")) || voices[0];
            };

            const stopSpeaking = () => {
                speechIdRef.current += 1;
                if (voiceTimerRef.current) {
                    clearTimeout(voiceTimerRef.current);
                    voiceTimerRef.current = null;
                }
                if ("speechSynthesis" in window) window.speechSynthesis.cancel();
                setIsSpeaking(false);
            };

            const speakText = (text) => {
                if (!soundEnabled || !("speechSynthesis" in window)) return;
                const cleanText = limparTextoParaFala(text);
                if (!cleanText) return;
                stopSpeaking();
                const currentId = speechIdRef.current;
                voiceTimerRef.current = setTimeout(() => {
                    if (currentId !== speechIdRef.current) return;
                    const utterance = new SpeechSynthesisUtterance(cleanText);
                    utterance.lang = "pt-BR";
                    utterance.voice = escolherMelhorVoz();
                    utterance.rate = 0.98;
                    utterance.onstart = () => { if (currentId === speechIdRef.current) setIsSpeaking(true); };
                    utterance.onend = () => { if (currentId === speechIdRef.current) setIsSpeaking(false); };
                    utterance.onerror = () => setIsSpeaking(false);
                    window.speechSynthesis.speak(utterance);
                }, 200);
            };

            React.useEffect(() => {
                if (!termsAccepted || hasIntroduced || isLoadingSplash) return;
                const greeting = getBrasiliaGreeting();
                const presentation = `${greeting}, sou a SARAH IA NEXUS v5.2 PRO, seu núcleo inteligente de prevenção. Prevenção não é mídia: é gente atenta. Sistemas ativados.`;
                const timer = setTimeout(() => {
                    if (!soundEnabled) return;
                    setHasIntroduced(true);
                    localStorage.setItem("sarah_introduced_v52", "1");
                    speakText(presentation);
                }, 700);
                return () => clearTimeout(timer);
            }, [termsAccepted, hasIntroduced, soundEnabled, isLoadingSplash]);

            const shareMessageText = "App//Monitoramento comunitário 🛰️ SARAH IA NEXUS v5.2 PRO ©Projeto Cidadão Sensor 🛡️👥 https://phantrorfirmo08-alt.github.io/PROJETO-CIDAD-O-SENSOR-01/";

            const handleShareLink = async () => {
                if (navigator.share) {
                    try {
                        await navigator.share({
                            title: 'SARAH IA NEXUS v5.2 PRO • Defesa Civil Comunitária',
                            text: shareMessageText,
                            url: 'https://phantrorfirmo08-alt.github.io/PROJETO-CIDAD-O-SENSOR-01/',
                        });
                        return;
                    } catch (err) {
                        console.log("Partilha cancelada");
                    }
                }
                setShareModalOpen(true);
            };

            React.useEffect(() => {
                fetch(
                    `https://api.open-meteo.com/v1/forecast?latitude=${userCoords.lat}&longitude=${userCoords.lng}&current=temperature_2m,relative_humidity_2m,precipitation,weather_code,wind_speed_10m`
                )
                    .then((res) => res.json())
                    .then((data) => {
                        if (data && data.current) setLiveWeather(data.current);
                    })
                    .catch((err) => console.warn("Clima indisponível:", err));
            }, [userCoords]);

            React.useEffect(() => {
                document.documentElement.classList.toggle("dark", darkMode);
            }, [darkMode]);

            const toggleListening = () => {

                if (!SpeechRec) {

                    setIsListening(false);
                    handleSendMessage(event.results[0][0].transcript);

                rec.onerror = () => setIsListening(false);
                rec.onend = () => setIsListening(false);
                rec.start();

                    sender: "user",
                    text: textToSend.trim(),
                    timestamp: new Date().toLocaleTimeString("pt-BR", { hour: "2-digit", minute: "2-digit" })
                };

                    role: message.sender === "user" ? "user" : "assistant",

                }));

                setMessages((previous) => [...previous, userMsg]);

${weatherContext}
Lema fundamental: "Prevenção não é mídia: é gente atenta."`

        }

        const root = ReactDOM.createRoot(document.getElementById("root"));
        root.render(<App />);

        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js').catch(() => {}));
        }
    </script>
</body>
</html>
