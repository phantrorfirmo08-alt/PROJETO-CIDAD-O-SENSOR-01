function App() {

    const [municipioSelecionado, setMunicipioSelecionado] = useState(MUNICIPIOS_RJ_92.find(m => m.n === 'Mesquita') || MUNICIPIOS_RJ_92[0]);
    const [filaOffline, setFilaOffline] = useState([]);
    const [toast, setToast] = useState(null);
    const [cameraAtiva, setCameraAtiva] = useState(false);
    const [fotosCapturadas, setFotosCapturadas] = useState([]);
    const [analiseIaLente, setAnaliseIaLente] = useState('Aguardando escaneamento óptico...');
    const [nomeResponsavel, setNomeResponsavel] = useState('');
    const [registroOuCpf, setRegistroOuCpf] = useState('');
    const [tipoRisco, setTipoRisco] = useState(TIPOS_RISCO[0]);
    const [orgaoSelecionado, setOrgaoSelecionado] = useState(ORGAOS_EQUIPES[0]);
    const [bairro, setBairro] = useState('');
    const [relatorio, setRelatorio] = useState('');
    const canvasRef = useRef(null);
    const videoRef = useRef(null);
    const [soundEnabled, setSoundEnabled] = useState(true);
    const [sarahState, setSarahState] = useState({
        isSpeaking: false,
        topicIdx: 0,
        lineIdx: 0,
        speechText: "Olá! Sou a SARA, sua inteligência artificial da RARU NEXUS. Prevenção inteligente para todos os 92 municípios do RJ!"
    });
    const [telemetria, setTelemetria] = useState({
        brt: '', latency: '18ms', signal: '4G LTE [99%]', sync: 'OK', uptime: '99.9%', battery: '84%'
    });

    const showToast = (msg) => {
        setToast(msg);
        setTimeout(() => setToast(null), 3500);
    };

    const falarComSarah = () => {
        const topic = SARAH_TALK_TOPICS[sarahState.topicIdx];
        const line = topic.lines[sarahState.lineIdx];
        setSarahState(prev => ({ ...prev, isSpeaking: true, speechText: `${topic.icon} [${topic.tag}]: ${line}` }));

        if (soundEnabled && 'speechSynthesis' in window) {
            window.speechSynthesis.cancel();
            const utterance = new SpeechSynthesisUtterance(line);
            utterance.lang = 'pt-BR';
            utterance.rate = 1.05;
            utterance.onend = () => setSarahState(prev => ({ ...prev, isSpeaking: false }));
            window.speechSynthesis.speak(utterance);
        } else {
            setTimeout(() => setSarahState(prev => ({ ...prev, isSpeaking: false })), 4000);
        }

        setSarahState(prev => {
            let nextLine = prev.lineIdx + 1;
            let nextTopic = prev.topicIdx;
            if (nextLine >= SARAH_TALK_TOPICS[nextTopic].lines.length) {
                nextLine = 0;
                nextTopic = (nextTopic + 1) % SARAH_TALK_TOPICS.length;
            }
            return { ...prev, lineIdx: nextLine, topicIdx: nextTopic };
        });
    };

    useEffect(() => {
        const saved = localStorage.getItem('raru_protocol_grade_v11');
        if (saved) {
            try { setFilaOffline(JSON.parse(saved)); } catch(e) {}
        }
        const timer = setInterval(() => {
            const nowBrt = new Intl.DateTimeFormat('pt-BR', { timeZone: 'America/Sao_Paulo', hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false }).format(new Date());
            setTelemetria(prev => ({ ...prev, brt: nowBrt }));
        }, 1000);
        return () => clearInterval(timer);
    }, []);

    useEffect(() => {
        if (view !== 'canvas') return;
        const cv = canvasRef.current;
        if (!cv) return;
        const ctx = cv.getContext('2d');
        let W, H, dpr = window.devicePixelRatio || 1;
        let animId;
        const resize = () => {
            W = window.innerWidth;
            H = window.innerHeight - 56;
            cv.width = W * dpr;
            cv.height = H * dpr;
            cv.style.width = W + 'px';
            cv.style.height = H + 'px';
            ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        };
        resize();
        window.addEventListener('resize', resize);
        const RIOS = [
            {n:"PARAIBA DO SUL",pts:[[0.85,0.25],[0.70,0.35],[0.55,0.45],[0.40,0.55],[0.30,0.60]]},
            {n:"GUANDU",pts:[[0.45,0.60],[0.50,0.62],[0.52,0.65]]},
            {n:"SARAPUI",pts:[[0.51,0.60],[0.53,0.63],[0.55,0.66]]},
            {n:"IGUACU",pts:[[0.50,0.62],[0.52,0.64],[0.54,0.66]]}
        ];
        const nuvens = Array.from({length: 20}, () => ({
            x: Math.random() * W * 1.5 - W * 0.25,
            y: Math.random() * H,
            r: 70 + Math.random() * 140,
            vx: -0.35 - Math.random() * 0.55,
            vy: -0.1 - Math.random() * 0.2,
            opacity: 0.07 + Math.random() * 0.14
        }));
        let mouse = {x:-100, y:-100};
        let selNode = null;
        let time = 0;
        const onMouseMove = e => { mouse.x = e.clientX; mouse.y = e.clientY - 56; };
        const onClick = () => {
            if (selNode) {
                setMunicipioSelecionado(selNode);
                showToast(`📍 ${selNode.n} selecionado na RARU NEXUS.`);
            }
        };
        window.addEventListener('mousemove', onMouseMove);
        window.addEventListener('click', onClick);
        const draw = () => {
            time += 0.02;
            ctx.fillStyle = '#02040A';
            ctx.fillRect(0, 0, W, H);
            ctx.strokeStyle = 'rgba(0,242,254,0.04)';
            ctx.lineWidth = 1;
            for(let i=0; i<W; i+=40) { ctx.beginPath(); ctx.moveTo(i,0); ctx.lineTo(i,H); ctx.stroke(); }
            for(let i=0; i<H; i+=40) { ctx.beginPath(); ctx.moveTo(0,i); ctx.lineTo(W,i); ctx.stroke(); }
            RIOS.forEach(r => {
                ctx.strokeStyle = 'rgba(59,130,246,0.85)';
                ctx.lineWidth = 2.5;
                ctx.shadowColor = '#3B82F6';
                ctx.shadowBlur = 12;
                ctx.beginPath();
                r.pts.forEach((p,i)=>{ const x=p[0]*W, y=p[1]*H; i?ctx.lineTo(x,y):ctx.moveTo(x,y); });
                ctx.stroke();
                ctx.shadowBlur = 0;
            });
            nuvens.forEach(n => {
                n.x += n.vx; n.y += n.vy;
                if (n.x < -200) n.x = W + 200;
                if (n.y < -200) n.y = H + 200;
                const grad = ctx.createRadialGradient(n.x, n.y, 10, n.x, n.y, n.r);
                grad.addColorStop(0, `rgba(0, 242, 254, ${n.opacity})`);
                grad.addColorStop(0.6, `rgba(16, 185, 129, ${n.opacity * 0.4})`);
                grad.addColorStop(1, 'rgba(2, 4, 10, 0)');
                ctx.fillStyle = grad;
                ctx.beginPath(); ctx.arc(n.x, n.y, n.r, 0, Math.PI * 2); ctx.fill();
            });
            ctx.strokeStyle='rgba(0,242,254,0.08)';
            ctx.lineWidth=0.6;
            for(let i=0;i<MUNICIPIOS_RJ_92.length;i++) for(let j=i+1;j<MUNICIPIOS_RJ_92.length;j++){
                const a=MUNICIPIOS_RJ_92[i], b=MUNICIPIOS_RJ_92[j];
                const dx=(a.x-b.x)*W, dy=(a.y-b.y)*H, d=Math.hypot(dx,dy);
                if(d<120){ ctx.globalAlpha=1-d/120; ctx.beginPath(); ctx.moveTo(a.x*W,a.y*H); ctx.lineTo(b.x*W,b.y*H); ctx.stroke(); }
            }
            ctx.globalAlpha=1;
            selNode = null;
            MUNICIPIOS_RJ_92.forEach(n => {
                const x = n.x * W, y = n.y * H;
                const dist = Math.hypot(mouse.x - x, mouse.y - y);
                if(dist < 14) selNode = n;
                const isSel = municipioSelecionado.n === n.n;
                const g = 0.6 + Math.sin(time + n.x*10)*0.4;
                ctx.fillStyle = isSel ? '#FF8C00' : `rgba(0,242,254,${g})`;
                ctx.shadowColor = isSel ? '#FF8C00' : '#00F2FE';
                ctx.shadowBlur = (dist < 14 || isSel) ? 22 : 9*g;
                ctx.beginPath(); ctx.arc(x, y, (dist < 14 || isSel) ? 6.5 : 3.5, 0, Math.PI*2); ctx.fill();
                ctx.shadowBlur = 0;
                if(dist < 14 || isSel) {
                    ctx.fillStyle = '#00F2FE';
                    ctx.font = '10px JetBrains Mono';
                    ctx.fillText(n.n, x + 12, y + 4);
                }
            });
            animId = requestAnimationFrame(draw);
        };
        draw();
        return () => {
            cancelAnimationFrame(animId);
            window.removeEventListener('resize', resize);
            window.removeEventListener('mousemove', onMouseMove);
            window.removeEventListener('click', onClick);
        };
    }, [view, municipioSelecionado]);

    const iniciarCamera = async () => {
        setCameraAtiva(true);
        try {
            const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
            if (videoRef.current) videoRef.current.srcObject = stream;
        } catch(e) {
            showToast("⚠️ Erro ao ligar a câmera.");
            setCameraAtiva(false);
        }
    };
    const tirarFotoEAnalisarAlgoritmo = () => {
        if (!videoRef.current) return;
        const canvas = document.createElement('canvas');

                                    </div>
                                    <div>
                                        <label className="block font-mono text-[10px] text-slate-300 mb-1">ID / CPF / Matrícula:</label>
                                        <input type="text" value={registroOuCpf} onChange={e=>setRegistroOuCpf(e.target.value)} placeholder="Ex: CPF ou Credencial" required className="w-full bg-[var(--void)] border border-[var(--cyan)]/40 rounded-xl p-2 font-mono text-xs text-white"/>
                                    </div>
                                </div>
                                <div className="grid grid-cols-1 md:grid-cols-2 gap-2">
                                    <div>
                                        <label className="block font-mono text-[10px] text-slate-300 mb-1">Tipologia de Risco:</label>
                                        <select value={tipoRisco} onChange={e=>setTipoRisco(e.target.value)} className="w-full bg-[var(--void)] border border-[var(--cyan)]/40 rounded-xl p-2 font-mono text-[10px] text-[var(--cyan)]">
                                            {TIPOS_RISCO.map((tr,i)=><option key={i} value={tr}>{tr}</option>)}
                                        </select>
                                    </div>
                                    <div>
                                        <label className="block font-mono text-[10px] text-slate-300 mb-1">Unidade / Coletivo:</label>
                                        <select value={orgaoSelecionado} onChange={e=>setOrgaoSelecionado(e.target.value)} className="w-full bg-[var(--void)] border border-[var(--cyan)]/40 rounded-xl p-2 font-mono text-[10px] text-[var(--cyan)]">
                                            {ORGAOS_EQUIPES.map((o,i)=><option key={i} value={o}>{o}</option>)}
                                        </select>
                                    </div>
                                </div>
                                <div>
                                    <label className="block font-mono text-[10px] text-slate-300 mb-1">Bairro / Localidade:</label>
                                    <input type="text" value={bairro} onChange={e=>setBairro(e.target.value)} placeholder="Ex: Rocha Sobrinho / Sebinho / Centro" required className="w-full bg-[var(--void)] border border-[var(--cyan)]/40 rounded-xl p-2 font-mono text-xs text-white"/>
                                </div>
                                <div>
                                    <label className="block font-mono text-[10px] text-slate-300 mb-1">Relato &amp; Prevenção Urbana:</label>
                                    <textarea rows="3" value={relatorio} onChange={e=>setRelatorio(e.target.value)} placeholder="Descreva condições locais e ações preventivas..." required className="w-full bg-[var(--void)] border border-[var(--cyan)]/40 rounded-xl p-2 font-mono text-xs text-white"></textarea>
                                </div>
                                <button type="submit" className="w-full py-3 bg-[var(--orange)] text-black font-black rounded-xl uppercase text-xs shadow-lg">Emitir Protocolo Oficial &amp; Hash SHA-256 + PDF + WhatsApp 🚀</button>
                            </form>
                        </div>
                    </div>
                )}

                {view === 'offline' && (
                    <div className="absolute inset-0 p-4 overflow-y-auto flex items-center justify-center bg-black/80 backdrop-blur-md">
                        <div className="w-full max-w-2xl cyber-panel p-4 rounded-2xl space-y-3">
                            <div className="flex items-center justify-between border-b border-[var(--cyan)]/30 pb-2">
                                <h3 className="font-black text-xs text-[var(--cyan)]">📦 ACERVO RARU NEXUS • PROTOCOLOS ({filaOffline.length})</h3>
                                {filaOffline.length > 0 && (
                                    <button onClick={() => { localStorage.removeItem('raru_protocol_grade_v11'); setFilaOffline([]); showToast("🗑️ Acervo limpo."); }} className="px-3 py-1 bg-[var(--rose)]/20 text-[var(--rose)] border border-[var(--rose)] rounded-lg text-[10px] font-bold">Limpar</button>
                                )}
                            </div>
                            {filaOffline.length === 0 ? (
                                <p className="font-mono text-xs text-slate-400 py-10 text-center">Nenhum protocolo emitido até o momento.</p>
                            ) : (
                                <div className="space-y-2 max-h-96 overflow-y-auto">
                                    {filaOffline.map((item, idx) => (
                                        <div key={idx} className="p-2.5 bg-[var(--void)] border border-[var(--cyan)]/30 rounded-xl flex items-center justify-between">
                                            <div>
                                                <div className="font-bold text-[10px] text-[var(--cyan)]">{item.protocolo} - {item.municipio}</div>
                                                <div className="font-mono text-[9px] text-slate-300">{item.bairro} | {item.tipoRisco.slice(0,30)} | {item.fotosCount} fotos</div>
                                                <div className="font-mono text-[8px] text-emerald-400">HASH: {item.hashHash.substring(0,22)}...</div>
                                            </div>
                                            <div className="flex gap-1.5">
                                                <button onClick={() => gerarPDFProtocol(item)} className="px-2.5 py-1 bg-[var(--cyan)]/20 border border-[var(--cyan)] text-[var(--cyan)] rounded-lg text-[10px] font-bold">PDF</button>
                                                <button onClick={() => enviarWhatsApp(item)} className="px-2.5 py-1 bg-[var(--green)]/20 border border-green-500/40 text-[var(--green)] rounded-lg text-[10px] font-bold">Wpp</button>
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            )}
                        </div>
                    </div>
                )}
            </main>
        </div>
    );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
