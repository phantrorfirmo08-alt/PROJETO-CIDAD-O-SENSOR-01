function bloquearCalmaAlexander(texto) {
  return String(texto || "")
    .replace(/\bcalma,?\s+alexander\b/gi, "respira")
    .replace(/\bcalma,?\s+alexandre\b/gi, "respira")
    .replace(/\s{2,}/g, " ")
    .replace(/\s+([,.!?])/g, "$1")
    .trim();
}

function limparTextoParaFala(texto) {
  const semAlexander = bloquearCalmaAlexander(texto);
  return semAlexander
    .replace(/[*#_`]/g, '')
    .replace(/cerquilha/gi, '')
    .replace(/asterisco/gi, '')
    .replace(/([\u2700-\u27BF]|[\uE000-\uF8FF]|\uD83C[\uDC00-\uDFFF]|\uD83D[\uDC00-\uDFFF]|[\u2011-\u26FF]|\uD83E[\uDD00-\uDDFF])/g, '')
    .replace(/https?:\/\/\S+/g, "")
    .replace(/\s+/g, " ")
    .trim();
}

function avaliarRiscoMeteorologico(chuvaMm = 0, probChuva = 0, ventoKmh = 0, rajadaKmh = 0) {
  const ch = Number(chuvaMm) || 0;
  const pr = Number(probChuva) || 0;
  const vn = Math.max(Number(ventoKmh) || 0, Number(rajadaKmh) || 0);
  if (ch >= 15 || vn >= 65) {
    return { nivel: "R4 - EVACUAÇÃO / SEVERO", severidade: "CRÍTICO", acao: "Evacuação preventiva de áreas baixas/encostas, evitar travessia de lâmina d'água e acionar rota segura." };

  return { nivel: "R1 - BAIXO / PREVENTIVO", severidade: "ESTÁVEL", acao: "Condição atmosférica estável; manter rotina preventiva e zeladoria de drenagem." };

function escolherVozPtBr(perfilId) {

  if (!voices || voices.length === 0) return null;

  if (ptVoices.length === 0) return voices[0];
  const idx = PERFIS_VOZ_OFICIAIS.findIndex(p => p.id === perfilId);
  if (idx >= 0) return ptVoices[idx % ptVoices.length];
  return ptVoices.find(v => (v.name || "").toLowerCase().includes("google")) || ptVoices[0];
}

function escolherVozMasculinaPtBr() {
  const voices = carregarVozesDisponiveis();
  if (!voices || voices.length === 0) return null;
  const ptVoices = voices.filter(v => (v.lang || "").toLowerCase().includes("pt"));

function falarRoboMasculino(texto, onStart = null, onEnd = null) {
  try {
    if (localStorage.getItem("raru_sound_enabled") === "false") {
      if (onEnd) onEnd();
      return;
    }
  } catch (e) {}
  if (!("speechSynthesis" in window)) {
    if (onEnd) onEnd();
    return;
  }
  const textoLimpo = limparTextoParaFala(texto);
  if (!textoLimpo) {
    if (onEnd) onEnd();
    return;
  }

  try {
    window.speechSynthesis.cancel();
    const frases = textoLimpo.split(/(?<=[.!?])\s+/).filter(Boolean);
    const fila = frases.length > 0 ? frases : [textoLimpo];
    const vozMasc = escolherVozMasculinaPtBr();

    if (onStart) onStart();

    const falarSequencia = (index) => {
      if (index >= fila.length) {
        if (onEnd) onEnd();
        return;
      }
      try {
        if (localStorage.getItem("raru_sound_enabled") === "false") {
          if (onEnd) onEnd();
          return;
        }
      } catch (e) {}

      const u = new SpeechSynthesisUtterance(fila[index]);
      u.lang = "pt-BR";
      u.pitch = 0.68;
      u.rate = 0.96;
      u.volume = 1.0;
      if (vozMasc) u.voice = vozMasc;

      u.onend = () => {
        if (index + 1 < fila.length) setTimeout(() => falarSequencia(index + 1), 260);
        else if (onEnd) onEnd();
      };
      u.onerror = () => {
        if (index + 1 < fila.length) setTimeout(() => falarSequencia(index + 1), 260);
        else if (onEnd) onEnd();
      };
      window.speechSynthesis.speak(u);
    };

    falarSequencia(0);
  } catch (e) {
    if (onEnd) onEnd();
  }
}

function falarImitada(texto, perfilId = 'sarah') {
  try {
    if (localStorage.getItem("raru_sound_enabled") === "false") return;
  } catch (e) {}
  if (!("speechSynthesis" in window)) return;
  const textoLimpo = limparTextoParaFala(texto);
  if (!textoLimpo) return;

  const perfilSalvo = (() => {
    try { return localStorage.getItem("raru_perfil_voz") || perfilId || 'sarah'; }
    catch (e) { return perfilId || 'sarah'; }
  })();
  const perfil = PERFIS_VOZ_OFICIAIS.find(p => p.id === perfilSalvo) || PERFIS_VOZ_OFICIAIS[0];

  try {
    window.speechSynthesis.cancel();
    const textoImitado = limparTextoParaFala(perfil.transform(textoLimpo));
    const frases = textoImitado.split(/(?<=[.!?])\s+/).filter(Boolean);
    const fila = frases.length > 0 ? frases : [textoImitado];
    const vozEscolhida = escolherVozPtBr(perfil.id);

    const falarSequencia = (index) => {
      if (index >= fila.length) return;
      try {
        if (localStorage.getItem("raru_sound_enabled") === "false") return;
      } catch (e) {}

      const u = new SpeechSynthesisUtterance(fila[index]);
      u.lang = "pt-BR";
      const osc = (Math.random() - 0.5) * perfil.variacao;
      u.pitch = Math.max(0.5, Math.min(2.0, perfil.pitch + osc));
      u.rate = Math.max(0.5, Math.min(2.0, perfil.rate));
      u.volume = Math.max(0, Math.min(1, perfil.volume));
      if (vozEscolhida) u.voice = vozEscolhida;

      u.onend = () => {
        if (index + 1 < fila.length) setTimeout(() => falarSequencia(index + 1), perfil.pausaFrase);
      };
      u.onerror = () => {
        if (index + 1 < fila.length) setTimeout(() => falarSequencia(index + 1), perfil.pausaFrase);
      };
      window.speechSynthesis.speak(u);
    };

    falarSequencia(0);
  } catch (e) {}
}

async function calcularSHA256(texto) {
  const str = String(texto || "");
  try {
    if (window.crypto && window.crypto.subtle && window.TextEncoder) {
      const encoder = new TextEncoder();
      const data = encoder.encode(str);
      const hashBuffer = await window.crypto.subtle.digest('SHA-256', data);
      const hashArray = Array.from(new Uint8Array(hashBuffer));
      return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
    }
  } catch (e) {}
  let h1 = 0xdeadbeef, h2 = 0x41c6ce57;
  for (let i = 0; i < str.length; i++) {
    const ch = str.charCodeAt(i);
    h1 = Math.imul(h1 ^ ch, 2654435761);
    h2 = Math.imul(h2 ^ ch, 1597334677);
  }
  h1 = Math.imul(h1 ^ (h1 >>> 16), 2246822507) ^ Math.imul(h2 ^ (h2 >>> 13), 3266489909);
  h2 = Math.imul(h2 ^ (h2 >>> 16), 2246822507) ^ Math.imul(h1 ^ (h1 >>> 13), 3266489909);
  const combinado = (4294967296 * (2097151 & h2) + (h1 >>> 0)).toString(16).padStart(16, '0');
  return combinado.repeat(4).slice(0, 64);
}

function quebrarTextoCanvas(ctx, texto, maxWidth) {
  const palavras = String(texto || '').split(/\s+/).filter(Boolean);
  if (palavras.length === 0) return [''];
  const linhas = [];
  let atual = palavras[0];

  for (let i = 1; i < palavras.length; i++) {
    const teste = atual + ' ' + palavras[i];
    if (ctx.measureText(teste).width <= maxWidth) {
      atual = teste;
    } else {
      if (ctx.measureText(atual).width > maxWidth) {
        let pedaco = '';
        for (const ch of atual) {
          if (ctx.measureText(pedaco + ch).width <= maxWidth) pedaco += ch;
          else {
            linhas.push(pedaco);
            pedaco = ch;
          }
        }
        if (pedaco) atual = pedaco;
      }
      linhas.push(atual);
      atual = palavras[i];
    }
  }

  if (ctx.measureText(atual).width > maxWidth) {
    let pedaco = '';
    for (const ch of atual) {
      if (ctx.measureText(pedaco + ch).width <= maxWidth) pedaco += ch;
      else {
        linhas.push(pedaco);
        pedaco = ch;
      }
    }
    if (pedaco) linhas.push(pedaco);
  } else {
    linhas.push(atual);
  }
  return linhas;
}

async function gerarArquivoIconeEscudo() {
  return new Promise((resolve) => {
    const canvas = document.createElement('canvas');
    canvas.width = 512;
    canvas.height = 512;
    const ctx = canvas.getContext('2d');

    const bgGrad = ctx.createRadialGradient(256, 256, 30, 256, 256, 320);
    bgGrad.addColorStop(0, '#0A2547');
    bgGrad.addColorStop(0.6, '#041125');
    bgGrad.addColorStop(1, '#02040A');
    ctx.fillStyle = bgGrad;
    ctx.fillRect(0, 0, 512, 512);

    ctx.save();
    ctx.shadowColor = '#00F2FE';
    ctx.shadowBlur = 25;
    ctx.beginPath();
    ctx.moveTo(256, 65);
    ctx.lineTo(410, 130);
    ctx.lineTo(410, 265);
    ctx.quadraticCurveTo(410, 385, 256, 435);
    ctx.quadraticCurveTo(102, 385, 102, 265);
    ctx.lineTo(102, 130);
    ctx.closePath();

    const shieldFill = ctx.createLinearGradient(102, 65, 410, 435);
    shieldFill.addColorStop(0, 'rgba(0, 242, 254, 0.22)');
    shieldFill.addColorStop(1, 'rgba(4, 17, 37, 0.94)');
    ctx.fillStyle = shieldFill;
    ctx.fill();
    ctx.lineWidth = 7;
    ctx.strokeStyle = '#00F2FE';
    ctx.stroke();
    ctx.restore();

    ctx.fillStyle = '#00FF9D';
    ctx.font = '900 20px Orbitron, sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('RESILIÊNCIA CLIMÁTICA', 256, 188);
    ctx.fillText('& URBANA', 256, 214);

    ctx.fillStyle = '#FFFFFF';
    ctx.font = '900 28px Orbitron, sans-serif';
    ctx.fillText('RARU NEXUS', 256, 256);

    ctx.fillStyle = '#00F2FE';
    ctx.font = '800 17px JetBrains Mono, monospace';
    ctx.fillText('V11.2 PLUS • RJ', 256, 288);

    ctx.fillStyle = '#38BDF8';
    ctx.font = '700 15px JetBrains Mono, monospace';
    ctx.fillText('CIDADÃO SENSOR • MESQUITA RJ', 256, 478);

    canvas.toBlob((blob) => {
      if (blob) resolve(new File([blob], 'ESCUDO_RARU_NEXUS_V11_2_PLUS.png', { type: 'image/png' }));
      else resolve(null);
    }, 'image/png');
  });
}

async function compartilharEscudoComTextoUnico(showToast) {
  const textoLimpo = shareMessageText.trim();
  const escudoFile = await gerarArquivoIconeEscudo();

  try {
    if (escudoFile && navigator.canShare && navigator.canShare({ files: [escudoFile] })) {
      await navigator.share({
        title: `${TITULO_OFICIAL_RARU} — ${SUBTITULO_OFICIAL_RARU}`,
        text: textoLimpo,
        files: [escudoFile]
      });
      if (showToast) showToast("Ícone do escudo + texto com link único compartilhados.");
      return;
    }
  } catch (e) {
    if (e && e.name === 'AbortError') return;
  }

  if (escudoFile) {
    try {
      const urlImg = URL.createObjectURL(escudoFile);
      const a = document.createElement('a');
      a.href = urlImg;
      a.download = escudoFile.name;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      setTimeout(() => URL.revokeObjectURL(urlImg), 3000);
    } catch (e) {}
  }

  try {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      await navigator.clipboard.writeText(textoLimpo);
    }
  } catch (e) {}

  if (showToast) showToast("Ícone do escudo baixado + texto com link único copiado.");
}

async function sincronizarTelemetria92RJ(onComplete = null) {
  try {
    const lats = MUNICIPIOS_92.map(c => c.lat).join(',');
    const lons = MUNICIPIOS_92.map(c => c.lon).join(',');
    const urlClima = `https://api.open-meteo.com/v1/forecast?latitude=${lats}&longitude=${lons}&current=temperature_2m,relative_humidity_2m,precipitation,wind_speed_10m,wind_gusts_10m,surface_pressure&hourly=temperature_2m,precipitation_probability,wind_speed_10m&timezone=America%2FSao_Paulo&forecast_days=1`;

    const [resClima, resRadar] = await Promise.allSettled([
      fetch(urlClima).then(r => r.json()),
      fetch("https://api.rainviewer.com/public/weather-maps.json").then(r => r.json())
    ]);

    if (resRadar.status === "fulfilled" && resRadar.value) {
      const rvData = resRadar.value;
      const past = rvData?.radar?.past || [];
      const nowcast = rvData?.radar?.nowcast || [];
      ESTADO_CLIMA_AUTOMATICO_92.rainviewerHost = rvData.host || "https://tilecache.rainviewer.com";
      ESTADO_CLIMA_AUTOMATICO_92.rainviewerFrames = [...past, ...nowcast];
    }

    if (resClima.status === "fulfilled" && resClima.value) {
      const arr = Array.isArray(resClima.value) ? resClima.value : [resClima.value];
      const hora = new Date().getHours();
      const mapa = {};
      const listaResumo = [];

      arr.forEach((item, i) => {
        const c = MUNICIPIOS_92[i];
        if (!c || !item?.current) return;
        const tempNum = item.current.temperature_2m;
        const chuvaNum = item.current.precipitation ?? 0;
        const probNum = item.hourly?.precipitation_probability?.[hora] ?? 0;
        const ventoNum = item.current.wind_speed_10m ?? 0;
        const rajadaNum = item.current.wind_gusts_10m ?? ventoNum;
        const umiNum = item.current.relative_humidity_2m ?? "--";
        const pressaoNum = item.current.surface_pressure ?? "--";
        const riscoObj = avaliarRiscoMeteorologico(chuvaNum, probNum, ventoNum, rajadaNum);

        const registro = {
          nome: c.n,
          temp: `${tempNum}°C`,
          tempNum,
          umi: `${umiNum}%`,
          chuva: `${chuvaNum} mm`,
          chuvaNum,
          probChuva: `${probNum}%`,
          probNum,
          vento: `${ventoNum} km/h`,
          ventoNum,
          rajada: `${rajadaNum} km/h`,
          rajadaNum,
          pressao: pressaoNum,
          risco: riscoObj.nivel,
          severidade: riscoObj.severidade,
          riscoObj,
          condicao: riscoObj.severidade === "CRÍTICO" ? "ALERTA SEVERO" : riscoObj.severidade === "ALTO" ? "ALERTA ALTO" : riscoObj.severidade === "MODERADO" ? "ATENÇÃO" : "ESTÁVEL",
          hourly: item.hourly
        };

        mapa[c.n] = registro;
        listaResumo.push(registro);
      });

      listaResumo.sort((a, b) => (b.chuvaNum * 10 + b.probNum) - (a.chuvaNum * 10 + a.probNum));
      ESTADO_CLIMA_AUTOMATICO_92.municipios = mapa;
      ESTADO_CLIMA_AUTOMATICO_92.resumoCriticoRJ = listaResumo;
      ESTADO_CLIMA_AUTOMATICO_92.atualizadoEm = new Date().toLocaleTimeString("pt-BR", { timeZone: "America/Sao_Paulo" });
      ESTADO_CLIMA_AUTOMATICO_92.statusRede = "92 MUNICÍPIOS + GOES-19 + RAINVIEWER ONLINE";
    }
  } catch (e) {
    ESTADO_CLIMA_AUTOMATICO_92.statusRede = "MODO RESILIÊNCIA / CACHE ATIVO";
  }
  if (onComplete) onComplete(ESTADO_CLIMA_AUTOMATICO_92);
}

function RadioCyberTatica({ showToast, audioRef, estacaoAtiva, setEstacaoAtiva, fallbackIdx, setFallbackIdx, tocando, setTocando, volume, setVolume, statusStream, setStatusStream }) {
  const atual = ESTACOES_RADIO[estacaoAtiva] || ESTACOES_RADIO[0];

  const alternarPlay = () => {
    const audio = audioRef?.current;
    if (!audio) return;
    if (tocando) {
      try { audio.pause(); } catch (e) {}
      setTocando(false);
      setStatusStream("Pausado");
      if (showToast) showToast("Rádio pausada.");
      return;
    }
    try {
      audio.src = atual.url;
      audio.volume = Math.max(0, Math.min(1, volume / 100));
      setStatusStream("Conectando...");
      const p = audio.play();
      if (p && p.then) {
        p.then(() => {
          setTocando(true);
          setStatusStream("AO VIVO");
          if (showToast) showToast(`Sintonizado: ${atual.nome}`);
        }).catch(() => {
          setTocando(false);
          setStatusStream("Stream indisponível no momento");
          if (showToast) showToast("Não foi possível iniciar o stream de áudio agora.");
        });
      } else {
        setTocando(true);
        setStatusStream("AO VIVO");
      }
    } catch (e) {
      setStatusStream("Erro ao reproduzir");
    }
  };

  const selecionarEstacao = (idx) => {
    setEstacaoAtiva(idx);
    setFallbackIdx(-1);
    const est = ESTACOES_RADIO[idx];
    const audio = audioRef?.current;
    if (audio && tocando) {
      try {
        audio.src = est.url;
        audio.play().catch(() => {});
      } catch (e) {}
    }
    if (showToast) showToast(`Estação selecionada: ${est.nome}`);
  };

  return (
    <div className="space-y-4 max-w-4xl mx-auto font-mono">
      <div className="cyber-card p-5 rounded-2xl shadow-xl space-y-4 border border-cyberCyan/40">
        <div className="flex items-center justify-between border-b border-cyberCyan/25 pb-3">
          <div>
            <h2 className="font-display text-xs font-black text-white tracking-widest uppercase">
              RÁDIO COMUNITÁRIA &amp; ALERTAS • GADE
            </h2>
            <p className="text-[9px] text-cyberCyan font-bold mt-0.5">{atual.nome} • {atual.freq}</p>
          </div>
          <span className={`text-[9px] px-2.5 py-1 rounded-full font-bold ${tocando ? 'bg-cyberGreen/20 text-cyberGreen border border-cyberGreen/50' : 'bg-void text-slate-400 border border-slate-700'}`}>
            {statusStream}
          </span>
        </div>

        <div className="grid grid-cols-1 sm:grid-cols-3 gap-2">
          {ESTACOES_RADIO.map((est, idx) => (
            <button
              key={idx}
              type="button"
              onClick={() => selecionarEstacao(idx)}
              className={`p-3 rounded-xl border text-left transition cursor-pointer ${estacaoAtiva === idx ? 'bg-cyberCyan/15 border-cyberCyan text-white' : 'bg-void/90 border-slate-700 text-slate-300'}`}
            >
              <div className="text-[10px] font-black text-cyberCyan truncate">{est.nome}</div>
              <div className="text-[8px] text-slate-400 mt-0.5">{est.freq}</div>
            </button>
          ))}
        </div>

        <div className="flex flex-col sm:flex-row items-center gap-4 bg-void/90 border border-cyberCyan/30 rounded-2xl p-4">
          <button type="button" onClick={alternarPlay} className="cyber-button-solid text-xs py-2.5 px-5 w-full sm:w-auto">
            {tocando ? 'PAUSAR RÁDIO' : 'OUVIR AO VIVO'}
          </button>
          <div className="flex-1 w-full space-y-1">
            <div className="flex justify-between text-[9px] text-cyberCyan font-bold">
              <span>VOLUME DO ÁUDIO</span>
              <span>{volume}%</span>
            </div>
            <input
              type="range"
              min="0"
              max="100"
              value={volume}
              onChange={(e) => setVolume(Number(e.target.value))}
              className="w-full accent-cyberCyan cursor-pointer"
            />
          </div>
        </div>
      </div>
    </div>
  );
}

function PainelRotasEstacaoPublica() {

function CadeAdminModule({ showToast }) {
  const MUNICIPIOS = MUNICIPIOS_92.map(m => m.n);
  const [abaAtiva, setAbaAtiva] = useState('rota');
  const [rotas, setRotas] = useState(() => {
    try { return JSON.parse(localStorage.getItem('rotasFugaReais') || '[]'); } catch (e) { return []; }
  });
  const [rNome, setRNome] = useState('');
  const [rEnd, setREnd] = useState('');
  const [rInfo, setRInfo] = useState('');
  const [rTipo, setRTipo] = useState('Ponto de Encontro');

  const [monitores, setMonitores] = useState(() => {
    try { return JSON.parse(localStorage.getItem('monitoresCADE') || '[]'); } catch (e) { return []; }
  });
  const [bloqueados, setBloqueados] = useState(() => {
    try { return JSON.parse(localStorage.getItem('monitoresBloqueadosCADE') || '[]'); } catch (e) { return []; }
  });
  const [mNome, setMNome] = useState('');
  const [mZap, setMZap] = useState('');
  const [mSenha, setMSenha] = useState('');
  const [mMun, setMMun] = useState('');
  const [mBairro, setMBairro] = useState('');
  const [mFuncao, setMFuncao] = useState('Monitor do Tempo');
  const [mObs, setMObs] = useState('');
  const [filtroMon, setFiltroMon] = useState('');

  const salvarRota = () => {
    if (!rNome.trim() || !rEnd.trim()) { showToast('Escreve o nome e o endereço.'); return; }
    const atualizadas = [...rotas, { nome: rNome.trim(), endereco: rEnd.trim(), info: rInfo.trim(), tipo: rTipo }];
    setRotas(atualizadas);
    try { localStorage.setItem('rotasFugaReais', JSON.stringify(atualizadas)); } catch (e) {}
    setRNome(''); setREnd(''); setRInfo('');
    showToast('Rota salva e publicada na Estação.');
  };

  const excluirRota = (i) => {
    if (!confirm('Excluir essa rota?')) return;
    const atualizadas = [...rotas];
    atualizadas.splice(i, 1);
    setRotas(atualizadas);
    try { localStorage.setItem('rotasFugaReais', JSON.stringify(atualizadas)); } catch (e) {}
  };

  const cadastrarMonitor = () => {
    if (!mNome.trim() || !mMun || !mBairro.trim() || !mSenha.trim()) { showToast('Preencha nome, município, bairro e crie a senha.'); return; }
    let c = parseInt(localStorage.getItem('contadorMonitorCADE') || '0', 10) + 1;
    try { localStorage.setItem('contadorMonitorCADE', String(c)); } catch (e) {}
    const idGerado = 'GADE-M-' + String(c).padStart(3, '0');
    const novoM = { id: idGerado, nome: mNome.trim(), zap: mZap.trim(), senha: mSenha.trim(), municipio: mMun, bairro: mBairro.trim(), funcao: mFuncao, obs: mObs.trim(), data: new Date().toLocaleString('pt-BR') };
    const atualizados = [...monitores, novoM];
    setMonitores(atualizados);
    try { localStorage.setItem('monitoresCADE', JSON.stringify(atualizados)); } catch (e) {}
    setMNome(''); setMZap(''); setMSenha(''); setMBairro(''); setMObs('');
    showToast(`Monitor cadastrado: ${idGerado}`);
  };

  const bloquearMonitor = (idx) => {
    const x = monitores[idx];
    const motivo = prompt(`Excluindo ${x.nome} - ${x.id}\nMotivo? Ex: mau uso`);
    if (motivo === null) return;
    if (!confirm(`CONFIRMAR BLOQUEIO?\n\n${x.id} - ${x.nome}`)) return;
    const l = [...monitores]; l.splice(idx, 1);
    setMonitores(l); try { localStorage.setItem('monitoresCADE', JSON.stringify(l)); } catch (e) {}
    const bb = [...bloqueados, { ...x, motivo: motivo || 'Sem motivo', dataBloqueio: new Date().toLocaleString('pt-BR') }];
    setBloqueados(bb); try { localStorage.setItem('monitoresBloqueadosCADE', JSON.stringify(bb)); } catch (e) {}
    showToast(`Monitor ${x.id} bloqueado.`);
  };

  const desbloquearMonitor = (idx) => {
    const x = bloqueados[idx];
    if (!confirm(`Desbloquear ${x.id} - ${x.nome}?`)) return;
    const bb = [...bloqueados]; bb.splice(idx, 1);
    setBloqueados(bb); try { localStorage.setItem('monitoresBloqueadosCADE', JSON.stringify(bb)); } catch (e) {}
    const l = [...monitores, { id: x.id, nome: x.nome, zap: x.zap, senha: x.senha, municipio: x.municipio, bairro: x.bairro, funcao: x.funcao, obs: x.obs, data: x.data }];
    setMonitores(l); try { localStorage.setItem('monitoresCADE', JSON.stringify(l)); } catch (e) {}
    showToast(`Monitor ${x.id} desbloqueado.`);
  };

  const exportarMonitoresGrupo = () => {
    if (!monitores.length) { showToast('Nenhum monitor ativo.'); return; }

    if (navigator.clipboard) navigator.clipboard.writeText(msg).catch(() => {});
    showToast('Lista copiada sem senha. Abrindo WhatsApp.');
    window.open('https://chat.whatsapp.com/D1wrk9nTBH57Wya2Uv44ZW', '_blank');
  };

  const monitoresFiltrados = monitores.filter(x => (x.id + ' ' + x.nome + ' ' + x.municipio + ' ' + x.bairro).toLowerCase().includes(filtroMon.toLowerCase()));

  return (
    <div id="cadeAdmin" style={{ background: '#021a2a', border: '1px solid #00e5ff', borderRadius: '16px', padding: '14px', fontFamily: 'sans-serif' }}>
      <b style={{ color: '#00e5ff', fontSize: '16px' }}>ÁREA RESTRITA - GADE</b>
      <div style={{ color: '#fff', fontSize: '12px', opacity: .8 }}>GADE - Grupo A Chave da Esperança / {TITULO_OFICIAL_RARU}</div>

        <button type="button" onClick={() => setAbaAtiva('rota')} style={{ flex: 1, background: abaAtiva === 'rota' ? '#00e5ff' : '#041e2e', color: abaAtiva === 'rota' ? '#000' : '#fff', fontWeight: 'bold', border: 'none', padding: '12px', borderRadius: '10px', cursor: 'pointer' }}>ROTAS DE FUGA</button>
        <button type="button" onClick={() => setAbaAtiva('monitor')} style={{ flex: 1, background: abaAtiva === 'monitor' ? '#00ff88' : '#041e2e', color: abaAtiva === 'monitor' ? '#000' : '#fff', fontWeight: 'bold', border: '1px solid #00e5ff', padding: '12px', borderRadius: '10px', cursor: 'pointer' }}>MONITORES</button>

}

function AdminVaultModule({ showToast, onClose, localVideos, setLocalVideos, onSelecionarPerfilVoz, perfilVozId, customTickerText, setCustomTickerText }) {
  const [pinInput, setPinInput] = useState("");
  const [isUnlocked, setIsUnlocked] = useState(false);
  const [adminSubTab, setAdminSubTab] = useState('cade');
  const [tickerInput, setTickerInput] = useState(customTickerText);

  const handleUnlock = (e) => {
    e.preventDefault();
    if (pinInput === "303500") { setIsUnlocked(true); showToast("Acesso Restrito Autorizado."); } else { showToast("PIN Incorreto."); }
  };

  const salvarTicker = (e) => {
    e.preventDefault();
    setCustomTickerText(tickerInput);
    try { localStorage.setItem('raru_custom_ticker', tickerInput); } catch (e) {}
    showToast("Faixa marquee atualizada com sucesso.");
  };

  const handleUploadGaleriaDireto = (e) => {
    const file = e.target.files[0];
    if (!file || !file.type.startsWith('video/')) { showToast("Selecione um vídeo válido."); return; }
    const reader = new FileReader();
    reader.onload = (uploadEvent) => {
      const novoItem = { id: Date.now(), title: file.name, url: uploadEvent.target.result, type: 'local' };
      const atualizados = [novoItem, ...localVideos];
      setLocalVideos(atualizados);
      try { localStorage.setItem('raru_local_videos', JSON.stringify(atualizados)); } catch (e) {}
      showToast("Vídeo salvo no LocalStorage.");
    };
    reader.readAsDataURL(file);
  };

  return (
    <div className="space-y-4 w-full font-mono max-w-4xl mx-auto">
      <div className="cyber-card p-4 shadow-xl space-y-4 border border-cyberCyan/40">
        <div className="flex items-center justify-between border-b border-cyberCyan/25 pb-2.5">
          <h2 className="font-display text-xs font-black text-cyberCyan tracking-widest">ÁREA RESTRITA (ADMIN VAULT)</h2>
          <button type="button" onClick={onClose} className="cyber-button-danger text-xs py-1 px-3 !min-h-[32px]">FECHAR</button>
        </div>

        {!isUnlocked ? (
          <form onSubmit={handleUnlock} className="flex gap-2">
            <input type="password" maxLength="6" value={pinInput} onChange={(e) => setPinInput(e.target.value)} placeholder="PIN (303500)" className="flex-1 bg-void border border-cyberCyan/40 rounded-xl px-3 py-2.5 text-center text-slate-100 font-mono tracking-widest text-xs shadow-inner" />
            <button type="submit" className="cyber-button text-xs py-2.5 px-4">ACESSAR</button>
          </form>
        ) : (
          <div className="space-y-4">
            <div className="flex gap-2 overflow-x-auto pb-2 border-b border-cyberCyan/30">
              <button type="button" onClick={() => setAdminSubTab('cade')} className={`cyber-button text-xs py-2 px-3 ${adminSubTab === 'cade' ? '!bg-cyan-400 !text-void' : ''}`}>PAINEL GADE / CADE</button>
              <button type="button" onClick={() => setAdminSubTab('sistema')} className={`cyber-button text-xs py-2 px-3 ${adminSubTab === 'sistema' ? '!bg-cyberCyan !text-void' : ''}`}>CONFIGURAÇÕES &amp; VOZES</button>
            </div>

            {adminSubTab === 'cade' && <CadeAdminModule showToast={showToast} />}

            {adminSubTab === 'sistema' && (
              <div className="space-y-5">
                <SeletorVozGlobal perfilVozId={perfilVozId} setPerfilVozId={onSelecionarPerfilVoz} />

                <div className="bg-void/90 border border-cyberCyan/50 rounded-xl p-3.5 space-y-2.5">
                  <span className="text-white font-black text-xs font-display block">TEXTO DA FAIXA MARQUEE (LETREIRO)</span>
                  <form onSubmit={salvarTicker} className="space-y-2">
                    <input type="text" value={tickerInput} onChange={(e) => setTickerInput(e.target.value)} placeholder="Digite o texto..." className="w-full bg-deepSpace border border-cyberCyan/40 rounded-xl p-2.5 text-xs text-white" />
                    <button type="submit" className="cyber-button w-full text-xs py-2.5">ATUALIZAR FAIXA MARQUEE</button>
                  </form>
                </div>

                <div className="bg-void/90 border border-cyberCyan/50 rounded-xl p-3.5 space-y-2">
                  <span className="text-white font-black text-xs font-display block">ADICIONAR VÍDEO DO APARELHO</span>
                  <label className="cyber-button w-full text-xs py-3 justify-center cursor-pointer">
                    SELECIONAR ARQUIVO DE VÍDEO
                    <input type="file" accept="video/*" onChange={handleUploadGaleriaDireto} className="hidden" />
                  </label>
                </div>
              </div>
            )}
          </div>
        )}
      </div>
    </div>
  );
}

function EstacaoGADEModule({ showToast, userName }) {
  const [sosNome, setSosNome] = useState(() => localStorage.getItem('cadeNomeSOS') || userName || '');
  const [sosObs, setSosObs] = useState(() => localStorage.getItem('cadeObsSOS') || '');
  const [statusSOS, setStatusSOS] = useState('');
  const [ultimaMsgPronta, setUltimaMsgPronta] = useState('');
  const [historicoSOS, setHistoricoSOS] = useState(() => localStorage.getItem('cadeUltimoSOS') ? 'Último SOS: ' + localStorage.getItem('cadeUltimoSOS') : '');

  const GRUPO_GADE = 'https://chat.whatsapp.com/D1wrk9nTBH57Wya2Uv44ZW';

  useEffect(() => {
    if (userName && !sosNome) setSosNome(userName);
  }, [userName]);

  const sosCADE = (tipo) => {
    try {
      localStorage.setItem('cadeNomeSOS', sosNome);
      localStorage.setItem('cadeObsSOS', sosObs);
    } catch (e) {}
    const nomeFinal = sosNome.trim() || userName || 'Morador(a)';
    const base = `[SOS - ${tipo}] ${TITULO_OFICIAL_RARU} • ${SUBTITULO_OFICIAL_RARU}\nNome: ${nomeFinal}\nBairro: Rocha Sobrinho / BNH / Banco de Areia - Mesquita RJ\n${sosObs ? 'Obs: ' + sosObs + '\n' : ''}Projeto: GADE - Grupo A Chave da Esperança / Projeto Cidadão Sensor`;
    setUltimaMsgPronta(base);
    if (navigator.clipboard) navigator.clipboard.writeText(base).catch(() => {});
    const agoraStr = tipo + ' - ' + new Date().toLocaleString('pt-BR');
    try { localStorage.setItem('cadeUltimoSOS', agoraStr); } catch (e) {}
    setHistoricoSOS('Último SOS: ' + agoraStr);
    setStatusSOS('Mensagem copiada e grupo aberto. Buscando GPS...');

    const abrirGrupo = window.open(GRUPO_GADE, '_blank');
    if (!abrirGrupo) window.location.href = GRUPO_GADE;

    if (navigator.geolocation) {
      navigator.geolocation.getCurrentPosition(
        p => {
          const comGps = base + `\nGPS: https://maps.google.com/?q=${p.coords.latitude},${p.coords.longitude}`;
          setUltimaMsgPronta(comGps);
          if (navigator.clipboard) navigator.clipboard.writeText(comGps).catch(() => {});
          setStatusSOS('GPS anexado e copiado.');
        },
        () => setStatusSOS('Mensagem pronta sem GPS.'),
        { timeout: 8000 }
      );
    }
  };

  const KIT_BASE = [
    { c: 'ÁGUA / COMIDA', itens: ['Água 2L por pessoa', 'Comida pronta / biscoito', 'Leite / mamadeira se tiver bebê'] },
    { c: 'LUZ / ENERGIA', itens: ['Lanterna + pilha', 'Carregador / power bank', 'Vela / fósforo'] },
    { c: 'DOCUMENTO / SAÚDE', itens: ['Documento com foto', 'Remédio de uso diário', 'Curativo / álcool / máscara'] },
    { c: 'SOBREVIVÊNCIA', itens: ['Muda de roupa seca', 'Cobertor / saco plástico', 'Dinheiro trocado / chave extra'] }
  ];

  const [kitCheck, setKitCheck] = useState(() => {
    try {
      const salvo = JSON.parse(localStorage.getItem('kitCADEv2') || 'null');
      if (salvo) return salvo;
    } catch (e) {}
    const def = {};
    KIT_BASE.forEach((g, gi) => g.itens.forEach((_, ii) => def[gi + '-' + ii] = false));
    return def;
  });

  const [kitExtras, setKitExtras] = useState(() => {
    try { return JSON.parse(localStorage.getItem('kitCADEextras') || '[]'); } catch (e) { return []; }
  });
  const [novoItem, setNovoItem] = useState('');

  const atualizarCheck = (k, val) => {
    const atualizado = { ...kitCheck, [k]: val };
    setKitCheck(atualizado);
    try { localStorage.setItem('kitCADEv2', JSON.stringify(atualizado)); } catch (e) {}
  };

  const addExtra = () => {
    if (!novoItem.trim()) return;
    const atualizados = [...kitExtras, novoItem.trim()];
    setKitExtras(atualizados);
    try { localStorage.setItem('kitCADEextras', JSON.stringify(atualizados)); } catch (e) {}
    setNovoItem('');
  };

  const removerExtra = (i) => {
    const atualizados = [...kitExtras];
    atualizados.splice(i, 1);
    setKitExtras(atualizados);
    try { localStorage.setItem('kitCADEextras', JSON.stringify(atualizados)); } catch (e) {}
  };

  const totalItens = Object.keys(kitCheck).length + kitExtras.length;
  const marcados = Object.values(kitCheck).filter(Boolean).length + kitExtras.filter((_, i) => kitCheck['extra-' + i]).length;
  const pct = totalItens ? Math.round((marcados / totalItens) * 100) : 0;

  const compartilharKit = () => {
    const nomeFinal = sosNome.trim() || userName || 'Morador(a)';
    const msg = `MEU KIT - ${TITULO_OFICIAL_RARU} • GADE / CIDADÃO SENSOR\nNome: ${nomeFinal}\nKit: ${pct}% pronto\nProjeto: GADE - Grupo A Chave da Esperança`;
    if (navigator.clipboard) navigator.clipboard.writeText(msg).catch(() => {});
    showToast('Kit copiado. Abrindo grupo GADE.');
    window.open(GRUPO_GADE, '_blank');
  };

  return (
    <div id="estacaoGADE" style={{ background: '#021a2a', border: '1px solid #00e5ff', borderRadius: '16px', padding: '14px', fontFamily: 'sans-serif', marginBottom: '16px' }}>
      <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', gap: '8px', flexWrap: 'wrap' }}>

        <span style={{ color: '#fff', fontSize: '11px', background: '#041e2e', padding: '4px 8px', borderRadius: '20px' }}>ROCHA SOBRINHO / BNH / BANCO DE AREIA</span>
      </div>
      <div style={{ color: '#fff', fontSize: '12px', opacity: .8, marginTop: '4px' }}>GADE - Grupo A Chave da Esperança / {TITULO_OFICIAL_RARU}</div>
      <button type="button" onClick={() => window.open(GRUPO_GADE, '_blank')} style={{ width: '100%', background: '#25D366', color: '#000', fontWeight: 'bold', border: 'none', padding: '13px', borderRadius: '10px', marginTop: '12px', cursor: 'pointer' }}>ENTRAR NO GRUPO GADE NO WHATSAPP</button>

      <div style={{ background: '#2a0505', border: '1px solid #ff3b30', borderRadius: '12px', padding: '12px', marginTop: '12px' }}>
        <div style={{ color: '#fff', fontWeight: 'bold' }}>2. SOS VIZINHANÇA - APERTOU, JÁ VAI</div>
        <input value={sosNome} onChange={e => setSosNome(e.target.value)} placeholder="Seu nome" style={{ width: '100%', padding: '11px', borderRadius: '10px', border: 'none', boxSizing: 'border-box', marginTop: '8px', marginBottom: '8px', color: '#000' }} />
        <input value={sosObs} onChange={e => setSosObs(e.target.value)} placeholder="Observação - ex: 2 crianças, idoso em casa" style={{ width: '100%', padding: '11px', borderRadius: '10px', border: 'none', boxSizing: 'border-box', marginBottom: '10px', color: '#000' }} />
        <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '8px' }}>
          <button type="button" onClick={() => sosCADE('PRECISO DE AJUDA')} style={{ background: '#ff3b30', color: '#fff', fontWeight: 'bold', border: 'none', padding: '14px', borderRadius: '10px', cursor: 'pointer' }}>PRECISO DE AJUDA</button>

          <button type="button" onClick={() => sosCADE('PRECISO DE REMÉDIO / COMIDA / ÁGUA')} style={{ background: '#00e5ff', color: '#000', fontWeight: 'bold', border: 'none', padding: '14px', borderRadius: '10px', cursor: 'pointer' }}>REMÉDIO / ÁGUA</button>
        </div>
        <div style={{ display: 'flex', gap: '8px', marginTop: '8px' }}>
          <button type="button" onClick={() => {

        <div style={{ background: '#021a2a', height: '10px', borderRadius: '20px', margin: '8px 0', overflow: 'hidden' }}><div style={{ height: '100%', width: `${pct}%`, background: pct === 100 ? '#00ff88' : pct >= 50 ? '#ffcc00' : '#00e5ff', transition: '.3s' }}></div></div>

              const k = gi + '-' + ii;
              return (

}

function RadarMeteorologicoModule({ perfilVozId }) {
  const [dados, setDados] = useState(() => ({ ...ESTADO_CLIMA_AUTOMATICO_92.municipios }));
  const [status, setStatus] = useState('Sincronizando 92 municípios + RainViewer + GOES-19...');
  const [cidadeSel1, setCidadeSel1] = useState('Mesquita');
  const [cidadeSel2, setCidadeSel2] = useState('Duque de Caxias');
  const [modoVisualizacao, setModoVisualizacao] = useState('radar');
  const [iframeKey, setIframeKey] = useState(0);
  const [rvFrames, setRvFrames] = useState(() => ESTADO_CLIMA_AUTOMATICO_92.rainviewerFrames);

  const chartTempRef = useRef(null);
  const chartRainRef = useRef(null);

  function corPorChuva(p) {
    if (p >= 70) return '#7C4DFF';
    if (p >= 40) return '#FF0055';
    if (p >= 20) return '#FFB703';
    return '#00FF9D';
  }
  function textoPorChuva(p) {
    if (p >= 70) return 'Muito forte';
    if (p >= 40) return 'Forte';
    if (p >= 20) return 'Moderada';
    return 'Fraca / Estável';
  }

  const desenharGraficoCanvas = (canvasRef, valores, cores, sufixo) => {
    const cv = canvasRef.current;
    if (!cv) return;
    const ctx = cv.getContext('2d');
    const W = cv.width = 340, H = cv.height = 140;
    ctx.clearRect(0, 0, W, H);
    const max = Math.max(...valores, 1);
    const step = W / valores.length;
    const horaAtual = new Date().getHours();

    valores.forEach((v, i) => {
      const h = (v / max) * (H - 35);
      const x = i * step + 4;
      const grad = ctx.createLinearGradient(0, H - h, 0, H);
      grad.addColorStop(0, cores[0]);
      grad.addColorStop(1, cores[1]);
      ctx.fillStyle = grad;
      ctx.fillRect(x, H - h - 20, step - 6, h);
      ctx.fillStyle = '#FFFFFF';
      ctx.font = 'bold 9px monospace';
      ctx.textAlign = 'center';
      ctx.fillText(v + sufixo, x + (step / 2), H - h - 23);

      const horaLabel = `${String((horaAtual + i) % 24).padStart(2, '0')}h`;
      ctx.fillStyle = '#00F2FE';
      ctx.font = '600 8px monospace';
      ctx.fillText(horaLabel, x + (step / 2), H - 6);
    });
  };

  const desenharGraficosHorarios = (hourly) => {
    if (!hourly) return;
    const h = new Date().getHours();
    const temps = [], chuvas = [];
    for (let i = 0; i < 12; i++) {
      const idx = (h + i) % 24;
      temps.push(Math.round(hourly.temperature_2m[idx] || 25));
      chuvas.push(hourly.precipitation_probability[idx] || 0);
    }
    setTimeout(() => {
      desenharGraficoCanvas(chartTempRef, temps, ['#ff5252', '#ffca28'], '°C');
      desenharGraficoCanvas(chartRainRef, chuvas, ['#7c4dff', '#29b6f6'], '%');
    }, 80);
  };

  useEffect(() => {
    const atualizarEstado = (snap) => {
      setDados({ ...snap.municipios });
      setRvFrames([...snap.rainviewerFrames]);
      setStatus(`${snap.statusRede} · Atualizado ${snap.atualizadoEm || ''}`);
    };
    sincronizarTelemetria92RJ(atualizarEstado);
    const t = setInterval(() => sincronizarTelemetria92RJ(atualizarEstado), 300000);
    return () => clearInterval(t);
  }, []);

  useEffect(() => {
    if (dados[cidadeSel1]?.hourly) {
      desenharGraficosHorarios(dados[cidadeSel1].hourly);
    }
  }, [cidadeSel1, dados, modoVisualizacao]);

  const PONTOS_BACIAS = [

    { rh: 'RH III', nome: 'Volta Redonda', lat: -22.45, lon: -44.15 },
    { rh: 'RH IV', nome: 'Petrópolis', lat: -22.35, lon: -43.05 },
    { rh: 'RH V', nome: 'Duque de Caxias', lat: -22.75, lon: -43.15 },
    { rh: 'RH VI', nome: 'Cabo Frio', lat: -22.85, lon: -42.30 },

  function posRadar(c) {

function ModuloCidadaoSensorModule({ onGoToDashboard, showToast }) {
  const [petKg, setPetKg] = useState(10);
  const [aluminioKg, setAluminioKg] = useState(3);
  const [ferroKg, setFerroKg] = useState(15);
  const [papelaoKg, setPapelaoKg] = useState(20);
  const [vidroKg, setVidroKg] = useState(5);
  const [oleoL, setOleoL] = useState(4);

  const precoPet = 2.50, precoAluminio = 8.00, precoFerro = 1.20, precoPapelao = 0.70, precoVidro = 0.35, precoOleo = 3.00;
  const [btConectado, setBtConectado] = useState(false);
  const [btStatus, setBtStatus] = useState("Desconectado");

  const totalPet = petKg * precoPet;
  const totalAluminio = aluminioKg * precoAluminio;
  const totalFerro = ferroKg * precoFerro;
  const totalPapelao = papelaoKg * precoPapelao;
  const totalVidro = vidroKg * precoVidro;
  const totalOleo = oleoL * precoOleo;

  const valorTotalReciclagem = totalPet + totalAluminio + totalFerro + totalPapelao + totalVidro + totalOleo;
  const pesoTotalKg = Number(petKg) + Number(aluminioKg) + Number(ferroKg) + Number(papelaoKg) + Number(vidroKg) + Number(oleoL);

  const aguaEconomizadaL = (petKg * 24) + (aluminioKg * 40) + (papelaoKg * 15);
  const co2EvitadoKg = (petKg * 1.5) + (aluminioKg * 9.0) + (ferroKg * 1.8) + (papelaoKg * 0.9);
  const volumeDesobstruidoM3 = (pesoTotalKg * 0.0035).toFixed(2);

    if (!navigator.bluetooth) { showToast("Web Bluetooth não suportado."); return; }

      setBtStatus("Buscando balança...");

        acceptAllDevices: true,
        optionalServices: ['battery_service', '0000181d-0000-1000-8000-00805f9b34fb']
      });
      setBtConectado(true);
      setBtStatus(`Conectado: ${device.name || 'Balança BT'}`);
      showToast(`Balança pareada: ${device.name || 'OK'}`);

        </div>

        <div className="bg-void/90 border border-cyberCyan/30 rounded-2xl p-3.5 flex flex-col sm:flex-row items-center justify-between gap-3 shadow-inner">
          <div className="flex items-center gap-2.5">
            <span className={`w-3 h-3 rounded-full ${btConectado ? 'bg-cyberGreen animate-ping' : 'bg-cyberRose'}`}></span>
            <div>
              <span className="text-[10px] font-black text-white block">HARDWARE DE PESAGEM BLUETOOTH</span>

function RedeAlquinoHardwareModule({ onGoToDashboard, showToast }) {
  const sensorId = "ALQ-92-MESQUITA";
  const [hardwareIpUrl, setHardwareIpUrl] = useState(() => {
    try { return localStorage.getItem("raru_alquino_ip") || "http://192.168.4.1/data"; } catch (e) { return "http://192.168.4.1/data"; }
  });
  const [statusHardware, setStatusHardware] = useState("AGUARDANDO CONEXÃO IP");
  const [gasLevel, setGasLevel] = useState("-- PPM");
  const [hidroLevel, setHidroLevel] = useState("-- m");
  const [tempHardware, setTempHardware] = useState("-- C");
  const [isConnecting, setIsConnecting] = useState(false);

  const salvarEConectarIP = async () => {
    try {
      localStorage.setItem("raru_alquino_ip", hardwareIpUrl);
      setIsConnecting(true);
      setStatusHardware("CONECTANDO AO IP...");
      showToast(`Conectando ao IP: ${hardwareIpUrl}`);
      const res = await fetch(hardwareIpUrl, { method: 'GET', mode: 'cors' });
      const data = await res.json();
      if (data) {
        setGasLevel(data.gas ? `${data.gas} PPM` : "14 PPM (Normal)");
        setHidroLevel(data.nivelAgua ? `${data.nivelAgua} m` : "0.35 m (Estável)");
        setTempHardware(data.temperatura ? `${data.temperatura} C` : "27.1 C");
        setStatusHardware("CONECTADO (ONLINE VIA IP)");
        showToast("Hardware Alquino Sincronizado.");
      }
    } catch (err) {
      setTimeout(() => {
        const gasRand = Math.floor(Math.random() * 25 + 8);
        const hidroRand = (Math.random() * 0.4 + 0.1).toFixed(2);
        setGasLevel(`${gasRand} PPM (Normal)`);
        setHidroLevel(`${hidroRand} m (Estável)`);
        setTempHardware("26.8 C");
        setStatusHardware("SIMULAÇÃO ATIVA (IP LOCAL)");
        showToast("Modo simulação IP ativado.");
      }, 800);
    } finally {
      setIsConnecting(false);
    }
  };

  return (
    <div className="space-y-3.5 w-full font-mono max-w-4xl mx-auto">
      <div className="cyber-card space-y-3.5 border border-cyberCyan/40 shadow-2xl p-4">
        <div className="flex items-center justify-between border-b border-cyberCyan/25 pb-2.5">
          <div className="space-y-0.5">
            <h2 className="font-display text-[11px] font-black text-white tracking-widest flex items-center gap-1.5">
              REDE ALQUINO - HARDWARE FÍSICO
            </h2>
            <p className="text-[8px] font-mono text-cyberCyan font-bold">ACOPLAMENTO DE APARELHAGEM TECNOLÓGICA • {TITULO_OFICIAL_RARU}</p>
          </div>
          <button type="button" onClick={onGoToDashboard} className="cyber-button text-[10px] py-2 px-3">PAINEL</button>
        </div>

        <div className="bg-void/90 border border-cyberCyan/40 p-3 rounded-xl space-y-2 shadow-inner">
          <label className="text-[9px] text-cyberCyan font-bold uppercase block">Endereço IP / URL do Microcontrolador</label>
          <div className="flex flex-col sm:flex-row gap-2">
            <input type="text" value={hardwareIpUrl} onChange={(e) => setHardwareIpUrl(e.target.value)} placeholder="Ex: http://192.168.4.1/data" className="flex-1 bg-deepSpace border border-cyberCyan/40 rounded-xl p-2.5 text-xs text-white font-mono touch-manipulation" />

              {isConnecting ? "CONECTANDO..." : "CONECTAR IP"}

        <div className="grid grid-cols-2 sm:grid-cols-4 gap-2.5">
          <div className="bg-void/90 border border-cyberCyan/30 rounded-xl p-3 space-y-0.5">
            <span className="text-[7px] text-slate-400 uppercase tracking-widest block">ID SENSOR</span>
            <span className="text-[10px] font-bold text-cyberCyan truncate block">{sensorId}</span>
          </div>
          <div className="bg-void/90 border border-cyberCyan/30 rounded-xl p-3 space-y-0.5">
            <span className="text-[7px] text-slate-400 uppercase tracking-widest block">STATUS</span>
            <span className="text-[10px] font-bold text-cyberGreen truncate block">{statusHardware}</span>
          </div>
          <div className="bg-void/90 border border-cyberCyan/30 rounded-xl p-3 space-y-0.5">
            <span className="text-[7px] text-slate-400 uppercase tracking-widest block">GASES</span>
            <span className="text-[10px] font-bold text-white truncate block">{gasLevel}</span>

          <div className="bg-void/90 border border-cyberCyan/30 rounded-xl p-3 space-y-0.5">

        <div className="bg-void/80 border border-cyberCyan/20 rounded-xl p-2.5 flex items-center justify-between text-[10px]">

  });

    const mSnap = ESTADO_CLIMA_AUTOMATICO_92.municipios[municipioSelecionado.n];

      ? `Tô contigo aqui na subestação de ${municipioSelecionado.n}, ${userName}. ${baseClima}`
      : `Tô contigo aqui na subestação de ${municipioSelecionado.n}. ${baseClima}`);
    setSarahState({ isSpeaking: true, speechText: textoFala });
    if (soundEnabled) falarImitada(textoFala, perfilVozId || vozSelecionada);
    setTimeout(() => setSarahState(prev => ({ ...prev, isSpeaking: false })), 4000);
  };

  const desenharGraficoCanvas = (canvasRef, valores, cores, label) => {
    const cv = canvasRef.current;
    if (!cv) return;
    const ctx = cv.getContext('2d');
    const W = cv.width = 320, H = cv.height = 140;
    ctx.clearRect(0, 0, W, H);
    const max = Math.max(...valores, 1);
    const step = W / valores.length;
    valores.forEach((v, i) => {
      const h = (v / max) * (H - 30);
      const x = i * step + 4;
      const grad = ctx.createLinearGradient(0, H - h, 0, H);
      grad.addColorStop(0, cores[0]); grad.addColorStop(1, cores[1]);
      ctx.fillStyle = grad;
      ctx.fillRect(x, H - h - 15, step - 6, h);
      ctx.fillStyle = '#00F2FE'; ctx.font = 'bold 9px monospace';
      ctx.fillText(v + label, x, H - h - 18);
    });
  };

  const desenharGraficosEstacao = (hourly) => {
    const h = new Date().getHours();
    const temps = [], probs = [];
    for (let i = 0; i < 8; i++) {
      const idx = (h + i) % 24;
      temps.push(Math.round(hourly.temperature_2m[idx] || 25));
      probs.push(hourly.precipitation_probability[idx] || 0);
    }
    desenharGraficoCanvas(chartTempRef, temps, ['#ff5252', '#ffca28'], '°');
    desenharGraficoCanvas(chartRainRef, probs, ['#7c4dff', '#29b6f6'], '%');

  useEffect(() => {

    if (mSnap?.hourly && estacaoSubTab === 'graficos') {
      setTimeout(() => desenharGraficosEstacao(mSnap.hourly), 150);

    setIsScanning(true);
    falarESarahInteragir("Vamo varrer o Bluetooth aqui rapidinho pra achar os nós P2P.");

      setIsScanning(false);

      ]);
      showToast("2 Nós P2P acoplados com sucesso.");
    }, 1500);
  };

  const adicionarZeladoria = (e) => {
    e.preventDefault();
    if (!acaoZel || !localZel) { showToast("Preencha a ação e o local."); return; }
    const novo = { id: Date.now(), acao: acaoZel, local: localZel, resp: userName || "Operador GADE", data: new Date().toLocaleDateString('pt-BR'), status: "Registrado" };
    const atualizados = [novo, ...zeladoriaLogs];
    setZeladoriaLogs(atualizados);
    try { localStorage.setItem("raru_zeladoria_logs", JSON.stringify(atualizados)); } catch (e) {}
    setAcaoZel(''); setLocalZel('');
    showToast("Atividade salva no Diário de Zeladoria.");
  };

  return (
    <div className="space-y-4 font-mono w-full max-w-5xl mx-auto">
      <div className="cyber-card p-5 flex flex-col md:flex-row items-center gap-5 relative overflow-hidden border border-cyberCyan/60 shadow-2xl">
        <div className="absolute inset-0 cloud-layer-anim"></div>
        <div onClick={() => falarESarahInteragir()} className="cursor-pointer shrink-0 touch-manipulation z-10">
          <SarahAnimatedAvatar isSpeaking={sarahState.isSpeaking} />
        </div>
        <div className="flex-1 text-center md:text-left space-y-3 z-10 w-full">
          <div className="inline-flex items-center gap-2 px-3.5 py-1.5 rounded-full bg-cyberCyan/10 border border-cyberCyan/30 text-cyberCyan text-xs font-bold">

          <p className="text-xs sm:text-sm text-slate-200 bg-black/70 p-3.5 rounded-xl border border-cyberCyan/20 leading-relaxed font-mono">
            &quot;{sarahState.speechText}&quot;
          </p>
        </div>
      </div>

      <div className="cyber-card p-4 border border-cyberCyan/50 space-y-4 shadow-2xl">

function VistoriaRARU_NEXUS({ onBackToDashboard, showToast, vozSelecionada, perfilVozId, userName }) {
  const RASCUNHO_KEY = "raru_nexus_v11_2_scan_rascunho";

  const carregarRascunhoInicial = () => {
    try {
      const raw = localStorage.getItem(RASCUNHO_KEY);
      if (raw) {
        const d = JSON.parse(raw);
        if (d && typeof d === "object") return d;
      }
    } catch (e) {}
    return null;
  };

  const rascunhoInit = carregarRascunhoInicial();

  const [munIdx, setMunIdx] = useState(() => {
    const idx = Number(rascunhoInit?.municipioIdx);
    return (!Number.isNaN(idx) && MUNICIPIOS_92[idx]) ? idx : 0;
  });
  const mun = MUNICIPIOS_92[munIdx] || MUNICIPIOS_92[0];

  const [vozLigada, setVozLigada] = useState(true);
  const [vozAtivada, setVozAtivada] = useState(false);
  const [statusVoz, setStatusVoz] = useState(rascunhoInit ? "Rascunho automático restaurado. Toque em ATIVAR VOZ para começar" : "Toque em ATIVAR VOZ para começar");
  const [textoBalao, setTextoBalao] = useState(`Oi! Eu sou a Sarah, do ${TITULO_OFICIAL_RARU}. Primeiro toque em ATIVAR VOZ.`);

  const [tipoOcorrencia, setTipoOcorrencia] = useState(() => rascunhoInit?.tipoOcorrencia || "BURACOS NA VIA");
  const [categoriaOcorrencia, setCategoriaOcorrencia] = useState(() => rascunhoInit?.categoriaOcorrencia || "MANUTENÇÃO / ZELADORIA");
  const [angulo, setAngulo] = useState(() => typeof rascunhoInit?.angulo === "number" ? rascunhoInit.angulo : 0);
  const [scanAtivo, setScanAtivo] = useState(() => typeof rascunhoInit?.scanAtivo === "boolean" ? rascunhoInit.scanAtivo : true);
  const [cameraExpandida, setCameraExpandida] = useState(false);

  const [foto, setFoto] = useState("");
  const [infoFoto, setInfoFoto] = useState("Foto leve - base64 compactado");
  const [camOn, setCamOn] = useState(false);
  const [ligandoCam, setLigandoCam] = useState(false);
  const [capturandoFoto, setCapturandoFoto] = useState(false);
  const [zoomLevel, setZoomLevel] = useState(1);
  const [maxZoom, setMaxZoom] = useState(5);
  const [hasZoomSupport, setHasZoomSupport] = useState(false);

  const [nome, setNome] = useState(() => rascunhoInit?.nome || userName || "");
  const [bairro, setBairro] = useState(() => rascunhoInit?.bairro || "");
  const [rel, setRel] = useState(() => rascunhoInit?.relato || "");
  const [gps, setGps] = useState({ lat: 0, lon: 0, acc: "" });
  const [isAiAnalyzing, setIsAiAnalyzing] = useState(false);
  const [clima, setClima] = useState(null);
  const [sha256Hash, setSha256Hash] = useState("");
  const [frenteSelecionada, setFrenteSelecionada] = useState(() => rascunhoInit?.frente || FRENTES_EQUIPES_TABELA[5]);
  const [sAtiva, setSAtiva] = useState("");
  const [vento, setVento] = useState(0);

  const audioCtxRef = useRef(null);
  const oscRef = useRef(null);
  const sInterRef = useRef(null);
  const sTimerRef = useRef(null);
  const videoRef = useRef(null);
  const streamRef = useRef(null);
  const trackRef = useRef(null);

  const RISCOS_RARU = [
    "R1 - BAIXO / PREVENTIVO",
    "R2 - MODERADO / ALERTA",
    "R3 - ALTO / ENXURRADA",
    "R4 - EVACUAÇÃO PREVENTIVA",
    "RH - CONVERGÊNCIA SERRAS",
    "RE - ESTRUTURAL / TALUDE"
  ];
  const [risco, setRisco] = useState(() => {
    if (rascunhoInit?.risco && RISCOS_RARU.includes(rascunhoInit.risco)) return rascunhoInit.risco;
    return RISCOS_RARU[1];
  });
  const [protAtual, setProtAtual] = useState("");

  const vozAtiva = perfilVozId || vozSelecionada;
  const isAlerta = categoriaOcorrencia.includes("ALERTA");

  useEffect(() => {
    try {
      localStorage.setItem(RASCUNHO_KEY, JSON.stringify({
        nome,
        bairro,
        municipioIdx: munIdx,
        risco,
        relato: rel,
        frente: frenteSelecionada,
        tipoOcorrencia,
        categoriaOcorrencia,
        angulo,
        scanAtivo
      }));
    } catch (e) {}
  }, [nome, bairro, munIdx, risco, rel, frenteSelecionada, tipoOcorrencia, categoriaOcorrencia, angulo, scanAtivo]);

  useEffect(() => {
    if (!mun?.lat) return;
    fetch(`https://api.open-meteo.com/v1/forecast?latitude=${mun.lat}&longitude=${mun.lon}&current=temperature_2m,precipitation,wind_speed_10m,wind_gusts_10m&timezone=auto`)
      .then(r => r.json())
      .then(d => {
        setClima(d.current);
        setVento(d.current?.wind_gusts_10m || d.current?.wind_speed_10m || 0);
      })
      .catch(() => {});
  }, [mun]);

  useEffect(() => {
    return () => {
      pararSirenes();
      if (streamRef.current) streamRef.current.getTracks().forEach(t => t.stop());
    };
  }, []);

  const falarSarahLocal = (txt) => {
    setTextoBalao(txt);
    if (!vozLigada) {
      setStatusVoz("Voz desligada - Leia no balão");
      return;
    }
    if (!vozAtivada) {
      setStatusVoz("Toque em ATIVAR VOZ primeiro!");
      return;
    }
    if (!("speechSynthesis" in window)) {
      setStatusVoz("Seu navegador não tem voz - Leia no balão");
      return;
    }
    try {
      window.speechSynthesis.cancel();
      window.speechSynthesis.resume();
      const vozObj = escolherVozPtBr(vozAtiva);
      let grupo = "", blocos = [];
      for (const f of (txt.match(/[^.!?]+[.!?]+/g) || [txt])) {
        if ((grupo + " " + f).length > 180 && grupo) {
          blocos.push(grupo.trim());
          grupo = f;
        } else {
          grupo = (grupo ? grupo + " " : "") + f;
        }
      }
      if (grupo.trim()) blocos.push(grupo.trim());
      blocos.forEach((p, i) => {
        const m = new SpeechSynthesisUtterance(p);
        m.lang = "pt-BR";
        m.rate = 1;
        m.pitch = 1.05;
        if (vozObj) m.voice = vozObj;
        if (i === blocos.length - 1) m.onend = () => setStatusVoz("Pronta - Voz ligada");
        window.speechSynthesis.speak(m);
      });
    } catch (e) {}
  };

  const ativarVozSarah = () => {
    if (!("speechSynthesis" in window)) {
      setStatusVoz("Seu navegador não tem voz. Use o Chrome no Android.");
      return;
    }
    try {
      window.speechSynthesis.cancel();
      window.speechSynthesis.resume();
      setVozAtivada(true);
      setVozLigada(true);
      setStatusVoz("Voz ativada - Sarah está falando...");
      const msg = `Oi! Eu sou a Sarah, do ${TITULO_OFICIAL_RARU}, Rede Automatizada de Resiliência Climática e Urbana. Agora minha voz está ativada.`;
      setTextoBalao(msg);
      const t = new SpeechSynthesisUtterance(msg);
      t.lang = "pt-BR";
      const vObj = escolherVozPtBr(vozAtiva);
      if (vObj) t.voice = vObj;
      window.speechSynthesis.speak(t);
    } catch (e) {}
  };

  const pausarFalaSarah = () => {
    if ("speechSynthesis" in window) {
      try { window.speechSynthesis.cancel(); } catch (e) {}
    }
    setStatusVoz("Fala pausada");
  };

  const alternarVozSarah = () => {
    const next = !vozLigada;
    setVozLigada(next);
    setStatusVoz(next ? "Pronta - Voz ligada" : "Voz desligada - Leia no balão");
    if (!next) pausarFalaSarah();
  };

  const pararSirenes = () => {
    setSAtiva("");
    if (sInterRef.current) clearInterval(sInterRef.current);
    if (sTimerRef.current) clearTimeout(sTimerRef.current);
    try {
      if (oscRef.current) oscRef.current.stop();
      if (audioCtxRef.current) audioCtxRef.current.close();
    } catch (e) {}
    audioCtxRef.current = null;
    oscRef.current = null;
  };

  const alternarSirene = (t) => {
    if (sAtiva === t) {
      pararSirenes();
      showToast("Sirene parada.");
      return;
    }
    pararSirenes();
    setSAtiva(t);
    showToast(`Sirene ${t === "russo" ? "Alarme Russo" : "Alerta 2"} disparada por 5 minutos.`);
    falarSarahLocal("Acionei o alerta preditivo aqui. Vamos ficar de olho.");
    try {
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      ctx.resume();
      const osc = ctx.createOscillator();
      const g = ctx.createGain();
      osc.type = t === "russo" ? "sawtooth" : "sine";
      osc.frequency.value = t === "russo" ? 450 : 600;
      g.gain.value = 0.15;
      osc.connect(g);
      g.connect(ctx.destination);
      osc.start();
      audioCtxRef.current = ctx;
      oscRef.current = osc;
      let up = true;
      sInterRef.current = setInterval(() => {
        let f = osc.frequency.value;
        if (up) {
          f += (t === "russo" ? 30 : 20);
          if (f >= 950) up = false;
        } else {
          f -= (t === "russo" ? 30 : 20);
          if (f <= 350) up = true;
        }
        osc.frequency.value = f;
      }, 60);
      sTimerRef.current = setTimeout(() => pararSirenes(), 300000);
    } catch (e) {}
  };

  const pararCamera = () => {
    if (streamRef.current) streamRef.current.getTracks().forEach(t => t.stop());
    streamRef.current = null;
    trackRef.current = null;
    setCamOn(false);
    setLigandoCam(false);
    setHasZoomSupport(false);
    setZoomLevel(1);
  };

  const abrirCamera = async () => {
    setLigandoCam(true);
    try {
      const s = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: { ideal: "environment" }, width: { ideal: 1280 }, height: { ideal: 720 } },
        audio: false
      });
      streamRef.current = s;
      const track = s.getVideoTracks()[0];
      trackRef.current = track;
      if (track && typeof track.getCapabilities === 'function') {
        const caps = track.getCapabilities();
        if (caps.zoom) {
          setHasZoomSupport(true);
          setMaxZoom(caps.zoom.max || 5);
          setZoomLevel(caps.zoom.min || 1);
        }
      }
      if (videoRef.current) {
        videoRef.current.srcObject = s;
        await videoRef.current.play();
      }
      setCamOn(true);
      setLigandoCam(false);
      showToast("Câmera ligada.");
      falarSarahLocal("Câmera aberta. Mira no ponto certinho e tira a foto.");
    } catch (e) {
      setLigandoCam(false);
      showToast("Câmera não disponível ou bloqueada.");
    }
  };

  const ajustarZoom = async (novoZoom) => {
    const val = Math.max(1, Math.min(maxZoom, Number(novoZoom)));
    setZoomLevel(val);
    const track = trackRef.current;
    if (track && typeof track.applyConstraints === 'function') {
      try {
        await track.applyConstraints({ advanced: [{ zoom: val }] });
      } catch (e) {}
    }
  };

  const baixarFotoRaru = (dataUrl) => {
    try {
      const a = document.createElement('a');
      a.href = dataUrl;
      a.download = `VISTORIA_${TITULO_OFICIAL_RARU.replace(/\s+/g, '_')}_${mun.n.replace(/\s+/g, '_')}_${Date.now()}.jpg`;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
    } catch (e) {}
  };

  const capturarFoto = async () => {
    const v = videoRef.current;
    if (!v || !camOn || capturandoFoto) return;
    setCapturandoFoto(true);

    let latTxt = gps.lat ? gps.lat.toFixed(6) : "N/D";
    let lonTxt = gps.lon ? gps.lon.toFixed(6) : "N/D";
    let accTxt = gps.acc ? `±${Math.round(gps.acc)}m` : "";
    let coordsObj = { lat: gps.lat, lon: gps.lon, acc: gps.acc };

    if ((!gps.lat || !gps.lon) && navigator.geolocation) {
      try {
        const pos = await new Promise((resolve, reject) => {
          navigator.geolocation.getCurrentPosition(resolve, reject, { enableHighAccuracy: true, timeout: 4500 });
        });
        coordsObj = { lat: pos.coords.latitude, lon: pos.coords.longitude, acc: pos.coords.accuracy };
        setGps(coordsObj);
        latTxt = coordsObj.lat.toFixed(6);
        lonTxt = coordsObj.lon.toFixed(6);
        accTxt = coordsObj.acc ? `±${Math.round(coordsObj.acc)}m` : "";
      } catch (e) {}
    }

    const agora = new Date();
    const dataHoraBr = agora.toLocaleString('pt-BR', { hour12: false });
    const protocolo = protAtual || ("RARU-" + agora.getFullYear() + "-" + String(agora.getMonth() + 1).padStart(2, '0') + String(agora.getDate()).padStart(2, '0') + "-" + Math.floor(1000 + Math.random() * 9000));
    if (!protAtual) setProtAtual(protocolo);

    const c = document.createElement("canvas");
    c.width = v.videoWidth || 1280;
    c.height = v.videoHeight || 720;
    const ctx = c.getContext("2d");
    ctx.drawImage(v, 0, 0, c.width, c.height);

    if (angulo !== 0) {
      const cx = c.width / 2, cy = c.height / 2;
      const rad = (angulo * Math.PI) / 180;
      const raio = Math.min(c.width, c.height) * 0.34;
      ctx.save();
      ctx.strokeStyle = "rgba(255, 255, 255, 0.85)";
      ctx.lineWidth = Math.max(2, Math.round(c.width / 360));
      ctx.beginPath();
      ctx.moveTo(cx, cy);
      ctx.lineTo(cx + Math.cos(rad) * raio, cy + Math.sin(rad) * raio);
      ctx.stroke();
      ctx.fillStyle = "#00F2FE";
      ctx.beginPath();
      ctx.arc(cx + Math.cos(rad) * raio, cy + Math.sin(rad) * raio, Math.max(5, Math.round(c.width / 160)), 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }

    const blocoAltura = Math.max(115, Math.round(c.height * 0.16));
    const yBase = c.height - blocoAltura;
    ctx.fillStyle = "rgba(3, 7, 18, 0.88)";
    ctx.fillRect(0, yBase, c.width, blocoAltura);
    ctx.fillStyle = "#ff0000";
    ctx.fillRect(0, yBase, c.width, 3);

    const fontSize = Math.max(12, Math.round(c.width / 46));
    ctx.font = `bold ${fontSize}px monospace`;
    ctx.textBaseline = "top";
    const maxW = c.width - 28;
    const linha1 = `${TITULO_OFICIAL_RARU} • ${tipoOcorrencia}`;
    const linha2 = `PROT: ${protocolo} | ${dataHoraBr} | MUN: ${mun.n.toUpperCase()} | RISCO: ${risco}`;
    const linha3 = `GPS: LAT ${latTxt} LON ${lonTxt} ${accTxt} | BAIRRO: ${bairro || "N/D"} | RESP: ${nome || userName || "N/D"}`;

    let yCursor = yBase + 10;
    const linhasCarimbo = [
      ...quebrarTextoCanvas(ctx, linha1, maxW).map((t, idx) => ({ t, cor: idx === 0 ? "#00F2FE" : "#00FF9D" })),
      ...quebrarTextoCanvas(ctx, linha2, maxW).map(t => ({ t, cor: "#FFFFFF" })),
      ...quebrarTextoCanvas(ctx, linha3, maxW).map(t => ({ t, cor: "#FFB703" }))
    ];
    for (const item of linhasCarimbo) {
      if (yCursor + fontSize > c.height - 6) break;
      ctx.fillStyle = item.cor;
      ctx.fillText(item.t, 14, yCursor);
      yCursor += fontSize + 4;
    }

    const d = c.toDataURL("image/jpeg", 0.72);
    const hashStr = await calcularSHA256(`${d.slice(0, 1200)}|${protocolo}|${dataHoraBr}|${latTxt}|${lonTxt}|${tipoOcorrencia}`);
    setSha256Hash(hashStr);
    setFoto(d);
    setInfoFoto(`Carimbada & Baixada (${Math.round(d.length / 1024)}KB)`);
    baixarFotoRaru(d);
    pararCamera();
    setCapturandoFoto(false);
    showToast("Foto capturada, carimbada e baixada no aparelho.");
    falarSarahLocal(`Foto tirada, carimbada e baixada. Protocolo ${protocolo}.`);
  };

  const pegarGPS = () => {
    if (!navigator.geolocation) {
      showToast("GPS não suportado neste dispositivo.");
      return;
    }
    showToast("Buscando GPS exato...");
    navigator.geolocation.getCurrentPosition(
      p => {
        setGps({ lat: p.coords.latitude, lon: p.coords.longitude, acc: p.coords.accuracy });
        showToast(`GPS pego: ${p.coords.latitude.toFixed(5)}, ${p.coords.longitude.toFixed(5)}`);
        falarSarahLocal("Peguei a localização do GPS.");

      () => showToast("GPS não autorizado ou sem sinal."),

  const autoPreencherRelatoIA = async () => {

          <div style={{ fontSize: '10px', color: '#00ff88', marginBottom: '6px' }}>

        </div>
      </div>

      <div style={{ background: '#091a2e', border: '1px solid rgba(255,51,102,0.45)', borderRadius: '14px', padding: '12px' }}>
        <b style={{ color: '#ff5252', fontSize: '12px', display: 'block', marginBottom: '8px' }}>ALARMES SONOROS PREVENTIVOS</b>
        <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '8px' }}>
          <button type="button" onClick={() => alternarSirene("russo")} style={{ background: sAtiva === "russo" ? '#ff0055' : '#1e1b4b', color: '#fff', border: '1px solid #ff0055', padding: '10px', borderRadius: '10px', fontSize: '11px', fontWeight: 800, cursor: 'pointer' }}>

    </div>
  );
}

function SarahChatModal({ isOpen, onClose, municipioAtual, bairroAtual, abaAtual, userName, onAtualizarNome, perfilVozId }) {
  const [messages, setMessages] = useState(() => {
    try {
      const saved = localStorage.getItem("sarah_chat_historico_v11");
      if (saved) return JSON.parse(saved);
    } catch (e) {}
    return [{
      role: 'assistant',
      content: userName
        ? `Tô aqui no ${TITULO_OFICIAL_RARU}, ${userName}. Como tá o clima e o movimento aí em ${bairroAtual} (${municipioAtual})?`
        : `Tô aqui no ${TITULO_OFICIAL_RARU} — ${SUBTITULO_OFICIAL_RARU}, acompanhando os 92 municípios do RJ com GOES-19 e RainViewer. Qual é o seu nome e o que você manda?`
    }];
  });
  const [inputText, setInputText] = useState("");
  const [isLoading, setIsLoading] = useState(false);
  const [isListening, setIsListening] = useState(false);

  const messagesEndRef = useRef(null);
  const recognitionRef = useRef(null);

  useEffect(() => {
    try { localStorage.setItem("sarah_chat_historico_v11", JSON.stringify(messages)); } catch (e) {}
  }, [messages]);

  useEffect(() => {
    if (isOpen) messagesEndRef.current?.scrollIntoView({ behavior: "smooth" });
  }, [messages, isOpen]);

  const sendMessage = async (textOverride = null) => {
    const rawText = typeof textOverride === "string" ? textOverride : inputText;
    const trimmed = rawText.trim();
    if (!trimmed || isLoading) return;

    let nomeAtual = userName;
    const mNome = trimmed.match(/(?:meu nome [ée]|me chamo|pode me chamar de|sou o|sou a)\s+([a-zà-ú]+)/i);
    if (mNome && mNome[1]) {
      nomeAtual = mNome[1].charAt(0).toUpperCase() + mNome[1].slice(1).toLowerCase();
      if (onAtualizarNome) onAtualizarNome(nomeAtual);
    }

    const updatedMsgs = [...messages, { role: 'user', content: trimmed }];
    setMessages(updatedMsgs);
    if (typeof textOverride !== "string") setInputText("");
    setIsLoading(true);

    const apiMessages = updatedMsgs.map(m => ({ role: m.role, content: m.content }));
    const climaAtualMun = ESTADO_CLIMA_AUTOMATICO_92.municipios[municipioAtual] || null;
    const reply = await chamarSarah('conversa', apiMessages, municipioAtual, bairroAtual, abaAtual, climaAtualMun, nomeAtual);
    const replySemCalma = bloquearCalmaAlexander(reply);

    setMessages([...updatedMsgs, { role: 'assistant', content: replySemCalma }]);
    setIsLoading(false);
    falarImitada(replySemCalma, perfilVozId);
  };

  const toggleVoice = () => {
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SpeechRecognition) {
      alert("Reconhecimento de voz não disponível no navegador.");
      return;
    }
    if (isListening) {
      recognitionRef.current?.stop();
      setIsListening(false);
      return;
    }
    const recognition = new SpeechRecognition();
    recognition.lang = 'pt-BR';
    recognition.interimResults = false;
    recognitionRef.current = recognition;
    setIsListening(true);

    recognition.onresult = (event) => {
      const transcript = event.results[0][0].transcript;
      setIsListening(false);
      sendMessage(transcript);
    };
    recognition.onerror = () => setIsListening(false);
    recognition.onend = () => setIsListening(false);
    recognition.start();
  };

  if (!isOpen) return null;

  return (

}

function ModalNomeOperador({ isOpen, onClose, userName, onSaveName, showToast }) {
  const [nomeInput, setNomeInput] = useState(userName || "");
  useEffect(() => { setNomeInput(userName || ""); }, [userName, isOpen]);
  if (!isOpen) return null;

  const salvar = (e) => {
    e.preventDefault();
    const limpo = nomeInput.trim();
    onSaveName(limpo);
    if (showToast) showToast(limpo ? `Nome salvo: ${limpo}` : "Nome limpo.");
    onClose();
  };

  return (
    <div className="fixed inset-0 z-[130] flex items-center justify-center bg-void/90 backdrop-blur-xl p-4" onClick={onClose}>
      <div className="cyber-card w-full max-w-sm rounded-2xl border border-cyberCyan/60 p-4 space-y-3 font-mono" onClick={e => e.stopPropagation()}>
        <div className="flex items-center justify-between border-b border-cyberCyan/25 pb-2">
          <span className="text-xs font-black text-cyberCyan uppercase">IDENTIFICAÇÃO NA SESSÃO</span>
          <button type="button" onClick={onClose} className="cyber-button-danger text-xs py-1 px-2.5 !min-h-[30px]">FECHAR</button>
        </div>
        <p className="text-[11px] text-slate-300 leading-relaxed">
          Digite o nome da pessoa que está usando o aplicativo para que a Sarah e o robô chamem pelo nome com naturalidade.
        </p>
        <form onSubmit={salvar} className="space-y-3">
          <input
            type="text"
            value={nomeInput}
            onChange={e => setNomeInput(e.target.value)}
            placeholder="Ex: Ana, Carlos, Marina..."
            className="w-full bg-void border border-cyberCyan/40 rounded-xl px-3 py-2.5 text-xs text-white permitir-selecao"
          />
          <div className="flex gap-2">
            <button type="submit" className="cyber-button-solid flex-1 text-xs py-2.5">SALVAR NOME</button>

          </div>
        </form>
      </div>

  );
