<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel Climático Inteligente - Comunidade do Sebinho</title>
    
    <!-- CSS oficial do Leaflet -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css" />
    
    <style>
        .mapa-container {
            width: 100%;
            max-width: 1000px;
            margin: 10px auto;
            position: relative;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            box-sizing: border-box;
            padding: 0 10px;
        }

        #mapa-sebinho {
            width: 100%;
            height: 70vh;
            min-height: 400px;
            max-height: 600px;
            border-radius: 12px;
            box-shadow: 0 12px 36px rgba(0, 0, 0, 0.5);
            border: 2px solid #00f0ff;
            background: #111;
            transition: all 0.3s ease;
        }

        #mapa-sebinho.tela-cheia {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            max-height: none;
            max-width: none;
            border-radius: 0;
            border: none;
            z-index: 9999;
        }

        .status-badge {
            position: absolute;
            top: 15px;
            right: 25px;
            z-index: 1000;
            background: rgba(10, 15, 30, 0.9);
            color: #00f0ff;
            padding: 6px 12px;
            border-radius: 4px;
            font-size: 10px;
            font-weight: bold;
            letter-spacing: 1px;
            display: flex;
            align-items: center;
            gap: 8px;
            border: 1px solid #00f0ff;
            pointer-events: none;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            background-color: #00ff66;
            border-radius: 50%;
            box-shadow: 0 0 8px #00ff66;
            animation: piscar 1s infinite alternate;
        }

        .painel-controles {
            position: absolute;
            top: 15px;
            left: 25px;
            z-index: 1000;
            background: rgba(10, 15, 30, 0.95);
            border: 1px solid #00f0ff;
            padding: 10px;
            border-radius: 6px;
            color: #fff;
            font-size: 11px;
            display: flex;
            flex-direction: column;
            gap: 6px;
            max-width: 240px;
        }

        .btn-acao {
            background: #00f0ff;
            color: #000;
            border: none;
            padding: 6px 10px;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
            transition: 0.2s;
            font-size: 11px;
            text-transform: uppercase;
            text-align: center;
        }

        .btn-acao:hover {
            background: #fff;
            box-shadow: 0 0 10px #00f0ff;
        }

        .btn-ia {
            background: #ff00ff;
            color: #fff;
        }
        .btn-ia:hover {
            background: #ff88ff;
            box-shadow: 0 0 10px #ff00ff;
        }

        .painel-ia-texto {
            margin-top: 6px;
            background: rgba(0, 240, 255, 0.1);
            border-left: 3px solid #00f0ff;
            padding: 8px;
            font-size: 11px;
            color: #e0fbfc;
            border-radius: 0 4px 4px 0;
            line-height: 1.4;
            max-height: 120px;
            overflow-y: auto;
        }

        .legenda-clima {
            position: absolute;
            bottom: 25px;
            right: 25px;
            z-index: 1000;
            background: rgba(10, 15, 30, 0.95);
            border: 1px solid #00f0ff;
            padding: 10px;
            border-radius: 6px;
            color: #fff;
            width: 170px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }

        .legenda-titulo {
            font-weight: bold;
            font-size: 10px;
            color: #00f0ff;
            margin-bottom: 6px;
            text-transform: uppercase;
        }

        .legenda-item {
            display: flex;
            align-items: center;
            gap: 6px;
            margin-bottom: 4px;
            font-size: 10px;
        }

        .cor-box {
            width: 20px;
            height: 10px;
            border-radius: 2px;
        }

        .radar-pulse {
            width: 24px; height: 24px;
            background: rgba(0, 240, 255, 0.3);
            border: 2px solid #00f0ff;
            border-radius: 50%;
            position: absolute;
            animation: pulsar 2s infinite ease-out;
        }
        .radar-center {
            width: 10px; height: 10px;
            background: #00f0ff;
            border-radius: 50%;
            position: absolute;
            top: 7px; left: 7px;
            box-shadow: 0 0 12px #00f0ff;
        }
        .mendanha-marker {
            width: 12px; height: 12px;
            background: #ff3300;
            border: 2px solid #fff;
            border-radius: 50%;
        }
        .alagamento-marker {
            width: 14px; height: 14px;
            background: #ffaa00;
            border: 2px solid #fff;
            border-radius: 50%;
            box-shadow: 0 0 10px #ffaa00;
        }

        @keyframes piscar { from { opacity: 0.3; } to { opacity: 1; } }
        @keyframes pulsar { 0% { transform: scale(1); opacity: 1; } 100% { transform: scale(3.5); opacity: 0; } }

        @media (max-width: 600px) {
            #mapa-sebinho { height: 50vh; }
            .status-badge { display: none; }
            .painel-controles {
                top: 10px; left: 10px; padding: 6px;
                width: calc(100% - 40px); max-width: none; flex-direction: column;
            }
            .legenda-clima { bottom: 15px; right: 15px; width: 140px; padding: 6px; }
        }
    </style>
</head>
<body>

    <div class="mapa-container" id="containerGeral">
        <div class="status-badge">
            <div class="status-dot"></div>
            MONITORAMENTO LIVE (GROQ IA)
        </div>

        <div class="painel-controles">
            <button class="btn-acao btn-ia" id="btnGerarIA">🤖 FALAR COM A IA GROQ</button>
            <button class="btn-acao" id="btnRadar">OCULTAR CHUVA</button>
            <button class="btn-acao" id="btnProporcao" style="background: #fff; color: #000;">TELA CHEIA</button>
            <div class="painel-ia-texto" id="statusIA">
                IA Pronta. Clique para gerar o boletim de monitoramento da comunidade.
            </div>
        </div>

        <div class="legenda-clima">
            <div class="legenda-titulo">Indicadores</div>
            <div class="legenda-item"><div class="cor-box" style="background: #00f0ff;"></div> Sebinho / Eixo</div>
            <div class="legenda-item"><div class="cor-box" style="background: #ff3300;"></div> Serra do Mendanha</div>
            <div class="legenda-item"><div class="cor-box" style="background: #3399ff;"></div> Rios (Sarapuí / Eugênia)</div>
            <div class="legenda-item"><div class="cor-box" style="background: #ffaa00;"></div> Ponto Crítico / Alag.</div>
        </div>
        
        <div id="mapa-sebinho"></div>
    </div>

    <!-- Script oficial do Leaflet -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
    <script>
        // Chave de integração da Groq configurada no ambiente
        const GROQ_API_KEY = "gsk_7pPj7l8K1s9m3n4v5x6z2w0y1b4c5d6e7f8g9h0i1j2k3l4m";

        const latSebinho = -22.7979; 
        const lngSebinho = -43.4116;
        const latMendanha = -22.8140; 
        const lngMendanha = -43.4940;

        const map = L.map('mapa-sebinho', {
            center: [-22.8060, -43.4528], 
            zoom: 13,
            zoomControl: false 
        });

        L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
            attribution: 'Tiles &copy; Esri'
        }).addTo(map);

        const timestampAtual = Math.floor(Date.now() / 1000) - (Math.floor(Date.now() / 1000) % 600);
        let chuvaAtiva = true;
        const camadaChuva = L.tileLayer(`https://tile.rainviewer.com/${timestampAtual}/256/{z}/{x}/{y}/2/1_1.png`, {
            opacity: 0.65,
            zIndex: 200
        }).addTo(map);

        // Marcadores do Mapa
        const radarIcon = L.divIcon({
            html: '<div class="radar-pulse"></div><div class="radar-center"></div>',
            className: 'custom-radar-marker',
            iconSize: [24, 24], iconAnchor: [12, 12]
        });
        L.marker([latSebinho, lngSebinho], { icon: radarIcon }).addTo(map)
         .bindPopup('<b>Comunidade do Sebinho</b><br>Rua Amazonas - Monitoramento Ativo');

        const mendanhaIcon = L.divIcon({
            html: '<div class="mendanha-marker"></div>',
            className: 'custom-mendanha-marker',
            iconSize: [12, 12], iconAnchor: [6, 6]
        });
        L.marker([latMendanha, lngMendanha], { icon: mendanhaIcon }).addTo(map)
         .bindPopup('<b>Serra do Mendanha</b><br>Cabeceira e escoamento hídrico');

        L.polyline([[latMendanha, lngMendanha], [latSebinho, lngSebinho]], {
            color: '#00f0ff', weight: 3, opacity: 0.6, dashArray: '8, 12'
        }).addTo(map);

        L.polyline([
            [-22.8200, -43.4700],
            [-22.8050, -43.4350],
            [-22.7900, -43.4000]
        ], { color: '#3399ff', weight: 4, opacity: 0.8 }).addTo(map)
         .bindPopup('<b>Bacia Hídrica / Rio Sarapuí e Dona Eugênia</b>');

        const alagamentoIcon = L.divIcon({
            html: '<div class="alagamento-marker"></div>',
            className: 'custom-alagamento',
            iconSize: [14, 14], iconAnchor: [7, 7]
        });
        L.marker([-22.8010, -43.4250], { icon: alagamentoIcon }).addTo(map)
         .bindPopup('<b>Ponto Crítico / Alagamento</b><br>Área de atenção por escoamento pluvial');

        function falarTexto(texto) {
            if (!('speechSynthesis' in window)) return;
            window.speechSynthesis.cancel();
            let utterance = new SpeechSynthesisUtterance(texto);
            utterance.lang = 'pt-BR';
            utterance.rate = 1.0;
            utterance.pitch = 1.0;
            window.speechSynthesis.speak(utterance);
        }

        async function consultarGroqIA() {
            const caixaStatus = document.getElementById('statusIA');
            caixaStatus.innerText = "🤖 Groq IA analisando o cenário e redigindo o boletim...";

            let statusChuvaDescricao = chuvaAtiva ? "O radar de chuva está ativo, monitorando áreas de precipitação." : "O radar de chuva está desativado no momento.";

            try {
                const response = await fetch("https://api.groq.com/openai/v1/chat/completions", {
                    method: "POST",
                    headers: {
                        "Authorization": `Bearer ${GROQ_API_KEY}`,
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        model: "llama-3.3-70b-versatile",
                        messages: [
                            {
                                role: "system",
                                content: "Você é a inteligência artificial atendente e central de comando operacional do Grupo Comunitário A Chave da Esperança na Comunidade do Sebinho (Rua Amazonas, Mesquita - RJ). Converse com os moradores transmitindo segurança, firmeza e orientações de prevenção contra enchentes e riscos das chuvas que descem da Serra do Mendanha e afetam os rios Sarapuí e Dona Eugênia. Seja direto e objetivo."
                            },
                            {
                                role: "user",
                                content: `Gere um boletim de monitoramento climático atual. Status atual: ${statusChuvaDescricao}`
                            }
                        ],
                        temperature: 0.7,
                        max_tokens: 250
                    })
                });

                if (!response.ok) throw new Error("Falha na comunicação com a Groq API.");

                const data = await response.json();
                const respostaIA = data.choices[0].message.content;

                caixaStatus.innerText = "🗣️ " + respostaIA;
                falarTexto(respostaIA);

            } catch (error) {
                console.error(error);
                caixaStatus.innerText = "❌ Erro ao consultar a IA da Groq.";
            }
        }

        document.getElementById('btnGerarIA').addEventListener('click', consultarGroqIA);

        document.getElementById('btnRadar').addEventListener('click', function() {
            if(chuvaAtiva) {
                map.removeLayer(camadaChuva);
                this.textContent = "MOSTRAR CHUVA";
                this.style.background = "#ff3300";
                this.style.color = "#fff";
            } else {
                map.addLayer(camadaChuva);
                this.textContent = "OCULTAR CHUVA";
                this.style.background = "#00f0ff";
                this.style.color = "#000";
            }
            chuvaAtiva = !chuvaAtiva;
        });

        let emTelaCheia = false;
        document.getElementById('btnProporcao').addEventListener('click', function() {
            const containerMapa = document.getElementById('mapa-sebinho');
            emTelaCheia = !emTelaCheia;
            
            if(emTelaCheia) {
                containerMapa.classList.add('tela-cheia');
                this.textContent = "NORMAL";
                this.style.background = "#ff3300";
                this.style.color = "#fff";
            } else {
                containerMapa.classList.remove('tela-cheia');
                this.textContent = "TELA CHEIA";
                this.style.background = "#fff";
                this.style.color = "#000";
            }
            setTimeout(() => { map.invalidateSize(); }, 200);
        });
    </script>
</body>
</html>
