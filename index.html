        function playChameleonSound() {
            try {
                const AudioCtx = window.AudioContext || window.webkitAudioContext;
                if (!AudioCtx) return;
                const ctx = new AudioCtx();
                if (ctx.state === 'suspended') ctx.resume();

                const bufferSize = ctx.sampleRate * 1.2;
                const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
                const data = buffer.getChannelData(0);
                for (let i = 0; i < bufferSize; i++) {
                    data[i] = (Math.random() * 2 - 1) * Math.sin(i / 800);
                }

                const noiseSource = ctx.createBufferSource();
                noiseSource.buffer = buffer;

                const filter = ctx.createBiquadFilter();
                filter.type = 'lowpass';
                filter.frequency.setValueAtTime(350, ctx.currentTime);
                filter.frequency.exponentialRampToValueAtTime(120, ctx.currentTime + 1.2);

                const gainNode = ctx.createGain();
                gainNode.gain.setValueAtTime(0.8, ctx.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 1.2);

                noiseSource.connect(filter);
                filter.connect(gainNode);
                gainNode.connect(ctx.destination);

                noiseSource.start();
            } catch (e) {
                console.log("Áudio bloqueado:", e);
            }
        }

        function VistoriaEPRCA_BlocosFuturistas({ onBackToDashboard, showToast }) {
            const videoRef = React.useRef(null);
            const canvasRef = React.useRef(null);
            const [municipio, setMunicipio] = React.useState("Mesquita");
            const [setor, setSetor] = React.useState(SETORES_FIXO_OFICIAL[0]);
            const [equipe, setEquipe] = React.useState("Iniciativa Grupo A Chave da Esperança");
            const [nivel, setNivel] = React.useState("🟢 Risco Baixo");
            const [agente, setAgente] = React.useState("");
            const [local, setLocal] = React.useState("");
            const [desc, setDesc] = React.useState("");
            const [gps, setGps] = React.useState({ lt: '', ln: '', lk: '' });
            const [gpsSt, setGpsSt] = React.useState("📍 GPS em espera");
            const [hash, setHash] = React.useState("...");
            const [cameraAtiva, setCameraAtiva] = React.useState(false);

            const [oc, setOc] = React.useState({
                deslizamento: false,
                alagamento: false,
                trincas: false,
                arvore: false,
                valao: false
            });

            const protocolo = React.useMemo(() => `EPRCA-BAIXADA-${municipio.substring(0,3).toUpperCase()}-2026-${Math.floor(1000 + Math.random() * 9000)}`, [municipio]);
            const getFinal = () => equipe.trim() ? `${setor} | ${equipe.trim()}` : setor;
            const gpsStrFmt = gps.lt ? `${gps.lt},${gps.ln}` : (local || "Rocha Sobrinho/Mesquita-RJ");

            const [fotos, setFotos] = React.useState([null, null, null, null]);

            React.useEffect(() => {
                const calcularHash = async () => {
                    try {
                        const s = municipio + setor + equipe + nivel + agente + local + desc + protocolo + JSON.stringify(oc);
                        const hb = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(s));
                        setHash(Array.from(new Uint8Array(hb)).map(b => b.toString(16).padStart(2, '0')).join('').substring(0, 32) + "...");
                    } catch (e) {
                        setHash("sha256-ok");
                    }
                };
                calcularHash();
            }, [municipio, setor, equipe, nivel, agente, local, desc, protocolo, oc]);

            const capturarGps = () => {
                if (!navigator.geolocation) return showToast("⚠️ Geolocalização não suportada");
                showToast("🛰 Buscando GPS...");
                navigator.geolocation.getCurrentPosition(
                    (p) => {
                        const lt = p.coords.latitude.toFixed(6);
                        const ln = p.coords.longitude.toFixed(6);
                        setGps({ lt, ln, lk: `https://www.google.com/maps?q=${lt},${ln}` });
                        setLocal(`${lt},${ln}`);
                        setGpsSt("✅ GPS Fixado");
                        showToast("📍 Coordenadas obtidas com sucesso!");
                    },
                    () => setGpsSt("⚠ Erro ao obter GPS"),
                    { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
                );
            };

            const ligarCamera = async () => {
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' }, audio: false });
                    if (videoRef.current) {
                        videoRef.current.srcObject = stream;
                        setCameraAtiva(true);
                        showToast("📷 Câmera Ativada com Sucesso!");
                    }
                } catch (e) {
                    showToast("⚠️ Erro ao acessar a câmera. Permissão negada ou indisponível.");
                }
            };

            const desligarCamera = () => {
                if (videoRef.current && videoRef.current.srcObject) {
                    const tracks = videoRef.current.srcObject.getTracks();
                    tracks.forEach(track => track.stop());
                    videoRef.current.srcObject = null;
                }
                setCameraAtiva(false);
            };

            React.useEffect(() => {
                ligarCamera();
                return () => {
                    desligarCamera();
                };
            }, []);

            const capturar = (i) => {
                const video = videoRef.current; 
                const canvas = canvasRef.current; 
                if (!video || !canvas || !video.srcObject) {
                    showToast("⚠️ Ative a câmera primeiro para capturar!");
                    ligarCamera();
                    return;
                }
                const ctx = canvas.getContext('2d');
                canvas.width = video.videoWidth || 640; 
                canvas.height = video.videoHeight || 480;
                ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
                
                const agora = new Date().toLocaleString('pt-BR');
                const bh = 75;
                ctx.fillStyle = 'rgba(2,4,10,0.88)'; 
                ctx.fillRect(0, canvas.height - bh, canvas.width, bh);
                ctx.fillStyle = '#00F2FE'; 
                ctx.fillRect(0, canvas.height - bh, canvas.width, 3);
                
                ctx.fillStyle = '#FFF'; 
                ctx.font = 'bold 11px monospace'; 
                ctx.fillText(`EPRCA | ${agora} | ${gpsStrFmt}`.slice(0, 80), 10, canvas.height - 45);
                ctx.fillStyle = '#00F2FE';
                ctx.fillText(`SETOR: ${setor}`.slice(0, 80), 10, canvas.height - 28);
                ctx.fillStyle = '#FFB86A';
                ctx.fillText(`EQUIPE: ${getFinal()}`.slice(0, 75), 10, canvas.height - 12);

                const img = canvas.toDataURL('image/jpeg', 0.85);
                const n = [...fotos]; 
                n[i] = img; 
                setFotos(n);
                showToast(`📸 Foto 0${i+1} carimbada com sucesso!`);
            };

            const apagarFoto = (i, e) => {
                e.stopPropagation();
                const n = [...fotos];
                n[i] = null;
                setFotos(n);
                showToast(`🗑️ Foto 0${i+1} removida.`);
            };

            const getOcTxt = () => {
                const l = [];
                if (oc.deslizamento) l.push("• Deslizamento");
                if (oc.alagamento) l.push("• Alagamento");
                if (oc.trincas) l.push("• Trincas");
                if (oc.arvore) l.push("• Árvore");
                if (oc.valao) l.push("• Bueiro/Valão");
                return l.length ? l.join("\n") : "• Nenhuma ocorrência marcada";
            };

            const montarLaudo = () => `🛡️ LAUDO EPRCA + BAIXADA\n📌 ${protocolo}\n📍 ${municipio}-RJ\n🏛 ${setor}\n👥 ${getFinal()}\n⚠️ ${nivel}\n📍 ${gpsStrFmt}\n${getOcTxt()}\n📝 ${desc || 'Sem observações'}\n🔒 ${hash}\n✨ Todos unidos, todos protegidos, Baixada.`;

            const gerarPdf = async () => {
                showToast("📄 Gerando PDF oficial do laudo...");
                try {
                    let J = window.jspdf ? window.jspdf.jsPDF : null;
                    if (!J && window.jsPDF) J = window.jsPDF;
                    if (!J) { showToast("⚠️ Biblioteca PDF indisponível."); return; }

                    const doc = new J();
                    let y = 20, m = 15;
                    doc.text(`LAUDO EPRCA - ${municipio}-RJ`, m, y);
                    y += 8;
                    doc.setFontSize(9);
                    doc.text(`Protocolo: ${protocolo}`, m, y);
                    y += 6;
                    doc.text(`Setor: ${setor}`, m, y);
                    y += 6;
                    doc.text(`Equipe: ${getFinal()}`, m, y);
                    y += 6;
                    doc.text(`Risco: ${nivel}`, m, y);
                    y += 10;
                    doc.text(getOcTxt(), m, y);
                    y += 12;
                    doc.text(doc.splitTextToSize(desc || 'Sem descrição', 180), m, y);
                    y += 15;
                    doc.text(`HASH: ${hash}`, m, y);
                    
                    fotos.filter(Boolean).forEach(imgData => {
                        if (y > 240) { doc.addPage(); y = 20; }
                        doc.addImage(imgData, 'JPEG', m, y, 40, 40);
                        y += 45;
                    });
                    doc.save(`${protocolo}.pdf`);
                    showToast("✅ PDF gerado com sucesso!");
                } catch(e) {
                    showToast("❌ Erro ao gerar PDF.");
                }
            };

            return (
                <div className="max-w-xl mx-auto space-y-4 cyber-card p-4 sm:p-5 rounded-[28px] border border-cyberCyan/40 shadow-2xl font-mono">
                    <style>{`
                        .grid-futuro { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:12px; }
                        .bloco-foto {
                          height:110px; border-radius:14px; position:relative; overflow:hidden;
                          background: linear-gradient(145deg, rgba(10,26,51,0.9), rgba(2,4,10,0.9));
                          border:1px solid rgba(0,242,254,0.3);
                          box-shadow: 0 0 15px rgba(0,242,254,0.15), inset 0 1px 0 rgba(255,255,255,0.1);
                          cursor:pointer; transition: all 0.3s ease;
                        }
                        .bloco-foto:hover { border-color:#00F2FE; box-shadow: 0 0 25px rgba(0,242,254,0.4); transform: translateY(-2px); }
                        .bloco-foto::before {
                          content:''; position:absolute; top:0; left:0; right:0; height:2px;
                          background: linear-gradient(90deg, transparent, #00F2FE, transparent);
                          opacity:0.8;
                        }
                        .bloco-foto .scan {
                          position:absolute; top:0; left:0; width:100%; height:2px;
                          background:#00F2FE; box-shadow: 0 0 10px #00F2FE;
                          animation: scan 2.5s linear infinite; opacity:0.6;
                        }
                        @keyframes scan { 0%{ top:0 } 100%{ top:100% } }
                        .bloco-label {
                          position:absolute; bottom:6px; left:6px; right:6px;
                          background: rgba(2,4,10,0.8); border:1px solid rgba(0,242,254,0.2);
                          border-radius:8px; padding:4px 6px; font-size:8px; color:#00F2FE;
                          display:flex; justify-content:space-between; backdrop-filter: blur(4px);
                        }
                        .img-foto { width:100%; height:100%; object-fit:cover; }
                        .placeholder {
                          width:100%; height:100%; display:flex; flex-direction:column;
                          align-items:center; justify-content:center; color:#00F2FE; gap:6px;
                        }
                        .placeholder .icon { font-size:22px; filter: drop-shadow(0 0 6px #00F2FE); }
                        .placeholder .txt { font-size:9px; letter-spacing:1px; opacity:0.8 }
                    `}</style>

                    <div className="flex items-center justify-between border-b border-cyberCyan/30 pb-3">
                        <div className="space-y-0.5">
                            <span className="text-xs font-black text-cyberCyan uppercase tracking-wider block">📋 Vistoria & Laudo • Blocos Futuristas</span>
                            <span className="text-[9px] text-slate-400">EPRCA • Baixada Fluminense</span>
                        </div>
                        <button onClick={onBackToDashboard} className="px-3 py-1 bg-cyberRose/20 text-cyberRose rounded-xl text-xs font-bold border border-cyberRose/40 cursor-pointer">✕ Fechar</button>

                            <select value={municipio} onChange={e => setMunicipio(e.target.value)} className="w-full bg-void border border-cyan-400/40 rounded-xl p-2.5 text-xs text-white font-bold mt-1">

        function AdminVaultModule({ localVideos, setLocalVideos, marketingText, setMarketingText, showToast, onClose }) {
            const [pinInput, setPinInput] = React.useState("");
            const [isUnlocked, setIsUnlocked] = React.useState(false);
            const [marketingInput, setMarketingInput] = React.useState(marketingText);

            const handleUnlock = (e) => {
                e.preventDefault();
                if (pinInput === "303500") { setIsUnlocked(true); showToast("🔓 Acesso Autorizado!"); } else { showToast("❌ PIN Incorreto."); }
            };

            const handleUploadVideo = (e) => {
                const files = Array.from(e.target.files);
                if (files.length === 0) return;

                files.forEach(file => {
                    showToast(`🔄 Salvando "${file.name}"...`);
                    const reader = new FileReader();
                    reader.onload = (uploadEvt) => {
                        const base64Data = uploadEvt.target.result;
                        const newVid = { 
                            id: Date.now() + Math.random(), 
                            title: file.name, 
                            url: base64Data, 
                            date: new Date().toLocaleDateString('pt-BR'),
                            isPinned: true 
                        };
                        
                        setLocalVideos(prev => {
                            const updated = [newVid, ...prev];
                            try { localStorage.setItem("cparc_videos_permanent", JSON.stringify(updated)); } catch(err) {}
                            return updated;
                        });
                        showToast(`📹 Vídeo "${file.name}" salvo com sucesso!`);
                    };
                    reader.readAsDataURL(file);
                });
                e.target.value = "";
            };

            const handleDeleteVideo = (id, title) => {
                if (confirm(`Excluir "${title}"?`)) {
                    setLocalVideos(prev => {
                        const updated = prev.filter(v => v.id !== id);
                        try { localStorage.setItem("cparc_videos_permanent", JSON.stringify(updated)); } catch(err) {}
                        return updated;
                    });
                    showToast(`🗑️ Vídeo excluído!`);
                }
            };

            return (
                <div className="space-y-4 max-w-xl mx-auto">
                    <div className="cyber-card p-5 rounded-[28px] shadow-xl space-y-4">
                        <div className="flex items-center justify-between border-b border-cyberCyan/25 pb-3">

                        </div>
                        {!isUnlocked ? (
                            <form onSubmit={handleUnlock} className="flex gap-2.5">
                                <input type="password" maxLength="6" value={pinInput} onChange={(e) => setPinInput(e.target.value)} placeholder="PIN 🔒" className="flex-1 bg-void border border-cyberCyan/40 rounded-xl px-3.5 py-3 text-center text-slate-100 focus:outline-none font-mono tracking-widest text-base shadow-inner" />

                            </form>
                        ) : (
                            <div className="space-y-3.5">
                                <div className="bg-void/80 border border-cyberCyan/40 p-3.5 rounded-2xl space-y-2">
                                    <h3 className="text-[10px] font-black text-cyberCyan tracking-widest font-display">📢 INFORMATIVO DA EPRCA</h3>
                                    <textarea rows="2" value={marketingInput} onChange={(e) => setMarketingInput(e.target.value)} className="w-full bg-deepSpace border border-cyberCyan/30 rounded-xl p-2.5 text-xs text-slate-100 focus:outline-none" />

                                <div className="space-y-2.5 pt-1">

        function App() {
            const [showSplash, setShowSplash] = React.useState(true);
            const [theme, setTheme] = React.useState(() => { try { return localStorage.getItem("sarah-theme") || "dark"; } catch(e) { return "dark"; } });
            const [soundEnabled, setSoundEnabled] = React.useState(true);
            const [isSpeaking, setIsSpeaking] = React.useState(false);
            const [isListening, setIsListening] = React.useState(false);

            const [activeTab, setActiveTab] = React.useState("dashboard");
            const [radarOpen, setRadarOpen] = React.useState(false);

                        timeZone: "America/Sao_Paulo",
                        hour: "numeric",
                        minute: "numeric",
                        hour12: false
                    });
                    const parts = formatter.formatToParts(now);
                    let hours = 0, minutes = 0;
                    for (let p of parts) {
                        if (p.type === 'hour') hours = parseInt(p.value, 10);
                        if (p.type === 'minute') minutes = parseInt(p.value, 10);
                    }
                    const todayStr = now.toDateString();

                    if (hours === 19 && minutes === 20) {
                        const lastTriggered = localStorage.getItem('chameleon_last_date');
                        if (lastTriggered !== todayStr) {
                            setChameleonActive(true);
                            localStorage.setItem('chameleon_last_date', todayStr);

                    timeZone: "America/Sao_Paulo",
                    hour: "numeric",
                    minute: "numeric",
                    hour12: false
                });
                const parts = formatter.formatToParts(now);
                let hours = 0, minutes = 0;
                for (let p of parts) {
                    if (p.type === 'hour') hours = parseInt(p.value, 10);
                    if (p.type === 'minute') minutes = parseInt(p.value, 10);
                }
                if (hours > 19 || (hours === 19 && minutes >= 20)) {
                    const todayStr = now.toDateString();
                    if (localStorage.getItem('chameleon_last_date') === todayStr) {
                        setChameleonActive(true);

                return () => clearInterval(interval);

                window.addEventListener('beforeinstallprompt', onPrompt);
                window.addEventListener('appinstalled', onInstalled);

                    window.removeEventListener('beforeinstallprompt', onPrompt);
                    window.removeEventListener('appinstalled', onInstalled);

            const handleInstallApp = async () => {
                if (deferredPrompt) {

                    setInstallModalOpen(true);

            const carregarVozes = () => { if ("speechSynthesis" in window) { voicesRef.current = window.speechSynthesis.getVoices(); } };
            React.useEffect(() => {
                if (!("speechSynthesis" in window)) return;
                carregarVozes();
                window.speechSynthesis.onvoiceschanged = carregarVozes;
                return () => { window.speechSynthesis.cancel(); window.speechSynthesis.onvoiceschanged = null; };
            }, []);

            const limparTextoParaFala = (text) => {
                return String(text).replace(/([\u2700-\u27BF]|[\uE000-\uF8FF]|\uD83C[\uDC00-\uDFFF]|\uD83D[\uDC00-\uDFFF]|[\u2011-\u26FF]|\uD83E[\uDD00-\uDDFF])/g, '').replace(/\[(.*?)\]\(.*?\)/g, "$1").replace(/https?:\/\/\S+/g, "").replace(/\s+/g, " ").trim();
            };

            const escolherMelhorVoz = () => {
                const voices = voicesRef.current.length ? voicesRef.current : window.speechSynthesis.getVoices();
                return voices.find((voice) => voice.lang.toLowerCase().includes("pt")) || voices[0];
            };

            const stopSpeaking = () => {
                speechIdRef.current += 1;
                if (voiceTimerRef.current) { clearTimeout(voiceTimerRef.current); voiceTimerRef.current = null; }
                if ("speechSynthesis" in window) window.speechSynthesis.cancel();
                setIsSpeaking(false);
            };

            const speakText = (text) => {
                if (!soundEnabled || !("speechSynthesis" in window)) return;
                const cleanText = limparTextoParaFala(text);
                if (!cleanText) return;
                stopSpeaking();
                const currentId = speechIdRef.current;
                voiceTimerRef.current = setTimeout(() => {
                    if (currentId !== speechIdRef.current) return;
                    const utterance = new SpeechSynthesisUtterance(cleanText);
                    utterance.lang = "pt-BR";
                    utterance.voice = escolherMelhorVoz();
                    utterance.rate = 1.0;
                    utterance.onstart = () => { if (currentId === speechIdRef.current) setIsSpeaking(true); };
                    utterance.onend = () => { if (currentId === speechIdRef.current) setIsSpeaking(false); };
                    utterance.onerror = () => setIsSpeaking(false);
                    window.speechSynthesis.speak(utterance);
                }, 200);
            };

            React.useEffect(() => {
                if (!termsAccepted || hasIntroduced) return;
                const greeting = getBrasiliaGreeting();
                const presentation = `${greeting}, sou a SARAH AI NEXUS versão 8.4.2 PRO na Estação Pública de Resiliência Comunitária Automatizada, EPRCA. Todos unidos, todos protegidos, Baixada.`;
                const timer = setTimeout(() => {
                    if (!soundEnabled) return;
                    setHasIntroduced(true);
                    try { localStorage.setItem("cparc_introduced_v842", "1"); } catch(e) {}
                    speakText(presentation);
                }, 700);
                return () => clearTimeout(timer);
            }, [termsAccepted, hasIntroduced, soundEnabled]);

            const openShareFromApp = async () => {
                const manifestData = { title: "SARAH AI NEXUS • Chave Climática", text: shareMessageText, url: APP_SHARE_URL };
                if (navigator.share) {
                    try { await navigator.share(manifestData); return; } catch (err) { if (err.name === 'AbortError') return; }
                }
                setShareModalOpen(true);
            };

            React.useEffect(() => {
                try { localStorage.setItem("sarah-theme", theme); } catch(e) {}
                const metaTheme = document.querySelector('meta[name="theme-color"]');
                if (theme === 'warm') {
                    document.documentElement.classList.remove('dark');
                    document.documentElement.classList.add('warm');
                    if (metaTheme) metaTheme.setAttribute('content', '#F4F3EF');
                } else {
                    document.documentElement.classList.add('dark');
                    document.documentElement.classList.remove('warm');
                    if (metaTheme) metaTheme.setAttribute('content', '#02040A');
                }
            }, [theme]);

            const toggleTheme = () => {
                setTheme(prev => {
                    const next = prev === 'dark' ? 'warm' : 'dark';
                    showToast(next === 'warm' ? '🎨 Tema Clean Ativado' : '🌌 Modo Cyber Ativado');
                    return next;
                });
            };

            const toggleListening = () => {
                const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
                if (!SpeechRec) { showToast("⚠️ Reconhecimento de voz indisponível."); return; }
                if (isListening) { setIsListening(false); return; }
                try {
                    const rec = new SpeechRec();
                    rec.lang = "pt-BR";
                    rec.continuous = false;
                    rec.interimResults = true;
                    rec.onstart = () => { setIsListening(true); showToast("🎙 Ouvindo voz..."); };
                    rec.onresult = (event) => {
                        let final = '';
                        for (let i = event.resultIndex; i < event.results.length; ++i) {
                            if (event.results[i].isFinal) final += event.results[i][0].transcript;
                        }
                        if (final) {
                            setInput(final);
                            setIsListening(false);
                            handleSendDirectCommand(final);
                        }
                    };
                    rec.onerror = () => { setIsListening(false); showToast("⚠ Erro no microfone."); };
                    rec.onend = () => { setIsListening(false); };
                    rec.start();
                } catch (e) { setIsListening(false); showToast("⚠️ Erro ao iniciar microfone."); }
            };

            const handleWhoAmIClick = () => {
                const fullText = "Somos uma plataforma comunitária de abrangência regional, voltada para a Baixada Fluminense e o Estado do Rio de Janeiro. Visamos levar ao cidadão a integração da automação moderna, obtendo informações relevantes elaboradas pelos órgãos oficiais. Interagimos com esses meios de informação e com a população em geral, com o intuito de prevenir, reduzir riscos e fortalecer a resiliência de cada morador nas áreas e manchas de alagamentos e desastres em geral, com foco no clima e na meteorologia. Todos unidos, todos protegidos, Baixada.";
                setCurrentResponse("📋 QUEM SOMOS:\n\n" + fullText);
                setIsChatOpen(true);
                speakText(fullText);
            };

            const handleSendDirectCommand = async (textCustom) => {
                stopSpeaking();
                const textToSend = textCustom !== undefined ? textCustom : input;
                if (!textToSend.trim() || isProcessing) return;

                const queryText = textToSend.trim();
                setInput("");
                setIsProcessing(true);
                setCurrentResponse("🔄 SARAH AI NEXUS processando solicitação...");

                try {
                    const response = await fetch(CLOUDFLARE_WORKER_URL, {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({
                            model: "openai/gpt-oss-120b",
                            messages: [
                                {
                                    role: "system",
                                    content: `Você é a SARAH AI NEXUS V8.4.2 PRO, assistente virtual oficial da Estação Pública de Resiliência Comunitária Automatizada (EPRCA). Lema: Todos unidos, todos protegidos, Baixada.`
                                },
                                { role: "user", content: queryText }
                            ],
                            temperature: 0.5,
                            max_tokens: 300
                        })
                    });

                    if (response.status === 404) throw new Error("Erro 404");

                    const data = await response.json();
                    let reply = data?.choices?.[0]?.message?.content || data?.message || "Análise concluída.";
                    reply = reply.replace(/#{1,6}\s?/g, '').replace(/\*\*/g, '').replace(/\|/g, ' ').replace(/---/g, '').trim();

                    setCurrentResponse(reply);
                    speakText(reply);
                } catch (error) {
                    const fallback = "SARAH AI NEXUS V8.4.2 PRO à disposição na Estação Pública de Resiliência Comunitária Automatizada (EPRCA). Todos unidos, todos protegidos, Baixada.";
                    setCurrentResponse(fallback);
                    speakText(fallback);
                } finally {
                    setIsProcessing(false);
                }
            };

            const openSarahChat = () => {

                const greeting = getBrasiliaGreeting();

            const NAV_TABS = [
                { id: 'cidadao-sensor', iconComponent: <span className="text-xs">📡</span>, label: 'Cidadão Sensor' },
                { id: 'quem-somos', iconComponent: <HomeCommandIcon className="w-4 h-4" />, label: 'Quem somos' },

            const handleNavClick = (tabId) => {
                if (tabId === 'radar') {

                } else if (tabId === 'sarah-chat') {

                } else if (tabId === 'quem-somos') {
                    handleWhoAmIClick();
                } else if (tabId === 'cidadao-sensor') {
                    setActiveTab('modulo2');
                } else {
                    setActiveTab(tabId);

            };

            return (
                <div className="min-h-screen flex flex-col relative text-slate-100 antialiased items-center justify-start">
                    {showSplash && (
                        <AppSplashScreen 
                            splashImageUrl={SPLASH_IMAGE_URL} 
                            onFinish={() => setShowSplash(false)} 
                        />
                    )}

                    {toastMessage && (
                        <div className="fixed top-16 left-1/2 -translate-x-1/2 z-50 cyber-card px-5 py-2.5 rounded-xl font-display text-[10px] font-black text-cyberCyan tracking-wider shadow-2xl border border-cyberCyan/50 animate-bounce">
                            {toastMessage}
                        </div>
                    )}

                    {shareModalOpen && (
                        <div className="fixed inset-0 bg-void/90 backdrop-blur-xl z-50 flex items-center justify-center p-4">
                            <div className="cyber-card max-w-md w-full p-6 rounded-[28px] space-y-4 text-center shadow-2xl border border-cyberCyan/40">
                                <h3 className="font-display text-xs font-black text-cyberCyan tracking-widest">📲 COMPARTILHAR A EPRCA</h3>
                                <div className="flex justify-center my-2">
                                    <img src={SHARE_ICON_SVG_DATAURI} alt="Ícone SVG EPRCA" className="w-20 h-20 rounded-2xl border border-cyberCyan/50 shadow-[0_0_15px_rgba(0,242,254,0.4)] object-contain bg-void p-1" />
                                </div>
                                <textarea readOnly value={shareMessageText} className="w-full h-24 bg-void border border-cyberCyan/30 rounded-xl p-2.5 text-xs text-slate-200 resize-none font-mono shadow-inner" />
                                <div className="flex gap-2.5">
                                    <button onClick={() => { navigator.clipboard.writeText(shareMessageText); showToast("📋 Link copiado!"); setShareModalOpen(false); }} className="flex-1 py-3 cyber-button font-black rounded-xl text-xs cursor-pointer shadow-lg">Copiar Tudo</button>
                                    <button onClick={() => setShareModalOpen(false)} className="px-4 py-3 bg-cyberRose/20 text-cyberRose border border-cyberRose/40 rounded-xl text-xs font-bold cursor-pointer">Fechar</button>
                                </div>
                            </div>
                        </div>
                    )}

                    {installModalOpen && (
                        <div className="fixed inset-0 bg-void/90 backdrop-blur-xl z-50 flex items-center justify-center p-4">
                            <div className="cyber-card max-w-md w-full p-6 rounded-[28px] space-y-4 text-center shadow-2xl border border-cyberCyan/40 max-h-[85vh] overflow-y-auto">
                                <div className="flex flex-col items-center space-y-1.5">
                                    <div className="w-20 h-20 rounded-[22px] overflow-hidden border-2 border-cyberCyan/65 shadow-[0_0_30px_rgba(0,242,254,0.4)] bg-void p-1 flex items-center justify-center">
                                        <img src={SHARE_ICON_SVG_DATAURI} alt="Ícone SVG" className="w-full h-full object-contain" />
                                    </div>
                                    <h3 className="font-display text-xs font-black text-cyberCyan tracking-widest">INSTALAR APLICATIVO</h3>
                                    <p className="text-[9px] font-mono text-cyberGreen font-bold tracking-wider">Todos unidos, todos protegidos, Baixada.</p>
                                </div>
                                <button onClick={() => { setInstallModalOpen(false); openShareFromApp(); }}
                                    className="w-full py-3 cyber-button font-black rounded-xl text-xs uppercase tracking-widest cursor-pointer shadow-xl">
                                    📲 Compartilhar EPRCA + Ícone SVG
                                </button>
                                <button onClick={() => setInstallModalOpen(false)}
                                    className="w-full py-2.5 bg-cyberRose/20 text-cyberRose border border-cyberRose/40 rounded-xl text-xs font-bold cursor-pointer">
                                    Fechar
                                </button>
                            </div>
                        </div>
                    )}

                    {/* Termo de Responsabilidade com 3 Pilares e 2 Checkboxes (Aparece Apenas no 1º Acesso) */}
                    {!termsAccepted && (
                        <div className="fixed inset-0 bg-void/95 z-[200] flex items-center justify-center p-4 overflow-y-auto">
                            <div className="cyber-card max-w-lg w-full p-6 rounded-[28px] shadow-2xl space-y-4 my-auto border border-cyberCyan/50 font-mono">
                                <div className="text-center space-y-1 border-b border-cyberCyan/30 pb-3">
                                    <h2 className="font-display text-base font-black text-white tracking-widest animate-maluco-glow">
                                        ⚖️ TERMO DE RESPONSABILIDADE &amp; LGPD
                                    </h2>
                                    <p className="text-[9px] text-cyberCyan font-bold uppercase tracking-wider">
                                        CHAVE CLIMÁTICA • EPRCA &amp; SARAH AI
                                    </p>
                                </div>

                                <div className="space-y-3 text-[11px] text-slate-300 leading-relaxed max-h-[45vh] overflow-y-auto pr-1">
                                    {/* Pilar 1 */}
                                    <div className="bg-void/80 p-3 rounded-xl border border-cyberCyan/30 space-y-1">
                                        <h3 className="font-bold text-cyberCyan text-[11px]">1. Privacidade e Conformidade com a LGPD</h3>
                                        <p className="text-[10px] text-slate-300">
                                            Em conformidade com a <strong>Lei Federal nº 13.709/2018 (LGPD)</strong>, este aplicativo utiliza exclusivamente APIs públicas e dados abertos, contando com travas de segurança rigorosas que garantem que nenhuma informação pessoal identificável de usuários seja comercializada ou armazenada indevidamente.
                                        </p>
                                    </div>

                                    {/* Pilar 2 */}
                                    <div className="bg-void/80 p-3 rounded-xl border border-cyberCyan/30 space-y-1">
                                        <h3 className="font-bold text-cyberCyan text-[11px]">2. Uso Obrigatório de Geolocalização (GPS)</h3>
                                        <p className="text-[10px] text-slate-300">
                                            O sistema utiliza dados de <strong>GPS em tempo real</strong> exclusivamente para posicionar o usuário no mapa de resiliência e bacias hidrográficas, viabilizando alertas de riscos e vistorias de campo com precisão técnica.
                                        </p>
                                    </div>

                                    {/* Pilar 3 */}
                                    <div className="bg-void/80 p-3 rounded-xl border border-cyberCyan/30 space-y-1">
                                        <h3 className="font-bold text-cyberCyan text-[11px]">3. Amparo Legal da Defesa Civil e Apoio Comunitário</h3>
                                        <p className="text-[10px] text-slate-300">
                                            As iniciativas comunitárias encontram respaldo institucional na <strong>Lei Federal nº 12.608/2012</strong> (Política Nacional de Proteção e Defesa Civil), que fomenta o apoio e a integração dos órgãos oficiais com núcleos comunitários e civis na prevenção de desastres.
                                        </p>
                                    </div>
                                </div>

                                {/* As Duas Caixinhas de Aceite */}
                                <div className="space-y-2.5 pt-2 border-t border-cyberCyan/30">
                                    <label className="flex items-start gap-2.5 cursor-pointer text-[10px] text-slate-200 bg-commandPanel/80 p-2.5 rounded-xl border border-cyberCyan/20">
                                        <input type="checkbox" checked={check1} onChange={(e) => setCheck1(e.target.checked)} className="mt-0.5 rounded border-cyberCyan/50 text-cyberCyan w-4 h-4 bg-void shrink-0 cursor-pointer" />
                                        <span>Concordo com os termos de privacidade, LGPD, uso exclusivo de APIs públicas e anonimidade.</span>
                                    </label>
                                    <label className="flex items-start gap-2.5 cursor-pointer text-[10px] text-slate-200 bg-commandPanel/80 p-2.5 rounded-xl border border-cyberCyan/20">
                                        <input type="checkbox" checked={check2} onChange={(e) => setCheck2(e.target.checked)} className="mt-0.5 rounded border-cyberCyan/50 text-cyberCyan w-4 h-4 bg-void shrink-0 cursor-pointer" />
                                        <span>Autorizo o uso temporário do GPS e reconheço o amparo legal da Defesa Civil (Lei nº 12.608/2012).</span>
                                    </label>
                                </div>

                                <button 
                                    disabled={!check1 || !check2} 
                                    onClick={() => { 
                                        setTermsAccepted(true); 
                                        try { localStorage.setItem("cparc_terms_accepted", "1"); } catch(e) {} 
                                        showToast("🚀 Termos aceitos! Bem-vindo à EPRCA."); 
                                    }} 
                                    className={`w-full py-3.5 rounded-xl font-display font-black text-xs uppercase tracking-[0.15em] transition shadow-xl ${check1 && check2 ? 'cyber-button font-black cursor-pointer' : 'bg-commandPanel text-slate-500 cursor-not-allowed'}`}
                                >
                                    CONCORDAR E ENTRAR NA ESTAÇÃO &gt;
                                </button>
                            </div>
                        </div>
                    )}

                    <header className="cyber-card sticky top-0 z-30 w-full max-w-2xl px-4 py-2.5 border-b border-cyberCyan/30 flex items-center justify-between shadow-lg rounded-b-xl">
                        <div className="flex items-center gap-2.5">
                            <div className={`w-9 h-9 rounded-xl cyber-border-glow flex items-center justify-center bg-void shadow-[0_0_20px_rgba(0,242,254,0.4)] overflow-hidden border border-cyberCyan ${isSpeaking ? 'animate-hud-pulse' : ''}`}>
                                <img src={SARAH_CUSTOM_AVATAR_URL} alt="SARAH AI" className="w-full h-full object-cover" />
                            </div>
                            <div>
                                <h1 className="font-display text-[10px] sm:text-[11px] font-black text-white tracking-[0.05em] animate-maluco-glow">EPRCA • SARAH AI NEXUS</h1>
                                <p className="text-[8px] text-cyberCyan font-mono font-bold tracking-wider uppercase">
                                    {chameleonActive ? "🦎 CAMALEÃO ATIVO" : "ESTAÇÃO PÚBLICA • MESQUITA/RJ"}
                                </p>
                            </div>
                        </div>
                        <div className="flex items-center gap-1.5">
                            <button 
                                onClick={() => {
                                    setChameleonActive(!chameleonActive);
                                    if (!chameleonActive && soundEnabled) playChameleonSound();
                                    showToast(chameleonActive ? "🔄 Modo Padrão Restabelecido" : "🦎 Efeito Camaleão Testado!");
                                }}
                                className={`px-2 py-1 rounded-lg border text-[8px] font-bold cursor-pointer transition ${chameleonActive ? 'bg-emerald-500/20 border-emerald-400 text-emerald-300' : 'bg-cyberCyan/20 border-cyberCyan text-cyberCyan'}`}
                                title="Testar Efeito Camaleão"
                            >
                                {chameleonActive ? "🦎 Camaleão ON" : "🦎 Camaleão"}
                            </button>
                            <IconeSomToggle soundEnabled={soundEnabled} setSoundEnabled={setSoundEnabled} />
                            <IconeTemaToggle theme={theme} toggleTheme={toggleTheme} />
                            <IconeCompartilharTopo openShareFromApp={openShareFromApp} />
                            <IconeInstalarApp handleInstallApp={handleInstallApp} isInstallable={isInstallable} />
                        </div>
                    </header>

                    <nav className="cyber-card w-full max-w-2xl border-b border-cyberCyan/30 px-3 py-2 flex items-center justify-center gap-1.5 overflow-x-auto z-20">
                        {NAV_TABS.map(tab => (
                            <button key={tab.id} onClick={() => handleNavClick(tab.id)}
                                className={`px-3 py-1.5 rounded-xl text-[10px] font-black transition cursor-pointer flex items-center gap-1.5 shrink-0 tracking-wider ${
                                    activeTab === tab.id || (tab.id === 'cidadao-sensor' && activeTab === 'modulo2') || (tab.id === 'quem-somos' && isChatOpen)
                                        ? 'cyber-button font-black shadow-[0_0_20px_rgba(255,153,0,0.4)]'
                                        : 'bg-commandPanel text-slate-300 border border-cyberCyan/20'
                                }`}>
                                {tab.iconComponent} {tab.label}
                            </button>
                        ))}
                    </nav>

                    <main className="flex-1 w-full max-w-2xl mx-auto p-3 sm:p-4 space-y-4 pb-28 relative z-10">
                        {activeTab === 'dashboard' && (
                            <div className="space-y-4">
                                <div className="cyber-card p-5 sm:p-6 rounded-[28px] shadow-xl space-y-4 text-center border border-cyberCyan/60">
                                    <SarahHologramAvatar isLarge={true} isSpeaking={isSpeaking} />

                                    {/* Card de Perfil Consolidado com o Logotipo Exato */}
                                    <CardPerfilConsolidado openShareFromApp={openShareFromApp} />

                                    <div className="flex flex-col sm:flex-row items-center justify-center gap-2.5 w-full max-w-md mx-auto">
                                        <button onClick={() => setActiveTab('modulo2')} className="w-full sm:flex-1 py-3 px-4 rounded-2xl bg-gradient-to-r from-emerald-600 to-teal-500 text-white font-display font-black text-[11px] uppercase tracking-[0.1em] shadow-[0_0_20px_rgba(16,185,129,0.4)] cursor-pointer transition hover:scale-105 flex items-center justify-center gap-2">
                                            <span>📡 Cidadão Sensor</span>
                                        </button>
                                        <button onClick={handleWhoAmIClick} className="w-full sm:flex-1 py-3 px-4 rounded-2xl bg-gradient-to-r from-teal-500 to-cyan-500 text-void font-display font-black text-[11px] uppercase tracking-[0.1em] shadow-[0_0_20px_rgba(0,242,254,0.4)] cursor-pointer transition hover:scale-105 flex items-center justify-center gap-2">
                                            <span>Quem Somos</span>
                                        </button>
                                        <button onClick={openSarahChat} className="w-full sm:flex-1 py-3 px-4 rounded-2xl cyber-button font-display font-black text-[11px] uppercase tracking-[0.1em] shadow-[0_0_30px_rgba(255,153,0,0.5)] cursor-pointer transition hover:scale-105 flex items-center justify-center gap-2">
                                            <span>Falar com a Sarah</span>
                                        </button>
                                    </div>

                                    <div className="flex flex-wrap justify-center gap-1.5 pt-2">
                                        <button onClick={() => setActiveTab('estacao')} className="px-3.5 py-1.5 bg-void border border-cyberCyan/30 hover:border-cyberCyan text-cyberCyan rounded-xl text-[10px] font-bold transition cursor-pointer">🌡️ Estação</button>
                                        <button onClick={() => setActiveTab('modulo1')} className="px-3.5 py-1.5 bg-void border border-cyberCyan/30 hover:border-cyberCyan text-cyberCyan rounded-xl text-[10px] font-bold transition cursor-pointer">🌪️ Módulo 1</button>
                                        <button onClick={() => setActiveTab('relatorio')} className="px-3.5 py-1.5 bg-void border border-cyberCyan/30 hover:border-cyberCyan text-cyberCyan rounded-xl text-[10px] font-bold transition cursor-pointer">📋 Vistorias</button>
                                    </div>
                                </div>
                            </div>
                        )}

                        {activeTab === 'estacao' && <EstacaoSobrevivenciaModule showToast={showToast} />}
                        {activeTab === 'modulo1' && <ModuloElNinoModule onGoToDashboard={() => setActiveTab('dashboard')} />}
                        {activeTab === 'modulo2' && <ModuloCidadaoSensorModule onGoToDashboard={() => setActiveTab('dashboard')} showToast={showToast} />}
                        {activeTab === 'relatorio' && <VistoriaEPRCA_BlocosFuturistas onBackToDashboard={() => setActiveTab('dashboard')} showToast={showToast} />}
                        {activeTab === 'galeria' && <PublicVideoGallery localVideos={localVideos} onGoToDashboard={() => setActiveTab('dashboard')} />}
                        {activeTab === 'admin' && (
                            <AdminVaultModule
                                localVideos={localVideos}
                                setLocalVideos={setLocalVideos}
                                marketingText={marketingText}
                                setMarketingText={setMarketingText}
                                showToast={showToast}
                                onClose={() => setActiveTab('dashboard')}
                            />
                        )}

                        <AutomatedObservatoryWidget />
                    </main>

                    {termsAccepted && <SarahFabButton onOpen={openSarahChat} />}

                    <NativeHydroWindRadar isOpen={radarOpen} onToggle={() => setRadarOpen(o => !o)} />

                    <SarahChatOverlay
                        isOpen={isChatOpen}
                        onClose={() => { setIsChatOpen(false); stopSpeaking(); }}
                        isSpeaking={isSpeaking}
                        isProcessing={isProcessing}
                        currentResponse={currentResponse}
                        input={input}
                        setInput={setInput}
                        handleSendDirectCommand={handleSendDirectCommand}
                        toggleListening={toggleListening}
                        isListening={isListening}
                    />

                    <footer className="cyber-card fixed bottom-0 left-0 right-0 z-40 border-t border-cyberCyan/30 px-3 py-2.5 flex items-center justify-around shadow-xl backdrop-blur-2xl max-w-2xl mx-auto rounded-t-xl">
                        {NAV_TABS.map(tab => (
                            <button key={tab.id} onClick={() => handleNavClick(tab.id)}
                                className={`flex flex-col items-center gap-0.5 cursor-pointer transition ${activeTab === tab.id ? 'text-cyberCyan scale-105' : 'text-slate-400 hover:text-white'}`}>
                                {tab.iconComponent}
                                <span className="text-[8px] font-black tracking-wider">{tab.label}</span>
                            </button>
                        ))}
                    </footer>
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
