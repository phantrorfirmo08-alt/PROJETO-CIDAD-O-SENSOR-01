​function VistoriaRARU_NEXUS({ onBackToDashboard, showToast, vozSelecionada, userName }) {

const [mun, setMun] = React.useState(MUNICIPIOS_92[0]);

const [fotos, setFotos] = React.useState([]);

const [camOn, setCamOn] = React.useState(false);

const [nome, setNome] = React.useState(userName || '');

const [bairro, setBairro] = React.useState('');

const [rel, setRel] = React.useState('');

const [gps, setGps] = React.useState({lat:0, lon:0, acc:''});

const [isAiAnalyzing, setIsAiAnalyzing] = React.useState(false);

const [clima, setClima] = React.useState(null);

​const [frenteSelecionada, setFrenteSelecionada] = React.useState(FRENTES_EQUIPES_TABELA[5]);

const [alarmeRusso, setAlarmeRusso] = React.useState(false);

const [alarmeCemaden, setAlarmeCemaden] = React.useState(false);

const [cemadenNivel, setCemadenNivel] = React.useState('VERDE');

const [vento, setVento] = React.useState(0);

​const audioRef = React.useRef(null);

const sireneIntervalRef = React.useRef(null);

const timeoutSireneRef = React.useRef(null);

​const RISCOS_RARU = ["R1 - BAIXO / PREVENTIVO","R2 - MODERADO / ALERTA","R3 - ALTO / ENXURRADA","R4 - EVACUAÇÃO PREVENTIVA","RH - CONVERGÊNCIA SERRAS","RE - ESTRUTURAL / TALUDE"];

const [risco, setRisco] = React.useState(RISCOS_RARU[1]);

const [protAtual, setProtAtual] = React.useState(null);

​const videoRef = React.useRef(null);

const streamRef = React.useRef(null);

​React.useEffect(() => {

if (userName && !nome) setNome(userName);

}, [userName]);

​React.useEffect(() => {

if (!mun?.lat) return;

fetch([https://api.open-meteo.com/v1/forecast?latitude=$](https://api.open-meteo.com/v1/forecast?latitude=$){mun.lat}&longitude=${mun.lon}&current=temperature_2m,relative_humidity_2m,precipitation,wind_speed_10m,wind_gusts_10m&timezone=auto)

.then(r => r.json())

.then(d => {

setClima(d.current);

setVento(d.current?.wind_gusts_10m || d.current?.wind_speed_10m || 0);

const chuva = d.current?.precipitation || 0;

if(chuva >= 50) setCemadenNivel('VERMELHO');

else if(chuva >= 30) setCemadenNivel('LARANJA');

else if(chuva >= 10) setCemadenNivel('AMARELO');

else setCemadenNivel('VERDE');

})

.catch(() => {});

}, [mun]);

​React.useEffect(() => {

return () => {

pararTodasSirenes();

if (streamRef.current) streamRef.current.getTracks().forEach(t => t.stop());

};

}, []);

​const pararTodasSirenes = () => {

setAlarmeRusso(false);

setAlarmeCemaden(false);

if(sireneIntervalRef.current) clearInterval(sireneIntervalRef.current);

if(timeoutSireneRef.current) clearTimeout(timeoutSireneRef.current);

try{ audioRef.current?._osc?.stop(); audioRef.current?.close(); }catch(e){}

audioRef.current = null;

};

​const dispararSirene5Minutos = (tipo) => {

pararTodasSirenes();

if (tipo === 'russo') setAlarmeRusso(true);

else setAlarmeCemaden(true);

​showToast(Sirene ${tipo === 'russo' ? 'Alarme Russo' : 'CEMADEN'} disparada por 5 minutos.);

falarSarah(Atenção comunidade! Alerta máximo disparado pela estação de sobrevivência., vozSelecionada);

​try {

if(!audioRef.current) audioRef.current = new (window.AudioContext||window.webkitAudioContext)();

const ctx = audioRef.current; ctx.resume();

const osc = ctx.createOscillator(); const gain = ctx.createGain();

osc.type = tipo === 'russo' ? 'sawtooth' : 'sine';

osc.frequency.value = tipo === 'russo' ? 450 : 600;

gain.gain.value = 0.15;

osc.connect(gain); gain.connect(ctx.destination); osc.start();

audioRef.current._osc = osc;

​let subindo = true;

sireneIntervalRef.current = setInterval(()=>{

let f = osc.frequency.value;

if(subindo){ f+=30; if(f>=950) subindo=false; }

else { f-=30; if(f<=400) subindo=true; }

osc.frequency.setTargetAtTime(f, ctx.currentTime, 0.1);

}, 80);

​timeoutSireneRef.current = setTimeout(() => {

pararTodasSirenes();

showToast("Ciclo de 5 minutos da sirene encerrado.");

}, 300000);

} catch(e) {}

};

​const atualizarGPS = () => {

if(!navigator.geolocation) return;

navigator.geolocation.getCurrentPosition(p => {

setGps({ lat: p.coords.latitude, lon: p.coords.longitude, acc: Math.round(p.coords.accuracy) });

setMun(m => ({ ...m, lat: p.coords.latitude, lon: p.coords.longitude }));

showToast(GPS ${Math.round(p.coords.accuracy)}m sincronizado.);

}, () => {}, { enableHighAccuracy: true, timeout: 5000 });

};

​const startCam = async () => {

try {

const s = await navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: "environment" } } });

streamRef.current = s; setCamOn(true);

setTimeout(() => { if(videoRef.current){ videoRef.current.srcObject = s; videoRef.current.play().catch(() => {}); } }, 100);

atualizarGPS();

} catch { showToast('Câmera bloqueada.'); }

};

const stopCam = () => { if(streamRef.current) streamRef.current.getTracks().forEach(t => t.stop()); setCamOn(false); };

​const capturarFotoFinal = () => {

const v = videoRef.current; if(!v) return null;

const canvas = document.createElement('canvas');

canvas.width = 600;

canvas.height = Math.round(600 * (v.videoHeight / v.videoWidth));

const ctx = canvas.getContext('2d');

ctx.drawImage(v, 0, 0, canvas.width, canvas.height);

​ctx.fillStyle = 'rgba(3,7,18,0.92)';

ctx.fillRect(0, canvas.height - 120, canvas.width, 120);

ctx.fillStyle = '#00F2FE'; ctx.font = 'bold 10px monospace';

ctx.fillText(DATA ${new Date().toLocaleString('pt-BR')} | GPS ${(gps.lat||mun.lat).toFixed(5)}, ${(gps.lon||mun.lon).toFixed(5)}, 10, canvas.height - 98);

ctx.fillStyle = '#fff'; ctx.font = 'bold 10px monospace';

ctx.fillText(AGENTE ${(nome || 'Comunitário').slice(0,22)} | LOCALIDADE ${(bairro || 'Local').slice(0,18)} | ${mun.n}, 10, canvas.height - 80);

ctx.fillStyle = '#FF0055'; ctx.font = 'bold 10px monospace';

ctx.fillText(RISCO ${risco} | CEMADEN ${cemadenNivel}, 10, canvas.height - 62);

ctx.fillStyle = '#FFA500'; ctx.font = 'bold 9px monospace';

ctx.fillText(FRENTE ${frenteSelecionada.slice(0, 45)}, 10, canvas.height - 44);

ctx.fillStyle = '#FFD600'; ctx.font = 'bold 9px monospace';

ctx.fillText(GOES-19 | CHUVA ${clima?.precipitation||0}mm | VENTO ${vento||0}km/h, 10, canvas.height - 24);

ctx.fillStyle = '#00FF88'; ctx.font = 'bold 9px monospace';

ctx.fillText(CIDADÃO SENSOR - AÇÃO COMUNITÁRIA INDEPENDENTE (GADE), 10, canvas.height - 8);

​const base64Final = canvas.toDataURL('image/jpeg', 0.70);

setFotos([base64Final]);

showToast(Foto final gerada com carimbo.);

return base64Final;

};

​const textoVistoria = (prot) => [REGISTRO DE VISTORIA COMUNITÁRIA - CIDADÃO SENSOR] Protocolo: ${prot || protAtual || 'PROT-RARU'} Agente: ${nome || userName || 'Comunitário'} Local: ${mun.n} - ${bairro} Classificação: ${risco} Frente: ${frenteSelecionada} CEMADEN: ${cemadenNivel} | Alarme Russo: ${alarmeRusso ? 'ATIVADO' : 'OFF'} GOES-19 | Chuva ${clima?.precipitation||0}mm | Vento ${vento}km/h GPS: ${(gps.lat||mun.lat).toFixed(5)}, ${(gps.lon||mun.lon).toFixed(5)} Relatório: ${rel} Anexo: 1 foto com carimbo técnico;

​const enviarWhatsComum = async () => {

const dados = await gerarDados(); if(!dados) return;

const texto = textoVistoria(dados.protocolo);

if(fotos[0] && navigator.canShare){

​const enviarWhatsBusiness = () => {

gerarDados().then(dados => { if(!dados) return;

window.open([https://wa.me/?text=$](https://wa.me/?text=$){encodeURIComponent(textoVistoria(dados.protocolo))}, '_blank');

if(fotos[0]) baixarFotoLeve(fotos[0]);

​const adicionarNoStatusComFoto = async () => {

if(fotos.length===0){ showToast('Capture 1 foto primeiro.'); return; }

try{

const blob = await (await fetch(fotos[0])).blob();

}

}catch(e){}

baixarFotoLeve(fotos[0]);

window.open([https://wa.me/?text=$](https://wa.me/?text=$){encodeURIComponent(texto)}, '_blank');

};

​const baixarFotoLeve = (base64) => { const a=document.createElement('a'); a.href=base64; a.download=vistoria-${mun.n}.jpg; a.click(); };

​const gerarLaudoComSarahAI = async () => {

if(!bairro) { showToast('Informe o bairro para a IA redigir o relatório.'); return; }

setIsAiAnalyzing(true);

showToast('Sarah AI redigindo relatório técnico...');

​const promptVistoria = Elabore um Relatório Técnico Preliminar de Vistoria Comunitária e Geotécnica para o município de ${mun.n}, bairro ${bairro}, sob a frente ${frenteSelecionada}. Agente responsável: ${nome || userName}. Classificação de Risco: ${risco}. Dados climáticos atuais: precipitação ${clima?.precipitation||0}mm, vento ${vento}km/h, nível CEMADEN ${cemadenNivel}. Relato adicional do agente: ${rel}. Estruture com rigor técnico, inclua diretrizes de Soluções Baseadas na Natureza (SbN) se aplicável, e encerre obrigatoriamente com a Nota de Conformidade legal do CONFEA/CREA.;

setRel(respostaGroq);

setIsAiAnalyzing(false);

showToast('Relatório técnico gerado pela Sarah AI.');

} catch(e) {

setIsAiAnalyzing(false);

showToast('Relatório padrão aplicado.');

}

};

​const gerarDados = async () => {

if(!nome) { showToast('Informe o nome do responsável.'); return null; }

if(!bairro) { showToast('Informe o bairro.'); return null; }

const seq = Math.floor(Math.random() * 8999 + 1000);

const sig = mun.n.slice(0, 3).toUpperCase();

const prot = PROT-RARU-${sig}-2026-${seq};

setProtAtual(prot);

return { protocolo: prot };

};

​const gerarPDFLeve = async () => {

const dados = await gerarDados(); if(!dados) return;

const canvas = document.createElement('canvas');

canvas.width = 600; canvas.height = 800;

const ctx = canvas.getContext('2d');

ctx.fillStyle = '#02040A'; ctx.fillRect(0,0,600,800);

ctx.fillStyle = '#00F2FE'; ctx.font = 'bold 16px monospace';

ctx.fillText('RELATÓRIO COMUNITÁRIO - CIDADÃO SENSOR', 20, 35);

ctx.fillStyle = '#fff'; ctx.font = '11px monospace';

ctx.fillText(Protocolo: ${dados.protocolo}, 20, 60);

ctx.fillText(Agente/Responsável: ${nome}, 20, 82);

ctx.fillText(Local: ${mun.n} - ${bairro}, 20, 104);

ctx.fillText(Frente: ${frenteSelecionada.slice(0, 50)}, 20, 126);

ctx.fillText(Risco: ${risco} | CEMADEN: ${cemadenNivel}, 20, 148);

const finalizar = () => {

const base64PDF = canvas.toDataURL('image/jpeg', 0.70);

showToast('Relatório PDF gerado.');

};

if(fotos[0]){ const img = new Image(); img.onload = ()=>{ ctx.drawImage(img, 20, 430, 280, 180); finalizar(); }; img.src = fotos[0]; }

else finalizar();

};

showToast("Vídeo salvo no LocalStorage.");

reader.readAsDataURL(file);

​const converterLinkYoutube = (url) => {

if (!url) return '';

let videoId = '';

if (url.includes('youtu.be/')) videoId = url.split('youtu.be/')[1]?.split('?')[0];

else if (url.includes('watch?v=')) videoId = url.split('watch?v=')[1]?.split('&')[0];

return videoId ? [https://www.youtube.com/embed/$](https://www.youtube.com/embed/$){videoId} : '';

};

​const handleAdicionarYoutubeDireto = (e) => {

e.preventDefault();

const embedUrl = converterLinkYoutube(novaUrlYoutube);

const atualizados = [novoItem, ...youtubeVideos];

setYoutubeVideos(atualizados);

try { localStorage.setItem('raru_youtube_videos', JSON.stringify(atualizados)); } catch(e){}

setNovaUrlYoutube('');

​const toggleTheme = () => {

setTheme(prev => {

const next = prev === 'dark' ? 'warm' : 'dark';

try { localStorage.setItem("raru-cyber-theme", next); } catch(e) {}

return next;

});

​const toggleListening = () => {

const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;

if (!SpeechRec) { showToast("Microfone indisponível."); return; }

if (isListening) { setIsListening(false); return; }

try {

const rec = new SpeechRec();

rec.lang = "pt-BR";

rec.onstart = () => setIsListening(true);

rec.onresult = (event) => { let final = event.results[0][0].transcript; if (final) { setInput(final); setIsListening(false); } };

rec.onerror = () => setIsListening(false);

rec.onend = () => setIsListening(false);

rec.start();

} catch (e) { setIsListening(false); }

};

​const [messages, setMessages] = React.useState(() => {

const savedName = (() => { try { return localStorage.getItem("raru_user_name") || ""; } catch(e) { return ""; } })();

return [

{

sender: 'assistant',

text: savedName

? Olá ${savedName}! Sou a Sarah, analista sênior do Projeto Cidadão Sensor e da Sala de Comando Sarah AI Nexus V11.2. Pronta para operar em Mesquita e nos 92 municípios do RJ.

: 'Olá! Sou a Sarah, analista sênior do Projeto Cidadão Sensor e da Sala de Comando Sarah AI Nexus V11.2. Antes de começarmos, qual é o seu nome para eu te chamar corretamente?',

time: new Date().toLocaleTimeString('pt-BR', {hour: '2-digit', minute:'2-digit'})

}

];

});

​const handleSendDirectCommand = async (textCustom) => {

const textToSend = textCustom !== undefined ? textCustom : input;

if (!textToSend.trim() || isProcessing) return;

const timeStr = new Date().toLocaleTimeString('pt-BR', {hour: '2-digit', minute:'2-digit'});

​let nomeAtualizado = userName;

const matchNome = textToSend.match(/(?:meu nome [ée]|pode me chamar de|eu sou o|eu sou a|sou o|sou a)\s+([A-Za-zÀ-ÖØ-öø-ÿ]+(?:\s+[A-Za-zÀ-ÖØ-öø-ÿ]+)?)/i);

if (matchNome && matchNome[1]) {

const extraido = matchNome[1].trim();

if (extraido.length >= 2 && extraido.length <= 35) {

nomeAtualizado = extraido.charAt(0).toUpperCase() + extraido.slice(1);

setUserName(nomeAtualizado);

try { localStorage.setItem("raru_user_name", nomeAtualizado); } catch(e) {}

showToast(Nome atualizado: ${nomeAtualizado});

}

} else if (!userName && textToSend.trim().split(/\s+/).length <= 3 && textToSend.trim().length <= 25) {

const possivelNome = textToSend.trim().replace(/[.,!?]/g, '');

nomeAtualizado = possivelNome.charAt(0).toUpperCase() + possivelNome.slice(1);

setUserName(nomeAtualizado);

try { localStorage.setItem("raru_user_name", nomeAtualizado); } catch(e) {}

showToast(Nome salvo: ${nomeAtualizado});

}

​const novoHistorico = [...messages, { sender: 'user', text: textToSend, time: timeStr }];

setMessages(novoHistorico);

setInput("");

setIsProcessing(true);

setIsSpeaking(true);

​try {

const formattedHistory = novoHistorico.map(m => ({

role: m.sender === 'user' ? 'user' : 'assistant',

content: m.text

}));

​const respostaSarah = await chamarSarahGroq(formattedHistory, "Mesquita", "Rocha Sobrinho", activeTab, { status: "Online" }, nomeAtualizado || "Alexander");

​const replyTime = new Date().toLocaleTimeString('pt-BR', {hour: '2-digit', minute:'2-digit'});

setMessages(prev => [...prev, { sender: 'assistant', text: respostaSarah, time: replyTime }]);

​if (soundEnabled) falarSarah(respostaSarah, vozSelecionada);

} catch (error) {

const errorMsg = TELEMETRIA INDISPONÍVEL: Falha ao processar comando, ${nomeAtualizado || 'Alexander'}.;

setMessages(prev => [...prev, { sender: 'assistant', text: errorMsg, time: new Date().toLocaleTimeString('pt-BR', {hour: '2-digit', minute:'2-digit'}) }]);

} finally {

setIsProcessing(false);

setIsSpeaking(false);

}

};
