<!DOCTYPE html>
<html lang="pt-BR" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Projeto Cidadão Sensor - SARAH IA Core v4.0</title>
    
    <!-- Open Graph / Redes Sociais (WhatsApp, Telegram, etc.) -->
    <meta property="og:title" content="Projeto Cidadão Sensor - SARAH IA">
    <meta property="og:description" content="Monitoramento Preventivo de Defesa Civil - Mesquita / RJ">
    <meta property="og:image" content="https://phantrorfirmo08-alt.github.io/PROJETO-CIDAD-O-SENSOR-01/icon.svg">
    <meta property="og:url" content="https://phantrorfirmo08-alt.github.io/PROJETO-CIDAD-O-SENSOR-01/">
    <meta property="og:type" content="website">

    <!-- Twitter Cards -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Projeto Cidadão Sensor - SARAH IA">
    <meta name="twitter:description" content="Monitoramento Preventivo de Defesa Civil - Mesquita / RJ">
    <meta name="twitter:image" content="https://phantrorfirmo08-alt.github.io/PROJETO-CIDAD-O-SENSOR-01/icon.svg">

    <!-- Tailwind CSS & React CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: { 500: '#06b6d4', 600: '#0891b2' }
                    }
                }
            }
        }
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;700&display=swap');
        body { font-family: 'Inter', sans-serif; }
        .font-mono { font-family: 'JetBrains Mono', monospace; }
        @keyframes pulse-slow { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }
        .animate-pulse-slow { animation: pulse-slow 3s cubic-bezier(0.4, 0, 0.6, 1) infinite; }
        @keyframes marquee { 0% { transform: translateX(0%); } 100% { transform: translateX(-50%); } }
        .animate-marquee { display: flex; width: 200%; animation: marquee 25s linear infinite; }
        .animate-marquee:hover { animation-play-state: paused; }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col selection:bg-cyan-500 selection:text-slate-950">

    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        function App() {
            const [activeTab, setActiveTab] = useState('dashboard');
            const [isDarkMode, setIsDarkMode] = useState(true);
            const [deferredPrompt, setDeferredPrompt] = useState(null);
            const [showInstallBtn, setShowInstallBtn] = useState(false);
            const [lgpdAccepted, setLgpdAccepted] = useState(false);
            const [check1, setCheck1] = useState(false);
            const [check2, setCheck2] = useState(false);
            const [weather, setWeather] = useState({ temp: '--', condition: 'A carregar...', risk: 'Baixo', color: 'emerald' });

            // PWA Install prompt listener
            useEffect(() => {
                window.addEventListener('beforeinstallprompt', (e) => {
                    e.preventDefault();
                    setDeferredPrompt(e);
                    setShowInstallBtn(true);
                });
            }, []);

            const handleInstallClick = async () => {
                if (!deferredPrompt) return;
                deferredPrompt.prompt();
                const { outcome } = await deferredPrompt.userChoice;
                if (outcome === 'accepted') {
                    setDeferredPrompt(null);
                    setShowInstallBtn(false);
                }
            };

            const handleShare = async () => {
                if (navigator.share) {
                    try {
                        await navigator.share({
                            title: 'Projeto Cidadão Sensor - SARAH IA',
                            text: 'Monitoramento Preventivo de Defesa Civil - Mesquita / RJ',
                            url: 'https://phantrorfirmo08-alt.github.io/PROJETO-CIDAD-O-SENSOR-01/'
                        });
                    } catch (err) { console.log(err); }
                } else {
                    navigator.clipboard.writeText('https://phantrorfirmo08-alt.github.io/PROJETO-CIDAD-O-SENSOR-01/');
                    alert('Link copiado para a área de transferência!');
                }
            };

            return (
                <div className="flex flex-col min-h-screen bg-slate-950 text-slate-100">
                    
                    {/* LGPD Modal inicial */}
                    {!lgpdAccepted && (
                        <div className="fixed inset-0 z-50 bg-slate-950/80 backdrop-blur-md flex items-center justify-center p-4">
                            <div className="bg-slate-900 border border-cyan-500/30 rounded-2xl p-6 max-w-lg w-full shadow-2xl shadow-cyan-500/10">
                                <h2 className="text-xl font-bold text-cyan-400 mb-2">Termos LGPD & Segurança</h2>
                                <p className="text-sm text-slate-300 mb-4">
                                    Para utilizar o ecossistema do Projeto Cidadão Sensor (Mesquita - RJ), confirme os pilares de conformidade e privacidade local:
                                </p>
                                <div className="space-y-3 mb-6 text-sm text-slate-300">
                                    <label className="flex items-start gap-3 cursor-pointer">
                                        <input type="checkbox" checked={check1} onChange={(e) => setCheck1(e.target.checked)} className="mt-1 rounded border-slate-700 text-cyan-500 focus:ring-cyan-500 bg-slate-800"/>
                                        <span>Concordo com o tratamento de dados geolocalizados e operacionais para alertas preventivos da Defesa Civil.</span>
                                    </label>
                                    <label className="flex items-start gap-3 cursor-pointer">
                                        <input type="checkbox" checked={check2} onChange={(e) => setCheck2(e.target.checked)} className="mt-1 rounded border-slate-700 text-cyan-500 focus:ring-cyan-500 bg-slate-800"/>
                                        <span>Aceito os protocolos de segurança digital, LGPD e diretrizes comunitárias de Mesquita.</span>
                                    </label>
                                </div>
                                <button 
                                    disabled={!check1 || !check2}
                                    onClick={() => setLgpdAccepted(true)}
                                    className={`w-full py-3 rounded-xl font-semibold transition-all duration-300 ${check1 && check2 ? 'bg-cyan-500 hover:bg-cyan-400 text-slate-950 shadow-lg shadow-cyan-500/20 cursor-pointer' : 'bg-slate-800 text-slate-500 cursor-not-allowed'}`}
                                >
                                    Desbloquear Aplicação
                                </button>
                            </div>
                        </div>
                    )}

                    {/* Header Principal */}
                    <header className="border-b border-cyan-500/20 bg-slate-900/50 backdrop-blur-md sticky top-0 z-40 px-4 py-3 flex items-center justify-between">
                        <div className="flex items-center gap-3">
                            <div className="w-10 h-10 rounded-xl bg-cyan-500/10 border border-cyan-500/30 flex items-center justify-center text-cyan-400 font-bold">
                                S
                            </div>
                            <div>
                                <h1 className="text-sm font-bold tracking-wider text-cyan-400 uppercase">SARAH IA Core</h1>
                                <p className="text-xs text-slate-400">Projeto Cidadão Sensor - Mesquita/RJ</p>
                            </div>
                        </div>

                        {/* Botões do Cabeçalho sem Emojis & Modernizados */}
                        <div className="flex items-center gap-2">
                            {showInstallBtn && (
                                <button 
                                    onClick={handleInstallClick}
                                    className="px-3 py-1.5 rounded-xl text-xs font-medium bg-cyan-500 text-slate-950 hover:bg-cyan-400 transition-all shadow-sm shadow-cyan-500/20 flex items-center gap-1.5"
                                >
                                    Instalar
                                </button>
                            )}
                            <button 
                                onClick={handleShare}
                                className="px-3 py-1.5 rounded-xl text-xs font-medium bg-slate-800/80 hover:bg-slate-700 text-cyan-300 border border-cyan-500/30 transition-all flex items-center gap-1.5"
                            >
                                Partilhar
                            </button>
                            <button 
                                onClick={() => setIsDarkMode(!isDarkMode)}
                                className="px-3 py-1.5 rounded-xl text-xs font-medium bg-slate-800/80 hover:bg-slate-700 text-cyan-300 border border-cyan-500/30 transition-all"
                            >
                                {isDarkMode ? 'Modo Noite' : 'Modo Dia'}
                            </button>
                        </div>
                    </header>

                    {/* Navegação por Abas */}
                    <nav className="flex border-b border-cyan-500/20 bg-slate-900/30 px-4 gap-4 overflow-x-auto">
                        {['dashboard', 'chat', 'radar', 'charts'].map((tab) => (
                            <button
                                key={tab}
                                onClick={() => setActiveTab(tab)}
                                className={`py-3 px-4 text-sm font-medium capitalize border-b-2 transition-all whitespace-nowrap ${activeTab === tab ? 'border-cyan-400 text-cyan-400' : 'border-transparent text-slate-400 hover:text-slate-200'}`}
                            >
                                {tab === 'dashboard' ? 'Painel' : tab === 'chat' ? 'Chat IA' : tab === 'radar' ? 'Radar' : 'Gráficos'}
                            </button>
                        ))}
                    </nav>

                    {/* Conteúdo Dinâmico */}
                    <main className="flex-1 p-4 max-w-7xl w-full mx-auto">
                        {activeTab === 'dashboard' && (
                            <div className="space-y-4">
                                <div className="p-6 rounded-2xl bg-slate-900/60 border border-cyan-500/20 backdrop-blur-md">
                                    <h2 className="text-lg font-bold text-cyan-300 mb-2">Visão Geral do Sistema</h2>
                                    <p className="text-sm text-slate-300">
                                        Monitoramento hidrometeorológico contínuo e preventivo na região de Mesquita - RJ (Sebinho / Rocha Sobrinho).
                                    </p>
                                </div>
                            </div>
                        )}
                        {activeTab === 'chat' && (
                            <div className="flex flex-col h-[70vh] bg-slate-900/60 border border-cyan-500/20 rounded-2xl p-4">
                                <div className="flex-1 overflow-y-auto space-y-3 p-2 text-sm">
                                    <div className="p-3 rounded-xl bg-cyan-950/30 border border-cyan-500/20 text-cyan-200 max-w-[80%]">
                                        Olá! Sou a SARAH IA. Como posso auxiliar na monitorização preventiva de riscos hoje?
                                    </div>
                                </div>
                                <div className="mt-3 flex gap-2">
                                    <input type="text" placeholder="Escreva uma mensagem para a SARAH IA..." className="flex-1 bg-slate-950 border border-cyan-500/30 rounded-xl px-4 py-2.5 text-sm text-slate-100 focus:outline-none focus:border-cyan-400"/>
                                    <button className="px-5 py-2.5 bg-cyan-500 hover:bg-cyan-400 text-slate-950 font-semibold rounded-xl text-sm transition-all shadow-md shadow-cyan-500/20">
                                        Enviar
                                    </button>
                                </div>
                            </div>
                        )}
                        {activeTab === 'radar' && (
                            <div className="p-6 rounded-2xl bg-slate-900/60 border border-cyan-500/20 text-center py-20">
                                <h3 className="text-base font-semibold text-cyan-300">Radar Metereológico Ativo</h3>
                                <p className="text-xs text-slate-400 mt-1">Conexão Open-Meteo estabelecida com sucesso.</p>
                            </div>
                        )}
                        {activeTab === 'charts' && (
                            <div className="p-6 rounded-2xl bg-slate-900/60 border border-cyan-500/20 text-center py-20">
                                <h3 className="text-base font-semibold text-cyan-300">Gráficos de Tendência de Precipitação</h3>
                                <p className="text-xs text-slate-400 mt-1">Dados sincronizados em tempo real.</p>
                            </div>
                        )}
                    </main>

                    {/* Rodapé Marquee Contínuo */}
                    <footer className="border-t border-cyan-500/20 bg-slate-900/80 overflow-hidden py-2.5 text-xs text-cyan-300/80 font-mono">
                        <div className="animate-marquee whitespace-nowrap">
                            <span className="mx-6">Canais Oficiais: (21) 97299-3223</span>
                            <span className="mx-6">•</span>
                            <span className="mx-6">(21) 4042-1772</span>
                            <span className="mx-6">•</span>
                            <span className="mx-6">(21) 2042-8931</span>
                            <span className="mx-6">•</span>
                            <span className="mx-6">Plano de ação Redução de Riscos Defesa Civil Comunitária Digital</span>
                            <span className="mx-6">•</span>
                            <span className="mx-6">Canais Oficiais: (21) 97299-3223</span>
                            <span className="mx-6">•</span>
                            <span className="mx-6">(21) 4042-1772</span>
                            <span className="mx-6">•</span>
                            <span className="mx-6">(21) 2042-8931</span>
                            <span className="mx-6">•</span>
                            <span className="mx-6">Plano de ação Redução de Riscos Defesa Civil Comunitária Digital</span>
                        </div>
                    </footer>
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
