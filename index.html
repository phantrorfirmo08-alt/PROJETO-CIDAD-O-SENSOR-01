        document.addEventListener('gesturestart', function(e) { e.preventDefault(); });

        let lastTouchEnd = 0;
        document.addEventListener('touchend', function(e) {

            lastTouchEnd = now;

        const getBrasiliaGreeting = () => {
            const hour = parseInt(
                new Intl.DateTimeFormat("pt-BR", {
                    timeZone: "America/Sao_Paulo",
                    hour: "numeric",
                    hour12: false
                }).format(new Date()),
                10
            );
            if (hour >= 0 && hour < 5) return "Boa madrugada";
            if (hour >= 5 && hour < 12) return "Bom dia";
            if (hour >= 12 && hour < 18) return "Boa tarde";
            return "Boa noite";
        };

            );
        }

        function NativeHydroWindRadar({ liveWeather }) {
            const [brasiliaTime, setBrasiliaTime] = React.useState("");
            const [radarKey, setRadarKey] = React.useState(1);
            const [isCollapsed, setIsCollapsed] = React.useState(false);

            React.useEffect(() => {
                const timer = setInterval(() => {
                    const now = new Date();
                    const timeStr = new Intl.DateTimeFormat("pt-BR", {
                        timeZone: "America/Sao_Paulo",
                        hour: "2-digit",
                        minute: "2-digit",
                        second: "2-digit",
                        hour12: false
                    }).format(now);
                    setBrasiliaTime(timeStr);
                }, 1000);
                return () => clearInterval(timer);
            }, []);

            const handleReloadRadar = () => {
                setRadarKey(prev => prev + 1);
            };

            return (
                <div className={`relative w-full rounded-3xl overflow-hidden border-2 border-cyberNeon/60 shadow-2xl bg-petroleumPanel flex flex-col justify-between p-2 transition-all duration-300 ${isCollapsed ? 'h-[70px]' : 'h-[580px]'}`}>
                    <div className="absolute top-2 left-2 right-2 flex items-center justify-between z-30 bg-nightBlue/98 border border-cyberNeon/50 px-[10px] py-[5px] rounded-xl shadow-xl backdrop-blur-md" style={{ height: '48px' }}>
                        <div className="flex items-center gap-2 overflow-hidden whitespace-nowrap">

                            </span>
                        </div>
                        <div className="flex items-center gap-2 shrink-0">

                                onClick={handleReloadRadar}
                                className="px-2 py-1 bg-cyberNeon text-nightBlue rounded-lg font-black text-[10px] cursor-pointer shadow hover:bg-white transition"
                                title="Recarregar mapa meteorológico"
                            >
                                🔄 Recarregar
                            </button>
                            <button 
                                onClick={() => setIsCollapsed(!isCollapsed)}
                                className="px-2.5 py-1 bg-petroleumPanel text-cyberNeon border border-cyberNeon/40 rounded-lg font-bold text-[10px] cursor-pointer shadow hover:bg-cyberNeon/20 transition"
                            >
                                {isCollapsed ? '▼ Expandir' : '▲ Recolher'}
                            </button>
                            <span className="font-mono text-[10px] font-bold text-cyberNeon hidden sm:inline">🕒 {brasiliaTime || "00:00:00"}</span>
                        </div>
                    </div>
                    
                    {!isCollapsed && (
                        <div className="absolute inset-0 pt-[50px]">
                            <iframe 
                                key={radarKey}
                                src="https://embed.windy.com/embed2.html?lat=-22.7845&lon=-43.4190&detailLat=-22.7845&detailLon=-43.4190&width=650&height=550&zoom=11&level=surface&overlay=wind&product=ecmwf&menu=&message=&marker=true&calendar=now&pressure=true&type=map&location=coordinates&detail=true&metricWind=default&metricTemp=default" 
                                className="w-full h-full border-none relative z-10 bg-black"
                                sandbox="allow-scripts allow-same-origin allow-popups allow-forms"
                                allowFullScreen>
                            </iframe>
                        </div>
                    )}
                </div>
            );
        }

        function FieldReportModule({ onBackToChat, showToast }) {
            const [setor, setSetor] = React.useState("🛡️ Defesa Civil (Vistoria de Risco / Ocorrência)");
            const [agente, setAgente] = React.useState("Alexander da Silva Firmo");
            const [localizacao, setLocalizacao] = React.useState("");
            const [descricao, setDescricao] = React.useState("");
            const [gpsCoords, setGpsCoords] = React.useState({ lt: '', ln: '', lk: '' });
            const [gpsStatus, setGpsStatus] = React.useState("📍 GPS desligado");
            
            const [fotos, setFotos] = React.useState([
                { id: 1, status: "vazia", file: null },
                { id: 2, status: "vazia", file: null },
                { id: 3, status: "vazia", file: null },
                { id: 4, status: "vazia", file: null }
            ]);

            const capturarGps = () => {
                if (!navigator.geolocation) {
                    showToast("⚠️ Geolocalização não suportada.");
                    return;
                }
                showToast("🛰️ Acionando GPS para acompanhamento da demanda...");
                navigator.geolocation.getCurrentPosition(
                    (p) => {
                        const lt = p.coords.latitude.toFixed(6);
                        const ln = p.coords.longitude.toFixed(6);
                        const lk = `https://maps.google.com/?q=${lt},${ln}`;
                        setGpsCoords({ lt, ln, lk });
                        setLocalizacao(`${lt}, ${ln}`);
                        setGpsStatus("✅ GPS Ativo");
                        showToast(`📍 GPS Conectado! Lat: ${lt}, Lng: ${ln}`);
                    },
                    () => {
                        showToast("⚠ Falha ao obter sinal de GPS. Verifique as permissões.");
                        setGpsStatus("⚠️ Erro no GPS");
                    },
                    { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
                );
            };

            const handleFotoChange = (index, e) => {
                const file = e.target.files[0];
                if (file) {
                    const updated = [...fotos];
                    updated[index].status = "✅ OK";
                    updated[index].file = file;
                    setFotos(updated);
                    showToast(`📸 Foto ${index + 1} anexada com sucesso!`);
                }
            };

            const montarTexto = () => {
                const fCount = fotos.filter(f => f.status === "✅ OK").length;
                return `📊 *RELATÓRIO DE CAMPO - SARAH IA*\n` +
                       `🏛️ *Setor:* ${setor}\n` +
                       `👤 *Agente:* ${agente || 'Não informado'}\n` +
                       `📍 *Local:* ${localizacao || 'Não informado'}\n` +
                       (gpsCoords.lk ? `🔗 *Mapa:* ${gpsCoords.lk}\n` : ``) +
                       `📸 *Fotos anexadas:* ${fCount}/4\n` +
                       `📝 *Relato:*\n${descricao || 'Sem descrição'}`;
            };

            const copiarLaudo = () => {
                const texto = montarTexto();
                navigator.clipboard.writeText(texto).then(() => {
                    showToast("📋 Relatório copiado para a área de transferência! Pronto para colar no Word ou documento oficial.");
                }).catch(() => {
                    showToast("❌ Falha ao copiar relatório.");
                });
            };

            const enviarZap = () => {
                const texto = montarTexto();
                window.open(`https://api.whatsapp.com/send?text=${encodeURIComponent(texto)}`, '_blank');
            };

            return (
                <div className="space-y-4 max-w-xl mx-auto">
                    <div className="flex items-center justify-between glass-dark px-4 py-3 rounded-2xl border border-cyberNeon/40">
                        <span className="text-xs font-bold text-cyberNeon flex items-center gap-2">
                            <span>📋</span> Mapeamento de Campo & Vistoria (SARAH IA v5.2)
                        </span>
                        <button 
                            onClick={onBackToChat} 
                            className="px-3.5 py-1.5 bg-coralAlert/25 hover:bg-coralAlert/40 text-coralAlert border border-coralAlert/50 rounded-xl text-xs font-bold transition cursor-pointer btn-animated flex items-center gap-1.5"
                        >
                            <span>✕</span> Fechar
                        </button>
                    </div>

                    <div className="glass-dark rounded-[24px] p-6 border border-cyberNeon/40 shadow-2xl space-y-4">
                        <h2 className="text-lg font-black text-white m-0">Mapeamento de Campo & Vistoria</h2>
                        <div className="text-[10px] text-cyberNeon font-extrabold -mt-2">SARAH IA NEXUS v5.2 PRO • Cidadão Sensor</div>
                        
                        <div>
                            <label className="block text-[10px] font-extrabold text-lightSilver uppercase tracking-wider mb-1">Setor / Finalidade</label>
                            <select 
                                value={setor} 
                                onChange={(e) => setSetor(e.target.value)}
                                className="w-full bg-nightBlue border border-cyberNeon/40 rounded-xl p-3 text-xs text-lightSilver focus:ring-2 focus:ring-cyberNeon focus:outline-none"
                            >
                                <option>🛡️ Defesa Civil (Vistoria de Risco / Ocorrência)</option>
                                <option>🤝 Assistência Social (Vulnerabilidade / Cadastro)</option>
                                <option>🎓 Universidade (Pesquisa / Relatório de Extensão)</option>
                                <option>🌱 Iniciativa Comunitária / Monitoramento</option>
                            </select>
                        </div>

                        <div>
                            <label className="block text-[10px] font-extrabold text-lightSilver uppercase tracking-wider mb-1">Nome do Agente / Pesquisador</label>
                            <input 
                                type="text" 
                                value={agente} 
                                onChange={(e) => setAgente(e.target.value)}
                                placeholder="Seu nome completo" 
                                className="w-full bg-nightBlue border border-cyberNeon/40 rounded-xl p-3 text-xs text-lightSilver focus:ring-2 focus:ring-cyberNeon focus:outline-none"
                            />
                        </div>

                        <div>
                            <label className="block text-[10px] font-extrabold text-lightSilver uppercase tracking-wider mb-1">Localização</label>
                            <input 
                                type="text" 
                                value={localizacao} 
                                onChange={(e) => setLocalizacao(e.target.value)}
                                placeholder="Endereço ou Coordenadas" 
                                className="w-full bg-nightBlue border border-cyberNeon/40 rounded-xl p-3 text-xs text-lightSilver focus:ring-2 focus:ring-cyberNeon focus:outline-none"
                            />
                        </div>
                        
                        <div className="border border-dashed border-cyberNeon/60 bg-nightBlue/90 rounded-2xl p-3 flex items-center justify-between text-xs">
                            <span className="text-cyberNeon font-mono font-bold">{gpsStatus}</span>
                            <button 
                                type="button" 
                                onClick={capturarGps}
                                className="px-3.5 py-1.5 bg-cyberNeon text-nightBlue font-black rounded-xl text-xs cursor-pointer btn-animated shadow"
                            >
                                Capturar 🛰️
                            </button>
                        </div>

                        <div>
                            <div className="flex justify-between items-center mb-1">
                                <label className="block text-[10px] font-extrabold text-lightSilver uppercase tracking-wider">Relatório Técnico / Descrição (1000)</label>
                                <span className="text-[10px] text-lightSilver/60 font-mono">{descricao.length}/1000</span>
                            </div>
                            <textarea 
                                rows="4" 
                                maxLength="1000"
                                value={descricao} 
                                onChange={(e) => setDescricao(e.target.value)}
                                placeholder="Descreva as condições observadas..." 
                                className="w-full bg-nightBlue border border-cyberNeon/40 rounded-xl p-3 text-xs text-lightSilver focus:ring-2 focus:ring-cyberNeon focus:outline-none resize-none"
                            ></textarea>
                        </div>

                        <div>
                            <label className="block text-[10px] font-extrabold text-mintEmerald uppercase tracking-wider text-center mb-2">Fotos de Evidência (4)</label>
                            <div className="grid grid-cols-2 gap-3">
                                {fotos.map((f, idx) => (
                                    <label 
                                        key={f.id} 
                                        htmlFor={`foto-input-${idx}`}
                                        className="border border-dashed border-mintEmerald/50 bg-nightBlue hover:bg-nightBlue/80 rounded-2xl p-3 text-center cursor-pointer transition shadow"
                                    >

                        }).catch(() => {
                            videoRef.current.muted = true;

                        });
                    } else {
                        videoRef.current.pause();
                        setIsPlaying(false);
                    }
                }

                return String(text)

                if (!soundEnabled || !("speechSynthesis" in window)) return;

                stopSpeaking();
                const currentId = speechIdRef.current;
                voiceTimerRef.current = setTimeout(() => {
                    if (currentId !== speechIdRef.current) return;
                    const utterance = new SpeechSynthesisUtterance(cleanText);
                    utterance.lang = "pt-BR";
                    utterance.voice = escolherMelhorVoz();
                    utterance.rate = 1.0;
                    utterance.onstart = () => { if (currentId === speechIdRef.current) setIsSpeaking(true); };
                    utterance.onend = () => { if (currentId === speechIdRef.current) setIsSpeaking(false); };
