        // Radar Climático e Hidrográfico com Vento, Nuvens e Bacias em Tempo Real
        function NativeHydroWindRadar({ liveWeather }) {
            const canvasRef = React.useRef(null);

            React.useEffect(() => {
                const canvas = canvasRef.current;
                if (!canvas) return;
                const ctx = canvas.getContext('2d');
                let animationFrameId;
                let angle = 0;

                const windParticles = Array.from({ length: 18 }, () => ({
                    x: Math.random() * canvas.width,
                    y: Math.random() * canvas.height,
                    speed: 1.2 + Math.random() * 2,
                    size: 15 + Math.random() * 25
                }));

                const render = () => {
                    ctx.clearRect(0, 0, canvas.width, canvas.height);
                    ctx.fillStyle = '#030712';
                    ctx.fillRect(0, 0, canvas.width, canvas.height);

                    const centerX = canvas.width / 2;
                    const centerY = canvas.height / 2;

                    ctx.strokeStyle = 'rgba(0, 243, 255, 0.18)';
                    ctx.lineWidth = 1;
                    for (let r = 50; r < 180; r += 50) {
                        ctx.beginPath();
                        ctx.arc(centerX, centerY, r, 0, Math.PI * 2);
                        ctx.stroke();
                    }

                    ctx.beginPath();
                    ctx.moveTo(0, centerY); ctx.lineTo(canvas.width, centerY);
                    ctx.moveTo(centerX, 0); ctx.lineTo(centerX, canvas.height);
                    ctx.stroke();

                    windParticles.forEach(p => {
                        p.x += p.speed;
                        if (p.x > canvas.width + 30) p.x = -30;

                        const cloudGrad = ctx.createRadialGradient(p.x, p.y, 2, p.x, p.y, p.size);
                        cloudGrad.addColorStop(0, 'rgba(0, 243, 255, 0.25)');
                        cloudGrad.addColorStop(1, 'transparent');
                        ctx.fillStyle = cloudGrad;
                        ctx.beginPath();
                        ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                        ctx.fill();
                    });

                    ctx.save();
                    ctx.translate(centerX, centerY);
                    ctx.rotate(angle);
                    const grad = ctx.createLinearGradient(0, 0, 140, -140);
                    grad.addColorStop(0, 'rgba(0, 243, 255, 0.45)');
                    grad.addColorStop(1, 'transparent');
                    ctx.fillStyle = grad;
                    ctx.beginPath();
                    ctx.moveTo(0, 0);
                    ctx.arc(0, 0, 160, -Math.PI / 2, 0);
                    ctx.lineTo(0, 0);
                    ctx.fill();
                    ctx.restore();

                    angle += 0.02;

                    const bacias = [
                        { name: "Rio Sarapuí", x: centerX - 70, y: centerY - 50, color: "#3498db", status: "Estável" },
                        { name: "Rio Dona Eugênia", x: centerX + 60, y: centerY - 60, color: "#2ecc71", status: "Monitorado" },
                        { name: "Rio Prata", x: centerX + 40, y: centerY + 60, color: "#f1c40f", status: "Atenção" },
                        { name: "Base A Chave da Esperança", x: centerX - 10, y: centerY + 15, color: "#e67e22", status: "Operacional" }
                    ];

                    bacias.forEach(b => {
                        ctx.fillStyle = b.color;
                        ctx.beginPath();
                        ctx.arc(b.x, b.y, 6, 0, Math.PI * 2);
                        ctx.fill();

                        ctx.strokeStyle = '#ffffff';
                        ctx.lineWidth = 1.5;
                        ctx.stroke();

                        ctx.fillStyle = '#00f3ff';
                        ctx.font = '10px monospace';
                        ctx.fillText(`${b.name} (${b.status})`, b.x + 10, b.y + 3);
                    });

                    ctx.fillStyle = '#00ff88';
                    ctx.font = '10px monospace';
                    const ventoStr = liveWeather ? `VENTO: ${liveWeather.wind_speed_10m || 12} km/h` : 'VENTO: 14 km/h';
                    ctx.fillText(ventoStr, 12, canvas.height - 12);

                    animationFrameId = requestAnimationFrame(render);
                };

                render();
                return () => cancelAnimationFrame(animationFrameId);
            }, [liveWeather]);

            return (
                <div className="relative w-full h-[320px] rounded-2xl overflow-hidden border-2 border-cyberCyan/50 shadow-2xl bg-slate-950 flex items-center justify-center">
                    <canvas ref={canvasRef} width="420" height="300" className="w-full h-full object-contain"></canvas>
                    <div className="absolute top-3 left-3 z-10 bg-[#030712]/90 border border-cyberCyan/50 px-3 py-1 rounded-xl font-mono text-[11px] text-cyan-300 shadow-md backdrop-blur-md flex items-center gap-2">
                        <span className="w-2.5 h-2.5 rounded-full bg-emeraldGlow animate-ping"></span>
                        RADAR CLIMÁTICO (VENTO, NUVENS & BACIAS)
                    </div>
                </div>
            );
        }

            React.useEffect(() => {

                const handleOffline = () => { setIsOnline(false); showToast("⚠️ Conexão perdida. A operar em modo offline."); };
                window.addEventListener('online', handleOnline);
                window.addEventListener('offline', handleOffline);

                };
            }, []);

            React.useEffect(() => {
                document.documentElement.style.fontSize = `${fontSizeScale}%`;
            }, [fontSizeScale]);

            React.useEffect(() => {
                window.addEventListener('beforeinstallprompt', (e) => {
                    e.preventDefault();
                    setDeferredPrompt(e);
                });
            }, []);

            const handleInstallApp = async () => {
                if (deferredPrompt) {
                    deferredPrompt.prompt();
                    const { outcome } = await deferredPrompt.userChoice;
                    if (outcome === 'accepted') {
                        setDeferredPrompt(null);
                        showToast("🎉 Aplicação instalada com sucesso!");
                    }
                } else {
                    setInstallModalOpen(true);
                }
            };

            const carregarVozes = () => {
                if ("speechSynthesis" in window) {
                    voicesRef.current = window.speechSynthesis.getVoices();
                }
            };

            React.useEffect(() => {
                if (!("speechSynthesis" in window)) return;
                carregarVozes();
                window.speechSynthesis.onvoiceschanged = carregarVozes;
                return () => {
                    window.speechSynthesis.cancel();
                    window.speechSynthesis.onvoiceschanged = null;
                };
            }, []);

            const limparTextoParaFala = (text) => {
                return String(text)
                    .replace(/[#*_`~]/g, "")
                    .replace(/\[(.*?)\]\(.*?\)/g, "$1")
                    .replace(/https?:\/\/\S+/g, "")
                    .replace(/\s+/g, " ")
                    .trim();
            };

            const escolherMelhorVoz = () => {
                const voices = voicesRef.current.length ? voicesRef.current : window.speechSynthesis.getVoices();
                const preferidas = ["Microsoft Francisca Online", "Microsoft Maria", "Google português do Brasil", "Luciana", "Felipe"];
                for (let pref of preferidas) {
                    const match = voices.find(v => v.name.toLowerCase().includes(pref.toLowerCase()));
                    if (match) return match;
                }
                return voices.find((v) => v.lang.toLowerCase().includes("pt")) || voices[0];
            };

            const stopSpeaking = () => {
                speechIdRef.current += 1;
                if (voiceTimerRef.current) {
                    clearTimeout(voiceTimerRef.current);
                    voiceTimerRef.current = null;
                }
                if ("speechSynthesis" in window) window.speechSynthesis.cancel();
                setIsSpeaking(false);
            };

            const speakText = (text) => {
                if (!soundEnabled || !("speechSynthesis" in window)) return;
                const cleanText = limparTextoParaFala(text);
                if (!cleanText) return;
                stopSpeaking();
                const currentId = speechIdRef.current;
                voiceTimerRef.current = setTimeout(() => {
                    if (currentId !== speechIdRef.current) return;
                    const utterance = new SpeechSynthesisUtterance(cleanText);
                    utterance.lang = "pt-BR";
                    utterance.voice = escolherMelhorVoz() || null;
                    utterance.rate = 0.95;
                    utterance.onstart = () => { if (currentId === speechIdRef.current) setIsSpeaking(true); };
                    utterance.onend = () => { if (currentId === speechIdRef.current) setIsSpeaking(false); };
                    utterance.onerror = () => setIsSpeaking(false);
                    window.speechSynthesis.speak(utterance);
                }, 200);
            };

            React.useEffect(() => {

                )

                const tempData = hourlyForecast && hourlyForecast.temperature_2m

                    : [24, 23.5, 23, 22.5, 24, 27, 29, 31];

                const precipData = hourlyForecast && hourlyForecast.precipitation 
                    ? hourlyForecast.precipitation.slice(nowIndex, nowIndex + 8)
                    : [2, 5, 12, 28, 15, 8, 3, 1];

                const colors = ['#3498db', '#2ecc71', '#f1c40f', '#e67e22', '#e74c3c', '#9b59b6', '#1abc9c', '#34495e'];

                    chartInstanceRef.current.data.datasets[0].data = tempData;
                    chartInstanceRef.current.data.datasets[1].data = precipData;

                                    label: "Temperatura (°C)",

                                    backgroundColor: "rgba(0, 243, 255, 0.15)",

                                    fill: true,

                                {
                                    type: "bar",
                                    label: "Precipitação (Sarapuí, Eugênia, Prata)",
                                    data: precipData,
                                    backgroundColor: colors,
                                    yAxisID: 'y1'
                                }
                            ]
                        },
                        options: {
                            responsive: true,
                            maintainAspectRatio: false,
                            scales: {
                                y: { type: 'linear', position: 'left', ticks: { color: "#00f3ff", font: { size: 9 } }, grid: { color: "rgba(148,163,184,0.1)" } },
                                y1: { type: 'linear', position: 'right', grid: { drawOnChartArea: false }, ticks: { color: "#00ff88", font: { size: 9 } } },
                                x: { ticks: { color: "#e2e8f0", font: { size: 9 } }, grid: { color: "rgba(148,163,184,0.1)" } }
                            },
                            plugins: { legend: { labels: { color: "#f8fafc", font: { size: 10 } } } }
                        }
                    });
                }
            }, [hourlyForecast, darkMode]);

            // Funções de Campo para o Técnico / Comunidade
            const handleFileUpload = (e) => {
                if (accessMode !== "restricted" && !isPlanUnlocked) {
                    showToast("⚠️ Modo Acesso Livre: Upload restrito.");
                    return;
                }
                const files = Array.from(e.target.files);
                files.forEach(file => {
                    const reader = new FileReader();
                    reader.onload = (uploadEvent) => {
                        const newRecord = {
                            id: Date.now() + Math.random(),
                            name: file.name,
                            size: (file.size / (1024 * 1024)).toFixed(2) + " MB",
                            type: file.type.startsWith('video') ? 'video' : 'document',
                            category: selectedCategory,
                            date: new Date().toLocaleDateString("pt-BR") + " " + new Date().toLocaleTimeString("pt-BR", {hour: '2-digit', minute:'2-digit'}),
                            url: uploadEvent.target.result
                        };
                        setMediaList(prev => [...prev, newRecord]);
                        showToast(`📁 Item "${file.name}" guardado em Apresentações e Registros!`);
                    };
                    reader.readAsDataURL(file);
                });
            };

            const removeMediaItem = (id) => {
                if (accessMode !== "restricted" && !isPlanUnlocked) {
                    showToast("⚠️ Modo Acesso Livre: Exclusão restrita.");
                    return;
                }
                setMediaList(prev => prev.filter(item => item.id !== id));
                showToast("🗑️ Registro removido.");
            };

            const toggleListening = () => {
                const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
                if (!SpeechRec) { showToast("⚠️ Reconhecimento de voz não suportado."); return; }
                if (isListening) { setIsListening(false); return; }
                const rec = new SpeechRec();
                rec.lang = "pt-BR";
                rec.onstart = () => setIsListening(true);
                rec.onresult = (event) => {
                    const text = event.results[0][0].transcript;
                    setInput(text);
                    setIsListening(false);
                    handleSendMessage(text);
                };
                rec.onerror = () => setIsListening(false);
                rec.onend = () => setIsListening(false);
                rec.start();
            };

            const handleSendMessage = async (textCustom) => {
                stopSpeaking();
                const textToSend = textCustom !== undefined ? textCustom : input;
                if (!textToSend.trim() || isLoadingChat) return;

                const userMsg = {
                    id: `${Date.now()}-user`,
                    sender: "user",
                    text: textToSend.trim(),
                    timestamp: new Date().toLocaleTimeString("pt-BR", { hour: "2-digit", minute: "2-digit" })
                };

                const historico = [...messages, userMsg].slice(-8).map((m) => ({
                    role: m.sender === "user" ? "user" : "assistant",
                    content: m.text
                }));

                setMessages((prev) => [...prev, userMsg]);
                setInput("");
                setIsLoadingChat(true);

                const weatherContext = liveWeather
                    ? `Mesquita/RJ: Temp ${liveWeather.temperature_2m}°C, Umidade ${liveWeather.relative_humidity_2m}%, Chuva ${liveWeather.precipitation} mm.`
                    : "";

                try {
                    const response = await fetch(CLOUDFLARE_WORKER_URL, {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({
                            model: "openai/gpt-oss-120b",
                            messages: [
                                {
                                    role: "system",
                                    content: `Você é a SARAH IA Core v5.2 PRO, Defesa Civil Comunitária (Grupo Comunitário A Chave da Esperança, Mesquita/RJ). ${weatherContext} Lema: "Prevenção não é mídia: é gente atenta." Responda em português do Brasil.`
                                },
                                ...historico
                            ],
                            temperature: 0.4,
                            max_tokens: 900
                        })
                    });

                    const data = await response.json();
                    const reply = data?.choices?.[0]?.message?.content || data?.message || "Sem resposta do servidor.";
                    
                    const assistantMsg = {
                        id: `${Date.now()}-sarah`,
                        sender: "sarah",
                        text: reply,
                        timestamp: new Date().toLocaleTimeString("pt-BR", { hour: "2-digit", minute: "2-digit" })
                    };

                    setMessages((prev) => [...prev, assistantMsg]);
                    speakText(reply);
                } catch (e) {
                    const errorMsg = {
                        id: `${Date.now()}-err`,
                        sender: "sarah",
                        text: "Erro de conexão com o cofre neural.",
                        timestamp: new Date().toLocaleTimeString("pt-BR", { hour: "2-digit", minute: "2-digit" })
                    };
                    setMessages((prev) => [...prev, errorMsg]);
                } finally {
                    setIsLoadingChat(false);
                }
            };

            return (

                                </div>

                                <div className="flex-1 overflow-y-auto p-4 space-y-4">

                                                <SarahAvatar showStatus={true} isLarge={true} />
                                                <h2 className="font-mono text-base font-bold text-slate-100 mt-4 mb-2">SARAH IA • Nexus Core v5.2</h2>
                                                <p className="text-xs font-mono text-cyberCyan">"Prevenção não é mídia: é gente atenta."</p>

                                                <div className="text-[10px] opacity-75 font-mono mb-1">{m.sender === "user" ? "Você" : "SARAH IA"} • {m.timestamp}</div>
                                                <div className="whitespace-pre-wrap">{m.text}</div>
                                            </div>
                                        </div>
                                    ))}

                                    {isLoadingChat && (

                                        </div>
                                    )}
                                </div>

                                <div className="p-3 bg-[#030712] border-t border-cyberCyan/30 flex items-center gap-3">
                                    <button onClick={toggleListening} className={`w-12 h-12 rounded-xl flex items-center justify-center cursor-pointer ${isListening ? "bg-cyberCyan text-slate-950 animate-pulse" : "bg-[#060f1e] text-cyberCyan border border-cyberCyan/40"}`}>🎤</button>
                                    <input
                                        type="text"
                                        value={input}
                                        onChange={(e) => setInput(e.target.value)}
                                        onKeyDown={(e) => { if (e.key === "Enter") handleSendMessage(); }}
                                        placeholder="Digite seu comando para a SARAH IA..."
                                        className="flex-1 bg-[#060f1e] border border-cyberCyan/40 rounded-2xl px-4 py-3 text-sm text-slate-100 font-sans focus:outline-none"
                                    />
                                    <button onClick={() => handleSendMessage()} disabled={isLoadingChat || !input.trim()} className="w-12 h-12 rounded-xl bg-gradient-to-r from-cyberCyan to-emeraldGlow text-slate-950 flex items-center justify-center font-bold cursor-pointer disabled:opacity-30">➤</button>
                                </div>
                            </div>
                        )}

                    </main>

                    {/* MODAL DE APRESENTAÇÕES E REGISTROS DE CAMPO COMPLETO */}
                    {actionPlanOpen && (
                        <div className="fixed inset-0 bg-[#030712]/90 backdrop-blur-md z-50 flex items-center justify-center p-4">
                            <div className="glass-dark border border-cyberCyan/40 w-full max-w-3xl rounded-3xl shadow-2xl overflow-hidden flex flex-col max-h-[92vh]">

                                    <h3 className="font-mono text-cyberCyan text-sm font-bold flex items-center gap-2">
                                        <span>🎬</span> Apresentações e Registros de Campo {accessMode === 'free' ? '(Acesso Livre 🔓)' : '(Restrito 🔒)'}
                                    </h3>
                                    <button onClick={() => { setActionPlanOpen(false); setPinInput(""); }} className="text-slate-400 hover:text-white font-mono text-xs px-3 py-1 rounded-lg bg-[#030712] border border-slate-700 cursor-pointer">✕ Fechar</button>

                                    {accessMode === "restricted" && !isPlanUnlocked ? (
                                        <div className="flex flex-col items-center text-center space-y-4 py-10">
                                            <div className="w-20 h-20 rounded-3xl bg-cyan-500/15 border-2 border-cyberCyan/60 flex items-center justify-center text-cyberCyan text-2xl">🔒</div>
                                            <div>
                                                <h4 className="font-bold text-slate-100 font-mono text-base">Painel de Registros Comunitários</h4>
                                                <p className="text-xs text-cyberCyan font-mono mt-1">Insira o PIN de segurança autorizado (24,25,30)</p>
                                            </div>
                                            <div className="w-full max-w-sm flex gap-2 pt-2">
                                                <input
                                                    type="password"
                                                    value={pinInput}
                                                    onChange={(e) => setPinInput(e.target.value)}

                                                        if (e.key === "Enter" && (pinInput.trim() === "24,25,30" || pinInput.trim() === "24 25 30" || pinInput.trim() === "242530")) {

                                                    placeholder="Digite o PIN"

                                                <button
