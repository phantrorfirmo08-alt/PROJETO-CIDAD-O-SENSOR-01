<!DOCTYPE html>
<html lang="pt-BR" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sarah IA vs 4.0 - Defesa Civil Mesquita</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        brand: {
                            dark: "#020617",
                            light: "#f8fafc"
                        }
                    }
                }
            }
        };
    </script>
    <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="">
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <meta name="theme-color" content="#020617">
    <style>
        @keyframes marquee {
            0% { transform: translateX(0%); }
            100% { transform: translateX(-50%); }
        }
        .animate-marquee {
            display: inline-flex;
            white-space: nowrap;
            animation: marquee 25s linear infinite;
        }
        html, body, #root {
            min-height: 100%;
            margin: 0;
        }
        body {
            overflow-x: hidden;
        }
        .leaflet-container {
            z-index: 1;
        }
    </style>
</head>
<body class="min-h-screen bg-slate-950 text-slate-100 select-none">
    <div id="root"></div>
    <script type="text/babel">
        const CLOUDFLARE_WORKER_URL = "https://sarah-envelope.phantrorfirmo08.workers.dev/";

        const getBrasiliaGreeting = () => {
            const hour = parseInt(
                new Intl.DateTimeFormat("pt-BR", {
                    timeZone: "America/Sao_Paulo",
                    hour: "numeric",
                    hour12: false
                }).format(new Date()),
                10
            );
            if (hour >= 0 && hour < 5) return "Boa madrugada";
            if (hour >= 5 && hour < 12) return "Bom dia";
            if (hour >= 12 && hour < 18) return "Boa tarde";
            return "Boa noite";
        };

        // AVATAR CIBERNÉTICO COM ESTÉTICA DE METAL CROMADO, CIRCUITOS EM NEON E PISCAR DE OLHOS
        function SarahAvatar({ size = "w-10 h-10", showStatus = true, isLarge = false }) {
            const [isBlinking, setIsBlinking] = React.useState(false);

            React.useEffect(() => {
                let timeoutId;
                const triggerBlink = () => {
                    setIsBlinking(true);
                    setTimeout(() => setIsBlinking(false), 150);
                    const randomTime = Math.floor(Math.random() * (6000 - 3000 + 1)) + 3000;
                    timeoutId = setTimeout(triggerBlink, randomTime);
                };
                const initialTime = Math.floor(Math.random() * (6000 - 3000 + 1)) + 3000;
                timeoutId = setTimeout(triggerBlink, initialTime);
                return () => clearTimeout(timeoutId);
            }, []);

            const dimensionClass = isLarge ? "w-28 h-28" : size;

            return (
                <div className="relative inline-flex items-center justify-center shrink-0">
                    <div className={`${dimensionClass} rounded-full bg-gradient-to-b from-slate-300 via-slate-500 to-slate-800 border-2 border-cyan-400 shadow-[0_0_20px_rgba(6,182,212,0.5)] flex items-center justify-center relative overflow-hidden select-none`}>
                        {/* Linhas de circuito cibernético inspiradas na referência visual */}
                        <svg className="w-full h-full absolute inset-0 text-cyan-400 opacity-80 pointer-events-none" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <path d="M50 10 V25 M32 18 Q50 32 68 18 M28 40 H38 M62 40 H72 M50 75 V90" stroke="currentColor" strokeWidth="1.5" strokeOpacity="0.8"/>
                            <circle cx="50" cy="90" r="2.5" fill="currentColor" className="animate-pulse" />
                        </svg>

                        {/* Olhos Cibernéticos com Lógica de Piscar */}
                        <div className="absolute inset-0 flex items-center justify-center gap-3.5">
                            <div className="w-4 h-2.5 bg-cyan-200 rounded-full shadow-[0_0_12px_#22d3ee] flex items-center justify-center transition-all duration-75"
                                 style={{ transform: isBlinking ? 'scaleY(0.1)' : 'scaleY(1)' }}>
                                <div className="w-1.5 h-1.5 bg-white rounded-full"></div>
                            </div>
                            <div className="w-4 h-2.5 bg-cyan-200 rounded-full shadow-[0_0_12px_#22d3ee] flex items-center justify-center transition-all duration-75"
                                 style={{ transform: isBlinking ? 'scaleY(0.1)' : 'scaleY(1)' }}>
                                <div className="w-1.5 h-1.5 bg-white rounded-full"></div>
                            </div>
                        </div>
                    </div>
                    {showStatus && (
                        <div className={`absolute ${isLarge ? 'bottom-1 right-1 w-4 h-4 border-2' : '-bottom-0.5 right-0.5 w-3 h-3 border'} bg-emerald-500 rounded-full border-slate-950 shadow-md animate-pulse`} title="Sistema Operacional Ativo"></div>
                    )}
                </div>
            );
        }

        function App() {
            const [darkMode, setDarkMode] = React.useState(true);
            const [soundEnabled, setSoundEnabled] = React.useState(true);
            const [isSpeaking, setIsSpeaking] = React.useState(false);
            const [isListening, setIsListening] = React.useState(false);
            const [liveWeather, setLiveWeather] = React.useState(null);
            const [hourlyForecast, setHourlyForecast] = React.useState(null);
            
            // Estados de Modais
            const [mapOpen, setMapOpen] = React.useState(false);
            const [chartOpen, setChartOpen] = React.useState(false);
            const [galleryOpen, setGalleryOpen] = React.useState(false);
            const [pinModalOpen, setPinModalOpen] = React.useState(false);
            const [pinInput, setPinInput] = React.useState("");
            const [pinError, setPinError] = React.useState(false);

            // Escala Real de Fonte (0: Pequena, 1: Normal, 2: Grande)
            const [fontLevel, setFontLevel] = React.useState(1);

            // LGPD Inicial (Bloqueante)
            const [termsAccepted, setTermsAccepted] = React.useState(
                () => localStorage.getItem("sarah_lgpd_accepted") === "true"
            );
            const [chk1, setChk1] = React.useState(false);
            const [chk2, setChk2] = React.useState(false);

            const [messages, setMessages] = React.useState([]);
            const [input, setInput] = React.useState("");
            const [isLoadingChat, setIsLoadingChat] = React.useState(false);
            const [hasIntroduced, setHasIntroduced] = React.useState(
                () => localStorage.getItem("sarah_introduced") === "1"
            );

            const speechIdRef = React.useRef(0);
            const voiceTimerRef = React.useRef(null);
            const voicesRef = React.useRef([]);
            const mapRef = React.useRef(null);
            const mapInstanceRef = React.useRef(null);
            const chartRef = React.useRef(null);
            const chartInstanceRef = React.useRef(null);

            const carregarVozes = () => {
                if ("speechSynthesis" in window) {
                    voicesRef.current = window.speechSynthesis.getVoices();
                }
            };

            React.useEffect(() => {
                if (!("speechSynthesis" in window)) return;
                carregarVozes();
                window.speechSynthesis.onvoiceschanged = carregarVozes;
                return () => {
                    window.speechSynthesis.cancel();
                    window.speechSynthesis.onvoiceschanged = null;
                };
            }, []);

            const limparTextoParaFala = (text) => {
                return String(text)
                    .replace(/[#*_`~]/g, "")
                    .replace(/\[(.*?)\]\(.*?\)/g, "$1")
                    .replace(/https?:\/\/\S+/g, "")
                    .replace(/\s+/g, " ")
                    .trim();
            };

            const escolherMelhorVoz = () => {
                const voices = voicesRef.current.length
                    ? voicesRef.current
                    : window.speechSynthesis.getVoices();
                const preferidas = [
                    "Google português do Brasil",
                    "Google Português do Brasil",
                    "Microsoft Francisca",
                    "Microsoft Maria"
                ];
                return (
                    voices.find((voice) =>
                        preferidas.some((name) =>
                            voice.name.toLowerCase().includes(name.toLowerCase())
                        )
                    ) ||
                    voices.find((voice) => voice.lang.toLowerCase() === "pt-br") ||
                    voices.find((voice) => voice.lang.toLowerCase().startsWith("pt")) ||
                    voices[0]
                );
            };

            const stopSpeaking = () => {
                speechIdRef.current += 1;
                if (voiceTimerRef.current) {
                    clearTimeout(voiceTimerRef.current);
                    voiceTimerRef.current = null;
                }
                if ("speechSynthesis" in window) {
                    window.speechSynthesis.cancel();
                }
                setIsSpeaking(false);
            };

            const speakText = (text) => {
                if (!soundEnabled || !("speechSynthesis" in window)) return;
                const cleanText = limparTextoParaFala(text);
                if (!cleanText) return;
                stopSpeaking();
                const currentId = speechIdRef.current;
                voiceTimerRef.current = setTimeout(() => {
                    if (currentId !== speechIdRef.current) return;
                    const utterance = new SpeechSynthesisUtterance(cleanText);
                    const voice = escolherMelhorVoz();
                    utterance.lang = "pt-BR";
                    utterance.voice = voice || null;
                    utterance.rate = 0.92;
                    utterance.pitch = 1.02;
                    utterance.volume = 1;
                    utterance.onstart = () => {
                        if (currentId === speechIdRef.current) setIsSpeaking(true);
                    };
                    utterance.onend = () => {
                        if (currentId === speechIdRef.current) setIsSpeaking(false);
                    };
                    utterance.onerror = () => setIsSpeaking(false);
                    window.speechSynthesis.speak(utterance);
                }, 250);
            };

            React.useEffect(() => {
                if (!termsAccepted || hasIntroduced) return;
                const greeting = getBrasiliaGreeting();
                const presentation = `${greeting}, sou a Sarah IA vs 4.0, assistente de automação e defesa civil. Em que posso ajudar?`;
                const timer = setTimeout(() => {
                    if (!soundEnabled) return;
                    setHasIntroduced(true);
                    localStorage.setItem("sarah_introduced", "1");
                    speakText(presentation);
                }, 700);
                return () => clearTimeout(timer);
            }, [termsAccepted, hasIntroduced, soundEnabled]);

            // Clima Open-Meteo
            React.useEffect(() => {
                fetch(
                    "https://api.open-meteo.com/v1/forecast" +
                    "?latitude=-22.7845&longitude=-43.4140" +
                    "&current=temperature_2m,relative_humidity_2m,precipitation,weather_code,wind_speed_10m" +
                    "&hourly=temperature_2m,precipitation_probability,precipitation"
                )
                    .then((response) => response.json())
                    .then((data) => {
                        if (data && data.current) setLiveWeather(data.current);
                        if (data && data.hourly) setHourlyForecast(data.hourly);
                    })
                    .catch((error) => console.warn("Clima indisponível:", error));
            }, []);

            const clearChat = () => {
                setMessages([]);
            };

            const installPwa = () => {
                alert("Para instalar o aplicativo Sarah IA vs 4.0 no seu celular, abra o menu do navegador e selecione 'Adicionar à tela inicial'.");
            };

            const changeFontSize = (direction) => {
                if (direction === 'up' && fontLevel < 2) setFontLevel(l => l + 1);
                if (direction === 'down' && fontLevel > 0) setFontLevel(l => l - 1);
            };

            const getFontClass = () => {
                if (fontLevel === 0) return "text-xs";
                if (fontLevel === 2) return "text-lg";
                return "text-sm";
            };

            // Validação PIN Cidadão Sensor (0001)
            const verifyPin = () => {
                if (pinInput === "0001") {
                    setPinModalOpen(false);
                    setPinInput("");
                    setPinError(false);
                    setGalleryOpen(true);
                } else {
                    setPinError(true);
                    setPinInput("");
                }
            };

            // Leaflet Map
            React.useEffect(() => {
                if (mapOpen && mapRef.current && !mapInstanceRef.current) {
                    const lat = -22.7845;
                    const lng = -43.4140;
                    const map = L.map(mapRef.current).setView([lat, lng], 13);
                    
                    L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
                        maxZoom: 19,
                        attribution: "© OpenStreetMap contributors | Sarah IA vs 4.0"
                    }).addTo(map);

                    fetch('https://api.rainviewer.com/public/weather-maps.json')
                        .then(res => res.json())
                        .then(apiData => {
                            if (apiData?.radar?.past?.length > 0) {
                                const latestFrame = apiData.radar.past[apiData.radar.past.length - 1];
                                L.tileLayer(`https://tile.rainviewer.com${latestFrame.path}/256/{z}/{x}/{y}/2/1_1.png`, {
                                    opacity: 0.65,
                                    attribution: 'Radar © RainViewer'
                                }).addTo(map);
                            }
                        })
                        .catch(err => console.warn("Radar indisponível:", err));

                    L.marker([lat, lng])
                        .addTo(map)
                        .bindPopup("<b>Setor:</b> Rocha Sobrinho / Sebinho, Mesquita - RJ")
                        .openPopup();

                    mapInstanceRef.current = map;
                }
                if (mapOpen && mapInstanceRef.current) {
                    setTimeout(() => mapInstanceRef.current?.invalidateSize(), 100);
                }
                if (!mapOpen && mapInstanceRef.current) {
                    mapInstanceRef.current.remove();
                    mapInstanceRef.current = null;
                }
            }, [mapOpen]);

            // Chart.js
            React.useEffect(() => {
                if (!chartOpen || !chartRef.current) return;
                if (chartInstanceRef.current) {
                    chartInstanceRef.current.destroy();
                    chartInstanceRef.current = null;
                }

                const ctx = chartRef.current.getContext("2d");
                const nowIndex = new Date().getHours();
                const labels = hourlyForecast?.time 
                    ? hourlyForecast.time.slice(nowIndex, nowIndex + 8).map(t => t.split("T")[1]) 
                    : ["00:00", "03:00", "06:00", "09:00", "12:00", "15:00", "18:00", "21:00"];
                const tempData = hourlyForecast?.temperature_2m 
                    ? hourlyForecast.temperature_2m.slice(nowIndex, nowIndex + 8) 
                    : [24, 23, 22, 25, 28, 29, 27, 25];

                chartInstanceRef.current = new Chart(ctx, {
                    type: "line",
                    data: {
                        labels: labels,
                        datasets: [{
                            label: "Temperatura (°C)",
                            data: tempData,
                            borderColor: "#06b6d4",
                            backgroundColor: "rgba(6, 182, 212, 0.1)",
                            borderWidth: 2,
                            fill: true,
                            tension: 0.3
                        }]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        scales: {
                            y: {
                                grid: { color: "rgba(148, 163, 184, 0.1)" },
                                ticks: { color: "#94a3b8", font: { size: 10 } }
                            },
                            x: {
                                grid: { color: "rgba(148, 163, 184, 0.1)" },
                                ticks: { color: "#94a3b8", font: { size: 10 } }
                            }
                        },
                        plugins: { legend: { labels: { color: "#e2e8f0" } } }
                    }
                });

                return () => {
                    if (chartInstanceRef.current) {
                        chartInstanceRef.current.destroy();
                        chartInstanceRef.current = null;
                    }
                };
            }, [chartOpen, hourlyForecast]);

            // Mensagem para o Cloudflare Worker / Groq
            const handleSendMessage = async (textCustom) => {
                stopSpeaking();
                const textToSend = textCustom !== undefined ? textCustom : input;
                if (!textToSend.trim() || isLoadingChat) return;

                const userMsg = {
                    id: `${Date.now()}-user`,
                    sender: "user",
                    text: textToSend.trim(),
                    timestamp: new Date().toLocaleTimeString("pt-BR", { hour: "2-digit", minute: "2-digit" })
                };

                const historico = [...messages, userMsg].slice(-8).map((m) => ({
                    role: m.sender === "user" ? "user" : "assistant",
                    content: m.text
                }));

                setMessages((prev) => [...prev, userMsg]);
                setInput("");
                setIsLoadingChat(true);

                const weatherContext = liveWeather
                    ? `Condições atuais em Mesquita/RJ: Temperatura ${liveWeather.temperature_2m}°C, Umidade ${liveWeather.relative_humidity_2m}%, Chuva ${liveWeather.precipitation} mm, Vento ${liveWeather.wind_speed_10m} km/h.`
                    : "";

                try {
                    const response = await fetch(CLOUDFLARE_WORKER_URL, {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({
                            model: "openai/gpt-oss-120b",
                            messages: [
                                {
                                    role: "system",
                                    content: `Você é a Sarah IA vs 4.0, assistente oficial de monitoramento preventivo e Defesa Civil em Mesquita/RJ. ${weatherContext} Responda em português do Brasil de forma clara e objetiva.`
                                },
                                ...historico
                            ],
                            temperature: 0.6,
                            max_tokens: 900
                        })
                    });

                    const data = await response.json();
                    if (!response.ok) throw new Error(data?.error || "Erro no servidor.");

                    const reply = data?.choices?.[0]?.message?.content || data?.message || data?.reply;
                    if (!reply) throw new Error("Sem resposta da IA.");

                    const assistantMsg = {
                        id: `${Date.now()}-assistant`,
                        sender: "sarah",
                        text: reply,
                        timestamp: new Date().toLocaleTimeString("pt-BR", { hour: "2-digit", minute: "2-digit" })
                    };

                    setMessages((prev) => [...prev, assistantMsg]);
                    speakText(reply);
                } catch (err) {
                    console.error("Erro na API:", err);
                    const errorMsg = {
                        id: `${Date.now()}-error`,
                        sender: "sarah",
                        text: "Erro ao conectar com a inteligência artificial através do cofre seguro.",
                        timestamp: new Date().toLocaleTimeString("pt-BR", { hour: "2-digit", minute: "2-digit" })
                    };
                    setMessages((prev) => [...prev, errorMsg]);
                } finally {
                    setIsLoadingChat(false);
                }
            };

            return (
                <div className={`min-h-screen bg-slate-950 text-slate-100 flex flex-col font-sans relative overflow-x-hidden ${getFontClass()}`}>
                    
                    {/* 1. TERMO DE RESPONSABILIDADE LGPD INICIAL (CARTÃO DE VISITA BLOQUEANTE) */}
                    {!termsAccepted && (
                        <div className="fixed inset-0 z-50 bg-slate-950/95 backdrop-blur-md flex items-center justify-center p-4">
                            <div className="bg-slate-900 border-2 border-cyan-500/50 rounded-3xl max-w-md w-full p-6 shadow-[0_0_30px_rgba(6,182,212,0.3)] flex flex-col gap-4">
                                <div className="flex items-center gap-3">
                                    <div className="w-12 h-12 rounded-2xl bg-cyan-500/10 border border-cyan-400 flex items-center justify-center text-cyan-400 font-bold text-xl">🛡️</div>
                                    <div>
                                        <h2 className="text-base font-bold text-cyan-300">Sarah IA vs 4.0</h2>
                                        <p className="text-xs text-slate-400">Termo de Responsabilidade & LGPD</p>
                                    </div>
                                </div>
                                <div className="bg-slate-950/80 p-3.5 rounded-xl border border-slate-800 text-xs text-slate-300 space-y-2">
                                    <p className="font-semibold text-cyan-400">Três Pilares de Proteção de Dados:</p>
                                    <ul className="list-disc pl-4 space-y-1 text-slate-400">
                                        <li><strong className="text-slate-200">Transparência:</strong> Uso claro de dados operacionais e defesa civil.</li>
                                        <li><strong className="text-slate-200">Segurança Avançada:</strong> Criptografia e controle de acesso com PIN.</li>
                                        <li><strong className="text-slate-200">Privacidade:</strong> Garantia de integridade e respeito aos dados.</li>
                                    </ul>
                                </div>
                                <div className="space-y-3 pt-1">
                                    <label className="flex items-start gap-3 cursor-pointer text-xs text-slate-300">
                                        <input type="checkbox" checked={chk1} onChange={(e) => setChk1(e.target.checked)} className="mt-0.5 rounded border-slate-700 bg-slate-950 text-cyan-500 focus:ring-cyan-500" />
                                        <span>Li e compreendi os 3 pilares fundamentais de proteção de dados da LGPD.</span>
                                    </label>
                                    <label className="flex items-start gap-3 cursor-pointer text-xs text-slate-300">
                                        <input type="checkbox" checked={chk2} onChange={(e) => setChk2(e.target.checked)} className="mt-0.5 rounded border-slate-700 bg-slate-950 text-cyan-500 focus:ring-cyan-500" />
                                        <span>Concordo com os termos de uso operacional e diretrizes de defesa civil.</span>
                                    </label>
                                </div>
                                <button
                                    disabled={!chk1 || !chk2}
                                    onClick={() => {
                                        setTermsAccepted(true);
                                        localStorage.setItem("sarah_lgpd_accepted", "true");
                                    }}
                                    className={`w-full py-3 rounded-xl font-bold text-xs transition-all shadow-lg ${
                                        chk1 && chk2
                                            ? "bg-cyan-500 hover:bg-cyan-400 text-slate-950 shadow-cyan-500/30 cursor-pointer"
                                            : "bg-slate-800 text-slate-500 cursor-not-allowed"
                                    }`}
                                >
                                    Aceitar e Entrar no Sistema
                                </button>
                            </div>
                        </div>
                    )}

                    {/* HEADER / TOPO */}
                    <header className="bg-slate-900/90 backdrop-blur-md border-b border-slate-800 px-4 py-3 flex items-center justify-between sticky top-0 z-30 shadow-md">
                        <div className="flex items-center gap-3">
                            <SarahAvatar size="w-10 h-10" showStatus={true} />
                            <div>
                                <h1 className="font-bold text-sm tracking-wide text-cyan-400">Sarah IA vs 4.0</h1>
                                <span className="text-[10px] text-emerald-400 flex items-center gap-1 font-medium">
                                    <span className="w-1.5 h-1.5 rounded-full bg-emerald-500 animate-pulse"></span> Sistema Ativo & Protegido
                                </span>
                            </div>
                        </div>

                        <div className="flex items-center gap-2">
                            {/* Controle de Fonte Real A- / A+ */}
                            <div className="flex items-center bg-slate-950 border border-slate-800 rounded-lg overflow-hidden text-xs">
                                <button onClick={() => changeFontSize('down')} className="px-2 py-1 text-slate-400 hover:bg-slate-800 transition" title="Diminuir Fonte">A-</button>
                                <span className="px-1 text-[10px] text-slate-500 border-x border-slate-800">Fonte</span>
                                <button onClick={() => changeFontSize('up')} className="px-2 py-1 text-slate-400 hover:bg-slate-800 transition" title="Aumentar Fonte">A+</button>
                            </div>
                            {/* Botão de Limpar Chat */}
                            <button onClick={clearChat} className="p-2 bg-slate-950 border border-slate-800 hover:bg-rose-950/30 rounded-lg text-slate-400 hover:text-rose-400 transition" title="Limpar Chat">🗑️</button>
                            {/* Botão de Instalar PWA */}
                            <button onClick={installPwa} className="p-2 bg-cyan-950/40 border border-cyan-800/60 rounded-lg text-cyan-300 font-medium text-xs px-3 transition">📲 <span className="hidden sm:inline">Instalar</span></button>
                        </div>
                    </header>

                    {/* CORPO / CHAT */}
                    <main className="flex-1 max-w-4xl w-full mx-auto p-4 flex flex-col gap-4 pb-36">
                        {/* Banner de Compartilhamento de Demandas */}
                        <div className="bg-gradient-to-r from-emerald-950/50 to-cyan-950/50 border border-emerald-800/40 rounded-2xl p-3.5 flex flex-col sm:flex-row items-center justify-between gap-3 shadow-md">
                            <div className="flex items-center gap-3">
                                <span className="text-2xl">📢</span>
                                <div>
                                    <h2 className="text-xs font-bold text-emerald-300">Grupo a chave da esperança</h2>
                                    <p className="text-[11px] text-slate-400">Envie suas ocorrências e ajude a fortalecer nossa rede de defesa civil.</p>
                                </div>
                            </div>
                            <a href="https://chat.whatsapp.com/D1wrk9nTBH57Wya2Uv44ZW?s=sh&p=a&mlu=4&ilr=4" target="_blank" rel="noopener noreferrer" className="bg-emerald-600 hover:bg-emerald-500 text-slate-950 font-bold px-4 py-2 rounded-xl text-xs shadow-lg transition-all whitespace-nowrap">
                                Entrar no Grupo ↗
                            </a>
                        </div>

                        {/* Histórico de Mensagens */}
                        <div className="flex-1 space-y-3 flex flex-col">
                            {messages.length === 0 && (
                                <div className="flex gap-3 justify-start items-start">
                                    <SarahAvatar size="w-9 h-9" showStatus={false} />
                                    <div className="max-w-[80%] p-4 rounded-2xl bg-slate-900 border border-slate-800 text-slate-200 rounded-bl-sm shadow-sm">
                                        Olá! Sou a Sarah IA vs 4.0, sua assistente de monitoramento e defesa civil. Como posso ajudar?
                                    </div>
                                </div>
                            )}
                            {messages.map((m) => (
                                <div key={m.id} className={`flex gap-3 items-start ${m.sender === "user" ? "justify-end" : "justify-start"}`}>
                                    {m.sender !== "user" && <SarahAvatar size="w-9 h-9" showStatus={false} />}
                                    <div className={`max-w-[80%] p-4 rounded-2xl shadow-sm ${m.sender === "user" ? "bg-cyan-600 text-slate-950 font-medium rounded-br-sm" : "bg-slate-900 border border-slate-800 text-slate-200 rounded-bl-sm"}`}>
                                        <div className="text-[10px] opacity-75 mb-1 font-mono">{m.sender === "user" ? "Você" : "Sarah IA vs 4.0"} • {m.timestamp}</div>
                                        <div className="whitespace-pre-wrap">{m.text}</div>
                                    </div>
                                </div>
                            ))}
                            {isLoadingChat && (
                                <div className="flex gap-3 items-center justify-start">
                                    <SarahAvatar size="w-9 h-9" showStatus={false} />
                                    <div className="p-3 rounded-2xl bg-slate-900 border border-slate-800 text-cyan-400 animate-pulse text-xs font-mono">
                                        Sarah IA está processando...
                                    </div>
                                </div>
                            )}
                        </div>
                    </main>

                    {/* INPUT FIXO */}
                    <div className="fixed bottom-20 left-0 right-0 p-3 bg-slate-950/90 backdrop-blur-md border-t border-slate-800 z-20">
                        <div className="max-w-4xl mx-auto flex items-center gap-2">
                            <input
                                type="text"
                                value={input}
                                onChange={(e) => setInput(e.target.value)}
                                onKeyDown={(e) => { if (e.key === "Enter") handleSendMessage(); }}
                                placeholder="Digite sua ocorrência ou comando para a Sarah IA vs 4.0..."
                                className="flex-1 bg-slate-900 border border-slate-800 rounded-xl px-4 py-3 text-sm text-slate-100 placeholder:text-slate-500 focus:outline-none focus:border-cyan-500"
                            />
                            <button onClick={() => handleSendMessage()} className="bg-cyan-500 hover:bg-cyan-400 text-slate-950 font-bold px-5 py-3 rounded-xl text-sm shadow-lg shadow-cyan-500/20 transition">Enviar</button>
                        </div>
                    </div>

                    {/* RODAPÉ COM LETREIRO ANIMADO E BOTÕES */}
                    <footer className="fixed bottom-0 left-0 right-0 bg-slate-900 border-t border-slate-800 z-30 flex flex-col shadow-2xl">
                        {/* Letreiro contínuo com os números oficiais */}
                        <div className="bg-slate-950 text-cyan-400 text-[11px] font-semibold py-1.5 overflow-hidden whitespace-nowrap border-b border-slate-800/80 flex">
                            <div className="animate-marquee flex gap-8 items-center px-4 font-mono">
                                <span>🚨 ZAP alertas (21) 97299-3223</span>
                                <span className="text-slate-600">•</span>
                                <span>📞 (21) 4042-1772 ocorrências</span>
                                <span className="text-slate-600">•</span>
                                <span>🏢 CRAS (21) 2042-8931 Rocha Sobrinho</span>
                                <span className="text-slate-600">•</span>
                                <span>🚨 ZAP alertas (21) 97299-3223</span>
                                <span className="text-slate-600">•</span>
                                <span>📞 (21) 4042-1772 ocorrências</span>
                                <span className="text-slate-600">•</span>
                                <span>🏢 CRAS (21) 2042-8931 Rocha Sobrinho</span>
                            </div>
                        </div>

                        {/* Botões de Rodapé solicitados */}
                        <div className="flex items-center justify-around px-2 py-2 bg-slate-900 text-xs">
                            <button onClick={() => setMapOpen(true)} className="flex flex-col items-center gap-0.5 text-slate-400 hover:text-cyan-400 transition">
                                <span className="text-base">🗺️</span><span>Mapa</span>
                            </button>
                            <button onClick={() => setChartOpen(true)} className="flex flex-col items-center gap-0.5 text-slate-400 hover:text-cyan-400 transition">
                                <span className="text-base">📊</span><span>Gráfico</span>
                            </button>
                            <button onClick={() => setPinModalOpen(true)} className="flex flex-col items-center gap-0.5 text-slate-400 hover:text-cyan-400 transition" title="Cidadão Sensor (PIN Admin 0001)">
                                <span className="text-base">🔒</span><span>Cidadão Sensor</span>
                            </button>
                            <button onClick={() => setGalleryOpen(true)} className="flex flex-col items-center gap-0.5 text-slate-400 hover:text-cyan-400 transition" title="Sistema Livre - Vídeos e Fotos">
                                <span className="text-base">📹</span><span>Mídia Livre</span>
                            </button>
                        </div>
                    </footer>

                    {/* MODAL DO MAPA */}
                    {mapOpen && (
                        <div className="fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-50 flex items-center justify-center p-4">
                            <div className="bg-slate-900 border border-cyan-500/40 w-full max-w-2xl rounded-2xl shadow-2xl overflow-hidden">
                                <div className="bg-slate-950 px-4 py-3 border-b border-slate-800 flex justify-between items-center">
                                    <h3 className="font-mono text-cyan-400 text-sm font-bold">🗺️ Mapa Operacional da Defesa Civil</h3>
                                    <button onClick={() => setMapOpen(false)} className="text-slate-400 hover:text-white font-mono text-xs px-2 py-1 rounded bg-slate-800">✕ Fechar</button>
                                </div>
                                <div className="p-4 bg-slate-900">
                                    <div ref={mapRef} className="w-full h-80 rounded-xl border border-cyan-500/30"></div>
                                    <p className="text-xs text-slate-400 font-mono mt-3">Monitoramento meteorológico em tempo real (Sebinho / Rocha Sobrinho).</p>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* MODAL DO GRÁFICO */}
                    {chartOpen && (
                        <div className="fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-50 flex items-center justify-center p-4">
                            <div className="bg-slate-900 border border-cyan-500/40 w-full max-w-2xl rounded-2xl shadow-2xl overflow-hidden">
                                <div className="bg-slate-950 px-4 py-3 border-b border-slate-800 flex justify-between items-center">
                                    <h3 className="font-mono text-cyan-400 text-sm font-bold">📊 Gráfico Analítico de Ocorrências</h3>
                                    <button onClick={() => setChartOpen(false)} className="text-slate-400 hover:text-white font-mono text-xs px-2 py-1 rounded bg-slate-800">✕ Fechar</button>
                                </div>
                                <div className="p-4 bg-slate-900">
                                    <div className="w-full h-72">
                                        <canvas ref={chartRef}></canvas>
                                    </div>
                                    <p className="text-xs text-slate-400 font-mono mt-3">Estatísticas horárias de temperatura e precipitação.</p>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* MODAL DE PIN DO CIDADÃO SENSOR (PIN 0001) */}
                    {pinModalOpen && (
                        <div className="fixed inset-0 z-50 bg-slate-950/80 backdrop-blur-sm flex items-center justify-center p-4">
                            <div className="bg-slate-900 border border-slate-800 rounded-2xl max-w-xs w-full p-5 shadow-2xl flex flex-col gap-4">
                                <div className="text-center">
                                    <h3 className="text-sm font-bold text-cyan-400">Cidadão Sensor (Admin)</h3>
                                    <p className="text-[11px] text-slate-400 mt-1">Insira o PIN administrativo (0001)</p>
                                </div>
                                <input
                                    type="password"
                                    maxLength="4"
                                    value={pinInput}
                                    onChange={(e) => setPinInput(e.target.value)}
                                    placeholder="••••"
                                    className="bg-slate-950 border border-slate-800 text-center tracking-widest text-lg rounded-xl py-2 text-slate-100 focus:outline-none focus:border-cyan-500 font-mono"
                                />
                                {pinError && <p className="text-[10px] text-rose-400 text-center font-medium">PIN Incorreto. Tente novamente.</p>}
                                <div className="flex gap-2">
                                    <button onClick={() => setPinModalOpen(false)} className="flex-1 bg-slate-800 hover:bg-slate-700 text-slate-300 py-2 rounded-xl text-xs font-medium">Cancelar</button>
                                    <button onClick={verifyPin} className="flex-1 bg-cyan-500 hover:bg-cyan-400 text-slate-950 py-2 rounded-xl text-xs font-bold shadow-lg">Confirmar</button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* MODAL DA GALERIA / MÍDIA LIVRE (VÍDEOS E FOTOS) */}
                    {galleryOpen && (
                        <div className="fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-50 flex items-center justify-center p-4">
                            <div className="bg-slate-900 border border-cyan-500/40 w-full max-w-lg rounded-2xl shadow-2xl overflow-hidden">
                                <div className="bg-slate-950 px-4 py-3 border-b border-slate-800 flex justify-between items-center">
                                    <h3 className="font-mono text-cyan-400 text-sm font-bold">📹 Galeria de Vídeos e Fotos • Mídia Livre</h3>
                                    <button onClick={() => setGalleryOpen(false)} className="text-slate-400 hover:text-white font-mono text-xs px-2 py-1 rounded bg-slate-800">✕ Fechar</button>
                                </div>
                                <div className="p-5 bg-slate-900 space-y-3 text-xs text-slate-300">
                                    <p className="font-semibold text-cyan-300">Consulta de Mídias e Relatórios Visuais da Comunidade</p>
                                    <p className="text-slate-400">Aqui você pode carregar, puxar e consultar vídeos e fotos enviados pelos moradores e sensores de campo em Mesquita - RJ.</p>
                                    <div className="p-4 bg-slate-950 rounded-xl border border-slate-800 flex flex-col items-center justify-center gap-2">
                                        <span className="text-2xl">📁</span>
                                        <span className="text-slate-400 text-[11px]">Nenhum arquivo de mídia carregado no momento.</span>
                                        <label className="bg-cyan-600 hover:bg-cyan-500 text-slate-950 font-bold px-4 py-2 rounded-lg text-xs cursor-pointer transition mt-2">
                                            Carregar Foto ou Vídeo
                                            <input type="file" accept="image/*,video/*" className="hidden" onChange={() => alert("Arquivo selecionado para análise.")} />
                                        </label>
                                    </div>
                                </div>
                            </div>
                        </div>
                    )}

                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById("root"));
        root.render(<App />);
    </script>
</body>
</html>
