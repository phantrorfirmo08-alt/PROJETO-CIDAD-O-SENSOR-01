<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>RARU NEXUS AI V11 Plus - CENTRAL EXECUTIVA COMPLETA + VISTORIA 92 MUNICÍPIOS</title>
<script src="https://cdn.tailwindcss.com"></script>
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script crossorigin src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
  .panel-dia { background: #0B1120; border: 1px solid rgba(255,255,255,.15); border-radius: 18px; color: #E5E7EB; }
  .panel-noite { background: #030712; border: 1px solid rgba(59,130,246,.3); border-radius: 18px; color: #93C5FD; box-shadow: 0 0 25px rgba(29,78,216,0.2); }
  .label { font-size: 11px; letter-spacing: .08em; font-weight: 800; color: #94A3B8; text-transform: uppercase; }
  .map-box { background: radial-gradient(circle at center, #0F172A 0%, #02040A 100%); border: 1px solid rgba(59,130,246,.3); border-radius: 16px; }
  .btn { width: 100%; padding: 14px; border-radius: 14px; font-weight: 900; font-size: 12px; letter-spacing: .04em; }
  @keyframes pisca { 0%,100% { opacity: 1; transform: scale(1); } 50% { opacity: .7; transform: scale(1.02); } }
  .pisca { animation: pisca 1.5s infinite; }
  @keyframes hudPulse { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.6; transform: scale(1.05); } }
  .animate-hud-pulse { animation: hudPulse 2s infinite; }
  @keyframes flutuarNuvem { 0% { transform: translateX(0px); opacity: 0.4; } 50% { transform: translateX(30px); opacity: 0.85; } 100% { transform: translateX(0px); opacity: 0.4; } }
  .nuvem-animada { animation: flutuarNuvem 6s ease-in-out infinite; }
  @keyframes radarGiro { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
  .radar-barred { animation: radarGiro 4s linear infinite; transform-origin: 200px 180px; }
  @keyframes twinkle { 0%, 100% { opacity: 0.3; } 50% { opacity: 1; transform: scale(1.2); } }
  .star { animation: twinkle 2s infinite ease-in-out; fill: #FFFFFF; }
  @keyframes fall { 0% { transform: translateY(-15px); opacity: 0; } 50% { opacity: 0.9; } 100% { transform: translateY(90px); opacity: 0; } }
  .rain-drop { animation: fall 0.7s linear infinite; stroke: #38BDF8; stroke-width: 1.5; stroke-linecap: round; }
  ::-webkit-scrollbar { width: 6px; height: 6px; }
  ::-webkit-scrollbar-track { background: #02040A; border-radius: 8px; }
  ::-webkit-scrollbar-thumb { background: #1E293B; border-radius: 8px; }
</style>
</head>
<body id="corpo-pagina" class="p-2 flex justify-center transition-colors duration-700">
<div id="root" class="w-full max-w-[720px]"></div>

<script type="text/babel">
const {useState, useRef, useEffect} = React;
const SARAH_AVATAR = "https://cdn.imagetourls.com/uploads/tyImg/195w5uur9.png";

const MUNICIPIOS_RJ_92 = [
    {n:"Mesquita (Base Anfitriã Oficial - Rocha Sobrinho)",lat:-22.7858,lon:-43.4294,reg:"Baixada Fluminense",bacia:"Bacia do Rio Sarapuí / Iguaçu"},
    {n:"Rio de Janeiro (Capital)",lat:-22.9068,lon:-43.1729,reg:"Metropolitana",bacia:"Baía de Guanabara"},
    {n:"Nova Iguaçu",lat:-22.7559,lon:-43.4605,reg:"Baixada Fluminense",bacia:"Bacia do Rio Botas / Sarapuí"},
    {n:"Duque de Caxias",lat:-22.7856,lon:-43.3117,reg:"Baixada Fluminense",bacia:"Bacia do Rio Iguaçu"},
    {n:"Belford Roxo",lat:-22.7642,lon:-43.3997,reg:"Baixada Fluminense",bacia:"Bacia do Rio Botas"},
    {n:"São João de Meriti",lat:-22.8031,lon:-43.3695,reg:"Baixada Fluminense",bacia:"Bacia do Rio Pavuna"},
    {n:"Nilópolis",lat:-22.8081,lon:-43.4147,reg:"Baixada Fluminense",bacia:"Bacia do Rio Sarapuí"},
    {n:"Queimados",lat:-22.7100,lon:-43.5500,reg:"Baixada Fluminense",bacia:"Bacia do Rio Guandu"},
    {n:"Japeri",lat:-22.6400,lon:-43.6500,reg:"Baixada Fluminense",bacia:"Bacia do Rio Guandu"},
    {n:"Niterói",lat:-22.8833,lon:-43.1036,reg:"Metropolitana",bacia:"Baía de Guanabara"},
    {n:"São Gonçalo",lat:-22.8267,lon:-43.0631,reg:"Metropolitana",bacia:"Bacia do Rio Imboaçu"},
    {n:"Petrópolis",lat:-22.5055,lon:-43.1789,reg:"Serrana",bacia:"Bacia do Rio Piabanha"},
    {n:"Teresópolis",lat:-22.4122,lon:-42.9658,reg:"Serrana",bacia:"Bacia do Rio Paquequer"},
    {n:"Nova Friburgo",lat:-22.2819,lon:-42.5311,reg:"Serrana",bacia:"Bacia do Rio Bengalas"},
    {n:"Angra dos Reis",lat:-23.0067,lon:-44.3181,reg:"Costa Verde",bacia:"Bacia Costa Verde"},
    {n:"Cabo Frio",lat:-22.8883,lon:-42.0189,reg:"Baixada Litorânea",bacia:"Lagoa de Araruama"},
    {n:"Macaé",lat:-22.3708,lon:-41.7869,reg:"Norte Fluminense",bacia:"Bacia do Rio Macaé"},
    {n:"Campos dos Goytacazes",lat:-21.7542,lon:-41.3242,reg:"Norte Fluminense",bacia:"Bacia do Rio Paraíba do Sul"},
    {n:"Volta Redonda",lat:-22.5231,lon:-44.1033,reg:"Sul Fluminense",bacia:"Bacia do Rio Paraíba do Sul"}
];

const ORGAOS_OFICIAIS = [
  "COMPDEC / Defesa Civil Municipal",
  "SEDEC-RJ / Defesa Civil Estadual",
  "GADE - Grupo Comunitário A Chave da Esperança",
  "CEMADEN (Centro Nacional de Monitoramento e Alertas)",
  "INEA (Instituto Estadual do Ambiente)",
  "CRAS / Assistência Social Municipal",
  "NUPDEC (Núcleo Comunitário de Defesa Civil)"
];

const TIPOS_RISCO = [
  "🟢 Risco Baixo / Monitoramento Preventivo",
  "🟡 Risco Moderado / Atenção Climática",
  "🟠 Risco Alto / Alerta Vermelho de Encosta e Alagamento",
  "🔴 Risco Iminente / Evacuação Necessária",
  "💧 Risco Hidrológico / Elevação Crítica de Rio",
  "🏗️ Comprometimento Estrutural / Vistoria"
];

function App() {
  const [autenticado, setAutenticado] = useState(false);
  const [senha, setSenha] = useState('');
  const [erroSenha, setErroSenha] = useState(false);
  
  const [modoNoite, setModoNoite] = useState(false);
  const [horaAtualStr, setHoraAtualStr] = useState('');
  const [abaAtiva, setAbaAtiva] = useState('central'); // 'central', 'vistoria', 'cadastros'

  const [mun, setMun] = useState(MUNICIPIOS_RJ_92[0]);
  const [urlCloudflare, setUrlCloudflare] = useState('https://raru-nexus-api.workers.dev');
  const [statusCloudflare, setStatusCloudflare] = useState('ONLINE');

  const [modoIA, setModoIA] = useState('laudo');
  const [orgaoSelecionado, setOrgaoSelecionado] = useState(ORGAOS_OFICIAIS[0]);

  const [meteo, setMeteo] = useState({
    temperatura: "27°C", umidade: "78%", chuvaMm: "14.2 mm/h", pressao: "1012 hPa", ventoVel: "22 km/h",
    condicao: "Instável / Pancadas Isoladas", statusSat: "ONLINE - API OPEN-METEO"
  });
  const [carregandoMeteo, setCarregandoMeteo] = useState(false);

  const [iaLaudo, setIaLaudo] = useState("Cérebro neural ativado. Selecione qualquer município para iniciar a análise falada da telemetria...");
  const [nivelAlertaCor, setNivelAlertaCor] = useState("bg-emerald-500");
  const [nivelAlertaTexto, setNivelAlertaTexto] = useState("R1 - NORMAL / PREVENTIVO");
  const [falarVoz, setFalarVoz] = useState(true);

  // Estados do Chat da Sarah
  const [chatAberto, setChatAberto] = useState(false);
  const [mensagensChat, setMensagensChat] = useState([
    { sender: 'sarah', text: 'Olá, Alexander! Sou a Sarah, sua IA de Defesa Civil. Pronto para operar na rede dos 92 municípios do RJ.' }
  ]);
  const [inputChat, setInputChat] = useState('');

  // Estados de Cadastros GADE
  const [cadastros, setCadastros] = useState([
    { id: 1, nome: "Alexander da Silva Firmo", municipio: "Mesquita (Base Anfitriã Oficial - Rocha Sobrinho)", bairro: "Sebinho / Rocha Sobrinho", papel: "Agente / Coordenador GADE", data: "2026-07-15" }
  ]);
  const [novoNomeCad, setNovoNomeCad] = useState('');
  const [novoBairroCad, setNovoBairroCad] = useState('');
  const [novoPapelCad, setNovoPapelCad] = useState('Morador / Voluntário');

  // Estados de Vistoria Técnica
  const [nomeAgenteVistoria, setNomeAgenteVistoria] = useState('Alexander da Silva Firmo');
  const [cpfAgenteVistoria, setCpfAgenteVistoria] = useState('');
  const [bairroVistoria, setBairroVistoria] = useState('');
  const [riscoVistoria, setRiscoVistoria] = useState(TIPOS_RISCO[0]);
  const [relatorioVistoria, setRelatorioVistoria] = useState('');
  const [gpsVistoria, setGpsVistoria] = useState({ lt: '', ln: '' });
  const [cameraAtiva, setCameraAtiva] = useState(false);
  const [fotosVistoria, setFotosVistoria] = useState([]);
  const videoRef = useRef(null);

  // Estados das Sirenes
  const [statusBR, setStatusBR] = useState('AGUARDANDO');
  const [timerBR, setTimerBR] = useState('00:00 / 05:00');
  const [statusRU, setStatusRU] = useState('AGUARDANDO');
  const [timerRU, setTimerRU] = useState('00:00 / 05:00');

  const audioCtxRef = useRef(null);
  const oscRef = useRef(null);
  const intervalRef = useRef(null);

  useEffect(() => {
    const checarHorario = () => {
      const now = new Date();
      const hora = now.getHours();
      const min = now.getMinutes();
      const segundos = now.getSeconds();
      setHoraAtualStr(`${hora.toString().padStart(2,'0')}:${min.toString().padStart(2,'0')}:${segundos.toString().padStart(2,'0')}`);
      
      if (hora >= 19 || hora < 6) {
        setModoNoite(true);
        document.body.style.backgroundColor = '#010308';
      } else {
        setModoNoite(false);
        document.body.style.backgroundColor = '#02040A';
      }
    };
    checarHorario();
    const timer = setInterval(checarHorario, 1000);
    return () => clearInterval(timer);
  }, []);

  const falarTextoIA = (texto) => {
    if (!falarVoz || !('speechSynthesis' in window)) return;
    window.speechSynthesis.cancel();
    const utterance = new SpeechSynthesisUtterance(texto);
    utterance.lang = 'pt-BR';
    utterance.rate = 1.0;
    utterance.pitch = 1.0;
    window.speechSynthesis.speak(utterance);
  };

  const enviarMensagemChat = (e) => {
    e.preventDefault();
    if (!inputChat.trim()) return;
    const txt = inputChat;
    setMensagensChat(p => [...p, { sender: 'user', text: txt }]);
    setInputChat('');
    setTimeout(() => {
      let resp = "Compreendido, Alexander. Monitoramento ativo na rede estadual.";
      const lc = txt.toLowerCase();
      if (lc.includes('fé') || lc.includes('deus')) resp = "A fé sustenta o nosso caminhar e a nossa vigilância comunitária.";
      else if (lc.includes('chuva') || lc.includes('risco')) resp = `Analisando ${mun.n}: mantenha atenção aos alertas e rotas de fuga.`;
      setMensagensChat(p => [...p, { sender: 'sarah', text: resp }]);
      falarTextoIA(resp);
    }, 700);
  };

  const consultarMeteorologiaSat = async (mObj, modoAtual = modoIA) => {
    setCarregandoMeteo(true);
    try {
      const url = `https://api.open-meteo.com/v1/forecast?latitude=${mObj.lat}&longitude=${mObj.lon}&current=temperature_2m,relative_humidity_2m,precipitation,surface_pressure,wind_speed_10m`;
      const res = await fetch(url);
      const data = await res.json();
      
      if(data && data.current) {
        const c = data.current;
        const mm = c.precipitation;
        
        setMeteo({
          temperatura: `${c.temperature_2m}°C`, umidade: `${c.relative_humidity_2m}%`, chuvaMm: `${mm} mm/h`,
          pressao: `${c.surface_pressure} hPa`, ventoVel: `${c.wind_speed_10m} km/h`,
          condicao: mm > 15 ? "Chuva Forte / Temporal" : mm > 5 ? "Chuva Moderada" : "Estável / Monitoramento",
          statusSat: "SATÉLITE CONECTADO (OPEN-METEO)"
        });

        let nomeSimples = mObj.n.split('(')[0].trim();
        let laudoGerado = "";
        let corAlerta = "bg-emerald-500";
        let textoAlerta = "R1 - NORMAL / PREVENTIVO";

        if(mm > 25) {
          corAlerta = "bg-red-600 pisca";
          textoAlerta = "R4 - EVACUAÇÃO IMINENTE";
        } else if(mm > 10) {
          corAlerta = "bg-orange-500 pisca";
          textoAlerta = "R3 - ALERTA ALTO";
        } else if(mm > 3) {
          corAlerta = "bg-yellow-500";
          textoAlerta = "R2 - ATENÇÃO / MODERADO";
        } else {
          corAlerta = "bg-emerald-500";
          textoAlerta = "R1 - NORMAL / PREVENTIVO";
        }

        if (modoAtual === 'acolhimento') {
          laudoGerado = `[Acolhimento Humanizado • Destinado a: ${orgaoSelecionado}]: Olá, morador(a) de ${nomeSimples}. A rede do GADE está postada para orientá-lo com segurança e suporte comunitário.`;
        } else if (modoAtual === 'protocolo') {
          laudoGerado = `[Consulta de Protocolos • Destinado a: ${orgaoSelecionado}]: Diretrizes ativas para ${nomeSimples}. Em caso de risco (${textoAlerta}), verifique suporte de habitação e assistência social.`;
        } else {
          laudoGerado = `[LAUDO TÉCNICO - ${orgaoSelecionado}]: Acumulado de ${mm} mm/h na bacia ${mObj.bacia} (${nomeSimples}). Nível de alerta atual: ${textoAlerta}.`;
        }

        setNivelAlertaCor(corAlerta);
        setNivelAlertaTexto(textoAlerta);
        setIaLaudo(laudoGerado);
      }
    } catch(e) {
      setMeteo(prev => ({...prev, statusSat: "CACHE LOCAL ATIVO"}));
    } finally {
      setCarregandoMeteo(false);
    }
  };

  useEffect(() => {
    consultarMeteorologiaSat(mun, modoIA);
  }, [mun, modoIA, orgaoSelecionado]);

  // Funções de Vistoria Técnica e Câmera 400px
  const capturarGps = () => {
    if (!navigator.geolocation) return alert("Geolocalização não suportada.");
    navigator.geolocation.getCurrentPosition(p => {
      setGpsVistoria({ lt: p.coords.latitude.toFixed(6), ln: p.coords.longitude.toFixed(6) });
      alert("GPS fixado com sucesso!");
    }, () => alert("Erro ao obter GPS."));
  };

  const ligarCameraVistoria = async () => {
    setCameraAtiva(true);
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
      if (videoRef.current) videoRef.current.srcObject = stream;
    } catch (e) {
      alert("Erro ao acessar a câmera.");
      setCameraAtiva(false);
    }
  };

  const desligarCameraVistoria = () => {
    if (videoRef.current && videoRef.current.srcObject) {
      videoRef.current.srcObject.getTracks().forEach(t => t.stop());
    }
    setCameraAtiva(false);
  };

  const tirarFotoCarimbada = () => {
    if (!videoRef.current) return;
    const canvas = document.createElement('canvas');
    canvas.width = 400;
    canvas.height = Math.round(400 * ((videoRef.current.videoHeight || 480) / (videoRef.current.videoWidth || 640)));
    const ctx = canvas.getContext('2d');
    ctx.drawImage(videoRef.current, 0, 0, canvas.width, canvas.height);

    ctx.fillStyle = 'rgba(2,4,10,0.85)';
    ctx.fillRect(0, canvas.height - 52, canvas.width, 52);
    ctx.fillStyle = '#00F2FE';
    ctx.font = '9px monospace';
    const now = new Date().toLocaleString('pt-BR');
    ctx.fillText(`📅 ${now} | 📍 ${gpsVistoria.lt || 'GPS Pendente'}, ${gpsVistoria.ln || ''}`, 6, canvas.height - 36);
    ctx.fillText(`👤 Agente: ${nomeAgenteVistoria || 'Agente'} | 🏛️ ${mun.n.split('(')[0]}`, 6, canvas.height - 20);
    ctx.fillText(`CPF: ${cpfAgenteVistoria || 'N/A'} • RRD-92 RJ`, 6, canvas.height - 6);

    const dataUrl = canvas.toDataURL('image/jpeg', 0.35);
    setFotosVistoria(prev => [...prev, dataUrl]);
    alert("Foto 400px capturada e carimbada!");
  };

  const gerarLaudoPDF = (item) => {
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF();
    doc.setFillColor(2, 6, 23);
    doc.rect(0, 0, 210, 297, "F");
    doc.setTextColor(0, 242, 254);
    doc.setFontSize(12);
    doc.text(`LAUDO DE VISTORIA TÉCNICA - ${item.protocolo}`, 15, 20);
    doc.setFontSize(9);
    doc.setTextColor(255, 255, 255);
    doc.text(`Município: ${item.municipio} | Bairro: ${item.bairro}`, 15, 30);
    doc.text(`Agente Responsável: ${item.responsavel}`, 15, 38);
    doc.text(`CPF / ID: ${item.cpf}`, 15, 46);
    doc.text(`Classificação de Risco: ${item.risco}`, 15, 54);
    doc.text(`Coordenadas GPS: ${item.gps.lt}, ${item.gps.ln}`, 15, 62);
    doc.text(`Data/Hora: ${new Date(item.data).toLocaleString('pt-BR')}`, 15, 70);
    doc.text("Relato Técnico:", 15, 82);
    
    const splitText = doc.splitTextToSize(item.relatorio, 180);
    doc.text(splitText, 15, 90);

    let yPos = 105 + (splitText.length * 6);
    if (item.fotos && item.fotos.length > 0) {
      doc.text(`Registros Fotográficos Carimbados (${item.fotos.length}):`, 15, yPos);
      yPos += 8;
      item.fotos.forEach((fotoBase64) => {
        if (yPos > 230) { doc.addPage(); yPos = 20; }
        try { doc.addImage(fotoBase64, 'JPEG', 15, yPos, 45, 45); yPos += 50; } catch (e) {}
      });
    }
    doc.save(`Laudo_${item.protocolo}.pdf`);
  };

  const enviarWhatsAppVistoria = (item) => {
    const texto = `🛡️ *RELATÓRIO DE VISTORIA TÉCNICA - RRD* 🛡️\n\n📌 *Protocolo:* \`${item.protocolo}\`\n📍 *Município:* ${item.municipio}\n📌 *Bairro:* ${item.bairro}\n👤 *Agente:* ${item.responsavel}\n🆔 *CPF:* ${item.cpf}\n⚠️ *Risco:* ${item.risco}\n🛰️ *GPS:* ${item.gps.lt}, ${item.gps.ln}\n📅 *Data:* ${new Date(item.data).toLocaleString('pt-BR')}\n\n📋 *Relato:* \n${item.relatorio}\n\n_SARAH AI NEXUS - Defesa Civil RJ_`;
    window.open(`https://api.whatsapp.com/send?text=${encodeURIComponent(texto)}`, '_blank');
  };

  const submeterVistoria = (e) => {
    e.preventDefault();
    if (!nomeAgenteVistoria || !cpfAgenteVistoria || !bairroVistoria || !relatorioVistoria) {
      return alert("Preencha todos os campos obrigatórios da vistoria.");
    }
    const seq = Math.floor(1000 + Math.random() * 9000);
    const siglaMun = mun.n.substring(0, 3).toUpperCase();
    const protocolo = `PROT-VISTORIA-${siglaMun}-2026-${seq}`;

    const registro = {
      protocolo, municipio: mun.n, bairro: bairroVistoria, responsavel: nomeAgenteVistoria,
      cpf: cpfAgenteVistoria, risco: riscolRisco = riscoVistoria, relatorio: relatorioVistoria,
      gps: gpsVistoria, fotos: [...fotosVistoria], data: new Date().toISOString()
    };

    alert(`Vistoria ${protocolo} gerada com sucesso!`);
    gerarLaudoPDF(registro);
    enviarWhatsAppVistoria(registro);
    setBairroVistoria(''); setRelatorioVistoria(''); setFotosVistoria([]);
  };

  const fazerLogin = () => {
    if(senha === 'sarah2026') { setAutenticado(true); setErroSenha(false); }
    else { setErroSenha(true); }
  };

  const cadastrarPessoa = () => {
    if(!novoNomeCad || !novoBairroCad) { alert('Preencha Nome e Bairro.'); return; }
    setCadastros(prev => [{
      id: Date.now(), nome: novoNomeCad, municipio: mun.n, bairro: novoBairroCad, papel: novoPapelCad, data: new Date().toLocaleDateString('pt-BR')
    }, ...prev]);
    setNovoNomeCad(''); setNovoBairroCad('');
  };

  // Sirenes
  const pararSirenes = () => {
    if(intervalRef.current) clearInterval(intervalRef.current);
    if(oscRef.current) { try{ oscRef.current.stop(); }catch{} oscRef.current = null; }
    setStatusBR('AGUARDANDO'); setStatusRU('AGUARDANDO');
  };

  const tocarSomBR = () => {
    if(!audioCtxRef.current) audioCtxRef.current = new (window.AudioContext || window.webkitAudioContext)();
    const ctx = audioCtxRef.current;
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = 'sine'; osc.frequency.setValueAtTime(440, ctx.currentTime);
    gain.gain.setValueAtTime(0.3, ctx.currentTime);
    osc.connect(gain); gain.connect(ctx.destination); osc.start();
    oscRef.current = osc;
  };

  const iniciarBR = () => {
    pararSirenes();
    tocarSomBR();
    setStatusBR('TOCANDO - ALERTA MÁXIMO');
  };

  const estiloPainel = modoNoite ? "panel-noite p-3" : "panel-dia p-3";

  if (!autenticado) {
    return (
      <div className={`w-full max-w-[420px] ${estiloPainel} p-6 space-y-4 shadow-2xl mt-10`}>
        <div className="text-center space-y-1">
          <p className={`text-[10px] font-bold tracking-widest ${modoNoite ? 'text-blue-400':'text-blue-500'}`}>ACESSO RESTRITO • {modoNoite ? 'MODO NOTURNO 🌙' : 'MODO DIURNO ☀️'}</p>
          <h1 className="text-base font-black text-white">RARU NEXUS AI V11 Plus</h1>
          <p className="text-[10px] text-slate-400">Mesquita - RJ | Horário: {horaAtualStr}</p>
        </div>
        <div className="space-y-3 pt-2">
          <div>
            <label className="label">Senha do Operador</label>
            <input type="password" value={senha} onChange={e=>setSenha(e.target.value)} placeholder="Digite (sarah2026)..." className="w-full mt-1 bg-black border border-white/20 rounded-xl p-3 text-sm text-white"/>
          </div>
          <button onClick={fazerLogin} className="btn bg-blue-600 hover:bg-blue-500 text-white">ACESSAR CENTRAL</button>
          {erroSenha && <p className="text-[10px] text-red-400 text-center">Senha incorreta.</p>}
        </div>
      </div>
    );
  }

  return (
    <div className="space-y-3 w-full font-mono relative pb-20">

      {/* BOTÃO FLUTUANTE DA SARAH */}
      <button onClick={() => setChatAberto(!chatAberto)} className="fixed right-4 bottom-4 z-50 w-14 h-14 rounded-full bg-black border-2 border-cyan-400 shadow-[0_0_25px_rgba(0,242,254,0.7)] flex items-center justify-center animate-hud-pulse cursor-pointer">
        <img src={SARAH_AVATAR} className="w-10 h-10 rounded-full object-cover" />
      </button>

      {/* MODAL DO CHAT DA SARAH */}
      {chatAberto && (
        <div className="fixed right-4 bottom-20 z-50 w-[90vw] max-w-[340px] h-[400px] panel-noite rounded-2xl flex flex-col overflow-hidden border-2 border-cyan-400 shadow-2xl">
          <div className="bg-black/90 p-3 border-b border-cyan-400/30 flex justify-between items-center">
            <span className="font-bold text-xs text-cyan-300">Sarah AI • Chat & Voz</span>
            <button onClick={() => setChatAberto(false)} className="text-rose-400 font-bold text-xs">✕</button>
          </div>
          <div className="flex-1 p-3 overflow-y-auto space-y-2 text-[10px]">
            {mensagensChat.map((m, i) => (
              <div key={i} className={`p-2 rounded-xl ${m.sender === 'sarah' ? 'bg-cyan-950/40 border border-cyan-400/30 text-white' : 'bg-white/5 text-cyan-300 text-right'}`}>
                {m.text}
              </div>
            ))}
          </div>
          <form onSubmit={enviarMensagemChat} className="p-2 bg-black/90 border-t border-cyan-400/30 flex gap-2">
            <input type="text" value={inputChat} onChange={e => setInputChat(e.target.value)} placeholder="Fale com a Sarah..." className="flex-1 bg-black border border-cyan-400/40 rounded-xl px-3 py-2 text-xs text-white" />
            <button type="submit" className="px-3 bg-amber-500 text-black font-black rounded-xl text-xs">🎤</button>
          </form>
        </div>
      )}

      {/* CABEÇALHO */}
      <div className={`${estiloPainel} flex justify-between items-center`}>
        <div>
          <h2 className="text-xs font-black text-white">RARU NEXUS AI V11 Plus • 92 MUNICÍPIOS RJ</h2>
          <p className="text-[9px] text-slate-400">Rocha Sobrinho (Mesquita) • {modoNoite ? '🌙 NOITE' : '☀️ DIA'} • Status: <span className="text-emerald-400">{statusCloudflare}</span></p>
        </div>
        <button onClick={()=>setAutenticado(false)} className="bg-red-900/30 border border-red-500/40 text-red-400 px-3 py-1.5 rounded-xl text-[9px] font-bold">BLOQUEAR</button>
      </div>

      {/* ABAS DE NAVEGAÇÃO PRINCIPAL */}
      <div className="grid grid-cols-3 gap-2">
        <button onClick={()=>setAbaAtiva('central')} className={`py-2 rounded-xl text-xs font-black border ${abaAtiva==='central'?'bg-blue-600 border-blue-400 text-white':'bg-black border-white/10 text-slate-400'}`}>📊 Central & Mapa</button>
        <button onClick={()=>setAbaAtiva('vistoria')} className={`py-2 rounded-xl text-xs font-black border ${abaAtiva==='vistoria'?'bg-amber-600 border-amber-400 text-black':'bg-black border-white/10 text-slate-400'}`}>📋 Vistoria & PDF</button>
        <button onClick={()=>setAbaAtiva('cadastros')} className={`py-2 rounded-xl text-xs font-black border ${abaAtiva==='cadastros'?'bg-emerald-600 border-emerald-400 text-white':'bg-black border-white/10 text-slate-400'}`}>👥 Agentes GADE</button>
      </div>

      {abaAtiva === 'central' && (
        <div className="space-y-3">
          {/* PAINEL DE IA */}
          <div className={`${estiloPainel} space-y-3 border-2 border-blue-500/40`}>
            <div className="flex justify-between items-center flex-wrap gap-2">
              <p className="label text-blue-300">🤖 SARAH IA AUTÔNOMA • DIRETRIZES 24H</p>
              <div className="flex gap-1.5 items-center">
                <button onClick={()=>setFalarVoz(!falarVoz)} className={`text-[9px] px-2 py-1 rounded font-bold border ${falarVoz ? 'bg-blue-600 border-blue-400 text-white':'bg-black border-white/20 text-slate-400'}`}>
                  {falarVoz ? '🔊 VOZ ATIVA' : '🔇 MUDO'}
                </button>
                <span className={`text-[10px] px-2.5 py-1 rounded-full text-white font-bold ${nivelAlertaCor}`}>{nivelAlertaTexto}</span>
              </div>
            </div>

            <div className="grid grid-cols-3 gap-1.5 pt-1">
              <button onClick={()=>setModoIA('laudo')} className={`py-1.5 px-2 rounded-lg text-[10px] font-bold border ${modoIA==='laudo' ? 'bg-blue-600 border-blue-400 text-white':'bg-black border-white/10 text-slate-400'}`}>📋 Laudo</button>
              <button onClick={()=>setModoIA('acolhimento')} className={`py-1.5 px-2 rounded-lg text-[10px] font-bold border ${modoIA==='acolhimento' ? 'bg-emerald-600 border-emerald-400 text-white':'bg-black border-white/10 text-slate-400'}`}>🤝 Acolhimento</button>
              <button onClick={()=>setModoIA('protocolo')} className={`py-1.5 px-2 rounded-lg text-[10px] font-bold border ${modoIA==='protocolo' ? 'bg-amber-600 border-amber-400 text-white':'bg-black border-white/10 text-slate-400'}`}>📑 Protocolos</button>
            </div>

            <div>
              <label className="label mb-1 block">ÓRGÃO OFICIAL DE DESTINO:</label>
              <select value={orgaoSelecionado} onChange={e=>setOrgaoSelecionado(e.target.value)} className="w-full bg-black border border-white/20 rounded-xl p-2.5 text-[11px] font-bold text-white">
                {ORGAOS_OFICIAIS.map((org,i)=><option key={i} value={org}>{org}</option>)}
              </select>
            </div>
            
            <div className="bg-black border border-white/10 rounded-xl p-3">
              <p className="text-[11px] text-slate-200 leading-relaxed font-sans">{iaLaudo}</p>
            </div>
          </div>

          {/* MAPA TÁTICO & MUNICÍPIOS */}
          <div className={`${estiloPainel} space-y-3`}>
            <div className="flex justify-between items-center">
              <p className="label">SELEÇÃO DE MUNICÍPIOS (92 MUNICÍPIOS RJ)</p>
              <span className="text-[10px] px-2 py-0.5 rounded-full bg-emerald-900/30 text-emerald-300 font-bold">{carregandoMeteo ? "ATUALIZANDO..." : "ONLINE"}</span>
            </div>

            <select value={mun.n} onChange={e=>{ const m=MUNICIPIOS_RJ_92.find(mm=>mm.n===e.target.value); setMun(m); }} className="w-full bg-black border border-white/20 rounded-xl p-3 text-[12px] font-bold text-white">
              {MUNICIPIOS_RJ_92.map((m,i)=><option key={i} value={m.n}>{m.n} - {m.reg}</option>)}
            </select>

            <div className="bg-black border border-white/10 rounded-xl p-3 space-y-2">
              <div className="flex justify-between items-center border-b border-white/10 pb-2">
                <div>
                  <p className="text-[13px] font-black text-white">{mun.n.split('(')[0]}</p>
                  <p className="text-[9px] text-blue-400">{mun.bacia}</p>
                </div>
                <span className="text-[10px] text-emerald-300 font-bold">{meteo.condicao}</span>
              </div>
              <div className="grid grid-cols-3 gap-2 text-center text-xs">
                <div className="bg-[#0B1120] p-2 rounded-lg"><p className="text-[9px] text-slate-400">TEMP</p><p className="font-bold">{meteo.temperatura}</p></div>
                <div className="bg-[#0B1120] p-2 rounded-lg"><p className="text-[9px] text-slate-400">UMIDADE</p><p className="font-bold">{meteo.umidade}</p></div>
                <div className="bg-[#0B1120] p-2 rounded-lg"><p className="text-[9px] text-slate-400">CHUVA</p><p className="font-bold text-amber-300">{meteo.chuvaMm}</p></div>
              </div>
            </div>
          </div>
        </div>
      )}

      {abaAtiva === 'vistoria' && (
        <div className={`${estiloPainel} space-y-4 border-2 border-amber-500/40`}>
          <div>
            <h3 className="text-xs font-black text-amber-400 uppercase">📋 MÓDULO DE VISTORIA TÉCNICA E LAUDOS</h3>
            <p className="text-[9px] text-slate-400">Câmera 400px com carimbo automático • PDF • WhatsApp</p>
          </div>

          <form onSubmit={submeterVistoria} className="space-y-3">
            <div className="grid grid-cols-1 md:grid-cols-2 gap-2">
              <div>
                <label className="label mb-1 block">Nome do Agente:</label>
                <input type="text" value={nomeAgenteVistoria} onChange={e=>setNomeAgenteVistoria(e.target.value)} required className="w-full bg-black border border-white/20 rounded-xl p-2.5 text-xs text-white"/>
              </div>
              <div>
                <label className="label mb-1 block">CPF do Agente:</label>
                <input type="text" value={cpfAgenteVistoria} onChange={e=>setCpfAgenteVistoria(e.target.value)} placeholder="000.000.000-00" required className="w-full bg-black border border-white/20 rounded-xl p-2.5 text-xs text-white"/>
              </div>
            </div>

            <div className="grid grid-cols-1 md:grid-cols-2 gap-2">
              <div>
                <label className="label mb-1 block">Bairro / Localidade:</label>
                <input type="text" value={bairroVistoria} onChange={e=>setBairroVistoria(e.target.value)} placeholder="Ex: Rocha Sobrinho" required className="w-full bg-black border border-white/20 rounded-xl p-2.5 text-xs text-white"/>
              </div>
              <div>
                <label className="label mb-1 block">Tipologia de Risco:</label>
                <select value={riscoVistoria} onChange={e=>setRiscoVistoria(e.target.value)} className="w-full bg-black border border-white/20 rounded-xl p-2.5 text-[10px] text-cyan-300">
                  {TIPOS_RISCO.map((tr,i)=><option key={i} value={tr}>{tr}</option>)}
                </select>
              </div>
            </div>

            <div className="flex gap-2 items-center bg-black/50 p-2.5 rounded-xl border border-white/10">
              <div className="flex-1 text-[10px] text-slate-300">
                <b>GPS:</b> {gpsVistoria.lt ? `${gpsVistoria.lt}, ${gpsVistoria.ln}` : 'Não capturado'}
              </div>
              <button type="button" onClick={capturarGps} className="px-3 py-1.5 bg-cyan-950 border border-cyan-400 text-cyan-300 rounded-xl text-[10px] font-bold">🛰️ Fixar GPS</button>
            </div>

            {/* CÂMERA */}
            <div className="bg-black/80 border border-cyan-400/30 rounded-2xl p-3 space-y-2">
              <div className="flex justify-between items-center">
                <span className="text-xs font-bold text-cyan-300">📷 CÂMERA DE CAMPO (400px)</span>
                {!cameraAtiva ? (
                  <button type="button" onClick={ligarCameraVistoria} className="px-3 py-1 bg-cyan-500 text-black font-black rounded-xl text-[10px]">Ligar</button>
                ) : (
                  <button type="button" onClick={desligarCameraVistoria} className="px-3 py-1 bg-rose-600 text-white font-bold rounded-xl text-[10px]">Desligar</button>
                )}
              </div>
              {cameraAtiva && (
                <div className="space-y-2">
                  <video ref={videoRef} autoPlay playsInline className="w-full h-44 object-cover rounded-xl border border-cyan-400/50"></video>
                  <button type="button" onClick={tirarFotoCarimbada} className="w-full py-2 bg-emerald-500 text-black font-black rounded-xl text-xs uppercase">📸 Tirar Foto com Carimbo</button>
                </div>
              )}
              {fotosVistoria.length > 0 && (
                <div className="flex gap-2 overflow-x-auto py-1">
                  {fotosVistoria.map((f, i)=><img key={i} src={f} className="w-16 h-16 object-cover rounded border border-cyan-400" />)}
                </div>
              )}
            </div>

            <div>
              <label className="label mb-1 block">Relato Técnico Detalhado:</label>
              <textarea rows="3" value={relatorioVistoria} onChange={e=>setRelatorioVistoria(e.target.value)} placeholder="Descreva trincas, umidade, escorregamentos..." required className="w-full bg-black border border-white/20 rounded-xl p-2.5 text-xs text-white"></textarea>
            </div>

            <button type="submit" className="w-full py-3.5 bg-amber-500 text-black font-black rounded-xl uppercase text-xs shadow-lg cursor-pointer">
              Gerar Laudo PDF Oficial & Enviar WhatsApp 🚀
            </button>
          </form>
        </div>
      )}

      {abaAtiva === 'cadastros' && (
        <div className={`${estiloPainel} space-y-3`}>
          <div className="flex justify-between items-center"><p className="label">CADASTRO DE AGENTES & LIDERANÇAS (GADE)</p><span className="text-[10px] px-2 py-0.5 rounded-full bg-blue-900/40 text-blue-300 font-bold">{cadastros.length} CADASTRADOS</span></div>
          <div className="bg-black border border-white/10 rounded-xl p-3 space-y-2">
            <input value={novoNomeCad} onChange={e=>setNovoNomeCad(e.target.value)} placeholder="Nome Completo *" className="w-full bg-[#080A12] border border-white/15 rounded-xl p-2.5 text-xs text-white"/>
            <div className="grid grid-cols-2 gap-2">
              <input value={novoBairroCad} onChange={e=>setNovoBairroCad(e.target.value)} placeholder="Bairro / Comunidade *" className="bg-[#080A12] border border-white/15 rounded-xl p-2.5 text-xs text-white"/>
              <select value={novoPapelCad} onChange={e=>setNovoPapelCad(e.target.value)} className="bg-[#080A12] border border-white/15 rounded-xl p-2.5 text-[11px] text-white">
                <option>Morador / Voluntário</option>
                <option>Agente de Articulação (GADE)</option>
                <option>Defesa Civil / NUPDEC</option>
              </select>
            </div>
            <button onClick={cadastrarPessoa} className="w-full py-2.5 bg-blue-600 hover:bg-blue-500 text-white font-black rounded-xl text-xs">CADASTRAR NA MALHA</button>
          </div>
          <div className="space-y-2 max-h-[220px] overflow-y-auto">
            {cadastros.map((item)=>(
              <div key={item.id} className="bg-black border border-white/10 rounded-xl p-2.5 flex justify-between items-center text-[11px]">
                <div>
                  <p className="font-bold text-white">{item.nome}</p>
                  <p className="text-[9px] text-slate-400">{item.bairro} • <span className="text-blue-300">{item.papel}</span></p>
                </div>
                <span className="text-[9px] px-2 py-1 rounded bg-emerald-900/30 text-emerald-300 font-bold">{item.data}</span>
              </div>
            ))}
          </div>
        </div>
      )}

      {/* RODAPÉ */}
      <div className={`${estiloPainel} text-center`}>
        <p className="text-[10px] font-bold text-blue-300">Grupo a Chave da Esperança © GADE • Rocha Sobrinho Mesquita RJ</p>
        <p className="text-[9px] text-slate-500 mt-0.5">RARU NEXUS AI V11 Plus • CONSOLIDADO TOTAL</p>
      </div>

    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
