async function calcularSHA256(texto) {
  const str = String(texto || "");
  try {
    if (window.crypto && window.crypto.subtle && window.TextEncoder) {
      const encoder = new TextEncoder();
      const data = encoder.encode(str);
      const hashBuffer = await window.crypto.subtle.digest('SHA-256', data);
      const hashArray = Array.from(new Uint8Array(hashBuffer));
      return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
    }
  } catch (e) {}
  let h1 = 0xdeadbeef, h2 = 0x41c6ce57;
  for (let i = 0; i < str.length; i++) {
    const ch = str.charCodeAt(i);
    h1 = Math.imul(h1 ^ ch, 2654435761);
    h2 = Math.imul(h2 ^ ch, 1597334677);
  }
  h1 = Math.imul(h1 ^ (h1 >>> 16), 2246822507) ^ Math.imul(h2 ^ (h2 >>> 13), 3266489909);
  h2 = Math.imul(h2 ^ (h2 >>> 16), 2246822507) ^ Math.imul(h1 ^ (h1 >>> 13), 3266489909);
  const combinado = (4294967296 * (2097151 & h2) + (h1 >>> 0)).toString(16).padStart(16, '0');
  return combinado.repeat(4).slice(0, 64);
}

  try {

    const cleanText = String(texto)

      .replace(/cerquilha/gi, '')
      .replace(/asterisco/gi, '')
      .replace(/[\u2600-\u27BF]|[\uD83C-\uDBFF][\uDC00-\uDFFF]/g, '')

function PainelRotasEstacaoPublica() {
    const [rotas, setRotas] = React.useState([]);

    React.useEffect(() => {
        const carregarRotas = () => {
            try {
                const r = JSON.parse(localStorage.getItem('rotasFugaReais') || '[]');
                setRotas(r);
            } catch(e) { setRotas([]); }
        };
        carregarRotas();
        window.addEventListener('storage', carregarRotas);
        const interval = setInterval(carregarRotas, 2500);
        return () => {
            window.removeEventListener('storage', carregarRotas);
            clearInterval(interval);
        };
    }, []);

    return (

function RadioCyberTatica({ showToast }) {
  const [estacaoAtiva, setEstacaoAtiva] = useState(0);
  const [fallbackIdx, setFallbackIdx] = useState(-1);
  const [tocando, setTocando] = useState(false);
  const [volume, setVolume] = useState(80);
  const [statusStream, setStatusStream] = useState("Pronto para sintonizar");
  const audioRef = useRef(null);
  const tocandoRef = useRef(false);
  const fallbackIdxRef = useRef(-1);
  const estacaoAtivaRef = useRef(0);

  useEffect(() => { tocandoRef.current = tocando; }, [tocando]);
  useEffect(() => { fallbackIdxRef.current = fallbackIdx; }, [fallbackIdx]);
  useEffect(() => { estacaoAtivaRef.current = estacaoAtiva; }, [estacaoAtiva]);

  useEffect(() => {
    if (audioRef.current) {
      audioRef.current.volume = Math.max(0, Math.min(1, volume / 100));
    }
  }, [volume]);

  const obterUrlAtual = (idxEstacao, idxFallback) => {
    const est = ESTACOES_TATICAS[idxEstacao] || ESTACOES_TATICAS[0];
    if (idxFallback >= 0 && est.fallbacks && est.fallbacks[idxFallback]) {
      return est.fallbacks[idxFallback];
    }
    return est.url;
  };

  const tentarFailover = () => {
    const idxEst = estacaoAtivaRef.current;
    const est = ESTACOES_TATICAS[idxEst] || ESTACOES_TATICAS[0];
    const proxFallback = fallbackIdxRef.current + 1;

    if (est.fallbacks && proxFallback < est.fallbacks.length) {
      setFallbackIdx(proxFallback);
      const urlBackup = est.fallbacks[proxFallback];
      setStatusStream(`Failover ativo (${proxFallback + 1}/${est.fallbacks.length})...`);
      if (audioRef.current) {
        try {
          audioRef.current.pause();
          audioRef.current.src = urlBackup;
          audioRef.current.load();
          const p = audioRef.current.play();
          if (p && typeof p.catch === 'function') p.catch(() => {});
        } catch (e) {}
      }
      return true;
    }

    for (let offset = 1; offset < ESTACOES_TATICAS.length; offset++) {
      const nextEstIdx = (idxEst + offset) % ESTACOES_TATICAS.length;
      const candUrl = ESTACOES_TATICAS[nextEstIdx].url;
      if (candUrl && audioRef.current) {
        setEstacaoAtiva(nextEstIdx);
        setFallbackIdx(-1);
        setStatusStream(`Failover para ${ESTACOES_TATICAS[nextEstIdx].nome}`);
        try {
          audioRef.current.pause();
          audioRef.current.src = candUrl;
          audioRef.current.load();
          const p = audioRef.current.play();
          if (p && typeof p.catch === 'function') p.catch(() => {});
        } catch (e) {}
        return true;
      }
    }

    setTocando(false);
    setStatusStream("Stream indisponivel no momento");
    return false;
  };

  const iniciarStreamDireto = (idxEst, idxFb = -1) => {
    const el = audioRef.current;
    if (!el) return;
    const url = obterUrlAtual(idxEst, idxFb);
    setStatusStream(idxFb >= 0 ? "Conectando rota alternativa..." : "Sintonizando...");
    try {
      el.muted = false;
      el.volume = Math.max(0, Math.min(1, volume / 100));
      el.src = url;
      el.load();
      const playPromise = el.play();
      if (playPromise && typeof playPromise.then === 'function') {
        playPromise.then(() => {
          setTocando(true);
          setStatusStream(idxFb >= 0 ? "AO VIVO (FAILOVER)" : "AO VIVO");
          if (typeof showToast === 'function') {
            showToast(`RadioCyberTatica: ${ESTACOES_TATICAS[idxEst].nome}`);
          }
        }).catch(() => {
          const trocou = tentarFailover();
          if (!trocou && typeof showToast === 'function') {
            showToast("Nao foi possivel iniciar o stream.");
          }
        });
      } else {
        setTocando(true);
        setStatusStream("AO VIVO");
      }
    } catch (e) {
      tentarFailover();
    }
  };

  const alternarPlay = () => {
    const el = audioRef.current;
    if (!el) return;
    if (tocando) {
      try { el.pause(); } catch (e) {}
      setTocando(false);
      setStatusStream("Pausado");
      if (typeof showToast === 'function') showToast('RadioCyberTatica pausada.');
    } else {
      iniciarStreamDireto(estacaoAtiva, fallbackIdx);
    }
  };

  const selecionarEstacao = (idx) => {
    setEstacaoAtiva(idx);
    setFallbackIdx(-1);
    if (tocando) {
      iniciarStreamDireto(idx, -1);
    } else {
      if (audioRef.current) {
        audioRef.current.src = ESTACOES_TATICAS[idx].url;
      }
      setStatusStream("Pronto para reproduzir");
      if (typeof showToast === 'function') {
        showToast(`Selecionado: ${ESTACOES_TATICAS[idx].nome}`);
      }
    }
  };

  return (
    <div id="RadioCyberTatica" className="w-full max-w-4xl mx-auto p-3 sm:p-6 flex flex-col font-mono">
      <audio
        ref={audioRef}
        preload="none"
        playsInline
        controls={false}
        onPlaying={() => {
          setTocando(true);
          setStatusStream(fallbackIdxRef.current >= 0 ? "AO VIVO (FAILOVER)" : "AO VIVO");
        }}
        onError={() => {
          if (tocandoRef.current) tentarFailover();
        }}
      />
      <div className="cyber-card p-4 rounded-2xl border border-cyan-400/30 bg-commandPanel/80 space-y-4">
        <div className="flex justify-between items-center border-b border-cyan-400/30 pb-3">
          <h2 className="text-sm font-black text-cyan-300 font-display uppercase tracking-widest flex items-center gap-2">
            <IconRadio size={16} color="#00F2FE" /> RadioCyberTatica
          </h2>
          <span className="text-[10px] text-slate-400">{ESTACOES_TATICAS[estacaoAtiva].local}</span>
        </div>

        <div className="bg-black/60 border border-cyan-400/40 rounded-2xl p-6 flex flex-col items-center justify-center relative overflow-hidden">
          <div className="absolute inset-0 bg-gradient-to-t from-cyan-950/20 to-transparent pointer-events-none"></div>
          <div className="text-center z-10 space-y-1 mb-4">
            <div className="text-xs text-cyan-300 uppercase tracking-widest font-bold">
              {fallbackIdx >= 0 ? `ESTACAO ATIVA • FAILOVER ${fallbackIdx + 1}` : "ESTACAO ATIVA"}
            </div>
            <div className="text-base sm:text-lg font-black text-white font-display">{ESTACOES_TATICAS[estacaoAtiva].nome}</div>
            <div className="text-xs text-slate-400">{ESTACOES_TATICAS[estacaoAtiva].genero}</div>
            <div className="text-[10px] text-cyberGreen font-bold pt-0.5">{statusStream}</div>
          </div>

          <div className="flex items-center justify-center gap-1.5 h-12 z-10">
            {[...Array(16)].map((_, i) => (
              <div
                key={i}
                style={{
                  width: '4px',
                  backgroundColor: '#00F2FE',
                  borderRadius: '9999px',
                  animation: 'w 1.2s ease-in-out infinite',
                  animationPlayState: tocando ? 'running' : 'paused',
                  animationDelay: `${i * 0.1}s`,
                  height: tocando ? undefined : '6px'
                }}
              />
            ))}
          </div>
        </div>

        <div className="flex flex-col sm:flex-row items-center gap-4 justify-between bg-black/40 p-4 rounded-xl border border-cyan-400/20">
          <button
            onClick={alternarPlay}
            style={{
              fontFamily: 'Orbitron, sans-serif',
              fontWeight: 900,
              letterSpacing: '0.05em',
              textTransform: 'uppercase',
              borderRadius: '12px',
              padding: '12px 18px',
              minHeight: '48px',
              display: 'inline-flex',
              alignItems: 'center',
              justifyContent: 'center',
              gap: '8px',
              cursor: 'pointer',
              background: tocando ? '#DC2626' : 'linear-gradient(135deg, #00F2FE 0%, #38BDF8 100%)',
              border: '1px solid #FFFFFF',
              color: '#030712',
              boxShadow: '0 0 20px rgba(0,242,254,0.4)'
            }}
            className="w-full sm:w-auto px-8"
          >
            {tocando ? <><IconPause size={16} color="#030712" /> PAUSAR RADIO TATICA</> : <><IconPlay size={16} color="#030712" /> OUVIR RADIO TATICA</>}
          </button>

          <div className="flex items-center gap-3 w-full sm:w-64">
            <IconVolume size={18} color="#00F2FE" />
            <input
              type="range"
              min="0"
              max="100"
              value={volume}
              onChange={(e) => setVolume(Number(e.target.value))}
              className="w-full accent-cyan-400 cursor-pointer"
            />
            <span className="text-xs font-bold text-cyan-300 w-8 text-right">{volume}%</span>
          </div>
        </div>

        <div className="space-y-2 pt-2">
          <div className="text-xs font-bold text-cyan-300 uppercase">Canais Disponiveis • RadioCyberTatica</div>
          {ESTACOES_TATICAS.map((est, idx) => (
            <div
              key={est.id}
              onClick={() => selecionarEstacao(idx)}
              className={`p-3.5 rounded-xl border flex items-center justify-between cursor-pointer transition-all ${estacaoAtiva === idx ? 'bg-cyan-950/50 border-cyan-400 shadow-[0_0_15px_rgba(0,242,254,0.2)]' : 'bg-black/40 border-cyan-400/20 hover:border-cyan-400/50'}`}
            >
              <div className="space-y-0.5">
                <div className="text-xs font-bold text-white flex items-center gap-2">
                  {estacaoAtiva === idx && <IconCheck size={14} color="#00F2FE" />}
                  {est.nome}
                </div>
                <div className="text-[10px] text-slate-400">{est.genero} • {est.local}</div>
              </div>
              <span className="text-[10px] font-bold text-cyan-300 border border-cyan-400/30 px-2.5 py-1 rounded-lg">
                {estacaoAtiva === idx && tocando ? 'AO VIVO' : 'SELECIONAR'}
              </span>
            </div>
          ))}
        </div>
      </div>
    </div>
  );
}

function RadarMeteorologicoModule({ showToast }) {
  const [dados, setDados] = useState({});
  const [status, setStatus] = useState('Conectando Open-Meteo...');
  const [cidadeSel1, setCidadeSel1] = useState('Mesquita');
  const [cidadeSel2, setCidadeSel2] = useState('Nova Iguacu');
  const [modoVisualizacao, setModoVisualizacao] = useState('radar');
  const [iframeKey, setIframeKey] = useState(0);

  const chartTempRef = useRef(null);
  const chartRainRef = useRef(null);

  function corPorChuva(p){
    if(p >= 70) return '#7C4DFF';
    if(p >= 40) return '#FF0055';
    if(p >= 20) return '#FFB703';
    return '#00FF9D';
  }
  function textoPorChuva(p){
    if(p >= 70) return 'Muito forte';
    if(p >= 40) return 'Forte';
    if(p >= 20) return 'Moderada';
    return 'Fraca / Estavel';
  }

  useEffect(() => {
    async function carregar(){
      try{
        const lats = MUNICIPIOS_92.map(c => c.lat).join(',');
        const lons = MUNICIPIOS_92.map(c => c.lon).join(',');
        const url = `https://api.open-meteo.com/v1/forecast?latitude=${lats}&longitude=${lons}&current=temperature_2m,relative_humidity_2m,wind_speed_10m&hourly=temperature_2m,precipitation_probability,wind_speed_10m&timezone=America%2FSao_Paulo&forecast_days=1`;
        const r = await fetch(url);
        const j = await r.json();
        const arr = Array.isArray(j) ? j : [j];
        const mapa = {};
        arr.forEach((item, i) => {
          const c = MUNICIPIOS_92[i];
          if(!c) return;
          const hora = new Date().getHours();
          mapa[c.n] = {
            temp: item.current.temperature_2m,
            umi: item.current.relative_humidity_2m,
            vento: item.current.wind_speed_10m,
            chuva: item.hourly.precipitation_probability[hora] || 0,
            hourly: item.hourly
          };
        });
        setDados(mapa);
        if(mapa[cidadeSel1] && mapa[cidadeSel1].hourly) {
          desenharGraficosHorarios(mapa[cidadeSel1].hourly);
        }
        setStatus('Open-Meteo conectado · 92 municipios · Dados reais');
      }catch(e){
        setStatus('Sem conexao · Tentando de novo');
      }
    }
    carregar();
    const t = setInterval(carregar, 600000);
    return () => clearInterval(t);
  }, [cidadeSel1]);

  const desenharGraficoCanvas = (canvasRef, valores, cores, sufixo) => {
    const cv = canvasRef.current;
    if(!cv) return;
    const ctx = cv.getContext('2d');
    const W = cv.width = 340, H = cv.height = 140;
    ctx.clearRect(0,0,W,H);
    const max = Math.max(...valores, 1);
    const step = W / valores.length;
    const horaAtual = new Date().getHours();

    valores.forEach((v,i)=>{
      const h = (v/max)*(H-35);
      const x = i*step+4;
      const grad = ctx.createLinearGradient(0,H-h,0,H);
      grad.addColorStop(0,cores[0]);
      grad.addColorStop(1,cores[1]);
      ctx.fillStyle = grad;
      ctx.fillRect(x, H-h-20, step-6, h);
      ctx.fillStyle = '#FFFFFF';
      ctx.font = 'bold 9px monospace';
      ctx.textAlign = 'center';
      ctx.fillText(v+sufixo, x+(step/2), H-h-23);

      const horaLabel = `${String((horaAtual + i) % 24).padStart(2, '0')}h`;
      ctx.fillStyle = '#00F2FE';
      ctx.font = '600 8px monospace';
      ctx.fillText(horaLabel, x+(step/2), H-6);
    });
  };

  const desenharGraficosHorarios = (hourly) => {
    if(!hourly) return;
    const h = new Date().getHours();
    const temps=[], chuvas=[];
    for(let i=0; i<12; i++){
      const idx = (h+i)%24;
      temps.push(Math.round(hourly.temperature_2m[idx] || 25));
      chuvas.push(hourly.precipitation_probability[idx] || 0);
    }
    setTimeout(() => {
      desenharGraficoCanvas(chartTempRef, temps, ['#ff5252','#ffca28'], 'C');

function ModuloCidadaoSensorModule({ onGoToDashboard, showToast }) {
  const [petKg, setPetKg] = React.useState(10);
  const [aluminioKg, setAluminioKg] = React.useState(3);
  const [ferroKg, setFerroKg] = React.useState(15);
  const [papelaoKg, setPapelaoKg] = React.useState(20);
  const [vidroKg, setVidroKg] = React.useState(5);
  const [oleoL, setOleoL] = React.useState(4);

  const [precoPet] = React.useState(2.50);
  const [precoAluminio] = React.useState(8.00);
  const [precoFerro] = React.useState(1.20);
  const [precoPapelao] = React.useState(0.70);
  const [precoVidro] = React.useState(0.35);
  const [precoOleo] = React.useState(3.00);

  const [btConectado, setBtConectado] = React.useState(false);
  const [btStatus, setBtStatus] = React.useState("Desconectado");

  const totalPet = petKg * precoPet;
  const totalAluminio = aluminioKg * precoAluminio;
  const totalFerro = ferroKg * precoFerro;
  const totalPapelao = papelaoKg * precoPapelao;
  const totalVidro = vidroKg * precoVidro;
  const totalOleo = oleoL * precoOleo;

  const valorTotalReciclagem = totalPet + totalAluminio + totalFerro + totalPapelao + totalVidro + totalOleo;
  const pesoTotalKg = Number(petKg) + Number(aluminioKg) + Number(ferroKg) + Number(papelaoKg) + Number(vidroKg) + Number(oleoL);

  const aguaEconomizadaL = (petKg * 24) + (aluminioKg * 40) + (papelaoKg * 15);
  const co2EvitadoKg = (petKg * 1.5) + (aluminioKg * 9.0) + (ferroKg * 1.8) + (papelaoKg * 0.9);
  const volumeDesobstruidoM3 = (pesoTotalKg * 0.0035).toFixed(2);

  const conectarBalancaBT = async () => {
    if (!navigator.bluetooth) {
      if (typeof showToast === 'function') showToast("Web Bluetooth nao suportado.");
      return;
    }
    try {
      setBtStatus("Buscando balanca...");
      const device = await navigator.bluetooth.requestDevice({
        acceptAllDevices: true,
        optionalServices: ['battery_service', '0000181d-0000-1000-8000-00805f9b34fb']
      });
      setBtConectado(true);
      setBtStatus(`Conectado: ${device.name || 'Balanca BT'}`);
      if (typeof showToast === 'function') showToast(`Balanca pareada: ${device.name || 'OK'}`);
    } catch(e) {
      setBtConectado(false);
      setBtStatus("Desconectado");
      if (typeof showToast === 'function') showToast("Conexao Bluetooth cancelada.");
    }
  };

  const gerarReciboColeta = () => {
    const prot = `REC-SOL-${Math.floor(Math.random() * 89999 + 10000)}`;
    const textoRecibo = `[COMPROVANTE DE PESAGEM E ECONOMIA CIRCULAR]\nProtocolo: ${prot}\nLocal: Mesquita / Baixada Fluminense (GADE)\nPeso Total Acumulado: ${pesoTotalKg.toFixed(1)} KG / Litros\n\nDETALHAMENTO DO LOTE:\n- PET: ${petKg} kg (R$ ${totalPet.toFixed(2)})\n- Aluminio: ${aluminioKg} kg (R$ ${totalAluminio.toFixed(2)})\n- Ferro: ${ferroKg} kg (R$ ${totalFerro.toFixed(2)})\n- Papelao: ${papelaoKg} kg (R$ ${totalPapelao.toFixed(2)})\n- Vidro: ${vidroKg} kg (R$ ${totalVidro.toFixed(2)})\n- Oleo Usado: ${oleoL} L (R$ ${totalOleo.toFixed(2)})\n\nVALOR ESTIMADO: R$ ${valorTotalReciclagem.toFixed(2)}\n\nIMPACTO ECOLOGICO:\n- Agua poupada: ${aguaEconomizadaL.toFixed(0)} Litros\n- CO2 evitado: ${co2EvitadoKg.toFixed(1)} Kg\n- Prevencao de Alagamento: ~${volumeDesobstruidoM3} m3\n\nGADE - Grupo a Chave da Esperanca - Base Climatica Tatica`;

    if (navigator.clipboard) {
      navigator.clipboard.writeText(textoRecibo);
      if (typeof showToast === 'function') showToast(`Recibo ${prot} copiado.`);
    }
    window.open(`https://api.whatsapp.com/send?text=${encodeURIComponent(textoRecibo)}`, '_blank');
  };

  return (
    <div className="space-y-4 max-w-5xl mx-auto font-mono">
      <div className="cyber-card p-5 sm:p-6 rounded-[28px] shadow-xl space-y-5 border border-cyberCyan/40">
        <div className="flex items-center justify-between border-b border-cyberCyan/25 pb-3">
          <div className="space-y-0.5">
            <h2 className="font-display text-xs font-black text-white tracking-widest flex items-center gap-2">
              <span className="text-cyberCyan">[BALANCA]</span> CIDADAOSENSOR - BALANCA DIGITAL & ESG
            </h2>
            <p className="text-[9px] font-mono text-cyberCyan font-bold">TECNOLOGIA SOCIAL - ECONOMIA CIRCULAR & DRENAGEM</p>
          </div>
          <button onClick={onGoToDashboard} className="cyber-button text-[10px] py-2 px-4">PAINEL DE CONTROLE</button>
        </div>

        <div className="bg-void/90 border border-cyberCyan/30 rounded-2xl p-3.5 flex flex-col sm:flex-row items-center justify-between gap-3 shadow-inner">
          <div className="flex items-center gap-2.5">
            <span className={`w-3 h-3 rounded-full ${btConectado ? 'bg-cyberGreen animate-ping' : 'bg-cyberRose'}`}></span>
            <div>
              <span className="text-[10px] font-black text-white block">HARDWARE DE PESAGEM BLUETOOTH</span>
              <span className="text-[8px] text-slate-400 font-bold">{btStatus}</span>
            </div>
          </div>
          <button onClick={conectarBalancaBT} className={`cyber-button text-[9px] py-2 px-4 ${btConectado ? '!border-cyberGreen !text-cyberGreen' : ''}`}>
            {btConectado ? 'SISTEMA PAREADO' : 'CONECTAR HARDWARE BT'}
          </button>
        </div>

        <div className="bg-void/90 border border-cyberCyan/40 rounded-2xl p-4 space-y-4 shadow-inner">
          <div className="flex items-center justify-between border-b border-cyberCyan/30 pb-2">
            <span className="text-xs font-black text-cyberCyan uppercase tracking-wider">CONTROLE DE TRIAGEM DE RESIDUOS</span>
            <span className="text-[9px] px-2.5 py-0.5 rounded-full bg-cyberCyan/20 text-cyberCyan border border-cyberCyan/40 font-bold">TOTAL: {pesoTotalKg.toFixed(1)} KG/L</span>
          </div>

          <div className="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-3">
            <div className="bg-deepSpace/90 border border-cyan-400/30 rounded-xl p-3 space-y-2">
              <div className="flex justify-between items-center text-[10px] font-bold text-cyan-300">
                <span>PET ({petKg} kg)</span>
                <span className="text-white">R$ {totalPet.toFixed(2)}</span>

              <input type="range" min="0" max="150" step="1" value={petKg} onChange={e => setPetKg(Number(e.target.value))} className="w-full accent-cyan-400 cursor-pointer touch-manipulation" />

function CardIdentidadeVisualRARU({ openSarahChat, handleWhoAmIClick, setActiveTab, toggleCommandHUD, userName, onOpenNameModal }) {

function RedeAlquinoHardwareModule({ onGoToDashboard, showToast }) {
  const [sensorId] = React.useState("ALQ-92-MESQUITA");
  const [hardwareIpUrl, setHardwareIpUrl] = React.useState(() => {
    try { return localStorage.getItem("raru_alquino_ip") || "http://192.168.4.1/data"; } catch(e) { return "http://192.168.4.1/data"; }
  });
  const [statusHardware, setStatusHardware] = React.useState("AGUARDANDO CONEXAO IP");
  const [gasLevel, setGasLevel] = React.useState("-- PPM");
  const [hidroLevel, setHidroLevel] = React.useState("-- m");
  const [tempHardware, setTempHardware] = React.useState("-- C");
  const [isConnecting, setIsConnecting] = React.useState(false);

  const salvarEConectarIP = async () => {
    try {
      localStorage.setItem("raru_alquino_ip", hardwareIpUrl);
      setIsConnecting(true);
      setStatusHardware("CONECTANDO AO IP...");
      showToast(`Conectando ao IP: ${hardwareIpUrl}`);
      const res = await fetch(hardwareIpUrl, { method: 'GET', mode: 'cors' });
      const data = await res.json();
      if(data) {
        setGasLevel(data.gas ? `${data.gas} PPM` : "14 PPM (Normal)");
        setHidroLevel(data.nivelAgua ? `${data.nivelAgua} m` : "0.35 m (Estavel)");
        setTempHardware(data.temperatura ? `${data.temperatura} C` : "27.1 C");
        setStatusHardware("CONECTADO (ONLINE VIA IP)");
        showToast("Hardware Alquino Sincronizado.");
      }
    } catch(err) {
      setTimeout(() => {
        const gasRand = Math.floor(Math.random() * 25 + 8);
        const hidroRand = (Math.random() * 0.4 + 0.1).toFixed(2);
        setGasLevel(`${gasRand} PPM (Normal)`);
        setHidroLevel(`${hidroRand} m (Estavel)`);
        setTempHardware("26.8 C");
        setStatusHardware("SIMULACAO ATIVA (IP LOCAL)");
        showToast("Modo simulacao IP ativado.");
      }, 800);
    } finally {
      setIsConnecting(false);
    }
  };

  return (
    <div className="space-y-3.5 w-full font-mono max-w-4xl mx-auto">
      <div className="cyber-card space-y-3.5 border border-cyberCyan/40 shadow-2xl p-4">
        <div className="flex items-center justify-between border-b border-cyberCyan/25 pb-2.5">
          <div className="space-y-0.5">
            <h2 className="font-display text-[11px] font-black text-white tracking-widest flex items-center gap-1.5">
              REDE ALQUINO - HARDWARE FISICO
            </h2>
            <p className="text-[8px] font-mono text-cyberCyan font-bold">ACOPLAMENTO DE APARELHAGEM TECNOLOGICA</p>
          </div>
          <button onClick={onGoToDashboard} className="cyber-button text-[10px] py-2 px-3">PAINEL</button>
        </div>

        <div className="bg-void/90 border border-cyberCyan/40 p-3 rounded-xl space-y-2 shadow-inner">
          <label className="text-[9px] text-cyberCyan font-bold uppercase block">Endereco IP / URL do Microcontrolador</label>
          <div className="flex flex-col sm:flex-row gap-2">
            <input type="text" value={hardwareIpUrl} onChange={(e) => setHardwareIpUrl(e.target.value)} placeholder="Ex: http://192.168.4.1/data" className="flex-1 bg-deepSpace border border-cyberCyan/40 rounded-xl p-2.5 text-xs text-white font-mono touch-manipulation" />
            <button onClick={salvarEConectarIP} disabled={isConnecting} className="cyber-button-solid text-xs py-2.5 px-4">
              {isConnecting ? "CONECTANDO..." : "CONECTAR IP"}
            </button>
          </div>
        </div>

        <div className="grid grid-cols-2 sm:grid-cols-4 gap-2.5">
          <div className="bg-void/90 border border-cyberCyan/30 rounded-xl p-3 space-y-0.5">
            <span className="text-[7px] text-slate-400 uppercase tracking-widest block">ID SENSOR</span>
            <span className="text-[10px] font-bold text-cyberCyan truncate block">{sensorId}</span>
          </div>
          <div className="bg-void/90 border border-cyberCyan/30 rounded-xl p-3 space-y-0.5">
            <span className="text-[7px] text-slate-400 uppercase tracking-widest block">STATUS</span>
            <span className="text-[10px] font-bold text-cyberGreen truncate block">{statusHardware}</span>
          </div>
          <div className="bg-void/90 border border-cyberCyan/30 rounded-xl p-3 space-y-0.5">
            <span className="text-[7px] text-slate-400 uppercase tracking-widest block">GASES</span>
            <span className="text-[10px] font-bold text-white truncate block">{gasLevel}</span>
          </div>
          <div className="bg-void/90 border border-cyberCyan/30 rounded-xl p-3 space-y-0.5">
            <span className="text-[7px] text-slate-400 uppercase tracking-widest block">HIDRICO</span>
            <span className="text-[10px] font-bold text-white truncate block">{hidroLevel}</span>
          </div>
        </div>

        <div className="bg-void/80 border border-cyberCyan/20 rounded-xl p-2.5 flex items-center justify-between text-[10px]">
          <span className="text-slate-400">TEMPERATURA DO MODULO</span>
          <span className="font-bold text-cyberCyan">{tempHardware}</span>
        </div>
      </div>
    </div>
  );
}

  const mapEstacaoInstance = useRef(null);
  const chartTempRef = useRef(null);
  const chartRainRef = useRef(null);

  };

  useEffect(() => {
    if (!municipioSelecionado?.lat) return;
    fetch(`https://api.open-meteo.com/v1/forecast?latitude=${municipioSelecionado.lat}&longitude=${municipioSelecionado.lon}&current=temperature_2m,relative_humidity_2m,precipitation,wind_speed_10m&hourly=temperature_2m,precipitation_probability,wind_speed_10m&timezone=auto`)
    .then(r => r.json())
    .then(d => {
      if(d?.hourly) {
        setTimeout(() => desenharGraficosEstacao(d.hourly), 200);
      }
    })
    .catch(() => {});
  }, [municipioSelecionado]);

  useEffect(() => {
    if (estacaoSubTab === 'telemetria') {
      const timer = setTimeout(() => {
        if (mapEstacaoRef.current && window.L) {
          if (mapEstacaoInstance.current) {
            mapEstacaoInstance.current.remove();
            mapEstacaoInstance.current = null;
          }
          const m = L.map(mapEstacaoRef.current).setView([municipioSelecionado.lat, municipioSelecionado.lon], 9);
          L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '© OpenStreetMap contributors'
          }).addTo(m);

          L.tileLayer('https://tile.openweathermap.org/map/precipitation_new/{z}/{x}/{y}.png?appid=90bf852924158498871032fcf273b4ef', {
            opacity: 0.55,
            maxZoom: 18,
            attribution: 'Precipitation / Nuvens'
          }).addTo(m);

          MUNICIPIOS_92.forEach(c => {
            L.circleMarker([c.lat, c.lon], {
              radius: c.n === municipioSelecionado.n ? 9 : 4,
              color: '#00F2FE',
              fillColor: c.n === municipioSelecionado.n ? '#00FF9D' : '#00F2FE',
              fillOpacity: 0.9
            }).addTo(m).bindPopup(`<b>${c.n}</b><br>IP: ${c.ip}`);
          });
          mapEstacaoInstance.current = m;
        }
      }, 150);
      return () => clearTimeout(timer);
    }
  }, [estacaoSubTab, municipioSelecionado]);

  const desenharGraficoCanvas = (canvasRef, valores, cores, label) => {
    const cv = canvasRef.current;
    if(!cv) return;
    const ctx = cv.getContext('2d');
    const W = cv.width = 320, H = cv.height = 140;
    ctx.clearRect(0,0,W,H);
    const max = Math.max(...valores, 1);
    const step = W / valores.length;
    valores.forEach((v,i)=>{
      const h = (v/max)*(H-30);
      const x = i*step+4;
      const grad = ctx.createLinearGradient(0,H-h,0,H);
      grad.addColorStop(0,cores[0]); grad.addColorStop(1,cores[1]);
      ctx.fillStyle = grad;
      ctx.fillRect(x, H-h-15, step-6, h);
      ctx.fillStyle = '#00F2FE'; ctx.font = 'bold 9px monospace';
      ctx.fillText(v+label, x, H-h-18);
    });
  };

  const desenharGraficosEstacao = (hourly) => {
    const h = new Date().getHours();
    const temps=[], probs=[];
    for(let i=0;i<8;i++){
      const idx = (h+i)%24;
      temps.push(Math.round(hourly.temperature_2m[idx] || 25));
      probs.push(hourly.precipitation_probability[idx] || 0);
    }
    desenharGraficoCanvas(chartTempRef, temps, ['#ff5252','#ffca28'], 'C');
    desenharGraficoCanvas(chartRainRef, probs, ['#7c4dff','#29b6f6'], '%');

  const adicionarZeladoria = (e) => {

    setAcaoZel(''); setLocalZel('');
    showToast("Atividade salva no Diario de Zeladoria.");
  };

  return (
    <div className="space-y-4 font-mono w-full max-w-5xl mx-auto">

          <div className="inline-flex items-center gap-2 px-3.5 py-1.5 rounded-full bg-cyberCyan/10 border border-cyberCyan/30 text-cyberCyan text-xs font-bold">

function VistoriaRARU_NEXUS({ onBackToDashboard, showToast, vozSelecionada, userName }) {
  const [mun, setMun] = React.useState(MUNICIPIOS_92[0]);
  const [fotos, setFotos] = React.useState([]);
  const [camOn, setCamOn] = React.useState(false);
  const [zoomLevel, setZoomLevel] = React.useState(1);
  const [maxZoom, setMaxZoom] = React.useState(3);
  const [hasZoomSupport, setHasZoomSupport] = React.useState(false);
  const [nome, setNome] = React.useState(userName || '');
  const [bairro, setBairro] = React.useState('');
  const [rel, setRel] = React.useState('');
  const [gps, setGps] = React.useState({lat:0, lon:0, acc:''});
  const [isAiAnalyzing, setIsAiAnalyzing] = React.useState(false);
  const [clima, setClima] = React.useState(null);
  const [sha256Hash, setSha256Hash] = React.useState('');

  const [frenteSelecionada, setFrenteSelecionada] = React.useState(FRENTES_EQUIPES_TABELA[5]);
  const [alarmeRusso, setAlarmeRusso] = React.useState(false);
  const [alarmeCemaden, setAlarmeCemaden] = React.useState(false);
  const [vento, setVento] = React.useState(0);

  const audioRef = React.useRef(null);
  const sireneIntervalRef = React.useRef(null);
  const timeoutSireneRef = React.useRef(null);
  const videoRef = React.useRef(null);
  const streamRef = React.useRef(null);
  const trackRef = React.useRef(null);

  const RISCOS_RARU = ["R1 - BAIXO / PREVENTIVO","R2 - MODERADO / ALERTA","R3 - ALTO / ENXURRADA","R4 - EVACUACAO PREVENTIVA","RH - CONVERGENCIA SERRAS","RE - ESTRUTURAL / TALUDE"];
  const [risco, setRisco] = React.useState(RISCOS_RARU[1]);
  const [protAtual, setProtAtual] = React.useState(null);

  React.useEffect(() => {
    if (userName && !nome) setNome(userName);
  }, [userName]);

  React.useEffect(() => {
    if (!mun?.lat) return;
    fetch(`https://api.open-meteo.com/v1/forecast?latitude=${mun.lat}&longitude=${mun.lon}&current=temperature_2m,relative_humidity_2m,precipitation,wind_speed_10m,wind_gusts_10m&timezone=auto`)
    .then(r => r.json())
    .then(d => {
      setClima(d.current);
      setVento(d.current?.wind_gusts_10m || d.current?.wind_speed_10m || 0);
    })
    .catch(() => {});
  }, [mun]);

  React.useEffect(() => {
    return () => {
      pararTodasSirenes();
      if (streamRef.current) streamRef.current.getTracks().forEach(t => t.stop());
    };
  }, []);

  const pararTodasSirenes = () => {
    setAlarmeRusso(false);
    setAlarmeCemaden(false);
    if(sireneIntervalRef.current) clearInterval(sireneIntervalRef.current);
    if(timeoutSireneRef.current) clearTimeout(timeoutSireneRef.current);
    try{ audioRef.current?._osc?.stop(); audioRef.current?.close(); }catch(e){}
    audioRef.current = null;
  };

  const dispararSirene5Minutos = (tipo) => {
    pararTodasSirenes();
    if (tipo === 'russo') setAlarmeRusso(true);
    else setAlarmeCemaden(true);

    showToast(`Sirene ${tipo === 'russo' ? 'Alarme Russo' : 'CEMADEN'} disparada por 5 minutos.`);
    falarSarah(`Calma, ${userName || 'Operador'}, acionei o alerta preditivo aqui. Vamo ficar de olho.`, vozSelecionada);

    try {
      if(!audioRef.current) audioRef.current = new (window.AudioContext||window.webkitAudioContext)();
      const ctx = audioRef.current; ctx.resume();
      const osc = ctx.createOscillator(); const gain = ctx.createGain();
      osc.type = tipo === 'russo' ? 'sawtooth' : 'sine';
      osc.frequency.value = tipo === 'russo' ? 450 : 600;
      gain.gain.value = 0.15;
      osc.connect(gain); gain.connect(ctx.destination); osc.start();
      audioRef.current._osc = osc;

      let subindo = true;
      sireneIntervalRef.current = setInterval(()=>{
        let f = osc.frequency.value;
        if(subindo){ f+=30; if(f>=950) subindo=false; }
        else { f-=30; if(f<=400) subindo=true; }
        osc.frequency.setTargetAtTime(f, ctx.currentTime, 0.1);
      }, 80);

      timeoutSireneRef.current = setTimeout(() => {
        pararTodasSirenes();
        showToast("Ciclo de 5 minutos da sirene encerrado.");
      }, 300000);
    } catch(e) {}
  };

  const atualizarGPS = () => {
    if(!navigator.geolocation) return;
    navigator.geolocation.getCurrentPosition(p => {
      setGps({ lat: p.coords.latitude, lon: p.coords.longitude, acc: Math.round(p.coords.accuracy) });
      setMun(m => ({ ...m, lat: p.coords.latitude, lon: p.coords.longitude }));
      showToast(`GPS ${Math.round(p.coords.accuracy)}m sincronizado.`);
    }, () => {}, { enableHighAccuracy: true, timeout: 5000 });
  };

  const startCam = async () => {
    try {
      const s = await navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: "environment" } } });
      streamRef.current = s;
      const track = s.getVideoTracks()[0];
      trackRef.current = track;
      const caps = track.getCapabilities ? track.getCapabilities() : {};
      if (caps.zoom) { setHasZoomSupport(true); setMaxZoom(caps.zoom.max || 5); setZoomLevel(caps.zoom.min || 1); }
      setCamOn(true);
      setTimeout(() => { if(videoRef.current){ videoRef.current.srcObject = s; videoRef.current.play().catch(() => {}); } }, 100);
      atualizarGPS();
      falarSarah(`Camera ligada em ${mun.n}. To vendo tudo com voce, ${userName || 'Operador'}.`, vozSelecionada);
    } catch { showToast('Camera bloqueada.'); }
  };

  const stopCam = () => { if(streamRef.current) streamRef.current.getTracks().forEach(t => t.stop()); setCamOn(false); };

  const handleZoomChange = (e) => {
    const val = parseFloat(e.target.value);
    setZoomLevel(val);
    if (trackRef.current && trackRef.current.applyConstraints) {
      trackRef.current.applyConstraints({ advanced: [{ zoom: val }] }).catch(() => {});
    }
  };

  const capturarFotoFinal = async () => {
    const v = videoRef.current; if(!v) return null;
    const canvas = document.createElement('canvas');
    canvas.width = 800;
    canvas.height = Math.round(800 * (v.videoHeight / v.videoWidth || 0.75));
    const ctx = canvas.getContext('2d');
    ctx.drawImage(v, 0, 0, canvas.width, canvas.height);

    const dataHoraAtual = new Date().toLocaleString('pt-BR');
    const latStr = (gps.lat||mun.lat).toFixed(5);
    const lonStr = (gps.lon||mun.lon).toFixed(5);
    const agenteStr = (nome || userName || 'Comunitario').slice(0,22);
    const bairroStr = (bairro || 'Local').slice(0,18);
    const payloadHash = `${dataHoraAtual}|${latStr},${lonStr}|${agenteStr}|${bairroStr}|${risco}|${frenteSelecionada}|${zoomLevel}x`;
    const hashGerado = await calcularSHA256(payloadHash);
    setSha256Hash(hashGerado);

    ctx.fillStyle = 'rgba(3,7,18,0.92)';
    ctx.fillRect(0, canvas.height - 124, canvas.width, 124);
    ctx.fillStyle = '#00F2FE'; ctx.font = 'bold 11px monospace';
    ctx.fillText(`DATA ${dataHoraAtual} | GPS ${latStr}, ${lonStr}`, 15, canvas.height - 102);
    ctx.fillStyle = '#fff'; ctx.font = 'bold 11px monospace';
    ctx.fillText(`AGENTE ${agenteStr} | LOCALIDADE ${bairroStr} | ZOOM ${zoomLevel}x`, 15, canvas.height - 82);
    ctx.fillStyle = '#FF0055'; ctx.font = 'bold 11px monospace';
    ctx.fillText(`RISCO ${risco}`, 15, canvas.height - 62);
    ctx.fillStyle = '#FFA500'; ctx.font = 'bold 10px monospace';
    ctx.fillText(`FRENTE ${frenteSelecionada.slice(0, 55)}`, 15, canvas.height - 42);
    ctx.fillStyle = '#00F2FE'; ctx.font = 'bold 9px monospace';
    ctx.fillText(`SHA-256 ${hashGerado.slice(0, 32)}...`, 15, canvas.height - 24);
    ctx.fillStyle = '#00FF88'; ctx.font = 'bold 10px monospace';
    ctx.fillText(`CIDADAOSENSOR - GADE (GRUPO A CHAVE DA ESPERANCA)`, 15, canvas.height - 8);

    const base64Final = canvas.toDataURL('image/jpeg', 0.85);
    setFotos([base64Final]);
    showToast(`Foto com zoom, carimbo e SHA-256 gerada.`);
    falarSarah("Boa foto capturada com hash SHA-256. Registro pronto para o laudo.", vozSelecionada);
    return base64Final;
  };

  const obterHashRegistro = async () => {
    if (sha256Hash) return sha256Hash;
    const baseStr = `${new Date().toISOString()}|${mun.n}|${bairro}|${nome || userName}|${risco}|${frenteSelecionada}|${(gps.lat||mun.lat).toFixed(5)},${(gps.lon||mun.lon).toFixed(5)}`;
    const h = await calcularSHA256(baseStr);
    setSha256Hash(h);
    return h;
  };

  const textoVistoria = (prot, hashVal = '') => {
    const linhaHash = hashVal ? `\nSHA-256: ${hashVal}` : '';
    return `[REGISTRO DE VISTORIA COMUNITARIA - CIDADAOSENSOR]\nProtocolo: ${prot || protAtual || 'PROT-RARU'}\nAgente: ${nome || userName || 'Comunitario'}\nLocal: ${mun.n} - ${bairro}\nClassificacao: ${risco}\nFrente: ${frenteSelecionada}\nZoom: ${zoomLevel}x${linhaHash}\nGOES-19 | Chuva ${clima?.precipitation||0}mm | Vento ${vento}km/h\nGPS: ${(gps.lat||mun.lat).toFixed(5)}, ${(gps.lon||mun.lon).toFixed(5)}\nRelatorio: ${rel}\nAnexo: 1 foto com carimbo tecnico e zoom`;
  };

  const enviarWhatsComum = async () => {
    const dados = await gerarDados(); if(!dados) return;
    const hashVal = await obterHashRegistro();
    const texto = textoVistoria(dados.protocolo, hashVal);
    if(fotos[0] && navigator.canShare){
      try{
        const blob = await (await fetch(fotos[0])).blob();
        const file = new File([blob], `vistoria-${mun.n}.jpg`, {type:'image/jpeg'});
        if(navigator.canShare({files:[file]})){ await navigator.share({text: texto, files:[file]}); showToast('WhatsApp Comum enviado com foto.'); return; }
      }catch(e){}
    }
    window.open(`https://api.whatsapp.com/send?text=${encodeURIComponent(texto)}`, '_blank');
    if(fotos[0]) baixarFotoLeve(fotos[0]);
    showToast('WhatsApp Comum aberto.');
  };

  const enviarWhatsBusiness = async () => {
    const dados = await gerarDados(); if(!dados) return;
    const hashVal = await obterHashRegistro();
    window.open(`https://wa.me/?text=${encodeURIComponent(textoVistoria(dados.protocolo, hashVal))}`, '_blank');
    if(fotos[0]) baixarFotoLeve(fotos[0]);
    showToast('Selecione WhatsApp Business.');
  };

  const adicionarNoStatusComFoto = async () => {
    if(fotos.length===0){ showToast('Capture 1 foto primeiro.'); return; }
    const hashVal = await obterHashRegistro();
    const texto = textoVistoria(protAtual, hashVal);
    try{
      const blob = await (await fetch(fotos[0])).blob();
      const file = new File([blob], `vistoria-${mun.n}.jpg`, {type:'image/jpeg'});
      if(navigator.canShare && navigator.canShare({files:[file]})){
        await navigator.share({ title:'Vistoria Comunitaria', text: texto, files:[file] });
        showToast('Selecione WhatsApp > Status.'); return;
      }
    }catch(e){}
    baixarFotoLeve(fotos[0]);
    window.open(`https://wa.me/?text=${encodeURIComponent(texto)}`, '_blank');
  };

  const baixarFotoLeve = (base64) => { const a=document.createElement('a'); a.href=base64; a.download=`vistoria-${mun.n}.jpg`; a.click(); };

  const gerarLaudoComSarahAI = async () => {
    if(!bairro) { showToast('Informe o bairro para a IA redigir o relatorio.'); return; }
    setIsAiAnalyzing(true);
    showToast('Sarah AI redigindo relatorio tecnico...');
    const hashVal = await obterHashRegistro();
    const promptVistoria = `Elabore um Relatorio Tecnico Preliminar de Vistoria Comunitaria e Geotecnica para o municipio de ${mun.n}, bairro ${bairro}, sob a frente ${frenteSelecionada}. Agente responsavel: ${nome || userName}. Classificacao de Risco: ${risco}. Hash SHA-256: ${hashVal}. Dados climaticos atuais: precipitacao ${clima?.precipitation||0}mm, vento ${vento}km/h. Relato adicional do agente: ${rel}. Estruture com rigor tecnico, inclua diretrizes de Solucoes Baseadas na Natureza (SbN) se aplicavel, e encerre obrigatoriamente com a Nota de Conformidade legal do CONFEA/CREA.`;
    try {
      const respostaGroq = await chamarSarah('laudo', [{ role: 'user', content: promptVistoria }], mun.n, bairro, 'vistoria', clima, userName);
      setRel(respostaGroq);
      setIsAiAnalyzing(false);
      showToast('Relatorio tecnico gerado pela Sarah AI.');
      falarSarah("Laudo tecnico redigido com sucesso. Vamo conferir.", vozSelecionada);
    } catch(e) {
      setRel(`RELATORIO TECNICO COMUNITARIO - CIDADAOSENSOR\nMunicipio: ${mun.n} | Bairro: ${bairro}\nAgente: ${nome || userName}\nFrente: ${frenteSelecionada}\nClassificacao de Risco: ${risco}\nSHA-256: ${hashVal}\nCondicoes: ${clima?.precipitation||0}mm precipitacao, vento ${vento}km/h.`);
      setIsAiAnalyzing(false);
      showToast('Relatorio padrao aplicado.');
    }
  };

  const gerarDados = async () => {
    if(!nome) { showToast('Informe o nome do responsavel.'); return null; }
    if(!bairro) { showToast('Informe o bairro.'); return null; }
    const seq = Math.floor(Math.random() * 8999 + 1000);
    const sig = mun.n.slice(0, 3).toUpperCase();
    const prot = `PROT-RARU-${sig}-2026-${seq}`;
    const hashVal = await obterHashRegistro();
    setProtAtual(prot);
    return { protocolo: prot, sha256: hashVal };
  };

  const gerarPDFLeve = async () => {
    const dados = await gerarDados(); if(!dados) return;
    const canvas = document.createElement('canvas');
    canvas.width = 600; canvas.height = 800;
    const ctx = canvas.getContext('2d');
    ctx.fillStyle = '#02040A'; ctx.fillRect(0,0,600,800);
    ctx.fillStyle = '#00F2FE'; ctx.font = 'bold 16px monospace';
    ctx.fillText('RELATORIO COMUNITARIO - CIDADAOSENSOR', 20, 35);
    ctx.fillStyle = '#fff'; ctx.font = '11px monospace';
    ctx.fillText(`Protocolo: ${dados.protocolo}`, 20, 60);
    ctx.fillText(`Agente/Responsavel: ${nome}`, 20, 82);
    ctx.fillText(`Local: ${mun.n} - ${bairro}`, 20, 104);
    ctx.fillText(`Frente: ${frenteSelecionada.slice(0, 50)}`, 20, 126);
    ctx.fillText(`Risco: ${risco}`, 20, 148);
    ctx.fillStyle = '#00F2FE'; ctx.font = '9px monospace';
    ctx.fillText(`SHA-256: ${dados.sha256}`, 20, 170);
    const finalizar = () => {
      const base64PDF = canvas.toDataURL('image/jpeg', 0.70);
      const win = window.open('', '_blank');
      win.document.write(`<html><head><title>Relatorio Comunitario</title><style>body{margin:0;background:#000;display:flex;justify-content:center} img{width:100%;max-width:600px} .btn{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#00F2FE;color:#000;font-weight:900;padding:12px 20px;border-radius:999px;border:0} @media print{.btn{display:none}}</style></head><body><img src="${base64PDF}"><button class="btn" onclick="window.print()">SALVAR RELATORIO PDF</button></body></html>`);
      showToast('Relatorio PDF gerado.');
    };
    if(fotos[0]){ const img = new Image(); img.onload = ()=>{ ctx.drawImage(img, 20, 430, 280, 180); finalizar(); }; img.src = fotos[0]; }
    else finalizar();
  };

  return (
    <div className="w-full space-y-3.5 font-mono max-w-4xl mx-auto">
      <style>{`.carimbo-css{ background:rgba(3,7,18,0.88); border:1px solid #00F2FE; border-radius:8px; padding:6px 8px; display:flex; flex-direction:column; gap:2px; font-size:8px; color:#00F2FE; line-height:1.4; } .carimbo-css span:nth-child(2){ color:#fff; } .carimbo-css span:nth-child(3){ color:#FF0055; font-weight:900; }`}</style>

        <div className="bg-black border border-orange-500/40 rounded-xl p-3 space-y-2">

function AdminVaultModule({ showToast, onClose, localVideos, setLocalVideos, youtubeVideos, setYoutubeVideos, publicVideos, vozSelecionada, setVozSelecionada, customTickerText, setCustomTickerText }) {
  const [pinInput, setPinInput] = React.useState("");
  const [isUnlocked, setIsUnlocked] = React.useState(false);
  const [adminSubTab, setAdminSubTab] = React.useState('cade');
  const [novaUrlYoutube, setNovaUrlYoutube] = React.useState('');
  const [tickerInput, setTickerInput] = React.useState(customTickerText);

  const handleUnlock = (e) => {
    e.preventDefault();
    if (pinInput === "303500") { setIsUnlocked(true); showToast("Acesso Restrito Autorizado."); } else { showToast("PIN Incorreto."); }
  };

  const salvarTicker = (e) => {
    e.preventDefault();
    setCustomTickerText(tickerInput);
    try { localStorage.setItem('raru_custom_ticker', tickerInput); } catch(e){}
    showToast("Faixa marquee atualizada com sucesso.");
  };

  const testarVoz = (index) => {
    setVozSelecionada(index);
    try { localStorage.setItem('raru_voz_index', String(index)); } catch(e){}
    falarSarah("Testando perfil de voz numero " + (index + 1) + " na central.", index);
    showToast(`Voz ${index + 1} ativada.`);
  };

  const handleUploadGaleriaDireto = (e) => {
    const file = e.target.files[0];
    if (!file || !file.type.startsWith('video/')) { showToast("Selecione um video valido."); return; }
    const reader = new FileReader();
    reader.onload = (uploadEvent) => {
      const base64Video = uploadEvent.target.result;
      const novoItem = { id: Date.now(), title: file.name, url: base64Video, type: 'local' };
      const atualizados = [novoItem, ...localVideos];
      setLocalVideos(atualizados);
      try { localStorage.setItem('raru_local_videos', JSON.stringify(atualizados)); } catch(e){}
      showToast("Video salvo no LocalStorage.");
    };
    reader.readAsDataURL(file);
  };

  const converterLinkYoutube = (url) => {
    if (!url) return '';
    let videoId = '';
    if (url.includes('youtu.be/')) videoId = url.split('youtu.be/')[1]?.split('?')[0];
    else if (url.includes('watch?v=')) videoId = url.split('watch?v=')[1]?.split('&')[0];
    return videoId ? `https://www.youtube.com/embed/${videoId}` : '';
  };

  const handleAdicionarYoutubeDireto = (e) => {
    e.preventDefault();
    const embedUrl = converterLinkYoutube(novaUrlYoutube);
    if (!embedUrl) { showToast("Link do YouTube invalido."); return; }
    const novoItem = { id: Date.now(), title: "Video do YouTube", url: embedUrl, type: 'youtube' };
    const atualizados = [novoItem, ...youtubeVideos];
    setYoutubeVideos(atualizados);
    try { localStorage.setItem('raru_youtube_videos', JSON.stringify(atualizados)); } catch(e){}
    setNovaUrlYoutube('');
    showToast("Video do YouTube salvo.");
  };

  return (
    <div className="space-y-4 w-full font-mono max-w-4xl mx-auto">
      <div className="cyber-card p-4 shadow-xl space-y-4 border border-cyberCyan/40">
        <div className="flex items-center justify-between border-b border-cyberCyan/25 pb-2.5">
          <h2 className="font-display text-xs font-black text-cyberCyan tracking-widest">AREA RESTRITA (ADMIN VAULT)</h2>
          <button onClick={onClose} className="cyber-button-danger text-xs py-1 px-3 !min-h-[32px]">FECHAR</button>
        </div>

        {!isUnlocked ? (
          <form onSubmit={handleUnlock} className="flex gap-2">
            <input type="password" maxLength="6" value={pinInput} onChange={(e) => setPinInput(e.target.value)} placeholder="PIN (303500)" className="flex-1 bg-void border border-cyberCyan/40 rounded-xl px-3 py-2.5 text-center text-slate-100 font-mono tracking-widest text-xs shadow-inner" />
            <button type="submit" className="cyber-button text-xs py-2.5 px-4">ACESSAR</button>
          </form>
        ) : (
          <div className="space-y-4">
            <div className="flex gap-2 overflow-x-auto pb-2 border-b border-cyberCyan/30">
              <button onClick={() => setAdminSubTab('cade')} className={`cyber-button text-xs py-2 px-3 ${adminSubTab === 'cade' ? '!bg-cyan-400 !text-void' : ''}`}>PAINEL GADE / CADE</button>
              <button onClick={() => setAdminSubTab('sistema')} className={`cyber-button text-xs py-2 px-3 ${adminSubTab === 'sistema' ? '!bg-cyberCyan !text-void' : ''}`}>CONFIGURACOES</button>
            </div>

            {adminSubTab === 'cade' && (
              <CadeAdminModule showToast={showToast}/>
            )}

            {adminSubTab === 'sistema' && (
              <div className="space-y-5">
                <div className="bg-void/90 border border-cyberCyan/50 rounded-xl p-3.5 space-y-2.5">
                  <span className="text-white font-black text-xs font-display block">CONFIGURACAO DAS 5 VOZES OFICIAIS (SARAH AI)</span>
                  <div className="grid grid-cols-5 gap-1.5">
                    {[0, 1, 2, 3, 4].map(idx => (
                      <button key={idx} onClick={() => testarVoz(idx)} className={`cyber-button text-[9px] py-2 px-1 text-center ${vozSelecionada === idx ? '!bg-cyberGreen !text-void !border-cyberGreen' : ''}`}>
                        Voz {idx + 1}
                      </button>
                    ))}
                  </div>
                </div>

                <div className="bg-void/90 border border-cyberCyan/50 rounded-xl p-3.5 space-y-2.5">
                  <span className="text-white font-black text-xs font-display block">TEXTO DA FAIXA MARQUEE (LETREIRO)</span>
                  <form onSubmit={salvarTicker} className="space-y-2">
                    <input type="text" value={tickerInput} onChange={(e) => setTickerInput(e.target.value)} placeholder="Digite o texto..." className="w-full bg-deepSpace border border-cyberCyan/40 rounded-xl p-2.5 text-xs text-white" />
                    <button type="submit" className="cyber-button w-full text-xs py-2.5">ATUALIZAR FAIXA MARQUEE</button>
                  </form>
                </div>

                <div className="bg-void/90 border border-cyberCyan/50 rounded-xl p-3.5 space-y-2">
                  <span className="text-white font-black text-xs font-display block">ADICIONAR VIDEO DO APARELHO</span>
                  <label className="cyber-button w-full text-xs py-3 justify-center cursor-pointer">
                    SELECIONAR ARQUIVO DE VIDEO
                    <input type="file" accept="video/*" onChange={handleUploadGaleriaDireto} className="hidden" />
                  </label>
                </div>
                <div className="bg-void/90 border border-cyberCyan/50 rounded-xl p-3.5 space-y-2">
                  <span className="text-white font-black text-xs font-display block">ADICIONAR YOUTUBE POR LINK</span>
                  <form onSubmit={handleAdicionarYoutubeDireto} className="space-y-2">
                    <input type="text" value={novaUrlYoutube} onChange={(e) => setNovaUrlYoutube(e.target.value)} placeholder="Cole o link do YouTube..." className="w-full bg-deepSpace border border-cyberCyan/40 rounded-xl p-2.5 text-xs text-white" />
                    <button type="submit" className="cyber-button w-full text-xs py-2.5">SALVAR LINK YOUTUBE</button>
                  </form>
                </div>
              </div>
            )}
          </div>
        )}
      </div>
    </div>
  );
}

        <div className="p-3 sm:p-4 bg-deepSpace/95 border-t border-cyberCyan/35">
          <form onSubmit={(e) => { e.preventDefault(); handleSendDirectCommand(); }} className="flex items-center gap-2.5 bg-void border-2 border-cyberCyan/60 rounded-2xl p-2.5 shadow-inner w-full transition-all focus-within:border-cyberCyan focus-within:shadow-[0_0_20px_rgba(0,242,254,0.3)]">

              className={`relative cyber-button text-[11px] py-2.5 px-3.5 shrink-0 flex items-center gap-2 rounded-xl transition-all ${ isListening ? '!bg-cyberRose !text-white !border-cyberRose animate-pulse shadow-[0_0_25px_rgba(255,0,85,0.7)]' : 'hover:border-cyberCyan' }`}
            >
              {isListening && (
                <span className="absolute -inset-1 rounded-xl bg-cyberRose/40 animate-ping pointer-events-none"></span>
              )}
              <svg className={`w-4 h-4 ${isListening ? 'animate-bounce' : ''}`} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round">
                <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/>
                <path d="M19 10v1a7 7 0 0 1-14 0v-1"/>
                <line x1="12" y1="19" x2="12" y2="23"/>
                <line x1="8" y1="23" x2="16" y2="23"/>

              <span className="hidden sm:inline font-bold tracking-wide">{isListening ? 'GRAVANDO' : 'VOZ'}</span>
            </button>
            <input
              type="text"
              value={input}
              onChange={(e) => setInput(e.target.value)}
              placeholder={isListening ? "Ouvindo sua voz..." : `Digite sua mensagem, ${userName || 'Operador'}...`}
              className="flex-1 bg-transparent border-none px-2.5 py-1.5 text-xs sm:text-sm text-slate-100 font-sans focus:outline-none min-w-0 placeholder:text-slate-500"
            />
            <button
              type="submit"
              disabled={isProcessing || !input.trim()}
              className={`cyber-button-solid text-[11px] py-2.5 px-5 shrink-0 rounded-xl transition-all flex items-center gap-1.5 ${ input.trim() && !isProcessing ? 'shadow-[0_0_20px_rgba(0,242,254,0.5)] scale-100' : 'opacity-40 cursor-not-allowed scale-95' }`}
            >
              <span>ENVIAR</span>
              <svg className="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round">
                <line x1="22" y1="2" x2="11" y2="13"/>
                <polygon points="22 2 15 22 11 13 2 9 22 2"/>
              </svg>
            </button>
          </form>
        </div>
      </div>
    </div>
  );
}

function App() {

      return t;
    } catch(e) { return "dark"; }
  });

  const [soundEnabled, setSoundEnabled] = React.useState(() => {

    } catch(e) { return true; }

  const [isSpeaking, setIsSpeaking] = React.useState(false);

  const [check1, setCheck1] = React.useState(false);
  const [check2, setCheck2] = React.useState(false);

  const [userName, setUserName] = React.useState(() => { try { return localStorage.getItem("raru_user_name") || "Operador"; } catch(e) { return "Operador"; } });
  const [nameModalOpen, setNameModalOpen] = React.useState(false);
  const [tempNameInput, setTempNameInput] = React.useState("");

  const [isChatOpen, setIsChatOpen] = React.useState(false);
  const [input, setInput] = React.useState("");
  const [isProcessing, setIsProcessing] = React.useState(false);

  const [vozSelecionada, setVozSelecionada] = React.useState(() => { try { return Number(localStorage.getItem("raru_voz_index")) || 0; } catch(e) { return 0; } });
  const [customTickerText, setCustomTickerText] = React.useState(() => { try { return localStorage.getItem('raru_custom_ticker') || ""; } catch(e) { return ""; } });

  const [localVideos, setLocalVideos] = React.useState(() => { try { const s = localStorage.getItem('raru_local_videos'); return s ? JSON.parse(s) : []; } catch(e) { return []; } });
  const [youtubeVideos, setYoutubeVideos] = React.useState(() => { try { const s = localStorage.getItem('raru_youtube_videos'); return s ? JSON.parse(s) : []; } catch(e) { return []; } });
  const [publicVideos] = React.useState(() => { try { const s = localStorage.getItem('raru_public_videos'); return s ? JSON.parse(s) : []; } catch(e) { return []; } });

  const showToast = (msg) => { setToastMsgRef(msg); setTimeout(() => setToastMsgRef(null), 3500); };

  const handleSaveName = (e) => {
    e.preventDefault();
    if (!tempNameInput.trim()) return;
    const nomeLimpo = tempNameInput.trim();
    setUserName(nomeLimpo);
    try { localStorage.setItem("raru_user_name", nomeLimpo); } catch(e) {}
    setNameModalOpen(false);
    setTempNameInput("");
    const saudacao = `Calma, ${nomeLimpo}, to contigo. Nome gravado na central. Vamo operar junto em Mesquita e no RJ.`;
    setMessages([{ sender: 'assistant', text: saudacao, time: new Date().toLocaleTimeString('pt-BR', {hour: '2-digit', minute:'2-digit'}) }]);
    if (soundEnabled) falarSarah(saudacao, vozSelecionada);
    showToast(`Operador ${nomeLimpo} registrado.`);
  };

  const toggleCommandHUD = () => {
    const elem = document.documentElement;
    if (!isCommandHUDActive) {
      try {
        if (elem.requestFullscreen) elem.requestFullscreen();
        else if (elem.webkitRequestFullscreen) elem.webkitRequestFullscreen();
      } catch (err) {}
      setIsCommandHUDActive(true);
      showToast("REDE AUTOMATIZADA DE RESILIENCIA URBANA • HUD TELA CHEIA ATIVO.");
    } else {
      try {
        if (document.exitFullscreen) document.exitFullscreen();
        else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
      } catch (err) {}
      setIsCommandHUDActive(false);
      showToast("Modo Padrao Restabelecido.");
    }
  };

  const openShareFromApp = async () => {
    showToast("Gerando arquivo compacto...");
    const iconeArquivo = await gerarArquivoIconeEscudo();
    if (navigator.share) {
      try {
        const sharePayload = { title: "Base Climatica de Monitoramento Tatico", text: shareMessageText, url: APP_SHARE_URL };
        if (iconeArquivo && navigator.canShare && navigator.canShare({ files: [iconeArquivo] })) sharePayload.files = [iconeArquivo];
        await navigator.share(sharePayload);
        return;
      } catch (err) {}
    }
    setShareModalOpen(true);
  };

  const toggleTheme = () => {
    setTheme(prev => {
      const next = prev === 'dark' ? 'warm' : 'dark';
      try {
        localStorage.setItem("raru-cyber-theme", next);
        if (next === 'warm') document.body.classList.add('theme-warm');
        else document.body.classList.remove('theme-warm');
      } catch(e) {}
      showToast(next === 'warm' ? 'Modo Claro / Leitura Diurna Ativo' : 'Modo Escuro / Leitura Noturna Ativo');
      return next;

  };

  const toggleListening = () => {
    const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SpeechRec) { showToast("Microfone indisponivel."); return; }
    if (isListening) { setIsListening(false); return; }
    try {
      const rec = new SpeechRec();
      rec.lang = "pt-BR";
      rec.onstart = () => setIsListening(true);
      rec.onresult = (event) => {
        let final = event.results[0][0].transcript;
        if (final) {
          setInput(final);
          setIsListening(false);
          handleSendDirectCommand(final);
        }
      };
      rec.onerror = () => setIsListening(false);
      rec.onend = () => setIsListening(false);
      rec.start();
      showToast("Microfone ativado. Fale agora...");
    } catch (e) {
      setIsListening(false);
      showToast("Erro ao acionar o microfone.");
    }
  };

      }
    ];
  });

  const handleSendDirectCommand = async (textCustom) => {
    const textToSend = textCustom !== undefined ? textCustom : input;
    if (!textToSend.trim() || isProcessing) return;
    const timeStr = new Date().toLocaleTimeString('pt-BR', {hour: '2-digit', minute:'2-digit'});

    let nomeAtualizado = userName;
    const matchNome = textToSend.match(/(?:meu nome [ée]|pode me chamar de|eu sou o|eu sou a|sou o|sou a)\s+([A-Za-zÀ-ÖØ-öø-ÿ]+(?:\s+[A-Za-zÀ-ÖØ-öø-ÿ]+)?)/i);
    if (matchNome && matchNome[1]) {
      const extraido = matchNome[1].trim();
      if (extraido.length >= 2 && extraido.length <= 35) {
        nomeAtualizado = extraido.charAt(0).toUpperCase() + extraido.slice(1);
        setUserName(nomeAtualizado);
        try { localStorage.setItem("raru_user_name", nomeAtualizado); } catch(e) {}
        showToast(`Nome atualizado: ${nomeAtualizado}`);
      }
    }

    const novoHistorico = [...messages, { sender: 'user', text: textToSend, time: timeStr }];
    setMessages(novoHistorico);
    setInput("");
    setIsProcessing(true);
    setIsSpeaking(true);

    try {
      const formattedHistory = novoHistorico.map(m => ({
        role: m.sender === 'user' ? 'user' : 'assistant',
        content: m.text
      }));

      const respostaSarah = await chamarSarahGroq(formattedHistory, "Mesquita", "Rocha Sobrinho", activeTab, { status: "Online" }, nomeAtualizado || "Operador");
      const replyTime = new Date().toLocaleTimeString('pt-BR', {hour: '2-digit', minute:'2-digit'});

      setMessages(prev => [...prev, { sender: 'assistant', text: respostaSarah, time: replyTime }]);
      if (soundEnabled) falarSarah(respostaSarah, vozSelecionada);
    } catch (error) {
      const errorMsg = `Calma, ${nomeAtualizado || 'Operador'}, deu uma instabilidade aqui na rede, mas to na escuta. Vamo tentar de novo.`;
      setMessages(prev => [...prev, { sender: 'assistant', text: errorMsg, time: new Date().toLocaleTimeString('pt-BR', {hour: '2-digit', minute:'2-digit'}) }]);
    } finally {
      setIsProcessing(false);
      setIsSpeaking(false);
    }

          </div>
        </header>

        <nav className="sticky top-[56px] sm:top-[62px] z-30 w-full backdrop-blur-lg bg-deepSpace/95 border-b border-cyberCyan/20 px-2 py-1.5">
          <div className="max-w-7xl mx-auto flex items-center justify-start sm:justify-center gap-1.5 overflow-x-auto pb-1">
            {NAV_TABS.map(tab => {
              const isActive = activeTab === tab.id;
              return (
                <button key={tab.id} onClick={() => { if (tab.isShare) openShareFromApp(); else if (tab.isQuemSomos) setQuemSomosOpen(true); else setActiveTab(tab.id); }} className={`flex items-center gap-1.5 px-3 py-2 rounded-xl font-mono text-[10px] sm:text-xs font-bold whitespace-nowrap transition-all shrink-0 cursor-pointer touch-manipulation ${ isActive ? 'bg-gradient-to-r from-cyberCyan to-blue-400 text-void shadow-[0_0_15px_rgba(0,242,254,0.45)]' : 'bg-void/60 text-slate-300 border border-cyberCyan/20 hover:border-cyberCyan/50 hover:text-white' }`}>
                  {tab.iconComponent}
                  <span>{tab.label}</span>
                </button>
              );
            })}
          </div>
        </nav>

        <main className="flex-1 w-full max-w-7xl mx-auto px-3 sm:px-6 py-4 space-y-5">
          {activeTab === 'dashboard' && (
            <>
              <AutomatedObservatoryWidget customTickerText={customTickerText}/>
              <div className="grid grid-cols-1 lg:grid-cols-12 gap-4 items-start">
                <div className="lg:col-span-5">
                  <CardIdentidadeVisualRARU
                    openSarahChat={openSarahChat}
                    handleWhoAmIClick={() => setQuemSomosOpen(true)}
                    setActiveTab={setActiveTab}
                    toggleCommandHUD={toggleCommandHUD}
                    userName={userName}
                    onOpenNameModal={() => setNameModalOpen(true)}
                  />
                </div>
                <div className="lg:col-span-7"><RadarMeteorologicoModule showToast={showToast}/></div>
              </div>
            </>
          )}
          {activeTab === 'radar' && (<div className="space-y-4"><RadarMeteorologicoModule showToast={showToast}/></div>)}
          {activeTab === 'relatorio' && (<VistoriaRARU_NEXUS onBackToDashboard={() => setActiveTab('dashboard')} showToast={showToast} vozSelecionada={vozSelecionada} userName={userName}/>)}
          {activeTab === 'estacao' && (<EstacaoSobrevivenciaModuleV12 showToast={showToast} soundEnabled={soundEnabled} vozSelecionada={vozSelecionada} userName={userName}/>)}
          {activeTab === 'balanca' && (<ModuloCidadaoSensorModule onGoToDashboard={() => setActiveTab('dashboard')} showToast={showToast}/>)}
          {activeTab === 'alquino' && (<RedeAlquinoHardwareModule onGoToDashboard={() => setActiveTab('dashboard')} showToast={showToast}/>)}
          {activeTab === 'radio' && (<RadioCyberTatica showToast={showToast}/>)}
          {activeTab === 'videos' && (<PublicVideoGalleryModule publicVideos={publicVideos} localVideos={localVideos} youtubeVideos={youtubeVideos} onGoToDashboard={() => setActiveTab('dashboard')}/>)}
          {activeTab === 'admin' && (<AdminVaultModule showToast={showToast} onClose={() => setActiveTab('dashboard')} localVideos={localVideos} setLocalVideos={setLocalVideos} youtubeVideos={youtubeVideos} setYoutubeVideos={setYoutubeVideos} publicVideos={publicVideos} vozSelecionada={vozSelecionada} setVozSelecionada={setVozSelecionada} customTickerText={customTickerText} setCustomTickerText={setCustomTickerText}/>)}
        </main>

        <footer className="w-full py-3 px-4 border-t border-cyberCyan/20 bg-deepSpace/60 backdrop-blur-md">
          <div className="max-w-7xl mx-auto flex flex-col sm:flex-row items-center justify-between text-[10px] font-mono text-slate-400 gap-2 text-center">
            <span>BASE CLIMATICA DE MONITORAMENTO TATICO • MESQUITA - RJ • IP 10.10.21.15</span>
            <span className="text-cyberCyan">CIDADAOSENSOR • GADE - GRUPO A CHAVE DA ESPERANCA</span>
          </div>
        </footer>

        <SarahFabButton openSarahChat={openSarahChat} isSpeaking={isSpeaking}/>
        <SarahChatOverlay isOpen={isChatOpen} onClose={() => setIsChatOpen(false)} isSpeaking={isSpeaking} isProcessing={isProcessing} messages={messages} input={input} setInput={setInput} handleSendDirectCommand={handleSendDirectCommand} toggleListening={toggleListening} isListening={isListening} userName={userName} onOpenNameModal={() => setNameModalOpen(true)}/>

        {nameModalOpen && (
          <div className="fixed inset-0 z-[130] flex items-center justify-center bg-void/90 backdrop-blur-2xl p-4" onClick={() => setNameModalOpen(false)}>
            <div className="cyber-card w-full max-w-sm rounded-2xl shadow-2xl p-5 border border-cyberGreen/60 font-mono space-y-4" onClick={e => e.stopPropagation()}>
              <div className="border-b border-cyberGreen/30 pb-2">
                <h3 className="font-display text-xs font-black text-cyberGreen tracking-widest uppercase">IDENTIFICACAO DO OPERADOR</h3>
                <p className="text-[10px] text-slate-300 mt-1">Como a Sarah e o sistema devem chamar voce?</p>
              </div>
              <form onSubmit={handleSaveName} className="space-y-3">
                <input
                  type="text"
                  autoFocus
                  value={tempNameInput}
                  onChange={(e) => setTempNameInput(e.target.value)}
                  placeholder="Digite seu nome..."
                  className="w-full bg-void border border-cyberGreen/50 rounded-xl px-3 py-2.5 text-xs text-white focus:outline-none focus:border-cyberCyan"
                />
                <div className="flex gap-2">
                  <button type="button" onClick={() => setNameModalOpen(false)} className="cyber-button-danger flex-1 text-xs py-2">CANCELAR</button>
                  <button type="submit" className="cyber-button-solid flex-1 text-xs py-2">SALVAR</button>
                </div>
              </form>
            </div>
          </div>
        )}

        <QuemSomosModal isOpen={quemSomosOpen} onClose={() => setQuemSomosOpen(false)} userName={userName}/>
        {toastMsgRef && (<div className="fixed top-20 left-1/2 -translate-x-1/2 z-[150] bg-deepSpace/95 border border-cyberCyan text-white px-5 py-2.5 rounded-full font-mono text-xs font-bold shadow-[0_0_25px_rgba(0,242,254,0.4)]">{toastMsgRef}</div>)}
        {shareModalOpen && (<div className="fixed inset-0 z-[120] flex items-center justify-center bg-void/85 backdrop-blur-xl p-4" onClick={() => setShareModalOpen(false)}><div className="cyber-card max-w-sm w-full p-5 rounded-3xl border border-cyberCyan/60 space-y-4 font-mono text-center" onClick={e => e.stopPropagation()}><h3 className="font-display text-sm font-black text-cyberCyan">COMPARTILHAR APLICATIVO</h3><p className="text-xs text-slate-300">Envie o acesso da Base Climatica Tatica:</p><div className="flex flex-col gap-2.5"><button onClick={() => window.open(`https://api.whatsapp.com/send?text=${encodeURIComponent(shareMessageText)}`, '_blank')} className="cyber-button-solid text-xs py-3">ENVIAR NO WHATSAPP</button><button onClick={() => { if(navigator.clipboard) navigator.clipboard.writeText(shareMessageText); showToast('Link copiado.'); setShareModalOpen(false); }} className="cyber-button text-xs py-3">COPIAR LINK E TEXTO</button></div><button onClick={() => setShareModalOpen(false)} className="cyber-button-danger text-xs w-full py-2">FECHAR</button></div></div>)}
      </div>
    </div>
  );
}

const rootEl = document.getElementById("root");
ReactDOM.createRoot(rootEl).render(<App />);
</script>
</body>
</html>
