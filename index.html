      (function() {
        try {
            const savedTheme = localStorage.getItem('sarah-theme') || 'dark';
            if (savedTheme === 'warm') {
                document.documentElement.classList.remove('dark');
                document.documentElement.classList.add('warm');
            } else {
                document.documentElement.classList.add('dark');
                document.documentElement.classList.remove('warm');
            }

        function FieldReportModule({ onBackToDashboard, showToast }) {

            const [fotos, setFotos] = React.useState([
                {id:1, file:null, preview:null, rawCanvas:null},

            const capturarGps = () => {
                if(!navigator.geolocation) return showToast("⚠️ Sem GPS");
                showToast("🛰 Obtendo GPS...");
                navigator.geolocation.getCurrentPosition(
                    p => {
                        const lt = p.coords.latitude.toFixed(6);
                        const ln = p.coords.longitude.toFixed(6);
                        const lk = `https://www.google.com/maps?q=${lt},${ln}`;
                        setGps({lt, ln, lk});
                        setLocal(`${lt},${ln}`);
                        setGpsSt("✅ Coordenadas Fixadas");
                        showToast("📍 GPS obtido!");
                    },
                    () => setGpsSt("⚠ Erro GPS"),
                    {enableHighAccuracy:true, timeout:10000}
                );
            };

            const processarFotoComSegurancaAbsoluta = (file, gpsInfo, ag, loc) => new Promise((resolve, reject) => {
                const objectUrl = URL.createObjectURL(file);
                const img = new Image();
                
                img.onload = () => {
                    try {
                        const canvas = document.createElement('canvas');
                        const MAX_DIM = 400;
                        let w = img.width, h = img.height;
                        
                        if (w > MAX_DIM || h > MAX_DIM) {
                            if (w > h) { h = Math.round(h * MAX_DIM / w); w = MAX_DIM; }
                            else { w = Math.round(w * MAX_DIM / h); h = MAX_DIM; }
                        }
                        
                        canvas.width = w; 
                        canvas.height = h;
                        const ctx = canvas.getContext('2d', { alpha: false });
                        ctx.drawImage(img, 0, 0, w, h);
                        
                        URL.revokeObjectURL(objectUrl);
                        
                        const dataHoraStr = new Intl.DateTimeFormat('pt-BR', {
                            dateStyle: 'short', timeStyle: 'medium', timeZone: 'America/Sao_Paulo'
                        }).format(new Date());
                        
                        const coordStr = gpsInfo.lt ? `${gpsInfo.lt},${gpsInfo.ln}` : (loc || 'Local não fixado');
                        const fontSize = Math.max(8, Math.round(w * 0.025));
                        ctx.font = `bold ${fontSize}px sans-serif`;
                        
                        const pad = 5, lineHt = fontSize + 3, boxHeight = lineHt * 3 + pad * 2;
                        ctx.fillStyle = 'rgba(2, 6, 23, 0.92)';
                        ctx.fillRect(0, h - boxHeight, w, boxHeight);
                        
                        ctx.fillStyle = '#00F2FE';
                        let yPos = h - boxHeight + pad + fontSize;
                        ctx.fillText(`📅 ${dataHoraStr}`, pad, yPos);
                        ctx.fillText(`📍 GPS: ${coordStr}`, pad, yPos + lineHt);
                        ctx.fillText(`👤 Resp.: ${ag || 'Equipe de Campo / GADE'}`, pad, yPos + lineHt * 2);
                        
                        canvas.toBlob(blob => {
                            if (!blob) return reject(new Error("Falha ao gerar blob"));
                            const compressedFile = new File([blob], `vistoria_${Date.now()}.jpg`, { type: 'image/jpeg' });
                            const previewUrl = canvas.toDataURL('image/jpeg', 0.35);
                            resolve({ compressedFile, preview: previewUrl, rawCanvas: canvas });
                        }, 'image/jpeg', 0.35);
                    } catch (err) {
                        URL.revokeObjectURL(objectUrl);
                        reject(err);
                    }
                };
                
                img.onerror = () => {
                    URL.revokeObjectURL(objectUrl);
                    reject(new Error("Erro ao carregar imagem"));
                };

                    doc.setTextColor(100, 116, 139);
                    doc.text("Documento gerado eletronicamente pelo Sistema Sarah AI Nexus v8.4.2 PRO • Estado do RJ & Mesquita", 14, 288);

                    doc.save(`Laudo_Vistoria_${Date.now()}.pdf`);
                    showToast("✅ PDF oficial gerado e baixado sem falhas!");

                    showToast("⚠️ Erro crítico ao gerar PDF nativo.");

            return (

                                ◀ Voltar

                                MÓDULO DE VISTORIA TÉCNICA

                        </div>
                        <span className="font-mono text-[10px] text-cyberGreen px-2.5 py-1 bg-cyberGreen/10 rounded-xl border border-cyberGreen/30">v8.4.2 PRO</span>

        function SarahNexusApp() {
            const [currentTab, setCurrentTab] = React.useState('home');
            const [soundEnabled, setSoundEnabled] = React.useState(true);
            const [theme, setTheme] = React.useState('dark');
            const [showSplash, setShowSplash] = React.useState(true);
            const [isRadarOpen, setIsRadarOpen] = React.useState(false);
            const [isInstallable, setIsInstallable] = React.useState(false);
            const [deferredPrompt, setDeferredPrompt] = React.useState(null);
            const [toastMessage, setToastMessage] = React.useState(null);

            const [sarahState, setSarahState] = React.useState({
                isSpeaking: false,
                currentTopicIdx: 0,
                currentLineIdx: 0,
                speechText: "Olá, Alexander! O Sistema Sarah AI Nexus v8.4.2 PRO está pronto, travado e operacional. Abrangência total no Estado do Rio de Janeiro e suporte municipal em Mesquita. Como posso ajudar na nossa Defesa Civil hoje?"
            });

            const showToast = (msg) => {
                setToastMessage(msg);
                setTimeout(() => setToastMessage(null), 3500);
            };

            React.useEffect(() => {
                window.addEventListener('beforeinstallprompt', (e) => {
                    e.preventDefault();
                    setDeferredPrompt(e);
                    setIsInstallable(true);
                });
            }, []);

            const handleInstallApp = async () => {
                if(deferredPrompt) {
                    deferredPrompt.prompt();
                    const { outcome } = await deferredPrompt.userChoice;
                    if(outcome === 'accepted') {
                        showToast("✅ Aplicativo instalado com sucesso!");
                    }
                    setDeferredPrompt(null);
                    setIsInstallable(false);
                } else {
                    showToast("ℹ️ Para instalar, use o menu do navegador e escolha 'Adicionar à Tela Inicial'.");
                }
            };

            const toggleTheme = () => {
                const nextTheme = theme === 'dark' ? 'warm' : 'dark';
                setTheme(nextTheme);
                localStorage.setItem('sarah-theme', nextTheme);
                if(nextTheme === 'warm') {
                    document.documentElement.classList.remove('dark');
                    document.documentElement.classList.add('warm');
                } else {
                    document.documentElement.classList.add('dark');
                    document.documentElement.classList.remove('warm');
                }
                showToast(`🎨 Tema alterado para ${nextTheme === 'dark' ? 'Cyber Dark' : 'Clean Warm'}`);
            };

            const triggerSarahVoice = () => {
                const topic = SARAH_TALK_TOPICS[sarahState.currentTopicIdx];
                const line = topic.lines[sarahState.currentLineIdx];
                
                setSarahState(prev => ({
                    ...prev,
                    isSpeaking: true,
                    speechText: `${topic.icon} [${topic.tag}]: ${line}`
                }));

                if (soundEnabled && 'speechSynthesis' in window) {
                    window.speechSynthesis.cancel();
                    const utterance = new SpeechSynthesisUtterance(line);
                    utterance.lang = 'pt-BR';
                    utterance.rate = 1.05;
                    utterance.onend = () => setSarahState(prev => ({ ...prev, isSpeaking: false }));
                    window.speechSynthesis.speak(utterance);
                } else {
                    setTimeout(() => setSarahState(prev => ({ ...prev, isSpeaking: false })), 4000);
                }

                setSarahState(prev => {
                    let nextLine = prev.currentLineIdx + 1;
                    let nextTopic = prev.currentTopicIdx;
                    if(nextLine >= SARAH_TALK_TOPICS[nextTopic].lines.length) {
                        nextLine = 0;
                        nextTopic = (nextTopic + 1) % SARAH_TALK_TOPICS.length;
                    }
                    return { ...prev, currentTopicIdx: nextTopic, currentLineIdx: nextLine };
                });
            };

            const falarQuemSomos = () => {
                const textoManifesto = "Somos uma plataforma comunitária de abrangência estadual, cobrindo todo o Estado do Rio de Janeiro, com forte atuação e suporte municipal em Mesquita e região. Visamos integrar a automação moderna e prevenção de riscos, estendendo uma mão amiga em momentos de crise, colaborando para a resiliência de toda a população fluminense.";
                setSarahState(prev => ({
                    ...prev,
                    isSpeaking: true,
                    speechText: `🛡️ [QUEM SOMOS]: ${textoManifesto}`
                }));
                if (soundEnabled && 'speechSynthesis' in window) {
                    window.speechSynthesis.cancel();
                    const utterance = new SpeechSynthesisUtterance(textoManifesto);
                    utterance.lang = 'pt-BR';
                    utterance.rate = 1.05;
                    utterance.onend = () => setSarahState(prev => ({ ...prev, isSpeaking: false }));
                    window.speechSynthesis.speak(utterance);
                } else {
                    setTimeout(() => setSarahState(prev => ({ ...prev, isSpeaking: false })), 6000);
                }
            };

            const openShareFromApp = () => {
                if(navigator.share) {
                    navigator.share({ title: 'Sarah AI Nexus v8.4.2 PRO', text: shareMessageText, url: APP_SHARE_URL }).catch(() => {});

                    navigator.clipboard.writeText(shareMessageText);
                    showToast("📋 Link e mensagem copiados para a área de transferência!");

                                <div>

                            </div>

                            <div className="flex items-center gap-2">

                                </button>
                                <button onClick={() => setSoundEnabled(!soundEnabled)} className={`w-9 h-9 rounded-xl border flex items-center justify-center cursor-pointer transition shadow-md ${soundEnabled ? 'bg-cyberCyan/20 border-cyberCyan text-cyberCyan shadow-[0_0_12px_rgba(0,242,254,0.5)]' : 'bg-commandPanel border-cyberCyan/30 text-slate-500'}`} title="Áudio">
                                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>{soundEnabled && <path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"></path>}</svg>
                                </button>
                                <button onClick={toggleTheme} className="w-9 h-9 rounded-xl border border-cyberCyan/40 bg-commandPanel text-cyberCyan flex items-center justify-center cursor-pointer shadow-md hover:border-cyberCyan transition" title="Tema">

                            </div>
                        </div>

                    <main className="flex-1 max-w-4xl w-full mx-auto p-4 space-y-4 pb-24">

                                        </div>

                                        <div className="pt-1">
                                            <button onClick={falarQuemSomos} className="w-full py-3 px-4 rounded-2xl cyborg-btn-futuristic flex items-center justify-between text-xs font-mono font-bold text-cyberCyan border-cyberCyan/50 shadow-[0_0_15px_rgba(0,242,254,0.2)] cursor-pointer">
                                                <div className="flex items-center gap-3">
                                                    <span className="w-7 h-7 rounded-xl bg-cyberCyan/20 border border-cyberCyan flex items-center justify-center text-sm">🛡️</span>
                                                    <div className="text-left">
                                                        <div className="text-cyberCyan tracking-wider font-display">QUEM SOMOS • MANIFESTO ESTADUAL & MUNICIPAL</div>
                                                        <div className="text-[10px] text-slate-400 font-normal">Clique para ouvir a apresentação da Sarah em áudio</div>
                                                    </div>
                                                </div>
                                                <span className="text-cyberCyan text-xs font-bold animate-pulse">▶ OUVIR</span>
                                            </button>
                                        </div>

                                        <div className="flex flex-wrap items-center justify-center md:justify-start gap-3 pt-2">
                                            <button onClick={triggerSarahVoice} className="px-5 py-2.5 cyber-button font-extrabold rounded-xl text-xs uppercase tracking-wider transition cursor-pointer shadow-[0_0_20px_rgba(255,153,0,0.5)]">🔊 Ouvir Conselhos da Sarah</button>
                                            <button onClick={() => setCurrentTab('vistoria')} className="px-5 py-2.5 bg-commandPanel hover:bg-cyberCyan hover:text-void border border-cyberCyan/50 text-cyberCyan font-extrabold rounded-xl text-xs uppercase tracking-wider transition cursor-pointer">📋 Nova Vistoria Técnica</button>
                                        </div>
                                    </div>
                                </div>

                                <div className="grid grid-cols-2 sm:grid-cols-4 gap-3">
                                    <button onClick={() => setCurrentTab('vistoria')} className="cyber-card p-4 rounded-2xl text-left hover:border-cyberCyan transition cursor-pointer group">
                                        <div className="w-10 h-10 rounded-xl bg-cyberCyan/20 border border-cyberCyan/40 flex items-center justify-center text-cyberCyan mb-3 group-hover:scale-110 transition"><FieldReportIcon /></div>
                                        <div className="font-display font-bold text-xs text-white">Vistoria de Campo</div>
                                        <div className="text-[10px] text-slate-400 mt-1">Câmera e Órgãos Oficiais</div>
                                    </button>
                                    <button onClick={() => setIsRadarOpen(true)} className="cyber-card p-4 rounded-2xl text-left hover:border-cyberCyan transition cursor-pointer group">
                                        <div className="w-10 h-10 rounded-xl bg-cyberGreen/20 border border-cyberGreen/40 flex items-center justify-center text-cyberGreen mb-3 group-hover:scale-110 transition"><RadarScanIcon /></div>
                                        <div className="font-display font-bold text-xs text-white">Radar 24h (RJ)</div>
                                        <div className="text-[10px] text-slate-400 mt-1">Monitoramento estadual</div>
                                    </button>
                                    <button onClick={() => showToast("🛡️ GACE ativo.")} className="cyber-card p-4 rounded-2xl text-left hover:border-cyberCyan transition cursor-pointer group">
                                        <div className="w-10 h-10 rounded-xl bg-cyberAmber/20 border border-cyberAmber/40 flex items-center justify-center text-cyberAmber mb-3 group-hover:scale-110 transition"><StreamVideoIcon /></div>
                                        <div className="font-display font-bold text-xs text-white">Canal GACE</div>
                                        <div className="text-[10px] text-slate-400 mt-1">Ações comunitárias integradas</div>
                                    </button>
                                    <button onClick={() => showToast("🔒 Módulo PRO blindado.")} className="cyber-card p-4 rounded-2xl text-left hover:border-cyberCyan transition cursor-pointer group">
                                        <div className="w-10 h-10 rounded-xl bg-cyberPurple/20 border border-cyberPurple/40 flex items-center justify-center text-cyberPurple mb-3 group-hover:scale-110 transition"><AdminVaultIcon /></div>
                                        <div className="font-display font-bold text-xs text-white">Cofre de Segurança</div>
                                        <div className="text-[10px] text-slate-400 mt-1">Versão 8.4.2 PRO travada</div>
                                    </button>
                                </div>
                            </div>
                        )}

                        {currentTab === 'vistoria' && (
                            <FieldReportModule onBackToDashboard={() => setCurrentTab('home')} showToast={showToast} />
                        )}
                    </main>

                    <SarahFloatingButton onClick={triggerSarahVoice} />

                    <footer className="w-full bg-deepSpace/95 border-t border-cyberCyan/30 overflow-hidden py-2.5 z-40 mt-auto">
                        <div className="flex whitespace-nowrap overflow-hidden">
                            <div className="flex animate-[tickerScroll_45s_linear_infinite] items-center gap-6 font-mono text-xs text-cyberCyan font-bold tracking-wider px-4">
                                <span>🛡️ Promovendo Ciência cidadã • Abrangência Estadual (Rio de Janeiro) & Municipal (Mesquita) • Grupo A Chave da Esperança/GADE • Projeto Cidadão Sensor • "Se o Senhor não guardar a cidade, em vão vigia o sentinela" (Salmos 127) • Hospital da Mãe 21 2767-2700 • CRAS Rocha Sobrinho 21 2042-8931 • Disque Mulher 180 • CCO 21 2042-7020 • Projeto Iguaçu • Novo PAC • Cidades Resilientes (ONU Habitat) • Todos unidos, todos protegidos • 🛡️</span>
                                <span>🛡️ Promovendo Ciência cidadã • Abrangência Estadual (Rio de Janeiro) & Municipal (Mesquita) • Grupo A Chave da Esperança/GADE • Projeto Cidadão Sensor • "Se o Senhor não guardar a cidade, em vão vigia o sentinela" (Salmos 127) • Hospital da Mãe 21 2767-2700 • CRAS Rocha Sobrinho 21 2042-8931 • Disque Mulher 180 • CCO 21 2042-7020 • Projeto Iguaçu • Novo PAC • Cidades Resilientes (ONU Habitat) • Todos unidos, todos protegidos • 🛡️</span>
                            </div>
                        </div>
                    </footer>
                </div>
            );
        }

        try {
            const rootElement = document.getElementById('root');
            if (rootElement) {
                ReactDOM.createRoot(rootElement).render(<SarahNexusApp />);
            }
        } catch (criticalError) {
            console.error("Erro crítico na inicialização do HUD:", criticalError);
            document.getElementById('root').innerHTML = `
                <div style="background:#02040A; color:#F43F5E; height:100vh; display:flex; flex-direction:column; align-items:center; justify-center; padding:20px; font-family:monospace; text-align:center;">
                    <h2 style="font-size:18px; margin-bottom:10px;">⚠️ ERRO CRÍTICO NO NÚCLEO OMEGA</h2>
                    <p style="font-size:12px; color:#94A3B8;">Ocorreu uma falha ao renderizar a malha de comando.</p>
                </div>
            `;
        }
    </script>
</body>
</html>
