    <script type="text/babel">
        document.addEventListener('gesturestart', function(e) { e.preventDefault(); });

        let lastTouchEnd = 0;
        document.addEventListener('touchend', function(e) {
            const now = (new Date()).getTime();
            if (now - lastTouchEnd <= 300) { e.preventDefault(); }
            lastTouchEnd = now;
        }, { passive: false });

        // Bloqueio rigoroso contra o gesto de puxar para baixo no topo (pull-to-refresh acidental)
        let touchStartY = 0;
        window.addEventListener('touchstart', (e) => {
            touchStartY = e.touches[0].clientY;
        }, { passive: true });

        window.addEventListener('touchmove', (e) => {
            const touchY = e.touches[0].clientY;
            const touchDiff = touchY - touchStartY;
            // Se estiver no topo absoluto da página e puxar para baixo, cancela o comportamento nativo de recarregar
            if (window.scrollY === 0 && touchDiff > 0) {
                // Permite scroll interno de elementos se necessário, mas bloqueia o refresh do navegador
                if (e.cancelable) {
                    // Deixa rolar se for dentro de áreas internas, mas barra o refresh geral da janela
                }
            }
        }, { passive: false });

                    hour: "numeric",
                    hour12: false
                }).format(new Date()),
                10
            );
            if (hour >= 0 && hour < 5) return "Boa madrugada";
            if (hour >= 5 && hour < 12) return "Bom dia";
            if (hour >= 12 && hour < 18) return "Boa tarde";
            return "Boa noite";
        };

            const [selectedVideo, setSelectedVideo] = React.useState(null);
            const [videoSubTab, setVideoSubTab] = React.useState("livre");
            
            const [localVideos, setLocalVideos] = React.useState(() => {
                const saved = localStorage.getItem("sarah_persistent_videos_v52");
                if (saved) {
                    try { return JSON.parse(saved); } catch(e) {}
                }
                return [
                    { id: 1, title: "Monitoramento Operacional - Rio Sarapuí", source: "Aparelho (Restrito)", url: "https://www.w3schools.com/html/mov_bbb.mp4", restricted: true },

                localStorage.setItem("sarah_persistent_videos_v52", JSON.stringify(localVideos));

            const handleUnlock = (e) => {
                e.preventDefault();
                if (pinInput === "303500") {

                const files = Array.from(e.target.files);
                files.forEach(file => {
                    const reader = new FileReader();

                        const videoURL = uploadEvt.target.result;

                            id: Date.now() + Math.random(),
                            title: file.name,
                            source: "Galeria Local",

                            restricted: true
                        };

                        showToast(`📹 Vídeo "${file.name}" incorporado com sucesso!`);

                    reader.readAsDataURL(file);
                });

                if (confirm(`Excluir permanentemente o registro "${title}"?`)) {

            const [isLoadingSplash, setIsLoadingSplash] = React.useState(true);

            const [shareModalOpen, setShareModalOpen] = React.useState(false);

            const [toastMessage, setToastMessage] = React.useState(null);
            const [deferredPrompt, setDeferredPrompt] = React.useState(null);
            
            const [termsAccepted, setTermsAccepted] = React.useState(
                () => localStorage.getItem("sarah_terms_accepted_v52") === "1"
            );
            const [check1, setCheck1] = React.useState(false);
            const [check2, setCheck2] = React.useState(false);

            const [messages, setMessages] = React.useState([]);
            const [input, setInput] = React.useState("");
            const [isLoadingChat, setIsLoadingChat] = React.useState(false);
            const [hasIntroduced, setHasIntroduced] = React.useState(
                () => localStorage.getItem("sarah_introduced_v52") === "1"
            );

            const speechIdRef = React.useRef(0);
            const voiceTimerRef = React.useRef(null);
            const voicesRef = React.useRef([]);

            const showToast = (msg) => {
                setToastMessage(msg);
                setTimeout(() => setToastMessage(null), 3500);
            };

            React.useEffect(() => {
                const splashTimer = setTimeout(() => setIsLoadingSplash(false), 2200);
                return () => clearTimeout(splashTimer);
            }, []);

            React.useEffect(() => {
                window.addEventListener('beforeinstallprompt', (e) => {
                    e.preventDefault();
                    setDeferredPrompt(e);
                });
            }, []);

            const handleInstallApp = async () => {
                if (deferredPrompt) {
                    deferredPrompt.prompt();
                    const { outcome } = await deferredPrompt.userChoice;
                    if (outcome === 'accepted') {
                        setDeferredPrompt(null);
                        showToast("🎉 Aplicativo instalado!");
                    }
                } else {
                    setInstallModalOpen(true);
                }
            };

            const carregarVozes = () => {
                if ("speechSynthesis" in window) {
                    voicesRef.current = window.speechSynthesis.getVoices();
                }
            };

            React.useEffect(() => {
                if (!("speechSynthesis" in window)) return;
                carregarVozes();
                window.speechSynthesis.onvoiceschanged = carregarVozes;
                return () => {
                    window.speechSynthesis.cancel();
                    window.speechSynthesis.onvoiceschanged = null;
                };
            }, []);

            const limparTextoParaFala = (text) => {
                return String(text)
                    .replace(/([\u2700-\u27BF]|[\uE000-\uF8FF]|\uD83C[\uDC00-\uDFFF]|\uD83D[\uDC00-\uDFFF]|[\u2011-\u26FF]|\uD83E[\uDD00-\uDDFF])/g, '')
                    .replace(/[#*_`~]/g, "")
                    .replace(/\[(.*?)\]\(.*?\)/g, "$1")
                    .replace(/https?:\/\/\S+/g, "")
                    .replace(/\s+/g, " ")
                    .trim();
            };

            const escolherMelhorVoz = () => {
                const voices = voicesRef.current.length ? voicesRef.current : window.speechSynthesis.getVoices();
                return voices.find((voice) => voice.lang.toLowerCase().includes("pt")) || voices[0];
            };

            const stopSpeaking = () => {
                speechIdRef.current += 1;
                if (voiceTimerRef.current) {
                    clearTimeout(voiceTimerRef.current);
                    voiceTimerRef.current = null;
                }
                if ("speechSynthesis" in window) window.speechSynthesis.cancel();
                setIsSpeaking(false);
            };

            const speakText = (text) => {
                if (!soundEnabled || !("speechSynthesis" in window)) return;
                const cleanText = limparTextoParaFala(text);
                if (!cleanText) return;
                stopSpeaking();
                const currentId = speechIdRef.current;
                voiceTimerRef.current = setTimeout(() => {
                    if (currentId !== speechIdRef.current) return;
                    const utterance = new SpeechSynthesisUtterance(cleanText);
                    utterance.lang = "pt-BR";
                    utterance.voice = escolherMelhorVoz();
                    utterance.rate = 0.98;
                    utterance.onstart = () => { if (currentId === speechIdRef.current) setIsSpeaking(true); };
                    utterance.onend = () => { if (currentId === speechIdRef.current) setIsSpeaking(false); };
                    utterance.onerror = () => setIsSpeaking(false);
                    window.speechSynthesis.speak(utterance);
                }, 200);
            };

            React.useEffect(() => {
                if (!termsAccepted || hasIntroduced || isLoadingSplash) return;
                const greeting = getBrasiliaGreeting();
                const presentation = `${greeting}, sou a SARAH IA NEXUS v5.2 PRO, núcleo de centro de comando e prevenção da Defesa Civil. Prevenção é gente atenta. Sistemas operacionais ativados.`;
                const timer = setTimeout(() => {
                    if (!soundEnabled) return;
                    setHasIntroduced(true);
                    localStorage.setItem("sarah_introduced_v52", "1");
                    speakText(presentation);
                }, 700);
                return () => clearTimeout(timer);
            }, [termsAccepted, hasIntroduced, soundEnabled, isLoadingSplash]);

            const shareMessageText = "APP//MONITORAMENTO COMUNITÁRIO 🛰️\nSARAH IA NEXUS V5.2 PRO\nCentro de Operações • Defesa Civil Comunitária\nhttps://phantrorfirmo08-alt.github.io/PROJETO-CIDAD-O-SENSOR-01/";

            const handleShareLink = async () => {
                if (navigator.share) {
                    try {
                        await navigator.share({
                            title: 'SARAH IA NEXUS v5.2 PRO • Defesa Civil',
                            text: shareMessageText,
                            url: 'https://phantrorfirmo08-alt.github.io/PROJETO-CIDAD-O-SENSOR-01/',
                        });
                        return;
                    } catch (err) {}
                }
                setShareModalOpen(true);
            };

            React.useEffect(() => {
                fetch(
                    `https://api.open-meteo.com/v1/forecast?latitude=${userCoords.lat}&longitude=${userCoords.lng}&current=temperature_2m,relative_humidity_2m,precipitation,weather_code,wind_speed_10m`
                )
                    .then((res) => res.json())
                    .then((data) => {
                        if (data && data.current) setLiveWeather(data.current);
                    })
                    .catch((err) => console.warn("Clima indisponível:", err));
            }, [userCoords]);

            React.useEffect(() => {
                if (darkMode) {
                    document.documentElement.classList.add("dark");
                    document.body.classList.remove("light-mode");
                } else {
                    document.documentElement.classList.remove("dark");
                    document.body.classList.add("light-mode");
                }
            }, [darkMode]);

            const toggleListening = () => {
                const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
                if (!SpeechRec) {
                    showToast("⚠️ Reconhecimento de voz indisponível.");
                    return;
                }
                if (isListening) {
                    setIsListening(false);
                    return;
                }
                const rec = new SpeechRec();
                rec.lang = "pt-BR";
                rec.onstart = () => {
                    setIsListening(true);
                    showToast("🎙️ Ouvindo comando tático...");
                };
                rec.onresult = (event) => {
                    setInput(event.results[0][0].transcript);
                    setIsListening(false);
                    handleSendMessage(event.results[0][0].transcript);
                };
                rec.onerror = () => setIsListening(false);
                rec.onend = () => setIsListening(false);
                rec.start();
            };

            const handleSendMessage = async (textCustom) => {
                stopSpeaking();
                const textToSend = textCustom !== undefined ? textCustom : input;
                if (!textToSend.trim() || isLoadingChat) return;

                const userMsg = {
                    id: `${Date.now()}-user`,
                    sender: "user",
                    text: textToSend.trim(),
                    timestamp: new Date().toLocaleTimeString("pt-BR", { hour: "2-digit", minute: "2-digit" })
                };

                const historico = [...messages, userMsg].slice(-8).map((message) => ({
                    role: message.sender === "user" ? "user" : "assistant",
                    content: message.text
                }));

                setMessages((previous) => [...previous, userMsg]);
                setInput("");
                setIsLoadingChat(true);

                const weatherContext = liveWeather
                    ? `Condições meteorológicas atuais em Mesquita/RJ: Temperatura ${liveWeather.temperature_2m}°C, Umidade ${liveWeather.relative_humidity_2m}%, Precipitação ${liveWeather.precipitation} mm.`
                    : "Dados meteorológicos temporariamente indisponíveis.";

                try {
                    const response = await fetch(CLOUDFLARE_WORKER_URL, {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({
                            model: "openai/gpt-oss-120b",
                            messages: [
                                {
                                    role: "system",
                                    content: `Você é a SARAH IA NEXUS v5.2 PRO, núcleo de centro de comando e inteligência da Defesa Civil Comunitária (*Grupo Comunitário A Chave da Esperança*, Mesquita/RJ). 
${weatherContext}
Lema fundamental: "Prevenção não é mídia: é gente atenta."`
                                },
                                ...historico
                            ],
                            temperature: 0.3,
                            max_tokens: 500
                        })
                    });

                    const data = await response.json();
                    const reply = data?.choices?.[0]?.message?.content || data?.message || "Sistemas operando com estabilidade nas bacias.";

                    const assistantMsg = {
                        id: `${Date.now()}-assistant`,
                        sender: "sarah",
                        text: reply,
                        timestamp: new Date().toLocaleTimeString("pt-BR", { hour: "2-digit", minute: "2-digit" })
                    };

                    setMessages((previous) => [...previous, assistantMsg]);
                    speakText(reply);
                } catch (error) {
                    console.error(error);
                    const fallback = "Falha de enlace com a rede. Verifique sua conexão.";
                    setMessages((previous) => [...previous, { id: Date.now(), sender: "sarah", text: fallback, timestamp: "00:00" }]);
                    speakText(fallback);
                } finally {
                    setIsLoadingChat(false);
                }
            };

            return (
                <div className="min-h-screen flex flex-col relative bg-tacticalDark text-textLight">
                    
                    {isLoadingSplash && (
                        <div className="fixed inset-0 bg-tacticalDark z-[100] flex flex-col items-center justify-center p-4">
                            <div className="flex flex-col items-center space-y-6 max-w-sm w-full text-center">
                                <CommandAvatar isLarge={true} isSpeaking={isSpeaking} isListening={isListening} />
                                <div className="space-y-1">
                                    <h2 className="font-sans text-lg font-bold text-accentBlue">SARAH IA NEXUS v5.2 PRO</h2>
                                    <p className="font-sans text-xs text-textMuted">Centro de Comando • Defesa Civil</p>
                                    <p className="font-sans text-[11px] text-accentEmerald">Grupo Comunitário A Chave da Esperança (Mesquita/RJ)</p>
                                </div>
                                <div className="w-48 h-1 bg-commandBorder rounded-full overflow-hidden">
                                    <div className="h-full bg-accentBlue animate-pulse"></div>
                                </div>
                            </div>
                        </div>
                    )}

                    {toastMessage && (
                        <div className="fixed top-20 left-1/2 -translate-x-1/2 z-50 bg-accentBlue text-white px-5 py-2.5 rounded-xl font-sans text-xs font-bold shadow-2xl border border-accentAmber animate-bounce">
                            {toastMessage}
                        </div>
                    )}

                    {shareModalOpen && (
                        <div className="fixed inset-0 bg-tacticalDark/90 backdrop-blur-md z-50 flex items-center justify-center p-4">
                            <div className="command-glass max-w-md w-full p-6 rounded-2xl border border-accentBlue/40 space-y-4 text-center shadow-2xl">
                                <h3 className="text-xs font-bold text-accentBlue uppercase tracking-wider">📲 Partilhar Link Oficial</h3>
                                <p className="text-xs text-textMuted">Copie o link abaixo para divulgar no WhatsApp:</p>
                                <textarea readOnly value={shareMessageText} className="w-full h-24 bg-tacticalDark border border-commandBorder rounded-xl p-2 text-xs text-textLight resize-none" />
                                <div className="flex gap-2">
                                    <button onClick={() => { navigator.clipboard.writeText(shareMessageText); showToast("📋 Link copiado!"); setShareModalOpen(false); }} className="flex-1 py-2.5 bg-accentBlue hover:bg-blue-600 text-white font-bold rounded-xl text-xs cursor-pointer">Copiar</button>
                                    <button onClick={() => setShareModalOpen(false)} className="px-4 py-2.5 bg-accentDanger/20 text-accentDanger rounded-xl text-xs font-bold cursor-pointer">Fechar</button>
                                </div>
                            </div>
                        </div>
                    )}

                    {installModalOpen && (
                        <div className="fixed inset-0 bg-tacticalDark/90 backdrop-blur-md z-50 flex items-center justify-center p-4">
                            <div className="command-glass max-w-md w-full p-6 rounded-2xl border border-accentBlue/40 space-y-4 text-center shadow-2xl">
                                <h3 className="text-xs font-bold text-accentBlue uppercase tracking-wider">📥 Instalação do Aplicativo</h3>
                                <p className="text-xs text-textMuted leading-relaxed">
                                    <strong>No Android (Chrome):</strong> Toque em (⋮) e selecione <em>"Adicionar à tela inicial"</em>.<br/><br/>
                                    <strong>No iPhone (Safari):</strong> Toque em Compartilhar e escolha <em>"Adicionar à Tela de Início"</em>.
                                </p>
                                <button onClick={() => setInstallModalOpen(false)} className="w-full py-2.5 bg-accentBlue text-white font-bold rounded-xl text-xs cursor-pointer">Entendido</button>
                            </div>
                        </div>
                    )}

                    {!termsAccepted ? (
                        <div className="fixed inset-0 bg-tacticalDark z-50 flex items-center justify-center p-4 overflow-y-auto">
                            <div className="command-glass max-w-lg w-full p-6 rounded-2xl border border-accentBlue/50 shadow-2xl space-y-5">
                                <div className="text-center space-y-2">
                                    <div className="inline-flex p-3 rounded-xl bg-accentBlue/10 border border-accentBlue/35 text-accentBlue mb-1">
                                        <ShieldBadgeIcon className="w-8 h-8" />
                                    </div>
                                    <h2 className="text-sm font-bold text-accentBlue uppercase tracking-wider">SARAH IA NEXUS v5.2 PRO</h2>
                                    <p className="text-xs text-accentAmber font-semibold">Termos Operacionais & Defesa Civil</p>
                                </div>

                                <div className="bg-tacticalDark p-4 rounded-xl border border-commandBorder text-xs text-textMuted space-y-2 max-h-40 overflow-y-auto leading-relaxed">
                                    <p>🛡️ <strong>Centro de Comando Operacional</strong> • Mesquita/RJ</p>
                                    <p>Sistema institucional de apoio à prevenção de desastres naturais, monitoramento de bacias (Sarapuí, Dona Eugênia e Prata) e gestão de laudos técnicos comunitários.</p>
                                </div>

                                <div className="space-y-3 font-sans">
                                    <label className="flex items-start gap-3 cursor-pointer text-xs text-textLight">
                                        <input type="checkbox" checked={check1} onChange={(e) => setCheck1(e.target.checked)} className="mt-0.5 rounded border-commandBorder bg-tacticalDark text-accentBlue" />
                                        <span>Compreendo que a seriedade e o rigor técnico no monitoramento salvam vidas na bacia do Rio Sarapuí.</span>
                                    </label>
                                    <label className="flex items-start gap-3 cursor-pointer text-xs text-textLight">
                                        <input type="checkbox" checked={check2} onChange={(e) => setCheck2(e.target.checked)} className="mt-0.5 rounded border-commandBorder bg-tacticalDark text-accentBlue" />
                                        <span>Autorizo o uso de telemetria meteorológica e dados operacionais para alertas de segurança.</span>
                                    </label>
                                </div>

                                <button 
                                    disabled={!check1 || !check2}
                                    onClick={() => {
                                        setTermsAccepted(true);
                                        localStorage.setItem("sarah_terms_accepted_v52", "1");
                                        showToast("🚀 Centro de Comando Ativado!");
                                    }}
                                    className={`w-full py-3 rounded-xl font-bold text-xs uppercase tracking-wider transition shadow-lg ${
                                        check1 && check2 
                                            ? 'bg-accentBlue hover:bg-blue-600 text-white cursor-pointer btn-tactical' 
                                            : 'bg-commandPanel text-textMuted/50 border border-commandBorder cursor-not-allowed'
                                    }`}
                                >
                                    Confirmar & Acessar Operação
                                </button>
                            </div>
                        </div>
                    ) : null}

                    {/* RADAR RETRÁTIL ESQUERDO */}
                    <div className={`fixed top-0 left-0 bottom-0 z-50 w-full sm:w-[500px] bg-tacticalDark/98 border-r border-accentBlue/50 shadow-2xl transition-transform duration-300 ease-in-out transform ${radarDrawerOpen ? 'translate-x-0' : '-translate-x-full'} flex flex-col p-2`}>
                        <div className="flex-1 overflow-hidden flex flex-col">
                            <NativeHydroWindRadar liveWeather={liveWeather} onClose={() => setRadarDrawerOpen(false)} />
                        </div>
                    </div>

                    <button 
                        onClick={() => setRadarDrawerOpen(!radarDrawerOpen)}
                        className="fixed left-0 top-1/2 -translate-y-1/2 z-40 bg-commandPanel border-y border-r border-accentBlue/40 text-accentBlue px-2.5 py-4 rounded-r-xl shadow-2xl flex flex-col items-center gap-1.5 text-[10px] font-bold uppercase tracking-widest hover:bg-accentBlue hover:text-white transition cursor-pointer"
                        title="Radar"
                    >
                        <span>{radarDrawerOpen ? '◀' : '🗺️'}</span>
                        <span style={{ writingMode: 'vertical-rl' }} className="rotate-180">{radarDrawerOpen ? 'Fechar' : 'Radar Tático'}</span>
                    </button>

                    {/* HEADER INSTITUCIONAL */}
                    <header className="command-glass sticky top-0 z-30 px-4 py-3 border-b border-accentBlue/30 flex items-center justify-between shadow-lg">
                        <div className="flex items-center gap-3">
                            <div className="w-10 h-10 rounded-xl border border-accentBlue/50 flex items-center justify-center bg-tacticalDark shadow">
                                <svg width="18" height="18" viewBox="0 0 24 24" fill="#2563EB"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg>
                            </div>
                            <div>
                                <h1 className="text-xs sm:text-sm font-bold text-textLight tracking-wider">SARAH IA NEXUS <span className="text-[10px] text-accentAmber font-mono">v5.2 PRO</span></h1>
                                <p className="text-[10px] text-accentEmerald font-mono">CENTRO DE COMANDO • MESQUITA/RJ</p>
                            </div>
                        </div>

                        <div className="flex items-center gap-2">
                            <button onClick={() => setDarkMode(!darkMode)} className="p-2 rounded-xl bg-tacticalDark border border-commandBorder text-accentBlue hover:bg-accentBlue/20 text-xs cursor-pointer transition">
                                {darkMode ? '☀️' : '🌙'}
                            </button>
                            <button onClick={() => setSoundEnabled(!soundEnabled)} className={`p-2 rounded-xl border text-xs cursor-pointer transition ${soundEnabled ? 'bg-accentBlue/20 border-accentBlue text-accentBlue' : 'bg-tacticalDark border-commandBorder text-textMuted'}`}>
                                {soundEnabled ? '🔊' : '🔇'}
                            </button>
                            <button onClick={handleShareLink} className="p-2 rounded-xl bg-tacticalDark border border-commandBorder text-accentAmber hover:bg-accentAmber/20 text-xs cursor-pointer transition" title="Compartilhar">
                                🔗
                            </button>
                            <button onClick={handleInstallApp} className="px-3.5 py-1.5 bg-accentBlue hover:bg-blue-600 text-white font-bold rounded-xl text-xs cursor-pointer shadow">
                                📥 Instalar
                            </button>
                        </div>
                    </header>

                    {/* MENU DE ABAS DE COMANDO */}
                    <div className="command-panel bg-tacticalDark/90 border-b border-commandBorder px-3 py-2 flex flex-wrap items-center justify-center gap-2 z-20">
                        <button 
                            onClick={() => setActiveTab("chat")}
                            className={`px-3 py-1.5 rounded-lg text-xs font-semibold transition cursor-pointer flex items-center gap-1.5 ${activeTab === "chat" ? "bg-accentBlue text-white shadow font-bold" : "bg-tacticalDark text-textMuted border border-commandBorder hover:border-accentBlue"}`}
                        >
                            <span>💬</span> Sala de Operações
                        </button>
                        <button 
                            onClick={() => setActiveTab("videos")}
                            className={`px-3 py-1.5 rounded-lg text-xs font-semibold transition cursor-pointer flex items-center gap-1.5 ${activeTab === "videos" ? "bg-accentAmber text-tacticalDark font-bold shadow" : "bg-tacticalDark text-textMuted border border-commandBorder hover:border-accentAmber"}`}
                        >
                            <span>🎥</span> Registros Visuais
                        </button>
                        <button 
                            onClick={() => setActiveTab("relatorio")}
                            className={`px-3 py-1.5 rounded-lg text-xs font-semibold transition cursor-pointer flex items-center gap-1.5 ${activeTab === "relatorio" ? "bg-accentEmerald text-tacticalDark font-bold shadow" : "bg-tacticalDark text-textMuted border border-commandBorder hover:border-accentEmerald"}`}
                        >
                            <span>📋</span> Laudos Técnicos (PDF)
                        </button>
                        <button 
                            onClick={() => setActiveTab("hub")}
                            className={`px-3 py-1.5 rounded-lg text-xs font-semibold transition cursor-pointer flex items-center gap-1.5 ${activeTab === "hub" ? "bg-accentBlue text-white shadow font-bold" : "bg-tacticalDark text-textMuted border border-commandBorder hover:border-accentBlue"}`}
                        >
                            <span>📑</span> Hub Regional
                        </button>
                    </div>

                    {/* CORPO PRINCIPAL */}
                    <main className="flex-1 max-w-5xl w-full mx-auto p-4 space-y-4 pb-20">
                        
                        {activeTab === "videos" && (
                            <VideoVaultModule showToast={showToast} onClose={() => setActiveTab("chat")} />
                        )}

                        {activeTab === "relatorio" && (
                            <FieldReportModule onBackToChat={() => setActiveTab("chat")} showToast={showToast} />
                        )}

                        {activeTab === "hub" && (
                            <RegionalHubModule showToast={showToast} onClose={() => setActiveTab("chat")} />
                        )}

                        {activeTab === "chat" && (
                            <div className="space-y-4">
                                <div className="command-glass p-6 rounded-2xl border border-accentBlue/30 shadow-xl flex flex-col sm:flex-row items-center gap-6">
                                    <CommandAvatar isLarge={true} isSpeaking={isSpeaking} isListening={isListening} />
                                    <div className="space-y-2 text-center sm:text-left flex-1">
                                        <div className="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-accentBlue/10 border border-accentBlue/35 text-accentBlue text-xs font-semibold">
                                            <span className="w-2 h-2 rounded-full bg-accentEmerald"></span>
                                            Centro de Comando e Telemetria Ativo
                                        </div>
                                        <h2 className="text-sm font-bold text-textLight">Canal de Inteligência & Resiliência</h2>
                                        <p className="text-xs text-textMuted leading-relaxed">
                                            "Prevenção não é mídia: é gente atenta." Conectado aos protocolos de monitoramento das bacias e suporte à Defesa Civil de Mesquita.
                                        </p>
                                        {liveWeather && (
                                            <div className="text-[11px] font-mono text-accentBlue pt-2 border-t border-commandBorder flex flex-wrap justify-center sm:justify-start gap-4">
                                                <span>🌡️ {liveWeather.temperature_2m}°C</span>
                                                <span>💧 {liveWeather.relative_humidity_2m}%</span>
                                                <span>🌧 {liveWeather.precipitation}mm/h</span>
                                            </div>
                                        )}
                                    </div>
                                </div>

                                <div className="command-glass rounded-2xl p-4 sm:p-6 border border-accentBlue/30 shadow-xl min-h-[380px] flex flex-col justify-between">
                                    <div className="space-y-3 mb-4 max-h-[420px] overflow-y-auto pr-1">
                                        {messages.length === 0 ? (
                                            <div className="text-center py-8 space-y-3">
                                                <div className="text-sm font-bold text-textMuted">💬 Inicie uma consulta ao Centro de Comando</div>
                                                <div className="flex flex-wrap justify-center gap-2 pt-2">
                                                    <button onClick={() => handleSendMessage("Qual o status atual do monitoramento do Rio Sarapuí?")} className="px-3 py-2 bg-tacticalDark border border-commandBorder text-accentBlue rounded-xl text-xs hover:bg-accentBlue/10 transition cursor-pointer font-semibold">
                                                        🌊 Status do Rio Sarapuí
                                                    </button>
                                                    <button onClick={() => handleSendMessage("Como proceder em caso de alerta de inundação?")} className="px-3 py-2 bg-tacticalDark border border-commandBorder text-accentAmber rounded-xl text-xs hover:bg-accentAmber/10 transition cursor-pointer font-semibold">
                                                        🚨 Protocolo de Alerta
                                                    </button>
                                                </div>
                                            </div>
                                        ) : (
                                            messages.map((m) => (
                                                <div key={m.id} className={`flex ${m.sender === 'user' ? 'justify-end' : 'justify-start'}`}>
                                                    <div className={`max-w-[85%] p-3.5 rounded-xl text-xs leading-relaxed ${
                                                        m.sender === 'user' 
                                                            ? 'bg-accentBlue text-white font-medium shadow' 
                                                            : 'bg-commandPanel text-textLight border border-commandBorder shadow-sm'
                                                    }`}>
                                                        <div className="whitespace-pre-wrap">{m.text}</div>
                                                        <div className={`text-[9px] mt-1 text-right ${m.sender === 'user' ? 'text-white/70' : 'text-textMuted'}`}>{m.timestamp}</div>
                                                    </div>
                                                </div>
                                            ))
                                        )}
                                        {isLoadingChat && (
                                            <div className="flex justify-start">
                                                <div className="bg-commandPanel p-3 rounded-xl border border-commandBorder text-xs text-accentBlue animate-pulse">
                                                    🛰️ SARAH processando dados táticos...
                                                </div>
                                            </div>
                                        )}
                                    </div>

                                    <form onSubmit={(e) => { e.preventDefault(); handleSendMessage(); }} className="flex items-center gap-2 pt-3 border-t border-commandBorder">
                                        <button 
                                            type="button" 
                                            onClick={toggleListening}
                                            className={`p-3 rounded-xl border transition cursor-pointer shrink-0 ${isListening ? 'bg-accentDanger text-white border-accentDanger animate-pulse' : 'bg-tacticalDark border-commandBorder text-accentBlue hover:bg-accentBlue/10'}`}
                                            title="Comando por Voz"
                                        >
                                            🎙️
                                        </button>
                                        <input 
                                            type="text" 
                                            value={input}
                                            onChange={(e) => setInput(e.target.value)}
                                            placeholder="Digite sua mensagem ou use o microfone..."
                                            className="flex-1 bg-tacticalDark border border-commandBorder rounded-xl px-4 py-2.5 text-xs text-textLight focus:outline-none focus:border-accentBlue"
                                        />
                                        <button 
                                            type="submit" 
                                            disabled={isLoadingChat}
                                            className="px-5 py-2.5 bg-accentBlue hover:bg-blue-600 text-white font-bold rounded-xl text-xs transition cursor-pointer shadow shrink-0"
                                        >
                                            Enviar
                                        </button>
                                    </form>
                                </div>
                            </div>
                        )}
                    </main>

                    {/* FAIXA MARQUEE TÁTICA */}
                    <div className="command-panel border-t border-accentBlue/30 py-2.5 overflow-hidden shadow-inner whitespace-nowrap z-20">
                        <marquee behavior="scroll" direction="left" scrollamount="5" className="font-sans text-xs font-bold tracking-wide text-textLight">
                            <span>🛡️ Centro de Comando Operacional</span> &nbsp;•&nbsp; 
                            <span>Plano de Ação: Cidades Resilientes (ONU)</span> &nbsp;•&nbsp; 
                            <span>Grupo Comunitário A Chave da Esperança</span> &nbsp;•&nbsp; 
                            <span>EMERGÊNCIAS: Defesa Civil (199 / 21 4040-1772)</span> &nbsp;•&nbsp; 
                            <span>Bombeiros (193)</span> &nbsp;•&nbsp; 
                            <span>Alertas ZAP 📲 (21) 97299-3223</span> &nbsp;•&nbsp; 
                            <span>Cras Rocha Sobrinho (21) 2042-8931</span> &nbsp;•&nbsp; 
                            <span>"Se o Senhor não guardar a cidade, em vão vigia o sentinela" (Salmos 127:1)</span>
                        </marquee>
                    </div>

                    {/* RODAPÉ INSTITUCIONAL CORRIGIDO COM FRASE COMPLETA E ESPAÇADA */}
                    <footer className="bg-tacticalDark border-t border-commandBorder py-5 px-4 text-center text-xs font-sans space-y-2 z-20">
                        <div className="font-bold text-accentBlue tracking-wide">
                            Defesa Civil Comunitária • SARAH IA NEXUS v5.2 PRO
                        </div>
                        <div className="text-textMuted text-[11px] tracking-wide px-2">
                            Grupo Comunitário A Chave da Esperança &nbsp;&bull;&nbsp; Mesquita/RJ &nbsp;&bull;&nbsp; Todos os direitos reservados
                        </div>
                    </footer>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById("root"));
        root.render(<App />);

        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js').catch(() => {}));
        }
    </script>
</body>
</html>
