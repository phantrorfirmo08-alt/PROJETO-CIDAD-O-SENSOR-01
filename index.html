        function NativeHydroWindRadar() {
            const canvasRef = React.useRef(null);

            React.useEffect(() => {
                const canvas = canvasRef.current;
                if (!canvas) return;
                const X = canvas.getContext('2d');
                let A = 0, N = [];
                for(let i=0; i<14; i++) {
                    N.push({x: 30 + Math.random()*50, y: 20 + Math.random()*40, vx: 0.4 + Math.random()*0.6, vy: 0.2 + Math.random()*0.4});
                }
                let animId;

                const D = () => {
                    X.fillStyle = '#050210';
                    X.fillRect(0, 0, 360, 280);
                    let cx = 180, cy = 140, sx = 35, sy = 35;

                    [40, 80, 120, 160].forEach(r => {
                        X.strokeStyle = 'rgba(139,92,246,0.18)';
                        X.beginPath(); X.arc(cx, cy, r, 0, 7); X.stroke();
                    });

                    X.strokeStyle = '#fbbf24'; X.lineWidth = 2; X.setLineDash([6,4]); X.shadowBlur = 10; X.shadowColor = '#fbbf24';
                    X.beginPath(); X.moveTo(sx, sy); X.lineTo(cx-10, cy); X.stroke(); X.setLineDash([]); X.shadowBlur = 0;

                    X.fillStyle = '#fbbf24'; X.beginPath(); X.arc(sx, sy, 4, 0, 7); X.fill();
                    X.fillStyle = '#fff'; X.font = '600 6px Inter'; X.fillText('MENDANHA', sx-12, sy-8);

                    X.fillStyle = '#22c55e'; X.shadowBlur = 12; X.shadowColor = '#22c55e';
                    X.beginPath(); X.arc(cx-10, cy, 5, 0, 7); X.fill(); X.shadowBlur = 0;
                    X.fillStyle = '#fff'; X.fillText('SEBINHO', cx+6, cy-4);

                    X.save(); X.translate(cx, cy); X.rotate(A);
                    let g = X.createConicGradient(0,0,0);
                    g.addColorStop(0, 'rgba(251,146,60,0.6)');
                    g.addColorStop(0.2, 'rgba(251,146,60,0.15)');
                    g.addColorStop(0.4, 'transparent');
                    X.fillStyle = g; X.beginPath(); X.moveTo(0,0); X.arc(0,0,160,-0.4,0.4); X.lineTo(0,0); X.fill();
                    X.strokeStyle = '#fb923c'; X.lineWidth = 1.5; X.shadowBlur = 12; X.shadowColor = '#fb923c';
                    X.beginPath(); X.moveTo(0,0); X.lineTo(160,0); X.stroke(); X.restore();

                    N.forEach(p => {
                        X.globalAlpha = 0.75; X.fillStyle = '#a78bfa';
                        X.beginPath(); X.arc(p.x, p.y, 7, 0, 7); X.arc(p.x+8, p.y+2, 5, 0, 7); X.fill();
                        p.x += (cx - p.x) * 0.004; p.y += (cy - p.y) * 0.004;
                        if(Math.hypot(cx - p.x, cy - p.y) < 12) { p.x = sx; p.y = sy; }
                    });
                    X.globalAlpha = 1;

                    A += 0.025;
                    animId = requestAnimationFrame(D);
                };
                D();
                return () => cancelAnimationFrame(animId);
            }, []);

            return (
                <div style={{background:'#060310', border:'1.8px solid #7c3aed', borderRadius:'18px', overflow:'hidden'}}>
                    <div style={{display:'flex', justifyContent:'space-between', padding:'8px 10px', background:'#1a0e32', borderBottom:'1px solid #4c1d95'}}>
                        <span style={{fontSize:'9px', fontWeight:'900', color:'#ddd6fe'}}>🛰️ RADAR HIDROGRÁFICO ULTRA (SARAPUÍ / DONA EUGÊNIA) - SEBINHO</span>
                    </div>
                    <canvas ref={canvasRef} width="360" height="280" style={{width:'100%', display:'block', background:'#050210'}}></canvas>
                    <div style={{display:'flex', gap:'6px', padding:'6px', background:'#080411'}}>
                        <div style={{flex:1, background:'#140c29', borderRadius:'8px', padding:'5px', textAlign:'center', border:'1px solid #22c55e33'}}>
                            <div style={{fontSize:'6px', color:'#86efac'}}>CHUVA 1H</div>
                            <div style={{fontSize:'11px', fontWeight:'900', color:'#fff'}}>4.2mm</div>
                        </div>
                        <div style={{flex:1, background:'#140c29', borderRadius:'8px', padding:'5px', textAlign:'center', border:'1px solid #38bdf833'}}>
                            <div style={{fontSize:'6px', color:'#93c5fd'}}>NÍVEL RIO</div>
                            <div style={{fontSize:'11px', fontWeight:'900', color:'#fff'}}>2.34m</div>
                        </div>
                        <div style={{flex:1, background:'#140c29', borderRadius:'8px', padding:'5px', textAlign:'center', border:'1px solid #fbbf2433'}}>
                            <div style={{fontSize:'6px', color:'#fde68a'}}>VENTO</div>
                            <div style={{fontSize:'11px', fontWeight:'900', color:'#fff'}}>12 km/h</div>
                        </div>
                    </div>
                </div>
            );
        }

                const msg = encodeURIComponent(`[HUB REGIONAL - ${lote}] Equipe: ${equipe || 'G.C.E.'} | Relato: ${relato || 'Vistoria'}`);
                window.open(`https://wa.me/55${zap.replace(/\D/g, '')}?text=${msg}`, '_blank');
            };

            return (
                <div className="glass-dark p-6 rounded-3xl border border-purple-500/40 shadow-xl space-y-3 max-w-lg mx-auto w-full">
                    <h2 className="text-sm font-bold text-purple-300 border-b border-purple-500/30 pb-2">📑 Hub Regional & Lotes</h2>
                    <select value={lote} onChange={e => setLote(e.target.value)} className="w-full bg-[#120921] border border-purple-500/30 rounded-xl p-2 text-white text-xs">
                        <option>Lote 1: Novo PAC</option>
                        <option>Lote 2: Defesa Civil</option>
                        <option>Lote 3: Universidades</option>
                        <option>Lote 6: Grupos Comunitários / OSC</option>
                    </select>
                    <input type="text" value={equipe} onChange={e => setEquipe(e.target.value)} placeholder="Nome da Equipe / Grupo" className="w-full bg-[#120921] border border-purple-500/30 rounded-xl p-2 text-white text-xs" />
                    <input type="text" value={zap} onChange={e => setZap(e.target.value)} placeholder="WhatsApp (Ex: 21983625875)" className="w-full bg-[#120921] border border-purple-500/30 rounded-xl p-2 text-white text-xs" />
                    <textarea rows="3" value={relato} onChange={e => setRelato(e.target.value)} placeholder="Laudo do setor..." className="w-full bg-[#120921] border border-purple-500/30 rounded-xl p-2 text-white text-xs resize-none"></textarea>
                    <button onClick={enviarZap} className="w-full py-2.5 bg-emerald-600 text-white font-bold rounded-xl shadow text-xs cursor-pointer">💬 Enviar via WhatsApp</button>
                </div>
            );
        }

        function App() {
            const [darkMode, setDarkMode] = React.useState(true);
            const [soundEnabled, setSoundEnabled] = React.useState(true);
            const [isSpeaking, setIsSpeaking] = React.useState(false);
            const [isListening, setIsListening] = React.useState(false);
            const [activeTab, setActiveTab] = React.useState("chat");
            const [toastMessage, setToastMessage] = React.useState(null);
            const [messages, setMessages] = React.useState([]);
            const [input, setInput] = React.useState("");
            const [isLoadingChat, setIsLoadingChat] = React.useState(false);

            const showToast = (msg) => {
                setToastMessage(msg);
                setTimeout(() => setToastMessage(null), 3500);
            };

            const speakText = (text) => {
                if (!soundEnabled || !("speechSynthesis" in window)) return;
                window.speechSynthesis.cancel();
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = "pt-BR";
                utterance.onstart = () => setIsSpeaking(true);
                utterance.onend = () => setIsSpeaking(false);
                utterance.onerror = () => setIsSpeaking(false);
                window.speechSynthesis.speak(utterance);
            };

            const toggleListening = () => {
                const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
                if (!SpeechRec) {
                    showToast("⚠️ Reconhecimento de voz indisponível neste navegador.");
                    return;
                }
                if (isListening) {
                    setIsListening(false);
                    return;
                }
                const rec = new SpeechRec();
                rec.lang = "pt-BR";
                rec.onstart = () => {
                    setIsListening(true);
                    showToast("🎙️ Microfone avançado PWA ouvindo...");
                };
                rec.onresult = (event) => {
                    const transcript = event.results[0][0].transcript;
                    setInput(transcript);
                    setIsListening(false);
                    handleSendMessage(transcript);
                };
                rec.onerror = () => setIsListening(false);
                rec.onend = () => setIsListening(false);
                rec.start();
            };

            const handleSendMessage = async (textCustom) => {
                const textToSend = textCustom !== undefined ? textCustom : input;
                if (!textToSend.trim() || isLoadingChat) return;
                const userMsg = { id: Date.now(), sender: "user", text: textToSend.trim(), timestamp: new Date().toLocaleTimeString("pt-BR", { hour: "2-digit", minute: "2-digit" }) };
                setMessages(prev => [...prev, userMsg]);
                if (!textCustom) setInput("");
                setIsLoadingChat(true);

                try {
                    const response = await fetch(CLOUDFLARE_WORKER_URL, {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({
                            model: "openai/gpt-oss-120b",
                            messages: [{ role: "system", content: "SARAH IA NEXUS v5.2 PRO - Defesa Civil Comunitária (A Chave da Esperança, Mesquita/RJ)." }, { role: "user", content: userMsg.text }]
                        })
                    });
                    const data = await response.json();
                    const reply = data?.choices?.[0]?.message?.content || data?.message || "Sistemas operando normalmente.";
                    setMessages(prev => [...prev, { id: Date.now() + 1, sender: "sarah", text: reply, timestamp: new Date().toLocaleTimeString("pt-BR", { hour: "2-digit", minute: "2-digit" }) }]);
                    speakText(reply);
                } catch {
                    setMessages(prev => [...prev, { id: Date.now(), sender: "sarah", text: "Falha de enlace com a internet.", timestamp: "00:00" }]);
                } finally {
                    setIsLoadingChat(false);
                }
            };

            return (
                <div className={`min-h-screen flex flex-col relative ${darkMode ? 'bg-nightBlue text-lightLavender' : 'bg-slate-100 text-slate-900'}`}>
                    {toastMessage && (
                        <div className="fixed top-20 left-1/2 -translate-x-1/2 z-50 bg-purple-600 text-white px-6 py-3 rounded-2xl text-xs font-bold shadow-2xl border-2 border-pink-400">
                            {toastMessage}
                        </div>
                    )}

                    <header className="glass-dark border-b border-purple-500/30 px-4 py-3 sticky top-0 z-40 shadow-xl">
                        <div className="max-w-5xl mx-auto flex items-center justify-between">
                            <div className="flex items-center gap-3">
                                <div className="w-11 h-11 rounded-2xl bg-purple-500/15 border border-purple-500/60 flex items-center justify-center text-purple-300">
                                    <CyberShieldIcon className="w-6 h-6" />
                                </div>
                                <div>
                                    <h1 className="text-sm font-bold">SARAH IA NEXUS v5.2 PRO</h1>
                                    <span className="text-xs text-purple-300">Grupo Comunitário A Chave da Esperança (Mesquita/RJ)</span>
                                </div>
                            </div>
                            <div className="flex items-center gap-2">
                                <button onClick={() => {
                                    if (navigator.share) {
                                        navigator.share({ title: 'SARAH IA', url: window.location.href }).catch(()=>{});
                                    } else {
                                        showToast("🔗 Link copiado para partilha!");
                                    }
                                }} className="px-3 py-1.5 bg-purple-500/20 border border-purple-500/40 rounded-xl text-xs font-bold text-purple-300 cursor-pointer">🔗 Partilhar</button>
                                <button onClick={() => setDarkMode(!darkMode)} className="w-9 h-9 bg-purple-500/20 border border-purple-500/40 rounded-xl flex items-center justify-center text-purple-300 cursor-pointer">{darkMode ? "☀️" : "🌙"}</button>
                            </div>
                        </div>
                    </header>

                    <div className="bg-[#120921] border-b border-purple-500/30 px-4 py-2">
                        <div className="max-w-5xl mx-auto flex items-center gap-2 overflow-x-auto">
                            <button onClick={() => setActiveTab("chat")} className={`px-4 py-2 rounded-xl text-xs font-bold cursor-pointer ${activeTab === "chat" ? "bg-purple-600 text-white" : "bg-nightBlue text-purple-300 border border-purple-500/40"}`}>💬 Chat</button>
                            <button onClick={() => setActiveTab("dashboard")} className={`px-4 py-2 rounded-xl text-xs font-bold cursor-pointer ${activeTab === "dashboard" ? "bg-purple-600 text-white" : "bg-nightBlue text-purple-300 border border-purple-500/40"}`}>🛰️ Radar</button>
                            <button onClick={() => setActiveTab("field_report")} className={`px-4 py-2 rounded-xl text-xs font-bold cursor-pointer ${activeTab === "field_report" ? "bg-purple-600 text-white" : "bg-nightBlue text-purple-300 border border-purple-500/40"}`}>📋 Laudos</button>
                            <button onClick={() => setActiveTab("regional_hub")} className={`px-4 py-2 rounded-xl text-xs font-bold cursor-pointer ${activeTab === "regional_hub" ? "bg-purple-600 text-white" : "bg-nightBlue text-purple-300 border border-purple-500/40"}`}>📑 Hub</button>
                            <button onClick={() => setActiveTab("videos")} className={`px-4 py-2 rounded-xl text-xs font-bold cursor-pointer ${activeTab === "videos" ? "bg-purple-600 text-white" : "bg-nightBlue text-purple-300 border border-purple-500/40"}`}>🎥 Produções & Registros</button>
                        </div>
                    </div>

                    <main className="max-w-5xl mx-auto p-4 w-full flex-1 flex flex-col">
                        {activeTab === "dashboard" && <NativeHydroWindRadar />}
                        {activeTab === "field_report" && <FieldReportModule onBackToChat={() => setActiveTab("chat")} showToast={showToast} />}
                        {activeTab === "regional_hub" && <RegionalHubModule showToast={showToast} />}
                        {activeTab === "videos" && <VideoVaultModule showToast={showToast} />}
                        {activeTab === "chat" && (
                            <div className="glass-dark rounded-3xl shadow-2xl flex flex-col overflow-hidden flex-1 border border-purple-500/40" style={{ minHeight: "500px" }}>
                                <div className="flex-1 overflow-y-auto p-4 space-y-4">
                                    {messages.length === 0 && (
                                        <div className="h-full flex flex-col items-center justify-center p-4 my-auto">
                                            <SarahHologramAvatar isLarge={true} isSpeaking={isSpeaking} />
                                            <h2 className="text-base font-bold text-white mt-3">SARAH IA NEXUS v5.2 PRO</h2>
                                            <p className="text-xs text-purple-300">"Prevenção não é mídia: é gente atenta."</p>
                                        </div>
                                    )}
                                    {messages.map(m => (
                                        <div key={m.id} className={`flex items-start gap-3 ${m.sender === "user" ? "flex-row-reverse" : "flex-row"}`}>
                                            {m.sender === "user" ? <div className="w-10 h-10 rounded-2xl bg-[#120921] flex items-center justify-center text-purple-300">👤</div> : <SarahHologramAvatar isSpeaking={isSpeaking} />}
                                            <div className={`p-4 rounded-3xl max-w-[85%] text-xs ${m.sender === "user" ? "bg-purple-600 text-white" : "bg-[#120921] text-lightLavender border border-purple-500/40"}`}>{m.text}</div>
                                        </div>
                                    ))}
                                </div>
                                <div className="p-4 bg-nightBlue/95 border-t border-purple-500/30 flex gap-2 items-center">
                                    <button 
                                        onClick={toggleListening} 
                                        className={`w-11 h-11 rounded-xl flex items-center justify-center cursor-pointer transition ${isListening ? 'bg-pink-500 text-white animate-mic-pulse' : 'bg-purple-500/20 border border-purple-500/40 text-purple-300'}`}
                                        title="Microfone PWA Avançado"
                                    >
                                        🎙️
                                    </button>
                                    <input type="text" value={input} onChange={e => setInput(e.target.value)} onKeyDown={e => e.key === "Enter" && handleSendMessage()} placeholder="Digite sua mensagem ou use o microfone..." className="flex-1 bg-[#120921] border border-purple-500/40 rounded-xl px-3 py-2 text-xs text-white outline-none" />
                                    <button onClick={() => handleSendMessage()} className="px-4 py-2 bg-purple-600 text-white font-bold rounded-xl text-xs cursor-pointer">➤</button>
                                </div>
                            </div>
                        )}
                    </main>

                    <div className="bg-[#4a154b] border-t-2 border-purple-500 py-2.5 overflow-hidden whitespace-nowrap">
                        <marquee behavior="scroll" direction="left" scrollamount="4" className="text-xs font-bold text-[#FF7A00]">
                            🛡️ Promovendo ciência cidadã • 1° Edição operacional El Ninõ GACE • Conceitos Mesquita do amanhã e Cidades resilientes (ONU) Grupo Comunitário A Chave da Esperança • Plano de Ação: Todos Unidos, Todos Protegidos • EMERGÊNCIAS: Defesa Civil (199 / 21 4040-1772) • Bombeiros (193) • Alertas ZAP 📲 (21) 97299-3223 • Cras de Rocha Sobrinho 21 2042-8931 • Seja voluntário servir é prevenir sempre +Nupdecs • Participe • "Se o Senhor não guardar a cidade, em vão vigia o sentinela" (Salmos 127:1) • #compartilhe ™ Mesquita RJ 🛡️
                        </marquee>
                    </div>

                    <footer className="bg-[#120921] border-t border-purple-500/40 py-3 px-2 text-center text-xs space-y-1 font-bold shadow-inner">
                        <div style={{ color: "#9B7EDE" }}>Defesa Civil Comunitária Cidadão Sensor • SARAH IA NEXUS v5.2 PRO</div>
                        <div style={{ color: "#E58AC7" }}>Grupo Comunitário A Chave da Esperança • Mesquita/RJ</div>
                        <div style={{ color: "#72E6B2" }}>@ &nbsp; Todos os direitos reservados 2024–2026</div>
                    </footer>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById("root"));
        root.render(<App />);
    </script>
</body>
</html>
