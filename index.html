    <script>
      (function() {
        try {
            const savedTheme = localStorage.getItem('sarah-theme') || 'dark';
            if (savedTheme === 'warm') {
                document.documentElement.classList.remove('dark');
                document.documentElement.classList.add('warm');
            } else {
                document.documentElement.classList.add('dark');
                document.documentElement.classList.remove('warm');
            }
        } catch(e) {}
      })();

        // MÓDULO DE VISTORIA FUTURISTA COM CÂMERA DIRETA E SELEÇÃO TÁTICA DOS 11 ÓRGÃOS
        function FieldReportModule({ onBackToDashboard, showToast }) {
            const [setorSelecionado, setSetorSelecionado] = React.useState(SETORES_OFICIAIS[0].label);
            const [nivelRisco, setNivelRisco] = React.useState("🟢 Risco Baixo / Monitoramento");
            const [agente, setAgente] = React.useState("");
            const [local, setLocal] = React.useState("");
            const [desc, setDesc] = React.useState("");
            const [gps, setGps] = React.useState({lt:'', ln:'', lk:''});
            const [gpsSt, setGpsSt] = React.useState("📍 GPS em espera");
            const [isProcessingPhoto, setIsProcessingPhoto] = React.useState(false);
            const [modalPreviewImg, setModalPreviewImg] = React.useState(null);
            
            const [fotos, setFotos] = React.useState([
                {id:1, file:null, preview:null},
                {id:2, file:null, preview:null},
                {id:3, file:null, preview:null},
                {id:4, file:null, preview:null}
            ]);

            const capturarGps = () => {
                if(!navigator.geolocation) return showToast("⚠️ GPS indisponível");
                showToast("🛰 Obtendo coordenadas de campo...");
                navigator.geolocation.getCurrentPosition(
                    p => {
                        const lt = p.coords.latitude.toFixed(6);
                        const ln = p.coords.longitude.toFixed(6);
                        const lk = `https://www.google.com/maps?q=${lt},${ln}`;
                        setGps({lt, ln, lk});
                        setLocal(`${lt},${ln}`);
                        setGpsSt("✅ Coordenadas Fixadas com Sucesso");
                        showToast("📍 GPS fixado!");
                    },
                    () => setGpsSt("⚠ Erro ao obter GPS"),
                    {enableHighAccuracy:true, timeout:10000}
                );
            };

            const processarFotoComSegurancaAbsoluta = (file, gpsInfo, ag, loc) => new Promise((resolve, reject) => {
                const objectUrl = URL.createObjectURL(file);
                const img = new Image();
                
                img.onload = () => {
                    try {
                        const canvas = document.createElement('canvas');
                        const MAX_DIM = 450;
                        let w = img.width, h = img.height;
                        
                        if (w > MAX_DIM || h > MAX_DIM) {
                            if (w > h) { h = Math.round(h * MAX_DIM / w); w = MAX_DIM; }
                            else { w = Math.round(w * MAX_DIM / h); h = MAX_DIM; }
                        }
                        
                        canvas.width = w; 
                        canvas.height = h;
                        const ctx = canvas.getContext('2d', { alpha: false });
                        ctx.drawImage(img, 0, 0, w, h);
                        
                        URL.revokeObjectURL(objectUrl);
                        
                        const dataHoraStr = new Intl.DateTimeFormat('pt-BR', {
                            dateStyle: 'short', timeStyle: 'medium', timeZone: 'America/Sao_Paulo'
                        }).format(new Date());
                        
                        const coordStr = gpsInfo.lt ? `${gpsInfo.lt},${gpsInfo.ln}` : (loc || 'Local não fixado');
                        const fontSize = Math.max(9, Math.round(w * 0.026));
                        ctx.font = `bold ${fontSize}px sans-serif`;
                        
                        const pad = 6, lineHt = fontSize + 4, boxHeight = lineHt * 3 + pad * 2;
                        ctx.fillStyle = 'rgba(2, 6, 23, 0.94)';
                        ctx.fillRect(0, h - boxHeight, w, boxHeight);
                        
                        ctx.fillStyle = '#00F2FE';
                        let yPos = h - boxHeight + pad + fontSize;
                        ctx.fillText(`📅 ${dataHoraStr}`, pad, yPos);
                        ctx.fillText(`📍 GPS: ${coordStr}`, pad, yPos + lineHt);
                        ctx.fillText(`👤 Resp.: ${ag || 'Equipe de Campo / GADE'}`, pad, yPos + lineHt * 2);
                        
                        canvas.toBlob(blob => {
                            if (!blob) return reject(new Error("Falha ao gerar blob"));
                            const compressedFile = new File([blob], `vistoria_${Date.now()}.jpg`, { type: 'image/jpeg' });
                            const previewUrl = canvas.toDataURL('image/jpeg', 0.40);
                            resolve({ compressedFile, preview: previewUrl });
                        }, 'image/jpeg', 0.40);
                    } catch (err) {
                        URL.revokeObjectURL(objectUrl);
                        reject(err);
                    }
                };
                
                img.onerror = () => {
                    URL.revokeObjectURL(objectUrl);
                    reject(new Error("Erro ao carregar imagem"));
                };
                
                img.src = objectUrl;
            });

            const handleFileChange = async (index, e) => {
                const file = e.target.files && e.target.files[0];
                if (!file) return;
                e.target.value = "";
                
                setIsProcessingPhoto(true);
                showToast(`📸 Acionando câmera e carimbando foto ${index + 1}...`);
                
                try {
                    if (fotos[index].preview && fotos[index].preview.startsWith('blob:')) {
                        URL.revokeObjectURL(fotos[index].preview);
                    }

                    const { compressedFile, preview } = await processarFotoComSegurancaAbsoluta(file, gps, agente, local);
                    setFotos(prev => {
                        const nextFotos = [...prev];
                        nextFotos[index] = { id: nextFotos[index].id, file: compressedFile, preview };
                        return nextFotos;
                    });
                    showToast(`✅ Foto 0${index + 1} capturada com sucesso!`);
                } catch (err) {
                    showToast("⚠️ Falha ao processar foto da câmera.");
                } finally {
                    setIsProcessingPhoto(false);
                }
            };

            const apagarFoto = (index, e) => {
                e.stopPropagation();

                    const nextFotos = [...prev];
                    nextFotos[index] = { id: nextFotos[index].id, file: null, preview: null };

            const [sarahState, setSarahState] = React.useState({
                isSpeaking: false,
                currentTopicIdx: 0,
                currentLineIdx: 0,
                speechText: "Olá, Alexander! O Sistema Sarah AI Nexus v8.4.2 PRO está pronto, travado e operacional. Como posso ajudar na nossa Defesa Civil hoje?"
            });

            const showToast = (msg) => {
                setToastMessage(msg);
                setTimeout(() => setToastMessage(null), 3500);
            };

            React.useEffect(() => {
                window.addEventListener('beforeinstallprompt', (e) => {
                    e.preventDefault();
                    setDeferredPrompt(e);
                    setIsInstallable(true);
                });
            }, []);

            const handleInstallApp = async () => {
                if(deferredPrompt) {
                    deferredPrompt.prompt();
                    const { outcome } = await deferredPrompt.userChoice;
                    if(outcome === 'accepted') {
                        showToast("✅ Aplicativo instalado com sucesso!");
                    }
                    setDeferredPrompt(null);
                    setIsInstallable(false);
                } else {
                    showToast("ℹ️ Para instalar, use o menu do navegador e escolha 'Adicionar à Tela Inicial'.");
                }
            };

            const toggleTheme = () => {
                const nextTheme = theme === 'dark' ? 'warm' : 'dark';
                setTheme(nextTheme);
                localStorage.setItem('sarah-theme', nextTheme);
                if(nextTheme === 'warm') {
                    document.documentElement.classList.remove('dark');
                    document.documentElement.classList.add('warm');
                } else {
                    document.documentElement.classList.add('dark');
                    document.documentElement.classList.remove('warm');
                }
                showToast(`🎨 Tema alterado para ${nextTheme === 'dark' ? 'Cyber Dark' : 'Clean Warm'}`);
            };

            const triggerSarahVoice = () => {
                const topic = SARAH_TALK_TOPICS[sarahState.currentTopicIdx];
                const line = topic.lines[sarahState.currentLineIdx];
                
                setSarahState(prev => ({
                    ...prev,
                    isSpeaking: true,
                    speechText: `${topic.icon} [${topic.tag}]: ${line}`
                }));

                if (soundEnabled && 'speechSynthesis' in window) {
                    window.speechSynthesis.cancel();
                    const utterance = new SpeechSynthesisUtterance(line);
                    utterance.lang = 'pt-BR';
                    utterance.rate = 1.05;
                    utterance.onend = () => setSarahState(prev => ({ ...prev, isSpeaking: false }));
                    window.speechSynthesis.speak(utterance);
                } else {
                    setTimeout(() => setSarahState(prev => ({ ...prev, isSpeaking: false })), 4000);
                }

                setSarahState(prev => {
                    let nextLine = prev.currentLineIdx + 1;
                    let nextTopic = prev.currentTopicIdx;
                    if(nextLine >= SARAH_TALK_TOPICS[nextTopic].lines.length) {
                        nextLine = 0;
                        nextTopic = (nextTopic + 1) % SARAH_TALK_TOPICS.length;
                    }
                    return { ...prev, currentTopicIdx: nextTopic, currentLineIdx: nextLine };
                });
            };

            const openShareFromApp = () => {
                if(navigator.share) {
                    navigator.share({ title: 'Sarah AI Nexus v8.4.2 PRO', text: shareMessageText, url: APP_SHARE_URL }).catch(() => {});
                } else {
                    navigator.clipboard.writeText(shareMessageText);
                    showToast("📋 Link e mensagem copiados para a área de transferência!");
                }
            };

            return (
                <div className="min-h-screen flex flex-col relative">
                    {showSplash && (
                        <AppSplashScreen splashImageUrl={SPLASH_IMAGE_URL} onFinish={() => setShowSplash(false)} />
                    )}

                    <NativeHydroWindRadar isOpen={isRadarOpen} onToggle={() => setIsRadarOpen(!isRadarOpen)} />

                    {toastMessage && (
                        <div className="fixed top-5 left-1/2 -translate-x-1/2 z-[250] bg-cyberCyan text-void px-5 py-3 rounded-2xl font-black text-xs shadow-[0_0_30px_rgba(0,242,254,0.8)] animate-bounce">
                            {toastMessage}
                        </div>
                    )}

                    {/* TOP HEADER */}
                    <header className="sticky top-0 z-40 w-full bg-deepSpace/90 backdrop-blur-xl border-b border-cyberCyan/30 px-4 py-3">
                        <div className="max-w-4xl mx-auto flex items-center justify-between">
                            <div className="flex items-center gap-3">
                                <div className="w-10 h-10 rounded-2xl bg-commandPanel border border-cyberCyan/50 flex items-center justify-center shadow-[0_0_15px_rgba(0,242,254,0.4)]">
                                    <CyberShieldIcon className="w-6 h-6" />
                                </div>
                                <div>
                                    <div className="font-display font-black text-xs text-cyberCyan tracking-widest uppercase">
                                        SARAH AI NEXUS <span className="text-white">v8.4.2 PRO</span>
                                    </div>
                                    <div className="font-mono text-[9px] text-slate-400 tracking-wider">
                                        DEFESA CIVIL COMUNITÁRIA • MESQUITA/RJ
                                    </div>
                                </div>
                            </div>

                            <div className="flex items-center gap-2">
                                <button onClick={openShareFromApp} className="w-9 h-9 rounded-xl bg-commandPanel border border-cyberCyan/40 hover:border-cyberCyan text-cyberGreen flex items-center justify-center transition shadow-md" title="Compartilhar Sistema">
                                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="M8.59 13.51l6.83 3.98M15.41 6.51l-6.82 3.98"/></svg>
                                </button>
                                <button onClick={() => setSoundEnabled(!soundEnabled)} className={`w-9 h-9 rounded-xl border flex items-center justify-center cursor-pointer transition shadow-md ${soundEnabled ? 'bg-cyberCyan/20 border-cyberCyan text-cyberCyan shadow-[0_0_12px_rgba(0,242,254,0.5)]' : 'bg-commandPanel border-cyberCyan/30 text-slate-500'}`} title="Áudio">
                                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>{soundEnabled && <path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"></path>}</svg>
                                </button>
                                <button onClick={toggleTheme} className="w-9 h-9 rounded-xl border border-cyberCyan/40 bg-commandPanel text-cyberCyan flex items-center justify-center cursor-pointer shadow-md hover:border-cyberCyan transition" title="Alternar Tema">
                                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M4.93 4.93l1.41 1.41m11.32 11.32l1.41 1.41M2 12h2m16 0h2M6.34 17.66l-1.41 1.41m12.02-12.02l-1.41 1.41"/></svg>
                                </button>
                                <button onClick={handleInstallApp} className={`w-9 h-9 rounded-xl border flex items-center justify-center cursor-pointer shadow-md transition ${isInstallable ? 'bg-cyberGreen/20 border-cyberGreen text-cyberGreen animate-pulse shadow-[0_0_15px_#10B981]' : 'border-cyberCyan/40 bg-commandPanel text-cyberCyan'}`} title="Instalar App">
                                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
                                </button>
                            </div>
                        </div>
                    </header>

                    {/* MAIN CONTENT */}
                    <main className="flex-1 max-w-4xl w-full mx-auto p-4 space-y-4 pb-24">
                        {currentTab === 'home' && (
                            <div className="space-y-4 animate-fade-in">
                                <div className="cyber-card p-6 rounded-3xl flex flex-col md:flex-row items-center gap-6 shadow-2xl relative overflow-hidden">
                                    <div className="absolute top-0 right-0 w-64 h-64 bg-cyberCyan/5 rounded-full blur-3xl pointer-events-none"></div>
                                    <div onClick={triggerSarahVoice} className="cursor-pointer shrink-0">
                                        <SarahHologramAvatar isLarge={true} isSpeaking={sarahState.isSpeaking} />
                                    </div>
                                    <div className="flex-1 text-center md:text-left space-y-3 z-10">
                                        <div className="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-cyberGreen/10 border border-cyberGreen/30 text-cyberGreen font-mono text-[10px]">
                                            <span className="w-2 h-2 rounded-full bg-cyberGreen animate-ping"></span>
                                            {getBrasiliaGreeting()}, Alexander! Sistema Totalmente Operacional
                                        </div>
                                        <h1 className="font-display font-black text-xl text-white tracking-wider">
                                            CENTRAL DE INTELIGÊNCIA COMUNITÁRIA
                                        </h1>
                                        <p className="text-sm text-slate-300 font-medium leading-relaxed bg-void/40 p-4 rounded-2xl border border-cyberCyan/20">
                                            "{sarahState.speechText}"
                                        </p>
                                        <div className="flex flex-wrap items-center justify-center md:justify-start gap-3 pt-2">
                                            <button onClick={triggerSarahVoice} className="px-5 py-2.5 cyber-button font-extrabold rounded-xl text-xs uppercase tracking-wider transition cursor-pointer shadow-[0_0_20px_rgba(255,153,0,0.5)]">
                                                🔊 Ouvir Conselhos da Sarah
                                            </button>
                                            <button onClick={() => setCurrentTab('vistoria')} className="px-5 py-2.5 bg-commandPanel hover:bg-cyberCyan hover:text-void border border-cyberCyan/50 text-cyberCyan font-extrabold rounded-xl text-xs uppercase tracking-wider transition cursor-pointer">
                                                📋 Nova Vistoria Técnica
                                            </button>
                                        </div>
                                    </div>
                                </div>

                                <div className="grid grid-cols-2 sm:grid-cols-4 gap-3">
                                    <button onClick={() => setCurrentTab('vistoria')} className="cyber-card p-4 rounded-2xl text-left hover:border-cyberCyan transition cursor-pointer group">
                                        <div className="w-10 h-10 rounded-xl bg-cyberCyan/20 border border-cyberCyan/40 flex items-center justify-center text-cyberCyan mb-3 group-hover:scale-110 transition">
                                            <FieldReportIcon />
                                        </div>
                                        <div className="font-display font-bold text-xs text-white">Vistoria de Campo</div>
                                        <div className="text-[10px] text-slate-400 mt-1">Câmera e 11 Órgãos Oficiais</div>
                                    </button>

                                    <button onClick={() => setIsRadarOpen(true)} className="cyber-card p-4 rounded-2xl text-left hover:border-cyberCyan transition cursor-pointer group">
                                        <div className="w-10 h-10 rounded-xl bg-cyberGreen/20 border border-cyberGreen/40 flex items-center justify-center text-cyberGreen mb-3 group-hover:scale-110 transition">
                                            <RadarScanIcon />
                                        </div>
                                        <div className="font-display font-bold text-xs text-white">Radar 24h</div>
                                        <div className="text-[10px] text-slate-400 mt-1">Monitoramento meteorológico</div>
                                    </button>

                                    <button onClick={() => showToast("🛡️ GACE e Grupo A Chave da Esperança ativos.")} className="cyber-card p-4 rounded-2xl text-left hover:border-cyberCyan transition cursor-pointer group">
                                        <div className="w-10 h-10 rounded-xl bg-cyberAmber/20 border border-cyberAmber/40 flex items-center justify-center text-cyberAmber mb-3 group-hover:scale-110 transition">
                                            <StreamVideoIcon />
                                        </div>
                                        <div className="font-display font-bold text-xs text-white">Canal GACE</div>
                                        <div className="text-[10px] text-slate-400 mt-1">Ações comunitárias integradas</div>
                                    </button>

                                    <button onClick={() => showToast("🔒 Módulo PRO blindado com sucesso.")} className="cyber-card p-4 rounded-2xl text-left hover:border-cyberCyan transition cursor-pointer group">
                                        <div className="w-10 h-10 rounded-xl bg-cyberPurple/20 border border-cyberPurple/40 flex items-center justify-center text-cyberPurple mb-3 group-hover:scale-110 transition">
                                            <AdminVaultIcon />
                                        </div>
                                        <div className="font-display font-bold text-xs text-white">Cofre de Segurança</div>
                                        <div className="text-[10px] text-slate-400 mt-1">Versão 8.4.2 PRO travada</div>
                                    </button>
                                </div>
                            </div>
                        )}

                        {currentTab === 'vistoria' && (
                            <FieldReportModule onBackToDashboard={() => setCurrentTab('home')} showToast={showToast} />
                        )}
                    </main>

                    {/* BOTÃO FLUTUANTE DA SARAH AI */}
                    <SarahFloatingButton onClick={triggerSarahVoice} />

                    <footer className="w-full bg-deepSpace/95 border-t border-cyberCyan/30 overflow-hidden py-2.5 z-40 mt-auto">
                        <div className="flex whitespace-nowrap overflow-hidden">
                            <div className="flex animate-[tickerScroll_45s_linear_infinite] items-center gap-6 font-mono text-xs text-cyberCyan font-bold tracking-wider px-4">
                                <span>🛡️ Promovendo Ciências cidadã • 1º Edição El Niño GACE • Plano de ação: Todos unidos, todos protegidos • Seja voluntário • Servir é prevenir sempre + NUPDECS • # Compartilhe • Participe • Hospital da Mãe 21 2767-2700 Utilidades Públicas • "Se o Senhor não guardar a cidade, em vão vigia o sentinela" (Salmos 127) Cras de Rocha Sobrinho 21 2042-8931 Rede Suas Disque Mulher 180 CCO 21 2042-7020 Conceitos : Novo PAC seleções MCMV Projeto Iguaçu Cidades resilientes (ONU Habitat) • Periferia Viva Redução de Riscos Mesquita RJ Resiliência Climática 🛡️</span>
                                <span>🛡️ Promovendo Ciências cidadã • 1º Edição El Niño GACE • Plano de ação: Todos unidos, todos protegidos • Seja voluntário • Servir é prevenir sempre + NUPDECS • # Compartilhe • Participe • Hospital da Mãe 21 2767-2700 Utilidades Públicas • "Se o Senhor não guardar a cidade, em vão vigia o sentinela" (Salmos 127) Cras de Rocha Sobrinho 21 2042-8931 Rede Suas Disque Mulher 180 CCO 21 2042-7020 Conceitos : Novo PAC seleções MCMV Projeto Iguaçu Cidades resilientes (ONU Habitat) • Periferia Viva Redução de Riscos Mesquita RJ Resiliência Climática 🛡️</span>
                            </div>
                        </div>
                    </footer>
                </div>
            );
        }

        ReactDOM.render(<SarahNexusApp />, document.getElementById('root'));
    </script>
</body>
</html>
