<style>
    :root {
        --primary: #00F2FE;
        --secondary: #38BDF8;

    @keyframes avatarIdle {
        0%, 100% { transform: scale(1); filter: drop-shadow(0 0 15px rgba(0,242,254,0.4)); }
        50% { transform: scale(1.02); filter: drop-shadow(0 0 25px rgba(0,255,157,0.55)); }

    @keyframes avatarSpeaking {

    @keyframes moleculeRotate { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
    @keyframes moleculePulse {

    @keyframes auroraShift { 0% { background-position: 0% 50%; } 100% { background-position: 100% 50%; } }
    @keyframes cyberGridMove { 0% { background-position: 0 0; } 100% { background-position: 40px 40px; } }
    @keyframes mesquitaPulse {
        0% { box-shadow: 0 0 0 0 rgba(255,0,85,0.7); }
        70% { box-shadow: 0 0 0 18px rgba(255,0,85,0); }

    @keyframes cellPulse {
        0%   { box-shadow: 0 0 0 0 rgba(0,242,254,0.25), inset 0 0 14px rgba(0,242,254,0.06); }

    @keyframes synapseFlow { 0%, 60% { left: -60%; } 90%, 100% { left: 130%; } }

    .cyber-card {
        position: relative;
        overflow: hidden;
        background: linear-gradient(135deg, rgba(10, 27, 56, 0.94) 0%, rgba(4, 17, 37, 0.97) 100%);

        border-radius: 24px;
        padding: 18px;
        margin-bottom: 14px;
        animation: cellPulse 4.5s ease-in-out infinite;
        transition: transform 0.2s ease, box-shadow 0.2s ease;
    }
    .cyber-card::after {
        content: "";
        position: absolute;
        inset: 0;
        border-radius: inherit;
        padding: 1px;
        background: linear-gradient(120deg,
            rgba(var(--heart-color), 0.9),
            rgba(var(--heart-color), 0.4) 40%,
            transparent 60%,
            rgba(var(--heart-color), 0.35));
        -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
        -webkit-mask-composite: xor;
        mask-composite: exclude;
        opacity: 0.55;
        animation: membraneShift 6s ease-in-out infinite alternate;
        pointer-events: none;
    }
    .cyber-card::before {
        content: "";
        position: absolute;
        top: 0; left: -60%;
        width: 60%; height: 100%;
        background: linear-gradient(105deg, transparent,
            rgba(var(--heart-color), 0.10) 45%,

    .cyber-button {

        box-shadow: 0 0 15px rgba(0, 242, 254, 0.25), inset 0 0 10px rgba(0, 242, 254, 0.1);
        touch-action: manipulation;
    }
    .cyber-button::before {
        content: "";
        position: absolute;
        inset: 0;
        background: radial-gradient(circle at 50% 120%, rgba(0,255,157,0.35), transparent 60%);
        opacity: 0;
        transition: opacity 0.3s;
    }
    .cyber-button:hover::before { opacity: 1; }
    .cyber-button:hover {
        background: linear-gradient(135deg, #00F2FE 0%, #38BDF8 100%);
        color: #030712 !important;
        box-shadow: 0 0 25px rgba(0, 242, 254, 0.7);
    }
    .cyber-button:active { transform: scale(0.97); }

    .font-display { animation: dnaText 4s ease-in-out infinite; }
    body.organism-alert { animation: alertShiver 0.4s linear infinite; }

    footer {
        box-shadow: 0 -8px 30px rgba(0,242,254,0.15), inset 0 1px 0 rgba(0,242,254,0.4);
    }

    .sarah-avatar-stage {
        position: relative;
        width: 100%;
        max-width: 90px;
        aspect-ratio: 1/1;
        margin: 0 auto;
        display: flex;
        justify-content: center;
        align-items: center;
        cursor: pointer;
        animation: avatarIdle 5s ease-in-out infinite;
    }
    .sarah-avatar-stage.speaking {
        animation: avatarSpeaking 1.5s ease-in-out infinite alternate;
    }

    .wave-ring {
        position: absolute;
        border-radius: 50%;
        border: 1.5px solid var(--primary);
        box-shadow: 0 0 12px var(--glow), inset 0 0 8px var(--glow);
        animation: pulseWave var(--wave-speed) infinite cubic-bezier(0.215, 0.61, 0.355, 1);
        pointer-events: none;
    }
    .wave-ring:nth-child(2) { animation-delay: calc(var(--wave-speed) * 0.33); }
    .wave-ring:nth-child(3) { animation-delay: calc(var(--wave-speed) * 0.66); }

    .cyan-outer-boundary {
        position: absolute;
        inset: -5px;
        border-radius: 50%;
        border: 1px dashed var(--secondary);
        opacity: 0.7;
        animation: spinSlow 30s linear infinite;
        box-shadow: 0 0 14px var(--glow-cyan);
    }
    .avatar-aura {
        position: absolute;
        inset: -8%;
        border-radius: 50%;
        background: radial-gradient(circle,
            rgba(var(--heart-color), 0.4) 0%,
            rgba(var(--heart-color), 0.35) 45%, transparent 70%);
        background-size: 200% 200%;
        filter: blur(10px);
        animation: auraPulse 3.5s infinite ease-in-out, auroraShift 8s ease infinite;
        opacity: 0.85;
    }
    .avatar-core-wrapper {
        position: relative;
        width: 85%;
        height: 85%;
        border-radius: 50%;
        z-index: 10;
        box-shadow: 0 0 16px var(--glow), 0 0 25px rgba(0,0,0,0.8);
        background: radial-gradient(circle, #091328 0%, #040914 60%, #02040a 100%);
        border: 2px solid #00F2FE;
        overflow: hidden;
        display: flex;
        align-items: center;
        justify-content: center;
        animation: nucleusHeartbeat var(--heartbeat) ease-in-out infinite;
    }

    .molecule-rotate-slow { animation: moleculeRotate 20s linear infinite; transform-origin: center; }
    .molecule-rotate-reverse { animation: moleculeRotate 14s linear infinite reverse; transform-origin: center; }
    .molecule-node-pulse { animation: moleculePulse 3s ease-in-out infinite alternate; }

    @keyframes pulseWave {
        0% { width: 60%; height: 60%; opacity: 0.95; transform: scale(0.85); box-shadow: 0 0 8px var(--glow); }
        50% { opacity: 0.6; }
        100% { width: 130%; height: 130%; opacity: 0; transform: scale(1.15); box-shadow: 0 0 20px transparent; }
    }
    @keyframes auraPulse {
        0%, 100% { transform: scale(0.96); opacity: 0.7; }
        50% { transform: scale(1.12); opacity: 0.95; }
    }
    @keyframes spinSlow { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
    .glass-overlay {
        position: absolute;
        inset: 0;
        border-radius: 50%;
        background: radial-gradient(circle at 35% 25%, rgba(255, 255, 255, 0.25) 0%, rgba(255, 255, 255, 0.05) 40%, transparent 70%);
        pointer-events: none;
        z-index: 15;

    ::-webkit-scrollbar { width: 4px; height: 4px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(0,242,254,0.3); border-radius: 9999px; }

<body class="selection:bg-cyberCyan selection:text-void hud-grid">
    <div id="root"></div>
    <canvas id="raru-neural-net" style="position:fixed;inset:0;z-index:1;pointer-events:none;"></canvas>

    <script>
    (function RaruNeuralOrganism() {
        const canvas = document.getElementById('raru-neural-net');
        const ctx = canvas.getContext('2d');
        let W, H, nodes = [], touches = [], meshNeurons = [], raf;

        const CONFIG = {
            maxNodes: 42,
            linkDist: 130,
            nodeSpeed: 0.35,
            touchRadius: 180,
            touchBoost: 2.6,
            meshLinkDist: 260,
            colors: { calm: '0,242,254', alert: '255,0,85' }
        };

        function resize() {
            W = canvas.width = window.innerWidth;
            H = canvas.height = window.innerHeight;
            meshNeurons.forEach(m => {
                m.ax *= W / (m._lastW || W);
                m.ay *= H / (m._lastH || H);
                m._lastW = W; m._lastH = H;
            });
        }

        function createNodes() {
            nodes = Array.from({ length: CONFIG.maxNodes }, () => ({
                x: Math.random() * W,
                y: Math.random() * H,
                vx: (Math.random() - 0.5) * CONFIG.nodeSpeed,
                vy: (Math.random() - 0.5) * CONFIG.nodeSpeed,
                r: Math.random() * 1.8 + 0.8,
                phase: Math.random() * Math.PI * 2
            }));
        }

        function getAlertColor() {
            return document.body.classList.contains('organism-alert')
                ? CONFIG.colors.alert : CONFIG.colors.calm;
        }

        window.RARU_ORGANISM = {
            addNeuron(id, label) {
                if (meshNeurons.some(m => m.id === id)) return;
                meshNeurons.push({
                    id, label,
                    ax: Math.random() * (W * 0.7) + W * 0.15,
                    ay: Math.random() * (H * 0.5) + H * 0.25,
                    _lastW: W, _lastH: H,
                    born: performance.now(),
                    phase: Math.random() * Math.PI * 2,
                    drift: { x: (Math.random() - 0.5) * 0.15, y: (Math.random() - 0.5) * 0.15 },
                    flash: 0
                });
            },
            removeNeuron(id) { meshNeurons = meshNeurons.filter(m => m.id !== id); },
            clearNeurons() { meshNeurons = []; },
            count() { return meshNeurons.length; },
            pulse(id) {
                const m = meshNeurons.find(n => n.id === id);
                if (m) m.flash = 1;
            }
        };

        function draw(t) {
            ctx.clearRect(0, 0, W, H);
            const rgb = getAlertColor();
            const now = t / 1000;

            const boosts = touches.map(tc => ({ x: tc.x, y: tc.y, life: tc.life }));
            touches = touches.filter(tc => (tc.life -= 0.015) > 0);

            nodes.forEach(n => {
                let boost = 1;
                boosts.forEach(b => {
                    const dx = n.x - b.x, dy = n.y - b.y;
                    const d = Math.sqrt(dx * dx + dy * dy);
                    if (d < CONFIG.touchRadius) {
                        boost = Math.max(boost, 1 + (1 - d / CONFIG.touchRadius) * CONFIG.touchBoost * b.life);
                    }
                });
                n.x += n.vx * boost;
                n.y += n.vy * boost;
                if (n.x < 0 || n.x > W) n.vx *= -1;
                if (n.y < 0 || n.y > H) n.vy *= -1;
                n.x = Math.max(0, Math.min(W, n.x));
                n.y = Math.max(0, Math.min(H, n.y));
                const pulse = 0.6 + 0.4 * Math.sin(now * 2 + n.phase);
                ctx.beginPath();
                ctx.arc(n.x, n.y, n.r * (boost > 1.4 ? 1.6 : 1) * pulse, 0, Math.PI * 2);
                ctx.fillStyle = 'rgba(' + rgb + ',' + (0.5 * pulse + (boost > 1.4 ? 0.4 : 0)) + ')';
                ctx.fill();
            });

            meshNeurons.forEach(m => {
                m.ax += m.drift.x; m.ay += m.drift.y;
                if (m.ax < W * 0.05 || m.ax > W * 0.95) m.drift.x *= -1;
                if (m.ay < H * 0.12 || m.ay > H * 0.88) m.drift.y *= -1;

                const age = (t - m.born) / 1200;
                const grow = age < 1.2 ? Math.min(1, age / 1.2) : 1;
                const pulse = 0.75 + 0.35 * Math.sin(now * 2 + m.phase);
                const rr = 5 * grow * pulse;

                if (m.flash > 0) m.flash = Math.max(0, m.flash - 0.02);

                const halo = (14 + 5 * Math.sin(now * 2 + m.phase)) * (1 + m.flash * 0.8);
                ctx.beginPath();
                ctx.arc(m.ax, m.ay, halo * grow, 0, Math.PI * 2);
                ctx.strokeStyle = 'rgba(' + rgb + ',' + (0.35 * grow * pulse) + ')';
                ctx.lineWidth = 1;
                ctx.stroke();

                ctx.beginPath();
                ctx.arc(m.ax, m.ay, rr, 0, Math.PI * 2);
                ctx.fillStyle = 'rgba(' + rgb + ',' + (0.9 * grow) + ')';
                ctx.fill();
                ctx.beginPath();
                ctx.arc(m.ax, m.ay, rr, 0, Math.PI * 2);
                ctx.strokeStyle = 'rgba(255,255,255,0.8)';
                ctx.lineWidth = 1;
                ctx.stroke();

                if (grow > 0.9) {
                    ctx.font = '600 8px "JetBrains Mono", monospace';
                    ctx.fillStyle = 'rgba(' + rgb + ',0.9)';
                    ctx.textAlign = 'center';
                    ctx.fillText(m.label, m.ax, m.ay - halo - 6);
                }

                if (m.flash > 0) {
                    ctx.beginPath();
                    ctx.arc(m.ax, m.ay, (1 - m.flash) * 60 + 8, 0, Math.PI * 2);
                    ctx.strokeStyle = 'rgba(0,255,157, ' + (m.flash * 0.9) + ')';
                    ctx.lineWidth = 2;
                    ctx.stroke();

                    ctx.beginPath();
                    ctx.arc(m.ax, m.ay, rr + m.flash * 10, 0, Math.PI * 2);
                    ctx.fillStyle = 'rgba(0,255,157,' + (m.flash * 0.35) + ')';
                    ctx.fill();
                }
            });

            raf = requestAnimationFrame(draw);
        }

        window.addEventListener('resize', () => { resize(); createNodes(); });
        resize();
        createNodes();
        raf = requestAnimationFrame(draw);
    })();

    window.RARU_BUS = {
        _data: {},
        _subs: new Set(),
        push(sensorId, leitura) {
            this._data[sensorId] = Object.assign({}, leitura, { ts: Date.now() });
            this._subs.forEach(fn => { try { fn(sensorId, this._data[sensorId]); } catch(e){} });
        },
        get(sensorId) { return this._data[sensorId] || null; },
        all() { return Object.assign({}, this._data); },
        subscribe(fn) { this._subs.add(fn); return () => this._subs.delete(fn); }
    };
    </script>

    <script type="text/babel">
        const R = React;
        const { useState, useEffect } = React;

        function App() {
            return (
                <div className="seu-container-raru space-y-4">
                    <div className="cyber-card p-6 text-center space-y-4">
                        <div className="w-20 h-20 mx-auto">
                            <svg viewBox="0 0 100 100" className="w-full h-full" fill="none">
                                <circle cx="50" cy="50" r="46" fill="#040D1A" stroke="#00F2FE" strokeWidth="1.5"/>
                                <circle cx="50" cy="50" r="10" fill="#00FF9D" stroke="#00F2FE" strokeWidth="1.5"/>
                            </svg>
                        </div>
                        <h1 className="font-display text-lg font-black text-white tracking-widest">RARU NEXUS V11+</h1>
                        <p className="text-xs text-slate-300 font-mono">Organismo sensorial ativo, barras e vistorias operando em harmonia.</p>
                    </div>
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
