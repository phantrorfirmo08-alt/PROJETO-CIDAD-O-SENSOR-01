        function RadarMeteorologicoModule() {
            const [dados, setDados] = useState({});
            const [status, setStatus] = useState('Conectando Open-Meteo...');
            const [cidadeSel, setCidadeSel] = useState('Mesquita');

            function corPorChuva(p){
                if(p >= 70) return '#7C4DFF';
                if(p >= 40) return '#FF0055';
                if(p >= 20) return '#FFB703';
                return '#00FF9D';
            }
            function textoPorChuva(p){
                if(p >= 70) return 'Muito forte';
                if(p >= 40) return 'Forte';
                if(p >= 20) return 'Moderada';
                return 'Fraca / Estável';
            }

            useEffect(() => {
                async function carregar(){
                    try{
                        const lats = MUNICIPIOS_92.map(c => c.lat).join(',');
                        const lons = MUNICIPIOS_92.map(c => c.lon).join(',');
                        const url = `https://api.open-meteo.com/v1/forecast?latitude=${lats}&longitude=${lons}&current=temperature_2m,relative_humidity_2m,wind_speed_10m&hourly=precipitation_probability&timezone=America%2FSao_Paulo&forecast_days=1`;
                        const r = await fetch(url);
                        const j = await r.json();
                        const arr = Array.isArray(j) ? j : [j];
                        const mapa = {};
                        arr.forEach((item, i) => {
                            const c = MUNICIPIOS_92[i];
                            if(!c) return;
                            const hora = new Date().getHours();
                            mapa[c.n] = {
                                temp: item.current.temperature_2m,
                                umi: item.current.relative_humidity_2m,
                                vento: item.current.wind_speed_10m,
                                chuva: item.hourly.precipitation_probability[hora] || 0
                            };
                        });
                        setDados(mapa);
                        setStatus('Open-Meteo conectado · 92 municípios · Dados reais');
                    }catch(e){ setStatus('Modo simulação ativo'); }
                }
                carregar();
            }, []);

                const minLon = -44.75, maxLon = -41.0, minLat = -23.25, maxLat = -20.9;
                return {
                    x: 7 + ((c.lon - minLon) / (maxLon - minLon)) * 86,
                    y: 7 + ((maxLat - c.lat) / (maxLat - minLat)) * 86
                };
            }

                            {MUNICIPIOS_92.map(c => {
                                const p = posRadar(c);
                                const d = dados[c.n];
                                const chuva = d ? d.chuva : 0;
                                const cor = d ? corPorChuva(chuva) : '#94A3B8';
                                const sel = c.n === cidadeSel;
                                return (
                                    <div key={c.n} onClick={() => falar(c.n)} className="absolute text-center cursor-pointer z-[5]" style={{ left: p.x + "%", top: p.y + "%", transform: "translate(-50%,-50%)" }}>
                                        <div className="mx-auto rounded-full border-2 border-white" style={{ width: sel ? 14 : 9, height: sel ? 14 : 9, background: sel ? "#00E676" : cor, boxShadow: sel ? "0 0 10px #00E676" : "0 0 5px " + cor }} />
                                        <span className="text-[7px] px-1 py-[1px] rounded whitespace-nowrap inline-block mt-[1px]" style={{ background: sel ? "#00E676" : "rgba(0,0,0,.85)", color: sel ? "#02240F" : "#fff", fontWeight: sel ? 900 : 400 }}>{c.n}</span>
                                    </div>
                                );
                            })}
                        </div>

                        <div className="bg-black/40 border border-cyan-400/30 rounded-xl p-3">
                            <b className="text-[13px] text-white">{cidadeSel} · {dSel ? `${dSel.temp}°C · Chuva ${dSel.chuva}% (${textoPorChuva(dSel.chuva)}) · Vento ${dSel.vento} km/h` : 'Carregando...'}</b>
                            <p className="text-[10px] text-slate-400 mt-1">Toque em um ponto no radar que a Sarah fala o tempo. Cor = chuva real agora.</p>
                        </div>

                        <div className="bg-black/40 border border-cyan-400/30 rounded-xl p-3 space-y-2">
                            <span className="text-[10px] font-black text-cyan-300 uppercase tracking-wider block">Legenda - Chuva Real Agora</span>
                            <div className="grid grid-cols-4 gap-2 text-[8px]">
                                <div className="text-center"><span className="w-3 h-3 rounded-full bg-[#00FF9D] block mx-auto mb-1"></span><b className="text-white block">Verde</b><span className="text-slate-400">0-19%</span></div>
                                <div className="text-center"><span className="w-3 h-3 rounded-full bg-[#FFB703] block mx-auto mb-1"></span><b className="text-white block">Amarelo</b><span className="text-slate-400">20-39%</span></div>
                                <div className="text-center"><span className="w-3 h-3 rounded-full bg-[#FF0055] block mx-auto mb-1"></span><b className="text-white block">Vermelho</b><span className="text-slate-400">40-69%</span></div>
                                <div className="text-center"><span className="w-3 h-3 rounded-full bg-[#7C4DFF] block mx-auto mb-1"></span><b className="text-white block">Roxo</b><span className="text-slate-400">70%+</span></div>
                            </div>
                        </div>

                        <div className="flex flex-col gap-2 justify-center pt-2">
                            <a href="https://www.star.nesdis.noaa.gov/GOES/fulldisk_band.php?sat=G19&band=GEOCOLOR&length=12&dim=1" target="_blank" rel="noopener noreferrer" className="text-center text-[12px] font-black text-cyan-300 border border-cyan-400/70 rounded-xl px-6 py-3 bg-cyan-400/10">
                                ABRIR SATÉLITE GOES-19 (HD)
                            </a>
                        </div>
                    </div>
                </div>
            );
        }

        // MÓDULO DE BALANÇA ESG
        function ModuloCidadaoSensorModule({ onGoToDashboard, showToast }) {
            const [petKg, setPetKg] = useState(10);
            const [aluminioKg, setAluminioKg] = useState(3);
            const [ferroKg, setFerroKg] = useState(15);
            const [papelaoKg, setPapelaoKg] = useState(20);
            const [vidroKg, setVidroKg] = useState(5);
            const [oleoL, setOleoL] = useState(4);

            const [precoPet] = useState(2.50);
            const [precoAluminio] = useState(8.00);
            const [precoFerro] = useState(1.20);
            const [precoPapelao] = useState(0.70);
            const [precoVidro] = useState(0.35);
            const [precoOleo] = useState(3.00);

            const [btConectado, setBtConectado] = useState(false);
            const [btStatus, setBtStatus] = useState("Desconectado");

            const totalPet = petKg * precoPet;
            const totalAluminio = aluminioKg * precoAluminio;
            const totalFerro = ferroKg * precoFerro;
            const totalPapelao = papelaoKg * precoPapelao;
            const totalVidro = vidroKg * precoVidro;
            const totalOleo = oleoL * precoOleo;

            const valorTotalReciclagem = totalPet + totalAluminio + totalFerro + totalPapelao + totalVidro + totalOleo;
            const pesoTotalKg = Number(petKg) + Number(aluminioKg) + Number(ferroKg) + Number(papelaoKg) + Number(vidroKg) + Number(oleoL);

            const aguaEconomizadaL = (petKg * 24) + (aluminioKg * 40) + (papelaoKg * 15);
            const co2EvitadoKg = (petKg * 1.5) + (aluminioKg * 9.0) + (ferroKg * 1.8) + (papelaoKg * 0.9);
            const volumeDesobstruidoM3 = (pesoTotalKg * 0.0035).toFixed(2);

            const conectarBalancaBT = async () => {
                if (!navigator.bluetooth) {
                    if (typeof showToast === 'function') showToast("Web Bluetooth não suportado.");
                    return;
                }
                try {
                    setBtStatus("Buscando balança...");
                    const device = await navigator.bluetooth.requestDevice({
                        acceptAllDevices: true,
                        optionalServices: ['battery_service', '0000181d-0000-1000-8000-00805f9b34fb']
                    });
                    setBtConectado(true);
                    setBtStatus(`Conectado: ${device.name || 'Balança BT'}`);
                    if (typeof showToast === 'function') showToast(`Balança pareada: ${device.name || 'OK'}`);
                } catch(e) {
                    setBtConectado(false);
                    setBtStatus("Desconectado");
                    if (typeof showToast === 'function') showToast("Conexão Bluetooth cancelada.");
                }
            };

            const gerarReciboColeta = () => {
                const prot = `REC-SOL-${Math.floor(Math.random() * 89999 + 10000)}`;
                const textoRecibo = `[COMPROVANTE DE PESAGEM E ECONOMIA CIRCULAR]
Protocolo: ${prot}
Local: Mesquita / Baixada Fluminense (GADE)
Peso Total Acumulado: ${pesoTotalKg.toFixed(1)} KG / Litros

DETALHAMENTO DO LOTE:
- PET: ${petKg} kg (R$ ${totalPet.toFixed(2)})
- Alumínio: ${aluminioKg} kg (R$ ${totalAluminio.toFixed(2)})
- Ferro: ${ferroKg} kg (R$ ${totalFerro.toFixed(2)})
- Papelão: ${papelaoKg} kg (R$ ${totalPapelao.toFixed(2)})
- Vidro: ${vidroKg} kg (R$ ${totalVidro.toFixed(2)})
- Óleo Usado: ${oleoL} L (R$ ${totalOleo.toFixed(2)})

VALOR ESTIMADO: R$ ${valorTotalReciclagem.toFixed(2)}
IMPACTO ECOLÓGICO:
- Água poupada: ${aguaEconomizadaL.toFixed(0)} Litros
- CO2 evitado: ${co2EvitadoKg.toFixed(1)} Kg
- Prevenção de Alagamento: ~${volumeDesobstruidoM3} m3

GADE - Grupo a Chave da Esperança - Sarah AI Nexus V11.4`;

                if (navigator.clipboard) {
                    navigator.clipboard.writeText(textoRecibo);
                    if (typeof showToast === 'function') showToast(`Recibo ${prot} copiado.`);
                }
                window.open(`https://api.whatsapp.com/send?text=${encodeURIComponent(textoRecibo)}`, '_blank');
            };

            return (
                <div className="space-y-4 max-w-4xl mx-auto font-mono">
                    <div className="cyber-card p-5 sm:p-6 rounded-[28px] shadow-xl space-y-5 border border-cyberCyan/40">
                        <div className="flex items-center justify-between border-b border-cyberCyan/25 pb-3">
                            <div className="space-y-0.5">
                                <h2 className="font-display text-xs font-black text-white tracking-widest flex items-center gap-2">
                                    <span className="text-cyberCyan">[BALANÇA]</span> CIDADÃO SENSOR - BALANÇA DIGITAL &amp; ESG
                                </h2>
                                <p className="text-[9px] font-mono text-cyberCyan font-bold">TECNOLOGIA SOCIAL - ECONOMIA CIRCULAR &amp; DRENAGEM</p>
                            </div>
                            <button onClick={onGoToDashboard} className="cyber-button text-[10px] py-2 px-4">PAINEL</button>
                        </div>

                        <div className="bg-void/90 border border-cyberCyan/30 rounded-2xl p-3.5 flex flex-col sm:flex-row items-center justify-between gap-3 shadow-inner">
                            <div className="flex items-center gap-2.5">
                                <span className={`w-3 h-3 rounded-full ${btConectado ? 'bg-cyberGreen animate-ping' : 'bg-cyberRose'}`}></span>
                                <div>
                                    <span className="text-[10px] font-black text-white block">HARDWARE DE PESAGEM BLUETOOTH</span>
                                    <span className="text-[8px] text-slate-400 font-bold">{btStatus}</span>
                                </div>
                            </div>
                            <button onClick={conectarBalancaBT} className={`cyber-button text-[9px] py-2 px-4 ${btConectado ? '!border-cyberGreen !text-cyberGreen' : ''}`}>
                                {btConectado ? 'SISTEMA PAREADO' : 'CONECTAR HARDWARE BT'}
                            </button>
                        </div>

                        <div className="bg-void/90 border border-cyberCyan/40 rounded-2xl p-4 space-y-4 shadow-inner">
                            <div className="flex items-center justify-between border-b border-cyberCyan/30 pb-2">
                                <span className="text-xs font-black text-cyberCyan uppercase tracking-wider">CONTROLE DE TRIAGEM DE RESÍDUOS</span>
                                <span className="text-[9px] px-2.5 py-0.5 rounded-full bg-cyberCyan/20 text-cyberCyan border border-cyberCyan/40 font-bold">TOTAL: {pesoTotalKg.toFixed(1)} KG/L</span>
                            </div>

                            <div className="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-3">
                                <div className="bg-deepSpace/90 border border-cyan-400/30 rounded-xl p-3 space-y-2">
                                    <div className="flex justify-between items-center text-[10px] font-bold text-cyan-300">
                                        <span>PET ({petKg} kg)</span>
                                        <span className="text-white">R$ {totalPet.toFixed(2)}</span>
                                    </div>
                                    <input type="range" min="0" max="150" step="1" value={petKg} onChange={e => setPetKg(Number(e.target.value))} className="w-full accent-cyan-400 cursor-pointer touch-manipulation" />
                                </div>

                                <div className="bg-deepSpace/90 border border-blue-400/30 rounded-xl p-3 space-y-2">
                                    <div className="flex justify-between items-center text-[10px] font-bold text-blue-300">
                                        <span>ALUMÍNIO ({aluminioKg} kg)</span>
                                        <span className="text-white">R$ {totalAluminio.toFixed(2)}</span>
                                    </div>
                                    <input type="range" min="0" max="80" step="0.5" value={aluminioKg} onChange={e => setAluminioKg(Number(e.target.value))} className="w-full accent-blue-400 cursor-pointer touch-manipulation" />
                                </div>

                                <div className="bg-deepSpace/90 border border-amber-400/30 rounded-xl p-3 space-y-2">
                                    <div className="flex justify-between items-center text-[10px] font-bold text-amber-300">
                                        <span>FERRO ({ferroKg} kg)</span>
                                        <span className="text-white">R$ {totalFerro.toFixed(2)}</span>
                                    </div>
                                    <input type="range" min="0" max="300" step="1" value={ferroKg} onChange={e => setFerroKg(Number(e.target.value))} className="w-full accent-amber-400 cursor-pointer touch-manipulation" />
                                </div>

                                <div className="bg-deepSpace/90 border border-yellow-600/30 rounded-xl p-3 space-y-2">
                                    <div className="flex justify-between items-center text-[10px] font-bold text-yellow-500">
                                        <span>PAPELÃO ({papelaoKg} kg)</span>
                                        <span className="text-white">R$ {totalPapelao.toFixed(2)}</span>
                                    </div>
                                    <input type="range" min="0" max="250" step="1" value={papelaoKg} onChange={e => setPapelaoKg(Number(e.target.value))} className="w-full accent-yellow-500 cursor-pointer touch-manipulation" />
                                </div>

                                <div className="bg-deepSpace/90 border border-emerald-400/30 rounded-xl p-3 space-y-2">
                                    <div className="flex justify-between items-center text-[10px] font-bold text-emerald-300">
                                        <span>VIDRO ({vidroKg} kg)</span>
                                        <span className="text-white">R$ {totalVidro.toFixed(2)}</span>
                                    </div>
                                    <input type="range" min="0" max="100" step="1" value={vidroKg} onChange={e => setVidroKg(Number(e.target.value))} className="w-full accent-emerald-400 cursor-pointer touch-manipulation" />
                                </div>

                                <div className="bg-deepSpace/90 border border-orange-400/30 rounded-xl p-3 space-y-2">
                                    <div className="flex justify-between items-center text-[10px] font-bold text-orange-300">
                                        <span>ÓLEO USADO ({oleoL} L)</span>
                                        <span className="text-white">R$ {totalOleo.toFixed(2)}</span>
                                    </div>
                                    <input type="range" min="0" max="50" step="0.5" value={oleoL} onChange={e => setOleoL(Number(e.target.value))} className="w-full accent-orange-400 cursor-pointer touch-manipulation" />
                                </div>
                            </div>

                            <div className="bg-commandPanel/90 border border-cyberGreen/40 rounded-xl p-3.5 space-y-2">
                                <span className="text-[9px] font-black text-cyberGreen uppercase tracking-widest block">PAINEL DE IMPACTO ECOLÓGICO</span>
                                <div className="grid grid-cols-3 gap-2 text-center font-mono">
                                    <div className="bg-void/80 border border-cyberGreen/20 p-2 rounded-lg">
                                        <div className="text-[7px] text-slate-400">ÁGUA POUPADA</div>
                                        <div className="text-xs font-bold text-cyberGreen">{aguaEconomizadaL.toFixed(0)} L</div>
                                    </div>
                                    <div className="bg-void/80 border border-cyberGreen/20 p-2 rounded-lg">
                                        <div className="text-[7px] text-slate-400">CO2 EVITADO</div>
                                        <div className="text-xs font-bold text-cyberCyan">{co2EvitadoKg.toFixed(1)} Kg</div>
                                    </div>
                                    <div className="bg-void/80 border border-cyberGreen/20 p-2 rounded-lg">
                                        <div className="text-[7px] text-slate-400">RALOS PRESERVADOS</div>
                                        <div className="text-xs font-bold text-cyberAmber">~{volumeDesobstruidoM3} m3</div>
                                    </div>
                                </div>
                            </div>

                            <div className="bg-gradient-to-r from-deepSpace via-commandPanel to-deepSpace border border-cyberCyan/50 rounded-xl p-4 flex flex-col sm:flex-row items-center justify-between gap-3">
                                <div className="space-y-0.5 text-center sm:text-left">
                                    <span className="text-[9px] text-slate-400 uppercase tracking-widest block">VALOR ESTIMADO DO LOTE</span>
                                    <span className="text-xl font-black text-cyberCyan font-display">R$ {valorTotalReciclagem.toFixed(2)}</span>
                                </div>
                                <button onClick={gerarReciboColeta} className="cyber-button-solid text-[10px]">
                                    GERAR RECIBO &amp; TRANSMITIR WHATSAPP
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            );
        }

        // MÓDULO DE ADMINISTRAÇÃO E CLOUDFLARE WORKERS
        function AdminAreaRestritaModule({ showToast, onClose }) {
            const [pin, setPin] = useState("");
            const [unlocked, setUnlocked] = useState(false);
            const [workerUrlInput, setWorkerUrlInput] = useState(() => localStorage.getItem("raru_cloudflare_worker_url") || "");

            const salvarWorkerUrl = (e) => {
                e.preventDefault();
                localStorage.setItem("raru_cloudflare_worker_url", workerUrlInput);
                showToast("URL do Worker / Endpoint Cloudflare Salva!");
            };

            return (
                <div className="cyber-card p-4 space-y-4 border border-cyberCyan/50 font-mono">
                    <div className="flex justify-between items-center border-b border-cyberCyan/30 pb-2">
                        <h3 className="text-xs font-black text-cyberCyan uppercase">ÁREA RESTRITA • CHAVE DE ENVELOPE DA SARAH &amp; WORKERS</h3>
                        <button onClick={onClose} className="cyber-button-danger text-[9px] py-1 px-3">FECHAR</button>
                    </div>

                    {!unlocked ? (
                        <form onSubmit={(e) => { e.preventDefault(); if(pin==="303500"){ setUnlocked(true); showToast("Desbloqueado."); } else showToast("PIN Incorreto."); }} className="flex gap-2">
                            <input type="password" placeholder="PIN (303500)" value={pin} onChange={e=>setPin(e.target.value)} className="flex-1 bg-void border border-cyberCyan/40 rounded-xl p-2.5 text-xs text-white text-center" />
                            <button type="submit" className="cyber-button text-xs py-2 px-4">ENTRAR</button>
                        </form>
                    ) : (
                        <div className="space-y-4">
                            <form onSubmit={salvarWorkerUrl} className="space-y-2 bg-void/90 p-3 rounded-xl border border-cyberCyan/30">
                                <label className="text-[9px] text-cyberCyan font-bold uppercase block">ENDPOINT DO CLOUDFLARE WORKER (ENVELOPE ENCRYPTION):</label>
                                <input type="text" value={workerUrlInput} onChange={e=>setWorkerUrlInput(e.target.value)} placeholder="https://sarah-worker.sua-conta.workers.dev/api/sarah/envelope" className="w-full bg-deepSpace border border-cyberCyan/40 rounded-xl p-2.5 text-xs text-white" />
                                <button type="submit" className="cyber-button-solid w-full text-xs py-2.5">SALVAR CONFIGURAÇÃO DE NUVEM</button>
                            </form>
                        </div>
                    )}
                </div>
            );
        }

        // APP PRINCIPAL
        function App() {
            const [activeTab, setActiveTab] = useState("radar");
            const [toast, setToast] = useState(null);

            const showToast = (msg) => { setToast(msg); setTimeout(() => setToast(null), 3000); };

            const NAV_TABS = [
                { id: 'radar', iconComponent: <IconRadar className="w-4 h-4" />, label: 'Radar' },
                { id: 'balanca', iconComponent: <IconBalanca className="w-4 h-4" />, label: 'Balança' },
                { id: 'admin', iconComponent: <IconAdmin className="w-4 h-4" />, label: 'Nuvem' }
            ];

            return (
                <div className="seu-container-raru">
                    {toast && <div className="fixed top-4 left-1/2 -translate-x-1/2 z-50 cyber-card px-4 py-2 text-xs text-cyberCyan font-black shadow-2xl border border-cyberCyan/60">{toast}</div>}
                    
                    <header className="cyber-card sticky top-0 z-30 w-full px-3 py-2 border-b border-cyberCyan/40 flex items-center justify-between mb-2">
                        <div className="flex items-center gap-2">
                            <div>
                                <h1 className="font-display text-[10px] font-black text-white leading-none">Sarah AI Nexus V11.4</h1>
                                <p className="text-[7px] text-cyberCyan font-mono mt-0.5">Projeto Cidadão Sensor • Mesquita</p>
                            </div>
                        </div>
                    </header>

                    <main className="w-full py-2 space-y-4 pb-28">
                        {activeTab === "radar" && <RadarMeteorologicoModule />}
                        {activeTab === "balanca" && <ModuloCidadaoSensorModule onGoToDashboard={() => setActiveTab("radar")} showToast={showToast} />}
                        {activeTab === "admin" && <AdminAreaRestritaModule showToast={showToast} onClose={() => setActiveTab("radar")} />}
                    </main>

                    <footer className="cyber-card fixed bottom-0 left-0 right-0 z-40 border-t border-cyberCyan/40 px-2 py-2.5 flex items-center justify-around max-w-[640px] mx-auto rounded-t-2xl pb-[env(safe-area-inset-bottom)]">
                        {NAV_TABS.map(tab => (
                            <button key={tab.id} onClick={() => setActiveTab(tab.id)} className={`flex flex-col items-center justify-center gap-0.5 cursor-pointer flex-1 py-1.5 transition touch-manipulation rounded-xl ${activeTab === tab.id ? 'text-cyberCyan bg-cyberCyan/15 border border-cyberCyan/40 shadow-[0_0_8px_rgba(0,242,254,0.3)]' : 'text-slate-400 hover:text-white border border-transparent'}`}>
                                {tab.iconComponent}
                                <span className="text-[7px] font-black truncate w-full text-center tracking-tighter px-0.5">{tab.label}</span>
                            </button>
                        ))}
                    </footer>
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
