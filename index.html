                10
            );
            if (hour >= 0 && hour < 5) return "Boa madrugada";
            if (hour >= 5 && hour < 12) return "Bom dia";
            if (hour >= 12 && hour < 18) return "Boa tarde";
            return "Boa noite";

        }

        function AdvancedLeafletRadar() {
            React.useEffect(() => {
                const mapContainer = document.getElementById('advanced-map');
                if (!mapContainer || mapContainer._leaflet_id) return;

                const map = L.map('advanced-map', { 
                    zoomControl: false, 
                    minZoom: 10, 
                    maxZoom: 14 
                }).setView([-22.783, -43.429], 12);

                L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', { maxZoom: 14 }).addTo(map);

                L.polyline([
                    [-22.82, -43.48],
                    [-22.783, -43.429],
                    [-22.75, -43.38]
                ], { color: '#00f3ff', weight: 4, opacity: 0.85 }).addTo(map);

                const sectors = [
                    { name: 'Setor Regional Vila Sebinho / Rocha Sobrinho (Bacia Sarapuí)', lat: -22.765, lng: -43.415, status: 'Normal', color: '#00ff88' },
                    { name: 'Setor Regional Sul (Bacias Dona Eugênia e Prata)', lat: -22.800, lng: -43.440, status: 'Monitoramento Preventivo', color: '#f59e0b' }
                ];

                sectors.forEach(s => {
                    const customIcon = L.divIcon({
                        html: `<div style="background:${s.color}; width:30px; height:30px; border-radius:50%; border:2px solid #ffffff; display:flex; align-items:center; justify-content:center; color:#030712; font-weight:bold; font-size:10px; box-shadow: 0 0 12px ${s.color};">●</div>`,
                        iconSize: [30, 30]
                    });
                    L.marker([s.lat, s.lng], { icon: customIcon }).addTo(map).bindPopup(`<b>${s.name}</b><br>Status: ${s.status}`);
                });

                return () => {
                    map.remove();
                };
            }, []);

            return (
                <div className="relative w-full h-full min-h-[460px] rounded-2xl overflow-hidden border-2 border-cyberCyan/50 shadow-2xl bg-slate-950">
                    <div id="advanced-map" className="w-full h-full min-h-[460px]"></div>
                    <div className="absolute top-3 left-3 z-[1000] bg-[#030712]/90 border border-cyberCyan/50 px-3 py-1 rounded-xl font-mono text-[11px] text-cyan-300 shadow-md backdrop-blur-md flex items-center gap-2">
                        <span className="w-2.5 h-2.5 rounded-full bg-emeraldGlow animate-ping"></span>
                        RADAR HIDROMETEOROLÓGICO (SARAPUÍ, DONA EUGÊNIA E PRATA)
                    </div>
                </div>
            );
        }

        function App() {
            const [darkMode, setDarkMode] = React.useState(true);
            const [soundEnabled, setSoundEnabled] = React.useState(true);
            const [isSpeaking, setIsSpeaking] = React.useState(false);
            const [isListening, setIsListening] = React.useState(false);
            const [isOnline, setIsOnline] = React.useState(navigator.onLine);
            const [liveWeather, setLiveWeather] = React.useState(null);
            const [hourlyForecast, setHourlyForecast] = React.useState(null);
            const [userCoords, setUserCoords] = React.useState({ lat: -22.7827, lng: -43.4073 });
            
            const [isLoadingSplash, setIsLoadingSplash] = React.useState(true);
            const [activeTab, setActiveTab] = React.useState("chat");
            
            const [termsOpen, setTermsOpen] = React.useState(false);
            const [shareModalOpen, setShareModalOpen] = React.useState(false);
            const [installModalOpen, setInstallModalOpen] = React.useState(false);
            const [actionPlanOpen, setActionPlanOpen] = React.useState(false);
            const [pinInput, setPinInput] = React.useState("");
            const [isPlanUnlocked, setIsPlanUnlocked] = React.useState(false);
            const [accessMode, setAccessMode] = React.useState("restricted");
            
            const [mediaList, setMediaList] = React.useState(() => {
                try {
                    const saved = localStorage.getItem("sarah_media_list_v52_persistent");
                    return saved ? JSON.parse(saved) : [];
                } catch {
                    return [];
                }
            });

            React.useEffect(() => {
                try {
                    localStorage.setItem("sarah_media_list_v52_persistent", JSON.stringify(mediaList));
                } catch (e) {
                    console.warn("Armazenamento local cheio", e);
                }
            }, [mediaList]);

            const [selectedCategory, setSelectedCategory] = React.useState("Laudo Técnico / Vistoria");
            const [toastMessage, setToastMessage] = React.useState(null);
            const [fontSizeScale, setFontSizeScale] = React.useState(100);
            const [deferredPrompt, setDeferredPrompt] = React.useState(null);
            
            const [termsAccepted, setTermsAccepted] = React.useState(
                () => localStorage.getItem("sarah_terms_accepted_v52") === "1"
            );
            const [check1, setCheck1] = React.useState(false);
            const [check2, setCheck2] = React.useState(false);

            const [messages, setMessages] = React.useState([]);
            const [input, setInput] = React.useState("");
            const [isLoadingChat, setIsLoadingChat] = React.useState(false);
            const [hasIntroduced, setHasIntroduced] = React.useState(
                () => localStorage.getItem("sarah_introduced_v52") === "1"
            );

            const speechIdRef = React.useRef(0);
            const voiceTimerRef = React.useRef(null);
            const voicesRef = React.useRef([]);
            const chartRef = React.useRef(null);
            const chartInstanceRef = React.useRef(null);

            const showToast = (msg) => {
                setToastMessage(msg);
                setTimeout(() => setToastMessage(null), 3500);
            };

            React.useEffect(() => {
                const splashTimer = setTimeout(() => {
                    setIsLoadingSplash(false);
                }, 2400);
                return () => clearTimeout(splashTimer);
            }, []);

            React.useEffect(() => {
                const handleOnline = () => { setIsOnline(true); showToast("🌐 Rede reconectada com sucesso!"); };
                const handleOffline = () => { setIsOnline(false); showToast("⚠️ Conexão perdida. A operar em modo offline."); };
                window.addEventListener('online', handleOnline);
                window.addEventListener('offline', handleOffline);
                return () => {
                    window.removeEventListener('online', handleOnline);
                    window.removeEventListener('offline', handleOffline);
                };
            }, []);

            React.useEffect(() => {
                document.documentElement.style.fontSize = `${fontSizeScale}%`;
            }, [fontSizeScale]);

            React.useEffect(() => {
                window.addEventListener('beforeinstallprompt', (e) => {
                    e.preventDefault();
                    setDeferredPrompt(e);
                });
            }, []);

            const handleInstallApp = async () => {
                if (deferredPrompt) {
                    deferredPrompt.prompt();
                    const { outcome } = await deferredPrompt.userChoice;
                    if (outcome === 'accepted') {
                        setDeferredPrompt(null);
                        showToast("🎉 Aplicação instalada com sucesso!");
                    }
                } else {
                    setInstallModalOpen(true);
                }
            };

            const carregarVozes = () => {
                if ("speechSynthesis" in window) {
                    voicesRef.current = window.speechSynthesis.getVoices();
                }
            };

            React.useEffect(() => {
                if (!("speechSynthesis" in window)) return;
                carregarVozes();
                window.speechSynthesis.onvoiceschanged = carregarVozes;
                return () => {
                    window.speechSynthesis.cancel();
                    window.speechSynthesis.onvoiceschanged = null;
                };
            }, []);

            const limparTextoParaFala = (text) => {
                return String(text)
                    .replace(/[#*_`~]/g, "")
                    .replace(/\[(.*?)\]\(.*?\)/g, "$1")
                    .replace(/https?:\/\/\S+/g, "")
                    .replace(/\s+/g, " ")
                    .trim();
            };

            const escolherMelhorVoz = () => {
                const voices = voicesRef.current.length
                    ? voicesRef.current
                    : window.speechSynthesis.getVoices();
                
                const preferidas = [
                    "Microsoft Francisca Online (Natural) - Portuguese (Brazil)",
                    "Microsoft Maria",
                    "Google português do Brasil",
                    "Google Português do Brasil",
                    "Luciana",
                    "Felipe"
                ];

                for (let pref of preferidas) {
                    const match = voices.find(v => v.name.toLowerCase().includes(pref.toLowerCase()));
                    if (match) return match;
                }

                return (
                    voices.find((voice) => voice.lang.toLowerCase() === "pt-br" && (voice.name.toLowerCase().includes("natural") || voice.name.toLowerCase().includes("neural"))) ||
                    voices.find((voice) => voice.lang.toLowerCase() === "pt-br") ||
                    voices.find((voice) => voice.lang.toLowerCase().startsWith("pt")) ||
                    voices[0]
                );
            };

            const stopSpeaking = () => {
                speechIdRef.current += 1;
                if (voiceTimerRef.current) {
                    clearTimeout(voiceTimerRef.current);
                    voiceTimerRef.current = null;
                }
                if ("speechSynthesis" in window) {
                    window.speechSynthesis.cancel();
                }
                setIsSpeaking(false);
            };

            const speakText = (text) => {
                if (!soundEnabled || !("speechSynthesis" in window)) return;
                const cleanText = limparTextoParaFala(text);
                if (!cleanText) return;
                stopSpeaking();
                const currentId = speechIdRef.current;
                voiceTimerRef.current = setTimeout(() => {
                    if (currentId !== speechIdRef.current) return;
                    const utterance = new SpeechSynthesisUtterance(cleanText);
                    const voice = escolherMelhorVoz();
                    utterance.lang = "pt-BR";
                    utterance.voice = voice || null;
                    utterance.rate = 0.95;
                    utterance.pitch = 1.02;
                    utterance.volume = 1;
                    utterance.onstart = () => {
                        if (currentId === speechIdRef.current) setIsSpeaking(true);
                    };
                    utterance.onend = () => {
                        if (currentId === speechIdRef.current) setIsSpeaking(false);
                    };
                    utterance.onerror = () => setIsSpeaking(false);
                    window.speechSynthesis.speak(utterance);
                }, 200);
            };

            React.useEffect(() => {
                if (!termsAccepted || hasIntroduced || isLoadingSplash) return;
                const greeting = getBrasiliaGreeting();
                const presentation = `${greeting}, sou a SARAH IA Core PRO, seu núcleo inteligente de prevenção e monitoramento da Defesa Civil Comunitária. Prevenção não é mídia: é gente atenta. Sistemas ativados com sucesso.`;
                const timer = setTimeout(() => {
                    if (!soundEnabled) return;
                    setHasIntroduced(true);
                    localStorage.setItem("sarah_introduced_v52", "1");
                    speakText(presentation);
                }, 700);
                return () => clearTimeout(timer);
            }, [termsAccepted, hasIntroduced, soundEnabled, isLoadingSplash]);

            const shareMessageText = "App de Prevenção e apoio meteorológico comunitário automatizado, Sarah IA System Group https://phantrorfirmo08-alt.github.io/PROJETO-CIDAD-O-SENSOR-01/. 🆘 🛡️";

            const handleShareLink = async () => {
                if (navigator.share) {
                    try {
                        await navigator.share({
                            title: 'SARAH IA Core v5.2 PRO • Defesa Civil Comunitária',
                            text: shareMessageText,
                            url: 'https://phantrorfirmo08-alt.github.io/PROJETO-CIDAD-O-SENSOR-01/',
                        });
                        return;
                    } catch (err) {
                        console.log("Partilha cancelada");
                    }
                }
                setShareModalOpen(true);
            };

            const compartilharWhatsApp = () => {
                const text = encodeURIComponent(shareMessageText);
                window.open(`https://api.whatsapp.com/send?text=${text}`, '_blank');
            };

            const compartilharTelegram = () => {
                const text = encodeURIComponent(shareMessageText);
                window.open(`https://t.me/share/url?url=${encodeURIComponent("https://phantrorfirmo08-alt.github.io/PROJETO-CIDAD-O-SENSOR-01/")}&text=${text}`, '_blank');
            };

            const copiarLinkComIcone = async () => {
                if (navigator.clipboard) {
                    await navigator.clipboard.writeText(shareMessageText);
                    showToast("🔗 Link e ícone copiados com sucesso!");
                    setShareModalOpen(false);
                }
            };

            React.useEffect(() => {
                fetch(
                    `https://api.open-meteo.com/v1/forecast?latitude=${userCoords.lat}&longitude=${userCoords.lng}&current=temperature_2m,relative_humidity_2m,precipitation,weather_code,wind_speed_10m&hourly=temperature_2m,precipitation_probability,precipitation`
                )
                    .then((response) => response.json())
                    .then((data) => {
                        if (data && data.current) setLiveWeather(data.current);
                        if (data && data.hourly) setHourlyForecast(data.hourly);
                    })
                    .catch((error) => console.warn("Clima indisponível:", error));
            }, [userCoords]);

            React.useEffect(() => {
                document.documentElement.classList.toggle("dark", darkMode);
                document.documentElement.classList.toggle("light", !darkMode);
            }, [darkMode]);

            React.useEffect(() => {
                if (activeTab !== "telemetry" || !chartRef.current) return;

                const ctx = chartRef.current.getContext("2d");
                const nowIndex = new Date().getHours();
                const labels = hourlyForecast && hourlyForecast.time 
                    ? hourlyForecast.time.slice(nowIndex, nowIndex + 12).map(t => t.split("T")[1]) 
                    : ["00:00", "02:00", "04:00", "06:00", "08:00", "10:00", "12:00", "14:00", "16:00", "18:00", "20:00", "22:00"];
                
                const tempData = hourlyForecast && hourlyForecast.temperature_2m 
                    ? hourlyForecast.temperature_2m.slice(nowIndex, nowIndex + 12) 
                    : [24, 23.5, 23, 22.5, 24, 27, 29, 31, 30, 28, 26, 25];

                const precipData = hourlyForecast && hourlyForecast.precipitation 
                    ? hourlyForecast.precipitation.slice(nowIndex, nowIndex + 12)

                        <div className="fixed inset-0 bg-[#030712]/85 backdrop-blur-md z-50 flex items-center justify-center p-4">
                            <div className="glass-dark border border-cyberCyan/40 w-full max-w-md rounded-3xl shadow-[0_0_40px_rgba(0,243,255,0.3)] overflow-hidden flex flex-col">
                                <div className="bg-[#030712] px-5 py-3.5 border-b border-cyberCyan/30 flex justify-between items-center">
                                    <h3 className="font-mono text-cyberCyan text-sm font-bold flex items-center gap-2"><span>🔗</span> Partilhar Aplicação</h3>
                                    <button onClick={() => setShareModalOpen(false)} className="text-slate-400 hover:text-white font-mono text-xs px-3 py-1 rounded-lg bg-[#030712] border border-slate-700 transition cursor-pointer">✕</button>
                                </div>
                                <div className="p-6 bg-[#060f1e]/90 text-xs sm:text-sm text-slate-300 flex flex-col items-center text-center space-y-4">
                                    <div className="w-full grid grid-cols-2 gap-3">

                                        <button onClick={compartilharTelegram} className="py-3 px-4 bg-sky-600 hover:bg-sky-500 text-white font-mono text-xs font-bold rounded-xl transition cursor-pointer">Telegram</button>
                                    </div>
                                    <button onClick={copiarLinkComIcone} className="w-full py-3 bg-[#030712] hover:bg-slate-900 border border-cyberCyan/40 text-cyan-300 font-mono text-xs font-bold rounded-xl transition cursor-pointer">Copiar Link</button>
                                </div>
                            </div>
                        </div>
                    )}

                    {termsOpen && (
                        <div className="fixed inset-0 bg-[#030712]/85 backdrop-blur-md z-50 flex items-center justify-center p-4">
                            <div className="glass-dark border border-cyberCyan/40 w-full max-w-xl rounded-3xl shadow-[0_0_40px_rgba(0,243,255,0.3)] overflow-hidden">
                                <div className="bg-[#030712] px-5 py-3.5 border-b border-cyberCyan/30 flex justify-between items-center">
                                    <h3 className="font-mono text-cyberCyan text-sm font-bold flex items-center gap-2"><CyberShieldIcon className="w-5 h-5" /> Conformidade & Privacidade</h3>
                                    <button onClick={() => setTermsOpen(false)} className="text-slate-400 hover:text-white font-mono text-xs px-3 py-1 rounded-lg bg-[#030712] border border-slate-700 transition cursor-pointer">✕ Fechar</button>
                                </div>
                                <div className="p-6 bg-[#060f1e]/90 text-xs sm:text-sm text-slate-300 space-y-3 leading-relaxed font-sans">
                                    <p>O sistema opera com anonimização geográfica e restrição de zoom para salvaguardar a segurança dos residentes em Mesquita.</p>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* Rodapé Marquee com Fundo Lilás Vibrante (#4a154b) sem falhas de sintaxe */}
                    <div className="bg-vibrantLilac border-t-2 border-purple-500 py-2.5 overflow-hidden shadow-inner whitespace-nowrap">
                        <marquee behavior="scroll" direction="left" scrollamount="5" className="font-mono text-xs text-purple-200 font-bold tracking-wide">
                            🛡️ Grupo Comunitário A Chave da Esperança • Plano de Ação: Todos Unidos, Todos Protegidos • EMERGÊNCIAS: Defesa Civil (199 / 21 4040-1772) • Bombeiro (193) • Alertas ZAP 📲 (21) 97299-3223 • Cras de Rocha Sobrinho 21 2042-8931 • Seja voluntário servir é prevenir sempre <span className="text-yellow-300">+</span> espaço reservado aos patrocinadores • Promovendo ciência cidadã • 1° Edição operacional El Ninõ • GACE • Conceitos - Mesquita do Amanhã e Cidades resilientes (ONU)
                        </marquee>
                    </div>

                    <footer className="bg-[#060f1e] border-t border-cyberCyan/40 py-4 px-4 text-center text-xs font-mono text-cyberCyan space-y-1 shadow-inner">
                        <div className="font-bold">Defesa Civil Comunitária Cidadão Sensor • SARAH IA Core v5.2 PRO</div>
                        <div className="text-slate-300">Grupo Comunitário A Chave da Esperança • Mesquita/RJ • Todos os direitos reservados 2024–2026</div>
                    </footer>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById("root"));
        root.render(<App />);

        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js').catch(() => {});
            });
        }
    </script>
</body>
</html>
