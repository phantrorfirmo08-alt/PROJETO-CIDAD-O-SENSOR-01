function ModuloVideosModule({ localVideos, setLocalVideos, onGoToDashboard, showToast }) {
  const [urlInput, setUrlInput] = useState("");
  const [titleInput, setTitleInput] = useState("");
  const [activeVideo, setActiveVideo] = useState(null);

  const handleAddVideo = (e) => {
    e.preventDefault();
    if (!urlInput.trim()) { showToast("Insira um link de vídeo ou YouTube."); return; }
    let embedUrl = urlInput.trim();
    let type = 'direct';
    const ytMatch = embedUrl.match(/(?:youtube\.com\/(?:[^\/]+\/.+\/|(?:v|e(?:mbed)?)\/|.*[?&]v=)|youtu\.be\/)([^"&?\/\s]{11})/);
    if (ytMatch && ytMatch[1]) {
      embedUrl = `https://www.youtube.com/embed/${ytMatch[1]}`;
      type = 'youtube';
    }
    const newItem = { id: Date.now(), title: titleInput.trim() || `Vídeo Tático ${localVideos.length + 1}`, url: embedUrl, type };
    const updated = [newItem, ...localVideos];
    setLocalVideos(updated);
    try { localStorage.setItem('raru_local_videos', JSON.stringify(updated)); } catch (e) {}
    setUrlInput(""); setTitleInput("");
    showToast("Vídeo adicionado à galeria.");
  };

  const handleFileUpload = (e) => {
    const file = e.target.files[0];
    if (!file) return;
    if (!file.type.startsWith('video/')) { showToast("Selecione um arquivo de vídeo."); return; }
    const reader = new FileReader();
    reader.onload = (ev) => {
      const newItem = { id: Date.now(), title: file.name, url: ev.target.result, type: 'local' };
      const updated = [newItem, ...localVideos];
      setLocalVideos(updated);
      try { localStorage.setItem('raru_local_videos', JSON.stringify(updated)); } catch (e) {}
      showToast(`Vídeo "${file.name}" carregado.`);
    };
    reader.readAsDataURL(file);
  };

  const handleDeleteVideo = (id) => {
    const updated = localVideos.filter(v => v.id !== id);
    setLocalVideos(updated);
    try { localStorage.setItem('raru_local_videos', JSON.stringify(updated)); } catch (e) {}
    if (activeVideo && activeVideo.id === id) setActiveVideo(null);
    showToast("Vídeo removido.");
  };

  return (
    <div className="space-y-4 font-mono w-full max-w-6xl mx-auto">
      <div className="cyber-card p-5 space-y-5 border border-cyberCyan/60 shadow-2xl">
        <div className="flex items-center justify-between border-b border-cyberCyan/30 pb-3">
          <div>
            <h2 className="font-display text-sm sm:text-base font-black text-white tracking-widest uppercase">
              GALERIA DE VÍDEOS &amp; TRANSMISSÕES • {TITULO_OFICIAL_RARU}
            </h2>
            <p className="text-[10px] text-cyberCyan font-bold">MÍDIA LOCAL, LINKS E REGISTROS DE CAMPO</p>
          </div>
          <button type="button" onClick={onGoToDashboard} className="cyber-button text-[10px] py-2 px-3">PAINEL</button>
        </div>

        <form onSubmit={handleAddVideo} className="bg-void/90 border border-cyberCyan/35 rounded-2xl p-4 space-y-3">
          <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
            <input type="text" value={titleInput} onChange={e => setTitleInput(e.target.value)} placeholder="Título do vídeo..." className="bg-deepSpace border border-cyberCyan/35 rounded-xl p-2.5 text-xs text-white" />
            <input type="text" value={urlInput} onChange={e => setUrlInput(e.target.value)} placeholder="URL do YouTube ou vídeo (.mp4)..." className="bg-deepSpace border border-cyberCyan/35 rounded-xl p-2.5 text-xs text-white" />
          </div>
          <div className="flex flex-wrap gap-2">
            <button type="submit" className="cyber-button-solid text-[10px] py-2.5 px-4">ADICIONAR LINK</button>
            <label className="cyber-button text-[10px] py-2.5 px-4 cursor-pointer">
              CARREGAR DO DISPOSITIVO
              <input type="file" accept="video/*" onChange={handleFileUpload} className="hidden" />
            </label>
          </div>
        </form>

        {activeVideo && (
          <div className="bg-void border border-cyberCyan/50 rounded-2xl p-4 space-y-3">
            <div className="flex items-center justify-between">
              <span className="text-xs font-black text-cyberCyan uppercase">{activeVideo.title}</span>
              <button type="button" onClick={() => setActiveVideo(null)} className="cyber-button-danger text-[9px] py-1 px-3 !min-h-[30px]">FECHAR PLAYER</button>
            </div>
            <div className="aspect-video w-full rounded-xl overflow-hidden bg-black border border-cyberCyan/30">
              {activeVideo.type === 'youtube' ? (
                <iframe src={activeVideo.url} title={activeVideo.title} className="w-full h-full border-none" allowFullScreen />
              ) : (
                <video src={activeVideo.url} controls autoPlay playsInline className="w-full h-full" />
              )}
            </div>
          </div>
        )}

        <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-3">
          {localVideos.length === 0 ? (
            <div className="col-span-full bg-void/80 border border-dashed border-cyberCyan/30 rounded-2xl p-6 text-center text-xs text-slate-400">
              Nenhum vídeo salvo ainda. Adicione um link ou carregue um arquivo do seu dispositivo.
            </div>
          ) : (
            localVideos.map(v => (
              <div key={v.id} className="bg-void/90 border border-cyberCyan/35 rounded-xl p-3 space-y-2 flex flex-col justify-between">
                <div>
                  <span className="text-[9px] px-2 py-0.5 rounded bg-cyberCyan/15 text-cyberCyan font-bold uppercase">{v.type}</span>
                  <div className="text-xs font-bold text-white mt-1.5 break-words">{v.title}</div>
                </div>
                <div className="flex gap-2 pt-2">
                  <button type="button" onClick={() => setActiveVideo(v)} className="cyber-button flex-1 text-[9px] py-1.5 !min-h-[34px]">REPRODUZIR</button>
                  <button type="button" onClick={() => handleDeleteVideo(v.id)} className="cyber-button-danger text-[9px] py-1.5 px-2.5 !min-h-[34px]">X</button>
                </div>
              </div>
            ))
          )}
        </div>
      </div>
    </div>
  );
}

function SarahChatModal({ isOpen, onClose, userName, onAtualizarNome, abaAtual }) {
  const [messages, setMessages] = useState([]);
  const [inputText, setInputText] = useState("");
  const [isLoading, setIsLoading] = useState(false);
  const [isSpeaking, setIsSpeaking] = useState(false);

  const mensagensEndRef = useRef(null);

  useEffect(() => {
    if (isOpen && messages.length === 0) {
      const hora = new Date().getHours();
      const s = hora < 12 ? "Bom dia" : hora < 18 ? "Boa tarde" : "Boa noite";
      const mMesquita = ESTADO_CLIMA_AUTOMATICO_92.municipios["Mesquita"];
      const infoClima = mMesquita ? ` Em Mesquita: ${mMesquita.temp}, chuva ${mMesquita.chuva} (${mMesquita.probChuva}), vento ${mMesquita.vento}, ${mMesquita.risco}.` : "";
      const greeting = userName
        ? `${s}, ${userName}. Sou o ROBOT SARAH SYSTEM RARU do ${TITULO_OFICIAL_RARU} (${COMPLEMENTO_OFICIAL_RARU}) com monitoramento 24h nos 92 municípios, GOES-19 e RainViewer.${infoClima} Como posso ajudar agora?`
        : `${s}. Sou o ROBOT SARAH SYSTEM RARU do ${TITULO_OFICIAL_RARU} (${COMPLEMENTO_OFICIAL_RARU}) com monitoramento 24h nos 92 municípios, GOES-19 e RainViewer.${infoClima} Qual é o seu nome e o que você precisa?`;
      setMessages([{ sender: 'sarah', text: greeting }]);
      falarSarah(greeting, 0);
    }
  }, [isOpen, userName]);

  useEffect(() => {
    if (mensagensEndRef.current) mensagensEndRef.current.scrollIntoView({ behavior: 'smooth' });
  }, [messages, isLoading]);

  const handleSendMessage = async (e) => {
    if (e) e.preventDefault();
    if (!inputText.trim() || isLoading) return;
    const textToSend = inputText.trim();
    setInputText("");

    let nomeAtual = userName;
    const matchNome = textToSend.match(/(?:meu nome [ée]|me chamo|pode me chamar de|sou o|sou a)\s+([a-zà-ú]+)/i);
    if (matchNome && matchNome[1]) {
      nomeAtual = matchNome[1].charAt(0).toUpperCase() + matchNome[1].slice(1).toLowerCase();
      if (onAtualizarNome) onAtualizarNome(nomeAtual);
    }

    const updatedHistory = [...messages, { sender: 'user', text: textToSend }];
    setMessages(updatedHistory);
    setIsLoading(true);
    setIsSpeaking(false);

    try {
      const apiHistory = updatedHistory.map(m => ({
        role: m.sender === 'user' ? 'user' : 'assistant',
        content: m.text
      }));
      const dadosMesquita = ESTADO_CLIMA_AUTOMATICO_92.municipios["Mesquita"] || null;
      const aiResponseText = await chamarSarah('conversa', apiHistory, 'Mesquita', 'Rocha Sobrinho', abaAtual || 'dashboard', dadosMesquita, nomeAtual);
      const respostaSemAlexander = bloquearCalmaAlexander(aiResponseText);
      setMessages(prev => [...prev, { sender: 'sarah', text: respostaSemAlexander }]);
      setIsLoading(false);
      setIsSpeaking(true);
      falarSarah(respostaSemAlexander, 0);
      setTimeout(() => setIsSpeaking(false), 3500);
    } catch (error) {
      const fallback = nomeAtual
        ? `Falha temporária de conexão, ${nomeAtual}, mas os dados dos 92 municípios, GOES-19 e RainViewer seguem ativos. Tente novamente em instantes.`
        : `Falha temporária de conexão, mas os dados dos 92 municípios, GOES-19 e RainViewer seguem ativos. Qual é o seu nome?`;
      setMessages(prev => [...prev, { sender: 'sarah', text: fallback }]);
      setIsLoading(false);
    }
  };

  if (!isOpen) return null;

  return (
    <div className="fixed inset-0 z-[100] flex items-end sm:items-center justify-center bg-void/90 backdrop-blur-2xl p-2 sm:p-4" onClick={onClose}>
      <div className="cyber-card w-full max-w-lg rounded-3xl shadow-2xl overflow-hidden flex flex-col h-[85dvh] sm:h-[600px] border border-cyberCyan/60 font-mono text-slate-100" onClick={e => e.stopPropagation()}>
        <div className="flex items-center justify-between px-4 py-3 border-b border-cyberCyan/30 bg-deepSpace/95">
          <div className="flex items-center gap-3">
            <div className="w-10 h-10 rounded-full border border-cyberCyan overflow-hidden bg-void flex items-center justify-center shrink-0">
              <SarahLiveSVGAvatar isSpeaking={isSpeaking} />
            </div>
            <div>
              <h3 className="font-display text-xs font-black text-white tracking-wider uppercase">ROBOT SARAH SYSTEM RARU</h3>
              <p className="text-[9px] text-cyberCyan font-bold flex items-center gap-1.5">
                <span className="w-1.5 h-1.5 rounded-full bg-cyberGreen animate-ping"></span>
                <span>{COMPLEMENTO_OFICIAL_RARU} • 92 RJ</span>
              </p>
            </div>
          </div>
          <button type="button" onClick={onClose} className="cyber-button-danger text-xs py-1 px-3 !min-h-[32px]">FECHAR</button>
        </div>

        <div className="flex-1 overflow-y-auto p-4 space-y-3 bg-void/80">
          {messages.map((m, i) => (
            <div key={i} className={`flex flex-col max-w-[85%] rounded-2xl p-3 text-xs leading-relaxed permitir-selecao ${m.sender === 'user' ? 'self-end bg-cyberCyan/20 border border-cyberCyan/50 text-white' : 'self-start bg-commandPanel/90 border border-slate-700/80 text-slate-200'}`}>
              <span className="text-[8px] font-black uppercase text-cyberCyan mb-1">
                {m.sender === 'user' ? (userName || 'VOCÊ') : 'ROBOT SARAH SYSTEM RARU'}
              </span>
              <span>{m.text}</span>
            </div>
          ))}
          {isLoading && <div className="text-xs text-cyberCyan font-bold animate-pulse">ROBOT SARAH SYSTEM RARU processando telemetria e clima...</div>}
          <div ref={mensagensEndRef} />
        </div>

        <form onSubmit={handleSendMessage} className="p-3 bg-deepSpace/95 border-t border-cyberCyan/30 flex items-center gap-2">
          <input type="text" value={inputText} onChange={e => setInputText(e.target.value)} placeholder="Pergunte sobre chuva, radar, GOES-19, rotas ou diga seu nome..." className="flex-1 bg-void border border-cyberCyan/40 rounded-xl p-2.5 text-xs text-white font-mono permitir-selecao" />
          <button type="submit" disabled={isLoading} className="cyber-button-solid text-xs py-2.5 px-4 !min-h-[40px]">ENVIAR</button>
        </form>
      </div>
    </div>
  );
}

function ModalIdentificacaoPessoa({ isOpen, onClose, userName, onSalvarNome }) {
  const [nomeInput, setNomeInput] = useState(userName || "");

  useEffect(() => {
    setNomeInput(userName || "");
  }, [userName, isOpen]);

  if (!isOpen) return null;

  const handleSubmit = (e) => {
    e.preventDefault();
    const limpo = nomeInput.trim();
    onSalvarNome(limpo);
    onClose();
  };

  return (
    <div className="fixed inset-0 z-[130] flex items-center justify-center bg-void/90 backdrop-blur-2xl p-4" onClick={onClose}>
      <div className="cyber-card w-full max-w-md rounded-2xl p-5 border border-cyberCyan/60 font-mono space-y-4" onClick={e => e.stopPropagation()}>
        <div className="flex items-center justify-between border-b border-cyberCyan/30 pb-2">
          <h3 className="font-display text-xs font-black text-cyberCyan uppercase tracking-wider">IDENTIFICAÇÃO NA CONVERSA</h3>
          <button type="button" onClick={onClose} className="cyber-button-danger text-xs py-1 px-2.5 !min-h-[30px]">FECHAR</button>
        </div>
        <p className="text-xs text-slate-300 leading-relaxed">
          Informe o nome com o qual você quer ser chamado durante a conversa. Essa informação vale para o atendimento da sessão atual e não fixa um único nome padrão.
        </p>
        <form onSubmit={handleSubmit} className="space-y-3">
          <input
            type="text"
            value={nomeInput}
            onChange={(e) => setNomeInput(e.target.value)}
            placeholder="Ex: Ana, Carlos, Luiza..."
            className="w-full bg-void border border-cyberCyan/40 rounded-xl p-3 text-xs text-white font-mono permitir-selecao"
          />
          <div className="flex gap-2">
            <button type="submit" className="cyber-button-solid flex-1 text-xs py-2.5">SALVAR NOME</button>
            <button type="button" onClick={() => { onSalvarNome(""); onClose(); }} className="cyber-button text-xs py-2.5">LIMPAR</button>
          </div>
        </form>
      </div>
    </div>
  );
}

function App() {
  const [activeTab, setActiveTab] = useState('dashboard');
  const [isWallMode, setIsWallMode] = useState(false);
  const [toastMsg, setToastMsg] = useState(null);
  const [isSarahChatOpen, setIsSarahChatOpen] = useState(false);
  const [isWhoAmIOpen, setIsWhoAmIOpen] = useState(false);
  const [isNameModalOpen, setIsNameModalOpen] = useState(false);
  const [userName, setUserName] = useState(() => {
    try { return sessionStorage.getItem('raru_session_user_name') || ""; } catch (e) { return ""; }
  });

  const [localVideos, setLocalVideos] = useState(() => {
    try { return JSON.parse(localStorage.getItem('raru_local_videos') || '[]'); } catch (e) { return []; }
  });
  const [perfilVozId, setPerfilVozId] = useState(() => {
    try { return localStorage.getItem('raru_perfil_voz') || 'sarah'; } catch (e) { return 'sarah'; }
  });
  const [customTickerText, setCustomTickerText] = useState(() => {
    try { return localStorage.getItem('raru_custom_ticker') || `RARU NEXUS V11.2 PLUS — REDE AUTOMATIZADA DE RESILIÊNCIA URBANA • EDIÇÃO TEMPO & CLIMA • MONITORAMENTO 24H DOS 92 MUNICÍPIOS RJ, GOES-19 & RAINVIEWER • GRUPO A CHAVE DA ESPERANÇA / GADE • PROJETO CIDADÃO SENSOR`; } catch (e) { return `${TITULO_OFICIAL_RARU} — ${SUBTITULO_OFICIAL_RARU} • ${COMPLEMENTO_OFICIAL_RARU}`; }
  });
  const [screenInfo, setScreenInfo] = useState(() => {
    const w = typeof window !== "undefined" ? window.innerWidth : 400;
    const h = typeof window !== "undefined" ? window.innerHeight : 800;
    return { width: w, height: h, type: w >= 1200 ? "TV/DESKTOP" : w >= 768 ? "TABLET" : "MOBILE" };
  });

  const atualizarNomeSessao = (novoNome) => {
    const limpo = (novoNome || "").trim();
    setUserName(limpo);
    try {
      if (limpo) sessionStorage.setItem('raru_session_user_name', limpo);
      else sessionStorage.removeItem('raru_session_user_name');
    } catch (e) {}
    if (limpo) showToast(`Nome registrado para esta conversa: ${limpo}`);
  };

  useEffect(() => {
    const handleResize = () => {
      const w = window.innerWidth;
      const h = window.innerHeight;
      let t = "MOBILE";
      if (w >= 1200) t = "TV/DESKTOP";
      else if (w >= 768) t = "TABLET";
      setScreenInfo({ width: w, height: h, type: t });
    };
    window.addEventListener("resize", handleResize);
    sincronizarTelemetria92RJ();
    const syncTimer = setInterval(() => sincronizarTelemetria92RJ(), 300000);
    return () => {
      window.removeEventListener("resize", handleResize);
      clearInterval(syncTimer);
    };
  }, []);

  const showToast = (msg) => { setToastMsg(msg); setTimeout(() => setToastMsg(null), 3500); };

  const toggleWallMode = (forceState = null) => {
    const nextState = typeof forceState === "boolean" ? forceState : !isWallMode;
    setIsWallMode(nextState);
    if (nextState) {
      document.body.classList.add('hud-wall-mode');
      document.body.classList.add('hud-expanded-mode');
      showToast(`WALL MODE: ON • ${SUBTITULO_OFICIAL_RARU} (${COMPLEMENTO_OFICIAL_RARU}).`);
    } else {
      document.body.classList.remove('hud-wall-mode');
      document.body.classList.remove('hud-expanded-mode');
      showToast("WALL MODE: OFF • Modo normal restaurado.");
    }
  };

  return (
    <div className="seu-container-raru">
      {toastMsg && (
        <div className="fixed top-4 left-1/2 -translate-x-1/2 z-[140] bg-deepSpace/95 border border-cyberCyan text-cyberCyan font-mono text-[11px] font-bold px-4 py-2.5 rounded-full shadow-[0_0_24px_rgba(0,242,254,0.45)] max-w-[92vw] text-center">
          {toastMsg}
        </div>
      )}

      <div className="w-full overflow-hidden bg-deepSpace/90 border border-cyberCyan/30 rounded-full py-1.5 px-3 mb-3">
        <div className="whitespace-nowrap text-[10px] font-mono font-bold text-cyberCyan tracking-wider" style={{ display: 'inline-block', animation: 'tickerScroll 28s linear infinite' }}>
          <span>{customTickerText} &nbsp;&nbsp;&bull;&nbsp;&nbsp; {customTickerText}</span>
        </div>
      </div>

      {activeTab === 'dashboard' && (
        <CardIdentidadeVisualRARU
          openSarahChat={() => setIsSarahChatOpen(true)}
          handleWhoAmIClick={() => setIsWhoAmIOpen(true)}
          setActiveTab={setActiveTab}
          toggleWallMode={toggleWallMode}
          isWallMode={isWallMode}
          screenInfo={screenInfo}
          userName={userName}
          onOpenNameModal={() => setIsNameModalOpen(true)}
        />
      )}

      {activeTab === 'radar' && <RadarMeteorologicoModule perfilVozId={perfilVozId} />}

      {activeTab === 'vistoria' && (
        <VistoriaRARU_NEXUS
          onBackToDashboard={() => setActiveTab('dashboard')}
          showToast={showToast}
          perfilVozId={perfilVozId}
          userName={userName}
        />
      )}

      {activeTab === 'estacao' && (
        <EstacaoSobrevivenciaModuleV12
          showToast={showToast}
          userName={userName}
          onAtualizarNome={atualizarNomeSessao}
          onNavegarModulo={setActiveTab}
          soundEnabled={true}
          vozSelecionada={perfilVozId}
          perfilVozId={perfilVozId}
          openSarahChat={() => setIsSarahChatOpen(true)}
        />
      )}

      {activeTab === 'alquino' && <RedeAlquinoHardwareModule onGoToDashboard={() => setActiveTab('dashboard')} showToast={showToast} />}

      {activeTab === 'balanca' && <ModuloCidadaoSensorModule onGoToDashboard={() => setActiveTab('dashboard')} showToast={showToast} />}

      {activeTab === 'videos' && (
        <ModuloVideosModule
          localVideos={localVideos}
          setLocalVideos={setLocalVideos}
          onGoToDashboard={() => setActiveTab('dashboard')}
          showToast={showToast}
        />
      )}

      {activeTab === 'admin' && (
        <AdminVaultModule
          showToast={showToast}
          onClose={() => setActiveTab('dashboard')}
          localVideos={localVideos}
          setLocalVideos={setLocalVideos}
          onSelecionarPerfilVoz={setPerfilVozId}
          perfilVozId={perfilVozId}
          customTickerText={customTickerText}
          setCustomTickerText={setCustomTickerText}
        />
      )}

      <SarahFabButton openSarahChat={() => setIsSarahChatOpen(true)} isSpeaking={false} />

      <SarahChatModal
        isOpen={isSarahChatOpen}
        onClose={() => setIsSarahChatOpen(false)}
        userName={userName}
        onAtualizarNome={atualizarNomeSessao}
        abaAtual={activeTab}
      />

      <QuemSomosModal
        isOpen={isWhoAmIOpen}
        onClose={() => setIsWhoAmIOpen(false)}
        userName={userName}
      />

      <ModalIdentificacaoPessoa
        isOpen={isNameModalOpen}
        onClose={() => setIsNameModalOpen(false)}
        userName={userName}
        onSalvarNome={atualizarNomeSessao}
      />

      <nav className="fixed bottom-0 left-0 right-0 z-50 bg-void/95 backdrop-blur-xl border-t border-cyberCyan/35 px-1.5 py-2 flex items-center justify-around gap-1 overflow-x-auto">
        {[
          { id: 'dashboard', label: 'PAINEL', Icon: IconDashboard },
          { id: 'radar', label: 'RADAR', Icon: IconRadar },
          { id: 'vistoria', label: 'VISTORIA', Icon: IconVistoria },
          { id: 'estacao', label: 'ESTAÇÃO', Icon: IconEstacao },
          { id: 'alquino', label: 'ALQUINO', Icon: IconAlquino },
          { id: 'balanca', label: 'BALANÇA', Icon: IconBalanca },
          { id: 'videos', label: 'VÍDEOS', Icon: IconVideos },
          { id: 'admin', label: 'ADMIN', Icon: IconAdmin }
        ].map(({ id, label, Icon }) => {
          const ativa = activeTab === id;
          return (
            <button
              key={id}
              type="button"
              onClick={() => setActiveTab(id)}
              className={`flex flex-col items-center justify-center px-2 py-1.5 rounded-xl text-[8.5px] font-mono font-black uppercase transition cursor-pointer shrink-0 min-w-[54px] ${
                ativa
                  ? 'bg-cyberCyan/20 text-cyberCyan border border-cyberCyan shadow-[0_0_12px_rgba(0,242,254,0.3)]'
                  : 'text-slate-400 hover:text-white border border-transparent'
              }`}
            >
              <Icon size={15} color={ativa ? '#00F2FE' : '#94A3B8'} />
              <span className="mt-0.5">{label}</span>
            </button>
          );
        })}
      </nav>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
</script>
</body>
</html>
