<!DOCTYPE html>
<html lang="pt-br" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>SARAH AI • REDE AUTOMATIZADA DE RESILIÊNCIA URBANA (V11 Plus)</title>
    <meta name="theme-color" content="#010814">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Orbitron:wght@600;800;900&family=JetBrains+Mono:wght@400;600;800&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>

    <style>
        @keyframes tickerScroll {
          0% { transform: translateX(0); }
          100% { transform: translateX(-50%); }
        }

        html, body, #root {
            min-height: 100%;
            margin: 0;
            font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
            touch-action: pan-x pan-y;
            -webkit-text-size-adjust: 100%;
            overscroll-behavior-y: none;
            -webkit-user-select: none;
            user-select: none;
            background-color: #010814 !important;
            color: #E2E8F0 !important;
        }

        .cyber-card {
            background: linear-gradient(135deg, rgba(10, 27, 56, 0.97) 0%, rgba(4, 17, 37, 0.99) 100%) !important;
            border: 1px solid rgba(0, 242, 254, 0.45) !important;
            color: #E2E8F0 !important;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8), inset 0 1px 0 rgba(0, 242, 254, 0.2) !important;
        }

        .cyber-button {
            background: linear-gradient(135deg, #00F2FE 0%, #38BDF8 100%);
            color: #010814 !important;
            font-weight: 900;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .cyber-button:active {
            transform: scale(0.97);
        }

        .hud-grid {
            background-image: linear-gradient(rgba(0, 242, 254, 0.04) 1px, transparent 1px),
                              linear-gradient(90deg, rgba(0, 242, 254, 0.04) 1px, transparent 1px);
            background-size: 20px 20px;
        }

        ::-webkit-scrollbar { width: 5px; height: 5px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(0,242,254,0.5); border-radius: 9999px; }
    </style>
</head>
<body class="selection:bg-cyan-500 selection:text-void hud-grid pb-6">
    <div id="root">
        <div style="display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; background: #010814; color: #00F2FE; font-family: monospace; text-align: center; padding: 20px;">
            <h2 style="font-size: 16px; margin-bottom: 8px;">SARAH AI V11 Plus • CARREGANDO APLICAÇÃO...</h2>
            <p style="font-size: 11px; color: #94A3B8;">Iniciando módulos de resiliência e telemetria urbana.</p>
        </div>
    </div>

    <!-- Motores JavaScript compilados e leves (sem depender de compilador Babel no celular) -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>

    <script>
        const { useState, useEffect, createElement: h } = React;

        const MUNICIPIOS_92 = [
            "Mesquita", "Belford Roxo", "Duque de Caxias", "Japeri", "Nilópolis", 
            "Nova Iguaçu", "Queimados", "São João de Meriti", "Rio de Janeiro", "Niterói", "Petrópolis"
        ];

        function App() {
            const [municipio, setMunicipio] = useState("Mesquita");
            const [status, setStatus] = useState("Sincronizado");
            const [sarahMsg, setSarahMsg] = useState("Olá, Alexander! SARAH AI V11 Plus operando em modo nativo no GitHub Pages. Telemetria e prevenção ativas.");

            const falarAlerta = (mun) => {
                const texto = `Monitorando o município de ${mun}. Condições estáveis no sistema de resiliência urbana.`;
                setSarahMsg(`🌦️ [${mun.toUpperCase()}] ${texto}`);

                if ('speechSynthesis' in window) {
                    window.speechSynthesis.cancel();
                    const u = new SpeechSynthesisUtterance(texto);
                    u.lang = 'pt-BR';
                    window.speechSynthesis.speak(u);
                }
            };

            return h('div', { className: 'min-h-screen p-4 flex flex-col items-center justify-start space-y-4 font-mono max-w-xl mx-auto' },
                // Header
                h('header', { className: 'w-full cyber-card p-4 rounded-2xl flex items-center justify-between border-cyan-400' },
                    h('div', null,
                        h('h1', { className: 'text-xs font-black text-white tracking-widest' }, 'SARAH AI V11 Plus'),
                        h('p', { className: 'text-[9px] text-cyan-400 font-bold' }, 'REDE DE RESILIÊNCIA URBANA')
                    ),
                    h('span', { className: 'px-2.5 py-1 bg-cyan-500/20 text-cyan-300 border border-cyan-400/40 rounded-full text-[9px] font-bold' }, 'ONLINE')
                ),

                // Card Principal - Identidade e Diagnóstico
                h('div', { className: 'w-full cyber-card p-5 rounded-3xl space-y-4 text-center border-cyan-400/60 shadow-2xl' },
                    h('div', { className: 'w-20 h-20 mx-auto rounded-full bg-cyan-500/10 border-2 border-cyan-400 flex items-center justify-center text-2xl shadow-[0_0_20px_rgba(0,242,254,0.4)]' }, '🤖'),
                    h('div', { className: 'space-y-1' },
                        h('h2', { className: 'text-sm font-black text-white uppercase tracking-wider' }, 'Prevenção Inteligente Para Todos'),
                        h('p', { className: 'text-[9px] text-slate-300 uppercase' }, 'Grupo A Chave da Esperança © GADE • Rocha Sobrinho, Mesquita RJ')
                    ),
                    h('div', { className: 'bg-black/60 p-3.5 rounded-2xl border border-cyan-500/30 text-left text-xs text-cyan-300 leading-relaxed font-mono' },
                        `"${sarahMsg}"`
                    )
                ),

                // Seleção de Municípios
                h('div', { className: 'w-full cyber-card p-4 rounded-2xl space-y-3' },
                    h('label', { className: 'text-[10px] text-cyan-400 font-bold uppercase block' }, 'Selecione o Município (92 Municípios RJ)'),
                    h('select', {
                        value: municipio,
                        onChange: (e) => {
                            setMunicipio(e.target.value);
                            falarAlerta(e.target.value);
                        },
                        className: 'w-full bg-slate-950 text-cyan-300 border border-cyan-400/40 rounded-xl p-3 text-xs font-bold cursor-pointer'
                    },
                        MUNICIPIOS_92.map(m => h('option', { key: m, value: m }, `${m} - RJ`))
                    )
                ),

                // Botões de Ação Imediata
                h('div', { className: 'w-full grid grid-cols-2 gap-2' },
                    h('button', {
                        onClick: () => falarAlerta(municipio),
                        className: 'py-3.5 cyber-button rounded-xl text-[10px] font-black uppercase tracking-wider shadow-lg'
                    }, '🔊 Ouvir Sarah AI'),
                    h('button', {
                        onClick: () => {
                            if ('speechSynthesis' in window) {
                                window.speechSynthesis.cancel();
                                const u = new SpeechSynthesisUtterance("Alarme de teste acionado. Defesa Civil operando.");
                                u.lang = 'pt-BR';
                                window.speechSynthesis.speak(u);
                            }
                        },
                        className: 'py-3.5 bg-red-600 hover:bg-red-500 text-white font-black rounded-xl text-[10px] uppercase shadow-lg cursor-pointer'
                    }, '🚨 Alarme de Teste')
                ),

                // Footer Informativo
                h('footer', { className: 'w-full text-center py-2 text-[9px] text-slate-500 font-bold uppercase tracking-widest' },
                    'SARAH AI V11 Plus • Versão Unificada Estável • 2026'
                )
            );
        }

        ReactDOM.render(h(App), document.getElementById('root'));
    </script>
</body>
</html>
