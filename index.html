        function playChameleonSound() {
            try {
                const AudioCtx = window.AudioContext || window.webkitAudioContext;
                if (!AudioCtx) return;
                const ctx = new AudioCtx();
                if (ctx.state === 'suspended') ctx.resume();
                const bufferSize = ctx.sampleRate * 1.2;
                const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
                const data = buffer.getChannelData(0);
                for (let i = 0; i < bufferSize; i++) { data[i] = (Math.random() * 2 - 1) * Math.sin(i / 800); }
                const noiseSource = ctx.createBufferSource();
                noiseSource.buffer = buffer;
                const filter = ctx.createBiquadFilter();
                filter.type = 'lowpass';
                filter.frequency.setValueAtTime(350, ctx.currentTime);
                const gainNode = ctx.createGain();
                gainNode.gain.setValueAtTime(0.8, ctx.currentTime);
                noiseSource.connect(filter); filter.connect(gainNode); gainNode.connect(ctx.destination);
                noiseSource.start();
            } catch (e) {}
        }

                try { return JSON.parse(localStorage.getItem('raru_fotos_vistoria')) || []; } catch(e) { return []; }

            const [risco, setRisco] = React.useState('R2 - MODERADO / ALERTA');

            const handleFile = (e) => {
                const file = e.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = (ev) => {
                    setCurrentBase64(ev.target.result);
                    setBrightness(1);
                    setComentario('');
                    setShowPreview(true);
                };
                reader.readAsDataURL(file);
            };

            const salvarFoto = () => {
                const novaFoto = {
                    id: Date.now(),
                    img: currentBase64,
                    brightness: brightness,
                    comentario: comentario || 'Fissura / Talude / Erosão',
                    data: new Date().toLocaleString('pt-BR')
                };
                const atualizadas = [...fotosLaudo, novaFoto];
                setFotosLaudo(atualizadas);
                localStorage.setItem('raru_fotos_vistoria', JSON.stringify(atualizadas));
                setShowPreview(false);
                if(typeof showToast === 'function') showToast("📸 Foto salva na vistoria!");
            };

            const removerFoto = (index) => {
                const atualizadas = fotosLaudo.filter((_, i) => i !== index);
                setFotosLaudo(atualizadas);
                localStorage.setItem('raru_fotos_vistoria', JSON.stringify(atualizadas));
            };

            const gerarPDFLaudo = async () => {
                const { jsPDF } = window.jspdf;
                const doc = new jsPDF();
                doc.setFillColor(3, 7, 18);
                doc.rect(0, 0, 210, 297, 'F');
                doc.setTextColor(0, 242, 254);
                doc.setFontSize(12);
                doc.text("RARU NEXUS V11 Plus • LAUDO TÉCNICO DE VISTORIA", 14, 18);

                let y = 46;
                fotosLaudo.forEach((f, i) => {
                    if (y > 220) { doc.addPage(); y = 20; }
                    try {
                        doc.addImage(f.img, 'JPEG', 14, y, 60, 40);
                        doc.text(doc.splitTextToSize(`Foto ${i+1}: ${f.comentario}`, 115), 78, y + 8);
                        y += 48;
                    } catch(e) {}
                });
                doc.save(`RARU_Laudo_${Date.now()}.pdf`);
                if(typeof showToast === 'function') showToast("📄 PDF gerado com sucesso!");
            };

                            <input type="text" placeholder="Nome do Responsável *" value={responsavel} onChange={(e) => setResponsavel(e.target.value)} className="w-full bg-slate-900 border border-cyberCyan/30 rounded-xl p-2.5 text-xs text-white" />
                            <input type="text" placeholder="Bairro / Localidade *" value={bairro} onChange={(e) => setBairro(e.target.value)} className="w-full bg-slate-900 border border-cyberCyan/30 rounded-xl p-2.5 text-xs text-white" />
                            <select value={risco} onChange={(e) => setRisco(e.target.value)} className="w-full bg-slate-900 border border-cyberCyan/30 rounded-xl p-2.5 text-xs text-cyberCyan font-bold">
                                <option>R1 - BAIXO / PREVENTIVO</option>
                                <option>R2 - MODERADO / ALERTA</option>
                                <option>R3 - ALTO / ENXURRADA</option>
                                <option>R4 - EVACUAÇÃO PREVENTIVA</option>
                            </select>
                        </div>

                        <div className="space-y-2">
                            <div className="text-[10px] font-bold text-cyberCyan">FOTOS REGISTRADAS ({fotosLaudo.length})</div>
                            {fotosLaudo.map((f, i) => (
                                <div key={i} className="bg-slate-900/90 border border-cyberCyan/30 rounded-xl p-2.5 flex items-center gap-3">
                                    <img src={f.img} style={{ filter: `brightness(${f.brightness})` }} className="w-12 h-12 object-cover rounded-lg border border-cyan-400/40" />
                                    <div className="flex-1 text-xs">
                                        <div className="text-cyan-400 font-bold">FOTO {i+1}</div>
                                        <div className="text-slate-300 text-[10px]">{f.comentario}</div>
                                    </div>
                                    <button onClick={() => removerFoto(i)} className="bg-red-500/20 text-red-400 w-6 h-6 rounded-lg text-xs font-bold">✕</button>
                                </div>
                            ))}
                        </div>

                        {fotosLaudo.length > 0 && (
                            <button onClick={gerarPDFLaudo} className="w-full py-3 bg-gradient-to-r from-emerald-400 to-cyan-400 text-void font-orbitron font-black rounded-xl text-xs">
                                📄 GERAR PDF DO LAUDO
                            </button>
                        )}
                    </div>
                </div>
            );
        }

        function PublicVideoGallery({ localVideos, onGoToDashboard }) {
            return (
                <div className="space-y-3 w-full">
                    <div className="cyber-card p-4 rounded-[24px] shadow-xl space-y-3">
                        <div className="flex items-center justify-between border-b border-cyberCyan/25 pb-2">
                            <h2 className="font-display text-xs font-black text-white">🎥 RARU STREAM</h2>
                            <button onClick={onGoToDashboard} className="px-3 py-1.5 cyber-button rounded-xl text-[9px] font-black">Painel</button>
                        </div>
                        {localVideos.map(vid => (
                            <div key={vid.id} className="rounded-xl overflow-hidden cyber-card p-2">
                                <div className="text-[9px] font-black text-cyberCyan mb-1">▶ {vid.title}</div>
                                <video src={vid.url} controls playsInline className="w-full h-36 object-contain bg-void" />
                            </div>
                        ))}
                    </div>
                </div>
            );
        }

        function AdminVaultModule({ localVideos, setLocalVideos, showToast, onClose }) {
            const [pinInput, setPinInput] = React.useState("");
            const [isUnlocked, setIsUnlocked] = React.useState(false);
            return (
                <div className="space-y-3 w-full font-mono">
                    <div className="cyber-card p-4 rounded-[24px] shadow-xl space-y-3">
                        <div className="flex justify-between border-b border-cyberCyan/25 pb-2">
                            <h2 className="font-display text-[10px] font-black text-cyberCyan">🔒 ÁREA RESTRITA</h2>
                            <button onClick={onClose} className="px-3 py-1 bg-cyberRose/20 text-cyberRose rounded text-[9px]">✕</button>
                        </div>
                        {!isUnlocked ? (
                            <form onSubmit={(e) => { e.preventDefault(); if(pinInput === "303500"){ setIsUnlocked(true); showToast("🔓 Liberado!"); } else { showToast("❌ PIN incorreto"); } }} className="flex gap-2">
                                <input type="password" maxLength="6" value={pinInput} onChange={(e) => setPinInput(e.target.value)} placeholder="PIN 🔒" className="flex-1 bg-void border border-cyberCyan/40 rounded-xl px-3 py-2 text-center text-white" />
                                <button type="submit" className="px-4 cyber-button rounded-xl text-xs font-black">Entrar</button>
                            </form>
                        ) : (
                            <div className="text-xs text-cyberGreen font-bold text-center py-4">Acesso Administrativo Concedido ao Sistema V11 Plus.</div>
                        )}
                    </div>
                </div>
            );
        }

        function AutomatedObservatoryWidget() {
            return (
                <div className="cyber-card rounded-[22px] overflow-hidden shadow-xl border border-cyberCyan/40 p-3 text-center space-y-1 w-full font-mono">
                    <div className="font-display font-black text-[9px] text-cyan-200 uppercase">RARU NEXUS AI V11 Plus • 9 FONTES OFICIAIS</div>
                    <div className="text-[8px] text-cyberCyan">GRUPO A CHAVE DA ESPERANÇA © GADE</div>
                </div>
            );
        }

        function SarahChatOverlay({ isOpen, onClose, isSpeaking, isProcessing, currentResponse, input, setInput, handleSendDirectCommand, toggleListening, isListening }) {
            if (!isOpen) return null;
            return (
                <div className="fixed inset-0 z-[90] flex items-end justify-center bg-void/85 backdrop-blur-2xl" onClick={onClose}>
                    <div className="cyber-card w-full max-w-md rounded-t-[28px] shadow-2xl p-4 space-y-3 border border-cyberCyan/50" onClick={e => e.stopPropagation()}>
                        <div className="flex justify-between items-center border-b border-cyberCyan/30 pb-2">
                            <div className="flex items-center gap-2">
                                <SarahLiveSVGAvatar isSpeaking={isSpeaking} sizeClass="w-9 h-9" />
                                <span className="font-display text-[10px] font-black text-white">SARAH AI • CHAT PRO</span>
                            </div>
                            <button onClick={onClose} className="w-7 h-7 bg-cyberRose/20 text-cyberRose rounded-lg font-bold">✕</button>
                        </div>
                        <div className="max-h-[220px] overflow-y-auto bg-void/90 border border-cyberCyan/30 rounded-xl p-3 text-xs text-slate-100 whitespace-pre-line leading-relaxed">
                            {currentResponse}
                        </div>
                        <form onSubmit={(e) => { e.preventDefault(); handleSendDirectCommand(); }} className="flex gap-2">
                            <button type="button" onClick={toggleListening} className={`p-2.5 rounded-lg border ${isListening ? 'bg-cyberRose text-white animate-pulse' : 'bg-commandPanel text-cyberCyan'}`}>🎙️</button>
                            <input type="text" value={input} onChange={(e) => setInput(e.target.value)} placeholder="Pergunte à Sarah..." className="flex-1 bg-void border border-cyberCyan/40 rounded-xl px-3 text-xs text-white" />
                            <button type="submit" disabled={isProcessing || !input.trim()} className="px-4 cyber-button rounded-xl text-xs font-black">Enviar</button>
                        </form>
                    </div>
                </div>
            );
        }

        function App() {
            const [showSplash, setShowSplash] = React.useState(true);
            const [theme, setTheme] = React.useState('dark');
            const [soundEnabled, setSoundEnabled] = React.useState(true);
            const [isSpeaking, setIsSpeaking] = React.useState(false);
            const [isListening, setIsListening] = React.useState(false);

            const [activeTab, setActiveTab] = React.useState("dashboard");
            const [radarOpen, setRadarOpen] = React.useState(false);
            const [chameleonActive, setChameleonActive] = React.useState(false);
            const [quemSomosOpen, setQuemSomosOpen] = React.useState(false);
            const [isCommandHUDActive, setIsCommandHUDActive] = React.useState(false);

            const [toastMessage, setToastMessage] = React.useState(null);
            const [termsAccepted, setTermsAccepted] = React.useState(true);

            const [isChatOpen, setIsChatOpen] = React.useState(false);
            const [input, setInput] = React.useState("");
            const [isProcessing, setIsProcessing] = React.useState(false);
            const [currentResponse, setCurrentResponse] = React.useState("Olá! Sou a Analista Sênior da RARU NEXUS AI V11 Plus. Prevenção inteligente para todos.");
            
            const [marketingTitle, setMarketingTitle] = React.useState("RARU NEXUS AI V11 Plus");
            const [marketingSubtitle, setMarketingSubtitle] = React.useState("Rede Automatizada de Resiliência Urbana, Mesquita - RJ");
            const [localVideos, setLocalVideos] = React.useState([{ id: 1, title: "RARU NEXUS V11 Plus • 9 Fontes Oficiais", url: "https://www.w3schools.com/html/mov_bbb.mp4" }]);

            const showToast = (msg) => { setToastMessage(msg); setTimeout(() => setToastMessage(null), 3500); };

            const toggleCommandHUD = () => {
                if (!isCommandHUDActive) {
                    if (document.documentElement.requestFullscreen) document.documentElement.requestFullscreen().catch(() => {});
                    setIsCommandHUDActive(true);
                    showToast("📺 MODO HUD ATIVADO!");
                } else {
                    if (document.exitFullscreen && document.fullscreenElement) document.exitFullscreen().catch(() => {});
                    setIsCommandHUDActive(false);
                }
            };

            const toggleTheme = () => {
                setTheme(prev => {
                    const next = prev === 'dark' ? 'warm' : 'dark';
                    if (next === 'warm') {
                        document.documentElement.classList.remove('dark');
                        document.documentElement.classList.add('warm');
                        showToast('🎨 Tema Clean Diurno');
                    } else {
                        document.documentElement.classList.add('dark');
                        document.documentElement.classList.remove('warm');
                        showToast('🌌 Modo Cyber V11');
                    }
                    return next;
                });
            };

            const toggleListening = () => {
                const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
                if (!SpeechRec) { showToast("⚠️ Voz indisponível."); return; }
                if (isListening) { setIsListening(false); return; }
                try {
                    const rec = new SpeechRec();
                    rec.lang = "pt-BR";
                    rec.onstart = () => { setIsListening(true); showToast("🎙 Ouvindo..."); };
                    rec.onresult = (event) => {
                        let final = event.results[0][0].transcript;
                        if (final) { setInput(final); setIsListening(false); handleSendDirectCommand(final); }
                    };
                    rec.onerror = () => setIsListening(false);
                    rec.onend = () => setIsListening(false);
                    rec.start();
                } catch (e) { setIsListening(false); }
            };

            const handleSendDirectCommand = async (textCustom) => {
                const textToSend = textCustom !== undefined ? textCustom : input;
                if (!textToSend.trim() || isProcessing) return;
                setInput(""); setIsProcessing(true);
                setCurrentResponse("🔄 Processando nas 9 fontes oficiais...");
                setIsSpeaking(true);
                try {
                    const response = await fetch(CLOUDFLARE_WORKER_URL, {
                        method: "POST", headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({ model: "openai/gpt-oss-120b", messages: [{ role: "system", content: "You are Sarah, Senior Analyst of RARU NEXUS AI V11 Plus." }, { role: "user", content: textToSend }], temperature: 0.5, max_tokens: 300 })
                    });
                    const data = await response.json();
                    let reply = data?.choices?.[0]?.message?.content || "Análise concluída.";
                    reply = reply.replace(/#{1,6}\s?/g, '').replace(/\*\*/g, '').trim();
                    setCurrentResponse(reply); 
                    falarSarah(reply);
                } catch (error) {
                    const fallback = "RARU NEXUS V11 Plus online nas 9 fontes públicas.";
                    setCurrentResponse(fallback);
                    falarSarah(fallback);
                } finally { 
                    setIsProcessing(false); 
                    setTimeout(() => setIsSpeaking(false), 3000);
                }
            };

            const NAV_TABS = [
                { id: 'alquino', iconComponent: <span className="text-xs">⚙️</span>, label: 'Alquino' },
                { id: 'quem-somos', iconComponent: <HomeCommandIcon className="w-3.5 h-3.5" />, label: 'Sobre' },
                { id: 'dashboard', iconComponent: <HomeCommandIcon className="w-3.5 h-3.5" />, label: 'Painel' },
                { id: 'estacao', iconComponent: <SurvivalStationIcon className="w-3.5 h-3.5" />, label: 'Estação' },
                { id: 'radar', iconComponent: <RadarScanIcon className="w-3.5 h-3.5" />, label: 'Radar' },
                { id: 'relatorio', iconComponent: <FieldReportIcon className="w-3.5 h-3.5" />, label: 'Vistoria' },
                { id: 'galeria', iconComponent: <StreamVideoIcon className="w-3.5 h-3.5" />, label: 'Vídeos' },
                { id: 'admin', iconComponent: <AdminVaultIcon className="w-3.5 h-3.5" />, label: 'Admin' }
            ];

            return (
                <div className="seu-container-raru">
                    {showSplash && <AppSplashScreen onFinish={() => setShowSplash(false)} />}
                    {toastMessage && <div className="fixed top-14 left-1/2 -translate-x-1/2 z-50 cyber-card px-4 py-2 rounded-xl text-[9px] font-black text-cyberCyan shadow-2xl border border-cyberCyan animate-bounce">{toastMessage}</div>}

                    <header className="cyber-card sticky top-0 z-30 w-full px-3 py-2 border-b border-cyberCyan/40 flex items-center justify-between shadow-lg rounded-b-xl">
                        <div className="flex items-center gap-2 cursor-pointer" onClick={() => setIsChatOpen(true)}>
                            <div className="w-8 h-8 overflow-hidden rounded-full border border-cyan-400">
                                <SarahLiveSVGAvatar isSpeaking={isSpeaking} />
                            </div>
                            <div>
                                <h1 className="font-display text-[9px] font-black text-white">RARU NEXUS Plus</h1>
                                <p className="text-[7px] text-cyberCyan font-mono">Mesquita - RJ</p>
                            </div>
                        </div>
                        <div className="flex items-center gap-1">
                            <button onClick={toggleCommandHUD} className={`px-2 py-1 rounded-lg border text-[8px] font-black ${isCommandHUDActive ? 'bg-cyberRose text-void animate-pulse' : 'bg-cyberCyan text-void'}`}>HUD</button>
                            <button onClick={() => setChameleonActive(!chameleonActive)} className="px-2 py-1 rounded-lg border border-cyberCyan text-cyberCyan text-[7px] font-bold">🦎 Camaleão</button>
                            <button onClick={() => setSoundEnabled(!soundEnabled)} className="w-8 h-8 rounded-lg border border-cyberCyan/50 flex items-center justify-center text-cyberCyan">🔊</button>
                            <button onClick={toggleTheme} className="w-8 h-8 rounded-lg border border-cyberCyan text-cyberCyan flex items-center justify-center">
                                <span className="text-xs">{theme === 'dark' ? '🌙' : '☀️'}</span>
                            </button>
                        </div>
                    </header>

                    <nav className="cyber-card w-full border-b border-cyberCyan/30 px-2 py-1.5 flex items-center justify-center gap-1 overflow-x-auto z-20">
                        {NAV_TABS.map(tab => (
                            <button key={tab.id} onClick={() => {
                                if (tab.id === 'radar') setRadarOpen(true);
                                else if (tab.id === 'quem-somos') setQuemSomosOpen(true);
                                else setActiveTab(tab.id);
                            }} className={`px-2.5 py-1.5 rounded-lg text-[9px] font-black transition cursor-pointer flex items-center gap-1 shrink-0 ${activeTab === tab.id ? 'cyber-button' : 'bg-commandPanel text-slate-300 border border-cyberCyan/20'}`}>
                                {tab.iconComponent} {tab.label}
                            </button>
                        ))}
                    </nav>

                    <main className="flex-1 w-full mx-auto py-3 space-y-3 relative z-10">
                        {activeTab === 'dashboard' && <CardIdentidadeVisualRARU openShareFromApp={() => {}} openSarahChat={() => setIsChatOpen(true)} handleWhoAmIClick={() => setQuemSomosOpen(true)} setActiveTab={setActiveTab} marketingTitle={marketingTitle} marketingSubtitle={marketingSubtitle} toggleCommandHUD={toggleCommandHUD} isSpeaking={isSpeaking} />}
                        {activeTab === 'estacao' && <EstacaoSobrevivenciaModuleV11 showToast={showToast} />}
                        {activeTab === 'alquino' && <RedeAlquinoHardwareModule onGoToDashboard={() => setActiveTab('dashboard')} showToast={showToast} />}
                        {activeTab === 'relatorio' && <VistoriaRARU_NEXUS onBackToDashboard={() => setActiveTab('dashboard')} showToast={showToast} />}
                        {activeTab === 'galeria' && <PublicVideoGallery localVideos={localVideos} onGoToDashboard={() => setActiveTab('dashboard')} />}
                        {activeTab === 'admin' && <AdminVaultModule localVideos={localVideos} setLocalVideos={setLocalVideos} showToast={showToast} onClose={() => setActiveTab('dashboard')} />}

                        <AutomatedObservatoryWidget />
                    </main>

                    <NativeHydroWindRadar isOpen={radarOpen} onToggle={() => setRadarOpen(o => !o)} />
                    <SarahChatOverlay isOpen={isChatOpen} onClose={() => setIsChatOpen(false)} isSpeaking={isSpeaking} isProcessing={isProcessing} currentResponse={currentResponse} input={input} setInput={setInput} handleSendDirectCommand={handleSendDirectCommand} toggleListening={toggleListening} isListening={isListening} />
                    <QuemSomosModal isOpen={quemSomosOpen} onClose={() => setQuemSomosOpen(false)} />

                    <footer className="cyber-card fixed bottom-0 left-0 right-0 z-40 border-t border-cyberCyan/40 px-2 py-2 flex items-center justify-around shadow-xl backdrop-blur-2xl max-w-[480px] mx-auto rounded-t-xl">
                        {NAV_TABS.map(tab => (
                            <button key={tab.id} onClick={() => {
                                if (tab.id === 'radar') setRadarOpen(true);
                                else if (tab.id === 'quem-somos') setQuemSomosOpen(true);
                                else setActiveTab(tab.id);
                            }} className={`flex flex-col items-center gap-0.5 cursor-pointer ${activeTab === tab.id ? 'text-cyberCyan scale-105' : 'text-slate-400'}`}>
                                {tab.iconComponent}
                                <span className="text-[7px] font-black">{tab.label}</span>
                            </button>
                        ))}
                    </footer>
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
