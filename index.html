        document.addEventListener('gesturestart', function(e) { e.preventDefault(); });

        let lastTouchEnd = 0;
        document.addEventListener('touchend', function(e) {
            const now = (new Date()).getTime();
            if (now - lastTouchEnd <= 300) { e.preventDefault(); }
            lastTouchEnd = now;
        }, { passive: false });

        const CLOUDFLARE_WORKER_URL = "https://sarah-envelope.phantrorfirmo08.workers.dev/";

        const getBrasiliaGreeting = () => {
            const hour = parseInt(
                new Intl.DateTimeFormat("pt-BR", {
                    timeZone: "America/Sao_Paulo",
                    hour: "numeric",
                    hour12: false
                }).format(new Date()),
                10
            );
            if (hour >= 0 && hour < 5) return "Boa madrugada";
            if (hour >= 5 && hour < 12) return "Bom dia";
            if (hour >= 12 && hour < 18) return "Boa tarde";
            return "Boa noite";
        };

            );
        }

        function NativeHydroWindRadar({ liveWeather }) {
            const [brasiliaTime, setBrasiliaTime] = React.useState("");
            const [radarKey, setRadarKey] = React.useState(1);
            const [isCollapsed, setIsCollapsed] = React.useState(false);

            React.useEffect(() => {
                const timer = setInterval(() => {
                    const now = new Date();
                    const timeStr = new Intl.DateTimeFormat("pt-BR", {
                        timeZone: "America/Sao_Paulo",
                        hour: "2-digit",
                        minute: "2-digit",
                        second: "2-digit",
                        hour12: false
                    }).format(now);
                    setBrasiliaTime(timeStr);
                }, 1000);
                return () => clearInterval(timer);
            }, []);

            const handleReloadRadar = () => {
                setRadarKey(prev => prev + 1);
            };

            return (
                <div className={`relative w-full rounded-3xl overflow-hidden border-2 border-cyberNeon/60 shadow-2xl bg-petroleumPanel flex flex-col justify-between p-2 transition-all duration-300 ${isCollapsed ? 'h-[70px]' : 'h-[580px]'}`}>
                    <div className="absolute top-2 left-2 right-2 flex items-center justify-between z-30 bg-nightBlue/98 border border-cyberNeon/50 px-[10px] py-[5px] rounded-xl shadow-xl backdrop-blur-md" style={{ height: '48px' }}>
                        <div className="flex items-center gap-2 overflow-hidden whitespace-nowrap">
                            <span className="font-black text-[11px] text-cyberNeon tracking-wide truncate">
                                RADAR 24H • CLIMA, NUVENS, CHUVA & VENTOS
                            </span>
                        </div>
                        <div className="flex items-center gap-2 shrink-0">
                            <button 
                                onClick={handleReloadRadar}
                                className="px-2 py-1 bg-cyberNeon text-nightBlue rounded-lg font-black text-[10px] cursor-pointer shadow hover:bg-white transition"
                                title="Recarregar mapa meteorológico"
                            >
                                🔄 Recarregar
                            </button>
                            <button 
                                onClick={() => setIsCollapsed(!isCollapsed)}
                                className="px-2.5 py-1 bg-petroleumPanel text-cyberNeon border border-cyberNeon/40 rounded-lg font-bold text-[10px] cursor-pointer shadow hover:bg-cyberNeon/20 transition"
                            >
                                {isCollapsed ? '▼ Expandir' : '▲ Recolher'}
                            </button>
                            <span className="font-mono text-[10px] font-bold text-cyberNeon hidden sm:inline">🕒 {brasiliaTime || "00:00:00"}</span>
                        </div>
                    </div>
                    
                    {!isCollapsed && (
                        <div className="absolute inset-0 pt-[50px]">
                            <iframe 
                                key={radarKey}
                                src="https://embed.windy.com/embed2.html?lat=-22.7845&lon=-43.4190&detailLat=-22.7845&detailLon=-43.4190&width=650&height=550&zoom=11&level=surface&overlay=wind&product=ecmwf&menu=&message=&marker=true&calendar=now&pressure=true&type=map&location=coordinates&detail=true&metricWind=default&metricTemp=default" 
                                className="w-full h-full border-none relative z-10 bg-black"
                                sandbox="allow-scripts allow-same-origin allow-popups allow-forms"
                                allowFullScreen>
                            </iframe>
                        </div>
                    )}
                </div>
            );
        }

        function FieldReportModule({ onBackToChat, showToast }) {
            const [setor, setSetor] = React.useState("🛡️ Defesa Civil (Vistoria de Risco / Ocorrência)");
            const [agente, setAgente] = React.useState("Alexander da Silva Firmo");
            const [localizacao, setLocalizacao] = React.useState("");
            const [relato, setRelato] = React.useState("");
            const [lat, setLat] = React.useState("");
            const [ln, setLn] = React.useState("");
            const [lk, setLk] = React.useState("");
            const [gpsStatus, setGpsStatus] = React.useState("📍 GPS desligado");
            
            const [fotosStatus, setFotosStatus] = React.useState({
                f1: "vazia",
                f2: "vazia",
                f3: "vazia",
                f4: "vazia"
            });

            const handleCapturarGps = () => {
                if (!navigator.geolocation) {
                    showToast("❌ Geolocalização não suportada.");
                    return;
                }
                showToast("🛰 Capturando coordenadas...");
                navigator.geolocation.getCurrentPosition(
                    (p) => {
                        const latitude = p.coords.latitude.toFixed(6);
                        const longitude = p.coords.longitude.toFixed(6);
                        const linkMap = `https://maps.google.com/?q=${latitude},${longitude}`;
                        setLat(latitude);
                        setLn(longitude);
                        setLk(linkMap);
                        setLocalizacao(`${latitude}, ${longitude}`);
                        setGpsStatus("✅ GPS Ativo");
                        showToast("📍 Coordenadas de GPS obtidas com sucesso!");
                    },
                    () => {
                        showToast("⚠ Erro ao obter sinal de GPS.");
                    },
                    { enableHighAccuracy: true }
                );
            };

            const handleFotoChange = (key, e) => {
                if (e.target.files && e.target.files.length > 0) {
                    setFotosStatus(prev => ({ ...prev, [key]: "✅ OK" }));
                    showToast(`📸 Foto ${key.replace('f', '')} anexada com sucesso!`);
                }
            };

            const montarTexto = () => {
                let fCount = Object.values(fotosStatus).filter(x => x.includes('OK')).length;
                return `📊 *RELATÓRIO DE CAMPO - SARAH IA*\\n` +
                       `🏛️ *Setor:* ${setor}\\n` +
                       `👤 *Agente:* ${agente}\\n` +
                       `📍 *Local:* ${localizacao || 'Não informado'}\\n` +
                       (lk ? `🔗 *Mapa:* ${lk}\\n` : ``) +
                       `📸 *Fotos anexadas:* ${fCount}/4\\n` +
                       `📝 *Relato:*\\n${relato || 'Sem relato adicional.'}`;
            };

            const copiarLaudo = () => {
                navigator.clipboard.writeText(montarTexto());
                showToast("📋 Relatório copiado para a área de transferência!");
            };

            const enviarZap = () => {
                const text = montarTexto();
                window.open(`https://api.whatsapp.com/send?text=${encodeURIComponent(text)}`);
            };

            const gerarPDF = () => {
                const elemento = document.getElementById('conteudoRelatorioPDF');
                const opcoes = {
                    margin: 10,
                    filename: 'relatorio_tecnico_campo_sarah.pdf',
                    image: { type: 'jpeg', quality: 0.98 },
                    html2canvas: { scale: 2, useCORS: true },
                    jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' }
                };
                html2pdf().from(elemento).set(opcoes).save();
                showToast("📥 Relatório PDF gerado com sucesso!");
            };

            return (
                <div className="space-y-4">
                    <div className="flex items-center justify-between glass-dark px-4 py-3 rounded-2xl border border-cyberNeon/40">
                        <span className="text-xs font-bold text-cyberNeon flex items-center gap-2">
                            <span>📋</span> Mapeamento de Campo & Vistoria Técnica
                        </span>
                        <button 
                            onClick={onBackToChat} 
                            className="px-3.5 py-1.5 bg-coralAlert/25 hover:bg-coralAlert/40 text-coralAlert border border-coralAlert/50 rounded-xl text-xs font-bold transition cursor-pointer btn-animated flex items-center gap-1.5"
                        >
                            <span>✕</span> Fechar
                        </button>
                    </div>

                    <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                        <div className="glass-dark rounded-3xl p-6 space-y-4 border border-cyberNeon/40 shadow-xl">
                            <h2 className="text-sm font-bold text-cyberNeon border-b border-cyberNeon/30 pb-2">1. Dados do Mapeamento</h2>
                            
                            <div>
                                <label className="block text-[10px] font-extrabold uppercase tracking-wider text-lightSilver mb-1">Setor / Finalidade</label>
                                <select value={setor} onChange={(e) => setSetor(e.target.value)} className="w-full bg-nightBlue border border-cyberNeon/40 rounded-xl p-2.5 text-xs text-lightSilver focus:ring-2 focus:ring-cyberNeon focus:outline-none">
                                    <option>🛡️ Defesa Civil (Vistoria de Risco / Ocorrência)</option>
                                    <option>🤝 Assistência Social (Vulnerabilidade / Cadastro)</option>
                                    <option>🎓 Universidade (Pesquisa / Relatório de Extensão)</option>
                                    <option>🌱 Iniciativa Comunitária / Monitoramento</option>
                                </select>
                            </div>

                            <div>
                                <label className="block text-[10px] font-extrabold uppercase tracking-wider text-lightSilver mb-1">Nome do Agente / Pesquisador</label>
                                <input type="text" value={agente} onChange={(e) => setAgente(e.target.value)} placeholder="Seu nome completo" className="w-full bg-nightBlue border border-cyberNeon/40 rounded-xl p-2.5 text-xs text-lightSilver focus:ring-2 focus:ring-cyberNeon focus:outline-none" />
                            </div>

                            <div>
                                <label className="block text-[10px] font-extrabold uppercase tracking-wider text-lightSilver mb-1">Localização</label>
                                <input type="text" value={localizacao} onChange={(e) => setLocalizacao(e.target.value)} placeholder="Endereço ou Coordenadas" className="w-full bg-nightBlue border border-cyberNeon/40 rounded-xl p-2.5 text-xs text-lightSilver focus:ring-2 focus:ring-cyberNeon focus:outline-none" />
                            </div>

                            <div className="border border-dashed border-cyberNeon bg-nightBlue rounded-2xl p-3 flex justify-between items-center text-xs text-lightSilver">
                                <span className="font-mono text-mintEmerald">{gpsStatus}</span>
                                <button type="button" onClick={handleCapturarGps} className="bg-cyberNeon hover:bg-cyan-400 text-nightBlue font-black px-3 py-1.5 rounded-xl cursor-pointer transition shadow">
                                    Capturar GPS 🛰
                                </button>
                            </div>

                            <div>
                                <div className="flex justify-between items-center mb-1">
                                    <label className="text-[10px] font-extrabold uppercase tracking-wider text-lightSilver">Relatório Técnico / Descrição</label>
                                    <span className="text-[10px] text-lightSilver/60 font-mono">{relato.length}/1000</span>
                                </div>
                                <textarea rows="4" maxLength="1000" value={relato} onChange={(e) => setRelato(e.target.value)} placeholder="Descreva as condições observadas..." className="w-full bg-nightBlue border border-cyberNeon/40 rounded-xl p-2.5 text-xs text-lightSilver focus:ring-2 focus:ring-cyberNeon focus:outline-none resize-none"></textarea>
                            </div>

                            <div>
                                <label className="block text-[10px] font-extrabold uppercase tracking-wider text-cyberNeon text-center mb-2">Fotos de Evidência (Até 4)</label>
                                <div className="grid grid-cols-2 gap-2">
                                    <label htmlFor="f1" className="border border-dashed border-mintEmerald bg-nightBlue rounded-xl p-3 text-center cursor-pointer hover:bg-mintEmerald/10 transition">
                                        <span className="text-cyberNeon text-xs font-bold">+ Foto 1</span><br/>
                                        <span id="t1" className="text-[10px] text-lightSilver/70">{fotosStatus.f1}</span>
                                    </label>

        function CustomVideoPlayer({ vid }) {
            const [isFullscreen, setIsFullscreen] = React.useState(false);
            const [isPlaying, setIsPlaying] = React.useState(false);
            const [isMuted, setIsMuted] = React.useState(false);
            const containerRef = React.useRef(null);
            const videoRef = React.useRef(null);

            const toggleFullscreenCustom = () => {
                setIsFullscreen(!isFullscreen);
            };

            const togglePlay = () => {
                if (videoRef.current) {
                    if (videoRef.current.paused) {
                        videoRef.current.play().then(() => {
                            setIsPlaying(true);
                        }).catch(() => {
                            videoRef.current.muted = true;
                            setIsMuted(true);
                            videoRef.current.play().then(() => setIsPlaying(true)).catch(() => {});
                        });
                    } else {
                        videoRef.current.pause();
                        setIsPlaying(false);
                    }
                }
            };

            const toggleMute = () => {
                if (videoRef.current) {
                    videoRef.current.muted = !videoRef.current.muted;
                    setIsMuted(videoRef.current.muted);
                }
            };

            return (
                <div 
                    ref={containerRef}
                    style={
                        isFullscreen 
                            ? { position: 'fixed', top: 0, left: 0, width: '100vw', height: '100vh', zIndex: 9999, background: 'black', display: 'flex', flexDirection: 'column', justifyContent: 'center', alignItems: 'center', padding: '10px' }

                    }
                    className="rounded-xl overflow-hidden border border-cyberNeon/20 bg-black flex flex-col justify-between shadow-lg"
                >
                    <video 
                        ref={videoRef}
                        src={vid.url} 
                        playsInline 
                        preload="auto"
                        onPlay={() => setIsPlaying(true)}
                        onPause={() => setIsPlaying(false)}
                        className="w-full h-full object-contain bg-black flex-1"
                    />
                    
                    <div className="absolute bottom-0 left-0 right-0 bg-black/85 backdrop-blur-md p-2.5 flex items-center justify-between gap-2 z-20">

                const files = Array.from(e.target.files);
                if (files.length === 0) return;

                files.forEach(file => {
                    const reader = new FileReader();
                    reader.onload = (uploadEvt) => {
                        const base64Url = uploadEvt.target.result;
                        const newVid = {
                            id: Date.now() + Math.random(),
                            title: file.name,
                            url: base64Url
                        };
                        setLocalVideos(prev => [newVid, ...prev]);
                        showToast(`📹 Vídeo "${file.name}" salvo com sucesso!`);
                    };
                    reader.readAsDataURL(file);
                });
            };

            const handleDeleteVideo = (id, title) => {
                if (confirm(`Deseja excluir permanentemente o vídeo "${title}"?`)) {
                    setLocalVideos(prev => prev.filter(v => v.id !== id));
                    showToast(`🗑 Vídeo removido.`);

                    )}

                    <header className="glass-dark sticky top-0 z-30 px-4 py-3 border-b border-cyberNeon/30 flex items-center justify-between shadow-lg">
                        <div className="flex items-center gap-3">
                            <div className="w-11 h-11 rounded-full border-2 border-white/60 flex items-center justify-center bg-black">
                                <svg width="20" height="20" viewBox="0 0 24 24" fill="#00F0FF"><path d="M13 2L3 14h7l-1 8 10-12h-7l1-8z"/></svg>
                            </div>
                            <div>
                                <h1 className="text-xs sm:text-sm font-black text-cyberNeon">SARAH IA NEXUS <span className="text-[10px] text-lightSilver/80">v5.2 PRO</span></h1>
                                <p className="text-[10px] text-mintEmerald font-mono">CIDADÃO SENSOR • MESQUITA/RJ</p>
                            </div>
                        </div>
                        <div className="flex items-center gap-2">
                            <button onClick={handleShareLink} className="p-2 rounded-xl bg-petroleumPanel border border-cyberNeon/40 text-lightSilver text-xs cursor-pointer">🔗</button>
                        </div>
                    </header>

                    <div className="bg-petroleumPanel/90 border-b border-cyberNeon/30 px-3 py-2 flex flex-wrap items-center justify-center gap-2 z-20">
                        <button onClick={() => setActiveTab("chat")} className={`px-3 py-1.5 rounded-xl text-xs font-bold transition cursor-pointer ${activeTab === "chat" ? "bg-cyberNeon text-nightBlue font-black" : "bg-nightBlue text-cyberNeon border border-cyberNeon/30"}`}>💬 Chat</button>
                        <button onClick={() => setActiveTab("radar")} className={`px-3 py-1.5 rounded-xl text-xs font-bold transition cursor-pointer ${activeTab === "radar" ? "bg-cyberNeon text-nightBlue font-black" : "bg-nightBlue text-cyberNeon border border-cyberNeon/30"}`}>🛰️ Radar</button>
                        <button onClick={() => setActiveTab("videos")} className={`px-3 py-1.5 rounded-xl text-xs font-bold transition cursor-pointer ${activeTab === "videos" ? "bg-white text-nightBlue font-black" : "bg-nightBlue text-white border border-white/30"}`}>🎥 Vídeos</button>
                        <button onClick={() => setActiveTab("relatorio")} className={`px-3 py-1.5 rounded-xl text-xs font-bold transition cursor-pointer ${activeTab === "relatorio" ? "bg-mintEmerald text-nightBlue font-black" : "bg-nightBlue text-mintEmerald border border-mintEmerald/30"}`}>📋 Vistoria</button>
                        <button onClick={() => setActiveTab("admin")} className={`px-3 py-1.5 rounded-xl text-xs font-bold transition cursor-pointer ${activeTab === "admin" ? "bg-cyberNeon text-nightBlue font-black" : "bg-nightBlue text-cyberNeon border border-cyberNeon/30"}`}>🔒 Admin</button>
                        <button onClick={toggleTheme} className="px-3 py-1.5 bg-petroleumPanel border border-cyberNeon/40 text-cyberNeon rounded-xl text-xs font-bold">🎨</button>
                    </div>

                    <main className="flex-1 max-w-5xl w-full mx-auto p-4 space-y-4 pb-20">
                        <div style={{ display: activeTab === "radar" ? "block" : "none" }}>
                            <NativeHydroWindRadar liveWeather={liveWeather} />
                        </div>
                        <div style={{ display: activeTab === "videos" ? "block" : "none" }}>
                            <PublicVideoGallery localVideos={localVideos} />
                        </div>
                        <div style={{ display: activeTab === "admin" ? "block" : "none" }}>
                            <AdminVaultModule localVideos={localVideos} setLocalVideos={setLocalVideos} showToast={showToast} onClose={() => setActiveTab("chat")} />
                        </div>
                        <div style={{ display: activeTab === "relatorio" ? "block" : "none" }}>
                            <FieldReportModule onBackToChat={() => setActiveTab("chat")} showToast={showToast} />
                        </div>
                        <div style={{ display: activeTab === "chat" ? "block" : "none" }} className="space-y-4">
                            <div className="glass-dark p-6 rounded-[32px] border border-cyberNeon/40 shadow-2xl flex flex-col sm:flex-row items-center gap-6">
                                <SarahHologramAvatar isLarge={true} isSpeaking={isSpeaking} />
                                <div className="space-y-3 text-center sm:text-left flex-1">
                                    <h2 className="text-base font-black text-white">Central de Atendimento e Meteorologia</h2>
                                    <p className="text-xs text-lightSilver/90">"Prevenção não é mídia: é gente atenta."</p>
                                </div>
                            </div>
                            <div className="glass-dark rounded-3xl p-4 sm:p-6 border border-cyberNeon/40 shadow-2xl min-h-[380px] flex flex-col justify-between">
                                <div className="space-y-3 mb-4 max-h-[420px] overflow-y-auto">
                                    {messages.length === 0 ? (
                                        <div className="text-center py-8 text-cyberNeon font-semibold text-xs">Inicie uma conversa ou selecione uma opção</div>
                                    ) : (
                                        messages.map((m) => (
                                            <div key={m.id} className={`flex ${m.sender === 'user' ? 'justify-end' : 'justify-start'}`}>
                                                <div className={`max-w-[85%] p-4 rounded-3xl text-sm ${m.sender === 'user' ? 'bg-cyberNeon text-nightBlue font-bold' : 'bg-petroleumPanel text-lightSilver border border-cyberNeon/30'}`}>
                                                    <div>{m.text}</div>
                                                </div>
                                            </div>
                                        ))
                                    )}
                                </div>
                                <form onSubmit={(e) => { e.preventDefault(); handleSendMessage(); }} className="flex items-center gap-2 pt-3 border-t border-cyberNeon/30">
                                    <button type="button" onClick={toggleListening} className="p-3 rounded-2xl bg-nightBlue border border-cyberNeon/40 text-cyberNeon">🎙</button>
                                    <input type="text" value={input} onChange={(e) => setInput(e.target.value)} placeholder="Digite sua mensagem..." className="flex-1 bg-nightBlue border border-cyberNeon/40 rounded-2xl px-4 py-3 text-xs text-lightSilver focus:outline-none" />
                                    <button type="submit" className="px-5 py-3 bg-mintEmerald text-nightBlue font-black rounded-2xl text-xs cursor-pointer">Enviar</button>
                                </form>
                            </div>
                        </div>
                    </main>

                    <footer className="bg-nightBlue border-t border-cyberNeon/40 py-5 px-4 text-center text-xs font-sans space-y-1.5 z-20">
                        <div className="font-bold text-cyberNeon">Defesa Civil Comunitária Cidadão Sensor • SARAH IA NEXUS v5.2 PRO</div>
                        <div className="text-lightSilver text-[11px]">Grupo Comunitário A Chave da Esperança • Mesquita/RJ • 2026</div>
                    </footer>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById("root"));
        root.render(<App />);

        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js').catch(() => {}));
        }
    </script>
</body>
</html>
