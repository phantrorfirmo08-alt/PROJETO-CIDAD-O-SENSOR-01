<!DOCTYPE html>
<html lang="pt-BR" class="dark">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SARAH IA Core v5.2 PRO - Defesa Civil Comunitária</title>
<meta property="og:image" content="https://www.image2url.com/r2/default/images/1790084936078-de3b77c5-fa9f-4b89-a02a-560b09e8b5a0.png">
<link rel="manifest" href="manifest.json">
<script src="https://cdn.tailwindcss.com"></script>
<script>tailwind.config={darkMode:"class",theme:{extend:{colors:{amberAlert:"#FFB74D"},animation:{scanline:"scan 3.5s linear infinite","radar-wave":"radarWave 3s linear infinite",mouth:"mouthTalk 0.25s infinite"},keyframes:{scan:{"0%":{transform:"translateY(-100%)"},"100%":{transform:"translateY(100%)"}},radarWave:{"0%":{transform:"scale(0.8)",opacity:"1"},"100%":{transform:"scale(2.4)",opacity:"0"}},mouthTalk:{"0%,100%":{transform:"scaleY(1)"},"50%":{transform:"scaleY(1.6)"}}}}}}</script>
<script src="https://unpkg.com/react@18/umd/react.development.js"></script><script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script><script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>.glass-dark{background:rgba(2,6,23,0.94);backdrop-filter:blur(20px);border:1px solid rgba(255,183,77,0.3)}</style>
</head>
<body class="bg-slate-950 text-slate-100"><div id="root"></div>
<script type="text/babel">
const WORKER="https://sarah-envelope.phantrorfirmo08.workers.dev/";
function SarahAvatar({isSpeaking=false}){
 const [blink,setBlink]=React.useState(false);
 React.useEffect(()=>{let t;const loop=()=>{setBlink(true);setTimeout(()=>setBlink(false),140);t=setTimeout(loop,2000+Math.random()*2000)};t=setTimeout(loop,2000);return()=>clearTimeout(t)},[]);
 return(<div className={`relative inline-flex transition-transform ${isSpeaking?'scale-110':''}`}><div className={`w-32 h-32 rounded-3xl bg-gradient-to-br from-emerald-950 via-slate-950 to-green-950 border-2 ${isSpeaking?'border-amber-400 shadow-[0_0_40px_#FFB74D]':'border-amber-400/70'} flex items-center justify-center relative overflow-hidden`}>
 <svg className="w-4/5 h-4/5 text-amber-400" viewBox="0 0 100 100" fill="none"><circle cx="50" cy="10" r="2" fill="#fff"/><circle cx="50" cy="16" r="7" fill="#15803d" stroke="#FFB74D" strokeWidth="1.5"/><circle cx="50" cy="16" r="3.5" fill="#fff"/><path d="M42 74 C38 82,48 90,44 98" stroke="#38bdf8" strokeWidth="4" fill="none" strokeLinecap="round"/><path d="M24 44 C24 28,36 22,50 22 C64 22,76 28,76 44 C76 60,66 74,50 74 C34 74,24 60,24 44 Z" fill="#0f291e" stroke="#FFB74D" strokeWidth="2.2"/><rect x="29" y="35" width="42" height="26" rx="9" fill="#020617" stroke="#FFB74D" strokeWidth="1.5"/><ellipse cx="39" cy="48" rx="5" ry={blink?0.5:4} fill="#38bdf8"/><ellipse cx="61" cy="48" rx="5" ry={blink?0.5:4} fill="#38bdf8"/><g className={isSpeaking?"animate-mouth":""}><path d={isSpeaking?"M40 61 Q50 70 60 61 Q50 66 40 61":"M43 62 C46 65,54 65,57 62"} stroke="#FFB74D" strokeWidth={isSpeaking?2.6:1.8} fill={isSpeaking?"#FFB74D":"none"} strokeLinecap="round"/></g></svg>
 <div className="absolute inset-x-0 h-1 bg-amber-400 animate-scanline"></div></div>{isSpeaking&&<><div className="absolute -inset-2 rounded-3xl border-2 border-amber-400/60 animate-ping"></div><div className="absolute -inset-5 rounded-3xl border border-amber-400/20 animate-radar-wave"></div><div className="absolute -bottom-4 left-1/2 -translate-x-1/2 px-3 py-1 bg-amber-400 text-slate-950 rounded-full font-mono text-[10px] font-bold animate-bounce">🔴 FALANDO...</div></>}</div>);
}
function App(){
 const [isSpeaking,setIsSpeaking]=React.useState(false);const [input,setInput]=React.useState("");const [msgs,setMsgs]=React.useState([]);const [toast,setToast]=React.useState(null);
 const showToast=(m)=>{setToast(m);setTimeout(()=>setToast(null),3000)};
 const stop=()=>{speechSynthesis.cancel();setIsSpeaking(false)};
 const speak=(t)=>{stop();const u=new SpeechSynthesisUtterance(t);u.lang="pt-BR";u.rate=0.95;u.onstart=()=>setIsSpeaking(true);u.onend=()=>setIsSpeaking(false);speechSynthesis.speak(u);};
 const share=async()=>{
  const url='https://phantrorfirmo08-alt.github.io/PROJETO-CIDAD-O-SENSOR-01/?v=5.2';
  const icon='https://www.image2url.com/r2/default/images/1790084936078-de3b77c5-fa9f-4b89-a02a-560b09e8b5a0.png';
  try{const r=await fetch(icon);const b=await r.blob();const f=new File([b],'sarah-icone.png',{type:b.type});if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f],title:'SARAH IA v5.2 PRO',text:`App de Prevenção Comunitário ${url} [Ícone Oficial]`,url});showToast("✅ Com ícone!");return;}}catch(e){}
  if(navigator.share){try{await navigator.share({title:'SARAH IA',text:`App de Prevenção ${url}`,url});return;}catch(e){}}
  const txt=encodeURIComponent(`App de Prevenção Comunitário Automatizado SARAH IA ${url} [Ícone Oficial]`);window.open(`https://api.whatsapp.com/send?text=${txt}`,'_blank');
 };
 const send=async()=>{if(!input.trim())return;const user={id:Date.now(),s:"user",t:input};setMsgs(p=>[...p,user]);const q=input;setInput("");try{const r=await fetch(WORKER,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({model:"openai/gpt-oss-120b",messages:[{role:"system",content:"Você é SARAH IA Core v5.2 PRO Defesa Civil Comunitária Sebinho Mesquita RJ. Lema: Prevenção não é mídia é gente atenta."},{role:"user",content:q}],max_tokens:600})});const d=await r.json();const reply=d?.choices?.[0]?.message?.content||"Sem resposta do cofre.";setMsgs(p=>[...p,{id:Date.now()+1,s:"sarah",t:reply}]);speak(reply);}catch(e){setMsgs(p=>[...p,{id:Date.now()+1,s:"sarah",t:"Falha de enlace neural."}]);}};
 return(<div className="min-h-screen bg-slate-950 flex flex-col">
  {toast&&<div className="fixed top-20 left-1/2 -translate-x-1/2 bg-amber-400 text-slate-950 px-6 py-3 rounded-2xl font-mono text-xs font-bold z-50">{toast}</div>}
  <header className="glass-dark px-4 py-3 flex justify-between items-center"><div className="flex items-center gap-3"><div className="w-10 h-10 rounded-xl bg-amber-400/10 border border-amber-400/50 flex items-center justify-center">🛡️</div><div><h1 className="text-xs font-bold">Cidadão Sensor <span className="bg-amber-400/20 text-amber-400 px-2 rounded text-[9px]">v5.2 PRO</span></h1><span className="text-[11px] text-amber-400 font-mono">SARAH IA Centralizada • Coque + Trança</span></div></div><button onClick={share} className="w-10 h-10 rounded-xl bg-slate-900 border border-amber-400/30 text-amber-400">⤴</button></header>
  <main className="flex-1 max-w-3xl mx-auto w-full p-4"><div className="glass-dark rounded-3xl p-4 min-h-[75vh] flex flex-col">
    <div className="flex flex-col items-center py-6 border-b border-amber-400/20 mb-4"><SarahAvatar isSpeaking={isSpeaking}/><h2 className="font-mono text-sm font-bold text-amber-400 mt-5 text-center">{isSpeaking?"🔴 SARAH FALANDO...":"SARAH IA Core Neural • Centralizada"}</h2><p className="font-mono text-[11px] opacity-60 text-center mt-1">Prevenção, não é mídia. É gente atenta.<br/>Sebinho • Mesquita-RJ</p><div className="mt-3 flex gap-2"><button onClick={()=>{if(isSpeaking)stop();}} className="px-3 py-1.5 rounded-xl bg-red-950 text-red-300 border border-red-500/30 text-[11px] font-mono font-bold">⏹ Parar</button></div></div>
    <div className="flex-1 space-y-3 overflow-y-auto max-h-[40vh] p-2">{msgs.length===0&&<p className="text-center text-xs font-mono text-slate-500 py-6">Fala com a SARAH aqui. Ela tá no meio do chat e fala com voz + boca mexendo.</p>}{msgs.map(m=><div key={m.id} className={`flex ${m.s==="user"?"justify-end":"justify-start"}`}><div className={`max-w-[85%] rounded-2xl px-4 py-2.5 text-xs ${m.s==="user"?"bg-amber-400 text-slate-950 font-bold":"bg-slate-900 border border-amber-400/30 text-white"}`}>{m.t}</div></div>)}</div>
    <div className="mt-4 flex gap-2"><input value={input} onChange={e=>setInput(e.target.value)} onKeyDown={e=>e.key==='Enter'&&send()} placeholder="Digite sua ocorrência..." className="flex-1 px-4 py-3 rounded-2xl bg-slate-900 border border-amber-400/30 text-xs font-mono text-white"/><button onClick={send} className="w-11 h-11 rounded-2xl bg-amber-400 text-slate-950 font-bold">➤</button></div>
    <button onClick={share} className="mt-4 w-full py-3 bg-gradient-to-r from-amber-400 to-orange-500 text-slate-950 font-mono text-xs font-bold rounded-xl">COMPARTILHAR COM ÍCONE + LINK</button>
  </div></main>
 </div>);
}
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
