            if (!("speechSynthesis" in window)) return;

                window.speechSynthesis.cancel();

                const utterance = new SpeechSynthesisUtterance(cleanText);
                utterance.lang = "pt-BR";
                
                const prof = customProfile || globalVoiceProfile;
                if (prof === 'humana') {

                    utterance.pitch = 1.25;

            const totalAluminio = aluminioKg * precoAluminio;
            const totalFerro = ferroKg * precoFerro;
            const totalPapelao = papelaoKg * precoPapelao;
            const totalVidro = vidroKg * precoVidro;
            const totalOleo = oleoL * precoOleo;

            const valorTotalReciclagem = totalPet + totalAluminio + totalFerro + totalPapelao + totalVidro + totalOleo;

GADE - Grupo a Chave da Esperança - RARU NEXUS AI V11 Plus`;

        function RedeAlquinoHardwareModule({ onGoToDashboard, showToast }) {
            const [sensorId] = React.useState("ALQ-92-MESQUITA");

                try { return localStorage.getItem("raru_alquino_ip") || "http://192.168.4.1/data"; } catch(e) { return "http://192.168.4.1/data"; }
            });
            const [statusHardware, setStatusHardware] = React.useState("AGUARDANDO CONEXÃO IP");
            const [gasLevel, setGasLevel] = React.useState("-- PPM");
            const [hidroLevel, setHidroLevel] = React.useState("-- m");
            const [tempHardware, setTempHardware] = React.useState("-- C");
            const [isConnecting, setIsConnecting] = React.useState(false);

            const salvarEConectarIP = async () => {
                try {
                    localStorage.setItem("raru_alquino_ip", hardwareIpUrl);
                    setIsConnecting(true);
                    setStatusHardware("CONECTANDO AO IP...");
                    showToast(`Conectando ao IP: ${hardwareIpUrl}`);

                    const res = await fetch(hardwareIpUrl, { method: 'GET', mode: 'cors' });
                    const data = await res.json();
                    
                    if(data) {
                        setGasLevel(data.gas ? `${data.gas} PPM` : "14 PPM (Normal)");
                        setHidroLevel(data.nivelAgua ? `${data.nivelAgua} m` : "0.35 m (Estável)");
                        setTempHardware(data.temperatura ? `${data.temperatura} C` : "27.1 C");
                        setStatusHardware("CONECTADO (ONLINE VIA IP)");
                        showToast("Hardware Alquino Sincronizado.");
                    }
                } catch(err) {
                    setTimeout(() => {
                        const gasRand = Math.floor(Math.random() * 25 + 8);
                        const hidroRand = (Math.random() * 0.4 + 0.1).toFixed(2);
                        setGasLevel(`${gasRand} PPM (Normal)`);
                        setHidroLevel(`${hidroRand} m (Estável)`);
                        setTempHardware("26.8 C");
                        setStatusHardware("SIMULAÇÃO ATIVA (IP LOCAL)");
                        showToast("Modo simulação IP ativado.");
                    }, 800);
                } finally {
                    setIsConnecting(false);
                }
            };

            return (
                <div className="space-y-3.5 w-full font-mono">
                    <div className="cyber-card space-y-3.5 border border-cyberCyan/40 shadow-2xl p-4">

                            <div className="flex flex-col sm:flex-row gap-2">

                                    {isConnecting ? "CONECTANDO..." : "CONECTAR IP"}
                                </button>
                            </div>
                        </div>

                        <div className="grid grid-cols-2 gap-2.5">

                <div className="fixed inset-0 z-[120] flex items-center justify-center bg-void/90 backdrop-blur-2xl p-4 overflow-y-auto" onClick={onClose}>
                    <div className="cyber-card w-full max-w-md rounded-2xl shadow-2xl overflow-hidden max-h-[85vh] flex flex-col border border-cyberCyan/60 font-mono text-slate-200" onClick={e => e.stopPropagation()}>
                        <div className="flex items-center justify-between px-4 py-3 border-b border-cyberCyan/30 bg-deepSpace/95">
                            <h3 className="font-display text-xs font-black text-white tracking-widest uppercase">MANIFESTO INSTITUCIONAL</h3>
                            <button onClick={onClose} className="cyber-button-danger text-xs py-1 px-3 !min-h-[32px]">FECHAR</button>
                        </div>
                        <div className="flex-1 overflow-y-auto p-4 space-y-3 text-xs leading-relaxed">
                            <p>O <strong>Projeto Cidadão Sensor</strong> uniu-se ao coletivo <strong>A Chave da Esperança (GADE)</strong> em Mesquita, RJ, para soberania e proteção popular independente.</p>
                            <p className="text-cyberCyan font-bold">Prevenção inteligente para todos, Baixada.</p>
                        </div>
                    </div>
                </div>
            );
        }

        function VistoriaRARU_NEXUS({ onBackToDashboard, showToast }) {
            const [mun, setMun] = React.useState(MUNICIPIOS_92.find(m => m.n === 'Mesquita') || MUNICIPIOS_92[0]);
            const [fotos, setFotos] = React.useState([]);
            const [camOn, setCamOn] = React.useState(false);
            const [nome, setNome] = React.useState(''); 
            const [bairro, setBairro] = React.useState('');
            const [rel, setRel] = React.useState('');
            const [gps, setGps] = React.useState({lat:0, lon:0, acc:''});
            const [isAiAnalyzing, setIsAiAnalyzing] = React.useState(false);
            const [clima, setClima] = React.useState(null);
            
            const [frenteSelecionada, setFrenteSelecionada] = React.useState(FRENTES_EQUIPES_TABELA[5]);
            
            const [alarmeRusso, setAlarmeRusso] = React.useState(false);
            const [cemadenNivel, setCemadenNivel] = React.useState('VERDE');
            const [vento, setVento] = React.useState(0);
            const audioRef = React.useRef(null);
            const sireneIntervalRef = React.useRef(null);

            const RISCOS_RARU = ["R1 - BAIXO / PREVENTIVO","R2 - MODERADO / ALERTA","R3 - ALTO / ENXURRADA","R4 - EVACUAÇÃO PREVENTIVA","RH - CONVERGÊNCIA SERRAS","RE - ESTRUTURAL / TALUDE"];
            const [risco, setRisco] = React.useState(RISCOS_RARU[1]);
            const [protAtual, setProtAtual] = React.useState(null);
            
            const videoRef = React.useRef(null); 
            const streamRef = React.useRef(null);

            React.useEffect(() => {
                if (!mun?.lat) return;
                fetch(`https://api.open-meteo.com/v1/forecast?latitude=${mun.lat}&longitude=${mun.lon}&current=temperature_2m,relative_humidity_2m,precipitation,wind_speed_10m,wind_gusts_10m&timezone=auto`)
                    .then(r => r.json())
                    .then(d => {
                        setClima(d.current);
                        setVento(d.current?.wind_gusts_10m || d.current?.wind_speed_10m || 0);
                        const chuva = d.current?.precipitation || 0;
                        if(chuva >= 50) setCemadenNivel('VERMELHO');
                        else if(chuva >= 30) setCemadenNivel('LARANJA');
                        else if(chuva >= 10) setCemadenNivel('AMARELO');
                        else setCemadenNivel('VERDE');
                    })
                    .catch(() => {});
            }, [mun]);

            React.useEffect(() => {
                const chuva = clima?.precipitation || 0;
                if(risco.includes('R4') || cemadenNivel === 'VERMELHO' || (cemadenNivel === 'LARANJA' && chuva >= 30)){
                    if(!alarmeRusso) ligarSireneRussa();
                }
            }, [risco, cemadenNivel, clima]);

            React.useEffect(() => {
                return () => {
                    pararSireneRussa();
                    if (streamRef.current) streamRef.current.getTracks().forEach(t => t.stop());
                };
            }, []);

            const ligarSireneRussa = () => {
                setAlarmeRusso(true);
                showToast('ALARME RUSSO ATIVADO');
                try{
                    if(!audioRef.current) audioRef.current = new (window.AudioContext||window.webkitAudioContext)();
                    const ctx = audioRef.current; ctx.resume();
                    const osc = ctx.createOscillator(); const gain = ctx.createGain();
                    osc.type = 'sine'; osc.frequency.value = 400; gain.gain.value = 0.12;
                    osc.connect(gain); gain.connect(ctx.destination); osc.start();
                    audioRef.current._osc = osc;
                    let subindo = true;
                    sireneIntervalRef.current = setInterval(()=>{
                        let f = osc.frequency.value;
                        if(subindo){ f+=25; if(f>=900) subindo=false; }
                        else { f-=25; if(f<=400) subindo=true; }
                        osc.frequency.setTargetAtTime(f, ctx.currentTime, 0.1);
                    }, 60);
                }catch(e){}
            };

            const pararSireneRussa = () => {
                setAlarmeRusso(false);
                if(sireneIntervalRef.current) clearInterval(sireneIntervalRef.current);
                try{ audioRef.current?._osc?.stop(); audioRef.current?.close(); }catch(e){}
                audioRef.current = null;
                showToast('Sirene Russa silenciada');
            };

            const atualizarGPS = () => {
                if(!navigator.geolocation) return;
                navigator.geolocation.getCurrentPosition(p => {
                  setGps({ lat: p.coords.latitude, lon: p.coords.longitude, acc: Math.round(p.coords.accuracy) });
                  setMun(m => ({ ...m, lat: p.coords.latitude, lon: p.coords.longitude }));
                  showToast(`GPS ${Math.round(p.coords.accuracy)}m sincronizado.`);
                }, () => {}, { enableHighAccuracy: true, timeout: 5000 });
            };

            const startCam = async () => {
                try {
                  const s = await navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: "environment" } } });
                  streamRef.current = s; setCamOn(true);
                  setTimeout(() => { if(videoRef.current){ videoRef.current.srcObject = s; videoRef.current.play().catch(() => {}); } }, 100);
                  atualizarGPS();
                } catch { showToast('Câmera bloqueada.'); }
            };
            const stopCam = () => { if(streamRef.current) streamRef.current.getTracks().forEach(t => t.stop()); setCamOn(false); };

            const capturarFotoFinal = () => {
                const v = videoRef.current; if(!v) return null;
                const canvas = document.createElement('canvas');
                canvas.width = 600;
                canvas.height = Math.round(600 * (v.videoHeight / v.videoWidth));
                const ctx = canvas.getContext('2d');
                ctx.drawImage(v, 0, 0, canvas.width, canvas.height);

                ctx.fillStyle = 'rgba(3,7,18,0.92)';
                ctx.fillRect(0, canvas.height - 120, canvas.width, 120);
                ctx.fillStyle = '#00F2FE'; ctx.font = 'bold 10px monospace';
                ctx.fillText(`DATA ${new Date().toLocaleString('pt-BR')} | GPS ${(gps.lat||mun.lat).toFixed(5)}, ${(gps.lon||mun.lon).toFixed(5)}`, 10, canvas.height - 98);
                ctx.fillStyle = '#fff'; ctx.font = 'bold 10px monospace';
                ctx.fillText(`AGENTE ${(nome || 'Comunitário').slice(0,22)} | LOCALIDADE ${(bairro || 'Local').slice(0,18)} | ${mun.n}`, 10, canvas.height - 80);
                ctx.fillStyle = '#FF0055'; ctx.font = 'bold 10px monospace';
                ctx.fillText(`RISCO ${risco} | CEMADEN ${cemadenNivel}`, 10, canvas.height - 62);
                ctx.fillStyle = '#FFA500'; ctx.font = 'bold 9px monospace';
                ctx.fillText(`FRENTE ${frenteSelecionada.slice(0, 45)}`, 10, canvas.height - 44);
                ctx.fillStyle = '#FFD600'; ctx.font = 'bold 9px monospace';
                ctx.fillText(`GOES-19 | CHUVA ${clima?.precipitation||0}mm | VENTO ${vento||0}km/h | RUSSO ${alarmeRusso ? 'ON' : 'OFF'}`, 10, canvas.height - 24);
                ctx.fillStyle = '#00FF88'; ctx.font = 'bold 9px monospace';
                ctx.fillText(`CIDADÃO SENSOR - AÇÃO COMUNITÁRIA INDEPENDENTE (GADE)`, 10, canvas.height - 8);

                const base64Final = canvas.toDataURL('image/jpeg', 0.70);
                setFotos([base64Final]);
                showToast(`Foto final gerada com carimbo.`);
                return base64Final;
            };

            const textoVistoria = (prot) => `[REGISTRO DE VISTORIA COMUNITÁRIA - CIDADÃO SENSOR]
Protocolo: ${prot || protAtual || 'PROT-RARU'}
Local: ${mun.n} - ${bairro}
Classificação: ${risco}
Frente: ${frenteSelecionada}
CEMADEN: ${cemadenNivel} | Alarme Russo: ${alarmeRusso ? 'ATIVADO' : 'OFF'}
GOES-19 | Chuva ${clima?.precipitation||0}mm | Vento ${vento}km/h
GPS: ${(gps.lat||mun.lat).toFixed(5)}, ${(gps.lon||mun.lon).toFixed(5)}
Relatório: ${rel}
Anexo: 1 foto com carimbo técnico`;

            const enviarWhatsComum = async () => {
                const dados = await gerarDados(); if(!dados) return;
                const texto = textoVistoria(dados.protocolo);
                if(fotos[0] && navigator.canShare){
                    try{
                        const blob = await (await fetch(fotos[0])).blob();
                        const file = new File([blob], `vistoria-${mun.n}.jpg`, {type:'image/jpeg'});
                        if(navigator.canShare({files:[file]})){ await navigator.share({text: texto, files:[file]}); showToast('WhatsApp Comum enviado com foto.'); return; }
                    }catch(e){}
                }
                window.open(`https://api.whatsapp.com/send?text=${encodeURIComponent(texto)}`, '_blank');
                if(fotos[0]) baixarFotoLeve(fotos[0]);
                showToast('WhatsApp Comum aberto.');
            };

            const enviarWhatsBusiness = () => {
                gerarDados().then(dados => { if(!dados) return;
                    window.open(`https://wa.me/?text=${encodeURIComponent(textoVistoria(dados.protocolo))}`, '_blank');
                    if(fotos[0]) baixarFotoLeve(fotos[0]);
                    showToast('Selecione WhatsApp Business.');
                });
            };

            const adicionarNoStatusComFoto = async () => {
                if(fotos.length===0){ showToast('Capture 1 foto primeiro.'); return; }
                const texto = textoVistoria();
                try{
                    const blob = await (await fetch(fotos[0])).blob();
                    const file = new File([blob], `vistoria-${mun.n}.jpg`, {type:'image/jpeg'});
                    if(navigator.canShare && navigator.canShare({files:[file]})){
                        await navigator.share({ title:'Vistoria Comunitária', text: texto, files:[file] });
                        showToast('Selecione WhatsApp > Status.'); return;
                    }
                }catch(e){}
                baixarFotoLeve(fotos[0]);
                window.open(`https://wa.me/?text=${encodeURIComponent(texto)}`, '_blank');
            };

            const baixarFotoLeve = (base64) => { const a=document.createElement('a'); a.href=base64; a.download=`vistoria-${mun.n}.jpg`; a.click(); };

            const gerarLaudoComSarahAI = async () => {
                if(!bairro) { showToast('Informe o bairro para a IA redigir o relatório.'); return; }
                setIsAiAnalyzing(true);
                showToast('Sarah AI elaborando relatório técnico.');
                const chuva = clima?.precipitation || 0;
                const promptAi = `Aja como analista senior do Projeto Cidadão Sensor e Frentes Comunitárias da Baixada. Redija um relatório técnico comunitário independente de inspeção urbana no município de ${mun.n}, bairro ${bairro}, com classificação de risco ${risco}. Frente atuante: ${frenteSelecionada}. Inclua dados meteorológicos (${chuva}mm de chuva atual, vento ${vento}km/h, nível CEMADEN ${cemadenNivel}, satélite GOES-19) e recomendações preventivas.`;
                try {
                    const response = await fetch(CLOUDFLARE_WORKER_URL, {
                        method: "POST", headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({ model: "openai/gpt-oss-120b", messages: [{ role: "system", content: "You are Sarah, Senior Analyst." }, { role: "user", content: promptAi }], temperature: 0.4, max_tokens: 1000 })
                    });
                    const data = await response.json();
                    let aiText = data?.choices?.[0]?.message?.content || `Vistoria comunitária realizada no município de ${mun.n}, bairro ${bairro}. Risco: ${risco}.`;
                    aiText = aiText.replace(/#{1,6}\s?/g, '').replace(/\*\*/g, '').trim();
                    setRel(aiText);
                    showToast('Relatório gerado pela Sarah AI.');
                } catch(e) {
                    setRel(`RELATÓRIO TÉCNICO COMUNITÁRIO - CIDADÃO SENSOR\nMunicípio: ${mun.n} | Bairro: ${bairro}\nFrente: ${frenteSelecionada}\nClassificação de Risco: ${risco}\nCondições: ${chuva}mm precipitação, vento ${vento}km/h, CEMADEN ${cemadenNivel}.\nRecomendação: Monitoramento preventivo pela comunidade.`);
                } finally { setIsAiAnalyzing(false); }
            };

            const sha256 = async (str) => {
                const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(str));
                return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, '0')).join('');
            };

            const gerarDados = async () => {
                if(!nome) { showToast('Informe o nome do responsável.'); return null; }
                if(!bairro) { showToast('Informe o bairro.'); return null; }
                const seq = Math.floor(Math.random() * 8999 + 1000);
                const sig = mun.n.slice(0, 3).toUpperCase();
                const prot = `PROT-RARU-${sig}-2026-${seq}`;
                const hash = await sha256(`${prot}-${Date.now()}`);
                setProtAtual(prot);
                return { protocolo: prot, hash };
            };

            const gerarPDFLeve = async () => {
                const dados = await gerarDados(); if(!dados) return;
                const canvas = document.createElement('canvas');
                canvas.width = 600; canvas.height = 800;
                const ctx = canvas.getContext('2d');
                ctx.fillStyle = '#02040A'; ctx.fillRect(0,0,600,800);
                ctx.fillStyle = '#00F2FE'; ctx.font = 'bold 16px monospace';
                ctx.fillText('RELATÓRIO COMUNITÁRIO - CIDADÃO SENSOR', 20, 35);
                ctx.fillStyle = '#fff'; ctx.font = '11px monospace';
                ctx.fillText(`Protocolo: ${dados.protocolo}`, 20, 60);
                ctx.fillText(`Agente/Responsável: ${nome}`, 20, 82);
                ctx.fillText(`Local: ${mun.n} - ${bairro}`, 20, 104);
                ctx.fillText(`Frente: ${frenteSelecionada.slice(0, 50)}`, 20, 126);
                ctx.fillText(`Risco: ${risco} | CEMADEN: ${cemadenNivel}`, 20, 148);
                ctx.fillText(`GOES-19 | Chuva: ${clima?.precipitation||0}mm | Vento: ${vento}km/h`, 20, 170);
                ctx.fillText(`GPS: ${(gps.lat||mun.lat).toFixed(5)}, ${(gps.lon||mun.lon).toFixed(5)}`, 20, 192);
                ctx.fillStyle = '#E2E8F0'; ctx.font = '11px monospace';
                const linhas = (rel || 'Sem relato').match(/.{1,65}/g) || [];
                linhas.slice(0,10).forEach((l,i)=> ctx.fillText(l, 20, 225 + i*18));
                const finalizar = () => {
                    const base64PDF = canvas.toDataURL('image/jpeg', 0.70);
                    const win = window.open('', '_blank');
                    win.document.write(`<html><head><title>Relatório Comunitário</title><style>body{margin:0;background:#000;display:flex;justify-content:center} img{width:100%;max-width:600px} .btn{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#00F2FE;color:#000;font-weight:900;padding:12px 20px;border-radius:999px;border:0} @media print{.btn{display:none}}</style></head><body><img src="${base64PDF}"><button class="btn" onclick="window.print()">SALVAR RELATÓRIO PDF</button></body></html>`);
                    showToast('Relatório PDF gerado.');
                };
                if(fotos[0]){ const img = new Image(); img.onload = ()=>{ ctx.drawImage(img, 20, 430, 280, 180); finalizar(); }; img.src = fotos[0]; }
                else finalizar();
            };

            return (
                <div className="w-full space-y-3.5 font-mono">
                    <style>{`
                        .carimbo-css{ background:rgba(3,7,18,0.88); border:1px solid #00F2FE; border-radius:8px; padding:6px 8px; display:flex; flex-direction:column; gap:2px; font-size:8px; color:#00F2FE; line-height:1.4; }
                        .carimbo-css span:nth-child(2){ color:#fff; }
                        .carimbo-css span:nth-child(3){ color:#FF0055; font-weight:900; }
                    `}</style>
                    <div className="p-4 rounded-2xl border border-cyberCyan/40 space-y-3 bg-[#030712] shadow-2xl cyber-card">
                        <div className="flex justify-between items-center border-b border-cyberCyan/30 pb-2.5">
                            <h3 className="text-[11px] text-cyberCyan font-black uppercase tracking-wider">VISTORIA COMUNITÁRIA - 1 FOTO - FRENTES &amp; GADE</h3>
                            <button onClick={onBackToDashboard} className="cyber-button-danger text-[10px] py-1 px-3 !min-h-[32px]">FECHAR</button>
                        </div>
                        <div className="bg-black border border-cyberRose/30 rounded-xl p-2 text-[9px] text-cyberRose font-bold text-center">NO-MAE MESQUITA IP 10.10.21.15 - AÇÃO POPULAR INDEPENDENTE</div>

                        <div className="space-y-1.5 bg-void/90 p-3 rounded-xl border border-cyberCyan/30">
                            <label className="text-[9px] text-cyberCyan font-bold uppercase block">Selecionar Frente / Ator Comunitário ou Técnico:</label>
                            <select value={frenteSelecionada} onChange={e => setFrenteSelecionada(e.target.value)} className="w-full bg-black text-white border border-cyberCyan/40 rounded-xl p-2.5 text-[10px] font-bold cursor-pointer">
                                {FRENTES_EQUIPES_TABELA.map((f, i) => <option key={i} value={f}>{f}</option>)}
                            </select>
                        </div>

                        <div className={`rounded-xl p-3 border ${alarmeRusso ? 'bg-red-500/20 border-red-500 animate-pulse' : 'bg-black border-orange-500/40'}`}>
                            <div className="flex justify-between items-center">
                                <b className="text-[10px] text-white">RUSSO - CEMADEN - GADE - GOES-19</b>
                                <span className={`text-[9px] font-bold ${cemadenNivel==='VERMELHO' ? 'text-red-400' : cemadenNivel==='VERDE' ? 'text-green-400' : 'text-yellow-300'}`}>CEMADEN {cemadenNivel}</span>
                            </div>
                            <div className="grid grid-cols-3 gap-2 mt-2">
                                <button onClick={()=> alarmeRusso ? pararSireneRussa() : ligarSireneRussa()} className={`cyber-button text-[10px] py-2 px-2 ${alarmeRusso ? '!bg-red-500 !text-white !border-red-400' : '!border-red-500/50 !text-red-300'}`}>{alarmeRusso ? 'SILENCIAR' : 'LIGAR SIRENE'}</button>
                                <button onClick={() => showToast(`CEMADEN: ${cemadenNivel} - ${clima?.precipitation||0}mm`)} className="cyber-button text-[10px] py-2 px-2 !border-yellow-400 !text-yellow-200">CEMADEN</button>
                                <a href="https://cdn.star.nesdis.noaa.gov/GOES19/ABI/FD/GEOCOLOR/1800x1080.jpg" target="_blank" className="cyber-button text-[10px] py-2 px-2 text-center !border-blue-400 !text-blue-200">GOES-19</a>
                            </div>
                        </div>

                        {clima && (
                            <div className="bg-emerald-500/10 border border-emerald-500/30 rounded-xl p-2 text-[10px] text-emerald-300 font-mono flex justify-between items-center">
                                <span>Temp: {clima.temperature_2m}C | Chuva: {clima.precipitation}mm | Vento: {vento}km/h</span>
                                <span className="text-cyberCyan font-bold">GPS: {gps.acc ? `${gps.acc}m` : 'Ativo'}</span>
                            </div>
                        )}

                        <select value={mun.n} onChange={e => { const m = MUNICIPIOS_92.find(x => x.n === e.target.value); setMun(m); }} className="w-full bg-black text-cyberCyan border border-cyberCyan/40 rounded-xl p-2.5 text-xs font-bold cursor-pointer">
                            {MUNICIPIOS_92.map((m, i) => <option key={i} value={m.n}>{m.n} (IP: {m.ip})</option>)}
                        </select>

                        <div className="bg-black border border-cyberCyan/30 rounded-xl p-3 space-y-2.5">
                            <div className="flex justify-between items-center">
                                <span className="text-[10px] text-cyberCyan font-bold uppercase">CÂMERA COM CARIMBO DA FRENTE</span>
                                {!camOn ?
                                    <button onClick={startCam} className="cyber-button text-[10px] py-1.5 px-3">LIGAR CÂMERA</button> :
                                    <button onClick={stopCam} className="cyber-button-danger text-[10px] py-1.5 px-3">DESLIGAR</button>
                                }
                            </div>
                            <div className="bg-black rounded-xl overflow-hidden border border-cyberCyan/30 relative" style={{ minHeight: '180px' }}>
                                <video ref={videoRef} autoPlay playsInline muted style={{ width: '100%', height: '180px', objectFit: 'cover', display: camOn ? 'block' : 'none' }} />
                                {!camOn && <div className="h-[180px] grid place-items-center text-slate-500 text-xs font-bold">Toque em Ligar Câmera para registrar</div>}
                                {camOn && (
                                    <div className="absolute inset-0 pointer-events-none">
                                        <div className="absolute top-0 left-0 right-0 h-[2px] bg-cyberCyan animate-raru-scan" />
                                        <div className="absolute bottom-2 left-2 right-2"><div className="carimbo-css"><span>GPS ${(gps.lat||mun.lat).toFixed(4)}, ${(gps.lon||mun.lon).toFixed(4)} | CEMADEN {cemadenNivel}</span><span>RISCO {risco}</span><span>FRENTE {frenteSelecionada.slice(0, 38)}...</span></div></div>
                                    </div>
                                )}
                            </div>
                            {camOn && (
                                <button onClick={capturarFotoFinal} className="cyber-button-solid w-full text-xs py-3">
                                    CAPTURAR FOTO COM CARIMBO TÉCNICO
                                </button>
                            )}
                            {fotos.length > 0 && (
                                <div className="grid grid-cols-1 gap-2 pt-2">
                                    {fotos.map((img, idx) => (
                                        <div key={idx} className="relative rounded-lg overflow-hidden border border-cyberCyan/40">
                                            <img src={img} alt="Vistoria" className="w-full h-32 object-cover" />
                                            <button onClick={() => setFotos([])} className="absolute top-1 right-1 bg-red-500 text-white w-5 h-5 text-[10px] font-bold flex items-center justify-center rounded-full">X</button>
                                            <span className="absolute bottom-1 left-1 bg-black/80 text-[8px] text-green-300 px-2 py-1 rounded">FOTO FINAL APLICADA</span>
                                        </div>
                                    ))}
                                </div>
                            )}
                        </div>

                        <div className="space-y-3">
                            <input value={nome} onChange={e => setNome(e.target.value)} placeholder="Agente Comunitário / Responsável *" className="w-full bg-black border border-cyberCyan/40 rounded-xl p-3 text-xs text-white" />
                            <input value={bairro} onChange={e => setBairro(e.target.value)} placeholder="Bairro / Comunidade (ex: Rocha Sobrinho) *" className="w-full bg-black border border-cyberCyan/40 rounded-xl p-3 text-xs text-white" />
                            <select value={risco} onChange={e => setRisco(e.target.value)} className="w-full bg-black text-white border border-cyberCyan/40 rounded-xl p-3 text-xs font-bold cursor-pointer">
                                {RISCOS_RARU.map((r, i) => <option key={i} value={r}>{r}</option>)}
                            </select>
                            <div className="flex gap-2">
                                <button onClick={gerarLaudoComSarahAI} disabled={isAiAnalyzing} className="cyber-button flex-1 text-xs py-3">
                                    {isAiAnalyzing ? "GERANDO IA..." : "GERAR LAUDO SARAH AI"}
                                </button>
                            </div>
                            <textarea value={rel} onChange={e => setRel(e.target.value)} placeholder="Descrição técnica do risco ou inspeção..." className="w-full bg-black border border-cyberCyan/40 rounded-xl p-3 text-xs text-white h-24" />
                            
                            <div className="grid grid-cols-2 gap-2 pt-1">
                                <button onClick={enviarWhatsComum} className="cyber-button text-xs py-3">WHATSAPP COMUM</button>
                                <button onClick={enviarWhatsBusiness} className="cyber-button text-xs py-3">WHATSAPP BUSINESS</button>
                                <button onClick={adicionarNoStatusComFoto} className="cyber-button text-xs py-3">PUBLICAR NO STATUS</button>
                                <button onClick={gerarPDFLeve} className="cyber-button text-xs py-3 !border-cyberGreen !text-cyberGreen">BAIXAR PDF TÉCNICO</button>
                            </div>
                        </div>
                    </div>
                </div>
            );
        }

        function App() {
            const [activeTab, setActiveTab] = useState('dashboard');
            const [toastMsg, setToastMsg] = useState(null);
            const [isSarahChatOpen, setIsSarahChatOpen] = useState(false);
            const [chatMessages, setChatMessages] = useState([
                { sender: 'sarah', text: 'Olá Alexander. Sou a Sarah, supervisora de IA do Projeto Cidadão Sensor. Como posso ajudar nas frentes de resiliência e na Baixada Fluminense hoje?' }
            ]);
            const [inputChat, setInputChat] = useState('');
            const [isTyping, setIsTyping] = useState(false);
            const [voiceProfile, setVoiceProfile] = useState(globalVoiceProfile);

            const showToast = (msg) => {
                setToastMsg(msg);
                setTimeout(() => setToastMsg(null), 3500);
            };

            const toggleCommandHUD = () => {
                const htmlEl = document.documentElement;
                if (htmlEl.classList.contains('warm')) {
                    htmlEl.classList.remove('warm');
                    htmlEl.classList.add('dark');
                    showToast('HUD Holográfico Ativado.');
                } else {
                    htmlEl.classList.remove('dark');
                    htmlEl.classList.add('warm');
                    showToast('Modo Diurno / Padrão Ativado.');
                }
            };

            const handleWhoAmIClick = () => {
                setActiveTab('quem_somos');
            };

            const openSarahChat = () => {
                setIsSarahChatOpen(true);
            };

            const enviarMensagemSarah = async (e) => {
                e.preventDefault();
                if (!inputChat.trim()) return;
                const userText = inputChat.trim();
                setInputChat('');
                
                const novasMsgs = [...chatMessages, { sender: 'user', text: userText }];
                setChatMessages(novasMsgs);
                setIsTyping(true);

                try {
                    const response = await fetch(CLOUDFLARE_WORKER_URL, {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({
                            model: "openai/gpt-oss-120b",
                            messages: [
                                { role: "system", content: "You are Sarah, AI supervisor for Projeto Cidadão Sensor in Mesquita, Rio de Janeiro, collaborating with Alexander da Silva Firmo on urban resilience, flood monitoring, and community protection." },
                                ...novasMsgs.map(m => ({ role: m.sender === 'user' ? 'user' : 'assistant', content: m.text }))
                            ],
                            temperature: 0.6,
                            max_tokens: 800
                        })
                    });
                    const data = await response.json();
                    let aiReply = data?.choices?.[0]?.message?.content || "Estou monitorando os dados da subestação e das bacias hidrográficas em tempo real.";
                    aiReply = aiReply.replace(/#{1,6}\s?/g, '').replace(/\*\*/g, '').trim();

                    setChatMessages(prev => [...prev, { sender: 'sarah', text: aiReply }]);
                    if (voiceProfile !== 'mudo') {
                        falarSarah(aiReply, voiceProfile);
                    }
                } catch(err) {
                    const fallbackReply = "Sistema operando em modo local P2P. Todos os protocolos de monitoramento da Baixada Fluminense estão ativos.";
                    setChatMessages(prev => [...prev, { sender: 'sarah', text: fallbackReply }]);
                    if (voiceProfile !== 'mudo') falarSarah(fallbackReply, voiceProfile);
                } finally {
                    setIsTyping(false);
                }
            };

            return (
                <div className="seu-container-raru">
                    {toastMsg && (
                        <div className="fixed top-4 left-1/2 transform -translate-x-1/2 z-[150] bg-cyberCyan/90 text-void font-display font-black text-[10px] px-4 py-2.5 rounded-full shadow-[0_0_20px_rgba(0,242,254,0.6)] backdrop-blur-md animate-bounce tracking-wider border border-white">
                            {toastMsg}
                        </div>
                    )}

                    {isSarahChatOpen && (
                        <div className="fixed inset-0 z-[130] flex items-center justify-center bg-void/90 backdrop-blur-xl p-3" onClick={() => setIsSarahChatOpen(false)}>
                            <div className="cyber-card w-full max-w-lg rounded-2xl shadow-2xl overflow-hidden flex flex-col h-[80vh] border border-cyberCyan/60 font-mono text-slate-200" onClick={e => e.stopPropagation()}>
                                <div className="flex items-center justify-between px-4 py-3 border-b border-cyberCyan/30 bg-deepSpace">
                                    <div className="flex items-center gap-2">
                                        <span className="w-2.5 h-2.5 rounded-full bg-cyberGreen animate-ping"></span>
                                        <h3 className="font-display text-xs font-black text-white tracking-widest uppercase">SARAH AI - SUPERVISORA V11</h3>
                                    </div>
                                    <button onClick={() => setIsSarahChatOpen(false)} className="cyber-button-danger text-[10px] py-1 px-3 !min-h-[32px]">FECHAR</button>
                                </div>
                                <div className="flex-1 overflow-y-auto p-4 space-y-3 text-xs leading-relaxed">
                                    {chatMessages.map((m, idx) => (
                                        <div key={idx} className={`p-3 rounded-xl max-w-[85%] ${m.sender === 'user' ? 'ml-auto bg-cyberCyan/20 border border-cyberCyan/40 text-white' : 'mr-auto bg-commandPanel border border-cyberBlue/30 text-slate-200'}`}>
                                            <span className="text-[8px] font-bold text-cyberCyan block mb-1 uppercase">{m.sender === 'user' ? 'Alexander' : 'Sarah AI'}</span>
                                            {m.text}
                                        </div>
                                    ))}
                                    {isTyping && (
                                        <div className="p-3 rounded-xl max-w-[50%] mr-auto bg-commandPanel border border-cyberBlue/30 text-cyberCyan text-[10px] animate-pulse">
                                            Sarah está processando...
                                        </div>
                                    )}
                                </div>
                                <form onSubmit={enviarMensagemSarah} className="p-3 border-t border-cyberCyan/30 bg-deepSpace flex gap-2">
                                    <input type="text" value={inputChat} onChange={e => setInputChat(e.target.value)} placeholder="Digite sua mensagem para a Sarah..." className="flex-1 bg-void border border-cyberCyan/40 rounded-xl p-2.5 text-xs text-white" />
                                    <button type="submit" className="cyber-button text-xs py-2 px-4">ENVIAR</button>
                                </form>
                            </div>
                        </div>
                    )}

                    {activeTab === 'dashboard' && (
                        <div className="space-y-3.5 w-full">
                            <CardIdentidadeVisualRARU 
                                openShareFromApp={() => {
                                    if (navigator.share) {
                                        navigator.share({ title: 'RARU NEXUS V11 Plus', text: shareMessageText, url: APP_SHARE_URL }).catch(()=>{});
                                    } else {
                                        navigator.clipboard.writeText(APP_SHARE_URL);
                                        showToast('Link do PWA copiado.');
                                    }
                                }}
                                openSarahChat={openSarahChat}
                                handleWhoAmIClick={handleWhoAmIClick}
                                setActiveTab={setActiveTab}
                                toggleCommandHUD={toggleCommandHUD}
                            />
                            <NovoMapaRadarLeaflet showToast={showToast} />
                        </div>
                    )}

                    {activeTab === 'estacao' && <EstacaoSobrevivenciaModuleV12 showToast={showToast} />}
                    {activeTab === 'vistoria' && <VistoriaRARU_NEXUS onBackToDashboard={() => setActiveTab('dashboard')} showToast={showToast} />}
                    {activeTab === 'alquino' && <RedeAlquinoHardwareModule onGoToDashboard={() => setActiveTab('dashboard')} showToast={showToast} />}
                    {activeTab === 'balanca' && <ModuloCidadaoSensorModule onGoToDashboard={() => setActiveTab('dashboard')} showToast={showToast} />}
                    {activeTab === 'quem_somos' && (
                        <div className="space-y-4">
                            <QuemSomosModal isOpen={true} onClose={() => setActiveTab('dashboard')} />
                        </div>
                    )}

                    <nav className="fixed bottom-0 left-0 right-0 bg-void/95 backdrop-blur-xl border-t border-cyberCyan/30 z-[100] px-2 py-2 flex justify-around items-center max-w-[640px] mx-auto">
                        <button onClick={() => setActiveTab('dashboard')} className={`flex flex-col items-center gap-1 p-2 rounded-xl transition-all ${activeTab === 'dashboard' ? 'text-cyberCyan scale-105' : 'text-slate-400 hover:text-white'}`}>
                            <IconDashboard className="w-5 h-5" />
                            <span className="text-[8px] font-bold font-display tracking-wider">PAINEL</span>
                        </button>
                        <button onClick={() => setActiveTab('estacao')} className={`flex flex-col items-center gap-1 p-2 rounded-xl transition-all ${activeTab === 'estacao' ? 'text-cyberCyan scale-105' : 'text-slate-400 hover:text-white'}`}>
                            <IconEstacao className="w-5 h-5" />
                            <span className="text-[8px] font-bold font-display tracking-wider">ESTAÇÃO</span>
                        </button>
                        <button onClick={() => setActiveTab('vistoria')} className={`flex flex-col items-center gap-1 p-2 rounded-xl transition-all ${activeTab === 'vistoria' ? 'text-cyberRose scale-105' : 'text-slate-400 hover:text-white'}`}>
                            <IconVistoria className="w-5 h-5" />
                            <span className="text-[8px] font-bold font-display tracking-wider">VISTORIA</span>
                        </button>
                        <button onClick={() => setActiveTab('alquino')} className={`flex flex-col items-center gap-1 p-2 rounded-xl transition-all ${activeTab === 'alquino' ? 'text-cyberCyan scale-105' : 'text-slate-400 hover:text-white'}`}>
                            <IconAlquino className="w-5 h-5" />
                            <span className="text-[8px] font-bold font-display tracking-wider">ALQUINO</span>
                        </button>
                        <button onClick={() => setActiveTab('balanca')} className={`flex flex-col items-center gap-1 p-2 rounded-xl transition-all ${activeTab === 'balanca' ? 'text-cyberGreen scale-105' : 'text-slate-400 hover:text-white'}`}>
                            <IconBalanca className="w-5 h-5" />
                            <span className="text-[8px] font-bold font-display tracking-wider">BALANÇA</span>
                        </button>
                    </nav>
                </div>
            );
        }

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
