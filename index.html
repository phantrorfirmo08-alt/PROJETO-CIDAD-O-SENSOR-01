    function contextoTempoBrasilia() {
      const agora = new Date();
      const hora = agora.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
      const dataCompleta = agora.toLocaleDateString('pt-BR', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
      const mes = agora.getMonth() + 1;
      let estacao = "Outono/Inverno";
      if (mes >= 12 || mes <= 3) estacao = "Verão (Período Chuvoso Crítico)";
      else if (mes >= 9 && mes <= 11) estacao = "Primavera";
      return { hora, dataCompleta, estacao };
    }

    function falarSarah(texto, vozIdx = 0) {
      if (!("speechSynthesis" in window)) return;
      window.speechSynthesis.cancel();
      const utterance = new SpeechSynthesisUtterance(texto);
      utterance.lang = "pt-BR";
      utterance.rate = 1.05;
      utterance.pitch = vozIdx === 1 ? 0.9 : vozIdx === 2 ? 1.1 : 1.0;
      const voices = window.speechSynthesis.getVoices();
      const vozPt = voices.find(v => v.lang.includes("pt-BR") || v.lang.includes("pt"));
      if (vozPt) utterance.voice = vozPt;
      window.speechSynthesis.speak(utterance);
    }

    async function chamarSarahGroq(historicoMensagens, municipio, bairro, modulo, climaAtual, userName) {
      const tCtx = contextoTempoBrasilia();
      const promptSistema = `Você é a Sarah AI, Supervisora Tática da Base Climática de Monitoramento do Projeto Cidadão Sensor e do coletivo GADE em Mesquita - RJ. 
      Operador atual: ${userName || 'Alexander'}. Local: ${municipio} - ${bairro}. Módulo ativo: ${modulo}. Data/Hora: ${tCtx.dataCompleta}, ${tCtx.hora} (${tCtx.estacao}).
      Responda de forma firme, técnica, acolhedora e direta (sem emojis), focando em proteção comunitária, geotecnia, drenagem e resiliência urbana nos 92 municípios do Rio de Janeiro.`;
      
      try {
        const mensagensFormatadas = [{ role: "system", content: promptSistema }, ...historicoMensagens];
        const res = await fetch("https://api.groq.com/openai/v1/chat/completions", {
          method: "POST",
          headers: {
            "Authorization": "Bearer gsk_SUAPIS",
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            model: "llama-3.3-70b-versatile",
            messages: mensagensFormatadas,
            temperature: 0.7,
            max_tokens: 600
          })
        });
        if (!res.ok) throw new Error("Falha na API");
        const data = await res.json();
        return data.choices[0].message.content;
      } catch (e) {
        return `Calma, ${userName || 'Alexander'}, tô contigo! Houve uma oscilação na IA remota, mas a nossa rede local em ${municipio} tá firme. Vamos manter o monitoramento de ${bairro} sob controle.`;
      }
    }

    function RadarMeteorologicoModule({ showToast }) {
      const [cidadeSel1, setCidadeSel1] = useState("Mesquita");
      const [cidadeSel2, setCidadeSel2] = useState("Rio de Janeiro");
      const [modoVisualizacao, setModoVisualizacao] = useState('mapa');

      const [dados, setDados] = useState({});
      const mapRadarRef = useRef(null);
      const mapRadarInstance = useRef(null);

      useEffect(() => {
        MUNICIPIOS_92.slice(0, 15).forEach(c => {

          .then(d => {

              setDados(prev => ({ ...prev, [c.n]: { temp: d.current.temperature_2m, chuva: d.current.precipitation, vento: d.current.wind_speed_10m } }));
            }
          }).catch(() => {});

      }, []);

          mapRadarInstance.current = m;
        }
      }, [modoVisualizacao]);

      const d1 = dados[cidadeSel1];
      const d2 = dados[cidadeSel2];

      return (

            </div>

      if (!isOpen) return null;
      return (
        <div className="fixed inset-0 z-[90] flex items-end sm:items-center justify-center bg-void/85 backdrop-blur-xl p-0 sm:p-4" onClick={onClose}>
          <div className="cyber-card w-full max-w-2xl rounded-t-3xl sm:rounded-3xl shadow-2xl overflow-hidden h-[88vh] sm:h-[78vh] flex flex-col border border-cyberCyan/60 p-0" onClick={e => e.stopPropagation()}>
            <div className="flex items-center justify-between px-4 py-3 border-b border-cyberCyan/30 bg-deepSpace/95">
              <div className="flex items-center gap-2.5">
                <div className="w-9 h-9 shrink-0 overflow-hidden rounded-full border border-cyberCyan/60 bg-void flex items-center justify-center">
                  <SarahLiveSVGAvatar isSpeaking={isSpeaking}/>
                </div>
                <div>
                  <div className="font-display text-xs font-black text-white">Sarah AI Nexus</div>
                  <div className="text-[8px] font-mono text-cyberGreen font-bold">{isListening ? 'Ouvindo...' : 'Online'}</div>
                </div>
              </div>
              <div className="flex items-center gap-1.5">
                <button onClick={onOpenNameModal} className="cyber-button text-[9px] py-1 px-2.5">NOME ✎</button>
                <button onClick={onClose} className="cyber-button-danger text-xs py-1.5 px-3.5">FECHAR</button>
              </div>
            </div>
            <div className="flex-1 overflow-y-auto p-4 space-y-3.5 font-mono">
              {messages.map((msg, index) => (
                <div key={index} className={`flex ${msg.sender === 'user' ? 'justify-end' : 'justify-start'}`}>
                  <div className={`max-w-[88%] rounded-2xl p-3.5 text-xs sm:text-sm ${msg.sender === 'user' ? 'bg-cyberCyan text-void font-bold' : 'bg-deepSpace text-slate-100 border border-cyberCyan/40'}`}>
                    <div className="text-[9px] opacity-75 mb-1">{msg.sender === 'user' ? (userName || 'Operador') : 'Sarah AI'}</div>
                    <div className="font-sans">{msg.text}</div>
                  </div>
                </div>
              ))}
              {isProcessing && <div className="text-xs text-cyberCyan animate-pulse">Sarah processando telemetria...</div>}
            </div>
            <div className="p-3 sm:p-4 bg-deepSpace/95 border-t border-cyberCyan/35">
              <form onSubmit={e => { e.preventDefault(); handleSendDirectCommand(); }} className="flex items-center gap-2.5 bg-void border border-cyberCyan/60 rounded-2xl p-2">
                <button type="button" onClick={toggleListening} className={`cyber-button text-[11px] py-2 px-3 ${isListening ? '!bg-cyberRose !text-white' : ''}`}>{isListening ? 'Ouvindo' : 'Voz'}</button>
                <input type="text" value={input} onChange={e => setInput(e.target.value)} placeholder="Digite sua mensagem..." className="flex-1 bg-transparent border-none px-2 text-xs text-white focus:outline-none" />
                <button type="submit" className="cyber-button-solid text-[11px] py-2 px-4">Enviar</button>
              </form>
            </div>
          </div>
        </div>
      );
    }

    function App() {
      const [soundEnabled, setSoundEnabled] = useState(true);
      const [isSpeaking, setIsSpeaking] = useState(false);
      const [isListening, setIsListening] = useState(false);
      const [activeTab, setActiveTab] = useState("dashboard");
      const [quemSomosOpen, setQuemSomosOpen] = useState(false);
      const [isCommandHUDActive, setIsCommandHUDActive] = useState(false);
      const [shareModalOpen, setShareModalOpen] = useState(false);
      const [toastMsgRef, setToastMsgRef] = useState(null);

      const [termsAccepted, setTermsAccepted] = useState(() => { try { return localStorage.getItem("raru_cyber_terms") === "1"; } catch(e) { return false; } });
      const [check1, setCheck1] = useState(false);
      const [check2, setCheck2] = useState(false);

      const [userName, setUserName] = useState(() => { try { return localStorage.getItem("raru_user_name") || "Alexander"; } catch(e) { return "Alexander"; } });
      const [nameModalOpen, setNameModalOpen] = useState(false);
      const [tempNameInput, setTempNameInput] = useState("");

      const [isChatOpen, setIsChatOpen] = useState(false);
      const [input, setInput] = useState("");
      const [isProcessing, setIsProcessing] = useState(false);

      const [vozSelecionada, setVozSelecionada] = useState(0);
      const [customTickerText, setCustomTickerText] = useState("");

      const showToast = (msg) => { setToastMsgRef(msg); setTimeout(() => setToastMsgRef(null), 3500); };

      const handleSaveName = (e) => {
        e.preventDefault();
        if (!tempNameInput.trim()) return;
        const nomeLimpo = tempNameInput.trim();
        setUserName(nomeLimpo);
        try { localStorage.setItem("raru_user_name", nomeLimpo); } catch(e) {}
        setNameModalOpen(false);
        setTempNameInput("");
        showToast(`Operador ${nomeLimpo} registrado!`);
      };

      const toggleCommandHUD = () => {
        const elem = document.documentElement;
        if (!isCommandHUDActive) {
          try { if (elem.requestFullscreen) elem.requestFullscreen(); } catch (err) {}
          setIsCommandHUDActive(true);
        } else {
          try { if (document.exitFullscreen) document.exitFullscreen(); } catch (err) {}
          setIsCommandHUDActive(false);
        }
      };

      const openShareFromApp = () => setShareModalOpen(true);

      const toggleListening = () => {
        const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (!SpeechRec) { showToast("Microfone indisponível."); return; }
        if (isListening) { setIsListening(false); return; }
        try {
          const rec = new SpeechRec();
          rec.lang = "pt-BR";
          rec.onstart = () => setIsListening(true);
          rec.onresult = (event) => { let final = event.results[0][0].transcript; if (final) { setInput(final); setIsListening(false); } };
          rec.onerror = () => setIsListening(false);
          rec.onend = () => setIsListening(false);
          rec.start();
        } catch (e) { setIsListening(false); }
      };

      const [messages, setMessages] = useState([
        { sender: 'assistant', text: "Calma, Alexander, tô contigo! Sou a Sarah, sua supervisora de campo.", time: new Date().toLocaleTimeString('pt-BR', {hour: '2-digit', minute:'2-digit'}) }
      ]);

      const handleSendDirectCommand = async () => {
        if (!input.trim() || isProcessing) return;
        const textToSend = input;
        const timeStr = new Date().toLocaleTimeString('pt-BR', {hour: '2-digit', minute:'2-digit'});
        const novoHistorico = [...messages, { sender: 'user', text: textToSend, time: timeStr }];
        setMessages(novoHistorico);
        setInput("");
        setIsProcessing(true);

        const resp = await chamarSarahGroq(novoHistorico.map(m => ({role: m.sender==='user'?'user':'assistant', content: m.text})), "Mesquita", "Rocha Sobrinho", activeTab, {}, userName);
        setMessages(prev => [...prev, { sender: 'assistant', text: resp, time: new Date().toLocaleTimeString('pt-BR', {hour: '2-digit', minute:'2-digit'}) }]);
        setIsProcessing(false);
      };

      const NAV_TABS = [
        { id: 'dashboard', iconComponent: <IconDashboard className="w-4 h-4"/>, label: 'Painel' },
        { id: 'radar', iconComponent: <IconRadar className="w-4 h-4"/>, label: 'Radar' },
        { id: 'relatorio', iconComponent: <IconVistoria className="w-4 h-4"/>, label: 'Vistoria' },
        { id: 'estacao', iconComponent: <IconEstacao className="w-4 h-4"/>, label: 'Estação' },
        { id: 'balanca', iconComponent: <IconBalanca className="w-4 h-4"/>, label: 'Balança' },
        { id: 'alquino', iconComponent: <IconAlquino className="w-4 h-4"/>, label: 'Alquino' },
        { id: 'compartilhar', iconComponent: <IconInstalar className="w-4 h-4"/>, label: 'Instalar' },
        { id: 'quem-somos', iconComponent: <IconQuemSomos className="w-4 h-4"/>, label: 'Sobre' },
        { id: 'galeria', iconComponent: <IconVideos className="w-4 h-4"/>, label: 'Vídeos' },
        { id: 'admin', iconComponent: <IconAdmin className="w-4 h-4"/>, label: 'Admin' }
      ];

      const handleNavClick = (tabId) => {
        if (tabId === 'compartilhar') openShareFromApp();
        else if (tabId === 'quem-somos') setQuemSomosOpen(true);
        else setActiveTab(tabId);
      };

      return (
        <div className="w-full flex-1 flex flex-col font-mono">
          {toastMsgRef && <div className="fixed top-12 left-1/2 -translate-x-1/2 z-50 cyber-card px-4 py-2 rounded-2xl font-display text-[10px] font-black text-cyberCyan shadow-2xl border border-cyberCyan/60">{toastMsgRef}</div>}
          {shareModalOpen && (
            <div className="fixed inset-0 bg-void/90 z-50 flex items-center justify-center p-4">
              <div className="cyber-card max-w-sm w-full p-4 rounded-2xl space-y-3 text-center">
                <h3 className="font-display text-xs font-black text-cyberCyan">INSTALAÇÃO</h3>
                <textarea readOnly value={shareMessageText} className="w-full h-16 bg-void border border-cyberCyan/30 rounded-xl p-2 text-[9px] text-slate-300" />
                <button onClick={() => setShareModalOpen(false)} className="cyber-button-danger w-full text-xs py-2">FECHAR</button>
              </div>
            </div>
          )}
          {nameModalOpen && (
            <div className="fixed inset-0 bg-void/95 z-[200] flex items-center justify-center p-4">
              <div className="cyber-card max-w-md w-full p-6 rounded-3xl space-y-4 text-center">
                <h3 className="font-display text-sm font-black text-cyberCyan">IDENTIFICAÇÃO NA CENTRAL</h3>
                <form onSubmit={handleSaveName} className="space-y-3">
                  <input type="text" value={tempNameInput} onChange={e => setTempNameInput(e.target.value)} placeholder="Seu nome..." className="w-full bg-void border border-cyberCyan/60 rounded-xl p-3 text-sm text-white text-center" />
                  <button type="submit" className="cyber-button-solid w-full text-xs py-3">SALVAR NOME</button>
                </form>
              </div>
            </div>
          )}
          {!termsAccepted && (
            <div className="fixed inset-0 bg-void/95 z-[200] flex items-center justify-center p-4">
              <div className="cyber-card max-w-md w-full p-5 rounded-3xl space-y-3.5 text-left">
                <h2 className="font-display text-xs font-black text-white uppercase text-center">TERMO DE RESPONSABILIDADE & LGPD</h2>
                <div className="space-y-2">
                  <label className="flex items-start gap-2 text-[11px] text-slate-200 cursor-pointer">
                    <input type="checkbox" checked={check1} onChange={e => setCheck1(e.target.checked)} className="mt-0.5" />
                    Aceito os termos da LGPD e armazenamento local.
                  </label>
                  <label className="flex items-start gap-2 text-[11px] text-slate-200 cursor-pointer">
                    <input type="checkbox" checked={check2} onChange={e => setCheck2(e.target.checked)} className="mt-0.5" />
                    Autorizo o uso do GPS estritamente para vistorias.
                  </label>
                </div>
                <button disabled={!check1 || !check2} onClick={() => { setTermsAccepted(true); try { localStorage.setItem("raru_cyber_terms", "1"); } catch(e){} }} className={`cyber-button-solid w-full text-xs py-3.5 ${check1 && check2 ? '' : 'opacity-50 cursor-not-allowed'}`}>CONCORDAR E INICIAR</button>
              </div>
            </div>
          )}
          <header className="cyber-card sticky top-0 z-30 w-full px-4 py-3 border-b border-cyberCyan/40 flex items-center justify-between rounded-2xl mb-2">
            <div className="flex items-center gap-2.5 cursor-pointer" onClick={() => setIsChatOpen(true)}>
              <div className="w-8 h-8 rounded-full border border-cyberCyan flex items-center justify-center bg-void">
                <SarahLiveSVGAvatar isSpeaking={isSpeaking}/>
              </div>
              <div>
                <h1 className="font-display text-xs sm:text-sm font-black text-white leading-none">Base Climática Tática</h1>
                <p className="text-[8px] text-cyberCyan mt-0.5">Operador: {userName || 'Alexander'} • Mesquita</p>
              </div>
            </div>
            <div className="flex items-center gap-2">
              <button onClick={toggleCommandHUD} className="cyber-button text-[9px] py-2 px-3">TELA CHEIA</button>
              <button onClick={() => { const s = !soundEnabled; setSoundEnabled(s); showToast(s ? "Áudio ON" : "Mudo"); }} className="cyber-button text-[9px] py-2 px-3">{soundEnabled ? "ÁUDIO" : "MUDO"}</button>
            </div>
          </header>
          <main className="flex-1 w-full space-y-4 pb-28">
            {activeTab === 'dashboard' && <CardIdentidadeVisualRARU handleWhoAmIClick={() => setQuemSomosOpen(true)} openSarahChat={() => setIsChatOpen(true)} openShareFromApp={openShareFromApp} setActiveTab={setActiveTab} toggleCommandHUD={toggleCommandHUD} userName={userName} onOpenNameModal={() => { setTempNameInput(userName); setNameModalOpen(true); }}/>}
            {activeTab === 'radar' && <RadarMeteorologicoModule showToast={showToast}/>}
            {activeTab === 'estacao' && <EstacaoSobrevivenciaModuleV12 showToast={showToast} soundEnabled={soundEnabled} userName={userName} vozSelecionada={vozSelecionada}/>}
            {activeTab === 'balanca' && <ModuloCidadaoSensorModule onGoToDashboard={() => setActiveTab('dashboard')} showToast={showToast}/>}
            {activeTab === 'alquino' && <RedeAlquinoHardwareModule onGoToDashboard={() => setActiveTab('dashboard')} showToast={showToast}/>}
            {activeTab === 'relatorio' && <VistoriaRARU_NEXUS onBackToDashboard={() => setActiveTab('dashboard')} showToast={showToast} userName={userName}/>}
            {activeTab === 'galeria' && <PublicVideoGalleryModule onGoToDashboard={() => setActiveTab('dashboard')}/>}
            {activeTab === 'admin' && <AdminVaultModule onClose={() => setActiveTab('dashboard')} showToast={showToast} vozSelecionada={vozSelecionada} setVozSelecionada={setVozSelecionada} customTickerText={customTickerText} setCustomTickerText={setCustomTickerText}/>}
            <AutomatedObservatoryWidget customTickerText={customTickerText}/>
          </main>
          <SarahChatOverlay isOpen={isChatOpen} onClose={() => setIsChatOpen(false)} isSpeaking={isSpeaking} isProcessing={isProcessing} messages={messages} input={input} setInput={setInput} handleSendDirectCommand={handleSendDirectCommand} toggleListening={toggleListening} isListening={isListening} userName={userName} onOpenNameModal={() => { setTempNameInput(userName); setNameModalOpen(true); }}/>
          <QuemSomosModal isOpen={quemSomosOpen} onClose={() => setQuemSomosOpen(false)} userName={userName} />
          <footer className="cyber-card fixed bottom-0 left-0 right-0 z-40 border-t border-cyberCyan/40 px-2 py-2 flex items-center justify-between gap-1 max-w-[1400px] mx-auto rounded-t-2xl">
            {NAV_TABS.map(tab => (
              <button key={tab.id} onClick={() => handleNavClick(tab.id)} className={`flex flex-col items-center justify-center gap-0.5 flex-1 py-1 rounded-xl transition ${activeTab === tab.id ? 'text-cyberCyan bg-cyberCyan/15 border border-cyberCyan/40' : 'text-slate-400 hover:text-white'}`}>
                {tab.iconComponent}
                <span className="text-[7px] sm:text-[9px] font-black truncate w-full text-center">{tab.label}</span>
              </button>
            ))}
          </footer>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
  </script>
</body>
</html>
