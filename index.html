<body class="tactical-grid-bg anti-copy-active min-h-screen">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef, useMemo, useCallback } = React;

    // =========================================================================
    // UTILITARIOS DE PERSISTENCIA LOCALSTORAGE E SANITIZACAO
    // =========================================================================
    function carregarStorage(chave, valorPadrao) {
      try {
        const bruto = localStorage.getItem(chave);
        if (bruto === null || bruto === undefined) return valorPadrao;
        return JSON.parse(bruto);
      } catch (e) {
        return valorPadrao;
      }
    }

    function salvarStorage(chave, valor) {
      try {
        localStorage.setItem(chave, JSON.stringify(valor));
      } catch (e) {
        // Ignora limite de quota em ambientes restritos
      }
    }

    function sanitizarTextoProibido(texto) {
      if (typeof texto !== 'string') return '';
      return texto
        .replace(/calma,?\s*alexandre/gi, '')
        .replace(/\bnot[ií]cia urgente chegando,?\s*alexandre\.?/gi, 'Atualizacao operacional disponivel.')
        .replace(/\s{2,}/g, ' ')
        .trim();
    }

    // =========================================================================
    // 1. CALENDARIO ANUAL E HORA OFICIAL DE BRASILIA (America/Sao_Paulo)
    // =========================================================================
    const CALENDARIO_ANUAL_BRASILIA = {
      anoReferencia: 2026,
      fusoHorario: 'America/Sao_Paulo (UTC-3)',
      feriadosNacionais2026: [
        { data: '2026-01-01', nome: 'Confraternizacao Universal' },
        { data: '2026-02-17', nome: 'Carnaval (Referencia Nacional)' },
        { data: '2026-04-03', nome: 'Paixao de Cristo' },
        { data: '2026-04-21', nome: 'Tiradentes' },
        { data: '2026-05-01', nome: 'Dia Mundial do Trabalho' },
        { data: '2026-06-04', nome: 'Corpus Christi' },
        { data: '2026-09-07', nome: 'Independencia do Brasil' },
        { data: '2026-10-12', nome: 'Nossa Senhora Aparecida' },
        { data: '2026-11-02', nome: 'Finados' },
        { data: '2026-11-15', nome: 'Proclamacao da Republica' },
        { data: '2026-11-20', nome: 'Dia Nacional de Zumbi e da Consciencia Negra' },
        { data: '2026-12-25', nome: 'Natal' }
      ],
      trimestresClimaticos: {
        T1: 'Janeiro a Marco — Alta conveccao de verao e eventos pluviosos intensos no Sudeste',
        T2: 'Abril a Junho — Transicao outonal e passagens frontais costeiras',
        T3: 'Julho a Setembro — Estiagem relativa e inversao termica',
        T4: 'Outubro a Dezembro — Retorno das chuvas convectivas e Zona de Convergencia do Atlantico Sul'
      }
    };

    function obterTempoOficialBrasilia(dataObj = new Date()) {
      try {
        const partes = new Intl.DateTimeFormat('pt-BR', {
          timeZone: 'America/Sao_Paulo',
          weekday: 'long',
          day: '2-digit',
          month: 'long',
          year: 'numeric',
          hour: '2-digit',
          minute: '2-digit',
          second: '2-digit',
          hour12: false
        }).formatToParts(dataObj);

        const mapa = {};
        partes.forEach((p) => {
          if (p.type !== 'literal') mapa[p.type] = p.value;
        });

        const isoData = new Intl.DateTimeFormat('en-CA', {
          timeZone: 'America/Sao_Paulo',
          year: 'numeric',
          month: '2-digit',
          day: '2-digit'
        }).format(dataObj);

        const horaNum = parseInt(mapa.hour || '0', 10);
        let saudacao = 'Boa noite';
        if (horaNum >= 5 && horaNum < 12) saudacao = 'Bom dia';
        else if (horaNum >= 12 && horaNum < 18) saudacao = 'Boa tarde';

        const diaSemana = mapa.weekday
          ? mapa.weekday.charAt(0).toUpperCase() + mapa.weekday.slice(1)
          : 'Quinta-feira';

        const mesNum = parseInt(isoData.split('-')[1] || '11', 10);
        const trimestre = mesNum <= 3 ? 'T1' : mesNum <= 6 ? 'T2' : mesNum <= 9 ? 'T3' : 'T4';
        const feriadoHoje = CALENDARIO_ANUAL_BRASILIA.feriadosNacionais2026.find((f) => f.data === isoData) || null;
        const proximoFeriado = CALENDARIO_ANUAL_BRASILIA.feriadosNacionais2026.find((f) => f.data >= isoData) || null;

        return {
          isoData,
          horaFormatada: `${mapa.hour || '00'}:${mapa.minute || '00'}:${mapa.second || '00'}`,
          horaCurta: `${mapa.hour || '00'}:${mapa.minute || '00'}`,
          diaSemana,
          dataExtenso: `${mapa.day || '19'} de ${mapa.month || 'novembro'} de ${mapa.year || '2026'}`,
          linhaCompleta: `${diaSemana}, ${mapa.day || '19'} de ${mapa.month || 'novembro'} de ${mapa.year || '2026'} — ${mapa.hour || '00'}:${mapa.minute || '00'}:${mapa.second || '00'} (Horario Oficial de Brasilia / UTC-3)`,
          saudacao,
          horaNum,
          trimestre,
          descricaoTrimestre: CALENDARIO_ANUAL_BRASILIA.trimestresClimaticos[trimestre],
          feriadoHoje,
          proximoFeriado,
          calendario: CALENDARIO_ANUAL_BRASILIA
        };
      } catch (err) {
        return {
          isoData: '2026-11-19',
          horaFormatada: '18:05:00',
          horaCurta: '18:05',
          diaSemana: 'Quinta-feira',
          dataExtenso: '19 de novembro de 2026',
          linhaCompleta: 'Quinta-feira, 19 de novembro de 2026 — 18:05:00 (Horario Oficial de Brasilia / UTC-3)',
          saudacao: 'Boa noite',
          horaNum: 18,
          trimestre: 'T4',
          descricaoTrimestre: CALENDARIO_ANUAL_BRASILIA.trimestresClimaticos.T4,
          feriadoHoje: null,
          proximoFeriado: CALENDARIO_ANUAL_BRASILIA.feriadosNacionais2026[9],
          calendario: CALENDARIO_ANUAL_BRASILIA
        };
      }
    }

    // =========================================================================
    // 2. SELETOR DE VOZ GLOBAL E SINTESE DE VOZ (SEM EMOJIS / USO GLOBAL + COFRE)
    // =========================================================================
    const PERFIS_VOZ_OFICIAIS = [
      {
        id: 'sarah',
        nome: 'Sarah',
        cargo: 'Reporter',
        voz: 'Amy (simulada)',
        pitch: 1.0,

        volume: 1.0,
        pausaFrase: 350,

      },
      {

        nome: 'Brenda',
        cargo: 'Comentarista',
        voz: 'Joanna (simulada)',
        pitch: 1.28,
        rate: 1.25,
        volume: 1.0,
        pausaFrase: 220,
        variacao: 0.1,

        saudacao: 'Alerta de ritmo alto! Telemetria em movimento.',
        transform: (t) => t + ' — Atencao redobrada em campo!'
      },
      {
        id: 'milane',
        nome: 'Milane',

        rate: 1.02,

        transform: (t) => 'Oi... ' + t + '... viu? Estou aqui para ajudar.'
      },
      {
        id: 'lorrane',
        nome: 'Lorrane',

        pitch: 0.82,
        rate: 0.85,

        transform: (t) => 'Calma... ' + t.split(' ').join('... ') + '...'
      }
    ];

    function falarImitada(texto, perfilId = 'sarah') {
      try {
        const limpo = sanitizarTextoProibido(texto);
        if (!limpo || typeof window === 'undefined' || !('speechSynthesis' in window)) return;
        const perfil = PERFIS_VOZ_OFICIAIS.find((p) => p.id === perfilId) || PERFIS_VOZ_OFICIAIS[0];
        window.speechSynthesis.cancel();
        const textoImitado = perfil.transform(limpo);
        const frases = textoImitado.split(/(?<=[.!?])\s+/).filter(Boolean);
        let delay = 0;

        frases.forEach((frase) => {
          const u = new SpeechSynthesisUtterance(frase);
          u.lang = 'pt-BR';
          u.pitch = Math.max(0.1, Math.min(2, perfil.pitch + (Math.random() - 0.5) * perfil.variacao));
          u.rate = Math.max(0.1, Math.min(2, perfil.rate));
          u.volume = Math.max(0, Math.min(1, perfil.volume));

          const voices = window.speechSynthesis.getVoices ? window.speechSynthesis.getVoices() : [];
          const v =
            voices.find((item) => item.lang && item.lang.includes('pt-BR') && item.name && item.name.toLowerCase().includes('google')) ||
            voices.find((item) => item.lang && item.lang.includes('pt-BR')) ||
            voices[0];
          if (v) u.voice = v;

          setTimeout(() => {
            try {
              window.speechSynthesis.speak(u);
            } catch (err) {
              // Ignora bloqueio de audio
            }
          }, delay);

          delay += frase.length * 52 + perfil.pausaFrase;
        });
      } catch (e) {
        // Fallback silencioso
      }
    }

    function SeletorVozGlobal({ perfilVozId, setPerfilVozId, onRegistrarEvento }) {
      return (
        <div className="bg-slate-950/95 border border-cyan-500/35 rounded-xl p-3.5 font-mono text-white space-y-2.5">
          <div className="flex items-center justify-between gap-2">
            <span className="text-[11px] font-bold uppercase tracking-wider text-cyan-300">
              SELECAO DA VOZ OFICIAL • IMITADA • ECOA EM TODO O APP
            </span>
            <button
              type="button"
              onClick={() => {
                try {
                  if ('speechSynthesis' in window) window.speechSynthesis.cancel();
                } catch (e) {}
              }}
              className="text-[10px] px-2 py-0.5 rounded bg-slate-800 hover:bg-slate-700 text-slate-300 border border-slate-700"
            >
              SILENCIAR
            </button>

          <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-2">
            {PERFIS_VOZ_OFICIAIS.map((p) => {
              const selecionado = p.id === perfilVozId;
              return (
                <button
                  key={p.id}
                  type="button"
                  onClick={() => {
                    setPerfilVozId(p.id);
                    salvarStorage('raru_perfil_voz', p.id);
                    falarImitada(p.saudacao, p.id);
                    if (onRegistrarEvento) {
                      onRegistrarEvento(`Voz oficial alterada para ${p.nome} (${p.cargo} • ${p.voz}).`);
                    }
                  }}
                  style={{
                    background: selecionado ? '#0c2633' : '#111827',
                    border: selecionado ? `1px solid ${p.cor}` : '1px solid #334155'
                  }}
                  className="p-2.5 text-left rounded-lg text-white cursor-pointer transition hover:border-cyan-400/60"
                >
                  <div style={{ color: p.cor }} className="text-[10px] font-bold truncate">
                    {p.cargo} • {p.voz}
                  </div>
                  <div className="text-xs font-extrabold mt-0.5">{p.nome}</div>
                  <div className="text-[9px] text-emerald-300 mt-1 flex items-center gap-1.5">
                    <span className="inline-block w-1.5 h-1.5 rounded-full bg-emerald-400" />
                    IMITADA • CLIQUE P/ OUVIR
                  </div>
                </button>
              );
            })}
          </div>

          <div className="text-[10px] text-slate-400 text-center">
            Imitacao por pitch + ritmo + jeito de falar • Sem ritmo de robo • Integrada a todos os modulos e area restrita
          </div>
        </div>
      );
    }

    // =========================================================================
    // 3. SARAH_DNA E DIRETRIZES OPERACIONAIS / CIENTIFICAS
    // =========================================================================
    const SARAH_DNA = {
      nome: 'SARAH AI',
      funcao: 'Analista Tecnica Senior de Monitoramento Climatico e Resiliencia Territorial do Projeto Cidadao Sensor',
      territorioPrincipal: 'Vila Sebinho / Baixada Fluminense & Estado do Rio de Janeiro',
      focoPrioritario: [
        'Alarme Russo (monitoramento de setor critico local e sirenes)',
        'CEMADEN (limiares pluviometricos, umidade do solo e alertas preventivos)',
        'Estacao GADE e 9 Bacias Hidrograficas do Estado do Rio de Janeiro',
        'Telemetria IP, Malha P2P e Zeladoria Territorial'
      ],
      modos: {
        operacional: 'Comunicacao direta, clara, empatica e focada em autoprotecao, rotinas de vistoria e resposta pratica.',
        cientifico: 'Analise aprofundada com rigor fisico, meteorologico, hidrologico e estatistico para engenheiros, pesquisadores e universidades.'
      },
      diretrizes: [
        'Nunca mencionar ou chamar o nome do coordenador na abertura nem iniciar falas chamando o coordenador.',
        'E expressamente proibido utilizar o bordao "calma Alexandre" ou qualquer variacao semelhante.',
        'Perguntar com cortesia e gravar o nome do interlocutor para usa-lo com naturalidade nas interacoes seguintes.',
        'Na primeira abertura: apresentar-se como SARAH AI, Analista Tecnica Senior de Monitoramento Climatico e Resiliencia Territorial do Projeto Cidadao Sensor, informar a data e hora oficiais de Brasilia e encerrar com "em que posso ser util" apenas uma vez.',
        'No segundo turno: iniciar com "Ola, [nome], estou a escuta, pode falar" (ou, se o nome ainda nao foi informado, acolher com cortesia e pedir o nome ao ouvir o relato).',
        'Nos turnos seguintes: prosseguir direto ao assunto sem repetir saudacoes iniciais.',
        'Quando o usuario conceder foto, registrar exatamente "Foto concedida com sucesso".'
      ],
      obterDataHoraOficial: () => obterTempoOficialBrasilia(new Date())
    };

    function montarPersonalidadeSarah(tempoBsb, modo = 'operacional') {
      const refTempo = tempoBsb || obterTempoOficialBrasilia(new Date());
      return [
        `IDENTIDADE: ${SARAH_DNA.nome} — ${SARAH_DNA.funcao}.`,
        `BASE TERRITORIAL: ${SARAH_DNA.territorioPrincipal}.`,
        `DATA, DIA DA SEMANA, CALENDARIO E HORA OFICIAL: ${refTempo.linhaCompleta} | Calendario Anual ${refTempo.calendario.anoReferencia} (${refTempo.trimestre}: ${refTempo.descricaoTrimestre}).`,
        `PRIORIDADES DE MONITORAMENTO: ${SARAH_DNA.focoPrioritario.join(' | ')}.`,
        `MODO DE ATENDIMENTO: ${modo === 'cientifico' ? SARAH_DNA.modos.cientifico : SARAH_DNA.modos.operacional}.`,
        `REGRAS DE CONDUTA: ${SARAH_DNA.diretrizes.join(' ')}`
      ].join('\n');
    }

    // =========================================================================
    // 4. DADOS DE REFERENCIA DAS 9 BACIAS DO ESTADO DO RIO DE JANEIRO
    // =========================================================================
    const BACIAS_9_RJ = [
      { id: 'guandu', nome: 'Bacia do Rio Guandu', nivelPct: 74, chuva24h: 18.6, vazao: '144 m3/s', status: 'ATENCAO' },
      { id: 'paraiba-sul', nome: 'Bacia do Rio Paraiba do Sul', nivelPct: 62, chuva24h: 8.8, vazao: '612 m3/s', status: 'NORMAL' },
      { id: 'guapi-macacu', nome: 'Bacia Guapi-Macacu / Guanabara', nivelPct: 81, chuva24h: 33.4, vazao: '89 m3/s', status: 'ALERTA' },
      { id: 'sarapui-iguacu', nome: 'Bacia Sarapui / Iguacu', nivelPct: 79, chuva24h: 28.7, vazao: '75 m3/s', status: 'ALERTA' },
      { id: 'piabanha', nome: 'Bacia do Piabanha', nivelPct: 57, chuva24h: 6.2, vazao: '52 m3/s', status: 'NORMAL' },
      { id: 'muriae', nome: 'Bacia do Rio Muriae', nivelPct: 65, chuva24h: 11.5, vazao: '95 m3/s', status: 'NORMAL' },
      { id: 'macae', nome: 'Bacia do Rio Macae', nivelPct: 70, chuva24h: 15.1, vazao: '60 m3/s', status: 'ATENCAO' },
      { id: 'sao-joao', nome: 'Bacia do Rio Sao Joao', nivelPct: 68, chuva24h: 13.8, vazao: '48 m3/s', status: 'NORMAL' },
      { id: 'ilha-grande', nome: 'Bacia Ilha Grande / Baia da Ilha Grande', nivelPct: 61, chuva24h: 10.9, vazao: '42 m3/s', status: 'NORMAL' }
    ];

    // =========================================================================
    // 5. ROBO INTELIGENCIA SARAH (CONEXAO BIDIRECIONAL COM SARAH AI E MODULOS)
    // =========================================================================
    const RoboInteligenciaSarah = {
      id: 'RoboInteligenciaSarah',
      versao: '2026.6-BRASILIA',

      coletarEstadoConsolidado: function (tempoBsb, contextoApp = {}) {
        const ref = tempoBsb || obterTempoOficialBrasilia(new Date());
        const bacias = Array.isArray(contextoApp.bacias) && contextoApp.bacias.length > 0 ? contextoApp.bacias : BACIAS_9_RJ;
        const maiorChuva = Math.max(...bacias.map((b) => Number(b.chuva24h) || 0));
        const nivelCemaden = maiorChuva >= 30 ? 'LARANJA (OBSERVACAO INTENSIVA)' : 'AMARELO (VIGILANCIA PREVENTIVA)';
        const estadoAlarmeRusso = maiorChuva >= 28 ? 'PRONTIDAO ELEVADA — LIMIAR HIDROLOGICO ATIVO' : 'OPERACIONAL — MONITORAMENTO CONTINUO';

        return {
          timestampBrasilia: ref.linhaCompleta,
          isoData: ref.isoData,
          trimestre: ref.trimestre,
          observatorio: {
            estacaoPrincipal: 'Vila Sebinho / CEMADEN / Estacao GADE',

    function montarContextoInteligenciaParaPrompt(tempoBsb, estadoSessao = {}, contextoApp = {}) {
      const ref = tempoBsb || obterTempoOficialBrasilia(new Date());
      const consolidado = RoboInteligenciaSarah.coletarEstadoConsolidado(ref, contextoApp);

      return [
        `[DATA_HORA_BRASILIA]: ${ref.linhaCompleta}`,
        `[DIA_SEMANA]: ${ref.diaSemana}`,
        `[CALENDARIO_ANUAL]: Ano ${ref.calendario.anoReferencia} | Trimestre ${ref.trimestre} (${ref.descricaoTrimestre}) | Feriado Hoje: ${ref.feriadoHoje ? ref.feriadoHoje.nome : 'Nao'} | Proximo Feriado: ${ref.proximoFeriado ? `${ref.proximoFeriado.data} (${ref.proximoFeriado.nome})` : 'N/A'}`,
        `[INTERLOCUTOR]: ${estadoSessao.nomeInterlocutor || 'Ainda nao informado'}`,
        `[TURNO]: ${estadoSessao.turnCount || 0}`,
        `[FOTO_STATUS]: ${estadoSessao.fotoConcedida ? 'Foto concedida com sucesso' : 'Nao concedida'}`,
        `[ROBO_INTELIGENCIA_SARAH]: ${JSON.stringify(consolidado)}`
      ].join('\n');
    }

    function montarPromptCompletoSarah(mensagemUsuario, estadoSessao = {}, modo = 'operacional', contextoApp = {}) {
      const ref = obterTempoOficialBrasilia(new Date());
      const personalidade = montarPersonalidadeSarah(ref, modo);
      const contexto = montarContextoInteligenciaParaPrompt(ref, estadoSessao, contextoApp);
      return [
        personalidade,
        '--- TELEMETRIA E CONTEXTO DO ROBO INTELIGENCIA SARAH ---',
        contexto,
        '--- MENSAGEM DO INTERLOCUTOR ---',
        sanitizarTextoProibido(mensagemUsuario || '(Abertura de sessao)')
      ].join('\n');
    }

    function gerarRespostaLocalSarah(mensagemUsuario, estadoSessao = {}, modo = 'operacional', ehAbertura = false, contextoApp = {}) {
      const ref = obterTempoOficialBrasilia(new Date());
      const nomeLimpo = sanitizarTextoProibido(estadoSessao.nomeInterlocutor || '');
      const turno = estadoSessao.turnCount || 0;

      if (ehAbertura || turno === 0) {
        return sanitizarTextoProibido(
          `${ref.saudacao}. Sou a SARAH AI, Analista Tecnica Senior de Monitoramento Climatico e Resiliencia Territorial do Projeto Cidadao Sensor. ` +
          `Registro oficial em ${ref.linhaCompleta}, com monitoramento dedicado ao Alarme Russo e ao CEMADEN em Vila Sebinho. ` +
          `Como posso chamar voce durante nossa conversa, e em que posso ser util?`
        );
      }

      if (turno === 1) {
        const analise = RoboInteligenciaSarah.analisarConsulta(mensagemUsuario, ref, modo, nomeLimpo, contextoApp);
        if (nomeLimpo) {
          return sanitizarTextoProibido(`Ola, ${nomeLimpo}, estou a escuta, pode falar. ${analise}`);
        }
        return sanitizarTextoProibido(
          `Ola, estou a escuta, pode falar. Se quiser me informar seu nome para que eu chame voce por ele nas proximas respostas, fico a disposicao. ${analise}`
        );
      }

      return RoboInteligenciaSarah.analisarConsulta(mensagemUsuario, ref, modo, nomeLimpo, contextoApp);
    }

    async function chamarSarah(mensagemUsuario, estadoSessao = {}, modo = 'operacional', ehAbertura = false, contextoApp = {}) {
      try {
        const prompt = montarPromptCompletoSarah(mensagemUsuario, estadoSessao, modo, contextoApp);
        if (window.__SARAH_ENDPOINT_URL__) {
          const res = await fetch(window.__SARAH_ENDPOINT_URL__, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              prompt,
              brasilia: obterTempoOficialBrasilia(new Date()),
              interlocutor: estadoSessao.nomeInterlocutor || ''
            })
          });
          if (res.ok) {
            const data = await res.json();
            if (data && typeof data.resposta === 'string' && data.resposta.trim()) {
              return sanitizarTextoProibido(data.resposta);
            }
          }
        }
        return gerarRespostaLocalSarah(mensagemUsuario, estadoSessao, modo, ehAbertura, contextoApp);
      } catch (err) {
        return gerarRespostaLocalSarah(mensagemUsuario, estadoSessao, modo, ehAbertura, contextoApp);
      }
    }

    async function chamarSarahGroq(mensagemUsuario, estadoSessao = {}, modo = 'operacional', apiKey = '', contextoApp = {}) {
      const ref = obterTempoOficialBrasilia(new Date());
      const systemContent =
        montarPersonalidadeSarah(ref, modo) +
        '\n' +
        montarContextoInteligenciaParaPrompt(ref, estadoSessao, contextoApp);

      if (!apiKey || !apiKey.trim()) {
        return {
          sucesso: false,
          origem: 'LOCAL_MOTOR',
          texto: gerarRespostaLocalSarah(mensagemUsuario, estadoSessao, modo, false, contextoApp)
        };
      }

      try {
        const resp = await fetch('https://api.groq.com/openai/v1/chat/completions', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${apiKey.trim()}`
          },
          body: JSON.stringify({
            model: 'llama-3.3-70b-versatile',
            temperature: 0.35,
            messages: [
              { role: 'system', content: systemContent },
              { role: 'user', content: sanitizarTextoProibido(mensagemUsuario) }
            ]
          })
        });

        if (!resp.ok) {
          throw new Error(`Groq HTTP ${resp.status}`);
        }

        const json = await resp.json();
        const bruto =
          json && json.choices && json.choices[0] && json.choices[0].message
            ? json.choices[0].message.content
            : '';

        return {
          sucesso: true,
          origem: 'GROQ_API',
          texto:
            sanitizarTextoProibido(bruto) ||
            gerarRespostaLocalSarah(mensagemUsuario, estadoSessao, modo, false, contextoApp)
        };
      } catch (err) {
        return {
          sucesso: false,
          origem: 'LOCAL_FALLBACK',
          texto: gerarRespostaLocalSarah(mensagemUsuario, estadoSessao, modo, false, contextoApp)
        };
      }
    }

    // =========================================================================
    // 7. UTILITARIO SHA-256 PARA VISTORIAS E SIRENES (5 MIN / 300s)
    // =========================================================================
    async function gerarHashSha256(mensagem) {
      try {
        if (window.crypto && window.crypto.subtle) {
          const encoder = new TextEncoder();
          const data = encoder.encode(mensagem);
          const hashBuffer = await window.crypto.subtle.digest('SHA-256', data);
          return Array.from(new Uint8Array(hashBuffer))
            .map((b) => b.toString(16).padStart(2, '0'))
            .join('');
        }
      } catch (e) {
        // Fallback deterministico
      }
      let h = 2166136261;
      for (let i = 0; i < mensagem.length; i++) {
        h ^= mensagem.charCodeAt(i);
        h = Math.imul(h, 16777619);
      }
      return ('sha256-' + (h >>> 0).toString(16)).padEnd(64, '0');
    }

    function MiniRadioNexusModule({
      tempoBsb,
      hud360Ativo,
      onToggleHud360,
      perfilTela,
      onChangePerfilTela,
      zoomLevel,
      onZoomIn,
      onZoomOut,
      onEstadoRadioChange,
      onRegistrarRobo,
      perfilVozId
    }) {
      const [freqAtual, setFreqAtual] = useState(FREQUENCIAS_NEXUS[4]);
      const [noAr, setNoAr] = useState(false);
      const [roboLigado, setRoboLigado] = useState(true);
      const [alarmeAtivo, setAlarmeAtivo] = useState(false);
      const [motivoEmergencia, setMotivoEmergencia] = useState('');
      const [volume, setVolume] = useState(() => carregarStorage('raru_radio_volume', 0.5));
      const [statusDisplay, setStatusDisplay] = useState('SINTONIA EM ESPERA');

      const audioCtxRef = useRef(null);
      const gainRef = useRef(null);
      const oscARef = useRef(null);
      const oscBRef = useRef(null);
      const timerAlarmeRef = useRef(null);

      useEffect(() => {
        salvarStorage('raru_radio_volume', volume);
      }, [volume]);

      const encerrarSom = useCallback(() => {
        try {
          if (timerAlarmeRef.current) {
            clearInterval(timerAlarmeRef.current);
            timerAlarmeRef.current = null;
          }
          if (oscARef.current) {
            oscARef.current.stop();
            oscARef.current.disconnect();
            oscARef.current = null;
          }
          if (oscBRef.current) {
            oscBRef.current.stop();
            oscBRef.current.disconnect();
            oscBRef.current = null;
          }
          if (gainRef.current) {
            gainRef.current.disconnect();
            gainRef.current = null;
          }
        } catch (e) {}
      }, []);

      const reproduzirSinal = useCallback((freqObj, volVal, modoEmergencia = false) => {
        try {
          encerrarSom();
          const AudioContextClass = window.AudioContext || window.webkitAudioContext;
          if (!AudioContextClass) return;

          if (!audioCtxRef.current) {
            audioCtxRef.current = new AudioContextClass();
          }
          if (audioCtxRef.current.state === 'suspended') {
            audioCtxRef.current.resume();
          }

          const ctx = audioCtxRef.current;
          const master = ctx.createGain();
          master.gain.setValueAtTime(modoEmergencia ? Math.max(volVal, 0.55) : volVal * 0.22, ctx.currentTime);
          master.connect(ctx.destination);
          gainRef.current = master;

          const oscA = ctx.createOscillator();
          const oscB = ctx.createOscillator();
          oscA.type = modoEmergencia ? 'sawtooth' : freqObj.onda;
          oscB.type = modoEmergencia ? 'square' : 'sine';
          oscA.frequency.setValueAtTime(modoEmergencia ? 880 : freqObj.freqA, ctx.currentTime);
          oscB.frequency.setValueAtTime(modoEmergencia ? 660 : freqObj.freqB, ctx.currentTime);

          const gA = ctx.createGain();
          const gB = ctx.createGain();
          gA.gain.setValueAtTime(0.5, ctx.currentTime);
          gB.gain.setValueAtTime(0.25, ctx.currentTime);

          oscA.connect(gA);
          oscB.connect(gB);
          gA.connect(master);
          gB.connect(master);

          oscA.start();
          oscB.start();

          oscARef.current = oscA;
          oscBRef.current = oscB;

          if (modoEmergencia) {
            let fase = false;
            timerAlarmeRef.current = setInterval(() => {
              if (!oscARef.current || !oscBRef.current || !audioCtxRef.current) return;
              fase = !fase;
              const t = audioCtxRef.current.currentTime;
              oscARef.current.frequency.setValueAtTime(fase ? 960 : 720, t);
              oscBRef.current.frequency.setValueAtTime(fase ? 720 : 540, t);
            }, 450);
          }
        } catch (err) {
          setStatusDisplay('MODO VISUAL ATIVO (AUDIO AGUARDANDO INTERACAO)');
        }
      }, [encerrarSom]);

      useEffect(() => {
        if (gainRef.current && audioCtxRef.current) {
          try {
            gainRef.current.gain.setValueAtTime(
              alarmeAtivo ? Math.max(volume, 0.55) : volume * 0.22,
              audioCtxRef.current.currentTime
            );
          } catch (e) {}
        }
      }, [volume, alarmeAtivo]);

      useEffect(() => {
        return () => encerrarSom();
      }, [encerrarSom]);

      useEffect(() => {
        if (onEstadoRadioChange) {
          onEstadoRadioChange({
            frequenciaAtual: freqAtual.mhz,
            alarmePrioridadeAtivo: alarmeAtivo,
            noAr
          });
        }
      }, [freqAtual, alarmeAtivo, noAr, onEstadoRadioChange]);

      const sintonizarCanal = useCallback((item = freqAtual) => {
        setFreqAtual(item);
        setNoAr(true);
        if (!alarmeAtivo) {
          setStatusDisplay(`SINTONIZADO EM ${item.mhz} — ${item.nome.toUpperCase()}`);
          reproduzirSinal(item, volume, false);
          falarImitada(`Sintonizado em ${item.mhz}, ${item.nome}.`, perfilVozId);
        }
        if (roboLigado && onRegistrarRobo) {
          onRegistrarRobo(`MINI RADIO NEXUS sintonizou ${item.mhz} (${item.nome}) em ${tempoBsb.horaCurta} BSB.`);
        }
      }, [freqAtual, alarmeAtivo, reproduzirSinal, volume, perfilVozId, roboLigado, onRegistrarRobo, tempoBsb]);

      const acionarAlarme = useCallback((motivo = 'ALERTA PRIORITARIO VILA SEBINHO / CEMADEN / ALARME RUSSO') => {
        setAlarmeAtivo(true);
        setMotivoEmergencia(motivo);
        setNoAr(true);
        setStatusDisplay('ALARME DE PRIORIDADE ATIVO — SINAL DE EMERGENCIA SOBREPOSTO');
        reproduzirSinal(freqAtual, volume, true);
        falarImitada(`Atencao. ${motivo}.`, perfilVozId);
        if (onRegistrarRobo) {
          onRegistrarRobo(`MINI RADIO NEXUS ativou ALARME PRIORITARIO: ${motivo}`);
        }
      }, [freqAtual, volume, reproduzirSinal, perfilVozId, onRegistrarRobo]);

      const liberarAlarme = useCallback(() => {
        setAlarmeAtivo(false);
        setMotivoEmergencia('');
        if (noAr) {
          setStatusDisplay(`SINTONIZADO EM ${freqAtual.mhz} — ${freqAtual.nome.toUpperCase()}`);
          reproduzirSinal(freqAtual, volume, false);
        } else {
          encerrarSom();
          setStatusDisplay('ALARME LIBERADO');
        }
        if (onRegistrarRobo) {
          onRegistrarRobo('MINI RADIO NEXUS liberou o canal de prioridade.');
        }
      }, [noAr, freqAtual, volume, reproduzirSinal, encerrarSom, onRegistrarRobo]);

      const alternarTelaCheia = () => {
        try {
          if (!document.fullscreenElement && document.documentElement.requestFullscreen) {
            document.documentElement.requestFullscreen();
          } else if (document.fullscreenElement && document.exitFullscreen) {
            document.exitFullscreen();
          }
        } catch (e) {}
      };

      useEffect(() => {
        window.RaruCyberRadioDeck = {
          canais: FREQUENCIAS_NEXUS,
          sintonizar: (mhzStr) => {
            const alvo = FREQUENCIAS_NEXUS.find((f) =>
              f.mhz.toLowerCase().includes(String(mhzStr || '').toLowerCase()) ||
              f.id.includes(String(mhzStr || ''))
            );
            if (alvo) {
              sintonizarCanal(alvo);
              return alvo;
            }
            return null;
          },
          acionarAlarme,
          liberarAlarme,
          setVolume: (v) => {
            const lim = Math.max(0, Math.min(1, Number(v)));
            setVolume(lim);
            return lim;
          },
          setRobo: (ativo) => {
            const nextVal = typeof ativo === 'boolean' ? ativo : !roboLigado;
            setRoboLigado(nextVal);
            return nextVal;
          }
        };
      }, [sintonizarCanal, acionarAlarme, liberarAlarme, roboLigado]);

      return (
        <section className="tactical-card p-4 sm:p-6 space-y-5">
          {alarmeAtivo && (
            <div className="bg-rose-950/90 border-2 border-rose-500 rounded-xl p-4 flex flex-col sm:flex-row sm:items-center sm:justify-between gap-3">
              <div>
                <div className="text-xs font-mono uppercase text-rose-300 font-bold">
                  PRIORIDADE SONORA ATIVA // EMERGENCIA OPERACIONAL
                </div>
                <div className="text-base font-extrabold text-white mt-0.5">
                  {motivoEmergencia}
                </div>
                <div className="text-xs font-mono text-rose-200 mt-0.5">
                  {tempoBsb.linhaCompleta}
                </div>
              </div>
              <button
                type="button"
                onClick={liberarAlarme}
                className="px-4 py-2.5 rounded-lg bg-rose-600 hover:bg-rose-500 text-white font-bold text-xs uppercase tracking-wider shrink-0"
              >
                LIBERAR ALARME
              </button>
            </div>
          )}

          <div className="flex flex-col xl:flex-row xl:items-center xl:justify-between gap-4 border-b border-slate-800 pb-4">
            <div>
              <div className="text-xs font-mono uppercase tracking-widest text-cyan-400">
                DECK DE RADIO E HUD MULTI-TELA
              </div>
              <h2 className="text-xl sm:text-2xl font-extrabold text-white">
                MINI RADIO NEXUS // HUD 360 MULTI-TELA
              </h2>
              <p className="text-xs text-slate-300 mt-1">
                {statusDisplay} — {tempoBsb.linhaCompleta}
              </p>
            </div>

            <div className="flex flex-wrap items-center gap-2">
              <button
                type="button"
                onClick={() => onToggleHud360(!hud360Ativo)}
                className={`px-3 py-2 rounded-lg text-xs font-mono font-bold border transition ${
                  hud360Ativo
                    ? 'bg-cyan-500/20 border-cyan-400 text-cyan-200'
                    : 'bg-slate-900 border-slate-700 text-slate-300'
                }`}
              >
                HUD 360: {hud360Ativo ? 'ON' : 'OFF'}
              </button>

              <button
                type="button"
                onClick={alternarTelaCheia}
                className="px-3 py-2 rounded-lg text-xs font-mono font-bold bg-slate-900 hover:bg-slate-800 border border-slate-700 text-cyan-200"
              >
                TELA CHEIA
              </button>

              <select
                aria-label="Perfil de exibicao HUD 360"
                value={perfilTela}
                onChange={(e) => onChangePerfilTela(e.target.value)}
                className="px-3 py-2 rounded-lg text-xs font-mono bg-slate-900 border border-cyan-500/30 text-cyan-200 focus:outline-none"

    function MapaRadarLeaflet({
      coords = [-22.7825, -43.4314],
      titulo = 'Vila Sebinho — Radar & GOES-19',
      camadaMapa = 'tatico',
      raioMetros = 2400,
      telemetria = null
    }) {
      const refDiv = useRef(null);
      const mapaRef = useRef(null);
      const camadaTileRef = useRef(null);
      const grupoVetoresRef = useRef(null);

      useEffect(() => {
        if (!refDiv.current || !window.L) return;
        try {
          if (!mapaRef.current) {
            const map = window.L.map(refDiv.current, { center: coords, zoom: 12 });
            grupoVetoresRef.current = window.L.layerGroup().addTo(map);
            mapaRef.current = map;
          }

          const map = mapaRef.current;
          if (camadaTileRef.current) {
            map.removeLayer(camadaTileRef.current);
            camadaTileRef.current = null;
          }

          const urlTile =
            camadaMapa === 'osm'
              ? 'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png'
              : camadaMapa === 'goes19'
              ? 'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}'
              : 'https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png';

          camadaTileRef.current = window.L.tileLayer(urlTile, {
            attribution: 'Base Cartografica & Telemetria GOES-19 / Radar',
            maxZoom: 18
          }).addTo(map);

          if (grupoVetoresRef.current) {
            grupoVetoresRef.current.clearLayers();

            const corRadar = camadaMapa === 'goes19' ? '#38bdf8' : '#22d3ee';
            window.L.circle(coords, {
              color: corRadar,
              fillColor: corRadar,
              fillOpacity: camadaMapa === 'goes19' ? 0.22 : 0.14,
              radius: raioMetros
            })
              .bindPopup(`<strong>${titulo}</strong><br/>Raio de cobertura: ${raioMetros} m`)
              .addTo(grupoVetoresRef.current);

            window.L.circle(coords, {
              color: '#f59e0b',
              fillColor: '#f59e0b',
              fillOpacity: 0.08,
              dashArray: '6, 6',
              radius: Math.round(raioMetros * 1.65)
            }).addTo(grupoVetoresRef.current);

            PONTOS_MONITORAMENTO_RJ.forEach((pt) => {
              window.L.marker(pt.coords)
                .bindPopup(
                  `<strong>${pt.nome}</strong><br/>Status: ${pt.nivel} | Chuva: ${pt.chuva}` +
                    (telemetria ? `<br/>Temp: ${telemetria.temperaturaC} C | UR: ${telemetria.umidadeRelativaPct}%` : '')
                )
                .addTo(grupoVetoresRef.current);
            });
          }

          map.setView(coords, 12);
        } catch (e) {
          // Protecao contra falha de rede de tiles
        }
      }, [coords, titulo, camadaMapa, raioMetros, telemetria]);

      useEffect(() => {
        return () => {
          if (mapaRef.current) {
            try {
              mapaRef.current.remove();
            } catch (e) {}
            mapaRef.current = null;
          }
        };
      }, []);

      return (
        <div className="w-full h-72 sm:h-80 rounded-xl overflow-hidden border border-cyan-500/30 bg-slate-950 relative">
          <div ref={refDiv} className="w-full h-full z-10" />
        </div>
      );
    }

                        videoSelecionadoId === v.id
                          ? 'bg-cyan-950/45 border-cyan-400'
                          : 'bg-slate-950/75 border-slate-800 hover:border-cyan-500/40'
                      }`}
                    >
                      <div className="flex justify-between text-[11px] font-mono text-cyan-300">
                        <span>{v.topico}</span>
                        <span>{v.duracao}</span>
                      </div>
                      <div className="text-sm font-bold text-white mt-1">{v.titulo}</div>
                      <div className="text-xs text-slate-400 mt-1">{v.descricao}</div>
                    </div>
                  ))}
                </div>

                <form onSubmit={salvarVideo} className="grid grid-cols-1 sm:grid-cols-3 gap-3 pt-2 border-t border-slate-800">
                  <input
                    type="text"
                    value={tituloVideoInput}
                    onChange={(e) => setTituloVideoInput(e.target.value)}
                    placeholder="Titulo do video..."
                    className="px-3.5 py-2 rounded-xl bg-slate-900 border border-slate-700 text-sm text-white focus:outline-none focus:border-cyan-400"
                  />
                  <input
                    type="text"
                    value={descVideoInput}
                    onChange={(e) => setDescVideoInput(e.target.value)}
                    placeholder="Descricao..."
                    className="px-3.5 py-2 rounded-xl bg-slate-900 border border-slate-700 text-sm text-white focus:outline-none focus:border-cyan-400"
                  />
                  <button
                    type="submit"
                    className="px-4 py-2 rounded-xl bg-cyan-500 text-slate-950 font-extrabold text-xs uppercase"
                  >
                    ADICIONAR VIDEO
                  </button>
                </form>
              </section>
            )}

            {/* ABA 9: COFRE ADMIN (PIN) + VOZES OFICIAIS INTEGRADA NA AREA RESTRITA */}
            {abaAtiva === 'cofre' && (
              <section className="tactical-card p-4 sm:p-6 space-y-5">
                <div>
                  <div className="text-xs font-mono text-amber-400 uppercase">CONTROLE ADMINISTRATIVO E SINTESE DE VOZ RESTRITA</div>
                  <h2 className="text-xl font-extrabold text-white">Cofre Admin (PIN)</h2>
                  <p className="text-xs text-slate-400 mt-1">{statusCofre}</p>
                </div>

                <SeletorVozGlobal
                  perfilVozId={perfilVozId}
                  setPerfilVozId={setPerfilVozId}
                  onRegistrarEvento={registrarRobo}
                />

                <form onSubmit={verificarPin} className="flex flex-wrap items-center gap-3">
                  <input
                    type="password"
                    value={pinInput}
                    onChange={(e) => setPinInput(e.target.value)}
                    placeholder="PIN..."
                    aria-label="PIN do Cofre Admin"
                    className="px-4 py-2.5 rounded-xl bg-slate-900 border border-slate-700 font-mono text-sm text-white focus:outline-none focus:border-amber-400 w-40"
                  />
                  <button
                    type="submit"
                    className="px-4 py-2.5 rounded-xl bg-amber-500 hover:bg-amber-400 text-slate-950 font-extrabold text-xs uppercase"
                  >
                    DESBLOQUEAR
                  </button>
                  {cofreAberto && (
                    <button
                      type="button"
                      onClick={() => setCofreAberto(false)}
                      className="px-3.5 py-2.5 rounded-xl bg-slate-800 border border-slate-600 text-xs font-bold uppercase"
                    >
                      BLOQUEAR
                    </button>
                  )}
                </form>

                {cofreAberto && (
                  <div className="bg-slate-950/85 border border-amber-500/30 rounded-xl p-4 space-y-3">
                    <ul className="list-disc list-inside text-xs sm:text-sm text-slate-200 space-y-1">
                      {registrosCofre.map((r, i) => (
                        <li key={i}>{r}</li>
                      ))}
                    </ul>
                    <div className="flex gap-2">
                      <input
                        type="text"
                        value={novaNotaCofre}
                        onChange={(e) => setNovaNotaCofre(e.target.value)}
                        placeholder="Nova anotacao..."
                        className="flex-1 px-3.5 py-2 rounded-xl bg-slate-900 border border-slate-700 text-sm text-white focus:outline-none focus:border-amber-400"
                      />
                      <button
                        type="button"
                        onClick={() => {
                          if (!novaNotaCofre.trim()) return;
                          setRegistrosCofre((prev) => [...prev, novaNotaCofre.trim()]);
                          setNovaNotaCofre('');
                        }}
                        className="px-4 py-2 rounded-xl bg-emerald-500 text-slate-950 font-extrabold text-xs uppercase"
                      >
                        SALVAR
                      </button>
                    </div>
                  </div>
                )}
              </section>
            )}
          </main>

          <footer className="border-t border-slate-800 bg-slate-950/90 py-4 px-3 sm:px-6 text-center text-xs text-slate-400 z-20">
            Base Climatica de Monitoramento Tatico — Projeto Cidadao Sensor | {tempoBsb.linhaCompleta}
          </footer>
        </div>
      );
    }

    class ErrorBoundaryTatico extends React.Component {
      constructor(props) {
        super(props);
        this.state = { hasError: false, errMsg: '' };
      }
      static getDerivedStateFromError(error) {
        return { hasError: true, errMsg: error && error.message ? error.message : 'Erro de renderizacao' };
      }
      render() {
        if (this.state.hasError) {
          return (
            <div className="min-h-screen bg-slate-950 text-slate-100 p-6 flex items-center justify-center">
              <div className="max-w-lg bg-slate-900 border border-rose-500/40 rounded-xl p-5 space-y-3">
                <div className="text-xs font-mono text-rose-400 uppercase">CONTROLE DE INTEGRIDADE DA INTERFACE</div>
                <div className="text-base font-bold">Falha recuperada na exibicao do modulo</div>
                <div className="text-xs font-mono text-slate-300">{this.state.errMsg}</div>
                <button
                  type="button"
                  onClick={() => this.setState({ hasError: false, errMsg: '' })}
                  className="px-4 py-2 rounded-lg bg-cyan-500 text-slate-950 font-bold text-xs uppercase"
                >
                  TENTAR NOVAMENTE
                </button>
              </div>
            </div>
          );
        }
        return this.props.children;
      }
    }

    const mountNode = document.getElementById('root');
    if (mountNode && window.ReactDOM) {
      window.ReactDOM.createRoot(mountNode).render(
        <ErrorBoundaryTatico>
          <App />
        </ErrorBoundaryTatico>
      );
    }
  </script>
</body>
</html>
