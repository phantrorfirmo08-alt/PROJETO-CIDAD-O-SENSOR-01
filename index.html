            if (!("speechSynthesis" in window)) return;

                window.speechSynthesis.cancel();

                const utterance = new SpeechSynthesisUtterance(cleanText);
                utterance.lang = "pt-BR";
                
                const prof = customProfile || globalVoiceProfile;
                if (prof === 'humana') {
                    utterance.rate = 1.0;
                    utterance.pitch = 1.25;
                } else {
                    utterance.rate = 1.02;

            const [oleoL, setOleoL] = React.useState(4);

            const [precoPet, setPrecoPet] = React.useState(2.50);
            const [precoAluminio, setPrecoAluminio] = React.useState(8.00);

            const [precoPapelao, setPrecoPapelao] = React.useState(0.70);
            const [precoVidro, setPrecoVidro] = React.useState(0.35);
            const [precoOleo, setPrecoOleo] = React.useState(3.00);

            const [btConectado, setBtConectado] = React.useState(false);
            const [btStatus, setBtStatus] = React.useState("Desconectado");

            const totalPet = petKg * precoPet;
            const totalAluminio = aluminioKg * precoAluminio;
            const totalFerro = ferroKg * precoFerro;
            const totalPapelao = papelaoKg * precoPapelao;
            const totalVidro = vidroKg * precoVidro;
            const totalOleo = oleoL * precoOleo;

            const valorTotalReciclagem = totalPet + totalAluminio + totalFerro + totalPapelao + totalVidro + totalOleo;
            const pesoTotalKg = Number(petKg) + Number(aluminioKg) + Number(ferroKg) + Number(papelaoKg) + Number(vidroKg) + Number(oleoL);

            const aguaEconomizadaL = (petKg * 24) + (aluminioKg * 40) + (papelaoKg * 15);

            const [tempHardware, setTempHardware] = React.useState("-- °C");
            const [isConnecting, setIsConnecting] = React.useState(false);

                try {
                    localStorage.setItem("raru_alquino_ip", hardwareIpUrl);
                    setIsConnecting(true);
                    setStatusHardware("CONECTANDO AO IP...");
                    showToast(`Conectando ao IP: ${hardwareIpUrl}`);

                    const res = await fetch(hardwareIpUrl, { method: 'GET', mode: 'cors' });
                    const data = await res.json();
                    
                    if(data) {
                        setGasLevel(data.gas ? `${data.gas} PPM` : "14 PPM (Normal)");
                        setHidroLevel(data.nivelAgua ? `${data.nivelAgua} m` : "0.35 m (Estável)");
                        setTempHardware(data.temperatura ? `${data.temperatura} °C` : "27.1 °C");
                        setStatusHardware("CONECTADO (ONLINE VIA IP)");
                        showToast("Hardware Alquino Sincronizado!");
                    }

                    setTimeout(() => {
                        const gasRand = Math.floor(Math.random() * 25 + 8);
                        const hidroRand = (Math.random() * 0.4 + 0.1).toFixed(2);
                        setGasLevel(`${gasRand} PPM (Normal)`);
                        setHidroLevel(`${hidroRand} m (Estável)`);
                        setTempHardware("26.8 °C");
                        setStatusHardware("SIMULAÇÃO ATIVA (IP LOCAL)");
                        showToast("Modo simulação IP ativado.");

          });

        function VistoriaRARU_NEXUS({ onBackToDashboard, showToast }) {
            const [mun, setMun] = React.useState(MUNICIPIOS_92.find(m => m.n === 'Mesquita') || MUNICIPIOS_92[0]);
            const [fotos, setFotos] = React.useState([]);
            const [camOn, setCamOn] = React.useState(false);
            const [nome, setNome] = React.useState(''); 
            const [bairro, setBairro] = React.useState('');
            const [rel, setRel] = React.useState('');
            const [gps, setGps] = React.useState({lat:0, lon:0, acc:''});
            const [isAiAnalyzing, setIsAiAnalyzing] = React.useState(false);
            const [clima, setClima] = React.useState(null);
            
            const [frenteSelecionada, setFrenteSelecionada] = React.useState(FRENTES_EQUIPES_TABELA[5]);
            
            const [alarmeRusso, setAlarmeRusso] = React.useState(false);
            const [cemadenNivel, setCemadenNivel] = React.useState('VERDE');
            const [vento, setVento] = React.useState(0);
            const audioRef = React.useRef(null);
            const sireneIntervalRef = React.useRef(null);

            const RISCOS_RARU = ["R1 - BAIXO / PREVENTIVO","R2 - MODERADO / ALERTA","R3 - ALTO / ENXURRADA","R4 - EVACUACAO PREVENTIVA","RH - CONVERGENCIA SERRAS","RE - ESTRUTURAL / TALUDE"];
            const [risco, setRisco] = React.useState(RISCOS_RARU[1]);
            const [protAtual, setProtAtual] = React.useState(null);
            
            const videoRef = React.useRef(null); 
            const streamRef = React.useRef(null);

            React.useEffect(() => {
                if (!mun?.lat) return;
                fetch(`https://api.open-meteo.com/v1/forecast?latitude=${mun.lat}&longitude=${mun.lon}&current=temperature_2m,relative_humidity_2m,precipitation,wind_speed_10m,wind_gusts_10m&timezone=auto`)
                    .then(r => r.json())
                    .then(d => {
                        setClima(d.current);
                        setVento(d.current?.wind_gusts_10m || d.current?.wind_speed_10m || 0);
                        const chuva = d.current?.precipitation || 0;
                        if(chuva >= 50) setCemadenNivel('VERMELHO');
                        else if(chuva >= 30) setCemadenNivel('LARANJA');
                        else if(chuva >= 10) setCemadenNivel('AMARELO');
                        else setCemadenNivel('VERDE');
                    })
                    .catch(() => {});
            }, [mun]);

            React.useEffect(() => {
                const chuva = clima?.precipitation || 0;
                if(risco.includes('R4') || cemadenNivel === 'VERMELHO' || (cemadenNivel === 'LARANJA' && chuva >= 30)){
                    if(!alarmeRusso) ligarSireneRussa();
                }
            }, [risco, cemadenNivel, clima]);

            React.useEffect(() => {
                return () => {
                    pararSireneRussa();
                    if (streamRef.current) streamRef.current.getTracks().forEach(t => t.stop());
                };
            }, []);

            const ligarSireneRussa = () => {
                setAlarmeRusso(true);
                showToast('🇷🇺 ALARME RUSSO ATIVADO');
                try{
                    if(!audioRef.current) audioRef.current = new (window.AudioContext||window.webkitAudioContext)();
                    const ctx = audioRef.current; ctx.resume();
                    const osc = ctx.createOscillator(); const gain = ctx.createGain();
                    osc.type = 'sine'; osc.frequency.value = 400; gain.gain.value = 0.12;
                    osc.connect(gain); gain.connect(ctx.destination); osc.start();
                    audioRef.current._osc = osc;
                    let subindo = true;
                    sireneIntervalRef.current = setInterval(()=>{
                        let f = osc.frequency.value;
                        if(subindo){ f+=25; if(f>=900) subindo=false; }
                        else { f-=25; if(f<=400) subindo=true; }
                        osc.frequency.setTargetAtTime(f, ctx.currentTime, 0.1);
                    }, 60);
                }catch(e){}
            };

            const pararSireneRussa = () => {
                setAlarmeRusso(false);
                if(sireneIntervalRef.current) clearInterval(sireneIntervalRef.current);
                try{ audioRef.current?._osc?.stop(); audioRef.current?.close(); }catch(e){}
                audioRef.current = null;
                showToast('🔇 Sirene Russa silenciada');
            };

            const atualizarGPS = () => {
                if(!navigator.geolocation) return;
                navigator.geolocation.getCurrentPosition(p => {
                  setGps({ lat: p.coords.latitude, lon: p.coords.longitude, acc: Math.round(p.coords.accuracy) });
                  setMun(m => ({ ...m, lat: p.coords.latitude, lon: p.coords.longitude }));
                  showToast(`GPS ${Math.round(p.coords.accuracy)}m sincronizado!`);
                }, () => {}, { enableHighAccuracy: true, timeout: 5000 });
            };

            const startCam = async () => {
                try {
                  const s = await navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: "environment" } } });
                  streamRef.current = s; setCamOn(true);
                  setTimeout(() => { if(videoRef.current){ videoRef.current.srcObject = s; videoRef.current.play().catch(() => {}); } }, 100);
                  atualizarGPS();
                } catch { showToast('Câmera bloqueada.'); }
            };
            const stopCam = () => { if(streamRef.current) streamRef.current.getTracks().forEach(t => t.stop()); setCamOn(false); };

            const capturarFotoFinal = () => {
                const v = videoRef.current; if(!v) return null;
                const canvas = document.createElement('canvas');
                canvas.width = 600;
                canvas.height = Math.round(600 * (v.videoHeight / v.videoWidth));
                const ctx = canvas.getContext('2d');
                ctx.drawImage(v, 0, 0, canvas.width, canvas.height);

                ctx.fillStyle = 'rgba(3,7,18,0.92)';
                ctx.fillRect(0, canvas.height - 120, canvas.width, 120);
                ctx.fillStyle = '#00F2FE'; ctx.font = 'bold 10px monospace';
                ctx.fillText(`📅 ${new Date().toLocaleString('pt-BR')} | 📍 GPS ${(gps.lat||mun.lat).toFixed(5)}, ${(gps.lon||mun.lon).toFixed(5)}`, 10, canvas.height - 98);
                ctx.fillStyle = '#fff'; ctx.font = 'bold 10px monospace';
                ctx.fillText(`👤 ${(nome || 'Agente Comunitário').slice(0,22)} | 🏠 ${(bairro || 'Local').slice(0,18)} | ${mun.n}`, 10, canvas.height - 80);
                ctx.fillStyle = '#FF0055'; ctx.font = 'bold 10px monospace';
                ctx.fillText(`⚠️ ${risco} | 🇧🇷 CEMADEN ${cemadenNivel}`, 10, canvas.height - 62);
                ctx.fillStyle = '#FFA500'; ctx.font = 'bold 9px monospace';
                ctx.fillText(`🤝 FRENTE: ${frenteSelecionada.slice(0, 45)}`, 10, canvas.height - 44);
                ctx.fillStyle = '#FFD600'; ctx.font = 'bold 9px monospace';
                ctx.fillText(`🛰️ GOES-19 | 🌧️ ${clima?.precipitation||0}mm | 💨 ${vento||0}km/h | RUSSO ${alarmeRusso ? 'ON' : 'OFF'}`, 10, canvas.height - 24);
                ctx.fillStyle = '#00FF88'; ctx.font = 'bold 9px monospace';
                ctx.fillText(`🛡️ CIDADÃO SENSOR • AÇÃO COMUNITÁRIA INDEPENDENTE (GADE)`, 10, canvas.height - 8);

                const base64Final = canvas.toDataURL('image/jpeg', 0.70);
                setFotos([base64Final]);
                showToast(`📸 Foto final com carimbo da frente comunitária!`);
                return base64Final;
            };

            const textoVistoria = (prot) => `🛡️ *REGISTRO DE VISTORIA COMUNITÁRIA - CIDADÃO SENSOR*\n📌 *Protocolo:* ${prot || protAtual || 'PROT-RARU'}\n📍 ${mun.n} - ${bairro}\n⚠️ ${risco}\n🤝 *Frente:* ${frenteSelecionada}\n🇧🇷 CEMADEN ${cemadenNivel} | 🇷🇺 RUSSO ${alarmeRusso ? 'ATIVADO' : 'OFF'}\n🛰️ GOES-19 | Chuva ${clima?.precipitation||0}mm | Vento ${vento}km/h\n🗺️ GPS ${(gps.lat||mun.lat).toFixed(5)}, ${(gps.lon||mun.lon).toFixed(5)}\n📝 ${rel}\n📸 1 foto com carimbo comunitário em anexo`;

            const enviarWhatsComum = async () => {
                const dados = await gerarDados(); if(!dados) return;
                const texto = textoVistoria(dados.protocolo);
                if(fotos[0] && navigator.canShare){
                    try{
                        const blob = await (await fetch(fotos[0])).blob();
                        const file = new File([blob], `vistoria-${mun.n}.jpg`, {type:'image/jpeg'});
                        if(navigator.canShare({files:[file]})){ await navigator.share({text: texto, files:[file]}); showToast('✅ WhatsApp Comum com foto!'); return; }
                    }catch(e){}
                }
                window.open(`https://api.whatsapp.com/send?text=${encodeURIComponent(texto)}`, '_blank');
                if(fotos[0]) baixarFotoLeve(fotos[0]);
                showToast('💬 WhatsApp Comum aberto!');
            };

            const enviarWhatsBusiness = () => {
                gerarDados().then(dados => { if(!dados) return;
                    window.open(`https://wa.me/?text=${encodeURIComponent(textoVistoria(dados.protocolo))}`, '_blank');
                    if(fotos[0]) baixarFotoLeve(fotos[0]);
                    showToast('💼 Escolha WhatsApp Business');
                });
            };

            const adicionarNoStatusComFoto = async () => {
                if(fotos.length===0){ showToast('Tire 1 foto primeiro'); return; }
                const texto = textoVistoria();
                try{
                    const blob = await (await fetch(fotos[0])).blob();
                    const file = new File([blob], `vistoria-${mun.n}.jpg`, {type:'image/jpeg'});
                    if(navigator.canShare && navigator.canShare({files:[file]})){
                        await navigator.share({ title:'Vistoria Comunitária', text: texto, files:[file] });
                        showToast('✅ Escolha WhatsApp > Status'); return;
                    }
                }catch(e){}
                baixarFotoLeve(fotos[0]);
                window.open(`https://wa.me/?text=${encodeURIComponent(texto)}`, '_blank');
            };

            const baixarFotoLeve = (base64) => { const a=document.createElement('a'); a.href=base64; a.download=`vistoria-${mun.n}.jpg`; a.click(); };

            const gerarLaudoComSarahAI = async () => {
                if(!bairro) { showToast('Informe o bairro para a IA redigir o relatório.'); return; }
                setIsAiAnalyzing(true);
                showToast('🤖 Sarah AI elaborando relatório técnico comunitário...');
                const chuva = clima?.precipitation || 0;
                const promptAi = `Aja como analista sênior do Projeto Cidadão Sensor e Frentes Comunitárias da Baixada. Redija um relatório técnico comunitário independente de inspeção urbana no município de ${mun.n}, bairro ${bairro}, com classificação de risco ${risco}. Frente atuante: ${frenteSelecionada}. Inclua dados meteorológicos (${chuva}mm de chuva atual, vento ${vento}km/h, nível CEMADEN ${cemadenNivel}, satélite GOES-19) e recomendações preventivas.`;
                try {
                    const response = await fetch(CLOUDFLARE_WORKER_URL, {
                        method: "POST", headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({ model: "openai/gpt-oss-120b", messages: [{ role: "system", content: "You are Sarah, Senior Analyst." }, { role: "user", content: promptAi }], temperature: 0.4, max_tokens: 1000 })
                    });
                    const data = await response.json();
                    let aiText = data?.choices?.[0]?.message?.content || `Vistoria comunitária realizada no município de ${mun.n}, bairro ${bairro}. Risco: ${risco}.`;
                    aiText = aiText.replace(/#{1,6}\s?/g, '').replace(/\*\*/g, '').trim();
                    setRel(aiText);
                    showToast('✅ Relatório gerado pela Sarah AI!');
                } catch(e) {
                    setRel(`RELATÓRIO TÉCNICO COMUNITÁRIO - CIDADÃO SENSOR\nMunicípio: ${mun.n} | Bairro: ${bairro}\nFrente: ${frenteSelecionada}\nClassificação de Risco: ${risco}\nCondições: ${chuva}mm precipitação, vento ${vento}km/h, CEMADEN ${cemadenNivel}.\nRecomendação: Monitoramento preventivo pela comunidade.`);
                } finally { setIsAiAnalyzing(false); }
            };

            const sha256 = async (str) => {
                const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(str));
                return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, '0')).join('');
            };

            const gerarDados = async () => {
                if(!nome) { showToast('Informe o nome do responsável.'); return null; }
                if(!bairro) { showToast('Informe o bairro.'); return null; }
                const seq = Math.floor(Math.random() * 8999 + 1000);
                const sig = mun.n.slice(0, 3).toUpperCase();
                const prot = `PROT-RARU-${sig}-2026-${seq}`;
                const hash = await sha256(`${prot}-${Date.now()}`);
                setProtAtual(prot);
                return { protocolo: prot, hash };
            };

            const gerarPDFLeve = async () => {
                const dados = await gerarDados(); if(!dados) return;
                const canvas = document.createElement('canvas');
                canvas.width = 600; canvas.height = 800;
                const ctx = canvas.getContext('2d');
                ctx.fillStyle = '#02040A'; ctx.fillRect(0,0,600,800);
                ctx.fillStyle = '#00F2FE'; ctx.font = 'bold 16px monospace';
                ctx.fillText('RELATORIO COMUNITARIO - CIDADAO SENSOR', 20, 35);
                ctx.fillStyle = '#fff'; ctx.font = '11px monospace';
                ctx.fillText(`Protocolo: ${dados.protocolo}`, 20, 60);
                ctx.fillText(`Agente/Responsavel: ${nome}`, 20, 82);
                ctx.fillText(`Local: ${mun.n} - ${bairro}`, 20, 104);
                ctx.fillText(`Frente: ${frenteSelecionada.slice(0, 50)}`, 20, 126);
                ctx.fillText(`Risco: ${risco} | CEMADEN: ${cemadenNivel}`, 20, 148);
                ctx.fillText(`GOES-19 | Chuva: ${clima?.precipitation||0}mm | Vento: ${vento}km/h`, 20, 170);
                ctx.fillText(`GPS: ${(gps.lat||mun.lat).toFixed(5)}, ${(gps.lon||mun.lon).toFixed(5)}`, 20, 192);
                ctx.fillStyle = '#E2E8F0'; ctx.font = '11px monospace';
                const linhas = (rel || 'Sem relato').match(/.{1,65}/g) || [];
                linhas.slice(0,10).forEach((l,i)=> ctx.fillText(l, 20, 225 + i*18));
                const finalizar = () => {
                    const base64PDF = canvas.toDataURL('image/jpeg', 0.70);
                    const win = window.open('', '_blank');
                    win.document.write(`<html><head><title>Relatório Comunitário</title><style>body{margin:0;background:#000;display:flex;justify-content:center} img{width:100%;max-width:600px} .btn{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#00F2FE;color:#000;font-weight:900;padding:12px 20px;border-radius:999px;border:0} @media print{.btn{display:none}}</style></head><body><img src="${base64PDF}"><button class="btn" onclick="window.print()">📄 SALVAR RELATÓRIO PDF</button></body></html>`);
                    showToast('📄 Relatório PDF gerado!');
                };
                if(fotos[0]){ const img = new Image(); img.onload = ()=>{ ctx.drawImage(img, 20, 430, 280, 180); finalizar(); }; img.src = fotos[0]; }
                else finalizar();
            };

            return (
                <div className="w-full space-y-3.5 font-mono">
                    <style>{`

        function AdminVaultModule({ showToast, onClose, localVideos, setLocalVideos, youtubeVideos, setYoutubeVideos, publicVideos, setPublicVideos }) {
            const [pinInput, setPinInput] = React.useState("");
            const [isUnlocked, setIsUnlocked] = React.useState(false);
            const [novaUrlYoutube, setNovaUrlYoutube] = React.useState('');

            const handleUnlock = (e) => {
                e.preventDefault();
                if (pinInput === "303500") { setIsUnlocked(true); showToast("Acesso Autorizado!"); } else { showToast("PIN Incorreto."); }
            };

            const handleUploadGaleriaDireto = (e) => {
                const file = e.target.files[0];
                if (!file || !file.type.startsWith('video/')) { showToast("⚠️ Selecione um vídeo válido."); return; }
                const urlVideoLocal = URL.createObjectURL(file);
                const novoItem = { id: Date.now(), title: file.name, url: urlVideoLocal, type: 'local' };
                const atualizados = [novoItem, ...localVideos];
                setLocalVideos(atualizados);
                try { localStorage.setItem('raru_local_videos', JSON.stringify(atualizados.map(v => ({...v, url: ''})))); } catch(e){}
                showToast("✅ Vídeo adicionado aos rascunhos!");
            };

            const converterLinkYoutube = (url) => {
                if (!url) return '';
                let videoId = '';
                if (url.includes('youtu.be/')) videoId = url.split('youtu.be/')[1]?.split('?')[0];
                else if (url.includes('watch?v=')) videoId = url.split('watch?v=')[1]?.split('&')[0];
                else if (url.includes('embed/')) videoId = url.split('embed/')[1]?.split('?')[0];
                return videoId ? `https://www.youtube.com/embed/${videoId}` : '';
            };

            const handleAdicionarYoutubeDireto = (e) => {
                e.preventDefault();
                const embedUrl = converterLinkYoutube(novaUrlYoutube);
                if (!embedUrl) { showToast("❌ Link do YouTube inválido."); return; }
                const novoItem = { id: Date.now(), title: "Vídeo do YouTube", url: embedUrl, type: 'youtube' };
                const atualizados = [novoItem, ...youtubeVideos];
                setYoutubeVideos(atualizados);
                try { localStorage.setItem('raru_youtube_videos', JSON.stringify(atualizados)); } catch(e){}
                setNovaUrlYoutube('');
                showToast("✅ Vídeo do YouTube salvo!");
            };

            const publicarParaPublico = (videoItem) => {
                if (publicVideos.some(v => v.id === videoItem.id)) { showToast("⚠️ Já publicado."); return; }
                const novaPublica = [videoItem, ...publicVideos];
                setPublicVideos(novaPublica);
                try { localStorage.setItem('raru_public_videos', JSON.stringify(novaPublica)); } catch(e){}
                showToast("🌐 Publicado para a população!");
            };

            const removerVideoLocal = (id) => {
                const atualizados = localVideos.filter(v => v.id !== id);
                setLocalVideos(atualizados);
                try { localStorage.setItem('raru_local_videos', JSON.stringify(atualizados)); } catch(e){}
                const pub = publicVideos.filter(v => v.id !== id);
                setPublicVideos(pub);
                try { localStorage.setItem('raru_public_videos', JSON.stringify(pub)); } catch(e){}
                showToast("🗑️ Excluído.");
            };

            const removerVideoYoutube = (id) => {
                const atualizados = youtubeVideos.filter(v => v.id !== id);
                setYoutubeVideos(atualizados);
                try { localStorage.setItem('raru_youtube_videos', JSON.stringify(atualizados)); } catch(e){}
                const pub = publicVideos.filter(v => v.id !== id);
                setPublicVideos(pub);
                try { localStorage.setItem('raru_public_videos', JSON.stringify(pub)); } catch(e){}
                showToast("🗑️ Excluído.");
            };

            return (
                <div className="space-y-4 w-full font-mono">
                    <div className="cyber-card p-4 shadow-xl space-y-4 border border-cyberCyan/40">
                        <div className="flex items-center justify-between border-b border-cyberCyan/25 pb-2.5">

                            <button onClick={onClose} className="px-2.5 py-1 bg-cyberRose/25 text-cyberRose border border-cyberRose/40 rounded-xl text-xs font-bold cursor-pointer">✕ Fechar</button>
                        </div>

                        {!isUnlocked ? (
                            <form onSubmit={handleUnlock} className="flex gap-2">
                                <input type="password" maxLength="6" value={pinInput} onChange={(e) => setPinInput(e.target.value)} placeholder="PIN 🔒 (303500)" className="flex-1 bg-void border border-cyberCyan/40 rounded-xl px-3 py-2.5 text-center text-slate-100 font-mono tracking-widest text-xs shadow-inner" />
                                <button type="submit" className="px-4 py-2.5 cyber-button font-black rounded-xl text-xs cursor-pointer">Acessar</button>
                            </form>
                        ) : (
                            <div className="space-y-5">
                                <div className="bg-void/90 border border-cyberCyan/50 rounded-xl p-3.5 space-y-2">
                                    <span className="text-white font-black text-xs font-display block">📁 1. ADICIONAR VÍDEO DO APARELHO</span>
                                    <label className="flex items-center justify-center gap-2 w-full py-3 bg-cyberCyan/15 border border-cyberCyan text-cyberCyan rounded-xl text-xs font-bold cursor-pointer hover:bg-cyberCyan hover:text-void transition">
                                        <span>📱</span><span>SELECIONAR VÍDEO</span>
                                        <input type="file" accept="video/*" onChange={handleUploadGaleriaDireto} className="hidden" />
                                    </label>
                                </div>

                                <div className="bg-void/90 border border-cyberCyan/50 rounded-xl p-3.5 space-y-2">
                                    <span className="text-white font-black text-xs font-display block">📺 2. ADICIONAR YOUTUBE POR LINK</span>
                                    <form onSubmit={handleAdicionarYoutubeDireto} className="space-y-2">
                                        <input type="text" value={novaUrlYoutube} onChange={(e) => setNovaUrlYoutube(e.target.value)} placeholder="Cole o link do YouTube aqui..." className="w-full bg-deepSpace border border-cyberCyan/40 rounded-xl p-2.5 text-xs text-white" />
                                        <button type="submit" className="w-full py-2.5 cyber-button font-black rounded-xl text-xs uppercase cursor-pointer">Salvar Vídeo</button>
                                    </form>
                                </div>

                                <div className="bg-void/90 border border-cyberCyan/40 rounded-xl p-3.5 space-y-3">
                                    <span className="text-cyberCyan font-black text-xs font-display block">🛡️ GERENCIAR &amp; PUBLICAR</span>
                                    {localVideos.length === 0 && youtubeVideos.length === 0 ? (
                                        <p className="text-[10px] text-slate-400 text-center py-2">Nenhum vídeo cadastrado.</p>
                                    ) : (
                                        <div className="space-y-3">
                                            {localVideos.map(vid => {
                                                const jaPub = publicVideos.some(p => p.id === vid.id);
                                                return (
                                                    <div key={vid.id} className="rounded-xl overflow-hidden border border-cyberCyan/30 p-2.5 bg-deepSpace space-y-2">
                                                        <div className="flex justify-between items-center text-[10px]">
                                                            <span className="text-cyberCyan font-bold">📱 {vid.title}</span>
                                                            <div className="flex gap-1.5">
                                                                <button onClick={() => publicarParaPublico(vid)} className={`px-2.5 py-1 rounded-lg font-bold ${jaPub ? 'bg-emerald-500/20 text-emerald-300 border border-emerald-500/40' : 'bg-cyberCyan text-void'}`}>{jaPub ? '🌐 Publicado' : '🚀 Publicar'}</button>
                                                                <button onClick={() => removerVideoLocal(vid.id)} className="px-2.5 py-1 bg-red-500/20 text-red-400 border border-red-500/40 rounded-lg font-bold">🗑️ Excluir</button>
                                                            </div>
                                                        </div>
                                                        {vid.url && <video src={vid.url} controls playsInline className="w-full h-36 object-contain bg-void rounded-lg" />}
                                                    </div>
                                                );
                                            })}
                                            {youtubeVideos.map(vid => {
                                                const jaPub = publicVideos.some(p => p.id === vid.id);
                                                return (
                                                    <div key={vid.id} className="rounded-xl overflow-hidden border border-cyberRose/30 p-2.5 bg-deepSpace space-y-2">
                                                        <div className="flex justify-between items-center text-[10px]">
                                                            <span className="text-cyberRose font-bold">📺 YouTube</span>
                                                            <div className="flex gap-1.5">
                                                                <button onClick={() => publicarParaPublico(vid)} className={`px-2.5 py-1 rounded-lg font-bold ${jaPub ? 'bg-emerald-500/20 text-emerald-300 border border-emerald-500/40' : 'bg-cyberCyan text-void'}`}>{jaPub ? '🌐 Publicado' : '🚀 Publicar'}</button>
                                                                <button onClick={() => removerVideoYoutube(vid.id)} className="px-2.5 py-1 bg-red-500/20 text-red-400 border border-red-500/40 rounded-lg font-bold">🗑️ Excluir</button>
                                                            </div>
                                                        </div>
                                                        <div className="relative w-full" style={{ paddingBottom: '56.25%' }}>
                                                            <iframe src={vid.url} title="YouTube" className="absolute inset-0 w-full h-full bg-void rounded-lg" allowFullScreen />
                                                        </div>
                                                    </div>
                                                );
                                            })}
                                        </div>
                                    )}
                                </div>
                            </div>
                        )}
                    </div>
                </div>
            );
        }

                    </div>
                    <div style={{display:'grid', gridTemplateColumns:'repeat(auto-fit, minmax(80px, 1fr))', gap:'6px'}} className="px-3 pt-0.5">
                        {[{l:'TEMP', v:w.temp, c:'#00F2FE'}, {l:'UMIDADE', v:w.humidity, c:'#38BDF8'}, {l:'CHUVA', v:w.rain, c:'#00F2FE'}, {l:'STATUS', v:w.status, c:w.color}].map((x,i)=>(
                            <div key={i} className="bg-void/90 border border-cyberCyan/30 rounded-xl p-2 text-center shadow-inner">
                                <div className="text-[7px] text-slate-400 font-black font-display">{x.l}</div>
                                <div className="text-[10px] font-mono font-black mt-0.5 truncate" style={{color:x.c}}>{x.v}</div>
                            </div>
                        ))}
                    </div>
                    <div className="px-3 pb-1">
                        <div className="flex gap-2 overflow-x-auto pb-1">
                            {emergencias.map((e,i)=>(
                                <a key={i} href={`tel:${e.n}`} className="shrink-0 flex items-center gap-1.5 px-2.5 py-1.5 rounded-xl bg-void/90 border transition cursor-pointer shadow-md touch-manipulation" style={{borderColor:`${e.c}55`}}>
                                    <span className="font-display font-black text-xs" style={{color:e.c}}>{e.n}</span>
                                    <span className="text-[8px] font-black text-slate-300">{e.label}</span>
                                </a>
                            ))}
                        </div>
                    </div>
                    <div className="relative h-8 bg-gradient-to-r from-[#030712] via-[#041125] to-[#030712] border-t border-b border-cyberCyan/40 overflow-hidden flex items-center">
                        <div className="absolute left-0 top-0 bottom-0 z-10 px-2.5 flex items-center bg-gradient-to-r from-cyberCyan to-blue-400 rounded-r shadow">
                            <span className="font-display font-black text-[8px] text-void uppercase">GADE</span>
                        </div>
                        <div style={{display:'flex', width:'max-content', whiteSpace:'nowrap', animation:'tickerScroll 45s linear infinite'}} className="ml-16">
                            {Array(2).fill(0).map((_, idx) => (
                                <div key={idx} className="flex items-center space-x-6 pr-6 font-display font-bold text-[10px] text-cyan-300">
                                    {tickerPhrases.map((phrase, pIdx) => (
                                        <span key={pIdx} className="inline-flex items-center space-x-6"><span>{phrase}</span></span>
                                    ))}
                                </div>
                            ))}
                        </div>
                    </div>
                </div>
            );
        }

        function SarahFabButton({ onOpen, isSpeaking }) {
            return (
                <button className="fixed z-[60] w-12 h-12 rounded-full flex items-center justify-center cursor-pointer transition-transform active:scale-90 bg-deepSpace shadow-[0_0_15px_rgba(0,242,254,0.5)] p-0.5 overflow-hidden touch-manipulation" style={{ right: '14px', bottom: '85px' }} onClick={onOpen}>
                    <SarahAnimatedAvatar isSpeaking={isSpeaking} sizeClass="w-full h-full" />
                </button>
            );
        }

        function SarahChatOverlay({ isOpen, onClose, isSpeaking, isProcessing, messages, input, setInput, handleSendDirectCommand, toggleListening, isListening }) {
            if (!isOpen) return null;
            const chatScrollRef = React.useRef(null);
            React.useEffect(() => { if(chatScrollRef.current) chatScrollRef.current.scrollTop = chatScrollRef.current.scrollHeight; }, [messages]);

            return (
                <div className="fixed inset-0 z-[90] flex items-end justify-center bg-void/85 backdrop-blur-xl" onClick={onClose}>
                    <div className="cyber-card w-full max-w-lg rounded-t-3xl shadow-2xl overflow-hidden animate-fade-in h-[85vh] flex flex-col border border-cyberCyan/60 p-0" onClick={(e) => e.stopPropagation()}>
                        <div className="flex items-center justify-between px-4 py-3 border-b border-cyberCyan/30 bg-deepSpace/95">
                            <div className="flex items-center gap-2">
                                <div className="w-7 h-7 shrink-0 overflow-hidden"><SarahAnimatedAvatar isSpeaking={isSpeaking} sizeClass="w-full h-full" /></div>
                                <div>
                                    <div className="font-display text-xs font-black text-white tracking-widest flex items-center gap-1">Sarah AI <span className="text-[9px] text-cyberCyan">V11 Plus</span></div>
                                    <div className="text-[8px] font-mono text-cyberGreen font-bold flex items-center gap-1"><span className="w-1.5 h-1.5 rounded-full bg-cyberGreen animate-ping"></span> Online</div>
                                </div>
                            </div>
                            <button onClick={onClose} className="w-7 h-7 rounded-xl bg-cyberRose/20 border border-cyberRose/40 text-cyberRose font-black cursor-pointer flex items-center justify-center text-xs">✕</button>
                        </div>
                        <div ref={chatScrollRef} className="flex-1 overflow-y-auto p-3 space-y-3 font-mono">
                            {messages.map((msg, index) => (
                                <div key={index} className={`flex ${msg.sender === 'user' ? 'justify-end' : 'justify-start'}`}>
                                    <div className={`max-w-[85%] rounded-2xl p-3 text-xs leading-relaxed shadow-lg ${msg.sender === 'user' ? 'bg-gradient-to-r from-cyberCyan to-blue-500 text-void font-bold rounded-br-none border border-white/30' : 'bg-deepSpace/95 text-slate-100 rounded-bl-none border border-cyberCyan/40'}`}>
                                        <div className="flex items-center justify-between gap-2 mb-1 opacity-70 text-[8px]">
                                            <span>{msg.sender === 'user' ? '👤 Alexander' : '🤖 Sarah AI'}</span>
                                            <span>{msg.time}</span>
                                        </div>
                                        <div className="whitespace-pre-line">{msg.text}</div>
                                    </div>
                                </div>
                            ))}
                        </div>
                        <div className="p-3 bg-deepSpace/95 border-t border-cyberCyan/30">
                            <form onSubmit={(e) => { e.preventDefault(); handleSendDirectCommand(); }} className="flex items-center gap-2 bg-void border-2 border-cyberCyan/60 rounded-xl p-1.5 shadow-inner">
                                <button type="button" onClick={toggleListening} className={`p-2 rounded-lg transition cursor-pointer flex items-center justify-center shrink-0 ${isListening ? 'bg-cyberRose text-white animate-pulse' : 'bg-commandPanel text-cyberCyan border border-cyberCyan/40'}`}>🎙️</button>
                                <input type="text" value={input} onChange={(e) => setInput(e.target.value)} placeholder="Digite sua mensagem..." className="flex-1 bg-transparent border-none px-2 py-1 text-xs text-slate-100 font-mono focus:outline-none" />
                                <button type="submit" disabled={isProcessing || !input.trim()} className={`px-3 py-2 rounded-lg font-black text-xs uppercase cursor-pointer ${input.trim() && !isProcessing ? 'cyber-button' : 'bg-commandPanel text-slate-500'}`}>Enviar ➔</button>
                            </form>
                        </div>
                    </div>
                </div>
            );
        }

        function App() {
            const [theme, setTheme] = React.useState(() => { try { return localStorage.getItem("raru-cyber-theme") || "dark"; } catch(e) { return "dark"; } });
            const [soundEnabled, setSoundEnabled] = React.useState(true);
            const [isSpeaking] = React.useState(false);
            const [isListening, setIsListening] = React.useState(false);
            const [activeTab, setActiveTab] = React.useState("dashboard");
            const [quemSomosOpen, setQuemSomosOpen] = React.useState(false);
            const [isCommandHUDActive, setIsCommandHUDActive] = React.useState(false);
            const [shareModalOpen, setShareModalOpen] = React.useState(false);
            const [toastMsgRef, setToastMsgRef] = React.useState(null);

            const [termsAccepted, setTermsAccepted] = React.useState(() => { try { return localStorage.getItem("raru_cyber_terms") === "1"; } catch(e) { return false; } });
            const [check1, setCheck1] = React.useState(false);
            const [check2, setCheck2] = React.useState(false);

            const [isChatOpen, setIsChatOpen] = React.useState(false);
            const [input, setInput] = React.useState("");
            const [isProcessing, setIsProcessing] = React.useState(false);
            
            const [localVideos, setLocalVideos] = React.useState(() => { try { const s = localStorage.getItem('raru_local_videos'); return s ? JSON.parse(s) : []; } catch(e) { return []; } });
            const [youtubeVideos, setYoutubeVideos] = React.useState(() => { try { const s = localStorage.getItem('raru_youtube_videos'); return s ? JSON.parse(s) : []; } catch(e) { return []; } });
            const [publicVideos, setPublicVideos] = React.useState(() => { try { const s = localStorage.getItem('raru_public_videos'); return s ? JSON.parse(s) : []; } catch(e) { return []; } });
            const [customTickerText] = React.useState(() => { try { return localStorage.getItem('raru_custom_ticker') || ""; } catch(e) { return ""; } });

            const showToast = (msg) => { setToastMsgRef(msg); setTimeout(() => setToastMsgRef(null), 3500); };

            const toggleCommandHUD = () => {
                if (!isCommandHUDActive) {
                    if (document.documentElement.requestFullscreen) document.documentElement.requestFullscreen().catch(() => {});
                    setIsCommandHUDActive(true);
                    showToast("MODO HUD ATIVADO!");
                } else {
                    if (document.exitFullscreen && document.fullscreenElement) document.exitFullscreen().catch(() => {});
                    setIsCommandHUDActive(false);
                    showToast("Modo Padrão");
                }
            };

            const openShareFromApp = async () => {
                showToast("Gerando arquivo compacto...");
                const iconeArquivo = await gerarArquivoIconeEscudo();
                if (navigator.share) {
                    try {
                        const sharePayload = { title: "Projeto Cidadão Sensor • RARU NEXUS V11 Plus", text: shareMessageText, url: APP_SHARE_URL };
                        if (iconeArquivo && navigator.canShare && navigator.canShare({ files: [iconeArquivo] })) sharePayload.files = [iconeArquivo];
                        await navigator.share(sharePayload);
                        return;
                    } catch (err) {}
                }
                setShareModalOpen(true);
            };

            const toggleTheme = () => {
                setTheme(prev => {
                    const next = prev === 'dark' ? 'warm' : 'dark';
                    try { localStorage.setItem("raru-cyber-theme", next); } catch(e) {}
                    if (next === 'warm') {
                        document.documentElement.classList.remove('dark');
                        document.documentElement.classList.add('warm');
                    } else {
                        document.documentElement.classList.add('dark');
                        document.documentElement.classList.remove('warm');
                    }
                    return next;
                });
            };

            const toggleListening = () => {
                const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
                if (!SpeechRec) { showToast("Microfone indisponível."); return; }
                if (isListening) { setIsListening(false); return; }
                try {
                    const rec = new SpeechRec();
                    rec.lang = "pt-BR";
                    rec.onstart = () => setIsListening(true);
                    rec.onresult = (event) => { let final = event.results[0][0].transcript; if (final) { setInput(final); setIsListening(false); } };
                    rec.onerror = () => setIsListening(false);
                    rec.onend = () => setIsListening(false);
                    rec.start();
                } catch (e) { setIsListening(false); }
            };

            const [messages, setMessages] = React.useState([
                { sender: 'assistant', text: 'Olá Alexander! Sou a Analista Sênior do Projeto Cidadão Sensor e RARU NEXUS AI V11 Plus. Como posso ajudar na resiliência hoje?', time: new Date().toLocaleTimeString('pt-BR', {hour: '2-digit', minute:'2-digit'}) }
            ]);

            const handleSendDirectCommand = async (textCustom) => {
                const textToSend = textCustom !== undefined ? textCustom : input;
                if (!textToSend.trim() || isProcessing) return;
                const timeStr = new Date().toLocaleTimeString('pt-BR', {hour: '2-digit', minute:'2-digit'});
                setMessages(prev => [...prev, { sender: 'user', text: textToSend, time: timeStr }]);
                setInput(""); setIsProcessing(true);
                try {
                    const response = await fetch(CLOUDFLARE_WORKER_URL, {
                        method: "POST", headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({ model: "openai/gpt-oss-120b", messages: [{ role: "system", content: "You are Sarah." }, { role: "user", content: textToSend }], temperature: 0.5, max_tokens: 1000 })
                    });
                    const data = await response.json();
                    let reply = data?.choices?.[0]?.message?.content || "Análise concluída.";
                    reply = reply.replace(/#{1,6}\s?/g, '').replace(/\*\*/g, '').trim();
                    setMessages(prev => [...prev, { sender: 'assistant', text: reply, time: new Date().toLocaleTimeString('pt-BR', {hour: '2-digit', minute:'2-digit'}) }]);
                    if (soundEnabled) falarSarah(reply);
                } catch (error) {
                    setMessages(prev => [...prev, { sender: 'assistant', text: "Sistema operando em redundância local.", time: new Date().toLocaleTimeString('pt-BR', {hour: '2-digit', minute:'2-digit'}) }]);
                } finally { setIsProcessing(false); }
            };

            const openSarahChat = () => setIsChatOpen(true);

            const NAV_TABS = [
                { id: 'dashboard', iconComponent: <IconDashboard className="w-4 h-4" />, label: 'Painel' },
                { id: 'radar', iconComponent: <IconRadar className="w-4 h-4" />, label: 'Radar' },
                { id: 'relatorio', iconComponent: <IconVistoria className="w-4 h-4" />, label: 'Vistoria' },
                { id: 'estacao', iconComponent: <IconEstacao className="w-4 h-4" />, label: 'Estação' },
                { id: 'balanca', iconComponent: <IconBalanca className="w-4 h-4" />, label: 'Balança' },
                { id: 'alquino', iconComponent: <IconAlquino className="w-4 h-4" />, label: 'Alquino' },
                { id: 'compartilhar', iconComponent: <IconInstalar className="w-4 h-4" />, label: 'Instalar' },
                { id: 'quem-somos', iconComponent: <IconQuemSomos className="w-4 h-4" />, label: 'Sobre' },
                { id: 'galeria', iconComponent: <IconVideos className="w-4 h-4" />, label: 'Vídeos' },
                { id: 'admin', iconComponent: <IconAdmin className="w-4 h-4" />, label: 'Admin' }
            ];

            const handleNavClick = (tabId) => {
                if (tabId === 'compartilhar') openShareFromApp();
                else if (tabId === 'quem-somos') setQuemSomosOpen(true);
                else setActiveTab(tabId);
            };

            return (
                <div className="seu-container-raru">
                    {toastMsgRef && <div className="fixed top-12 left-1/2 -translate-x-1/2 z-50 cyber-card px-4 py-2 rounded-2xl font-display text-[10px] font-black text-cyberCyan tracking-wider shadow-2xl border border-cyberCyan/60 animate-bounce">{toastMsgRef}</div>}

                    {shareModalOpen && (
                        <div className="fixed inset-0 bg-void/90 backdrop-blur-xl z-50 flex items-center justify-center p-4">
                            <div className="cyber-card max-w-sm w-full p-4 rounded-2xl space-y-3 text-center shadow-2xl border border-cyberCyan/50">
                                <h3 className="font-display text-xs font-black tracking-widest uppercase text-cyberCyan">INSTALAÇÃO V11 Plus</h3>
                                <textarea readOnly value={shareMessageText} className="w-full h-16 bg-void border border-cyberCyan/30 rounded-xl p-2.5 text-[9px] text-slate-300 resize-none font-mono" />
                                <button onClick={() => setShareModalOpen(false)} className="w-full py-2.5 bg-cyberRose/25 text-cyberRose border border-cyberRose/40 rounded-xl text-xs font-bold">Fechar</button>
                            </div>
                        </div>
                    )}

                    {!termsAccepted && (
                        <div className="fixed inset-0 bg-void/95 z-[200] flex items-center justify-center p-4 overflow-y-auto">
                            <div className="cyber-card max-w-md w-full p-5 rounded-3xl shadow-2xl space-y-3.5 my-auto border border-cyberCyan/70 font-mono text-left">
                                <div className="w-14 h-14 mx-auto overflow-hidden">
                                    <SarahAnimatedAvatar isSpeaking={true} sizeClass="w-full h-full" />
                                </div>
                                <div className="text-center space-y-1">
                                    <h2 className="font-display text-xs font-black text-white tracking-widest uppercase">Projeto Cidadão Sensor</h2>
                                    <p className="text-[9px] text-cyberCyan font-bold uppercase">TERMO DE RESPONSABILIDADE &amp; LGPD</p>
                                </div>
                                
                                <div className="bg-commandPanel/90 border border-cyberCyan/30 rounded-xl p-3 text-[11px] text-slate-200 leading-relaxed space-y-2 shadow-inner">
                                    <p>Em conformidade com a <strong>Lei Federal nº 13.709/2018 (LGPD)</strong>, este aplicativo opera com armazenamento local exclusivo e sem captação de dados pessoais.</p>
                                </div>

                                <div className="space-y-2 pt-1">
                                    <label className="flex items-start gap-2.5 cursor-pointer text-[11px] text-slate-200 bg-commandPanel/80 p-2.5 rounded-xl border border-cyberCyan/30">
                                        <input type="checkbox" checked={check1} onChange={(e) => setCheck1(e.target.checked)} className="mt-0.5 rounded text-cyberCyan w-4 h-4 bg-void cursor-pointer shrink-0" />
                                        <span>Aceito os termos da LGPD.</span>
                                    </label>
                                    <label className="flex items-start gap-2.5 cursor-pointer text-[11px] text-slate-200 bg-commandPanel/80 p-2.5 rounded-xl border border-cyberCyan/30">
                                        <input type="checkbox" checked={check2} onChange={(e) => setCheck2(e.target.checked)} className="mt-0.5 rounded text-cyberCyan w-4 h-4 bg-void cursor-pointer shrink-0" />
                                        <span>Autorizo o uso do GPS exclusivamente para vistorias.</span>
                                    </label>
                                </div>

                                <button disabled={!check1 || !check2} onClick={() => { setTermsAccepted(true); try { localStorage.setItem("raru_cyber_terms", "1"); } catch(e) {} }} className={`w-full py-3 rounded-xl font-display font-black text-xs uppercase tracking-wider transition shadow-2xl touch-manipulation ${check1 && check2 ? 'cyber-button cursor-pointer' : 'bg-commandPanel text-slate-500 cursor-not-allowed'}`}>
                                    CONCORDAR E INICIAR CENTRAL
                                </button>
                            </div>
                        </div>
                    )}

                    <header className="cyber-card sticky top-0 z-30 w-full px-3 py-2 border-b border-cyberCyan/40 flex items-center justify-between shadow-lg rounded-2xl mb-2">
                        <div className="flex items-center gap-2 cursor-pointer" onClick={openSarahChat}>
                            <div className="w-7 h-7 overflow-hidden rounded-full border border-cyberCyan shrink-0">
                                <SarahLiveSVGAvatar isSpeaking={isSpeaking} />
                            </div>
                            <div>
                                <h1 className="font-display text-[10px] font-black text-white leading-none">Cidadão Sensor Plus</h1>
                                <p className="text-[7px] text-cyberCyan font-mono mt-0.5">Mesquita - RJ</p>
                            </div>
                        </div>
                        <div className="flex items-center gap-1.5">
                            <button onClick={toggleCommandHUD} className={`px-2 py-1 rounded-lg border text-[8px] font-black ${isCommandHUDActive ? 'bg-cyberRose text-void animate-pulse' : 'bg-cyberCyan text-void'}`}>HUD</button>
                            <button onClick={() => setSoundEnabled(!soundEnabled)} className="w-7 h-7 rounded-lg border border-cyberCyan/50 flex items-center justify-center text-cyberCyan text-xs">🔊</button>
                            <button onClick={toggleTheme} className="w-7 h-7 rounded-lg border border-cyberCyan text-cyberCyan flex items-center justify-center">
                                <span className="text-xs">{theme === 'dark' ? '🌙' : '☀️'}</span>
                            </button>
                        </div>
                    </header>

                    <main className="flex-1 w-full mx-auto py-2 space-y-4 pb-28 relative z-10">
                        {activeTab === 'dashboard' && <CardIdentidadeVisualRARU openShareFromApp={openShareFromApp} openSarahChat={openSarahChat} handleWhoAmIClick={() => setQuemSomosOpen(true)} setActiveTab={setActiveTab} toggleCommandHUD={toggleCommandHUD} />}
                        {activeTab === 'radar' && <NovoMapaRadarLeaflet showToast={showToast} />}
                        {activeTab === 'estacao' && <EstacaoSobrevivenciaModuleV12 showToast={showToast} />}
                        {activeTab === 'balanca' && <ModuloCidadaoSensorModule onGoToDashboard={() => setActiveTab('dashboard')} showToast={showToast} />}
                        {activeTab === 'alquino' && <RedeAlquinoHardwareModule onGoToDashboard={() => setActiveTab('dashboard')} showToast={showToast} />}
                        {activeTab === 'relatorio' && <VistoriaRARU_NEXUS onBackToDashboard={() => setActiveTab('dashboard')} showToast={showToast} />}
                        {activeTab === 'galeria' && <PublicVideoGalleryModule publicVideos={publicVideos} onGoToDashboard={() => setActiveTab('dashboard')} />}
                        {activeTab === 'admin' && <AdminVaultModule showToast={showToast} onClose={() => setActiveTab('dashboard')} localVideos={localVideos} setLocalVideos={setLocalVideos} youtubeVideos={youtubeVideos} setYoutubeVideos={setYoutubeVideos} publicVideos={publicVideos} setPublicVideos={setPublicVideos} />}

                        <AutomatedObservatoryWidget customTickerText={customTickerText} />
                    </main>

                    {termsAccepted && <SarahFabButton onOpen={openSarahChat} isSpeaking={isSpeaking} />}
                    <SarahChatOverlay isOpen={isChatOpen} onClose={() => setIsChatOpen(false)} isSpeaking={isSpeaking} isProcessing={isProcessing} messages={messages} input={input} setInput={setInput} handleSendDirectCommand={handleSendDirectCommand} toggleListening={toggleListening} isListening={isListening} />
                    <QuemSomosModal isOpen={quemSomosOpen} onClose={() => setQuemSomosOpen(false)} />

                    <footer className="cyber-card fixed bottom-0 left-0 right-0 z-40 border-t border-cyberCyan/40 px-2 py-2.5 flex items-center justify-between gap-1 shadow-2xl backdrop-blur-xl max-w-[640px] mx-auto rounded-t-2xl pb-[env(safe-area-inset-bottom)]">
                        {NAV_TABS.map(tab => (
                            <button key={tab.id} onClick={() => handleNavClick(tab.id)} className={`flex flex-col items-center justify-center gap-0.5 cursor-pointer flex-1 py-1.5 transition touch-manipulation rounded-xl ${activeTab === tab.id ? 'text-cyberCyan bg-cyberCyan/15 border border-cyberCyan/40 shadow-[0_0_8px_rgba(0,242,254,0.3)]' : 'text-slate-400 hover:text-white border border-transparent'}`}>
                                {tab.iconComponent}
                                <span className="text-[7px] font-black truncate w-full text-center tracking-tighter px-0.5">{tab.label}</span>
                            </button>
                        ))}
                    </footer>
                </div>
            );
        }

        // CORREÇÃO APLICADA: Adicionado document. antes de getElementById
        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
