<!DOCTYPE html>
<html lang="pt-BR" class="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SARAH IA NEXUS v5.2 PRO</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/react@18/umd/react.development.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>html,body,#root{background:#000;color:#fff;min-height:100%;margin:0}.glass{background:linear-gradient(135deg,rgba(19,28,49,.8),rgba(10,15,29,.9));border:1px solid rgba(0,242,254,.2);backdrop-filter:blur(20px)} @keyframes rolar{0%{transform:translateX(100%)}100%{transform:translateX(-100%)}}</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">

function FieldReportModule({onBack,showToast}){
 const[setor,setSetor]=React.useState("🛡️ Defesa Civil");
 const[agente,setAgente]=React.useState(""); const[local,setLocal]=React.useState(""); const[desc,setDesc]=React.useState("");
 const[gps,setGps]=React.useState({lt:'',ln:'',lk:'',acc:''}); const[gpsOn,setGpsOn]=React.useState(false); const[status,setStatus]=React.useState("📍 GPS em espera");
 const watchRef=React.useRef(null);
 const[fotos,setFotos]=React.useState([0,1,2,3].map(i=>({id:i,file:null,preview:null})));

 const toggleGps=()=>{
  if(gpsOn){
   if(watchRef.current) navigator.geolocation.clearWatch(watchRef.current);
   setGpsOn(false); setStatus("📍 GPS Desativado"); setGps({lt:'',ln:'',lk:'',acc:''}); showToast("GPS desligado"); return;
  }
  if(!navigator.geolocation) return showToast("Sem GPS");
  setGpsOn(true); setStatus("🛰 Buscando...");
  watchRef.current=navigator.geolocation.watchPosition(p=>{
   const lt=p.coords.latitude.toFixed(6), ln=p.coords.longitude.toFixed(6);
   setGps({lt,ln,lk:`https://maps.google.com/?q=${lt},${ln}`,acc:Math.round(p.coords.accuracy)});
   setLocal(`${lt},${ln}`); setStatus(`✅ Fixado ±${Math.round(p.coords.accuracy)}m`);
  },()=>{setStatus("⚠️ Sem sinal"); setGpsOn(false)}, {enableHighAccuracy:true});
 };

 const onFoto=async(i,e)=>{
  const file=e.target.files[0]; if(!file) return;
  const img=document.createElement('img'); const url=URL.createObjectURL(file); img.src=url;
  await new Promise(r=>img.onload=r);
  const c=document.createElement('canvas'); let w=img.width,h=img.height; const M=1024;
  if(w>M||h>M){ if(w>h){h=Math.round(h*M/w); w=M}else{w=Math.round(w*M/h); h=M} }
  c.width=w; c.height=h; c.getContext('2d').drawImage(img,0,0,w,h);
  c.toBlob(b=>{
   const f=new File([b],`foto_${i}.jpg`,{type:'image/jpeg'}); const p=URL.createObjectURL(f);
   setFotos(s=>{const n=[...s]; if(n[i].preview) URL.revokeObjectURL(n[i].preview); n[i]={id:i,file:f,preview:p}; return n});
  },'image/jpeg',0.7);
 };

 const texto=()=>`📊 *RELATÓRIO SARAH v5.2*\n🏛 ${setor}\n👤 ${agente}\n📍 ${local}\n${gps.lk?`🔗 ${gps.lk} (±${gps.acc}m)\n`:''}📝 ${desc}\n📸 ${fotos.filter(f=>f.file).length}/4 fotos`;

 const enviar=async()=>{
  const t=texto(); const files=fotos.filter(f=>f.file).map(f=>f.file);
  if(files.length>0 && navigator.canShare && navigator.canShare({files})){
   try{ await navigator.share({text:t,files}); showToast(`✅ ${files.length} fotos enviadas!`); return }catch(e){}
  }
  try{await navigator.clipboard.writeText(t)}catch{}
  window.open(`https://api.whatsapp.com/send?text=${encodeURIComponent(t)}`,'_blank');
  showToast(files.length?`Texto copiado! Anexe as ${files.length} fotos no Zap`:"Zap aberto");
 };

 return(
 <div className="space-y-4 max-w-xl mx-auto">
  <div className="flex justify-between glass p-4 rounded-2xl"><span className="text-xs font-bold text-cyan-300">📋 VISTORIA - FOTO VAI PRO ZAP</span><button onClick={onBack} className="text-xs bg-red-500/20 px-3 py-1 rounded-xl">✕</button></div>
  <div className="glass p-6 rounded-[28px] space-y-3">
   <select value={setor} onChange={e=>setSetor(e.target.value)} className="w-full bg-black border border-cyan-500/30 p-3 rounded-2xl text-xs"><option>🛡️ Defesa Civil (Vistoria de Risco)</option><option>🏘️ Habitação</option><option>🌧️ Alagamento</option></select>
   <input value={agente} onChange={e=>setAgente(e.target.value)} placeholder="Agente" className="w-full bg-black border border-cyan-500/30 p-3 rounded-2xl text-xs"/>
   <div className="flex gap-2"><input value={local} onChange={e=>setLocal(e.target.value)} placeholder="Local" className="flex-1 bg-black border border-cyan-500/30 p-3 rounded-2xl text-xs"/><button onClick={toggleGps} className={`${gpsOn?'bg-emerald-400 text-black':'bg-white text-black'} px-3 rounded-xl text-[11px] font-black`}>{status}</button></div>
   {gps.lk&&<a href={gps.lk} target="_blank" className="text-[11px] text-emerald-400 underline">📍 Abrir Maps</a>}
   <textarea value={desc} onChange={e=>setDesc(e.target.value)} placeholder="Relato" rows="3" className="w-full bg-black border border-cyan-500/30 p-3 rounded-2xl text-xs"></textarea>
   <div className="grid grid-cols-2 gap-2">{fotos.map((f,i)=>(<label key={i} className="h-24 border-2 border-dashed border-cyan-500/30 rounded-2xl flex items-center justify-center overflow-hidden bg-black">{f.preview?<img src={f.preview} className="w-full h-full object-cover"/>:<span className="text-xs">Foto {i+1}</span>}<input type="file" accept="image/*" capture="environment" hidden onChange={e=>onFoto(i,e)}/></label>))}</div>
   <button onClick={enviar} className="w-full bg-gradient-to-r from-emerald-400 to-cyan-400 text-black font-black p-3 rounded-2xl text-xs">💬 ENVIAR ZAP + FOTOS</button>
  </div>
 </div>
 );
}

function Observatory(){
 const[t,setT]=React.useState(""); const[mkt,setMkt]=React.useState(()=>localStorage.getItem("sarah_custom_sponsor_text")||"JUNINHO DO MERCADINHO • Preços baixos é aqui");
 React.useEffect(()=>{
  const u=()=>{const d=new Date(); setT(`${String(d.getDate()).padStart(2,'0')}/${String(d.getMonth()+1).padStart(2,'0')} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`)}; u();
  const a=setInterval(u,1000); const b=setInterval(()=>{const v=localStorage.getItem("sarah_custom_sponsor_text"); if(v) setMkt(v)},1000);
  return()=>{clearInterval(a);clearInterval(b)}
 },[]);
 return(
 <div className="glass rounded-2xl p-3">
  <div className="text-center font-black text-xs mb-2">🛰 OBSERVATÓRIO AUTOMATIZADO - {t} - ● Online</div>
  <div className="h-7 bg-[#102a45] overflow-hidden flex items-center rounded-lg"><div className="whitespace-nowrap text-cyan-300 text-[11px] font-bold" style={{animation:'rolar 40s linear infinite'}}>🛡️ Ciência cidadã • GACE • ONU Habitat • A Chave da Esperança • 199 • Bombeiros 193 • Sarah v5.2 • "Se o Senhor não guardar a cidade, em vão vigia o sentinela" (Salmos 127:1) •</div></div>
  <div className="mt-1 border-2 border-cyan-400/50 rounded-b-xl p-3 text-center"><div className="text-[10px] text-emerald-400 font-black">★ PATROCÍNIO OFICIAL ★</div><div className="font-black text-sm bg-gradient-to-r from-cyan-400 to-emerald-400 bg-clip-text text-transparent">{mkt}</div></div>
 </div>
 );
}

function App(){
 const[tab,setTab]=React.useState("chat"); const[toast,setToast]=React.useState(null); const[msg,setMsg]=React.useState([]); const[inp,setInp]=React.useState("");
 const showToast=m=>{setToast(m); setTimeout(()=>setToast(null),3000)};
 const send=t=>{if(!t.trim())return; setMsg(m=>[...m,{u:'user',t},{u:'sarah',t:`Registrado: "${t}" - sistema em alerta preventivo.`}]); setInp("")};
 return(
 <div className="min-h-screen p-4 max-w-3xl mx-auto space-y-4">
  {toast&&<div className="fixed top-4 left-1/2 -translate-x-1/2 bg-zinc-900 border border-cyan-400 px-4 py-2 rounded-2xl text-xs z-50">🛡️ {toast}</div>}
  <div className="glass p-3 rounded-2xl flex justify-between"><span className="text-xs font-black">SARAH IA NEXUS v5.2 PRO</span><button onClick={()=>{navigator.clipboard.writeText(location.href); showToast("Link copiado")}} className="text-xs">🔗</button></div>
  <div className="grid grid-cols-3 gap-2"><button onClick={()=>setTab("chat")} className={`p-3 rounded-2xl text-xs font-black ${tab==='chat'?'bg-cyan-400 text-black':'glass'}`}>💬 Chat</button><button onClick={()=>setTab("radar")} className={`p-3 rounded-2xl text-xs font-black ${tab==='radar'?'bg-cyan-400 text-black':'glass'}`}>🛰 Radar</button><button onClick={()=>setTab("report")} className={`p-3 rounded-2xl text-xs font-black ${tab==='report'?'bg-cyan-400 text-black':'glass'}`}>📋 Vistoria</button></div>
  {tab==='chat'&&<div className="space-y-3"><div className="glass p-4 rounded-[28px] space-y-2"><div className="h-40 overflow-y-auto space-y-2">{msg.length===0?<div className="text-center text-xs text-zinc-400 py-10">Chat pronto - fale com a Sara</div>:msg.map((m,i)=><div key={i} className={`flex ${m.u==='user'?'justify-end':''}`}><div className={`p-3 rounded-2xl text-xs max-w-[80%] ${m.u==='user'?'bg-cyan-400 text-black':'bg-zinc-900'}`}>{m.t}</div></div>)}</div><div className="flex gap-2"><input value={inp} onChange={e=>setInp(e.target.value)} onKeyDown={e=>e.key==='Enter'&&send(inp)} placeholder="Digite..." className="flex-1 bg-black border border-cyan-500/30 p-3 rounded-2xl text-xs"/><button onClick={()=>send(inp)} className="bg-cyan-400 text-black font-black px-5 rounded-2xl text-xs">Enviar</button></div></div><Observatory/></div>}
  {tab==='radar'&&<div className="glass rounded-[28px] p-2 h-[600px]"><iframe src="https://embed.windy.com/embed2.html?lat=-22.7845&lon=-43.4190&zoom=11&overlay=wind&product=ecmwf&marker=true" className="w-full h-full rounded-2xl border-0"></iframe></div>}
  {tab==='report'&&<FieldReportModule onBack={()=>setTab("chat")} showToast={showToast}/>}
 </div>
 );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
