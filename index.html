        const svgToPngFile = (svgString) => {
            return new Promise((resolve, reject) => {
                const blob = new Blob([svgString], { type: 'image/svg+xml;charset=utf-8' });

                const blobURL = URL.createObjectURL(blob);
                const image = new Image();
                image.onload = () => {
                    const canvas = document.createElement('canvas');
                    canvas.width = 512;
                    canvas.height = 512;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(image, 0, 0, 512, 512);
                    URL.revokeObjectURL(blobURL);

                        const file = new File([pngBlob], 'sarah-omega-icon.png', { type: 'image/png' });

            const [localizacao, setLocalizacao] = React.useState("");
            const [descricao, setDescricao] = React.useState("");
            const [gpsCoords, setGpsCoords] = React.useState({ lt: '', ln: '', lk: '' });
            const [gpsStatus, setGpsStatus] = React.useState("📍 GPS em espera");
            const [fotos, setFotos] = React.useState([
                { id: 1, file: null, preview: null },
                { id: 2, file: null, preview: null },
                { id: 3, file: null, preview: null },
                { id: 4, file: null, preview: null }
            ]);

            const capturarGps = () => {
                if (!navigator.geolocation) { showToast("⚠️ Sem suporte a GPS"); return; }
                showToast("🛰 Buscando localização GPS...");
                navigator.geolocation.getCurrentPosition(
                    (p) => {
                        const lt = p.coords.latitude.toFixed(6);
                        const ln = p.coords.longitude.toFixed(6);
                        const lk = `https://www.google.com/maps?q=${lt},${ln}`;
                        setGpsCoords({ lt, ln, lk });
                        setLocalizacao(`${lt},${ln}`);
                        setGpsStatus("✅ GPS Fixado");
                        showToast(`📍 ${lt},${ln}`);
                    },
                    () => setGpsStatus("⚠ Erro ao obter GPS"),
                    { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
                );
            };

            const handleFotoChange = (i, e) => {
                const file = e.target.files[0];
                if (!file) return;
                e.target.value = "";
                
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = (uploadEvt) => {
                    const novo = [...fotos];
                    novo[i] = { id: novo[i].id, file: file, preview: uploadEvt.target.result };
                    setFotos(novo);
                    showToast(`📸 Foto ${i + 1} anexada com sucesso!`);
                };
            };

            const montarTexto = () => {
                const fCount = fotos.filter(f => f.file).length;
                return `📊 *RELATÓRIO TÉCNICO - SARAH IA*\n` +
                       `🏛 *Setor:* ${setor}\n` +
                       `👤 *Agente:* ${agente || 'Não informado'}\n` +
                       `📍 *Local:* ${localizacao || 'Não informado'}\n` +
                       (gpsCoords.lk ? `🔗 *Maps:* ${gpsCoords.lk}\n` : ``) +
                       `📸 *Evidências:* ${fCount}/4\n` +
                       `📝 *Relato:* ${descricao || 'Sem descrição'}`;
            };

            const copiarLaudo = () => {
                navigator.clipboard.writeText(montarTexto()).then(() => showToast("📋 Relatório copiado!"));
            };

            const compartilharRelatorioComFotos = async () => {
                const texto = montarTexto();
                const validFiles = fotos.filter(f => f.file).map(f => f.file);

                if (navigator.canShare && validFiles.length > 0) {
                    try {
                        const data = { title: 'Relatório SARAH IA', text: texto, files: validFiles };
                        if (navigator.canShare(data)) {
                            await navigator.share(data);
                            showToast("✅ Fotos e relatório enviados!");
                            return;
                        }
                    } catch (err) {
                        if (err.name === 'AbortError') return;
                    }
                }

                validFiles.forEach((f, idx) => {
                    const a = document.createElement('a');
                    a.href = URL.createObjectURL(f);
                    a.download = `vistoria_foto_${idx + 1}.jpg`;
                    a.click();
                });
                showToast("📲 Fotos baixadas - cole o relatório no WhatsApp");
                window.open(`https://api.whatsapp.com/send?text=${encodeURIComponent(texto)}`, '_blank');
            };

            return (

                    <div className="flex items-center justify-between cyber-card px-5 py-3.5 rounded-2xl border border-cyberCyan/30">

                            <option>🛡️ Defesa Civil (Vistoria de Risco / Ocorrência)</option>
                            <option>🤝 Assistência Social (SUAS / CRAS / CREAS)</option>
                            <option>🎓 Pesquisa Acadêmica & Extensão (Universidade / IES)</option>
                            <option>🏘️ Ação Comunitária & Iniciativas Populares (Grupo A Chave da Esperança)</option>
                        </select>

                        <div className="grid grid-cols-2 gap-3">
                            <input value={agente} onChange={e => setAgente(e.target.value)} placeholder="Nome do Agente" className="w-full bg-void border border-cyberCyan/40 rounded-2xl p-3.5 text-xs text-white" />
                            <input value={localizacao} onChange={e => setLocalizacao(e.target.value)} placeholder="Localidade" className="w-full bg-void border border-cyberCyan/40 rounded-2xl p-3.5 text-xs text-white" />
                        </div>

                        <div className="border border-cyberCyan/40 bg-void/80 rounded-2xl p-3.5 flex items-center justify-between shadow-inner">
                            <span className="text-cyberGreen text-xs font-mono font-bold">{gpsStatus}</span>
                            <button onClick={capturarGps} className="px-4 py-2 cyber-button text-white font-black rounded-xl text-xs shadow cursor-pointer">GPS 🛰</button>
                        </div>

                        <textarea value={descricao} onChange={e => setDescricao(e.target.value)} placeholder="Descreva a ocorrência..." rows="3" className="w-full bg-void border border-cyberCyan/40 rounded-2xl p-3.5 text-xs text-white resize-none shadow-inner"></textarea>

                        <div className="grid grid-cols-2 gap-3">
                            {fotos.map((f, idx) => (
                                <label key={idx} htmlFor={`foto-${idx}`} className="relative h-32 rounded-2xl border-2 border-dashed border-cyberGreen/40 bg-void flex items-center justify-center cursor-pointer overflow-hidden shadow">
                                    {f.preview ? (

                                        </div>

                                </label>
                            ))}
                        </div>

                        <button onClick={copiarLaudo} className="w-full cyber-button text-white font-extrabold py-3.5 rounded-2xl text-xs uppercase shadow-lg tracking-wider cursor-pointer">📋 Copiar Relatório</button>
                        
                        <button onClick={compartilharRelatorioComFotos} className="w-full bg-gradient-to-r from-orange-600 via-fuchsia-600 to-indigo-600 text-white font-extrabold py-3.5 rounded-2xl text-xs uppercase shadow-xl tracking-wider cursor-pointer flex items-center justify-center gap-2">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8"/><polyline points="16 6 12 2 8 6"/><line x1="12" y1="2" x2="12" y2="15"/></svg>
                            <span>Compartilhar Fotos + Relatório no WhatsApp</span>
                        </button>
                    </div>
                </div>

                        <div className="fixed inset-0 bg-void/90 backdrop-blur-xl z-50 flex items-center justify-center p-4">
                            <div className="cyber-card max-w-md w-full p-6 sm:p-8 rounded-[32px] space-y-4 text-center shadow-2xl border border-cyberMagenta/40">
                                <h3 className="font-display text-sm font-black text-cyberOrange tracking-widest">📲 COMPARTILHAR OMEGA PRO</h3>
                                <textarea readOnly value={shareMessageText} className="w-full h-32 bg-void border border-cyberCyan/30 rounded-2xl p-3 text-xs text-slate-200 resize-none font-mono shadow-inner" />
                                <div className="flex gap-3">
                                    <button onClick={() => { navigator.clipboard.writeText(shareMessageText); showToast("📋 Link copiado!"); setShareModalOpen(false); }} className="flex-1 py-3.5 cyber-button text-white font-black rounded-2xl text-xs cursor-pointer shadow-lg">Copiar Link</button>
                                    <button onClick={() => setShareModalOpen(false)} className="px-5 py-3.5 bg-cyberMagenta/20 text-cyberMagenta border border-cyberMagenta/40 rounded-2xl text-xs font-bold cursor-pointer">Fechar</button>
                                </div>
                            </div>
                        </div>
                    )}

                    {installModalOpen && (
                        <div className="fixed inset-0 bg-void/90 backdrop-blur-xl z-50 flex items-center justify-center p-4">
                            <div className="cyber-card max-w-md w-full p-6 sm:p-8 rounded-[32px] space-y-5 text-center shadow-2xl border border-cyberMagenta/40 max-h-[88vh] overflow-y-auto">
                                <div className="flex flex-col items-center space-y-2">
                                    <div className="w-24 h-24 rounded-[26px] overflow-hidden border-2 border-cyberMagenta/60 shadow-[0_0_40px_rgba(217,70,239,0.4)]">
                                        <img src={MAIN_ICON_URL} alt="Ícone SARAH OMEGA PRO" className="w-full h-full object-cover" />
                                    </div>
                                    <h3 className="font-display text-sm font-black text-cyberOrange tracking-widest">INSTALAR SARAH OMEGA PRO</h3>
                                    <p className="text-[10px] font-mono text-cyberGreen font-bold tracking-wider">v8.4 PRO • DEFESA CIVIL COMUNITÁRIA</p>
                                </div>
                                <button onClick={() => { setInstallModalOpen(false); openShareFromApp(); }}
                                    className="w-full py-3.5 cyber-button text-white font-black rounded-2xl text-xs uppercase tracking-widest cursor-pointer shadow-xl">
                                    📲 Compartilhar App + Ícone + Link
                                </button>
                                <button onClick={() => setInstallModalOpen(false)}
                                    className="w-full py-3 bg-cyberMagenta/20 text-cyberMagenta border border-cyberMagenta/40 rounded-2xl text-xs font-bold cursor-pointer">
                                    Fechar
                                </button>
                            </div>
                        </div>
                    )}

                    {!termsAccepted && (
                        <div className="fixed inset-0 bg-void/95 z-[200] flex items-center justify-center p-4 overflow-y-auto">
                            <div className="cyber-card max-w-lg w-full p-6 sm:p-8 rounded-[36px] shadow-2xl space-y-5 my-auto border border-cyberMagenta/50">
                                <div className="text-center space-y-2">
                                    <div className="inline-flex p-3.5 rounded-3xl bg-cyberOrange/15 border border-cyberOrange/40 text-cyberOrange mb-1"><CyberShieldIcon className="w-9 h-9" /></div>
                                    <h2 className="font-display text-lg font-black text-white tracking-wide">TERMO DE RESPONSABILIDADES</h2>
                                    <p className="text-xs text-cyberOrange font-black uppercase tracking-widest">SARAH IA NEXUS v8.4 PRO • LGPD</p>
                                </div>

                                <div className="space-y-2.5">
                                    {[
                                        { icon: "🛡️", title: "PILAR I — FINALIDADE E PREVENÇÃO", text: "Os dados coletados destinam-se exclusivamente ao monitoramento comunitário e resposta da Defesa Civil." },
                                        { icon: "⚖️", title: "PILAR II — BASE LEGAL E TRANSPARÊNCIA", text: "O tratamento observa a Lei Federal nº 13.709/2018 (LGPD)." },
                                        { icon: "🔒", title: "PILAR III — SEGURANÇA E RESPONSABILIDADE", text: "Medidas técnicas rigorosas para proteção das informações." }
                                    ].map((p, i) => (
                                        <div key={i} className="bg-void/90 p-4 rounded-2xl border border-cyberMagenta/20 space-y-1">
                                            <div className="flex items-center gap-2 text-[10px] font-display font-black text-cyberOrange tracking-widest">
                                                <span>{p.icon}</span> {p.title}
                                            </div>
                                            <p className="text-[11px] text-slate-300 leading-relaxed">{p.text}</p>
                                        </div>
                                    ))}
                                </div>

                                <div className="space-y-3">
                                    <label className="flex items-start gap-3 cursor-pointer text-xs text-slate-300 bg-commandPanel/80 p-3.5 rounded-xl border border-cyberCyan/20">
                                        <input type="checkbox" checked={check1} onChange={(e) => setCheck1(e.target.checked)} className="mt-0.5 rounded border-cyberCyan/50 text-cyberOrange w-4 h-4 bg-void shrink-0 cursor-pointer" />
                                        <span>Li e aceito os Termos e a LGPD.</span>
                                    </label>
                                    <label className="flex items-start gap-3 cursor-pointer text-xs text-slate-300 bg-commandPanel/80 p-3.5 rounded-xl border border-cyberCyan/20">
                                        <input type="checkbox" checked={check2} onChange={(e) => setCheck2(e.target.checked)} className="mt-0.5 rounded border-cyberCyan/50 text-cyberOrange w-4 h-4 bg-void shrink-0 cursor-pointer" />
                                        <span>Autorizo o uso obrigatório do GPS para vistorias.</span>
                                    </label>
                                </div>

                                <button disabled={!check1 || !check2} onClick={() => { setTermsAccepted(true); try { localStorage.setItem("sarah_terms_accepted_v52_lgpd", "1"); } catch(e) {} showToast("🚀 Núcleo OMEGA PRO ativado!"); }} className={`w-full py-4 rounded-2xl font-display font-black text-xs uppercase tracking-[0.2em] transition shadow-2xl ${check1 && check2 ? 'cyber-button text-white cursor-pointer' : 'bg-commandPanel text-slate-500 cursor-not-allowed'}`}>
                                    Concordar e Iniciar Operação
                                </button>
                            </div>
                        </div>
                    )}

                    <header className="cyber-card sticky top-0 z-30 px-4 sm:px-6 py-3.5 border-b border-cyberCyan/30 flex items-center justify-between shadow-2xl">
                        <div className="flex items-center gap-3">
                            <div className={`w-11 h-11 rounded-2xl cyber-border-glow flex items-center justify-center bg-void shadow-[0_0_30px_rgba(255,85,0,0.5)] overflow-hidden border border-cyberMagenta ${isSpeaking ? 'animate-hud-pulse' : ''}`}>
                                <img src={SARAH_CUSTOM_AVATAR_URL} alt="Avatar Sarah Header" className="w-full h-full object-cover" />
                            </div>
                            <div>
                                <h1 className="font-display text-xs sm:text-sm font-black text-white tracking-[0.15em]">SARAH IA NEXUS <span className="bg-gradient-to-r from-cyberOrange to-cyberMagenta bg-clip-text text-transparent text-[10px]" style={{textShadow:'0 0 10px rgba(255,85,0,0.6)'}}>v8.4 PRO</span></h1>
                                <p className="text-[9px] text-cyberGreen font-mono font-bold tracking-wider">COMMAND CENTER PRO • MESQUITA/RJ</p>
                            </div>
                        </div>
                        <div className="flex items-center gap-2">
                            <IconeSomToggle soundEnabled={soundEnabled} setSoundEnabled={setSoundEnabled} />
                            <IconeTemaToggle theme={theme} toggleTheme={toggleTheme} />
                            <IconeCompartilharTopo showToast={showToast} openShareFromApp={openShareFromApp} />
                            <IconeInstalarApp handleInstallApp={handleInstallApp} isInstallable={isInstallable} />
                        </div>
                    </header>

                    <nav className="cyber-card border-b border-cyberCyan/30 px-4 py-2.5 flex items-center justify-center gap-2 overflow-x-auto z-20">
                        {NAV_TABS.map(tab => (
                            <button key={tab.id} onClick={() => tab.id === 'radar' ? setRadarOpen(true) : setActiveTab(tab.id)}
                                className={`px-4 py-2 rounded-2xl text-[11px] font-black transition cursor-pointer flex items-center gap-2 shrink-0 tracking-wider ${
                                    activeTab === tab.id
                                        ? 'cyber-button text-white shadow-[0_0_25px_rgba(217,70,239,0.5)]'
                                        : 'bg-commandPanel text-slate-300 border border-cyberCyan/20'
                                }`}>
                                {tab.iconComponent} {tab.label}
                            </button>
                        ))}
                    </nav>

                    <main className="flex-1 max-w-3xl w-full mx-auto p-4 sm:p-6 space-y-5 pb-36 relative z-10">
                        {activeTab === 'dashboard' && (
                            <div className="space-y-5">
                                <div className="cyber-card p-6 sm:p-8 rounded-[36px] shadow-[0_0_70px_rgba(255,85,0,0.35)] space-y-6 text-center border-2 border-cyberMagenta/80">
                                    <SarahHologramAvatar isLarge={true} isSpeaking={isSpeaking} />

                                    <div className="space-y-2">
                                        <div className="inline-flex items-center px-4 py-1.5 rounded-full bg-cyberMagenta/15 border border-cyberMagenta/35 font-mono text-[10px] text-cyberMagenta tracking-widest shadow-inner">
                                            CENTRAL DE INTELIGÊNCIA COMUNITÁRIA & METEOROLOGIA PRO
                                        </div>
                                        <h2 className="font-display text-base font-black text-white tracking-wide">CENTRAL OMEGA PRO & CLIMA</h2>
                                        <p className="text-xs text-slate-300 font-medium italic">
                                            "Prevenção não é mídia: é gente atenta." A Sarah Pro conversa sobre clima, bacias, fé, cultura, lazer, culinária e cidadania.
                                        </p>
                                    </div>

                                    <button onClick={openSarahChat} className="relative w-full max-w-sm mx-auto flex items-center justify-center gap-3 py-4 px-6 rounded-[26px] cyber-button text-white font-display font-black text-sm uppercase tracking-[0.2em] shadow-[0_0_50px_rgba(255,85,0,0.6)] cursor-pointer">
                                        💬 Falar com a Sarah IA Pro
                                    </button>

                                    {saraTip && (
                                        <div className="bg-void/90 border border-cyberMagenta/30 rounded-2xl p-4 text-left space-y-1.5 shadow-inner">
                                            <div className="flex items-center gap-2 text-[10px] font-display font-black text-cyberMagenta tracking-widest">
                                                <span className="w-1.5 h-1.5 rounded-full bg-cyberMagenta animate-ping"></span>
                                                SARAH FALANDO AGORA • {saraTip.tag}
                                            </div>
                                            <p className="text-xs text-slate-200 leading-relaxed">{saraTip.text}</p>
                                        </div>
                                    )}

                                    <div className="flex flex-wrap justify-center gap-2">
                                        <button onClick={openSarahChat} className="px-4 py-2 bg-void border border-cyberCyan/30 hover:border-cyberMagenta text-cyberOrange rounded-2xl text-[11px] font-bold transition cursor-pointer">🌊 Bacias</button>
                                        <button onClick={openSarahChat} className="px-4 py-2 bg-void border border-cyberCyan/30 hover:border-cyberMagenta text-cyberOrange rounded-2xl text-[11px] font-bold transition cursor-pointer">🌦️ Clima</button>
                                        <button onClick={openSarahChat} className="px-4 py-2 bg-void border border-cyberCyan/30 hover:border-cyberMagenta text-cyberOrange rounded-2xl text-[11px] font-bold transition cursor-pointer">🛡️ Defesa Civil</button>
                                        <button onClick={openSarahChat} className="px-4 py-2 bg-void border border-cyberMagenta/30 hover:border-cyberMagenta text-cyberMagenta rounded-2xl text-[11px] font-bold transition cursor-pointer">🙏 Fé & Cultura</button>
                                    </div>
                                </div>
                            </div>
                        )}

                        {activeTab === 'relatorio' && <FieldReportModule onBackToDashboard={() => setActiveTab('dashboard')} showToast={showToast} />}
                        {activeTab === 'galeria' && <PublicVideoGallery localVideos={localVideos} onGoToDashboard={() => setActiveTab('dashboard')} />}
                        {activeTab === 'admin' && (
                            <AdminVaultModule
                                localVideos={localVideos}
                                setLocalVideos={setLocalVideos}
                                marketingText={marketingText}
                                setMarketingText={setMarketingText}
                                showToast={showToast}
                                onClose={() => setActiveTab('dashboard')}
                            />
                        )}

                        <AutomatedObservatoryWidget marketingText={marketingText} />
                    </main>

                    {termsAccepted && <SarahFabButton onOpen={openSarahChat} />}

                    <NativeHydroWindRadar isOpen={radarOpen} onToggle={() => setRadarOpen(o => !o)} />

                    <SarahChatOverlay
                        isOpen={isChatOpen}
                        onClose={() => { setIsChatOpen(false); stopSpeaking(); }}
                        isSpeaking={isSpeaking}
                        isProcessing={isProcessing}
                        currentResponse={currentResponse}
                        input={input}
                        setInput={setInput}
                        handleSendDirectCommand={handleSendDirectCommand}
                        toggleListening={toggleListening}
                        isListening={isListening}
                    />

                    <footer className="cyber-card fixed bottom-0 left-0 right-0 z-40 border-t border-cyberCyan/30 px-4 py-3 flex items-center justify-around shadow-2xl backdrop-blur-2xl">
                        {NAV_TABS.map(tab => (
                            <button key={tab.id} onClick={() => tab.id === 'radar' ? setRadarOpen(true) : setActiveTab(tab.id)}
                                className={`flex flex-col items-center gap-1 cursor-pointer transition ${activeTab === tab.id ? 'text-cyberOrange scale-105' : 'text-slate-400 hover:text-white'}`}>
                                {tab.iconComponent}
                                <span className="text-[9px] font-black tracking-wider">{tab.label}</span>
                            </button>
                        ))}
                    </footer>
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
    <script>
        if ("serviceWorker" in navigator) {
            window.addEventListener("load", () => {
                navigator.serviceWorker.register("./service-worker.js?v=8.4")
                    .then((reg) => {
                        reg.update();
                        console.log("🛡 SARAH OMEGA PRO: Service Worker v8.4 ativo.");
                    })
                    .catch((err) => console.warn("SW não registrado:", err));
            });
        }
    </script>
</body>
</html>
