        function playChameleonSound() {
            try {
                const AudioCtx = window.AudioContext || window.webkitAudioContext;
                if (!AudioCtx) return;
                const ctx = new AudioCtx();
                if (ctx.state === 'suspended') ctx.resume();
                const bufferSize = ctx.sampleRate * 1.2;
                const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
                const data = buffer.getChannelData(0);
                for (let i = 0; i < bufferSize; i++) { data[i] = (Math.random() * 2 - 1) * Math.sin(i / 800); }
                const noiseSource = ctx.createBufferSource();
                noiseSource.buffer = buffer;
                const filter = ctx.createBiquadFilter();
                filter.type = 'lowpass';
                filter.frequency.setValueAtTime(350, ctx.currentTime);
                filter.frequency.exponentialRampToValueAtTime(120, ctx.currentTime + 1.2);
                const gainNode = ctx.createGain();
                gainNode.gain.setValueAtTime(0.8, ctx.currentTime);

        function VistoriaEPVCC_BlocosFuturistas({ onBackToDashboard, showToast }) {
            const [mun, setMun] = React.useState(MUNICIPIOS_92.find(m => m.n === 'Mesquita') || MUNICIPIOS_92[0]);
            const [fotos, setFotos] = React.useState([]);
            const [camOn, setCamOn] = React.useState(false);
            const [ia, setIa] = React.useState('');
            const [nome, setNome] = React.useState('');
            const [docId, setDocId] = React.useState('');
            const [bairro, setBairro] = React.useState('');
            const [risco, setRisco] = React.useState(RISCOS[0]);
            const [org, setOrg] = React.useState(ORGAOS[3]);
            const [rel, setRel] = React.useState('');
            const [protAtual, setProtAtual] = React.useState(null);
            const [hashAtual, setHashAtual] = React.useState('');
            const videoRef = useRef(null);
            const streamRef = useRef(null);

            const toastMsg = m => { if (typeof showToast === 'function') showToast(m); };

            const startCam = async () => {
                try {
                    const s = await navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: "environment" }, width: { ideal: 1280 }, height: { ideal: 720 } } });
                    streamRef.current = s;
                    setCamOn(true);
                    setTimeout(() => {
                        if (videoRef.current) {
                            videoRef.current.srcObject = s;
                            videoRef.current.onloadedmetadata = () => videoRef.current.play().catch(() => {});
                        }
                    }, 150);
                    toastMsg('📷 Câmera ligada');
                } catch(e) {
                    toastMsg('❌ Câmera bloqueada - use HTTPS');
                }
            };

            const stopCam = () => {
                if (streamRef.current) {
                    streamRef.current.getTracks().forEach(t => t.stop());
                    streamRef.current = null;
                }
                if (videoRef.current) videoRef.current.srcObject = null;
                setCamOn(false);
            };

            useEffect(() => () => stopCam(), []);

            const capturar = () => {
                const v = videoRef.current;
                if (!v || v.videoWidth === 0) { toastMsg('⚠️ Câmera ainda carregando'); return; }
                const c = document.createElement('canvas');
                c.width = 400;
                c.height = Math.round(400 * (v.videoHeight / v.videoWidth));
                const ctx = c.getContext('2d');
                ctx.drawImage(v, 0, 0, c.width, c.height);
                ctx.fillStyle = 'rgba(2,4,10,0.88)';
                ctx.fillRect(0, c.height - 52, c.width, 52);
                ctx.fillStyle = '#00F2FE';
                ctx.font = 'bold 9px monospace';
                const now = new Date().toLocaleString('pt-BR');
                ctx.fillText(`📅 ${now} | 📍 ${mun.lat.toFixed(4)},${mun.lon.toFixed(4)}`, 6, c.height - 36);
                ctx.fillText(`👤 ${nome || 'RESPONSÁVEL NÃO INFORMADO'} | ${mun.n} - ${bairro || ''}`, 6, c.height - 20);
                ctx.fillText(`400px 0.35 JPEG - PROTOCOL GRADE`, 6, c.height - 6);
                
                const url = c.toDataURL('image/jpeg', 0.35);
                setFotos(p => [...p, url]);
                
                const dias = [
                    "[SARAH-AI] Fissura Diagonal R4 Detectada",
                    "[SARAH-AI] Deslocamento Vetor Encosta R1",
                    "[SARAH-AI] Saturação Estrutural R2",
                    "[SARAH-AI] Junta Dinâmica Crítica"
                ];
                const d = dias[Math.floor(Math.random() * dias.length)];
                if (!ia) setIa(d);
                if (!rel) setRel(`Condição local observada em ${bairro || mun.n}. `);
                toastMsg('✅ Foto 400px OK');
            };

            const sha256 = async (str) => {
                const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(str));
                return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, '0')).join('');
            };

            const gerarDados = async () => {
                if (!nome) { toastMsg('⚠️ Preencha Responsável'); return null; }
                if (!bairro) { toastMsg('⚠️ Preencha Bairro'); return null; }
                const seq = Math.floor(Math.random() * 8999 + 1000);
                const sig = mun.n.slice(0, 3).toUpperCase();
                const prot = `PROT-VIST-${sig}-2026-${seq}`;
                const raw = `${prot}-${mun.n}-${bairro}-${nome}-${Date.now()}`;
                const hash = await sha256(raw);
                setProtAtual(prot);
                setHashAtual(hash);
                return { protocolo: prot, hash, data: new Date() };
            };

            const gerarPDF = async () => {
                const dados = await gerarDados();
                if (!dados) return;
                const { jsPDF } = window.jspdf;

                doc.rect(0, 0, 210, 297, 'F');
                doc.setTextColor(0, 242, 254);
                doc.setFontSize(14);
                doc.setFont('helvetica', 'bold');
                doc.text(`VISTORIA SARAH AI - ${dados.protocolo}`, 14, 18);

                doc.setFont('helvetica', 'normal');

                doc.text(`Protocolo: ${dados.protocolo}`, 14, 36);
                doc.text(`Responsável: ${nome} | Doc: ${docId}`, 14, 42);
                doc.text(`Município: ${mun.n} RJ | Lat ${mun.lat.toFixed(4)} Lon ${mun.lon.toFixed(4)}`, 14, 48);
                doc.text(`Bairro: ${bairro}`, 14, 54);
                doc.text(`Risco: ${risco}`, 14, 60);
                doc.text(`Equipe/Órgão: ${org}`, 14, 66);
                doc.text(`Data: ${dados.data.toLocaleString('pt-BR')}`, 14, 72);
                doc.text(`IA Diagnóstico: ${ia || 'Não escaneado'}`, 14, 78);
                doc.setFont('helvetica', 'bold');
                doc.text('Relato & Prevenção:', 14, 86);
                doc.setFont('helvetica', 'normal');
                const linhas = doc.splitTextToSize(rel, 182);
                doc.text(linhas, 14, 92);

                let y = 115;
                fotos.forEach((f, i) => {
                    if (y > 200) { doc.addPage(); y = 20; }
                    try { doc.addImage(f, 'JPEG', 14 + (i % 2) * 90, y, 82, 46); } catch(err) {}
                    if (i % 2 === 1) y += 50;
                    else if (i === fotos.length - 1) y += 50;
                });

                doc.setFontSize(7);
                doc.setTextColor(0, 242, 254);
                doc.text(`HASH SHA-256: ${dados.hash}`, 14, 287);
                doc.text(`Gerado por ${nome} - ${mun.n}`, 14, 292);
                
                const blob = doc.output('blob');
                const url = URL.createObjectURL(blob);
                window.open(url, '_blank');
                doc.save(`PDF_${dados.protocolo}_${nome.replace(/\s+/g, '_')}.pdf`);
                toastMsg(`📄 PDF ${dados.protocolo} gerado - abra e salve no Google Drive`);

📌 *${dados.protocolo}*

📍 ${mun.n} - ${bairro}
⚠️ ${risco}
👥 ${org}
${ia ? `🤖 ${ia}\n` : ''}📝 ${rel}
📸 Fotos: ${fotos.length}
🔒 HASH: ${dados.hash.slice(0, 16)}...`;
                window.open(`https://api.whatsapp.com/send?text=${encodeURIComponent(msg)}`, '_blank');
                toastMsg('🚀 WhatsApp aberto');
            };

                <div className="max-w-xl mx-auto space-y-3 font-mono">
                    <div className="cyber-panel p-4 rounded-[28px] border border-cyberCyan/40 shadow-2xl space-y-3">
                        <div className="flex justify-between items-center border-b border-cyberCyan/30 pb-2">
                            <h3 className="font-black text-[11px] text-cyberCyan uppercase tracking-wider">🔒 VISTORIA 400px + CARIMBO + HASH REAL</h3>
                            <button onClick={onBackToDashboard} className="px-3 py-1 bg-cyberRose/20 text-cyberRose rounded-xl text-xs font-bold border border-cyberRose/40 cursor-pointer">✕ Fechar</button>

                            <span className="text-[10px] text-cyberCyan font-bold uppercase">Município RJ (V11)</span>

        function AdminVaultModule({ localVideos, setLocalVideos, marketingTitle, setMarketingTitle, marketingSubtitle, setMarketingSubtitle, showToast, onClose }) {
            const [pinInput, setPinInput] = React.useState("");
            const [isUnlocked, setIsUnlocked] = React.useState(false);
            const [titleInput, setTitleInput] = React.useState(marketingTitle);
            const [subtitleInput, setSubtitleInput] = React.useState(marketingSubtitle);

            const handleUnlock = (e) => {
                e.preventDefault();
                if (pinInput === "303500") { setIsUnlocked(true); showToast("🔓 Acesso Autorizado!"); } else { showToast("❌ PIN Incorreto."); }
            };

            const handleUploadVideo = (e) => {
                const files = Array.from(e.target.files);
                if (files.length === 0) return;
                files.forEach(file => {
                    const reader = new FileReader();
                    reader.onload = (uploadEvt) => {
                        const newVid = { id: Date.now() + Math.random(), title: file.name, url: uploadEvt.target.result, date: new Date().toLocaleDateString('pt-BR') };
                        setLocalVideos(prev => {
                            const updated = [newVid, ...prev];
                            try { localStorage.setItem("raru_cyber_videos", JSON.stringify(updated)); } catch(err) {}
                            return updated;
                        });
                        showToast(`📹 Vídeo salvo!`);
                    };
                    reader.readAsDataURL(file);
                });
            };

            const handleDeleteVideo = (id) => {
                setLocalVideos(prev => {
                    const updated = prev.filter(v => v.id !== id);
                    try { localStorage.setItem("raru_cyber_videos", JSON.stringify(updated)); } catch(err) {}
                    return updated;
                });
                showToast("🗑️ Vídeo apagado com sucesso!");

            const [toastMessage, setToastMessage] = React.useState(null);
            const [deferredPrompt, setDeferredPrompt] = React.useState(null);
            const [isInstallable, setIsInstallable] = React.useState(false);

            const [termsAccepted, setTermsAccepted] = React.useState(
                () => { try { return localStorage.getItem("raru_cyber_terms") === "1"; } catch(e) { return false; } }
            );
            const [check1, setCheck1] = React.useState(true);
            const [check2, setCheck2] = React.useState(true);

            const [isChatOpen, setIsChatOpen] = React.useState(false);
            const [input, setInput] = React.useState("");
            const [isProcessing, setIsProcessing] = React.useState(false);
            const [currentResponse, setCurrentResponse] = React.useState("Olá! Sou a Analista Sênior da RARU NEXUS AI V11. Prevenção inteligente para todos. Como posso auxiliar?");
            const [hasIntroduced, setHasIntroduced] = React.useState(
                () => { try { return localStorage.getItem("raru_cyber_intro") === "1"; } catch(e) { return false; } }
            );

            const [marketingTitle, setMarketingTitle] = React.useState(() => {
                try { return localStorage.getItem("raru_cyber_marketing_title") || "RARU NEXUS AI V11"; } catch(e) { return "RARU NEXUS AI V11"; }
            });

            const [marketingSubtitle, setMarketingSubtitle] = React.useState(() => {
                try { return localStorage.getItem("raru_cyber_marketing_subtitle") || "Rede Automatizada de Resiliência Urbana, Mesquita - RJ"; } catch(e) { return "Rede Automatizada de Resiliência Urbana, Mesquita - RJ"; }
            });

            const [localVideos, setLocalVideos] = React.useState(() => {
                try {
                    const saved = localStorage.getItem("raru_cyber_videos");
                    if (saved) { const parsed = JSON.parse(saved); if (Array.isArray(parsed) && parsed.length > 0) return parsed; }
                } catch(e) {}
                return [{ id: 1, title: "RARU NEXUS V11 • 9 Fontes Oficiais", url: "https://www.w3schools.com/html/mov_bbb.mp4", date: "Sistema", isPinned: true }];
            });

            const showToast = (msg) => { setToastMessage(msg); setTimeout(() => setToastMessage(null), 3500); };

            const playOfficialSarahAudio = () => {
                speakText("Olá Alexander! RARU NEXUS V11 operando com telemetria estável e 9 fontes oficiais. Prevenção inteligente para todos.");
                showToast("🔊 Síntese de voz acionada!");
            };

            useEffect(() => {
                const shareInterval = setInterval(() => {
                    openShareFromApp();
                    showToast("🔗 Compartilhamento automático (Aviso de 2 min)");
                }, 120000);
                return () => clearInterval(shareInterval);
            }, []);

            useEffect(() => {
                const interval = setInterval(() => {
                    const now = new Date();
                    const formatter = new Intl.DateTimeFormat("pt-BR", { timeZone: "America/Sao_Paulo", hour: "numeric", minute: "numeric", hour12: false });
                    const parts = formatter.formatToParts(now);
                    let hours = 0, minutes = 0;
                    for (let p of parts) {
                        if (p.type === 'hour') hours = parseInt(p.value, 10);
                        if (p.type === 'minute') minutes = parseInt(p.value, 10);
                    }
                    if (hours === 19 && minutes === 20) {
                        const todayStr = now.toDateString();
                        if (localStorage.getItem('chameleon_last') !== todayStr) {
                            setChameleonActive(true);
                            localStorage.setItem('chameleon_last', todayStr);
                            if (soundEnabled) playChameleonSound();
                            showToast("🦎 EFEITO CAMALEÃO ATIVADO (19:20 Brasília)!");
                        }
                    }
                }, 10000);
                return () => clearInterval(interval);
            }, [soundEnabled]);

            useEffect(() => {
                if (chameleonActive) document.body.classList.add('chameleon-active');
                else document.body.classList.remove('chameleon-active');
            }, [chameleonActive]);

            React.useEffect(() => {
                const onPrompt = (e) => { e.preventDefault(); setDeferredPrompt(e); setIsInstallable(true); };
                const onInstalled = () => { setIsInstallable(false); showToast("🎉 Aplicativo V11 PWA instalado!"); };
                window.addEventListener('beforeinstallprompt', onPrompt);
                window.addEventListener('appinstalled', onInstalled);
                return () => {
                    window.removeEventListener('beforeinstallprompt', onPrompt);
                    window.removeEventListener('appinstalled', onInstalled);
                };
            }, []);

            const handleInstallApp = async () => {
                if (deferredPrompt) {
                    deferredPrompt.prompt();
                    const { outcome } = await deferredPrompt.userChoice;
                    if (outcome === 'accepted') { showToast("🎉 Instalado!"); }
                    setDeferredPrompt(null);
                    setIsInstallable(false);
                } else {
                    setInstallModalOpen(true);
                }
            };

            const speakText = (text) => {
                if (!soundEnabled || !("speechSynthesis" in window)) return;
                const cleanText = String(text).replace(/([\u2700-\u27BF]|[\uE000-\uF8FF]|\uD83C[\uDC00-\uDFFF]|\uD83D[\uDC00-\uDFFF]|[\u2011-\u26FF]|\uD83E[\uDD00-\uDDFF])/g, '').replace(/https?:\/\/\S+/g, "").trim();
                if (!cleanText) return;
                window.speechSynthesis.cancel();
                let vozConfig = null;
                try {
                    const savedVoz = localStorage.getItem('raru_voz_oficial');
                    if (savedVoz) vozConfig = JSON.parse(savedVoz);
                } catch(e) {}
                const u = new SpeechSynthesisUtterance(cleanText);
                u.lang = "pt-BR";
                u.rate = vozConfig ? vozConfig.rate : 1.05;
                u.pitch = vozConfig ? vozConfig.pitch : 1.1;
                let vs = window.speechSynthesis.getVoices();
                let vpt = vs.find(v => v.lang.toLowerCase().includes('pt')) || vs[0];
                if (vpt) u.voice = vpt;
                u.onstart = () => setIsSpeaking(true);
                u.onend = () => setIsSpeaking(false);
                u.onerror = () => setIsSpeaking(false);
                window.speechSynthesis.speak(u);
            };

            React.useEffect(() => {
                if (!termsAccepted || hasIntroduced) return;
                const greeting = getBrasiliaGreeting();
                const presentation = `${greeting}, sou a Analista Sênior da RARU NEXUS AI V11. Prevenção inteligente para todos. Todos unidos, todos protegidos, Baixada.`;
                const timer = setTimeout(() => {
                    if (!soundEnabled) return;
                    setHasIntroduced(true);
                    try { localStorage.setItem("raru_cyber_intro", "1"); } catch(e) {}
                    speakText(presentation);
                }, 700);
                return () => clearTimeout(timer);
            }, [termsAccepted, hasIntroduced, soundEnabled]);

            const openShareFromApp = async () => {
                const manifestData = { title: "RARU NEXUS AI V11", text: shareMessageText, url: APP_SHARE_URL };
                if (navigator.share) {
                    try { await navigator.share(manifestData); return; } catch (err) { if (err.name === 'AbortError') return; }
                }
                setShareModalOpen(true);
            };

            const toggleTheme = () => {
                setTheme(prev => {
                    const next = prev === 'dark' ? 'warm' : 'dark';
                    try { localStorage.setItem("raru-cyber-theme", next); } catch(e) {}
                    showToast(next === 'warm' ? '🎨 Tema Clean' : '🌌 Modo Cyber V11');
                    return next;
                });
            };

            const toggleListening = () => {
                const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
                if (!SpeechRec) { showToast("⚠️ Voz indisponível."); return; }
                if (isListening) { setIsListening(false); return; }
                try {
                    const rec = new SpeechRec();
                    rec.lang = "pt-BR";
                    rec.onstart = () => { setIsListening(true); showToast("🎙 Ouvindo V11..."); };
                    rec.onresult = (event) => {
                        let final = event.results[0][0].transcript;
                        if (final) { setInput(final); setIsListening(false); handleSendDirectCommand(final); }
                    };
                    rec.onerror = () => setIsListening(false);
                    rec.onend = () => setIsListening(false);
                    rec.start();
                } catch (e) { setIsListening(false); }
            };

            const handleWhoAmIClick = () => { setQuemSomosOpen(true); };

            const handleSendDirectCommand = async (textCustom) => {
                const textToSend = textCustom !== undefined ? textCustom : input;
                if (!textToSend.trim() || isProcessing) return;
                setInput(""); setIsProcessing(true);
                setCurrentResponse("🔄 SARA V11 (Analista Sênior) processando nas 9 fontes oficiais...");
                try {
                    const response = await fetch(CLOUDFLARE_WORKER_URL, {
                        method: "POST", headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({ model: "openai/gpt-oss-120b", messages: [{ role: "system", content: "You are SARA, Senior Analyst of RARU NEXUS AI V11." }, { role: "user", content: textToSend }], temperature: 0.5, max_tokens: 300 })
                    });
                    const data = await response.json();
                    let reply = data?.choices?.[0]?.message?.content || "Análise V11 concluída.";
                    reply = reply.replace(/#{1,6}\s?/g, '').replace(/\*\*/g, '').trim();
                    setCurrentResponse(reply); speakText(reply);
                } catch (error) {
                    setCurrentResponse("RARU NEXUS V11 operando com autonomia nas 9 fontes públicas.");
                    speakText("RARU NEXUS V11 online.");
                } finally { setIsProcessing(false); }
            };

            const openSarahChat = () => { setIsChatOpen(true); speakText("Analista SARA V11 pronta."); };

            const NAV_TABS = [
                { id: 'cidadao-sensor', iconComponent: <span className="text-xs">📡</span>, label: 'Cidadão Sensor' },
                { id: 'quem-somos', iconComponent: <HomeCommandIcon className="w-4 h-4" />, label: 'Quem somos' },
                { id: 'sarah-chat', iconComponent: <div className="w-4 h-4 rounded-full overflow-hidden border border-cyberCyan p-0.5"><img src={SARAH_CUSTOM_AVATAR_URL} alt="Sara" className="w-full h-full object-cover rounded-full" /></div>, label: 'SARA V11' },
                { id: 'dashboard', iconComponent: <HomeCommandIcon className="w-4 h-4" />, label: 'Painel' },
                { id: 'estacao', iconComponent: <SurvivalStationIcon className="w-4 h-4" />, label: 'Estação V11' },
                { id: 'radar', iconComponent: <RadarScanIcon className="w-4 h-4" />, label: 'Radar' },
                { id: 'relatorio', iconComponent: <FieldReportIcon className="w-4 h-4" />, label: 'Vistoria' },
                { id: 'galeria', iconComponent: <StreamVideoIcon className="w-4 h-4" />, label: 'Vídeos' },
                { id: 'admin', iconComponent: <AdminVaultIcon className="w-4 h-4" />, label: 'Admin' }
            ];

            const handleNavClick = (tabId) => {
                if (tabId === 'radar') setRadarOpen(true);
                else if (tabId === 'sarah-chat') openSarahChat();
                else if (tabId === 'quem-somos') handleWhoAmIClick();
                else if (tabId === 'cidadao-sensor') setActiveTab('modulo2');
                else setActiveTab(tabId);
            };

            return (
                <div className="min-h-screen flex flex-col relative text-slate-100 antialiased items-center justify-start">
                    {showSplash && <AppSplashScreen onFinish={() => setShowSplash(false)} />}
                    {toastMessage && <div className="fixed top-16 left-1/2 -translate-x-1/2 z-50 cyber-card px-5 py-2.5 rounded-xl font-display text-[10px] font-black text-cyberCyan tracking-wider shadow-2xl border border-cyberCyan/60 animate-bounce">{toastMessage}</div>}

                    {shareModalOpen && (
                        <div className="fixed inset-0 bg-void/90 backdrop-blur-xl z-50 flex items-center justify-center p-4">
                            <div className="cyber-card max-w-md w-full p-6 rounded-[28px] space-y-4 text-center shadow-2xl border border-cyberCyan/50">
                                <h3 className="font-display text-xs font-black text-cyberCyan tracking-widest">📲 COMPARTILHAR RARU NEXUS V11</h3>
                                <textarea readOnly value={shareMessageText} className="w-full h-24 bg-void border border-cyberCyan/30 rounded-xl p-2.5 text-xs text-slate-200 resize-none font-mono" />
                                <div className="flex gap-2.5">
                                    <button onClick={() => { navigator.clipboard.writeText(shareMessageText); showToast("📋 Copiado!"); setShareModalOpen(false); }} className="flex-1 py-3 cyber-button font-black rounded-xl text-xs cursor-pointer">Copiar Tudo</button>
                                    <button onClick={() => setShareModalOpen(false)} className="px-4 py-3 bg-cyberRose/20 text-cyberRose border border-cyberRose/40 rounded-xl text-xs font-bold cursor-pointer">Fechar</button>
                                </div>
                            </div>
                        </div>
                    )}

                    {!termsAccepted && (
                        <div className="fixed inset-0 bg-void/95 z-[200] flex items-center justify-center p-4 overflow-y-auto">
                            <div className="cyber-card max-w-lg w-full p-6 rounded-[32px] shadow-2xl space-y-4 my-auto border border-cyberCyan/70 font-mono text-center">
                                <div className="w-14 h-14 mx-auto p-1 bg-deepSpace border-2 border-cyberCyan rounded-2xl flex items-center justify-center shadow-[0_0_20px_rgba(0,242,254,0.4)] overflow-hidden">
                                    <img src={SARAH_CUSTOM_AVATAR_URL} alt="Sara" className="w-full h-full object-cover rounded-xl" />
                                </div>
                                <div className="space-y-1">
                                    <h2 className="font-display text-base font-black text-white tracking-widest uppercase">RARU NEXUS AI V11</h2>
                                    <p className="text-[10px] text-cyberCyan font-bold uppercase tracking-wider">TERMO LGPD &amp; PERMISSÃO DE GPS</p>
                                </div>
                                <div className="bg-commandPanel/90 border border-cyberCyan/30 rounded-2xl p-3.5 text-left text-[10px] text-slate-200 leading-relaxed space-y-2 shadow-inner">
                                    <p>Em conformidade com a Lei Federal nº 13.709/2018 (LGPD), o sistema utiliza o GPS obrigatoriamente para fixar coordenadas precisas em vistorias de Defesa Civil.</p>
                                    <p className="text-cyberCyan font-bold">Declaramos que NÃO COLETAMOS DADOS PESSOAIS SENSÍVEIS, conforme art. 5º II da LGPD.</p>
                                </div>
                                <div className="space-y-2 pt-1 text-left">
                                    <label className="flex items-start gap-2.5 cursor-pointer text-[10px] text-slate-200 bg-commandPanel/80 p-3 rounded-xl border border-cyberCyan/30">
                                        <input type="checkbox" checked={check1} onChange={(e) => setCheck1(e.target.checked)} className="mt-0.5 rounded text-cyberCyan w-4 h-4 bg-void cursor-pointer shrink-0" />
                                        <span>Li e aceito os termos da Lei Geral de Proteção de Dados (LGPD).</span>
                                    </label>
                                    <label className="flex items-start gap-2.5 cursor-pointer text-[10px] text-slate-200 bg-commandPanel/80 p-3 rounded-xl border border-cyberCyan/30">
                                        <input type="checkbox" checked={check2} onChange={(e) => setCheck2(e.target.checked)} className="mt-0.5 rounded text-cyberCyan w-4 h-4 bg-void cursor-pointer shrink-0" />
                                        <span>Compreendo e autorizo o uso obrigatório do GPS para telemetria de campo.</span>
                                    </label>
                                </div>
                                <button disabled={!check1 || !check2} onClick={() => { setTermsAccepted(true); try{localStorage.setItem("raru_cyber_terms","1");}catch(e){} showToast("🚀 RARU NEXUS V11 Ativada!"); }} className={`w-full py-4 rounded-2xl font-display font-black text-xs uppercase tracking-[0.15em] transition shadow-2xl ${check1 && check2 ? 'cyber-button cursor-pointer shadow-[0_0_25px_rgba(255,153,0,0.6)]' : 'bg-commandPanel text-slate-500 cursor-not-allowed'}`}>
                                    CONCORDAR E INICIAR V11
                                </button>
                            </div>
                        </div>
                    )}

                    <header className="cyber-card sticky top-0 z-30 w-full max-w-2xl px-4 py-2.5 border-b border-cyberCyan/40 flex items-center justify-between shadow-lg rounded-b-xl">
                        <div className="flex items-center gap-2.5">
                            <div className={`w-9 h-9 rounded-xl cyber-border-glow flex items-center justify-center bg-void shadow-[0_0_15px_rgba(0,242,254,0.4)] overflow-hidden border border-cyberCyan p-0.5 ${isSpeaking ? 'animate-hud-pulse' : ''}`}>
                                <img src={SARAH_CUSTOM_AVATAR_URL} alt="Sara" className="w-full h-full object-cover rounded-lg animate-eye-glow" />
                            </div>
                            <div>
                                <h1 className="font-display text-[10px] sm:text-[11px] font-black text-white tracking-[0.05em]">RARU NEXUS V11</h1>
                                <p className="text-[8px] text-cyberCyan font-mono font-bold tracking-wider uppercase">
                                    {chameleonActive ? "🦎 CAMALEÃO ATIVO" : "Mesquita - RJ"}
                                </p>
                            </div>
                        </div>
                        <div className="flex items-center gap-1.5">
                            <button onClick={() => { setChameleonActive(!chameleonActive); if(!chameleonActive && soundEnabled) playChameleonSound(); }} className={`px-2 py-1 rounded-lg border text-[8px] font-bold cursor-pointer transition ${chameleonActive ? 'bg-cyan-500/25 border-cyan-400 text-cyan-300' : 'bg-cyberCyan/25 border-cyberCyan text-cyberCyan'}`}>🦎 Camaleão</button>
                            <button onClick={() => setSoundEnabled(!soundEnabled)} className={`w-9 h-9 rounded-xl border flex items-center justify-center cursor-pointer transition ${soundEnabled ? 'bg-cyberCyan/25 border-cyberCyan text-cyberCyan' : 'bg-commandPanel border-cyberCyan/30 text-slate-500'}`}>🔊</button>
                            <button onClick={toggleTheme} className="w-9 h-9 rounded-xl border border-cyberCyan/40 bg-commandPanel text-cyberCyan flex items-center justify-center cursor-pointer">🎨</button>
                            <button onClick={openShareFromApp} className="w-9 h-9 rounded-xl bg-commandPanel border border-cyberCyan/40 text-cyberCyan flex items-center justify-center cursor-pointer animate-share-blink" title="Compartilhar">🔗</button>
                            <button onClick={handleInstallApp} className={`w-9 h-9 rounded-xl border flex items-center justify-center cursor-pointer ${isInstallable ? 'bg-cyberCyan/25 border-cyberCyan text-cyberCyan animate-pulse' : 'border-cyberCyan/40 bg-commandPanel text-cyberCyan'}`}>📲</button>
                        </div>
                    </header>

                    <nav className="cyber-card w-full max-w-2xl border-b border-cyberCyan/30 px-3 py-2 flex items-center justify-center gap-1.5 overflow-x-auto z-20">
                        {NAV_TABS.map(tab => (
                            <button key={tab.id} onClick={() => handleNavClick(tab.id)} className={`px-3 py-1.5 rounded-xl text-[10px] font-black transition cursor-pointer flex items-center gap-1.5 shrink-0 tracking-wider ${activeTab === tab.id || (tab.id === 'cidadao-sensor' && activeTab === 'modulo2') || (tab.id === 'quem-somos' && quemSomosOpen) ? 'cyber-button font-black shadow-[0_0_20px_rgba(255,153,0,0.5)]' : 'bg-commandPanel text-slate-300 border border-cyberCyan/20'}`}>
                                {tab.iconComponent} {tab.label}
                            </button>
                        ))}
                    </nav>

                    <main className="flex-1 w-full max-w-2xl mx-auto p-3 sm:p-4 space-y-4 pb-28 relative z-10">
                        {activeTab === 'dashboard' && <CardIdentidadeVisualRARU openShareFromApp={openShareFromApp} openSarahChat={openSarahChat} handleWhoAmIClick={handleWhoAmIClick} setActiveTab={setActiveTab} marketingTitle={marketingTitle} marketingSubtitle={marketingSubtitle} />}
                        {activeTab === 'estacao' && <EstacaoSobrevivenciaModuleV11 showToast={showToast} />}
                        {activeTab === 'modulo1' && <ModuloElNinoModule onGoToDashboard={() => setActiveTab('dashboard')} />}
                        {activeTab === 'modulo2' && <ModuloCidadaoSensorModule onGoToDashboard={() => setActiveTab('dashboard')} showToast={showToast} />}
                        {activeTab === 'relatorio' && <VistoriaEPVCC_BlocosFuturistas onBackToDashboard={() => setActiveTab('dashboard')} showToast={showToast} />}
                        {activeTab === 'galeria' && <PublicVideoGallery localVideos={localVideos} onGoToDashboard={() => setActiveTab('dashboard')} />}
                        {activeTab === 'admin' && <AdminVaultModule localVideos={localVideos} setLocalVideos={setLocalVideos} marketingTitle={marketingTitle} setMarketingTitle={setMarketingTitle} marketingSubtitle={marketingSubtitle} setMarketingSubtitle={setMarketingSubtitle} showToast={showToast} onClose={() => setActiveTab('dashboard')} />}

                        <AutomatedObservatoryWidget />
                    </main>

                    {termsAccepted && <SarahFabButton onOpen={openSarahChat} />}
                    <NativeHydroWindRadar isOpen={radarOpen} onToggle={() => setRadarOpen(o => !o)} />
                    <SarahChatOverlay isOpen={isChatOpen} onClose={() => { setIsChatOpen(false); }} isSpeaking={isSpeaking} isProcessing={isProcessing} currentResponse={currentResponse} input={input} setInput={setInput} handleSendDirectCommand={handleSendDirectCommand} toggleListening={toggleListening} isListening={isListening} playOfficialSarahAudio={playOfficialSarahAudio} />
                    <QuemSomosModal isOpen={quemSomosOpen} onClose={() => setQuemSomosOpen(false)} />

                    <footer className="cyber-card fixed bottom-0 left-0 right-0 z-40 border-t border-cyberCyan/40 px-3 py-2.5 flex items-center justify-around shadow-xl backdrop-blur-2xl max-w-2xl mx-auto rounded-t-xl">
                        {NAV_TABS.map(tab => (
                            <button key={tab.id} onClick={() => handleNavClick(tab.id)} className={`flex flex-col items-center gap-0.5 cursor-pointer transition ${activeTab === tab.id ? 'text-cyberCyan scale-105' : 'text-slate-400 hover:text-white'}`}>
                                {tab.iconComponent}
                                <span className="text-[8px] font-black tracking-wider">{tab.label}</span>
                            </button>
                        ))}
                    </footer>
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
