​const utterance = new SpeechSynthesisUtterance(cleanText);
utterance.lang = "pt-BR";
​const prof = customProfile || globalVoiceProfile;
if (prof === 'humana') {
utterance.rate = 1.0;

} catch(e) {}

​function playChameleonSound() {
try {
const AudioCtx = window.AudioContext || window.webkitAudioContext;
if (!AudioCtx) return;
const ctx = new AudioCtx();
if (ctx.state === 'suspended') ctx.resume();
const bufferSize = ctx.sampleRate * 1.2;
const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
const data = buffer.getChannelData(0);
for (let i = 0; i < bufferSize; i++) { data[i] = (Math.random() * 2 - 1) * Math.sin(i / 800); }
const noiseSource = ctx.createBufferSource();
noiseSource.buffer = buffer;
const filter = ctx.createBiquadFilter();
filter.type = 'lowpass';
filter.frequency.setValueAtTime(350, ctx.currentTime);
filter.frequency.exponentialRampToValueAtTime(120, ctx.currentTime + 1.2);
const gainNode = ctx.createGain();
gainNode.gain.setValueAtTime(0.8, ctx.currentTime);
gainNode.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 1.2);
noiseSource.connect(filter); filter.connect(gainNode); gainNode.connect(ctx.destination);
noiseSource.start();
} catch (e) {}
}

return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, '0')).join('');
};

​function AdminVaultModule({ showToast, onClose, localVideos, setLocalVideos }) {
const [pinInput, setPinInput] = React.useState("");
const [isUnlocked, setIsUnlocked] = React.useState(false);
​const [tipoAlarme, setTipoAlarme] = React.useState('CEMADEN');
const [statusDual, setStatusDual] = React.useState('PRONTO');
const [timerDualText, setTimerDualText] = React.useState('00:00');
const dualAudioRef = React.useRef({ ctx: null, osc: null, gain: null, sireneInt: null, timerInt: null, seg: 0, etapa: 0 });
​const handleUnlock = (e) => {
e.preventDefault();
if (pinInput === "303500") { setIsUnlocked(true); showToast("Acesso Autorizado!"); } else { showToast("PIN Incorreto."); }
};
​const initDualAudio = () => {
const d = dualAudioRef.current;
if(!d.ctx) d.ctx = new (window.AudioContext || window.webkitAudioContext)();
if(d.ctx.state === 'suspended') d.ctx.resume();
};
​const pararDualAudio = () => {
const d = dualAudioRef.current;
if(d.sireneInt) clearInterval(d.sireneInt);
if(d.timerInt) clearInterval(d.timerInt);
if(d.osc) try { d.osc.stop(); } catch(e) {}
d.osc = null;
setStatusDual('SISTEMA PARADO');
setTimerDualText('00:00');
};
​const ativarAlarmeDual = () => {
initDualAudio();
pararDualAudio();
const d = dualAudioRef.current;
d.etapa = 0;
d.seg = 180;
​if (tipoAlarme === 'RUSSO') {
setStatusDual('RUSSO TOCANDO - 3 MIN');
let freq = 400, subindo = true;
d.osc = d.ctx.createOscillator();
d.gain = d.ctx.createGain();
d.osc.type = 'sawtooth';
d.osc.frequency.value = freq;
d.gain.gain.value = 0.45;
d.osc.connect(d.gain);
d.gain.connect(d.ctx.destination);
d.osc.start();
d.sireneInt = setInterval(() => {
if (subindo) { freq += 12; if (freq >= 900) subindo = false; }
else { freq -= 12; if (freq <= 400) subindo = true; }
if (d.osc) d.osc.frequency.setValueAtTime(freq, d.ctx.currentTime);
}, 40);
} else {
setStatusDual('CEMADEN TOCANDO - 3 MIN');
let tocando = true, t = 0;
d.osc = d.ctx.createOscillator();
d.gain = d.ctx.createGain();
d.osc.type = 'sine';
d.osc.frequency.value = 850;
d.gain.gain.value = 0;
d.osc.connect(d.gain);
d.gain.connect(d.ctx.destination);
d.osc.start();
d.sireneInt = setInterval(() => {
t += 0.1;
if (tocando) {
d.gain.gain.setValueAtTime(0.5, d.ctx.currentTime);
if (t >= 5) { tocando = false; t = 0; d.gain.gain.setValueAtTime(0, d.ctx.currentTime); }
} else {
if (t >= 1) { tocando = true; t = 0; }
}
}, 100);
}
​d.timerInt = setInterval(() => {
d.seg--;
const m = String(Math.floor(d.seg / 60)).padStart(2, '0');
const s = String(d.seg % 60).padStart(2, '0');
setTimerDualText(m + ":" + s + " - ETAPA " + (d.etapa + 1) + "/3");
​if (d.seg <= 0) {
d.etapa++;
if (d.etapa === 1) {
clearInterval(d.sireneInt);
if (d.gain) d.gain.gain.setValueAtTime(0, d.ctx.currentTime);
if (d.osc && tipoAlarme === 'RUSSO') try { d.osc.stop(); } catch(e) {}
d.osc = null;
d.seg = 60;
setStatusDual('1 MIN PAUSA');
} else if (d.etapa === 2) {
d.seg = 60;
setStatusDual('CICLO FINAL - 1 MIN');
initDualAudio();
} else {
pararDualAudio();
setStatusDual('CONCLUÍDO');
}
}
}, 1000);
};

<SarahChatOverlay isOpen="{isChatOpen}" onClose="{()"> setIsChatOpen(false)} isSpeaking={isSpeaking} isProcessing={isProcessing} messages={messages} input={input} setInput={setInput} handleSendDirectCommand={handleSendDirectCommand} toggleListening={toggleListening} isListening={isListening} />
<QuemSomosModal isOpen="{quemSomosOpen}" onClose="{()"> setQuemSomosOpen(false)} />
​<footer className="cyber-card fixed bottom-0 left-0 right-0 z-40 border-t border-cyberCyan/40 px-2.5 py-3 flex items-center justify-around gap-1 shadow-2xl backdrop-blur-2xl max-w-[1320px] mx-auto rounded-t-3xl pb-[env(safe-area-inset-bottom)]">
{NAV_TABS.map(tab => (
<button key={tab.id} onClick={() => handleNavClick(tab.id)} className={"flex flex-col items-center justify-center gap-1 cursor-pointer flex-1 py-2 transition touch-manipulation rounded-2xl " + (activeTab === tab.id ? 'text-cyberCyan bg-cyberCyan/15 border border-cyberCyan/40 shadow-[0_0_12px_rgba(0,242,254,0.4)]' : 'text-slate-400 hover:text-white border border-transparent')}>
{tab.iconComponent}
<span className="text-[8px] sm:text-[9px] font-black truncate w-full text-center tracking-tighter px-0.5">{tab.label}</span>
</button>
))}
</footer>
</div>
);
}
