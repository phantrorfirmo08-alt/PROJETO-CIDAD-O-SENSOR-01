<!DOCTYPE html>
<html lang="pt-BR" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#020617">
  <meta name="description" content="SARAH AI Core — Defesa Civil Comunitária e monitoramento preventivo">
  <title>SARAH AI Core v4.6</title>

  <link rel="manifest" href="./manifest.json">

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            brand: {
              dark: "#020617",
              cyan: "#06b6d4"
            }
          }
        }
      }
    };
  </script>

  <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    crossorigin=""
  >
  <script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    crossorigin=""
  ></script>

  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body,
    #root {
      min-height: 100%;
      margin: 0;
    }

    body {
      background: #020617;
      font-family:
        Inter,
        ui-sans-serif,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
    }

    button,
    input,
    textarea {
      font: inherit;
    }

    ::-webkit-scrollbar {
      width: 8px;
      height: 8px;
    }

    ::-webkit-scrollbar-track {
      background: #020617;
    }

    ::-webkit-scrollbar-thumb {
      background: #155e75;
      border-radius: 999px;
    }

    .sarah-avatar {
      width: 58px;
      height: 58px;
      position: relative;
      overflow: hidden;
      border: 1px solid rgba(34, 211, 238, 0.55);
      border-radius: 18px;
      background:
        radial-gradient(circle at 50% 35%, rgba(34, 211, 238, 0.3), transparent 38%),
        linear-gradient(145deg, #0f172a, #082f49);
      box-shadow:
        0 0 18px rgba(6, 182, 212, 0.25),
        inset 0 0 18px rgba(34, 211, 238, 0.12);
    }

    .sarah-head {
      position: absolute;
      left: 50%;
      top: 9px;
      width: 31px;
      height: 34px;
      transform: translateX(-50%);
      border: 1px solid #67e8f9;
      border-radius: 48% 48% 44% 44%;
      background: linear-gradient(160deg, #164e63, #0e7490);
      box-shadow: 0 0 12px rgba(34, 211, 238, 0.45);
    }

    .sarah-shoulders {
      position: absolute;
      left: 50%;
      bottom: -8px;
      width: 52px;
      height: 28px;
      transform: translateX(-50%);
      border: 1px solid #22d3ee;
      border-radius: 50% 50% 0 0;
      background: linear-gradient(180deg, #155e75, #082f49);
    }

    .sarah-eye {
      position: absolute;
      top: 13px;
      width: 4px;
      height: 4px;
      border-radius: 50%;
      background: #cffafe;
      box-shadow: 0 0 6px #67e8f9;
      animation: sarahBlink 4.5s infinite;
    }

    .sarah-eye.left {
      left: 8px;
    }

    .sarah-eye.right {
      right: 8px;
    }

    .sarah-mouth {
      position: absolute;
      left: 50%;
      bottom: 7px;
      width: 8px;
      height: 3px;
      transform: translateX(-50%);
      border-radius: 50%;
      background: #a5f3fc;
      box-shadow: 0 0 5px #22d3ee;
    }

    .sarah-avatar.speaking .sarah-mouth {
      animation: sarahTalk 0.22s infinite alternate ease-in-out;
    }

    @keyframes sarahBlink {
      0%,
      92%,
      100% {
        transform: scaleY(1);
      }

      95% {
        transform: scaleY(0.12);
      }
    }

    @keyframes sarahTalk {
      from {
        width: 5px;
        height: 2px;
        border-radius: 50%;
      }

      to {
        width: 11px;
        height: 7px;
        border-radius: 45%;
      }
    }

    .sarah-avatar.listening {
      animation: sarahListening 1s infinite alternate ease-in-out;
    }

    @keyframes sarahListening {
      from {
        box-shadow: 0 0 12px rgba(34, 211, 238, 0.25);
      }

      to {
        box-shadow: 0 0 26px rgba(34, 211, 238, 0.8);
      }
    }
  </style>
</head>

<body class="min-h-screen bg-slate-950 text-slate-100">
  <div id="root"></div>

  <script type="text/babel">
    const {
      useEffect,
      useRef,
      useState
    } = React;

    function App() {
      const [userName, setUserName] = useState("Alexander");
      const [darkMode, setDarkMode] = useState(true);
      const [fontSizeLevel, setFontSizeLevel] = useState(1);
      const [soundEnabled, setSoundEnabled] = useState(true);
      const [isSpeaking, setIsSpeaking] = useState(false);
      const [isListening, setIsListening] = useState(false);
      const [isLoadingChat, setIsLoadingChat] = useState(false);

      const [input, setInput] = useState("");
      const [liveWeather, setLiveWeather] = useState(null);
      const [deferredPrompt, setDeferredPrompt] = useState(null);

      const [mapOpen, setMapOpen] = useState(false);
      const [chartOpen, setChartOpen] = useState(false);
      const [termsOpen, setTermsOpen] = useState(false);

      const [messages, setMessages] = useState([
        {
          id: "welcome",
          sender: "sarah",
          text:
            "Olá. Eu sou a Sara, assistente da SARAH AI Core. Estou conectada ao monitoramento preventivo da Bacia do Rio Sarapuí, em Mesquita. Como posso ajudar?",
          timestamp: new Date().toLocaleTimeString("pt-BR", {
            hour: "2-digit",
            minute: "2-digit"
          })
        }
      ]);

      const mapRef = useRef(null);
      const mapInstanceRef = useRef(null);
      const chartRef = useRef(null);
      const chartInstanceRef = useRef(null);
      const recognitionRef = useRef(null);

      useEffect(() => {
        const handleBeforeInstall = (event) => {
          event.preventDefault();
          setDeferredPrompt(event);
        };

        window.addEventListener("beforeinstallprompt", handleBeforeInstall);

        return () => {
          window.removeEventListener(
            "beforeinstallprompt",
            handleBeforeInstall
          );
        };
      }, []);

      useEffect(() => {
        document.documentElement.classList.toggle("dark", darkMode);
        document.documentElement.classList.toggle("light", !darkMode);
      }, [darkMode]);

      useEffect(() => {
        fetch(
          "https://api.open-meteo.com/v1/forecast" +
          "?latitude=-22.7845" +
          "&longitude=-43.4140" +
          "&current=temperature_2m,relative_humidity_2m,precipitation,weather_code" +
          "&hourly=precipitation_probability" +
          "&forecast_days=1" +
          "&timezone=America%2FSao_Paulo"
        )
          .then((response) => {
            if (!response.ok) {
              throw new Error("Falha ao consultar o clima");
            }

            return response.json();
          })
          .then((data) => {
            if (data && data.current) {
              setLiveWeather(data);
            }
          })
          .catch((error) => {
            console.warn("Clima indisponível:", error);
          });
      }, []);

      useEffect(() => {
        if (!mapOpen || !mapRef.current || mapInstanceRef.current) {
          if (mapOpen && mapInstanceRef.current) {
            setTimeout(() => {
              mapInstanceRef.current.invalidateSize();
            }, 100);
          }

          return;
        }

        const latitude = -22.7845;
        const longitude = -43.4140;

        const map = L.map(mapRef.current).setView(
          [latitude, longitude],
          16
        );

        L.tileLayer(
          "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
          {
            maxZoom: 19,
            attribution: "© OpenStreetMap contributors"
          }
        ).addTo(map);

        L.marker([latitude, longitude])
          .addTo(map)
          .bindPopup(
            "<b>Setor de monitoramento</b><br>Rocha Sobrinho / Sebinho — Mesquita"
          )
          .openPopup();

        mapInstanceRef.current = map;
      }, [mapOpen]);

      useEffect(() => {
        if (!chartOpen || !chartRef.current) {
          return;
        }

        if (chartInstanceRef.current) {
          chartInstanceRef.current.destroy();
        }

        const precipitation =
          liveWeather?.current?.precipitation || 0;

        chartInstanceRef.current = new Chart(
          chartRef.current.getContext("2d"),
          {
            type: "line",
            data: {
              labels: [
                "00:00",
                "03:00",
                "06:00",
                "09:00",
                "12:00",
                "15:00",
                "18:00",
                "Atual"
              ],
              datasets: [
                {
                  label: "Cota estimada do Rio Sarapuí (m)",
                  data: [
                    0.8,
                    0.9,
                    0.85,
                    0.92,
                    1.1,
                    1.0,
                    0.95,
                    0.9 + precipitation * 0.2
                  ],
                  borderColor: "#22d3ee",
                  backgroundColor: "rgba(34, 211, 238, 0.12)",
                  borderWidth: 2,
                  fill: true,
                  tension: 0.35,
                  pointRadius: 3,
                  pointBackgroundColor: "#67e8f9"
                }
              ]
            },
            options: {
              responsive: true,
              maintainAspectRatio: false,
              scales: {
                y: {
                  beginAtZero: true,
                  max: 4,
                  grid: {
                    color: "rgba(148, 163, 184, 0.12)"
                  },
                  ticks: {
                    color: "#94a3b8"
                  }
                },
                x: {
                  grid: {
                    color: "rgba(148, 163, 184, 0.12)"
                  },
                  ticks: {
                    color: "#94a3b8"
                  }
                }
              },
              plugins: {
                legend: {
                  labels: {
                    color: "#e2e8f0"
                  }
                }
              }
            }
          }
        );

        return () => {
          if (chartInstanceRef.current) {
            chartInstanceRef.current.destroy();
            chartInstanceRef.current = null;
          }
        };
      }, [chartOpen, liveWeather]);

      const speakText = (text) => {
        if (
          !soundEnabled ||
          !("speechSynthesis" in window)
        ) {
          return;
        }

        window.speechSynthesis.cancel();

        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = "pt-BR";
        utterance.rate = 1;
        utterance.pitch = 1;

        utterance.onstart = () => {
          setIsSpeaking(true);
        };

        utterance.onend = () => {
          setIsSpeaking(false);
        };

        utterance.onerror = () => {
          setIsSpeaking(false);
        };

        window.speechSynthesis.speak(utterance);
      };

      const stopSpeaking = () => {
        if ("speechSynthesis" in window) {
          window.speechSynthesis.cancel();
        }
        setIsSpeaking(false);
      };

      const toggleListening = () => {
        const SpeechRecognition =
          window.SpeechRecognition ||
          window.webkitSpeechRecognition;

        if (!SpeechRecognition) {
          alert(
            "Seu navegador não oferece reconhecimento de voz."
          );
          return;
        }

        if (isListening && recognitionRef.current) {
          recognitionRef.current.stop();
          setIsListening(false);
          return;
        }

        const recognition = new SpeechRecognition();

        recognition.lang = "pt-BR";
        recognition.continuous = false;
        recognition.interimResults = false;

        recognition.onstart = () => {
          setIsListening(true);
        };

        recognition.onresult = (event) => {
          const transcript =
            event.results?.[0]?.[0]?.transcript || "";

          setInput(transcript);
          setIsListening(false);

          if (transcript.trim()) {
            handleSendMessage(transcript);
          }
        };

        recognition.onerror = () => {
          setIsListening(false);
        };

        recognition.onend = () => {
          setIsListening(false);
          recognitionRef.current = null;
        };

        recognitionRef.current = recognition;
        recognition.start();
      };

      const calcularNivelRio = (precipitacao) => {
        const chuva = Number(precipitacao) || 0;

        if (chuva >= 30) {
          return "crítico";
        }

        if (chuva >= 15) {
          return "atenção";
        }

        return "normal";
      };

      const handleSendMessage = async (textCustom) => {
        const textToSend =
          textCustom !== undefined ? textCustom : input;

        if (!textToSend.trim() || isLoadingChat) {
          return;
        }

        const cleanText = textToSend.trim();

        const userMessage = {
          id: `user-${Date.now()}`,
          sender: "user",
          text: cleanText,
          timestamp: new Date().toLocaleTimeString("pt-BR", {
            hour: "2-digit",
            minute: "2-digit"
          })
        };

        setMessages((previous) => [
          ...previous,
          userMessage
        ]);

        if (textCustom === undefined) {
          setInput("");
        }

        setIsLoadingChat(true);

        const currentWeather = liveWeather?.current;
        const precipitation =
          currentWeather?.precipitation || 0;

        const weatherContext = currentWeather
          ? {
              temperatura: currentWeather.temperature_2m,
              umidade: currentWeather.relative_humidity_2m,
              precipitacao: precipitation,
              codigo_tempo: currentWeather.weather_code
            }
          : null;

        try {
          const response = await fetch("/api/sarah", {
            method: "POST",
            headers: {
              "Content-Type": "application/json"
            },
            body: JSON.stringify({
              mensagem: cleanText,
              nome_usuario: userName,
              nivel_rio: calcularNivelRio(precipitation),
              clima: weatherContext,
              local: {
                cidade: "Mesquita",
                estado: "RJ",
                area: "Sebinho / Rocha Sobrinho",
                latitude: -22.7845,
                longitude: -43.4140
              }
            })
          });

          const data = await response.json();

          if (!response.ok) {
            throw new Error(
              data?.erro ||
              data?.error ||
              `Erro HTTP ${response.status}`
            );
          }

          const reply =
            data?.alerta ||
            data?.resposta ||
            data?.message ||
            data?.choices?.[0]?.message?.content ||
            "Não recebi uma resposta válida do núcleo SARAH.";

          const sarahMessage = {
            id: `sarah-${Date.now()}`,
            sender: "sarah",
            text: reply,
            timestamp: new Date().toLocaleTimeString(
              "pt-BR",
              {
                hour: "2-digit",
                minute: "2-digit"
              }
            )
          };

          setMessages((previous) => [
            ...previous,
            sarahMessage
          ]);

          speakText(reply);
        } catch (error) {
          console.error("Erro em /api/sarah:", error);

          setMessages((previous) => [
            ...previous,
            {
              id: `error-${Date.now()}`,
              sender: "sarah",
              text:
                "Não foi possível conectar ao núcleo SARAH agora. " +
                error.message,
              timestamp: new Date().toLocaleTimeString(
                "pt-BR",
                {
                  hour: "2-digit",
                  minute: "2-digit"
                }
              )
            }
          ]);
        } finally {
          setIsLoadingChat(false);
        }
      };

      const handleInstallApp = async () => {
        if (!deferredPrompt) {
          alert(
            "Use o menu do navegador e escolha " +
            "'Adicionar à tela inicial' ou 'Instalar aplicativo'."
          );
          return;
        }

        deferredPrompt.prompt();
        await deferredPrompt.userChoice;
        setDeferredPrompt(null);
      };

      const handleShareLink = async () => {
        const shareData = {
          title: "SARAH AI Core",
          text:
            "Monitoramento preventivo da Bacia do Rio Sarapuí.",
          url: window.location.href
        };

        try {
          if (navigator.share) {
            await navigator.share(shareData);
          } else {
            await navigator.clipboard.writeText(
              window.location.href
            );
            alert("Link copiado.");
          }
        } catch (error) {
          console.warn("Compartilhamento cancelado.", error);
        }
      };

      const getFontSizeClass = () => {
        const sizes = [
          "text-xs",
          "text-sm",
          "text-base",
          "text-lg"
        ];

        return sizes[fontSizeLevel] || "text-sm";
      };

      const weather = liveWeather?.current;

      return (
        <div
          className={
            `${darkMode ? "bg-slate-950 text-slate-100" : "bg-slate-100 text-slate-900"} ` +
            `${getFontSizeClass()} min-h-screen transition-colors`
          }
        >
          <header className="sticky top-0 z-50 border-b border-cyan-500/30 bg-slate-900/95 px-3 py-3 shadow-lg backdrop-blur-md">
            <div className="mx-auto flex max-w-4xl flex-wrap items-center justify-between gap-3">
              <div className="flex items-center gap-3">
                <div
                  className={
                    `sarah-avatar ${isSpeaking ? "speaking" : ""} ` +
                    `${isListening ? "listening" : ""}`
                  }
                  title="Sara — assistente ativa"
                >
                  <div className="sarah-head">
                    <span className="sarah-eye left"></span>
                    <span className="sarah-eye right"></span>
                    <span className="sarah-mouth"></span>
                  </div>
                  <div className="sarah-shoulders"></div>
                </div>

                <div>
                  <div className="font-mono text-sm font-black text-cyan-300">
                    SARAH AI CORE
                  </div>
                  <div className="text-[10px] text-slate-400">
                    Defesa Civil Comunitária
                  </div>
                </div>
              </div>

              <div className="flex flex-wrap items-center gap-1.5">
                <button
                  onClick={() => setDarkMode((value) => !value)}
                  className="rounded border border-slate-700 bg-slate-800 px-2.5 py-1.5 text-xs text-amber-300"
                >
                  {darkMode ? "☀️ Dia" : "🌙 Noite"}
                </button>

                <div className="flex overflow-hidden rounded border border-slate-700 bg-slate-800">
                  <button
                    onClick={() =>
                      setFontSizeLevel((value) =>
                        Math.max(0, value - 1)
                      )
                    }
                    className="px-2 py-1.5 text-x
