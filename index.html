        function playChameleonSound() {
            try {
                const AudioCtx = window.AudioContext || window.webkitAudioContext;
                if (!AudioCtx) return;
                const ctx = new AudioCtx();
                if (ctx.state === 'suspended') ctx.resume();
                const bufferSize = ctx.sampleRate * 1.2;
                const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
                const data = buffer.getChannelData(0);
                for (let i = 0; i < bufferSize; i++) { data[i] = (Math.random() * 2 - 1) * Math.sin(i / 800); }
                const noiseSource = ctx.createBufferSource();
                noiseSource.buffer = buffer;
                const filter = ctx.createBiquadFilter();
                filter.type = 'lowpass';
                filter.frequency.setValueAtTime(350, ctx.currentTime);
                filter.frequency.exponentialRampToValueAtTime(120, ctx.currentTime + 1.2);
                const gainNode = ctx.createGain();
                gainNode.gain.setValueAtTime(0.8, ctx.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 1.2);
                noiseSource.connect(filter); filter.connect(gainNode); gainNode.connect(ctx.destination);
                noiseSource.start();
            } catch (e) {}
        }

        // MOTOR DE CANVAS COM EXPRESSÃO FACIAL E LIP-SYNC DA SARA
        function SaraAvatarCanvas({ isSpeaking, volOverride = 0 }) {
            const canvasRef = useRef(null);
            useEffect(() => {
                const canvas = canvasRef.current;
                if (!canvas) return;
                const ctx = canvas.getContext('2d');
                let mouthOpen = 0, targetMouth = 0, eyeClose = 0, blinkTimer = 0, pupilX = 0, pupilY = 0, animId;

                const drawFace = () => {
                    ctx.clearRect(0, 0, 360, 360);
                    let g = ctx.createRadialGradient(180, 180, 20, 180, 180, 200);
                    g.addColorStop(0, '#08203a'); g.addColorStop(1, '#000');
                    ctx.fillStyle = g; ctx.fillRect(0, 0, 360, 360);
                    
                    ctx.fillStyle = '#0a2444'; ctx.beginPath();
                    ctx.ellipse(180, 170, 90, 115, 0, 0, Math.PI * 2);
                    ctx.fill();

                    ctx.strokeStyle = '#00F2FE33'; ctx.lineWidth = 1;
                    for (let i = 0; i < 8; i++) {
                        ctx.beginPath();
                        ctx.moveTo(130 + i * 15, 90 + i * 12);
                        ctx.lineTo(180, 170);
                        ctx.stroke();
                    }

                    blinkTimer += 0.02;
                    if (blinkTimer > 4 + Math.random() * 3) { eyeClose = 1; blinkTimer = 0; }
                    if (eyeClose > 0) { eyeClose -= 0.15; if (eyeClose < 0) eyeClose = 0; }
                    let eyeOpen = Math.max(0, 1 - eyeClose * 4);
                    let eyeY = 140;

                    [130, 230].forEach((ex) => {
                        ctx.fillStyle = '#001a0a'; ctx.beginPath();
                        ctx.ellipse(ex, eyeY, 28, 16 * eyeOpen, 0, 0, Math.PI * 2);
                        ctx.fill();
                        if (eyeOpen > 0.2) {
                            ctx.fillStyle = 'rgba(0,255,100,0.9)'; ctx.beginPath();
                            ctx.arc(ex + pupilX, eyeY + pupilY, 14, 0, Math.PI * 2);
                            ctx.fill();
                            ctx.fillStyle = '#00ff88'; ctx.beginPath();
                            ctx.arc(ex + pupilX * 1.5, eyeY + pupilY, 6, 0, Math.PI * 2);
                            ctx.fill();
                            ctx.fillStyle = '#000'; ctx.beginPath();
                            ctx.arc(ex + pupilX * 2, eyeY + pupilY, 3, 0, Math.PI * 2);
                            ctx.fill();
                        }
                        ctx.strokeStyle = '#00F2FE'; ctx.lineWidth = 1; ctx.stroke();
                    });

                    ctx.strokeStyle = '#00F2FE66'; ctx.beginPath();
                    ctx.moveTo(180, 160); ctx.lineTo(172, 190); ctx.lineTo(188, 190); ctx.stroke();

                    targetMouth = isSpeaking ? (0.3 + Math.random() * 0.5) : 0;
                    mouthOpen += (targetMouth - mouthOpen) * 0.3;
                    let mx = 180, my = 235, mw = 40 + volOverride * 10, mh = 3 + mouthOpen * 25;

                    ctx.strokeStyle = '#00F2FE'; ctx.lineWidth = 1.5;
                    ctx.beginPath(); ctx.moveTo(mx - mw, my);
                    ctx.quadraticCurveTo(mx, my - mh, mx + mw, my);
                    ctx.stroke();

                    animId = requestAnimationFrame(drawFace);
                };
                drawFace();
                return () => cancelAnimationFrame(animId);
            }, [isSpeaking, volOverride]);

            const [demandasState, setDemandasState] = useState(
                DEMANDAS_13.reduce((acc, d) => ({ ...acc, [d]: false }), {})
            );

            const gpsStrFmt = gps.lt ? `${gps.lt},${gps.ln}` : "Rocha Sobrinho/Mesquita-RJ";

            const capturarGps = () => {
                if (!navigator.geolocation) { showToast("⚠️ Geolocalização não suportada"); return; }
                showToast("🛰 Buscando GPS...");
                navigator.geolocation.getCurrentPosition(
                    (p) => {
                        const lt = p.coords.latitude.toFixed(6);
                        const ln = p.coords.longitude.toFixed(6);
                        setGps({ lt, ln });
                        setGpsSt("Fixado");
                        showToast("📍 Coordenadas obtidas!");
                    },
                    () => { setGpsSt("Erro"); showToast("⚠ Erro ao obter GPS"); },
                    { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
                );
            };

            const ligarCamera = async () => {
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: 'environment' } }, audio: false });
                    if (videoRef.current) { videoRef.current.srcObject = stream; showToast("📷 Câmera Ativada!"); }
                } catch (e) { showToast("⚠️ Erro ao acessar a câmera."); }
            };

            const desligarCamera = () => {
                if (videoRef.current && videoRef.current.srcObject) {
                    videoRef.current.srcObject.getTracks().forEach(t => t.stop());
                    videoRef.current.srcObject = null;
                }
            };

            useEffect(() => {
                ligarCamera();
                return () => { desligarCamera(); };
            }, []);

            const comprimirFoto = (videoEl, maxW = 800, q = 0.45) => {
                const c = canvasCompRef.current;
                const ctx = c.getContext('2d');
                let w = videoEl.videoWidth || 640;
                let h = videoEl.videoHeight || 480;
                if (w > maxW) { h = (maxW / w) * h; w = maxW; }
                c.width = w; c.height = h;
                ctx.drawImage(videoEl, 0, 0, w, h);
                return c.toDataURL('image/jpeg', q);
            };

            const capturar = (i) => {
                const video = videoRef.current;
                const ca = canvasRef.current;
                if (!video || !ca || !video.srcObject) { ligarCamera(); showToast("⚠️ Câmera reconectando..."); return; }
                const ctx = ca.getContext('2d');
                ca.width = video.videoWidth || 640; ca.height = video.videoHeight || 480;
                ctx.drawImage(video, 0, 0);

                const agora = new Date().toLocaleString('pt-BR');
                ctx.fillStyle = 'rgba(0,0,0,0.7)'; ctx.fillRect(0, ca.height - 50, ca.width, 50);
                ctx.fillStyle = '#fff'; ctx.font = '10px monospace';
                ctx.fillText(agora + ' ' + (gps.lt ? `${gps.lt},${gps.ln}` : 'Local Padrão'), 5, ca.height - 10);

                let leve = comprimirFoto(ca, 800, 0.45);
                const n = [...fotos]; n[i] = leve; setFotos(n);
                showToast(`📸 Foto 0${i + 1} capturada!`);
            };

            const apagarFoto = (i, e) => {
                e.stopPropagation();
                const n = [...fotos]; n[i] = null; setFotos(n);
                showToast("🗑️ Foto removida.");
            };

            const getDemandasTxt = () => {
                const selList = DEMANDAS_13.filter(d => demandasState[d]);
                return selList.length ? selList.join(', ') : 'Nenhuma';
            };

            const montarLaudo = () => {
                return `LAUDO RARU NEXUS\n${municipio} | ${gpsStrFmt}\nVISITA: ${setor}\nEQUIPE: ${equipe}\nDEMANDAS: ${getDemandasTxt()}\nOBS: ${obs || 'Sem observações'}\n${gps.lt ? `https://maps.google.com/?q=${gps.lt},${gps.ln}` : ''}`;
            };

            const gerarPdf = () => {
                showToast("📄 Gerando PDF leve...");
                try {
                    let J = window.jspdf ? window.jspdf.jsPDF : null;
                    if (!J && window.jsPDF) J = window.jsPDF;
                    const doc = new J({ compress: true });
                    let y = 15;
                    doc.setFontSize(10);
                    doc.text(montarLaudo(), 12, y);
                    y += 65;
                    fotos.filter(Boolean).forEach(img => {
                        if (y > 240) { doc.addPage(); y = 15; }
                        try { doc.addImage(img, 'JPEG', 12, y, 50, 35, undefined, 'FAST'); y += 40; } catch (err) {}
                    });
                    doc.save('RARU_LEVE.pdf');
                    showToast("✅ PDF gerado!");
                } catch (e) { showToast("❌ Erro ao gerar PDF."); }
            };

            const shareZap = async () => {
                let txt = montarLaudo();
                let foto = fotos.find(Boolean);
                if (foto && navigator.canShare) {
                    try {
                        let r = await fetch(foto);
                        let b = await r.blob();
                        let f = new File([b], 'foto.jpg', { type: 'image/jpeg' });
                        if (navigator.canShare({ files: [f] })) {
                            await navigator.share({ files: [f], text: txt, title: 'RARU' });
                            return;
                        }
                    } catch (err) {}
                }
                window.open('https://wa.me/?text=' + encodeURIComponent(txt), '_blank');
            };

            return (
                <div className="max-w-xl mx-auto space-y-3 cyber-card p-4 sm:p-5 rounded-[28px] border border-cyberCyan/40 shadow-2xl font-mono text-xs">

                    </div>

                    <div className="space-y-2">
                        <div>
                            <label className="text-[10px] text-cyberCyan font-bold uppercase">Setor / Órgão Oficial</label>
                            <select value={setor} onChange={e => setSetor(e.target.value)} className="w-full bg-zinc-900 border border-cyan-400/40 rounded p-2 text-xs text-white mt-1">
                                {SETORES_FIXO_OFICIAL.map(s => <option key={s} value={s}>{s}</option>)}
                            </select>
                        </div>

                        <div>
                            <label className="text-[10px] text-cyberCyan font-bold uppercase">Equipe / Coletivo</label>
                            <input value={equipe} onChange={e => setEquipe(e.target.value)} className="w-full bg-zinc-900 border border-cyan-400/40 rounded p-2 text-xs text-white mt-1" />
                        </div>

                        <div>
                            <label className="text-[10px] text-cyberCyan font-bold uppercase">Município - RJ</label>
                            <select value={municipio} onChange={e => setMunicipio(e.target.value)} className="w-full bg-zinc-900 border border-cyan-400/40 rounded p-2 text-xs text-white mt-1">
                                {MUNICIPIOS_92.map(m => <option key={m} value={m}>{m} - RJ</option>)}
                            </select>
                        </div>

                        <button onClick={capturarGps} className="bg-cyan-400 text-black px-3 py-2 rounded text-xs mt-1 font-bold cursor-pointer flex items-center justify-center gap-2 w-full">
                            <span>🛰️ GPS: <span id="gpsSt" className="underline">{gpsSt}</span></span>
                            <span id="gpsTxt">{gps.lt ? `${gps.lt},${gps.ln}` : ''}</span>
                        </button>

                        <div className="bg-zinc-950 p-2 rounded border border-cyan-400/30 space-y-2">
                            <span className="text-[10px] font-bold text-cyan-400 block">Câmera Oficial RARU</span>
                            <video ref={videoRef} autoPlay playsInline muted className="w-full h-48 bg-black rounded border border-cyan-400/20 object-cover"></video>
                            <canvas ref={canvasRef} style={{ display: 'none' }}></canvas>
                            <canvas ref={canvasCompRef} style={{ display: 'none' }}></canvas>

                            <div className="grid grid-cols-2 gap-2">
                                {[0, 1, 2, 3].map(i => (
                                    <div key={i} onClick={() => capturar(i)} className="h-24 bg-zinc-900 border border-cyan-400/30 rounded relative overflow-hidden cursor-pointer hover:border-cyan-400 transition">
                                        <div id={`ph${i}`} className={`w-full h-full grid place-items-center text-cyan-400 text-xs ${fotos[i] ? 'hidden' : ''}`}>FOTO {i + 1}</div>
                                        <img id={`img${i}`} src={fotos[i] || ''} className={`w-full h-full object-cover ${fotos[i] ? '' : 'hidden'}`} alt={`Foto ${i+1}`} />
                                        {fotos[i] && (
                                            <button onClick={(e) => apagarFoto(i, e)} className="absolute top-1 right-1 bg-rose-500 text-white w-5 h-5 rounded-full text-[10px] font-bold flex items-center justify-center z-20">✕</button>
                                        )}
                                        <div className="absolute bottom-1 left-1 right-1 bg-black/80 rounded text-[7px] text-cyan-400 p-1 flex justify-between">
                                            <span>LEVE</span>
                                            <span id={`lb${i}`}>{fotos[i] ? '80KB OK' : 'AGUARDA'}</span>
                                        </div>
                                    </div>
                                ))}
                            </div>
                        </div>

                        <div>
                            <label className="text-[10px] text-cyan-400 font-bold uppercase block mb-1">Demandas / Ocorrências (13 Temas c/ Voçoroca)</label>
                            <div className="grid grid-cols-2 gap-1 text-xs">
                                {DEMANDAS_13.map((d) => (

                    showToast("🔓 Área Restrita Liberada!");
                } else {
                    showToast("❌ PIN Incorreto (Tente 303500)");
                }
            };

            useEffect(() => {
                const interval = setInterval(() => {
                    const manifestData = { title: "RARU NEXUS AI", text: shareMessageText, url: APP_SHARE_URL };
                    if (navigator.share) { navigator.share(manifestData).catch(() => {}); }
                    showToast("🔗 Compartilhamento automático (Aviso de 2 min)");
                }, 120000);
                return () => clearInterval(interval);
            }, []);

            return (
                <div className="min-h-screen flex flex-col relative text-slate-100 antialiased items-center justify-start pb-20">
                    {toastMessage && <div className="fixed top-16 left-1/2 -translate-x-1/2 z-50 cyber-card px-5 py-2.5 rounded-xl font-display text-[10px] font-black text-cyberCyan tracking-wider shadow-2xl border border-cyberCyan/60 animate-bounce">{toastMessage}</div>}

                    <header className="cyber-card sticky top-0 z-30 w-full max-w-2xl px-4 py-2.5 border-b border-cyberCyan/40 flex items-center justify-between shadow-lg rounded-b-xl">
                        <div className="flex items-center gap-2.5 cursor-pointer" onClick={() => setActiveTab('dashboard')}>
                            <div className="w-9 h-9 rounded-xl cyber-border-glow flex items-center justify-center bg-void overflow-hidden border border-cyberCyan p-1">
                                <LogoRaruSVG className="w-full h-full" />
                            </div>
                            <div>
                                <h1 className="font-display text-[10px] sm:text-[11px] font-black text-white">RARU NEXUS AI</h1>
                                <p className="text-[8px] text-cyberCyan font-mono font-bold uppercase">Mesquita - RJ</p>
                            </div>
                        </div>
                        <div className="flex items-center gap-1.5">
                            <button onClick={() => {
                                const manifestData = { title: "RARU NEXUS AI", text: shareMessageText, url: APP_SHARE_URL };
                                if (navigator.share) navigator.share(manifestData).catch(()=>{});
                            }} className="w-9 h-9 rounded-xl bg-commandPanel border border-cyberCyan/40 text-cyberCyan flex items-center justify-center cursor-pointer animate-share-blink" title="Compartilhar">🔗</button>
                        </div>
                    </header>

                    <main className="flex-1 w-full max-w-2xl mx-auto p-3 sm:p-4 space-y-4 relative z-10">
                        {activeTab === 'dashboard' && <CardIdentidadeVisualRARU setActiveTab={setActiveTab} openSarahChat={() => setIsChatOpen(true)} />}
                        {activeTab === 'relatorio' && <VistoriaEPVCC_BlocosFuturistas onBackToDashboard={() => setActiveTab('dashboard')} showToast={showToast} />}
                        {activeTab === 'estacao' && (
                            <div className="cyber-card p-5 rounded-[28px] space-y-4 font-mono">
                                <div className="flex items-center justify-between border-b border-cyberCyan/30 pb-2">
                                    <h2 className="text-xs font-black text-cyberCyan uppercase">ESTAÇÃO RARU NEXUS • 9 FONTES OFICIAIS</h2>
                                    <button onClick={() => setActiveTab('dashboard')} className="text-xs text-cyberRose font-bold">✕ Voltar</button>
                                </div>
                                <p className="text-xs text-slate-300">Painel de telemetria pública, bacias e monitoramento ativo.</p>
                                <div className="grid grid-cols-2 gap-2 pt-2">
                                    <button onClick={() => setActiveTab('relatorio')} className="cyber-button py-2.5 rounded-xl text-xs font-bold">Abrir Vistoria EPVCC</button>
                                    <button onClick={() => setActiveTab('admin')} className="bg-commandPanel border border-cyberCyan/40 text-cyberCyan py-2.5 rounded-xl text-xs font-bold">Área Restrita (Admin)</button>
                                </div>
                            </div>
                        )}
                        {activeTab === 'admin' && (
                            <div className="cyber-card p-5 rounded-[28px] space-y-4 font-mono">
                                <div className="flex items-center justify-between border-b border-cyberCyan/30 pb-2">
                                    <h2 className="text-xs font-black text-cyberCyan uppercase">🔑 ÁREA RESTRITA • PIN 303500</h2>
                                    <button onClick={() => setActiveTab('dashboard')} className="text-xs text-cyberRose font-bold">✕ Voltar</button>
                                </div>
                                {!isAdminUnlocked ? (
                                    <form onSubmit={checkAdminPin} className="space-y-3 pt-2">
                                        <p className="text-xs text-slate-300">Digite o PIN de acesso (303500) para gerenciar as 32 vozes e parâmetros avançados:</p>
                                        <input type="password" value={adminPinInput} onChange={(e) => setAdminPinInput(e.target.value)} placeholder="PIN Admin" className="w-full bg-void border border-cyberCyan/50 rounded-xl p-2.5 text-xs text-white" />
                                        <button type="submit" className="w-full cyber-button py-3 rounded-xl text-xs font-black uppercase">Desbloquear Área Restrita</button>
                                    </form>
                                ) : (
                                    <div className="space-y-4">
                                        <NexusVozesPT showToast={showToast} />
                                    </div>
                                )}
                            </div>
                        )}
                    </main>

                    <SarahChatOverlay isOpen={isChatOpen} onClose={() => setIsChatOpen(false)} isSpeaking={isSpeaking} currentResponse={currentResponse} input={input} setInput={setInput} handleSendDirectCommand={handleSendDirectCommand} playOfficialSarahAudio={playOfficialSarahAudio} />

                    <footer className="cyber-card fixed bottom-0 left-0 right-0 z-40 border-t border-cyberCyan/40 px-3 py-2.5 flex items-center justify-around shadow-xl backdrop-blur-2xl max-w-2xl mx-auto rounded-t-xl">
                        <button onClick={() => setActiveTab('dashboard')} className={`flex flex-col items-center gap-0.5 cursor-pointer transition ${activeTab === 'dashboard' ? 'text-cyberCyan scale-105' : 'text-slate-400'}`}>
                            <span className="text-base">🏠</span>
                            <span className="text-[8px] font-black tracking-wider">Painel</span>
                        </button>
                        <button onClick={() => setActiveTab('estacao')} className={`flex flex-col items-center gap-0.5 cursor-pointer transition ${activeTab === 'estacao' ? 'text-cyberCyan scale-105' : 'text-slate-400'}`}>
                            <span className="text-base">📡</span>
                            <span className="text-[8px] font-black tracking-wider">Estação</span>
                        </button>
                        <button onClick={() => setActiveTab('relatorio')} className={`flex flex-col items-center gap-0.5 cursor-pointer transition ${activeTab === 'relatorio' ? 'text-cyberCyan scale-105' : 'text-slate-400'}`}>
                            <span className="text-base">📋</span>
                            <span className="text-[8px] font-black tracking-wider">Vistoria</span>
                        </button>
                        <button onClick={() => setActiveTab('admin')} className={`flex flex-col items-center gap-0.5 cursor-pointer transition ${activeTab === 'admin' ? 'text-cyberCyan scale-105' : 'text-slate-400'}`}>
                            <span className="text-base">🔒</span>
                            <span className="text-[8px] font-black tracking-wider">Admin</span>
                        </button>
                    </footer>
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
