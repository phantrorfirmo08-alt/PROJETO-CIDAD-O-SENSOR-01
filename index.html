    }
    function gerarPdfDeItem(it) {
      const protRef = it.protocolo || garantirProtocolo().protocolo, linhasFormatadas = [];

        const str = String(ln || "");
        if (str.length <= 88) linhasFormatadas.push(str);
        else { let atual = ""; str.split(" ").forEach(p => { if ((atual + (atual ? " " : "") + p).length <= 88) atual += (atual ? " " : "") + p; else { if (atual) linhasFormatadas.push(atual); atual = p; } }); if (atual) linhasFormatadas.push(atual); }
      });
      const escPdf = s => String(s || "").replace(/\\/g, "\\\\").replace(/\(/g, "\\(").replace(/\)/g, "\\)");
      const paginasOps = [];
      let opsAtual = ["BT", "/F1 10 Tf", "42 790 Td", "14 TL"], yAtual = 790, primeiraLinhaNaPagina = true;
      const fecharPaginaTexto = () => { opsAtual.push("ET"); paginasOps.push(opsAtual.join("\n")); };
      const abrirNovaPaginaTexto = () => { opsAtual = ["BT", "/F1 10 Tf", "42 790 Td", "14 TL"]; yAtual = 790; primeiraLinhaNaPagina = true; };
      linhasFormatadas.forEach(ln => {
        if (yAtual < 56) { fecharPaginaTexto(); abrirNovaPaginaTexto(); }
        const txtEsc = escPdf(ln);
        if (primeiraLinhaNaPagina) { opsAtual.push(`(${txtEsc}) Tj`); primeiraLinhaNaPagina = false; } else opsAtual.push(`T* (${txtEsc}) Tj`);
        yAtual -= 14;
      });
      fecharPaginaTexto();
      const temFotoJpeg = it.foto && it.foto.startsWith("data:image/jpeg;base64,") && it.fotoDim && it.fotoDim.w > 0 && it.fotoDim.h > 0;
      let imgBytes = null;
      if (temFotoJpeg) {
        imgBytes = base64ParaUint8Array(it.foto);
        const ratio = Math.min(510 / it.fotoDim.w, 620 / it.fotoDim.h), wPdf = Math.round(it.fotoDim.w * ratio), hPdf = Math.round(it.fotoDim.h * ratio);
        paginasOps.push(["BT", "/F1 10 Tf", "42 775 Td", `(${escPdf(`ANEXO FOTOGRÁFICO • ${protRef} • HASH SHA-256: ${(it.hash || hash || "N/A").slice(0, 32)}...`)}) Tj`, "ET", `q ${wPdf} 0 0 ${hPdf} ${Math.round((595 - wPdf) / 2)} ${Math.round(740 - hPdf)} cm /Im1 Do Q`].join("\n"));
      }
      const numPaginas = paginasOps.length, firstPageObj = 4, firstStreamObj = 4 + numPaginas, imageObj = temFotoJpeg ? (4 + numPaginas * 2) : null;
      const blocos = [], offsets = [0];
      let pos = 0;
      const pushTexto = txt => { const b = stringParaWinAnsiBytes(txt); blocos.push(b); pos += b.length; };
      const pushBytes = b => { blocos.push(b); pos += b.length; };
      pushTexto("%PDF-1.4\n");
      offsets.push(pos); pushTexto("1 0 obj << /Type /Catalog /Pages 2 0 R >> endobj\n");
      const kidsRefs = []; for (let p = 0; p < numPaginas; p++) kidsRefs.push(`${firstPageObj + p} 0 R`);
      offsets.push(pos); pushTexto(`2 0 obj << /Type /Pages /Kids [${kidsRefs.join(" ")}] /Count ${numPaginas} >> endobj\n`);
      offsets.push(pos); pushTexto("3 0 obj << /Type /Font /Subtype /Type1 /BaseFont /Helvetica /Encoding /WinAnsiEncoding >> endobj\n");
      for (let p = 0; p < numPaginas; p++) { const xObjectRef = (temFotoJpeg && p === numPaginas - 1) ? `/XObject << /Im1 ${imageObj} 0 R >>` : ""; offsets.push(pos); pushTexto(`${firstPageObj + p} 0 obj << /Type /Page /Parent 2 0 R /MediaBox [0 0 595 842] /Resources << /Font << /F1 3 0 R >> ${xObjectRef} >> /Contents ${firstStreamObj + p} 0 R >> endobj\n`); }
      for (let p = 0; p < numPaginas; p++) { const sBytes = stringParaWinAnsiBytes(paginasOps[p]); offsets.push(pos); pushTexto(`${firstStreamObj + p} 0 obj << /Length ${sBytes.length} >> stream\n`); pushBytes(sBytes); pushTexto("\nendstream endobj\n"); }
      if (temFotoJpeg && imgBytes && imageObj) { offsets.push(pos); pushTexto(`${imageObj} 0 obj << /Type /XObject /Subtype /Image /Width ${it.fotoDim.w} /Height ${it.fotoDim.h} /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${imgBytes.length} >> stream\n`); pushBytes(imgBytes); pushTexto("\nendstream endobj\n"); }
      const totalObjs = offsets.length - 1, xrefPos = pos;
      let xref = `xref\n0 ${totalObjs + 1}\n0000000000 65535 f \n`;
      for (let i = 1; i <= totalObjs; i++) xref += `${String(offsets[i]).padStart(10, "0")} 00000 n \n`;
      pushTexto(`${xref}trailer << /Size ${totalObjs + 1} /Root 1 0 R >>\nstartxref\n${xrefPos}\n%%EOF`);
      const blob = new Blob([concatUint8Arrays(blocos)], { type: "application/pdf" });
      if (urlPdfAtual) URL.revokeObjectURL(urlPdfAtual);
      urlPdfAtual = URL.createObjectURL(blob); nomePdfAtual = `${protRef}.pdf`;
      if ($("pdfFrame")) { $("pdfFrame").src = urlPdfAtual; $("pdfFrame").style.display = "block"; }
      if ($("btnBaixarPdf")) $("btnBaixarPdf").disabled = false; if ($("btnCompartilharPdf")) $("btnCompartilharPdf").disabled = false;
      aviso(`PDF gerado (${numPaginas} página(s)).`);
    }
    function baixarPdf() { if (!urlPdfAtual) return aviso("Gere o PDF primeiro."); const a = document.createElement("a"); a.href = urlPdfAtual; a.download = nomePdfAtual || `${garantirProtocolo().protocolo}.pdf`; a.click(); }

    on($("btnVoz"), "click", () => { destravarVoz(); vozLigada = !vozLigada; $("btnVoz").textContent = vozLigada ? "Voz: ON" : "Voz: OFF"; $("btnVoz").className = "btn " + (vozLigada ? "btn-cyan" : "btn-ghost"); if (vozLigada) falar("Voz ativada."); else if (window.speechSynthesis) window.speechSynthesis.cancel(); });

    on($("btnZoomMais"), "click", () => { zoom = Math.min(maxZoom, +(zoom + 0.5).toFixed(1)); aplicarZoom(); });
    [["btnAuto", "auto"], ["btnRetrato", "retrato"], ["btnPaisagem", "paisagem"]].forEach(([id, md]) => on($(id), "click", () => { modo = md; aplicarOrientacao(); salvarRascunho(); }));

          <div style={{ display: "flex", gap: "8px", flexWrap: "wrap", marginTop: "10px" }}><button type="button" id="btnAuto" className="btn btn-cyan btn-small">Automático</button><button type="button" id="btnRetrato" className="btn btn-ghost btn-small">Retrato</button><button type="button" id="btnPaisagem" className="btn btn-ghost btn-small">Paisagem</button><button type="button" id="btnGirar" className="btn btn-ghost btn-small">Girar 90°</button></div>
          <div id="orientInfo" style={{ fontSize: "11px", color: "#94a3b8", marginTop: "6px" }}>Orientação: Automática</div>
          <div style={{ display: "flex", justifyContent: "space-between", gap: "8px", flexWrap: "wrap", fontSize: "11px", color: "#94a3b8", marginTop: "8px" }}><span id="camStatus">Câmera: desligada</span><span id="hashInfo">Hash SHA-256: pendente</span></div>
          <div id="carimboPreview" className="carimbo" style={{ marginTop: "10px" }}></div>
        </div>
        <div className="card">
          <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", gap: "8px", flexWrap: "wrap", marginBottom: "8px" }}><label style={{ margin: 0 }}>Localização GPS</label><button type="button" id="btnGps" className="btn btn-cyan btn-small">Atualizar GPS</button></div>
          <div id="gpsInfo" style={{ fontSize: "12px", color: "#67e8f9", marginBottom: "10px" }}>GPS: aguardando...</div>
          <label>Endereço / Local da Vistoria ou Ocorrência</label><input id="endereco" placeholder="Ex.: Rua Amazonas, 120 - Rocha Sobrinho" />
          <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fit,minmax(220px,1fr))", gap: "10px", marginTop: "10px" }}><div><label>Ponto de Referência</label><input id="pontoRef" placeholder="Ex.: Próximo ao valão / praça" /></div><div><label>Separação / Divisão / Setor</label><input id="separacao" placeholder="Ex.: Quadra B, Lote 4, Casa 2" /></div></div>
          <div style={{ marginTop: "10px" }}><label>Responsável / Morador / Solicitante</label><input id="resp" placeholder="Nome completo ou apelido" /></div>
          <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fit,minmax(220px,1fr))", gap: "10px", marginTop: "10px" }}><div><label>Contato 1 - Nome</label><input id="n1" placeholder="Nome do contato 1" /></div><div><label>Contato 1 - Telefone / WhatsApp</label><input id="c1" placeholder="Ex.: (21) 99999-9999" /></div><div><label>Contato 2 - Nome</label><input id="n2" placeholder="Nome do contato 2" /></div><div><label>Contato 2 - Telefone / WhatsApp</label><input id="c2" placeholder="Ex.: (21) 98888-8888" /></div><div><label>Contato 3 - Nome</label><input id="n3" placeholder="Nome do contato 3" /></div><div><label>Contato 3 - Telefone / WhatsApp</label><input id="c3" placeholder="Ex.: (21) 97777-7777" /></div></div>
        </div>
        <div className="card">
          <label>Riscos Observados</label>
          <div id="riscosBox" style={{ display: "grid", gridTemplateColumns: "repeat(auto-fit,minmax(170px,1fr))", gap: "8px", marginBottom: "12px" }}>
            <button type="button" className="chip" data-r="Infiltração">Infiltração</button><button type="button" className="chip" data-r="Mofo / Umidade">Mofo / Umidade</button><button type="button" className="chip" data-r="Rachadura">Rachadura</button><button type="button" className="chip" data-r="Telhado / Calha">Telhado / Calha</button><button type="button" className="chip" data-r="Elétrica">Elétrica</button><button type="button" className="chip" data-r="Esgoto / Drenagem">Esgoto / Drenagem</button><button type="button" className="chip defesa" data-r="Alagamento" data-defesa="1">Alagamento</button><button type="button" className="chip defesa" data-r="Encosta / Deslizamento" data-defesa="1">Encosta / Deslizamento</button><button type="button" className="chip defesa" data-r="Ventania" data-defesa="1">Ventania</button>
          </div>
          <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", gap: "8px", flexWrap: "wrap", marginBottom: "8px" }}><label style={{ margin: 0 }}>Vento e Chuva</label><button type="button" id="btnClima" className="btn btn-ghost btn-small">Buscar Clima Agora</button></div>
          <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fit,minmax(220px,1fr))", gap: "12px" }}>
            <div><div style={{ display: "flex", justifyContent: "space-between", fontSize: "12px", marginBottom: "6px" }}><span>Vento</span><b id="ventoTxt" style={{ color: "#00E5FF" }}>0 km/h</b></div><input id="ventoRange" className="range" type="range" min="0" max="120" defaultValue="0" /></div>
            <div><div style={{ display: "flex", justifyContent: "space-between", fontSize: "12px", marginBottom: "6px" }}><span>Chuva</span><b id="chuvaTxt" style={{ color: "#00E5FF" }}>0 mm</b></div><input id="chuvaRange" className="range" type="range" min="0" max="100" defaultValue="0" /></div>
          </div>
        </div>
        <div className="card"><label>Descrição da Vistoria / Ocorrência</label><textarea id="desc" rows="4" placeholder="Descreva detalhadamente o que foi observado no local..."></textarea><div style={{ marginTop: "10px" }}><label>Observações / Encaminhamentos</label><textarea id="obs" rows="3" placeholder="Ex.: encaminhar à assistência social, obras ou zeladoria..."></textarea></div></div>
        <div className="card">
          <label>Laudo / Relatório Gerado</label><textarea id="laudo" rows="10" readOnly></textarea>
          <div style={{ display: "flex", gap: "8px", flexWrap: "wrap", marginTop: "10px" }}>
            <button type="button" id="btnSalvar" className="btn btn-green">Salvar Vistoria</button><button type="button" id="btnPdf" className="btn btn-cyan">Gerar PDF</button><button type="button" id="btnBaixarPdf" className="btn btn-ghost" disabled>Baixar PDF</button><button type="button" id="btnCompartilharPdf" className="btn btn-pink" disabled>Compartilhar PDF</button><button type="button" id="btnCopiar" className="btn btn-ghost">Copiar Laudo</button><button type="button" id="btnWhats" className="btn btn-green">WhatsApp</button><button type="button" id="btnFalarLaudo" className="btn btn-ghost">Ouvir Laudo</button><button type="button" id="btnLimpar" className="btn btn-red">Limpar</button>
          </div>
          <iframe id="pdfFrame" className="preview-pdf" title="Prévia do PDF" style={{ marginTop: "12px" }}></iframe>
        </div>
        <div className="card">
          <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", gap: "8px", flexWrap: "wrap", marginBottom: "10px" }}>
            <label style={{ margin: 0 }}>Vistorias Salvas no Aparelho</label>
            <div style={{ display: "flex", gap: "8px", flexWrap: "wrap" }}><button type="button" id="btnExportJson" className="btn btn-ghost btn-small">Exportar JSON</button><label className="btn btn-ghost btn-small" style={{ marginBottom: 0 }}>Importar JSON<input type="file" id="arquivoJson" accept="application/json,.json" style={{ display: "none" }} /></label></div>
          </div>
          <div id="listaVistorias"></div>
        </div>
      </div>
    </div>
  );
}
