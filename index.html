    <script>
      (function() {
        try {
            const savedTheme = localStorage.getItem('sarah-theme') || 'dark';
            if (savedTheme === 'warm') {
                document.documentElement.classList.remove('dark');
                document.documentElement.classList.add('warm');
            } else {
                document.documentElement.classList.add('dark');
                document.documentElement.classList.remove('warm');
            }
        } catch(e) {}
      })();

        function FieldReportModule({ onBackToDashboard, showToast }) {
            const [setor, setSetor] = React.useState("🛡️ Defesa Civil Municipal");
            const [nivelRisco, setNivelRisco] = React.useState("🟢 Risco Baixo / Monitoramento");
            const [agente, setAgente] = React.useState("");
            const [local, setLocal] = React.useState("");
            const [desc, setDesc] = React.useState("");
            const [gps, setGps] = React.useState({ lt: '', ln: '', lk: '' });
            const [gpsSt, setGpsSt] = React.useState("📍 GPS em espera");
            const [hashSha256, setHashSha256] = React.useState("Calculando hash...");
            
            const [ocorrencias, setOcorrencias] = React.useState({
                deslizamento: false,
                alagamento: false,
                trincas: false,
                arvore: false,
                valao: false
            });

            const [fotos, setFotos] = React.useState([
                { id: 1, file: null, preview: null },
                { id: 2, file: null, preview: null },
                { id: 3, file: null, preview: null },
                { id: 4, file: null, preview: null }
            ]);

            const protocoloAtual = React.useMemo(() => `CPARC-2026-${Math.floor(1000 + Math.random() * 9000)}`, []);

            React.useEffect(() => {
                const calcularHash = async () => {
                    try {
                        const dadosStr = setor + nivelRisco + agente + local + desc + protocoloAtual + JSON.stringify(ocorrencias);
                        const msgBuffer = new TextEncoder().encode(dadosStr);
                        const hashBuffer = await crypto.subtle.digest('SHA-256', msgBuffer);
                        const hashArray = Array.from(new Uint8Array(hashBuffer));
                        const hashHex = hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
                        setHashSha256(hashHex.substring(0, 32) + "...");
                    } catch (e) {
                        setHashSha256("sha256-fallback-secure");
                    }
                };
                calcularHash();
            }, [setor, nivelRisco, agente, local, desc, ocorrencias, protocoloAtual]);

            const capturarGps = () => {
                if (!navigator.geolocation) return showToast("⚠️ Geolocalização não suportada");
                showToast("🛰 Buscando GPS...");
                navigator.geolocation.getCurrentPosition(
                    (p) => {
                        const lt = p.coords.latitude.toFixed(6);
                        const ln = p.coords.longitude.toFixed(6);
                        const lk = `https://www.google.com/maps?q=${lt},${ln}`;
                        setGps({ lt, ln, lk });
                        setLocal(`${lt},${ln}`);
                        setGpsSt("✅ GPS Fixado");
                        showToast("📍 Coordenadas obtidas com sucesso!");
                    },
                    () => setGpsSt("⚠ Erro ao obter GPS"),
                    { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
                );
            };

            const processar = (file, gpsInfo, ag, loc, setorAtual) => new Promise((res, rej) => {
                const rd = new FileReader();
                rd.readAsDataURL(file);
                rd.onload = (e) => {
                    const img = new Image();
                    img.src = e.target.result;
                    img.onload = () => {
                        const cv = document.createElement('canvas');
                        const MAX = 600;
                        let w = img.width, h = img.height;
                        if (w > MAX || h > MAX) {
                            if (w > h) { h = Math.round(h * MAX / w); w = MAX; }
                            else { w = Math.round(w * MAX / h); h = MAX; }
                        }
                        cv.width = w;
                        cv.height = h;
                        const ctx = cv.getContext('2d');
                        ctx.drawImage(img, 0, 0, w, h);

                        const dt = new Intl.DateTimeFormat('pt-BR', { dateStyle: 'short', timeStyle: 'medium', timeZone: 'America/Sao_Paulo' }).format(new Date());
                        const ct = gpsInfo.lt ? `${gpsInfo.lt},${gpsInfo.ln}` : (loc || 'Local não fixado');
                        
                        let siglaSetor = "CPARC";
                        if (setorAtual.includes("Defesa Civil")) siglaSetor = "DEFESA CIVIL";
                        else if (setorAtual.includes("CRAS")) siglaSetor = "CRAS";
                        else if (setorAtual.includes("Universidade")) siglaSetor = "PESQUISA";
                        else if (setorAtual.includes("Chave da Esperança")) siglaSetor = "GADE";
                        else if (setorAtual.includes("Cidadão Sensor")) siglaSetor = "CIDADÃO SENSOR";
                        else if (setorAtual.includes("Técnico")) siglaSetor = "TÉCNICO DE CAMPO";

                        const fs = Math.max(10, Math.round(w * 0.028));
                        const pad = 8;
                        const lh = fs + 4;
                        const bh = lh * 3 + pad * 2;

                        ctx.font = `bold ${fs}px sans-serif`;
                        ctx.fillStyle = 'rgba(6, 11, 24, 0.90)';
                        ctx.fillRect(0, h - bh, w, bh);
                        
                        ctx.fillStyle = '#00F2FE';
                        ctx.fillRect(0, h - bh, w, 2);

                        ctx.shadowColor = 'rgba(0, 0, 0, 1)';
                        ctx.shadowBlur = 4;

                        let y = h - bh + pad + fs;
                        ctx.fillStyle = '#00F2FE';
                        ctx.fillText(`📅 ${dt} \vert{}${siglaSetor} (GADE)`, pad, y);
                        
                        ctx.fillStyle = '#FFFFFF';
                        ctx.fillText(`📍 GPS: ${ct}`, pad, y + lh);
                        
                        ctx.fillStyle = '#94A3B8';
                        ctx.fillText(`👤 Resp.: ${ag || 'Equipe de Campo'}`, pad, y + lh * 2);

                        cv.toBlob((b) => {
                            if (!b) return rej(new Error("Falha ao gerar blob da imagem"));
                            const compressedFile = new File([b], `vistoria_${siglaSetor.toLowerCase()}_${Date.now()}.jpg`, { type: 'image/jpeg' });
                            res({ compressedFile, preview: cv.toDataURL('image/jpeg', 0.5) });
                        }, 'image/jpeg', 0.5);
                    };
                    img.onerror = () => rej(new Error("Falha ao carregar imagem"));
                };
                rd.onerror = () => rej(new Error("Falha ao ler arquivo"));
            });

            const handleFoto = async (i, e) => {
                const file = e.target.files[0];
                if (!file) return;
                e.target.value = "";
                showToast(`🔄 Otimizando foto ${i + 1}...`);
                try {
                    const { compressedFile, preview } = await processar(file, gps, agente, local, setor);
                    setFotos(p => {
                        const n = [...p];
                        n[i] = { id: n[i].id, file: compressedFile, preview };
                        return n;
                    });
                    showToast(`📸 Foto ${i + 1} carimbada com sucesso!`);
                } catch (err) {
                    showToast("❌ Erro ao processar a foto.");
                }
            };

            const apagar = (i, e) => {
                e.stopPropagation();
                setFotos(p => {
                    const n = [...p];
                    n[i] = { id: n[i].id, file: null, preview: null };
                    return n;
                });
                showToast(`🗑️ Foto ${i + 1} removida!`);
            };

            const getOcorrenciasTexto = () => {
                const lista = [];
                if (ocorrencias.deslizamento) lista.push("• Deslizamento / Escorregamento");
                if (ocorrencias.alagamento) lista.push("• Alagamento / Inundação");
                if (ocorrencias.trincas) lista.push("• Trincas / Rachaduras Estruturais");
                if (ocorrencias.arvore) lista.push("• Queda de Árvore / Risco Elétrico");
                if (ocorrencias.valao) lista.push("• Obstrução de Bueiro / Valão");
                return lista.length > 0 ? lista.join("\n") : "• Nenhuma categoria específica marcada";
            };

            const montarTexto = () => {
                const c = fotos.filter(f => f.file).length;
                const dh = new Intl.DateTimeFormat('pt-BR', { dateStyle: 'short', timeStyle: 'medium', timeZone: 'America/Sao_Paulo' }).format(new Date());
                return `🛡️ *LAUDO DE VISTORIA • CPARC v13.0* 🛡️\n` +
                       `━━━━━━━━━━━━━━━━━━━━━━\n` +
                       `📌 *Protocolo:* \`${protocoloAtual}\`\n` +
                       `🏛 *Setor / Instituição:* ${setor}\n` +
                       `⚠️ *Nível de Risco:* ${nivelRisco}\n` +
                       `👤 *Responsável:* ${agente || 'Não informado'} (GADE)\n` +
                       `📅 *Data/Hora:* ${dh}\n` +
                       `📍 *Localidade:* ${local || 'Não informada'}\n` +
                       (gps.lk ? `🔗 *Google Maps:* ${gps.lk}\n` : ``) +
                       `━━━━━━━━━━━━━━━━━━━━━━\n` +
                       `📋 *Tipos de Ocorrência:*\n${getOcorrenciasTexto()}\n` +
                       `━━━━━━━━━━━━━━━━━━━━━━\n` +
                       `📸 *Evidências Anexadas:* ${c}/4 fotos\n` +
                       `📝 *Relato da Ocorrência:*\n${desc || 'Sem descrição.'}\n` +
                       `━━━━━━━━━━━━━━━━━━━━━━\n` +
                       `🔒 *Hash SHA-256:* \`${hashSha256}\`\n` +
                       `⚡ *GADE • Chave Climática & CPARC v13.0*`;
            };

            const copiar = () => {
                navigator.clipboard.writeText(montarTexto())
                    .then(() => showToast("📋 Relatório copiado para a área de transferência!"))
                    .catch(() => showToast("❌ Erro ao copiar."));
            };

            const gerarPdfLaudo = async () => {
                showToast("📄 Gerando PDF oficial do laudo...");
                try {
                    let jsPDFClass = window.jspdf ? window.jspdf.jsPDF : null;
                    if (!jsPDFClass && window.jsPDF) { jsPDFClass = window.jsPDF; }

                    if (!jsPDFClass) {
                        showToast("⚠️ Biblioteca PDF indisponível. Tente novamente em instantes.");
                        return;
                    }

                    const doc = new jsPDFClass({ unit: 'mm', format: 'a4' });
                    const margin = 15;
                    let y = 20;

                    doc.setFillColor(6, 11, 24);
                    doc.rect(0, 0, 210, 297, "F");

                    doc.setTextColor(0, 242, 254);
                    doc.setFontSize(14);
                    doc.setFont("helvetica", "bold");
                    doc.text("LAUDO TÉCNICO OFICIAL DE VISTORIA", margin, y);
                    
                    y += 8;
                    doc.setFontSize(10);
                    doc.setTextColor(16, 185, 129);
                    doc.text("CPARC v13.0 • Central Pública e Automatizada de Resiliência Comunitária (GADE)", margin, y);

                    y += 12;
                    doc.setDrawColor(0, 242, 254);
                    doc.setLineWidth(0.5);
                    doc.line(margin, y, 210 - margin, y);

                    y += 8;
                    doc.setFontSize(9);
                    doc.setTextColor(255, 255, 255);
                    doc.text(`Protocolo: ${protocoloAtual}`, margin, y);
                    doc.text(`Data/Hora: ${new Date().toLocaleString('pt-BR')}`, margin + 90, y);
                    
                    y += 6;
                    doc.text(`Setor / Instituição: ${setor}`, margin, y);
                    
                    y += 6;
                    doc.text(`Nível de Risco: ${nivelRisco}`, margin, y);
                    doc.text(`Responsável: ${agente || 'Não informado'} (GADE)`, margin + 90, y);

                    y += 6;
                    doc.text(`Localidade: ${local || 'Não informada'}`, margin, y);
                    
                    if (gps.lk) {
                        y += 6;
                        doc.setTextColor(0, 242, 254);
                        doc.text(`Google Maps: ${gps.lk}`, margin, y);
                    }

                    y += 10;
                    doc.setTextColor(0, 242, 254);
                    doc.setFont("helvetica", "bold");
                    doc.text("CHECKLIST DE OCORRÊNCIAS / DANOS OBSERVADOS:", margin, y);
                    
                    y += 6;
                    doc.setFont("helvetica", "normal");
                    doc.setTextColor(255, 255, 255);
                    getOcorrenciasTexto().split('\n').forEach(linha => {
                        doc.text(linha, margin + 5, y);
                        y += 5;
                    });

                    y += 4;
                    doc.setTextColor(0, 242, 254);
                    doc.setFont("helvetica", "bold");
                    doc.text("RELATO TÉCNICO / ANOMALIA:", margin, y);
                    
                    y += 6;
                    doc.setFont("helvetica", "normal");
                    doc.setTextColor(255, 255, 255);
                    const splitText = doc.splitTextToSize(desc || 'Sem descrição informada', 180);
                    doc.text(splitText, margin, y);
                    y += (splitText.length * 5) + 8;

                    doc.setFillColor(13, 21, 45);
                    doc.roundedRect(margin, y, 180, 12, 2, 2, "F");
                    doc.setFontSize(8);
                    doc.setTextColor(0, 242, 254);
                    doc.text(`IDENTIFICADOR ÚNICO DE INTEGRIDADE (HASH SHA-256):`, margin + 4, y + 4.5);
                    doc.setTextColor(255, 255, 255);
                    doc.text(`${hashSha256}`, margin + 4, y + 9);

                    y += 18;

                    const fotosValidas = fotos.filter(f => f.preview);
                    if (fotosValidas.length > 0) {
                        if (y > 180) { doc.addPage(); y = 20; }
                        doc.setFontSize(10);
                        doc.setTextColor(0, 242, 254);
                        doc.setFont("helvetica", "bold");
                        doc.text("EVIDÊNCIAS FOTOGRÁFICAS DE CAMPO (CARIMBADAS):", margin, y);
                        y += 6;

                        let xPos = margin;
                        let startY = y;
                        let maxHeight = 0;

                        fotosValidas.forEach((f, i) => {
                            if (xPos + 40 > 210 - margin) {
                                xPos = margin;
                                startY += maxHeight + 10;
                                maxHeight = 0;
                            }
                            if (startY > 230) {
                                doc.addPage();
                                startY = 20;
                                xPos = margin;
                            }

                            try {
                                doc.addImage(f.preview, 'JPEG', xPos, startY, 40, 40);
                                doc.setFontSize(8);
                                doc.setTextColor(255, 255, 255);
                                doc.text(`Foto #${i + 1}`, xPos, startY + 44);
                                xPos += 48;
                                maxHeight = 45;
                            } catch(err) {}
                        });
                    }

                    doc.save(`Laudo_Oficial_CPARC_${protocoloAtual}.pdf`);
                    showToast("✅ PDF oficial gerado com sucesso!");
                } catch (err) {
                    console.error(err);
                    showToast("❌ Erro ao compilar o PDF.");
                }
            };

            const compartilhar = async () => {
                const txt = montarTexto();
                const files = fotos.filter(f => f.file).map(f => f.file);

                if (navigator.canShare) {
                    try {
                        const d = { title: 'Relatório Técnico CPARC', text: txt, files: files.length ? files : undefined };
                        if (navigator.canShare(d)) {
                            await navigator.share(d);
                            showToast("✅ Compartilhado com sucesso!");
                            return;
                        }
                    } catch (err) {
                        if (err.name === 'AbortError') return;
                    }
                }

                try {
                    await navigator.clipboard.writeText(txt);
                } catch (e) {}

                if (files.length > 0) {
                    files.forEach((f, i) => {
                        const a = document.createElement('a');
                        a.href = URL.createObjectURL(f);
                        a.download = `vistoria_${i + 1}.jpg`;
                        a.click();
                    });
                }

                showToast("📋 Texto copiado e fotos baixadas para envio!");
                setTimeout(() => {
                    window.open(`https://wa.me/?text=${encodeURIComponent(txt)}`, '_blank');
                }, 800);
            };

            return (
                <div className="space-y-4 max-w-xl mx-auto">
                    <div className="flex items-center justify-between cyber-card px-5 py-3.5 rounded-2xl border border-cyberCyan/30">
                        <span className="text-xs font-extrabold text-cyberCyan">📋 Vistoria & Laudo Oficial • CPARC v13.0</span>
                        <button onClick={onBackToDashboard} className="px-3.5 py-1.5 bg-cyberRose/20 text-cyberRose rounded-xl text-xs font-bold border border-cyberRose/40">✕ Fechar</button>
                    </div>
                    
                    <div className="cyber-card rounded-[32px] p-6 border border-cyberCyan/40 space-y-4 shadow-2xl">
                        <div className="space-y-1">
                            <label className="text-[10px] font-bold text-cyberCyan uppercase">Setor / Instituição / Coletivo</label>
                            <select value={setor} onChange={e => setSetor(e.target.value)} className="w-full bg-void border border-cyberCyan/40 rounded-2xl p-3.5 text-xs text-white">
                                <option>🛡️ Defesa Civil Municipal</option>
                                <option>🤝 Assistência Social / CRAS</option>
                                <option>🎓 Pesquisa Acadêmica / Universidade</option>
                                <option>🌱 GADE (Grupo A Chave da Esperança)</option>
                                <option>👁️ Cidadão Sensor / Iniciativa Comunitária</option>
                                <option>🛠️ Técnico de Campo / Mutuário Independente</option>
                            </select>
                        </div>

                        <div className="space-y-1">
                            <label className="text-[10px] font-bold text-cyberCyan uppercase">Nível de Risco Avaliado</label>
                            <select value={nivelRisco} onChange={e => setNivelRisco(e.target.value)} className="w-full bg-void border border-cyberCyan/40 rounded-2xl p-3.5 text-xs text-white font-bold">
                                <option>🟢 Risco Baixo / Monitoramento</option>
                                <option>🟡 Risco Médio / Atenção</option>
                                <option>🟠 Risco Alto / Alerta</option>
                                <option>🔴 Risco Muito Alto / Perigo Iminente</option>
                            </select>
                        </div>

                        <div className="space-y-2 bg-void/70 border border-cyberCyan/30 rounded-2xl p-4">
                            <label className="text-[10px] font-bold text-cyberCyan uppercase tracking-widest block mb-1">Checklist de Ocorrências / Danos Observados</label>
                            <div className="grid grid-cols-1 sm:grid-cols-2 gap-2 text-xs text-slate-200">
                                <label className="flex items-center gap-2 cursor-pointer">
                                    <input type="checkbox" checked={ocorrencias.deslizamento} onChange={e => setOcorrencias({...ocorrencias, deslizamento: e.target.checked})} className="rounded border-cyberCyan/50 text-cyberCyan w-4 h-4 bg-void cursor-pointer" />
                                    <span>Deslizamento / Encosta</span>
                                </label>
                                <label className="flex items-center gap-2 cursor-pointer">
                                    <input type="checkbox" checked={ocorrencias.alagamento} onChange={e => setOcorrencias({...ocorrencias, alagamento: e.target.checked})} className="rounded border-cyberCyan/50 text-cyberCyan w-4 h-4 bg-void cursor-pointer" />
                                    <span>Alagamento / Inundação</span>
                                </label>
                                <label className="flex items-center gap-2 cursor-pointer">
                                    <input type="checkbox" checked={ocorrencias.trincas} onChange={e => setOcorrencias({...ocorrencias, trincas: e.target.checked})} className="rounded border-cyberCyan/50 text-cyberCyan w-4 h-4 bg-void cursor-pointer" />
                                    <span>Trincas / Rachaduras</span>
                                </label>
                                <label className="flex items-center gap-2 cursor-pointer">
                                    <input type="checkbox" checked={ocorrencias.arvore} onChange={e => setOcorrencias({...ocorrencias, arvore: e.target.checked})} className="rounded border-cyberCyan/50 text-cyberCyan w-4 h-4 bg-void cursor-pointer" />
                                    <span>Árvore / Risco Elétrico</span>
                                </label>
                                <label className="flex items-center gap-2 cursor-pointer sm:col-span-2">
                                    <input type="checkbox" checked={ocorrencias.valao} onChange={e => setOcorrencias({...ocorrencias, valao: e.target.checked})} className="rounded border-cyberCyan/50 text-cyberCyan w-4 h-4 bg-void cursor-pointer" />
                                    <span>Obstrução de Bueiro / Valão / Canal</span>
                                </label>
                            </div>
                        </div>

                        <div className="grid grid-cols-2 gap-3">
                            <input value={agente} onChange={e => setAgente(e.target.value)} placeholder="Nome do Responsável / Agente" className="w-full bg-void border border-cyberCyan/40 rounded-2xl p-3.5 text-xs text-white" />
                            <input value={local} onChange={e => setLocal(e.target.value)} placeholder="Localidade / Setor" className="w-full bg-void border border-cyberCyan/40 rounded-2xl p-3.5 text-xs text-white" />
                        </div>

                        <div className="border border-cyberCyan/40 bg-void/80 rounded-2xl p-3.5 flex items-center justify-between">
                            <span className="text-cyberGreen text-xs font-mono font-bold">{gpsSt}</span>
                            <button onClick={capturarGps} className="px-4 py-2 cyber-button text-void font-black rounded-xl text-xs cursor-pointer">GPS 🛰</button>
                        </div>

                        <textarea value={desc} onChange={e => setDesc(e.target.value)} placeholder="Descreva a ocorrência, danos observados ou situação de risco..." rows="3" className="w-full bg-void border border-cyberCyan/40 rounded-2xl p-3.5 text-xs text-white resize-none shadow-inner"></textarea>

                        <div className="bg-void/90 border border-cyberCyan/30 rounded-2xl p-3 text-[10px] font-mono text-cyan-300 break-all">
                            <b>Protocolo:</b> {protocoloAtual} <br/>
                            <b>Hash SHA-256:</b> {hashSha256}
                        </div>

                        <div className="grid grid-cols-2 gap-3">
                            {fotos.map((f, i) => (
                                <div key={f.id} className="relative h-32 rounded-2xl border-2 border-dashed border-cyberGreen/40 bg-void flex items-center justify-center overflow-hidden">
                                    {f.preview ? (
                                        <>
                                            <img src={f.preview} alt={`Vistoria ${i+1}`} className="w-full h-full object-cover rounded-2xl" />
                                            <button type="button" onClick={e => apagar(i, e)} className="absolute top-2 right-2 w-7 h-7 bg-cyberRose text-white rounded-full flex items-center justify-center text-xs z-20 shadow cursor-pointer">✕</button>
                                        </>
                                    ) : (
                                        <label htmlFor={`foto-${i}`} className="w-full h-full flex flex-col items-center justify-center cursor-pointer">
                                            <div className="text-xl">📷</div>
                                            <div className="text-[10px] text-slate-300 font-bold mt-1">Bloco {i + 1}</div>
                                            <div className="text-[8px] text-slate-400">Carimbo Dinâmico + GADE</div>
                                        </label>
                                    )}
                                    <input id={`foto-${i}`} type="file" accept="image/*" capture="environment" className="hidden" onChange={e => handleFoto(i, e)} />
                                    {f.preview && <div className="absolute bottom-1.5 right-1.5 bg-cyberGreen text-void text-[9px] font-black px-2 py-0.5 rounded-full shadow">CARIMBADA</div>}
                                </div>
                            ))}
                        </div>

                        <div className="grid grid-cols-1 sm:grid-cols-2 gap-2.5 pt-2">
                            <button onClick={gerarPdfLaudo} className="w-full cyber-button text-void font-extrabold py-3.5 rounded-2xl text-xs uppercase shadow-lg cursor-pointer flex items-center justify-center gap-2">📄 Gerar Laudo PDF</button>
                            <button onClick={copiar} className="w-full bg-commandPanel border border-cyberCyan/40 text-cyberCyan font-extrabold py-3.5 rounded-2xl text-xs uppercase shadow-lg cursor-pointer">📋 Copiar Relatório</button>
                        </div>
                        
                        <button onClick={compartilhar} className="w-full bg-gradient-to-r from-amber-600 via-orange-600 to-cyberCyan text-white font-extrabold py-3.5 rounded-2xl text-xs uppercase shadow-xl flex items-center justify-center gap-2 cursor-pointer">🚀 Enviar Relatório + Fotos p/ WhatsApp</button>
                    </div>
                </div>
            );
        }.
