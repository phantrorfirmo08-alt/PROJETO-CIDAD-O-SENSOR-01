<!DOCTYPE html>
<html lang="pt-BR" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SARAH AI Core v4.0 - Defesa Civil Mesquita</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        brand: {
                            dark: "#020617",
                            light: "#f8fafc"
                        }
                    }
                }
            }
        };
    </script>
    <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="">
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#020617">
    <style>
        html,
        body,
        #root {
            min-height: 100%;
            margin: 0;
        }
        body {
            overflow-x: hidden;
        }
        .leaflet-container {
            z-index: 1;
        }
    </style>
</head>
<body class="min-h-screen bg-slate-950 text-slate-100">
    <div id="root"></div>
    <script type="text/babel">
        const CLOUDFLARE_WORKER_URL =
            "https://sarah-envelope.phantrorfirmo08.workers.dev";

        const getBrasiliaGreeting = () => {
            const hour = parseInt(
                new Intl.DateTimeFormat("pt-BR", {
                    timeZone: "America/Sao_Paulo",
                    hour: "numeric",
                    hour12: false
                }).format(new Date()),
                10
            );
            if (hour >= 0 && hour < 5) return "Boa madrugada";
            if (hour >= 5 && hour < 12) return "Bom dia";
            if (hour >= 12 && hour < 18) return "Boa tarde";
            return "Boa noite";
        };

        function App() {
            const [darkMode, setDarkMode] = React.useState(true);
            const [fontSizeLevel, setFontSizeLevel] = React.useState(1);
            const [soundEnabled, setSoundEnabled] = React.useState(true);
            const [isSpeaking, setIsSpeaking] = React.useState(false);
            const [isListening, setIsListening] = React.useState(false);
            const [liveWeather, setLiveWeather] = React.useState(null);
            const [deferredPrompt, setDeferredPrompt] = React.useState(null);
            const [mapOpen, setMapOpen] = React.useState(false);
            const [chartOpen, setChartOpen] = React.useState(false);
            const [termsOpen, setTermsOpen] = React.useState(false);
            const [messages, setMessages] = React.useState([]);
            const [input, setInput] = React.useState("");
            const [isLoadingChat, setIsLoadingChat] = React.useState(false);
            const [hasIntroduced, setHasIntroduced] = React.useState(
                () => localStorage.getItem("sarah_introduced") === "1"
            );

            const speechIdRef = React.useRef(0);
            const voiceTimerRef = React.useRef(null);
            const voicesRef = React.useRef([]);
            const mapRef = React.useRef(null);
            const mapInstanceRef = React.useRef(null);
            const chartRef = React.useRef(null);
            const chartInstanceRef = React.useRef(null);

            const carregarVozes = () => {
                if ("speechSynthesis" in window) {
                    voicesRef.current = window.speechSynthesis.getVoices();
                }
            };

            React.useEffect(() => {
                if (!("speechSynthesis" in window)) return;
                carregarVozes();
                window.speechSynthesis.onvoiceschanged = carregarVozes;
                return () => {
                    window.speechSynthesis.cancel();
                    window.speechSynthesis.onvoiceschanged = null;
                };
            }, []);

            const limparTextoParaFala = (text) => {
                return String(text)
                    .replace(/[#*_`~]/g, "")
                    .replace(/\[(.*?)\]\(.*?\)/g, "$1")
                    .replace(/https?:\/\/\S+/g, "")
                    .replace(/\s+/g, " ")
                    .trim();
            };

            const escolherMelhorVoz = () => {
                const voices = voicesRef.current.length
                    ? voicesRef.current
                    : window.speechSynthesis.getVoices();
                const preferidas = [
                    "Google português do Brasil",
                    "Google Português do Brasil",
                    "Microsoft Francisca",
                    "Microsoft Maria"
                ];
                return (
                    voices.find((voice) =>
                        preferidas.some((name) =>
                            voice.name.toLowerCase().includes(name.toLowerCase())
                        )
                    ) ||
                    voices.find((voice) =>
                        voice.lang.toLowerCase() === "pt-br"
                    ) ||
                    voices.find((voice) =>
                        voice.lang.toLowerCase().startsWith("pt")
                    ) ||
                    voices[0]
                );
            };

            const stopSpeaking = () => {
                speechIdRef.current += 1;
                if (voiceTimerRef.current) {
                    clearTimeout(voiceTimerRef.current);
                    voiceTimerRef.current = null;
                }
                if ("speechSynthesis" in window) {
                    window.speechSynthesis.cancel();
                }
                setIsSpeaking(false);
            };

            const speakText = (text) => {
                if (!soundEnabled || !("speechSynthesis" in window)) return;
                const cleanText = limparTextoParaFala(text);
                if (!cleanText) return;
                stopSpeaking();
                const currentId = speechIdRef.current;
                voiceTimerRef.current = setTimeout(() => {
                    if (currentId !== speechIdRef.current) return;
                    const utterance = new SpeechSynthesisUtterance(cleanText);
                    const voice = escolherMelhorVoz();
                    utterance.lang = "pt-BR";
                    utterance.voice = voice || null;
                    utterance.rate = 0.92;
                    utterance.pitch = 1.02;
                    utterance.volume = 1;
                    utterance.onstart = () => {
                        if (currentId === speechIdRef.current) {
                            setIsSpeaking(true);
                        }
                    };
                    utterance.onend = () => {
                        if (currentId === speechIdRef.current) {
                            setIsSpeaking(false);
                        }
                    };
                    utterance.onerror = () => setIsSpeaking(false);
                    window.speechSynthesis.speak(utterance);
                }, 250);
            };

            React.useEffect(() => {
                if (hasIntroduced) return;
                const greeting = getBrasiliaGreeting();
                const presentation =
                    `${greeting}, meu nome é Sara, assistente meteorológica ` +
                    `do projeto Cidadão Sensor. Em que posso ajudar?`;
                const timer = setTimeout(() => {
                    if (!soundEnabled) return;
                    setHasIntroduced(true);
                    localStorage.setItem("sarah_introduced", "1");
                    speakText(presentation);
                }, 700);
                return () => clearTimeout(timer);
            }, [hasIntroduced, soundEnabled]);

            React.useEffect(() => {
                const handleBeforeInstall = (event) => {
                    event.preventDefault();
                    setDeferredPrompt(event);
                };
                window.addEventListener(
                    "beforeinstallprompt",
                    handleBeforeInstall
                );
                return () => {
                    window.removeEventListener(
                        "beforeinstallprompt",
                        handleBeforeInstall
                    );
                };
            }, []);

            const handleInstallApp = async () => {
                if (!deferredPrompt) {
                    alert(
                        "Para instalar o aplicativo, abra o menu do navegador e selecione Adicionar à tela inicial ou Instalar aplicativo."
                    );
                    return;
                }
                deferredPrompt.prompt();
                await deferredPrompt.userChoice;
                setDeferredPrompt(null);
            };

            const handleShareLink = async () => {
                const shareData = {
                    title: "SARAH AI Core v4.0 - Defesa Civil Mesquita",
                    text: "Monitoramento preventivo da Bacia do Rio Sarapuí.",
                    url: window.location.href
                };
                if (navigator.share) {
                    try {
                        await navigator.share(shareData);
                    } catch (error) {
                        console.log("Compartilhamento cancelado.");
                    }
                } else if (navigator.clipboard) {
                    await navigator.clipboard.writeText(window.location.href);
                    alert("Link copiado para a área de transferência.");
                }
            };

            React.useEffect(() => {
                fetch(
                    "https://api.open-meteo.com/v1/forecast" +
                    "?latitude=-22.7845&longitude=-43.4140" +
                    "&current=temperature_2m,relative_humidity_2m,precipitation,weather_code"
                )
                    .then((response) => response.json())
                    .then((data) => {
                        if (data && data.current) {
                            setLiveWeather(data.current);
                        }
                    })
                    .catch((error) => {
                        console.warn("Clima indisponível:", error);
                    });
            }, []);

            React.useEffect(() => {
                document.documentElement.classList.toggle("dark", darkMode);
                document.documentElement.classList.toggle("light", !darkMode);
            }, [darkMode]);

            React.useEffect(() => {
                if (mapOpen && mapRef.current && !mapInstanceRef.current) {
                    const lat = -22.7845;
                    const lng = -43.4140;
                    const map = L.map(mapRef.current).setView(
                        [lat, lng],
                        16
                    );
                    L.tileLayer(
                        "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
                        {
                            maxZoom: 19,
                            attribution:
                                "© OpenStreetMap contributors | SARAH AI Core v4.0"
                        }
                    ).addTo(map);
                    L.marker([lat, lng])
                        .addTo(map)
                        .bindPopup(
                            "<b>Setor de referência:</b> " +
                            "Comunidade do Sebinho - Rocha Sobrinho, Mesquita"
                        )
                        .openPopup();
                    mapInstanceRef.current = map;
                }
                if (mapOpen && mapInstanceRef.current) {
                    setTimeout(() => {
                        mapInstanceRef.current?.invalidateSize();
                    }, 100);
                }
                if (!mapOpen && mapInstanceRef.current) {
                    mapInstanceRef.current.remove();
                    mapInstanceRef.current = null;
                }
            }, [mapOpen]);

            React.useEffect(() => {
                return () => {
                    if (mapInstanceRef.current) {
                        mapInstanceRef.current.remove();
                        mapInstanceRef.current = null;
                    }
                    if (chartInstanceRef.current) {
                        chartInstanceRef.current.destroy();
                        chartInstanceRef.current = null;
                    }
                };
            }, []);

            React.useEffect(() => {
                if (!chartOpen || !chartRef.current) return;

                if (chartInstanceRef.current) {
                    chartInstanceRef.current.destroy();
                    chartInstanceRef.current = null;
                }

                const ctx = chartRef.current.getContext("2d");

                chartInstanceRef.current = new Chart(ctx, {
                    type: "line",
                    data: {
                        labels: [
                            "00:00",
                            "03:00",
                            "06:00",
                            "09:00",
                            "12:00",
                            "15:00",
                            "18:00",
                            "Atual"
                        ],
                        datasets: [
                            {
                                label: "Cota do Rio Sarapuí (m)",
                                data: [
                                    0.8,
                                    0.9,
                                    0.85,
                                    0.92,
                                    1.1,
                                    1.0,
                                    0.95,
                                    liveWeather
                                        ? 0.9 +
                                          Number(liveWeather.precipitation || 0) *
                                              0.2
                                        : 0.9
                                ],
                                borderColor: "#06b6d4",
                                backgroundColor: "rgba(6, 182, 212, 0.1)",
                                borderWidth: 2,
                                fill: true,
                                tension: 0.3
                            }
                        ]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        scales: {
                            y: {
                                beginAtZero: true,
                                max: 4,
                                grid: {
                                    color: "rgba(148, 163, 184, 0.1)"
                                },
                                ticks: {
                                    color: "#94a3b8",
                                    font: {
                                        family: "monospace",
                                        size: 10
                                    }
                                }
                            },
                            x: {
                                grid: {
                                    color: "rgba(148, 163, 184, 0.1)"
                                },
                                ticks: {
                                    color: "#94a3b8",
                                    font: {
                                        family: "monospace",
                                        size: 10
                                    }
                                }
                            }
                        },
                        plugins: {
                            legend: {
                                labels: {
                                    color: "#e2e8f0",
                                    font: {
                                        family: "monospace",
                                        size: 11
                                    }
                                }
                            }
                        }
                    }
                });

                return () => {
                    if (chartInstanceRef.current) {
                        chartInstanceRef.current.destroy();
                        chartInstanceRef.current = null;
                    }
                };
            }, [chartOpen, liveWeather]);

            const toggleListening = () => {
                const SpeechRec =
                    window.SpeechRecognition ||
                    window.webkitSpeechRecognition;

                if (!SpeechRec) {
                    alert(
                        "Seu navegador não suporta reconhecimento de voz."
                    );
                    return;
                }

                if (isListening) {
                    setIsListening(false);
                    return;
                }

                const rec = new SpeechRec();

                rec.lang = "pt-BR";
                rec.interimResults = false;
                rec.continuous = false;

                rec.onstart = () => setIsListening(true);

                rec.onresult = (event) => {
                    const text =
                        event.results[0][0].transcript;

                    setInput(text);
                    setIsListening(false);
                    handleSendMessage(text);
                };

                rec.onerror = () => setIsListening(false);
                rec.onend = () => setIsListening(false);

                rec.start();
            };

            const handleSendMessage = async (textCustom) => {
                stopSpeaking();

                const textToSend =
                    textCustom !== undefined ? textCustom : input;

                if (!textToSend.trim() || isLoadingChat) return;

                const userMsg = {
                    id: `${Date.now()}-user`,
                    sender: "user",
                    text: textToSend.trim(),
                    timestamp: new Date().toLocaleTimeString("pt-BR", {
                        hour: "2-digit",
                        minute: "2-digit"
                    })
                };

                const historico = [
                    ...messages,
                    userMsg
                ]
                    .slice(-8)
                    .map((message) => ({
                        role:
                            message.sender === "user"
                                ? "user"
                                : "assistant",
                        content: message.text
                    }));

                setMessages((previous) => [
                    ...previous,
                    userMsg
                ]);

                setInput("");
                setIsLoadingChat(true);const weatherContext = liveWeather
    ? `Dados meteorológicos atuais para Mesquita/RJ: temperatura ${liveWeather.temperature_2m}°C, umidade ${liveWeather.relative_humidity_2m}%, precipitação ${liveWeather.precipitation} mm.`
    : "Dados meteorológicos temporariamente indisponíveis.";

try {
    const response = await fetch(
        CLOUDFLARE_WORKER_URL,
        {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                model: "llama-3.3-70b-versatile",
                messages: [
                    {
                        role: "system",
                        content:
                            `Você é a SARAH AI Core v4.0, assistente de monitoramento preventivo, telemetria, Defesa Civil Comunitária, programas sociais e habitacionais da Bacia do Rio Sarapuí, em Mesquita/RJ. ${weatherContext}

Responda em português do Brasil, de forma clara, objetiva e responsável.
Não invente alertas oficiais, medições ou informações jurídicas.
Não solicite nem revele chaves, senhas ou dados pessoais.
Não mencione nomes de usuários.
Não se reapresente em todas as respostas.
Em situações de risco imediato, oriente o usuário a procurar um local seguro e acionar a Defesa Civil pelo número 199 ou os serviços de emergência locais.`
                    },
                    ...historico
                ],
                temperature: 0.6,
                max_tokens: 900
            })
        }
    );

    const responseText = await response.text();

    let data;

    try {
        data = JSON.parse(responseText);
    } catch {
        throw new Error(
            "O Worker retornou uma resposta inválida."
        );
    }

    if (!response.ok) {
        throw new Error(
            data?.error ||
            `Erro do servidor (${response.status}).`
        );
    }

    const reply =
        data?.choices?.[0]?.message?.content ||
        data?.message ||
        data?.reply;

    if (!reply) {
        throw new Error(
            "A IA não retornou uma mensagem."
        );
    }

    const assistantMsg = {
        id: `${Date.now()}-assistant`,
        sender: "sarah",
        text: reply,
        timestamp: new Date().toLocaleTimeString(
            "pt-BR",
            {
                hour: "2-digit",
                minute: "2-digit"
            }
        )
    };

    setMessages((previous) => [
        ...previous,
        assistantMsg
    ]);

    speakText(reply);
} catch (error) {
    console.error(
        "Erro na comunicação com Cloudflare/Groq:",
        error
    );

    const fallbackReply =
        "Não foi possível conectar ao agente de inteligência artificial agora. Verifique se o Worker está publicado e tente novamente.";

    const errorMsg = {
        id: `${Date.now()}-error`,
        sender: "sarah",
        text: fallbackReply,
        timestamp: new Date().toLocaleTimeString(
            "pt-BR",
            {
                hour: "2-digit",
                minute: "2-digit"
            }
        )
    };

    setMessages((previous) => [
        ...previous,
        errorMsg
    ]);

    speakText(fallbackReply);
} finally {
    setIsLoadingChat(false);
}
};

const getFontSizeClass = () => {
switch (fontSizeLevel) {
    case 0:
        return "text-xs";
    case 2:
        return "text-base";
    case 3:
        return "text-lg";
    default:
        return "text-sm";
}
};

return (
<div
    className={`min-h-screen ${
        darkMode
            ? "bg-slate-950 text-slate-100"
            : "bg-slate-100 text-slate-900"
    } ${getFontSizeClass()} transition-colors duration-300 flex flex-col`}
>
    <div className="flex-1">
        <header className="bg-slate-900/95 border-b border-cyan-500/30 px-3 py-3 backdrop-blur-md sticky top-0 z-40 shadow-lg">
            <div className="max-w-4xl mx-auto flex flex-col md:flex-row items-center justify-between gap-3">
                <div className="flex items-center gap-2 w-full md:w-auto">
                    <div className="w-2.5 h-2.5 rounded-full bg-emerald-400 animate-pulse"></div>
                    <span className="font-mono text-xs font-bold text-cyan-300">
                        SARAH AI • Cofre Groq Seguro
                    </span>
                </div>

                <div className="flex items-center gap-1.5 flex-wrap justify-end">
                    <button
                        onClick={() => setMapOpen(true)}
                        className="px-2.5 py-1.5 bg-slate-800 hover:bg-slate-700 text-cyan-400 border border-cyan-500/30 rounded text-xs font-mono"
                    >
                        🗺️ Mapa
                    </button>

                    <button
                        onClick={() => setChartOpen(true)}
                        className="px-2.5 py-1.5 bg-slate-800 hover:bg-slate-700 text-cyan-400 border border-cyan-500/30 rounded text-xs font-mono"
                    >
                        📈 Gráfico
                    </button>

                    <button
                        onClick={() =>
                            setDarkMode((value) => !value)
                        }
                        className="px-2.5 py-1.5 bg-slate-800 hover:bg-slate-700 text-amber-400 border border-cyan-500/30 rounded text-xs font-mono"
                    >
                        {darkMode ? "☀️" : "🌙"}
                    </button>

                    <div className="flex bg-slate-800 border border-cyan-500/30 rounded overflow-hidden">
                        <button
                            onClick={() =>
                                setFontSizeLevel((value) =>
                                    Math.max(0, value - 1)
                                )
                            }
                            className="px-2 py-1 text-slate-300 hover:bg-slate-700 text-xs font-mono font-bold"
                        >
                            A-
                        </button>

                        <button
                            onClick={() =>
                                setFontSizeLevel((value) =>
                                    Math.min(3, value + 1)
                                )
                            }
                            className="px-2 py-1 text-slate-300 hover:bg-slate-700 text-xs font-mono font-bold"
                        >
                            A+
                        </button>
                    </div>

                    <button
                        onClick={handleShareLink}
                        className="px-2.5 py-1.5 bg-slate-800 hover:bg-slate-700 text-emerald-400 border border-emerald-500/30 rounded text-xs font-mono"
                    >
                        🔗 Compartilhar
                    </button>

                    <button
                        onClick={handleInstallApp}
                        className="px-2.5 py-1.5 bg-emerald-600 hover:bg-emerald-500 text-white rounded text-xs font-mono font-bold"
                    >
                        📥 Baixar App
                    </button>
                </div>
            </div>
        </header>

        <div className="bg-slate-900/60 border-b border-slate-800 px-4 py-2 text-xs font-mono text-slate-400 flex flex-wrap items-center justify-between gap-2 max-w-4xl mx-auto">
            <div className="flex items-center gap-3">
                <span className="flex items-center gap-1 text-cyan-400">
                    <span className="w-2 h-2 rounded-full bg-cyan-400 animate-pulse"></span>
                    Internet (Open-Meteo) • Sebinho / Mesquita
                </span>

                {liveWeather && (
                    <span className="hidden sm:inline text-slate-300">
                        🌡️ {liveWeather.temperature_2m}°C |
                        💧 {liveWeather.relative_humidity_2m}% |
                        🌧️ {liveWeather.precipitation} mm
                    </span>
                )}
            </div>

            <div className="flex items-center gap-3">
                <button
                    onClick={
                        isSpeaking
                            ? stopSpeaking
                            : () =>
                                  setSoundEnabled(
                                      (value) => !value
                                  )
                    }
                    className={`px-2.5 py-1 rounded text-xs font-mono border ${
                        isSpeaking
                            ? "bg-amber-500/20 text-amber-300 border-amber-500/40 animate-pulse"
                            : soundEnabled
                            ? "bg-cyan-500/20 text-cyan-400 border-cyan-500/30"
                            : "bg-slate-800 text-slate-500 border-slate-700"
                    }`}
                >
                    {isSpeaking
                        ? "⏹ Parar fala"
                        : soundEnabled
                        ? "🔊 Voz ativa"
                        : "🔇 Voz desligada"}
                </button>

                <button
                    onClick={() => setTermsOpen(true)}
                    className="text-cyan-400 hover:underline text-[11px]"
                >
                    Termos Legais / G.C.E.
                </button>
            </div>
        </div>

        <main className="max-w-4xl mx-auto p-3 sm:p-4 w-full">
            <div
                className="bg-slate-900/80 border border-cyan-500/30 rounded-xl shadow-xl flex flex-col overflow-hidden backdrop-blur-md"
                style={{
                    height: "calc(100vh - 180px)",
                    minHeight: "420px"
                }}
            >
                <div className="flex-1 overflow-y-auto p-4 space-y-4">
                    {messages.length === 0 && (
                        <div className="h-full flex flex-col items-center justify-center text-center p-6 text-slate-400 font-mono">
                            <div className="w-16 h-16 rounded-2xl bg-cyan-500/10 border border-cyan-500/30 flex items-center justify-center text-cyan-400 text-2xl mb-3 shadow-lg animate-pulse">
                                🤖
                            </div>

                            <p className="text-sm font-bold text-cyan-300 mb-1">
                                SARAH AI Core v4.0
                            </p>

                            <p className="text-xs text-slate-400 max-w-sm">
                                Digite sua pergunta ou use o
                                microfone para conversar.
                            </p>
                        </div>
                    )}

                    {messages.map((message) => (
                        <div
                            key={message.id}
                            className={`flex items-start gap-3 ${
                                message.sender === "user"
                                    ? "flex-row-reverse"
                                    : "flex-row"
                            }`}
                        >
                            <div
                                className={`w-9 h-9 rounded-xl flex items-center justify-center shrink-0 shadow-md ${
                                    message.sender === "user"
                                        ? "bg-slate-700 text-cyan-300"
                                        : "bg-gradient-to-tr from-cyan-600 to-teal-500 text-white border border-cyan-400/40"
                                }`}
                            >
                                {message.sender === "user"
                                    ? "👤"
                                    : "🤖"}
                            </div>

                            <div
                                className={`p-3.5 rounded-2xl max-w-[85%] leading-relaxed shadow-md font-sans ${
                                    message.sender === "user"
                                        ? "bg-cyan-600 text-white rounded-tr-none"
                                        : "bg-slate-800/90 text-slate-100 border border-slate-700/60 rounded-tl-none"
                                }`}
                            >
                                <div className="flex items-center justify-between gap-4 mb-1 text-[10px] opacity-75 font-mono">
                                    <span>
                                        {message.sender ===
                                        "user"
                                            ? "Você"
                                            : "SARAH AI • Defesa Civil"}
                                    </span>
                                    <span>
                                        {message.timestamp}
                                    </span>
                                </div>

                                <div className="whitespace-pre-wrap break-words">
                                    {message.text}
                                </div>
                            </div>
                        </div>
                    ))}

                    {isLoadingChat && (
                        <div className="flex items-center gap-3">
                            <div className="w-9 h-9 rounded-xl bg-cyan-600 flex items-center justify-center text-white animate-pulse">
                                🤖
                            </div>

                            <div className="bg-slate-800 p-3 rounded-2xl text-xs font-mono text-cyan-400 animate-pulse border border-cyan-500/30">
                                SARAH está processando...
                            </div>
                        </div>
                    )}
                </div>

                <div className="p-3 bg-slate-950/90 border-t border-slate-800 flex items-center gap-2">
                    <button
                        onClick={toggleListening}
                        className={`w-10 h-10 rounded-xl flex items-center justify-center transition border shrink-0 ${
                            isListening
                                ? "bg-cyan-500 text-slate-950 border-cyan-400 animate-pulse"
                                : "bg-slate-900 hover:bg-slate-800 text-cyan-400 border-cyan-500/30"
                        }`}
                        title="Comando por voz"
                    >
                        🎤
                    </button>

                    <input
                        type="text"
                        value={input}
                        onChange={(event) =>
                            setInput(event.target.value)
                        }
                        onKeyDown={(event) => {
                            if (event.key === "Enter") {
                                handleSendMessage();
                            }
                        }}
                        placeholder="Digite sua mensagem..."
                        className="flex-1 bg-slate-900 border border-slate-700 rounded-xl px-4 py-2.5 text-sm text-slate-100 focus:outline-none focus:border-cyan-500 shadow-inner"
                    />

                    <button
                        onClick={() => handleSendMessage()}
                        disabled={
                            isLoadingChat || !input.trim()
                        }
                        className="px-5 py-2.5 bg-cyan-500 hover:bg-cyan-400 text-slate-950 font-bold rounded-xl text-sm transition shadow-lg shrink-0 disabled:opacity-50"
                    >
                        Enviar 🚀
                    </button>
                </div>
            </div>
        </main>
    </div>

    {mapOpen && (
        <div className="fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-50 flex items-center justify-center p-4">
            <div className="bg-slate-900 border border-cyan-500/40 w-full max-w-2xl rounded-2xl shadow-2xl overflow-hidden">
                <div className="bg-slate-950 px-4 py-3 border-b border-slate-800 flex justify-between items-center">
                    <h3 className="font-mono text-cyan-400 text-sm font-bold">
                        🗺️ Monitoramento Geográfico • Sebinho
                    </h3>

                    <button
                        onClick={() => setMapOpen(false)}
                        className="text-slate-400 hover:text-white font-mono text-sm px-2 py-1 rounded bg-slate-800"
                    >
                        ✕ Fechar
                    </button>
                </div>

                <div className="p-4 bg-slate-900">
                    <div
                        ref={mapRef}
                        className="w-full h-80 rounded-xl border border-cyan-500/30"
                    ></div>

                    <p className="text-xs text-slate-400 font-mono mt-3">
                        📍 Coordenadas de referência:
                        -22.7845, -43.4140.
                    </p>
                </div>
            </div>
        </div>
    )}

    {chartOpen && (
        <div className="fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-50 flex items-center justify-center p-4">
            <div className="bg-slate-900 border border-cyan-500/40 w-full max-w-2xl rounded-2xl shadow-2xl overflow-hidden">
                <div className="bg-slate-950 px-4 py-3 border-b border-slate-800 flex justify-between items-center">
                    <h3 className="font-mono text-cyan-400 text-sm font-bold">
                        📈 Telemetria do Rio Sarapuí
                    </h3>

                    <button
                        onClick={() => setChartOpen(false)}
                        className="text-slate-400 hover:text-white font-mono text-sm px-2 py-1 rounded bg-slate-800"
                    >
                        ✕ Fechar
                    </button>
                </div>

                <div className="p-4 bg-slate-900">
                    <div className="w-full h-72">
                        <canvas ref={chartRef}></canvas>
                    </div>

                    <p className="text-xs text-slate-400 font-mono mt-3">
                        📊 Dados meteorológicos e simulação
                        preventiva.
                    </p>
                </div>
            </div>
        </div>
    )}

    {termsOpen && (
        <div className="fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-50 flex items-center justify-center p-4">
            <div className="bg-slate-900 border border-cyan-500/40 w-full max-w-xl rounded-2xl shadow-2xl overflow-hidden">
                <div className="bg-slate-950 px-4 py-3 border-b border-slate-800 flex justify-between items-center">
                    <h3 className="font-mono text-cyan-400 text-sm font-bold">
                        ⚖️ Diretrizes Legais & G.C.E. ACE
                    </h3>

                    <button
                        onClick={() => setTermsOpen(false)}
                        className="text-slate-400 hover:text-white font-mono text-sm px-2 py-1 rounded bg-slate-800"
                    >
                        ✕ Fechar
                    </button>
                </div>

                <div className="p-5 bg-slate-900 text-xs text-slate-300 space-y-3 leading-relaxed">
                    <p>
                        <strong>SARAH AI Core v4.0</strong>{" "}
                        oferece suporte técnico comunitário,
                        monitoramento preventivo e informações
                        gerais para Mesquita/RJ.
                    </p>

                    <p>
                        As informações exibidas não substituem
                        comunicados oficiais da Defesa Civil,
                        atendimento médico, jurídico ou
                        serviços de emergência.
                    </p>

                    <p>
                        Em caso de risco imediato, procure um
                        local seguro 
e acione a Defesa Civil
                        pelo número 199 ou os serviços de
                        emergência locais.
                    </p>
                </div>
            </div>
        </div>
    )}

    <footer className="bg-slate-950 border-t border-slate-900 py-3 px-4 text-center text-xs font-mono text-slate-500">
        SARAH AI Core v4.0 • Defesa Civil Mesquita • Bacia do
        Rio Sarapuí / Sebinho
    </footer>
</div>
);
}

const root = ReactDOM.createRoot(
document.getElementById("root")
);

root.render(<App />);

if ("serviceWorker" in navigator) {
window.addEventListener("load", () => {
    navigator.serviceWorker.register("sw.js").catch((error) => {
        console.warn("Service Worker não registrado:", error);
    });
});
}
</script>
</body>
</html>
