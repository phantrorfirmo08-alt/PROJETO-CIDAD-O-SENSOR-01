        function FieldReportModule({ onBackToDashboard, showToast }) {
            const [municipio, setMunicipio] = useState("Mesquita");
            const [setor, setSetor] = useState("🤝 NUPDECs - 92 Municípios RJ [Individual]");
            const [equipe, setEquipe] = useState("Coletivo Esperança Rocha Sobrinho");
            const [nivelRisco, setNivelRisco] = useState("🟢 Risco Baixo / Monitoramento");
            const [agente, setAgente] = useState("");
            const [local, setLocal] = useState("");
            const [desc, setDesc] = useState("");
            const [gps, setGps] = useState({lt:'', ln:'', lk:''});
            const [gpsSt, setGpsSt] = useState("📍 GPS em espera");
            const [hash, setHash] = useState("Calculando...");
            const [ocorrencias, setOcorrencias] = useState({deslizamento:false, alagamento:false, trincas:false, arvore:false, valao:false});
            const [fotos, setFotos] = useState([{id:1, file:null, preview:null},{id:2, file:null, preview:null},{id:3, file:null, preview:null},{id:4, file:null, preview:null}]);
            
            const protocolo = useMemo(()=>`CPARC-RRD92-${municipio.substring(0,3).toUpperCase()}-2026-${Math.floor(1000+Math.random()*9000)}`,[municipio]);

            const getEquipeFinal = () => {
                let base = setor;
                if(equipe.trim() !== "") { base = `${base} | ${equipe.trim()}`; }
                return base;
            };

            useEffect(()=>{
                (async()=>{
                    try{
                        const str = municipio + setor + equipe + nivelRisco + agente + local + desc + protocolo + JSON.stringify(ocorrencias);
                        const buf = new TextEncoder().encode(str);
                        const hb = await crypto.subtle.digest('SHA-256', buf);
                        const hex = Array.from(new Uint8Array(hb)).map(b => b.toString(16).padStart(2,'0')).join('');
                        setHash(hex.substring(0,32)+"...");
                    }catch(e){setHash("sha256-secure-fallback");}
                })();
            },[municipio, setor, equipe, nivelRisco, agente, local, desc, protocolo, ocorrencias]);

            const capturarGps = () => {
                if(!navigator.geolocation) return showToast("⚠️ Sem GPS");
                showToast("🛰 Buscando GPS...");
                navigator.geolocation.getCurrentPosition(p => {
                    const lt = p.coords.latitude.toFixed(6), ln = p.coords.longitude.toFixed(6), lk = `https://www.google.com/maps?q=${lt},${ln}`;
                    setGps({lt, ln, lk}); setLocal(`${lt},${ln}`); setGpsSt("✅ GPS Fixado"); showToast("📍 GPS OK!");
                }, () => setGpsSt("⚠ Erro GPS"), {enableHighAccuracy:true, timeout:10000});
            };

            const processar = (file, gpsInfo, ag, loc, eqFinal, muni) => new Promise((res, rej) => {
                const rd = new FileReader();
                rd.onload = e => {
                    const img = new Image();
                    img.onload = () => {
                        const cv = document.createElement('canvas'); const MAX = 600;
                        let w = img.width, h = img.height;
                        if(w > MAX || h > MAX){if(w > h){h = Math.round(h * MAX / w); w = MAX;}else{w = Math.round(w * MAX / h); h = MAX;}}
                        cv.width = w; cv.height = h; const ctx = cv.getContext('2d');
                        ctx.drawImage(img, 0, 0, w, h);
                        const dt = new Intl.DateTimeFormat('pt-BR',{dateStyle:'short',timeStyle:'medium',timeZone:'America/Sao_Paulo'}).format(new Date());
                        const ct = gpsInfo.lt ? `${gpsInfo.lt},${gpsInfo.ln}` : (loc || 'Local não fixado');
                        let sigla = "CPARC";
                        if(eqFinal.includes("NUPDECs")) sigla = "NUPDECs";
                        else if(eqFinal.includes("Cidadão Sensor")) sigla = "CIDADÃO SENSOR";
                        else if(eqFinal.includes("Bom Dia")) sigla = "BOM DIA COMUNIDADE";
                        else if(eqFinal.includes("GADE")) sigla = "GADE";
                        const fs = Math.max(10, Math.round(w * 0.028)), pad = 8, lh = fs + 4, bh = lh * 4 + pad * 2;
                        ctx.font = `bold ${fs}px sans-serif`;
                        ctx.fillStyle = 'rgba(6,11,24,0.92)'; ctx.fillRect(0, h - bh, w, bh);
                        ctx.fillStyle = '#00F2FE'; ctx.fillRect(0, h - bh, w, 2);
                        ctx.shadowColor = 'rgba(0,0,0,1)'; ctx.shadowBlur = 4;
                        let y = h - bh + pad + fs;
                        ctx.fillStyle = '#00F2FE'; ctx.fillText(`📅 ${dt} | ${muni.toUpperCase()}-RJ | ${sigla}`, pad, y);
                        ctx.fillStyle = '#FFFFFF'; ctx.fillText(`📍 GPS: ${ct}`, pad, y + lh);
                        ctx.fillStyle = '#94A3B8'; ctx.fillText(`👤 Resp.: ${ag || 'Equipe de Campo'}`, pad, y + lh * 2);
                        ctx.fillStyle = '#FFB86A'; ctx.fillText(`👥 Equipe: ${eqFinal.slice(0,62)}`, pad, y + lh * 3);
                        cv.toBlob(b => {
                            if(!b) return rej();
                            const f = new File([b], `vistoria_${sigla.toLowerCase()}_${Date.now()}.jpg`, {type:'image/jpeg'});
                            res({compressedFile:f, preview:cv.toDataURL('image/jpeg', 0.5)});
                        }, 'image/jpeg', 0.5);
                    };
                    img.onerror = () => rej();
                    img.src = e.target.result;
                };
                rd.onerror = () => rej();
                rd.readAsDataURL(file);
            });

            const handleFoto = async (i, e) => {
                const file = e.target.files[0]; if(!file) return; e.target.value = "";
                showToast(`🔄 Otimizando foto ${i+1}...`);
                try{
                    const {compressedFile, preview} = await processar(file, gps, agente, local, getEquipeFinal(), municipio);
                    setFotos(p => {const n = [...p]; n[i] = {id:n[i].id, file:compressedFile, preview}; return n;});
                    showToast(`📸 Foto ${i+1} CARIMBADA!`);
                }catch(err){showToast("❌ Erro ao processar foto");}
            };

            const apagar = (i, e) => {

            const getOcorrenciasTexto = () => {
                const l = [];
                if(ocorrencias.deslizamento) l.push("• Deslizamento / Escorregamento");

                if(ocorrencias.trincas) l.push("• Trincas / Rachaduras Estruturais");
                if(ocorrencias.arvore) l.push("• Queda de Árvore / Risco Elétrico");
                if(ocorrencias.valao) l.push("• Obstrução de Bueiro / Valão");
                return l.length > 0 ? l.join("\n") : "• Nenhuma categoria marcada";
            };

            const montarTexto = () => {
                const c = fotos.filter(f => f.file).length;
                const dh = new Intl.DateTimeFormat('pt-BR',{dateStyle:'short',timeStyle:'medium',timeZone:'America/Sao_Paulo'}).format(new Date());
                return `🛡️ *LAUDO DE VISTORIA CIBERNÉTICA • RRD-92 + CPARC v13.0* 🛡️\n━━━━━━━━━━━━━━━━━━━━━━\n📌 *Protocolo:* \`${protocolo}\`\n📍 *Município:* ${municipio}-RJ\n🏛 *Setor / Instituição:* ${setor}\n👥 *Equipe / Iniciativa:* ${equipe||'Não informada'} [CARIMBADA]\n⚠️ *Nível de Risco:* ${nivelRisco}\n👤 *Responsável:* ${agente||'Não informado'}\n📅 *Data/Hora:* ${dh}\n📍 *Localidade:* ${local||'Não informada'}\n${gps.lk?`🔗 *Google Maps:* ${gps.lk}\n`:``}━━━━━━━━━━━━━━━━━━━━━━\n📋 *Tipos de Ocorrência:*\n${getOcorrenciasTexto()}\n━━━━━━━━━━━━━━━━━━━━━━\n📸 *Evidências:* ${c}/4 fotos carimbadas\n📝 *Relato:*\n${desc||'Sem descrição.'}\n━━━━━━━━━━━━━━━━━━━━━━\n🔒 *Hash SHA-256:* \`${hash}\`\n⚡ *GADE • RRD-92 + CPARC v13.0*`;
            };

            const gerarPdf = async () => {
                showToast("📄 Gerando PDF oficial...");
                try{
                    const jsPDFModule = window.jspdf ? window.jspdf.jsPDF : window.jsPDF;
                    if(!jsPDFModule) return showToast("⚠️ Biblioteca PDF indisponível");
                    const doc = new jsPDFModule({unit:'mm', format:'a4'}), m = 15; let y = 20;
                    doc.setFillColor(2,4,10); doc.rect(0,0,210,297,"F");
                    doc.setTextColor(0,242,254); doc.setFontSize(14); doc.setFont("helvetica","bold");
                    doc.text("LAUDO TÉCNICO OFICIAL - VISTORIA CIBERNÉTICA", m, y);
                    y+=7; doc.setFontSize(9); doc.setTextColor(16,185,129);
                    doc.text(`RRD-92 (92 MUNICÍPIOS) + CPARC v13.0 • ${municipio}-RJ • NUPDECs INDIVIDUAL`, m, y);
                    y+=10; doc.setDrawColor(0,242,254); doc.line(m, y, 195, y); y+=8;
                    doc.setFontSize(9); doc.setTextColor(255,255,255); doc.setFont("helvetica","normal");
                    doc.text(`Protocolo: ${protocolo}`, m, y); doc.text(`Data: ${new Date().toLocaleString('pt-BR')}`, m+95, y); y+=6;
                    doc.text(`Município: ${municipio}-RJ`, m, y); y+=6;
                    doc.text(`Setor: ${setor}`, m, y); y+=6;
                    const eqL = doc.splitTextToSize(`Equipe / Iniciativa [CARIMBADA]: ${equipe}`, 180);
                    doc.setTextColor(255,184,106); doc.text(eqL, m, y); y+= eqL.length * 5 + 2;
                    doc.setTextColor(255,255,255);
                    doc.text(`Nível de Risco: ${nivelRisco}`, m, y); doc.text(`Responsável: ${agente||'Não informado'}`, m+95, y); y+=6;
                    doc.text(`Localidade: ${local||'Não informada'}`, m, y); y+=6;
                    if(gps.lk){doc.setTextColor(0,242,254); doc.text(`Maps: ${gps.lk}`, m, y); y+=6; doc.setTextColor(255,255,255);}
                    y+=4; doc.setTextColor(0,242,254); doc.setFont("helvetica","bold"); doc.text("CHECKLIST DE OCORRÊNCIAS:", m, y); y+=6;
                    doc.setFont("helvetica","normal"); doc.setTextColor(255,255,255);
                    getOcorrenciasTexto().split('\n').forEach(l => {doc.text(l, m+5, y); y+=5;});
                    y+=4; doc.setTextColor(0,242,254); doc.setFont("helvetica","bold"); doc.text("RELATO TÉCNICO:", m, y); y+=6;
                    doc.setFont("helvetica","normal"); doc.setTextColor(255,255,255);
                    const sp = doc.splitTextToSize(desc||'Sem descrição', 180); doc.text(sp, m, y); y+= sp.length * 5 + 8;
                    doc.setFillColor(13,21,45); doc.roundedRect(m, y, 180, 14, 2, 2, "F");
                    doc.setFontSize(8); doc.setTextColor(0,242,254); doc.text("HASH SHA-256 INTEGRIDADE + EQUIPE CARIMBADA:", m+4, y+4.5);
                    doc.setTextColor(255,255,255); doc.text(`${hash} | ${equipe}`, m+4, y+10); y+=20;
                    const fv = fotos.filter(f => f.preview);
                    if(fv.length > 0){
                        if(y > 170){doc.addPage(); y=20;}
                        doc.setTextColor(0,242,254); doc.setFont("helvetica","bold"); doc.setFontSize(10);
                        doc.text("EVIDÊNCIAS FOTOGRÁFICAS CARIMBADAS:", m, y); y+=6;
                        let x = m, sy = y, mh = 0;
                        fv.forEach((f, i) => {
                            if(x + 40 > 195){x = m; sy += mh + 12; mh = 0;}
                            if(sy > 230){doc.addPage(); sy = 20; x = m;}
                            try{doc.addImage(f.preview, 'JPEG', x, sy, 40, 40); doc.setFontSize(7); doc.setTextColor(255,255,255); doc.text(`Foto ${i+1} - ${equipe.slice(0,15)}`, x, sy+44); x+=46; mh=46;}catch(e){}
                        });
                    }
                    doc.save(`Laudo_CIBERNETICO_${protocolo}.pdf`);
                    showToast("✅ PDF gerado com sucesso!");
                }catch(e){showToast("❌ Erro ao gerar PDF");}
            };

            const compartilhar = async () => {
                const txt = montarTexto(), files = fotos.filter(f => f.file).map(f => f.file);
                if(navigator.canShare){
                    try{
                        const d = {title:'Laudo Cibernético', text:txt, files:files.length?files:undefined};
                        if(navigator.canShare(d)){await navigator.share(d); showToast("✅ Compartilhado!"); return;}
                    }catch(err){if(err.name==='AbortError') return;}
                }
                try{await navigator.clipboard.writeText(txt);}catch(e){}
                if(files.length > 0){files.forEach((f, i)=>{const a = document.createElement('a'); a.href = URL.createObjectURL(f); a.download = `vistoria_${municipio}_${i+1}.jpg`; a.click();});}
                showToast("📋 Copiado + fotos baixadas!");
                setTimeout(()=>window.open(`https://wa.me/?text=${encodeURIComponent(txt)}`, '_blank'), 800);
            };

            return (
                <div className="space-y-4 animate-fade-in pb-12">
                    <div className="flex items-center justify-between cyber-card p-4 rounded-2xl">
                        <button onClick={onBackToDashboard} className="px-3 py-1.5 bg-cyberCyan/20 text-cyberCyan border border-cyberCyan/40 rounded-xl font-bold text-xs cursor-pointer hover:bg-cyberCyan hover:text-void transition">
                            ◀ Voltar ao Command Center
                        </button>
                        <span className="font-mono text-[10px] text-cyberGreen px-2.5 py-1 bg-cyberGreen/10 rounded-xl border border-cyberGreen/30">RRD-92 + CPARC v13.0</span>
                    </div>

                    <div className="cyber-card p-6 rounded-3xl space-y-4 shadow-2xl">
                        <div className="space-y-1">
                            <label className="text-[10px] font-bold text-cyberCyan uppercase">Município (92 Municípios RJ) - RRD</label>
                            <select value={municipio} onChange={e=>setMunicipio(e.target.value)} className="w-full bg-void border border-cyberCyan/40 rounded-2xl p-3.5 text-xs text-white font-bold">
                                {MUNICIPIOS_92.map(m=><option key={m} value={m}>{m} - RJ</option>)}
                            </select>
                        </div>
                        
                        <div className="space-y-1">
                            <label className="text-[10px] font-bold text-cyberCyan uppercase">Setor / Instituição - NUPDECs Individual</label>
                            <select value={setor} onChange={e=>setSetor(e.target.value)} className="w-full bg-[#1A1A1A] border border-orange-500/50 rounded-2xl p-3.5 text-[12px] text-white">
                                {SETORES_NUPDECs.map((s,i)=><option key={i} value={s}>{s}</option>)}
                            </select>
                        </div>

                        <div className="bg-gradient-to-br from-[#1A1A1A] to-[#0D152D] border-2 border-orange-500/80 rounded-2xl p-4 space-y-2 shadow-[0_0_20px_rgba(255,140,0,0.2)]">
                            <label className="block text-[11px] font-black text-orange-400 uppercase tracking-wider">📢 NOME DA SUA EQUIPE / COLETIVO / INICIATIVA</label>
                            <input value={equipe} onChange={e=>setEquipe(e.target.value)} placeholder="Ex: Coletivo Esperança Rocha Sobrinho..." className="w-full bg-void border-2 border-orange-400/80 rounded-xl p-3.5 text-[13px] text-white placeholder:text-slate-500 font-bold"/>
                            <p className="text-[9px] text-slate-300">Esse nome será <b className="text-cyan-400">CARIMBADO</b> automaticamente na foto (600px), no PDF e no WhatsApp.</p>
                            <div className="bg-black/70 border border-cyan-400/30 rounded-xl p-2.5">
                                <p className="text-[8px] text-slate-400 uppercase">Prévia do Carimbo:</p>
                                <p className="text-[10px] text-cyan-300 font-mono font-bold break-all">👥 {getEquipeFinal()}</p>
                            </div>
                        </div>

                        <div className="space-y-1">
                            <label className="text-[10px] font-bold text-cyberCyan uppercase">Nível de Risco Avaliado</label>
                            <select value={nivelRisco} onChange={e=>setNivelRisco(e.target.value)} className="w-full bg-void border border-cyberCyan/40 rounded-2xl p-3.5 text-xs text-white font-bold">
                                <option>🟢 Risco Baixo / Monitoramento</option>
                                <option>🟡 Risco Médio / Atenção</option>

                                <label className="flex items-center gap-2 cursor-pointer"><input type="checkbox" checked={ocorrencias.alagamento} onChange={e=>setOcorrencias({...ocorrencias,alagamento:e.target.checked})} className="rounded w-4 h-4 bg-void"/>Alagamento / Inundação</label>
                                <label className="flex items-center gap-2 cursor-pointer"><input type="checkbox" checked={ocorrencias.trincas} onChange={e=>setOcorrencias({...ocorrencias,trincas:e.target.checked})} className="rounded w-4 h-4 bg-void"/>Trincas / Rachaduras</label>

                        <div className="grid grid-cols-2 sm:grid-cols-4 gap-3">

                    setIsInstallable(false);
                } else {
                    showToast("ℹ️ Para instalar, use o menu do navegador e escolha 'Adicionar à Tela Inicial'.");
                }
            };

            const toggleTheme = () => {
                const nextTheme = theme === 'dark' ? 'warm' : 'dark';
                setTheme(nextTheme);
                localStorage.setItem('sarah-theme', nextTheme);
                if(nextTheme === 'warm') {
                    document.documentElement.classList.remove('dark');
                    document.documentElement.classList.add('warm');
                } else {
                    document.documentElement.classList.add('dark');
                    document.documentElement.classList.remove('warm');
                }
                showToast(`🎨 Tema alterado para ${nextTheme === 'dark' ? 'Cyber Dark' : 'Clean Warm'}`);
            };

            const triggerSarahVoice = () => {
                const topic = SARAH_TALK_TOPICS[sarahState.currentTopicIdx];
                const line = topic.lines[sarahState.currentLineIdx];
                
                setSarahState(prev => ({
                    ...prev,
                    isSpeaking: true,
                    speechText: `${topic.icon} [${topic.tag}]: ${line}`
                }));

                if (soundEnabled && 'speechSynthesis' in window) {
                    window.speechSynthesis.cancel();
                    const utterance = new SpeechSynthesisUtterance(line);
                    utterance.lang = 'pt-BR';
                    utterance.rate = 1.05;
                    utterance.onend = () => setSarahState(prev => ({ ...prev, isSpeaking: false }));
                    window.speechSynthesis.speak(utterance);
                } else {
                    setTimeout(() => setSarahState(prev => ({ ...prev, isSpeaking: false })), 4000);
                }

                setSarahState(prev => {
                    let nextLine = prev.currentLineIdx + 1;
                    let nextTopic = prev.currentTopicIdx;
                    if(nextLine >= SARAH_TALK_TOPICS[nextTopic].lines.length) {
                        nextLine = 0;
                        nextTopic = (nextTopic + 1) % SARAH_TALK_TOPICS.length;
                    }
                    return { ...prev, currentTopicIdx: nextTopic, currentLineIdx: nextLine };
                });
            };

            const openShareFromApp = () => {
                if(navigator.share) {
                    navigator.share({ title: 'Sarah AI Nexus v8.4.2 PRO', text: shareMessageText, url: APP_SHARE_URL }).catch(() => {});
                } else {
                    navigator.clipboard.writeText(shareMessageText);
                    showToast("📋 Link e mensagem copiados para a área de transferência!");
                }
            };

            return (
                <div className="min-h-screen flex flex-col relative">
                    {showSplash && (
                        <AppSplashScreen splashImageUrl={SPLASH_IMAGE_URL} onFinish={() => setShowSplash(false)} />
                    )}

                    <NativeHydroWindRadar isOpen={isRadarOpen} onToggle={() => setIsRadarOpen(!isRadarOpen)} />

                    {toastMessage && (
                        <div className="fixed top-5 left-1/2 -translate-x-1/2 z-[250] bg-cyberCyan text-void px-5 py-3 rounded-2xl font-black text-xs shadow-[0_0_30px_rgba(0,242,254,0.8)] animate-bounce">
                            {toastMessage}
                        </div>
                    )}

                    {/* TOP HEADER COMMAND CENTER */}
                    <header className="sticky top-0 z-40 w-full bg-deepSpace/90 backdrop-blur-xl border-b border-cyberCyan/30 px-4 py-3">
                        <div className="max-w-4xl mx-auto flex items-center justify-between">
                            <div className="flex items-center gap-3">
                                <div className="w-10 h-10 rounded-2xl bg-commandPanel border border-cyberCyan/50 flex items-center justify-center shadow-[0_0_15px_rgba(0,242,254,0.4)]">
                                    <CyberShieldIcon className="w-6 h-6" />
                                </div>
                                <div>
                                    <div className="font-display font-black text-xs text-cyberCyan tracking-widest uppercase">
                                        SARAH AI NEXUS <span className="text-white">v8.4.2 PRO</span>
                                    </div>
                                    <div className="font-mono text-[9px] text-slate-400 tracking-wider">
                                        DEFESA CIVIL COMUNITÁRIA • MESQUITA/RJ
                                    </div>
                                </div>
                            </div>

                            <div className="flex items-center gap-2">
                                <button onClick={openShareFromApp} className="w-9 h-9 rounded-xl bg-commandPanel border border-cyberCyan/40 hover:border-cyberCyan flex items-center justify-center cursor-pointer transition shadow-md" title="Compartilhar Sistema">
                                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#10B981" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="M8.59 13.51l6.83 3.98M15.41 6.51l-6.82 3.98"/></svg>
                                </button>
                                <button onClick={() => setSoundEnabled(!soundEnabled)} className={`w-9 h-9 rounded-xl border flex items-center justify-center cursor-pointer transition shadow-md ${soundEnabled ? 'bg-cyberCyan/20 border-cyberCyan text-cyberCyan shadow-[0_0_12px_rgba(0,242,254,0.5)]' : 'bg-commandPanel border-cyberCyan/30 text-slate-500'}`} title="Áudio">
                                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>{soundEnabled && <path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"></path>}</svg>
                                </button>
                                <button onClick={toggleTheme} className="w-9 h-9 rounded-xl border border-cyberCyan/40 bg-commandPanel text-cyberCyan flex items-center justify-center cursor-pointer shadow-md transition" title="Alternar Tema">
                                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M4.93 4.93l1.41 1.41m11.32 11.32l1.41 1.41M2 12h2m16 0h2M6.34 17.66l-1.41 1.41m12.02-12.02l-1.41 1.41"/></svg>
                                </button>
                                <button onClick={handleInstallApp} className={`w-9 h-9 rounded-xl border flex items-center justify-center cursor-pointer shadow-md transition ${isInstallable ? 'bg-cyberGreen/20 border-cyberGreen text-cyberGreen animate-pulse' : 'border-cyberCyan/40 bg-commandPanel text-cyberCyan'}`} title="Instalar App">
                                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
                                </button>
                            </div>
                        </div>
                    </header>

                    {/* MAIN CONTAINER CONTENT */}
                    <main className="flex-1 max-w-4xl w-full mx-auto p-4 space-y-4">
                        {currentTab === 'home' && (
                            <div className="space-y-4 animate-fade-in">
                                <div className="cyber-card p-6 rounded-3xl flex flex-col md:flex-row items-center gap-6 shadow-2xl relative overflow-hidden">
                                    <div className="absolute top-0 right-0 w-64 h-64 bg-cyberCyan/5 rounded-full blur-3xl pointer-events-none"></div>
                                    <div onClick={triggerSarahVoice} className="cursor-pointer shrink-0">
                                        <SarahHologramAvatar isLarge={true} isSpeaking={sarahState.isSpeaking} />
                                    </div>
                                    <div className="flex-1 text-center md:text-left space-y-3 z-10">
                                        <div className="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-cyberGreen/10 border border-cyberGreen/30 text-cyberGreen font-mono text-[10px]">
                                            <span className="w-2 h-2 rounded-full bg-cyberGreen animate-ping"></span>
                                            {getBrasiliaGreeting()}, Alexander! Sistema Totalmente Operacional
                                        </div>
                                        <h1 className="font-display font-black text-xl text-white tracking-wider">CENTRAL DE INTELIGÊNCIA COMUNITÁRIA</h1>
                                        <p className="text-sm text-slate-300 font-medium leading-relaxed bg-void/40 p-4 rounded-2xl border border-cyberCyan/20">"{sarahState.speechText}"</p>
                                        <div className="flex flex-wrap items-center justify-center md:justify-start gap-3 pt-2">
                                            <button onClick={triggerSarahVoice} className="px-5 py-2.5 cyber-button font-extrabold rounded-xl text-xs uppercase tracking-wider transition cursor-pointer shadow-[0_0_20px_rgba(255,153,0,0.5)]">🔊 Ouvir Conselhos da Sarah</button>
                                            <button onClick={() => setCurrentTab('vistoria')} className="px-5 py-2.5 bg-commandPanel hover:bg-cyberCyan hover:text-void border border-cyberCyan/50 text-cyberCyan font-extrabold rounded-xl text-xs uppercase tracking-wider transition cursor-pointer">📋 Nova Vistoria (RRD-92)</button>
                                        </div>
                                    </div>
                                </div>

                                <div className="grid grid-cols-2 sm:grid-cols-4 gap-3">
                                    <button onClick={() => setCurrentTab('vistoria')} className="cyber-card p-4 rounded-2xl text-left hover:border-cyberCyan transition cursor-pointer group">
                                        <div className="w-10 h-10 rounded-xl bg-cyberCyan/20 border border-cyberCyan/40 flex items-center justify-center text-cyberCyan mb-3 group-hover:scale-110 transition">📋</div>
                                        <div className="font-display font-bold text-xs text-white">Vistoria de Campo</div>
                                        <div className="text-[10px] text-slate-400 mt-1">92 Municípios RJ + NUPDECs</div>
                                    </button>
                                    <button onClick={() => setIsRadarOpen(true)} className="cyber-card p-4 rounded-2xl text-left hover:border-cyberCyan transition cursor-pointer group">
                                        <div className="w-10 h-10 rounded-xl bg-cyberGreen/20 border border-cyberGreen/40 flex items-center justify-center text-cyberGreen mb-3 group-hover:scale-110 transition">🛰️</div>
                                        <div className="font-display font-bold text-xs text-white">Radar 24h</div>
                                        <div className="text-[10px] text-slate-400 mt-1">Monitoramento meteorológico</div>
                                    </button>
                                    <button onClick={() => showToast("🛡️ GACE e Grupo A Chave da Esperança ativos.")} className="cyber-card p-4 rounded-2xl text-left hover:border-cyberCyan transition cursor-pointer group">
                                        <div className="w-10 h-10 rounded-xl bg-cyberAmber/20 border border-cyberAmber/40 flex items-center justify-center text-cyberAmber mb-3 group-hover:scale-110 transition">🤝</div>
                                        <div className="font-display font-bold text-xs text-white">Canal GACE</div>
                                        <div className="text-[10px] text-slate-400 mt-1">Ações comunitárias integradas</div>
                                    </button>
                                    <button onClick={() => showToast("🔒 Módulo PRO blindado com sucesso.")} className="cyber-card p-4 rounded-2xl text-left hover:border-cyberCyan transition cursor-pointer group">
                                        <div className="w-10 h-10 rounded-xl bg-cyberPurple/20 border border-cyberPurple/40 flex items-center justify-center text-cyberPurple mb-3 group-hover:scale-110 transition">🛡️</div>
                                        <div className="font-display font-bold text-xs text-white">Cofre de Segurança</div>
                                        <div className="text-[10px] text-slate-400 mt-1">Versão 8.4.2 PRO travada</div>
                                    </button>
                                </div>
                            </div>
                        )}

                        {currentTab === 'vistoria' && (
                            <FieldReportModule onBackToDashboard={() => setCurrentTab('home')} showToast={showToast} />
                        )}
                    </main>

                    {/* FOOTER TICKER BANNER */}
                    <footer className="w-full bg-deepSpace/95 border-t border-cyberCyan/30 overflow-hidden py-2.5 z-40 mt-auto">
                        <div className="flex whitespace-nowrap overflow-hidden">
                            <div className="flex animate-[tickerScroll_45s_linear_infinite] items-center gap-6 font-mono text-xs text-cyberCyan font-bold tracking-wider px-4">
                                <span>🛡️ Promovendo Ciências cidadã • 1º Edição El Niño GACE • Plano de ação: Todos unidos, todos protegidos • Seja voluntário • Servir é prevenir sempre + NUPDECS • # Compartilhe • Participe • Hospital da Mãe 21 2767-2700 Utilidades Públicas • "Se o Senhor não guardar a cidade, em vão vigia o sentinela" (Salmos 127) Cras de Rocha Sobrinho 21 2042-8931 Rede Suas Disque Mulher 180 CCO 21 2042-7020 Conceitos : Novo PAC seleções MCMV Projeto Iguaçu Cidades resilientes (ONU Habitat) • Periferia Viva Redução de Riscos Mesquita RJ Resiliência Climática 🛡️</span>
                                <span>🛡️ Promovendo Ciências cidadã • 1º Edição El Niño GACE • Plano de ação: Todos unidos, todos protegidos • Seja voluntário • Servir é prevenir sempre + NUPDECS • # Compartilhe • Participe • Hospital da Mãe 21 2767-2700 Utilidades Públicas • "Se o Senhor não guardar a cidade, em vão vigia o sentinela" (Salmos 127) Cras de Rocha Sobrinho 21 2042-8931 Rede Suas Disque Mulher 180 CCO 21 2042-7020 Conceitos : Novo PAC seleções MCMV Projeto Iguaçu Cidades resilientes (ONU Habitat) • Periferia Viva Redução de Riscos Mesquita RJ Resiliência Climática 🛡️</span>
                            </div>
                        </div>
                    </footer>
                </div>
            );
        }

        ReactDOM.render(<SarahNexusApp />, document.getElementById('root'));
    </script>
</body>
</html>
