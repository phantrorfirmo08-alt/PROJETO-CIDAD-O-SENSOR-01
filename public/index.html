<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#020617" />
    <meta
      name="description"
      content="SARAH AI COMANDO - Plataforma de monitoramento participativo e ciência cidadã para a Bacia do Sarapuí"
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="SARAH AI" />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/favicon.ico" />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <title>SARAH AI COMANDO | Monitoramento Sarapuí-Mesquita</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen',
          'Ubuntu', 'Cantarell', 'Fira Sans', 'Droid Sans', 'Helvetica Neue',
          sans-serif;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        background-color: #020617;
        color: #e2e8f0;
      }
      #root {
        width: 100%;
        min-height: 100vh;
      }
      code {
        font-family: source-code-pro, Menlo, Monaco, Consolas, 'Courier New',
          monospace;
      }
      /* Loading spinner */
      .loader {
        display: flex;
        align-items: center;
        justify-content: center;
        height: 100vh;
        background: linear-gradient(135deg, #020617 0%, #0f172a 100%);
      }
      .loader-content {
        text-align: center;
      }
      .spinner {
        width: 50px;
        height: 50px;
        border: 4px solid rgba(0, 229, 255, 0.2);
        border-top: 4px solid #00e5ff;
        border-radius: 50%;
        animation: spin 1s linear infinite;
        margin: 0 auto 20px;
      }
      @keyframes spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      .loader-text {
        font-family: 'Courier New', monospace;
        font-size: 14px;
        color: #06b6d4;
        letter-spacing: 2px;
        text-transform: uppercase;
      }
    </style>
  </head>
  <body>
    <noscript>
      <div class="loader">
        <div class="loader-content">
          <p style="color: #ef4444; font-size: 18px;">⚠️ JavaScript é necessário para usar SARAH AI COMANDO</p>
          <p style="color: #94a3b8; margin-top: 10px;">Ative JavaScript no seu navegador.</p>
        </div>
      </div>
    </noscript>

    <div id="root">
      <div class="loader">
        <div class="loader-content">
          <div class="spinner"></div>
          <p class="loader-text">SARAH Inicializando...</p>
        </div>
      </div>
    </div>

  </body>
</html>
