<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#9B7EDE">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>SARAH v6.0 ULTRA WORLD-CLASS</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800&family=Inter:wght@400;600;800&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
<script src="https://unpkg.com/react@18/umd/react.development.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#04010a;color:#EDE9FE;font-family:'Inter',sans-serif;display:flex;justify-content:center;min-height:100vh}
.app{width:100%;max-width:440px;background:radial-gradient(130% 90% at 50% -10%, #3a1d7a 0%, #1e0f3f 25%, #0a0616 60%, #04010a 100%);border:1px solid rgba(192,132,252,.4);box-shadow:0 0 80px rgba(139,92,246,.3);display:flex;flex-direction:column;min-height:100vh;overflow:hidden}
.status-bar{display:flex;justify-content:space-between;padding:12px 20px 6px;font-size:11px;color:#c4b5fd;font-family:'JetBrains Mono'}
.header{margin:8px 14px;border:1.5px solid rgba(192,132,252,.55);border-radius:18px;padding:10px 14px;display:flex;justify-content:space-between;background:linear-gradient(180deg, rgba(60,30,110,.9), rgba(18,9,33,.95));backdrop-filter:blur(16px)}
.shield{width:40px;height:46px;background:linear-gradient(180deg,#6d28d9,#1e0b36);border:1.2px solid #d8b4fe;border-radius:0 0 14px 14px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:7px;color:#e9d5ff;font-family:'Orbitron';text-align:center}
.shield b{font-size:13px;color:#fff}
.header-title h1{font-family:'Orbitron';font-size:15px;color:#e9d5ff;font-weight:800;text-shadow:0 0 15px rgba(192,132,252,1);line-height:1.05}
.nivel{font-size:7.5px;background:linear-gradient(90deg,#fb923c,#ea580c);color:#000;padding:4px 8px;border-radius:9px;font-weight:900;animation:pulse 2s infinite}
.subheader{text-align:center;font-size:10px;letter-spacing:2.5px;color:#c4b5fd;margin:6px 0;font-weight:800}
.process{display:flex;justify-content:space-between;padding:0 20px;font-size:9px;color:#a78bfa;margin-bottom:8px;font-family:'JetBrains Mono'}
#sarah-ultra{position:relative;width:94%;aspect-ratio:4/3.2;margin:0 auto;border-radius:22px;border:1.8px solid rgba(216,180,254,.65);background:radial-gradient(ellipse at 50% 10%, #4a1f8a 0%, #1f103f 40%, #080411 85%);box-shadow:0 0 40px rgba(139,92,246,.4);overflow:hidden}
#sarah-ultra.bg-grid{position:absolute;inset:0;opacity:.14;background-image:linear-gradient(rgba(216,180,254,.35) 1px, transparent 1px), linear-gradient(90deg, rgba(216,180,254,.35) 1px, transparent 1px);background-size:24px 24px}
#sarah-ultra.holo-rings{position:absolute;left:50%;top:44%;width:76%;aspect-ratio:1;transform:translate(-50%,-50%);z-index:1}
#sarah-ultra.holo-rings div{position:absolute;inset:0;border-radius:50%;border:1px dashed rgba(216,180,254,.4)}
#sarah-ultra.avatar-human{position:absolute;left:50%;top:50%;width:100%;height:100%;transform:translate(-50%,-50%);z-index:3;overflow:hidden;border-radius:20px}
#sarah-ultra.avatar-human img{width:100%;height:100%;object-fit:cover}
#sarah-ultra.scanline{position:absolute;left:0;top:0;width:100%;height:4px;background:linear-gradient(90deg, transparent, #f5f3ff, transparent);box-shadow:0 0 15px #e9d5ff;animation:scan 3.5s ease-in-out infinite;z-index:4}
#sarah-ultra.title{position:absolute;bottom:0;left:0;width:100%;padding:16px 0 12px;background:linear-gradient(0deg, rgba(8,4,17,.98) 35%, transparent);text-align:center;z-index:5}
#sarah-ultra.title h2{font-family:'Orbitron';font-size:16px;color:#fff;text-shadow:0 0 18px rgba(216,180,254,1), 0 0 40px rgba(139,92,246,.9);font-weight:800}
#sarah-ultra.title p{font-size:12px;color:#e9d5ff;margin-top:4px;font-style:italic}
@keyframes scan{0%{top:8%}50%{top:88%}100%{top:8%}} @keyframes pulse{0%,100%{opacity:1}50%{opacity:.85}}
.chat-area{width:94%;margin:8px auto;display:flex;flex-direction:column;gap:7px;max-height:120px;overflow-y:auto}
.msg-user{align-self:flex-end;background:linear-gradient(135deg, #5b21b6, #3b1f6e);border:1px solid rgba(216,180,254,.45);padding:7px 11px;border-radius:14px 14px 3px 14px;font-size:11.5px;max-width:85%}
.msg-sarah{align-self:flex-start;background:rgba(35,18,62,.92);border:1px solid rgba(192,132,252,.4);padding:7px 11px;border-radius:14px 14px 14px 3px;font-size:11.5px;max-width:85%}
.input-box{width:94%;margin:6px auto;background:rgba(22,11,39,.9);border:1.2px solid rgba(192,132,252,.45);border-radius:16px;padding:8px 14px;display:flex;gap:10px}
.input-box input{flex:1;background:transparent;border:none;outline:none;color:#f5f3ff;font-size:12.5px}
.quick{display:flex;gap:7px;padding:8px 14px}.quick button{flex:1;background:linear-gradient(180deg, rgba(70,30,110,.95), rgba(26,12,44,.98));border:1.2px solid rgba(192,132,252,.38);border-radius:12px;padding:8px 6px;font-size:10.5px;color:#e9d5ff;font-weight:700}
.bottom-nav{display:flex;justify-content:space-around;background:rgba(14,7,26,.98);border:1.2px solid rgba(192,132,252,.35);border-radius:18px;margin:8px 14px;padding:8px 0}
.nav-item{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:10px;color:#8b7aa8;min-width:48px}.nav-item.active{color:#d8b4fe;text-shadow:0 0 12px rgba(216,180,254,1)}
.footer-marquee{background:linear-gradient(90deg,#4a154b,#7c2d7e);border-top:2.5px solid #d8b4fe;padding:6px 0;font-size:10.5px;font-weight:800;color:#fb923c}
.footer{text-align:center;font-size:8.5px;letter-spacing:1.8px;color:#7c6a9a;padding:5px 0 10px;font-family:'JetBrains Mono'}
.glass-module{background:linear-gradient(180deg, rgba(26,13,48,.98), rgba(16,8,30,.98));border:1.5px solid rgba(192,132,252,.45);border-radius:20px;padding:16px;margin:10px 14px;flex:1;overflow-y:auto;max-height:calc(100vh - 190px);font-size:11.5px}
.btn-primary{width:100%;padding:11px;background:linear-gradient(135deg,#8b5cf6,#c084fc);color:#fff;font-weight:900;border:none;border-radius:14px;box-shadow:0 0 25px rgba(139,92,246,.6);cursor:pointer}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
// TROQUE AQUI PELA IMAGEM ULTRA QUE GEREI - SALVE COMO sarah.jpg
const AVATAR = "https://i.ibb.co/QvYdXxY/sarah-ultra-humana.jpg"; // <-- coloque seu link ou sarah.jpg

function SarahUltraHuman(){
  return (
    <div id="sarah-ultra">
      <div className="bg-grid"></div>
      <div className="holo-rings"><div></div><div></div><div></div></div>
      <div className="scanline"></div>
      <div className="avatar-human"><img src={AVATAR} alt="SARAH ULTRA" onError={e=>e.target.src='https://images.unsplash.com/photo-1531746020798-e6953c6e8e04?w=400'} /></div>
      <div className="title"><h2>SARAH IA NEXUS v6.0 ULTRA</h2><p>"Prevenção não é mídia: é gente atenta."</p></div>
      <div style={{position:'absolute',top:'10px',left:'10px',zIndex:6,display:'flex',gap:'6px'}}>
        <span style={{background:'rgba(16,185,129,.9)',color:'#fff',fontSize:'8px',padding:'3px 7px',borderRadius:'20px',fontWeight:'800'}}>● AO VIVO</span>
        <span style={{background:'rgba(139,92,246,.9)',color:'#fff',fontSize:'8px',padding:'3px 7px',borderRadius:'20px',fontWeight:'800'}}>NEURAL 99.9%</span>
      </div>
    </div>
  );
}
function NativeHydroWindRadar(){
  const canvasRef = React.useRef(null);
  React.useEffect(()=>{
    const c=canvasRef.current; if(!c) return; const ctx=c.getContext('2d'); let a=0,id;
    const render=()=>{ctx.clearRect(0,0,c.width,c.height); ctx.fillStyle='#090416'; ctx.fillRect(0,0,c.width,c.height);
      const cx=c.width/2, cy=c.height/2; [38,76,114,152].forEach(r=>{ctx.strokeStyle='rgba(192,132,252,0.28)'; ctx.beginPath(); ctx.arc(cx,cy,r,0,Math.PI*2); ctx.stroke()});
      ctx.save(); ctx.translate(cx,cy); ctx.rotate(a); const g=ctx.createLinearGradient(0,0,160,0); g.addColorStop(0,'rgba(216,180,254,0.7)'); g.addColorStop(1,'transparent');
      ctx.fillStyle=g; ctx.beginPath(); ctx.moveTo(0,0); ctx.arc(0,0,152,-0.2,0.6); ctx.lineTo(0,0); ctx.fill(); ctx.restore(); a+=0.018; id=requestAnimationFrame(render);
    }; render(); return ()=>cancelAnimationFrame(id);
  },[]);
  return (
    <div className="w-full rounded-[20px] border-[1.5px] border-purple-400/50 bg-[#120a28] p-3">
      <div className="flex justify-between mb-2"><span className="text-[11px] text-purple-200 font-black">🛰️ RADAR HIDROGRÁFICO ULTRA</span><span className="text-[8px] text-emerald-200 bg-emerald-900/60 px-2.5 py-1 rounded-full border border-emerald-400/40">AO VIVO</span></div>
      <canvas ref={canvasRef} width="360" height="190" className="w-full rounded-[14px]"></canvas>
      <div className="grid grid-cols-3 gap-2 mt-3 text-[9.5px]">
        <div className="bg-[#1a0e32] border border-purple-500/30 rounded-[12px] p-2 text-center"><div className="text-purple-300 font-bold">NÍVEL RIO</div><div className="text-white font-black">1.24m ▲</div></div>
        <div className="bg-[#1a0e32] border border-emerald-500/30 rounded-[12px] p-2 text-center"><div className="text-emerald-300 font-bold">CHUVA 1H</div><div className="text-emerald-200 font-black">12mm</div></div>
        <div className="bg-[#2a1220] border border-orange-500/40 rounded-[12px] p-2 text-center"><div className="text-orange-300 font-bold">ALERTA</div><div className="text-orange-200 font-black">NÍVEL 2</div></div>
      </div>
    </div>
  );
}
function FieldReportModule({onBack}){
  const [dados,setDados]=React.useState({tecnico:"Alexander da Silva Firmo", localidade:"Rocha Sobrinho / Mesquita - RJ", risco:"Médio", relato:""});
  const gerarPDF=()=>{ const el=document.getElementById('pdfContent'); html2pdf().from(el).set({margin:8, filename:`laudo_${Date.now()}.pdf`, html2canvas:{scale:2}, jsPDF:{format:'a4'}}).save(); };
  return (
    <div className="glass-module space-y-3">
      <div className="flex justify-between border-b border-purple-500/30 pb-2.5"><span className="font-black text-purple-200">📋 CENTRAL DE LAUDOS ULTRA v6.0</span><button onClick={onBack} className="text-red-200 bg-red-950/50 px-3 py-1 rounded-full">✕</button></div>
      <input value={dados.tecnico} onChange={e=>setDados({...dados, tecnico:e.target.value})} className="w-full bg-[#080411] border border-purple-500/30 rounded-[14px] p-3 text-white"/>
      <input value={dados.localidade} onChange={e=>setDados({...dados, localidade:e.target.value})} className="w-full bg-[#080411] border border-purple-500/30 rounded-[14px] p-3 text-white"/>
      <textarea rows="3" value={dados.relato} onChange={e=>setDados({...dados, relato:e.target.value})} placeholder="Relato técnico..." className="w-full bg-[#080411] border border-purple-500/30 rounded-[14px] p-3 text-white"></textarea>
      <div id="pdfContent" className="bg-white text-black p-4 rounded-[14px] text-[11px]"><h2 className="font-black text-center">DEFESA CIVIL - LAUDO TÉCNICO v6.0 ULTRA</h2><p><b>TÉCNICO:</b> {dados.tecnico}</p><p><b>LOCAL:</b> {dados.localidade}</p><p><b>RISCO:</b> {dados.risco}</p><p className="mt-2"><b>RELATO:</b><br/>{dados.relato}</p></div>
      <button onClick={gerarPDF} className="btn-primary">📥 BAIXAR PDF ULTRA</button>
    </div>
  );
}
function App(){
  const [activeTab,setActiveTab]=React.useState("inicio");
  const [messages,setMessages]=React.useState([{id:1, sender:'user', text:"Quais abrigos abertos na região?", time:"22:48"}, {id:2, sender:'sarah', text:"Olá Alexander! Sistema ULTRA v6.0 WORLD-CLASS ativo. 99.9% sincronizado.", time:"22:48"}]);
  const [input,setInput]=React.useState("");
  const send=(txt)=>{ const t=txt||input; if(!t.trim()) return; setMessages(m=>[...m, {id:Date.now(), sender:'user', text:t, time:new Date().toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'})}]); setInput(""); setTimeout(()=>setMessages(m=>[...m, {id:Date.now()+1, sender:'sarah', text:"✅ Comando ULTRA processado. Defesa Civil Comunitária Nível 2 - Mesquita.", time:new Date().toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'})}]),900); };
  React.useEffect(()=>{ if('serviceWorker' in navigator){ const sw=`self.addEventListener('install',e=>e.waitUntil(caches.open('sarah-v6').then(c=>c.addAll(['/'])))); self.addEventListener('fetch', e=>{ e.respondWith(caches.match(e.request).then(r=>r||fetch(e.request))) });`; const blob=new Blob([sw], {type:'text/javascript'}); navigator.serviceWorker.register(URL.createObjectURL(blob)).catch(()=>{}); } },[]);
  return (
    <div className="app">
      <div className="status-bar"><span>22:47 • {new Date().toLocaleDateString('pt-BR')}</span><span>📍 Mesquita, RJ</span><span>78% • 5G ULTRA 🟢</span></div>
      <div className="header"><div style={{display:'flex',alignItems:'center',gap:'12px'}}><div className="shield">DEFESA CIVIL<br/><b>PC</b></div><div className="header-title"><h1>DEFESA CIVIL<br/>COMUNITÁRIA</h1></div></div><div style={{textAlign:'center'}}><div className="shield">DEFESA CIVIL<br/><b>PC</b></div><div className="nivel">NÍVEL 2 - ATENÇÃO</div></div></div>
      <div className="subheader">PROJETO CIDADÃO SENSOR • v6.0 ULTRA WORLD-CLASS</div>
      <div className="process"><span>⚡ PROCESSANDO • 99.9% ULTRA • QUANTUM</span><span>🧠 NEURAL SYNC • ATIVO 🟢</span></div>
      {activeTab==="inicio" && (<div className="flex-1 flex flex-col"><SarahUltraHuman/><div className="chat-area">{messages.map(m=>(<div key={m.id} className={m.sender==='user'?'msg-user':'msg-sarah'}><b>{m.sender==='user'?'Usuário: ':'SARAH ULTRA: '}</b>{m.text}</div>))}</div><div className="quick"><button onClick={()=>send("📍 Mapa de Risco")}>📍 Risco</button><button onClick={()=>send("🏠 Abrigos")}>🏠 Abrigos</button><button onClick={()=>send("🔔 Alertas")}>🔔 Alertas</button></div><div className="input-box"><input value={input} onChange={e=>setInput(e.target.value)} onKeyDown={e=>e.key==='Enter'&&send()} placeholder="Digite sua mensagem para SARAH ULTRA..."/><button onClick={()=>send()} className="text-[#d8b4fe] font-black text-[20px]">➤</button></div></div>)}
      {activeTab==="monitor" && <div className="flex-1 p-2.5"><NativeHydroWindRadar/></div>}
      {activeTab==="relatorios" && <FieldReportModule onBack={()=>setActiveTab("inicio")} />}
      {activeTab==="perfil" && (<div className="glass-module"><h3 className="font-black text-purple-200">👤 PERFIL ULTRA - CREDENCIADO</h3><p className="mt-2"><b>Coordenação:</b> Alexander da Silva Firmo<br/><b>Instituição:</b> A Chave da Esperança<br/><b>Base:</b> Mesquita RJ - Bacia Sarapuí</p><div className="bg-[#080411] border border-purple-500/20 rounded-[12px] p-2.5 mt-3 text-center"><p className="text-[9px] text-purple-400">PWA STATUS</p><p className="text-emerald-300 font-black">✅ WORLD-CLASS • Offline • AES-256</p></div></div>)}
      <div className="bottom-nav"><div onClick={()=>setActiveTab("inicio")} className={`nav-item ${activeTab==='inicio'?'active':''}`}>⌂<span>Início</span></div><div onClick={()=>setActiveTab("monitor")} className={`nav-item ${activeTab==='monitor'?'active':''}`}>🛰️<span>Monitor</span></div><div onClick={()=>setActiveTab("relatorios")} className={`nav-item ${activeTab==='relatorios'?'active':''}`}>📋<span>Laudos</span></div><div onClick={()=>setActiveTab("perfil")} className={`nav-item ${activeTab==='perfil'?'active':''}`}>👤<span>Perfil</span></div></div>
      <div className="footer-marquee"><marquee scrollamount="6">🛡️ SARAH v6.0 ULTRA WORLD-CLASS • Cidades Resilientes ONU • Todos Unidos Todos Protegidos • Defesa Civil 199 / 21 4040-1772 • Bombeiros 193 • ZAP (21) 97299-3223 • Salmos 127:1 • #compartilhe Mesquita RJ 🛡️</marquee></div>
      <div className="footer">SARAH IA NEXUS v6.0 ULTRA WORLD-CLASS • PWA • 24/7</div>
    </div>
  );
}
const root=ReactDOM.createRoot(document.getElementById("root"));
root.render(<App/>);
</script>
</body>
</html>
