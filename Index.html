<body class="min-h-screen bg-slate-950 text-slate-100 selection:bg-cyan-500 selection:text-slate-950">
    <div id="root"></div>
    
    <script type="text/babel">
        const CLOUDFLARE_WORKER_URL = "https://sarah-envelope.phantrorfirmo08.workers.dev/";

        const getBrasiliaGreeting = () => {
            const hour = parseInt(
                new Intl.DateTimeFormat("pt-BR", {
                    timeZone: "America/Sao_Paulo",
                    hour: "numeric",
                    hour12: false
                }).format(new Date()),
                10
            );
            if (hour >= 0 && hour < 5) return "Boa madrugada";
            if (hour >= 5 && hour < 12) return "Bom dia";
            if (hour >= 12 && hour < 18) return "Boa tarde";
            return "Boa noite";
        };

        function SarahAvatar({ size = "w-9 h-9", showStatus = true, isLarge = false, riskLevel = "green" }) {
            const [isBlinking, setIsBlinking] = React.useState(false);

            React.useEffect(() => {
                let timeoutId;
                const triggerBlink = () => {
                    setIsBlinking(true);
                    setTimeout(() => setIsBlinking(false), 150);
                    const randomTime = Math.floor(Math.random() * (4500 - 2000 + 1)) + 2000;
                    timeoutId = setTimeout(triggerBlink, randomTime);
                };
                timeoutId = setTimeout(triggerBlink, 2500);
                return () => clearTimeout(timeoutId);
            }, []);

            const dimensionClass = isLarge ? "w-32 h-32" : size;

            const statusColorClass = 
                riskLevel === "red" ? "bg-rose-500 shadow-[0_0_15px_rgba(244,63,94,0.9)] border-rose-950" :
                riskLevel === "orange" ? "bg-orange-500 shadow-[0_0_15px_rgba(249,115,22,0.9)] border-orange-950" :
                riskLevel === "yellow" ? "bg-amber-400 shadow-[0_0_15px_rgba(251,191,36,0.9)] border-amber-950" :
                "bg-emerald-400 shadow-[0_0_15px_rgba(16,185,129,0.9)] border-emerald-950";

            return (
                <div className="relative inline-flex items-center justify-center shrink-0">
                    <style>{`
                        .sarah-hud-container {
                            position: relative;
                            background: radial-gradient(circle at 50% 50%, #03162c 0%, #010810 70%, #000307 100%);
                            border-radius: 50%;
                            overflow: hidden;
                            display: flex;
                            align-items: center;
                            justify-content: center;
                            box-shadow: 0 0 30px rgba(0, 242, 255, 0.25), inset 0 0 20px rgba(0, 242, 255, 0.2);
                            border: 2px solid rgba(0, 242, 255, 0.6);
                        }
                        .hud-ring-outer {
                            position: absolute;
                            inset: 4px;
                            border-radius: 50%;
                            border: 1px dashed rgba(0, 242, 255, 0.4);
                            animation: spinSlow 18s linear infinite;
                        }
                        .hud-ring-inner {
                            position: absolute;
                            inset: 10px;
                            border-radius: 50%;
                            border: 1.5px solid rgba(0, 242, 255, 0.8);
                            box-shadow: 0 0 10px rgba(0, 242, 255, 0.5);
                        }
                        .hud-ring-pulse {
                            position: absolute;
                            inset: 0;
                            border-radius: 50%;
                            background: radial-gradient(circle, rgba(0,242,255,0.15) 0%, transparent 70%);
                            animation: pulseHud 2.5s ease-in-out infinite;
                        }
                        .neural-dots {
                            position: absolute;
                            inset: 0;
                            background-image: radial-gradient(rgba(0, 242, 255, 0.4) 1px, transparent 1px);
                            background-size: 7px 7px;
                            opacity: 0.35;
                        }
                        @keyframes spinSlow { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
                        @keyframes pulseHud { 0%, 100% { transform: scale(1); opacity: 0.4; } 50% { transform: scale(1.05); opacity: 0.85; } }
                    `}</style>

                    <div className={`${dimensionClass} sarah-hud-container select-none shadow-2xl`}>
                        <div className="neural-dots"></div>
                        <div className="hud-ring-pulse"></div>
                        <div className="hud-ring-outer"></div>
                        <div className="hud-ring-inner"></div>

                        <div className="relative z-10 flex flex-col items-center justify-center w-full h-full">
                            <div className={`transition-transform duration-75 ${isBlinking ? 'scale-y-[0.08]' : 'scale-y-100'}`}>
                                <svg className={isLarge ? "w-16 h-12 text-cyan-400" : "w-5 h-3.5 text-cyan-400"} viewBox="0 0 100 60" fill="none" xmlns="http://www.w3.org/2000/svg">
                                    <path d="M 12 30 Q 50 10 88 30 Q 50 50 12 30 Z" stroke="currentColor" strokeWidth="2.5" fill="rgba(3, 22, 44, 0.9)" className="filter drop-shadow-[0_0_6px_rgba(0,242,255,0.8)]"/>
                                    <circle cx="50" cy="30" r="10" stroke="currentColor" strokeWidth="2" fill="rgba(0, 242, 255, 0.2)"/>
                                    <polygon points="50,21 57,25 57,35 50,39 43,35 43,25" fill="#00f2ff" className="animate-pulse shadow-[0_0_8px_#00f2ff]"/>
                                    <circle cx="50" cy="30" r="3" fill="#ffffff" />
                                </svg>
                            </div>
                        </div>
                    </div>

                    {showStatus && (
                        <div className={`absolute ${isLarge ? 'bottom-2 right-2 w-4 h-4 border-2' : '-bottom-0.5 right-0.5 w-2 h-2 border'} ${statusColorClass} rounded-full animate-ping`}></div>
                    )}
                    {showStatus && (
                        <div className={`absolute ${isLarge ? 'bottom-2 right-2 w-4 h-4 border-2' : '-bottom-0.5 right-0.5 w-2 h-2 border'} ${statusColorClass} rounded-full`}></div>
                    )}
                </div>
            );
        }

        function App() {
            const [darkMode, setDarkMode] = React.useState(true);
            const [soundEnabled, setSoundEnabled] = React.useState(true);
            const [fontSize, setFontSize] = React.useState(15);
            const [isSpeaking, setIsSpeaking] = React.useState(false);
            const [isListening, setIsListening] = React.useState(false);
            const [liveWeather, setLiveWeather] = React.useState(null);
            const [hourlyForecast, setHourlyForecast] = React.useState(null);
            const [isOnline, setIsOnline] = React.useState(navigator.onLine);
            
            const [activeTab, setActiveTab] = React.useState("dashboard");

            const [panicActive, setPanicActive] = React.useState(false);
            const [offlineCount, setOfflineCount] = React.useState(0);
            const [showQueueModal, setShowQueueModal] = React.useState(false);
            const [queueItems, setQueueItems] = React.useState([]);
            const dbRef = React.useRef(null);

            const [termsAccepted, setTermsAccepted] = React.useState(
                () => localStorage.getItem("sarah_terms_v51_accepted") === "1"
            );
            const [checkAccepted1, setCheckAccepted1] = React.useState(false);
            const [checkAccepted2, setCheckAccepted2] = React.useState(false);

            const [deferredPrompt, setDeferredPrompt] = React.useState(null);
            const [showInstallBtn, setShowInstallBtn] = React.useState(false);

            const [messages, setMessages] = React.useState([]);
            const [input, setInput] = React.useState("");
            const [isLoadingChat, setIsLoadingChat] = React.useState(false);
            const [hasIntroduced, setHasIntroduced] = React.useState(
                () => localStorage.getItem("sarah_introduced_v51") === "1"
            );

            const speechIdRef = React.useRef(0);
            const voiceTimerRef = React.useRef(null);
            const voicesRef = React.useRef([]);
            const mapRef = React.useRef(null);
            const mapInstanceRef = React.useRef(null);
            const chartRef = React.useRef(null);
            const chartInstanceRef = React.useRef(null);

            React.useEffect(() => {
                const request = indexedDB.open("SarahOfflineDB", 1);
                request.onerror = (e) => console.error("Erro IndexedDB:", e.target.error);
                request.onupgradeneeded = (e) => {
                    const dbInstance = e.target.result;
                    if (!dbInstance.objectStoreNames.contains("incidentes")) {
                        dbInstance.createObjectStore("incidentes", { keyPath: "id", autoIncrement: true });
                    }
                };
                request.onsuccess = (e) => {
                    dbRef.current = e.target.result;
                    atualizarContadorOffline();
                };
            }, []);

            const atualizarContadorOffline = () => {
                if (!dbRef.current) return;
                try {
                    const tx = dbRef.current.transaction(["incidentes"], "readonly");
                    const store = tx.objectStore("incidentes");
                    const countReq = store.count();
                    countReq.onsuccess = () => setOfflineCount(countReq.result);
                } catch (err) {
                    console.warn("Erro ao contar itens offline:", err);
                }
            };

            const carregarItensDaFila = () => {
                if (!dbRef.current) return;
                try {
                    const tx = dbRef.current.transaction(["incidentes"], "readonly");
                    const store = tx.objectStore("incidentes");
                    const req = store.getAll();
                    req.onsuccess = () => {
                        setQueueItems(req.result || []);
                        atualizarContadorOffline();
                    };
                } catch (err) {
                    console.warn("Erro ao carregar fila:", err);
                }
            };

            const excluirItemFila = (id) => {
                if (!dbRef.current) return;
                const tx = dbRef.current.transaction(["incidentes"], "readwrite");
                const store = tx.objectStore("incidentes");
                const req = store.delete(id);
                req.onsuccess = () => {
                    carregarItensDaFila();
                    atualizarContadorOffline();
                };
            };

            const salvarOcorrenciaOfflineNoBanco = (textoRelato) => {
                if (!dbRef.current) {
                    alert("Banco offline indisponível.");
                    return;
                }
                const salvarComGPS = (lat, lng) => {
                    const tx = dbRef.current.transaction(["incidentes"], "readwrite");
                    const store = tx.objectStore("incidentes");
                    const record = { texto: textoRelato, lat, lng, timestamp: Date.now() };
                    const req = store.add(record);
                    req.onsuccess = () => {
                        atualizarContadorOffline();
                        alert("Ocorrência salva localmente no IndexedDB! Será sincronizada automaticamente ao restabelecer o sinal.");
                    };
                };

                if (navigator.geolocation) {
                    navigator.geolocation.getCurrentPosition(
                        (pos) => salvarComGPS(pos.coords.latitude, pos.coords.longitude),
                        () => salvarComGPS(-22.7845, -43.4140)
                    );
                } else {
                    salvarComGPS(-22.7845, -43.4140);
                }
            };

            const sincronizarFilaOfflineComNuvem = async () => {
                if (!dbRef.current || !navigator.onLine) {
                    alert("Sem conexão com a internet para sincronizar no momento.");
                    return;
                }

                const tx = dbRef.current.transaction(["incidentes"], "readwrite");
                const store = tx.objectStore("incidentes");
                const getAllReq = store.getAll();

                getAllReq.onsuccess = async () => {
                    const items = getAllReq.result;
                    if (!items || items.length === 0) {
                        alert("A fila offline está vazia.");
                        return;
                    }

                    let sucessos = 0;
                    for (const item of items) {
                        try {
                            const res = await fetch(CLOUDFLARE_WORKER_URL, {
                                method: "POST",
                                headers: { "Content-Type": "application/json" },
                                body: JSON.stringify({
                                    model: "openai/gpt-oss-120b",
                                    messages: [{ role: "user", content: `[SINCRONIZAÇÃO OFFLINE] ${item.texto} (Local: ${item.lat}, ${item.lng})` }]
                                })
                            });
                            if (res.ok) {
                                const delTx = dbRef.current.transaction(["incidentes"], "readwrite");
                                delTx.objectStore("incidentes").delete(item.id);
                                sucessos++;
                            }
                        } catch (err) {
                            console.warn("Falha ao sincronizar item ID:", item.id, err);
                        }
                    }

                    carregarItensDaFila();
                    atualizarContadorOffline();
                    alert(`Sincronização concluída! ${sucessos} de ${items.length} ocorrências enviadas com sucesso.`);
                    setShowQueueModal(false);
                };
            };

            React.useEffect(() => {
                const handleOnline = () => {
                    setIsOnline(true);
                    sincronizarFilaOfflineComNuvem();
                };
                const handleOffline = () => setIsOnline(false);
                window.addEventListener("online", handleOnline);
                window.addEventListener("offline", handleOffline);
                return () => {
                    window.removeEventListener("online", handleOnline);
                    window.removeEventListener("offline", handleOffline);
                };
            }, []);

            const ativarBotaoPanicoAvancado = () => {
                setPanicActive(true);
                if (navigator.geolocation) {
                    navigator.geolocation.getCurrentPosition(
                        (pos) => {
                            const lat = pos.coords.latitude;
                            const lng = pos.coords.longitude;
                            alert(`🚨 ALERTA MÁXIMO DE PÂNICO ATIVADO!\nCoordenadas GPS capturadas: ${lat.toFixed(5)}, ${lng.toFixed(5)}\nModo de alto contraste ativado para baixa visibilidade. Equipes de Mesquita notificadas.`);
                        },
                        () => {
                            alert("🚨 ALERTA MÁXIMO DE PÂNICO ATIVADO!\nNão foi possível obter coordenadas GPS exatas. Última zona de referência de Mesquita utilizada.");
                        },
                        { enableHighAccuracy: true, timeout: 10000 }
                    );
                } else {
                    alert("🚨 ALERTA MÁXIMO DE PÂNICO ATIVADO! Dispositivo sem suporte a geolocalização.");
                }
            };

            const getRiskLevel = () => {
                if (!liveWeather) return "green";
                const precip = liveWeather.precipitation || 0;
                const wind = liveWeather.wind_speed_10m || 0;
                const code = liveWeather.weather_code || 0;
                if (code >= 95 || precip > 15 || wind > 45) return "red";
                if (code >= 80 || precip > 8 || wind > 35) return "orange";
                if (code >= 51 || precip > 2 || wind > 25) return "yellow";
                return "green";
            };

            const currentRisk = getRiskLevel();

            React.useEffect(() => {
                const handleBeforeInstall = (e) => {
                    e.preventDefault();
                    setDeferredPrompt(e);
                    setShowInstallBtn(true);
                };
                window.addEventListener("beforeinstallprompt", handleBeforeInstall);
                return () => window.removeEventListener("beforeinstallprompt", handleBeforeInstall);
            }, []);

            const handleInstallApp = async () => {
                if (!deferredPrompt) {
                    alert("Para instalar, abra o menu do seu navegador e selecione 'Adicionar à tela inicial' ou 'Instalar aplicativo'.");
                    return;
                }
                deferredPrompt.prompt();
                const { outcome } = await deferredPrompt.userChoice;
                if (outcome === "accepted") setShowInstallBtn(false);
                setDeferredPrompt(null);
            };

            const carregarVozes = () => {
                if ("speechSynthesis" in window) {
                    voicesRef.current = window.speechSynthesis.getVoices();
                }
            };

            React.useEffect(() => {
                if (!("speechSynthesis" in window)) return;
                carregarVozes();
                window.speechSynthesis.onvoiceschanged = carregarVozes;
                return () => {
                    window.speechSynthesis.cancel();
                    window.speechSynthesis.onvoiceschanged = null;
                };
            }, []);

            const limparTextoParaFala = (text) => {
                return String(text)
                    .replace(/[#*_`~]/g, "")
                    .replace(/\[(.*?)\]\(.*?\)/g, "$1")
                    .replace(/https?:\/\/\S+/g, "")
                    .replace(/\s+/g, " ")
                    .trim();
            };

            const escolherMelhorVoz = () => {
                const voices = voicesRef.current.length ? voicesRef.current : window.speechSynthesis.getVoices();
                const preferidas = ["Google português do Brasil", "Google Português do Brasil", "Microsoft Francisca", "Microsoft Maria"];
                return (
                    voices.find((v) => preferidas.some((name) => v.name.toLowerCase().includes(name.toLowerCase()))) ||
                    voices.find((v) => v.lang.toLowerCase() === "pt-br") ||
                    voices.find((v) => v.lang.toLowerCase().startsWith("pt")) ||
                    voices[0]
                );
            };

            const stopSpeaking = () => {
                speechIdRef.current += 1;
                if (voiceTimerRef.current) {
                    clearTimeout(voiceTimerRef.current);
                    voiceTimerRef.current = null;
                }
                if ("speechSynthesis" in window) window.speechSynthesis.cancel();
                setIsSpeaking(false);
            };

            const speakText = (text) => {
                if (!soundEnabled || !("speechSynthesis" in window)) return;
                const cleanText = limparTextoParaFala(text);
                if (!cleanText) return;
                stopSpeaking();
                const currentId = speechIdRef.current;
                voiceTimerRef.current = setTimeout(() => {
                    if (currentId !== speechIdRef.current) return;
                    const utterance = new SpeechSynthesisUtterance(cleanText);
                    utterance.lang = "pt-BR";
                    utterance.voice = escolherMelhorVoz() || null;
                    utterance.rate = 0.94;
                    utterance.pitch = 1.02;
                    utterance.volume = 1;
                    utterance.onstart = () => { if (currentId === speechIdRef.current) setIsSpeaking(true); };
                    utterance.onend = () => { if (currentId === speechIdRef.current) setIsSpeaking(false); };
                    utterance.onerror = () => setIsSpeaking(false);
                    window.speechSynthesis.speak(utterance);
                }, 200);
            };

            React.useEffect(() => {
                if (!termsAccepted || hasIntroduced) return;
                const greeting = getBrasiliaGreeting();
                const presentation = `${greeting}, meu nome é Sarah, inteligência artificial do projeto Cidadão Sensor em Mesquita. O monitoramento de Defesa Civil está ativo. Como posso ajudar?`;
                const timer = setTimeout(() => {
                    if (!soundEnabled) return;
                    setHasIntroduced(true);
                    localStorage.setItem("sarah_introduced_v51", "1");
                    speakText(presentation);
                }, 800);
                return () => clearTimeout(timer);
            }, [termsAccepted, hasIntroduced, soundEnabled]);

            const handleShareLink = async () => {
                const shareData = {

                                    <span className={`w-2 h-2 rounded-full ${currentRisk === 'red' ? 'bg-rose-500' : currentRisk === 'orange' ? 'bg-orange-500' : currentRisk === 'yellow' ? 'bg-amber-400' : 'bg-emerald-400'} animate-pulse`}></span>
                                    Open-Meteo • Mesquita ({currentRisk.toUpperCase()})
                                </span>
                                {liveWeather && (
                                    <span className="hidden sm:inline text-slate-300">
                                        🌡️ {liveWeather.temperature_2m}°C | 💧 {liveWeather.relative_humidity_2m}% | 🌧️ {liveWeather.precipitation}mm | 💨 {liveWeather.wind_speed_10m}km/h

                                )}

                            <button
                                onClick={isSpeaking ? stopSpeaking : () => setSoundEnabled((v) => !v)}

                            >
                                {isSpeaking ? "⏹ Parar fala" : soundEnabled ? "🔊 Voz ativa" : "🔇 Mudo"}
                            </button>
                        </div>

                        <main className="max-w-4xl mx-auto p-3 sm:p-4 w-full flex-1 flex flex-col">
                            {activeTab === "dashboard" && (
                                <div className="space-y-4 my-auto">
                                    <div className="bg-slate-900/90 border border-cyan-500/30 rounded-3xl p-6 shadow-2xl flex flex-col items-center text-center backdrop-blur-md">
                                        <div className="relative mb-4">
                                            <SarahAvatar showStatus={true} isLarge={true} riskLevel={currentRisk} />
                                        </div>

                                        <h2 className="font-mono text-lg font-bold text-slate-100 tracking-wide mb-2">
                                            SARAH IA • Core v5.1 Next-Gen
                                        </h2>

                                        <div className="px-4 py-1.5 bg-cyan-950/60 border border-cyan-500/40 rounded-full text-cyan-300 font-mono text-xs mb-6 shadow-inner">

                                        <div className="w-full grid grid-cols-1 sm:grid-cols-3 gap-3 my-4">
                                            <button onClick={() => setActiveTab("chat")} className="p-4 bg-cyan-500/10 hover:bg-cyan-500/20 border border-cyan-500/30 rounded-2xl text-left transition flex flex-col gap-2 group">
                                                <span className="text-xl">💬</span>
                                                <span className="font-mono text-xs font-bold text-cyan-300 group-hover:underline">Chat & Base Local</span>
                                                <span className="text-[11px] text-slate-400">Respostas offline com abrigos e rotas.</span>
                                            </button>
                                            <button onClick={() => setActiveTab("radar")} className="p-4 bg-cyan-500/10 hover:bg-cyan-500/20 border border-cyan-500/30 rounded-2xl text-left transition flex flex-col gap-2 group">
                                                <span className="text-xl">🛰️</span>
                                                <span className="font-mono text-xs font-bold text-cyan-300 group-hover:underline">Radar Meteorológico</span>
                                                <span className="text-[11px] text-slate-400">Acompanhe precipitações via satélite.</span>
                                            </button>
                                            <button onClick={() => setActiveTab("charts")} className="p-4 bg-cyan-500/10 hover:bg-cyan-500/20 border border-cyan-500/30 rounded-2xl text-left transition flex flex-col gap-2 group">
                                                <span className="text-xl">📈</span>
                                                <span className="font-mono text-xs font-bold text-cyan-300 group-hover:underline">Gráficos Horários</span>
                                                <span className="text-[11px] text-slate-400">Curvas de temperatura e umidade.</span>
                                            </button>
                                        </div>

                                        <div className="w-full pt-4 border-t border-slate-800 flex justify-between items-center text-xs font-mono text-slate-400">
                                            <span>Base: Mesquita - RJ (Rocha Sobrinho)</span>
                                            <span className="text-cyan-400 font-bold">IndexedDB + GPT OSS 120B</span>
                                        </div>
                                    </div>
                                </div>
                            )}

                            {activeTab === "chat" && (
                                <div className="bg-slate-900/80 border border-cyan-500/30 rounded-xl shadow-xl flex flex-col overflow-hidden backdrop-blur-md flex-1" style={{ minHeight: "480px" }}>
                                    <div className="flex-1 overflow-y-auto p-4 space-y-4">
                                        {messages.length === 0 && (
                                            <div className="h-full flex flex-col items-center justify-center p-4 my-auto">
                                                <div className="w-full max-w-md bg-slate-900/90 border border-cyan-500/30 rounded-3xl p-6 shadow-2xl flex flex-col items-center text-center backdrop-blur-md">
                                                    <div className="relative mb-4">
                                                        <SarahAvatar showStatus={true} isLarge={true} riskLevel={currentRisk} />
                                                    </div>
                                                    <h2 className="font-mono text-lg font-bold text-slate-100 mb-2">SARAH IA • Base de Conhecimento Local</h2>
                                                    <div className="px-4 py-1.5 bg-cyan-950/60 border border-cyan-500/40 rounded-full text-cyan-300 font-mono text-xs mb-6">
                                                        Pronta para auxiliar com rotas de fuga e abrigos em Mesquita.
                                                    </div>
                                                    <div className="w-full space-y-2.5">
                                                        <button onClick={() => handleSendMessage("Quais são os abrigos em Mesquita?")} className="w-full py-2 px-4 bg-cyan-500/10 hover:bg-cyan-500/20 border border-cyan-500/30 text-cyan-300 rounded-xl text-xs font-mono transition text-left">
                                                            👉 "Quais são os abrigos em Mesquita?"
                                                        </button>
                                                        <button onClick={() => handleSendMessage("Quais as rotas de fuga em Rocha Sobrinho?")} className="w-full py-2 px-4 bg-cyan-500/10 hover:bg-cyan-500/20 border border-cyan-500/30 text-cyan-300 rounded-xl text-xs font-mono transition text-left">
                                                            👉 "Quais as rotas de fuga em Rocha Sobrinho?"
                                                        </button>
                                                    </div>
                                                </div>
                                            </div>
                                        )}

                                        {messages.map((m) => (
                                            <div key={m.id} className={`flex items-start gap-3 ${m.sender === "user" ? "flex-row-reverse" : "flex-row"}`}>
                                                {m.sender === "user" ? (
                                                    <div className="w-8 h-8 rounded-xl flex items-center justify-center shrink-0 shadow-md bg-slate-700 text-cyan-300">👤</div>
                                                ) : (
                                                    <SarahAvatar size="w-8 h-8" showStatus={false} riskLevel={currentRisk} />
                                                )}
                                                <div className={`p-3.5 rounded-2xl max-w-[85%] leading-relaxed shadow-md font-sans ${m.sender === "user" ? "bg-cyan-600 text-white rounded-tr-none" : "bg-slate-800/90 text-slate-100 border border-slate-700/60 rounded-tl-none"}`}>
                                                    <div className="flex items-center justify-between gap-4 mb-1 text-[10px] opacity-75 font-mono">
                                                        <span>{m.sender === "user" ? "Você" : "SARAH IA"}</span>
                                                        <span>{m.timestamp}</span>
                                                    </div>
                                                    <div className="whitespace-pre-wrap break-words">{m.text}</div>
                                                </div>
                                            </div>
                                        ))}

                                        {isLoadingChat && (
                                            <div className="flex items-center gap-3">
                                                <SarahAvatar size="w-8 h-8" showStatus={false} riskLevel={currentRisk} />
                                                <div className="bg-slate-800 p-3 rounded-2xl text-xs font-mono text-cyan-400 animate-pulse border border-cyan-500/30">
                                                    Processando telemetria neural & base local...
                                                </div>
                                            </div>
                                        )}
                                    </div>

                                    <div className="p-3 bg-slate-950/95 border-t border-slate-800 flex flex-col gap-2">
                                        <div className="flex items-center justify-between px-2 text-[10px] text-cyan-400 font-mono">
                                            <span className="flex items-center gap-1.5 bg-cyan-950/80 px-2 py-0.5 rounded-full border border-cyan-500/30">
                                                <span className={`w-1.5 h-1.5 rounded-full ${isOnline ? 'bg-emerald-400' : 'bg-rose-500'} animate-pulse`}></span>
                                                {isOnline ? 'Sinal Conectado • Nuvem Ativa' : 'Modo Offline • Fila IndexedDB Ativa'}
                                            </span>
                                            {!isOnline && (
                                                <button onClick={() => salvarOcorrenciaOfflineNoBanco(input || "Relato offline rápido")} className="text-amber-400 hover:underline">
                                                    Salvar na Fila Local
                                                </button>
                                            )}
                                        </div>

                                        <div className="w-full bg-slate-950 border border-cyan-500/30 rounded-3xl p-3 shadow-2xl backdrop-blur-md flex flex-col gap-2 font-mono">
                                            <div className="flex items-center gap-3 bg-slate-900/90 border border-slate-800 rounded-2xl p-2 relative">
                                                <button
                                                    onClick={toggleListening}
                                                    className={`w-11 h-11 rounded-full flex items-center justify-center shrink-0 transition shadow-lg ${isListening ? "bg-cyan-500 text-slate-950 border-2 border-cyan-300 animate-pulse shadow-[0_0_20px_rgba(6,182,212,0.6)]" : "bg-slate-950 hover:bg-slate-800 text-cyan-400 border border-cyan-500/30"}`}
                                                    title="Modo Voz"
                                                >
                                                    🎤
                                                </button>

                                                <input
                                                    type="text"
                                                    value={input}
                                                    onChange={(e) => setInput(e.target.value)}
                                                    onKeyDown={(e) => { if (e.key === "Enter") handleSendMessage(); }}
                                                    placeholder="Digite sua dúvida sobre rotas, abrigos ou clima..."
                                                    className="w-full bg-transparent text-slate-100 text-sm font-sans focus:outline-none placeholder-slate-500 px-1"
                                                />

                                                <button
                                                    onClick={() => handleSendMessage()}
                                                    disabled={isLoadingChat || !input.trim()}
                                                    className="w-10 h-10 rounded-full bg-cyan-500 hover:bg-cyan-400 text-slate-950 flex items-center justify-center transition shadow-lg shrink-0 disabled:opacity-40"
                                                    title="Enviar"
                                                >
                                                    <svg className="w-4 h-4 translate-x-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2.5" d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z"></path></svg>
                                                </button>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            )}

                            {activeTab === "radar" && (
                                <div className="bg-slate-900 border border-cyan-500/40 w-full rounded-2xl shadow-2xl overflow-hidden flex flex-col flex-1">
                                    <div className="bg-slate-950 px-4 py-3 border-b border-slate-800 flex justify-between items-center">
                                        <h3 className="font-mono text-cyan-400 text-sm font-bold">🛰️ Radar Meteorológico • Mesquita RJ</h3>
                                        <button onClick={() => setActiveTab("dashboard")} className="text-slate-400 hover:text-white font-mono text-xs px-3 py-1 rounded bg-slate-800">✕ Voltar</button>
                                    </div>
                                    <div className="p-4 bg-slate-900 flex-1 flex flex-col">
                                        <div ref={mapRef} className="w-full h-96 rounded-xl border border-cyan-500/30 flex-1 min-h-[350px]"></div>
                                    </div>
                                </div>
                            )}

                            {activeTab === "charts" && (
                                <div className="bg-slate-900 border border-cyan-500/40 w-full rounded-2xl shadow-2xl overflow-hidden flex flex-col flex-1">
                                    <div className="bg-slate-950 px-4 py-3 border-b border-slate-800 flex justify-between items-center">
                                        <h3 className="font-mono text-cyan-400 text-sm font-bold">📈 Gráfico Horário de Temperatura</h3>
                                        <button onClick={() => setActiveTab("dashboard")} className="text-slate-400 hover:text-white font-mono text-xs px-3 py-1 rounded bg-slate-800">✕ Voltar</button>
                                    </div>
                                    <div className="p-4 bg-slate-900 flex-1 flex flex-col">
                                        <div className="w-full h-80 flex-1 min-h-[300px]">
                                            <canvas ref={chartRef}></canvas>
                                        </div>
                                    </div>
                                </div>
                            )}
                        </main>
                    </div>

                    <footer className="bg-slate-950 border-t border-slate-900 py-3 overflow-hidden">
                        <div className="whitespace-nowrap flex items-center text-xs font-mono text-cyan-400 animate-marquee space-x-12 px-4">
                            <span>🛡️ Plano de Ação Redução de Riscos Defesa Civil Comunitária</span>
                            <span>•</span>
                            <span>🚨 ZAP Alertas: (21) 97299-3223</span>
                            <span>•</span>
                            <span>📞 Ocorrências: (21) 4042-1772</span>
                            <span>•</span>
                            <span>🏢 CRAS Rocha Sobrinho: (21) 2042-8931</span>
                        </div>
                        <div className="text-center text-xs font-mono text-slate-400 mt-3 bg-slate-900/90 py-2 border-t border-slate-800 shadow-inner">
                            Todos os direitos reservados 2024–2026 Grupo a Chave da Esperança • Sebinho Mesquita RJ
                        </div>
                    </footer>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById("root"));
        root.render(<App />);
    </script>

    <!-- Bloco de Ativação do Service Worker - SARAH IA Core v5.1 -->
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js')
                    .then((reg) => console.log('Service Worker v5.1 registrado com sucesso:', reg.scope))
                    .catch((err) => console.warn('Falha ao registrar o Service Worker:', err));
            });
        }
    </script>
</body>
</html>
