<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="cyanGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#0891b2"/>
    </linearGradient>
  </defs>
  
  <!-- Fundo Arredondado Padrão PWA -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  
  <!-- Borda Tech Externa -->
  <rect x="24" y="24" width="464" height="464" rx="92" fill="none" stroke="#06b6d4" stroke-width="4" stroke-opacity="0.4"/>
  
  <!-- Escudo de Proteção Defesa Civil -->
  <path d="M256 80 L392 130 V250 C392 340 315 410 256 440 C197 410 120 340 120 250 V130 Z" fill="rgba(8, 145, 178, 0.15)" stroke="url(#cyanGlow)" stroke-width="12" stroke-linejoin="round"/>
  
