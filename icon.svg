  <path d="M160 340 Q200 310 256 340 T352 340" fill="none" stroke="#06b6d4" stroke-width="6" stroke-linecap="round" stroke-opacity="0.7"/>

  <!-- Radar / Cruzamento Tecnológico Central -->
  <circle cx="256" cy="210" r="45" fill="none" stroke="#22d3ee" stroke-width="4" stroke-dasharray="8 6"/>
  <circle cx="256" cy="210" r="16" fill="#22d3ee"/>
  <path d="M256 140 V170 M256 250 V280 M186 210 H216 M296 210 H326" stroke="#22d3ee" stroke-width="6" stroke-linecap="round"/>
