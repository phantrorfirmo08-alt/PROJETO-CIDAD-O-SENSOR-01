<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#07111e"/>
      <stop offset="70%" stop-color="#02060c"/>
      <stop offset="100%" stop-color="#000205"/>
    </radialGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Fundo do Escudo -->
  <rect width="512" height="512" rx="90" fill="url(#bg)"/>
  <path d="M 256 60 L 410 115 L 410 295 C 410 380 340 435 256 460 C 172 435 102 380 102 295 L 102 115 Z" fill="#020813" stroke="#00f2ff" stroke-width="10" filter="url(#neonGlow)"/>
  
  <!-- Ondas de Radar / Anéis Internos -->
  <path d="M 185 170 A 90 90 0 0 1 327 170" fill="none" stroke="#00f2ff" stroke-width="3.5" opacity="0.8"/>
  <path d="M 205 190 A 65 65 0 0 1 307 190" fill="none" stroke="#00f2ff" stroke-width="3" opacity="0.6"/>
  <path d="M 225 210 A 40 40 0 0 1 287 210" fill="none" stroke="#00f2ff" stroke-width="2.5" opacity="0.4"/>

  <!-- Rede Neural / Conexões do Escudo -->
  <line x1="256" y1="210" x2="195" y2="280" stroke="#00f2ff" stroke-width="3.5"/>
  <line x1="256" y1="210" x2="317" y2="280" stroke="#00f2ff" stroke-width="3.5"/>
  <line x1="195" y1="280" x2="195" y2="350" stroke="#00f2ff" stroke-width="3.5"/>
  <line x1="317" y1="280" x2="317" y2="350" stroke="#00f2ff" stroke-width="3.5"/>
  <line x1="195" y1="350" x2="256" y2="270" stroke="#00f2ff" stroke-width="3.5"/>
  <line x1="317" y1="350" x2="256" y2="270" stroke="#00f2ff" stroke-width="3.5"/>
  <line x1="195" y1="280" x2="256" y2="270" stroke="#00f2ff" stroke-width="2.5" opacity="0.7"/>
  <line x1="317" y1="280" x2="256" y2="270" stroke="#00f2ff" stroke-width="2.5" opacity="0.7"/>

  <!-- Nós e Ponto de Alerta Central -->
  <circle cx="256" cy="210" r="6" fill="#ffffff" filter="url(#neonGlow)"/>
  <circle cx="195" cy="280" r="5" fill="#ffffff"/>
  <circle cx="317" cy="280" r="5" fill="#ffffff"/>
  <circle cx="195" cy="350" r="6" fill="#ffffff"/>
  <circle cx="317" cy="350" r="6" fill="#ffffff"/>
  <circle cx="256" cy="270" r="9" fill="#ff3333" stroke="#ffffff" stroke-width="2.5" filter="url(#neonGlow)"/>
</svg>
