<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#064e3b" />
      <stop offset="100%" stop-color="#022c22" />
    </radialGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Fundo do ícone com bordas arredondadas -->
  <rect width="512" height="512" rx="96" fill="url(#bgGrad)" />
  
  <!-- Anel de Monitoramento -->
  <circle cx="256" cy="195" r="135" fill="none" stroke="#10b981" stroke-width="6" />
  <circle cx="256" cy="195" r="147" fill="none" stroke="#34d399" stroke-width="2" opacity="0.3" />

  <!-- Símbolo do Raio Central -->
  <polygon points="260,80 178,210 238,210 222,310 322,175 264,175" fill="#34d399" filter="url(#glow)" />

  <!-- Texto Principal: CIDADÃO SENSOR -->
  <text x="256" y="385" font-family="system-ui, -apple-system, sans-serif" font-size="32" font-weight="bold" fill="#34d399" text-anchor="middle" letter-spacing="2" filter="url(#glow)">CIDADÃO SENSOR</text>

  <!-- Texto Secundário: Group System IA -->
  <text x="256" y="425" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="500" fill="#6ee7b7" text-anchor="middle" letter-spacing="1">Group System IA</text>
</svg>
