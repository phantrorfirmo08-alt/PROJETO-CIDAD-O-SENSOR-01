<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
<defs>
<!-- Fundo Abissal / Espacial -->
<radialGradient id="bgSpace" cx="50%" cy="50%" r="50%">
<stop offset="0%" stop-color="#120524"/>
<stop offset="100%" stop-color="#020108"/>
</radialGradient>
​<!-- Gradiente Neon Magenta / Roxo -->
<linearGradient id="neonMagenta" x1="0%" y1="0%" x2="100%" y2="100%">
<stop offset="0%" stop-color="#FF00FF"/>
<stop offset="100%" stop-color="#8A00FF"/>
</linearGradient>
​<!-- Gradiente Ciano / Azul -->
<linearGradient id="neonCyan" x1="0%" y1="0%" x2="100%" y2="100%">
<stop offset="0%" stop-color="#00FFFF"/>
<stop offset="100%" stop-color="#0088FF"/>
</linearGradient>
​<!-- Textura Metálica do Escudo -->
<linearGradient id="metalShield" x1="0%" y1="0%" x2="100%" y2="100%">
<stop offset="0%" stop-color="#2C3B5E"/>
<stop offset="50%" stop-color="#141B2D"/>
<stop offset="100%" stop-color="#0A0E17"/>
</linearGradient>
​<!-- Filtro de Brilho Neon (Glow) -->
<filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
<feGaussianBlur stdDeviation="10" result="blur" />
<feComposite in="SourceGraphic" in2="blur" operator="over" />
</filter>
</defs>
​<!-- Base PWA com Cantos Arredondados -->
<rect width="512" height="512" rx="110" fill="url(#bgSpace)"/>
​<!-- Partículas de Energia no Fundo -->
<g fill="#FF00FF" opacity="0.6">
<circle cx="120" cy="100" r="2.5" />
<circle cx="390" cy="140" r="2" />
<circle cx="100" cy="380" r="2" />
<circle cx="410" cy="360" r="3" />
<circle cx="256" cy="470" r="2" />
</g>
​<!-- Aura Neon Externa do Escudo -->
<path d="M256,48 L420,105 V240 C420,350 340,435 256,470 C172,435 92,350 92,240 V105 L256,48 Z" 
fill="none" stroke="url(#neonMagenta)" stroke-width="12" stroke-linejoin="round" opacity="0.75" filter="url(#glow)"/>
​<!-- Estrutura Principal do Escudo Metálico -->
<path d="M256,54 L412,108 V236 C412,342 336,424 256,458 C176,424 100,342 100,236 V108 L256,54 Z" 
fill="url(#metalShield)" stroke="url(#neonMagenta)" stroke-width="6" stroke-linejoin="round"/>
​<!-- Moldura Interna de Segurança -->
<path d="M256,74 L392,122 V232 C392,328 322,404 256,434 C190,404 120,328 120,232 V122 L256,74 Z" 
fill="#050814" stroke="#1F2942" stroke-width="3" stroke-linejoin="round"/>
​<!-- Circuitos Tecnológicos Internos (Simétricos e Precisos) -->
<g fill="none" stroke-linecap="round" stroke-linejoin="round">
<!-- Eixo Superior -->
<path d="M256,105 V175" stroke="url(#neonCyan)" stroke-width="5" filter="url(#glow)"/>
<polygon points="256,120 270,140 256,160 242,140" fill="url(#neonCyan)" filter="url(#glow)"/>
​<!-- Asas de LED Superiores -->
<path d="M190,170 H235 L256,195 L277,170 H322" stroke="url(#neonCyan)" stroke-width="4"/>
<path d="M175,200 L210,215 V250" stroke="url(#neonMagenta)" stroke-width="4"/>
<path d="M337,200 L302,215 V250" stroke="url(#neonMagenta)" stroke-width="4"/>
​<!-- Eixo Central / Núcleo -->
<path d="M256,200 V320" stroke="url(#neonCyan)" stroke-width="5" filter="url(#glow)"/>
<polygon points="256,260 270,275 256,290 242,275" fill="url(#neonCyan)" filter="url(#glow)"/>
​<!-- Estruturas Geométricas Inferiores -->
<path d="M190,290 H220 L256,330 L292,290 H322" stroke="url(#neonMagenta)" stroke-width="4" filter="url(#glow)"/>
<path d="M210,350 L256,390 L302,350" stroke="url(#neonCyan)" stroke-width="4"/>
</g>
​<!-- Rebites Metálicos de Fixação nas Bordas -->
<g fill="#8FA3C7" stroke="#0A0E17" stroke-width="1.5">
<circle cx="256" cy="54" r="4.5"/>
<circle cx="160" cy="78" r="4.5"/>
<circle cx="352" cy="78" r="4.5"/>
<circle cx="100" cy="108" r="4.5"/>
<circle cx="412" cy="108" r="4.5"/>
<circle cx="100" cy="236" r="4.5"/>
<circle cx="412" cy="236" r="4.5"/>
<circle cx="140" cy="370" r="4.5"/>
<circle cx="372" cy="370" r="4.5"/>
<circle cx="256" cy="458" r="4.5"/>
</g>
</svg>
