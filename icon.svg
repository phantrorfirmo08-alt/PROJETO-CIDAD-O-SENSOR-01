<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
  </defs>
  
  <!-- Fundo Estilo App Moderno -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  
  <!-- Linhas de Automação e Radar Tecnológico -->
  <path d="M100 256 H180 M332 256 H412 M256 100 V180 M256 332 V412" stroke="#06b6d4" stroke-width="4" stroke-opacity="0.3" stroke-dasharray="8 6"/>
  <circle cx="256" cy="256" r="170" fill="none" stroke="#22d3ee" stroke-width="2" stroke-opacity="0.25"/>
  
  <!-- Escudo da Defesa Civil Comunitária -->
  <path d="M256 90 L390 140 V250 C390 345 315 415 256 445 C197 415 122 345 122 250 V140 Z" fill="#090d16" stroke="url(#shieldGrad)" stroke-width="14" stroke-linejoin="round"/>
  
  <!-- Elemento de Automação Central (Radar / Conexão) -->
  <circle cx="256" cy="200" r="35" fill="none" stroke="#38bdf8" stroke-width="6" stroke-dasharray="10 6"/>
  <circle cx="256" cy="200" r="12" fill="#22d3ee"/>
  
  <!-- Ondas do Rio Sarapuí -->
  <path d="M170 310 Q213 280 256 310 T342 310" fill="none" stroke="#38bdf8" stroke-width="8" stroke-linecap="round"/>
  <path d="M170 350 Q213 320 256 350 T342 350" fill="none" stroke="#06b6d4" stroke-width="6" stroke-linecap="round" stroke-opacity="0.8"/>
